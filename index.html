<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stundenplan-Dashboard 2026/27</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1c2433;--mut:#5d6b82;--line:#dce2ee;--pri:#2457c5;--priink:#fff;--g:#14894c;--gbg:#e0f4e9;--y:#9a6a00;--ybg:#fff1cc;--r:#c9302c;--rbg:#fde4e3;--free:#eceff5;--a:#2457c5;--b:#8a3fc0}
@media(prefers-color-scheme:dark){:root{--bg:#0f131b;--card:#192030;--ink:#e8ecf5;--mut:#9aa7bf;--line:#2b3548;--pri:#6c97f0;--priink:#0b1020;--g:#4cd08a;--gbg:#113423;--y:#f0b93a;--ybg:#3a2f0e;--r:#ff7b78;--rbg:#451a1b;--free:#222a3a;--a:#7da5ff;--b:#c99aff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
h1{font-size:20px;margin:0}
.hinfo{color:var(--mut);font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0;max-width:1300px;margin:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px 8px 0 0;cursor:pointer;font:inherit}
nav button.on{background:var(--pri);color:var(--priink);border-color:var(--pri)}
main{max-width:1300px;margin:auto;padding:12px 16px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 8px}.card h3{font-size:15px;margin:12px 0 6px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar .wk{font-weight:600;flex:1;min-width:200px;text-align:center}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
button:hover,.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);color:var(--priink);border-color:var(--pri)}
.btn.sm{padding:3px 8px;font-size:12.5px}.btn.ghost{background:transparent}
.btn.danger{color:var(--r)}
.lnk{border:0;background:none;color:var(--pri);padding:0;font-size:12px;text-decoration:underline;display:block;margin:3px auto 0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:7px;padding:5px 8px;max-width:100%}
textarea{width:100%;min-height:60px}
label{font-size:13px;color:var(--mut);display:block;margin-bottom:2px}
.abbadge{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-weight:700;margin-right:6px}
.ab-A{background:var(--a)}.ab-B{background:var(--b)}
table{border-collapse:collapse;width:100%}
.wt th,.wt td{border:1px solid var(--line);vertical-align:top;padding:6px}
.wt th{background:var(--free);text-align:center;font-size:14px}
.wt th.today{outline:2px solid var(--pri);outline-offset:-2px}
.wt th.free{background:repeating-linear-gradient(45deg,var(--free),var(--free) 8px,var(--card) 8px,var(--card) 16px)}
.wt th .tag{font-weight:400;font-size:12px;color:var(--mut)}
.wt td.p{width:64px;text-align:center;font-size:12px;color:var(--mut);background:var(--free)}
.les{border:1px solid var(--line);border-left:5px solid var(--pri);border-radius:8px;padding:6px 8px;background:var(--card);font-size:13.5px}
.les-h{display:flex;gap:6px;align-items:center;font-weight:600}.les-h .fa{color:var(--mut);font-weight:400}
.dot{width:12px;height:12px;border-radius:50%;margin-left:auto}
.amp-gruen{background:var(--g)}.amp-gelb{background:#e0a400}.amp-rot{background:var(--r)}
.les.st-ferien,.les.st-feiertag,.les.st-frei{border-left-color:#9aa4b8;background:var(--free);color:var(--mut)}
.les.st-fehlt{border-left-color:#e0a400;background:var(--ybg)}
.les.st-klausur{border-left-color:var(--b)}
.les.st-puffer{border-left-color:var(--g)}
.topic{font-weight:600;margin-top:3px}.sub{color:var(--mut);font-size:12.5px}
.acts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.badge{display:inline-block;padding:3px 11px;border-radius:99px;font-weight:700;font-size:13px}
.badge.gruen{background:var(--gbg);color:var(--g)}.badge.gelb{background:var(--ybg);color:var(--y)}.badge.rot{background:var(--r);color:#fff;box-shadow:0 0 0 3px var(--rbg);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--rbg)}}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:12.5px;color:var(--mut)}
.scroll{overflow-x:auto}
.cell{border:1px solid var(--line);border-radius:8px;padding:5px;display:grid;gap:4px;background:var(--card);min-width:110px}
.cell select{width:100%;padding:3px 4px;font-size:13px}
.sub-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sub-nav button.on{background:var(--pri);color:var(--priink);border-color:var(--pri)}
.warn{background:var(--ybg);border:1px solid #e0a400;border-radius:8px;padding:8px 10px;font-size:13.5px;margin-bottom:10px}
.mod{display:grid;grid-template-columns:auto 60px 1fr 70px 1.2fr auto;gap:6px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.mod .full{grid-column:2/-1}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end;margin-bottom:8px}
.pill{font-size:12px;padding:1px 8px;border-radius:99px;background:var(--free);color:var(--mut)}
.pill.fehlt{background:var(--ybg);color:var(--y)}.pill.klausur{background:#ece0f8;color:#6a2fa5}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal.on{display:flex}
#modal .box{background:var(--card);border-radius:14px;padding:16px;max-width:680px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1c2433;color:#fff;padding:9px 16px;border-radius:99px;display:none;z-index:30}
#toast.err{background:var(--r)}
footer{max-width:1300px;margin:auto;padding:0 16px 40px}
footer .card{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.small{font-size:12.5px;color:var(--mut)}
@media(max-width:900px){
 .wt thead{display:none}.wt,.wt tbody,.wt tr,.wt td{display:block;width:100%}
 .wt td{border:0;padding:3px 0}.wt td.p{background:none;text-align:left;font-weight:600;margin-top:10px}
 .wt td.empty{display:none}.wt td[data-label]::before{content:attr(data-label);display:block;font-size:12px;color:var(--mut)}
 .mod{grid-template-columns:auto 1fr}.mod .full{grid-column:1/-1}
}
.mnr{display:inline-block;background:var(--pri);color:var(--priink);border-radius:6px;padding:0 6px;font-size:12px;font-weight:700;white-space:nowrap}
.mnr.x{background:var(--free);color:var(--mut)}
.tg{color:var(--mut);font-weight:600;font-size:12.5px}
.les.lk{border-left-color:var(--b)}
details.part{border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:6px 0;background:var(--card)}
details.part>summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:3px 0}
details.part .pbtn{margin-left:auto;display:inline-flex;gap:4px}
.mrow{display:grid;grid-template-columns:auto 56px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--line)}
.mrow input[type=text]{width:100%}
.matbox{border-top:1px solid var(--line);padding:10px 0}
.lrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:5px;align-items:center}
@media(max-width:900px){.mrow{grid-template-columns:auto auto 1fr}.mrow>span:last-child{grid-column:1/-1}}

/* ===== Klausurvorbereitung, Fortschritt, Sprache ===== */
.kv-box{margin-top:6px}
.kv-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;text-align:center;text-decoration:none;font-weight:800;font-size:13.5px;line-height:1.25;padding:8px 6px;border-radius:10px;color:#fff!important;background:#d9480f;border:2px solid #ffb703;animation:kvblink 1.1s ease-in-out infinite}
.kv-btn small{font-weight:600;font-size:11.5px;opacity:.95}
@keyframes kvblink{0%,100%{background:#d9480f;box-shadow:0 0 0 0 rgba(255,183,3,0)}50%{background:#f08c00;box-shadow:0 0 0 6px rgba(255,183,3,.45)}}
.kv-prog{height:8px;border-radius:99px;background:var(--free);overflow:hidden;margin-top:5px;position:relative}
.kv-prog i{position:absolute;inset-block:0;inset-inline-start:0;display:block;background:var(--g);transition:width .4s}
.kv-prog i.att{background:#ffd966}
.kv-ptxt{font-size:11.5px;color:var(--mut);margin-top:2px}
.kv-banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;background:var(--ybg);border:2px solid #e0a400;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.kv-banner .kv-btn{width:auto;flex-direction:row;padding:8px 14px}
.langfab{position:fixed;inset-block-end:16px;inset-inline-end:16px;z-index:25}
.langfab>button{border-radius:99px;box-shadow:0 3px 14px #0005;background:var(--pri);color:var(--priink);border-color:var(--pri);min-height:50px;padding:8px 16px;font-weight:700}
.langfab .menu{position:absolute;inset-block-end:58px;inset-inline-end:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 6px 24px #0005;display:none;min-width:180px}
.langfab .menu.on{display:block}
.langfab .menu button{width:100%;justify-content:flex-start;margin:2px 0;min-height:44px}
.langfab .menu button.on{background:var(--pri);color:var(--priink)}
.kvlist label{display:flex;gap:8px;align-items:flex-start;color:var(--ink);font-size:13.5px;padding:3px 0;border-top:1px solid var(--line)}
@media(prefers-reduced-motion:reduce){.kv-btn{animation:none}}
/* ===== Exkursion, Einzelstunden, Hover-Übersetzung ===== */
.les.st-exkursion{border-left-color:#0f9d8a;background:rgba(15,157,138,.08)}
.pill.exkursion{background:#d8f3ee;color:#0b6e61}
.seg+.seg{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line)}
.min{display:inline-block;font-size:11px;font-weight:700;background:var(--free);color:var(--mut);border-radius:6px;padding:0 6px}
.tr{border-bottom:1px dotted var(--mut);cursor:help}
.tr:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:3px}
#trtip{position:fixed;z-index:60;display:none;max-width:min(92vw,440px);background:#1c2433;color:#fff;border-radius:10px;padding:8px 10px;font-size:13.5px;line-height:1.4;box-shadow:0 6px 24px #0007;pointer-events:none}
#trtip .trl+.trl{margin-top:5px;padding-top:5px;border-top:1px solid #ffffff30}
#trtip .fl{margin-inline-end:3px}
.trbox{margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--free);font-size:13.5px}
.trbox .trl+.trl{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
</style>
</head>

  for(let m=first;m<=last;m=addDays(m,7)){const diff=Math.round((parse(m)-parse(ref))/6048e5);AB[m]=((diff%2)+2)%2===0?'A':'B';}
  return;
 }
 AB[ref]='A';
 let lab='A';
 for(let m=addDays(ref,7);m<=last;m=addDays(m,7)){if(weekFree(m))AB[m]=lab==='A'?'B':'A';else{lab=lab==='A'?'B':'A';AB[m]=lab;}}
 lab='A';
 for(let m=addDays(ref,-7);m>=first;m=addDays(m,-7)){if(weekFree(m))AB[m]=lab==='A'?'B':'A';else{lab=lab==='A'?'B':'A';AB[m]=lab;}}
}

/* ================= STOFFKETTEN-BERECHNUNG (Rutsch-Effekt) ================= */
/* alle Unterrichtsstunden (je 45 Min.) einer Kette in Unterrichtsreihenfolge (nur aktive Teile und Module);
   eine Doppelstunde (DS) = 2 Stunden, ein Modul darf auch halbe DS umfassen (z. B. 0,5 DS = 1 Stunde) */
function chainItems(ch){
 const all=[];
 ch.parts.forEach(pt=>{
  if(!pt.on)return;const cat=CAT[pt.pid];if(!cat)return;
  const list=cat.items.map(it=>({it,m:pt.mods[it.id]||{on:true,ds:it.ds}}));
  (pt.extra||[]).forEach(e=>list.push({it:{id:e.id,lab:'',long:'',name:e.name,x:1,th:[],ds:e.ds,dg:[],extra:1},m:{on:e.on!==false,ds:e.ds}}));
  list.forEach(x=>{if(!x.m.on)return;const H=hrs(x.m.ds),T=Math.ceil(H/2);for(let h=1;h<=H;h++)all.push({key:pt.pid+'.'+x.it.id,part:cat,item:x.it,h,H,dsNo:Math.ceil(h/2),total:T});});
 });
 return all;
}
function itemList(ch){
 const seen=new Map();
 chainItems(ch).forEach(u=>{if(!seen.has(u.key))seen.set(u.key,{key:u.key,part:u.part,item:u.item,total:u.total,ds:u.H/2});});
 return [...seen.values()];
}
const posIn=(all,key,ds)=>{const els=all.filter(u=>u.key===key);if(!els.length)return -1;const d=Math.min(Math.max(1,parseInt(ds)||1),els[0].total);return all.findIndex(u=>u.key===key&&u.dsNo===d);};
function startIndex(ch,all){if(!ch.startKey)return 0;const i=posIn(all,ch.startKey,ch.startDs);return i<0?0:i;}
const slotsOn=(klasse,date,fach)=>Object.entries(state.slots).map(([k,v])=>{const q=k.split('|');return {w:q[0],d:+q[1],p:+q[2],klasse:v.klasse,fach:v.fach};}).filter(x=>x.klasse===klasse&&x.w===abOf(date)&&x.d===wd(date)&&(!fach||x.fach===fach)).sort((a,b)=>a.p-b.p);
function compute(){
 buildAB();
 C={chains:{},byDate:{},occById:{}};
 const S=state.settings,today=S.stichtag||todayStr();
 const slots=Object.entries(state.slots).map(([k,v])=>{const p=k.split('|');return {w:p[0],d:+p[1],p:+p[2],klasse:v.klasse,fach:v.fach};}).filter(s=>s.klasse&&s.fach);
 const keys=[...new Set(slots.map(s=>s.klasse+'|'+s.fach))];
 keys.forEach(key=>{
  const ch=state.chains[key];if(!ch)return;
  const sp=key.split('|'),klasse=sp[0],fach=sp[1];
  const all=chainItems(ch),si=startIndex(ch,all),units=all.slice(si);
  const mine=slots.filter(s=>s.klasse===klasse&&s.fach===fach);
  const from=ch.start&&ch.start>S.planStart?ch.start:S.planStart;
  const kend=(S.klassenEnde||{})[klasse]||'',stop=kend&&kend<PLAN_END?kend:PLAN_END;
  const jumps=(ch.jumps||[]).slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.p||0)-(b.p||0));
  const occ=[];let u=si,ji=0;
  for(let d=from;d<=stop;d=addDays(d,1)){
   const w=wd(d);if(w>4)continue;
   const todays=mine.filter(s=>s.w===abOf(d)&&s.d===w).sort((a,b)=>a.p-b.p);
   if(!todays.length)continue;
   const info=dayInfo(d);
   const absent=state.absences.some(a=>d>=a.from&&d<=(a.to||a.from));
   todays.forEach((s,idx)=>{
    while(ji<jumps.length&&(jumps[ji].date<d||(jumps[ji].date===d&&(jumps[ji].p||0)<=s.p))){const t=posIn(all,jumps[ji].key,jumps[ji].ds);if(t>=0)u=t;ji++;}
    const o={id:key+'@'+d+'@'+s.p,date:d,period:s.p,klasse,fach,key,segs:[],hours:0};
    const exk=state.exkursionen.find(x=>x.date===d&&x.klasse===klasse&&(x.ps||[]).includes(s.p));
    const exam=state.exams.find(e=>e.date===d&&e.klasse===klasse&&e.fach===fach&&(Number.isInteger(e.p)?e.p===s.p:idx===0));
    const ins=state.inserts.find(x=>x.date===d&&x.klasse===klasse&&x.fach===fach&&x.p===s.p);
    if(info){o.status=info.type;o.label=info.name;}
    else if(absent)o.status='fehlt';
    else if(exk){o.status='exkursion';o.ex=exk;if(exk.zaehlt){const n=Math.min(2,Math.max(0,all.length-u));u+=n;o.hours=n;}}
    else if(exam){ /* nur diese eine Doppelstunde; ein geplantes Klausur-Modul der Kette wird dadurch ersetzt */
     o.status='klausur';o.exam=exam;
     if(u<all.length&&all[u].item.k){const kk=all[u].key;let n=0;while(n<2&&u<all.length&&all[u].key===kk){u++;n++;}o.hours=n;}
    }else{
     let left=2;
     if(ins){const n=ins.std===1?1:2;o.segs.push({ins,n});left-=n;}
     while(left>0&&u<all.length){const el=all[u],kk=el.key;let n=0;while(left>0&&u<all.length&&all[u].key===kk){u++;left--;n++;}o.segs.push({unit:el,n});o.hours+=n;}
     if(o.segs.length){o.status='unterricht';o.unit=(o.segs.find(g=>g.unit)||{}).unit;}
     else o.status='puffer';
    }
    occ.push(o);C.occById[o.id]=o;(C.byDate[d]=C.byDate[d]||[]).push(o);
   });
  }
  const past=occ.filter(o=>o.date<today);
  const sollH=Math.min(units.length,past.filter(o=>o.status!=='ferien'&&o.status!=='frei').length*2);
  const istH=past.reduce((a,o)=>a+o.hours,0);
  const verzugStd=Math.max(0,sollH-istH),verzugDS=verzugStd/2;
  const amp=verzugStd===0?'gruen':verzugStd<=4?'gelb':'rot';
  const planned=occ.filter(o=>o.unit),nextOcc=occ.find(o=>o.unit&&o.date>=today);
  C.chains[key]={key,klasse,fach,units,all,occ,soll:sollH/2,ist:istH/2,verzugDS,verzugStd,amp,skipped:si,kend,
   current:nextOcc?nextOcc.unit:(all[u]||null),open:Math.ceil(Math.max(0,all.length-u)/2),
   end:planned.length?planned[planned.length-1].date:null};
 });
}
const chainsList=()=>Object.values(C.chains).sort((a,b)=>KLASSEN.findIndex(k=>k.id===a.klasse)-KLASSEN.findIndex(k=>k.id===b.klasse)||a.fach.localeCompare(b.fach));

function rawThema(u){
 const it=u.item;
 const src=it.th&&it.th.length?it.th:(it.d?it.d.split(';').map(x=>x.trim()).filter(Boolean):[]);
 if(!src.length)return it.name;

}

const isLeistung=u=>/^!/.test(rawThema(u))||!!u.item.k;
function segText(u,f){
 const it=u.item,p=u.part,t=thema(u);
 if(!it.lab){ /* Eintrag ohne Modulnummer: Klausur, Escape Room, Projekt … */
  if(isLeistung(u))return `Schriftliche Leistungsüberprüfung im Fach ${f} (${p.long}): ${t}.`;

  if(/Escape/i.test(it.name))return `${p.long}: ${t} – spielerische Wiederholung und Festigung der bisherigen Inhalte im digitalen Escape Room.`;
  return `${p.long}: ${t}.`;
 }
 const ref=unitRef(u),work=PWORK[p.id]||'anhand von Fallbeispielen aus der Praxis';
 const ab=` (Arbeitsblatt ${p.long}, ${it.long})`;
 if(isLeistung(u))return `Leistungsüberprüfung im Fach ${f}: ${t} (${ref}).`;

 if(u.total===1)return `${ref}: Erarbeitung und Sicherung ${thG} ${work}${ab}.`;
 if(u.dsNo===1)return `Einstieg in ${ref}: Aktivierung des Vorwissens und Klärung zentraler Fachbegriffe; Erarbeitung ${thG} ${work}${ab}.`;
 if(u.dsNo===u.total)return `Zusammenfassung und Sicherung von ${ref}: Wiederholung der zentralen Inhalte${schw}, Anwendung ${work} sowie Reflexion des eigenen Lernstands${ab}.`;

 if(v===0)return `${ref}: Detaillierte Erarbeitung ${thG} ${work} in Partnerarbeit; Sicherung und Besprechung der Ergebnisse im Plenum${ab}.`;
 if(v===1)return `${ref}: Vertiefung und Anwendung ${thG} ${work}; Präsentation und Auswertung der Arbeitsergebnisse${ab}.`;
 return `${ref}: Erarbeitung ${thG} anhand von Informationstexten, Beispielen und Übungsaufgaben; schriftliche Ergebnissicherung im Heft${ab}.`;
}

/* Klausurtermine, zu denen ein Trainer gehört: ausdrücklich eingetragene Klausuren + geplante Klausur-Module (z. B. LF 2 „Klausur 1“) */
function kvBuildEvents(){
 const ev=[],seen=new Set(),has=new Set();
 if(typeof C==='undefined'||!C||!C.chains)return ev;
 const add=(date,klasse,fach,pid,k)=>{const sig=date+'|'+klasse+'|'+fach;if(seen.has(sig))return;seen.add(sig);has.add(klasse+'|'+fach+'|'+pid+'|'+k);ev.push({date,klasse,fach,pid,k});};
 (state.exams||[]).forEach(e=>{
  if(e.lf==='none')return;
  let pid,k;
  if(/^LF\d+\.\d$/.test(e.lf||'')){const a=e.lf.split('.');pid=a[0];k=+a[1];}
  else{
   const ch=C.chains[e.klasse+'|'+e.fach];if(!ch)return;
   let last=null;(ch.occ||[]).forEach(o=>{if(o.date<e.date&&o.unit)last=o.unit;});
   if(!last)return;pid=last.part.id;const meta=KV_META[pid];if(!meta)return;
   const order=CAT[pid].items.map(x=>x.id),idx=order.indexOf(last.item.id);
   const ks=Object.keys(meta.klausurItems).sort((a,b)=>order.indexOf(a)-order.indexOf(b));
   const hit=ks.find(x=>idx<=order.indexOf(x));if(!hit)return;k=meta.klausurItems[hit];
  }
  const cfg=state.trainer&&state.trainer[pid];if(!cfg||!cfg.on)return;
  add(e.date,e.klasse,e.fach,pid,k);
 });
 Object.keys(C.chains).forEach(key=>{(C.chains[key].occ||[]).forEach(o=>{
  (o.segs||[]).forEach(g=>{
   if(!g.unit||g.unit.h!==1)return;
   const meta=KV_META[g.unit.part.id];if(!meta)return;
   const k=meta.klausurItems[g.unit.item.id];if(!k)return;
   const cfg=state.trainer&&state.trainer[g.unit.part.id];if(!cfg||!cfg.on)return;
   if(has.has(o.klasse+'|'+o.fach+'|'+g.unit.part.id+'|'+k))return;
   add(o.date,o.klasse,o.fach,g.unit.part.id,k);
  });
 });});
 return ev;
}
const kvVar=(pid,k)=>{const m=KV_META[pid];return (m&&m.alts||[]).find(a=>a.langs.includes(KV_LANG)&&a.ks.includes(+k))||null;};
function kvUrl(cfg,k,pid){
 const v=pid?kvVar(pid,k):null;if(v)return v.url+'?k='+k+'&lang='+KV_LANG;

 return (cfg.url||'')+'?k='+k+'&lang='+KV_LANG+(f.length&&f.length<Object.keys(cfg.fmt||{}).length?'&f='+f.join(','):'')+(off.length?'&x='+off.join(','):'');
}
function kvFor(o){
 let best=null;
 KV_EV.forEach(e=>{
  if(e.klasse!==o.klasse||e.fach!==o.fach)return;
  const cfg=state.trainer&&state.trainer[e.pid];if(!cfg||!cfg.on||!cfg.url)return;
  const d=kvDaysBetween(o.date,e.date);
  const hit=d===0||(cfg.exakt?d===cfg.days:(d>0&&d<=cfg.days));
  if(hit&&(!best||d<best.d))best={e,d,cfg};
 });
 return best;
}

/* Inhalte des Trainers (gleiche Datei wie im Trainer) – für die Verwaltung im Admin-Bereich */
const KV_CACHE={},KV_STATE={},KV_QUEUE=[];let KV_BUSY=false;
function kvData(pid){
 if(KV_CACHE[pid])return KV_CACHE[pid];
 if(!KV_STATE[pid]){KV_STATE[pid]=1;KV_QUEUE.push(pid);kvPump();}
 return null;
}
function kvPump(){
 if(KV_BUSY||!KV_QUEUE.length)return;KV_BUSY=true;const pid=KV_QUEUE.shift();window.KV_DATA=undefined;
 const sc=document.createElement('script');sc.src=KV_META[pid].daten;sc.charset='utf-8';
 sc.onload=()=>{KV_CACHE[pid]=window.KV_DATA;KV_STATE[pid]=window.KV_DATA?3:2;KV_BUSY=false;if(ui.tab==='admin')renderAll();kvPump();};
 sc.onerror=()=>{KV_STATE[pid]=2;KV_BUSY=false;if(ui.tab==='admin')renderAll();kvPump();};
 document.head.appendChild(sc);
}
const kvOth=o=>Object.keys(o).filter(k=>k!=='de').map(k=>esc(o[k])).join(' · ');

function segHtml(g,o,multi){
 const mins=multi?`<span class="min">${g.n*45} min</span> `:'';
 if(g.ins)return `<div class="seg">${mins}<div class="topic">${esc(g.ins.name)}</div>${STUDENT?'':`<div class="sub">eingeplant · ${g.n===1?'1 Stunde':'Doppelstunde'}</div>`}</div>`;
 const u=g.unit;
 return `<div class="seg">${mins}<div class="topic">${unitHead(u,o.klasse)}</div><div class="sub">${unitSub(u,o.klasse)}</div></div>`;
}
function lessonCard(o){
 const ch=C.chains[o.key];
 const head=`<div class="les-h"><span>${esc(o.klasse)}</span><span class="fa">${esc(o.fach)}</span>${STUDENT?'':`<span class="dot amp-${ch.amp}" title="${AMP[ch.amp]} (${ch.verzugStd} Std Verzug)"></span>`}</div>`;
 let body='',cls='';
 const ent=`<button class="btn sm ghost" data-act="entry" data-id="${esc(o.id)}" title="${STUDENT?'':'Eintrag ansehen und Stunde planen (Klausur, Exkursion, Einzelstunde)'}">${STUDENT?kt('eintrag'):'Eintrag / Planen'}</button>`;
 const cp=`<button class="btn sm" data-act="copy" data-id="${esc(o.id)}" title="Klassenbuch-Eintrag kopieren">${ICON_COPY} ${kt('kopieren')}</button>`;
 if(o.status==='unterricht'){
  const multi=o.segs.length>1;
  if(o.segs.some(g=>g.unit&&isLeistung(g.unit)))cls=' lk';
  body=o.segs.map(g=>segHtml(g,o,multi)).join('')+kvBox(o)+
  `<div class="acts">${o.segs.filter(g=>g.unit).map(g=>matButtons(g.unit,multi?2:3,o.id)).join('')}
  ${cp}${ent}</div>`;
 }else if(o.status==='klausur'){
  body=`<div class="topic">${kt('klausur')}</div><div class="sub">${kt('keinStoff')}</div>${kvBox(o)}<div class="acts">${cp}${ent}</div>`;
 }else if(o.status==='exkursion'){
  const x=o.ex;
  body=`<div class="topic">🚌 ${kt('exkursion')}: ${esc(x.ziel||'')}</div><div class="sub">${x.grund?kt('grund')+': '+esc(x.grund):''}</div><div class="acts">${cp}${ent}</div>`;
 }else if(o.status==='fehlt'){
  body=`<div class="topic">${STUDENT?kt('entfaellt'):'Lehrkraft abwesend'}</div><div class="sub">${kt('rutscht')}</div>`;
 }else if(o.status==='puffer'){
  body=`<div class="topic">${kt('puffer')}</div><div class="sub">${kt('wdh')}</div>${STUDENT?'':`<div class="acts">${ent}</div>`}`;
 }else{
  body=`<div class="topic">${kt('frei')}</div><div class="sub">${esc(o.label||kvStat(o.status))}</div>`;
 }
 return `<div class="les st-${o.status}${cls}">${head}${body}</div>`;
}

function renderWoche(){
 const m=ui.week,ab=abOf(m),days=[0,1,2,3,4].map(i=>addDays(m,i)),td=todayStr(),P=state.settings.periods.slice(0,4);
 let h='';
 if(!Object.keys(state.slots).length)h+=`<div class="warn">${STUDENT?'Es sind noch keine Stundenplandaten geladen.':'Noch kein Stundenplan eingetragen. Unter <b>Admin → Stundenplan-Raster</b> legst du fest, welche Klasse in welcher Woche (A/B), an welchem Tag und in welcher Doppelstunde unterrichtet wird. Prüfe außerdem unter <b>Admin → Einstellungen</b>, welche Woche eine A-Woche ist.'}</div>`;
 h+=kvBanner();
 h+=`<div class="bar"><button data-act="wprev">◀</button><div class="wk"><span class="abbadge ab-${ab}">${kvWoche(ab)}</span> KW ${isoWeek(m)} · ${deShort(m)} – ${de(addDays(m,4))}</div><button data-act="wnext">▶</button>
 <button data-act="wtoday">${kt('heute')}</button><button data-act="wnextA">${kt('nextA')}</button><button data-act="wnextB">${kt('nextB')}</button>
 <input type="date" data-ui="weekDate" value="${m}" aria-label="Woche wählen">${klasseSelect('data-ui="filterKlasse"',ui.filterKlasse,kt('alle'))}</div>`;
 h+=`<div class="card"><table class="wt"><thead><tr><th></th>${days.map((d,i)=>{
   const info=dayInfo(d),abs=state.absences.some(a=>d>=a.from&&d<=(a.to||a.from));
   return `<th class="${info?'free':''}${d===td?' today':''}">${kvDay(i)} ${deShort(d)}${info?`<div class="tag">${kt('frei')} · ${esc(info.name)}</div>`:''}${(!STUDENT&&!info)?`<button class="lnk" data-act="absday" data-d="${d}">${abs?'Fehltag aufheben':'Eigener Fehltag'}</button>`:''}</th>`;}).join('')}</tr></thead><tbody>`;
 P.forEach((pl,p)=>{
  h+=`<tr><td class="p">${esc(pl)}</td>`;
  days.forEach((d,i)=>{
   const o=(C.byDate[d]||[]).find(x=>x.period===p&&(!ui.filterKlasse||x.klasse===ui.filterKlasse));
   h+=o?`<td data-label="${kvDay(i)} ${deShort(d)}">${lessonCard(o)}</td>`:`<td class="empty"></td>`;
  });
  h+='</tr>';
 });
 h+='</tbody></table></div>';
 if(!STUDENT)h+=`<p class="small">Punkt rechts oben in der Stunde = Ampel des Fachs (grün: im Plan · gelb: bis 4 Std Verzug · rot: mehr als 4 Std Verzug). Klausur und Exkursion belegen nur die gewählte Doppelstunde, ein „Eigener Fehltag“ den ganzen Tag – alle folgenden Themen rutschen automatisch nach hinten. Über „Planen“ in der Stunde trägst du Klausur, Exkursion oder eine Einzelstunde ein.</p>`;
 return h;
}

function renderStatus(){
 const list=chainsList();
 if(!list.length)return `<div class="card">Noch keine Stunden im Raster eingetragen (Admin → Stundenplan-Raster).</div>`;
 let h=`<div class="card"><h2>Lehrplan-Ampel</h2><p class="small">Soll = Doppelstunden, die bis zum Stichtag (${de(state.settings.stichtag||todayStr())}, ohne diesen Tag) planmäßig stattfinden würden – Ferien und schulfreie Tage sind im Plan berücksichtigt, einzelne Feiertage, eigene Fehltage und Klausuren dagegen nicht. Ist = tatsächlich unterrichtete Doppelstunden mit neuem Stoff. Verzug über 4 Unterrichtsstunden (2 Doppelstunden) = <b>ROT</b>.</p>
 <div class="scroll"><table class="tbl"><thead><tr><th>Status</th><th>Klasse</th><th>Fach</th><th>Aktuelles / nächstes Thema</th><th>Ist / Soll (DS)</th><th>Verzug</th><th>Voraussichtlich fertig</th></tr></thead><tbody>`;
 list.forEach(c=>{
  const cur=c.current?`<b>${esc(unitTag(c.current))}</b>${c.current.item.lab?': '+esc(c.current.item.name):''} (DS ${c.current.dsNo}/${c.current.total})`:(c.units.length?'Stoffplan abgeschlossen':'Kein Modul aktiv');
  h+=`<tr><td><span class="badge ${c.amp}">${c.amp==='gruen'?'GRÜN':c.amp==='gelb'?'GELB':'ROT'}</span></td><td>${esc(c.klasse)}</td><td>${esc(c.fach)}</td><td>${cur}</td><td>${fmtDS(c.ist)} / ${fmtDS(c.soll)}</td><td>${c.verzugStd} Std</td>
  <td>${c.end?de(c.end):'–'}${c.open>0?`<br><span class="small" style="color:var(--r)">${c.open} DS passen nicht mehr bis ${c.kend?'zum Unterrichtsende ('+de(c.kend)+')':'ins Schuljahr'}</span>`:''}</td></tr>`;
 });
 return h+'</tbody></table></div></div>';
}

 <button class="btn pri" data-act="copyAll">${ICON_COPY} ${kt('alleKopieren')}</button></div>`;

 c.occ.forEach(o=>{
  const sl=STUDENT&&o.status==='fehlt'?kt('entfaellt'):o.status==='unterricht'&&STUDENT?kt('unterricht'):o.status==='klausur'&&STUDENT?kt('klausur'):kvStat(o.status);
  let inner='',acts='';
  const cp=`<button class="btn sm" data-act="copy" data-id="${esc(o.id)}">${ICON_COPY}</button><button class="btn sm ghost" data-act="entry" data-id="${esc(o.id)}">${kt('eintrag')}</button>`;
  if(o.status==='unterricht'){
   const hd=o.segs.map(g=>g.unit?`<b>${esc(unitTag(g.unit))}${g.unit.item.lab?': '+trSpan(g.unit.item.name,o.klasse):' – '+trSpan(g.unit.item.name,o.klasse)}</b>${g.unit.total>1?' · DS '+g.unit.dsNo+'/'+g.unit.total:''}${o.segs.length>1?' · '+g.n*45+' min':''}`:`<b>${esc(g.ins.name)}</b>${o.segs.length>1?' · '+g.n*45+' min':''}`).join(' + ');
   inner=`${hd}<br>${trEntryHtml(o,entryText(o))}`;
   acts=cp+o.segs.filter(g=>g.unit).map(g=>matButtons(g.unit)).join('');
  }else if(o.status==='klausur'){inner=kt('klausurKein')+kvBox(o)+`<br>${trEntryHtml(o,entryText(o))}`;acts=cp;}
  else if(o.status==='exkursion'){inner=`<b>🚌 ${kt('exkursion')}: ${esc(o.ex.ziel||'')}</b><br>${trEntryHtml(o,entryText(o))}`;acts=cp;}
  else if(o.status==='puffer')inner=kt('puffer')+' – '+kt('wdh');

 });

const bind=(path,extra)=>`data-bind="${esc(path)}" ${extra||''}`;
function listRows(arr,fn,act){
 if(!arr.length)return '<p class="small">Noch keine Einträge.</p>';
 return `<table class="tbl"><tbody>${arr.map(x=>`<tr><td>${fn(x)}</td><td style="text-align:right"><button class="btn sm danger" data-act="${act}" data-id="${esc(x.id)}">Löschen</button></td></tr>`).join('')}</tbody></table>`;
}
const studentLink=k=>location.origin+location.pathname+'?mode=schueler&klasse='+encodeURIComponent(k);
const itemLabel=x=>`${x.part.tag}${x.item.lab?' · '+x.item.lab:''}: ${x.item.name}`;
function optGroups(ch,sel){
 const groups=[];
 itemList(ch).forEach(x=>{let g=groups.find(y=>y.part===x.part);if(!g)groups.push(g={part:x.part,items:[]});g.items.push(x);});
 return groups.map(g=>`<optgroup label="${esc(g.part.tag+' – '+g.part.name)}">${g.items.map(x=>`<option value="${esc(x.key)}" ${x.key===sel?'selected':''}>${esc((x.item.lab?x.item.lab+': ':'')+x.item.name)} (${fmtDS(x.ds)} DS)</option>`).join('')}</optgroup>`).join('');
}
function linkRows(key){
 const m=matOf(key);
 return m.links.map((x,i)=>`<div class="lrow"><input type="text" style="width:190px" data-mat="${esc(key)}" data-i="${i}" data-f="l" value="${esc(x.l)}" placeholder="Bezeichnung"><input type="text" style="flex:1;min-width:220px" data-mat="${esc(key)}" data-i="${i}" data-f="u" value="${esc(x.u)}" placeholder="https://… (Link zum digitalen Material)"><button class="btn sm danger" data-act="matDel" data-key="${esc(key)}" data-i="${i}" title="Zeile entfernen">✕</button></div>`).join('')
  +`<button class="btn sm" data-act="matAdd" data-key="${esc(key)}">+ Link</button>`;

function partBlock(key,ch,pt,i){
 const cat=CAT[pt.pid],pp='chains.'+key+'.parts.'+i,ok=key+'#'+pt.pid;
 const sum=cat.items.reduce((a,it)=>a+(pt.mods[it.id].on?pt.mods[it.id].ds:0),0)+pt.extra.reduce((a,e)=>a+(e.on?e.ds:0),0);
 let h=`<details class="part" data-open="${esc(ok)}" ${ui.open[ok]?'open':''}><summary><input type="checkbox" ${bind(pp+'.on','data-t="b"')} ${pt.on?'checked':''} title="Diesen Teil unterrichten"> <b>${esc(cat.tag)}</b> · ${esc(cat.name)} <span class="pill">${fmtDS(sum)} DS</span>
  <span class="pbtn"><button class="btn sm ghost" data-act="partUp" data-key="${esc(key)}" data-i="${i}" ${i===0?'disabled':''} title="Nach vorn">▲</button><button class="btn sm ghost" data-act="partDown" data-key="${esc(key)}" data-i="${i}" ${i===ch.parts.length-1?'disabled':''} title="Nach hinten">▼</button><button class="btn sm danger" data-act="partDel" data-key="${esc(key)}" data-i="${i}" title="Teil entfernen">✕</button></span></summary>`;
 cat.items.forEach(it=>{
  const mp=pp+'.mods.'+it.id,m=pt.mods[it.id];
  h+=`<div class="mrow"><input type="checkbox" ${bind(mp+'.on','data-t="b"')} ${m.on?'checked':''} title="Modul unterrichten"><span class="mnr ${it.lab?'':'x'}">${esc(it.lab||'·')}</span><span>${esc(it.name)}${it.e?' <span class="pill fehlt">Umfang geschätzt</span>':''}</span><span><input type="number" min="0.5" step="0.5" style="width:70px" ${bind(mp+'.ds','data-t="d"')} value="${m.ds}"> <span class="small">DS${m.ds%1?' ('+m.ds*2+' Std)':''}</span></span></div>`;
 });

document.addEventListener('toggle',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.open)ui.open[t.dataset.open]=t.open;},true);

document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.kvoff){const a=t.dataset.kvoff.split('|'),cfg=state.trainer[a[0]];if(cfg){if(t.checked)delete cfg.off[a[1]];else cfg.off[a[1]]=true;save();}return;}
 if(t.dataset.mat){ /* Material-Links (Modul- bzw. Lernfeld-Schlüssel) */
  const m=matEnsure(t.dataset.mat);
  if(t.dataset.f==='pdf')m.pdf=t.value.trim();else if(m.links[+t.dataset.i])m.links[+t.dataset.i][t.dataset.f]=t.value.trim();
  save();return;
 }
 if(t.dataset.role==='startSel'){const ch=state.chains[t.dataset.key];ch.startKey=t.value;ch.startDs=1;save();refresh();return;}
 if(t.dataset.bind){ /* generische Datenbindung (Admin-Felder) */
  const p=t.dataset.bind.split('.');let o=state;for(let i=0;i<p.length-1;i++)o=o[p[i]];
  const last=p[p.length-1];
  o[last]=t.dataset.t==='b'?t.checked:t.dataset.t==='n'?Math.max(1,parseInt(t.value)||1):t.dataset.t==='d'?snapDS(t.value,1):t.value;
  if(!o[last]&&t.dataset.t!=='b'&&t.dataset.t!=='n'&&t.dataset.t!=='d'&&p[0]==='settings'&&p[1]==='klassenEnde')delete o[last];
  save();if(t.dataset.t==='d'){refresh();return;}compute();renderHeader();return;
 }
 const cell=t.closest('[data-slot]');
 if(cell){
  const k=cell.dataset.slot,kl=cell.querySelector('[data-role=k]').value;
  if(!kl)delete state.slots[k];
  else{const fs=FAECHER[typOf(kl)];let f=cell.querySelector('[data-role=f]').value;if(t.dataset.role==='k'||!fs.includes(f))f=fs[0];state.slots[k]={klasse:kl,fach:f};}
  save();refresh();return;
 }
 if(t.dataset.hl){const a=t.dataset.hl.split('|'),h=state.settings.hoverLangs=state.settings.hoverLangs||{},l=(h[a[0]]||[]).filter(x=>x!==a[1]);if(t.checked)l.push(a[1]);h[a[0]]=TRLANGS.filter(x=>l.includes(x));save();return;}
 if(t.dataset.role==='fill'||t.dataset.role==='fillxk'||t.dataset.role==='fillin'){fillAdminForms();return;}
 if(t.dataset.ui){
  const k=t.dataset.ui;
  if(k==='weekDate'){if(t.value)ui.week=mondayOf(t.value);}
  else ui[k]=t.value;
  renderAll();
 }
});
document.getElementById('fileIn').addEventListener('change',async e=>{
 const f=e.target.files[0];if(!f)return;
 try{
  const j=JSON.parse(await f.text());
  if(!j||typeof j!=='object'||!j.settings||!j.chains)throw new Error('format');
  if(!confirm('Aktuelle Planungsdaten durch das Backup ersetzen?')){e.target.value='';return;}
  state=normalize(j);save();refresh();toast('Import erfolgreich');
 }catch(err){toast('Die Datei ist kein gültiges Backup',true);}
 e.target.value='';
});

async function init(){

 STUDENT=q.get('mode')==='schueler';
 {const ql=q.get('lang');if(KV_LANGS.includes(ql)){KV_LANG=ql;try{localStorage.setItem(KV_LANGKEY,ql);}catch(e){}}}

 if(STUDENT){

  await new Promise(res=>{const sc=document.createElement('script');sc.src='stundenplan_uebersetzungen.js';sc.charset='utf-8';sc.onload=()=>{TRD=window.TR||null;res();};sc.onerror=()=>res();document.head.appendChild(sc);});
  ui.filterKlasse=KLASSEN.some(k=>k.id===q.get('klasse'))?q.get('klasse'):'';
  document.getElementById('title').textContent='Stundenplan – Schüleransicht';

 }

}
