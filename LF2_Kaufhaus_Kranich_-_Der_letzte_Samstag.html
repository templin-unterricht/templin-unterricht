  {t:'„Die Anleitung hat 40 Seiten.“',f:1,x:'Und?',w:'Ein Merkmal ohne Nutzen.'},
  {t:'„Damit lernt man viel.“',f:1,p:1,x:'Was genau?',w:'Nutzen angedeutet, aber „man“ statt Sie-Stil und kein Merkmal.'}],
  b:'Kundennutzen für den Käufer',ihk:'„So kann Ihre Tochter allein auf- und absteigen – Sie müssen nicht danebenstehen.“'},
 {m:10,sit:'Der Kasten kostet 60 Euro und enthält 120 Versuche.',q:'Wie nennt ihr den Preis?',o:[
  {t:'„Der Kasten kostet 60 Euro. Bei 120 Versuchen sind das nur 50 Cent pro Versuch.“',f:2,x:'Stimmt, das ist wenig.',w:'Verkleinerungsmethode: Der Preis wird auf eine kleine Menge umgerechnet.'},
  {t:'„60 Euro sind nicht viel, oder?“',f:0,x:'Kommt drauf an.',w:'Eine Suggestivfrage.'},
  {t:'„60 Euro.“',f:1,x:'Hm.',w:'Ein nackter Preis.'},
  {t:'„Das sind nur 60 Euro im Jahr, wenn sie ihn ein Jahr nutzt.“',f:0,p:1,x:'Das ist doch der volle Preis.',w:'Diese Rechnung macht nichts kleiner.'}],
  b:'Verkleinerungsmethode',ihk:'„… sind das nur 24,00 EUR pro Jahr und nur 6,5 Cent pro Tag.“',
  a:{q:'Wie heißt die Verkleinerungsmethode noch?',o:['Divisionsmethode','Puzzlemethode','Bumerang-Methode'],c:0}}]},

{id:'sw7',d:'spiel',n:'Frau Rahimi',f:{s:2,h:'dutt',c:'grau',alt:2,x:'schal'},i:'Frau Rahimi (70) sucht ein Kuscheltier für ihre Enkelin.',k:24,s:[
 {m:1,sit:'Es ist laut in der Abteilung. Sie sagt: „Entschuldigung, ich verstehe Sie so schlecht.“',q:'Was macht ihr?',o:[
  {t:'Langsamer und deutlich sprechen, kurze Sätze, kleine Pausen, freundlicher Ton.',f:2,x:'Ah, jetzt verstehe ich Sie gut.',w:'Gute Stimmtechnik und verständlich formulieren: kurze Sätze, bekannte Wörter.'},
  {t:'Genauso weiterreden, sie wird es schon verstehen.',f:0,x:'Wie bitte?',w:'Wer nicht verstanden wird, kann nicht beraten.'},
  {t:'Ganz laut rufen.',f:1,x:'Sie müssen nicht schreien.',w:'Lauter ja – aber Schreien wirkt unfreundlich. Besser: deutlich und ruhig.'},
  {t:'Fachwörter benutzen, damit es kürzer wird: „Das Plüsch ist zertifiziert und maschinenwaschbar.“',f:1,p:1,x:'Zerti… was?',w:'Fachchinesisch vermeiden oder sofort erklären.'}],
  b:'Stimmtechnik',ihk:'angenehmer Tonfall · saubere Aussprache · abwechslungsreiche Lautstärke · gekonnte Sprechpausen'},
 {m:8,sit:'Sie schaut zwei Kuscheltiere in der Vitrine an.',q:'Wie legt ihr vor?',o:[
  {t:'Beide herausholen und ihr in die Hände geben: „Fühlen Sie einmal, wie weich das Fell ist.“',f:2,x:'Oh, so weich!',w:'In die Hände geben: Die Kundin fühlt die Ware selbst – ihr wird nichts verborgen.'},
  {t:'In der Vitrine lassen und nur zeigen.',f:0,x:'Kann ich die mal halten?',w:'Ohne Anfassen kein Eindruck.'},
  {t:'Ein Tier hochhalten und selbst drücken.',f:1,x:'Und ich?',w:'Ihr fühlt – sie nicht.'},
  {t:'Alle zwanzig Kuscheltiere aufs Pult legen.',f:1,p:1,x:'Oh je, so viele.',w:'Mehr als fünf verwirren.'}],
  b:'In die Hände geben',ihk:'Arten der Warenvorlage: ausprobieren · anprobieren · in die Hände geben · Kostproben'}]},

{id:'sw8',d:'spiel',n:'Herr Peters',f:{s:0,h:'kurz',c:'rot',alt:1,b:1},i:'Ihr steht an der Kasse. Herr Peters kommt mit einem Puzzle auf euch zu.',k:35,s:[
 {m:2,sit:'Er ist noch drei Schritte entfernt.',q:'Wie steht ihr da?',o:[
  {t:'Aufrecht, dem Kunden zugewandt, Blickkontakt, freundliches Lächeln, Hände offen.',f:2,x:'Guten Tag!',w:'Interesse und Offenheit: zugewandter Körper, Lächeln mit Augenkontakt, offene Handflächen.'},
  {t:'Angelehnt, Arme verschränkt, Blick aufs Handy.',f:0,x:'Störe ich?',w:'Abwendung und Desinteresse.'},
  {t:'Freundlich lächeln, aber weiter auf den Bildschirm schauen.',f:1,x:'Hallo?',w:'Ein Lächeln ohne Augenkontakt wirkt gequält oder abwesend.'},
  {t:'Mit dem Zeigefinger auf ihn zeigen: „Sie da, kommen Sie!“',f:0,p:1,x:'Wie bitte?',w:'Ein Zeigefinger auf den Kunden kann Aggression bedeuten. Dazu ein Befehl.'}],
  b:'Die eigene Körpersprache',ihk:'Interesse zeigen: Zuwendung des Körpers, freundliches Lächeln mit Augenkontakt, offene Handflächen.'},
 {m:2,sit:'Herr Peters erzählt. Ihr merkt, dass ihr mit eurer Kette spielt und auf den Boden schaut.',q:'Was kann das beim Kunden auslösen?',o:[
  {t:'Mit Schmuck spielen ist eine Verlegenheitsgeste. Ich wirke unsicher. Besser: ruhig stehen und ihn anschauen.',f:2,x:'(fühlt sich gut beraten)',w:'Mit Haaren oder Schmuck spielen kann Angst oder Nervosität bedeuten.'},
  {t:'Nichts, Körpersprache merkt keiner.',f:0,x:'(denkt: Die ist ja unsicher.)',w:'Der Kunde glaubt der Körpersprache oft mehr als den Worten.'},
  {t:'Er denkt, ich bin gelangweilt – also schneller reden.',f:1,x:'Langsam, bitte.',w:'Schneller reden hilft nicht. Die Geste sollte weg.'},
  {t:'Das wirkt sicher, weil ich beschäftigt aussehe.',f:0,p:1,x:'(schaut irritiert)',w:'Falsch: Es ist eine Verlegenheitsgeste.'}],
  b:'Verlegenheitsgeste',ihk:'Mit Haaren oder Schmuck spielen → kann Angst, Nervosität bedeuten.'}]},

{id:'sw9',d:'spiel',n:'Frau Haas',f:{s:1,h:'pony',c:'braun',alt:1},i:'Frau Haas ist mit zwei Kindern in der Spielwarenabteilung.',k:45,s:[
 {m:3,sit:'Sie fragt: „Warum darf ich bei den Brettspielen selbst stöbern, aber die Drohnen sind hinter der Theke?“',q:'Was antwortet ihr?',o:[
  {t:'„Brettspiele schauen Sie sich am besten in Ruhe selbst an – und wenn Sie Fragen haben, berate ich Sie. Drohnen sind teuer und müssen erklärt werden, deshalb bedienen wir Sie dort persönlich.“',f:2,x:'Ah, verstehe.',w:'Vorwahl: erst selbst umsehen, dann Beratung. Bedienung: erklärungsbedürftig und zu schützen.'},
  {t:'„Das ist halt so.“',f:0,x:'Aha.',w:'Keine Erklärung.'},
  {t:'„Drohnen werden oft geklaut.“',f:1,x:'Also trauen Sie uns nicht?',w:'Ein Grund, aber nicht der einzige. Und es klingt nach Misstrauen.'},
  {t:'„Bei Brettspielen ist Selbstbedienung, da gibt es keine Beratung.“',f:1,p:1,x:'Schade.',w:'Falsch: Das ist Vorwahl – Beratung gibt es, sobald die Kundin es wünscht.'}],
  b:'Vorwahl',ihk:'Vorwahl: Der Kunde verschafft sich erst selbst einen Überblick. Der Verkäufer bietet Beratung an, sobald der Kunde den Wunsch erkennen lässt.',
  a:{q:'Welche Verkaufsform gilt bei den Brettspielen?',o:['Vorwahl','Selbstbedienung','Bedienung'],c:0}},
 {m:15,sit:'Sie fragt: „Gibt es hier etwas für die Kinder, während ich aussuche?“',q:'Was antwortet ihr?',o:[
  {t:'„Ja, gern – in unserer Spielecke werden Kinder betreut. Und unten im Café gibt es Kakao.“',f:2,x:'Wunderbar, dann suche ich in Ruhe.',w:'Allgemeine (kundenbezogene) Serviceleistungen: Kinderbetreuung, Cafeteria.'},
  {t:'„Kinder bitte draußen lassen.“',f:0,x:'Dann gehen wir eben.',w:'Abweisend.'},
  {t:'„Weiß nicht.“',f:1,x:'Hm.',w:'Die eigenen Serviceleistungen sollte man kennen.'},
  {t:'„Sie können bei uns mit Karte zahlen.“',f:1,p:1,x:'Das war nicht die Frage.',w:'Das ist eine Zahlungserleichterung. Sie passt nicht zur Frage.'}],
  b:'Kundenbezogene (allgemeine) Serviceleistungen',ihk:'kundenbezogen: z. B. Kundentoiletten, Kundenzeitschriften (IHK) · Buch: Parkplätze, Kinderbetreuung, Cafeteria',
  a:{q:'Wie heißt dieser Bereich in der Prüfung?',o:['kundenbezogene Serviceleistungen','warenbezogene Serviceleistungen','zahlungsbezogene Serviceleistungen'],c:0}}]},

/* ---------- FEINKOST ---------- */
{id:'fk1',d:'feinkost',n:'Frau Graf',f:{s:0,h:'kurz',c:'blond',alt:1,g:1},i:'Frau Graf steht vor der Käsetheke.',k:18,s:[
 {m:8,sit:'Sie kann sich nicht zwischen zwei Bergkäsen entscheiden.',q:'Was tut ihr?',o:[
  {t:'Eine Kostprobe anbieten: „Probieren Sie gern beide. Der linke ist zwölf Monate gereift und schmeckt kräftig-nussig.“',f:2,x:'Mmh, der kräftige ist es!',w:'Kostprobe – verstärkt durch einen Hinweis auf den Geschmack.'},
  {t:'„Nehmen Sie einfach den teureren.“',f:0,x:'Warum?',w:'Kein Argument, nur Druck.'},
  {t:'Beide Käse genau beschreiben.',f:1,x:'Klingt beides gut …',w:'Nur Worte. Der Geschmack ist hier das stärkste Argument.'},
  {t:'Sechs Sorten zum Probieren hinlegen.',f:1,p:1,x:'Jetzt weiß ich gar nichts mehr.',w:'Mehr als fünf verwirren.'}],
  b:'Kostprobe',ihk:'Kostproben: Käse, Wurst, Wein, Pralinen – verstärkt durch Hinweise auf Geschmack und Bekömmlichkeit'},
 {m:13,sit:'Sie nimmt 200 Gramm vom kräftigen Käse. Heute Abend kommen Gäste.',q:'Was bietet ihr an?',o:[
  {t:'Noch beim Käse: „Zu diesem Käse passt unser Feigensenf – das ist eine schöne Kombination für Ihren Abend.“',f:2,x:'Oh ja, den nehme ich!',w:'Zusatzangebot zum richtigen Zeitpunkt, mit Nutzen, passend zum Anlass.'},
  {t:'„Sonst noch was?“',f:0,x:'Nein.',w:'Geschlossen und ohne Angebot.'},
  {t:'„Wir haben auch Senf.“',f:1,x:'Aha.',w:'Ohne Nutzen.'},
  {t:'„Das nehmen alle dazu.“',f:1,p:1,x:'Muss ich ja nicht.',w:'Druck statt Nutzen – so wird aus dem Angebot Aufschwatzen.'}],
  b:'Zusatzangebot',ihk:'„Ihre Tagliatelle sollten Sie unbedingt durch einen frisch geriebenen Parmesankäse verfeinern.“'}]},

{id:'fk2',d:'feinkost',n:'Herr Weber',f:{s:1,h:'kurz',c:'grau',alt:2,b:1},i:'Herr Weber kommt zur Wursttheke.',k:7,s:[
 {m:7,sit:'Er sagt: „200 Gramm gekochten Schinken, bitte.“',q:'Was sagt ihr?',o:[
  {t:'„Gern. Lieber am Stück oder geschnitten?“',f:2,x:'Geschnitten, bitte.',w:'Aushändigungsverkauf: nur eine Ergänzungsfrage.'},
  {t:'„Wofür brauchen Sie den Schinken? Für wie viele Personen?“',f:0,x:'Für mich. Darf ich ihn jetzt haben?',w:'Er weiß genau, was er will. Ausfragen nervt.'},
  {t:'Drei andere Schinken empfehlen.',f:1,x:'Nein, den gekochten.',w:'Er hat klar bestellt.'},
  {t:'„Möchten Sie nicht lieber den Parmaschinken?“',f:1,p:1,x:'Nein.',w:'Erst den klaren Wunsch erfüllen.'}],
  b:'Ergänzungsfrage beim Aushändigungsverkauf',ihk:'„Welche Menge darf es sein?“ · „Lieber am Stück oder geschnitten?“'},
 {m:1,sit:'Ihr habt aus Versehen 230 Gramm abgeschnitten.',q:'Wie sagt ihr es?',o:[
  {t:'„Es sind 230 Gramm geworden – ist das recht so, oder soll ich etwas wegnehmen?“',f:2,x:'Passt schon, danke.',w:'Kundenorientiert und ehrlich, im Sie-Stil.'},
  {t:'„Sind halt 230, Pech.“',f:0,x:'Na hören Sie mal.',w:'Unhöflich – ein Gesprächsstörer.'},
  {t:'„Das sind 230 Gramm.“',f:1,x:'Ich wollte 200.',w:'Korrekt, aber ihr fragt nicht, ob es passt.'},
  {t:'„Ich hab mich verschnitten, das ist mir zu kompliziert.“',f:1,p:1,x:'Aha …',w:'Negativ formuliert, macht den Kunden unsicher.'}],
  b:'Kundenorientierte Sprache',ihk:'Positiv und im Sie-Stil formulieren.'}]},

{id:'fk3',d:'feinkost',n:'Frau Sander',f:{s:3,h:'locken',c:'braun',alt:1},i:'Frau Sander steht beim Kaffee.',k:14,s:[
 {m:5,sit:'Sie fragt: „Ist der Kaffee fair gehandelt? Und gibt es ihn in einer Nachfüllpackung?“',q:'Was sagt ihr?',o:[
  {t:'„Ja, dieser Kaffee ist fair gehandelt, und die Nachfüllpackung spart Verpackungsmüll.“',f:2,x:'Genau so etwas suche ich.',w:'Kaufmotiv Umweltbewusstsein (rational) erkannt und bedient.'},
  {t:'„Mit dem Kaffee beeindrucken Sie Ihre Gäste.“',f:0,x:'Das war nicht meine Frage.',w:'Spricht Geltungsbedürfnis an. Ihr Motiv ist ein anderes.'},
  {t:'„Weiß ich nicht, aber er schmeckt gut.“',f:1,x:'Hm.',w:'Geschmack ist ein Argument, aber ihre Frage bleibt offen.'},
  {t:'„Der ist ganz schnell gemacht.“',f:0,p:1,x:'Darum geht es mir nicht.',w:'Zeitersparnis passt nicht zu ihren Fragen.'}],
  b:'Kaufmotiv Umweltbewusstsein',ihk:'Kauf von Waren mit Umweltsiegel → Umweltbewusstsein (rationales Kaufmotiv)',
  a:{q:'Ist Umweltbewusstsein rational oder emotional?',o:['rational (objektiv)','emotional (subjektiv)','weder noch'],c:0}},
 {m:9,sit:'Sie sagt: „Ich vertrage Kaffee oft schlecht.“ Bei einem Kaffee werden den Bohnen vor dem Rösten mit heißem Dampf die Reiz- und Bitterstoffe entzogen.',q:'Wie argumentiert ihr?',o:[
  {t:'„Dieser Kaffee ist sehr bekömmlich, denn den Bohnen werden vor dem Rösten mit Dampf die Reiz- und Bitterstoffe entzogen. So können Sie Ihren Kaffee wieder genießen.“',f:2,x:'Das probiere ich!',w:'Mit Gesundheit argumentieren: Merkmal, Vorteil, Nutzen.'},
  {t:'„Dann trinken Sie halt Tee.“',f:0,x:'Wie bitte?',w:'Eine Killerphrase.'},
  {t:'„Der ist dampfbehandelt.“',f:1,x:'Und was heißt das?',w:'Fachwort ohne Erklärung, kein Nutzen.'},
  {t:'„Der ist nicht so schädlich für den Magen.“',f:1,p:1,x:'Schädlich?!',w:'Negativ formuliert („schädlich“).'}],
  b:'Mit Gesundheit argumentieren',ihk:'„Dieser Kaffee ist sehr bekömmlich, da den Kaffeebohnen vor dem Rösten mit heißem Dampf und Druck die Reiz- und Bitterstoffe entzogen werden.“'}]},

{id:'fk4',d:'feinkost',n:'Herr Pohl',f:{s:0,h:'kurz',c:'schwarz',alt:1,g:1},i:'Herr Pohl lässt einen Präsentkorb für seine Firma packen.',k:95,s:[
 {m:10,sit:'Korb 12 Euro, Pralinen 24 Euro, Kaffee 14 Euro, Olivenöl 36 Euro, Lieferung 9 Euro. Zusammen 95 Euro. Er erschrickt über die Summe.',q:'Was tut ihr?',o:[
  {t:'„Gern zeige ich Ihnen, wie sich der Betrag zusammensetzt: der Korb 12 Euro, die Pralinen 24 Euro …“ So sieht er jeden Teil.',f:2,x:'Ah, so ist das. Das ist fair.',w:'Zerlegungsmethode: die Teilleistungen einzeln nennen. Wichtig: nichts verschweigen.'},
  {t:'„Wer schenkt, muss eben zahlen.“',f:0,x:'Na danke.',w:'Eine Killerphrase.'},
  {t:'„95 Euro, so ist das.“',f:1,x:'Hm.',w:'Kein Nutzen, keine Erklärung.'},
  {t:'Die Lieferkosten weglassen und erst auf der Rechnung zeigen.',f:0,p:1,x:'(später) Was sind das für 9 Euro?!',w:'Verschweigen ist Täuschung. Am Ende steht immer die Gesamtsumme.'}],
  b:'Zerlegungsmethode',ihk:'Die Gesamtleistung wird in mehrere Teilleistungen zerlegt.',
  a:{q:'Wie heißt die Zerlegungsmethode noch?',o:['Puzzlemethode','Divisionsmethode','Sandwich-Methode'],c:0}},
 {m:14,sit:'Er nickt. Ihr wollt jetzt zum Abschluss kommen.',q:'Wie macht ihr das?',o:[
  {t:'„Sie wünschen sich einen Korb mit Süßem und Herzhaftem?“ – „Ja.“ – „Geliefert bis Freitag?“ – „Ja.“ – „Dann ist das genau der richtige Korb für Sie.“',f:2,x:'Ja, so machen wir das.',w:'Ja-Fragen: Die letzte Frage führt zur Zustimmung zum Kauf.'},
  {t:'„Und jetzt? Kaufen oder nicht?“',f:0,x:'So nicht.',w:'Druck und unhöflich.'},
  {t:'Schweigend warten, bis er etwas sagt.',f:1,x:'(wartet)',w:'Den Abschluss nicht einzuleiten verschenkt den Moment.'},
  {t:'Zehn Ja-Fragen hintereinander, damit er am Ende nicht mehr Nein sagen kann.',f:0,p:1,x:'Ich fühle mich überrumpelt.',w:'Ja-Fragen als Falle werden zur Manipulation.'}],
  b:'Ja-Fragen',ihk:'„Sie wünschen sich einen Brustbeutel …?“ – „Ja.“ … „Dann ist das der richtige Brustbeutel für Sie.“',
  a:{q:'Welche Abschlusstechnik war das?',o:['Ja-Fragen','Verringerung der Auswahl','direkte Kaufaufforderung'],c:0}}]},

{id:'fk5',d:'feinkost',n:'Frau Dietrich',f:{s:1,h:'lang',c:'grau',alt:2},i:'Frau Dietrich steht an der Salattheke.',k:12,s:[
 {m:11,sit:'Sie zeigt auf die Theke: „Die Salate sehen nicht gerade frisch aus.“',q:'Wie reagiert ihr?',o:[
  {t:'„Danke für den Hinweis! Ich schaue sofort nach und hole Ihnen frischen Salat aus der Kühlung.“',f:2,x:'Na, das ist doch ein Wort.',w:'Ein Einwand gegen die Qualität. Ernst nehmen – ein Einwand ist eine Chance.'},
  {t:'„Die sehen doch gut aus.“',f:0,x:'Finde ich nicht.',w:'Widerspricht, ohne zu prüfen. Die Kundin fühlt sich nicht ernst genommen.'},
  {t:'„Die sind von heute früh.“',f:1,x:'Hm. Sieht nicht so aus.',w:'Vielleicht stimmt es – aber prüfen und eine Lösung anbieten wäre besser.'},
  {t:'„Das ist ein Einwand gegen das Personal.“ Und weiter nichts.',f:0,p:1,x:'Was?',w:'Falsche Einwandart, und keine Lösung.'}],
  b:'Einwand gegen die Qualität',ihk:'Einwände gegen: die Qualität der Ware · das Preis-Leistungs-Verhältnis · das Geschäft · das Personal',
  a:{q:'Wogegen richtet sich der Einwand?',o:['gegen die Qualität der Ware','gegen das Geschäft','gegen das Preis-Leistungs-Verhältnis'],c:0}},
 {m:11,sit:'Sie sagt: „Früher hatten Sie hier viel mehr Sorten.“',q:'Was antwortet ihr?',o:[
  {t:'„Sie haben recht, wir haben weniger Sorten. Dafür ist jede davon frisch und hausgemacht – probieren Sie gern unseren neuen Linsensalat.“',f:2,x:'Na gut, ich probiere.',w:'Einwand gegen das Geschäft (Auswahl). Ja-Aber: zustimmen, Gegenargument, Gespräch fortsetzen.'},
  {t:'„Früher war alles besser, was?“',f:0,x:'Frechheit.',w:'Ironie – eine Killerphrase.'},
  {t:'„Das entscheidet der Chef.“',f:1,x:'Und Sie?',w:'Schiebt ab, statt zu antworten.'},
  {t:'„Gerade deshalb haben wir weniger Sorten!“ – ohne Begründung.',f:1,p:1,x:'Hä?',w:'Umkehr-Methode ohne Argument wirkt patzig.'}],
  b:'Einwand gegen das Geschäft',ihk:'„Ist das alles, was Sie an Blusen haben?“ → Einwand gegen das Geschäft',
  a:{q:'Welche Einwandart war das?',o:['Einwand gegen das Geschäft','Einwand gegen die Qualität','Vorwand'],c:0}}]},

{id:'fk6',d:'feinkost',n:'Herr Roth',f:{s:4,h:'glatze',c:'schwarz',alt:1,b:1},i:'Herr Roth hält eine Flasche Olivenöl in der Hand und liest das Etikett.',k:22,s:[
 {m:4,sit:'Er dreht die Flasche hin und her.',q:'Wie sprecht ihr ihn an?',o:[
  {t:'„Guten Tag. Das Öl, das Sie gerade anschauen, kommt aus einer kleinen Ölmühle auf Kreta. Wofür möchten Sie es verwenden?“',f:2,x:'Zum Braten. Geht das damit?',w:'Warenbezogene Kontaktaufnahme plus offene Frage.'},
  {t:'„Suchen Sie etwas Bestimmtes?“',f:0,x:'Nein.',w:'Geschlossene Frage – Gespräch zu Ende.'},
  {t:'„Guten Tag, wie kann ich Ihnen helfen?“',f:1,x:'Ich schau mir das Öl an.',w:'Allgemeine Kontaktaufnahme – nicht falsch. Hier passt warenbezogen besser, weil er schon eine Ware in der Hand hat.'},
  {t:'„Das Öl ist teuer, das wissen Sie, oder?“',f:0,p:1,x:'Jetzt schon.',w:'Erwartungen dämpfen – ein Gesprächsstörer.'}],
  b:'Warenbezogene Kontaktaufnahme',ihk:'„Guten Tag. Dieser Bluetooth-Lautsprecher, den Sie sich gerade anschauen, ist wasserdicht und stoßfest.“',
  a:{q:'Welche Art der Kontaktaufnahme war die beste?',o:['warenbezogen','allgemein','keine'],c:0}},
 {m:6,sit:'Er will das Öl zum Braten nutzen. Ihr wollt wissen, ob er sehr heiß brät.',q:'Wie fragt ihr?',o:[
  {t:'„Ich frage das, weil manche Öle nicht so heiß werden sollten: Braten Sie oft scharf an?“',f:2,x:'Ja, Steaks. Gut, dass Sie fragen.',w:'Geschlossene Frage – mit Begründung. So versteht der Kunde, warum ihr fragt.'},
  {t:'„Sie braten doch sicher richtig, oder?“',f:0,x:'Wie bitte?',w:'Eine Suggestivfrage mit Unterstellung.'},
  {t:'„Braten Sie scharf an?“',f:1,x:'Wieso?',w:'Geschlossene Frage ohne Grund – wirkt wie ein Verhör.'},
  {t:'„Wie Sie braten, ist ja Ihre Sache.“',f:0,p:1,x:'Dann frag ich wen anders.',w:'Kein Interesse am Kunden.'}],
  b:'Geschlossene Frage mit Begründung',ihk:'„Ich frage das, weil … – haben Sie bereits …?“'}]},

{id:'fk7',d:'feinkost',n:'Herr Baumann',f:{s:0,h:'locken',c:'blond',alt:0},i:'Herr Baumann fragt eure Kollegin Mia nach einem Tee.',k:9,s:[
 {m:1,sit:'Mia sagt: „Das ist Fachwissen, das verstehen Sie nicht.“',q:'Welcher Gesprächsstörer ist das?',o:[
  {t:'Eine Killerphrase: abwertend und verletzend.',f:2,x:'(Herr Baumann schaut beleidigt.)',w:'Killerphrasen kommen oft, wenn Sachargumente fehlen.'},
  {t:'Ein Gesprächsförderer.',f:0,x:'(Mia grinst.)',w:'Ganz sicher nicht.'},
  {t:'Ein Überredungsversuch.',f:1,x:'(Mia: „Ich will ihm doch nichts aufzwingen.“)',w:'Nein – sie will nichts aufzwingen, sie wertet den Kunden ab.'},
  {t:'Erwartungen dämpfen.',f:1,p:1,x:'(Mia: „Hm?“)',w:'Nein – das wäre z. B. „Dieses Handy ist schwierig zu bedienen.“'}],
  b:'Killerphrase',ihk:'Killerphrase: „Das verstehen Sie nicht!“ · Befehl: „Greifen Sie sofort zu!“'},
 {m:1,sit:'Danach sagt Mia: „Greifen Sie sofort zu!“ Der Kunde zögert.',q:'Was hättet ihr gesagt?',o:[
  {t:'„Dieser Tee ist mild und beruhigend – möchten Sie einmal daran riechen?“',f:2,x:'Gern. Oh, der duftet!',w:'Statt Befehl: Nutzen nennen und die Ware erleben lassen.'},
  {t:'„Los, nehmen Sie ihn endlich!“',f:0,x:'Ich gehe.',w:'Noch ein Befehl.'},
  {t:'„An Ihrer Stelle würde ich mit dem Kauf nicht warten.“',f:1,x:'Und warum?',w:'Ein Überredungsversuch – auch ein Gesprächsstörer.'},
  {t:'„Ich habe Ihnen doch schon gesagt, dass der gut ist.“',f:1,p:1,x:'Ja, ja.',w:'Ein Vorwurf – Gesprächsstörer.'}],
  b:'Befehl vermeiden',ihk:'Gesprächsstörer: Befehle · Killerphrasen · Überredungsversuche · Vorwürfe · Erwartungen dämpfen'}]},

{id:'fk8',d:'feinkost',n:'Frau Lehmann',f:{s:2,h:'lang',c:'schwarz',alt:1,x:'ohrring'},i:'Frau Lehmann bleibt bei den Pralinen stehen.',k:39,s:[
 {m:10,sit:'Die Pralinen sind diese Woche von 19,90 auf 12,90 Euro reduziert.',q:'Wie sprecht ihr den Preis an?',o:[
  {t:'„Diese Pralinen sind diese Woche von 19,90 auf 12,90 Euro herabgesetzt – unser Aktionspreis.“',f:2,x:'Oh, dann nehme ich drei!',w:'Frühe Preisnennung: Beim Sonderangebot ist der Preis das stärkste Argument.'},
  {t:'Den Preis verschweigen, bis sie fragt.',f:0,x:'(geht weiter)',w:'Damit verschenkt ihr das beste Argument.'},
  {t:'Erst lange über Kakaobohnen reden, dann den Preis nennen.',f:1,x:'Und was kosten die?',w:'Sandwich ist der Normalfall – beim Sonderangebot gehört der Preis nach vorn.'},
  {t:'„Die sind bloß so billig, weil sie bald ablaufen.“',f:0,p:1,x:'Dann lieber nicht.',w:'Erwartungen dämpfen – das verschreckt.'}],
  b:'Frühe Preisnennung',ihk:'„Diese Winterjacken sind von 149 auf 79 Euro herabgesetzt – solange der Vorrat reicht.“'},
 {m:14,sit:'Sie nimmt drei Schachteln und zögert: „Hoffentlich mag meine Schwester die.“',q:'Was sagt ihr?',o:[
  {t:'„Das ist eine gute Wahl: Die Mischung hat für jeden Geschmack etwas – Vollmilch, Zartbitter und Nougat.“',f:2,x:'Stimmt, da ist für jeden was dabei.',w:'Kaufentscheidung bekräftigen: Kaufmotiv unterstützen.'},
  {t:'„Keine Ahnung, ist ja Ihre Schwester.“',f:0,x:'Na toll.',w:'Lässt sie mit ihrer Sorge allein.'},
  {t:'„Bestimmt.“',f:1,x:'Hm.',w:'Zu knapp, keine Begründung.'},
  {t:'„Wenn nicht, essen Sie sie eben selbst.“',f:1,p:1,x:'Haha … na ja.',w:'Witzig gemeint, nimmt die Sorge aber nicht ernst.'}],
  b:'Kaufentscheidung bekräftigen',ihk:'„Sie haben eine gute Entscheidung getroffen, das Kleid können Sie zu vielen Anlässen tragen …“'}]},

{id:'fk9',d:'feinkost',n:'Herr Jung',f:{s:1,h:'kurz',c:'braun',alt:0,x:'kappe'},i:'Im Feinkostregal ist Selbstbedienung. Herr Jung läuft zum dritten Mal am Teeregal vorbei.',k:11,s:[
 {m:4,sit:'Er kratzt sich am Kopf und macht ein ratloses Gesicht.',q:'Was tut ihr?',o:[
  {t:'Hingehen: „Guten Tag! Ich sehe, Sie suchen etwas – wobei darf ich Ihnen helfen?“',f:2,x:'Endlich! Ich suche Pfefferminztee.',w:'Auch in der Selbstbedienung wird jedem geholfen, der eine Ware nicht findet. Ratloses Gesicht = Kundensignal.'},
  {t:'Nichts – in der Selbstbedienung muss er allein klarkommen.',f:0,x:'(gibt auf und geht)',w:'Falsch. Jeder Kunde wird begrüßt, und ihm wird geholfen.'},
  {t:'Von weitem rufen: „Tee ist ganz links!“',f:1,x:'Äh … danke?',w:'Hilfsbereit, aber ohne Blickkontakt und ohne Begrüßung.'},
  {t:'„Kann ich Ihnen helfen?“',f:1,p:1,x:'Ja … ich suche Tee.',w:'Gute Absicht, aber eine geschlossene Frage.'}],
  b:'Kontakt bei Selbstbedienung',ihk:'Bei Selbstbedienung wird jeder Kunde begrüßt, und ihm wird geholfen, wenn er eine Ware nicht findet.'},
 {m:3,sit:'Er fragt: „Warum gibt es den losen Tee nur an der Theke, die Teebeutel aber im Regal?“',q:'Was antwortet ihr?',o:[
  {t:'„Losen Tee wiegen wir für Sie frisch ab, und ich berate Sie zu den Sorten. Die Teebeutel sind fertig verpackt, die nehmen Sie selbst.“',f:2,x:'Ah, logisch.',w:'Offene Ware und individuelle Menge → Bedienung. Verpackte Ware → Selbstbedienung.'},
  {t:'„Damit wir mehr zu tun haben.“',f:0,x:'Aha …',w:'Kein fachlicher Grund.'},
  {t:'„Weil der lose teurer ist.“',f:1,x:'Ach so?',w:'Teilweise. Der Hauptgrund: offene Ware, die Menge wird abgewogen.'},
  {t:'„An der Theke ist Vorwahl.“',f:1,p:1,x:'Was ist das?',w:'Nein – an der Theke ist Bedienung.'}],
  b:'Bedienung bei offener Ware',ihk:'„Es ist offene Ware, die nicht in den direkten Zugriff des Kunden gehört, und die Menge wird individuell abgewogen.“',
  a:{q:'Welche Verkaufsform gilt für den losen Tee?',o:['Bedienung','Vorwahl','Selbstbedienung'],c:0}}]},

{id:'fk10',d:'feinkost',n:'Herr Kaiser',f:{s:0,h:'kurz',c:'grau',alt:2},i:'Herr Kaiser kommt sehr verärgert zur Käsetheke.',k:0,s:[
 {m:12,sit:'Er ruft: „Der Käse von gestern war innen schon schimmelig! Unglaublich!“',q:'Was tut ihr?',o:[
  {t:'„Das tut mir leid. Das ärgert Sie, das verstehe ich. Zeigen Sie mir bitte den Käse – dann finden wir sofort eine Lösung.“',f:2,x:'(ruhiger) Hier ist er.',w:'Entschuldigen, Verständnis zeigen, eine Lösung in Aussicht stellen.'},
  {t:'„Bei uns ist nie etwas schimmelig.“',f:0,x:'Ich lüge also?!',w:'Das nennt den Kunden einen Lügner.'},
  {t:'„Wenden Sie sich an die Abteilungsleitung.“',f:1,x:'Ich rede doch mit Ihnen!',w:'Weiterschicken, ohne zuzuhören. Erst selbst ernst nehmen.'},
  {t:'„Das kommt vor, Käse ist ein Naturprodukt.“',f:1,p:1,x:'Das hilft mir jetzt auch nicht.',w:'Vielleicht richtig – aber zuerst Verständnis zeigen, nicht belehren.'}],
  b:'Verärgerten Kunden beruhigen',ihk:'z. B. entschuldigen; Verständnis zeigen; ruhig bleiben; Lösung in Aussicht stellen; in ruhige Ecke bitten, Kaffee anbieten (IHK, Sommer 2024)'},
 {m:12,sit:'Er bekommt frischen Käse und geht zufrieden. Eure Kollegin fragt: „Warum sollten wir über so eine Beschwerde eigentlich froh sein?“',q:'Was antwortet ihr?',o:[
  {t:'Weil der Betrieb den Fehler so erfährt und beheben kann. Wer sich nicht beschwert, kommt einfach nicht wieder.',f:2,x:'(Kollegin: „Genau!“)',w:'Eine Beschwerde ist unangenehm, aber wertvoll.'},
  {t:'Gar nicht. Beschwerden sind nur Ärger.',f:0,x:'(Kollegin: „Falsch gedacht.“)',w:'Ohne Beschwerde erfährt der Betrieb nie, warum der Kunde wegbleibt.'},
  {t:'Weil der Kunde dann gratis Käse bekommt.',f:1,x:'(Kollegin: „Das ist nicht der Grund.“)',w:'Das ist nur die Lösung, nicht der Wert der Beschwerde.'},
  {t:'Weil man den Kunden dann belehren kann.',f:0,p:1,x:'(Kollegin: „Bloß nicht.“)',w:'Kunden nicht belehren.'}],
  b:'Beschwerde als Chance',ihk:'Der Kunde, der sich beschwert, gibt dem Betrieb die Gelegenheit, den Fehler zu beheben.'}]}
);

/* Zwischenfälle mit Entscheidung */

/* Für-Profis-Fragen (Auswertung) – Musterantworten aus den Lösungsblättern, gekürzt */
const PROFIFRAGEN = [
 {m:1,q:'„Eine gute Verkäuferin kann gut reden, eine sehr gute kann zuhören.“ Nehmen Sie begründet Stellung.',a:'Zustimmung: Wer nur redet, erfährt nichts über den Bedarf. Erst das Zuhören liefert die Informationen für ein passendes Angebot. Aktives Zuhören heißt: sich hineinversetzen, mitdenken, nachfragen. Wer nicht zuhört, argumentiert am Kunden vorbei.'},
 {m:2,q:'„Körpersprache lügt nicht.“ Prüfen Sie diese Aussage kritisch.',a:'Sie stimmt nur halb. Körpersprache ist oft unwillkürlich und verrät viel. Aber kein Signal ist eindeutig, dieselbe Geste hat mehrere Ursachen, und manche Menschen steuern ihre Körpersprache bewusst. Wer sich nur auf sie verlässt, kommt zu Fehlschlüssen.'},
 {m:3,q:'Warum ist die Vorwahl für viele Betriebe die wirtschaftlichste Verkaufsform? Zwei Gründe.',a:'1. Sie verbindet niedrige Personalkosten mit Beratung – Personal wird nur eingesetzt, wo der Kunde es braucht. 2. Der Kunde sucht ohne Druck aus, bleibt länger und kauft eher zusätzlich; im richtigen Moment steigt die Verkäuferin mit Fachwissen ein.'},
 {m:4,q:'Beurteilen Sie: „Wie kann ich Ihnen helfen?“ · „Sie kommen zurecht?“ · „Ja bitte?“ · „Guten Tag!“',a:'„Wie kann ich Ihnen helfen?“ – gut, offen. „Sie kommen zurecht?“ – schwach, geschlossen, klingt nach Loswerden. „Ja bitte?“ – schlecht, keine Begrüßung, ungeduldig. „Guten Tag!“ – richtig, aber allein zu wenig.'},
 {m:5,q:'Warum ist es gefährlich, ein emotionales Kaufmotiv offen anzusprechen? Formulieren Sie besser.',a:'Wer sagt „Damit sehen alle, dass Sie sich etwas leisten können“, ertappt den Kunden – das Vertrauen bricht. Besser das Motiv bedienen, ohne es zu nennen: „Dieses Modell fällt sofort auf – und die Verarbeitung sieht man auf den ersten Blick.“'},
 {m:6,q:'„Sonst brauchen Sie nichts?“ – nennen Sie drei Gründe, warum diese Frage schlecht ist, und eine bessere.',a:'1. Geschlossen – „Nein“ beendet das Gespräch. 2. Negativ („nichts“) – legt die Ablehnung nahe. 3. Unpersönlich – klingt nach Loswerden. Besser: „Zu diesen Schuhen passt unser Imprägnierspray – darf ich es Ihnen kurz zeigen?“'},
 {m:7,q:'Warum gehört die Frage nach dem Preis nicht an den Anfang der Bedarfsermittlung?',a:'Sie engt zu stark ein und kann peinlich wirken – manche nennen eine niedrigere Summe, als sie ausgeben würden. Besser nach Anlass und Erwartung fragen und in der mittleren Preislage vorlegen. An der Reaktion sieht man den Rahmen.'},
 {m:8,q:'Ein Kollege legt immer zuerst das Teuerste vor. Beurteilen Sie diese Strategie.',a:'Riskant: Es fehlt die Ausweichmöglichkeit nach oben. Billigere Ausführungen kann sich der Kunde danach nicht mehr guten Gewissens leisten, manche verzichten ganz. Das Geschäft bekommt den Ruf einer „Apotheke“. Richtig: mittlere Preislage – außer der Kunde nennt eine Vorstellung.'},
 {m:9,q:'Dieselbe Waschmaschine für eine junge Familie und ein Rentnerpaar: gleicher Vorteil, anderer Nutzen. Warum?',a:'Der Vorteil steckt in der Ware (z. B. Kurzprogramm 28 Minuten), der Nutzen im Kunden: Die Familie wäscht das Trikot noch am Abend, das Rentnerpaar muss nicht den ganzen Nachmittag warten. Deshalb muss der Bedarf vorher ermittelt sein.'},
 {m:10,q:'Wo liegt die Grenze zwischen geschickter Zerlegungsmethode und Täuschung?',a:'Geschickt ist sie, solange der Kunde jederzeit erfahren kann, was das Ganze kostet, und nichts Notwendiges verschwiegen wird. Täuschung beginnt, wo Pflichtteile als Extras erscheinen. Faustregel: Zerlegen ja – verschweigen nein. Am Ende steht immer die Gesamtsumme.'},
 {m:11,q:'Ein Kunde sagt: „Ihr Kollege war neulich sehr unfreundlich.“ Antworten Sie, ohne den Kollegen schlechtzumachen.',a:'„Das tut mir leid, so soll sich hier niemand behandelt fühlen. Danke, dass Sie es mir sagen – ich gebe es weiter. Und jetzt nehme ich mir für Sie Zeit: Wofür suchen Sie die Jacke?“ Der Kunde wird ernst genommen, der Kollege nicht verurteilt, das Gespräch kehrt zur Ware zurück.'},
 {m:12,q:'„Der Kunde hat immer recht.“ Wo hilft der Satz, wo schadet er?',a:'Er hilft als Haltung: zuhören, ernst nehmen, nicht rechthaberisch sein. Er schadet wörtlich genommen: Er ist oft sachlich falsch, nimmt dem Verkäufer die fachliche Rolle und schützt nicht vor Beleidigungen. Besser: Der Kunde hat immer ein Recht darauf, ernst genommen zu werden.'},
 {m:13,q:'Wo verläuft die Grenze zwischen gutem Zusatzangebot und Aufschwatzen? Zwei Merkmale.',a:'1. Zeitpunkt: Ein gutes Angebot kommt beim Hauptartikel, Aufschwatzen an der Kasse. 2. Begründung: Ein gutes Angebot nennt einen Nutzen passend zum Bedarf, Aufschwatzen übt Druck aus („Das nehmen alle“). Probe: Könnte der Kunde ohne Gesichtsverlust Nein sagen?'},
 {m:14,q:'Warum ist das Bekräftigen der Kaufentscheidung wirtschaftlich sinnvoll? Rechnen Sie in Folgen.',a:'Ein bereuter Kauf kostet: Personalzeit, Prüfung, neues Auszeichnen, oft ist die Ware nicht mehr neu verkäuflich. Bleibt der Kunde unzufrieden weg, muss ein neuer mit Werbung gewonnen werden – das kostet ein Vielfaches von zwei Sätzen an der Kasse.'},
 {m:15,q:'„Nach dem Kauf ist vor dem Kauf.“ Was bedeutet das für das Kassenpersonal?',a:'Die Kasse liefert den letzten Eindruck – und der bleibt am stärksten. Auch ohne die Beratung zu kennen, kann man sich bedanken, die Entscheidung bekräftigen, den Namen nutzen und einen Satz zur Situation anhängen. Ein genervter Satz an der Kasse kann eine gute Beratung zunichtemachen.'}
];

function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}

/* mood: 2 froh, 1 skeptisch, 0 sauer, 'n' neutral, 's' staunend */

  if(hair==='lang') back=`<path d="M27 52 Q25 98 34 112 L86 112 Q95 98 93 52 Z" fill="${hc}"/>`;
  if(hair==='zopf') back=`<path d="M86 50 Q104 62 98 96 Q94 104 90 98 Q96 74 82 58 Z" fill="${hc}"/>`;
  if(hair==='dutt') back=`<circle cx="60" cy="20" r="11" fill="${hc}"/>`;
  const cap=`<path d="M30 54 Q29 24 60 23 Q91 24 90 54 Q86 40 60 37 Q34 40 30 54 Z" fill="${hc}"/>`;
  if(hair==='kurz'||hair==='lang'||hair==='dutt'||hair==='zopf') top=cap;
  if(hair==='pony') top=cap+`<path d="M34 46 Q38 33 60 32 Q82 33 86 46 Q80 44 72 46 Q66 41 60 45 Q52 41 46 46 Q40 44 34 46 Z" fill="${hc}"/>`;
  if(hair==='glatze') top=`<path d="M30 58 Q29 46 34 42 L36 58 Z M90 58 Q91 46 86 42 L84 58 Z" fill="${hc}"/>`;
  if(hair==='locken'){let c='';[[34,44],[40,32],[50,26],[61,24],[72,26],[81,32],[87,44],[45,36],[76,36],[60,33]].forEach(([x,y])=>c+=`<circle cx="${x}" cy="${y}" r="9" fill="${hc}"/>`);top=c}
  // Augenbrauen & Mund
  let br,mo,ey=3.2;
  const m=mood;
  if(m===2){br='M41 44 Q47 40 53 43 M67 43 Q73 40 79 44';mo='M48 72 Q60 82 72 72';}
  else if(m===1){br='M41 43 L53 43 M67 41 Q73 38 79 42';mo='M49 75 Q60 72 71 74';}
  else if(m===0){br='M41 41 L53 45 M67 45 L79 41';mo='M49 77 Q60 69 71 77';}
  else if(m==='s'){br='M41 40 Q47 36 53 40 M67 40 Q73 36 79 40';mo='';ey=3.8;}
  else {br='M41 43 Q47 41 53 43 M67 43 Q73 41 79 43';mo='M50 74 Q60 76 70 74';}
  const mouth = m==='s' ? `<ellipse cx="60" cy="75" rx="5" ry="6" fill="#5a2a22"/>` : `<path d="${mo}" stroke="#4a2a20" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  const wr = alt===2 ? `<path d="M37 58 l-5 -2 M37 62 l-5 1 M83 58 l5 -2 M83 62 l5 1 M50 84 Q60 88 70 84" stroke="rgba(80,50,35,.45)" stroke-width="1.5" fill="none" stroke-linecap="round"/>` : '';
  const gl = f.g ? `<g fill="none" stroke="#2a2a2a" stroke-width="2.4"><circle cx="47" cy="55" r="9"/><circle cx="73" cy="55" r="9"/><path d="M56 55 L64 55 M38 53 L30 50 M82 53 L90 50"/></g>` : '';
  const bd = f.b ? `<path d="M36 66 Q38 96 60 98 Q82 96 84 66 Q78 82 60 84 Q42 82 36 66 Z" fill="${hc}" opacity=".95"/>` : '';
  if(f.x==='kappe') extra+=`<path d="M30 46 Q30 22 60 21 Q90 22 90 46 Z" fill="#2F4F6F"/><path d="M58 44 Q84 40 102 46 Q86 50 60 48 Z" fill="#24405C"/>`;
  if(f.x==='schal') extra+=`<path d="M34 104 Q60 116 86 104 L88 116 Q60 128 32 116 Z" fill="#C8553D"/><path d="M70 112 L76 136 L66 136 L64 114 Z" fill="#A9402D"/>`;
  if(f.x==='ohrring') extra+=`<circle cx="29" cy="70" r="3" fill="#D7AE63"/><circle cx="91" cy="70" r="3" fill="#D7AE63"/>`;
  return `<svg viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  ${back}
  <path d="M14 140 Q16 108 44 102 L76 102 Q104 108 106 140 Z" fill="${sh}"/>
  <path d="M50 92 L50 106 Q60 112 70 106 L70 92 Z" fill="${sk}"/>
  <ellipse cx="30" cy="62" rx="5" ry="8" fill="${sk}"/><ellipse cx="90" cy="62" rx="5" ry="8" fill="${sk}"/>
  <ellipse cx="60" cy="60" rx="30" ry="34" fill="${sk}"/>
  ${top}${bd}

  <path d="${br}" stroke="${f.c==='weiss'||f.c==='grau'?'#8a8780':hc}" stroke-width="3.2" fill="none" stroke-linecap="round"/>

  let win='';

    win+= sold ? `<rect x="${x}" y="${y}" width="36" height="28" fill="#5E6664"/><path d="M${x} ${y+6} L${x+36} ${y+22} M${x} ${y+22} L${x+36} ${y+6}" stroke="#A6884F" stroke-width="5"/>`
               : `<rect x="${x}" y="${y}" width="36" height="28" rx="2" fill="#F6E7B8"/><rect x="${x}" y="${y}" width="36" height="28" rx="2" fill="none" stroke="${trim}" stroke-width="2"/><path d="M${x+18} ${y} V${y+28}" stroke="${trim}" stroke-width="1.5"/>`;}

  let deco='';

  if(v==='regen'){for(let i=0;i<70;i++){const x=(i*61)%400,y=(i*29)%220;deco+=`<path d="M${x} ${y} l-4 12" stroke="#9CC3D6" stroke-width="1.6" opacity=".8"/>`;}}

  <rect x="16" y="10" width="368" height="5" fill="${trim}"/>
  <path d="M16 60 H384 M16 146 H384" stroke="${trim}" stroke-width="2"/>

  <rect x="170" y="164" width="60" height="40" fill="${sold?'#5E6664':'#2B2420'}"/><rect x="172" y="166" width="27" height="38" fill="${sold?'#6D7472':'#F6E7B8'}" opacity=".85"/><rect x="201" y="166" width="27" height="38" fill="${sold?'#6D7472':'#F6E7B8'}" opacity=".85"/>
  ${awn}

const Musik={ctx:null,master:null,timer:null,step:0,on:LS.get('musik',false),tempo:118,
  ensure(){if(!this.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;this.ctx=new AC();this.master=this.ctx.createGain();this.master.gain.value=0.28;this.master.connect(this.ctx.destination)}
    if(this.ctx.state==='suspended')this.ctx.resume();return true},
  note(freq,t,dur,type,vol){const o=this.ctx.createOscillator(),g=this.ctx.createGain(),f=this.ctx.createBiquadFilter();o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=type==='sawtooth'?700:2600;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(f);f.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.05)},
  hat(t,vol){const len=0.05,b=this.ctx.createBuffer(1,this.ctx.sampleRate*len,this.ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const s=this.ctx.createBufferSource(),f=this.ctx.createBiquadFilter(),g=this.ctx.createGain();s.buffer=b;f.type='highpass';f.frequency.value=7000;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(this.master);s.start(t)},
  start(intens){if(!this.on||!this.ensure())return;this.stop();this.step=0;this.tempo=intens?132:118;
    const bass=[110,110,164.8,110,98,98,146.8,98,87.3,87.3,130.8,87.3,98,98,146.8,123.5];
    const arp=[440,523.3,659.3,523.3,392,493.9,587.3,493.9,349.2,440,523.3,440,392,493.9,587.3,659.3];
    let next=this.ctx.currentTime+0.05;
    this.timer=setInterval(()=>{const sp=60/this.tempo/2;while(next<this.ctx.currentTime+0.15){const i=this.step%16;
      this.note(bass[i],next,sp*0.9,'sawtooth',0.22);if(i%2===0)this.hat(next,0.05);else this.hat(next,0.025);
      if(this.step%2===1)this.note(arp[(this.step>>1)%16]*(this.step>63?2:1),next,sp*0.5,'square',0.035);

function parseHash(){const h=(location.hash||'').replace('#','').toLowerCase();
  if(h==='beamer')return {beamer:true};
  const m=h.match(/^m(\d{1,2})(?:-(\d{1,2}))?$/);
  if(m){let a=+m[1],b=m[2]?+m[2]:a;if(a>b)[a,b]=[b,a];a=Math.max(1,a);b=Math.min(15,b);if(a<=b){const mods=[];for(let i=a;i<=b;i++)mods.push(i);return {mods,label:a===b?`Modul ${a}`:`Module ${a}–${b}`}}}
  return {};
}
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);

function stepsAllowed(sc,mods){return sc.s.filter(st=>mods.includes(st.m))}

function baueTag(cfg,replay){
  const mods=cfg.mods||range(1,15), pro=cfg.mode==='p', n=pro?8:5;
  let seq=[];
  let scenes;
  if(replay){scenes=replay.map(id=>SZENEN.find(s=>s.id===id))}
  else{
    const ok=SZENEN.filter(s=>stepsAllowed(s,mods).length>0);
    const played=new Set(LS.get('gespielt_'+cfg.mode,[]));
    const prefer=arr=>{const f=shuffle(arr.filter(s=>!played.has(s.id))),r=shuffle(arr.filter(s=>played.has(s.id)));return f.concat(r)};
    let chosen=[];
    if(cfg.dept!=='mix'){const own=prefer(ok.filter(s=>s.d===cfg.dept));chosen=own.slice(0,Math.ceil(n*0.6))}
    const rest=prefer(ok.filter(s=>!chosen.includes(s)));
    // Abteilungen mischen: höchstens 2 aus derselben fremden Abteilung, wenn möglich
    for(const s of rest){if(chosen.length>=n)break;chosen.push(s)}
    scenes=shuffle(chosen);
    const allPlayed=ok.every(s=>played.has(s.id)||scenes.includes(s));
    const newPlayed=allPlayed?scenes.map(s=>s.id):[...played,...scenes.map(s=>s.id)];
    LS.set('gespielt_'+cfg.mode,newPlayed);
  }
  const evs=shuffle(ZWISCHENFAELLE.filter(e=>mods.includes(e.m)));
  const lucks=shuffle(GLUECK);
  const minis=shuffle(MINIS.filter(g=>mods.includes(g.m)&&(pro||!g.pro)));
  const plan=pro?['S','S','E','S','M','S','L','S','E','S','M','S','S']:['S','L','S','M','S','E','S','M','S'];
  let si=0,ei=0,mi=0,li=0;
  for(const p of plan){
    if(p==='S'){if(si<scenes.length)seq.push({type:'scene',sc:scenes[si++]})}
    if(p==='E'&&evs[ei])seq.push({type:'event',ev:evs[ei++]});
    if(p==='M'&&minis[mi])seq.push({type:'mini',g:minis[mi++]});
    if(p==='L'&&lucks[li])seq.push({type:'luck',l:lucks[li++]});
  }
  while(si<scenes.length)seq.push({type:'scene',sc:scenes[si++]});
  // Uhrzeiten 9:30 bis 19:55
  const t0=570,t1=1195;seq.forEach((it,i)=>it.t=Math.round((t0+(t1-t0)*i/(seq.length))/5)*5);
  // Investor + Details
  const sceneItems=seq.filter(x=>x.type==='scene');
  const invPos=sceneItems.length>1?1+Math.floor(Math.random()*(sceneItems.length-1)):0;
  const hints=shuffle(INVESTOR_HINWEIS),neut=shuffle(NEUTRAL_DETAIL),fake=shuffle(FALSCHE_FAEHRTE);
  const fakePos=pro&&sceneItems.length>2?pick(sceneItems.map((_,i)=>i).filter(i=>i!==invPos)):-1;
  sceneItems.forEach((it,i)=>{it.inv=i===invPos;it.detail=it.inv?hints[0]:(i===fakePos?fake[0]:neut[i%neut.length]);it.steps=stepsAllowed(it.sc,mods)});
  return {seq,ids:scenes.map(s=>s.id)};
}

function neuesSpiel(replayIds){
  const {seq,ids}=baueTag(CFG,replayIds);
  const pro=CFG.mode==='p';
  S={mode:CFG.mode,pro,team:CFG.team||'Team Kranich',dept:CFG.dept,mods:CFG.mods||range(1,15),modsLabel:CFG.modsLabel,
     seq,ids,i:-1,step:0,points:0,maxPoints:0,baro:pro?45:50,umsatz:0,kunden:0,log:[],modStat:{},joker:pro?0:1,
     guess:null,timeouts:0,custFit:{},quotes:[]};

}

   <div class="card stack small">

    ${S.pro?'<p data-tk><b>Profi:</b> Nach vielen Entscheidungen fragt euch die Kollegin nach dem Fachbegriff. Manchmal wartet eine zweite Kundin – dann läuft die Zeit.</p>':'<p data-tk><b>Anfänger:</b> Ihr habt einen Wortspeicher und einmal am Tag einen Joker: Kollegin Mia fragen.</p>'}
    <p class="muted">Module: ${esc(S.modsLabel)}</p>
   </div>
   <button class="btn brass block" id="go">9:30 Uhr – Türen auf!</button></div>`);
  $('#go').onclick=weiter;
}

/* ---------- Ablauf ---------- */
function weiter(){
  S.i++;S.step=0;
  if(S.i>=S.seq.length){ladenschluss();return}
  const it=S.seq[S.i];hud(true);
  if(it.type==='scene')zeigeSzene();
  else if(it.type==='event')zeigeEvent();
  else if(it.type==='mini')zeigeMini();
  else zeigeGlueck();
}

function stageHTML(it,mood,extraTag){
  const sc=it.sc;
  return `<div class="stage">${stageSVG(sc.d,it.t)}<div class="person" id="person">${faceSVG(sc.f,mood,sc.id)}</div>
   <div class="tag">${esc(sc.n)}<small>${esc(ABTEILUNGEN[sc.d].n)}${extraTag||''}</small></div></div>`;
}

function zeigeSzene(){
  const it=S.seq[S.i],sc=it.sc,st=it.steps[S.step];
  Musik.stop();
  const first=S.step===0;
  const startMood=(st.m===12&&first)||sc.k===0&&st.m===12?0:'n';
  const opts=S.pro?st.o.slice():st.o.filter(o=>!o.p);
  const order=shuffle(opts.map((o,i)=>i));
  const timed=S.pro&&S.step===1&&(S.seq.filter(x=>x.type==='scene').indexOf(it)%2===1);
  it.cur={st,opts,order,sel:null,locked:false,timed};
  view(`<div class="stack">
   ${stageHTML(it,startMood)}
   <div class="bubble" id="bubble">${first?esc(sc.i):esc(st.sit)}</div>
   ${first?`<div class="clue">${ICON.lupe}<span><b>Beobachtung:</b> ${esc(it.detail)}</span></div>`:''}
   <div class="card stack" id="dec">
    <p class="eyebrow">Modul ${st.m} · ${esc(MODULE[st.m].t)}</p>
    ${first?`<p class="sit">${esc(st.sit)}</p>`:''}
    <p class="q">${esc(st.q)}</p>
    ${timed?`<div><p class="small" style="color:var(--crown);font-weight:700">Eine zweite Kundin wartet schon. Ihr habt 30 Sekunden!</p><div class="timer"><i id="tbar"></i></div></div>`:''}
    <div class="opts" id="opts">${order.map((oi,k)=>`<button class="opt" data-i="${oi}" aria-pressed="false"><span class="let">${LETTERS[k]}</span><span>${esc(opts[oi].t)}</span></button>`).join('')}</div>
    ${!S.pro?`<div class="tools"><button class="tool" id="wsbtn" aria-expanded="false">${ICON.buch} Wortspeicher</button><button class="tool" id="joker" ${S.joker?'':'disabled'}>${ICON.joker} Joker: Mia fragen${S.joker?'':' (verbraucht)'}</button></div><div id="wsbox"></div>`:''}
    <button class="btn block" id="lock" disabled>Entscheidung festlegen</button>
   </div>
   <div id="after"></div></div>`);
  document.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>{if(it.cur.locked)return;it.cur.sel=+b.dataset.i;document.querySelectorAll('#opts .opt').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));$('#lock').disabled=false});
  $('#lock').onclick=()=>festlegen(false);
  if(!S.pro){
    $('#wsbtn').onclick=()=>{const box=$('#wsbox'),open=!box.innerHTML;$('#wsbtn').setAttribute('aria-expanded',open);box.innerHTML=open?`<dl class="ws">${(WORTSPEICHER[st.m]||[]).map(([a,b])=>`<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join('')}</dl>`:''};
    $('#joker').onclick=()=>{if(!S.joker)return;S.joker=0;const bad=opts.map((o,i)=>i).filter(i=>opts[i].f===0);const rm=pick(bad);const b=document.querySelector(`#opts .opt[data-i="${rm}"]`);if(b){b.classList.add('struck');b.disabled=true;if(it.cur.sel===rm){it.cur.sel=null;b.setAttribute('aria-pressed','false');$('#lock').disabled=true}}
      $('#joker').disabled=true;$('#joker').innerHTML=ICON.joker+' Joker verbraucht';const h=document.createElement('p');h.className='hint';h.innerHTML=`<b>Mia flüstert:</b> Eine Antwort ist sicher falsch. Denkt an „${esc(st.b)}“.`;$('#wsbox').before(h)};
  }
  if(timed){const T=30000,t0=Date.now();const bar=$('#tbar');
    it.cur.iv=setInterval(()=>{const r=1-(Date.now()-t0)/T;if(bar)bar.style.width=Math.max(0,r*100)+'%';if(r<=0){clearInterval(it.cur.iv);if(!it.cur.locked)festlegen(true)}},200);}
}

function festlegen(timeout){
  const it=S.seq[S.i],c=it.cur,st=c.st;if(c.locked)return;c.locked=true;if(c.iv)clearInterval(c.iv);
  let o,f;
  if(c.sel==null){o=null;f=0;S.timeouts++;timeout=true}else{o=c.opts[c.sel];f=o.f;timeout=false}
  const pts=f===2?10:f===1?5:0;S.points+=pts;S.maxPoints+=10;addMod(st.m,pts,10);
  const w=it.inv?2:1;baroAdd(S.pro?(f===2?3:f===1?0:-4)*w:(f===2?4:f===1?1:-3)*w);
  (S.custFit[S.i]=S.custFit[S.i]||[]).push(f);
  const best=st.o.find(x=>x.f===2);
  S.log.push({kind:'step',t:it.t,who:it.sc.n,inv:it.inv,m:st.m,sit:st.sit,q:st.q,chosen:o?o.t:'(keine Antwort – die Zeit war um)',f,w:o?o.w:'Die wartende Kundin ist ungeduldig geworden. Im Verkauf zählt auch das Tempo.',best:f<2?best.t:null,ihk:st.ihk,b:st.b});
  if(f===2&&o){const qq=(o.t.match(/„[^“]*“/g)||[]).join(' ');if(qq)S.quotes.push(qq)}
  document.querySelectorAll('#opts .opt').forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(i===c.sel)b.classList.add('locked-'+f)});
  $('#lock').hidden=true;const tools=document.querySelector('.tools');if(tools)tools.hidden=true;
  // Reaktion
  const mood=f===2?2:f===1?1:0;
  $('#person').innerHTML=faceSVG(it.sc.f,timeout?0:mood,it.sc.id);
  const gen={2:['Sehr gut, danke!','Genau so.','Das klingt gut.'],1:['Hm, na ja …','Okay …','Ach so.'],0:['Wie bitte?!','Na, das ist ja ein Service …','Also wirklich!']};
  const bub=$('#bubble');bub.className='bubble mood-'+mood;bub.textContent=timeout?'Hallo? Ich warte hier schon!':(o.x||pick(gen[f]));
  updHud();
  const sym=f===2?'✓':f===1?'~':'✗',lab=f===2?'Stark!':f===1?'Geht besser.':'Das ging daneben.';
  let html=`<div class="card stack"><div class="term f${f}"><span class="sym" aria-hidden="true">${sym}</span><div><span class="small muted">${lab} · Fachbegriff</span><br><b>${esc(st.b)}</b></div></div>`;
  if(S.pro&&st.a){const ao=shuffle(st.a.o.map((t,i)=>i));
    html+=`<div class="ask stack" id="ask"><p class="eyebrow">Die Kollegin fragt nach</p><p class="q" style="font-size:1.05rem">${esc(st.a.q)}</p><div class="opts">${ao.map((i,k)=>`<button class="opt" data-a="${i}"><span class="let">${LETTERS[k]}</span><span>${esc(st.a.o[i])}</span></button>`).join('')}</div></div>`;}
  html+=`<button class="btn block" id="next" ${S.pro&&st.a?'disabled':''}>Weiter</button></div>`;
  $('#after').innerHTML=html;
  if(S.pro&&st.a){S.maxPoints+=3;document.querySelectorAll('#ask .opt').forEach(b=>b.onclick=()=>{const ok=+b.dataset.a===st.a.c;document.querySelectorAll('#ask .opt').forEach(x=>{x.disabled=true;if(+x.dataset.a===st.a.c)x.classList.add('locked-2');else if(x===b)x.classList.add('locked-0')});
    if(ok){S.points+=3;addMod(st.m,3,3)}else addMod(st.m,0,3);updHud();S.log[S.log.length-1].ask={q:st.a.q,ok,ans:st.a.o[st.a.c]};$('#next').disabled=false;$('#next').focus()})}
  $('#next').onclick=()=>{S.step++;if(S.step<it.steps.length)zeigeSzene();else kundeFertig()};
  setTimeout(()=>{$('#after').scrollIntoView({behavior:reduce()?'auto':'smooth',block:'nearest'})},60);
}

function kundeFertig(){
  const it=S.seq[S.i],fits=S.custFit[S.i]||[0],avg=fits.reduce((a,b)=>a+b,0)/fits.length;
  const k=it.sc.k;let u=0;if(avg>=1.5)u=k;else if(avg>=0.75)u=Math.round(k*0.5);
  S.umsatz+=u;S.kunden+=1;it.umsatz=u;it.avg=avg;
  weiter();
}

/* ---------- Zwischenfall ---------- */
function zeigeEvent(){
  const it=S.seq[S.i],ev=it.ev;Musik.stop();
  const order=shuffle(ev.o.map((o,i)=>i));it.sel=null;
  view(`<div class="stack">
   <div class="stage">${stageSVG('zwischen',it.t)}<div class="tag">Zwischenfall<small>${fmtT(it.t)} Uhr</small></div></div>
   <div class="card stack"><p class="eyebrow">Zwischenfall · Modul ${ev.m}</p><h2>${esc(ev.t)}</h2><p class="sit">${esc(ev.sit)}</p><p class="q">${esc(ev.q)}</p>
   <div class="opts" id="opts">${order.map((oi,k)=>`<button class="opt" data-i="${oi}" aria-pressed="false"><span class="let">${LETTERS[k]}</span><span>${esc(ev.o[oi].t)}</span></button>`).join('')}</div>
   <button class="btn block" id="lock" disabled>Entscheidung festlegen</button></div><div id="after"></div></div>`);
  document.querySelectorAll('#opts .opt').forEach(b=>b.onclick=()=>{if(it.locked)return;it.sel=+b.dataset.i;document.querySelectorAll('#opts .opt').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));$('#lock').disabled=false});
  $('#lock').onclick=()=>{if(it.locked)return;it.locked=true;const o=ev.o[it.sel],f=o.f,pts=f===2?6:f===1?3:0;S.points+=pts;S.maxPoints+=6;addMod(ev.m,pts,6);baroAdd(f===2?3:f===1?0:-3);
    S.log.push({kind:'event',t:it.t,who:'Zwischenfall: '+ev.t,m:ev.m,sit:ev.sit,q:ev.q,chosen:o.t,f,w:o.w,best:f<2?ev.o.find(x=>x.f===2).t:null,b:ev.b});
    document.querySelectorAll('#opts .opt').forEach(b=>{b.disabled=true;if(+b.dataset.i===it.sel)b.classList.add('locked-'+f)});$('#lock').hidden=true;
    $('#after').innerHTML=`<div class="card stack"><div class="bubble mood-${f===2?2:f===1?1:0}" style="margin-top:0">${esc(o.x)}</div><div class="term f${f}"><span class="sym" aria-hidden="true">${f===2?'✓':f===1?'~':'✗'}</span><div><span class="small muted">Fachbegriff</span><br><b>${esc(ev.b)}</b></div></div><button class="btn block" id="next">Weiter</button></div>`;
    $('#next').onclick=weiter;$('#after').scrollIntoView({behavior:reduce()?'auto':'smooth',block:'nearest'})};
}

/* ---------- Glücks-Ereignis ---------- */
function zeigeGlueck(){
  const it=S.seq[S.i],l=it.l;Musik.stop();
  const fits=Object.values(S.custFit).flat();const avg=fits.length?fits.reduce((a,b)=>a+b,0)/fits.length:1;
  const good=avg>=1.4;const idx=good?0:1;
  S.kunden+=l.kunden[idx];S.umsatz+=l.umsatz[idx];baroAdd(l.baro[idx]);
  S.log.push({kind:'luck',t:it.t,who:l.t,txt:l.txt+' '+(good?l.gut:l.schlecht)});
  view(`<div class="stack">
   <div class="stage">${stageSVG(S.seq.find(x=>x.type==='scene')?.sc.d||'sport',it.t,{regen:l.id==='g1'})}<div class="tag">Ereignis<small>${fmtT(it.t)} Uhr</small></div></div>
   <div class="card stack"><p class="eyebrow">Ereignis</p><h2>${esc(l.t)}</h2><p>${esc(l.txt)}</p>
   <div class="term ${good?'f2':'f0'}"><span class="sym" aria-hidden="true">${good?'+':'–'}</span><div>${esc(good?l.gut:l.schlecht)}</div></div>
   <p class="small muted">Das hängt davon ab, wie zufrieden eure Kundschaft bisher war.${l.kunden[idx]?` · ${l.kunden[idx]} Kunden mehr`:''}${l.umsatz[idx]?` · ${l.umsatz[idx]} € Umsatz`:''}</p>
   <button class="btn block" id="next">Weiter</button></div></div>`);
  $('#next').onclick=weiter;
}

/* ---------- Mini-Spiel ---------- */
function zeigeMini(){
  const it=S.seq[S.i],g=it.g,n=S.pro?10:8,T=S.pro?50:65;
  // möglichst jede Kategorie vertreten
  let items=[];const byCat=g.k.map((_,ci)=>shuffle(g.it.filter(x=>x[1]===ci)));
  let ci=0;while(items.length<Math.min(n,g.it.length)){const arr=byCat[ci%g.k.length];if(arr.length)items.push(arr.shift());ci++;if(ci>200)break}
  items=shuffle(items);
  it.res=[];let k=0,t0=0,iv=null,running=false;
  view(`<div class="stack">
   <div class="stage">${stageSVG('mini',it.t)}<div class="tag">Mini-Spiel · Modul ${g.m}<small>${esc(MODULE[g.m].t)}</small></div></div>
   <div class="card stack" id="mini"><h2>${esc(g.t)}</h2><p>${esc(g.auf)} Ihr habt ${T} Sekunden für ${items.length} Karten. Jede richtige Karte bringt 2 Punkte.</p>
   ${Musik.on?'':'<p class="small muted">Tipp: Oben rechts könnt ihr spannende Musik einschalten.</p>'}
   <button class="btn brass block" id="startmini">Start!</button></div></div>`);
  $('#startmini').onclick=()=>{running=true;Musik.start(true);t0=Date.now();
    $('#mini').innerHTML=`<div class="mini-head"><b>${esc(g.t)}</b><span><span id="mk">1</span>/${items.length}</span></div><div class="timer"><i id="tbar"></i></div><div class="mini-item" id="card" aria-live="polite"></div><div class="cats ${g.k.length===3?'c3':''}">${g.k.map((c,i)=>`<button class="btn ghost" data-c="${i}">${esc(c)}</button>`).join('')}</div>`;
    const show=()=>{$('#card').className='mini-item';$('#card').textContent=items[k][0];$('#mk').textContent=k+1};
    show();let busy=false;
    document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{if(!running||busy)return;const ok=+b.dataset.c===items[k][1];it.res.push({t:items[k][0],ok,c:g.k[items[k][1]]});
      const card=$('#card');card.className='mini-item '+(ok?'ok':'no');if(!ok)card.textContent='Richtig wäre: '+g.k[items[k][1]];busy=true;
      setTimeout(()=>{busy=false;if(!running)return;k++;if(k>=items.length)ende();else show()},ok?280:1000)});
    iv=setInterval(()=>{const r=1-(Date.now()-t0)/(T*1000);const bar=$('#tbar');if(bar)bar.style.width=Math.max(0,r*100)+'%';if(r<0.35&&!it.fast){it.fast=1;Musik.speedUp()}if(r<=0)ende()},200);
    function ende(){if(!running)return;running=false;clearInterval(iv);Musik.stop();
      for(let j=k;j<items.length;j++)if(!it.res[j])it.res.push({t:items[j][0],ok:false,c:g.k[items[j][1]],miss:true});
      const right=it.res.filter(r=>r.ok).length,pts=right*2;S.points+=pts;S.maxPoints+=items.length*2;addMod(g.m,pts,items.length*2);
      baroAdd(Math.round((right/items.length-0.5)*8));
      S.log.push({kind:'mini',t:it.t,who:'Mini-Spiel: '+g.t,m:g.m,right,total:items.length,wrong:it.res.filter(r=>!r.ok)});
      $('#mini').innerHTML=`<h2>${right} von ${items.length} richtig</h2><p>+${pts} Punkte</p>
       <ul class="res-list">${it.res.map(r=>`<li><span class="mk ${r.ok?'y':'n'}" aria-hidden="true">${r.ok?'✓':'✗'}</span><span>${esc(r.t)} → <b>${esc(r.c)}</b>${r.miss?' <span class="muted">(Zeit um)</span>':''}</span></li>`).join('')}</ul>
       <button class="btn block" id="next">Weiter</button>`;$('#next').onclick=weiter;updHud()}
  };
}

/* ---------- Ladenschluss ---------- */
function ladenschluss(){
  hud(true);$('#h-t')&&($('#h-t').textContent='19:55');
  const kunden=S.kunden+38; // Laufkundschaft der Abteilung ohne Beratung
  view(`<div class="stack">
   <div class="hero">${facadeSVG('start')}</div>
   <div class="walk" aria-hidden="true">${[0,1,2,3,4].map(i=>`<span style="position:absolute;inset:0">${figureSVG(SHIRT[i]).replace('<svg','<svg style="animation-delay:'+(i*0.45)+'s"')}</span>`).join('')}</div>
   <p class="eyebrow">19:55 Uhr · Ladenschluss</p><h2>Die letzten Kunden gehen.</h2>
   <div class="counters"><div class="counter"><b id="c1">0</b><span>Kunden heute</span></div><div class="counter"><b id="c2">0 €</b><span>euer Umsatz</span></div><div class="counter"><b id="c3">0</b><span>Punkte</span></div></div>
   <button class="btn brass block" id="next" disabled>Wer war der Investor?</button></div>`);
  Musik.start(true);
  const run=(id,to,suf)=>{const el=$('#'+id);if(reduce()){el.textContent=to+(suf||'');return}const t0=performance.now(),D=1800;const f=t=>{const r=Math.min(1,(t-t0)/D);el.textContent=Math.round(to*(1-Math.pow(1-r,3)))+(suf||'');if(r<1)requestAnimationFrame(f)};requestAnimationFrame(f)};
  run('c1',kunden);run('c2',S.umsatz,' €');run('c3',S.points);
  setTimeout(()=>{Musik.stop();Musik.tusch();$('#next').disabled=false;$('#next').focus()},reduce()?100:2100);
  $('#next').onclick=raten;
}

function raten(){
  const sc=S.seq.filter(x=>x.type==='scene');
  view(`<div class="stack"><p class="eyebrow">Die große Frage</p><h2>Wer von euren Kundinnen und Kunden war der Investor?</h2>
   <p>Erinnert euch an die Beobachtungen. Richtig geraten bringt 10 Punkte.</p>
   <div class="suspects">${sc.map((it,i)=>`<button class="suspect" data-i="${i}" aria-pressed="false">${faceSVG(it.sc.f,'n',it.sc.id)}<span>${esc(it.sc.n)}</span><span class="small muted" style="font-weight:400">${fmtT(it.t)}</span></button>`).join('')}</div>
   <button class="btn brass block" id="next" disabled>Das ist unser Tipp</button></div>`);
  let g=null;document.querySelectorAll('.suspect').forEach(b=>b.onclick=()=>{g=+b.dataset.i;document.querySelectorAll('.suspect').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));$('#next').disabled=false});
  $('#next').onclick=()=>{const inv=sc.findIndex(x=>x.inv);S.guess=g;S.guessOk=g===inv;S.maxPoints+=10;if(S.guessOk)S.points+=10;updHud();aufloesung(sc,inv)};
}

function gaugeSVG(v){const a=Math.PI*(1-v/100),x=150+110*Math.cos(a),y=150-110*Math.sin(a);
  const arc=(from,to,col)=>{const a1=Math.PI*(1-from/100),a2=Math.PI*(1-to/100);return `<path d="M${150+120*Math.cos(a1)} ${150-120*Math.sin(a1)} A120 120 0 0 1 ${150+120*Math.cos(a2)} ${150-120*Math.sin(a2)}" stroke="${col}" stroke-width="22" fill="none"/>`};
  return `<svg viewBox="0 0 300 180" role="img" aria-label="Investor-Barometer: ${v} von 100">${arc(0,55,'var(--bad)')}${arc(55,75,'var(--ok)')}${arc(75,100,'var(--good)')}
  <path d="M150 150 L${x} ${y}" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="150" r="9" fill="var(--crown)"/>
  <text x="150" y="174" text-anchor="middle" font-family="Josefin Sans,sans-serif" font-weight="700" font-size="22" fill="var(--ink)">${v} / 100</text>
  <text x="22" y="172" font-size="12" fill="var(--muted)">verkauft</text><text x="278" y="172" text-anchor="end" font-size="12" fill="var(--muted)">gerettet</text></svg>`}

function aufloesung(sc,inv){
  const it=sc[inv];
  const end=S.baro>=75?'gerettet':S.baro>=55?'auflagen':'verkauft';S.end=end;
  const invFit=(S.custFit[S.seq.indexOf(it)]||[]).reduce((a,b)=>a+b,0)/(it.steps.length||1);
  view(`<div class="stack">
   <div class="card stack" style="align-items:center;text-align:center">
    <p class="eyebrow">Auflösung</p>
    <div style="width:140px">${faceSVG(it.sc.f,invFit>=1.5?2:invFit>=1?1:0,it.sc.id)}</div>
    <h2>${esc(it.sc.n)} war ${it.sc.n.startsWith('Frau')?'die Investorin':'der Investor'}!</h2>
    <p>Hinweis um ${fmtT(it.t)} Uhr: „${esc(it.detail)}“</p>
    <div class="term ${S.guessOk?'f2':'f0'}" style="text-align:left"><span class="sym" aria-hidden="true">${S.guessOk?'✓':'✗'}</span><div>${S.guessOk?'Richtig geraten! +10 Punkte.':`Euer Tipp: ${esc(sc[S.guess].sc.n)}. Leider falsch.`}</div></div>
   </div>
   <div class="gauge">${gaugeSVG(S.baro)}</div>
   <div class="ending">${facadeSVG(end)}<div class="tx stack"><h2>${esc(ENDEN[end].t)}</h2><p>${esc(ENDEN[end].txt)}</p></div></div>
   <button class="btn brass block" id="next">Zur Auswertung</button></div>`);
  if(end==='gerettet')Musik.tusch();
  $('#next').onclick=auswertung;
}

/* ---------- Auswertung ---------- */
function pruefcode(team,p,mode){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let h=hashStr(team.toLowerCase().trim()+'|'+p+'|'+mode+'|kranich');let s='';for(let i=0;i<3;i++){s+=A[h%A.length];h=Math.floor(h/A.length)}return s}

function auswertung(){
  Musik.stop();
  const pct=S.maxPoints?S.points/S.maxPoints:0;
  const stars=pct>=0.9?5:pct>=0.75?4:pct>=0.6?3:pct>=0.4?2:1;
  const key='rekord_'+S.mode,rec=LS.get(key,null);let neu=false;
  if(!rec||S.points>rec.p){LS.set(key,{p:S.points,team:S.team});neu=true}
  const code=pruefcode(S.team,S.points,S.mode);
  // Landkarte
  const tiles=range(1,15).map(m=>{const s=S.modStat[m];if(!s||!s.x)return `<div class="tile"><b>${m}</b><span class="nm">${esc(MODULE[m].t.split(' ')[0])}</span><span class="pc muted">–</span></div>`;
    const p=s.g/s.x,c=p>=0.75?'g':p>=0.4?'m':'r';return `<div class="tile ${c}"><b>${m}</b><span class="nm">${esc(MODULE[m].t.split(' ')[0])}</span><span class="pc">${Math.round(p*100)} %</span></div>`}).join('');
  const nach=range(1,15).filter(m=>S.modStat[m]&&S.modStat[m].x&&S.modStat[m].g/S.modStat[m].x<0.75).sort((a,b)=>S.modStat[a].g/S.modStat[a].x-S.modStat[b].g/S.modStat[b].x).slice(0,3);
  // Für Profis
  const played=Object.keys(S.modStat).map(Number);
  const pool=PROFIFRAGEN.filter(q=>played.includes(q.m));const pidx=LS.get('profiIdx',0);const pf=pool.length?pool[pidx%pool.length]:PROFIFRAGEN[pidx%PROFIFRAGEN.length];LS.set('profiIdx',pidx+1);
  // Sätze fürs Heft
  const quotes=[...new Set(S.quotes)].slice(0,6);
  const fallback=S.log.filter(l=>l.ihk&&l.ihk.startsWith('„')).map(l=>l.ihk);
  const rev=S.log.map(l=>{
    if(l.kind==='step'||l.kind==='event'){const sym=l.f===2?'✓':l.f===1?'~':'✗';
      return `<div class="revi f${l.f}"><div class="hd"><span class="sym" aria-hidden="true">${sym}</span><div><b>${esc(l.who)}</b>${l.inv?' <span class="small" style="color:var(--brass);font-weight:700">· Investor</span>':''}<div class="small muted">${fmtT(l.t)} Uhr · Modul ${l.m} · ${esc(MODULE[l.m].t)}</div></div></div>
      <p class="small muted">${esc(l.sit)}</p>
      <div><p class="lab">Eure Entscheidung</p><p>${esc(l.chosen)}</p></div>
      <div><p class="lab">Darum</p><p>${esc(l.w)}</p></div>
      ${l.best?`<div class="better"><p class="lab">Besser</p><p>${esc(l.best)}</p></div>`:''}
      ${l.ask?`<p class="small">${l.ask.ok?'✓':'✗'} Nachfrage: ${esc(l.ask.q)} → <b>${esc(l.ask.ans)}</b></p>`:''}
      ${l.ihk?`<div class="ihk"><p class="lab">So steht es in der Prüfung</p><p>${esc(l.ihk)}</p></div>`:''}</div>`}
    if(l.kind==='mini')return `<div class="revi ${l.right/l.total>=0.75?'f2':l.right/l.total>=0.5?'f1':'f0'}"><div class="hd"><span class="sym" aria-hidden="true">${l.right}</span><div><b>${esc(l.who)}</b><div class="small muted">Modul ${l.m} · ${l.right} von ${l.total} richtig</div></div></div>${l.wrong.length?`<ul class="res-list">${l.wrong.map(r=>`<li><span class="mk n" aria-hidden="true">✗</span><span>${esc(r.t)} → <b>${esc(r.c)}</b></span></li>`).join('')}</ul>`:''}</div>`;
    return `<div class="revi"><div class="hd"><b>${esc(l.who)}</b></div><p class="small">${esc(l.txt)}</p></div>`}).join('');
  hud(true);
  view(`<div class="stack">
   <div class="scorecard" id="scorecard"><div class="top"><span class="lg">Kaufhaus Kranich</span><span class="small">${S.pro?'Profi':'Anfänger'} · ${new Date().toLocaleDateString('de-DE')}</span></div>
    <div class="body"><div class="big"><b>${S.points}</b><span>Punkte von ${S.maxPoints}</span><span class="stars" aria-label="${stars} von 5 Sternen">${'★'.repeat(stars)}${'☆'.repeat(5-stars)}</span></div>
     <div class="kv"><span>Team</span><b>${esc(S.team)}</b></div><div class="kv"><span>Ergebnis</span><b>${esc(ENDEN[S.end].t)}</b></div>
     <div class="kv"><span>Investor-Barometer</span><b>${S.baro} / 100</b></div><div class="kv"><span>Umsatz</span><b>${S.umsatz} €</b></div>
     <div class="kv"><span>Abteilung</span><b>${S.dept==='mix'?'Ganzes Haus':esc(ABTEILUNGEN[S.dept].k)}</b></div><div class="kv"><span>Prüfcode</span><b class="code">${code}</b></div>
     ${neu?`<div class="kv" style="grid-column:1/-1"><b style="color:var(--brass)">Neuer Rekord auf diesem Gerät!</b></div>`:''}
    </div></div>
   <p class="note">Zeigt diese Karte eurer Lehrkraft. Punkte und Prüfcode gehören zusammen. Der Rekord bleibt nur auf diesem Gerät.</p>

   <div class="card stack"><h2>Eure Lernfeld-Landkarte</h2>
    <div class="map">${tiles}</div>
    <div class="legend"><span><i style="background:var(--good-soft);border-color:var(--good)"></i>sicher (ab 75 %)</span><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>wackelig</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>nachlernen</span><span><i style="background:var(--surface2);border-color:var(--line)"></i>heute nicht dran</span></div>
    ${nach.length?`<div class="stack small"><b>Hier lohnt sich das Nachlernen:</b>${nach.map(m=>`<p>Modul ${m} · ${esc(MODULE[m].t)} – Lehrbuch S. ${MODULE[m].s}</p>`).join('')}</div>`:'<p class="small"><b>Alles, was heute dran war, sitzt.</b> Probiert den Profi-Modus oder andere Module.</p>'}
   </div>

   <div class="card stack"><h2>Ins Heft</h2>
    <p>Wählt euren besten Satz. Schreibt ihn mit Anführungszeichen ins Heft – so will es die Prüfung.</p>
    <div class="opts" id="quotes">${(quotes.length?quotes:fallback.slice(0,3)).map((q,i)=>`<button class="opt" data-q="${i}" aria-pressed="false"><span class="let">${i+1}</span><span>${esc(q)}</span></button>`).join('')}</div>
    <div id="heft"></div>
   </div>

   <div class="card stack"><p class="eyebrow">Für Profis · Modul ${pf.m}</p><h2>${esc(pf.q)}</h2>
    <p class="small muted">Erst selbst schriftlich beantworten, dann vergleichen.</p>
    <details class="sol"><summary>Musterlösung zeigen</summary><p>${esc(pf.a)}</p></details></div>

   <div class="stack"><h2>Alle Entscheidungen im Rückblick</h2><div class="rev">${rev}</div></div>

   <div class="card stack"><h2>Noch eine Runde?</h2>
    <button class="btn brass block" id="r1">Neuer Samstag – andere Kundschaft</button>
    <button class="btn block" id="r2">Gleiche Kundschaft – besser machen</button>
    <button class="btn ghost block" id="r3">Anderen Modus oder andere Abteilung wählen</button></div>
  </div>`);
  const qs=quotes.length?quotes:fallback.slice(0,3);
  document.querySelectorAll('#quotes .opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('#quotes .opt').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));$('#heft').innerHTML=`<div class="heft">${esc(qs[+b.dataset.q])}</div><p class="note">Abschreiben mit Anführungszeichen: „ … “</p>`});
  $('#r1').onclick=()=>neuesSpiel();
  $('#r2').onclick=()=>neuesSpiel(S.ids);
  $('#r3').onclick=()=>{location.hash='';zeigeStart()};
}

/* ---------- Beamer-Rangliste ---------- */
function zeigeBeamer(){
  Musik.stop();S=null;hud(false);
  const list=LS.get('beamer',[]);
  const sorted=list.slice().sort((a,b)=>b.p-a.p);
  const pod=sorted.slice(0,3);
  view(`<div class="stack">
   <div class="row" style="justify-content:space-between"><h1 style="font-family:var(--f-logo);font-weight:400;font-size:2rem">Rangliste</h1><a href="#" id="back" style="color:var(--petrol);font-weight:700">Zurück zum Spiel</a></div>
   <p class="muted">Die Teams zeigen ihre Punktekarte. Tragt Name, Punkte und Prüfcode ein. Stimmt der Code, erscheint ein Häkchen. Die Liste bleibt nur in diesem Browser.</p>
   ${pod.length?`<div class="podium">${[pod[1],pod[0],pod[2]].map((e,i)=>e?`<div class="pod p${[2,1,3][i]}"><div class="small">Platz ${[2,1,3][i]}</div><b>${e.p}</b><div>${esc(e.team)}</div></div>`:'<div></div>').join('')}</div>`:''}
   <form class="card bform" id="bf" autocomplete="off">
    <div class="full"><label class="lbl" for="bt">Team</label><input id="bt" type="text" maxlength="24" required></div>
    <div><label class="lbl" for="bp">Punkte</label><input id="bp" type="number" min="0" max="999" required></div>
    <div><label class="lbl" for="bm">Modus</label><select id="bm"><option value="a">Anfänger</option><option value="p">Profi</option></select></div>
    <div><label class="lbl" for="bc">Prüfcode</label><input id="bc" type="text" maxlength="3" style="text-transform:uppercase"></div>
    <button class="btn" type="submit">Eintragen</button></form>
   <div class="board">${sorted.map((e,i)=>`<div class="bline"><span class="pl">${i+1}</span><span>${esc(e.team)} <span class="small muted">${e.m==='p'?'Profi':'Anfänger'}${e.ok?' · ✓ geprüft':e.c?' · Code passt nicht':''}</span></span><span class="pt">${e.p}</span><button class="x" data-del="${list.indexOf(e)}" aria-label="${esc(e.team)} löschen">✕</button></div>`).join('')||'<p class="muted">Noch keine Einträge.</p>'}</div>
   ${list.length?`<div class="row"><button class="btn ghost" id="clr">Liste leeren</button><span id="clrq"></span></div>`:''}
  </div>`);
  $('#back').onclick=e=>{e.preventDefault();location.hash='';zeigeStart()};
  $('#bf').onsubmit=e=>{e.preventDefault();const team=$('#bt').value.trim(),p=parseInt($('#bp').value,10),m=$('#bm').value,c=$('#bc').value.trim().toUpperCase();if(!team||isNaN(p))return;
    list.push({team,p,m,c,ok:c?c===pruefcode(team,p,m):false});LS.set('beamer',list);zeigeBeamer()};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.del,1);LS.set('beamer',list);zeigeBeamer()});
  const clr=$('#clr');if(clr)clr.onclick=()=>{$('#clrq').innerHTML='Wirklich alles löschen? <button class="btn" id="clr2" style="min-height:44px">Ja, löschen</button>';$('#clr2').onclick=()=>{LS.set('beamer',[]);zeigeBeamer()}};
}

/* ---------- Start ---------- */
function init(){
  $('#hud').innerHTML=`<div class="hud-in"><span class="logo">${craneLogo('currentColor','#E5664F')}<span class="lt">Kaufhaus Kranich</span></span><div class="stats"></div><div id="sprachbar" role="group" aria-label="Sprache"><span aria-hidden="true">🌐</span><button type="button" data-l="de" title="Deutsch">DE</button><button type="button" data-l="vi" title="Tiếng Việt" lang="vi">VI</button><button type="button" data-l="tr" title="Türkçe" lang="tr">TR</button><button type="button" data-l="ar" title="العربية" lang="ar">AR</button></div><button class="iconbtn" id="musikbtn" aria-pressed="false"></button></div>`;
  updMusikBtn();$('#musikbtn').onclick=()=>Musik.toggle();
  if(parseHash().beamer)zeigeBeamer();else zeigeStart();
  window.addEventListener('hashchange',()=>{const h=parseHash();if(h.beamer)zeigeBeamer();else if(!S){if(h.mods){CFG.mods=h.mods;CFG.modsLabel=h.label}zeigeStart()}});
}
init();

</script>
</body>
</html>
