0 istemiştim.", "ar": "أنا أردت 200."}, "Aha …": {"vi": "À …", "tr": "Aha …", "ar": "آها …"}, "Genau so etwas suche ich.": {"vi": "Đúng thứ tôi đang tìm.", "tr": "Tam aradığım şey.", "ar": "هذا بالضبط ما أبحث عنه."}, "Das probiere ich!": {"vi": "Tôi sẽ thử!", "tr": "Bunu deneyeceğim!", "ar": "سأجرّب ذلك!"}, "Und was heißt das?": {"vi": "Vậy nghĩa là gì?", "tr": "Bu ne anlama geliyor?", "ar": "وماذا يعني هذا؟"}, "Schädlich?!": {"vi": "Có hại à?!", "tr": "Zararlı mı?!", "ar": "ضار؟!"}, "Ah, so ist das. Das ist fair.": {"vi": "À, ra vậy. Vậy là công bằng.", "tr": "Ah, öyle demek. Bu adil.", "ar": "آه، هكذا إذن. هذا عادل."}, "Na danke.": {"vi": "Cảm ơn nhé.", "tr": "Sağ olun.", "ar": "شكرًا جزيلًا."}, "(später) Was sind das für 9 Euro?!": {"vi": "(sau đó) 9 euro này là gì vậy?!", "tr": "(sonra) Bu 9 Euro da ne?!", "ar": "(لاحقًا) ما هذه الـ 9 يورو؟!"}, "Ja, so machen wir das.": {"vi": "Vâng, vậy nhé.", "tr": "Evet, öyle yapalım.", "ar": "نعم، لنفعل ذلك."}, "So nicht.": {"vi": "Không như vậy.", "tr": "Böyle olmaz.", "ar": "ليس هكذا."}, "(wartet)": {"vi": "(chờ)", "tr": "(bekliyor)", "ar": "(ينتظر)"}, "Ich fühle mich überrumpelt.": {"vi": "Tôi thấy bị dồn ép.", "tr": "Kendimi köşeye sıkıştırılmış hissediyorum.", "ar": "أشعر أنني تعرضت للمفاجأة والضغط."}, "Na, das ist doch ein Wort.": {"vi": "Vậy mới là lời nói chứ.", "tr": "İşte bu iş.", "ar": "هذا هو الكلام الصحيح."}, "Finde ich nicht.": {"vi": "Tôi không thấy vậy.", "tr": "Bana öyle gelmiyor.", "ar": "لا أرى ذلك."}, "Hm. Sieht nicht so aus.": {"vi": "Hm. Trông không giống vậy.", "tr": "Hm. Öyle görünmüyor.", "ar": "همم. لا يبدو كذلك."}, "Was?": {"vi": "Gì cơ?", "tr": "Ne?", "ar": "ماذا؟"}, "Na gut, ich probiere.": {"vi": "Thôi được, tôi thử.", "tr": "Peki, deneyeceğim.", "ar": "حسنًا، سأجرّب."}, "Frechheit.": {"vi": "Láo xược.", "tr": "Terbiyesizlik.", "ar": "وقاحة."}, "Und Sie?": {"vi": "Còn cô thì sao?", "tr": "Peki ya siz?", "ar": "وماذا عنكِ؟"}, "Hä?": {"vi": "Hả?", "tr": "Hä?", "ar": "ماذا؟"}, "Zum Braten. Geht das damit?": {"vi": "Để chiên xào. Dùng được không?", "tr": "Kızartma için. Bununla olur mu?", "ar": "للقلي. هل يصلح لذلك؟"}, "Ich schau mir das Öl an.": {"vi": "Tôi xem thử dầu này.", "tr": "Şu yağa bakıyorum.", "ar": "أنظر إلى هذا الزيت."}, "Jetzt schon.": {"vi": "Có, thường xuyên.", "tr": "Evet, şimdi evet.", "ar": "نعم، الآن نعم."}, "Ja, Steaks. Gut, dass Sie fragen.": {"vi": "Vâng, bít tết. May mà cô hỏi.", "tr": "Evet, biftek. İyi ki sordunuz.", "ar": "نعم، شرائح اللحم. من الجيد أنك سألت."}, "Wieso?": {"vi": "Tại sao?", "tr": "Neden?", "ar": "لماذا؟"}, "Dann frag ich wen anders.": {"vi": "Vậy tôi hỏi người khác.", "tr": "O zaman başkasına sorarım.", "ar": "إذن سأسأل شخصًا آخر."}, "(Herr Baumann schaut beleidigt.)": {"vi": "(Ông Baumann tỏ vẻ bị xúc phạm.)", "tr": "(Bay Baumann gücenmiş görünüyor.)", "ar": "(يبدو السيد باومان مستاءً.)"}, "(Mia grinst.)": {"vi": "(Mia cười toe.)", "tr": "(Mia sırıtıyor.)", "ar": "(تبتسم ميا بسخرية.)"}, "(Mia: „Ich will ihm doch nichts aufzwingen.“)": {"vi": "(Mia: „Tôi đâu muốn ép ông ấy.“)", "tr": "(Mia: „Ona bir şey dayatmak istemiyorum ki.“)", "ar": "(ميا: „لا أريد أن أفرض عليه شيئًا.“)"}, "(Mia: „Hm?“)": {"vi": "(Mia: „Hm?“)", "tr": "(Mia: „Hm?“)", "ar": "(ميا: „همم؟“)"}, "Gern. Oh, der duftet!": {"vi": "Vâng. Ồ, thơm quá!", "tr": "Memnuniyetle. Oh, ne güzel kokuyor!", "ar": "بكل سرور. آه، رائحته جميلة!"}, "Ich gehe.": {"vi": "Tôi đi đây.", "tr": "Gidiyorum.", "ar": "سأذهب."}, "Oh, dann nehme ich drei!": {"vi": "Ồ, vậy tôi lấy ba!", "tr": "Oh, o zaman üç tane alıyorum!", "ar": "آه، إذن سآخذ ثلاثًا!"}, "(geht weiter)": {"vi": "(đi tiếp)", "tr": "(yoluna devam ediyor)", "ar": "(تتابع طريقها)"}, "Und was kosten die?": {"vi": "Và giá bao nhiêu?", "tr": "Peki fiyatı ne kadar?", "ar": "وكم سعرها؟"}, "Dann lieber nicht.": {"vi": "Vậy thì thôi.", "tr": "O zaman olmasın.", "ar": "إذن لا."}, "Stimmt, da ist für jeden was dabei.": {"vi": "Đúng, có đủ thứ cho mọi người.", "tr": "Doğru, herkes için bir şey var.", "ar": "صحيح، فيها شيء للجميع."}, "Na toll.": {"vi": "Hay lắm.", "tr": "Çok güzel.", "ar": "رائع جدًا."}, "Haha … na ja.": {"vi": "Haha … ừ thì.", "tr": "Haha … neyse.", "ar": "ههه … حسنًا."}, "Endlich! Ich suche Pfefferminztee.": {"vi": "Cuối cùng! Tôi tìm trà bạc hà.", "tr": "Sonunda! Nane çayı arıyorum.", "ar": "أخيرًا! أبحث عن شاي النعناع."}, "(gibt auf und geht)": {"vi": "(bỏ cuộc và đi)", "tr": "(vazgeçip gidiyor)", "ar": "(يستسلم ويغادر)"}, "Äh … danke?": {"vi": "Ờ … cảm ơn?", "tr": "Ee … teşekkürler?", "ar": "آه … شكرًا؟"}, "Ja … ich suche Tee.": {"vi": "Vâng … tôi tìm trà.", "tr": "Evet … çay arıyorum.", "ar": "نعم … أبحث عن الشاي."}, "Ah, logisch.": {"vi": "À, hợp lý.", "tr": "Ah, mantıklı.", "ar": "آه، منطقي."}, "Ach so?": {"vi": "Vậy à?", "tr": "Öyle mi?", "ar": "حقًا؟"}, "Was ist das?": {"vi": "Cái đó là gì?", "tr": "Bu nedir?", "ar": "ما هذا؟"}, "(ruhiger) Hier ist er.": {"vi": "(bình tĩnh hơn) Đây này.", "tr": "(daha sakin) İşte burada.", "ar": "(أكثر هدوءًا) ها هو."}, "Ich lüge also?!": {"vi": "Vậy tôi nói dối à?!", "tr": "Yani ben yalan mı söylüyorum?!", "ar": "إذن أنا أكذب؟!"}, "Ich rede doch mit Ihnen!": {"vi": "Tôi đang nói chuyện với cô mà!", "tr": "Sizinle konuşuyorum ya!", "ar": "أنا أتحدث إليك!"}, "Das hilft mir jetzt auch nicht.": {"vi": "Điều đó giờ cũng chẳng giúp được tôi.", "tr": "Bu da şimdi bana yardımcı olmuyor.", "ar": "وهذا لا يساعدني الآن أيضًا."}, "(Kollegin: „Genau!“)": {"vi": "(Đồng nghiệp: „Đúng vậy!“)", "tr": "(Meslektaş: „Aynen!“)", "ar": "(الزميلة: „بالضبط!“)"}, "(Kollegin: „Falsch gedacht.“)": {"vi": "(Đồng nghiệp: „Nghĩ sai rồi.“)", "tr": "(Meslektaş: „Yanlış düşündün.“)", "ar": "(الزميلة: „فكرت بشكل خاطئ.“)"}, "(Kollegin: „Das ist nicht der Grund.“)": {"vi": "(Đồng nghiệp: „Đó không phải lý do.“)", "tr": "(Meslektaş: „Sebep bu değil.“)", "ar": "(الزميلة: „هذا ليس السبب.“)"}, "(Kollegin: „Bloß nicht.“)": {"vi": "(Đồng nghiệp: „Tuyệt đối không.“)", "tr": "(Meslektaş: „Sakın.“)", "ar": "(الزميلة: „إياك.“)"}, "Der letzte Samstag": {"vi": "Ngày thứ Bảy cuối cùng", "tr": "Son cumartesi", "ar": "السبت الأخير"}, "Ein Spiel zu Lernfeld 2 · Verkaufsgespräche kundenorientiert führen": {"vi": "Một trò chơi cho lĩnh vực học 2 · Thực hiện các cuộc trò chuyện bán hàng theo hướng khách hàng", "tr": "Öğrenme alanı 2 için bir oyun · Satış görüşmelerini müşteri odaklı yürütmek", "ar": "لعبة لمجال التعلّم 2 · إجراء محادثات البيع بما يتمحور حول العميل"}, "Das Kaufhaus Kranich in Bremerhaven ist 70 Jahre alt. Die Inhaberin will verkaufen. Heute entscheidet ein Investor, ob das Haus mit seinem Team bleibt – oder ein Paketlager wird.": {"vi": "Cửa hàng bách hóa Kranich ở Bremerhaven đã 70 tuổi. Bà chủ muốn bán. Hôm nay một nhà đầu tư quyết định xem cửa hàng có tiếp tục tồn tại cùng đội ngũ của mình – hay sẽ trở thành kho chứa bưu kiện.", "tr": "Bremerhaven'daki Kaufhaus Kranich 70 yaşında. Sahibi satmak istiyor. Bugün bir yatırımcı, mağazanın ekibiyle birlikte kalıp kalmayacağına – yoksa bir kargo deposuna dönüşüp dönüşmeyeceğine karar verecek.", "ar": "متجر Kranich في بريمرهافن عمره 70 عامًا. صاحبته تريد البيع. اليوم يقرّر مستثمر ما إذا كان المتجر سيبقى مع فريقه – أم سيتحوّل إلى مستودع طرود."}, "Das Problem: Das Stammpersonal ist auf Fortbildung. Ihr steht allein auf der Fläche. Und der Investor kommt verkleidet – als ganz normaler Kunde. Wer es ist, wisst ihr nicht.": {"vi": "Vấn đề: Nhân viên chính đi tập huấn. Các bạn đứng một mình trên sàn bán hàng. Và nhà đầu tư đến cải trang – như một khách hàng bình thường. Các bạn không biết đó là ai.", "tr": "Sorun: Kadrolu personel eğitimde. Siz reyonda yalnızsınız. Ve yatırımcı kılık değiştirerek geliyor – sıradan bir müşteri gibi. Kim olduğunu bilmiyorsunuz.", "ar": "المشكلة: الموظفون الدائمون في دورة تدريبية. أنتم وحدكم في الصالة. والمستثمر يأتي متنكرًا – كعميل عادي تمامًا. لا تعرفون من هو."}, "Euer Teamname": {"vi": "Tên đội của các bạn", "tr": "Takım adınız", "ar": "اسم فريقكم"}, "Modus": {"vi": "Chế độ", "tr": "Mod", "ar": "النمط"}, "Anfänger": {"vi": "Người mới", "tr": "Başlangıç", "ar": "مبتدئ"}, "5 Kunden, 3 Antworten": {"vi": "5 khách hàng, 3 đáp án", "tr": "5 müşteri, 3 cevap", "ar": "5 عملاء، 3 إجابات"}, "Wortspeicher und 1 Joker": {"vi": "Kho từ và 1 Joker", "tr": "Kelime deposu ve 1 joker", "ar": "مخزن كلمات وجوكر واحد"}, "2 Mini-Spiele": {"vi": "2 trò chơi nhỏ", "tr": "2 mini oyun", "ar": "لعبتان صغيرتان"}, "Profi": {"vi": "Chuyên nghiệp", "tr": "Profesyonel", "ar": "محترف"}, "8 Kunden, 4 Antworten mit Fallen": {"vi": "8 khách hàng, 4 đáp án có bẫy", "tr": "8 müşteri, 4 cevap (tuzaklı)", "ar": "8 عملاء، 4 إجابات مع فخاخ"}, "Fachbegriff-Nachfragen, Zeitdruck": {"vi": "Hỏi lại thuật ngữ, áp lực thời gian", "tr": "Terim soruları, zaman baskısı", "ar": "أسئلة عن المصطلحات، ضغط الوقت"}, "Fehler der Kollegin finden": {"vi": "Tìm lỗi của đồng nghiệp", "tr": "Meslektaşın hatasını bulma", "ar": "إيجاد خطأ الزميلة"}, "Eure Abteilung": {"vi": "Khu vực của các bạn", "tr": "Reyonunuz", "ar": "قسمكم"}, "Ganzes Haus": {"vi": "Cả cửa hàng", "tr": "Bütün mağaza", "ar": "المتجر كله"}, "Mit einer Abteilung kommen etwa 3 von 5 Kunden von dort.": {"vi": "Khi chọn một khu vực, khoảng 3 trên 5 khách hàng sẽ đến từ đó.", "tr": "Bir reyon seçildiğinde müşterilerin yaklaşık 3'ü 5'te oradan gelir.", "ar": "عند اختيار قسم يأتي حوالي 3 من كل 5 عملاء من هناك."}, "Welche Module?": {"vi": "Những module nào?", "tr": "Hangi modüller?", "ar": "أي وحدات؟"}, "Alle Module": {"vi": "Tất cả module", "tr": "Tüm modüller", "ar": "كل الوحدات"}, "Module 1–7": {"vi": "Module 1–7", "tr": "Modül 1–7", "ar": "الوحدات 1–7"}, "Module 8–15": {"vi": "Module 8–15", "tr": "Modül 8–15", "ar": "الوحدات 8–15"}, "Türen auf – der Samstag beginnt": {"vi": "Mở cửa – ngày thứ Bảy bắt đầu", "tr": "Kapılar açılıyor – cumartesi başlıyor", "ar": "تُفتح الأبواب – يبدأ السبت"}, "Spielstand bleibt nur auf diesem Gerät.": {"vi": "Kết quả chơi chỉ được lưu trên thiết bị này.", "tr": "Oyun durumu sadece bu cihazda kalır.", "ar": "تبقى نتيجة اللعب على هذا الجهاز فقط."}, "Über den Link voreingestellt.": {"vi": "Đã được cài sẵn qua liên kết.", "tr": "Bağlantı üzerinden önceden ayarlandı.", "ar": "تم الإعداد المسبق عبر الرابط."}, "Samstag, 9:25 Uhr · Pausenraum": {"vi": "Thứ Bảy, 9:25 · Phòng nghỉ", "tr": "Cumartesi, 9:25 · Dinlenme odası", "ar": "السبت، الساعة 9:25 · غرفة الاستراحة"}, "Liebes Team „{0}“,": {"vi": "Gửi đội „{0}“ thân mến,", "tr": "Sevgili „{0}“ takımı,", "ar": "عزيزي فريق „{0}“،"}, "heute ist der wichtigste Tag in 70 Jahren Kaufhaus Kranich. Der Investor schaut sich das Haus an – verkleidet als Kunde. Er will wissen: Beraten wir besser als das Internet?": {"vi": "hôm nay là ngày quan trọng nhất trong 70 năm của Kaufhaus Kranich. Nhà đầu tư đến xem cửa hàng – cải trang thành khách hàng. Ông ấy muốn biết: Chúng ta tư vấn có tốt hơn Internet không?", "tr": "bugün Kaufhaus Kranich'in 70 yıllık tarihinin en önemli günü. Yatırımcı mağazaya bakmaya geliyor – müşteri kılığında. Şunu bilmek istiyor: İnternetten daha iyi danışmanlık yapıyor muyuz?", "ar": "اليوم هو أهم يوم في 70 عامًا من عمر Kaufhaus Kranich. سيأتي المستثمر لمعاينة المتجر – متنكرًا كعميل. يريد أن يعرف: هل نقدّم استشارة أفضل من الإنترنت؟"}, "Ihr bedient heute {0} Kundinnen und Kunden{1}. Achtet auf jede Kleinigkeit. Einer davon ist der Investor. Am Abend dürft ihr raten, wer.": {"vi": "Hôm nay các bạn phục vụ {0} khách hàng{1}. Hãy chú ý từng chi tiết nhỏ. Một trong số họ là nhà đầu tư. Buổi tối các bạn được đoán xem đó là ai.", "tr": "Bugün {0} müşteriye hizmet edeceksiniz{1}. Her ayrıntıya dikkat edin. Bunlardan biri yatırımcı. Akşam kim olduğunu tahmin edebilirsiniz.", "ar": "اليوم ستخدمون {0} عميلًا{1}. انتبهوا لكل تفصيل صغير. واحد منهم هو المستثمر. وفي المساء يمكنكم تخمين من هو."}, "Ich glaube an euch.": {"vi": "Tôi tin vào các bạn.", "tr": "Size inanıyorum.", "ar": "أنا أؤمن بكم."}, "So geht's: Lest die Situation. Tippt eine Antwort an. Dann „Entscheidung festlegen“. Die Kundin oder der Kunde reagiert sofort. Die Begründungen gibt es am Abend in der Auswertung.": {"vi": "Cách chơi: Đọc tình h     }

 {m:9,sit:'Die Jacke hat eine Gore-Tex-Membran.',q:'Wie argumentiert ihr?',o:[
  {t:'„Die Jacke hat eine Gore-Tex-Membran. Dadurch ist sie wasserdicht und trotzdem atmungsaktiv. So bleiben Sie auch bei stundenlangem Regen trocken und kommen nicht ins Schwitzen.“',f:2,x:'Genau das brauche ich am Sonntag!',w:'Merkmal – Vorteil – Kundennutzen. Der Nutzen passt zu seinem Bedarf (Regen).'},
  {t:'„Die Jacke hat eine Gore-Tex-Membran.“',f:1,x:'Aha. Und was heißt das für mich?',w:'Nur ein Merkmal. Ein Merkmal allein verkauft nicht – der Kunde kauft den Nutzen.'},
  {t:'„Die Jacke ist wirklich super, die wird ganz oft gekauft.“',f:0,x:'Das sagen Sie bestimmt zu jeder Jacke.',w:'Eine Verkaufsphrase ohne Information.'},
  {t:'„Damit kann man auch bei Regen wandern.“',f:1,p:1,x:'Das kann man mit vielen Jacken.',w:'Nutzen angedeutet, aber „man“ statt Sie-Stil und kein Merkmal.'}],
  b:'Merkmal – Vorteil – Nutzen',ihk:'„Die Jacke hat … (Merkmal). Dadurch ist sie … (Vorteil). So bleiben Sie … (Nutzen).“',
  a:{q:'Welcher Teil des Satzes verkauft wirklich?',o:['der Kundennutzen','das Warenmerkmal','der Markenname'],c:0}},
 {m:10,sit:'Er fragt: „Und was kostet die?“ Die Jacke kostet 229 Euro.',q:'Wie nennt ihr den Preis?',o:[
  {t:'„Die Jacke ist winddicht und hat verschweißte Nähte, sie kostet 229 Euro – und Sie bleiben damit auch bei Dauerregen trocken.“',f:2,x:'Für so viele Wanderungen trocken … das ist es mir wert.',w:'Sandwich-Methode: Nutzen – Preis – Nutzen. So gibt es keinen Preisschock.'},
  {t:'„229 Euro.“',f:0,x:'Puh. Das ist aber viel.',w:'Ein nackter Preis löst einen Preisschock aus.'},
  {t:'„Die ist leider ziemlich teuer: 229 Euro.“',f:0,x:'Wenn Sie das schon sagen …',w:'„Leider“ und „teuer“ sind Negativformulierungen.'},
  {t:'„Bei zehn Jahren Nutzung sind das nur 6 Cent am Tag.“',f:1,p:1,x:'Zehn Jahre? Na, mal sehen.',w:'Verkleinerungsmethode ist möglich. Aber zehn Jahre bei einer Jacke sind schwer zu glauben, und der Preis selbst fehlt.'}],
  b:'Sandwich-Methode',ihk:'„Die Jacke …, sie kostet 229 Euro – und Sie …“ (Nutzen – Preis – Nutzen)',
  a:{q:'Wie heißt diese Art der Preisnennung?',o:['Sandwich-Methode','Vergleichsmethode','Zerlegungsmethode'],c:0}}]},

{id:'sp3',d:'sport',n:'Herr Demir',f:{s:2,h:'kurz',c:'schwarz',alt:1,b:1},i:'Herr Demir sucht einen Fahrradhelm für seinen Sohn (8).',k:59,s:[
 {m:5,sit:'Er sagt: „Er fährt jetzt allein zur Schule. Der Helm muss richtig schützen.“',q:'Was sagt ihr?',o:[
  {t:'„Da sind Sie bei uns genau richtig. Dieser Helm hat ein Rücklicht und sitzt fest – damit ist Ihr Sohn sicher und gut zu sehen.“',f:2,x:'Ein Rücklicht? Das ist gut.',w:'Vertrauensauslöser plus Argument zum Kaufmotiv Sicherheit (rational).'},
  {t:'„Der hier ist gerade total angesagt, den haben alle Kinder.“',f:0,x:'Das ist mir nicht so wichtig.',w:'Das spricht Nachahmung an. Der Vater hat aber Sicherheit als Motiv genannt.'},
  {t:'„Der hier ist im Angebot, nur 29 Euro.“',f:1,x:'Und schützt der auch gut?',w:'Geldersparnis hat er nicht genannt. Das Motiv passt nicht.'},
  {t:'„Sie wollen doch bestimmt nicht, dass Ihrem Sohn etwas passiert?“',f:0,p:1,x:'Was soll das denn heißen?',w:'Suggestivfrage mit Druck – sie macht ein schlechtes Gewissen. Das ist im Verkauf unzulässig.'}],
  b:'Kaufmotiv Sicherheit (rational)',ihk:'„Wenn Ihnen Sicherheit wichtig ist, dann passt dieser Helm besonders gut, weil …“',
  a:{q:'Welches Kaufmotiv hat Herr Demir?',o:['Sicherheit – rational','Geltungsbedürfnis – emotional','Nachahmung – emotional'],c:0}},
 {m:13,sit:'Er nimmt den Helm. Sein Sohn hat auch ein neues Fahrrad, aber noch kein Schloss.',q:'Was bietet ihr an – und wann?',o:[
  {t:'Jetzt beim Helm: „Sie sagten, Ihr Sohn fährt allein zur Schule. Dieses Schloss ist sehr stabil – dann steht das Rad sicher am Schulhof.“',f:2,x:'Stimmt, daran habe ich gar nicht gedacht.',w:'Zusatzangebot mit Nutzen, der zum ermittelten Bedarf passt. Richtiger Zeitpunkt: beim Hauptartikel.'},
  {t:'Erst an der Kasse: „Brauchen Sie sonst noch was?“',f:0,x:'Nein, danke.',w:'Zu spät und geschlossen gefragt. Der Kunde sagt Nein, und das Gespräch ist zu Ende.'},
  {t:'„Wir haben auch Schlösser.“',f:1,x:'Aha.',w:'Richtiger Zeitpunkt, aber ohne Kundennutzen.'},
  {t:'„Ein Schloss haben Sie sicher schon?“',f:0,p:1,x:'Äh … ja, ja.',w:'Negative Suggestivfrage: Sie legt dem Kunden das Nein in den Mund.'}],
  b:'Zusatzangebot',ihk:'„Zu … passt … – damit …“ (beim Hauptartikel, mit Nutzen)',
  a:{q:'Ist das Schloss hier ein Ergänzungs- oder ein Zusatzangebot?',o:['Zusatzangebot – der Helm funktioniert auch ohne Schloss','Ergänzungsangebot – ohne Schloss geht der Helm nicht','Alternativangebot'],c:0}}]},

{id:'sp4',d:'sport',n:'Frau Haddad',f:{s:3,h:'lang',c:'schwarz',alt:0,x:'ohrring'},i:'Frau Haddad schlendert durch die Sportabteilung.',k:39,s:[
 {m:4,sit:'Sie schaut mal hier, mal da. Als ihr näher kommt, lächelt sie kurz und schaut wieder weg.',q:'Wie verhaltet ihr euch?',o:[
  {t:'„Guten Tag! Schauen Sie sich gerne in Ruhe um. Wenn Sie etwas wissen möchten, bin ich für Sie da.“ Dann zurückziehen.',f:2,x:'Danke, sehr nett.',w:'Sie bummelt. Freiraum lassen, aber vorher Bereitschaft zum Helfen zeigen.'},
  {t:'Mitgehen und ungefragt jedes Produkt erklären.',f:0,x:'Äh … danke, ich schau nur.',w:'Kein Freiraum – sie fühlt sich überrumpelt.'},
  {t:'Gar nichts sagen. Sie will ja nicht.',f:0,x:'(denkt) Hier sieht mich wohl keiner.',w:'Jeder Kunde muss merken, dass er wahrgenommen wurde.'},
  {t:'„Sie kommen zurecht?“',f:1,p:1,x:'Ja, ja.',w:'Geschlossene Frage. Sie klingt, als wolle man die Kundin loswerden.'}],
  b:'Freiraum lassen',ihk:'„Schauen Sie sich gerne in Ruhe um. Wenn Sie etwas wissen möchten, bin ich für Sie da.“'},
 {m:2,sit:'Zehn Minuten später steht sie vor den Yogamatten. Sie rollt eine Matte auf, fühlt das Material und schaut sich suchend um.',q:'Was bedeutet das – und was tut ihr?',o:[
  {t:'Das kann bedeuten: Jetzt möchte sie Hilfe. Hingehen, gut 1,5 Meter Abstand: „Diese Matte ist besonders rutschfest. Wofür möchten Sie sie nutzen?“',f:2,x:'Für Yoga zu Hause. Rutschfest ist gut!',w:'Ware prüfen und suchender Blick sind Kundensignale. Im Verkaufsgespräch gilt die gesellschaftliche Distanz (1,20 bis 3,00 m).'},
  {t:'Sie ist bestimmt genervt. Lieber nicht stören.',f:0,x:'(seufzt und legt die Matte weg)',w:'Falsch gedeutet. Suchender Blick und Ware prüfen zeigen Interesse.'},
  {t:'Hingehen und euch ganz nah neben sie stellen, damit sie euch gut hört.',f:1,x:'(weicht einen Schritt zurück)',w:'Richtig erkannt, aber zu nah: Unter 0,60 m ist Intimdistanz. Das verletzt die Privatsphäre.'},
  {t:'Hingehen: „Sie wollen jetzt sicher Hilfe!“',f:1,p:1,x:'Äh … ja, schon.',w:'Signal richtig gelesen, aber kein Signal ist eindeutig. Vorsichtig deuten, nicht unterstellen.'}],
  b:'Kundensignale lesen',ihk:'„Die Kundin … (Beobachtung). Das kann bedeuten, dass …“',
  a:{q:'Welche Distanz gilt im Verkaufsgespräch?',o:['gesellschaftliche Distanz, 1,20 bis 3,00 m','persönliche Distanz, 0,60 bis 1,20 m','Intimdistanz, bis 0,60 m'],c:0}}]},

{id:'sp5',d:'sport',n:'Herr Brinkmann',f:{s:0,h:'kurz',c:'blond',alt:1},i:'Herr Brinkmann nimmt eine Sportuhr in die Hand.',k:199,s:[
 {m:10,sit:'Nach zehn Sekunden fragt er: „Was kostet die denn?“',q:'Was antwortet ihr?',o:[
  {t:'„Dazu komme ich gleich – vorher zeige ich Ihnen kurz, wie die Uhr Ihren Puls beim Laufen misst.“ Danach bald den Preis nennen.',f:2,x:'Na gut, zeigen Sie mal.',w:'Verzögerungsmethode: Er fragt zu früh. Erst den Nutzen zeigen. Die Verzögerung darf nur kurz sein.'},
  {t:'„Das ist egal, die ist gut.“',f:0,x:'Mir ist das nicht egal!',w:'Weicht aus und nimmt den Kunden nicht ernst.'},
  {t:'„199 Euro.“',f:1,x:'Oha.',w:'Ein nackter Preis ohne Nutzen. Gefahr von Preisschock.'},
  {t:'Gar nicht antworten und weiter erklären, bis er nicht mehr fragt.',f:0,p:1,x:'Ich hatte nach dem Preis gefragt …',w:'Die Verzögerung darf nicht lange dauern. Wer ausweicht, verliert Vertrauen.'}],
  b:'Verzögerungsmethode',ihk:'„Dazu komme ich gleich – vorher zeige ich Ihnen noch, was das Gerät für Sie leistet.“',
  a:{q:'Wie heißt diese Methode?',o:['Verzögerungsmethode','Verharmlosungsmethode','frühe Preisnennung'],c:0}},
 {m:11,sit:'Er sagt: „Im Internet kostet die Uhr 30 Euro weniger.“',q:'Wie reagiert ihr?',o:[
  {t:'„Sie haben recht, online ist der Preis niedriger. Dafür stellen wir Ihnen die Uhr hier direkt ein und tauschen sie bei einem Defekt sofort um.“',f:2,x:'Das Einstellen spart mir Zeit. Gut.',w:'Ja-Aber-Methode: erst zustimmen, dann den eigenen Nutzen dagegensetzen.'},
  {t:'„Das kann gar nicht sein.“',f:0,x:'Doch, ich habe es gesehen!',w:'Nie behaupten, das sei unmöglich. Erst nähere Angaben zum anderen Angebot erbitten.'},
  {t:'„Dann kaufen Sie sie doch im Internet.“',f:0,x:'Mache ich auch.',w:'Eine Killerphrase. Der Kunde geht – und kommt nicht wieder.'},
  {t:'„Wo genau haben Sie das gesehen? Ist es dasselbe Modell?“ – und danach nichts mehr dazu sagen.',f:1,p:1,x:'Ja, dasselbe. Und jetzt?',w:'Nachfragen ist der richtige erste Schritt. Aber danach fehlt das Gegenargument.'}],
  b:'Ja-Aber-Methode',ihk:'„Sie haben recht, … Dafür erhalten Sie bei uns …“',
  a:{q:'Welche Methode der Einwandbehandlung war das?',o:['Ja-Aber-Methode','Umkehr-Methode','Gegenfrage-Methode'],c:0}}]},

{id:'sp6',d:'sport',n:'Frau Kowalski',f:{s:0,h:'dutt',c:'rot',alt:1,g:1},i:'Frau Kowalski sucht einen Schlafsack für ihren Sohn (6). Er soll warm sein, zwei bis drei Jahre passen und blau sein.',k:79,s:[
 {m:8,sit:'Im Regal liegen zehn Schlafsäcke, vom billigsten bis zum teuersten.',q:'Wie legt ihr die Ware vor?',o:[
  {t:'Drei passende Schlafsäcke in mittlerer Preislage hinlegen: „Fühlen Sie ruhig einmal, wie weich das Futter ist.“',f:2,x:'Oh, der blaue ist schön weich.',w:'Faustregel: drei Artikel, mittlere Preislage, die Kundin einbeziehen (anfassen).'},
  {t:'Alle zehn Schlafsäcke aus dem Regal holen.',f:0,x:'Oje, wo soll ich da anfangen?',w:'Mehr als fünf Artikel verwirren die Kundin.'},
  {t:'Nur den billigsten zeigen.',f:1,x:'Haben Sie auch etwas Besseres?',w:'Keine Ausweichmöglichkeit nach unten. Die Kundin fühlt sich vielleicht falsch eingeschätzt.'},
  {t:'Mit dem teuersten Daunenschlafsack anfangen, dann wirkt der Rest günstig.',f:1,p:1,x:'So viel wollte ich eigentlich nicht ausgeben …',w:'Keine Ausweichmöglichkeit nach oben, und die Kundin wird verschreckt („Apotheke“).'}],
  b:'Drei Artikel, mittlere Preislage',ihk:'„Drei Artikel – so hat der Kunde eine echte Auswahl. Mehr als fünf verwirren ihn.“',
  a:{q:'Warum beginnt man in der mittleren Preislage?',o:['Man kann nach oben und nach unten ausweichen','Dort ist der Gewinn am höchsten','Das schreibt das Gesetz vor'],c:0}},
 {m:8,sit:'Bevor ihr weitermacht, wollt ihr sicher sein, dass ihr alles richtig verstanden habt.',q:'Was sagt ihr?',o:[
  {t:'„Sie suchen für Ihren sechsjährigen Sohn einen warmen Schlafsack in Blau, der zwei bis drei Jahre passt. Trifft das zu?“',f:2,x:'Ja, ganz genau!',w:'Kontrollfrage: Sie fasst alles zusammen und lässt sich mit Ja beantworten.'},
  {t:'„Sonst brauchen Sie nichts?“',f:0,x:'Doch, einen Schlafsack …',w:'Negativ und geschlossen. Beendet das Gespräch.'},
  {t:'„Soll er blau sein?“',f:1,x:'Hatte ich doch gesagt.',w:'Fragt nur einen Punkt ab. Eine Kontrollfrage fasst alles zusammen.'},
  {t:'„Sie wollen doch sicher den wärmsten?“',f:0,p:1,x:'Hm, ich weiß nicht …',w:'Suggestivfrage: Sie drängt in eine Richtung.'}],
  b:'Kontrollfrage',ihk:'„Sie suchen für Ihren sechsjährigen Sohn … Trifft das zu?“'}]},

{id:'sp7',d:'sport',n:'Herr Stolle',f:{s:1,h:'kurz',c:'weiss',alt:2,g:1,x:'kappe'},i:'Herr Stolle, Stammkunde, etwa 70 Jahre, kommt herein. Er braucht Fahrradhandschuhe.',k:35,s:[
 {m:4,sit:'Eure Kollegin Mia ruft ihm entgegen: „Hallo! Was wollen Sie denn?“',q:'Was war falsch?',o:[
  {t:'„Hallo“ passt nicht zu ihm, „Was wollen Sie denn?“ klingt abweisend, und sein Name fehlt.',f:2,x:'(nickt euch zu)',w:'Die Grußformel hängt von Alter, Vertrautheit und Situation ab. Stammkunden begrüßt man mit Namen.'},
  {t:'Nichts. Hauptsache, sie hat ihn begrüßt.',f:0,x:'(schaut irritiert)',w:'Der erste Eindruck zählt und lässt sich kaum korrigieren.'},
  {t:'Sie hätte lauter rufen sollen.',f:1,x:'Ich höre noch ganz gut, danke.',w:'Die Lautstärke ist nicht das Problem, sondern Grußformel und Ton.'},
  {t:'Nur der Name fehlt, sonst ist alles gut.',f:1,p:1,x:'(zuckt mit den Schultern)',w:'Der Name fehlt – aber auch „Hallo“ und der abweisende Ton sind Fehler.'}],
  b:'Personen- und situationsgerecht begrüßen',ihk:'„Guten Tag, Herr Linder! Schön, dass Sie wieder bei uns vorbeischauen. Wie kann ich Ihnen heute behilflich sein?“'},
 {m:4,sit:'Mia fragt euch: „Und wie hättet ihr es gesagt?“',q:'Euer Satz:',o:[
  {t:'„Guten Tag, Herr Stolle! Schön, dass Sie wieder da sind. Wie kann ich Ihnen heute helfen?“',f:2,x:'So mag ich das! Ich brauche Handschuhe.',w:'Grußformel passt, Name, freundlicher Satz, offene Frage.'},
  {t:'„Guten Tag. Kann ich Ihnen helfen?“',f:1,x:'Ja.',w:'Höflicher, aber ohne Namen und mit geschlossener Frage.'},
  {t:'„Hey! Na, was geht?“',f:0,x:'Wie bitte?',w:'Viel zu locker für einen älteren Stammkunden.'},
  {t:'„Guten Tag, Herr Stolle! Suchen Sie etwas Bestimmtes?“',f:1,p:1,x:'Ja, schon.',w:'Der Name ist gut, aber die Frage ist geschlossen.'}],
  b:'Stammkunden mit Namen begrüßen',ihk:'„Guten Tag, Frau Wolf! Schön, dass Sie wieder da sind.“'}]},

{id:'sp8',d:'sport',n:'Herr Kaya',f:{s:2,h:'locken',c:'schwarz',alt:1},i:'Herr Kaya kommt mit einer Trinkflasche zurück.',k:0,s:[
 {m:12,sit:'Er ist laut: „Die läuft aus! Meine ganze Tasche ist nass!“ Andere Kunden schauen schon.',q:'Wie reagiert ihr zuerst?',o:[
  {t:'Ruhig bleiben, ausreden lassen, dann: „Das ärgert Sie, das kann ich gut verstehen. Kommen Sie, wir schauen uns das hier in Ruhe an.“',f:2,x:'(atmet durch) Na gut.',w:'Ruhig und sachlich bleiben, Verständnis zeigen, in eine ruhige Zone bitten.'},
  {t:'„Das haben Sie bestimmt falsch zugeschraubt.“',f:0,x:'Wollen Sie mich veräppeln?!',w:'Vorwurf und Belehrung. Unterstellungen vermeiden.'},
  {t:'„Beruhigen Sie sich erst mal!“',f:0,x:'Ich bin ruhig!',w:'Eine Anweisung – sie macht den Konflikt größer.'},
  {t:'Sofort unterbrechen: „Haben Sie den Kassenbon dabei?“',f:1,p:1,x:'Lassen Sie mich doch mal ausreden!',w:'Der Bon ist später wichtig. Aber erst ausreden lassen.'}],
  b:'Verhalten bei Beschwerden',ihk:'z. B. Ruhe bewahren; entschuldigen; sachlich bleiben; Lösungen anbieten; Kundin in ruhige Zone bringen (IHK, Winter 2024/25)'},
 {m:12,sit:'Ihr schaut euch die Flasche an. Der Deckel hat wirklich einen Riss.',q:'Wie geht es weiter?',o:[
  {t:'„Danke, dass Sie es uns zeigen. Ich schlage Ihnen vor: Sie bekommen sofort eine neue Flasche. Darf ich Ihnen zeigen, welche Modelle einen besonders dichten Deckel haben?“',f:2,x:'Das ist fair. Zeigen Sie mal.',w:'Lösung anbieten und das Gespräch fortsetzen (Schritt 4 der Vier-Schritt-Methode).'},
  {t:'„Da kann ich auch nichts machen, das ist eben so.“',f:0,x:'Dann komme ich nie wieder.',w:'Die Verkäuferin lehnt jede Verantwortung ab.'},
  {t:'Wortlos eine neue Flasche geben und zurück an die Arbeit.',f:1,x:'Äh … danke.',w:'Lösung gut, aber kein Dank und das Gespräch wird nicht fortgesetzt.'},
  {t:'„Der Hersteller ist schuld, nicht wir.“ Dann eine neue Flasche geben.',f:1,p:1,x:'Mir doch egal, wer schuld ist.',w:'Die Lösung ist gut. Aber die Schuld wegschieben wirkt schlecht auf das ganze Geschäft.'}],
  b:'Vier-Schritt-Methode: fortsetzen',ihk:'„Ich schlage Ihnen Folgendes vor: …“',
  a:{q:'Was ist Schritt 4 der Vier-Schritt-Methode?',o:['Gespräch fortsetzen','Einwand überprüfen','Kunden ernst nehmen'],c:0}}]},

{id:'sp9',d:'sport',n:'Herr Lange',f:{s:4,h:'kurz',c:'grau',alt:2},i:'Herr Lange kauft eine Trinkflasche und schaut sich dabei um.',k:25,s:[
 {m:3,sit:'Er fragt: „Warum liegen die Sportuhren in einer Vitrine und die Trinkflaschen im Regal?“',q:'Was antwortet ihr?',o:[
  {t:'„Die Uhren sind teuer und brauchen Erklärung – da berate ich Sie persönlich. Trinkflaschen kennt jeder, die nehmen Sie selbst aus dem Regal.“',f:2,x:'Ah, das leuchtet ein.',w:'Die Eigenschaften der Ware bestimmen die Verkaufsform: erklärungsbedürftig oder zu schützen → Bedienung; einfach und vertraut → Selbstbedienung.'},
  {t:'„Weiß ich nicht, das hat der Chef so gemacht.“',f:0,x:'Na, das ist ja eine Auskunft.',w:'Wirkt unprofessionell. Die Gründe gehören zum Grundwissen.'},
  {t:'„Damit keiner die Uhren klaut.“',f:1,x:'Aha. Sie trauen den Kunden nicht?',w:'Halb richtig: Schutz ist ein Grund. Es fehlt: Uhren sind erklärungsbedürftig.'},
  {t:'„Weil Vitrinen schöner aussehen.“',f:0,p:1,x:'Das ist alles?',w:'Kein fachlicher Grund.'}],
  b:'Verkaufsformen',ihk:'Bedienung: erklärungsbedürftig, hochpreisig, zu schützen. Selbstbedienung: einfach, vertraut, verpackt.',
  a:{q:'Welche Verkaufsform gilt für die Trinkflaschen?',o:['Selbstbedienung','Bedienung','Vorwahl'],c:0}},
 {m:3,sit:'Er fragt weiter: „Und woher wissen Sie eigentlich so viel über die Uhren?“',q:'Was antwortet ihr?',o:[
  {t:'„Wir hatten eine Schulung vom Hersteller, und ich lese die Testergebnisse. So kann ich Sie gut beraten.“',f:2,x:'Da fühle ich mich gut aufgehoben.',w:'Quellen für Warenkenntnisse: Hersteller (Schulungen), Fachliteratur und Testergebnisse.'},
  {t:'„Ach, ich rate meistens.“',f:0,x:'Wie bitte?',w:'Ohne Warenkenntnisse kann man nicht passend beraten.'},
  {t:'„Steht alles auf der Verpackung.“',f:1,x:'Die kann ich auch selbst lesen.',w:'Herstellerangaben sind eine Quelle. Mehrere Quellen zeigen mehr Fachkompetenz.'},
  {t:'„Aus irgendwelchen Foren im Internet.“',f:1,p:1,x:'Hm, ob das stimmt?',w:'Das Internet zählt zu den Quellen. Verlässlicher sind Hersteller, Fachzeitschriften und Tests.'}],
  b:'Quellen für Warenkenntnisse',ihk:'innerbetrieblich: Schulungen, Warenwirtschaftssystem, Kollegen · außerbetrieblich: Hersteller, Fachzeitschriften, Messen, Stiftung Warentest'}]},

{id:'sp10',d:'sport',n:'Herr Nikolaidis',f:{s:1,h:'locken',c:'grau',alt:1,b:1},i:'Herr Nikolaidis sucht ein Geburtstagsgeschenk.',k:139,s:[
 {m:6,sit:'Ihr wollt den Bedarf mit einer Fragekette ermitteln.',q:'Welche Reihenfolge ist am besten?',o:[
  {t:'1. „Für wen ist das Geschenk?“ 2. „Was macht die Person gern?“ 3. „In welchem Rahmen soll es preislich liegen?“ 4. „Eher praktisch oder eher ausgefallen?“',f:2,x:'Für meine Frau. Sie spielt Tennis.',w:'Vom Weiten ins Enge: erst offene Fragen, am Schluss eine Alternativfrage.'},
  {t:'1. „Wie viel wollen Sie ausgeben?“ 2. „Sonst brauchen Sie nichts?“',f:0,x:'Äh …',w:'Preis zuerst, dann eine negative, geschlossene Frage.'},
  {t:'1. „Eher praktisch oder ausgefallen?“ 2. „Für wen ist das Geschenk?“',f:1,x:'Das weiß ich doch noch gar nicht.',w:'Die Alternativfrage kommt zu früh.'},
  {t:'1. „Für wen ist das?“ 2. „Sie wollen doch sicher etwas Hochwertiges?“',f:1,p:1,x:'Na ja, schon …',w:'Gut begonnen, dann eine Suggestivfrage.'}],
  b:'Fragekette',ihk:'Am Anfang offen – in der Mitte alternativ – am Ende geschlossen.'},
 {m:6,sit:'Es wird ein Tennisschläger für seine Frau. Zum Schluss geht es um das Bespannen.',q:'Welche Frage passt jetzt?',o:[
  {t:'„Sind Sie damit einverstanden, dass wir den Schläger für 15 Euro bespannen?“',f:2,x:'Ja, machen Sie das.',w:'Am Ende geschlossen fragen: Jetzt soll eine Entscheidung fallen, und der Preis ist klar genannt.'},
  {t:'„Wollen Sie das wirklich selbst machen?“',f:0,x:'Was soll das heißen?',w:'Klingt wie ein Vorwurf.'},
  {t:'„Was halten Sie vom Bespannen?“',f:1,x:'Weiß nicht, was meinen Sie?',w:'Eine offene Frage. Am Ende soll aber eine Entscheidung fallen.'},
  {t:'„Bespannen machen Sie sicher selbst?“',f:0,p:1,x:'Nein …?',w:'Negative Suggestivfrage.'}],
  b:'Geschlossene Frage am Ende',ihk:'„Sind Sie damit einverstanden, dass wir den Schrank für 45,00 EUR aufstellen?“',
  a:{q:'Welche Frageart war richtig?',o:['geschlossene Frage','offene Frage','rhetorische Frage'],c:0}}]},

/* ---------- SCHUHE ---------- */
{id:'sc1',d:'schuhe',n:'Frau Schulz',f:{s:0,h:'kurz',c:'grau',alt:2},i:'Frau Schulz steht bei den Wanderschuhen.',k:169,s:[
 {m:6,sit:'Sie sagt: „Ich brauche neue Wanderschuhe.“',q:'Welche Frage stellt ihr jetzt?',o:[
  {t:'„Wo und wie oft möchten Sie damit wandern?“',f:2,x:'Oft in den Bergen, auch auf nassen Felsen.',w:'Offene Frage (W-Frage): Sie muss erzählen. Genau richtig in der Bedarfsermittlung.'},
  {t:'„Sonst brauchen Sie nichts?“',f:0,x:'Doch – Wanderschuhe!',w:'Geschlossen und negativ. Beendet das Gespräch.'},
  {t:'„Möchten Sie hohe Schuhe?“',f:1,x:'Ja, vielleicht.',w:'Geschlossene Frage – nur Ja oder Nein, wenig Information.'},
  {t:'„Möchten Sie lieber die braunen oder die grauen?“',f:1,p:1,x:'Die Farbe ist mir egal.',w:'Alternativfrage zu früh: erst den Bedarf ermitteln, dann die Auswahl verkleinern.'}],
  b:'Offene Frage',ihk:'„Wofür möchten Sie … vor allem verwenden?“',
  a:{q:'Welche Frageart war die beste?',o:['offene Frage (W-Frage)','Alternativfrage','Kontrollfrage'],c:0}},
 {m:9,sit:'Ihr zeigt einen Schuh mit Vibram-Sohle.',q:'Wie argumentiert ihr?',o:[
  {t:'„Der Schuh hat eine Vibram-Sohle. Die ist besonders rutschfest. Sie stehen auch auf nassen Felsen sicher – und die Sohle hält viele Jahre.“',f:2,x:'Genau das brauche ich.',w:'Fachbegriff sofort erklärt, dann Vorteil und Kundennutzen.'},
  {t:'„Der hat eine Vibram-Sohle.“',f:1,x:'Eine was?',w:'Fachbegriff ohne Erklärung. Nur ein Merkmal.'},
  {t:'„Die Marke trage ich auch.“',f:0,x:'Schön für Sie.',w:'Verkaufsphrase ohne Information.'},
  {t:'„Diese Sohle ist besser als die anderen.“',f:1,p:1,x:'Inwiefern?',w:'Behauptung ohne Information und ohne Nutzen.'}],
  b:'Kundennutzen',ihk:'„Sie stehen auch auf nassen Felsen sicher – und die Sohle hält viele Jahre.“'}]},

{id:'sc2',d:'schuhe',n:'Herr Wagner',f:{s:1,h:'kurz',c:'braun',alt:1,g:1},i:'Herr Wagner sucht bequeme Schuhe fürs Büro.',k:119,s:[
 {m:8,sit:'Ihr habt drei Paar ausgewählt.',q:'Was macht ihr jetzt?',o:[
  {t:'„Probieren Sie sie gerne an. Laufen Sie ruhig ein paar Schritte – dann merken Sie, wie bequem das Fußbett ist.“',f:2,x:'Oh, die sind wirklich bequem!',w:'Anprobieren: Schuhe immer anprobieren lassen. Der Kunde macht eine eigene Erfahrung, der Besitzwunsch steigt.'},
  {t:'Die Schuhe in der Schachtel lassen und nur beschreiben.',f:0,x:'Darf ich die mal sehen?',w:'Reden ist Silber, zeigen ist Gold.'},
  {t:'Die Schuhe hochhalten und von allen Seiten zeigen.',f:1,x:'Hm. Sehen gut aus.',w:'Nur ein Sinn (sehen). Besser: anfassen und anprobieren.'},
  {t:'Alle drei Paare auf einmal hinstellen und sagen: „Ziehen Sie mal alle schnell an.“',f:1,p:1,x:'Das ist mir zu hektisch.',w:'Ein Befehl und zu viel auf einmal. Lieber nacheinander und nicht passende Paare beiseiteräumen.'}],
  b:'Anprobieren',ihk:'Arten der Warenvorlage: ausprobieren · anprobieren · in die Hände geben · Kostproben'},
 {m:14,sit:'Er läuft in einem Paar hin und her. Er nickt, schaut in den Spiegel und fragt: „Kann ich auch mit Karte zahlen?“',q:'Was macht ihr?',o:[
  {t:'„Natürlich. Darf ich Ihnen die Schuhe einpacken?“',f:2,x:'Ja, gerne!',w:'Kaufsignale: Nicken, Frage nach der Zahlungsweise. Jetzt die direkte Kaufaufforderung – und nicht weiterreden.'},
  {t:'Noch die anderen zwei Paare ausführlich erklären.',f:0,x:'Jetzt bin ich wieder unsicher …',w:'Kaufsignal übersehen. Zu viel Reden macht den Kunden wieder unsicher.'},
  {t:'„Ja.“ Und dann warten.',f:1,x:'(wartet auch)',w:'Antwort richtig, aber der Abschluss wird nicht eingeleitet.'},
  {t:'„Greifen Sie sofort zu, morgen ist der Preis weg!“ (Das stimmt nicht.)',f:0,p:1,x:'Das klingt nach Druck.',w:'Ein Befehl mit künstlicher Verknappung. Das ist Druck und Täuschung.'}],
  b:'Kaufsignal und direkte Kaufaufforderung',ihk:'„Darf ich Ihnen die Wanderschuhe einpacken?“',
  a:{q:'Welches Kaufsignal hat Herr Wagner gesendet?',o:['Frage nach der Zahlungsweise','Er verschränkt die Arme','Er sagt: Ich komme morgen wieder'],c:0}}]},

{id:'sc3',d:'schuhe',n:'Frau Jansen',f:{s:0,h:'pony',c:'blond',alt:0},i:'Frau Jansen kommt mit zwei kleinen Kindern herein. Die Kinder sind unruhig.',k:98,s:[
 {m:4,sit:'Sie sucht Kinderschuhe.',q:'Wie begrüßt ihr sie?',o:[
  {t:'Blick zur Mutter, dann kurz in die Hocke zu den Kindern: „Guten Tag! Schön, dass Sie da sind – und ihr auch. Da drüben ist unsere Malecke.“',f:2,x:'Oh, wie nett! Dann habe ich kurz Ruhe.',w:'Begleitpersonen einbeziehen und Kinder beschäftigen – dann hat die Mutter Ruhe für die Beratung.'},
  {t:'Die Kinder nicht beachten und nur mit der Mutter sprechen.',f:0,x:'(die Kinder ziehen an ihr) Moment …',w:'Die Kinder beeinflussen den Kauf. Unruhige Kinder stören die Beratung.'},
  {t:'„Bitte passen Sie auf, dass die Kinder nichts anfassen.“',f:0,x:'Wir sind gerade erst reingekommen!',w:'Ein Vorwurf schon zur Begrüßung. Die Kundin fühlt sich nicht willkommen.'},
  {t:'„Hallo ihr zwei!“ – und erst später die Mutter begrüßen.',f:1,p:1,x:'Und ich?',w:'Kinder einbeziehen ist gut, aber zuerst Blickkontakt zur Kundin.'}],
  b:'Kunden willkommen heißen',ihk:'„Guten Tag! Schön, dass Sie da sind – und ihr auch.“'},
 {m:14,sit:'Sie kauft zwei Paar Kinderschuhe. An der Kasse fragt sie: „Was ist, wenn die Schuhe zu Hause doch drücken?“',q:'Was sagt ihr zum Abschied?',o:[
  {t:'„Sie haben gute Schuhe gewählt, sie haben viel Platz für die Zehen. Wenn sie doch drücken, können Sie sie ungetragen umtauschen. Vielen Dank für Ihren Einkauf und ein schönes Wochenende!“',f:2,x:'Super, dann bin ich beruhigt.',w:'Kaufbestätigung mit Hinweis auf den Umtausch, Dank und situationsbezogene Verabschiedung.'},
  {t:'„Das ist dann Ihr Problem.“',f:0,x:'Wie bitte?!',w:'Eine Killerphrase. Der Kaufkater ist garantiert.'},
  {t:'„Tschüss.“',f:1,x:'Und meine Frage?',w:'Kein Dank, keine Bestätigung. Die Verabschiedung ist der letzte Eindruck.'},
  {t:'„Vielen Dank für Ihren Einkauf!“',f:1,p:1,x:'Ja, aber was ist mit dem Umtausch?',w:'Der Dank ist gut, aber ihre Frage nach dem Umtausch bleibt offen.'}],
  b:'Kaufbestätigung mit Verabschiedung',ihk:'„Ich beglückwünsche Sie zu dem Kauf … Wenn die Größe nicht passt, haben Sie die Möglichkeit eines Umtausches.“ (IHK, Winter 2025/26)'}]},

{id:'sc4',d:'schuhe',n:'Herr Ahmadi',f:{s:2,h:'kurz',c:'schwarz',alt:0},i:'Herr Ahmadi fragt nach Laufschuhen der Marke „Sprintex“.',k:0,s:[
 {m:13,sit:'Sprintex führt ihr nicht. Ihr habt aber Laufschuhe der Marke „Ventora“ in gleicher Qualität.',q:'Was sagt ihr?',o:[
  {t:'„Wir haben uns für die Marke Ventora entschieden. Probieren Sie diesen Schuh einmal – er hat für Sie den Vorteil, dass er besonders gut dämpft.“',f:2,x:'Okay, ich probiere ihn mal.',w:'Alternativangebot mit gleichem Standard. Das eigene Sortiment wird nicht herabgesetzt.'},
  {t:'„Sprintex führen wir leider nicht.“',f:0,x:'Schade. Tschüss.',w:'Beginnt mit dem, was fehlt. Der Kunde ist schon aus dem Gespräch.'},
  {t:'„Ich kann Ihnen höchstens den hier anbieten, der ist auch ganz gut.“',f:0,x:'„Auch ganz gut“? Na toll.',w:'„Höchstens“ und „auch ganz gut“ setzen das eigene Sortiment herab.'},
  {t:'Einen deutlich billigeren Schuh als Ersatz zeigen.',f:1,p:1,x:'Der sieht aber einfacher aus.',w:'Ein Alternativangebot muss den gleichen oder einen höheren Standard haben.'}],
  b:'Alternativangebot',ihk:'„Wir haben uns für den Hersteller … entschieden. Dieses Modell hat für Sie den Vorteil, dass …“',
  a:{q:'Was muss ein Alternativangebot haben?',o:['den gleichen oder einen höheren Standard','einen niedrigeren Preis','dieselbe Marke'],c:0}},
 {m:11,sit:'Er probiert den Schuh. Dann sagt er: „Ich muss noch einmal darüber schlafen.“ Er schaut zur Tür.',q:'Was macht ihr?',o:[
  {t:'„Das verstehe ich gut. Ich schreibe Ihnen die Modellnummer auf – dann finden Sie den Schuh sofort wieder.“',f:2,x:'Danke, sehr nett. Ich komme bestimmt wieder.',w:'Wahrscheinlich ein Vorwand. Verständnis zeigen, Rückzug ohne Gesichtsverlust, freundlich verabschieden.'},
  {t:'Noch fünf Argumente nennen, damit er doch kauft.',f:0,x:'Ich muss jetzt wirklich los.',w:'Beim Vorwand bringt Argumentieren nichts. Er fühlt sich bedrängt.'},
  {t:'„Dann haben Sie mir ja umsonst meine Zeit gestohlen.“',f:0,x:'Unverschämt!',w:'Ein Vorwurf. Der Kunde kommt sicher nicht wieder.'},
  {t:'„Welche Bedenken haben Sie denn noch?“ – und dann immer weiter nachbohren.',f:1,p:1,x:'Keine, ich will nur überlegen.',w:'Einmal vorsichtig nachfragen ist möglich. Nachbohren wirkt wie Druck.'}],
  b:'Vorwand',ihk:'Verständnis zeigen, nicht weiter argumentieren, freundlich verabschieden.',
  a:{q:'War das ein echter Einwand oder ein Vorwand?',o:['eher ein Vorwand','ein Einwand gegen die Qualität','ein Einwand gegen das Personal'],c:0}}]},

{id:'sc5',d:'schuhe',n:'Frau Petrović',f:{s:0,h:'lang',c:'braun',alt:1,x:'ohrring'},i:'Frau Petrović sucht Schuhe für eine Hochzeit.',k:129,s:[
 {m:7,sit:'Sie sagt: „So wie die im Schaufenster, aber irgendwie anders.“',q:'Wie ermittelt ihr den Bedarf?',o:[
  {t:'Ein Paar zeigen: „Ich zeige Ihnen einmal diese hier. Wie gefallen sie Ihnen? Was müsste anders sein?“',f:2,x:'Schon gut … aber der Absatz ist zu dünn.',w:'Sie kann ihren Wunsch nicht in Worte fassen. Indirekte Bedarfsermittlung: Testangebot vorlegen, Reaktion lesen.'},
  {t:'„Dann wissen Sie ja selbst nicht, was Sie wollen.“',f:0,x:'Na hören Sie mal!',w:'Ein Vorwurf.'},
  {t:'Zehn Fragen hintereinander stellen.',f:1,x:'Puh, das ist ja wie beim Amt.',w:'Fragen sind möglich, aber sie fühlt sich schnell ausgefragt. Hier hilft Zeigen mehr.'},
  {t:'„Wie viel wollen Sie ausgeben?“',f:0,p:1,x:'Das kommt drauf an …',w:'Die Preisfrage kommt zu früh. Sie engt ein und kann peinlich wirken.'}],
  b:'Indirekte Bedarfsermittlung',ihk:'„Ich zeige Ihnen einmal … Wie gefällt Ihnen dieses Modell?“',
  a:{q:'Welche Form der Bedarfsermittlung war das?',o:['indirekte (warenbezogene)','direkte','Aushändigungsverkauf'],c:0}},
 {m:5,sit:'Sie sagt: „Ich brauche eigentlich was Praktisches.“ Dann nimmt sie immer wieder die auffälligen roten Pumps in die Hand.',q:'Wie argumentiert ihr?',o:[
  {t:'„Dieses Modell fällt sofort auf – und die Verarbeitung sieht man auf den ersten Blick. Der Absatz ist breit, damit laufen Sie den ganzen Abend sicher.“',f:2,x:'(strahlt) Die probiere ich an!',w:'Eisbergmodell: „Praktisch“ sagt sie. Unter Wasser wirkt Schönheit. Das Motiv bedienen, ohne es auszusprechen – und das praktische Motiv auch.'},
  {t:'„Mit denen sehen alle, dass Sie sich etwas leisten können.“',f:0,x:'Wie bitte? So bin ich nicht!',w:'Ein emotionales Motiv offen ausgesprochen: Sie fühlt sich ertappt, das Vertrauen bricht.'},
  {t:'Nur flache, praktische Schuhe zeigen.',f:1,x:'Hm … ja.',w:'Hört nur auf die Worte, nicht auf das Verhalten.'},
  {t:'„Die roten sind eigentlich unpraktisch.“',f:0,p:1,x:'Schade.',w:'Erwartungen dämpfen – ein Gesprächsstörer.'}],
  b:'Eisbergmodell',ihk:'Über Wasser (sichtbar): Qualität, Preis, Service. Unter Wasser (unsichtbar): Geltungsbedürfnis, Schönheit, Unterhaltung.',
  a:{q:'Welches Kaufmotiv liegt hier unter der Wasserlinie?',o:['Schönheit – emotional','Zeitersparnis – rational','Geldersparnis – rational'],c:0}}]},

{id:'sc6',d:'schuhe',n:'Herr Krüger',f:{s:1,h:'glatze',c:'grau',alt:2,g:1},i:'Herr Krüger hält zwei Paar Hausschuhe in der Hand.',k:54,s:[
 {m:10,sit:'Filz für 39 Euro, Lammfell für 54 Euro. Er schaut unsicher hin und her.',q:'Wie nennt ihr den Preis?',o:[
  {t:'„Fühlen Sie einmal das Lammfell. Es hält die Füße warm und trocken – und kostet nur 15 Euro mehr.“',f:2,x:'Oh, das ist wirklich kuschelig.',w:'Verharmlosungsmethode: Nur den Mehrpreis nennen und den Unterschied fühlen lassen.'},
  {t:'„Die teuren sind halt teurer.“',f:0,x:'Das sehe ich selbst.',w:'Kein Argument, nur ein Satz ohne Inhalt.'},
  {t:'„Die einen kosten 39, die anderen 54 Euro.“',f:1,x:'Hm.',w:'Nackte Preise ohne Nutzen.'},
  {t:'„Lammfell, warm, 54 Euro.“',f:1,p:1,x:'Aha.',w:'Ansatz von Nutzen, aber kein ganzer Satz und kein Sie-Stil.'}],
  b:'Verharmlosungsmethode',ihk:'„… und der hier aus unserem Qualitätsprogramm kostet lediglich 4,50 EUR mehr.“',
  a:{q:'Wie heißt diese Art der Preisnennung?',o:['Verharmlosungsmethode','Verkleinerungsmethode','Zerlegungsmethode'],c:0}},
 {m:15,sit:'Er nimmt das Lammfell: „Können Sie mir die schön einpacken? Die sind ein Geschenk.“',q:'Was antwortet ihr?',o:[
  {t:'„Sehr gern, die Geschenkverpackung ist bei uns ein Service. Und falls die Größe nicht passt, kann man sie umtauschen.“',f:2,x:'Wunderbar!',w:'Geschenkverpackung und Umtausch sind warenbezogene Serviceleistungen. Damit hebt sich das Geschäft vom Onlinehandel ab.'},
  {t:'„Einpacken machen wir nicht.“',f:0,x:'Schade, dann eben nicht.',w:'Negativ formuliert – und ein wichtiger Service fehlt.'},
  {t:'„Papier liegt da vorne, das können Sie selbst.“',f:1,x:'Na gut …',w:'Wenig kundenorientiert.'},
  {t:'„Das kostet 5 Euro extra.“',f:1,p:1,x:'Aha.',w:'Eine Kostenpauschale darf das Geschäft verlangen. Ohne freundlichen Satz klingt es aber abweisend.'}],
  b:'Warenbezogene Serviceleistung',ihk:'warenbezogen: z. B. Umtausch, Reparatur (IHK) · Buch: Geschenkverpackung, Zustellung, Änderungen',
  a:{q:'Zu welchem Bereich gehört die Geschenkverpackung?',o:['warenbezogene Serviceleistung','kundenbezogene (allgemeine) Serviceleistung','zahlungsbezogene Serviceleistung'],c:0}}]},

{id:'sc7',d:'schuhe',n:'Frau Albrecht',f:{s:4,h:'locken',c:'schwarz',alt:1},i:'Frau Albrecht fragt euren Kollegen Tim nach Schuhcreme.',k:12,s:[
 {m:1,sit:'Tim sagt: „Da bin ich nicht zuständig.“',q:'Wie hätte Tim es besser gesagt?',o:[
  {t:'„Ich stelle Ihnen gleich die zuständige Kollegin vor.“',f:2,x:'Danke, das ist nett.',w:'Sag nicht, was du nicht tust – sag, was du tust.'},
  {t:'„Keine Ahnung, fragen Sie wen anders.“',f:0,x:'Unfreundlich!',w:'Abweisend und ohne Angebot.'},
  {t:'„Das weiß ich nicht genau.“',f:1,x:'Und jetzt?',w:'Ehrlich, aber ohne Angebot. Nach einer Absage kommt immer ein Angebot.'},
  {t:'„Ich kann ja mal versuchen, das herauszufinden.“',f:1,p:1,x:'Versuchen?',w:'„Versuchen“ klingt so, als ginge es schief. Besser: „Ich kümmere mich darum.“'}],
  b:'Positiv formulieren',ihk:'„Ich kümmere mich darum.“ statt „Ich werde es versuchen.“'},
 {m:1,sit:'Später sagt Tim zu einem Kunden: „Man kann den Schuh auch in der Waschmaschine waschen.“',q:'Was ist hier zu verbessern?',o:[
  {t:'Sie-Stil: „Sie können den Schuh auch in der Waschmaschine waschen.“',f:2,x:'Praktisch!',w:'Kundenorientierte Sprache: „Sie“ statt „man“.'},
  {t:'Nichts, der Satz ist perfekt.',f:0,x:'(hört kaum zu)',w:'„Man“ spricht niemanden persönlich an.'},
  {t:'Tim soll lauter sprechen.',f:1,x:'Ich hab ihn schon gehört.',w:'Die Stimme ist nicht das Problem, sondern das Wort „man“.'},
  {t:'„Der Schuh ist waschbar.“',f:1,p:1,x:'Aha.',w:'Kürzer, aber der Kunde wird nicht persönlich angesprochen.'}],
  b:'Sie-Stil',ihk:'„Damit können Sie …“ statt „Damit kann man …“'}]},

{id:'sc8',d:'schuhe',n:'Frau Berger',f:{s:1,h:'dutt',c:'braun',alt:1},i:'Frau Berger sucht Sneaker als Geschenk für ihre Tochter (15), Größe 39.',k:89,s:[
 {m:6,sit:'Ihr wisst schon: Die Tochter trägt gern Sportliches.',q:'Wie engt ihr die Auswahl ein?',o:[
  {t:'„Trägt Ihre Tochter eher helle oder dunkle Farben?“',f:2,x:'Eher helle, glaube ich.',w:'Alternativfrage: Die Auswahl wird kleiner. Sie passt in die Mitte des Gesprächs.'},
  {t:'„Sie wollen doch bestimmt keine Ware aus der vorigen Saison!“',f:0,x:'Äh, nein …?',w:'Negative Suggestivfrage. Sie wertet das eigene Sortiment ab.'},
  {t:'„Mag sie Farben?“',f:1,x:'Ja, wer nicht?',w:'Geschlossene Frage mit wenig Information.'},
  {t:'„Sie finden wohl auch, dass Weiß am schönsten ist?“',f:1,p:1,x:'Na ja …',w:'Positive Suggestivfrage. Mit Vorsicht benutzen, sie drängt in eine Richtung.'}],
  b:'Alternativfrage',ihk:'„Trägt Ihre Tochter eher helle oder dunkle Farben?“ (IHK, Winter 2025/26)',
  a:{q:'Welche Frageart war die beste?',o:['Alternativfrage','Suggestivfrage','offene Frage'],c:0}},
 {m:14,sit:'Jetzt stehen fünf Paar vor ihr. Sie sagt: „Die gefallen mir alle!“ und seufzt.',q:'Wie helft ihr ihr?',o:[
  {t:'Drei Paar wegräumen, zwei stehen lassen: „Lieber die weißen oder die grauen?“',f:2,x:'Die weißen! Ganz klar.',w:'Verringerung der Auswahl, dann Alternativfrage. So wird die Entscheidung leichter.'},
  {t:'„Da kann ich Ihnen auch nicht helfen. Sie müssen sich schon selbst entscheiden.“',f:0,x:'Dann gehe ich eben.',w:'Lässt die Kundin allein und klingt ungeduldig.'},
  {t:'Noch zwei weitere Paare holen.',f:1,x:'Oh nein, noch mehr …',w:'Mehr Auswahl macht es schwerer, nicht leichter.'},
  {t:'„Nehmen Sie einfach alle!“',f:0,p:1,x:'Haha. Nein.',w:'Keine echte Hilfe bei der Entscheidung.'}],
  b:'Verringerung der Auswahl',ihk:'z. B. Warenauswahl einengen; Umtauschmöglichkeit anbieten; Reservierung anbieten (IHK, Sommer 2025)',
  a:{q:'Welche Abschlusstechnik habt ihr zuerst benutzt?',o:['Verringerung der Auswahl','Ja-Fragen','Empfehlung des Verkäufers'],c:0}}]},

{id:'sc9',d:'schuhe',n:'Herr Vogt',f:{s:0,h:'kurz',c:'braun',alt:1,b:1},i:'Herr Vogt kommt mit Stiefeln. Die Sohle löst sich.',k:0,s:[
 {m:12,sit:'Er ruft euch an: „Ach, seien Sie doch still, Sie haben doch noch keine Ahnung!“',q:'Wie reagiert ihr?',o:[
  {t:'Ruhig bleiben: „Ich bin in der Ausbildung, und ich hole Ihnen gern eine erfahrene Kollegin dazu.“',f:2,x:'(brummt) Ja, machen Sie das.',w:'Nicht rechtfertigen, nicht zurückschießen. Bei Beleidigungen darf man an eine Vorgesetzte abgeben.'},
  {t:'„Sie haben doch selbst keine Ahnung!“',f:0,x:'Unverschämt!',w:'Zurückschimpfen macht den Konflikt größer.'},
  {t:'Wortlos weggehen.',f:0,x:'Hallo?! Ich rede mit Ihnen!',w:'Der Kunde bleibt mit seinem Ärger allein.'},
  {t:'Lange erklären, was ihr in der Ausbildung schon alles gelernt habt.',f:1,p:1,x:'Das interessiert mich nicht.',w:'Rechtfertigen hilft nicht. Ein sachlicher Satz genügt.'}],
  b:'Ruhig bleiben, Kollegin hinzuziehen',ihk:'z. B. Ruhe bewahren; sachlich bleiben; nicht provozieren lassen; Kollegen hinzuziehen (IHK, Winter 2024/25)'},
 {m:12,sit:'Eure Kollegin übernimmt. Herr Vogt ist jetzt ruhiger. Sie fragt euch danach: „Was war der erste Schritt?“',q:'Was antwortet ihr?',o:[
  {t:'Prüfen: Ist das ein echter Einwand? Ja – die Sohle löst sich wirklich.',f:2,x:'(Kollegin nickt)',w:'Vier-Schritt-Methode: 1. Überprüfung, 2. ernst nehmen, 3. entkräften, 4. fortsetzen.'},
  {t:'Ihm erklären, wie man Stiefel richtig pflegt.',f:0,x:'(Kollegin schüttelt den Kopf)',w:'Belehren ist im Konflikt falsch.'},
  {t:'Gleich neue Stiefel zeigen.',f:1,x:'(Kollegin: „Zu früh.“)',w:'Fortsetzen ist Schritt 4. Erst prüfen und ernst nehmen.'},
  {t:'Ihm sagen, dass Sohlen eben manchmal kaputtgehen.',f:0,p:1,x:'(Kollegin seufzt)',w:'Wiegelt ab und nimmt ihn nicht ernst.'}],
  b:'Vier-Schritt-Methode',ihk:'1. Überprüfung – 2. ernst nehmen – 3. entkräften – 4. fortsetzen',
  a:{q:'Was ist Schritt 2 der Vier-Schritt-Methode?',o:['Kunden ernst nehmen und erkunden, was ihn stört','Einwand entkräften','Gespräch fortsetzen'],c:0}}]},

{id:'sc10',d:'schuhe',n:'Frau Thiel',f:{s:3,h:'kurz',c:'schwarz',alt:1},i:'Frau Thiel schaut sich Winterstiefel an.',k:99,s:[
 {m:5,sit:'Sie fragt: „Gibt es die auch im Angebot oder mit Rabatt?“',q:'Was sagt ihr?',o:[
  {t:'„Ja, dieses Modell ist gerade reduziert. Und es hält viele Winter – damit sparen Sie doppelt.“',f:2,x:'Doppelt sparen klingt gut.',w:'Kaufmotiv Geldersparnis (rational) erkannt und bedient.'},
  {t:'„Mit diesen Stiefeln fallen Sie richtig auf.“',f:0,x:'Darum geht es mir nicht.',w:'Spricht Geltungsbedürfnis an. Ihr Motiv ist aber Geldersparnis.'},
  {t:'„Rabatte gibt es bei uns nie.“',f:1,x:'Schade.',w:'Negativ formuliert, und ihr Motiv wird nicht bedient.'},
  {t:'„Die haben jetzt ganz viele.“',f:0,p:1,x:'Und?',w:'Spricht Nachahmung an. Das passt nicht zu ihrer Frage.'}],
  b:'Kaufmotiv Geldersparnis',ihk:'Kauf preiswerter Sonderangebote → Geldersparnis (rationales Kaufmotiv)',
  a:{q:'Ist Geldersparnis rational oder emotional?',o:['rational','emotional','beides nicht'],c:0}},
 {m:15,sit:'Sie kauft die Stiefel und fragt: „Kann ich auf Rechnung zahlen?“',q:'Was antwortet ihr?',o:[
  {t:'„Ja, gern. Dann haben Sie 14 Tage Zeit zum Bezahlen.“',f:2,x:'Prima!',w:'Zahlung gegen Rechnung ist eine Zahlungserleichterung: Die Kundin bekommt eine Zahlungsfrist.'},
  {t:'„Bar oder gar nicht.“',f:0,x:'Dann eben gar nicht.',w:'Abweisend. Zahlungserleichterungen sind ein Service.'},
  {t:'„Das weiß ich nicht.“',f:1,x:'Können Sie fragen?',w:'Die eigenen Serviceleistungen sollte man kennen.'},
  {t:'„Wir haben kostenlose Parkplätze.“',f:1,p:1,x:'Das war nicht meine Frage.',w:'Das ist eine allgemeine Serviceleistung. Sie passt nicht zur Frage.'}],
  b:'Zahlungserleichterung',ihk:'zahlungsbezogen: z. B. Girocardzahlung, Kreditkarten-Zahlung (IHK) · Buch: Rechnung, Raten- oder Teilzahlung, Leasing',
  a:{q:'In welchen Bereich gehört „Zahlung auf Rechnung“?',o:['zahlungsbezogene Serviceleistung','warenbezogene Serviceleistung','kundenbezogene Serviceleistung'],c:0}}]},
];

/* ===== Kaufhaus Kranich – Szenen (Teil 2: Drogerie, Spielwaren, Feinkost) ===== */
SZENEN.push(
/* ---------- DROGERIE & PARFÜMERIE ---------- */
{id:'dr1',d:'drogerie',n:'Frau Lorenz',f:{s:0,h:'lang',c:'blond',alt:1},i:'Frau Lorenz sucht ein Parfüm für sich. Sie mag frische Düfte.',k:59,s:[
 {m:8,sit:'Im Regal stehen zwölf Düfte.',q:'Wie legt ihr vor?',o:[
  {t:'Drei frische Düfte auswählen, den Flakon in die Hand geben und eine Duftprobe auf ihr Handgelenk anbieten.',f:2,x:'Mmh, der zweite ist herrlich!',w:'Mehrere Sinne: sehen (Flakon), fühlen (glatte Oberfläche), riechen (Duftprobe am eigenen Körper).'},
  {t:'Die Düfte nur beschreiben, ohne Probe.',f:0,x:'Ich muss das doch riechen …',w:'Ein Parfüm verkauft man über den Duft.'},
  {t:'Alle zwölf Tester auf Papierstreifen sprühen.',f:1,x:'Jetzt riecht alles gleich.',w:'Zu viele Düfte verwirren. Drei, höchstens fünf.'},
  {t:'Nur den Flakon zeigen: „Schauen Sie, wie schön!“',f:1,p:1,x:'Schön, ja. Und wie riecht er?',w:'Nur ein Sinn wird angesprochen.'}],
  b:'Sinne einbeziehen',ihk:'Parfüm: Betrachtung des Flakons · Fühlen der glatten Oberfläche · Duftprobe am eigenen Körper'},
 {m:10,sit:'Ihr Lieblingsduft kostet als Eau de Parfum 89 Euro. Es gibt ihn auch als Eau de Toilette für 59 Euro. Sie sagt: „89 Euro, puh.“',q:'Wie reagiert ihr?',o:[
  {t:'„Den gleichen Duft gibt es auch als Eau de Toilette für 59 Euro. Er hält etwas kürzer – dafür sparen Sie 30 Euro.“',f:2,x:'Oh, das ist eine gute Idee.',w:'Vergleichsmethode: Neben der teureren Ausführung wirkt der Preis kleiner.'},
  {t:'„Wenn Ihnen das zu teuer ist, sind Sie hier falsch.“',f:0,x:'Dann gehe ich wohl.',w:'Eine Killerphrase.'},
  {t:'„Das ist eben Markenware.“',f:1,x:'Hm.',w:'Keine Information und kein Nutzen.'},
  {t:'„Pro Sprühstoß sind das nur ein paar Cent.“',f:1,p:1,x:'Wie viele denn genau?',w:'Verkleinerungsmethode ist denkbar. Ohne ehrliche, genaue Rechnung wirkt sie wie ein Trick.'}],
  b:'Vergleichsmethode',ihk:'„Das Gerät für 680,00 EUR hat die gleichen Funktionen wie das für 890,00 EUR … sparen Sie 210,00 EUR.“',
  a:{q:'Welche Methode war das?',o:['Vergleichsmethode','Verzögerungsmethode','Sandwich-Methode'],c:0}}]},

{id:'dr2',d:'drogerie',n:'Herr Schröder',f:{s:1,h:'kurz',c:'blond',alt:1,g:1},i:'Herr Schröder steht vor drei elektrischen Zahnbürsten. Er reist beruflich viel.',k:79,s:[
 {m:14,sit:'Er fragt: „Welche würden Sie an meiner Stelle nehmen?“',q:'Was antwortet ihr?',o:[
  {t:'„Ich empfehle Ihnen die mittlere: Sie warnt, wenn Sie zu fest drücken – das schont Ihr Zahnfleisch. Und der Akku hält zwei Wochen, ideal, weil Sie viel reisen.“',f:2,x:'Überzeugt. Die nehme ich.',w:'Empfehlung des Verkäufers – mit stichhaltigen Argumenten begründet.'},
  {t:'„Ist mir egal, die sind alle gleich.“',f:0,x:'Dann frag ich woanders.',w:'Lässt den unsicheren Kunden allein.'},
  {t:'„Die teuerste, die ist die beste.“',f:1,x:'Warum?',w:'Eine Empfehlung ohne Begründung, nur wegen des Preises.'},
  {t:'„Ich würde die mittlere nehmen.“',f:1,p:1,x:'Und warum?',w:'Empfehlung ja – aber ohne Begründung.'}],
  b:'Empfehlung des Verkäufers',ihk:'„Ich empfehle Ihnen …: … – für … völlig ausreichend.“',
  a:{q:'Welche Abschlusstechnik war das?',o:['Empfehlung des Verkäufers','Zusammenfassung der Argumente','Ja-Fragen'],c:0}},
 {m:13,sit:'Er nimmt die mittlere Zahnbürste. Er ist oft mit dem Koffer unterwegs.',q:'Was bietet ihr zusätzlich an?',o:[
  {t:'„Zu dieser Zahnbürste passt dieses Reiseetui. Darin ist sie im Koffer geschützt und bleibt sauber.“',f:2,x:'Gute Idee, nehme ich mit.',w:'Zusatzangebot: erhöht den Nutzen, passt zum Bedarf, kommt beim Hauptartikel.'},
  {t:'„Wollen Sie auch noch Kaugummis?“',f:0,x:'Nein.',w:'Hat nichts mit seinem Bedarf zu tun und ist geschlossen gefragt.'},
  {t:'„Wir haben auch Etuis.“',f:1,x:'Aha.',w:'Zeitpunkt richtig, aber kein Nutzen.'},
  {t:'„Ein Etui brauchen Sie bestimmt nicht, oder?“',f:0,p:1,x:'Nö.',w:'Negative Suggestivfrage.'}],
  b:'Zusatzangebot',ihk:'„Zu … passt … – damit …“',
  a:{q:'Ergänzung oder Zusatz?',o:['Zusatzangebot – die Zahnbürste funktioniert auch ohne Etui','Ergänzungsangebot – ohne Etui geht es nicht','Alternativangebot'],c:0}}]},

{id:'dr3',d:'drogerie',n:'Frau Kühn',f:{s:0,h:'pony',c:'rot',alt:1},i:'Frau Kühn kommt zur Theke.',k:16,s:[
 {m:7,sit:'Sie sagt: „Einmal die Sonnencreme mit Lichtschutzfaktor 50, die blaue Flasche, bitte.“',q:'Was tut ihr?',o:[
  {t:'Die Flasche holen, kurz prüfen, ob sie heil ist, und kassieren. Höchstens fragen: „Die große oder die kleine Flasche?“',f:2,x:'Die große, danke!',w:'Aushändigungsverkauf: Sie weiß genau, was sie will. Keine Bedarfsermittlung, höchstens eine Ergänzungsfrage.'},
  {t:'„Wofür brauchen Sie die Creme? Wo fahren Sie hin? Welcher Hauttyp sind Sie?“',f:0,x:'Ich will nur die Creme …',w:'Unnötiges Ausfragen. Sie weiß genau, was sie will.'},
  {t:'Drei andere Sonnencremes zeigen.',f:1,x:'Nein, ich will die blaue.',w:'Die Faustregel „drei Artikel“ gilt hier nicht – sie hat sich schon entschieden.'},
  {t:'Sie zum Regal schicken: „Da hinten, nehmen Sie sie selbst.“',f:1,p:1,x:'Na gut …',w:'Möglich, aber sie steht schon an der Theke. Kundenfreundlicher: aushändigen.'}],
  b:'Aushändigungsverkauf',ihk:'„Welche Menge darf es sein?“ · „Lieber am Stück oder geschnitten?“ (Ergänzungsfragen)',
  a:{q:'Wie heißt diese Verkaufssituation?',o:['Aushändigungsverkauf','indirekte Bedarfsermittlung','Alternativangebot'],c:0}},
 {m:15,sit:'Sie zahlt mit Karte, ihr Name steht darauf. Sie erzählt, dass sie morgen in den Urlaub fliegt.',q:'Wie verabschiedet ihr sie?',o:[
  {t:'„Vielen Dank für Ihren Einkauf, Frau Kühn – und einen erholsamen Urlaub!“',f:2,x:'Danke, Ihnen ein schönes Wochenende!',w:'Erst bedanken, mit Namen verabschieden, dann ein Satz passend zur Situation.'},
  {t:'„Der Nächste!“',f:0,x:'(geht ohne Gruß)',w:'Kein Dank, kein Abschied. Der letzte Eindruck bleibt hängen.'},
  {t:'„Tschüss.“',f:1,x:'Tschüss.',w:'Kein Dank, kein Name.'},
  {t:'„Vielen Dank.“',f:1,p:1,x:'Bitte.',w:'Der Dank ist gut, aber Name und Satz zur Situation fehlen.'}],
  b:'Verabschiedung',ihk:'„Vielen Dank für Ihren Einkauf, Frau Peters, und ein schönes Wochenende.“'}]},

{id:'dr4',d:'drogerie',n:'Herr Neumann',f:{s:4,h:'kurz',c:'schwarz',alt:0},i:'Herr Neumann schaut einen kleinen Haartrockner an.',k:39,s:[
 {m:11,sit:'Er sagt: „Der ist mir zu kompliziert.“',q:'Wie reagiert ihr?',o:[
  {t:'„Was genau erscheint Ihnen kompliziert – die Tasten oder die Aufsätze?“',f:2,x:'Die vielen Aufsätze. Und er ist so klein!',w:'Gegenfrage-Methode: Der Einwand ist ungenau. Erst herausfinden, was ihn stört.'},
  {t:'„Das ist doch ganz einfach, das kann jeder.“',f:0,x:'Ich bin also dumm, oder was?',w:'Eine Belehrung. Er fühlt sich dumm.'},
  {t:'Sofort einen anderen Haartrockner holen.',f:1,x:'Der ist ja noch größer.',w:'Vielleicht passend – aber ihr wisst noch nicht, was ihn stört.'},
  {t:'„Sie haben recht, aber er ist sehr gut.“',f:1,p:1,x:'Das sagen Sie.',w:'Ja-Aber ohne echtes Gegenargument. Der Einwand ist zu ungenau, um ihn zu entkräften.'}],
  b:'Gegenfrage-Methode',ihk:'„Welche Bedenken haben Sie? Worin liegen Ihre Zweifel?“',
  a:{q:'Welche Methode passt bei einem ungenauen Einwand?',o:['Gegenfrage-Methode','Preiseinwands-Methode','Umkehr-Methode'],c:0}},
 {m:11,sit:'Er sagt: „Und der ist so klein!“ Es ist ein Reisemodell mit Klappgriff.',q:'Was sagt ihr zu „so klein“?',o:[
  {t:'„Gerade das ist das Besondere: Er passt in jede Reisetasche, und mit dem Klappgriff braucht er kaum Platz.“',f:2,x:'Stimmt, ich fliege ja nächste Woche.',w:'Umkehr-Methode: Der scheinbare Nachteil ist ein Vorteil.'},
  {t:'„Klein ist doch egal.“',f:0,x:'Mir nicht.',w:'Nimmt den Einwand nicht ernst.'},
  {t:'„Dann nehmen Sie den großen.“',f:1,x:'Hm.',w:'Ohne zu prüfen, ob der kleine nicht gerade passt.'},
  {t:'„Wenn Sie ihn mit einem großen vergleichen …“ – und dann nichts weiter.',f:1,p:1,x:'Ja? Und?',w:'Vergleich angefangen, aber kein Vorteil genannt.'}],
  b:'Umkehr-Methode',ihk:'„Gerade das ist das Besondere an diesem Handy. … Sie können es sogar in der Hemdtasche tragen.“',
  a:{q:'Wie heißt die Umkehr-Methode noch?',o:['Bumerang-Methode','Ja-Aber-Methode','Vergleichs-Methode'],c:0}}]},

{id:'dr5',d:'drogerie',n:'Frau Seidel',f:{s:1,h:'dutt',c:'grau',alt:2,g:1},i:'Frau Seidel kommt zur Pflegeabteilung.',k:34,s:[
 {m:5,sit:'Sie sagt: „Ich war schon in drei Läden. Keiner konnte mir helfen. Meine Haut ist sehr trocken.“',q:'Wie beginnt ihr?',o:[
  {t:'„Ich bin überzeugt, wir finden für Sie das Richtige. Wir haben vor wenigen Tagen eine neue Pflegeserie bekommen.“',f:2,x:'Na, da bin ich gespannt.',w:'Vertrauensauslöser: Vertrauen in die Person und in die Leistungsfähigkeit des Geschäfts.'},
  {t:'„Die anderen Läden haben halt keine Ahnung.“',f:0,x:'Na ja …',w:'Abwertend und unprofessionell.'},
  {t:'„Mal sehen, ob wir was haben.“',f:1,x:'Klingt nicht sehr sicher.',w:'Klingt unsicher und baut kein Vertrauen auf.'},
  {t:'„Ich werde es versuchen.“',f:1,p:1,x:'Versuchen …',w:'„Versuchen“ klingt nach Scheitern.'}],
  b:'Vertrauensauslöser',ihk:'„Ich bin überzeugt, wir finden für Sie das Richtige.“'},
 {m:9,sit:'Sie liest die Inhaltsstoffe einer Creme. Die Creme ist ohne Duftstoffe und als Nachfüllpackung erhältlich.',q:'Wie argumentiert ihr?',o:[
  {t:'„Diese Creme ist ohne Duftstoffe. Dadurch ist sie besonders mild – Ihre trockene Haut wird gepflegt, ohne gereizt zu werden. Und die Nachfüllpackung spart Verpackungsmüll.“',f:2,x:'Das klingt genau richtig.',w:'Mit Gesundheit und Umwelt argumentieren – in der Kette Merkmal, Vorteil, Nutzen.'},
  {t:'„Die Creme ist echt toll.“',f:0,x:'Warum?',w:'Eine Verkaufsphrase.'},
  {t:'„Die Creme hat keine Duftstoffe.“',f:1,x:'Aha.',w:'Ein Merkmal, aber kein Nutzen.'},
  {t:'„Die Creme ist nicht schädlich.“',f:1,p:1,x:'Das will ich hoffen!',w:'Negativ formuliert („schädlich“). Besser positiv formulieren.'}],
  b:'Mit Gesundheit und Umwelt argumentieren',ihk:'„Das Gemüse, das ich Ihnen anbiete, ist ein Bioprodukt aus der Region.“'}]},

{id:'dr6',d:'drogerie',n:'Herr Ilić',f:{s:0,h:'glatze',c:'braun',alt:2,b:1},i:'Eure Kollegin Mia verkauft Herrn Ilić ein Blutdruckmessgerät. Batterien sind nicht dabei.',k:49,s:[
 {m:13,sit:'An der Kasse sagt Mia: „Brauchen Sie sonst noch was?“ Herr Ilić sagt: „Nein.“',q:'Was war falsch?',o:[
  {t:'Zu spät und geschlossen gefragt. Die Batterien sind ein Ergänzungsartikel – ohne sie funktioniert das Gerät nicht. Sie gehören beim Gerät angeboten.',f:2,x:'(Mia: „Oh. Stimmt.“)',w:'Ergänzungsartikel immer anbieten – beim Hauptartikel, nicht an der Kasse.'},
  {t:'Nichts. An der Kasse fragt man das so.',f:0,x:'(Herr Ilić kommt am Abend wieder: „Das Ding geht nicht!“)',w:'Fehlt der Ergänzungsartikel, ist der Kunde zu Hause enttäuscht.'},
  {t:'Sie hätte freundlicher lächeln sollen.',f:1,x:'(Mia: „Und sonst?“)',w:'Lächeln ist gut – aber Zeitpunkt und Frage sind das Problem.'},
  {t:'Die Frage kam zu spät, sonst war alles gut.',f:1,p:1,x:'(Mia: „Nur das?“)',w:'Zu spät, ja – aber auch geschlossen gefragt. Und der Ergänzungsartikel fehlt.'}],
  b:'Ergänzungsangebot – immer anbieten',ihk:'„Brauchen Sie sonst noch was?“ → zu spät (an der Kasse) und geschlossen gefragt.'},
 {m:13,sit:'Mia fragt: „Wie hättet ihr es gesagt?“',q:'Euer Satz:',o:[
  {t:'Beim Gerät: „Zu diesem Gerät gehören vier Batterien – dann können Sie heute Abend gleich messen.“',f:2,x:'(Mia: „Viel besser!“)',w:'Ergänzungsangebot mit Nutzen, beim Hauptartikel.'},
  {t:'„Batterien haben Sie sicher schon?“',f:0,x:'(Mia: „Hm, dann sagt er Ja.“)',w:'Negative Suggestivfrage.'},
  {t:'„Brauchen Sie Batterien?“',f:1,x:'(Mia: „Geht so.“)',w:'Inhalt richtig, aber geschlossen und ohne Nutzen.'},
  {t:'„Ohne Batterien geht das Gerät übrigens nicht.“',f:1,p:1,x:'(Mia: „Stimmt, aber …“)',w:'Richtig, aber kein Sie-Stil und kein Angebot.'}],
  b:'Ergänzungsangebot',ihk:'„Zu diesem Füller passen diese Patronen – damit können Sie ihn gleich heute benutzen.“',
  a:{q:'Was passiert, wenn man den Ergänzungsartikel vergisst?',o:['Er wird woanders gekauft, oder der Kunde bringt die Ware zurück','Nichts, der Kunde kommt sowieso wieder','Der Kunde bekommt Rabatt'],c:0}}]},

{id:'dr7',d:'drogerie',n:'Frau Krause',f:{s:0,h:'lang',c:'braun',alt:1,x:'schal'},i:'Frau Krause hält eine teure Gesichtsmaske in der Hand.',k:29,s:[
 {m:2,sit:'Beim Blick auf das Preisschild zieht sie die Augenbrauen hoch.',q:'Was kann das bedeuten – und was tut ihr?',o:[
  {t:'Das kann Skepsis bedeuten: Der Preis überrascht sie. Ich nenne den Preis nicht nackt, sondern verbinde ihn mit dem Nutzen.',f:2,x:'(hört interessiert zu)',w:'Erst beschreiben, was ich sehe – dann vorsichtig deuten – dann handeln.'},
  {t:'Sie ist sicher wütend. Lieber weggehen.',f:0,x:'(stellt die Maske zurück)',w:'Falsch gedeutet. Hochgezogene Augenbrauen sind kein Zeichen von Wut.'},
  {t:'Sie findet es bestimmt zu teuer. Sofort etwas Billigeres holen.',f:1,x:'Ich wollte eigentlich die hier …',w:'Möglich, aber kein Signal ist eindeutig. Erst vorsichtig klären.'},
  {t:'„Sie finden das zu teuer, oder?“',f:1,p:1,x:'Das habe ich nicht gesagt.',w:'Unterstellt eine Deutung. Vorsichtig bleiben.'}],
  b:'Mimik deuten',ihk:'„Die Kundin zieht die Augenbrauen hoch. Das kann bedeuten, dass …“'},
 {m:2,sit:'Ihr erklärt die Maske. Sie verschränkt die Arme und lehnt sich zurück. Im Laden ist die Klimaanlage sehr kalt.',q:'Was folgt daraus?',o:[
  {t:'Verschränkte Arme können Ablehnung bedeuten – oder ihr ist einfach kalt. Ich frage freundlich nach, statt weiter zu argumentieren.',f:2,x:'Ach, mir ist nur so kalt hier!',w:'Kein Körpersignal ist eindeutig. Die ganze Situation einbeziehen.'},
  {t:'Sie lehnt mich ab. Ich gehe.',f:0,x:'Wo wollen Sie denn hin?',w:'Zu schnell gedeutet. Vielleicht friert sie nur.'},
  {t:'Einfach weiterreden, Körpersprache ist egal.',f:1,x:'(schaut auf die Uhr)',w:'Körpersprache verrät viel. Sie gehört immer dazu.'},
  {t:'„Warum sind Sie so abweisend?“',f:0,p:1,x:'Bin ich doch gar nicht!',w:'Eine Unterstellung und ein Vorwurf.'}],
  b:'Kein Körpersignal ist eindeutig',ihk:'Verschränkte Arme können Ablehnung bedeuten – oder der Kunde friert einfach.'}]},

{id:'dr8',d:'drogerie',n:'Herr Fischer',f:{s:1,h:'kurz',c:'braun',alt:1},i:'Herr Fischer sucht einen Rasierer.',k:119,s:[
 {m:14,sit:'Er hat viele Wünsche genannt: leise, wasserdicht, langer Akku. Jetzt wirkt er erschöpft.',q:'Wie führt ihr zum Abschluss?',o:[
  {t:'„Sie wollten einen leisen Rasierer, den Sie auch unter der Dusche nutzen können und der lange durchhält – genau das haben Sie hier.“',f:2,x:'Stimmt. Genau so.',w:'Zusammenfassung der wichtigsten Argumente: zeigt, dass ihr zugehört habt, und schafft eine Ja-Stimmung.'},
  {t:'Noch einmal alle zwölf Funktionen erklären.',f:0,x:'Mir schwirrt der Kopf.',w:'Er ist erschöpft. Noch mehr Information verwirrt.'},
  {t:'„Und? Nehmen Sie ihn?“',f:1,x:'Äh … mal sehen.',w:'Plump und zu früh – kein Kaufsignal abgewartet.'},
  {t:'„Sie wollen doch sicher den Rasierer, oder?“',f:0,p:1,x:'Jetzt drängeln Sie aber.',w:'Suggestivfrage mit Druck.'}],
  b:'Zusammenfassung der wichtigsten Argumente',ihk:'„Diese Tasche ist sehr strapazierfähig und trotzdem leicht … und ist somit für Sie genau das Richtige.“'},
 {m:14,sit:'Er kauft. Auf dem Weg zur Kasse murmelt er: „Hoffentlich war das nicht zu teuer …“',q:'Was sagt ihr?',o:[
  {t:'„Sie haben eine gute Wahl getroffen: Er ist wasserdicht und sehr leise. Und Sie haben zwei Jahre Garantie.“',f:2,x:'Stimmt. Ich freu mich drauf.',w:'Kaufentscheidung bekräftigen: Kaufmotiv unterstützen, Qualität bestätigen. So fängt man den Kaufkater auf.'},
  {t:'Nichts sagen, er hat ja schon gekauft.',f:0,x:'(ist unsicher und bringt ihn morgen zurück)',w:'Der Kaufkater bleibt. Folge: Umtausch – oder er kommt nicht wieder.'},
  {t:'„Ach, Geld ist doch nur Geld.“',f:1,x:'Für Sie vielleicht.',w:'Nimmt seine Sorge nicht ernst.'},
  {t:'„Teuer ist er schon, ja.“',f:0,p:1,x:'Oh nein …',w:'Bestätigt die Sorge statt die Entscheidung.'}],
  b:'Kaufkater auffangen',ihk:'„Sie haben eine gute Entscheidung getroffen, …“ (Unterstützung des Kaufmotivs)',
  a:{q:'Wie nennt man das Gefühl, einen Kauf sofort zu bereuen?',o:['Kaufkater','Preisschock','Eisberg'],c:0}}]},

/* ---------- SPIELWAREN ---------- */
{id:'sw1',d:'spiel',n:'Frau Engel',f:{s:0,h:'kurz',c:'weiss',alt:2,g:1},i:'Frau Engel sucht ein Geschenk für ihren Enkel.',k:49,s:[
 {m:7,sit:'Sie sagt: „Ich brauche ein Geschenk für meinen Enkel, weiß aber noch nicht, was.“',q:'Wie geht ihr vor?',o:[
  {t:'Nach Person und Interessen fragen: „Wie alt ist Ihr Enkel, und was macht er gern?“',f:2,x:'Er ist neun und baut so gern.',w:'Direkte Bedarfsermittlung: Sie weiß nur ungefähr, was sie will – also fragen.'},
  {t:'Einfach das teuerste Spielzeug einpacken.',f:0,x:'Halt, halt!',w:'Ohne Bedarfsermittlung und gegen das Interesse der Kundin.'},
  {t:'Sofort ein beliebtes Spiel zeigen.',f:1,x:'Hm, ob ihm das gefällt?',w:'Ein Testangebot ins Blaue. Ohne Alter und Interessen trifft es selten.'},
  {t:'„Möchten Sie ein Brettspiel oder ein Puzzle?“',f:1,p:1,x:'Weiß ich doch nicht.',w:'Alternativfrage zu früh.'}],
  b:'Direkte Bedarfsermittlung',ihk:'„Für wen soll das Geschenk denn sein?“ · „Was macht die Person gern in ihrer Freizeit?“',
  a:{q:'Welche Form der Bedarfsermittlung war das?',o:['direkte','indirekte','keine (Aushändigungsverkauf)'],c:0}},
 {m:6,sit:'Der Enkel ist neun und baut gern. Frau Engel schaut euch erwartungsvoll an.',q:'Welche Frage bringt euch weiter?',o:[
  {t:'„Spielt Ihr Enkel lieber allein oder lieber mit anderen?“',f:2,x:'Am liebsten mit seinem Freund.',w:'Alternativfrage: Sie verkleinert die Auswahl (Bausatz für einen oder Spiel für mehrere).'},
  {t:'„Sie wollen sicher nichts Billiges für Ihren Enkel?“',f:0,x:'Wie meinen Sie das?',w:'Suggestivfrage mit Druck.'},
  {t:'„Baut er gern?“',f:1,x:'Das hab ich doch gerade gesagt.',w:'Das wisst ihr schon. Geschlossen und ohne neue Information.'},
  {t:'„Sie legen doch sicher Wert auf Qualität?“',f:1,p:1,x:'Natürlich.',w:'Rhetorische Frage – sie bringt keine Information.'}],
  b:'Alternativfrage',ihk:'„Spielt Ihr Enkelkind lieber alleine oder spielt es lieber mit anderen?“ (IHK)',
  a:{q:'Welche Frageart war die beste?',o:['Alternativfrage','Suggestivfrage','rhetorische Frage'],c:0}}]},

{id:'sw2',d:'spiel',n:'Herr Hoffmann',f:{s:2,h:'kurz',c:'braun',alt:1,b:1},i:'Herr Hoffmann steht an der großen Autorennbahn.',k:149,s:[
 {m:14,sit:'Er sagt: „Mit der Bahn spielt mein Sohn sicher sehr gern. Die Teile sind stabil, und man kann sie erweitern …“',q:'Was hört ihr heraus – und was tut ihr?',o:[
  {t:'Das sind Kaufsignale. Jetzt zum Abschluss: „Möchten Sie die Bahn gleich mitnehmen, oder nutzen Sie unseren Lieferservice?“',f:2,x:'Liefern wäre super.',w:'Kaufsignale: Zustimmung und Wiederholung der Argumente. Abschluss mit einer Alternativfrage.'},
  {t:'Er zweifelt noch. Noch drei andere Bahnen zeigen.',f:0,x:'Jetzt weiß ich nicht mehr …',w:'Kaufsignal übersehen.'},
  {t:'Er mag die Bahn. Abwarten, was er sagt.',f:1,x:'(wartet auch)',w:'Signal richtig gedeutet, aber der Abschluss wird nicht eingeleitet.'},
  {t:'„Greifen Sie zu, solange der Aktionspreis gilt!“ – es gibt aber gar keine Aktion.',f:0,p:1,x:'Welche Aktion?',w:'Künstliche Verknappung ist Druck und Täuschung.'}],
  b:'Sprachliche Kaufsignale',ihk:'„Möchten Sie den Artikel gleich mitnehmen oder nutzen Sie unseren Lieferservice?“',
  a:{q:'Welche Abschlusstechnik habt ihr benutzt?',o:['Alternativfrage','Ja-Fragen','direkte Kaufaufforderung'],c:0}},
 {m:15,sit:'Er fragt: „Wie bekomme ich die große Kiste nach Hause? Und kann ich mit Kreditkarte zahlen?“',q:'Was antwortet ihr?',o:[
  {t:'„Wir liefern Ihnen die Bahn nach Hause. Und natürlich können Sie mit Kreditkarte zahlen.“',f:2,x:'Perfekt.',w:'Lieferung = warenbezogene Serviceleistung. Kreditkarte = zahlungsbezogene Serviceleistung.'},
  {t:'„Tragen müssen Sie selbst, und bei uns wird bar bezahlt.“',f:0,x:'Dann bestelle ich online.',w:'Zwei Serviceleistungen fehlen – genau damit hebt man sich vom Onlinehandel ab.'},
  {t:'„Parkplätze haben wir genug.“',f:1,x:'Und die Kiste?',w:'Parkplätze sind eine allgemeine Serviceleistung – passen aber nicht zu seinen Fragen.'},
  {t:'„Karte geht. Liefern weiß ich nicht.“',f:1,p:1,x:'Können Sie das herausfinden?',w:'Halb beantwortet. Die eigenen Serviceleistungen gehören zum Wissen.'}],
  b:'Serviceleistungen in drei Bereichen',ihk:'warenbezogen – kundenbezogen – zahlungsbezogen',
  a:{q:'Zu welchem Bereich gehört die Lieferung nach Hause?',o:['warenbezogene Serviceleistung','zahlungsbezogene Serviceleistung','kundenbezogene (allgemeine) Serviceleistung'],c:0}}]},

{id:'sw3',d:'spiel',n:'Frau Marx',f:{s:3,h:'zopf',c:'schwarz',alt:1},i:'Frau Marx kauft ein ferngesteuertes Auto für ihre Tochter.',k:79,s:[
 {m:13,sit:'Im Karton ist kein Akku. Ohne Akku fährt das Auto nicht.',q:'Was macht ihr?',o:[
  {t:'Jetzt, beim Auto: „Zu diesem Auto gehört dieser Akku – dann kann Ihre Tochter sofort nach dem Auspacken losfahren.“',f:2,x:'Gut, dass Sie das sagen!',w:'Ergänzungsangebot: notwendig für die Nutzung. Immer anbieten, sonst Enttäuschung zu Hause.'},
  {t:'Nichts sagen. Sie wird es schon merken.',f:0,x:'(kommt am Geburtstag wütend zurück)',w:'Im schlimmsten Fall bringt sie das Auto zurück.'},
  {t:'Erst an der Kasse: „Akku?“',f:1,x:'Wieso Akku?',w:'Zu spät und zu knapp.'},
  {t:'„Wollen Sie noch eine Rampe dazu?“',f:1,p:1,x:'Vielleicht …',w:'Ein Zusatzartikel – aber der notwendige Akku fehlt noch.'}],
  b:'Ergänzungsangebot',ihk:'„Ohne Pumpe kommen Sie nicht aufs Wasser – diese hier passt genau auf das Ventil.“',
  a:{q:'Was ist der Akku hier?',o:['Ergänzungsartikel – notwendig','Zusatzartikel – erhöht nur den Nutzen','Alternativartikel'],c:0}},
 {m:10,sit:'Auto und Akku kosten zusammen 79 Euro. Sie fragt nach dem Preis.',q:'Wie nennt ihr ihn?',o:[
  {t:'„Das Auto ist robust und fährt auch über Rasen. Zusammen mit dem Akku kostet es 79 Euro – und Ihre Tochter kann sofort losfahren.“',f:2,x:'Das passt.',w:'Sandwich-Methode: Nutzen – Preis – Nutzen.'},
  {t:'„Das wird jetzt leider teuer: 79 Euro.“',f:0,x:'Oh.',w:'„Leider teuer“ ist eine Negativformulierung.'},
  {t:'„79 Euro.“',f:1,x:'Hm.',w:'Ein nackter Preis.'},
  {t:'„Das Auto kostet nur 59 Euro.“ Den Akku erst an der Kasse dazurechnen.',f:0,p:1,x:'(an der Kasse) Wieso 79?!',w:'Einen Teilpreis nennen und den Rest verschweigen ist Täuschung. Am Ende steht immer die Gesamtsumme.'}],
  b:'Sandwich-Methode',ihk:'„Der Stoff ist atmungsaktiv …, das Hemd kostet 59 Euro – und Sie müssen es nach dem Waschen nicht bügeln.“'}]},

{id:'sw4',d:'spiel',n:'Herr Ostermann',f:{s:1,h:'glatze',c:'braun',alt:1,g:1},i:'Herr Ostermann ist Stammkunde. Er kauft einen großen Bausteinkasten.',k:119,s:[
 {m:11,sit:'Er fragt: „Geht da noch was am Preis?“ Ihr dürft Nachlässe geben.',q:'Was bietet ihr zuerst an?',o:[
  {t:'Erst eine kleine Zugabe: „Ich lege Ihnen gern eine Sortierbox dazu.“',f:2,x:'Oh, die kann ich gut brauchen.',w:'Reihenfolge: erst eine kleine Zugabe, dann eine kleine Serviceleistung, erst dann ein Preisnachlass.'},
  {t:'Sofort 20 Prozent Rabatt.',f:0,x:'Super, nächstes Mal frage ich wieder!',w:'Senkt die Spanne und schafft die Erwartung für den nächsten Einkauf.'},
  {t:'„Nein, Preis ist Preis.“',f:1,x:'Schade, ich bin doch Stammkunde.',w:'Klar, aber wenig kundenfreundlich – ihr dürft ja etwas anbieten.'},
  {t:'Erst eine kostenlose Geschenkverpackung, dann eine Zugabe.',f:1,p:1,x:'Nett.',w:'Gute Idee, aber die Reihenfolge im Buch ist: erst Zugabe, dann Service, dann Nachlass.'}],
  b:'Reihenfolge bei Preisnachlass',ihk:'erst eine kleine Zugabe, dann eine kleine Serviceleistung, erst dann ein Preisnachlass'},
 {m:11,sit:'Er sagt trotzdem: „Für den Preis kaufe ich das nicht.“ Alle Argumente sind schon genannt.',q:'Was ist euer letztes Mittel?',o:[
  {t:'„Unterbreiten Sie mir einen Vorschlag – unter welchen Bedingungen würden Sie den Kasten mitnehmen?“',f:2,x:'Mit kostenloser Lieferung wäre ich dabei.',w:'Preiseinwands-Methode: das letzte Mittel.'},
  {t:'„Dann eben nicht.“',f:0,x:'(geht)',w:'Gibt den Stammkunden auf.'},
  {t:'Alle Argumente noch einmal wiederholen.',f:1,x:'Das kenne ich schon.',w:'Wiederholen wirkt wie Druck.'},
  {t:'„Sie haben recht, aber …“ – und dasselbe Argument wie vorher.',f:1,p:1,x:'Das sagten Sie schon.',w:'Ja-Aber ohne neues Argument bringt nichts.'}],
  b:'Preiseinwands-Methode',ihk:'„Unterbreiten Sie mir einen Vorschlag, unter welchen Bedingungen Sie diesen Artikel kaufen würden.“',
  a:{q:'Welche Methode war das?',o:['Preiseinwands-Methode','Umkehr-Methode','Vergleichs-Methode'],c:0}}]},

{id:'sw5',d:'spiel',n:'Frau Brandt',f:{s:0,h:'locken',c:'blond',alt:1},i:'Frau Brandt sucht ein Puppenhaus. Eure Kollegin Mia bedient sie.',k:89,s:[
 {m:7,sit:'Mia: „Wie viel möchten Sie denn ausgeben?“ – Kundin: „Nicht mehr als nötig.“ – Mia: „Null Problem! Ich zeig Ihnen mal die billigen.“',q:'Welche Fehler hat Mia gemacht?',o:[
  {t:'Sie fragt zu früh nach dem Preis, statt den Bedarf zu ermitteln. Und „billig“ und „Null Problem“ sind Umgangssprache.',f:2,x:'(Mia wird rot)',w:'Genau diese Fehler nennt die IHK-Lösung (Sommer 2026).'},
  {t:'Keine. Sparen ist doch gut.',f:0,x:'(Die Kundin schaut skeptisch.)',w:'Die Bedarfsermittlung fehlt ganz.'},
  {t:'Nur „Null Problem“ war falsch.',f:1,x:'(Mia: „Nur das?“)',w:'Umgangssprache ja – aber die Preisfrage am Anfang ist der größere Fehler.'},
  {t:'Sie hätte lieber das teuerste Haus zeigen sollen.',f:0,p:1,x:'(Mia: „Echt?“)',w:'Keine Ausweichmöglichkeit nach oben, und die Kundin wird verschreckt.'}],
  b:'Fehlerhaftes Verkaufsgespräch',ihk:'Frage nach dem Preis → „Wofür möchten Sie … verwenden?“ · „billig“ → „ein preisgünstiges Modell“ (IHK, Sommer 2026)'},
 {m:7,sit:'Mia fragt: „Was hätte ich sagen sollen?“',q:'Euer Satz:',o:[
  {t:'„Wie alt ist das Kind, und womit spielt es gern?“ – und später: „Ich zeige Ihnen gern ein preisgünstiges Modell.“',f:2,x:'(Mia: „Okay, das merke ich mir.“)',w:'Erst den Bedarf ermitteln. Statt „billig“: „preisgünstig“.'},
  {t:'„Wollen Sie das billigste?“',f:0,x:'(Mia: „Hm.“)',w:'Wieder Preis zuerst und wieder „billig“.'},
  {t:'„Haben Sie ein Budget?“',f:1,x:'(Mia: „Schon besser?“)',w:'Höflicher, aber immer noch zu früh gefragt.'},
  {t:'„Ich zeige Ihnen mal die preiswerten.“',f:1,p:1,x:'(Mia: „Besser!“)',w:'Besseres Wort als „billig“. Aber der Bedarf ist noch nicht ermittelt.'}],
  b:'Erst der Bedarf, dann der Preis',ihk:'„Selbstverständlich, ich kann Ihnen gerne ein preisgünstiges Modell zeigen!“ (IHK)'}]},

{id:'sw6',d:'spiel',n:'Herr Schmitt',f:{s:4,h:'locken',c:'schwarz',alt:1,b:1},i:'Herr Schmitt sucht etwas für seine Tochter (10).',k:60,s:[
 {m:9,sit:'Ihr zeigt einen Experimentierkasten. Die Anleitung erklärt jeden Schritt mit Bildern.',q:'Wie argumentiert ihr?',o:[
  {t:'„Die Anleitung zeigt jeden Schritt mit Bildern. Dadurch kann Ihre Tochter allein experimentieren – Sie müssen nicht die ganze Zeit danebensitzen.“',f:2,x:'Ha, das klingt gut für mich!',w:'Der Nutzen ist für den Kunden – das ist hier der Vater, nicht das Kind.'},
  {t:'„Der Kasten ist echt cool.“',f:0,x:'Okay …',w:'Eine Verkaufsphrase.'},
