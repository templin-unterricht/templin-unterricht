 der vorigen Saison!“": {"vi": "„Chắc chị không muốn hàng mùa trước chứ!“", "tr": "„Geçen sezonun malını istemezsiniz herhalde!“", "ar": "«لا شك أنك لا تريدين بضاعة الموسم الماضي!»"}, "„Mag sie Farben?“": {"vi": "„Cháu có thích màu sắc không?“", "tr": "„Renkleri sever mi?“", "ar": "«هل تحب الألوان؟»"}, "„Sie finden wohl auch, dass Weiß am schönsten ist?“": {"vi": "„Chắc chị cũng thấy màu trắng là đẹp nhất nhỉ?“", "tr": "„Siz de herhalde en güzel rengin beyaz olduğunu düşünüyorsunuz?“", "ar": "«أظنك ترين أيضًا أن الأبيض هو الأجمل؟»"}, "Jetzt stehen fünf Paar vor ihr. Sie sagt: „Die gefallen mir alle!“ und seufzt.": {"vi": "Giờ có năm đôi đặt trước mặt bà. Bà nói: „Tôi thích tất cả!“ rồi thở dài.", "tr": "Şimdi önünde beş çift duruyor. Diyor ki: „Hepsini beğendim!“ ve iç çekiyor.", "ar": "أمامها الآن خمسة أزواج. تقول: «كلها تعجبني!» وتتنهّد."}, "Wie helft ihr ihr?": {"vi": "Các bạn giúp bà thế nào?", "tr": "Ona nasıl yardım edersiniz?", "ar": "كيف تساعدونها؟"}, "Drei Paar wegräumen, zwei stehen lassen: „Lieber die weißen oder die grauen?“": {"vi": "Cất ba đôi đi, để lại hai đôi: „Chị thích đôi trắng hay đôi xám hơn?“", "tr": "Üç çifti kaldırıp ikisini bırakmak: „Beyazları mı yoksa grileri mi tercih edersiniz?“", "ar": "إزالة ثلاثة أزواج وترك زوجين: «هل تفضّلين الأبيض أم الرمادي؟»"}, "„Da kann ich Ihnen auch nicht helfen. Sie müssen sich schon selbst entscheiden.“": {"vi": "„Tôi cũng không giúp được chị. Chị phải tự quyết định thôi.“", "tr": "„Ben de size yardımcı olamam. Kendiniz karar vermelisiniz.“", "ar": "«لا أستطيع مساعدتك أنا أيضًا. عليك أن تقرّري بنفسك.»"}, "Noch zwei weitere Paare holen.": {"vi": "Lấy thêm hai đôi nữa.", "tr": "İki çift daha getirmek.", "ar": "إحضار زوجين آخرين."}, "„Nehmen Sie einfach alle!“": {"vi": "„Chị cứ lấy hết đi!“", "tr": "„Hepsini alın!“", "ar": "«خذي كلها!»"}, "Herr Vogt kommt mit Stiefeln. Die Sohle löst sich.": {"vi": "Ông Vogt đến với một đôi ủng. Đế ủng bị bong.", "tr": "Bay Vogt botlarla geliyor. Taban sökülüyor.", "ar": "يأتي السيد Vogt ومعه حذاء طويل. النعل ينفصل."}, "Er ruft euch an: „Ach, seien Sie doch still, Sie haben doch noch keine Ahnung!“": {"vi": "Ông quát các bạn: „Ôi, im đi, các người còn chẳng biết gì!“", "tr": "Size bağırıyor: „Ay, susun, daha hiçbir şey bilmiyorsunuz ki!“", "ar": "يصرخ فيكم: «آه، اصمتوا، أنتم لا تعرفون شيئًا بعد!»"}, "Ruhig bleiben: „Ich bin in der Ausbildung, und ich hole Ihnen gern eine erfahrene Kollegin dazu.“": {"vi": "Giữ bình tĩnh: „Tôi đang học nghề, và tôi xin mời một đồng nghiệp có kinh nghiệm đến giúp ông.“", "tr": "Sakin kalmak: „Ben çırağım ve size deneyimli bir meslektaşımı çağırmaktan memnuniyet duyarım.“", "ar": "الحفاظ على الهدوء: «أنا في فترة التدريب، ويسعدني أن أستدعي زميلة ذات خبرة لمساعدتك.»"}, "„Sie haben doch selbst keine Ahnung!“": {"vi": "„Chính ông cũng chẳng biết gì!“", "tr": "„Siz de hiçbir şey bilmiyorsunuz!“", "ar": "«أنت أيضًا لا تعرف شيئًا!»"}, "Wortlos weggehen.": {"vi": "Lặng lẽ bỏ đi.", "tr": "Sessizce uzaklaşmak.", "ar": "الابتعاد بصمت."}, "Lange erklären, was ihr in der Ausbildung schon alles gelernt habt.": {"vi": "Giải thích dài dòng mình đã học được những gì trong thời gian học nghề.", "tr": "Çıraklıkta şimdiye kadar neler öğrendiğinizi uzun uzun anlatmak.", "ar": "الشرح مطوّلًا عمّا تعلّمتموه حتى الآن في التدريب."}, "Eure Kollegin übernimmt. Herr Vogt ist jetzt ruhiger. Sie fragt euch danach: „Was war der erste Schritt?“": {"vi": "Đồng nghiệp của các bạn tiếp quản. Ông Vogt giờ đã bình tĩnh hơn. Sau đó cô hỏi các bạn: „Bước đầu tiên là gì?“", "tr": "Meslektaşınız devralıyor. Bay Vogt artık daha sakin. Sonra size soruyor: „İlk adım neydi?“", "ar": "تتولّى زميلتكم الأمر. السيد Vogt أكثر هدوءًا الآن. ثم تسألكم: «ما كانت الخطوة الأولى؟»"}, "Prüfen: Ist das ein echter Einwand? Ja – die Sohle löst sich wirklich.": {"vi": "Kiểm tra: Đây có phải là phản đối thật không? Có – đế giày thật sự bị bong.", "tr": "Kontrol etmek: Bu gerçek bir itiraz mı? Evet – taban gerçekten sökülüyor.", "ar": "الفحص: هل هذا اعتراض حقيقي؟ نعم – النعل ينفصل فعلًا."}, "Ihm erklären, wie man Stiefel richtig pflegt.": {"vi": "Giải thích cho ông cách bảo quản ủng đúng cách.", "tr": "Ona botların nasıl doğru bakım yapılacağını anlatmak.", "ar": "شرح كيفية العناية بالحذاء الطويل بشكل صحيح."}, "Gleich neue Stiefel zeigen.": {"vi": "Cho xem ngay đôi ủng mới.", "tr": "Hemen yeni botlar göstermek.", "ar": "عرض حذاء طويل جديد فورًا."}, "Ihm sagen, dass Sohlen eben manchmal kaputtgehen.": {"vi": "Nói với ông rằng đế giày đôi khi vẫn bị hỏng thôi.", "tr": "Ona tabanların bazen bozulabileceğini söylemek.", "ar": "إخباره بأن النعال تتلف أحيانًا."}, "Frau Thiel schaut sich Winterstiefel an.": {"vi": "Bà Thiel xem những đôi ủng mùa đông.", "tr": "Bayan Thiel kışlık botlara bakıyor.", "ar": "تنظر السيدة Thiel إلى أحذية الشتاء الطويلة."}, "Sie fragt: „Gibt es die auch im Angebot oder mit Rabatt?“": {"vi": "Bà hỏi: „Loại này có khuyến mãi hay giảm giá không?“", "tr": "Soruyor: „Bunlar indirimde ya da kampanyalı mı?“", "ar": "تسأل: «هل هذه في العرض أو عليها خصم؟»"}, "„Ja, dieses Modell ist gerade reduziert. Und es hält viele Winter – damit sparen Sie doppelt.“": {"vi": "„Có, mẫu này hiện đang giảm giá. Và nó bền nhiều mùa đông – như vậy chị tiết kiệm gấp đôi.“", "tr": "„Evet, bu model şu an indirimde. Ve birçok kış dayanır – böylece iki kat tasarruf edersiniz.“", "ar": "«نعم، هذا الموديل مخفّض الآن. ويدوم شتاءات كثيرة – وهكذا توفّرين مرتين.»"}, "„Mit diesen Stiefeln fallen Sie richtig auf.“": {"vi": "„Đi đôi ủng này chị sẽ thật nổi bật.“", "tr": "„Bu botlarla gerçekten göze çarparsınız.“", "ar": "«بهذا الحذاء ستلفتين الأنظار فعلًا.»"}, "„Rabatte gibt es bei uns nie.“": {"vi": "„Chỗ chúng tôi không bao giờ có giảm giá.“", "tr": "„Bizde asla indirim olmaz.“", "ar": "«لا توجد خصومات عندنا أبدًا.»"}, "„Die haben jetzt ganz viele.“": {"vi": "„Bây giờ nhiều người có đôi này lắm.“", "tr": "„Şu an çok kişide bunlardan var.“", "ar": "«الآن كثيرون لديهم هذا الحذاء.»"}, "Sie kauft die Stiefel und fragt: „Kann ich auf Rechnung zahlen?“": {"vi": "Bà mua đôi ủng và hỏi: „Tôi thanh toán theo hóa đơn được không?“", "tr": "Botları alıyor ve soruyor: „Faturayla ödeyebilir miyim?“", "ar": "تشتري الحذاء وتسأل: «هل يمكنني الدفع على الفاتورة؟»"}, "„Ja, gern. Dann haben Sie 14 Tage Zeit zum Bezahlen.“": {"vi": "„Được ạ. Chị có 14 ngày để thanh toán.“", "tr": "„Evet, memnuniyetle. O zaman ödemek için 14 gününüz var.“", "ar": "«نعم، بكل سرور. عندها لديك 14 يومًا للدفع.»"}, "„Bar oder gar nicht.“": {"vi": "„Tiền mặt hoặc không bán.“", "tr": "„Ya nakit ya hiç.“", "ar": "«نقدًا أو لا شيء.»"}, "„Das weiß ich nicht.“": {"vi": "„Tôi không biết.“", "tr": "„Bilmiyorum.“", "ar": "«لا أعرف.»"}, "„Wir haben kostenlose Parkplätze.“": {"vi": "„Chúng tôi có chỗ đỗ xe miễn phí.“", "tr": "„Ücretsiz otoparkımız var.“", "ar": "«لدينا مواقف سيارات مجانية.»"}, "Frau Lorenz sucht ein Parfüm für sich. Sie mag frische Düfte.": {"vi": "Bà Lorenz tìm nước hoa cho mình. Bà thích mùi hương tươi mát.", "tr": "Bayan Lorenz kendisi için parfüm arıyor. Ferah kokuları seviyor.", "ar": "تبحث السيدة Lorenz عن عطر لنفسها. تحب العطور المنعشة."}, "Im Regal stehen zwölf Düfte.": {"vi": "Trên kệ có mười hai mùi hương.", "tr": "Rafta on iki koku var.", "ar": "على الرف اثنا عشر عطرًا."}, "Wie legt ihr vor?": {"vi": "Các bạn trình bày thế nào?", "tr": "Nasıl sunarsınız?", "ar": "كيف تعرضون؟"}, "Drei frische Düfte auswählen, den Flakon in die Hand geben und eine Duftprobe auf ihr Handgelenk anbieten.": {"vi": "Chọn ba mùi hương tươi mát, đưa lọ vào tay bà và mời bà thử mùi trên cổ tay.", "tr": "Üç ferah kokuyu seçmek, şişeyi eline vermek ve bileğine koku denemesi önermek.", "ar": "اختيار ثلاثة عطور منعشة، ووضع القارورة في يدها، وعرض تجربة العطر على معصمها."}, "Die Düfte nur beschreiben, ohne Probe.": {"vi": "Chỉ mô tả mùi hương mà không cho thử.", "tr": "Kokuları sadece anlatmak, deneme yapmadan.", "ar": "وصف العطور فقط دون تجربة."}, "Alle zwölf Tester auf Papierstreifen sprühen.": {"vi": "Xịt cả mười hai chai thử lên các dải giấy.", "tr": "On iki test şişesinin hepsini kâğıt şeritlere püskürtmek.", "ar": "رشّ العطور الاثني عشر كلها على شرائط ورقية."}, "Nur den Flakon zeigen: „Schauen Sie, wie schön!“": {"vi": "Chỉ cho xem lọ: „Chị xem đẹp chưa này!“", "tr": "Sadece şişeyi göstermek: „Bakın ne kadar güzel!“", "ar": "عرض القارورة فقط: «انظري كم هي جميلة!»"}, "Ihr Lieblingsduft kostet als Eau de Parfum 89 Euro. Es gibt ihn auch als Eau de Toilette für 59 Euro. Sie sagt: „89 Euro, puh.“": {"vi": "Mùi hương bà thích nhất giá 89 euro loại Eau de Parfum. Cũng có loại Eau de Toilette giá 59 euro. Bà nói: „89 euro, phù.“", "tr": "En sevdiği koku Eau de Parfum olarak 89 Euro. Eau de Toilette olarak da 59 Euro'ya var. Diyor ki: „89 Euro, ufff.“", "ar": "عطرها المفضل يكلّف 89 يورو بتركيز Eau de Parfum. وهو متوفر أيضًا بتركيز Eau de Toilette بـ 59 يورو. تقول: «89 يورو، أوف.»"}, "„Den gleichen Duft gibt es auch als Eau de Toilette für 59 Euro. Er hält etwas kürzer – dafür sparen Sie 30 Euro.“": {"vi": "„Mùi hương này cũng có loại Eau de Toilette giá 59 euro. Lưu hương ngắn hơn một chút – nhưng chị tiết kiệm được 30 euro.“", "tr": "„Aynı koku Eau de Toilette olarak 59 Euro'ya da var. Biraz daha kısa süre kalıcı – ama 30 Euro tasarruf edersiniz.“", "ar": "«العطر نفسه متوفر بتركيز Eau de Toilette بـ 59 يورو. يدوم أقصر قليلًا – لكنك توفّرين 30 يورو.»"}, "„Wenn Ihnen das zu teuer ist, sind Sie hier falsch.“": {"vi": "„Nếu chị thấy đắt thì chị đến nhầm chỗ rồi.“", "tr": "„Size pahalı geliyorsa yanlış yerdesiniz.“", "ar": "«إذا كان هذا غاليًا عليك فأنتِ في المكان الخطأ.»"}, "„Das ist eben Markenware.“": {"vi": "„Vì đây là hàng hiệu mà.“", "tr": "„Çünkü bu marka bir ürün.“", "ar": "«فهذه بضاعة ماركة.»"}, "„Pro Sprühstoß sind das nur ein paar Cent.“": {"vi": "„Mỗi lần xịt chỉ tốn vài xu thôi.“", "tr": "„Her püskürtme sadece birkaç sent eder.“", "ar": "«كل رشّة لا تكلّف سوى بضعة سنتات.»"}, "Herr Schröder steht vor drei elektrischen Zahnbürsten. Er reist beruflich viel.": {"vi": "Ông Schröder đứng trước ba chiếc bàn chải đánh răng điện. Ông đi công tác nhiều.", "tr": "Bay Schröder üç elektrikli diş fırçasının önünde duruyor. İş gereği çok seyahat ediyor.", "ar": "يقف السيد Schröder أمام ثلاث فُرَش أسنان كهربائية. يسافر كثيرًا بسبب عمله."}, "Er fragt: „Welche würden Sie an meiner Stelle nehmen?“": {"vi": "Ông hỏi: „Nếu là cô, cô sẽ chọn cái nào?“", "tr": "Soruyor: „Benim yerimde olsanız hangisini alırdınız?“", "ar": "يسأل: «لو كنتم مكاني فأيّها تختارون؟»"}, "„Ich empfehle Ihnen die mittlere: Sie warnt, wenn Sie zu fest drücken – das schont Ihr Zahnfleisch. Und der Akku hält zwei Wochen, ideal, weil Sie viel reisen.“": {"vi": "„Tôi giới thiệu cái ở giữa: nó cảnh báo khi ông ấn quá mạnh – bảo vệ nướu của ông. Và pin dùng được hai tuần, lý tưởng vì ông đi nhiều.“", "tr": "„Size ortadakini öneririm: Çok sert bastığınızda uyarır – bu diş etinizi korur. Ve pili iki hafta dayanır, çok seyahat ettiğiniz için ideal.“", "ar": "«أنصحك بالمتوسطة: تنبّهك عندما تضغط بقوة – وهذا يحمي لثتك. وتدوم بطاريتها أسبوعين، وهو مثالي لأنك تسافر كثيرًا.»"}, "„Ist mir egal, die sind alle gleich.“": {"vi": "„Tôi không quan tâm, cái nào cũng như nhau.“", "tr": "„Fark etmez, hepsi aynı.“", "ar": "«لا يهمّني، كلها متشابهة.»"}, "„Die teuerste, die ist die beste.“": {"vi": "„Cái đắt nhất, nó là tốt nhất.“", "tr": "„En pahalısı, o en iyisi.“", "ar": "«الأغلى، فهي الأفضل.»"}, "„Ich würde die mittlere nehmen.“": {"vi": "„Tôi sẽ chọn cái ở giữa.“", "tr": "„Ben ortadakini alırdım.“", "ar": "«كنت سأختار المتوسطة.»"}, "Er nimmt die mittlere Zahnbürste. Er ist oft mit dem Koffer unterwegs.": {"vi": "Ông chọn chiếc bàn chải ở giữa. Ông thường xuyên đi với vali.", "tr": "Ortadaki diş fırçasını alıyor. Sık sık bavulla yolculuk ediyor.", "ar": "يختار الفرشاة المتوسطة. وهو كثير التنقل بحقيبة السفر."}, "Was bietet ihr zusätzlich an?": {"vi": "Các bạn đề nghị thêm gì?", "tr": "Ek olarak ne önerirsiniz?", "ar": "ماذا تعرضون إضافةً إلى ذلك؟"}, "„Zu dieser Zahnbürste passt dieses Reiseetui. Darin ist sie im Koffer geschützt und bleibt sauber.“": {"vi": "„Hộp đựng du lịch này rất hợp với bàn chải. Trong đó bàn chải được bảo vệ trong vali và luôn sạch.“", "tr": "„Bu seyahat kılıfı bu diş fırçasına çok yakışır. İçinde valizde korunur ve temiz kalır.“", "ar": "«هذا الغلاف السفري يناسب هذه الفرشاة. وفيه تكون محمية داخل الحقيبة وتبقى نظيفة.»"}, "„Wollen Sie auch noch Kaugummis?“": {"vi": "„Ông có muốn mua thêm kẹo cao su không?“", "tr": "„Bir de sakız ister misiniz?“", "ar": "«هل تريد علكة أيضًا؟»"}, "„Wir haben auch Etuis.“": {"vi": "„Chúng tôi cũng có hộp đựng.“", "tr": "„Kılıflarımız da var.“", "ar": "«لدينا أغلفة أيضًا.»"}, "„Ein Etui brauchen Sie bestimmt nicht, oder?“": {"vi": "„Chắc ông không cần hộp đựng đâu nhỉ?“", "tr": "„Kılıfa kesin ihtiyacınız yoktur, değil mi?“", "ar": "«لا شك أنك لا تحتاج إلى غلاف، أليس كذلك؟»"}, "Frau Kühn kommt zur Theke.": {"vi": "Bà Kühn đến quầy.", "tr": "Bayan Kühn tezgâha geliyor.", "ar": "تأتي السيدة Kühn إلى الطاولة."}, "Sie sagt: „Einmal die Sonnencreme mit Lichtschutzfaktor 50, die blaue Flasche, bitte.“": {"vi": "Bà nói: „Cho tôi một chai kem chống nắng chỉ số 50, chai màu xanh, nhé.“", "tr": "Diyor ki: „Bir güneş kremi, 50 faktör, mavi şişe, lütfen.“", "ar": "تقول: «من فضلكم كريم واقٍ من الشمس بعامل حماية 50، القارورة الزرقاء.»"}, "Die Flasche holen, kurz prüfen, ob sie heil ist, und kassieren. Höchstens fragen: „Die große oder die kleine Flasche?“": {"vi": "Lấy chai ra, kiểm tra nhanh xem có nguyên vẹn không và tính tiền. Cùng lắm hỏi: „Chai lớn hay chai nhỏ ạ?“", "tr": "Şişeyi getirmek, kısaca sağlam mı diye bakmak ve ödemeyi almak. En fazla: „Büyük şişe mi, küçük şişe mi?“ diye sormak.", "ar": "إحضار القارورة وفحص سلامتها بسرعة ثم المحاسبة. وفي أقصى الحالات السؤال: «القارورة الكبيرة أم الصغيرة؟»"}, "„Wofür brauchen Sie die Creme? Wo fahren Sie hin? Welcher Hauttyp sind Sie?“": {"vi": "„Chị cần kem để làm gì? Chị đi đâu? Chị thuộc loại da nào?“", "tr": "„Kremi ne için istiyorsunuz? Nereye gidiyorsunuz? Cilt tipiniz nedir?“", "ar": "«لماذا تحتاجين الكريم؟ إلى أين تسافرين؟ ما نوع بشرتك؟»"}, "Drei andere Sonnencremes zeigen.": {"vi": "Cho xem ba loại kem chống nắng khác.", "tr": "Üç başka güneş kremi göstermek.", "ar": "عرض ثلاثة كريمات واقية أخرى."}, "Sie zum Regal schicken: „Da hinten, nehmen Sie sie selbst.“": {"vi": "Chỉ chị ra kệ: „Ở phía sau kia, chị tự lấy đi.“", "tr": "Onu rafa yönlendirmek: „Şuranın arkasında, kendiniz alın.“", "ar": "توجيهها إلى الرف: «هناك في الخلف، خذيها بنفسك.»"}, "Sie zahlt mit Karte, ihr Name steht darauf. Sie erzählt, dass sie morgen in den Urlaub fliegt.": {"vi": "Bà thanh toán bằng thẻ, trên thẻ có tên bà. Bà kể rằng ngày mai bà bay đi nghỉ.", "tr": "Kartla ödüyor, kartta adı yazıyor. Yarın tatile uçacağını anlatıyor.", "ar": "تدفع بالبطاقة وعليها اسمها. وتحكي أنها ستسافر غدًا في إجازة."}, "Wie verabschiedet ihr sie?": {"vi": "Các bạn chào tạm biệt thế nào?", "tr": "Nasıl uğurlarsınız?", "ar": "كيف تودّعونها؟"}, "„Vielen Dank für Ihren Einkauf, Frau Kühn – und einen erholsamen Urlaub!“": {"vi": "„Cảm ơn chị Kühn đã mua hàng – và chúc chị kỳ nghỉ thư giãn!“", "tr": "„Alışverişiniz için çok teşekkürler Bayan Kühn – ve dinlendirici bir tatil dilerim!“", "ar": "«شكرًا جزيلًا على مشترياتك سيدة Kühn – وإجازة مريحة!»"}, "„Der Nächste!“": {"vi": "„Người tiếp theo!“", "tr": "„Sıradaki!“", "ar": "«التالي!»"}, "„Vielen Dank.“": {"vi": "„Cảm ơn nhiều.“", "tr": "„Çok teşekkürler.“", "ar": "«شكرًا جزيلًا.»"}, "Herr Neumann schaut einen kleinen Haartrockner an.": {"vi": "Ông Neumann nhìn một chiếc máy sấy tóc nhỏ.", "tr": "Bay Neumann küçük bir saç kurutma makinesine bakıyor.", "ar": "ينظر السيد Neumann إلى مجفّف شعر صغير."}, "Er sagt: „Der ist mir zu kompliziert.“": {"vi": "Ông nói: „Cái này phức tạp quá với tôi.“", "tr": "Diyor ki: „Bu benim için fazla karmaşık.“", "ar": "يقول: «هذا معقّد جدًا بالنسبة لي.»"}, "„Was genau erscheint Ihnen kompliziert – die Tasten oder die Aufsätze?“": {"vi": "„Cụ thể điều gì khiến ông thấy phức tạp – các nút bấm hay các đầu gắn?“", "tr": "„Tam olarak neyi karmaşık buluyorsunuz – tuşları mı, yoksa başlıkları mı?“", "ar": "«ما الذي يبدو لك معقّدًا بالضبط – الأزرار أم الملحقات؟»"}, "„Das ist doch ganz einfach, das kann jeder.“": {"vi": "„Có gì đâu, đơn giản mà, ai cũng làm được.“", "tr": "„Çok basit bu, herkes yapabilir.“", "ar": "«إنه بسيط جدًا، يستطيع الجميع.»"}, "Sofort einen anderen Haartrockner holen.": {"vi": "Lấy ngay một chiếc máy sấy khác.", "tr": "Hemen başka bir saç kurutma makinesi getirmek.", "ar": "إحضار مجفّف شعر آخر فورًا."}, "„Sie haben recht, aber er ist sehr gut.“": {"vi": "„Ông nói đúng, nhưng nó rất tốt.“", "tr": "„Haklısınız, ama çok iyi.“", "ar": "«معك حق، لكنه جيد جدًا.»"}, "Er sagt: „Und der ist so klein!“ Es ist ein Reisemodell mit Klappgriff.": {"vi": "Ông nói: „Mà nó nhỏ thế!“ Đó là mẫu du lịch có tay cầm gập.", "tr": "Diyor ki: „Bir de çok küçük!“ Katlanır saplı bir seyahat modeli.", "ar": "يقول: «وهو صغير جدًا!» إنه موديل للسفر بمقبض قابل للطيّ."}, "Was sagt ihr zu „so klein“?": {"vi": "Các bạn nói gì về „nhỏ thế“?", "tr": "„Çok küçük“ için ne dersiniz?", "ar": "ماذا تقولون عن «صغير جدًا»؟"}, "„Gerade das ist das Besondere: Er passt in jede Reisetasche, und mit dem Klappgriff braucht er kaum Platz.“": {"vi": "„Chính điều đó là điểm đặc biệt: nó vừa mọi túi du lịch, và với tay cầm gập nó gần như không chiếm chỗ.“", "tr": "„İşte tam da özelliği bu: Her seyahat çantasına sığar ve katlanır sapıyla neredeyse yer kaplamaz.“", "ar": "«هذه بالذات هي ميزته: يناسب أي حقيبة سفر، ومع المقبض القابل للطيّ لا يحتاج إلى مساحة تُذكر.»"}, "„Klein ist doch egal.“": {"vi": "„Nhỏ thì có sao đâu.“", "tr": "„Küçük olması önemli değil ki.“", "ar": "«لا يهم كونه صغيرًا.»"}, "„Dann nehmen Sie den großen.“": {"vi": "„Vậy ông lấy cái lớn đi.“", "tr": "„O zaman büyüğünü alın.“", "ar": "«إذًا خذ الكبير.»"}, "„Wenn Sie ihn mit einem großen vergleichen …“ – und dann nichts weiter.": {"vi": "„Nếu ông so nó với một cái lớn …“ – và sau đó không nói thêm gì.", "tr": "„Büyük bir tanesiyle karşılaştırırsanız …“ – ve sonra devam etmemek.", "ar": "«إذا قارنته بواحد كبير …» – ثم عدم قول شيء آخر."}, "Frau Seidel kommt zur Pflegeabteilung.": {"vi": "Bà Seidel đến khu chăm sóc da.", "tr": "Bayan Seidel bakım reyonuna geliyor.", "ar": "تأتي السيدة Seidel إلى قسم العناية."}, "Sie sagt: „Ich war schon in drei Läden. Keiner konnte mir helfen. Meine Haut ist sehr trocken.“": {"vi": "Bà nói: „Tôi đã đến ba cửa hàng rồi. Không ai giúp được tôi. Da tôi rất khô.“", "tr": "Diyor ki: „Üç mağazaya gittim. Kimse bana yardımcı olamadı. Cildim çok kuru.“", "ar": "تقول: «ذهبت إلى ثلاثة متاجر. لم يستطع أحد مساعدتي. بشرتي جافة جدًا.»"}, "Wie beginnt ihr?": {"vi": "Các bạn bắt đầu thế nào?", "tr": "Nasıl başlarsınız?", "ar": "كيف تبدؤون؟"}, "„Ich bin überzeugt, wir finden für Sie das Richtige. Wir haben vor wenigen Tagen eine neue Pflegeserie bekommen.“": {"vi": "„Tôi tin là chúng tôi sẽ tìm được món phù hợp cho bà. Mấy hôm trước chúng tôi vừa nhận về một dòng chăm sóc da mới.“", "tr": "„Size uygun olanı bulacağımızdan eminim. Birkaç gün önce yeni bir bakım serisi geldi.“", "ar": "„أنا واثق أننا سنجد لكِ المناسب. وصلتنا قبل أيام قليلة سلسلة جديدة للعناية بالبشرة.“"}, "„Die anderen Läden haben halt keine Ahnung.“": {"vi": "„Mấy cửa hàng khác đúng là chẳng biết gì.“", "tr": "„Diğer mağazalar zaten hiçbir şey bilmiyor.“", "ar": "„المتاجر الأخرى ببساطة لا تفهم شيئًا.“"}, "„Mal sehen, ob wir was haben.“": {"vi": "„Để xem chúng tôi có không.“", "tr": "„Bakalım, elimizde var mı.“", "ar": "„لنرَ إن كان لدينا شيء.“"}, "„Ich werde es versuchen.“": {"vi": "„Tôi sẽ thử xem.“", "tr": "„Deneyeceğim.“", "ar": "„سأحاول.“"}, "Sie liest die Inhaltsstoffe einer Creme. Die Creme ist ohne Duftstoffe und als Nachfüllpackung erhältlich.": {"vi": "Cô đọc thành phần của một loại kem. Kem không có hương liệu và có bán dạng gói nạp lại.", "tr": "Bir kremin içeriğini okuyor. Krem kokusuzdur ve yedek paket olarak da satılıyor.", "ar": "تقرأ مكوّنات كريم. الكريم خالٍ من العطور ويتوفر أيضًا كعبوة تعبئة."}, "„Diese Creme ist ohne Duftstoffe. Dadurch ist sie besonders mild – Ihre trockene Haut wird gepflegt, ohne gereizt zu werden. Und die Nachfüllpackung spart Verpackungsmüll.“": {"vi": "„Kem này không có hương liệu. Nhờ vậy nó rất dịu nhẹ – da khô của bà được chăm sóc mà không bị kích ứng. Và gói nạp lại giúp giảm rác thải bao bì.“", "tr": "„Bu krem kokusuzdur. Bu sayede çok hafiftir – kuru cildiniz tahriş olmadan bakım görür. Yedek paket de ambalaj atığını azaltır.“", "ar": "„هذا الكريم خالٍ من العطور. لذلك فهو لطيف جدًا – تُعتنى بشرتك الجافة دون أن تتهيّج. وعبوة التعبئة توفّر نفايات التغليف.“"}, "„Die Creme ist echt toll.“": {"vi": "„Kem này hay lắm.“", "tr": "„Bu krem gerçekten harika.“", "ar": "„هذا الكريم رائع جدًا.“"}, "„Die Creme hat keine Duftstoffe.“": {"vi": "„Kem này không có hương liệu.“", "tr": "„Bu kremde koku yok.“", "ar": "„هذا الكريم لا يحتوي على عطور.“"}, "„Die Creme ist nicht schädlich.“": {"vi": "„Kem này không có hại.“", "tr": "„Bu krem zararlı değil.“", "ar": "„هذا الكريم غير ضارّ.“"}, "Eure Kollegin Mia verkauft Herrn Ilić ein Blutdruckmessgerät. Batterien sind nicht dabei.": {"vi": "Đồng nghiệp Mia của các bạn bán cho ông Ilić một máy đo huyết áp. Không kèm pin.", "tr": "Meslektaşınız Mia, Bay Ilić'e bir tansiyon aleti satıyor. Piller dahil değil.", "ar": "زميلتكم ميا تبيع السيد إيليتش جهاز قياس ضغط الدم. البطاريات غير مرفقة."}, "An der Kasse sagt Mia: „Brauchen Sie sonst noch was?“ Herr Ilić sagt: „Nein.“": {"vi": "Ở quầy thu ngân Mia nói: „Ông còn cần gì nữa không ạ?“ Ông Ilić nói: „Không.“", "tr": "Kasada Mia: „Başka bir şeye ihtiyacınız var mı?“ diyor. Bay Ilić: „Hayır.“ diyor.", "ar": "عند الصندوق تقول ميا: „هل تحتاج إلى شيء آخر؟“ فيقول السيد إيليتش: „لا.“"}, "Zu spät und geschlossen gefragt. Die Batterien sind ein Ergänzungsartikel – ohne sie funktioniert das Gerät nicht. Sie gehören beim Gerät angeboten.": {"vi": "Hỏi quá muộn và là câu hỏi đóng. Pin là hàng bổ sung – không có pin thì máy không chạy. Phải đề nghị pin ngay khi giới thiệu máy.", "tr": "Çok geç ve kapalı soruldu. Piller tamamlayıcı üründür – onlar olmadan cihaz çalışmaz. Cihazın yanında önerilmeliydi.", "ar": "سُئل السؤال متأخرًا وبصيغة مغلقة. البطاريات منتج مكمّل – بدونها لا يعمل الجهاز. كان يجب عرضها عند الجهاز."}, "Nichts. An der Kasse fragt man das so.": {"vi": "Không có gì. Ở quầy thu ngân người ta hỏi như vậy.", "tr": "Hiçbir şey. Kasada böyle sorulur.", "ar": "لا شيء. هكذا يُسأل عند الصندوق."}, "Sie hätte freundlicher lächeln sollen.": {"vi": "Cô ấy lẽ ra nên cười thân thiện hơn.", "tr": "Daha samimi gülümsemeliydi.", "ar": "كان عليها أن تبتسم بودّ أكبر."}, "Die Frage kam zu spät, sonst war alles gut.": {"vi": "Câu hỏi đến quá muộn, còn lại thì ổn.", "tr": "Soru çok geç geldi, yoksa her şey iyiydi.", "ar": "جاء السؤال متأخرًا، وغير ذلك كان كل شيء جيدًا."}, "Mia fragt: „Wie hättet ihr es gesagt?“": {"vi": "Mia hỏi: „Các bạn sẽ nói thế nào?“", "tr": "Mia soruyor: „Siz nasıl söylerdiniz?“", "ar": "تسأل ميا: „كيف كنتم ستقولونها؟“"}, "Beim Gerät: „Zu diesem Gerät gehören vier Batterien – dann können Sie heute Abend gleich messen.“": {"vi": "Ngay tại máy: „Máy này đi kèm bốn viên pin – như vậy tối nay ông có thể đo ngay.“", "tr": "Cihazın yanında: „Bu cihaz dört pille birlikte kullanılır – böylece bu akşam hemen ölçüm yapabilirsiniz.“", "ar": "عند الجهاز: „يلزم لهذا الجهاز أربع بطاريات – وهكذا يمكنك القياس هذا المساء مباشرة.“"}, "„Batterien haben Sie sicher schon?“": {"vi": "„Chắc ông có sẵn pin rồi ạ?“", "tr": "„Piliniz zaten vardır herhalde?“", "ar": "„لديك بطاريات بالتأكيد، أليس كذلك؟“"}, "„Brauchen Sie Batterien?“": {"vi": "„Ông có cần pin không ạ?“", "tr": "„Pile ihtiyacınız var mı?“", "ar": "„هل تحتاج إلى بطاريات؟“"}, "„Ohne Batterien geht das Gerät übrigens nicht.“": {"vi": "„Nhân tiện, không có pin thì máy không chạy.“", "tr": "„Bu arada, pil olmadan cihaz çalışmaz.“", "ar": "„بالمناسبة، لا يعمل الجهاز بدون بطاريات.“"}, "Frau Krause hält eine teure Gesichtsmaske in der Hand.": {"vi": "Bà Krause cầm trên tay một chiếc mặt nạ dưỡng da đắt tiền.", "tr": "Bayan Krause elinde pahalı bir yüz maskesi tutuyor.", "ar": "تمسك السيدة كراوزه بيدها قناع وجه غالي الثمن."}, "Beim Blick auf das Preisschild zieht sie die Augenbrauen hoch.": {"vi": "Khi nhìn vào nhãn giá, bà nhướng lông mày.", "tr": "Fiyat etiketine bakınca kaşlarını kaldırıyor.", "ar": "عند النظر إلى بطاقة السعر ترفع حاجبيها."}, "Was kann das bedeuten – und was tut ihr?": {"vi": "Điều đó có thể có nghĩa gì – và các bạn làm gì?", "tr": "Bu ne anlama gelebilir – ve siz ne yaparsınız?", "ar": "ماذا يمكن أن يعني ذلك – وماذا تفعلون؟"}, "Das kann Skepsis bedeuten: Der Preis überrascht sie. Ich nenne den Preis nicht nackt, sondern verbinde ihn mit dem Nutzen.": {"vi": "Có thể là sự nghi ngại: giá làm bà bất ngờ. Tôi không nói giá trần trụi mà gắn nó với lợi ích.", "tr": "Bu şüphe anlamına gelebilir: Fiyat onu şaşırtıyor. Fiyatı çıplak söylemem, faydayla birlikte söylerim.", "ar": "قد يعني ذلك شكًّا: السعر فاجأها. لا أذكر السعر مجرّدًا بل أربطه بالفائدة."}, "Sie ist sicher wütend. Lieber weggehen.": {"vi": "Chắc chắn bà ấy đang tức giận. Tốt hơn là đi chỗ khác.", "tr": "Kesin kızgın. Uzaklaşmak daha iyi.", "ar": "هي غاضبة بالتأكيد. الأفضل الابتعاد."}, "Sie findet es bestimmt zu teuer. Sofort etwas Billigeres holen.": {"vi": "Chắc bà thấy đắt quá. Lấy ngay món rẻ hơn.", "tr": "Muhtemelen çok pahalı buluyor. Hemen daha ucuz bir şey getiririm.", "ar": "غالبًا تراه غاليًا جدًا. أُحضر فورًا شيئًا أرخص."}, "„Sie finden das zu teuer, oder?“": {"vi": "„Bà thấy đắt quá, đúng không?“", "tr": "„Çok pahalı buluyorsunuz, değil mi?“", "ar": "„أنتِ تجدينه غاليًا جدًا، أليس كذلك؟“"}, "Ihr erklärt die Maske. Sie verschränkt die Arme und lehnt sich zurück. Im Laden ist die Klimaanlage sehr kalt.": {"vi": "Các bạn giải thích về mặt nạ. Bà khoanh tay và ngả người ra sau. Trong cửa hàng điều hòa rất lạnh.", "tr": "Maskeyi anlatıyorsunuz. O kollarını kavuşturup geriye yaslanıyor. Mağazada klima çok soğuk.", "ar": "تشرحون القناع. تعقد ذراعيها وتميل إلى الخلف. المكيّف في المتجر بارد جدًا."}, "Was folgt daraus?": {"vi": "Từ đó suy ra điều gì?", "tr": "Bundan ne sonuç çıkar?", "ar": "ماذا نستنتج من ذلك؟"}, "Verschränkte Arme können Ablehnung bedeuten – oder ihr ist einfach kalt. Ich frage freundlich nach, statt weiter zu argumentieren.": {"vi": "Khoanh tay có thể là từ chối – hoặc chỉ là bà thấy lạnh. Tôi hỏi thăm thân thiện thay vì tiếp tục lập luận.", "tr": "Kavuşturulmuş kollar ret anlamına gelebilir – ya da sadece üşüyordur. Tartışmaya devam etmek yerine nazikçe sorarım.", "ar": "عقد الذراعين قد يعني الرفض – أو أنها ببساطة تشعر بالبرد. أسأل بلطف بدل مواصلة الإقناع."}, "Sie lehnt mich ab. Ich gehe.": {"vi": "Bà ấy từ chối tôi. Tôi đi.", "tr": "Beni reddediyor. Gidiyorum.", "ar": "إنها ترفضني. سأذهب."}, "Einfach weiterreden, Körpersprache ist egal.": {"vi": "Cứ nói tiếp, ngôn ngữ cơ thể không quan trọng.", "tr": "Konuşmaya devam ederim, beden dili önemli değil.", "ar": "أواصل الكلام، لغة الجسد لا تهمّ."}, "„Warum sind Sie so abweisend?“": {"vi": "„Sao bà lại lạnh nhạt thế ạ?“", "tr": "„Neden bu kadar soğuksunuz?“", "ar": "„لماذا أنتِ باردة هكذا؟“"}, "Herr Fischer sucht einen Rasierer.": {"vi": "Ông Fischer tìm một chiếc máy cạo râu.", "tr": "Bay Fischer bir tıraş makinesi arıyor.", "ar": "يبحث السيد فيشر عن ماكينة حلاقة."}, "Er hat viele Wünsche genannt: leise, wasserdicht, langer Akku. Jetzt wirkt er erschöpft.": {"vi": "Ông đã nêu nhiều yêu cầu: êm, chống nước, pin bền. Bây giờ ông có vẻ mệt mỏi.", "tr": "Birçok istek sıraladı: sessiz, su geçirmez, uzun pil ömrü. Şimdi yorgun görünüyor.", "ar": "ذكر رغبات كثيرة: هادئة، مقاومة للماء، بطارية طويلة. والآن يبدو متعبًا."}, "Wie führt ihr zum Abschluss?": {"vi": "Các bạn dẫn đến chốt đơn thế nào?", "tr": "Satışı nasıl sonuçlandırırsınız?", "ar": "كيف تنتقلون إلى إتمام البيع؟"}, "„Sie wollten einen leisen Rasierer, den Sie auch unter der Dusche nutzen können und der lange durchhält – genau das haben Sie hier.“": {"vi": "„Ông muốn một chiếc máy cạo êm, dùng được cả khi tắm và pin bền – đúng là những gì ông có ở đây.“", "tr": "„Sessiz, duşta da kullanabileceğiniz ve uzun dayanan bir tıraş makinesi istediniz – tam olarak burada var.“", "ar": "„أردتَ ماكينة حلاقة هادئة، يمكنك استخدامها تحت الدش وتدوم طويلًا – وهذا بالضبط ما لدينا هنا.“"}, "Noch einmal alle zwölf Funktionen erklären.": {"vi": "Giải thích lại cả mười hai chức năng một lần nữa.", "tr": "On iki işlevin hepsini bir kez daha anlatmak.", "ar": "شرح الوظائف الاثنتي عشرة كلها مرة أخرى."}, "„Und? Nehmen Sie ihn?“": {"vi": "„Sao, ông lấy không?“", "tr": "„Ee? Alıyor musunuz?“", "ar": "„حسنًا؟ هل ستأخذها؟“"}, "„Sie wollen doch sicher den Rasierer, oder?“": {"vi": "„Chắc ông muốn chiếc máy cạo này, đúng không?“", "tr": "„Bu tıraş makinesini istiyorsunuz herhalde, değil mi?“", "ar": "„أنت تريد ماكينة الحلاقة هذه بالتأكيد، أليس كذلك؟“"}, "Er kauft. Auf dem Weg zur Kasse murmelt er: „Hoffentlich war das nicht zu teuer …“": {"vi": "Ông mua. Trên đường ra quầy thu ngân ông lẩm bẩm: „Hy vọng không đắt quá …“", "tr": "Satın alıyor. Kasaya giderken mırıldanıyor: „Umarım çok pahalı değildir …“", "ar": "يشتري. وفي طريقه إلى الصندوق يتمتم: „آمل ألا يكون غاليًا جدًا …“"}, "„Sie haben eine gute Wahl getroffen: Er ist wasserdicht und sehr leise. Und Sie haben zwei Jahre Garantie.“": {"vi": "„Ông đã chọn rất tốt: máy chống nước và rất êm. Và ông còn được bảo hành hai năm.“", "tr": "„İyi bir seçim yaptınız: Su geçirmez ve çok sessiz. Üstelik iki yıl garantiniz var.“", "ar": "„لقد أحسنتَ الاختيار: فهي مقاومة للماء وهادئة جدًا. ولديك أيضًا ضمان لمدة سنتين.“"}, "Nichts sagen, er hat ja schon gekauft.": {"vi": "Không nói gì, ông ấy đã mua rồi.", "tr": "Bir şey söylemem, zaten satın aldı.", "ar": "لا أقول شيئًا، فقد اشترى بالفعل."}, "„Ach, Geld ist doch nur Geld.“": {"vi": "„Ôi, tiền thì cũng chỉ là tiền thôi.“", "tr": "„Ah, para sadece paradır.“", "ar": "„آه، المال مجرد مال.“"}, "„Teuer ist er schon, ja.“": {"vi": "„Đắt thì đúng là đắt thật.“", "tr": "„Pahalı, evet, doğru.“", "ar": "„غالٍ فعلًا، نعم.“"}, "Frau Engel sucht ein Geschenk für ihren Enkel.": {"vi": "Bà Engel tìm quà cho cháu nội.", "tr": "Bayan Engel torunu için bir hediye arıyor.", "ar": "تبحث السيدة إنغل عن هدية لحفيدها."}, "Sie sagt: „Ich brauche ein Geschenk für meinen Enkel, weiß aber noch nicht, was.“": {"vi": "Bà nói: „Tôi cần một món quà cho cháu nội, nhưng chưa biết là gì.“", "tr": "Şöyle diyor: „Torunum için bir hediyeye ihtiyacım var ama henüz ne olduğunu bilmiyorum.“", "ar": "تقول: „أحتاج هدية لحفيدي، لكنني لا أعرف بعد ما هي.“"}, "Wie geht ihr vor?": {"vi": "Các bạn làm thế nào?", "tr": "Nasıl ilerlersiniz?", "ar": "كيف تتصرفون؟"}, "Nach Person und Interessen fragen: „Wie alt ist Ihr Enkel, und was macht er gern?“": {"vi": "Hỏi về người nhận và sở thích: „Cháu bao nhiêu tuổi và cháu thích làm gì ạ?“", "tr": "Kişiyi ve ilgi alanlarını sormak: „Torununuz kaç yaşında ve ne yapmayı sever?“", "ar": "السؤال عن الشخص واهتماماته: „كم عمر حفيدك وماذا يحب أن يفعل؟“"}, "Einfach das teuerste Spielzeug einpacken.": {"vi": "Cứ gói món đồ chơi đắt nhất.", "tr": "Hemen en pahalı oyuncağı paketlemek.", "ar": "ببساطة تغليف أغلى لعبة."}, "Sofort ein beliebtes Spiel zeigen.": {"vi": "Lập tức giới thiệu một trò chơi đang được ưa chuộng.", "tr": "Hemen popüler bir oyun göstermek.", "ar": "عرض لعبة شائعة فورًا."}, "„Möchten Sie ein Brettspiel oder ein Puzzle?“": {"vi": "„Bà muốn trò chơi bàn cờ hay xếp hình ạ?“", "tr": "„Kutu oyunu mu istersiniz, yoksa puzzle mı?“", "ar": "„هل تفضّلين لعبة لوحية أم أحجية؟“"}, "Der Enkel ist neun und baut gern. Frau Engel schaut euch erwartungsvoll an.": {"vi": "Cháu chín tuổi và thích xây dựng. Bà Engel nhìn các bạn đầy mong đợi.", "tr": "Torun dokuz yaşında ve inşa etmeyi seviyor. Bayan Engel size beklentiyle bakıyor.", "ar": "الحفيد في التاسعة ويحب البناء. تنظر إليكم السيدة إنغل بترقّب."}, "Welche Frage bringt euch weiter?": {"vi": "Câu hỏi nào giúp các bạn tiến thêm?", "tr": "Hangi soru sizi ileri götürür?", "ar": "أي سؤال يتقدّم بكم؟"}, "„Spielt Ihr Enkel lieber allein oder lieber mit anderen?“": {"vi": "„Cháu thích chơi một mình hay chơi cùng người khác hơn ạ?“", "tr": "„Torununuz tek başına mı yoksa başkalarıyla mı oynamayı sever?“", "ar": "„هل يفضّل حفيدك اللعب وحده أم مع الآخرين؟“"}, "„Sie wollen sicher nichts Billiges für Ihren Enkel?“": {"vi": "„Chắc bà không muốn món rẻ tiền cho cháu đâu ạ?“", "tr": "„Torununuz için ucuz bir şey istemezsiniz herhalde?“", "ar": "„لا تريدين شيئًا رخيصًا لحفيدك بالتأكيد، أليس كذلك؟“"}, "„Baut er gern?“": {"vi": "„Cháu có thích xây dựng không ạ?“", "tr": "„İnşa etmeyi sever mi?“", "ar": "„هل يحب البناء؟“"}, "„Sie legen doch sicher Wert auf Qualität?“": {"vi": "„Chắc bà coi trọng chất lượng, đúng không ạ?“", "tr": "„Kaliteye önem verirsiniz herhalde, değil mi?“", "ar": "„أنتِ تهتمين بالجودة بالتأكيد، أليس كذلك؟“"}, "Herr Hoffmann steht an der großen Autorennbahn.": {"vi": "Ông Hoffmann đứng trước đường đua ô tô lớn.", "tr": "Bay Hoffmann büyük yarış pistinin önünde duruyor.", "ar": "يقف السيد هوفمان أمام حلبة سباق السيارات الكبيرة."}, "Er sagt: „Mit der Bahn spielt mein Sohn sicher sehr gern. Die Teile sind stabil, und man kann sie erweitern …“": {"vi": "Ông nói: „Con trai tôi chắc chắn rất thích chơi với đường đua này. Các bộ phận chắc chắn và có thể mở rộng thêm …“", "tr": "Şöyle diyor: „Oğlum bu pistle kesinlikle çok severek oynar. Parçalar sağlam ve genişletilebiliyor …“", "ar": "يقول: „سيحب ابني اللعب بهذه الحلبة كثيرًا. القطع متينة ويمكن توسيعها …“"}, "Was hört ihr heraus – und was tut ihr?": {"vi": "Các bạn nghe ra điều gì – và làm gì?", "tr": "Ne anlıyorsunuz – ve ne yaparsınız?", "ar": "ماذا تفهمون من ذلك – وماذا تفعلون؟"}, "Das sind Kaufsignale. Jetzt zum Abschluss: „Möchten Sie die Bahn gleich mitnehmen, oder nutzen Sie unseren Lieferservice?“": {"vi": "Đó là tín hiệu mua hàng. Giờ chốt đơn: „Ông muốn mang đường đua đi luôn, hay dùng dịch vụ giao hàng của chúng tôi ạ?“", "tr": "Bunlar satın alma sinyalleridir. Şimdi satışı bağlarım: „Pisti hemen yanınızda mı götürmek istersiniz, yoksa teslimat hizmetimizi mi kullanırsınız?“", "ar": "هذه إشارات شراء. الآن أُنهي البيع: „هل تريد أخذ الحلبة معك فورًا أم تستخدم خدمة التوصيل لدينا؟“"}, "Er zweifelt noch. Noch drei andere Bahnen zeigen.": {"vi": "Ông còn phân vân. Giới thiệu thêm ba đường đua khác.", "tr": "Hâlâ tereddüt ediyor. Üç pist daha göstermek.", "ar": "لا يزال متردّدًا. عرض ثلاث حلبات أخرى."}, "Er mag die Bahn. Abwarten, was er sagt.": {"vi": "Ông thích đường đua. Chờ xem ông nói gì.", "tr": "Pisti beğeniyor. Ne diyeceğini beklemek.", "ar": "تعجبه الحلبة. انتظار ما سيقوله."}, "„Greifen Sie zu, solange der Aktionspreis gilt!“ – es gibt aber gar keine Aktion.": {"vi": "„Mua ngay khi giá khuyến mãi còn hiệu lực!“ – nhưng thực ra không có đợt khuyến mãi nào.", "tr": "„Kampanya fiyatı geçerliyken hemen alın!“ – ama aslında hiçbir kampanya yok.", "ar": "„اشترِ ما دام سعر العرض ساريًا!“ – لكن لا يوجد أي عرض في الواقع."}, "Er fragt: „Wie bekomme ich die große Kiste nach Hause? Und kann ich mit Kreditkarte zahlen?“": {"vi": "Ông hỏi: „Làm sao tôi mang cái thùng lớn này về nhà? Và tôi có thể trả bằng thẻ tín dụng không?“", "tr": "Soruyor: „Bu büyük kutuyu eve nasıl götüreceğim? Ve kredi kartıyla ödeyebilir miyim?“", "ar": "يسأل: „كيف أنقل هذا الصندوق الكبير إلى البيت؟ وهل يمكنني الدفع ببطاقة الائتمان؟“"}, "„Wir liefern Ihnen die Bahn nach Hause. Und natürlich können Sie mit Kreditkarte zahlen.“": {"vi": "„Chúng tôi giao đường đua đến tận nhà ông. Và tất nhiên ông có thể trả bằng thẻ tín dụng.“", "tr": "„Pisti size eve teslim ediyoruz. Ve elbette kredi kartıyla ödeyebilirsiniz.“", "ar": "„نوصّل لك الحلبة إلى البيت. وبالطبع يمكنك الدفع ببطاقة الائتمان.“"}, "„Tragen müssen Sie selbst, und bei uns wird bar bezahlt.“": {"vi": "„Ông phải tự mang, và ở đây trả bằng tiền mặt.“", "tr": "„Taşımayı kendiniz yapmalısınız ve burada nakit ödenir.“", "ar": "„عليك أن تحمله بنفسك، والدفع عندنا نقدًا.“"}, "„Parkplätze haben wir genug.“": {"vi": "„Chỗ đỗ xe chúng tôi có đủ.“", "tr": "„Otopark yerimiz yeterince var.“", "ar": "„لدينا مواقف سيارات كافية.“"}, "„Karte geht. Liefern weiß ich nicht.“": {"vi": "„Thẻ thì được. Giao hàng thì tôi không biết.“", "tr": "„Kart olur. Teslimatı bilmiyorum.“", "ar": "„البطاقة ممكنة. أما التوصيل فلا أعرف.“"}, "Frau Marx kauft ein ferngesteuertes Auto für ihre Tochter.": {"vi": "Bà Marx mua một chiếc ô tô điều khiển từ xa cho con gái.", "tr": "Bayan Marx kızı için uzaktan kumandalı bir araba alıyor.", "ar": "تشتري السيدة ماركس سيارة تحكم عن بُعد لابنتها."}, "Im Karton ist kein Akku. Ohne Akku fährt das Auto nicht.": {"vi": "Trong hộp không có pin sạc. Không có pin thì xe không chạy.", "tr": "Kutuda akü yok. Akü olmadan araba gitmez.", "ar": "لا توجد بطارية قابلة للشحن في العلبة. بدونها لا تسير السيارة."}, "Jetzt, beim Auto: „Zu diesem Auto gehört dieser Akku – dann kann Ihre Tochter sofort nach dem Auspacken losfahren.“": {"vi": "Ngay tại chiếc xe: „Chiếc xe này đi kèm cục pin này – như vậy con gái bà có thể chạy ngay sau khi mở hộp.“", "tr": "Arabanın yanında: „Bu arabaya bu akü gerekir – böylece kızınız paketi açar açmaz hemen sürebilir.“", "ar": "عند السيارة: „تحتاج هذه السيارة إلى هذه البطارية – وهكذا تستطيع ابنتك تشغيلها فور فتح العلبة.“"}, "Nichts sagen. Sie wird es schon merken.": {"vi": "Không nói gì. Rồi bà sẽ tự nhận ra.", "tr": "Hiçbir şey söylememek. Nasılsa fark eder.", "ar": "عدم قول شيء. ستلاحظ ذلك بنفسها."}, "Erst an der Kasse: „Akku?“": {"vi": "Mãi đến quầy thu ngân mới hỏi: „Pin ạ?“", "tr": "Ancak kasada: „Akü?“", "ar": "فقط عند الصندوق: „بطارية؟“"}, "„Wollen Sie noch eine Rampe dazu?“": {"vi": "„Bà có muốn thêm một cái dốc nhảy không?“", "tr": "„Bir de rampa ister misiniz?“", "ar": "„هل تريدين إضافة منحدر؟“"}, "Auto und Akku kosten zusammen 79 Euro. Sie fragt nach dem Preis.": {"vi": "Xe và pin tổng cộng 79 euro. Bà hỏi giá.", "tr": "Araba ve akü birlikte 79 Euro. Fiyatı soruyor.", "ar": "السيارة والبطارية معًا 79 يورو. تسأل عن السعر."}, "Wie nennt ihr ihn?": {"vi": "Các bạn nói giá thế nào?", "tr": "Fiyatı nasıl söylersiniz?", "ar": "كيف تذكرون السعر؟"}, "„Das Auto ist robust und fährt auch über Rasen. Zusammen mit dem Akku kostet es 79 Euro – und Ihre Tochter kann sofort losfahren.“": {"vi": "„Chiếc xe này bền và chạy được cả trên bãi cỏ. Cùng với pin là 79 euro – và con gái bà có thể chạy ngay.“", "tr": "„Araba sağlamdır ve çimde de gider. Akü ile birlikte 79 Euro – ve kızınız hemen sürebilir.“", "ar": "„السيارة متينة وتسير حتى على العشب. مع البطارية 79 يورو – وتستطيع ابنتك تشغيلها فورًا.“"}, "„Das wird jetzt leider teuer: 79 Euro.“": {"vi": "„Tiếc là giờ sẽ đắt đấy: 79 euro.“", "tr": "„Maalesef şimdi pahalı olacak: 79 Euro.“", "ar": "„للأسف سيكون الآن غاليًا: 79 يورو.“"}, "„79 Euro.“": {"vi": "„79 euro.“", "tr": "„79 Euro.“", "ar": "„79 يورو.“"}, "„Das Auto kostet nur 59 Euro.“ Den Akku erst an der Kasse dazurechnen.": {"vi": "„Chiếc xe chỉ có 59 euro.“ Đến quầy thu ngân mới cộng thêm pin.", "tr": "„Araba sadece 59 Euro.“ Aküyü ancak kasada eklemek.", "ar": "„السيارة بـ 59 يورو فقط.“ ثم إضافة البطارية عند الصندوق فقط."}, "Herr Ostermann ist Stammkunde. Er kauft einen großen Bausteinkasten.": {"vi": "Ông Ostermann là khách quen. Ông mua một hộp khối xếp hình lớn.", "tr": "Bay Ostermann müdavim bir müşteri. Büyük bir yapı taşı kutusu alıyor.", "ar": "السيد أوسترمان زبون دائم. يشتري صندوق مكعبات بناء كبيرًا."}, "Er fragt: „Geht da noch was am Preis?“ Ihr dürft Nachlässe geben.": {"vi": "Ông hỏi: „Còn bớt giá được không?“ Các bạn được phép giảm giá.", "tr": "Soruyor: „Fiyatta bir şey yapılabilir mi?“ İndirim verme yetkiniz var.", "ar": "يسأل: „هل يمكن تخفيض السعر؟“ يُسمح لكم بتقديم تخفيضات."}, "Was bietet ihr zuerst an?": {"vi": "Các bạn đề nghị gì trước?", "tr": "Önce ne teklif edersiniz?", "ar": "ماذا تعرضون أولًا؟"}, "Erst eine kleine Zugabe: „Ich lege Ihnen gern eine Sortierbox dazu.“": {"vi": "Trước tiên là một món tặng nhỏ: „Tôi xin tặng kèm cho ông một hộp phân loại.“", "tr": "Önce küçük bir ek hediye: „Yanına memnuniyetle bir düzenleme kutusu koyarım.“", "ar": "أولًا هدية صغيرة: „يسعدني أن أضيف لك صندوق ترتيب.“"}, "Sofort 20 Prozent Rabatt.": {"vi": "Giảm ngay 20 phần trăm.", "tr": "Hemen yüzde 20 indirim.", "ar": "خصم 20 بالمئة فورًا."}, "„Nein, Preis ist Preis.“": {"vi": "„Không, giá là giá.“", "tr": "„Hayır, fiyat fiyattır.“", "ar": "„لا، السعر هو السعر.“"}, "Erst eine kostenlose Geschenkverpackung, dann eine Zugabe.": {"vi": "Trước hết gói quà miễn phí, sau đó tặng kèm.", "tr": "Önce ücretsiz hediye paketi, sonra ek hediye.", "ar": "أولًا تغليف هدايا مجاني، ثم هدية إضافية."}, "Er sagt trotzdem: „Für den Preis kaufe ich das nicht.“ Alle Argumente sind schon genannt.": {"vi": "Ông vẫn nói: „Với giá này tôi không mua.“ Mọi lý lẽ đã nói hết.", "tr": "Yine de şöyle diyor: „Bu fiyata bunu almam.“ Tüm argümanlar zaten söylendi.", "ar": "ومع ذلك يقول: „بهذا السعر لن أشتريه.“ كل الحجج قد قيلت بالفعل."}, "Was ist euer letztes Mittel?": {"vi": "Biện pháp cuối cùng của các bạn là gì?", "tr": "Son çareniz nedir?", "ar": "ما هي وسيلتكم الأخيرة؟"}, "„Unterbreiten Sie mir einen Vorschlag – unter welchen Bedingungen würden Sie den Kasten mitnehmen?“": {"vi": "„Xin ông cho tôi một đề xuất – với điều kiện nào ông sẽ mang hộp này đi?“", "tr": "„Bana bir teklifte bulunun – hangi koşullarda kutuyu alırdınız?“", "ar": "„قدّم لي اقتراحًا – في ظل أي شروط ستأخذ هذا الصندوق؟“"}, "„Dann eben nicht.“": {"vi": "„Vậy thì thôi.“", "tr": "„O zaman olmasın.“", "ar": "„إذن لا بأس.“"}, "Alle Argumente noch einmal wiederholen.": {"vi": "Nhắc lại tất cả lý lẽ một lần nữa.", "tr": "Tüm argümanları bir kez daha tekrarlamak.", "ar": "تكرار كل الحجج مرة أخرى."}, "„Sie haben recht, aber …“ – und dasselbe Argument wie vorher.": {"vi": "„Ông nói đúng, nhưng …“ – và lại là lý lẽ cũ.", "tr": "„Haklısınız, ama …“ – ve yine aynı argüman.", "ar": "„معك حق، لكن …“ – ثم الحجة نفسها كما قبل."}, "Frau Brandt sucht ein Puppenhaus. Eure Kollegin Mia bedient sie.": {"vi": "Bà Brandt tìm một ngôi nhà búp bê. Đồng nghiệp Mia của các bạn phục vụ bà.", "tr": "Bayan Brandt bir oyuncak bebek evi arıyor. Meslektaşınız Mia ona hizmet ediyor.", "ar": "تبحث السيدة براندت عن بيت دمى. زميلتكم ميا تخدمها."}, "Mia: „Wie viel möchten Sie denn ausgeben?“ – Kundin: „Nicht mehr als nötig.“ – Mia: „Null Problem! Ich zeig Ihnen mal die billigen.“": {"vi": "Mia: „Bà muốn chi bao nhiêu ạ?“ – Khách: „Không hơn mức cần thiết.“ – Mia: „Không vấn đề gì! Để tôi chỉ mấy cái rẻ tiền.“", "tr": "Mia: „Ne kadar harcamak istersiniz?“ – Müşteri: „Gerektiğinden fazla değil.“ – Mia: „Sıfır sorun! Size ucuz olanları göstereyim.“", "ar": "ميا: „كم تريدين أن تنفقي؟“ – الزبونة: „ليس أكثر من اللازم.“ – ميا: „ولا مشكلة! سأريك الرخيصة.“"}, "Welche Fehler hat Mia gemacht?": {"vi": "Mia đã mắc những lỗi nào?", "tr": "Mia hangi hataları yaptı?", "ar": "ما الأخطاء التي ارتكبتها ميا؟"}, "Sie fragt zu früh nach dem Preis, statt den Bedarf zu ermitteln. Und „billig“ und „Null Problem“ sind Umgangssprache.": {"vi": "Cô hỏi giá quá sớm thay vì tìm hiểu nhu cầu. Và „rẻ tiền“ cùng „không vấn đề“ là ngôn ngữ đời thường.", "tr": "İhtiyacı belirlemek yerine fiyatı çok erken sordu. Ve „ucuz“ ile „sıfır sorun“ günlük konuşma dilidir.", "ar": "سألت عن السعر مبكرًا بدل تحديد الحاجة. وكلمتا „رخيص“ و„ولا مشكلة“ من العامية."}, "Keine. Sparen ist doch gut.": {"vi": "Không lỗi nào. Tiết kiệm là tốt mà.", "tr": "Hiçbiri. Tasarruf iyidir.", "ar": "لا أخطاء. التوفير شيء جيد."}, "Nur „Null Problem“ war falsch.": {"vi": "Chỉ có „Không vấn đề“ là sai.", "tr": "Sadece „Sıfır sorun“ yanlıştı.", "ar": "فقط „ولا مشكلة“ كانت خاطئة."}, "Sie hätte lieber das teuerste Haus zeigen sollen.": {"vi": "Cô ấy lẽ ra nên chỉ ngôi nhà đắt nhất.", "tr": "En pahalı evi göstermeliydi.", "ar": "كان عليها أن تعرض أغلى بيت."}, "Mia fragt: „Was hätte ich sagen sollen?“": {"vi": "Mia hỏi: „Lẽ ra tôi nên nói gì?“", "tr": "Mia soruyor: „Ne söylemeliydim?“", "ar": "تسأل ميا: „ماذا كان عليّ أن أقول؟“"}, "„Wie alt ist das Kind, und womit spielt es gern?“ – und später: „Ich zeige Ihnen gern ein preisgünstiges Modell.“": {"vi": "„Cháu bao nhiêu tuổi và thích chơi gì ạ?“ – và sau đó: „Tôi xin giới thiệu một mẫu giá hợp lý.“", "tr": "„Çocuk kaç yaşında ve ne ile oynamayı seviyor?“ – ve sonra: „Size uygun fiyatlı bir model göstereyim.“", "ar": "„كم عمر الطفل وبماذا يحب اللعب؟“ – ثم لاحقًا: „يسعدني أن أعرض عليك طرازًا بسعر مناسب.“"}, "„Wollen Sie das billigste?“": {"vi": "„Bà muốn cái rẻ nhất à?“", "tr": "„En ucuzunu mu istiyorsunuz?“", "ar": "„هل تريدين الأرخص؟“"}, "„Haben Sie ein Budget?“": {"vi": "„Bà có ngân sách không ạ?“", "tr": "„Bir bütçeniz var mı?“", "ar": "„هل لديك ميزانية؟“"}, "„Ich zeige Ihnen mal die preiswerten.“": {"vi": "„Để tôi chỉ mấy cái giá rẻ.“", "tr": "„Size ucuz olanları göstereyim.“", "ar": "„سأريك الرخيصة.“"}, "Herr Schmitt sucht etwas für seine Tochter (10).": {"vi": "Ông Schmitt tìm món gì đó cho con gái (10 tuổi).", "tr": "Bay Schmitt kızı (10) için bir şey arıyor.", "ar": "يبحث السيد شميت عن شيء لابنته (10 سنوات)."}, "Ihr zeigt einen Experimentierkasten. Die Anleitung erklärt jeden Schritt mit Bildern.": {"vi": "Các bạn giới thiệu một bộ dụng cụ thí nghiệm. Hướng dẫn giải thích từng bước bằng hình ảnh.", "tr": "Bir deney seti gösteriyorsunuz. Kılavuz her adımı resimlerle açıklıyor.", "ar": "تعرضون مجموعة تجارب. يشرح الدليل كل خطوة بالصور."}, "„Die Anleitung zeigt jeden Schritt mit Bildern. Dadurch kann Ihre Tochter allein experimentieren – Sie müssen nicht die ganze Zeit danebensitzen.“": {"vi": "„Hướng dẫn chỉ từng bước bằng hình ảnh. Nhờ vậy con gái ông có thể tự thí nghiệm – ông không phải ngồi cạnh suốt.“", "tr": "„Kılavuz her adımı resimlerle gösteriyor. Böylece kızınız tek başına deney yapabilir – sürekli yanında oturmanız gerekmez.“", "ar": "„يُظهر الدليل كل خطوة بالصور. وهكذا تستطيع ابنتك إجراء التجارب بمفردها – لا داعي لأن تجلس بجانبها طوال الوقت.“"}, "„Der Kasten ist echt cool.“": {"vi": "„Bộ này đúng là xịn.“", "tr": "„Bu set gerçekten çok havalı.“", "ar": "„هذه المجموعة رائعة فعلًا.“"}, "„Die Anleitung hat 40 Seiten.“": {"vi": "„Hướng dẫn dày 40 trang.“", "tr": "„Kılavuz 40 sayfa.“", "ar": "„الدليل من 40 صفحة.“"}, "„Damit lernt man viel.“": {"vi": "„Với bộ này học được nhiều lắm.“", "tr": "„Bununla çok şey öğrenilir.“", "ar": "„يتعلّم المرء الكثير بها.“"}, "Der Kasten kostet 60 Euro und enthält 120 Versuche.": {"vi": "Bộ giá 60 euro và có 120 thí nghiệm.", "tr": "Set 60 Euro ve 120 deney içeriyor.", "ar": "تكلّف المجموعة 60 يورو وتحتوي على 120 تجربة."}, "„Der Kasten kostet 60 Euro. Bei 120 Versuchen sind das nur 50 Cent pro Versuch.“": {"vi": "„Bộ giá 60 euro. Với 120 thí nghiệm, chỉ khoảng 50 xu một thí nghiệm.“", "tr": "„Set 60 Euro. 120 deneyle deney başına sadece 50 sent.“", "ar": "„تكلّف المجموعة 60 يورو. ومع 120 تجربة لا يتجاوز ذلك 50 سنتًا للتجربة الواحدة.“"}, "„60 Euro sind nicht viel, oder?“": {"vi": "„60 euro không nhiều, đúng không?“", "tr": "„60 Euro çok değil, değil mi?“", "ar": "„60 يورو ليست كثيرة، أليس كذلك؟“"}, "„60 Euro.“": {"vi": "„60 euro.“", "tr": "„60 Euro.“", "ar": "„60 يورو.“"}, "„Das sind nur 60 Euro im Jahr, wenn sie ihn ein Jahr nutzt.“": {"vi": "„Chỉ có 60 euro một năm nếu cháu dùng một năm.“", "tr": "„Bir yıl kullanırsa yılda sadece 60 Euro.“", "ar": "„هي 60 يورو فقط في السنة إن استخدمتها سنة كاملة.“"}, "Frau Rahimi (70) sucht ein Kuscheltier für ihre Enkelin.": {"vi": "Bà Rahimi (70 tuổi) tìm một con thú nhồi bông cho cháu gái.", "tr": "Bayan Rahimi (70) torunu için bir peluş oyuncak arıyor.", "ar": "تبحث السيدة رحيمي (70 عامًا) عن دمية محشوة لحفيدتها."}, "Es ist laut in der Abteilung. Sie sagt: „Entschuldigung, ich verstehe Sie so schlecht.“": {"vi": "Khu này ồn. Bà nói: „Xin lỗi, tôi nghe cô không rõ.“", "tr": "Bölüm gürültülü. Şöyle diyor: „Pardon, sizi çok zor anlıyorum.“", "ar": "القسم صاخب. تقول: „عفوًا، لا أسمعك جيدًا.“"}, "Langsamer und deutlich sprechen, kurze Sätze, kleine Pausen, freundlicher Ton.": {"vi": "Nói chậm và rõ, câu ngắn, ngừng nghỉ đôi chút, giọng thân thiện.", "tr": "Yavaş ve net konuşmak, kısa cümleler, küçük duraklar, samimi bir ton.", "ar": "التحدث ببطء ووضوح، جمل قصيرة، وقفات قصيرة، نبرة ودودة."}, "Genauso weiterreden, sie wird es schon verstehen.": {"vi": "Cứ nói như cũ, rồi bà sẽ hiểu.", "tr": "Aynı şekilde konuşmaya devam etmek, nasılsa anlar.", "ar": "مواصلة الكلام بالطريقة نفسها، ستفهم في النهاية."}, "Ganz laut rufen.": {"vi": "Hét thật to.", "tr": "Çok yüksek sesle bağırmak.", "ar": "الصراخ بصوت عالٍ جدًا."}, "Fachwörter benutzen, damit es kürzer wird: „Das Plüsch ist zertifiziert und maschinenwaschbar.“": {"vi": "Dùng thuật ngữ chuyên môn cho ngắn gọn: „Lông nhung được chứng nhận và giặt máy được.“", "tr": "Kısa olsun diye uzmanlık terimleri kullanmak: „Peluş sertifikalı ve makinede yıkanabilir.“", "ar": "استخدام مصطلحات فنية لتقصير الكلام: „القماش الوبري معتمد ويُغسل في الغسالة.“"}, "Sie schaut zwei Kuscheltiere in der Vitrine an.": {"vi": "Bà nhìn hai con thú nhồi bông trong tủ kính.", "tr": "Vitrindeki iki peluş oyuncağa bakıyor.", "ar": "تنظر إلى دميتين محشوتين في الخزانة الزجاجية."}, "Beide herausholen und ihr in die Hände geben: „Fühlen Sie einmal, wie weich das Fell ist.“": {"vi": "Lấy cả hai ra và đặt vào tay bà: „Bà thử sờ xem lông mềm thế nào.“", "tr": "İkisini de çıkarıp eline vermek: „Bir dokunun, tüyü ne kadar yumuşak.“", "ar": "إخراج الاثنتين ووضعهما في يديها: „المسي كم هو ناعم الفرو.“"}, "In der Vitrine lassen und nur zeigen.": {"vi": "Để trong tủ kính và chỉ cho xem.", "tr": "Vitrinde bırakıp sadece göstermek.", "ar": "تركهما في الخزانة والاكتفاء بالإشارة."}, "Ein Tier hochhalten und selbst drücken.": {"vi": "Giơ một con lên và tự bóp.", "tr": "Birini kaldırıp kendim sıkmak.", "ar": "رفع إحداها وضغطها بنفسي."}, "Alle zwanzig Kuscheltiere aufs Pult legen.": {"vi": "Đặt cả hai mươi con thú nhồi bông lên quầy.", "tr": "Yirmi peluş oyuncağın hepsini tezgâha koymak.", "ar": "وضع كل الدمى المحشوة العشرين على المنضدة."}, "Ihr steht an der Kasse. Herr Peters kommt mit einem Puzzle auf euch zu.": {"vi": "Các bạn đứng ở quầy thu ngân. Ông Peters đi về phía các bạn với một bộ xếp hình.", "tr": "Kasada duruyorsunuz. Bay Peters elinde bir yapbozla size doğru geliyor.", "ar": "تقفون عند الصندوق. يتجه السيد بيترز نحوكم ومعه أحجية."}, "Er ist noch drei Schritte entfernt.": {"vi": "Ông còn cách ba bước.", "tr": "Üç adım uzakta.", "ar": "لا يزال على بُعد ثلاث خطوات."}, "Wie steht ihr da?": {"vi": "Các bạn đứng thế nào?", "tr": "Nasıl durursunuz?", "ar": "كيف تقفون؟"}, "Aufrecht, dem Kunden zugewandt, Blickkontakt, freundliches Lächeln, Hände offen.": {"vi": "Thẳng người, hướng về khách, giao tiếp bằng mắt, mỉm cười thân thiện, hai tay mở.", "tr": "Dik, müşteriye dönük, göz teması, samimi gülümseme, eller açık.", "ar": "بوقفة مستقيمة، متجهين نحو الزبون، تواصل بصري، ابتسامة ودودة، واليدان مفتوحتان."}, "Angelehnt, Arme verschränkt, Blick aufs Handy.": {"vi": "Dựa người, khoanh tay, nhìn điện thoại.", "tr": "Yaslanmış, kollar kavuşturulmuş, bakış telefonda.", "ar": "متكئين، ذراعان معقودتان، النظر إلى الهاتف."}, "Freundlich lächeln, aber weiter auf den Bildschirm schauen.": {"vi": "Mỉm cười thân thiện nhưng vẫn nhìn màn hình.", "tr": "Samimi gülümsemek ama ekrana bakmaya devam etmek.", "ar": "الابتسام بودّ مع مواصلة النظر إلى الشاشة."}, "Mit dem Zeigefinger auf ihn zeigen: „Sie da, kommen Sie!“": {"vi": "Chỉ ngón tay vào ông: „Này ông kia, lại đây!“", "tr": "İşaret parmağıyla ona işaret etmek: „Siz, buyurun gelin!“", "ar": "الإشارة إليه بالسبابة: „أنت، تعال إلى هنا!“"}, "Herr Peters erzählt. Ihr merkt, dass ihr mit eurer Kette spielt und auf den Boden schaut.": {"vi": "Ông Peters kể chuyện. Các bạn nhận ra mình đang nghịch dây chuyền và nhìn xuống sàn.", "tr": "Bay Peters anlatıyor. Zincirinizle oynadığınızı ve yere baktığınızı fark ediyorsunuz.", "ar": "يتحدث السيد بيترز. تلاحظون أنكم تلعبون بسلسلتكم وتنظرون إلى الأرض."}, "Was kann das beim Kunden auslösen?": {"vi": "Điều đó có thể gây ra điều gì ở khách?", "tr": "Bu müşteride ne etkisi yaratabilir?", "ar": "ماذا قد يثير ذلك لدى الزبون؟"}, "Mit Schmuck spielen ist eine Verlegenheitsgeste. Ich wirke unsicher. Besser: ruhig stehen und ihn anschauen.": {"vi": "Nghịch đồ trang sức là cử chỉ bối rối. Tôi trông thiếu tự tin. Tốt hơn: đứng yên và nhìn ông.", "tr": "Takıyla oynamak bir utanç hareketidir. Güvensiz görünürüm. Daha iyisi: sakin durmak ve ona bakmak.", "ar": "اللعب بالحُليّ حركة تدل على الارتباك. أبدو غير واثق. الأفضل: الوقوف بهدوء والنظر إليه."}, "Nichts, Körpersprache merkt keiner.": {"vi": "Không gì cả, không ai để ý ngôn ngữ cơ thể.", "tr": "Hiçbir şey, kimse beden dilini fark etmez.", "ar": "لا شيء، لا أحد يلاحظ لغة الجسد."}, "Er denkt, ich bin gelangweilt – also schneller reden.": {"vi": "Ông nghĩ tôi chán, nên nói nhanh hơn.", "tr": "Sıkıldığımı düşünür, bu yüzden daha hızlı konuşur.", "ar": "يظن أنني أشعر بالملل، فيتحدث أسرع."}, "Das wirkt sicher, weil ich beschäftigt aussehe.": {"vi": "Trông có vẻ chắc chắn vì tôi trông có vẻ bận rộn.", "tr": "Meşgul göründüğüm için kendinden emin görünür.", "ar": "يبدو ذلك واثقًا لأنني أبدو مشغولًا."}, "Frau Haas ist mit zwei Kindern in der Spielwarenabteilung.": {"vi": "Bà Haas đang ở khu đồ chơi cùng hai đứa trẻ.", "tr": "Bayan Haas iki çocukla oyuncak bölümünde.", "ar": "السيدة هاس في قسم الألعاب مع طفلين."}, "Sie fragt: „Warum darf ich bei den Brettspielen selbst stöbern, aber die Drohnen sind hinter der Theke?“": {"vi": "Bà hỏi: „Sao tôi được tự do xem các trò chơi bàn cờ, còn máy bay không người lái thì để sau quầy?“", "tr": "Soruyor: „Neden kutu oyunlarına kendim bakabiliyorum ama dronlar tezgâhın arkasında?“", "ar": "تسأل: „لماذا يمكنني تصفّح الألعاب اللوحية بنفسي بينما الطائرات المسيّرة خلف المنضدة؟“"}, "„Brettspiele schauen Sie sich am besten in Ruhe selbst an – und wenn Sie Fragen haben, berate ich Sie. Drohnen sind teuer und müssen erklärt werden, deshalb bedienen wir Sie dort persönlich.“": {"vi": "„Trò chơi bàn cờ bà nên tự xem thoải mái – và nếu có câu hỏi, tôi sẽ tư vấn. Máy bay không người lái đắt và cần được giải thích, nên chúng tôi phục vụ bà trực tiếp ở đó.“", "tr": "„Kutu oyunlarına en iyisi rahatça kendiniz bakmanız – sorunuz olursa size danışmanlık yaparım. Dronlar pahalıdır ve açıklanması gerekir, bu yüzden orada size bizzat hizmet veriyoruz.“", "ar": "„الألعاب اللوحية الأفضل أن تتصفحيها بنفسك على راحتك – وإن كانت لديك أسئلة أنصحك. الطائرات المسيّرة غالية وتحتاج إلى شرح، لذلك نخدمك هناك شخصيًا.“"}, "„Das ist halt so.“": {"vi": "„Thì nó vốn là vậy.“", "tr": "„Öyle işte.“", "ar": "„هكذا هو الأمر ببساطة.“"}, "„Drohnen werden oft geklaut.“": {"vi": "„Máy bay không người lái hay bị trộm lắm.“", "tr": "„Dronlar sık sık çalınıyor.“", "ar": "„الطائرات المسيّرة تُسرق كثيرًا.“"}, "„Bei Brettspielen ist Selbstbedienung, da gibt es keine Beratung.“": {"vi": "„Trò chơi bàn cờ là tự phục vụ, ở đó không có tư vấn.“", "tr": "„Kutu oyunlarında self-servis var, orada danışmanlık yok.“", "ar": "„الألعاب اللوحية بنظام الخدمة الذاتية، ولا توجد استشارة هناك.“"}, "Sie fragt: „Gibt es hier etwas für die Kinder, während ich aussuche?“": {"vi": "Bà hỏi: „Ở đây có gì cho bọn trẻ trong lúc tôi chọn không?“", "tr": "Soruyor: „Ben seçerken çocuklar için burada bir şey var mı?“", "ar": "تسأل: „هل يوجد هنا شيء للأطفال بينما أختار؟“"}, "„Ja, gern – in unserer Spielecke werden Kinder betreut. Und unten im Café gibt es Kakao.“": {"vi": "„Có chứ ạ – ở góc trò chơi của chúng tôi có người trông trẻ. Và dưới quán cà phê có ca cao.“", "tr": "„Evet, memnuniyetle – oyun köşemizde çocuklara bakılıyor. Ve aşağıdaki kafede kakao var.“", "ar": "„نعم بكل سرور – في ركن الألعاب لدينا يُشرف على الأطفال. وفي المقهى بالأسفل يوجد كاكاو.“"}, "So mag ich das! Ich brauche Handschuhe.": {"vi": "Thế này tôi thích! Tôi cần găng tay.", "tr": "İşte bunu sevdim! Eldivenlere ihtiyacım var.", "ar": "هذا ما يعجبني! أحتاج إلى قفازات."}, "Ja.": {"vi": "Vâng.", "tr": "Evet.", "ar": "نعم."}, "Wie bitte?": {"vi": "Xin lỗi, cô nói gì?", "tr": "Efendim?", "ar": "عفوًا؟"}, "Ja, schon.": {"vi": "Ừ, cũng đúng.", "tr": "Evet, öyle.", "ar": "نعم، بالفعل."}, "(atmet durch) Na gut.": {"vi": "(thở ra) Thôi được.", "tr": "(derin nefes alıyor) Peki, tamam.", "ar": "(يتنفس بعمق) حسنًا."}, "Wollen Sie mich veräppeln?!": {"vi": "Cô đang đùa tôi đấy à?!", "tr": "Benimle dalga mı geçiyorsunuz?!", "ar": "هل تسخرون مني؟!"}, "Ich bin ruhig!": {"vi": "Tôi bình tĩnh mà!", "tr": "Ben sakinim!", "ar": "أنا هادئ!"}, "Lassen Sie mich doch mal ausreden!": {"vi": "Để tôi nói hết đã chứ!", "tr": "Bırakın da bir konuşayım!", "ar": "دعيني أكمل كلامي!"}, "Das ist fair. Zeigen Sie mal.": {"vi": "Vậy là công bằng. Cho tôi xem nào.", "tr": "Bu adil. Bir gösterin bakalım.", "ar": "هذا عادل. أرني."}, "Dann komme ich nie wieder.": {"vi": "Vậy thì tôi không bao giờ quay lại.", "tr": "O zaman bir daha asla gelmem.", "ar": "إذن لن أعود أبدًا."}, "Äh … danke.": {"vi": "À … cảm ơn.", "tr": "Ee … teşekkürler.", "ar": "آه … شكرًا."}, "Mir doch egal, wer schuld ist.": {"vi": "Tôi không quan tâm lỗi của ai.", "tr": "Kimin suçlu olduğu umurumda değil.", "ar": "لا يهمني من المخطئ."}, "Ah, das leuchtet ein.": {"vi": "À, nghe hợp lý.", "tr": "Ah, mantıklı geliyor.", "ar": "آه، هذا منطقي."}, "Na, das ist ja eine Auskunft.": {"vi": "Ồ, đó mà gọi là thông tin à.", "tr": "Vay, ne biçim bir açıklama bu.", "ar": "يا لها من إجابة."}, "Aha. Sie trauen den Kunden nicht?": {"vi": "À. Các bạn không tin khách hàng à?", "tr": "Aha. Müşterilere güvenmiyorsunuz demek?", "ar": "آها. أنتم لا تثقون بالزبائن؟"}, "Das ist alles?": {"vi": "Chỉ có vậy thôi à?", "tr": "Hepsi bu mu?", "ar": "هل هذا كل شيء؟"}, "Da fühle ich mich gut aufgehoben.": {"vi": "Ở đây tôi cảm thấy được chăm sóc tốt.", "tr": "Burada kendimi iyi ellerde hissediyorum.", "ar": "أشعر هنا أنني في أيدٍ أمينة."}, "Die kann ich auch selbst lesen.": {"vi": "Cái đó tôi tự đọc được.", "tr": "Onu ben de okuyabilirim.", "ar": "هذا أستطيع قراءته بنفسي."}, "Hm, ob das stimmt?": {"vi": "Hm, có đúng thế không?", "tr": "Hm, acaba doğru mu?", "ar": "همم، هل هذا صحيح؟"}, "Für meine Frau. Sie spielt Tennis.": {"vi": "Cho vợ tôi. Bà ấy chơi quần vợt.", "tr": "Karım için. Tenis oynuyor.", "ar": "لزوجتي. هي تلعب التنس."}, "Äh …": {"vi": "À …", "tr": "Ee …", "ar": "آه …"}, "Das weiß ich doch noch gar nicht.": {"vi": "Cái đó tôi còn chưa biết mà.", "tr": "Bunu ben henüz bilmiyorum ki.", "ar": "هذا لا أعرفه بعد."}, "Na ja, schon …": {"vi": "Ừm, cũng đúng …", "tr": "Evet, öyle ama …", "ar": "حسنًا، هذا صحيح …"}, "Ja, machen Sie das.": {"vi": "Vâng, cô làm đi.", "tr": "Evet, yapın lütfen.", "ar": "نعم، افعلي ذلك."}, "Was soll das heißen?": {"vi": "Thế nghĩa là gì?", "tr": "Bu ne demek şimdi?", "ar": "ماذا يعني هذا؟"}, "Weiß nicht, was meinen Sie?": {"vi": "Tôi không biết, ý cô là sao?", "tr": "Bilmiyorum, ne demek istiyorsunuz?", "ar": "لا أعرف، ماذا تقصدين؟"}, "Nein …?": {"vi": "Không …?", "tr": "Hayır …?", "ar": "لا …؟"}, "Oft in den Bergen, auch auf nassen Felsen.": {"vi": "Thường ở trên núi, cả trên đá ướt.", "tr": "Sık sık dağlarda, ıslak kayalarda da.", "ar": "كثيرًا في الجبال، وعلى الصخور المبللة أيضًا."}, "Doch – Wanderschuhe!": {"vi": "Đúng – giày leo núi!", "tr": "Evet – trekking ayakkabısı!", "ar": "بلى – أحذية المشي الجبلي!"}, "Ja, vielleicht.": {"vi": "Vâng, có lẽ.", "tr": "Evet, belki.", "ar": "نعم، ربما."}, "Die Farbe ist mir egal.": {"vi": "Màu sắc gì tôi cũng được.", "tr": "Renk fark etmez.", "ar": "اللون لا يهمني."}, "Genau das brauche ich.": {"vi": "Đúng là thứ tôi cần.", "tr": "Tam olarak ihtiyacım olan bu.", "ar": "هذا بالضبط ما أحتاجه."}, "Eine was?": {"vi": "Cái gì cơ?", "tr": "Ne?", "ar": "ماذا؟"}, "Schön für Sie.": {"vi": "Hay cho bạn đấy.", "tr": "Sizin için güzel.", "ar": "هنيئًا لك."}, "Inwiefern?": {"vi": "Theo nghĩa nào?", "tr": "Ne bakımdan?", "ar": "بأي معنى؟"}, "Oh, die sind wirklich bequem!": {"vi": "Ôi, đôi này thật sự êm!", "tr": "Oh, bunlar gerçekten rahat!", "ar": "يا له من حذاء مريح فعلًا!"}, "Darf ich die mal sehen?": {"vi": "Cho tôi xem đôi đó được không?", "tr": "Şunlara bir bakabilir miyim?", "ar": "هل يمكنني رؤية هذه؟"}, "Hm. Sehen gut aus.": {"vi": "Hm. Trông đẹp đấy.", "tr": "Hm. Güzel görünüyorlar.", "ar": "همم. تبدو جميلة."}, "Das ist mir zu hektisch.": {"vi": "Thế này tôi thấy vội vã quá.", "tr": "Bu bana fazla telaşlı geliyor.", "ar": "هذا متسرّع جدًا بالنسبة لي."}, "Ja, gerne!": {"vi": "Vâng, rất sẵn lòng!", "tr": "Evet, memnuniyetle!", "ar": "نعم، بكل سرور!"}, "Jetzt bin ich wieder unsicher …": {"vi": "Giờ tôi lại không chắc nữa …", "tr": "Şimdi yine emin değilim …", "ar": "الآن أصبحت غير متأكدة من جديد …"}, "(wartet auch)": {"vi": "(cũng đợi)", "tr": "(o da bekliyor)", "ar": "(تنتظر هي أيضًا)"}, "Das klingt nach Druck.": {"vi": "Nghe như đang bị ép.", "tr": "Baskı gibi geliyor.", "ar": "يبدو هذا كضغط."}, "Oh, wie nett! Dann habe ich kurz Ruhe.": {"vi": "Ôi, tử tế quá! Vậy tôi được yên một lát.", "tr": "Oh, ne güzel! O zaman biraz rahat ederim.", "ar": "يا له من لطف! إذن سأرتاح قليلًا."}, "(die Kinder ziehen an ihr) Moment …": {"vi": "(bọn trẻ kéo bà) Khoan đã …", "tr": "(çocuklar onu çekiştiriyor) Bir dakika …", "ar": "(الأطفال يشدّونها) لحظة …"}, "Wir sind gerade erst reingekommen!": {"vi": "Chúng tôi vừa mới vào mà!", "tr": "Daha yeni geldik!", "ar": "لقد دخلنا للتو!"}, "Und ich?": {"vi": "Còn tôi thì sao?", "tr": "Peki ya ben?", "ar": "وماذا عني؟"}, "Super, dann bin ich beruhigt.": {"vi": "Tuyệt, vậy là tôi yên tâm.", "tr": "Harika, o zaman içim rahat.", "ar": "ممتاز، إذن اطمأننت."}, "Wie bitte?!": {"vi": "Sao cơ?!", "tr": "Efendim?!", "ar": "ماذا؟!"}, "Und meine Frage?": {"vi": "Còn câu hỏi của tôi?", "tr": "Peki ya sorum?", "ar": "وسؤالي؟"}, "Ja, aber was ist mit dem Umtausch?": {"vi": "Vâng, nhưng còn việc đổi hàng thì sao?", "tr": "Evet, ama değişim ne olacak?", "ar": "نعم، لكن ماذا عن الاستبدال؟"}, "Okay, ich probiere ihn mal.": {"vi": "Được, để tôi thử.", "tr": "Tamam, deneyeyim.", "ar": "حسنًا، سأجرّبه."}, "Schade. Tschüss.": {"vi": "Tiếc quá. Chào.", "tr": "Yazık. Hoşça kalın.", "ar": "للأسف. إلى اللقاء."}, "„Auch ganz gut“? Na toll.": {"vi": "„Cũng khá tốt“? Hay lắm nhỉ.", "tr": "„Bu da fena değil“ mi? Çok güzel.", "ar": "„هذا جيد أيضًا“؟ رائع حقًا."}, "Der sieht aber einfacher aus.": {"vi": "Cái này trông đơn giản hơn.", "tr": "Bu daha sade görünüyor.", "ar": "لكن هذا يبدو أبسط."}, "Danke, sehr nett. Ich komme bestimmt wieder.": {"vi": "Cảm ơn, rất tử tế. Tôi chắc chắn sẽ quay lại.", "tr": "Teşekkürler, çok naziksiniz. Kesinlikle tekrar gelirim.", "ar": "شكرًا، لطيف جدًا. سأعود بالتأكيد."}, "Ich muss jetzt wirklich los.": {"vi": "Giờ tôi thật sự phải đi rồi.", "tr": "Şimdi gerçekten gitmem gerekiyor.", "ar": "يجب أن أذهب الآن فعلًا."}, "Unverschämt!": {"vi": "Vô lễ!", "tr": "Küstahlık!", "ar": "وقاحة!"}, "Keine, ich will nur überlegen.": {"vi": "Không, tôi chỉ muốn suy nghĩ.", "tr": "Hiçbiri, sadece düşünmek istiyorum.", "ar": "لا شيء، أريد فقط أن أفكر."}, "Schon gut … aber der Absatz ist zu dünn.": {"vi": "Được rồi … nhưng gót giày mỏng quá.", "tr": "Tamam … ama topuk çok ince.", "ar": "لا بأس … لكن الكعب رفيع جدًا."}, "Na hören Sie mal!": {"vi": "Này, cô nói gì vậy!", "tr": "Hadi canım, ne diyorsunuz!", "ar": "اسمعي، ما هذا الكلام!"}, "Puh, das ist ja wie beim Amt.": {"vi": "Chà, cứ như ở cơ quan hành chính ấy.", "tr": "Off, resmen daire gibi.", "ar": "أوف، وكأننا في دائرة حكومية."}, "Das kommt drauf an …": {"vi": "Còn tùy …", "tr": "Duruma göre …", "ar": "هذا يعتمد …"}, "(strahlt) Die probiere ich an!": {"vi": "(rạng rỡ) Tôi sẽ thử đôi này!", "tr": "(gülümseyerek) Bunları deneyeceğim!", "ar": "(تبتسم) سأجرّب هذه!"}, "Wie bitte? So bin ich nicht!": {"vi": "Cái gì? Tôi không phải người như vậy!", "tr": "Efendim? Ben öyle biri değilim!", "ar": "ماذا؟ أنا لست هكذا!"}, "Hm … ja.": {"vi": "Hm … vâng.", "tr": "Hm … evet.", "ar": "همم … نعم."}, "Schade.": {"vi": "Tiếc quá.", "tr": "Yazık.", "ar": "يا للأسف."}, "Oh, das ist wirklich kuschelig.": {"vi": "Ôi, cái này thật sự rất ấm áp.", "tr": "Oh, bu gerçekten çok yumuşacık.", "ar": "يا إلهي، هذا دافئ ولطيف فعلًا."}, "Das sehe ich selbst.": {"vi": "Cái đó tôi tự thấy được.", "tr": "Onu kendim de görüyorum.", "ar": "هذا أراه بنفسي."}, "Hm.": {"vi": "Hm.", "tr": "Hm.", "ar": "همم."}, "Wunderbar!": {"vi": "Tuyệt vời!", "tr": "Harika!", "ar": "رائع!"}, "Schade, dann eben nicht.": {"vi": "Tiếc quá, vậy thì thôi.", "tr": "Yazık, o zaman olmasın.", "ar": "يا للأسف، إذن لا بأس."}, "Na gut …": {"vi": "Thôi được …", "tr": "Peki …", "ar": "حسنًا …"}, "Danke, das ist nett.": {"vi": "Cảm ơn, tử tế quá.", "tr": "Teşekkürler, bu çok nazik.", "ar": "شكرًا، هذا لطيف."}, "Unfreundlich!": {"vi": "Thiếu thân thiện!", "tr": "Nezaketsiz!", "ar": "غير ودود!"}, "Und jetzt?": {"vi": "Giờ thì sao?", "tr": "Ve şimdi?", "ar": "والآن؟"}, "Versuchen?": {"vi": "Thử à?", "tr": "Denemek mi?", "ar": "المحاولة؟"}, "Praktisch!": {"vi": "Tiện quá!", "tr": "Pratik!", "ar": "عملي!"}, "(hört kaum zu)": {"vi": "(hầu như không nghe)", "tr": "(neredeyse hiç dinlemiyor)", "ar": "(بالكاد يستمع)"}, "Ich hab ihn schon gehört.": {"vi": "Tôi nghe rồi.", "tr": "Onu zaten duydum.", "ar": "لقد سمعت ذلك بالفعل."}, "Eher helle, glaube ich.": {"vi": "Tôi nghĩ là màu nhạt hơn.", "tr": "Sanırım daha açık renkler.", "ar": "أظن الألوان الفاتحة."}, "Äh, nein …?": {"vi": "À, không …?", "tr": "Ee, hayır …?", "ar": "آه، لا …؟"}, "Ja, wer nicht?": {"vi": "Vâng, ai mà không?", "tr": "Evet, kim istemez ki?", "ar": "نعم، ومن لا يريد؟"}, "Na ja …": {"vi": "Ừm …", "tr": "Eh …", "ar": "حسنًا …"}, "Die weißen! Ganz klar.": {"vi": "Mấy cái màu trắng! Rõ ràng rồi.", "tr": "Beyazlar! Çok net.", "ar": "البيضاء! بكل وضوح."}, "Dann gehe ich eben.": {"vi": "Vậy thì tôi đi.", "tr": "O zaman gidiyorum.", "ar": "إذن سأذهب."}, "Oh nein, noch mehr …": {"vi": "Ôi không, lại thêm nữa …", "tr": "Ah hayır, bir de bunlar …", "ar": "يا للهول، المزيد أيضًا …"}, "Haha. Nein.": {"vi": "Haha. Không.", "tr": "Haha. Hayır.", "ar": "ههه. لا."}, "(brummt) Ja, machen Sie das.": {"vi": "(lầm bầm) Vâng, cô làm đi.", "tr": "(söyleniyor) Evet, yapın.", "ar": "(يتمتم) نعم، افعلي."}, "Hallo?! Ich rede mit Ihnen!": {"vi": "Này?! Tôi đang nói chuyện với cô!", "tr": "Alo?! Sizinle konuşuyorum!", "ar": "ألو؟! أنا أتحدث إليكِ!"}, "Das interessiert mich nicht.": {"vi": "Cái đó tôi không quan tâm.", "tr": "Bu beni ilgilendirmiyor.", "ar": "هذا لا يهمّني."}, "(Kollegin nickt)": {"vi": "(đồng nghiệp gật đầu)", "tr": "(meslektaş başını sallıyor)", "ar": "(تومئ الزميلة برأسها)"}, "(Kollegin schüttelt den Kopf)": {"vi": "(đồng nghiệp lắc đầu)", "tr": "(meslektaş başını sallıyor, hayır)", "ar": "(تهز الزميلة رأسها نافية)"}, "(Kollegin: „Zu früh.“)": {"vi": "(đồng nghiệp: „Còn quá sớm.“)", "tr": "(meslektaş: „Çok erken.“)", "ar": "(الزميلة: „مبكر جدًا.“)"}, "(Kollegin seufzt)": {"vi": "(đồng nghiệp thở dài)", "tr": "(meslektaş iç çekiyor)", "ar": "(تتنهد الزميلة)"}, "Doppelt sparen klingt gut.": {"vi": "Tiết kiệm gấp đôi nghe hay đấy.", "tr": "İki kat tasarruf kulağa hoş geliyor.", "ar": "التوفير المضاعف يبدو جيدًا."}, "Darum geht es mir nicht.": {"vi": "Tôi không quan tâm chuyện đó.", "tr": "Benim derdim bu değil.", "ar": "ليس هذا ما يهمّني."}, "Und?": {"vi": "Và sao nữa?", "tr": "Ee, sonra?", "ar": "وماذا بعد؟"}, "Prima!": {"vi": "Tuyệt!", "tr": "Harika!", "ar": "رائع!"}, "Dann eben gar nicht.": {"vi": "Vậy thì thôi.", "tr": "O zaman hiç.", "ar": "إذن لا شيء."}, "Können Sie fragen?": {"vi": "Cô hỏi được không?", "tr": "Sorabilir misiniz?", "ar": "هل تستطيعين أن تسألي؟"}, "Das war nicht meine Frage.": {"vi": "Đó không phải câu hỏi của tôi.", "tr": "Benim sorum bu değildi.", "ar": "لم يكن هذا سؤالي."}, "Mmh, der zweite ist herrlich!": {"vi": "Mmh, cái thứ hai thơm tuyệt!", "tr": "Mmh, ikincisi muhteşem!", "ar": "ممم، الثاني رائع!"}, "Ich muss das doch riechen …": {"vi": "Tôi phải ngửi mới được chứ …", "tr": "Bir koklamam lazım …", "ar": "يجب أن أشمّه …"}, "Jetzt riecht alles gleich.": {"vi": "Giờ mùi nào cũng giống nhau.", "tr": "Şimdi hepsi aynı kokuyor.", "ar": "الآن كل الروائح متشابهة."}, "Schön, ja. Und wie riecht er?": {"vi": "Đẹp, vâng. Còn mùi của nó thì sao?", "tr": "Güzel, evet. Peki kokusu nasıl?", "ar": "جميل، نعم. وكيف رائحته؟"}, "Oh, das ist eine gute Idee.": {"vi": "Ồ, ý hay đấy.", "tr": "Oh, iyi fikir.", "ar": "آه، فكرة جيدة."}, "Dann gehe ich wohl.": {"vi": "Vậy chắc tôi đi.", "tr": "O zaman herhalde gidiyorum.", "ar": "إذن سأذهب على ما يبدو."}, "Wie viele denn genau?": {"vi": "Chính xác là bao nhiêu?", "tr": "Tam olarak kaç tane?", "ar": "كم بالضبط؟"}, "Überzeugt. Die nehme ich.": {"vi": "Thuyết phục rồi. Tôi lấy cái này.", "tr": "İkna oldum. Bunu alıyorum.", "ar": "اقتنعت. سآخذ هذا."}, "Dann frag ich woanders.": {"vi": "Vậy tôi hỏi chỗ khác.", "tr": "O zaman başka yerde sorarım.", "ar": "إذن سأسأل في مكان آخر."}, "Warum?": {"vi": "Tại sao?", "tr": "Neden?", "ar": "لماذا؟"}, "Und warum?": {"vi": "Và tại sao?", "tr": "Peki neden?", "ar": "ولماذا؟"}, "Gute Idee, nehme ich mit.": {"vi": "Ý hay, tôi lấy luôn.", "tr": "İyi fikir, onu da alıyorum.", "ar": "فكرة جيدة، سآخذه أيضًا."}, "Nein.": {"vi": "Không.", "tr": "Hayır.", "ar": "لا."}, "Nö.": {"vi": "Không đâu.", "tr": "Yok.", "ar": "كلا."}, "Die große, danke!": {"vi": "Cái lớn, cảm ơn!", "tr": "Büyük olanı, teşekkürler!", "ar": "الكبيرة، شكرًا!"}, "Ich will nur die Creme …": {"vi": "Tôi chỉ muốn kem thôi …", "tr": "Ben sadece kremi istiyorum …", "ar": "أريد الكريم فقط …"}, "Nein, ich will die blaue.": {"vi": "Không, tôi muốn cái màu xanh.", "tr": "Hayır, mavi olanı istiyorum.", "ar": "لا، أريد الأزرق."}, "Danke, Ihnen ein schönes Wochenende!": {"vi": "Cảm ơn, chúc bà cuối tuần vui vẻ!", "tr": "Teşekkürler, size de güzel bir hafta sonu!", "ar": "شكرًا، أتمنى لك عطلة نهاية أسبوع جميلة!"}, "(geht ohne Gruß)": {"vi": "(đi mà không chào)", "tr": "(selam vermeden gidiyor)", "ar": "(يغادر دون تحية)"}, "Tschüss.": {"vi": "Tạm biệt.", "tr": "Hoşça kalın.", "ar": "إلى اللقاء."}, "Bitte.": {"vi": "Không có gì.", "tr": "Rica ederim.", "ar": "عفوًا."}, "Die vielen Aufsätze. Und er ist so klein!": {"vi": "Nhiều đầu gắn quá. Mà nó nhỏ thế!", "tr": "O kadar çok başlık var. Üstelik çok küçük!", "ar": "الكثير من الملحقات. وهو صغير جدًا!"}, "Ich bin also dumm, oder was?": {"vi": "Vậy là tôi ngốc hay sao?", "tr": "Yani ben aptal mıyım, ne?", "ar": "إذن أنا غبي، أم ماذا؟"}, "Der ist ja noch größer.": {"vi": "Cái này còn to hơn nữa.", "tr": "Bu daha da büyük.", "ar": "هذا أكبر حتى."}, "Das sagen Sie.": {"vi": "Cô nói vậy thôi.", "tr": "Siz öyle diyorsunuz.", "ar": "أنتِ تقولين ذلك."}, "Stimmt, ich fliege ja nächste Woche.": {"vi": "Đúng, tuần sau tôi bay mà.", "tr": "Doğru, haftaya uçuyorum.", "ar": "صحيح، سأسافر بالطائرة الأسبوع القادم."}, "Mir nicht.": {"vi": "Tôi thì không.", "tr": "Bana göre değil.", "ar": "ليس بالنسبة لي."}, "Ja? Und?": {"vi": "Vâng? Rồi sao?", "tr": "Evet? Ee?", "ar": "نعم؟ وماذا بعد؟"}, "Na, da bin ich gespannt.": {"vi": "Vậy tôi rất tò mò.", "tr": "O zaman merak ediyorum.", "ar": "إذن أنا متشوق لأرى."}, "Klingt nicht sehr sicher.": {"vi": "Nghe không chắc chắn lắm.", "tr": "Pek emin gibi durmuyor.", "ar": "لا يبدو واثقًا جدًا."}, "Versuchen …": {"vi": "Thử à …", "tr": "Denemek …", "ar": "المحاولة …"}, "Das klingt genau richtig.": {"vi": "Nghe đúng là điều tôi cần.", "tr": "Tam doğru geliyor.", "ar": "هذا يبدو مناسبًا تمامًا."}, "Das will ich hoffen!": {"vi": "Tôi mong là vậy!", "tr": "Umarım öyledir!", "ar": "آمل ذلك!"}, "(Mia: „Oh. Stimmt.“)": {"vi": "(Mia: „Ồ. Đúng rồi.“)", "tr": "(Mia: „Ah. Doğru.“)", "ar": "(ميا: „آه. صحيح.“)"}, "(Herr Ilić kommt am Abend wieder: „Das Ding geht nicht!“)": {"vi": "(Ông Ilić quay lại buổi tối: „Cái máy này không chạy!“)", "tr": "(Bay Ilić akşam geri geliyor: „Bu cihaz çalışmıyor!“)", "ar": "(يعود السيد إيليتش مساءً: „هذا الجهاز لا يعمل!“)"}, "(Mia: „Und sonst?“)": {"vi": "(Mia: „Còn gì nữa không ạ?“)", "tr": "(Mia: „Başka?“)", "ar": "(ميا: „وماذا غير ذلك؟“)"}, "(Mia: „Nur das?“)": {"vi": "(Mia: „Chỉ vậy thôi à?“)", "tr": "(Mia: „Sadece bu mu?“)", "ar": "(ميا: „هذا فقط؟“)"}, "(Mia: „Viel besser!“)": {"vi": "(Mia: „Tốt hơn nhiều!“)", "tr": "(Mia: „Çok daha iyi!“)", "ar": "(ميا: „أفضل بكثير!“)"}, "(Mia: „Hm, dann sagt er Ja.“)": {"vi": "(Mia: „Hm, vậy là ông ấy sẽ nói đồng ý.“)", "tr": "(Mia: „Hm, o zaman evet der.“)", "ar": "(ميا: „همم، إذن سيقول نعم.“)"}, "(Mia: „Geht so.“)": {"vi": "(Mia: „Tạm được.“)", "tr": "(Mia: „İdare eder.“)", "ar": "(ميا: „لا بأس.“)"}, "(Mia: „Stimmt, aber …“)": {"vi": "(Mia: „Đúng, nhưng …“)", "tr": "(Mia: „Doğru, ama …“)", "ar": "(ميا: „صحيح، لكن …“)"}, "(hört interessiert zu)": {"vi": "(lắng nghe chăm chú)", "tr": "(ilgiyle dinliyor)", "ar": "(يستمع باهتمام)"}, "(stellt die Maske zurück)": {"vi": "(đặt mặt nạ lại)", "tr": "(maskeyi geri koyuyor)", "ar": "(تعيد القناع إلى مكانه)"}, "Ich wollte eigentlich die hier …": {"vi": "Thật ra tôi muốn cái này …", "tr": "Aslında şunu istemiştim …", "ar": "في الواقع كنت أريد هذا …"}, "Das habe ich nicht gesagt.": {"vi": "Tôi không nói thế.", "tr": "Ben bunu söylemedim.", "ar": "لم أقل ذلك."}, "Ach, mir ist nur so kalt hier!": {"vi": "Ồ, chỉ là ở đây tôi thấy lạnh quá!", "tr": "Ah, sadece burası çok soğuk!", "ar": "آه، أشعر بالبرد هنا فقط!"}, "Wo wollen Sie denn hin?": {"vi": "Cô định đi đâu vậy?", "tr": "Nereye gitmek istiyorsunuz?", "ar": "إلى أين تريدين الذهاب؟"}, "(schaut auf die Uhr)": {"vi": "(nhìn đồng hồ)", "tr": "(saate bakıyor)", "ar": "(ينظر إلى الساعة)"}, "Bin ich doch gar nicht!": {"vi": "Tôi đâu có như vậy!", "tr": "Ben öyle değilim ki!", "ar": "أنا لست كذلك أصلًا!"}, "Stimmt. Genau so.": {"vi": "Đúng. Chính xác như vậy.", "tr": "Doğru. Aynen öyle.", "ar": "صحيح. هكذا تمامًا."}, "Mir schwirrt der Kopf.": {"vi": "Đầu tôi quay cuồng rồi.", "tr": "Başım dönüyor.", "ar": "رأسي يدور."}, "Äh … mal sehen.": {"vi": "À … để xem.", "tr": "Eee … bir bakalım.", "ar": "آه … لنرَ."}, "Jetzt drängeln Sie aber.": {"vi": "Cô đang hối thúc tôi đấy.", "tr": "Şimdi acele ettiriyorsunuz.", "ar": "الآن تستعجلونني."}, "Stimmt. Ich freu mich drauf.": {"vi": "Đúng. Tôi rất mong chờ.", "tr": "Doğru. Sabırsızlıkla bekliyorum.", "ar": "صحيح. أتطلع إليه."}, "(ist unsicher und bringt ihn morgen zurück)": {"vi": "(không chắc và sẽ mang trả lại vào ngày mai)", "tr": "(emin değil ve yarın geri getirecek)", "ar": "(غير متأكد وسيعيده غدًا)"}, "Für Sie vielleicht.": {"vi": "Có thể với cô thôi.", "tr": "Belki sizin için.", "ar": "ربما بالنسبة لك."}, "Oh nein …": {"vi": "Ôi không …", "tr": "Ah hayır
