<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaufhaus Kranich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Josefin+Sans:wght@600;700&family=Limelight&display=swap">
<style>
/* Layout: eine Spalte wie ein Ladenzettel, oben die Bühne der Abteilung, darunter die Entscheidung */
:root{
  --bg:#E8EEEB; --surface:#FBFCFA; --surface2:#F0F4F1; --ink:#132A28; --muted:#4A625D; --line:#C3D2CC;
  --petrol:#0F4F4A; --on-petrol:#FFFFFF; --brass:#B5800F; --brass-soft:#F4E6C2; --crown:#B8352A;
  --good:#1F7444; --good-soft:#DCEFE2; --ok:#8F6206; --ok-soft:#F6EACB; --bad:#AE3829; --bad-soft:#F7DDD8;
  --shadow:0 1px 0 rgba(19,42,40,.06),0 8px 22px rgba(19,42,40,.09);
  --f-logo:'Limelight',Georgia,'Times New Roman',serif;
  --f-head:'Josefin Sans','Trebuchet MS',Verdana,sans-serif;
  --f-body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1716; --surface:#13221F; --surface2:#182B27; --ink:#E3EDE9; --muted:#9BB2AC; --line:#29433E;
  --petrol:#3FA79C; --on-petrol:#062420; --brass:#E2AE45; --brass-soft:#392D13; --crown:#E5664F;
  --good:#5CC48A; --good-soft:#143226; --ok:#E2AE45; --ok-soft:#392D13; --bad:#EF7363; --bad-soft:#3C1C18;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1716; --surface:#13221F; --surface2:#182B27; --ink:#E3EDE9; --muted:#9BB2AC; --line:#29433E;
  --petrol:#3FA79C; --on-petrol:#062420; --brass:#E2AE45; --brass-soft:#392D13; --crown:#E5664F;
  --good:#5CC48A; --good-soft:#143226; --ok:#E2AE45; --ok-soft:#392D13; --bad:#EF7363; --bad-soft:#3C1C18;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);line-height:1.15;text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-family:var(--f-head);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;color:var(--muted)}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

/* Kopfleiste */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--petrol);color:var(--on-petrol);box-shadow:var(--shadow)}
.hud-in{max-width:760px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.hud .logo{font-family:var(--f-logo);font-size:1.15rem;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.hud .logo svg{width:26px;height:26px;flex:none}
.hud .stats{display:flex;gap:12px;margin-left:auto;align-items:center;font-variant-numeric:tabular-nums;font-size:.9rem}
.hud .stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.hud .stat b{font-size:1.02rem}
.hud .stat span{font-size:.68rem;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
.iconbtn{background:transparent;border:1.5px solid currentColor;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none;color:inherit}
.iconbtn svg{width:22px;height:22px}
.iconbtn[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#1b1405}
.baro{width:64px;height:10px;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
.baro i{display:block;height:100%;background:var(--brass);transition:width .6s}
@media (max-width:420px){.hud .stat.hide-s{display:none}.hud .logo .lt{display:none}}

/* Karten & Knöpfe */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:14px;border:2px solid var(--petrol);background:var(--petrol);color:var(--on-petrol);font-family:var(--f-head);font-weight:700;font-size:1.05rem;cursor:pointer;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--petrol)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#1b1405}
.btn.block{width:100%}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;cursor:pointer;font-size:.95rem;min-height:44px}
.chip[aria-pressed="true"]{border-color:var(--petrol);background:var(--petrol);color:var(--on-petrol)}
input[type=text],input[type=number],select{width:100%;min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:10px 14px}
label.lbl{font-weight:700;display:block;margin-bottom:6px}

/* Startseite */
.hero{margin-inline:-16px;position:relative}
.hero>svg{display:block;width:100%;height:auto}
.title-block{margin-top:-6px}
.title-block h1{font-family:var(--f-logo);font-weight:400;font-size:clamp(2rem,7vw,3rem);letter-spacing:.01em}
.title-block .sub{font-family:var(--f-head);font-weight:700;color:var(--brass);font-size:1.15rem;margin-top:4px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.mode[aria-pressed="true"]{border-color:var(--petrol);box-shadow:inset 0 0 0 2px var(--petrol)}
.mode h3{font-size:1.2rem}
.mode ul{margin:0;padding-left:18px;font-size:.9rem;color:var(--muted)}
.depts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dept{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.88rem;font-weight:700;text-align:center;min-width:0}
.dept svg{width:48px;height:48px}
.dept[aria-pressed="true"]{border-color:var(--petrol);box-shadow:inset 0 0 0 2px var(--petrol)}
@media (max-width:420px){.modes{grid-template-columns:1fr}}

/* Brief */
.letter{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:22px 20px;box-shadow:var(--shadow);position:relative}
.letter:before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:repeating-linear-gradient(90deg,var(--crown) 0 14px,var(--surface) 14px 20px,var(--petrol) 20px 34px,var(--surface) 34px 40px)}
.letter .sig{font-family:var(--f-logo);font-size:1.4rem;color:var(--petrol)}

/* Bühne */
.stage{position:relative;margin-inline:-16px;background:var(--surface2);overflow:hidden;aspect-ratio:2/1;max-height:340px;width:calc(100% + 32px)}
.stage>svg.back{position:absolute;inset:0;width:100%;height:100%}
.stage .person{position:absolute;right:4%;bottom:0;width:38%;max-width:240px;height:auto;transition:transform .3s}
.stage .person svg{display:block;width:100%;height:auto}
.stage .tag{position:absolute;left:12px;bottom:10px;background:var(--surface);color:var(--ink);border-radius:10px;padding:5px 10px;font-weight:700;font-size:.9rem;box-shadow:var(--shadow);max-width:55%}
.stage .tag small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.bubble{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:12px 14px;font-size:1.02rem;margin-top:14px}
.bubble:after{content:"";position:absolute;top:-12px;right:22%;width:20px;height:20px;background:var(--surface);border-left:2px solid var(--ink);border-top:2px solid var(--ink);transform:rotate(45deg)}
.bubble.mood-2{border-color:var(--good)}.bubble.mood-2:after{border-color:var(--good)}
.bubble.mood-0{border-color:var(--bad)}.bubble.mood-0:after{border-color:var(--bad)}
.clue{display:flex;gap:10px;align-items:flex-start;background:var(--brass-soft);border-radius:12px;padding:10px 12px;font-size:.95rem}
.clue svg{flex:none;width:22px;height:22px;margin-top:2px}

/* Entscheidung */
.sit{font-size:1.06rem}
.q{font-family:var(--f-head);font-weight:700;font-size:1.2rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer;min-height:56px}
.opt .let{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);font-family:var(--f-head);font-weight:700;border:1.5px solid var(--line)}
.opt[aria-pressed="true"]{border-color:var(--petrol);box-shadow:inset 0 0 0 2px var(--petrol)}
.opt[aria-pressed="true"] .let{background:var(--petrol);color:var(--on-petrol);border-color:var(--petrol)}
.opt:disabled{cursor:default}
.opt.struck{opacity:.4;text-decoration:line-through}
.opt.locked-2{border-color:var(--good);background:var(--good-soft)}
.opt.locked-1{border-color:var(--ok);background:var(--ok-soft)}
.opt.locked-0{border-color:var(--bad);background:var(--bad-soft)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--line);background:transparent;border-radius:10px;padding:8px 12px;cursor:pointer;min-height:44px;font-size:.92rem}
.tool svg{width:18px;height:18px}
.tool:disabled{opacity:.4;cursor:not-allowed}
.ws{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ws dt{font-weight:700}.ws dd{margin:0 0 6px 0;color:var(--muted)}
.hint{background:var(--brass-soft);border-radius:12px;padding:10px 12px}
.timer{height:10px;border-radius:6px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.timer i{display:block;height:100%;background:var(--crown);width:100%}
.term{border-radius:14px;padding:14px 16px;border:2px solid var(--line);background:var(--surface2);display:flex;gap:12px;align-items:center}
.term .sym{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-weight:700;font-size:1.3rem;color:#fff}
.term.f2 .sym{background:var(--good)}.term.f1 .sym{background:var(--ok)}.term.f0 .sym{background:var(--bad)}
.term b{font-family:var(--f-head);font-size:1.1rem}
.ask{border:2px solid var(--brass);border-radius:14px;padding:14px;background:var(--surface)}
.ask .opts .opt{min-height:48px;padding:10px 12px}

/* Mini-Spiel */
.mini-item{min-height:120px;display:grid;place-items:center;text-align:center;font-size:1.25rem;font-weight:700;border:2px solid var(--ink);border-radius:16px;padding:18px;background:var(--surface);transition:background .2s}
.mini-item.ok{background:var(--good-soft);border-color:var(--good)}
.mini-item.no{background:var(--bad-soft);border-color:var(--bad)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats .btn{min-height:60px;font-size:1rem}
.cats.c3 .btn:last-child:nth-child(odd){grid-column:1/-1}
.mini-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.res-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.res-list li{display:flex;gap:8px;align-items:flex-start}
.res-list .mk{flex:none;width:22px;font-weight:700}
.res-list .mk.y{color:var(--good)}.res-list .mk.n{color:var(--bad)}

/* Ladenschluss & Auswertung */
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.counter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.counter b{display:block;font-family:var(--f-head);font-size:1.7rem;font-variant-numeric:tabular-nums}
.counter span{font-size:.8rem;color:var(--muted)}
@media (max-width:420px){.counter b{font-size:1.35rem}}
.walk{position:relative;height:44px;overflow:hidden;margin-top:-8px}
.walk svg{position:absolute;bottom:0;width:22px;height:40px;animation:walk 3.2s linear forwards}
@keyframes walk{from{left:30%}to{left:105%}}
@media (prefers-reduced-motion:reduce){.walk svg{animation:none;display:none}.stage .person{transition:none}.baro i{transition:none}}
.suspects{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:520px){.suspects{grid-template-columns:repeat(3,1fr)}}
.suspect{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:.85rem;font-weight:700;text-align:center;min-width:0}
.suspect svg{width:100%;max-width:90px;height:auto}
.suspect[aria-pressed="true"]{border-color:var(--petrol);box-shadow:inset 0 0 0 2px var(--petrol)}
.suspect.inv{border-color:var(--brass);background:var(--brass-soft)}
.gauge svg{display:block;width:100%;max-width:340px;margin:0 auto;height:auto}
.scorecard{border-radius:18px;overflow:hidden;border:2px solid var(--petrol);background:var(--surface)}
.scorecard .top{background:var(--petrol);color:var(--on-petrol);padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.scorecard .top .lg{font-family:var(--f-logo);font-size:1.2rem}
.scorecard .body{padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.scorecard .big{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.scorecard .big b{font-family:var(--f-head);font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.stars{color:var(--brass);font-size:1.6rem;letter-spacing:2px}
.kv span{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kv b{font-size:1rem}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.2rem;letter-spacing:.15em;background:var(--brass-soft);border-radius:8px;padding:2px 8px}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{border-radius:10px;padding:8px 6px;text-align:center;font-size:.72rem;line-height:1.2;border:1.5px solid var(--line);background:var(--surface2);min-width:0;min-height:74px;display:flex;flex-direction:column;justify-content:space-between}
.tile b{font-family:var(--f-head);font-size:1.05rem}
.tile.g{background:var(--good-soft);border-color:var(--good)}
.tile.m{background:var(--ok-soft);border-color:var(--ok)}
.tile.r{background:var(--bad-soft);border-color:var(--bad)}
.tile .pc{font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:420px){.tile .nm{display:none}.tile{min-height:52px}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1.5px solid}
.rev{display:flex;flex-direction:column;gap:10px}
.revi{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.revi .hd{display:flex;gap:10px;align-items:center}
.revi .sym{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.revi.f2 .sym{background:var(--good)}.revi.f1 .sym{background:var(--ok)}.revi.f0 .sym{background:var(--bad)}
.revi .lab{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.revi .better{border-left:4px solid var(--good);padding-left:10px}
.revi .ihk{border-left:4px solid var(--brass);padding-left:10px}
.heft{border:2px dashed var(--petrol);border-radius:14px;padding:16px;background:repeating-linear-gradient(var(--surface) 0 31px,var(--line) 31px 32px);font-size:1.15rem;line-height:32px}
details.sol summary{cursor:pointer;font-weight:700;color:var(--petrol);min-height:44px;display:flex;align-items:center}
.ending{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.ending>svg{display:block;width:100%;height:auto}
.ending .tx{padding:16px}
.note{font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:50;font-size:.95rem;max-width:calc(100% - 32px)}

/* Beamer */
.board{display:flex;flex-direction:column;gap:8px}
.bline{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:1.1rem}
.bline .pl{font-family:var(--f-head);font-weight:700;font-size:1.3rem;text-align:center}
.bline .pt{font-family:var(--f-head);font-weight:700;font-variant-numeric:tabular-nums;font-size:1.3rem}
.bline .x{border:none;background:transparent;cursor:pointer;color:var(--muted);font-size:1.2rem;min-width:44px;min-height:44px}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:10px}
.pod{border-radius:12px 12px 0 0;background:var(--petrol);color:var(--on-petrol);text-align:center;padding:10px 6px;min-width:0;overflow-wrap:anywhere}
.pod b{display:block;font-family:var(--f-head);font-size:1.6rem}
.pod.p1{background:var(--brass);color:#1b1405;min-height:150px}.pod.p2{min-height:115px}.pod.p3{min-height:90px;opacity:.85}
.bform{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;align-items:end}
@media (max-width:640px){.bform{grid-template-columns:1fr 1fr}.bform .full{grid-column:1/-1}}

.t{display:none;margin:4px 0 0;padding-inline-start:8px;border-inline-start:3px solid rgba(127,127,127,.55);color:inherit;opacity:.88;font-weight:400;font-style:normal;font-size:.9em;line-height:1.45;letter-spacing:0;text-transform:none;text-align:start}
.t b{font-weight:700}
body[data-lang="vi"] .t-vi,body[data-lang="tr"] .t-tr,body[data-lang="ar"] .t-ar{display:block}
.t-ar{direction:rtl}
button .t,.chip .t,.mode .t{font-size:.8em}
.hud-in{flex-wrap:wrap}
#sprachbar{display:flex;gap:4px;align-items:center}
#sprachbar button{font:inherit;font-size:.78rem;font-weight:700;min-height:32px;min-width:34px;padding:2px 8px;border:1px solid currentColor;border-radius:14px;background:transparent;color:inherit;cursor:pointer}
#sprachbar button[aria-pressed="true"]{background:#fff;color:var(--petrol,#1F4E79)}
</style>
</head>
<body>
<header class="hud" id="hud"></header>
<main class="wrap" id="app" aria-live="polite"></main>
<script>
(function(){
  var D = {"Frau Nowak steht vor den Rucksäcken.": {"vi": "Bà Nowak đứng trước các chiếc ba lô.", "tr": "Bayan Nowak sırt çantalarının önünde duruyor.", "ar": "تقف السيدة Nowak أمام حقائب الظهر."}, "Frau Nowak nimmt einen Rucksack in die Hand und schaut sich suchend um. Ihr räumt gerade Trinkflaschen ein.": {"vi": "Bà Nowak cầm một chiếc ba lô lên và nhìn quanh như đang tìm gì đó. Các bạn đang xếp các chai nước.", "tr": "Bayan Nowak bir sırt çantasını eline alıyor ve arayan gözlerle etrafına bakıyor. Siz de tam su şişelerini diziyorsunuz.", "ar": "تأخذ السيدة Nowak حقيبة ظهر بيدها وتنظر حولها كأنها تبحث عن شيء. أنتم تُرتّبون زجاجات الماء الآن."}, "Was tut ihr?": {"vi": "Các bạn làm gì?", "tr": "Ne yaparsınız?", "ar": "ماذا تفعلون؟"}, "Einräumen sofort unterbrechen, von vorn hingehen: „Guten Tag! Der Rucksack, den Sie da haben, hat einen gepolsterten Rücken. Wofür möchten Sie ihn verwenden?“": {"vi": "Dừng việc xếp hàng ngay, đi thẳng đến: „Xin chào! Chiếc ba lô chị đang cầm có lưng đệm êm. Chị định dùng nó để làm gì ạ?“", "tr": "Diziyi hemen bırakıp karşıdan gitmek: „İyi günler! Elinizdeki sırt çantasının sırtı yastıklı. Onu ne için kullanmak istersiniz?“", "ar": "التوقف فورًا عن الترتيب والذهاب إليها من الأمام: «مرحبًا! الحقيبة التي في يدك ظهرها مبطّن. في ماذا تريدين استخدامها؟»"}, "Gut, dass Sie kommen! Für die Schule und zum Wandern.": {"vi": "Hay quá, cảm ơn bạn đã đến! Để đi học và thỉnh thoảng đi bộ đường dài.", "tr": "İyi ki geldiniz! Okul için ve arada bir yürüyüş için.", "ar": "جميل أنكم جئتم! للمدرسة ولرحلات المشي أحيانًا."}, "Ware in der Hand und suchender Blick sind Kundensignale. Tätigkeit sofort abbrechen, Blickkontakt, warenbezogen ansprechen.": {"vi": "Hàng trong tay và ánh mắt tìm kiếm là tín hiệu của khách. Dừng ngay việc đang làm, giao tiếp bằng mắt, bắt chuyện liên quan đến hàng hóa.", "tr": "Elde mal ve arayan bakış müşteri sinyalleridir. İşi hemen bırak, göz teması kur, mala yönelik konuş.", "ar": "البضاعة في اليد والنظرة الباحثة هما إشارتان من العميل. أوقف عملك فورًا، وأقِم تواصلًا بصريًا، وخاطب العميل بما يتعلق بالبضاعة."}, "Weiter einräumen. Wenn sie etwas will, kommt sie schon.": {"vi": "Tiếp tục xếp hàng. Nếu chị ấy cần gì thì sẽ tự đến.", "tr": "Dizmeye devam etmek. Bir şey isterse kendisi gelir.", "ar": "متابعة الترتيب. إن أرادت شيئًا فستأتي بنفسها."}, "Hallo? Arbeitet hier jemand?": {"vi": "Alô? Ở đây có ai làm việc không?", "tr": "Alo? Burada çalışan biri var mı?", "ar": "ألو؟ هل يعمل أحد هنا؟"}, "Kundensignal übersehen. Kunden fühlen sich schnell zurückgesetzt, wenn man sie warten lässt.": {"vi": "Bỏ qua tín hiệu của khách. Khách dễ cảm thấy bị bỏ rơi nếu phải chờ.", "tr": "Müşteri sinyali gözden kaçırıldı. Müşteriler bekletilince çabuk geri plana itilmiş hisseder.", "ar": "تجاهلتم إشارة العميل. يشعر العملاء بسرعة بأنهم مهمَلون إذا تُركوا ينتظرون."}, "Hingehen und fragen: „Kann ich Ihnen helfen?“": {"vi": "Đi đến và hỏi: „Tôi giúp gì được cho chị ạ?“", "tr": "Gidip sormak: „Size yardımcı olabilir miyim?“", "ar": "الذهاب إليها والسؤال: «هل يمكنني مساعدتك؟»"}, "Äh … ja, vielleicht.": {"vi": "À … vâng, có lẽ vậy.", "tr": "Şey … evet, belki.", "ar": "آه … نعم، ربما."}, "Hingehen ist richtig. Aber „Kann ich Ihnen helfen?“ ist geschlossen – die Kundin kann Nein sagen.": {"vi": "Đi đến là đúng. Nhưng „Tôi giúp gì được cho chị ạ?“ là câu hỏi đóng – khách có thể trả lời „Không“.", "tr": "Gitmek doğru. Ama „Size yardımcı olabilir miyim?“ kapalı bir sorudur – müşteri „Hayır“ diyebilir.", "ar": "الذهاب إليها صحيح. لكن «هل يمكنني مساعدتك؟» سؤال مغلق – فيمكن للعميلة أن تقول لا."}, "Von hinten an sie herantreten: „Suchen Sie was Bestimmtes?“": {"vi": "Bước đến từ phía sau: „Chị tìm gì cụ thể không ạ?“", "tr": "Arkadan yaklaşmak: „Belirli bir şey mi arıyorsunuz?“", "ar": "الاقتراب منها من الخلف: «هل تبحثين عن شيء معيّن؟»"}, "Huch! Haben Sie mich erschreckt!": {"vi": "Ối! Bạn làm tôi giật mình!", "tr": "Hay! Beni korkuttunuz!", "ar": "آه! لقد أخفتموني!"}, "Nie von hinten ansprechen – sie fühlt sich überfallen. Dazu eine geschlossene Frage.": {"vi": "Không bao giờ bắt chuyện từ phía sau – khách sẽ thấy như bị tấn công bất ngờ. Thêm nữa lại là một câu hỏi đóng.", "tr": "Müşteriye asla arkadan seslenme – kendini bastırılmış hisseder. Üstelik kapalı bir soru.", "ar": "لا تخاطب العميل من الخلف أبدًا – فهي تشعر بأنها فوجئت بهجوم. ومع ذلك فالسؤال مغلق."}, "Sie sagt: „Für die Schule, aber auch mal zum Wandern.“": {"vi": "Chị nói: „Để đi học, nhưng thỉnh thoảng cũng để đi bộ đường dài.“", "tr": "Diyor ki: „Okul için, ama ara sıra yürüyüş için de.“", "ar": "تقول: «للمدرسة، ولكن أحيانًا للمشي في الجبال أيضًا.»"}, "Wie geht ihr weiter?": {"vi": "Các bạn tiếp tục thế nào?", "tr": "Nasıl devam edersiniz?", "ar": "كيف تتابعون؟"}, "„Dann zeige ich Ihnen einmal dieses Modell – 24 Liter, gepolsterter Rücken. Wie gefällt es Ihnen?“": {"vi": "„Vậy tôi xin giới thiệu mẫu này – 24 lít, lưng đệm êm. Chị thấy thế nào ạ?“", "tr": "„O zaman size bu modeli göstereyim – 24 litre, yastıklı sırt. Nasıl buldunuz?“", "ar": "«إذًا سأُريكِ هذا الموديل – 24 لترًا وظهر مبطّن. ما رأيك فيه؟»"}, "Oh, der sieht gut aus. Vielleicht etwas größer?": {"vi": "Ồ, nhìn đẹp đấy. Có thể to hơn chút không?", "tr": "Oh, güzel görünüyor. Belki biraz daha büyük?", "ar": "أوه، يبدو جميلًا. ربما أكبر قليلًا؟"}, "Die Fragen haben den Rahmen geliefert. Jetzt Ware zeigen und die Reaktion lesen. So kombiniert man direkte und indirekte Bedarfsermittlung.": {"vi": "Các câu hỏi đã tạo khung. Giờ hãy cho khách xem hàng và đọc phản ứng. Như vậy là kết hợp tìm hiểu nhu cầu trực tiếp và gián tiếp.", "tr": "Sorular çerçeveyi sağladı. Şimdi malı göster ve tepkiyi oku. Böylece doğrudan ve dolaylı ihtiyaç tespiti birleştirilir.", "ar": "الأسئلة رسمت الإطار. الآن اعرض البضاعة واقرأ ردّ الفعل. وهكذا يُجمَع بين التعرّف المباشر وغير المباشر على الحاجة."}, "„Wie viel möchten Sie denn ausgeben?“": {"vi": "„Chị muốn chi bao nhiêu ạ?“", "tr": "„Ne kadar harcamak istersiniz?“", "ar": "«كم تريدين أن تدفعي؟»"}, "Äh … weiß ich noch nicht.": {"vi": "À … tôi chưa biết.", "tr": "Şey … henüz bilmiyorum.", "ar": "آه … لا أعرف بعد."}, "Die Preisfrage gehört nicht an den Anfang. Sie engt zu stark ein und kann peinlich wirken.": {"vi": "Không nên hỏi giá ngay từ đầu. Câu hỏi này giới hạn quá chặt và có thể gây ngượng.", "tr": "Fiyat sorusu başa konmaz. Fazla daraltır ve utandırıcı olabilir.", "ar": "سؤال السعر لا مكان له في البداية. فهو يضيّق الخيارات كثيرًا وقد يُحرج."}, "Wahllos einen Rucksack nach dem anderen hinlegen, bis einer passt.": {"vi": "Bày hết chiếc ba lô này đến chiếc khác ra bừa bãi cho đến khi có cái vừa ý.", "tr": "Birine uyana kadar sırt çantalarını rastgele tek tek önüne koymak.", "ar": "وضع حقيبة ظهر تلو الأخرى بشكل عشوائي إلى أن تناسب إحداها."}, "Raten Sie jetzt einfach?": {"vi": "Bạn đang đoán mò đấy à?", "tr": "Şimdi tahmin mi yürütüyorsunuz?", "ar": "هل تخمّنون الآن فقط؟"}, "Wer ohne Plan Testangebote vorlegt, verliert an Fachkompetenz.": {"vi": "Ai đưa hàng thử mà không có kế hoạch sẽ mất đi sự chuyên nghiệp.", "tr": "Plansız deneme teklifleri sunan, uzmanlık itibarını kaybeder.", "ar": "من يعرض بضاعة للتجربة دون خطة يفقد كفاءته المهنية."}, "„Möchten Sie lieber einen großen oder einen kleinen?“": {"vi": "„Chị thích cái lớn hay cái nhỏ hơn ạ?“", "tr": "„Büyük mü yoksa küçük mü tercih edersiniz?“", "ar": "«هل تفضّلين الكبير أم الصغير؟»"}, "Hm, mittel vielleicht?": {"vi": "Hm, có lẽ cỡ vừa?", "tr": "Hm, belki orta boy?", "ar": "همم، ربما المتوسط؟"}, "Alternativfrage zu früh. Sie passt erst, wenn die Auswahl schon eingegrenzt ist.": {"vi": "Câu hỏi lựa chọn đưa ra quá sớm. Nó chỉ hợp khi phạm vi lựa chọn đã được thu hẹp.", "tr": "Seçenekli soru çok erken. Ancak seçim zaten daraltıldıysa uygundur.", "ar": "سؤال الاختيار جاء مبكرًا جدًا. فهو مناسب فقط بعد أن يكون الاختيار قد ضاق."}, "Herr Albers hält eine Regenjacke in der Hand. Er wandert jedes Wochenende, auch bei Regen.": {"vi": "Ông Albers cầm một chiếc áo mưa. Cuối tuần nào ông cũng đi bộ đường dài, kể cả khi mưa.", "tr": "Bay Albers elinde bir yağmurluk tutuyor. Her hafta sonu, yağmurda bile yürüyüşe çıkıyor.", "ar": "يحمل السيد Albers سترة مطر. يمشي في الجبال كل عطلة أسبوع، حتى في المطر."}, "Die Jacke hat eine Gore-Tex-Membran.": {"vi": "Chiếc áo khoác có màng Gore-Tex.", "tr": "Ceketin Gore-Tex membranı var.", "ar": "السترة مزوّدة بغشاء Gore-Tex."}, "Wie argumentiert ihr?": {"vi": "Các bạn lập luận thế nào?", "tr": "Nasıl argüman sunarsınız?", "ar": "كيف تحتجّون؟"}, "„Die Jacke hat eine Gore-Tex-Membran. Dadurch ist sie wasserdicht und trotzdem atmungsaktiv. So bleiben Sie auch bei stundenlangem Regen trocken und kommen nicht ins Schwitzen.“": {"vi": "„Áo có màng Gore-Tex. Nhờ đó áo vừa chống nước vừa thoáng khí. Vì vậy ông sẽ khô ráo kể cả khi mưa nhiều giờ liền và không bị đổ mồ hôi.“", "tr": "„Ceketin Gore-Tex membranı var. Sayesinde hem su geçirmez hem de nefes alır. Böylece saatlerce yağmurda bile kuru kalırsınız ve terlemezsiniz.“", "ar": "«السترة مزوّدة بغشاء Gore-Tex. وبفضله هي مقاومة للماء وتسمح بمرور الهواء أيضًا. وهكذا ستبقى جافًا حتى تحت المطر لساعات ولن تتعرّق.»"}, "Genau das brauche ich am Sonntag!": {"vi": "Đúng là thứ tôi cần vào Chủ nhật!", "tr": "Pazar günü tam bunu istiyorum!", "ar": "هذا بالضبط ما أحتاجه يوم الأحد!"}, "Merkmal – Vorteil – Kundennutzen. Der Nutzen passt zu seinem Bedarf (Regen).": {"vi": "Đặc điểm – Ưu điểm – Lợi ích cho khách. Lợi ích phù hợp với nhu cầu của ông (mưa).", "tr": "Özellik – Avantaj – Müşteri faydası. Fayda, müşterinin ihtiyacına (yağmur) uyuyor.", "ar": "الميزة – الفائدة – منفعة العميل. المنفعة تناسب حاجته (المطر)."}, "„Die Jacke hat eine Gore-Tex-Membran.“": {"vi": "„Áo có màng Gore-Tex.“", "tr": "„Ceketin Gore-Tex membranı var.“", "ar": "«السترة مزوّدة بغشاء Gore-Tex.»"}, "Aha. Und was heißt das für mich?": {"vi": "Ra thế. Vậy điều đó có nghĩa gì với tôi?", "tr": "Anladım. Peki bu benim için ne demek?", "ar": "فهمت. وماذا يعني ذلك بالنسبة لي؟"}, "Nur ein Merkmal. Ein Merkmal allein verkauft nicht – der Kunde kauft den Nutzen.": {"vi": "Chỉ là một đặc điểm. Riêng đặc điểm thì không bán được hàng – khách mua lợi ích.", "tr": "Sadece bir özellik. Tek başına özellik satmaz – müşteri faydayı satın alır.", "ar": "ميزة واحدة فقط. الميزة وحدها لا تبيع – العميل يشتري المنفعة."}, "„Die Jacke ist wirklich super, die wird ganz oft gekauft.“": {"vi": "„Áo này thật sự tuyệt, được mua rất nhiều.“", "tr": "„Bu ceket gerçekten harika, çok sık satın alınıyor.“", "ar": "«هذه السترة رائعة حقًا، ويشتريها كثيرون.»"}, "Das sagen Sie bestimmt zu jeder Jacke.": {"vi": "Chắc bạn nói câu đó với áo nào cũng vậy.", "tr": "Her ceket için bunu söylüyorsunuzdur herhalde.", "ar": "لا شك أنكم تقولون هذا عن كل سترة."}, "Eine Verkaufsphrase ohne Information.": {"vi": "Một câu quảng cáo sáo rỗng, không có thông tin.", "tr": "Bilgi içermeyen bir satış sloganı.", "ar": "عبارة بيع فارغة بلا أي معلومة."}, "„Damit kann man auch bei Regen wandern.“": {"vi": "„Với áo này người ta cũng có thể đi bộ khi trời mưa.“", "tr": "„Bununla yağmurda da yürüyüş yapılabilir.“", "ar": "«يمكن للمرء أن يمشي بها في الجبال حتى في المطر.»"}, "Das kann man mit vielen Jacken.": {"vi": "Nhiều loại áo khác cũng làm được thế.", "tr": "Bunu birçok ceketle yapabilirsiniz.", "ar": "يمكن فعل ذلك بسترات كثيرة."}, "Nutzen angedeutet, aber „man“ statt Sie-Stil und kein Merkmal.": {"vi": "Lợi ích mới được gợi ý, nhưng dùng „man“ (người ta) thay vì cách xưng hô „Sie“ và không nêu đặc điểm.", "tr": "Fayda ima edilmiş, ama „Sie“ hitabı yerine „man“ (insan) kullanılmış ve özellik yok.", "ar": "لُمِّح إلى المنفعة، لكن استُخدمت „man“ (المرء) بدل أسلوب „Sie“ ولم تُذكر ميزة."}, "Er fragt: „Und was kostet die?“ Die Jacke kostet 229 Euro.": {"vi": "Ông hỏi: „Còn giá bao nhiêu?“ Áo giá 229 euro.", "tr": "Soruyor: „Peki fiyatı ne kadar?“ Ceket 229 Euro.", "ar": "يسأل: «وكم سعرها؟» سعر السترة 229 يورو."}, "Wie nennt ihr den Preis?": {"vi": "Các bạn nêu giá thế nào?", "tr": "Fiyatı nasıl söylersiniz?", "ar": "كيف تذكرون السعر؟"}, "„Die Jacke ist winddicht und hat verschweißte Nähte, sie kostet 229 Euro – und Sie bleiben damit auch bei Dauerregen trocken.“": {"vi": "„Áo chắn gió và có đường may được hàn kín, giá 229 euro – và ông sẽ khô ráo kể cả khi mưa liên tục.“", "tr": "„Ceket rüzgâr geçirmez ve dikişleri kaynaklı, 229 Euro – ve sürekli yağmurda bile kuru kalırsınız.“", "ar": "«السترة تصدّ الرياح وخياطتها ملحومة، وسعرها 229 يورو – وهكذا تبقى جافًا حتى في المطر المستمر.»"}, "Für so viele Wanderungen trocken … das ist es mir wert.": {"vi": "Khô ráo suốt từng ấy chuyến đi bộ … xứng đáng với tôi.", "tr": "Bu kadar yürüyüşte kuru kalmak … buna değer.", "ar": "أن أبقى جافًا في كل هذه الرحلات … هذا يستحق ثمنه."}, "Sandwich-Methode: Nutzen – Preis – Nutzen. So gibt es keinen Preisschock.": {"vi": "Phương pháp bánh mì kẹp: Lợi ích – Giá – Lợi ích. Như vậy không gây sốc giá.", "tr": "Sandviç yöntemi: Fayda – Fiyat – Fayda. Böylece fiyat şoku olmaz.", "ar": "طريقة الساندويتش: المنفعة – السعر – المنفعة. وهكذا لا تحدث صدمة سعرية."}, "„229 Euro.“": {"vi": "„229 euro.“", "tr": "„229 Euro.“", "ar": "«229 يورو.»"}, "Puh. Das ist aber viel.": {"vi": "Phù. Đắt thật đấy.", "tr": "Ufff. Bu çok fazla.", "ar": "أوف. هذا كثير فعلًا."}, "Ein nackter Preis löst einen Preisschock aus.": {"vi": "Một mức giá trần trụi gây ra sốc giá.", "tr": "Çıplak bir fiyat fiyat şokuna yol açar.", "ar": "السعر العاري يسبّب صدمة سعرية."}, "„Die ist leider ziemlich teuer: 229 Euro.“": {"vi": "„Tiếc là áo khá đắt: 229 euro.“", "tr": "„Ne yazık ki oldukça pahalı: 229 Euro.“", "ar": "«للأسف هي غالية نوعًا ما: 229 يورو.»"}, "Wenn Sie das schon sagen …": {"vi": "Nếu bạn đã nói vậy thì …", "tr": "Siz böyle diyorsanız …", "ar": "ما دمتم تقولون ذلك …"}, "„Leider“ und „teuer“ sind Negativformulierungen.": {"vi": "„Tiếc là“ và „đắt“ là cách nói tiêu cực.", "tr": "„Ne yazık ki“ ve „pahalı“ olumsuz ifadelerdir.", "ar": "«للأسف» و«غالية» صياغتان سلبيتان."}, "„Bei zehn Jahren Nutzung sind das nur 6 Cent am Tag.“": {"vi": "„Dùng mười năm thì chỉ tốn 6 xu mỗi ngày.“", "tr": "„On yıl kullanımda günde sadece 6 sent eder.“", "ar": "«على مدى عشر سنوات من الاستخدام لا تكلّف إلا 6 سنتات في اليوم.»"}, "Zehn Jahre? Na, mal sehen.": {"vi": "Mười năm? Thôi, để xem đã.", "tr": "On yıl mı? Bakalım.", "ar": "عشر سنوات؟ سنرى."}, "Verkleinerungsmethode ist möglich. Aber zehn Jahre bei einer Jacke sind schwer zu glauben, und der Preis selbst fehlt.": {"vi": "Phương pháp thu nhỏ là khả thi. Nhưng khó tin một chiếc áo dùng được mười năm, và bản thân giá thì không được nêu.", "tr": "Küçültme yöntemi mümkün. Ama bir ceketin on yıl dayanması inanması zor ve fiyatın kendisi söylenmemiş.", "ar": "طريقة التصغير ممكنة. لكن من الصعب تصديق أن السترة تدوم عشر سنوات، كما أن السعر نفسه لم يُذكر."}, "Herr Demir sucht einen Fahrradhelm für seinen Sohn (8).": {"vi": "Ông Demir tìm mũ bảo hiểm xe đạp cho con trai (8 tuổi).", "tr": "Bay Demir oğlu (8) için bir bisiklet kaskı arıyor.", "ar": "يبحث السيد Demir عن خوذة دراجة لابنه (8 سنوات)."}, "Er sagt: „Er fährt jetzt allein zur Schule. Der Helm muss richtig schützen.“": {"vi": "Ông nói: „Giờ cháu đi học một mình. Mũ phải bảo vệ thật tốt.“", "tr": "Diyor ki: „Artık okula tek başına gidiyor. Kaskın gerçekten koruması gerekiyor.“", "ar": "يقول: «أصبح يذهب إلى المدرسة بمفرده الآن. يجب أن تحميه الخوذة فعلًا.»"}, "Was sagt ihr?": {"vi": "Các bạn nói gì?", "tr": "Ne söylersiniz?", "ar": "ماذا تقولون؟"}, "„Da sind Sie bei uns genau richtig. Dieser Helm hat ein Rücklicht und sitzt fest – damit ist Ihr Sohn sicher und gut zu sehen.“": {"vi": "„Ông đến đúng chỗ rồi ạ. Mũ này có đèn hậu và ôm chặt – như vậy con trai ông an toàn và dễ được nhìn thấy.“", "tr": "„Doğru yerdesiniz. Bu kaskın arka lambası var ve sıkı oturuyor – böylece oğlunuz güvende ve iyi görünür.“", "ar": "«لقد جئت إلى المكان الصحيح. هذه الخوذة فيها ضوء خلفي وتثبت جيدًا – وهكذا يكون ابنك آمنًا ويراه الجميع.»"}, "Ein Rücklicht? Das ist gut.": {"vi": "Có đèn hậu à? Hay đấy.", "tr": "Arka lamba mı? Bu iyi.", "ar": "ضوء خلفي؟ هذا جيد."}, "Vertrauensauslöser plus Argument zum Kaufmotiv Sicherheit (rational).": {"vi": "Tạo niềm tin cộng với lập luận theo động cơ mua hàng là an toàn (lý trí).", "tr": "Güven oluşturma artı satın alma güdüsü olan güvenliğe (akılcı) yönelik argüman.", "ar": "بناء الثقة مع حجّة تناسب دافع الشراء: الأمان (عقلاني)."}, "„Der hier ist gerade total angesagt, den haben alle Kinder.“": {"vi": "„Mẫu này đang cực kỳ thịnh hành, đứa trẻ nào cũng có.“", "tr": "„Bu şu an çok moda, bütün çocuklarda var.“", "ar": "«هذا الموديل رائج جدًا الآن، وكل الأطفال لديهم مثله.»"}, "Das ist mir nicht so wichtig.": {"vi": "Điều đó không quan trọng lắm với tôi.", "tr": "Bu benim için o kadar önemli değil.", "ar": "هذا ليس مهمًا لي كثيرًا."}, "Das spricht Nachahmung an. Der Vater hat aber Sicherheit als Motiv genannt.": {"vi": "Câu này đánh vào tâm lý bắt chước. Nhưng người cha đã nêu động cơ là an toàn.", "tr": "Bu, taklit güdüsüne hitap ediyor. Oysa baba güvenliği güdü olarak belirtti.", "ar": "هذا يخاطب دافع التقليد. لكن الأب ذكر الأمان كدافع."}, "„Der hier ist im Angebot, nur 29 Euro.“": {"vi": "„Mẫu này đang khuyến mãi, chỉ 29 euro.“", "tr": "„Bu kampanyada, sadece 29 Euro.“", "ar": "«هذا الموديل في العرض، بـ 29 يورو فقط.»"}, "Und schützt der auch gut?": {"vi": "Vậy nó có bảo vệ tốt không?", "tr": "Peki iyi koruyor mu?", "ar": "وهل يحمي جيدًا أيضًا؟"}, "Geldersparnis hat er nicht genannt. Das Motiv passt nicht.": {"vi": "Ông ấy không nói đến tiết kiệm tiền. Động cơ không phù hợp.", "tr": "Para tasarrufundan söz etmedi. Güdü uymuyor.", "ar": "لم يذكر توفير المال. الدافع لا يناسبه."}, "„Sie wollen doch bestimmt nicht, dass Ihrem Sohn etwas passiert?“": {"vi": "„Chắc ông không muốn con trai mình gặp chuyện gì chứ?“", "tr": "„Oğlunuzun başına bir şey gelmesini istemezsiniz herhalde?“", "ar": "«لا شك أنك لا تريد أن يصيب ابنك مكروه؟»"}, "Was soll das denn heißen?": {"vi": "Ý bạn là gì vậy?", "tr": "Bu da ne demek oluyor?", "ar": "ماذا تقصدون بهذا؟"}, "Suggestivfrage mit Druck – sie macht ein schlechtes Gewissen. Das ist im Verkauf unzulässig.": {"vi": "Câu hỏi gợi ý có áp lực – làm người ta thấy áy náy. Điều này không được phép trong bán hàng.", "tr": "Baskılı yönlendirici soru – vicdan azabı yaratır. Satışta bu kabul edilemez.", "ar": "سؤال إيحائي فيه ضغط – يُشعر العميل بالذنب. وهذا غير مقبول في البيع."}, "Er nimmt den Helm. Sein Sohn hat auch ein neues Fahrrad, aber noch kein Schloss.": {"vi": "Ông lấy chiếc mũ. Con trai ông cũng có xe đạp mới, nhưng chưa có khóa.", "tr": "Kaskı alıyor. Oğlunun yeni bir bisikleti de var, ama henüz kilidi yok.", "ar": "يأخذ الخوذة. لدى ابنه دراجة جديدة أيضًا، لكن بلا قفل بعد."}, "Was bietet ihr an – und wann?": {"vi": "Các bạn đề nghị gì – và khi nào?", "tr": "Ne teklif edersiniz – ve ne zaman?", "ar": "ماذا تعرضون – ومتى؟"}, "Jetzt beim Helm: „Sie sagten, Ihr Sohn fährt allein zur Schule. Dieses Schloss ist sehr stabil – dann steht das Rad sicher am Schulhof.“": {"vi": "Ngay lúc mua mũ: „Ông nói con trai đi học một mình. Khóa này rất chắc – như vậy xe sẽ an toàn ở sân trường.“", "tr": "Hemen kasktayken: „Oğlunuzun okula tek başına gittiğini söylediniz. Bu kilit çok sağlam – böylece bisiklet okul bahçesinde güvende durur.“", "ar": "الآن عند الخوذة: «قلت إن ابنك يذهب إلى المدرسة بمفرده. هذا القفل متين جدًا – وهكذا تقف الدراجة بأمان في ساحة المدرسة.»"}, "Stimmt, daran habe ich gar nicht gedacht.": {"vi": "Đúng rồi, tôi chẳng nghĩ đến điều đó.", "tr": "Doğru, buna hiç aklım gitmemişti.", "ar": "صحيح، لم أفكر في ذلك أصلًا."}, "Zusatzangebot mit Nutzen, der zum ermittelten Bedarf passt. Richtiger Zeitpunkt: beim Hauptartikel.": {"vi": "Đề nghị hàng thêm với lợi ích phù hợp nhu cầu đã tìm hiểu. Đúng thời điểm: khi đang ở món hàng chính.", "tr": "Belirlenen ihtiyaca uyan faydalı bir ek teklif. Doğru zaman: ana ürünün yanında.", "ar": "عرض إضافة بمنفعة تناسب الحاجة التي جرى التعرّف عليها. الوقت المناسب: عند البضاعة الرئيسية."}, "Erst an der Kasse: „Brauchen Sie sonst noch was?“": {"vi": "Mãi đến quầy thu ngân mới hỏi: „Ông còn cần gì nữa không ạ?“", "tr": "Ancak kasada: „Başka bir şeye ihtiyacınız var mı?“", "ar": "عند الصندوق فقط: «هل تحتاج إلى شيء آخر؟»"}, "Nein, danke.": {"vi": "Không, cảm ơn.", "tr": "Hayır, teşekkürler.", "ar": "لا، شكرًا."}, "Zu spät und geschlossen gefragt. Der Kunde sagt Nein, und das Gespräch ist zu Ende.": {"vi": "Hỏi quá muộn và bằng câu hỏi đóng. Khách nói „Không“ và cuộc trò chuyện kết thúc.", "tr": "Çok geç ve kapalı soruldu. Müşteri „Hayır“ diyor ve görüşme bitiyor.", "ar": "سُئل متأخرًا وبسؤال مغلق. يقول العميل «لا» وتنتهي المحادثة."}, "„Wir haben auch Schlösser.“": {"vi": "„Chúng tôi cũng có khóa.“", "tr": "„Kilitlerimiz de var.“", "ar": "«لدينا أقفال أيضًا.»"}, "Aha.": {"vi": "À ra thế.", "tr": "Aha.", "ar": "آها."}, "Richtiger Zeitpunkt, aber ohne Kundennutzen.": {"vi": "Đúng thời điểm, nhưng thiếu lợi ích cho khách.", "tr": "Zamanlama doğru, ama müşteri faydası yok.", "ar": "التوقيت صحيح، لكن بلا منفعة للعميل."}, "„Ein Schloss haben Sie sicher schon?“": {"vi": "„Chắc ông đã có khóa rồi nhỉ?“", "tr": "„Kilidiniz zaten vardır herhalde?“", "ar": "«لا شك أن لديك قفلًا بالفعل؟»"}, "Äh … ja, ja.": {"vi": "À … vâng, vâng.", "tr": "Şey … evet, evet.", "ar": "آه … نعم، نعم."}, "Negative Suggestivfrage: Sie legt dem Kunden das Nein in den Mund.": {"vi": "Câu hỏi gợi ý tiêu cực: nó đặt sẵn chữ „Không“ vào miệng khách.", "tr": "Olumsuz yönlendirici soru: Müşterinin ağzına „Hayır“ı koyar.", "ar": "سؤال إيحائي سلبي: يضع كلمة «لا» في فم العميل."}, "Frau Haddad schlendert durch die Sportabteilung.": {"vi": "Bà Haddad dạo quanh khu thể thao.", "tr": "Bayan Haddad spor reyonunda geziyor.", "ar": "تتجوّل السيدة Haddad في قسم الرياضة."}, "Sie schaut mal hier, mal da. Als ihr näher kommt, lächelt sie kurz und schaut wieder weg.": {"vi": "Bà nhìn chỗ này, chỗ kia. Khi các bạn lại gần, bà mỉm cười thoáng qua rồi lại nhìn đi chỗ khác.", "tr": "Bir buraya bir oraya bakıyor. Yaklaşınca kısaca gülümsüyor ve tekrar başka yana bakıyor.", "ar": "تنظر مرة هنا ومرة هناك. وعندما تقتربون منها تبتسم لحظة ثم تنظر بعيدًا من جديد."}, "Wie verhaltet ihr euch?": {"vi": "Các bạn cư xử thế nào?", "tr": "Nasıl davranırsınız?", "ar": "كيف تتصرفون؟"}, "„Guten Tag! Schauen Sie sich gerne in Ruhe um. Wenn Sie etwas wissen möchten, bin ich für Sie da.“ Dann zurückziehen.": {"vi": "„Xin chào! Chị cứ thong thả xem nhé. Nếu cần biết gì, tôi luôn sẵn sàng ạ.“ Rồi lùi ra.", "tr": "„İyi günler! Rahatça bakın. Bir şey öğrenmek isterseniz buradayım.“ Sonra geri çekilmek.", "ar": "«مرحبًا! تفضّلي بالتجوّل براحتك. إن أردتِ معرفة شيء فأنا هنا من أجلك.» ثم الابتعاد."}, "Danke, sehr nett.": {"vi": "Cảm ơn, bạn tốt quá.", "tr": "Teşekkürler, çok naziksiniz.", "ar": "شكرًا، لطيف منكم."}, "Sie bummelt. Freiraum lassen, aber vorher Bereitschaft zum Helfen zeigen.": {"vi": "Chị đang dạo xem. Hãy để khách tự do, nhưng trước đó thể hiện sự sẵn sàng giúp đỡ.", "tr": "Geziyor. Serbest alan bırak, ama önce yardıma hazır olduğunu göster.", "ar": "هي تتجوّل. اترك لها مساحة حرة، لكن أظهر قبل ذلك استعدادك للمساعدة."}, "Mitgehen und ungefragt jedes Produkt erklären.": {"vi": "Đi theo và tự ý giải thích từng sản phẩm.", "tr": "Peşinden gidip sormadan her ürünü anlatmak.", "ar": "مرافقتها وشرح كل منتج دون أن تُسأل."}, "Äh … danke, ich schau nur.": {"vi": "À … cảm ơn, tôi chỉ xem thôi.", "tr": "Şey … teşekkürler, sadece bakıyorum.", "ar": "آه … شكرًا، أنا فقط أتفرّج."}, "Kein Freiraum – sie fühlt sich überrumpelt.": {"vi": "Không có không gian riêng – chị cảm thấy bị dồn ép.", "tr": "Serbest alan yok – müşteri kendini bunalmış hissediyor.", "ar": "لا مساحة حرة – تشعر العميلة بأنها مُحاصَرة."}, "Gar nichts sagen. Sie will ja nicht.": {"vi": "Không nói gì cả. Chị ấy đâu có muốn.", "tr": "Hiçbir şey söylememek. Zaten istemiyor.", "ar": "عدم قول أي شيء. فهي لا تريد على أي حال."}, "(denkt) Hier sieht mich wohl keiner.": {"vi": "(nghĩ) Ở đây chắc chẳng ai thấy mình.", "tr": "(düşünüyor) Burada beni kimse görmüyor galiba.", "ar": "(تفكّر) يبدو أن أحدًا لا يراني هنا."}, "Jeder Kunde muss merken, dass er wahrgenommen wurde.": {"vi": "Mọi khách hàng đều phải cảm nhận được rằng mình đã được chú ý.", "tr": "Her müşteri fark edildiğini hissetmelidir.", "ar": "يجب أن يشعر كل عميل بأنه قد لوحظ."}, "„Sie kommen zurecht?“": {"vi": "„Chị tự xoay xở được chứ?“", "tr": "„Idare ediyorsunuz değil mi?“", "ar": "«هل تتدبّرين أمرك؟»"}, "Ja, ja.": {"vi": "Vâng, vâng.", "tr": "Evet, evet.", "ar": "نعم، نعم."}, "Geschlossene Frage. Sie klingt, als wolle man die Kundin loswerden.": {"vi": "Câu hỏi đóng. Nghe như muốn tống khách đi cho xong.", "tr": "Kapalı soru. Müşteriden kurtulmak istiyormuşsunuz gibi duruyor.", "ar": "سؤال مغلق. يبدو وكأنكم تريدون التخلص من العميلة."}, "Zehn Minuten später steht sie vor den Yogamatten. Sie rollt eine Matte auf, fühlt das Material und schaut sich suchend um.": {"vi": "Mười phút sau chị đứng trước các tấm thảm yoga. Chị mở cuộn một tấm, sờ chất liệu và nhìn quanh như đang tìm ai đó.", "tr": "On dakika sonra yoga minderlerinin önünde duruyor. Bir minderi açıyor, malzemeyi hissediyor ve arayan gözlerle etrafına bakıyor.", "ar": "بعد عشر دقائق تقف أمام سجادات اليوغا. تفرد سجادة وتتحسّس خامتها وتنظر حولها كأنها تبحث عن أحد."}, "Was bedeutet das – und was tut ihr?": {"vi": "Điều đó có nghĩa gì – và các bạn làm gì?", "tr": "Bunun anlamı ne – ve ne yaparsınız?", "ar": "ماذا يعني هذا – وماذا تفعلون؟"}, "Das kann bedeuten: Jetzt möchte sie Hilfe. Hingehen, gut 1,5 Meter Abstand: „Diese Matte ist besonders rutschfest. Wofür möchten Sie sie nutzen?“": {"vi": "Có thể có nghĩa là: giờ chị cần giúp. Đi đến, giữ khoảng cách hơn 1,5 mét: „Tấm thảm này đặc biệt chống trượt. Chị định dùng nó để làm gì ạ?“", "tr": "Şu anlama gelebilir: Şimdi yardım istiyor. Yanına git, iyi bir 1,5 metre mesafe bırak: „Bu mindet özellikle kaymaz. Onu ne için kullanmak istersiniz?“", "ar": "قد يعني ذلك: الآن تريد المساعدة. اذهبوا إليها مع مسافة 1,5 متر تقريبًا: «هذه السجادة مضادة للانزلاق بشكل خاص. في ماذا تريدين استخدامها؟»"}, "Für Yoga zu Hause. Rutschfest ist gut!": {"vi": "Để tập yoga ở nhà. Chống trượt là tốt!", "tr": "Evde yoga için. Kaymaz olması iyi!", "ar": "لليوغا في البيت. مضادة للانزلاق جيد!"}, "Ware prüfen und suchender Blick sind Kundensignale. Im Verkaufsgespräch gilt die gesellschaftliche Distanz (1,20 bis 3,00 m).": {"vi": "Kiểm tra hàng và ánh mắt tìm kiếm là tín hiệu của khách. Trong cuộc nói chuyện bán hàng áp dụng khoảng cách xã hội (1,20 đến 3,00 m).", "tr": "Malı inceleme ve arayan bakış müşteri sinyalleridir. Satış görüşmesinde toplumsal mesafe (1,20 ila 3,00 m) geçerlidir.", "ar": "فحص البضاعة والنظرة الباحثة إشارتان من العميل. في محادثة البيع تسري المسافة الاجتماعية (من 1,20 إلى 3,00 م)."}, "Sie ist bestimmt genervt. Lieber nicht stören.": {"vi": "Chắc chị ấy đang khó chịu. Tốt hơn đừng làm phiền.", "tr": "Kesin canı sıkılmış. Rahatsız etmesek daha iyi.", "ar": "لا بد أنها منزعجة. الأفضل ألا نزعجها."}, "(seufzt und legt die Matte weg)": {"vi": "(thở dài và đặt tấm thảm xuống)", "tr": "(iç çekiyor ve mindeti bırakıyor)", "ar": "(تتنهّد وتضع السجادة جانبًا)"}, "Falsch gedeutet. Suchender Blick und Ware prüfen zeigen Interesse.": {"vi": "Hiểu sai rồi. Ánh mắt tìm kiếm và việc kiểm tra hàng cho thấy khách quan tâm.", "tr": "Yanlış yorumlandı. Arayan bakış ve malı inceleme ilgi gösterir.", "ar": "فُسِّر الأمر خطأً. النظرة الباحثة وفحص البضاعة يدلّان على الاهتمام."}, "Hingehen und euch ganz nah neben sie stellen, damit sie euch gut hört.": {"vi": "Đi đến và đứng sát ngay cạnh chị để chị nghe rõ.", "tr": "Yanına gidip tam yanına dikilmek, ki iyi duysun.", "ar": "الذهاب والوقوف قريبًا جدًا بجانبها كي تسمعكم جيدًا."}, "(weicht einen Schritt zurück)": {"vi": "(lùi lại một bước)", "tr": "(bir adım geri çekiliyor)", "ar": "(تتراجع خطوة)"}, "Richtig erkannt, aber zu nah: Unter 0,60 m ist Intimdistanz. Das verletzt die Privatsphäre.": {"vi": "Nhận ra đúng, nhưng quá gần: dưới 0,60 m là khoảng cách thân mật. Điều này xâm phạm không gian riêng tư.", "tr": "Doğru fark edildi, ama çok yakın: 0,60 m altı mahrem mesafedir. Bu özel alanı ihlal eder.", "ar": "تم التعرّف بشكل صحيح، لكن القرب مفرط: ما دون 0,60 م هو المسافة الحميمة. وهذا يخرق الخصوصية."}, "Hingehen: „Sie wollen jetzt sicher Hilfe!“": {"vi": "Đi đến: „Chắc giờ chị cần giúp rồi!“", "tr": "Yanına gitmek: „Şimdi kesinlikle yardım istiyorsunuz!“", "ar": "الذهاب إليها: «لا بد أنكِ تريدين المساعدة الآن!»"}, "Äh … ja, schon.": {"vi": "À … vâng, cũng được.", "tr": "Şey … evet, aslında.", "ar": "آه … نعم، في الواقع."}, "Signal richtig gelesen, aber kein Signal ist eindeutig. Vorsichtig deuten, nicht unterstellen.": {"vi": "Đọc đúng tín hiệu, nhưng không có tín hiệu nào là rõ ràng tuyệt đối. Hãy diễn giải thận trọng, đừng áp đặt.", "tr": "Sinyal doğru okundu, ama hiçbir sinyal kesin değildir. Dikkatli yorumla, varsayma.", "ar": "قُرئت الإشارة بشكل صحيح، لكن لا توجد إشارة قاطعة. فسّروا بحذر ولا تفترضوا."}, "Herr Brinkmann nimmt eine Sportuhr in die Hand.": {"vi": "Ông Brinkmann cầm một chiếc đồng hồ thể thao.", "tr": "Bay Brinkmann bir spor saati eline alıyor.", "ar": "يأخذ السيد Brinkmann ساعة رياضية بيده."}, "Nach zehn Sekunden fragt er: „Was kostet die denn?“": {"vi": "Sau mười giây ông hỏi: „Cái này giá bao nhiêu?“", "tr": "On saniye sonra soruyor: „Bu ne kadar?“", "ar": "بعد عشر ثوانٍ يسأل: «كم سعر هذه؟»"}, "Was antwortet ihr?": {"vi": "Các bạn trả lời gì?", "tr": "Ne cevap verirsiniz?", "ar": "بماذا تجيبون؟"}, "„Dazu komme ich gleich – vorher zeige ich Ihnen kurz, wie die Uhr Ihren Puls beim Laufen misst.“ Danach bald den Preis nennen.": {"vi": "„Tôi sẽ nói đến việc đó ngay – trước hết tôi xin cho ông xem đồng hồ đo nhịp tim khi chạy thế nào.“ Sau đó nêu giá sớm.", "tr": "„Buna birazdan geliyorum – önce saatin koşarken nabzınızı nasıl ölçtüğünü kısaca göstereyim.“ Sonra kısa süre içinde fiyatı söylemek.", "ar": "«سأصل إلى ذلك بعد قليل – قبل ذلك أُريك باختصار كيف تقيس الساعة نبضك أثناء الجري.» وبعد ذلك ذكر السعر قريبًا."}, "Na gut, zeigen Sie mal.": {"vi": "Được rồi, bạn cho xem đi.", "tr": "Peki, gösterin bakalım.", "ar": "حسنًا، أرني."}, "Verzögerungsmethode: Er fragt zu früh. Erst den Nutzen zeigen. Die Verzögerung darf nur kurz sein.": {"vi": "Phương pháp trì hoãn: ông hỏi quá sớm. Trước hết cho xem lợi ích. Việc trì hoãn chỉ được ngắn thôi.", "tr": "Geciktirme yöntemi: Müşteri çok erken soruyor. Önce faydayı göster. Gecikme kısa olmalı.", "ar": "طريقة التأجيل: هو يسأل مبكرًا جدًا. أظهروا المنفعة أولًا. ويجب أن يكون التأجيل قصيرًا."}, "„Das ist egal, die ist gut.“": {"vi": "„Không quan trọng, cái này tốt.“", "tr": "„Önemli değil, bu iyi.“", "ar": "«لا يهم، هذه جيدة.»"}, "Mir ist das nicht egal!": {"vi": "Với tôi thì quan trọng chứ!", "tr": "Benim için önemli!", "ar": "بالنسبة لي هذا مهم!"}, "Weicht aus und nimmt den Kunden nicht ernst.": {"vi": "Né tránh và không coi trọng khách.", "tr": "Geçiştiriyor ve müşteriyi ciddiye almıyor.", "ar": "تهرّب وعدم أخذ العميل على محمل الجد."}, "„199 Euro.“": {"vi": "„199 euro.“", "tr": "„199 Euro.“", "ar": "«199 يورو.»"}, "Oha.": {"vi": "Ồ.", "tr": "Vay be.", "ar": "أوه."}, "Ein nackter Preis ohne Nutzen. Gefahr von Preisschock.": {"vi": "Một mức giá trần trụi không có lợi ích. Có nguy cơ gây sốc giá.", "tr": "Faydasız çıplak bir fiyat. Fiyat şoku tehlikesi.", "ar": "سعر عارٍ بلا منفعة. خطر حدوث صدمة سعرية."}, "Gar nicht antworten und weiter erklären, bis er nicht mehr fragt.": {"vi": "Không trả lời và cứ giải thích tiếp cho đến khi ông không hỏi nữa.", "tr": "Hiç cevap vermeyip müşteri sormayı bırakana kadar anlatmaya devam etmek.", "ar": "عدم الإجابة ومواصلة الشرح إلى أن يتوقف عن السؤال."}, "Ich hatte nach dem Preis gefragt …": {"vi": "Tôi đã hỏi về giá mà …", "tr": "Ben fiyatı sormuştum …", "ar": "لقد سألت عن السعر …"}, "Die Verzögerung darf nicht lange dauern. Wer ausweicht, verliert Vertrauen.": {"vi": "Việc trì hoãn không được kéo dài. Ai né tránh sẽ mất lòng tin.", "tr": "Gecikme uzun sürmemeli. Kaçamak yapan güveni kaybeder.", "ar": "يجب ألا يطول التأجيل. من يتهرّب يفقد الثقة."}, "Er sagt: „Im Internet kostet die Uhr 30 Euro weniger.“": {"vi": "Ông nói: „Trên mạng chiếc đồng hồ này rẻ hơn 30 euro.“", "tr": "Diyor ki: „İnternette bu saat 30 Euro daha ucuz.“", "ar": "يقول: «على الإنترنت هذه الساعة أرخص بـ 30 يورو.»"}, "Wie reagiert ihr?": {"vi": "Các bạn phản ứng thế nào?", "tr": "Nasıl tepki verirsiniz?", "ar": "كيف تردّون؟"}, "„Sie haben recht, online ist der Preis niedriger. Dafür stellen wir Ihnen die Uhr hier direkt ein und tauschen sie bei einem Defekt sofort um.“": {"vi": "„Ông nói đúng, trên mạng giá thấp hơn. Bù lại, chúng tôi chỉnh đồng hồ cho ông ngay tại đây và đổi ngay nếu bị lỗi.“", "tr": "„Haklısınız, internette fiyat daha düşük. Buna karşılık saati burada hemen sizin için ayarlıyoruz ve arıza olursa hemen değiştiriyoruz.“", "ar": "«معك حق، السعر على الإنترنت أقل. في المقابل نضبط لك الساعة هنا مباشرة ونستبدلها فورًا إذا كان بها عطل.»"}, "Das Einstellen spart mir Zeit. Gut.": {"vi": "Được chỉnh sẵn đỡ tốn thời gian cho tôi. Hay đấy.", "tr": "Ayarlanması bana zaman kazandırır. İyi.", "ar": "ضبطها لي يوفّر عليّ الوقت. جيد."}, "Ja-Aber-Methode: erst zustimmen, dann den eigenen Nutzen dagegensetzen.": {"vi": "Phương pháp Vâng–Nhưng: trước hết đồng ý, rồi đưa lợi ích của mình ra đối lại.", "tr": "Evet-Ama yöntemi: önce onayla, sonra kendi faydanı karşısına koy.", "ar": "طريقة نعم–ولكن: أوافق أولًا ثم أضع منفعتي في المقابل."}, "„Das kann gar nicht sein.“": {"vi": "„Điều đó không thể có.“", "tr": "„Bu olamaz.“", "ar": "«هذا غير ممكن أبدًا.»"}, "Doch, ich habe es gesehen!": {"vi": "Có chứ, tôi đã thấy mà!", "tr": "Olur, ben gördüm!", "ar": "بل هو ممكن، لقد رأيته!"}, "Nie behaupten, das sei unmöglich. Erst nähere Angaben zum anderen Angebot erbitten.": {"vi": "Đừng bao giờ khẳng định điều đó là không thể. Trước hết hãy hỏi thêm chi tiết về ưu đãi kia.", "tr": "Asla bunun imkânsız olduğunu iddia etme. Önce diğer teklif hakkında ayrıntı iste.", "ar": "لا تدّعِ أبدًا أن ذلك مستحيل. اطلب أولًا تفاصيل أكثر عن العرض الآخر."}, "„Dann kaufen Sie sie doch im Internet.“": {"vi": "„Vậy ông cứ mua trên mạng đi.“", "tr": "„O zaman internetten alın.“", "ar": "«إذًا اشترِها من الإنترنت.»"}, "Mache ich auch.": {"vi": "Tôi cũng sẽ làm vậy.", "tr": "Zaten öyle yapacağım.", "ar": "وهذا ما سأفعله."}, "Eine Killerphrase. Der Kunde geht – und kommt nicht wieder.": {"vi": "Một câu nói sát thủ (Killerphrase). Khách bỏ đi – và không quay lại.", "tr": "Bir yıkıcı laf (Killerphrase). Müşteri gider – ve geri gelmez.", "ar": "عبارة قاتلة للحوار (Killerphrase). يغادر العميل – ولا يعود."}, "„Wo genau haben Sie das gesehen? Ist es dasselbe Modell?“ – und danach nichts mehr dazu sagen.": {"vi": "„Ông thấy ở đâu cụ thể ạ? Có phải cùng mẫu không?“ – và sau đó không nói thêm gì.", "tr": "„Tam olarak nerede gördünüz? Aynı model mi?“ – ve ardından bu konuda hiçbir şey söylememek.", "ar": "«أين رأيتها بالضبط؟ هل هو الموديل نفسه؟» – وبعد ذلك عدم قول شيء آخر."}, "Ja, dasselbe. Und jetzt?": {"vi": "Vâng, cùng mẫu. Vậy bây giờ thì sao?", "tr": "Evet, aynı. Peki şimdi ne olacak?", "ar": "نعم، الموديل نفسه. وماذا الآن؟"}, "Nachfragen ist der richtige erste Schritt. Aber danach fehlt das Gegenargument.": {"vi": "Hỏi thêm là bước đầu đúng. Nhưng sau đó thiếu lập luận phản bác.", "tr": "Sorup araştırmak doğru ilk adım. Ama ardından karşı argüman eksik.", "ar": "السؤال خطوة أولى صحيحة. لكن بعدها تنقص الحجّة المضادة."}, "Frau Kowalski sucht einen Schlafsack für ihren Sohn (6). Er soll warm sein, zwei bis drei Jahre passen und blau sein.": {"vi": "Bà Kowalski tìm túi ngủ cho con trai (6 tuổi). Túi phải ấm, vừa cho trẻ hai đến ba tuổi và màu xanh dương.", "tr": "Bayan Kowalski oğlu (6) için bir uyku tulumu arıyor. Sıcak olmalı, iki üç yıl yetmeli ve mavi olmalı.", "ar": "تبحث السيدة Kowalski عن كيس نوم لابنها (6 سنوات). يجب أن يكون دافئًا ويكفي لسنتين إلى ثلاث وأن يكون أزرق."}, "Im Regal liegen zehn Schlafsäcke, vom billigsten bis zum teuersten.": {"vi": "Trên kệ có mười chiếc túi ngủ, từ rẻ nhất đến đắt nhất.", "tr": "Rafta on uyku tulumu var, en ucuzdan en pahalıya.", "ar": "على الرف عشرة أكياس نوم، من الأرخص إلى الأغلى."}, "Wie legt ihr die Ware vor?": {"vi": "Các bạn trình bày hàng thế nào?", "tr": "Malı nasıl sunarsınız?", "ar": "كيف تعرضون البضاعة؟"}, "Drei passende Schlafsäcke in mittlerer Preislage hinlegen: „Fühlen Sie ruhig einmal, wie weich das Futter ist.“": {"vi": "Bày ra ba chiếc túi ngủ phù hợp ở tầm giá trung bình: „Chị cứ sờ thử xem lớp lót mềm thế nào.“", "tr": "Orta fiyat grubundan üç uygun uyku tulumunu koymak: „Astarın ne kadar yumuşak olduğunu bir hissedin.“", "ar": "وضع ثلاثة أكياس نوم مناسبة من فئة السعر المتوسطة: «جرّبي لمس البطانة وانظري كم هي ناعمة.»"}, "Oh, der blaue ist schön weich.": {"vi": "Ồ, cái màu xanh mềm quá.", "tr": "Oh, mavi olan çok yumuşak.", "ar": "أوه، الأزرق ناعم جدًا."}, "Faustregel: drei Artikel, mittlere Preislage, die Kundin einbeziehen (anfassen).": {"vi": "Quy tắc ngón tay cái: ba mặt hàng, tầm giá trung bình, cho khách tham gia (sờ thử).", "tr": "Temel kural: üç ürün, orta fiyat grubu, müşteriyi dahil et (dokundur).", "ar": "القاعدة العامة: ثلاث قطع، فئة السعر المتوسطة، وإشراك العميلة (بإتاحة اللمس)."}, "Alle zehn Schlafsäcke aus dem Regal holen.": {"vi": "Lấy cả mười chiếc túi ngủ từ kệ xuống.", "tr": "On uyku tulumunun hepsini raftan indirmek.", "ar": "إنزال أكياس النوم العشرة كلها عن الرف."}, "Oje, wo soll ich da anfangen?": {"vi": "Trời ơi, tôi biết bắt đầu từ đâu bây giờ?", "tr": "Eyvah, nereden başlayacağım?", "ar": "يا إلهي، من أين أبدأ؟"}, "Mehr als fünf Artikel verwirren die Kundin.": {"vi": "Hơn năm mặt hàng làm khách bối rối.", "tr": "Beşten fazla ürün müşteriyi şaşırtır.", "ar": "أكثر من خمس قطع تربك العميلة."}, "Nur den billigsten zeigen.": {"vi": "Chỉ cho xem cái rẻ nhất.", "tr": "Sadece en ucuzunu göstermek.", "ar": "عرض الأرخص فقط."}, "Haben Sie auch etwas Besseres?": {"vi": "Bạn có cái nào tốt hơn không?", "tr": "Daha iyisi yok mu?", "ar": "ألا يوجد لديكم شيء أفضل؟"}, "Keine Ausweichmöglichkeit nach unten. Die Kundin fühlt sich vielleicht falsch eingeschätzt.": {"vi": "Không có lối thoát xuống dưới. Khách có thể cảm thấy bị đánh giá sai.", "tr": "Aşağı yönde kaçış imkânı yok. Müşteri yanlış değerlendirildiğini hissedebilir.", "ar": "لا مجال للتراجع نحو الأسفل. وقد تشعر العميلة بأنها قُيِّمت خطأً."}, "Mit dem teuersten Daunenschlafsack anfangen, dann wirkt der Rest günstig.": {"vi": "Bắt đầu bằng túi ngủ lông vũ đắt nhất, như vậy những cái còn lại trông rẻ.", "tr": "En pahalı tüy uyku tulumuyla başlamak, böylece gerisi ucuz görünür.", "ar": "البدء بأغلى كيس نوم من الريش، فيبدو الباقي رخيصًا."}, "So viel wollte ich eigentlich nicht ausgeben …": {"vi": "Thật ra tôi không định chi nhiều như vậy …", "tr": "Aslında bu kadar harcamak istemiyordum …", "ar": "في الواقع لم أكن أريد أن أدفع هذا المبلغ …"}, "Keine Ausweichmöglichkeit nach oben, und die Kundin wird verschreckt („Apotheke“).": {"vi": "Không có lối thoát lên trên, và khách bị hoảng sợ (hiệu ứng „hiệu thuốc“ – giá đắt).", "tr": "Yukarı yönde kaçış imkânı yok ve müşteri ürküyor („eczane“ etkisi).", "ar": "لا مجال للتراجع نحو الأعلى، وتنفر العميلة («الصيدلية» – أسعار مرتفعة)."}, "Bevor ihr weitermacht, wollt ihr sicher sein, dass ihr alles richtig verstanden habt.": {"vi": "Trước khi tiếp tục, các bạn muốn chắc rằng mình đã hiểu đúng mọi thứ.", "tr": "Devam etmeden önce her şeyi doğru anladığınızdan emin olmak istiyorsunuz.", "ar": "قبل المتابعة تريدون التأكد من أنكم فهمتم كل شيء بشكل صحيح."}, "„Sie suchen für Ihren sechsjährigen Sohn einen warmen Schlafsack in Blau, der zwei bis drei Jahre passt. Trifft das zu?“": {"vi": "„Chị tìm cho cậu con trai sáu tuổi một chiếc túi ngủ ấm màu xanh dương, vừa cho hai đến ba năm. Có đúng vậy không ạ?“", "tr": "„Altı yaşındaki oğlunuz için sıcak, mavi, iki üç yıl yetecek bir uyku tulumu arıyorsunuz. Doğru mu?“", "ar": "«أنتِ تبحثين لابنك ذي الست سنوات عن كيس نوم دافئ أزرق يكفي لسنتين إلى ثلاث. هل هذا صحيح؟»"}, "Ja, ganz genau!": {"vi": "Vâng, chính xác!", "tr": "Evet, aynen öyle!", "ar": "نعم، بالضبط!"}, "Kontrollfrage: Sie fasst alles zusammen und lässt sich mit Ja beantworten.": {"vi": "Câu hỏi kiểm tra: tóm tắt mọi thứ và có thể trả lời bằng „Vâng“.", "tr": "Kontrol sorusu: Her şeyi özetler ve „Evet“ ile cevaplanabilir.", "ar": "سؤال المراجعة: يُلخّص كل شيء ويمكن الإجابة عنه بـ «نعم»."}, "„Sonst brauchen Sie nichts?“": {"vi": "„Vậy chị không cần gì nữa ạ?“", "tr": "„Başka bir şeye ihtiyacınız yok yani?“", "ar": "«إذًا لا تحتاجين إلى شيء آخر؟»"}, "Doch, einen Schlafsack …": {"vi": "Có chứ, một chiếc túi ngủ …", "tr": "Var tabii, bir uyku tulumu …", "ar": "بل أحتاج، كيس نوم …"}, "Negativ und geschlossen. Beendet das Gespräch.": {"vi": "Tiêu cực và đóng. Làm kết thúc cuộc trò chuyện.", "tr": "Olumsuz ve kapalı. Görüşmeyi bitirir.", "ar": "سلبي ومغلق. يُنهي المحادثة."}, "„Soll er blau sein?“": {"vi": "„Chị muốn màu xanh dương à?“", "tr": "„Mavi mi olsun?“", "ar": "«هل تريدينه أزرق؟»"}, "Hatte ich doch gesagt.": {"vi": "Tôi đã nói rồi mà.", "tr": "Ben söylemiştim ya.", "ar": "لقد قلت ذلك بالفعل."}, "Fragt nur einen Punkt ab. Eine Kontrollfrage fasst alles zusammen.": {"vi": "Chỉ hỏi lại một điểm. Câu hỏi kiểm tra thì tóm tắt tất cả.", "tr": "Sadece bir noktayı sorar. Kontrol sorusu her şeyi özetler.", "ar": "يسأل عن نقطة واحدة فقط. أما سؤال المراجعة فيُلخّص كل شيء."}, "„Sie wollen doch sicher den wärmsten?“": {"vi": "„Chắc chị muốn cái ấm nhất chứ?“", "tr": "„En sıcağını istersiniz herhalde?“", "ar": "«لا شك أنك تريدين الأدفأ؟»"}, "Hm, ich weiß nicht …": {"vi": "Hm, tôi không biết nữa …", "tr": "Hm, bilmiyorum …", "ar": "همم، لا أعرف …"}, "Suggestivfrage: Sie drängt in eine Richtung.": {"vi": "Câu hỏi gợi ý: nó đẩy khách về một hướng.", "tr": "Yönlendirici soru: Müşteriyi bir yöne iter.", "ar": "سؤال إيحائي: يدفع العميلة نحو اتجاه معيّن."}, "Herr Stolle, Stammkunde, etwa 70 Jahre, kommt herein. Er braucht Fahrradhandschuhe.": {"vi": "Ông Stolle, khách quen, khoảng 70 tuổi, bước vào. Ông cần găng tay đi xe đạp.", "tr": "Bay Stolle, müdavim müşteri, yaklaşık 70 yaşında, içeri giriyor. Bisiklet eldiveni lazım.", "ar": "يدخل السيد Stolle، زبون دائم عمره حوالي 70 عامًا. يحتاج إلى قفازات دراجة."}, "Eure Kollegin Mia ruft ihm entgegen: „Hallo! Was wollen Sie denn?“": {"vi": "Đồng nghiệp Mia của các bạn gọi vọng ra: „Này! Ông muốn gì?“", "tr": "Meslektaşınız Mia ona doğru sesleniyor: „Hallo! Ne istiyorsun?“", "ar": "تنادي زميلتكم Mia في وجهه: «هالو! ماذا تريد؟»"}, "Was war falsch?": {"vi": "Điều gì đã sai?", "tr": "Ne yanlıştı?", "ar": "ما الخطأ؟"}, "„Hallo“ passt nicht zu ihm, „Was wollen Sie denn?“ klingt abweisend, und sein Name fehlt.": {"vi": "„Hallo“ không hợp với ông, „Ông muốn gì?“ nghe như xua đuổi, và thiếu tên của ông.", "tr": "„Hallo“ ona uymuyor, „Ne istiyorsun?“ kabaca ve ters geliyor, üstelik adı yok.", "ar": "«هالو» لا تناسبه، و«ماذا تريد؟» تبدو طاردة، كما أن اسمه غائب."}, "(nickt euch zu)": {"vi": "(gật đầu chào các bạn)", "tr": "(size başıyla selam veriyor)", "ar": "(يومئ لكم برأسه)"}, "Die Grußformel hängt von Alter, Vertrautheit und Situation ab. Stammkunden begrüßt man mit Namen.": {"vi": "Lời chào phụ thuộc vào tuổi tác, mức độ quen biết và hoàn cảnh. Khách quen thì chào kèm tên.", "tr": "Selamlama yaşa, tanışıklığa ve duruma göre değişir. Müdavim müşterilere adıyla selam verilir.", "ar": "صيغة التحية تعتمد على العمر ومدى المعرفة والموقف. يُحيَّا الزبائن الدائمون بأسمائهم."}, "Nichts. Hauptsache, sie hat ihn begrüßt.": {"vi": "Không sai gì. Miễn là cô ấy đã chào ông.", "tr": "Hiçbir şey. Önemli olan onu selamlamış olması.", "ar": "لا شيء. المهم أنها حيّته."}, "(schaut irritiert)": {"vi": "(nhìn ngơ ngác)", "tr": "(şaşkın bakıyor)", "ar": "(ينظر باستغراب)"}, "Der erste Eindruck zählt und lässt sich kaum korrigieren.": {"vi": "Ấn tượng đầu tiên rất quan trọng và khó sửa lại.", "tr": "İlk izlenim önemlidir ve neredeyse düzeltilemez.", "ar": "الانطباع الأول مهم ويكاد لا يمكن تصحيحه."}, "Sie hätte lauter rufen sollen.": {"vi": "Cô ấy lẽ ra nên gọi to hơn.", "tr": "Daha yüksek sesle seslenmeliydi.", "ar": "كان عليها أن تنادي بصوت أعلى."}, "Ich höre noch ganz gut, danke.": {"vi": "Tôi vẫn nghe khá rõ, cảm ơn.", "tr": "Ben hâlâ gayet iyi duyuyorum, teşekkürler.", "ar": "ما زلت أسمع جيدًا، شكرًا."}, "Die Lautstärke ist nicht das Problem, sondern Grußformel und Ton.": {"vi": "Vấn đề không phải âm lượng mà là lời chào và giọng điệu.", "tr": "Sorun ses şiddeti değil, selamlama ve ton.", "ar": "المشكلة ليست علو الصوت، بل صيغة التحية والنبرة."}, "Nur der Name fehlt, sonst ist alles gut.": {"vi": "Chỉ thiếu tên, còn lại ổn cả.", "tr": "Sadece isim eksik, gerisi iyi.", "ar": "ينقص الاسم فقط، وكل شيء آخر جيد."}, "(zuckt mit den Schultern)": {"vi": "(nhún vai)", "tr": "(omuz silkiyor)", "ar": "(يهزّ كتفيه)"}, "Der Name fehlt – aber auch „Hallo“ und der abweisende Ton sind Fehler.": {"vi": "Thiếu tên – nhưng „Hallo“ và giọng xua đuổi cũng là lỗi.", "tr": "İsim eksik – ama „Hallo“ ve ters ton da hata.", "ar": "الاسم غائب – لكن «هالو» والنبرة الطاردة أيضًا خطآن."}, "Mia fragt euch: „Und wie hättet ihr es gesagt?“": {"vi": "Mia hỏi các bạn: „Còn các bạn sẽ nói thế nào?“", "tr": "Mia size soruyor: „Peki siz nasıl söylerdiniz?“", "ar": "تسألكم Mia: «وكيف كنتم ستقولونها أنتم؟»"}, "Euer Satz:": {"vi": "Câu của các bạn:", "tr": "Sizin cümleniz:", "ar": "جملتكم:"}, "„Kinder bitte draußen lassen.“": {"vi": "„Xin để trẻ con ở ngoài.“", "tr": "„Çocukları lütfen dışarıda bırakın.“", "ar": "„يرجى ترك الأطفال في الخارج.“"}, "„Weiß nicht.“": {"vi": "„Không biết.“", "tr": "„Bilmiyorum.“", "ar": "„لا أعرف.“"}, "„Sie können bei uns mit Karte zahlen.“": {"vi": "„Ở chỗ chúng tôi bà có thể trả bằng thẻ.“", "tr": "„Bizde kartla ödeyebilirsiniz.“", "ar": "„يمكنك الدفع عندنا بالبطاقة.“"}, "Frau Graf steht vor der Käsetheke.": {"vi": "Bà Graf đứng trước quầy phô mai.", "tr": "Bayan Graf peynir tezgâhının önünde duruyor.", "ar": "تقف السيدة غراف أمام منضدة الجبن."}, "Sie kann sich nicht zwischen zwei Bergkäsen entscheiden.": {"vi": "Bà không quyết định được giữa hai loại phô mai núi.", "tr": "İki dağ peyniri arasında karar veremiyor.", "ar": "لا تستطيع الاختيار بين نوعين من جبن الجبال."}, "Eine Kostprobe anbieten: „Probieren Sie gern beide. Der linke ist zwölf Monate gereift und schmeckt kräftig-nussig.“": {"vi": "Mời nếm thử: „Bà cứ nếm cả hai. Loại bên trái ủ mười hai tháng, vị đậm và béo như hạt.“", "tr": "Tadım ikram etmek: „İkisini de deneyin. Soldaki on iki ay olgunlaştırıldı, güçlü ve cevizimsi bir tadı var.“", "ar": "عرض تذوّق: „تذوّقي الاثنين بكل سرور. الأيسر نضج اثني عشر شهرًا وطعمه قوي بنكهة المكسرات.“"}, "„Nehmen Sie einfach den teureren.“": {"vi": "„Bà cứ lấy loại đắt hơn.“", "tr": "„Siz daha pahalı olanı alın.“", "ar": "„خذي الأغلى فقط.“"}, "Beide Käse genau beschreiben.": {"vi": "Mô tả chi tiết cả hai loại phô mai.", "tr": "İki peyniri de ayrıntılı tarif etmek.", "ar": "وصف الجبنتين بالتفصيل."}, "Sechs Sorten zum Probieren hinlegen.": {"vi": "Bày sáu loại ra cho nếm thử.", "tr": "Altı çeşidi tatmak için hazırlamak.", "ar": "وضع ست أنواع للتذوّق."}, "Sie nimmt 200 Gramm vom kräftigen Käse. Heute Abend kommen Gäste.": {"vi": "Bà lấy 200 gram phô mai vị đậm. Tối nay có khách.", "tr": "200 gram güçlü peynir alıyor. Bu akşam misafirler gelecek.", "ar": "تأخذ 200 غرام من الجبن القوي. سيأتي ضيوف هذا المساء."}, "Was bietet ihr an?": {"vi": "Các bạn đề nghị gì thêm?", "tr": "Ne önerirsiniz?", "ar": "ماذا تعرضون؟"}, "Noch beim Käse: „Zu diesem Käse passt unser Feigensenf – das ist eine schöne Kombination für Ihren Abend.“": {"vi": "Ngay tại quầy phô mai: „Mù tạt sung hợp với phô mai này – là sự kết hợp tuyệt vời cho buổi tối của bà.“", "tr": "Hâlâ peynirin yanındayken: „Bu peynire incirli hardalımız çok yakışır – akşamınız için güzel bir kombinasyon.“", "ar": "وأنتم ما زلتم عند الجبن: „يناسب هذه الجبنة خردل التين لدينا – إنه مزيج جميل لأمسيتك.“"}, "„Sonst noch was?“": {"vi": "„Còn gì nữa không ạ?“", "tr": "„Başka bir şey var mı?“", "ar": "„هل من شيء آخر؟“"}, "„Wir haben auch Senf.“": {"vi": "„Chúng tôi cũng có mù tạt.“", "tr": "„Hardalımız da var.“", "ar": "„لدينا خردل أيضًا.“"}, "„Das nehmen alle dazu.“": {"vi": "„Ai cũng lấy kèm món đó.“", "tr": "„Herkes bunu da alıyor.“", "ar": "„الجميع يأخذ هذا معها.“"}, "Herr Weber kommt zur Wursttheke.": {"vi": "Ông Weber đến quầy xúc xích.", "tr": "Bay Weber şarküteri tezgâhına geliyor.", "ar": "يأتي السيد فيبر إلى منضدة النقانق واللحوم."}, "Er sagt: „200 Gramm gekochten Schinken, bitte.“": {"vi": "Ông nói: „Cho tôi 200 gram giăm bông luộc.“", "tr": "Şöyle diyor: „200 gram haşlanmış jambon lütfen.“", "ar": "يقول: „200 غرام من لحم الخنزير المسلوق من فضلك.“"}, "„Gern. Lieber am Stück oder geschnitten?“": {"vi": "„Vâng. Ông muốn cả miếng hay thái lát ạ?“", "tr": "„Memnuniyetle. Bütün parça mı yoksa dilimlenmiş mi tercih edersiniz?“", "ar": "„بكل سرور. هل تفضّل قطعة كاملة أم شرائح؟“"}, "„Wofür brauchen Sie den Schinken? Für wie viele Personen?“": {"vi": "„Ông cần giăm bông để làm gì? Cho bao nhiêu người?“", "tr": "„Jambonu ne için istiyorsunuz? Kaç kişilik?“", "ar": "„لأي غرض تحتاج اللحم؟ ولكم شخص؟“"}, "Drei andere Schinken empfehlen.": {"vi": "Giới thiệu ba loại giăm bông khác.", "tr": "Üç başka jambon önermek.", "ar": "التوصية بثلاثة أنواع أخرى من اللحم."}, "„Möchten Sie nicht lieber den Parmaschinken?“": {"vi": "„Ông không thích giăm bông Parma hơn sao?“", "tr": "„Parma jambonunu tercih etmez misiniz?“", "ar": "„ألا تفضّل لحم بارما؟“"}, "Ihr habt aus Versehen 230 Gramm abgeschnitten.": {"vi": "Các bạn lỡ cắt mất 230 gram.", "tr": "Yanlışlıkla 230 gram kestiniz.", "ar": "قطعتم عن طريق الخطأ 230 غرامًا."}, "Wie sagt ihr es?": {"vi": "Các bạn nói thế nào?", "tr": "Bunu nasıl söylersiniz?", "ar": "كيف تقولون ذلك؟"}, "„Es sind 230 Gramm geworden – ist das recht so, oder soll ich etwas wegnehmen?“": {"vi": "„Thành 230 gram rồi – như vậy được không ạ, hay tôi bớt đi một ít?“", "tr": "„230 gram oldu – böyle uygun mu, yoksa biraz çıkarayım mı?“", "ar": "„أصبحت 230 غرامًا – هل هذا مناسب، أم أُنقص قليلًا؟“"}, "„Sind halt 230, Pech.“": {"vi": "„230 rồi, xui thôi.“", "tr": "„230 oldu, şanssızlık.“", "ar": "„صارت 230، سوء حظ.“"}, "„Das sind 230 Gramm.“": {"vi": "„Đây là 230 gram.“", "tr": "„Bu 230 gram.“", "ar": "„هذه 230 غرامًا.“"}, "„Ich hab mich verschnitten, das ist mir zu kompliziert.“": {"vi": "„Tôi cắt nhầm, rắc rối quá.“", "tr": "„Yanlış kestim, bu bana çok karmaşık.“", "ar": "„أخطأت في القطع، الأمر معقّد عليّ.“"}, "Frau Sander steht beim Kaffee.": {"vi": "Bà Sander đứng ở chỗ cà phê.", "tr": "Bayan Sander kahve reyonunda duruyor.", "ar": "تقف السيدة زاندر عند قسم القهوة."}, "Sie fragt: „Ist der Kaffee fair gehandelt? Und gibt es ihn in einer Nachfüllpackung?“": {"vi": "Bà hỏi: „Cà phê này có phải thương mại công bằng không? Và có gói nạp lại không?“", "tr": "Soruyor: „Bu kahve adil ticaretle mi alınıyor? Ve yedek paketi var mı?“", "ar": "تسأل: „هل هذه القهوة من التجارة العادلة؟ وهل تتوفر بعبوة تعبئة؟“"}, "„Ja, dieser Kaffee ist fair gehandelt, und die Nachfüllpackung spart Verpackungsmüll.“": {"vi": "„Vâng, cà phê này là thương mại công bằng, và gói nạp lại giúp giảm rác thải bao bì.“", "tr": "„Evet, bu kahve adil ticaretle alınıyor ve yedek paket ambalaj atığını azaltıyor.“", "ar": "„نعم، هذه القهوة من التجارة العادلة، وعبوة التعبئة توفّر نفايات التغليف.“"}, "„Mit dem Kaffee beeindrucken Sie Ihre Gäste.“": {"vi": "„Với cà phê này bà sẽ gây ấn tượng với khách.“", "tr": "„Bu kahveyle misafirlerinizi etkilersiniz.“", "ar": "„بهذه القهوة ستبهرين ضيوفك.“"}, "„Weiß ich nicht, aber er schmeckt gut.“": {"vi": "„Tôi không biết, nhưng nó ngon.“", "tr": "„Bilmiyorum ama lezzetli.“", "ar": "„لا أعرف، لكن طعمها جيد.“"}, "„Der ist ganz schnell gemacht.“": {"vi": "„Pha rất nhanh.“", "tr": "„Çok çabuk hazırlanır.“", "ar": "„تُحضَّر بسرعة كبيرة.“"}, "Sie sagt: „Ich vertrage Kaffee oft schlecht.“ Bei einem Kaffee werden den Bohnen vor dem Rösten mit heißem Dampf die Reiz- und Bitterstoffe entzogen.": {"vi": "Bà nói: „Tôi thường uống cà phê không hợp.“ Với loại cà phê này, hạt được xử lý bằng hơi nước nóng trước khi rang để loại bỏ chất kích thích và vị đắng.", "tr": "Şöyle diyor: „Kahveyi çoğu zaman iyi sindiremiyorum.“ Bu kahvede çekirdeklerden kavurma öncesi sıcak buharla tahriş edici ve acı maddeler alınıyor.", "ar": "تقول: „غالبًا لا تناسبني القهوة.“ في هذه القهوة تُزال من الحبوب قبل التحميص بالبخار الساخن المواد المهيّجة والمُرّة."}, "„Dieser Kaffee ist sehr bekömmlich, denn den Bohnen werden vor dem Rösten mit Dampf die Reiz- und Bitterstoffe entzogen. So können Sie Ihren Kaffee wieder genießen.“": {"vi": "„Cà phê này rất dễ tiêu, vì hạt được xử lý bằng hơi nước trước khi rang để loại bỏ chất kích thích và vị đắng. Như vậy bà lại có thể thưởng thức cà phê.“", "tr": "„Bu kahve çok sindirilebilir, çünkü çekirdeklerden kavurmadan önce buharla tahriş edici ve acı maddeler alınıyor. Böylece kahvenizin tadını yeniden çıkarabilirsiniz.“", "ar": "„هذه القهوة سهلة الهضم جدًا، لأن الحبوب تُعالج بالبخار قبل التحميص لإزالة المواد المهيّجة والمُرّة. وهكذا تستطيعين الاستمتاع بقهوتك من جديد.“"}, "„Dann trinken Sie halt Tee.“": {"vi": "„Vậy bà uống trà đi.“", "tr": "„O zaman çay için.“", "ar": "„إذن اشربي الشاي.“"}, "„Der ist dampfbehandelt.“": {"vi": "„Nó được xử lý bằng hơi nước.“", "tr": "„Buharla işlenmiş.“", "ar": "„إنها معالَجة بالبخار.“"}, "„Der ist nicht so schädlich für den Magen.“": {"vi": "„Nó không hại dạ dày lắm.“", "tr": "„Mideye o kadar zararlı değil.“", "ar": "„ليست ضارة جدًا بالمعدة.“"}, "Herr Pohl lässt einen Präsentkorb für seine Firma packen.": {"vi": "Ông Pohl nhờ gói một giỏ quà cho công ty.", "tr": "Bay Pohl şirketi için bir hediye sepeti hazırlatıyor.", "ar": "يطلب السيد بول تجهيز سلة هدايا لشركته."}, "Korb 12 Euro, Pralinen 24 Euro, Kaffee 14 Euro, Olivenöl 36 Euro, Lieferung 9 Euro. Zusammen 95 Euro. Er erschrickt über die Summe.": {"vi": "Giỏ 12 euro, sô cô la nhân 24 euro, cà phê 14 euro, dầu ô liu 36 euro, giao hàng 9 euro. Tổng cộng 95 euro. Ông giật mình vì tổng số.", "tr": "Sepet 12 Euro, pralin 24 Euro, kahve 14 Euro, zeytinyağı 36 Euro, teslimat 9 Euro. Toplam 95 Euro. Toplam tutara şaşırıyor.", "ar": "السلة 12 يورو، البرالين 24 يورو، القهوة 14 يورو، زيت الزيتون 36 يورو، التوصيل 9 يورو. المجموع 95 يورو. يفزع من المبلغ."}, "„Gern zeige ich Ihnen, wie sich der Betrag zusammensetzt: der Korb 12 Euro, die Pralinen 24 Euro …“ So sieht er jeden Teil.": {"vi": "„Tôi xin chỉ ông số tiền được tạo thành thế nào: giỏ 12 euro, sô cô la nhân 24 euro …“ Như vậy ông thấy từng phần.", "tr": "„Tutarın nasıl oluştuğunu size memnuniyetle göstereyim: sepet 12 Euro, pralinler 24 Euro …“ Böylece her kalemi görür.", "ar": "„يسعدني أن أوضح لك كيف يتكوّن المبلغ: السلة 12 يورو، البرالين 24 يورو …“ هكذا يرى كل جزء."}, "„Wer schenkt, muss eben zahlen.“": {"vi": "„Ai tặng quà thì phải trả tiền thôi.“", "tr": "„Hediye veren ödeyecek tabii.“", "ar": "„من يُهدي عليه أن يدفع.“"}, "„95 Euro, so ist das.“": {"vi": "„95 euro, là vậy đó.“", "tr": "„95 Euro, böyle işte.“", "ar": "„95 يورو، هكذا هو الأمر.“"}, "Die Lieferkosten weglassen und erst auf der Rechnung zeigen.": {"vi": "Bỏ phí giao hàng đi và chỉ hiện trên hóa đơn.", "tr": "Teslimat ücretini atlayıp ancak faturada göstermek.", "ar": "إغفال تكلفة التوصيل وإظهارها فقط في الفاتورة."}, "Er nickt. Ihr wollt jetzt zum Abschluss kommen.": {"vi": "Ông gật đầu. Các bạn muốn chốt đơn.", "tr": "Başını sallıyor. Şimdi satışı bağlamak istiyorsunuz.", "ar": "يومئ برأسه. تريدون الآن إتمام البيع."}, "Wie macht ihr das?": {"vi": "Các bạn làm thế nào?", "tr": "Bunu nasıl yaparsınız?", "ar": "كيف تفعلون ذلك؟"}, "„Sie wünschen sich einen Korb mit Süßem und Herzhaftem?“ – „Ja.“ – „Geliefert bis Freitag?“ – „Ja.“ – „Dann ist das genau der richtige Korb für Sie.“": {"vi": "„Ông muốn một giỏ có cả đồ ngọt và đồ mặn?“ – „Vâng.“ – „Giao trước thứ Sáu?“ – „Vâng.“ – „Vậy đây đúng là giỏ dành cho ông.“", "tr": "„Tatlı ve tuzlu içeren bir sepet istiyorsunuz?“ – „Evet.“ – „Cumaya kadar teslim?“ – „Evet.“ – „O zaman bu tam size göre sepet.“", "ar": "„تريد سلة فيها حلويات ومالح؟“ – „نعم.“ – „تُسلَّم قبل الجمعة؟“ – „نعم.“ – „إذن هذه هي السلة المناسبة لك تمامًا.“"}, "„Und jetzt? Kaufen oder nicht?“": {"vi": "„Vậy giờ sao? Mua hay không?“", "tr": "„Peki şimdi? Alıyor musunuz, almıyor musunuz?“", "ar": "„والآن؟ تشتري أم لا؟“"}, "Schweigend warten, bis er etwas sagt.": {"vi": "Im lặng chờ cho đến khi ông nói.", "tr": "Sessizce bir şey söylemesini beklemek.", "ar": "الانتظار بصمت حتى يقول شيئًا."}, "Zehn Ja-Fragen hintereinander, damit er am Ende nicht mehr Nein sagen kann.": {"vi": "Hỏi mười câu „vâng“ liên tiếp để cuối cùng ông không thể nói không.", "tr": "Sonunda hayır diyemesin diye art arda on evet sorusu sormak.", "ar": "طرح عشرة أسئلة „نعم“ متتالية حتى لا يستطيع في النهاية قول لا."}, "Frau Dietrich steht an der Salattheke.": {"vi": "Bà Dietrich đứng ở quầy salad.", "tr": "Bayan Dietrich salata tezgâhında duruyor.", "ar": "تقف السيدة ديتريش عند منضدة السلطات."}, "Sie zeigt auf die Theke: „Die Salate sehen nicht gerade frisch aus.“": {"vi": "Bà chỉ vào quầy: „Salad trông không tươi lắm.“", "tr": "Tezgâhı göstererek: „Salatalar pek taze görünmüyor.“", "ar": "تشير إلى المنضدة: „السلطات لا تبدو طازجة تمامًا.“"}, "„Danke für den Hinweis! Ich schaue sofort nach und hole Ihnen frischen Salat aus der Kühlung.“": {"vi": "„Cảm ơn bà đã nhắc! Tôi kiểm tra ngay và lấy salad tươi từ tủ lạnh cho bà.“", "tr": "„Uyarınız için teşekkürler! Hemen bakıp size soğutucudan taze salata getiriyorum.“", "ar": "„شكرًا على التنبيه! سأتحقق فورًا وأحضر لك سلطة طازجة من المبرّد.“"}, "„Die sehen doch gut aus.“": {"vi": "„Trông vẫn tốt mà.“", "tr": "„Gayet iyi görünüyorlar.“", "ar": "„تبدو جيدة.“"}, "„Die sind von heute früh.“": {"vi": "„Làm từ sáng nay.“", "tr": "„Bunlar bu sabahtan.“", "ar": "„هذه من صباح اليوم.“"}, "„Das ist ein Einwand gegen das Personal.“ Und weiter nichts.": {"vi": "„Đó là lời phản đối nhân viên.“ Và không gì thêm.", "tr": "„Bu personele karşı bir itiraz.“ Ve başka bir şey yok.", "ar": "„هذا اعتراض على الموظفين.“ ولا شيء آخر."}, "Sie sagt: „Früher hatten Sie hier viel mehr Sorten.“": {"vi": "Bà nói: „Trước đây ở đây có nhiều loại hơn nhiều.“", "tr": "Şöyle diyor: „Eskiden burada çok daha fazla çeşit vardı.“", "ar": "تقول: „في السابق كان لديكم أصناف أكثر بكثير.“"}, "„Sie haben recht, wir haben weniger Sorten. Dafür ist jede davon frisch und hausgemacht – probieren Sie gern unseren neuen Linsensalat.“": {"vi": "„Bà nói đúng, chúng tôi có ít loại hơn. Nhưng loại nào cũng tươi và tự làm – bà thử món salad đậu lăng mới của chúng tôi nhé.“", "tr": "„Haklısınız, daha az çeşidimiz var. Ama her biri taze ve ev yapımı – yeni mercimek salatamızı mutlaka deneyin.“", "ar": "„معك حق، أصنافنا أقل. لكن كل صنف طازج ومنزلي الصنع – جرّبي سلطة العدس الجديدة لدينا.“"}, "„Früher war alles besser, was?“": {"vi": "„Ngày xưa cái gì cũng tốt hơn, đúng không?“", "tr": "„Eskiden her şey daha iyiydi, ha?“", "ar": "„في الماضي كان كل شيء أفضل، أليس كذلك؟“"}, "„Das entscheidet der Chef.“": {"vi": "„Đó là do sếp quyết định.“", "tr": "„Bunu patron belirler.“", "ar": "„هذا يقرره المدير.“"}, "„Gerade deshalb haben wir weniger Sorten!“ – ohne Begründung.": {"vi": "„Chính vì vậy chúng tôi có ít loại hơn!“ – không có lý do.", "tr": "„Tam da bu yüzden daha az çeşidimiz var!“ – gerekçe vermeden.", "ar": "„لهذا السبب بالذات أصنافنا أقل!“ – دون تعليل."}, "Herr Roth hält eine Flasche Olivenöl in der Hand und liest das Etikett.": {"vi": "Ông Roth cầm một chai dầu ô liu và đọc nhãn.", "tr": "Bay Roth elinde bir şişe zeytinyağı tutuyor ve etiketi okuyor.", "ar": "يمسك السيد روت زجاجة زيت زيتون ويقرأ الملصق."}, "Er dreht die Flasche hin und her.": {"vi": "Ông xoay chai qua lại.", "tr": "Şişeyi çevirip duruyor.", "ar": "يقلّب الزجاجة يمينًا ويسارًا."}, "Wie sprecht ihr ihn an?": {"vi": "Các bạn tiếp cận ông thế nào?", "tr": "Ona nasıl hitap edersiniz?", "ar": "كيف تخاطبونه؟"}, "„Guten Tag. Das Öl, das Sie gerade anschauen, kommt aus einer kleinen Ölmühle auf Kreta. Wofür möchten Sie es verwenden?“": {"vi": "„Xin chào. Loại dầu ông đang xem đến từ một xưởng ép dầu nhỏ ở Crete. Ông định dùng nó để làm gì ạ?“", "tr": "„İyi günler. Şu an baktığınız yağ Girit'teki küçük bir yağ değirmeninden geliyor. Ne için kullanmak istersiniz?“", "ar": "„مرحبًا. الزيت الذي تنظر إليه الآن يأتي من معصرة صغيرة في جزيرة كريت. فيمَ تريد استخدامه؟“"}, "„Suchen Sie etwa
