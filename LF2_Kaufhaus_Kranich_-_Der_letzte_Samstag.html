s Bestimmtes?“": {"vi": "„Ông tìm món gì cụ thể không ạ?“", "tr": "„Belirli bir şey mi arıyorsunuz?“", "ar": "„هل تبحث عن شيء محدد؟“"}, "„Guten Tag, wie kann ich Ihnen helfen?“": {"vi": "„Xin chào, tôi có thể giúp gì cho ông?“", "tr": "„İyi günler, size nasıl yardımcı olabilirim?“", "ar": "„مرحبًا، كيف يمكنني مساعدتك؟“"}, "„Das Öl ist teuer, das wissen Sie, oder?“": {"vi": "„Dầu này đắt đấy, ông biết chứ?“", "tr": "„Bu yağ pahalı, biliyorsunuz değil mi?“", "ar": "„هذا الزيت غالٍ، أنت تعرف ذلك، أليس كذلك؟“"}, "Er will das Öl zum Braten nutzen. Ihr wollt wissen, ob er sehr heiß brät.": {"vi": "Ông muốn dùng dầu để chiên xào. Các bạn muốn biết ông có chiên ở nhiệt độ rất cao không.", "tr": "Yağı kızartmak için kullanmak istiyor. Çok yüksek ısıda mı kızarttığını öğrenmek istiyorsunuz.", "ar": "يريد استخدام الزيت للقلي. تريدون معرفة ما إذا كان يقلي على حرارة عالية جدًا."}, "Wie fragt ihr?": {"vi": "Các bạn hỏi thế nào?", "tr": "Nasıl sorarsınız?", "ar": "كيف تسألون؟"}, "„Ich frage das, weil manche Öle nicht so heiß werden sollten: Braten Sie oft scharf an?“": {"vi": "„Tôi hỏi vì có loại dầu không nên đun quá nóng: Ông có hay áp chảo lửa lớn không?“", "tr": "„Bunu soruyorum çünkü bazı yağlar çok ısıtılmamalı: Sık sık yüksek ateşte mi kızartırsınız?“", "ar": "„أسأل لأن بعض الزيوت لا ينبغي أن تسخن كثيرًا: هل تقلي غالبًا على نار قوية؟“"}, "„Sie braten doch sicher richtig, oder?“": {"vi": "„Chắc ông chiên đúng cách, phải không?“", "tr": "„Doğru düzgün kızartırsınız herhalde, değil mi?“", "ar": "„أنت تقلي بشكل صحيح بالتأكيد، أليس كذلك؟“"}, "„Braten Sie scharf an?“": {"vi": "„Ông có áp chảo lửa lớn không?“", "tr": "„Yüksek ateşte mi kızartırsınız?“", "ar": "„هل تقلي على نار قوية؟“"}, "„Wie Sie braten, ist ja Ihre Sache.“": {"vi": "„Ông chiên thế nào là việc của ông.“", "tr": "„Nasıl kızarttığınız sizin işiniz.“", "ar": "„كيف تقلي هو شأنك.“"}, "Herr Baumann fragt eure Kollegin Mia nach einem Tee.": {"vi": "Ông Baumann hỏi đồng nghiệp Mia của các bạn về trà.", "tr": "Bay Baumann meslektaşınız Mia'ya çay hakkında soruyor.", "ar": "يسأل السيد باومان زميلتكم ميا عن الشاي."}, "Mia sagt: „Das ist Fachwissen, das verstehen Sie nicht.“": {"vi": "Mia nói: „Đó là kiến thức chuyên môn, ông không hiểu đâu.“", "tr": "Mia şöyle diyor: „Bu uzmanlık bilgisi, siz anlamazsınız.“", "ar": "تقول ميا: „هذه معرفة تخصصية، لن تفهمها.“"}, "Welcher Gesprächsstörer ist das?": {"vi": "Đó là kiểu cản trở hội thoại nào?", "tr": "Bu hangi konuşma engelleyicisidir?", "ar": "أي معيق للحوار هذا؟"}, "Eine Killerphrase: abwertend und verletzend.": {"vi": "Một „cụm từ giết chết cuộc nói chuyện“: hạ thấp và gây tổn thương.", "tr": "Bir öldürücü ifade: aşağılayıcı ve incitici.", "ar": "عبارة قاتلة للحوار: تقلل من الشأن وتجرح."}, "Ein Gesprächsförderer.": {"vi": "Một yếu tố thúc đẩy hội thoại.", "tr": "Konuşmayı destekleyen bir unsur.", "ar": "عامل مشجّع للحوار."}, "Ein Überredungsversuch.": {"vi": "Một nỗ lực thuyết phục ép buộc.", "tr": "Bir ikna girişimi.", "ar": "محاولة إقناع بالإلحاح."}, "Erwartungen dämpfen.": {"vi": "Hạ thấp kỳ vọng.", "tr": "Beklentileri düşürmek.", "ar": "خفض التوقعات."}, "Danach sagt Mia: „Greifen Sie sofort zu!“ Der Kunde zögert.": {"vi": "Sau đó Mia nói: „Mua ngay đi!“ Khách do dự.", "tr": "Ardından Mia şöyle diyor: „Hemen alın!“ Müşteri tereddüt ediyor.", "ar": "بعد ذلك تقول ميا: „اشترِ فورًا!“ الزبون يتردد."}, "Was hättet ihr gesagt?": {"vi": "Các bạn sẽ nói gì?", "tr": "Siz ne söylerdiniz?", "ar": "ماذا كنتم ستقولون؟"}, "„Dieser Tee ist mild und beruhigend – möchten Sie einmal daran riechen?“": {"vi": "„Loại trà này dịu và thư giãn – ông có muốn ngửi thử không?“", "tr": "„Bu çay hafif ve sakinleştirici – bir koklamak ister misiniz?“", "ar": "„هذا الشاي لطيف ومهدّئ – هل تريد أن تشمّه؟“"}, "„Los, nehmen Sie ihn endlich!“": {"vi": "„Nào, mua đi chứ!“", "tr": "„Hadi, artık alın şunu!“", "ar": "„هيا، خذه أخيرًا!“"}, "„An Ihrer Stelle würde ich mit dem Kauf nicht warten.“": {"vi": "„Nếu là ông, tôi sẽ không chờ mua đâu.“", "tr": "„Yerinizde olsam satın almayı beklemezdim.“", "ar": "„لو كنت مكانك لما انتظرت في الشراء.“"}, "„Ich habe Ihnen doch schon gesagt, dass der gut ist.“": {"vi": "„Tôi đã nói với ông là nó tốt rồi mà.“", "tr": "„Size zaten iyi olduğunu söyledim.“", "ar": "„لقد قلت لك إنه جيد.“"}, "Frau Lehmann bleibt bei den Pralinen stehen.": {"vi": "Bà Lehmann dừng lại ở chỗ sô cô la nhân.", "tr": "Bayan Lehmann pralinlerin önünde duruyor.", "ar": "تتوقف السيدة ليمان عند البرالين."}, "Die Pralinen sind diese Woche von 19,90 auf 12,90 Euro reduziert.": {"vi": "Tuần này sô cô la nhân giảm từ 19,90 xuống 12,90 euro.", "tr": "Pralinler bu hafta 19,90 Euro'dan 12,90 Euro'ya indirildi.", "ar": "خُفّض سعر البرالين هذا الأسبوع من 19,90 إلى 12,90 يورو."}, "Wie sprecht ihr den Preis an?": {"vi": "Các bạn nói về giá thế nào?", "tr": "Fiyattan nasıl bahsedersiniz?", "ar": "كيف تذكرون السعر؟"}, "„Diese Pralinen sind diese Woche von 19,90 auf 12,90 Euro herabgesetzt – unser Aktionspreis.“": {"vi": "„Tuần này sô cô la nhân giảm từ 19,90 xuống 12,90 euro – giá khuyến mãi của chúng tôi.“", "tr": "„Bu pralinler bu hafta 19,90 Euro'dan 12,90 Euro'ya indirildi – kampanya fiyatımız.“", "ar": "„هذا البرالين خُفّض هذا الأسبوع من 19,90 إلى 12,90 يورو – سعر العرض لدينا.“"}, "Den Preis verschweigen, bis sie fragt.": {"vi": "Giấu giá cho đến khi bà hỏi.", "tr": "Fiyatı o sorana kadar söylememek.", "ar": "إخفاء السعر حتى تسأل."}, "Erst lange über Kakaobohnen reden, dann den Preis nennen.": {"vi": "Nói dài về hạt ca cao, rồi mới nói giá.", "tr": "Önce uzun uzun kakao çekirdeklerinden bahsedip sonra fiyatı söylemek.", "ar": "التحدث طويلًا عن حبوب الكاكاو ثم ذكر السعر."}, "„Die sind bloß so billig, weil sie bald ablaufen.“": {"vi": "„Chúng rẻ chỉ vì sắp hết hạn.“", "tr": "„Sadece yakında son kullanma tarihi dolacağı için ucuz.“", "ar": "„هي رخيصة فقط لأنها ستنتهي صلاحيتها قريبًا.“"}, "Sie nimmt drei Schachteln und zögert: „Hoffentlich mag meine Schwester die.“": {"vi": "Bà lấy ba hộp và do dự: „Mong là em gái tôi thích.“", "tr": "Üç kutu alıyor ve tereddüt ediyor: „Umarım kız kardeşim beğenir.“", "ar": "تأخذ ثلاث علب وتتردد: „آمل أن تعجب أختي.“"}, "„Das ist eine gute Wahl: Die Mischung hat für jeden Geschmack etwas – Vollmilch, Zartbitter und Nougat.“": {"vi": "„Bà chọn rất tốt: hỗn hợp này có đủ cho mọi khẩu vị – sữa, đen và nougat.“", "tr": "„İyi bir seçim: Karışımda her damak için bir şey var – sütlü, bitter ve nuga.“", "ar": "„اختيار جيد: في هذا الخليط شيء لكل ذوق – حليب وداكن ونوغة.“"}, "„Keine Ahnung, ist ja Ihre Schwester.“": {"vi": "„Không biết, đó là em gái bà mà.“", "tr": "„Hiçbir fikrim yok, sizin kız kardeşiniz.“", "ar": "„لا فكرة لدي، إنها أختك.“"}, "„Bestimmt.“": {"vi": "„Chắc chắn rồi.“", "tr": "„Kesinlikle.“", "ar": "„بالتأكيد.“"}, "„Wenn nicht, essen Sie sie eben selbst.“": {"vi": "„Nếu không thích thì bà tự ăn.“", "tr": "„Beğenmezse kendiniz yersiniz.“", "ar": "„إن لم تعجبها فكليها أنتِ.“"}, "Im Feinkostregal ist Selbstbedienung. Herr Jung läuft zum dritten Mal am Teeregal vorbei.": {"vi": "Ở kệ đồ ăn cao cấp là tự phục vụ. Ông Jung đi qua kệ trà lần thứ ba.", "tr": "Şarküteri rafında self-servis var. Bay Jung çay rafının önünden üçüncü kez geçiyor.", "ar": "في رف الأطعمة الفاخرة خدمة ذاتية. يمر السيد يونغ بجانب رف الشاي للمرة الثالثة."}, "Er kratzt sich am Kopf und macht ein ratloses Gesicht.": {"vi": "Ông gãi đầu và có vẻ bối rối.", "tr": "Başını kaşıyor ve şaşkın bir yüz ifadesi var.", "ar": "يحك رأسه ويبدو حائرًا."}, "Hingehen: „Guten Tag! Ich sehe, Sie suchen etwas – wobei darf ich Ihnen helfen?“": {"vi": "Đến gần: „Xin chào! Tôi thấy ông đang tìm gì đó – tôi giúp ông việc gì ạ?“", "tr": "Yanına gitmek: „İyi günler! Bir şey aradığınızı görüyorum – size nasıl yardımcı olabilirim?“", "ar": "الذهاب إليه: „مرحبًا! أرى أنك تبحث عن شيء – بماذا يمكنني مساعدتك؟“"}, "Nichts – in der Selbstbedienung muss er allein klarkommen.": {"vi": "Không gì – ở khu tự phục vụ ông phải tự lo.", "tr": "Hiçbir şey – self-servis bölümünde kendi başının çaresine bakmalı.", "ar": "لا شيء – في الخدمة الذاتية عليه أن يتدبّر أمره بنفسه."}, "Von weitem rufen: „Tee ist ganz links!“": {"vi": "Gọi từ xa: „Trà ở ngoài cùng bên trái!“", "tr": "Uzaktan seslenmek: „Çay en solda!“", "ar": "النداء من بعيد: „الشاي في أقصى اليسار!“"}, "„Kann ich Ihnen helfen?“": {"vi": "„Tôi có thể giúp ông không?“", "tr": "„Yardımcı olabilir miyim?“", "ar": "„هل يمكنني مساعدتك؟“"}, "Er fragt: „Warum gibt es den losen Tee nur an der Theke, die Teebeutel aber im Regal?“": {"vi": "Ông hỏi: „Sao trà rời chỉ có ở quầy, còn trà túi lọc thì ở kệ?“", "tr": "Soruyor: „Neden dökme çay sadece tezgâhta, poşet çaylar ise rafta?“", "ar": "يسأل: „لماذا الشاي السائب فقط عند المنضدة بينما أكياس الشاي على الرف؟“"}, "„Losen Tee wiegen wir für Sie frisch ab, und ich berate Sie zu den Sorten. Die Teebeutel sind fertig verpackt, die nehmen Sie selbst.“": {"vi": "„Trà rời chúng tôi cân tươi cho ông và tư vấn về các loại. Trà túi lọc đã đóng gói sẵn nên ông tự lấy.“", "tr": "„Dökme çayı sizin için taze tartıyoruz ve çeşitler konusunda danışmanlık yapıyorum. Poşet çaylar hazır ambalajlı, onları kendiniz alırsınız.“", "ar": "„الشاي السائب نزنه لك طازجًا وأنصحك بشأن الأنواع. أما أكياس الشاي فهي معبأة جاهزة، تأخذها بنفسك.“"}, "„Damit wir mehr zu tun haben.“": {"vi": "„Để chúng tôi có nhiều việc hơn.“", "tr": "„Bizim daha çok işimiz olsun diye.“", "ar": "„حتى يكون لدينا عمل أكثر.“"}, "„Weil der lose teurer ist.“": {"vi": "„Vì trà rời đắt hơn.“", "tr": "„Çünkü dökme olan daha pahalı.“", "ar": "„لأن السائب أغلى.“"}, "„An der Theke ist Vorwahl.“": {"vi": "„Ở quầy là chọn trước.“", "tr": "„Tezgâhta ön seçim var.“", "ar": "„عند المنضدة هناك اختيار مسبق.“"}, "Herr Kaiser kommt sehr verärgert zur Käsetheke.": {"vi": "Ông Kaiser đến quầy phô mai, rất bực bội.", "tr": "Bay Kaiser çok sinirli bir şekilde peynir tezgâhına geliyor.", "ar": "يأتي السيد كايزر إلى منضدة الجبن غاضبًا جدًا."}, "Er ruft: „Der Käse von gestern war innen schon schimmelig! Unglaublich!“": {"vi": "Ông kêu lên: „Phô mai hôm qua bên trong đã mốc rồi! Không thể tin được!“", "tr": "Bağırıyor: „Dünkü peynir içten küflenmişti! İnanılmaz!“", "ar": "يصيح: „جبن الأمس كان متعفنًا من الداخل! لا يُصدَّق!“"}, "„Das tut mir leid. Das ärgert Sie, das verstehe ich. Zeigen Sie mir bitte den Käse – dann finden wir sofort eine Lösung.“": {"vi": "„Tôi rất tiếc. Ông bực mình, tôi hiểu. Xin ông cho tôi xem miếng phô mai – rồi chúng ta sẽ tìm giải pháp ngay.“", "tr": "„Üzgünüm. Sinirlenmenizi anlıyorum. Lütfen peyniri bana gösterin – hemen bir çözüm bulalım.“", "ar": "„أنا آسف. أفهم أن هذا يزعجك. أرني الجبن من فضلك – وسنجد حلًا فورًا.“"}, "„Bei uns ist nie etwas schimmelig.“": {"vi": "„Ở chỗ chúng tôi không bao giờ có cái gì bị mốc.“", "tr": "„Bizde asla bir şey küflenmez.“", "ar": "„عندنا لا يتعفن شيء أبدًا.“"}, "„Wenden Sie sich an die Abteilungsleitung.“": {"vi": "„Ông hãy liên hệ trưởng bộ phận.“", "tr": "„Bölüm müdürüne başvurun.“", "ar": "„توجّه إلى رئيس القسم.“"}, "„Das kommt vor, Käse ist ein Naturprodukt.“": {"vi": "„Chuyện đó có xảy ra, phô mai là sản phẩm tự nhiên.“", "tr": "„Bu olur, peynir doğal bir üründür.“", "ar": "„هذا يحدث، فالجبن منتج طبيعي.“"}, "Er bekommt frischen Käse und geht zufrieden. Eure Kollegin fragt: „Warum sollten wir über so eine Beschwerde eigentlich froh sein?“": {"vi": "Ông nhận được phô mai tươi và ra về hài lòng. Đồng nghiệp của các bạn hỏi: „Tại sao chúng ta lại nên vui với một lời phàn nàn như vậy?“", "tr": "Taze peynir alıyor ve memnun gidiyor. Meslektaşınız soruyor: „Böyle bir şikâyete neden sevinmeliyiz ki?“", "ar": "يحصل على جبن طازج ويغادر راضيًا. تسأل زميلتكم: „لماذا ينبغي أن نفرح بمثل هذه الشكوى أصلًا؟“"}, "Weil der Betrieb den Fehler so erfährt und beheben kann. Wer sich nicht beschwert, kommt einfach nicht wieder.": {"vi": "Vì nhờ đó doanh nghiệp biết lỗi và sửa được. Ai không phàn nàn thì đơn giản là không quay lại.", "tr": "Çünkü işletme hatayı böylece öğrenir ve giderebilir. Şikâyet etmeyen müşteri basitçe bir daha gelmez.", "ar": "لأن المتجر يعرف الخطأ بهذه الطريقة ويستطيع إصلاحه. من لا يشتكي ببساطة لا يعود."}, "Gar nicht. Beschwerden sind nur Ärger.": {"vi": "Không hề. Phàn nàn chỉ là phiền phức.", "tr": "Hiç. Şikâyetler sadece sinir bozar.", "ar": "أبدًا. الشكاوى مجرد إزعاج."}, "Weil der Kunde dann gratis Käse bekommt.": {"vi": "Vì khi đó khách được phô mai miễn phí.", "tr": "Çünkü müşteri o zaman bedava peynir alır.", "ar": "لأن الزبون يحصل حينها على جبن مجانًا."}, "Weil man den Kunden dann belehren kann.": {"vi": "Vì khi đó có thể giáo huấn khách.", "tr": "Çünkü müşteriye ders verilebilir.", "ar": "لأنه يمكن حينها تلقين الزبون درسًا."}, "Zwei Kunden auf einmal": {"vi": "Hai khách cùng lúc", "tr": "Aynı anda iki müşteri", "ar": "زبونان في وقت واحد"}, "Ihr berät gerade. Eine zweite Kundin wartet schon und schaut ungeduldig zu euch.": {"vi": "Các bạn đang tư vấn. Một khách nữ thứ hai đã đợi sẵn và sốt ruột nhìn các bạn.", "tr": "Danışmanlık yapıyorsunuz. İkinci bir müşteri zaten bekliyor ve sabırsızca size bakıyor.", "ar": "أنتم تقدمون استشارة. زبونة ثانية تنتظر بالفعل وتنظر إليكم بنفاد صبر."}, "Kurz Blickkontakt zur Wartenden: „Ich bin gleich für Sie da.“ Dann die Beratung zu Ende bringen.": {"vi": "Nhìn nhanh vào người đang chờ: „Tôi sẽ đến với bà ngay.“ Rồi hoàn tất buổi tư vấn.", "tr": "Bekleyene kısa bir göz teması: „Hemen sizinle ilgileneceğim.“ Sonra danışmanlığı bitirmek.", "ar": "نظرة سريعة إلى المنتظِرة: „سأكون معك حالًا.“ ثم إنهاء الاستشارة."}, "(Die Wartende nickt und bleibt.)": {"vi": "(Người đang chờ gật đầu và ở lại.)", "tr": "(Bekleyen başını sallıyor ve kalıyor.)", "ar": "(تومئ المنتظِرة برأسها وتبقى.)"}, "Sie nicht beachten, bis ihr fertig seid.": {"vi": "Không để ý đến bà cho đến khi xong.", "tr": "Siz bitirene kadar onu dikkate almamak.", "ar": "تجاهلها حتى تنتهوا."}, "(Die Wartende geht.)": {"vi": "(Người đang chờ bỏ đi.)", "tr": "(Bekleyen gidiyor.)", "ar": "(تغادر المنتظِرة.)"}, "Kunden fühlen sich schnell zurückgesetzt, wenn man sie warten lässt, ohne sie wahrzunehmen.": {"vi": "Khách rất dễ cảm thấy bị coi nhẹ nếu phải chờ mà không được ai để ý.", "tr": "Müşteriler fark edilmeden bekletildiklerinde kendilerini hemen ikinci planda hisseder.", "ar": "يشعر الزبائن بسرعة بأنهم مهمَّشون عندما يُتركون ينتظرون دون أن يلاحظهم أحد."}, "Den ersten Kunden mitten im Satz stehen lassen und zur Wartenden gehen.": {"vi": "Bỏ dở khách đầu tiên giữa câu và đi sang người đang chờ.", "tr": "İlk müşteriyi cümlenin ortasında bırakıp bekleyene gitmek.", "ar": "ترك الزبون الأول في منتصف الجملة والذهاب إلى المنتظِرة."}, "(Der erste Kunde ist verärgert.)": {"vi": "(Khách đầu tiên bực mình.)", "tr": "(İlk müşteri sinirleniyor.)", "ar": "(الزبون الأول منزعج.)"}, "Jetzt fühlt sich der erste Kunde zurückgesetzt.": {"vi": "Bây giờ khách đầu tiên cảm thấy bị coi nhẹ.", "tr": "Şimdi ilk müşteri kendini ikinci planda hissediyor.", "ar": "الآن يشعر الزبون الأول بأنه مهمَّش."}, "Die Kollegin sagt Nein": {"vi": "Đồng nghiệp nói không", "tr": "Meslektaş hayır diyor", "ar": "الزميلة تقول لا"}, "Eine Kundin fragt eure Kollegin nach Schnürsenkeln in Neongrün. Die Kollegin sagt nur: „Führen wir nicht.“ und dreht sich weg.": {"vi": "Một khách nữ hỏi đồng nghiệp của các bạn về dây giày màu xanh lá neon. Đồng nghiệp chỉ nói: „Chúng tôi không bán.“ rồi quay đi.", "tr": "Bir müşteri meslektaşınıza neon yeşili ayakkabı bağcığı soruyor. Meslektaş sadece „Bizde yok.“ deyip arkasını dönüyor.", "ar": "تسأل زبونة زميلتكم عن رباط حذاء أخضر فسفوري. تقول الزميلة فقط: „لا نبيع هذا.“ وتدير ظهرها."}, "Ihr springt ein. Was sagt ihr?": {"vi": "Các bạn vào thay. Các bạn nói gì?", "tr": "Siz devreye giriyorsunuz. Ne söylersiniz?", "ar": "تتدخلون. ماذا تقولون؟"}, "„Gerne zeige ich Ihnen, was wir stattdessen für Sie haben.“": {"vi": "„Tôi xin giới thiệu những gì chúng tôi có thay thế cho bà.“", "tr": "„Size bunun yerine neler sunabileceğimizi memnuniyetle göstereyim.“", "ar": "„يسعدني أن أريك ما لدينا بدلًا من ذلك.“"}, "(Die Kundin lächelt.)": {"vi": "(Khách mỉm cười.)", "tr": "(Müşteri gülümsüyor.)", "ar": "(تبتسم الزبونة.)"}, "Nach einer Absage kommt immer ein Angebot.": {"vi": "Sau khi từ chối luôn phải đưa ra một đề xuất.", "tr": "Bir reddin ardından her zaman bir teklif gelir.", "ar": "بعد الرفض يأتي دائمًا عرض بديل."}, "„Ja, haben wir echt nicht.“": {"vi": "„Vâng, thật sự chúng tôi không có.“", "tr": "„Evet, gerçekten yok.“", "ar": "„نعم، فعلًا ليس لدينا.“"}, "(Die Kundin geht.)": {"vi": "(Khách bỏ đi.)", "tr": "(Müşteri gidiyor.)", "ar": "(تغادر الزبونة.)"}, "Bestätigt nur die Absage.": {"vi": "Chỉ xác nhận lời từ chối.", "tr": "Sadece reddi doğrular.", "ar": "يؤكد الرفض فقط."}, "„Vielleicht nächstes Jahr.“": {"vi": "„Có lẽ năm sau.“", "tr": "„Belki seneye.“", "ar": "„ربما في العام القادم.“"}, "(Die Kundin zuckt mit den Schultern.)": {"vi": "(Khách nhún vai.)", "tr": "(Müşteri omuz silkiyor.)", "ar": "(تهزّ الزبونة كتفيها.)"}, "Kein Angebot für jetzt.": {"vi": "Không có đề xuất nào cho hiện tại.", "tr": "Şimdilik hiçbir teklif yok.", "ar": "لا يوجد عرض للوقت الحالي."}, "Eine müde Kundin": {"vi": "Một khách nữ mệt mỏi", "tr": "Yorgun bir müşteri", "ar": "زبونة متعبة"}, "Eine ältere Kundin wirkt erschöpft. Sie muss auf ihren Mann warten, der noch in der Umkleide ist.": {"vi": "Một khách nữ lớn tuổi trông kiệt sức. Bà phải chờ chồng vẫn đang trong phòng thử đồ.", "tr": "Yaşlı bir müşteri bitkin görünüyor. Hâlâ soyunma kabininde olan kocasını beklemek zorunda.", "ar": "تبدو زبونة مسنّة منهكة. عليها أن تنتظر زوجها الذي لا يزال في غرفة القياس."}, "Ihr eine Sitzgelegenheit und ein Glas Wasser anbieten.": {"vi": "Mời bà một chỗ ngồi và một ly nước.", "tr": "Ona bir oturacak yer ve bir bardak su ikram etmek.", "ar": "عرض مقعد وكأس ماء عليها."}, "Oh, wie aufmerksam!": {"vi": "Ôi, chu đáo quá!", "tr": "Ah, ne kadar ince düşünceli!", "ar": "يا له من اهتمام لطيف!"}, "Älteren Kunden eine Sitzgelegenheit und eine Erfrischung anbieten – sie sollen sich willkommen fühlen.": {"vi": "Mời khách lớn tuổi chỗ ngồi và đồ uống giải khát – để họ cảm thấy được chào đón.", "tr": "Yaşlı müşterilere oturacak yer ve içecek ikram etmek – kendilerini hoş karşılanmış hissetmeleri için.", "ar": "عرض مقعد ومشروب منعش على الزبائن المسنّين – ليشعروا بأنهم موضع ترحيب."}, "„Hier ist kein Wartezimmer.“": {"vi": "„Ở đây không phải phòng chờ.“", "tr": "„Burası bekleme odası değil.“", "ar": "„هذه ليست غرفة انتظار.“"}, "Ihr sagen, wo das Café ist.": {"vi": "Chỉ cho bà quán cà phê ở đâu.", "tr": "Ona kafenin nerede olduğunu söylemek.", "ar": "إخبارها بمكان المقهى."}, "So weit möchte ich nicht laufen.": {"vi": "Tôi không muốn đi xa như vậy.", "tr": "O kadar uzağa yürümek istemem.", "ar": "لا أريد المشي إلى هذا الحد."}, "Freundlich, aber sie bleibt nicht im Geschäft.": {"vi": "Thân thiện, nhưng bà không ở lại cửa hàng.", "tr": "Kibar, ama müşteri mağazada kalmıyor.", "ar": "لطيف، لكنها لن تبقى في المتجر."}, "Wo ist denn hier mal jemand?": {"vi": "Ở đây có ai không vậy?", "tr": "Burada hiç kimse yok mu?", "ar": "أليس هنا أحد؟"}, "Ein Kunde ruft durch die Abteilung: „Ich warte hier schon zehn Minuten!“": {"vi": "Một khách hàng gọi vang khắp khu: „Tôi chờ ở đây mười phút rồi!“", "tr": "Bir müşteri bölümde bağırıyor: „Burada on dakikadır bekliyorum!“", "ar": "ينادي زبون في أرجاء القسم: „أنا أنتظر هنا منذ عشر دقائق!“"}, "Hingehen: „Das tut mir leid, dass Sie warten mussten. Jetzt nehme ich mir Zeit für Sie.“": {"vi": "Đến gần: „Tôi xin lỗi vì ông phải chờ. Bây giờ tôi dành thời gian cho ông.“", "tr": "Yanına gitmek: „Beklemek zorunda kaldığınız için üzgünüm. Şimdi size zaman ayırıyorum.“", "ar": "الذهاب إليه: „أعتذر لأنك اضطررت للانتظار. الآن سأخصص لك وقتي.“"}, "Na gut. Danke.": {"vi": "Thôi được. Cảm ơn.", "tr": "Pekâlâ. Teşekkürler.", "ar": "حسنًا. شكرًا."}, "Ein berechtigter Einwand gegen das Personal: ernst nehmen und Zeit geben.": {"vi": "Một lời phản đối chính đáng đối với nhân viên: hãy coi trọng và dành thời gian cho khách.", "tr": "Personele karşı haklı bir itiraz: ciddiye almak ve zaman ayırmak.", "ar": "اعتراض مُحق على الموظفين: خذوه على محمل الجد وامنحوه وقتًا."}, "„Schreien Sie nicht so.“": {"vi": "„Đừng la lên như thế.“", "tr": "„Bu kadar bağırmayın.“", "ar": "„لا تصرخ هكذا.“"}, "Jetzt reicht es!": {"vi": "Đủ rồi đấy!", "tr": "Yeter artık!", "ar": "هذا يكفي!"}, "Ein Befehl – der Konflikt wird größer.": {"vi": "Một mệnh lệnh – xung đột càng lớn hơn.", "tr": "Bir emir – çatışma büyüyor.", "ar": "أمر – والنزاع يكبر."}, "Von weitem zurückrufen: „Komme gleich!“": {"vi": "Gọi vọng lại từ xa: „Tôi đến ngay!“", "tr": "Uzaktan seslenmek: „Hemen geliyorum!“", "ar": "الرد من بعيد: „قادم حالًا!“"}, "(wartet weiter, genervt)": {"vi": "(tiếp tục chờ, bực bội)", "tr": "(beklemeye devam ediyor, sinirli)", "ar": "(يواصل الانتظار منزعجًا)"}, "Er wurde wahrgenommen, aber ohne Blickkontakt und ohne Entschuldigung.": {"vi": "Ông được để ý, nhưng không có giao tiếp bằng mắt và không có lời xin lỗi.", "tr": "Fark edildi, ama göz teması ve özür olmadan.", "ar": "لاحظتموه، لكن دون تواصل بصري ودون اعتذار."}, "Das Kartengerät streikt": {"vi": "Máy quẹt thẻ hỏng", "tr": "Kart cihazı bozuldu", "ar": "جهاز البطاقات معطّل"}, "Das Kartenlesegerät an eurer Kasse ist kaputt. Eine Kundin will mit Karte zahlen.": {"vi": "Máy đọc thẻ ở quầy của các bạn bị hỏng. Một khách nữ muốn trả bằng thẻ.", "tr": "Kasanızdaki kart okuyucu bozuk. Bir müşteri kartla ödemek istiyor.", "ar": "جهاز قراءة البطاقات عند صندوقكم معطّل. تريد زبونة الدفع بالبطاقة."}, "„Das tut mir leid. Die Kasse im Erdgeschoss funktioniert – ich begleite Sie hin.“": {"vi": "„Tôi xin lỗi. Quầy ở tầng trệt dùng được – tôi dẫn bà đến đó.“", "tr": "„Üzgünüm. Zemin kattaki kasa çalışıyor – sizi oraya götüreyim.“", "ar": "„أعتذر. الصندوق في الطابق الأرضي يعمل – سأرافقك إليه.“"}, "Sehr freundlich, danke.": {"vi": "Rất thân thiện, cảm ơn.", "tr": "Çok nazik, teşekkürler.", "ar": "لطيف جدًا، شكرًا."}, "Girocard-Zahlung ist eine Zahlungserleichterung. Fällt sie aus, bietet man eine Lösung an.": {"vi": "Thanh toán thẻ Girocard là sự tiện lợi khi thanh toán. Nếu không dùng được, phải đưa ra giải pháp.", "tr": "Girocard ile ödeme bir ödeme kolaylığıdır. Çalışmadığında bir çözüm sunulur.", "ar": "الدفع ببطاقة جيروكارد تسهيل للدفع. وعند تعطّله يُقدَّم حل."}, "„Dann eben bar, sonst gar nicht.“": {"vi": "„Vậy thì tiền mặt, không thì thôi.“", "tr": "„O zaman nakit, yoksa hiç.“", "ar": "„إذن نقدًا، وإلا فلا.“"}, "Dann gar nicht.": {"vi": "Vậy thì thôi.", "tr": "O zaman hiç.", "ar": "إذن لا شيء."}, "Abweisend. Der Verkauf ist verloren.": {"vi": "Từ chối phũ phàng. Mất đơn hàng.", "tr": "Reddedici. Satış kaybedildi.", "ar": "رفض فظّ. ضاع البيع."}, "„Geht heute nicht.“": {"vi": "„Hôm nay không được.“", "tr": "„Bugün olmaz.“", "ar": "„اليوم غير ممكن.“"}, "Ehrlich, aber ohne Lösung.": {"vi": "Thẳng thắn nhưng không có giải pháp.", "tr": "Dürüst, ama çözümsüz.", "ar": "صريح، لكن بلا حل."}, "Der Prospekt der Konkurrenz": {"vi": "Tờ rơi của đối thủ", "tr": "Rakibin broşürü", "ar": "نشرة المنافس"}, "Ein Kunde zeigt euch einen Prospekt: „Bei Kaufhaus Möller kostet das 10 Euro weniger!“": {"vi": "Một khách đưa các bạn xem tờ rơi: „Ở Kaufhaus Möller món này rẻ hơn 10 euro!“", "tr": "Bir müşteri size bir broşür gösteriyor: „Kaufhaus Möller'de bu 10 Euro daha ucuz!“", "ar": "يريكم زبون نشرة: „في متجر مولر هذا أرخص بـ 10 يورو!“"}, "Was tut ihr zuerst?": {"vi": "Các bạn làm gì trước?", "tr": "Önce ne yaparsınız?", "ar": "ماذا تفعلون أولًا؟"}, "„Darf ich mal sehen? Ist es genau dasselbe Modell, dieselbe Größe?“ Erst danach über Unterschiede sprechen.": {"vi": "„Cho tôi xem được không ạ? Có đúng cùng mẫu, cùng cỡ không?“ Chỉ sau đó mới nói về điểm khác biệt.", "tr": "„Bakabilir miyim? Tam olarak aynı model, aynı beden mi?“ Ancak ondan sonra farklardan bahsetmek.", "ar": "„هل يمكنني أن أرى؟ هل هو الطراز نفسه والمقاس نفسه؟“ وبعد ذلك فقط التحدث عن الفروق."}, "Oh … das ist die kleinere Größe.": {"vi": "Ồ … đây là cỡ nhỏ hơn.", "tr": "Ah … bu daha küçük beden.", "ar": "آه … هذا هو المقاس الأصغر."}, "Erst nähere Angaben zum Konkurrenzangebot erbitten, dann auf Ursachen eingehen: Größe, Qualität, Preisstaffel.": {"vi": "Trước hết hỏi thêm thông tin về ưu đãi của đối thủ, rồi mới tìm nguyên nhân: cỡ, chất lượng, giá theo số lượng.", "tr": "Önce rakibin teklifi hakkında ayrıntı istemek, sonra nedenlere girmek: beden, kalite, miktara göre fiyat.", "ar": "أولًا طلب تفاصيل عن عرض المنافس، ثم التطرق إلى الأسباب: المقاس والجودة وتدرّج الأسعار."}, "„Das ist unmöglich.“": {"vi": "„Điều đó không thể có.“", "tr": "„Bu mümkün değil.“", "ar": "„هذا مستحيل.“"}, "Hier steht es doch!": {"vi": "Ở đây ghi rõ mà!", "tr": "Burada yazıyor işte!", "ar": "ها هو مكتوب هنا!"}, "Nie behaupten, das sei unmöglich.": {"vi": "Đừng bao giờ khẳng định điều đó là không thể.", "tr": "Asla bunun imkânsız olduğunu iddia etmeyin.", "ar": "لا تقولوا أبدًا إن ذلك مستحيل."}, "Sofort 10 Euro nachlassen.": {"vi": "Giảm ngay 10 euro.", "tr": "Hemen 10 Euro indirim yapmak.", "ar": "تخفيض 10 يورو فورًا."}, "Prima – das mache ich jetzt immer so.": {"vi": "Tuyệt – từ giờ tôi sẽ luôn làm vậy.", "tr": "Harika – bundan sonra hep böyle yapacağım.", "ar": "ممتاز – سأفعل هكذا دائمًا من الآن."}, "Ein Preisnachlass ist das letzte Mittel. Erst nachfragen.": {"vi": "Giảm giá là biện pháp cuối cùng. Trước hết hãy hỏi thêm.", "tr": "İndirim son çaredir. Önce sormak.", "ar": "التخفيض هو الوسيلة الأخيرة. اسألوا أولًا."}, "Der Kragen sitzt schief": {"vi": "Cổ áo bị lệch", "tr": "Yaka eğri duruyor", "ar": "الياقة غير مستقيمة"}, "Eine Kundin probiert eine Jacke an. Der Kragen ist hinten umgeklappt.": {"vi": "Một khách nữ thử áo khoác. Cổ áo phía sau bị gập.", "tr": "Bir müşteri ceket deniyor. Yaka arkada katlanmış.", "ar": "تجرّب زبونة سترة. الياقة مطويّة من الخلف."}, "„Darf ich Ihnen kurz den Kragen richten?“ – erst fragen, kurz helfen, dann wieder Abstand nehmen.": {"vi": "„Tôi chỉnh cổ áo giúp bà một chút được không ạ?“ – hỏi trước, giúp nhanh, rồi lại giữ khoảng cách.", "tr": "„Yakanızı kısaca düzeltebilir miyim?“ – önce sormak, kısaca yardım etmek, sonra yine mesafe almak.", "ar": "„هل يمكنني تعديل الياقة لك قليلًا؟“ – السؤال أولًا، المساعدة بإيجاز، ثم الابتعاد من جديد."}, "Ja, bitte. Danke!": {"vi": "Vâng, làm ơn. Cảm ơn!", "tr": "Evet, lütfen. Teşekkürler!", "ar": "نعم، من فضلك. شكرًا!"}, "Ist Körperkontakt nötig, fragt man vorher um Erlaubnis und geht danach auf die gesellschaftliche Distanz zurück.": {"vi": "Nếu cần chạm vào người, phải xin phép trước và sau đó quay lại khoảng cách xã giao.", "tr": "Temas gerekiyorsa önce izin istenir, sonra toplumsal mesafeye geri dönülür.", "ar": "إذا لزم لمس الزبونة تُطلب الإذن قبل ذلك ثم تعودون إلى المسافة الاجتماعية."}, "Ohne zu fragen hingreifen.": {"vi": "Với tay chạm vào mà không hỏi.", "tr": "Sormadan uzanıp dokunmak.", "ar": "مدّ اليد دون استئذان."}, "Huch! Was machen Sie da?": {"vi": "Ôi! Anh làm gì vậy?", "tr": "Hey! Ne yapıyorsunuz?", "ar": "يا إلهي! ماذا تفعل؟"}, "Das verletzt die Privatsphäre.": {"vi": "Điều đó xâm phạm sự riêng tư.", "tr": "Bu mahremiyeti ihlal eder.", "ar": "هذا يمسّ الخصوصية."}, "Nichts sagen, sieht ja keiner.": {"vi": "Không nói gì, không ai thấy đâu.", "tr": "Hiçbir şey söylememek, kimse görmez.", "ar": "عدم قول شيء، لن يراه أحد."}, "(findet die Jacke irgendwie komisch)": {"vi": "(thấy chiếc áo khoác có gì đó kỳ lạ)", "tr": "(ceketi biraz tuhaf buluyor)", "ar": "(تجد السترة غريبة نوعًا ما)"}, "Die Ware wird nicht von ihrer besten Seite gezeigt.": {"vi": "Hàng hóa không được trưng bày ở mặt đẹp nhất.", "tr": "Ürün en iyi yüzüyle sunulmuyor.", "ar": "لا تُعرَض البضاعة من أفضل جوانبها."}, "Ausverkauft": {"vi": "Hết hàng", "tr": "Tükendi", "ar": "نفدت الكمية"}, "Ein Kunde will den beliebten Wanderrucksack „Gipfelstürmer“. Er ist ausverkauft. Ein gleichwertiger Ersatz ist nicht da.": {"vi": "Một khách muốn chiếc ba lô leo núi được ưa chuộng „Gipfelstürmer“. Đã hết hàng. Không có sản phẩm thay thế tương đương.", "tr": "Bir müşteri popüler „Gipfelstürmer“ trekking sırt çantasını istiyor. Tükenmiş. Eşdeğer bir alternatif yok.", "ar": "يريد زبون حقيبة الظهر الشهيرة „Gipfelstürmer“ للتنزه. نفدت. ولا يوجد بديل مكافئ."}, "„Das tut mir leid, der ist gerade ausverkauft. Ich verstehe, wenn Sie noch vergleichen möchten. Soll ich Ihnen notieren, wann die neue Lieferung kommt?“": {"vi": "„Tôi rất tiếc, hiện đã hết hàng. Tôi hiểu nếu ông muốn so sánh thêm. Tôi ghi lại ngày hàng mới về cho ông nhé?“", "tr": "„Üzgünüm, şu an tükendi. Daha karşılaştırma yapmak isterseniz anlarım. Yeni sevkiyatın ne zaman geleceğini not edeyim mi?“", "ar": "„أعتذر، نفدت حاليًا. أتفهّم إن أردت المقارنة أكثر. هل أدوّن لك موعد وصول الشحنة الجديدة؟“"}, "Ja, das wäre nett.": {"vi": "Vâng, thế thì tốt quá.", "tr": "Evet, bu iyi olur.", "ar": "نعم، هذا لطيف."}, "Ohne gleichwertige Alternative: mit Bedauern mitteilen, Verständnis zeigen, freundlich verabschieden.": {"vi": "Khi không có sản phẩm thay thế tương đương: báo tin với sự tiếc nuối, thể hiện sự thấu hiểu, chào tạm biệt thân thiện.", "tr": "Eşdeğer alternatif yoksa: üzüntüyle bildirmek, anlayış göstermek, nazikçe vedalaşmak.", "ar": "إن لم يوجد بديل مكافئ: الإبلاغ بأسف وإظهار التفهّم والتوديع بلطف."}, "Einen viel billigeren Rucksack als Ersatz aufdrängen.": {"vi": "Ép khách mua chiếc ba lô rẻ hơn nhiều để thay thế.", "tr": "Yerine çok daha ucuz bir sırt çantasını dayatmak.", "ar": "فرض حقيبة أرخص بكثير كبديل."}, "Den will ich nicht.": {"vi": "Tôi không muốn cái đó.", "tr": "Onu istemiyorum.", "ar": "لا أريد تلك."}, "Eine Alternative muss den gleichen oder einen höheren Standard haben.": {"vi": "Sản phẩm thay thế phải có tiêu chuẩn bằng hoặc cao hơn.", "tr": "Alternatif aynı veya daha yüksek standartta olmalı.", "ar": "يجب أن يكون البديل بالمستوى نفسه أو أعلى."}, "„Leider aus. Schauen Sie halt nächste Woche mal vorbei.“": {"vi": "„Hết rồi. Tuần sau ông ghé lại xem nhé.“", "tr": "„Maalesef bitti. Haftaya bir uğrayın.“", "ar": "„للأسف نفد. مرّ علينا الأسبوع القادم.“"}, "Hm, okay.": {"vi": "Hm, được thôi.", "tr": "Hm, tamam.", "ar": "همم، حسنًا."}, "Bedauern ist da, aber wenig Service.": {"vi": "Có sự tiếc nuối nhưng ít dịch vụ.", "tr": "Üzüntü var ama hizmet az.", "ar": "هناك أسف لكن الخدمة قليلة."}, "Platzregen über Bremerhaven": {"vi": "Mưa rào trên Bremerhaven", "tr": "Bremerhaven'de sağanak yağmur", "ar": "مطر غزير فوق بريمرهافن"}, "Ein Platzregen! Viele Leute flüchten ins Kaufhaus.": {"vi": "Một trận mưa rào! Nhiều người chạy vào cửa hàng bách hóa trú mưa.", "tr": "Bir sağanak! Birçok kişi mağazaya sığınıyor.", "ar": "مطر غزير! يلجأ كثير من الناس إلى المتجر."}, "Weil ihr bisher freundlich und aufmerksam wart, kaufen viele etwas.": {"vi": "Vì các bạn thân thiện và chu đáo từ trước đến giờ, nhiều người mua hàng.", "tr": "Şimdiye kadar samimi ve dikkatli olduğunuz için birçok kişi bir şeyler alıyor.", "ar": "لأنكم كنتم ودودين ومنتبهين حتى الآن، يشتري كثيرون شيئًا."}, "Viele schauen sich nur um und gehen wieder, als der Regen aufhört.": {"vi": "Nhiều người chỉ xem qua rồi đi khi mưa tạnh.", "tr": "Birçoğu sadece bakıyor ve yağmur dinince gidiyor.", "ar": "كثيرون يتفرجون فقط ويغادرون عندما يتوقف المطر."}, "Die Reporterin vom „Weser-Blitz“": {"vi": "Nữ phóng viên của „Weser-Blitz“", "tr": "„Weser-Blitz“ muhabiri", "ar": "مراسلة صحيفة „فيزر-بليتس“"}, "Eine Reporterin der Lokalzeitung fragt Kunden am Ausgang: „Wie war die Beratung?“": {"vi": "Một nữ phóng viên báo địa phương hỏi khách ở lối ra: „Việc tư vấn thế nào?“", "tr": "Yerel gazetenin bir muhabiri çıkışta müşterilere soruyor: „Danışmanlık nasıldı?“", "ar": "تسأل مراسلة الصحيفة المحلية الزبائن عند المخرج: „كيف كانت الاستشارة؟“"}, "Die Kunden loben euch. Das spricht sich herum.": {"vi": "Khách khen các bạn. Tin này lan truyền.", "tr": "Müşteriler sizi övüyor. Bu duyuluyor.", "ar": "يمدح الزبائن عملكم. ويصل الخبر إلى الجميع."}, "Ein paar Kunden meckern über die Beratung. Das liest morgen ganz Bremerhaven.": {"vi": "Vài khách phàn nàn về việc tư vấn. Ngày mai cả Bremerhaven sẽ đọc được.", "tr": "Birkaç müşteri danışmanlıktan şikâyet ediyor. Yarın bütün Bremerhaven bunu okuyacak.", "ar": "يتذمر بعض الزبائن من الاستشارة. وسيقرأ ذلك غدًا كل بريمرهافن."}, "Frau Kranich schaut vorbei": {"vi": "Bà Kranich ghé qua", "tr": "Bayan Kranich uğruyor", "ar": "السيدة كرانيش تمرّ بالقسم"}, "Die Inhaberin Frau Kranich steht plötzlich in der Abteilung und beobachtet euch kurz.": {"vi": "Chủ cửa hàng, bà Kranich, bỗng đứng trong khu và quan sát các bạn một lúc.", "tr": "İşletme sahibi Bayan Kranich birdenbire bölümde duruyor ve sizi kısaca izliyor.", "ar": "تقف المالكة السيدة كرانيش فجأة في القسم وتراقبكم لوقت قصير."}, "Sie nickt zufrieden und sagt: „So kenne ich mein Haus.“": {"vi": "Bà gật đầu hài lòng và nói: „Đúng là cửa hàng của tôi như tôi vẫn biết.“", "tr": "Memnun bir şekilde başını sallıyor ve şöyle diyor: „İşte benim mağazamı böyle tanırım.“", "ar": "تومئ برضا وتقول: „هكذا أعرف متجري.“"}, "Sie seufzt leise und sagt: „Da geht noch mehr, ihr zwei.“": {"vi": "Bà khẽ thở dài và nói: „Còn làm được nhiều hơn nữa, hai bạn ạ.“", "tr": "Hafifçe iç çekiyor ve şöyle diyor: „Daha fazlası olur, ikiniz.“", "ar": "تتنهد بهدوء وتقول: „يمكنكما أن تفعلا أكثر من ذلك.“"}, "Die Schulklasse": {"vi": "Lớp học sinh", "tr": "Okul sınıfı", "ar": "الفصل المدرسي"}, "Eine Schulklasse auf Ausflug läuft durchs Haus und kauft Kleinigkeiten.": {"vi": "Một lớp học sinh đi dã ngoại đi qua cửa hàng và mua vài món nhỏ.", "tr": "Gezideki bir okul sınıfı mağazada dolaşıyor ve küçük şeyler alıyor.", "ar": "فصل مدرسي في رحلة يتجول في المتجر ويشتري أشياء صغيرة."}, "Ihr seid gut gelaunt und schnell – die Kasse klingelt.": {"vi": "Các bạn vui vẻ và nhanh nhẹn – máy tính tiền kêu liên tục.", "tr": "İyi bir ruh halindesiniz ve hızlısınız – kasa durmadan çalıyor.", "ar": "مزاجكم جيد وسريعون – صندوق الدفع يرنّ."}, "Es wird hektisch und ein bisschen unfreundlich.": {"vi": "Trở nên hối hả và hơi thiếu thân thiện.", "tr": "Telaşlı ve biraz da samimiyetsiz oluyor.", "ar": "يصبح الجو محمومًا وغير ودّي قليلًا."}, "Bevor die Person zu euch kommt, schreibt sie etwas in ein kleines Notizheft.": {"vi": "Trước khi đến chỗ các bạn, người đó ghi gì đó vào một cuốn sổ nhỏ.", "tr": "Size gelmeden önce kişi küçük bir not defterine bir şey yazıyor.", "ar": "قبل أن يأتي إليكم يكتب الشخص شيئًا في دفتر صغير."}, "Die Person schaut sich die Regale sehr genau an, fast wie eine Prüferin.": {"vi": "Người đó xem các kệ hàng rất kỹ, gần như một người kiểm tra.", "tr": "Kişi rafları çok dikkatlice inceliyor, neredeyse bir müfettiş gibi.", "ar": "ينظر الشخص إلى الرفوف بدقة شديدة، كأنه مفتّش."}, "Nebenbei fragt die Person: „Wie lange arbeiten Sie schon hier?“": {"vi": "Tiện thể người đó hỏi: „Chị làm việc ở đây được bao lâu rồi?“", "tr": "Kişi bu arada soruyor: „Ne zamandır burada çalışıyorsunuz?“", "ar": "يسأل الشخص عرضًا: „منذ متى تعملون هنا؟“"}, "Die Person schaut zweimal auf die Uhr, als ob sie die Zeit stoppt.": {"vi": "Người đó nhìn đồng hồ hai lần, như đang bấm giờ.", "tr": "Kişi iki kez saate bakıyor, sanki süre tutuyor.", "ar": "ينظر الشخص إلى الساعة مرتين وكأنه يحتسب الوقت."}, "In der Brusttasche steckt ein auffälliger goldener Füller.": {"vi": "Trong túi ngực cài một chiếc bút máy màu vàng nổi bật.", "tr": "Göğüs cebinde dikkat çeken altın renkli bir dolmakalem var.", "ar": "في جيب الصدر قلم حبر ذهبي لافت."}, "Die Person tippt nach dem Gespräch schnell etwas ins Handy und lächelt.": {"vi": "Sau cuộc trò chuyện, người đó nhanh chóng gõ gì đó vào điện thoại và mỉm cười.", "tr": "Görüşmeden sonra kişi hızlıca telefona bir şey yazıyor ve gülümsüyor.", "ar": "بعد الحديث يكتب الشخص شيئًا بسرعة في الهاتف ويبتسم."}, "Die Person fragt: „Wie viele Kunden haben Sie hier am Samstag so?“": {"vi": "Người đó hỏi: „Thứ Bảy ở đây thường có bao nhiêu khách?“", "tr": "Kişi soruyor: „Cumartesi günleri burada kaç müşteri oluyor?“", "ar": "يسأل الشخص: „كم زبونًا تستقبلون هنا يوم السبت عادةً؟“"}, "Die Person zählt leise mit, wie viele Kunden gerade im Laden sind.": {"vi": "Người đó khẽ đếm xem trong cửa hàng hiện có bao nhiêu khách.", "tr": "Kişi mağazada şu an kaç müşteri olduğunu sessizce sayıyor.", "ar": "يعدّ الشخص بصوت خافت كم زبونًا في المتجر الآن."}, "Die Person hat eine Einkaufstüte vom Wochenmarkt dabei.": {"vi": "Người đó mang theo một túi mua sắm từ chợ phiên.", "tr": "Kişinin yanında pazardan bir alışveriş çantası var.", "ar": "يحمل الشخص كيس تسوق من السوق الأسبوعي."}, "Die Person trägt eine Regenjacke, die noch nass ist.": {"vi": "Người đó mặc áo mưa vẫn còn ướt.", "tr": "Kişi hâlâ ıslak bir yağmurluk giyiyor.", "ar": "يرتدي الشخص سترة مطر ما زالت مبللة."}, "Die Person telefoniert noch kurz und legt dann auf.": {"vi": "Người đó còn nói điện thoại một chút rồi cúp máy.", "tr": "Kişi kısaca telefonda konuşuyor ve sonra kapatıyor.", "ar": "يتحدث الشخص قليلًا في الهاتف ثم ينهي المكالمة."}, "Die Person hat einen Kaffeebecher zum Mitnehmen in der Hand.": {"vi": "Người đó cầm trên tay một cốc cà phê mang đi.", "tr": "Kişinin elinde paket bir kahve bardağı var.", "ar": "يحمل الشخص في يده كوب قهوة للطريق."}, "Die Person summt leise ein Lied mit, das im Radio läuft.": {"vi": "Người đó khẽ ngân nga theo một bài hát phát trên radio.", "tr": "Kişi radyoda çalan bir şarkıya hafifçe eşlik ediyor.", "ar": "يدندن الشخص بهدوء مع أغنية تُذاع في الراديو."}, "Die Person trägt einen Fahrradhelm unter dem Arm.": {"vi": "Người đó kẹp mũ bảo hiểm xe đạp dưới cánh tay.", "tr": "Kişi koltuğunun altında bir bisiklet kaskı taşıyor.", "ar": "يحمل الشخص خوذة دراجة تحت ذراعه."}, "Die Person hat eine Zeitung unter dem Arm.": {"vi": "Người đó kẹp một tờ báo dưới cánh tay.", "tr": "Kişinin koltuğunun altında bir gazete var.", "ar": "يحمل الشخص صحيفة تحت ذراعه."}, "Die Person kommt etwas außer Atem herein.": {"vi": "Người đó bước vào hơi thở dốc.", "tr": "Kişi biraz nefes nefese içeri giriyor.", "ar": "يدخل الشخص وهو يلهث قليلًا."}, "Die Person hat ein Pflaster am Finger.": {"vi": "Người đó có miếng băng cá nhân ở ngón tay.", "tr": "Kişinin parmağında bir yara bandı var.", "ar": "على إصبع الشخص لاصقة جروح."}, "Die Person trägt eine Werder-Mütze.": {"vi": "Người đó đội mũ lưỡi trai của Werder.", "tr": "Kişi bir Werder şapkası takıyor.", "ar": "يرتدي الشخص قبعة نادي فيردر."}, "Die Person macht ein Foto vom Schaufenster – „für meine Schwester“, sagt sie.": {"vi": "Người đó chụp ảnh cửa kính trưng bày – „cho em gái tôi“, người đó nói.", "tr": "Kişi vitrinin fotoğrafını çekiyor – „kız kardeşim için“ diyor.", "ar": "يلتقط الشخص صورة للواجهة الزجاجية – „لأختي“، كما يقول."}, "Die Person fragt, wann das Kaufhaus heute schließt.": {"vi": "Người đó hỏi hôm nay cửa hàng đóng cửa lúc mấy giờ.", "tr": "Kişi mağazanın bugün saat kaçta kapandığını soruyor.", "ar": "يسأل الشخص متى يُغلق المتجر اليوم."}, "Die Person liest lange die Hausordnung am Eingang.": {"vi": "Người đó đọc rất lâu nội quy ở lối vào.", "tr": "Kişi girişteki iç tüzüğü uzun uzun okuyor.", "ar": "يقرأ الشخص نظام المتجر عند المدخل لوقت طويل."}, "Kundenorientiert kommunizieren": {"vi": "Giao tiếp hướng đến khách hàng", "tr": "Müşteri odaklı iletişim", "ar": "التواصل الموجّه نحو الزبون"}, "Körpersprache und Distanzzonen": {"vi": "Ngôn ngữ cơ thể và vùng khoảng cách", "tr": "Beden dili ve mesafe bölgeleri", "ar": "لغة الجسد ومناطق المسافة"}, "Verkaufsformen und Warenkenntnisse": {"vi": "Hình thức bán hàng và kiến thức hàng hóa", "tr": "Satış biçimleri ve ürün bilgisi", "ar": "أشكال البيع ومعرفة البضائع"}, "Kontakt aufnehmen": {"vi": "Tiếp xúc khách", "tr": "İlk temas", "ar": "الاتصال الأول"}, "Vertrauen und Kaufmotive": {"vi": "Lòng tin và động cơ mua hàng", "tr": "Güven ve satın alma motifleri", "ar": "الثقة ودوافع الشراء"}, "Fragetechnik": {"vi": "Kỹ thuật đặt câu hỏi", "tr": "Soru tekniği", "ar": "تقنية طرح الأسئلة"}, "Direkte und indirekte Bedarfsermittlung": {"vi": "Xác định nhu cầu trực tiếp và gián tiếp", "tr": "Doğrudan ve dolaylı ihtiyaç tespiti", "ar": "تحديد الحاجة المباشر وغير المباشر"}, "Die Ware vorlegen": {"vi": "Giới thiệu hàng hóa", "tr": "Ürünü sunmak", "ar": "عرض البضاعة"}, "Verkaufsargumente": {"vi": "Lập luận bán hàng", "tr": "Satış argümanları", "ar": "حجج البيع"}, "Den Preis nennen": {"vi": "Nêu giá", "tr": "Fiyatı söylemek", "ar": "ذكر السعر"}, "Kundeneinwände": {"vi": "Phản đối của khách", "tr": "Müşteri itirazları", "ar": "اعتراضات الزبائن"}, "Konfliktlösung und Beschwerden": {"vi": "Giải quyết xung đột và khiếu nại", "tr": "Çatışma çözümü ve şikâyetler", "ar": "حل النزاعات والشكاوى"}, "Ergänzung, Zusatz, Alternative": {"vi": "Bổ sung, thêm, thay thế", "tr": "Tamamlayıcı, ek, alternatif", "ar": "المكمّل والإضافة والبديل"}, "Der Kaufabschluss": {"vi": "Chốt đơn", "tr": "Satışın tamamlanması", "ar": "إتمام البيع"}, "Serviceleistungen und Verabschiedung": {"vi": "Dịch vụ và lời chào tạm biệt", "tr": "Hizmetler ve vedalaşma", "ar": "الخدمات والتوديع"}, "Sport & Freizeit": {"vi": "Thể thao & Giải trí", "tr": "Spor & Boş zaman", "ar": "الرياضة والترفيه"}, "Sport": {"vi": "Thể thao", "tr": "Spor", "ar": "الرياضة"}, "Schuhe": {"vi": "Giày dép", "tr": "Ayakkabı", "ar": "الأحذية"}, "Drogerie & Parfümerie": {"vi": "Drogerie & Nước hoa", "tr": "Droger & Parfümeri", "ar": "مستحضرات العناية والعطور"}, "Drogerie": {"vi": "Drogerie", "tr": "Droger", "ar": "مستحضرات العناية"}, "Spielwaren": {"vi": "Đồ chơi", "tr": "Oyuncak", "ar": "الألعاب"}, "Feinkost": {"vi": "Thực phẩm cao cấp", "tr": "Şarküteri", "ar": "الأطعمة الفاخرة"}, "Das Kaufhaus ist gerettet!": {"vi": "Cửa hàng bách hóa đã được cứu!", "tr": "Mağaza kurtarıldı!", "ar": "تم إنقاذ المتجر!"}, "Am Montag kommt der Brief: Der Investor kauft das Kaufhaus Kranich – mit dem ganzen Team. „So eine Beratung findet man im Internet nicht“, schreibt er. Frau Kranich hängt euren Teamnamen an die Pinnwand im Pausenraum.": {"vi": "Thứ Hai có thư: Nhà đầu tư mua Kaufhaus Kranich – cùng cả đội. Ông viết: „Sự tư vấn như thế này không tìm thấy trên Internet.“ Bà Kranich treo tên đội của các bạn lên bảng tin trong phòng nghỉ.", "tr": "Pazartesi mektup geliyor: Yatırımcı Kaufhaus Kranich'i satın alıyor – tüm ekiple birlikte. „Böyle bir danışmanlığı internette bulamazsınız“ diye yazıyor. Bayan Kranich takım adınızı mola odasındaki ilan panosuna asıyor.", "ar": "يصل الخطاب يوم الاثنين: المستثمر يشتري متجر كرانيش – مع الفريق بأكمله. يكتب: „استشارة كهذه لا تجدها على الإنترنت.“ تعلّق السيدة كرانيش اسم فريقكم على لوحة الإعلانات في غرفة الاستراحة."}, "Gerettet – mit Auflagen": {"vi": "Được cứu – kèm điều kiện", "tr": "Kurtarıldı – şartlarla", "ar": "تم الإنقاذ – بشروط"}, "Der Investor ist unentschlossen. Das Kaufhaus bleibt, aber in drei Monaten kommt er wieder – unangemeldet. Bis dahin soll das Team an der Beratung arbeiten. Frau Kranich sagt: „Das schaffen wir. Ihr habt ja gesehen, worauf es ankommt.“": {"vi": "Nhà đầu tư còn do dự. Cửa hàng vẫn còn, nhưng ba tháng nữa ông sẽ quay lại – không báo trước. Đến lúc đó đội phải cải thiện việc tư vấn. Bà Kranich nói: „Chúng ta làm được. Các bạn đã thấy điều gì là quan trọng rồi.“", "tr": "Yatırımcı kararsız. Mağaza kalıyor, ama üç ay sonra yeniden gelecek – habersiz. O zamana kadar ekip danışmanlık üzerinde çalışmalı. Bayan Kranich şöyle diyor: „Başarırız. Neyin önemli olduğunu gördünüz.“", "ar": "المستثمر متردد. يبقى المتجر، لكنه سيعود بعد ثلاثة أشهر – دون إعلان مسبق. وحتى ذلك الحين على الفريق أن يعمل على الاستشارة. تقول السيدة كرانيش: „سننجح. لقد رأيتم ما الذي يهم.“"}, "Verkauft – das wird ein Paketlager": {"vi": "Đã bán – nơi này sẽ thành kho bưu kiện", "tr": "Satıldı – burası paket deposu olacak", "ar": "تم البيع – سيصبح مستودع طرود"}, "Der Investor schreibt: „Beratung wie im Internet – dann kann man auch gleich im Internet kaufen.“ Aus dem Kaufhaus Kranich wird ein Paketlager. Aber halt: Das war nur ein Spieltag. Spielt noch einmal und rettet das Haus!": {"vi": "Nhà đầu tư viết: „Tư vấn như trên Internet – vậy thì mua luôn trên Internet cho xong.“ Kaufhaus Kranich trở thành kho bưu kiện. Nhưng khoan: đó chỉ là một ngày chơi. Hãy chơi lại và cứu cửa hàng!", "tr": "Yatırımcı yazıyor: „İnternet gibi danışmanlık – o zaman doğrudan internetten de alınır.“ Kaufhaus Kranich bir paket deposuna dönüşüyor. Ama dur: Bu sadece bir oyun günüydü. Tekrar oyna ve mağazayı kurtar!", "ar": "يكتب المستثمر: „استشارة مثل الإنترنت – إذن يمكن الشراء من الإنترنت مباشرة.“ يتحول متجر كرانيش إلى مستودع طرود. لكن مهلًا: كان ذلك مجرد يوم لعب. العبوا مرة أخرى وأنقذوا المتجر!"}, "Förderer oder Störer?": {"vi": "Thúc đẩy hay cản trở?", "tr": "Destekleyici mi, engelleyici mi?", "ar": "مشجّع أم معيق؟"}, "Ist der Satz ein Gesprächsförderer oder ein Gesprächsstörer?": {"vi": "Câu này thúc đẩy hay cản trở cuộc hội thoại?", "tr": "Bu cümle konuşmayı destekler mi, engeller mi?", "ar": "هل هذه الجملة تشجّع الحوار أم تعيقه؟"}, "Förderer": {"vi": "Thúc đẩy", "tr": "Destekleyici", "ar": "مشجّع"}, "Störer": {"vi": "Cản trở", "tr": "Engelleyici", "ar": "معيق"}, "„Wenn ich Sie richtig verstanden habe, suchen Sie …“": {"vi": "„Nếu tôi hiểu đúng, bà đang tìm …“", "tr": "„Sizi doğru anladıysam, aradığınız …“", "ar": "„إذا فهمتك جيدًا، فأنتِ تبحثين عن …“"}, "„Damit können Sie …“": {"vi": "„Với món này bà có thể …“", "tr": "„Bununla şunu yapabilirsiniz …“", "ar": "„بهذا يمكنك أن …“"}, "„Ich kümmere mich darum.“": {"vi": "„Tôi sẽ lo việc đó.“", "tr": "„Ben ilgilenirim.“", "ar": "„سأتولى الأمر.“"}, "„Ich sehe sofort nach.“": {"vi": "„Tôi kiểm tra ngay.“", "tr": "„Hemen bakıyorum.“", "ar": "„سأتحقق فورًا.“"}, "„Für Sie bedeutet das, dass …“": {"vi": "„Đối với bà, điều đó có nghĩa là …“", "tr": "„Sizin için bu şu anlama geliyor …“", "ar": "„بالنسبة لك يعني ذلك أن …“"}, "„Habe ich das richtig verstanden: …?“": {"vi": "„Tôi hiểu có đúng không: …?“", "tr": "„Doğru anladım mı: …?“", "ar": "„هل فهمت بشكل صحيح: …؟“"}, "„Greifen Sie sofort zu!“": {"vi": "„Mua ngay đi!“", "tr": "„Hemen alın!“", "ar": "„اشترِ فورًا!“"}, "„Das verstehen Sie nicht!“": {"vi": "„Bà không hiểu đâu!“", "tr": "„Siz bunu anlamazsınız!“", "ar": "„لن تفهمي هذا!“"}, "„An Ihrer Stelle würde ich nicht warten …“": {"vi": "„Nếu là bà, tôi sẽ không chờ …“", "tr": "„Yerinizde olsam beklemezdim …“", "ar": "„لو كنت مكانك لما انتظرت …“"}, "„Ich habe doch mehrmals gesagt …“": {"vi": "„Tôi đã nói nhiều lần rồi mà …“", "tr": "„Size defalarca söyledim …“", "ar": "„لقد قلت لك مرارًا …“"}, "„Dieses Handy ist schwierig zu bedienen , "tr": "nahoş ama değerli", "ar": "مزعجة لكنها قيّمة"}, "notwendig für die Nutzung (Batterie zum Wecker)": {"vi": "cần thiết để sử dụng (pin cho đồng hồ báo thức)", "tr": "kullanım için gerekli (çalar saat için pil)", "ar": "ضروري للاستخدام (بطارية للمنبّه)"}, "erhöht den Nutzen (Hülle zum Handy)": {"vi": "tăng thêm lợi ích (ốp cho điện thoại)", "tr": "faydayı artırır (telefon için kılıf)", "ar": "يزيد الفائدة (غطاء للهاتف)"}, "gleicher oder höherer Standard": {"vi": "cùng tiêu chuẩn hoặc cao hơn", "tr": "aynı veya daha yüksek standart", "ar": "المستوى نفسه أو أعلى"}, "beim Hauptartikel, nicht erst an der Kasse": {"vi": "ở món hàng chính, không phải đến quầy thu ngân mới đề nghị", "tr": "ana üründe, ancak kasada değil", "ar": "عند السلعة الرئيسية، وليس عند الصندوق فقط"}, "zeigt: Der Kunde will kaufen": {"vi": "cho thấy: khách muốn mua", "tr": "gösterir: müşteri satın almak istiyor", "ar": "يدل على أن الزبون يريد الشراء"}, "Ja-Fragen, Auswahl verringern, Alternativfrage, Zusammenfassung, Empfehlung, direkte Aufforderung": {"vi": "câu hỏi „vâng“, thu hẹp lựa chọn, câu hỏi lựa chọn, tóm tắt, khuyên, yêu cầu trực tiếp", "tr": "evet soruları, seçeneği azaltmak, seçenekli soru, özet, öneri, doğrudan çağrı", "ar": "أسئلة „نعم“، تقليص الخيارات، سؤال الخيارات، التلخيص، التوصية، الطلب المباشر"}, "Reue direkt nach dem Kauf": {"vi": "hối hận ngay sau khi mua", "tr": "satın almadan hemen sonra pişmanlık", "ar": "الندم مباشرة بعد الشراء"}, "Kaufmotiv, Umtausch, Qualität betonen": {"vi": "nhấn mạnh động cơ mua, việc đổi hàng, chất lượng", "tr": "satın alma motifini, değişimi, kaliteyi vurgulamak", "ar": "التأكيد على دافع الشراء والاستبدال والجودة"}, "Lieferung, Montage, Änderung, Umtausch, Reparatur": {"vi": "giao hàng, lắp ráp, sửa đổi, đổi hàng, sửa chữa", "tr": "teslimat, montaj, tadilat, değişim, onarım", "ar": "التوصيل، التركيب، التعديل، الاستبدال، التصليح"}, "Parkplätze, Kinderbetreuung, Cafeteria": {"vi": "chỗ đỗ xe, trông trẻ, quán ăn tự phục vụ", "tr": "otopark, çocuk bakımı, kafeterya", "ar": "مواقف السيارات، رعاية الأطفال، الكافيتيريا"}, "Girocard, Kreditkarte, Rechnung, Raten": {"vi": "Girocard, thẻ tín dụng, hóa đơn, trả góp", "tr": "Girocard, kredi kartı, fatura, taksit", "ar": "جيروكارد، بطاقة ائتمان، فاتورة، أقساط"}, "danken, Name, Satz zur Situation": {"vi": "cảm ơn, tên, một câu phù hợp với tình huống", "tr": "teşekkür, isim, duruma uygun bir cümle", "ar": "الشكر، الاسم، جملة تناسب الموقف"}, "„Guten Tag, Herr Stolle! Schön, dass Sie wieder da sind. Wie kann ich Ihnen heute helfen?“": {"vi": "„Xin chào ông Stolle! Rất vui vì ông lại đến. Hôm nay tôi giúp gì được cho ông ạ?“", "tr": "„İyi günler Bay Stolle! Tekrar geldiğinize sevindim. Bugün size nasıl yardımcı olabilirim?“", "ar": "«مرحبًا سيد Stolle! يسعدني أنك عدت. كيف يمكنني مساعدتك اليوم؟»"}, "„Guten Tag. Kann ich Ihnen helfen?“": {"vi": "„Xin chào. Tôi giúp gì được cho ông ạ?“", "tr": "„İyi günler. Size yardımcı olabilir miyim?“", "ar": "«مرحبًا. هل يمكنني مساعدتك؟»"}, "„Hey! Na, was geht?“": {"vi": "„Này! Sao, có chuyện gì thế?“", "tr": "„Hey! Naber, ne var ne yok?“", "ar": "«هاي! ما الأخبار؟»"}, "„Guten Tag, Herr Stolle! Suchen Sie etwas Bestimmtes?“": {"vi": "„Xin chào ông Stolle! Ông tìm thứ gì cụ thể không ạ?“", "tr": "„İyi günler Bay Stolle! Belirli bir şey mi arıyorsunuz?“", "ar": "«مرحبًا سيد Stolle! هل تبحث عن شيء معيّن؟»"}, "Herr Kaya kommt mit einer Trinkflasche zurück.": {"vi": "Ông Kaya quay lại với một chai nước.", "tr": "Bay Kaya bir su şişesiyle geri geliyor.", "ar": "يعود السيد Kaya ومعه زجاجة ماء."}, "Er ist laut: „Die läuft aus! Meine ganze Tasche ist nass!“ Andere Kunden schauen schon.": {"vi": "Ông nói to: „Chai này bị rò! Cả túi của tôi ướt hết rồi!“ Những khách khác đã nhìn sang.", "tr": "Yüksek sesle konuşuyor: „Bu akıtıyor! Bütün çantam ıslandı!“ Diğer müşteriler bakmaya başladı bile.", "ar": "يتكلم بصوت عالٍ: «هذه تسرّب! حقيبتي كلها مبتلّة!» وبدأ عملاء آخرون ينظرون."}, "Wie reagiert ihr zuerst?": {"vi": "Các bạn phản ứng thế nào trước tiên?", "tr": "İlk olarak nasıl tepki verirsiniz?", "ar": "كيف تردّون أولًا؟"}, "Ruhig bleiben, ausreden lassen, dann: „Das ärgert Sie, das kann ich gut verstehen. Kommen Sie, wir schauen uns das hier in Ruhe an.“": {"vi": "Giữ bình tĩnh, để ông nói hết, rồi: „Chuyện này làm ông bực, tôi hiểu rõ. Mời ông, chúng ta cùng xem kỹ ở đây.“", "tr": "Sakin kalmak, sözünü bitirmesine izin vermek, sonra: „Bu sizi kızdırdı, çok iyi anlıyorum. Gelin, burada sakin sakin bir bakalım.“", "ar": "الحفاظ على الهدوء وترك الزبون يُنهي كلامه ثم: «هذا أزعجك، وأتفهّم ذلك جيدًا. تفضّل، لننظر في الأمر هنا بهدوء.»"}, "„Das haben Sie bestimmt falsch zugeschraubt.“": {"vi": "„Chắc ông vặn nắp sai cách.“", "tr": "„Siz kapağı kesin yanlış kapattınız.“", "ar": "«لا شك أنك أغلقتها بشكل خاطئ.»"}, "„Beruhigen Sie sich erst mal!“": {"vi": "„Ông hãy bình tĩnh lại đã!“", "tr": "„Önce bir sakinleşin!“", "ar": "«اهدأ أولًا!»"}, "Sofort unterbrechen: „Haben Sie den Kassenbon dabei?“": {"vi": "Ngắt lời ngay: „Ông có mang hóa đơn không?“", "tr": "Hemen sözünü kesmek: „Fişiniz yanınızda mı?“", "ar": "المقاطعة فورًا: «هل معك الفاتورة؟»"}, "Ihr schaut euch die Flasche an. Der Deckel hat wirklich einen Riss.": {"vi": "Các bạn xem chai nước. Nắp chai thật sự bị nứt.", "tr": "Şişeye bakıyorsunuz. Kapakta gerçekten bir çatlak var.", "ar": "تنظرون إلى الزجاجة. الغطاء فيه شرخ فعلًا."}, "Wie geht es weiter?": {"vi": "Tiếp theo thế nào?", "tr": "Nasıl devam edersiniz?", "ar": "كيف تتابعون؟"}, "„Danke, dass Sie es uns zeigen. Ich schlage Ihnen vor: Sie bekommen sofort eine neue Flasche. Darf ich Ihnen zeigen, welche Modelle einen besonders dichten Deckel haben?“": {"vi": "„Cảm ơn ông đã cho chúng tôi xem. Tôi đề nghị: ông sẽ được đổi ngay một chai mới. Tôi giới thiệu ông xem những mẫu có nắp kín đặc biệt nhé?“", "tr": "„Gösterdiğiniz için teşekkürler. Size şunu öneriyorum: Hemen yeni bir şişe alıyorsunuz. Kapağı özellikle sızdırmaz olan modelleri göstereyim mi?“", "ar": "«شكرًا لأنك أريتنا ذلك. أقترح عليك التالي: ستحصل فورًا على زجاجة جديدة. هل أُريك الموديلات التي لها غطاء محكم بشكل خاص؟»"}, "„Da kann ich auch nichts machen, das ist eben so.“": {"vi": "„Tôi cũng không làm gì được, vốn là vậy rồi.“", "tr": "„Ben de bir şey yapamam, böyle işte.“", "ar": "«لا أستطيع فعل شيء، هكذا هي الأمور.»"}, "Wortlos eine neue Flasche geben und zurück an die Arbeit.": {"vi": "Im lặng đưa chai mới và quay lại làm việc.", "tr": "Sessizce yeni bir şişe verip işe dönmek.", "ar": "إعطاء زجاجة جديدة بصمت والعودة إلى العمل."}, "„Der Hersteller ist schuld, nicht wir.“ Dann eine neue Flasche geben.": {"vi": "„Lỗi của nhà sản xuất, không phải của chúng tôi.“ Rồi đưa chai mới.", "tr": "„Suç üreticide, bizde değil.“ Sonra yeni bir şişe vermek.", "ar": "«الخطأ من الشركة المصنّعة، لا منّا.» ثم إعطاء زجاجة جديدة."}, "Herr Lange kauft eine Trinkflasche und schaut sich dabei um.": {"vi": "Ông Lange mua một chai nước và nhìn quanh.", "tr": "Bay Lange bir su şişesi alıyor ve etrafına bakıyor.", "ar": "يشتري السيد Lange زجاجة ماء وينظر حوله."}, "Er fragt: „Warum liegen die Sportuhren in einer Vitrine und die Trinkflaschen im Regal?“": {"vi": "Ông hỏi: „Tại sao đồng hồ thể thao để trong tủ kính còn chai nước để trên kệ?“", "tr": "Soruyor: „Spor saatleri neden vitrinde de su şişeleri rafta?“", "ar": "يسأل: «لماذا الساعات الرياضية في واجهة زجاجية وزجاجات الماء على الرف؟»"}, "„Die Uhren sind teuer und brauchen Erklärung – da berate ich Sie persönlich. Trinkflaschen kennt jeder, die nehmen Sie selbst aus dem Regal.“": {"vi": "„Đồng hồ đắt tiền và cần giải thích – nên tôi tư vấn trực tiếp cho ông. Chai nước thì ai cũng biết, ông tự lấy từ kệ.“", "tr": "„Saatler pahalı ve açıklama gerektiriyor – bu yüzden size kişisel olarak danışmanlık yapıyorum. Su şişelerini herkes tanır, onları kendiniz raftan alırsınız.“", "ar": "«الساعات غالية وتحتاج إلى شرح – لذلك أستشيرك شخصيًا. أما زجاجات الماء فالجميع يعرفها، وتأخذها بنفسك من الرف.»"}, "„Weiß ich nicht, das hat der Chef so gemacht.“": {"vi": "„Tôi không biết, sếp làm vậy.“", "tr": "„Bilmiyorum, patron böyle yapmış.“", "ar": "«لا أعرف، المدير هو من فعل ذلك.»"}, "„Damit keiner die Uhren klaut.“": {"vi": "„Để không ai ăn cắp đồng hồ.“", "tr": "„Kimse saatleri çalmasın diye.“", "ar": "«حتى لا يسرق أحد الساعات.»"}, "„Weil Vitrinen schöner aussehen.“": {"vi": "„Vì tủ kính trông đẹp hơn.“", "tr": "„Vitrinler daha güzel göründüğü için.“", "ar": "«لأن الواجهات الزجاجية تبدو أجمل.»"}, "Er fragt weiter: „Und woher wissen Sie eigentlich so viel über die Uhren?“": {"vi": "Ông hỏi tiếp: „Mà sao cô biết nhiều về đồng hồ thế?“", "tr": "Devam ediyor: „Peki siz saatler hakkında bu kadar şeyi nereden biliyorsunuz?“", "ar": "يتابع: «ومن أين تعرفون الكثير عن الساعات؟»"}, "„Wir hatten eine Schulung vom Hersteller, und ich lese die Testergebnisse. So kann ich Sie gut beraten.“": {"vi": "„Chúng tôi được nhà sản xuất tập huấn, và tôi đọc các kết quả kiểm tra. Nhờ vậy tôi tư vấn tốt cho ông.“", "tr": "„Üreticiden eğitim aldık ve test sonuçlarını okuyorum. Böylece size iyi danışmanlık yapabiliyorum.“", "ar": "«حصلنا على تدريب من الشركة المصنّعة وأقرأ نتائج الاختبارات. وهكذا أستطيع استشارتك جيدًا.»"}, "„Ach, ich rate meistens.“": {"vi": "„À, phần lớn tôi đoán thôi.“", "tr": "„Ya, çoğunlukla tahmin ediyorum.“", "ar": "«آه، معظم الوقت أخمّن.»"}, "„Steht alles auf der Verpackung.“": {"vi": "„Tất cả đều ghi trên bao bì.“", "tr": "„Hepsi ambalajın üstünde yazıyor.“", "ar": "«كل شيء مكتوب على العبوة.»"}, "„Aus irgendwelchen Foren im Internet.“": {"vi": "„Từ mấy diễn đàn nào đó trên Internet.“", "tr": "„İnternetteki bazı forumlardan.“", "ar": "«من بعض المنتديات على الإنترنت.»"}, "Herr Nikolaidis sucht ein Geburtstagsgeschenk.": {"vi": "Ông Nikolaidis tìm quà sinh nhật.", "tr": "Bay Nikolaidis doğum günü hediyesi arıyor.", "ar": "يبحث السيد Nikolaidis عن هدية عيد ميلاد."}, "Ihr wollt den Bedarf mit einer Fragekette ermitteln.": {"vi": "Các bạn muốn tìm hiểu nhu cầu bằng một chuỗi câu hỏi.", "tr": "İhtiyacı bir soru zinciriyle tespit etmek istiyorsunuz.", "ar": "تريدون التعرّف على الحاجة بسلسلة من الأسئلة."}, "Welche Reihenfolge ist am besten?": {"vi": "Thứ tự nào là tốt nhất?", "tr": "Hangi sıra en iyisi?", "ar": "ما هو أفضل ترتيب؟"}, "1. „Für wen ist das Geschenk?“ 2. „Was macht die Person gern?“ 3. „In welchem Rahmen soll es preislich liegen?“ 4. „Eher praktisch oder eher ausgefallen?“": {"vi": "1. „Quà này tặng ai ạ?“ 2. „Người đó thích làm gì ạ?“ 3. „Ông muốn trong tầm giá nào ạ?“ 4. „Thiên về thực dụng hay độc đáo hơn ạ?“", "tr": "1. „Hediye kimin için?“ 2. „Kişi neyi yapmayı sever?“ 3. „Fiyat olarak hangi aralıkta olsun?“ 4. „Daha çok pratik mi, yoksa daha değişik mi?“", "ar": "1. «لمن هذه الهدية؟» 2. «ماذا يحب هذا الشخص أن يفعل؟» 3. «في أي نطاق سعري تريدها؟» 4. «هل تفضّلها عملية أم غير تقليدية؟»"}, "1. „Wie viel wollen Sie ausgeben?“ 2. „Sonst brauchen Sie nichts?“": {"vi": "1. „Ông muốn chi bao nhiêu?“ 2. „Vậy ông không cần gì nữa ạ?“", "tr": "1. „Ne kadar harcamak istiyorsunuz?“ 2. „Başka bir şeye ihtiyacınız yok yani?“", "ar": "1. «كم تريد أن تدفع؟» 2. «إذًا لا تحتاج إلى شيء آخر؟»"}, "1. „Eher praktisch oder ausgefallen?“ 2. „Für wen ist das Geschenk?“": {"vi": "1. „Thiên về thực dụng hay độc đáo ạ?“ 2. „Quà này tặng ai ạ?“", "tr": "1. „Daha çok pratik mi, değişik mi?“ 2. „Hediye kimin için?“", "ar": "1. «عملية أم غير تقليدية؟» 2. «لمن هذه الهدية؟»"}, "1. „Für wen ist das?“ 2. „Sie wollen doch sicher etwas Hochwertiges?“": {"vi": "1. „Tặng ai ạ?“ 2. „Chắc ông muốn thứ chất lượng cao chứ?“", "tr": "1. „Kimin için?“ 2. „Herhalde kaliteli bir şey istersiniz?“", "ar": "1. «لمن هي؟» 2. «لا شك أنك تريد شيئًا عالي الجودة؟»"}, "Es wird ein Tennisschläger für seine Frau. Zum Schluss geht es um das Bespannen.": {"vi": "Đó sẽ là một cây vợt tennis cho vợ ông. Cuối cùng là chuyện căng lưới vợt.", "tr": "Karısı için bir tenis raketi olacak. Sonunda raketin gerilmesi konusu geliyor.", "ar": "ستكون مضرب تنس لزوجته. وفي النهاية يأتي الحديث عن شدّ الأوتار."}, "Welche Frage passt jetzt?": {"vi": "Câu hỏi nào phù hợp bây giờ?", "tr": "Şimdi hangi soru uygun?", "ar": "أي سؤال يناسب الآن؟"}, "„Sind Sie damit einverstanden, dass wir den Schläger für 15 Euro bespannen?“": {"vi": "„Ông có đồng ý để chúng tôi căng lưới cho cây vợt với giá 15 euro không ạ?“", "tr": "„Raketi 15 Euro'ya gerdirmemizi kabul eder misiniz?“", "ar": "«هل توافق على أن نشدّ أوتار المضرب مقابل 15 يورو؟»"}, "„Wollen Sie das wirklich selbst machen?“": {"vi": "„Ông thật sự muốn tự làm việc đó sao?“", "tr": "„Bunu gerçekten kendiniz mi yapmak istiyorsunuz?“", "ar": "«هل تريد فعلًا أن تفعل ذلك بنفسك؟»"}, "„Was halten Sie vom Bespannen?“": {"vi": "„Ông thấy việc căng lưới thế nào?“", "tr": "„Raketin gerilmesi hakkında ne düşünüyorsunuz?“", "ar": "«ما رأيك في شدّ الأوتار؟»"}, "„Bespannen machen Sie sicher selbst?“": {"vi": "„Chắc ông tự căng lưới nhỉ?“", "tr": "„Gerdirmeyi kesin kendiniz yaparsınız?“", "ar": "«لا شك أنك تشدّ الأوتار بنفسك؟»"}, "Frau Schulz steht bei den Wanderschuhen.": {"vi": "Bà Schulz đứng cạnh các đôi giày đi bộ đường dài.", "tr": "Bayan Schulz trekking ayakkabılarının yanında duruyor.", "ar": "تقف السيدة Schulz بجانب أحذية المشي في الجبال."}, "Sie sagt: „Ich brauche neue Wanderschuhe.“": {"vi": "Bà nói: „Tôi cần một đôi giày đi bộ đường dài mới.“", "tr": "Diyor ki: „Yeni bir trekking ayakkabısına ihtiyacım var.“", "ar": "تقول: «أحتاج إلى حذاء جديد للمشي في الجبال.»"}, "Welche Frage stellt ihr jetzt?": {"vi": "Bây giờ các bạn đặt câu hỏi nào?", "tr": "Şimdi hangi soruyu sorarsınız?", "ar": "ما السؤال الذي تطرحونه الآن؟"}, "„Wo und wie oft möchten Sie damit wandern?“": {"vi": "„Chị muốn đi ở đâu và thường xuyên thế nào ạ?“", "tr": "„Nerede ve ne sıklıkla yürüyüş yapmak istiyorsunuz?“", "ar": "«أين وكم مرة تريدين المشي به؟»"}, "„Möchten Sie hohe Schuhe?“": {"vi": "„Chị muốn giày cổ cao không?“", "tr": "„Bilekli ayakkabı mı istersiniz?“", "ar": "«هل تريدين حذاءً عالي الساق؟»"}, "„Möchten Sie lieber die braunen oder die grauen?“": {"vi": "„Chị thích đôi màu nâu hay màu xám hơn?“", "tr": "„Kahverengisini mi yoksa grisini mi tercih edersiniz?“", "ar": "«هل تفضّلين البني أم الرمادي؟»"}, "Ihr zeigt einen Schuh mit Vibram-Sohle.": {"vi": "Các bạn cho xem một đôi giày có đế Vibram.", "tr": "Vibram tabanlı bir ayakkabı gösteriyorsunuz.", "ar": "تُرون حذاءً بنعل Vibram."}, "„Der Schuh hat eine Vibram-Sohle. Die ist besonders rutschfest. Sie stehen auch auf nassen Felsen sicher – und die Sohle hält viele Jahre.“": {"vi": "„Giày có đế Vibram. Đế này đặc biệt chống trượt. Chị đứng vững cả trên đá ướt – và đế bền nhiều năm.“", "tr": "„Ayakkabının Vibram tabanı var. Bu taban özellikle kaymaz. Islak kayalarda bile güvenle durursunuz – ve taban yıllarca dayanır.“", "ar": "«الحذاء له نعل Vibram. وهو مضاد للانزلاق بشكل خاص. تقفين بثبات حتى على الصخور المبتلّة – والنعل يدوم سنوات عديدة.»"}, "„Der hat eine Vibram-Sohle.“": {"vi": "„Giày có đế Vibram.“", "tr": "„Vibram tabanı var.“", "ar": "«له نعل Vibram.»"}, "„Die Marke trage ich auch.“": {"vi": "„Tôi cũng đi nhãn hiệu này.“", "tr": "„Ben de bu markayı giyiyorum.“", "ar": "«أنا أيضًا أرتدي هذه العلامة.»"}, "„Diese Sohle ist besser als die anderen.“": {"vi": "„Đế này tốt hơn những cái khác.“", "tr": "„Bu taban diğerlerinden daha iyi.“", "ar": "«هذا النعل أفضل من غيره.»"}, "Herr Wagner sucht bequeme Schuhe fürs Büro.": {"vi": "Ông Wagner tìm đôi giày thoải mái để đi làm văn phòng.", "tr": "Bay Wagner ofis için rahat ayakkabı arıyor.", "ar": "يبحث السيد Wagner عن حذاء مريح للمكتب."}, "Ihr habt drei Paar ausgewählt.": {"vi": "Các bạn đã chọn ba đôi.", "tr": "Üç çift seçtiniz.", "ar": "اخترتم ثلاثة أزواج."}, "Was macht ihr jetzt?": {"vi": "Bây giờ các bạn làm gì?", "tr": "Şimdi ne yaparsınız?", "ar": "ماذا تفعلون الآن؟"}, "„Probieren Sie sie gerne an. Laufen Sie ruhig ein paar Schritte – dann merken Sie, wie bequem das Fußbett ist.“": {"vi": "„Mời ông thử. Ông cứ đi vài bước – như vậy ông sẽ cảm nhận được lót giày êm thế nào.“", "tr": "„Buyurun deneyin. Birkaç adım atın – böylece tabanlığın ne kadar rahat olduğunu hissedersiniz.“", "ar": "«تفضّل جرّبها. امشِ بضع خطوات – وهكذا تشعر كم هي مريحة بطانة القدم.»"}, "Die Schuhe in der Schachtel lassen und nur beschreiben.": {"vi": "Để giày trong hộp và chỉ mô tả.", "tr": "Ayakkabıları kutuda bırakıp sadece anlatmak.", "ar": "ترك الأحذية في العلبة والاكتفاء بوصفها."}, "Die Schuhe hochhalten und von allen Seiten zeigen.": {"vi": "Giơ giày lên và cho xem từ mọi phía.", "tr": "Ayakkabıları havaya kaldırıp her yönden göstermek.", "ar": "رفع الأحذية وإظهارها من كل الجهات."}, "Alle drei Paare auf einmal hinstellen und sagen: „Ziehen Sie mal alle schnell an.“": {"vi": "Đặt cả ba đôi xuống một lúc và nói: „Ông mang thử nhanh hết đi.“", "tr": "Üç çifti birden koyup şöyle demek: „Hepsini çabucak giyin bakalım.“", "ar": "وضع الأزواج الثلاثة دفعة واحدة وقول: «البس الجميع بسرعة.»"}, "Er läuft in einem Paar hin und her. Er nickt, schaut in den Spiegel und fragt: „Kann ich auch mit Karte zahlen?“": {"vi": "Ông đi qua đi lại với một đôi. Ông gật đầu, nhìn vào gương và hỏi: „Tôi thanh toán bằng thẻ được không?“", "tr": "Bir çiftle ileri geri yürüyor. Başını sallıyor, aynaya bakıyor ve soruyor: „Kartla da ödeyebilir miyim?“", "ar": "يمشي ذهابًا وإيابًا بزوج منها. يومئ برأسه وينظر في المرآة ويسأل: «هل يمكنني الدفع بالبطاقة؟»"}, "Was macht ihr?": {"vi": "Các bạn làm gì?", "tr": "Ne yaparsınız?", "ar": "ماذا تفعلون؟"}, "„Natürlich. Darf ich Ihnen die Schuhe einpacken?“": {"vi": "„Tất nhiên rồi ạ. Tôi gói đôi giày này cho ông nhé?“", "tr": "„Tabii ki. Ayakkabıları sizin için paketleyeyim mi?“", "ar": "«بالطبع. هل أغلّف لك الحذاء؟»"}, "Noch die anderen zwei Paare ausführlich erklären.": {"vi": "Giải thích chi tiết thêm hai đôi còn lại.", "tr": "Diğer iki çifti de ayrıntılı anlatmak.", "ar": "شرح الزوجين الآخرين بالتفصيل أيضًا."}, "„Ja.“ Und dann warten.": {"vi": "„Vâng.“ Rồi chờ đợi.", "tr": "„Evet.“ Ve sonra beklemek.", "ar": "«نعم.» ثم الانتظار."}, "„Greifen Sie sofort zu, morgen ist der Preis weg!“ (Das stimmt nicht.)": {"vi": "„Ông mua ngay đi, mai là hết giá này!“ (Điều này không đúng.)", "tr": "„Hemen alın, yarın bu fiyat kalmaz!“ (Bu doğru değil.)", "ar": "«اشترِ فورًا، غدًا سيختفي هذا السعر!» (وهذا غير صحيح.)"}, "Frau Jansen kommt mit zwei kleinen Kindern herein. Die Kinder sind unruhig.": {"vi": "Bà Jansen bước vào cùng hai đứa trẻ nhỏ. Hai đứa bé đang hiếu động.", "tr": "Bayan Jansen iki küçük çocukla içeri giriyor. Çocuklar huzursuz.", "ar": "تدخل السيدة Jansen ومعها طفلان صغيران. الطفلان لا يهدآن."}, "Sie sucht Kinderschuhe.": {"vi": "Bà tìm giày trẻ em.", "tr": "Çocuk ayakkabısı arıyor.", "ar": "تبحث عن أحذية أطفال."}, "Wie begrüßt ihr sie?": {"vi": "Các bạn chào hỏi thế nào?", "tr": "Nasıl karşılarsınız?", "ar": "كيف ترحّبون بها؟"}, "Blick zur Mutter, dann kurz in die Hocke zu den Kindern: „Guten Tag! Schön, dass Sie da sind – und ihr auch. Da drüben ist unsere Malecke.“": {"vi": "Nhìn người mẹ, rồi ngồi xổm xuống chào các em: „Xin chào! Rất vui vì chị đến – và cả các con nữa. Bên kia là góc tô màu của chúng tôi.“", "tr": "Anneye bakıp sonra çocukların yanına çömelerek: „İyi günler! Geldiğinize sevindik – sizler de. Şurada boyama köşemiz var.“", "ar": "النظر إلى الأم ثم الانحناء قليلًا نحو الطفلين: «مرحبًا! يسعدنا مجيئك – وأنتما أيضًا. هناك ركن التلوين الخاص بنا.»"}, "Die Kinder nicht beachten und nur mit der Mutter sprechen.": {"vi": "Không để ý đến bọn trẻ và chỉ nói chuyện với người mẹ.", "tr": "Çocukları yok sayıp sadece anneyle konuşmak.", "ar": "تجاهل الطفلين والتحدث مع الأم فقط."}, "„Bitte passen Sie auf, dass die Kinder nichts anfassen.“": {"vi": "„Xin chị giữ cho các cháu đừng sờ vào gì.“", "tr": "„Lütfen çocukların hiçbir şeye dokunmamasına dikkat edin.“", "ar": "«من فضلك انتبهي ألّا يلمس الطفلان شيئًا.»"}, "„Hallo ihr zwei!“ – und erst später die Mutter begrüßen.": {"vi": "„Chào hai em!“ – và mãi sau mới chào người mẹ.", "tr": "„Merhaba ikiniz!“ – ve anneyi ancak sonra selamlamak.", "ar": "«مرحبًا بكما!» – وتحية الأم لاحقًا فقط."}, "Sie kauft zwei Paar Kinderschuhe. An der Kasse fragt sie: „Was ist, wenn die Schuhe zu Hause doch drücken?“": {"vi": "Bà mua hai đôi giày trẻ em. Ở quầy thu ngân bà hỏi: „Nếu về nhà giày vẫn chật thì sao?“", "tr": "İki çift çocuk ayakkabısı alıyor. Kasada soruyor: „Ya ayakkabılar evde yine de sıkarsa?“", "ar": "تشتري زوجين من أحذية الأطفال. وعند الصندوق تسأل: «ماذا لو ضغطت الأحذية في البيت رغم ذلك؟»"}, "Was sagt ihr zum Abschied?": {"vi": "Các bạn nói gì khi chào tạm biệt?", "tr": "Veda ederken ne söylersiniz?", "ar": "ماذا تقولون عند الوداع؟"}, "„Sie haben gute Schuhe gewählt, sie haben viel Platz für die Zehen. Wenn sie doch drücken, können Sie sie ungetragen umtauschen. Vielen Dank für Ihren Einkauf und ein schönes Wochenende!“": {"vi": "„Chị đã chọn giày tốt, có nhiều chỗ cho ngón chân. Nếu vẫn chật, chị có thể đổi lại khi chưa đi. Cảm ơn chị đã mua hàng và chúc chị cuối tuần vui vẻ!“", "tr": "„İyi ayakkabılar seçtiniz, ayak parmaklarına bol yer var. Yine de sıkarsa, giyilmemiş olarak değiştirebilirsiniz. Alışverişiniz için çok teşekkürler ve güzel bir hafta sonu dilerim!“", "ar": "«لقد اخترتِ أحذية جيدة، وفيها متسع كبير لأصابع القدم. وإن ضغطت رغم ذلك فيمكنك استبدالها دون أن تُلبسي. شكرًا جزيلًا على مشترياتك وعطلة أسبوع سعيدة!»"}, "„Das ist dann Ihr Problem.“": {"vi": "„Vậy thì đó là chuyện của chị.“", "tr": "„O zaman bu sizin probleminiz.“", "ar": "«حينها تكون هذه مشكلتك.»"}, "„Tschüss.“": {"vi": "„Tạm biệt.“", "tr": "„Hoşça kal.“", "ar": "«إلى اللقاء.»"}, "„Vielen Dank für Ihren Einkauf!“": {"vi": "„Cảm ơn chị đã mua hàng!“", "tr": "„Alışverişiniz için çok teşekkürler!“", "ar": "«شكرًا جزيلًا على مشترياتك!»"}, "Herr Ahmadi fragt nach Laufschuhen der Marke „Sprintex“.": {"vi": "Ông Ahmadi hỏi giày chạy bộ của nhãn hiệu „Sprintex“.", "tr": "Bay Ahmadi „Sprintex“ markalı koşu ayakkabılarını soruyor.", "ar": "يسأل السيد Ahmadi عن أحذية جري من ماركة «Sprintex»."}, "Sprintex führt ihr nicht. Ihr habt aber Laufschuhe der Marke „Ventora“ in gleicher Qualität.": {"vi": "Các bạn không bán Sprintex. Nhưng có giày chạy bộ nhãn hiệu „Ventora“ cùng chất lượng.", "tr": "Sprintex satmıyorsunuz. Ama aynı kalitede „Ventora“ markalı koşu ayakkabılarınız var.", "ar": "لا تبيعون Sprintex. لكن لديكم أحذية جري من ماركة «Ventora» بالجودة نفسها."}, "„Wir haben uns für die Marke Ventora entschieden. Probieren Sie diesen Schuh einmal – er hat für Sie den Vorteil, dass er besonders gut dämpft.“": {"vi": "„Chúng tôi chọn nhãn hiệu Ventora. Ông thử đôi này xem – điểm có lợi cho ông là nó giảm chấn đặc biệt tốt.“", "tr": "„Ventora markasını seçtik. Bu ayakkabıyı bir deneyin – sizin için avantajı, özellikle iyi amortisör yapması.“", "ar": "«اخترنا ماركة Ventora. جرّب هذا الحذاء – ميزته لك أنه يمتص الصدمات بشكل جيد جدًا.»"}, "„Sprintex führen wir leider nicht.“": {"vi": "„Rất tiếc chúng tôi không bán Sprintex.“", "tr": "„Maalesef Sprintex satmıyoruz.“", "ar": "«للأسف لا نبيع Sprintex.»"}, "„Ich kann Ihnen höchstens den hier anbieten, der ist auch ganz gut.“": {"vi": "„Tôi chỉ có thể đề nghị ông đôi này, nó cũng khá tốt.“", "tr": "„Size olsa olsa bunu önerebilirim, o da fena değil.“", "ar": "«لا أستطيع أن أعرض عليك سوى هذا، وهو جيد أيضًا.»"}, "Einen deutlich billigeren Schuh als Ersatz zeigen.": {"vi": "Cho xem một đôi rẻ hơn nhiều để thay thế.", "tr": "Yerine belirgin şekilde daha ucuz bir ayakkabı göstermek.", "ar": "عرض حذاء أرخص بكثير كبديل."}, "Er probiert den Schuh. Dann sagt er: „Ich muss noch einmal darüber schlafen.“ Er schaut zur Tür.": {"vi": "Ông thử giày. Rồi nói: „Tôi phải suy nghĩ thêm đã.“ Ông nhìn ra cửa.", "tr": "Ayakkabıyı deniyor. Sonra diyor ki: „Bir de üzerinde uyumam lazım.“ Kapıya bakıyor.", "ar": "يجرّب الحذاء. ثم يقول: «يجب أن أنام على هذا الأمر.» وينظر نحو الباب."}, "„Das verstehe ich gut. Ich schreibe Ihnen die Modellnummer auf – dann finden Sie den Schuh sofort wieder.“": {"vi": "„Tôi hiểu rõ ạ. Tôi ghi số mẫu cho ông – như vậy ông sẽ tìm lại đôi giày ngay.“", "tr": "„Çok iyi anlıyorum. Model numarasını size yazayım – böylece ayakkabıyı hemen yeniden bulursunuz.“", "ar": "«أتفهّم ذلك جيدًا. سأكتب لك رقم الموديل – وهكذا تجد الحذاء فورًا.»"}, "Noch fünf Argumente nennen, damit er doch kauft.": {"vi": "Nêu thêm năm lập luận nữa để ông mua bằng được.", "tr": "Yine de alsın diye beş argüman daha saymak.", "ar": "ذكر خمس حجج أخرى كي يشتري في النهاية."}, "„Dann haben Sie mir ja umsonst meine Zeit gestohlen.“": {"vi": "„Vậy là ông đã lấy trộm thời gian của tôi vô ích.“", "tr": "„O zaman boşuna vaktimi çalmışsınız.“", "ar": "«إذًا لقد سرقتَ وقتي بلا فائدة.»"}, "„Welche Bedenken haben Sie denn noch?“ – und dann immer weiter nachbohren.": {"vi": "„Ông còn băn khoăn điều gì nữa ạ?“ – rồi cứ gặng hỏi mãi.", "tr": "„Başka ne gibi endişeleriniz var?“ – ve sonra sürekli üstelemek.", "ar": "«ما هي مخاوفك الأخرى؟» – ثم الاستمرار في الإلحاح."}, "Frau Petrović sucht Schuhe für eine Hochzeit.": {"vi": "Bà Petrović tìm giày để đi dự đám cưới.", "tr": "Bayan Petrović bir düğün için ayakkabı arıyor.", "ar": "تبحث السيدة Petrović عن حذاء لحفل زفاف."}, "Sie sagt: „So wie die im Schaufenster, aber irgendwie anders.“": {"vi": "Bà nói: „Như đôi trong tủ kính, nhưng hơi khác một chút.“", "tr": "Diyor ki: „Vitrindekiler gibi, ama bir şekilde farklı.“", "ar": "تقول: «مثل الذي في الواجهة، لكن مختلف قليلًا بطريقة ما.»"}, "Wie ermittelt ihr den Bedarf?": {"vi": "Các bạn tìm hiểu nhu cầu thế nào?", "tr": "İhtiyacı nasıl tespit edersiniz?", "ar": "كيف تتعرّفون على الحاجة؟"}, "Ein Paar zeigen: „Ich zeige Ihnen einmal diese hier. Wie gefallen sie Ihnen? Was müsste anders sein?“": {"vi": "Cho xem một đôi: „Tôi xin cho chị xem đôi này. Chị thấy thế nào? Cần thay đổi điểm nào?“", "tr": "Bir çift göstermek: „Size şunları göstereyim. Nasıl buldunuz? Neyin farklı olması gerekirdi?“", "ar": "عرض زوج واحد: «سأُريكِ هذا الزوج. كيف تجدينه؟ ما الذي يجب أن يكون مختلفًا؟»"}, "„Dann wissen Sie ja selbst nicht, was Sie wollen.“": {"vi": "„Vậy là chính chị cũng không biết mình muốn gì.“", "tr": "„O zaman siz de ne istediğinizi bilmiyorsunuz.“", "ar": "«إذًا أنتِ نفسك لا تعرفين ما تريدين.»"}, "Zehn Fragen hintereinander stellen.": {"vi": "Hỏi liên tiếp mười câu.", "tr": "Art arda on soru sormak.", "ar": "طرح عشرة أسئلة متتالية."}, "„Wie viel wollen Sie ausgeben?“": {"vi": "„Chị muốn chi bao nhiêu ạ?“", "tr": "„Ne kadar harcamak istiyorsunuz?“", "ar": "«كم تريدين أن تدفعي؟»"}, "Sie sagt: „Ich brauche eigentlich was Praktisches.“ Dann nimmt sie immer wieder die auffälligen roten Pumps in die Hand.": {"vi": "Bà nói: „Thật ra tôi cần thứ gì thực dụng.“ Rồi bà cứ liên tục cầm đôi giày cao gót đỏ nổi bật lên xem.", "tr": "Diyor ki: „Aslında pratik bir şeye ihtiyacım var.“ Sonra sürekli göze çarpan kırmızı topuklu ayakkabıları eline alıyor.", "ar": "تقول: «في الواقع أحتاج إلى شيء عملي.» ثم تعود مرارًا إلى حمل الحذاء الأحمر ذي الكعب العالي اللافت."}, "„Dieses Modell fällt sofort auf – und die Verarbeitung sieht man auf den ersten Blick. Der Absatz ist breit, damit laufen Sie den ganzen Abend sicher.“": {"vi": "„Mẫu này nổi bật ngay – và đường may thì nhìn là thấy ngay chất lượng. Gót rộng nên chị đi cả buổi tối vẫn vững.“", "tr": "„Bu model hemen göze çarpıyor – ve işçilik ilk bakışta görülüyor. Topuk geniş, yani bütün akşam güvenle yürürsünüz.“", "ar": "«هذا الموديل يلفت النظر فورًا – وتُرى جودة الصنعة من النظرة الأولى. الكعب عريض، فتمشين به طوال المساء بثبات.»"}, "„Mit denen sehen alle, dass Sie sich etwas leisten können.“": {"vi": "„Đi đôi này ai cũng thấy chị đủ khả năng mua sắm.“", "tr": "„Bunlarla herkes bir şeyler karşılayabildiğinizi görür.“", "ar": "«بهذه يرى الجميع أنك تستطيعين تحمّل ثمن أشياء فاخرة.»"}, "Nur flache, praktische Schuhe zeigen.": {"vi": "Chỉ cho xem giày đế bằng, thực dụng.", "tr": "Sadece düz, pratik ayakkabılar göstermek.", "ar": "عرض الأحذية المسطّحة العملية فقط."}, "„Die roten sind eigentlich unpraktisch.“": {"vi": "„Đôi màu đỏ thật ra không thực dụng.“", "tr": "„Kırmızılar aslında pratik değil.“", "ar": "«الأحمر في الواقع غير عملي.»"}, "Herr Krüger hält zwei Paar Hausschuhe in der Hand.": {"vi": "Ông Krüger cầm hai đôi dép đi trong nhà.", "tr": "Bay Krüger elinde iki çift ev terliği tutuyor.", "ar": "يحمل السيد Krüger زوجين من خفّ البيت."}, "Filz für 39 Euro, Lammfell für 54 Euro. Er schaut unsicher hin und her.": {"vi": "Loại nỉ giá 39 euro, loại lông cừu giá 54 euro. Ông phân vân nhìn qua nhìn lại.", "tr": "Keçe olan 39 Euro, kuzu postu olan 54 Euro. Kararsızca bir ona bir buna bakıyor.", "ar": "الصوف المضغوط بـ 39 يورو وجلد الخروف بـ 54 يورو. ينظر بتردد من هذا إلى ذاك."}, "„Fühlen Sie einmal das Lammfell. Es hält die Füße warm und trocken – und kostet nur 15 Euro mehr.“": {"vi": "„Ông sờ thử lông cừu xem. Nó giữ chân ấm và khô – mà chỉ đắt hơn 15 euro.“", "tr": "„Kuzu postunu bir hissedin. Ayakları sıcak ve kuru tutar – ve sadece 15 Euro fazla.“", "ar": "«المس جلد الخروف. إنه يُبقي القدمين دافئتين وجافتين – ولا يزيد سعره إلا 15 يورو.»"}, "„Die teuren sind halt teurer.“": {"vi": "„Loại đắt thì đắt hơn thôi.“", "tr": "„Pahalı olanlar işte daha pahalı.“", "ar": "«الغالية غالية أكثر، هذا كل شيء.»"}, "„Die einen kosten 39, die anderen 54 Euro.“": {"vi": "„Loại này 39, loại kia 54 euro.“", "tr": "„Birisi 39, diğeri 54 Euro.“", "ar": "«هذا بـ 39 وذاك بـ 54 يورو.»"}, "„Lammfell, warm, 54 Euro.“": {"vi": "„Lông cừu, ấm, 54 euro.“", "tr": "„Kuzu postu, sıcak, 54 Euro.“", "ar": "«جلد خروف، دافئ، 54 يورو.»"}, "Er nimmt das Lammfell: „Können Sie mir die schön einpacken? Die sind ein Geschenk.“": {"vi": "Ông chọn loại lông cừu: „Bạn gói đẹp giúp tôi được không? Đây là quà tặng.“", "tr": "Kuzu postunu alıyor: „Güzelce paketleyebilir misiniz? Hediye olacak.“", "ar": "يختار جلد الخروف: «هل تستطيعون تغليفها بشكل جميل؟ إنها هدية.»"}, "„Sehr gern, die Geschenkverpackung ist bei uns ein Service. Und falls die Größe nicht passt, kann man sie umtauschen.“": {"vi": "„Rất sẵn lòng, gói quà là dịch vụ của chúng tôi. Và nếu không vừa cỡ, ông có thể đổi lại.“", "tr": "„Memnuniyetle, hediye paketi bizim hizmetimiz. Ve beden uymazsa değiştirilebilir.“", "ar": "«بكل سرور، تغليف الهدايا خدمة لدينا. وإذا لم يناسب المقاس فيمكن استبدالها.»"}, "„Einpacken machen wir nicht.“": {"vi": "„Chúng tôi không gói quà.“", "tr": "„Paketleme yapmıyoruz.“", "ar": "«نحن لا نغلّف.»"}, "„Papier liegt da vorne, das können Sie selbst.“": {"vi": "„Giấy ở phía trước đó, ông tự làm được.“", "tr": "„Kâğıt şurada önde, bunu kendiniz yapabilirsiniz.“", "ar": "«الورق هناك في الأمام، يمكنك فعل ذلك بنفسك.»"}, "„Das kostet 5 Euro extra.“": {"vi": "„Cái đó tính thêm 5 euro.“", "tr": "„Bunun için 5 Euro ek ücret var.“", "ar": "«هذا يكلّف 5 يورو إضافية.»"}, "Frau Albrecht fragt euren Kollegen Tim nach Schuhcreme.": {"vi": "Bà Albrecht hỏi đồng nghiệp Tim của các bạn về xi đánh giày.", "tr": "Bayan Albrecht meslektaşınız Tim'e ayakkabı boyasını soruyor.", "ar": "تسأل السيدة Albrecht زميلكم Tim عن ملمّع الأحذية."}, "Tim sagt: „Da bin ich nicht zuständig.“": {"vi": "Tim nói: „Cái đó không thuộc phần của tôi.“", "tr": "Tim diyor ki: „Bu benim sorumluluğumda değil.“", "ar": "يقول Tim: «هذا ليس من اختصاصي.»"}, "Wie hätte Tim es besser gesagt?": {"vi": "Tim lẽ ra nên nói thế nào cho tốt hơn?", "tr": "Tim bunu nasıl daha iyi söyleyebilirdi?", "ar": "كيف كان يمكن لـ Tim أن يقولها بشكل أفضل؟"}, "„Ich stelle Ihnen gleich die zuständige Kollegin vor.“": {"vi": "„Tôi xin giới thiệu ngay đồng nghiệp phụ trách với chị.“", "tr": "„Sizi hemen sorumlu meslektaşımla tanıştırayım.“", "ar": "«سأعرّفك حالًا على الزميلة المسؤولة.»"}, "„Keine Ahnung, fragen Sie wen anders.“": {"vi": "„Không biết, chị hỏi người khác đi.“", "tr": "„Bilmiyorum, başka birine sorun.“", "ar": "«لا أعرف، اسألي شخصًا آخر.»"}, "„Das weiß ich nicht genau.“": {"vi": "„Tôi không biết chính xác.“", "tr": "„Tam olarak bilmiyorum.“", "ar": "«لا أعرف بالضبط.»"}, "„Ich kann ja mal versuchen, das herauszufinden.“": {"vi": "„Tôi có thể thử tìm hiểu xem.“", "tr": "„Öğrenmeyi deneyebilirim.“", "ar": "«يمكنني أن أحاول معرفة ذلك.»"}, "Später sagt Tim zu einem Kunden: „Man kann den Schuh auch in der Waschmaschine waschen.“": {"vi": "Sau đó Tim nói với một khách: „Người ta cũng có thể giặt giày này trong máy giặt.“", "tr": "Daha sonra Tim bir müşteriye şöyle diyor: „Bu ayakkabı çamaşır makinesinde de yıkanabilir.“", "ar": "لاحقًا يقول Tim لأحد العملاء: «يمكن للمرء أن يغسل الحذاء في الغسّالة أيضًا.»"}, "Was ist hier zu verbessern?": {"vi": "Cần cải thiện điều gì ở đây?", "tr": "Burada neyin düzeltilmesi gerekir?", "ar": "ما الذي يجب تحسينه هنا؟"}, "Sie-Stil: „Sie können den Schuh auch in der Waschmaschine waschen.“": {"vi": "Cách xưng hô „Sie“: „Ông/bà cũng có thể giặt giày này trong máy giặt.“", "tr": "Sie hitabı: „Bu ayakkabıyı çamaşır makinesinde de yıkayabilirsiniz.“", "ar": "أسلوب „Sie“: «يمكنك أن تغسل الحذاء في الغسّالة أيضًا.»"}, "Nichts, der Satz ist perfekt.": {"vi": "Không cần gì, câu này hoàn hảo rồi.", "tr": "Hiçbir şey, cümle mükemmel.", "ar": "لا شيء، الجملة مثالية."}, "Tim soll lauter sprechen.": {"vi": "Tim nên nói to hơn.", "tr": "Tim daha yüksek sesle konuşmalı.", "ar": "يجب أن يتكلم Tim بصوت أعلى."}, "„Der Schuh ist waschbar.“": {"vi": "„Giày này giặt được.“", "tr": "„Ayakkabı yıkanabilir.“", "ar": "«الحذاء قابل للغسل.»"}, "Frau Berger sucht Sneaker als Geschenk für ihre Tochter (15), Größe 39.": {"vi": "Bà Berger tìm giày thể thao làm quà cho con gái (15 tuổi), cỡ 39.", "tr": "Bayan Berger kızı (15) için hediye olarak spor ayakkabı arıyor, 39 numara.", "ar": "تبحث السيدة Berger عن حذاء رياضي كهدية لابنتها (15 سنة)، مقاس 39."}, "Ihr wisst schon: Die Tochter trägt gern Sportliches.": {"vi": "Các bạn đã biết: Cô con gái thích đồ thể thao.", "tr": "Şunu zaten biliyorsunuz: Kızı spor tarzı giymeyi seviyor.", "ar": "أنتم تعرفون بالفعل: الابنة تحب الملابس الرياضية."}, "Wie engt ihr die Auswahl ein?": {"vi": "Các bạn thu hẹp lựa chọn thế nào?", "tr": "Seçimi nasıl daraltırsınız?", "ar": "كيف تضيّقون الاختيار؟"}, "„Trägt Ihre Tochter eher helle oder dunkle Farben?“": {"vi": "„Con gái chị thường mặc màu sáng hay màu tối hơn ạ?“", "tr": "„Kızınız daha çok açık mı yoksa koyu renkler mi giyer?“", "ar": "«هل ترتدي ابنتك الألوان الفاتحة أم الداكنة غالبًا؟»"}, "„Sie wollen doch bestimmt keine Ware aus
