<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16263A">
<title>Berichtsheft digital</title>
<style>
:root{--ink:#16263A;--paper:#EEF2F6;--card:#fff;--line:#C6D0DB;--blue:#2B5C91;--blue2:#1F4770;--mark:#FFE066;--ok:#1B7A53;--bad:#B3362E;--r:10px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 "Segoe UI",system-ui,-apple-system,"Noto Sans","Noto Sans Arabic","Noto Sans Ethiopic",sans-serif;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
header.top{background:var(--ink);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 12px}
.wrap{max-width:780px;margin:0 auto}
h1{font:700 27px/1.1 Georgia,"Noto Serif",serif;margin:0}
.sub{margin:4px 0 12px;opacity:.85;font-size:15px}
.langs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.langs button{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:20px;border:1.5px solid #7E93AB;background:transparent;color:#fff;font:inherit;font-size:15px;cursor:pointer}
.langs button[aria-pressed=true]{background:var(--mark);color:var(--ink);border-color:var(--mark);font-weight:700}
main.wrap{padding:14px 12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 0 14px}
.card h2{font:700 19px/1.2 Georgia,"Noto Serif",serif;margin:0 0 10px}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:10px 11px;min-height:44px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
.seg{display:flex;gap:8px}
.seg button{flex:1}
.btn{min-height:44px;padding:0 14px;border-radius:8px;border:1.5px solid var(--blue);background:#fff;color:var(--blue2);font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:#EAF1F8}
.btn.pri{background:var(--blue);color:#fff}
.btn.pri:hover{background:var(--blue2)}
.btn[aria-pressed=true]{background:var(--blue);color:#fff}
.btn:disabled{background:#D5DBE2;border-color:#D5DBE2;color:#7A8794;cursor:not-allowed}
.btn.sm{min-height:40px;font-size:14px;padding:0 11px}
.weekline{margin:10px 0 0;padding:9px 12px;background:#EAF1F8;border-inline-start:5px solid var(--blue);border-radius:6px;font-weight:600}
.warn{margin:8px 0 0;padding:9px 12px;background:var(--mark);border-radius:6px;font-size:14px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.day{display:grid;grid-template-columns:38px 1fr;padding:0;overflow:hidden}
.strip{background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font:700 15px Georgia,"Noto Serif",serif;letter-spacing:.5px}
.strip span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.day.done .strip{background:var(--ok)}
.day .body{padding:12px 12px 14px}
.day h3{margin:0 0 8px;font:700 18px Georgia,"Noto Serif",serif}
.day h3 small{font:400 14px "Segoe UI",system-ui,sans-serif;opacity:.75;margin-inline-start:6px}
.quick{display:flex;flex-wrap:wrap;gap:8px}
.ruled{line-height:28px;padding-top:4px;padding-bottom:4px;background-image:repeating-linear-gradient(transparent,transparent 27px,#DCE4EC 27px,#DCE4EC 28px);background-attachment:local}
.meta{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-top:8px}
.meta .hrs{width:92px}
.meta .hrs label{margin-top:0}
.cnt{font-size:13px;opacity:.7;margin-inline-start:auto}
details.ai{margin-top:12px;border:1.5px dashed var(--blue);border-radius:8px;padding:8px 10px;background:#F6FAFE}
details.ai summary{cursor:pointer;font-weight:600;color:var(--blue2);min-height:32px;display:flex;align-items:center}
.prompt{font-size:14px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0;white-space:pre-wrap;word-break:break-word}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{font-size:14px;opacity:.8;margin:2px 0 6px}
.err{font-size:14px;color:var(--bad)}
#missL{list-style:none;margin:0;padding:0}
#missL li{margin:0 0 6px}
#missL button{width:100%;text-align:start;min-height:44px;padding:8px 12px;border:1.5px solid var(--mark);background:#FFF9D6;border-radius:8px;font:inherit;cursor:pointer}
.okline{color:var(--ok);font-weight:700}
#bar{position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:2px solid var(--ink);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:20}
#bar .in{max-width:780px;margin:0 auto;display:flex;gap:10px;align-items:center}
#barTxt{flex:1;font-size:14px;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#barTxt.ok{color:var(--ok);font-weight:700}
#bar .btn{flex:0 0 auto;min-width:130px}
dialog{width:min(640px,94vw);max-height:88vh;border:none;border-radius:14px;padding:0;color:var(--ink)}
dialog::backdrop{background:rgba(22,38,58,.55)}
.dh{position:sticky;top:0;background:#fff;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;z-index:1}
.dh h2{margin:0;flex:1;font:700 18px Georgia,"Noto Serif",serif}
.dbody{padding:10px 14px 18px;overflow:auto;max-height:calc(88vh - 70px)}
dialog details{border:1px solid var(--line);border-radius:8px;margin:8px 0;padding:0 10px}
dialog summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.chips{display:flex;flex-direction:column;gap:6px;padding:0 0 10px}
.chip{display:flex;gap:6px}
.chip .p{flex:1;text-align:start;min-height:44px;padding:8px 10px;border:1.5px solid var(--blue);background:#fff;border-radius:8px;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
.chip .p.ok{background:#D7F0E2;border-color:var(--ok)}
.chip .q{flex:0 0 44px;border:1.5px solid var(--line);background:#fff;border-radius:8px;font:inherit;font-weight:700;color:var(--blue2);cursor:pointer}
#toast{position:fixed;inset-inline:12px;bottom:calc(88px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:var(--ink);color:#fff;padding:11px 14px;border-radius:8px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
.lk{display:grid;gap:8px;margin-top:8px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<div id="bar"><div class="in"><div id="barTxt" aria-live="polite"></div><button class="btn pri" id="pdfBtn" data-act="pdf" disabled></button></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg" aria-labelledby="dlgT">
  <div class="dh"><h2 id="dlgT"></h2><button class="btn pri sm" data-act="close" id="dlgX"></button></div>
  <div class="dbody">
    <label for="dlgB" id="dlgBL"></label><select id="dlgB"></select>
    <p class="hint" id="dlgH"></p>
    <div id="dlgL"></div>
  </div>
</dialog>

/* ============ Hilfsfunktionen ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmt = d => pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();
function parseISO(s){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||''); return m ? new Date(+m[1],+m[2]-1,+m[3]) : null; }
function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
function addDays(d,n){ return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n); }
function isoWeek(mon){ // ISO 8601: Woche mit dem Donnerstag bestimmt das Jahr
  const thu=addDays(mon,3), jan4=new Date(thu.getFullYear(),0,4);
  return 1+Math.round(((thu-jan4)/86400000-3+((jan4.getDay()+6)%7))/7);
}
function clean(s){
  return String(s||'').replace(/\r/g,'').replace(/[\u2018\u2019\u201A]/g,"'").replace(/[\u201C\u201D\u201E]/g,'"')
   .replace(/[\u2022\u25CF\u00B7]/g,'-').replace(/\u2026/g,'...').replace(/[\u2013\u2014\u2212]/g,'-')
   .replace(/\u20AC/g,'EUR').replace(/[\u00A0\t]/g,' ');
}
const hasForeign = s => /[^\n\x20-\x7E\u00A1-\u00FF]/.test(clean(s));
const validHours = h => /^\d{1,2}([.,]\d{1,2})?$/.test(String(h||'').trim());

/* ============ Zustand ============ */
const DEF = {p:{name:'',year:'',area:'Verkäufer/in',region:'hb',lang:'de',branch:'',date:''},weeks:{}};
let S;
try{ S = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ S = null; }
if(!S || !S.p) S = JSON.parse(JSON.stringify(DEF));
S.p = Object.assign({}, DEF.p, S.p); S.weeks = S.weeks || {};
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
(function applyUrl(){ // Klassenlink: ?region=ni&lang=ar&jahr=1&branche=food&bereich=...
  const q=new URLSearchParams(location.search);
  if(['hb','ni'].includes(q.get('region'))) S.p.region=q.get('region');
  if(I18N[q.get('lang')]) S.p.lang=q.get('lang');
  if(['1','2','3'].includes(q.get('jahr'))) S.p.year=q.get('jahr');
  if(BR[q.get('branche')]) S.p.branch=q.get('branche');
  if(q.get('bereich')) S.p.area=q.get('bereich').slice(0,60);
  if(!S.p.date) S.p.date=iso(new Date());
  save();
})();
const P = S.p;
const T = (k,v) => { let s=(I18N[P.lang]&&I18N[P.lang][k])||I18N.de[k]||k; if(v) for(const x in v) s=s.replace('{'+x+'}',v[x]); return s; };
const monOf = () => { const d=parseISO(P.date); return d?mondayOf(d):null; };
const wkKey = () => { const m=monOf(); return m?iso(m):'_'; };
const newWeek = () => ({days:Array.from({length:7},(_,k)=>({t:'',h:k<5?'8':'',n:''})),on:[false,false],i:{t:'',h:''},s:{t:'',h:''}});
const dayActive = (w,i) => i<5 || !!w.on[i-5];
const lastDay = w => w.on[1]?6:(w.on[0]?5:4);
function W(){ const k=wkKey(); let w=S.weeks[k]; if(!w) w=S.weeks[k]=newWeek(); while(w.days.length<7) w.days.push({t:'',h:'',n:''}); if(!w.on) w.on=[false,false]; return w; }
const weekHasContent = w => w && (w.days.some(d=>d.t||d.n) || w.i.t || w.s.t);

/* ============ Rendering ============ */
function localDay(i){
  const m=monOf(); if(!m||P.lang==='de') return '';
  try{ if(!Intl.DateTimeFormat.supportedLocalesOf([P.lang]).length) return '';
       return new Intl.DateTimeFormat(P.lang,{weekday:'long'}).format(addDays(m,i)); }catch(e){ return ''; }
}
const aiText = i => AI_PROMPT.replace('[TEXT]', (W().days[i].n||'').trim() || '[TEXT]');

      <button type="button" class="btn" data-act="none" data-k="${key}">${esc(T('none'))}</button></div></section>`;

function classLink(){
  const g=k=>{const e=document.querySelector(`[data-lk="${k}"]`); return e?e.value:'';};
  const q=new URLSearchParams(); const r=g('region')||'hb', l=g('lang')||'de';
  q.set('region',r); q.set('lang',l); if(g('jahr')) q.set('jahr',g('jahr')); if(g('branche')) q.set('branche',g('branche'));
  return location.origin+location.pathname+'?'+q.toString();
}

/* ============ Prüfung: Was fehlt noch? ============ */
function validate(){
  const w=W(), m=[], dayOk=[];
  if(!P.name.trim()) m.push(['f-name',T('mName')]);
  if(!P.year) m.push(['f-year',T('mYear')]);
  if(!P.area.trim()) m.push(['f-area',T('mArea')]);
  if(!parseISO(P.date)) m.push(['f-date',T('mDate')]);
  DAYS.forEach((dn,i)=>{
    if(!dayActive(w,i)) return;
    const d=w.days[i]; let ok=true;
    if(!clean(d.t).trim()){ m.push([`d${i}-t`,T('mText',{d:dn})]); ok=false; }
    else if(hasForeign(d.t)){ m.push([`d${i}-t`,T('mLatin',{d:dn})]); ok=false; }
    if(!validHours(d.h)){ m.push([`d${i}-h`,T('mHours',{d:dn})]); ok=false; }
    dayOk[i]=ok;
  });
  if(!clean(w.i.t).trim()) m.push(['i-t',T('mInst')]); else if(hasForeign(w.i.t)) m.push(['i-t',T('mLatin',{d:T('inst')})]);
  if(!clean(w.s.t).trim()) m.push(['s-t',T('mSch')]); else if(hasForeign(w.s.t)) m.push(['s-t',T('mLatin',{d:T('school')})]);
  ['i','s'].forEach(k=>{ if(w[k].h && !validHours(w[k].h)) m.push([`${k}-h`,T('mHours',{d:k==='i'?T('inst'):T('school')})]); });
  return {m,dayOk};
}
function updateMissing(){
  const {m,dayOk}=validate();
  dayOk.forEach((ok,i)=>{ const el=$('#day'+i); if(el) el.classList.toggle('done',ok); });
  const L=$('#missL');
  if(L) L.innerHTML = m.length ? m.map(([id,msg])=>`<li><button type="button" data-act="goto" data-id="${id}">${esc(msg)}</button></li>`).join('') : `<li class="okline">${esc(T('ready'))}</li>`;
  const bt=$('#barTxt'); bt.classList.toggle('ok',!m.length);
  bt.textContent = m.length ? `${T('miss')} (${m.length}): ${m[0][1]}` : T('ready');
  $('#pdfBtn').disabled = m.length>0;
}

/* ============ Eingaben & Klicks ============ */
function setF(f,v){
  const a=f.split('.');
  if(a[0]==='p') P[a[1]]=v;
  else{ const w=W(); if(a[0]==='d') w.days[+a[1]][a[2]]=v; else w[a[0]][a[1]]=v; }
  save();
}
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.lk){ const o=$('#lkOut'); if(o) o.value=classLink(); return; }
  if(el.id==='dlgB'){ P.branch=el.value; save(); const fb=$('#f-branch'); if(fb) fb.value=P.branch; fillDlg(); return; }
  const f=el.dataset&&el.dataset.f; if(!f) return;
  if(f==='p.date'){ setF(f,el.value); render(); return; }
  setF(f,el.value);
  const a=f.split('.');
  if(a[0]==='d'&&a[2]==='t'){ const c=$('#cnt'+a[1]); if(c) c.textContent=el.value.length+'/'+MAXLEN.d; }
  if(a[0]==='d'&&a[2]==='n'){ const p=$('#ai'+a[1]); if(p) p.textContent=aiText(+a[1]); }
  if(f==='p.branch'&&$('#dlg').open) fillDlg();
  updateMissing();
});
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2400); }
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); try{document.execCommand('copy');}catch(_){} ta.remove(); }
  toast(T('copied'));
}
function setDayText(i,txt){ const d=W().days[i]; d.t=txt; save(); const ta=$('#d'+i+'-t'); if(ta) ta.value=txt; const c=$('#cnt'+i); if(c) c.textContent=txt.length+'/'+MAXLEN.d; updateMissing(); }
let dlgDay=0, curList={};
function fillDlg(){
  $('#dlgT').textContent=T('phrFor',{d:DAYS[dlgDay]});
  $('#dlgX').textContent=T('close'); $('#dlgBL').textContent=T('branch'); $('#dlgH').textContent=T('tap');
  $('#dlgB').innerHTML=`<option value="">${esc(T('general'))}</option>`+Object.entries(BR).map(([k,v])=>`<option value="${k}" ${P.branch===k?'selected':''}>${esc(v)}</option>`).join('');
  const open=$('#dlgL').querySelector('details[open]'); const openKey=open?open.dataset.c:'c1';
  curList={};
  $('#dlgL').innerHTML=Object.keys(CAT).map(c=>{
    const list=[...(P.branch&&PH[P.branch]?PH[P.branch][c]:[]),...PH.all[c]]; curList[c]=list;
    return `<details data-c="${c}" ${c===openKey?'open':''}><summary>${esc(CAT[c])}</summary><div class="chips">${list.map((s,k)=>`<div class="chip"><button type="button" class="p" data-act="ins" data-c="${c}" data-k="${k}" lang="de">${esc(s)}</button>${P.lang!=='de'?`<button type="button" class="q" data-act="ptr" data-c="${c}" data-k="${k}" aria-label="${esc(T('tr'))}" title="${esc(T('tr'))}">?</button>`:''}</div>`).join('')}</div></details>`;
  }).join('');
}
function gTranslate(text,sl,tl){ window.open('https://translate.google.com/?sl='+sl+'&tl='+tl+'&op=translate&text='+encodeURIComponent(text.slice(0,1500)),'_blank','noopener'); }

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, i=+b.dataset.i;
  if(act==='lang'){ P.lang=b.dataset.v; save(); render(); if($('#dlg').open) fillDlg(); }
  else if(act==='region'){ P.region=b.dataset.v; save(); document.querySelectorAll('[data-act=region]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.v===P.region)); }
  else if(act==='quick'){
    const d=W().days[i]; const txt=QT[b.dataset.k];
    if(d.t.trim()&&d.t.trim()!==txt&&!confirm(T('replaceT'))) return;
    setDayText(i,txt);
  }
  else if(act==='trans'){ const n=(W().days[i].n||'').trim(); if(!n){ toast(T('needNote')); $('#d'+i+'-n').focus(); return; } gTranslate(n,'auto','de'); }
  else if(act==='copyai'){ copyText(aiText(i)); }
  else if(act==='phr'){ dlgDay=i; fillDlg(); $('#dlg').showModal(); }
  else if(act==='close'){ $('#dlg').close(); }
  else if(act==='ins'){
    const ph=curList[b.dataset.c][+b.dataset.k], d=W().days[dlgDay];
    const cur=d.t.replace(/\s+$/,''); const nt=cur?cur+'\n- '+ph:'- '+ph;
    if(nt.length>MAXLEN.d){ toast(T('tooLong',{n:MAXLEN.d})); return; }
    setDayText(dlgDay,nt); b.classList.add('ok'); setTimeout(()=>b.classList.remove('ok'),700);
  }
  else if(act==='ptr'){ gTranslate(curList[b.dataset.c][+b.dataset.k],'de',P.lang); }
  else if(act==='none'){ const k=b.dataset.k; W()[k].t=NONE_TXT; save(); const ta=$('#'+k+'-t'); if(ta) ta.value=NONE_TXT; updateMissing(); }
  else if(act==='prev'){
    const cur=wkKey(); const keys=Object.keys(S.weeks).filter(k=>k<cur&&weekHasContent(S.weeks[k])).sort();
    if(!keys.length){ toast(T('noPrev')); return; }
    if(weekHasContent(W())&&!confirm(T('replaceT'))) return;
    const src=S.weeks[keys[keys.length-1]], w=W();
    w.days=src.days.map(d=>({t:d.t,h:d.h,n:d.n})); w.on=(src.on||[false,false]).slice(); while(w.days.length<7) w.days.push({t:'',h:'',n:''}); w.i={t:src.i.t,h:src.i.h};
    save(); render(); toast(T('prevDone'));
  }
  else if(act==='addday'){ W().on[i-5]=true; save(); render(); const c=$('#day'+i); if(c) c.scrollIntoView({block:'start',behavior:'smooth'}); }
  else if(act==='rmday'){ const w=W(); if(w.days[i].t&&!confirm(T('clearQ'))) return; w.on[i-5]=false; w.days[i]={t:'',h:'',n:''}; save(); render(); }
  else if(act==='clear'){ if(!confirm(T('clearQ'))) return; S.weeks[wkKey()]=newWeek(); save(); render(); }
  else if(act==='goto'){ const el=document.getElementById(b.dataset.id); if(el){ el.scrollIntoView({block:'center',behavior:'smooth'}); el.focus({preventScroll:true}); } }
  else if(act==='copylink'){ copyText($('#lkOut').value); }
  else if(act==='pdf'){ if(!b.disabled) makePdf(); }
});

/* ============ PDF im Layout des IHK-Ausbildungsnachweises (wöchentlich) ============ */
function fitText(doc,txt,x,y,w,h,maxFs,minFs){
  let fs=maxFs, lines;
  for(;fs>=minFs;fs-=0.5){ doc.setFontSize(fs); lines=doc.splitTextToSize(txt,w); if(lines.length*fs*0.3528*1.2<=h) break; }
  if(fs<minFs){ fs=minFs; doc.setFontSize(fs); lines=doc.splitTextToSize(txt,w); }
  const lh=fs*0.3528*1.2, maxL=Math.max(1,Math.floor(h/lh));
  if(lines.length>maxL){ lines=lines.slice(0,maxL); lines[maxL-1]=lines[maxL-1].replace(/.{0,3}$/,'...'); }
  lines.forEach((ln,k)=>doc.text(ln,x,y+fs*0.3528*0.95+k*lh));
}
function drawLogo(doc){
  if(LOGO){ try{ const pr=doc.getImageProperties(LOGO), w=52; doc.addImage(LOGO,'PNG',195-w,11,w,w*pr.height/pr.width); return; }catch(e){} }
  doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('Handelskammer Bremen',195,17,{align:'right'});
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5); doc.text('IHK für Bremen und Bremerhaven',195,22,{align:'right'});
}
function buildPdf(doc,D){
  const L=15,R=195,W=180,RH=15,TW=W-8-22,xT=L+8,xH=L+8+TW;
  doc.setLineWidth(0.3); doc.setDrawColor(0); doc.setTextColor(0);
  if(D.region==='hb') drawLogo(doc);
  doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.text('Ausbildungsnachweis (Berichtsheft)',L,22);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.text('- wöchentlich -',L,28.5);
  doc.setFontSize(7.5); doc.setTextColor(110); doc.text('Stand: Juni 2017',L,33); doc.setTextColor(0);
  const fld=(label,val,x,y,w)=>{
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.text(label,x,y);
    const lw=doc.getTextWidth(label)+2; doc.setLineWidth(0.2); doc.line(x+lw,y+1.3,x+w,y+1.3); doc.setLineWidth(0.3);
    doc.setFont('helvetica','bold'); doc.setFontSize(10); fitText(doc,clean(val).replace(/\n/g,' '),x+lw+1,y-3.2,w-lw-1,4.5,10,7);
  };
  fld('Name des/der Auszubildenden:',D.name,L,42,W);
  fld('Ausbildungsjahr:',D.year+'. Jahr',L,50,62);
  fld('Ausbildungsbereich:',D.area,L+70,50,W-70);
  fld('Ausbildungswoche vom:',D.von,L,58,80);
  fld('bis:',D.bis,L+88,58,48);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text('KW '+D.kw,R,58,{align:'right'});
  let y=64;
  const head=title=>{
    doc.setFillColor(232,236,240); doc.rect(L,y,W,8,'FD');
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5); doc.setTextColor(0);
    doc.text(title,L+2,y+5.4); doc.text('Stunden',xH+11,y+5.4,{align:'center'}); doc.line(xH,y,xH,y+8); y+=8;
  };
  head('Betriebliche Tätigkeiten');
  const y0=y; doc.rect(L,y0,W,RH*7); doc.line(xT,y0,xT,y0+RH*7); doc.line(xH,y0,xH,y0+RH*7);
  for(let i=0;i<7;i++){
    const ry=y0+i*RH; if(i>0) doc.line(L,ry,R,ry);
    doc.setFont('helvetica','normal'); doc.setFontSize(7); const tw=doc.getTextWidth(DAYS_PDF[i]);
    doc.text(DAYS_PDF[i],L+5.3,ry+RH/2+tw/2,{angle:90});
    if(D.days[i]){
      doc.setFont('helvetica','normal'); doc.setTextColor(0);
      fitText(doc,clean(D.days[i].t),xT+2,ry+1.6,TW-4,RH-2.6,9,6);
      doc.setFontSize(10); doc.text(String(D.days[i].h||'').replace('.',','),xH+11,ry+RH/2+1.3,{align:'center'});
    }
  }
  y=y0+RH*7;
  const box=(h,o)=>{
    doc.rect(L,y,W,h); doc.line(xH,y,xH,y+h);
    doc.setFont('helvetica','normal'); doc.setTextColor(0);
    fitText(doc,clean(o.t),L+2,y+1.8,W-22-4,h-3,9,6);
    if(o.h){ doc.setFontSize(10); doc.text(String(o.h).replace('.',','),xH+11,y+7,{align:'center'}); }
    y+=h;
  };
  head('Unterweisungen, betrieblicher Unterricht, sonstige Schulungen'); box(22,D.inst);
  head('Themen des Berufsschulunterrichts'); box(38,D.sch);
  const s1=y+12, s2=s1+15;
  doc.setLineWidth(0.3);
  doc.line(L,s1,L+82,s1); doc.line(L+98,s1,R,s1); doc.line(L,s2,L+82,s2); doc.line(L+98,s2,R,s2);
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text('Datum, Unterschrift Auszubildende/r',L,s1+4); doc.text('Datum, Unterschrift Ausbildende/r oder Ausbilder/in',L+98,s1+4);
  doc.text('Datum, Unterschrift gesetzliche/r Vertreter/in',L,s2+4); doc.text('ggf. weitere Sichtvermerke (z.B. Arbeitnehmervertreter)',L+98,s2+4);
}
function makePdf(){
  if(!window.jspdf||!window.jspdf.jsPDF){ toast(T('pdfErr')); return; }
  const {m}=validate(); if(m.length) return;
  const w=W(), mon=monOf(), kw=isoWeek(mon);
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  buildPdf(doc,{region:P.region,name:P.name.trim(),year:P.year,area:P.area.trim(),von:fmt(mon),bis:fmt(addDays(mon,lastDay(w))),kw,days:w.days.map((d,i)=>dayActive(w,i)?d:null),inst:w.i,sch:w.s});
  const nm=(P.name.trim().split(/\s+/).pop()||'').replace(/[^\wäöüÄÖÜß-]+/g,'');
  doc.save('Berichtsheft_KW'+pad(kw)+(nm?'_'+nm:'')+'.pdf');
}

render();
if(typeof module!=='undefined') module.exports={buildPdf};
</script>
