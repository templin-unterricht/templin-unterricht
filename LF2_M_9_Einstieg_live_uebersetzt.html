<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modul 9 live übersetzt (Deutsch · العربية · Tiếng Việt)</title>
<style>
:root{
  --bg:#ffffff; --fg:#14181d; --muted:#586270; --line:#c9d1da;
  --blau:#1F4E79; --blauhell:#9DC3E6; --flaeche:#EAF1F8;
  --acc:#7A3E00; --accbg:#FFF1D6; --accline:#D9A441; --ok:#2E6B45;
  --sans: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151b; --fg:#e8edf2; --muted:#9aa6b4; --line:#2e3946;
    --blau:#8fc1ee; --blauhell:#2d5a85; --flaeche:#16222e;
    --acc:#ffd9a0; --accbg:#3a2a12; --accline:#9a7330; --ok:#6fcf97;
  }
}
*{box-sizing:border-box}
html,body{margin:0; background:var(--bg); color:var(--fg); font-family:var(--sans)}
button{font:inherit; cursor:pointer}
[hidden]{display:none !important}
.dot{display:inline-block; width:10px; height:10px; border-radius:50%; background:#c0392b; margin-right:6px}
.dot.on{background:var(--ok)}

/* ---------- Tafel (Lehrkraft) ---------- */
#tafel{min-height:100vh; display:flex; flex-direction:column}
.tkopf{display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:10px 18px; background:var(--flaeche); border-bottom:2px solid var(--blauhell)}
.tkopf .ti{font-weight:700; color:var(--blau); font-size:1.05rem; margin-right:auto}
.tkopf button{border:2px solid var(--blau); background:var(--bg); color:var(--blau); border-radius:8px; padding:8px 16px; font-weight:700; font-size:1rem; min-height:44px}
.tkopf button.pri{background:var(--blau); color:var(--bg)}
.tkopf .mini{display:flex; align-items:center; gap:10px; font-size:.9rem; color:var(--muted)}
.tkopf canvas{width:64px; height:64px; border:1px solid var(--line); background:#fff}
#tmain{flex:1; padding:3vh 5vw 6vh; font-size:clamp(1.3rem, 2.9vw, 2.9rem); line-height:1.4}
#tmain h1{font-size:1.25em; color:var(--blau); margin:0 0 .5em; border-bottom:3px solid var(--blauhell); padding-bottom:.2em}
#tmain p{margin:.3em 0 .6em}
#tmain ul{margin:.2em 0 .6em; padding-left:1.2em} #tmain li{margin:.25em 0}
.q{background:var(--accbg); border-left:8px solid var(--accline); padding:.4em .8em; margin:.5em 0; border-radius:6px}
.hh{font-weight:800; color:var(--blau); margin-top:.6em}
.pair{display:flex; flex-wrap:wrap; gap:.2em 1em; align-items:baseline; padding:.25em 0; border-bottom:1px solid var(--line)}
.pair .x{font-weight:800; min-width:11em; color:var(--blau)}
.pair .y{flex:1}
.verdeckt{border:3px dashed var(--line); border-radius:8px; color:var(--muted); padding:.2em .8em; margin:.4em 0; font-size:.8em}
.join{display:grid; grid-template-columns:minmax(260px, 38%) 1fr; gap:4vw; align-items:center}
.join canvas{width:100%; max-width:560px; height:auto; aspect-ratio:1; background:#fff; border:2px solid var(--line); border-radius:8px}
.code{font-weight:800; letter-spacing:.15em; font-size:1.3em; color:var(--blau)}
.muted{color:var(--muted); font-size:.62em}
.sprachen{display:grid; gap:.3em; margin-top:.8em}
.sprachen div{padding:.3em .7em; background:var(--flaeche); border-radius:8px; font-size:.7em}
.sprachen [lang="ar"]{direction:rtl; text-align:right; font-size:.78em}
.urlbox{display:block; margin-top:.8em; font-size:.55em; color:var(--muted)}
.urlbox input{display:block; width:100%; font:inherit; font-size:1.1em; padding:6px 8px; margin-top:4px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg)}
.zaehler{font-size:.9rem}
@media (max-width:760px){ .join{grid-template-columns:1fr} }

/* ---------- Handy (Schüler) ---------- */
#handy{min-height:100vh; display:flex; flex-direction:column; max-width:640px; margin:0 auto}
.hkopf{position:sticky; top:0; z-index:10; background:var(--bg); border-bottom:2px solid var(--blauhell); padding:8px 12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.hkopf button{border:2px solid var(--blau); background:var(--bg); color:var(--blau); border-radius:22px; padding:6px 14px; font-weight:700; font-size:.95rem; min-height:42px}
.hkopf button[aria-pressed="true"]{background:var(--blau); color:var(--bg)}
.hkopf .st{margin-left:auto; font-size:.8rem; color:var(--muted)}
.hkopf .bigtr{flex-basis:100%}
button.bigtr{width:100%; min-height:52px; font-size:1.15rem; border-radius:12px; background:var(--acc); color:var(--bg); border:0}
button.bigtr[aria-pressed="false"]{background:var(--bg); color:var(--acc); border:2px solid var(--accline)}
#hmain{flex:1; padding:14px 14px 100px}
#hmain h1{font-size:1.35rem; color:var(--blau); margin:.2em 0 .5em; border-bottom:2px solid var(--blauhell); padding-bottom:.25em}
.item{margin:.55em 0}
.item .de{font-size:1.02rem; line-height:1.5}
.item .tl{display:block; margin-top:.25em; background:var(--accbg); color:var(--acc); border-radius:8px; padding:.35em .7em; font-size:1.12rem; line-height:1.55}
.item .tl.ar{direction:rtl; text-align:right; font-size:1.25rem}
.item.q .de{font-weight:600}
.item.li{display:list-item; margin-left:1.2em}
.item.hh .de{font-weight:800; color:var(--blau)}
.item.pair .x .de{font-weight:800; color:var(--blau)}
.pairbox{border-bottom:1px solid var(--line); padding:.4em 0}
.nurde .tl{display:none}
.hfuss{position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:2px solid var(--blauhell)}
.hfuss .in{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:8px; padding:8px 12px}
.hfuss button{min-height:48px; min-width:56px; border-radius:10px; border:2px solid var(--blau); background:var(--bg); color:var(--blau); font-size:1.3rem; font-weight:800}
.hfuss .mid{flex:1; text-align:center; font-size:.9rem; color:var(--muted)}
.hfuss .mid button{font-size:.95rem; padding:4px 10px; min-height:40px}
.sprachwahl{display:grid; gap:14px; padding:6vh 16px}
.sprachwahl h2{margin:0 0 4px; text-align:center; color:var(--blau)}
.sprachwahl button{min-height:72px; font-size:1.6rem; font-weight:800; border-radius:14px; border:3px solid var(--blau); background:var(--bg); color:var(--blau)}
.antwortbtn{display:block; width:100%; min-height:50px; margin:12px 0; border-radius:10px; border:2px dashed var(--accline); background:var(--bg); color:var(--acc); font-weight:700}
@keyframes neu{from{background:var(--accbg)} to{background:transparent}}
.neu{animation:neu 1.2s ease-out}

.row{display:flex; flex-wrap:wrap; gap:.2em 1.2em; padding:.25em 0; border-bottom:1px solid var(--line)}
.row .c{flex:1 1 12em}
.row.hd .c{font-weight:800; color:var(--blau)}
</style>
</head>
<body>
<div id="tafel" hidden>
  <div class="tkopf" id="tkopf"></div>
  <main id="tmain"></main>
</div>
<div id="handy" hidden>
  <div class="hkopf" id="hkopf"></div>
  <main id="hmain"></main>
  <div class="hfuss" id="hfuss" hidden></div>
</div>

const params=new URLSearchParams(location.search);
const LOCAL=params.get("bc")==="1";

const NS="lf2m1uebers1/";
class Net{
  constructor(onMsg,onStatus){
    this.cid="p"+rnd(10);this.seen=new Map();this.onMsg=onMsg;
    const st=()=>onStatus(this.count());
    this.links=LOCAL?[new LocalLink(this.cid,(t,p,r)=>this.recv(t,p,r),st)]:BROKERS.map(u=>new MqttLink(u,this.cid,(t,p,r)=>this.recv(t,p,r),st));
  }
  count(){return {up:this.links.filter(l=>l.up).length,all:this.links.length};}
  recv(t,p,r){
    if(p&&typeof p==="object"&&p.mid){const now=Date.now();if(this.seen.has(p.mid))return;this.seen.set(p.mid,now);
      if(this.seen.size>3000){for(const [k,v] of this.seen){if(now-v>600000)this.seen.delete(k);}}}
    this.onMsg(t,p,r);
  }
  sub(t){this.links.forEach(l=>l.subscribe(NS+t));}
  pub(t,obj,retain){obj.mid=rnd(12);let ok=false;this.links.forEach(l=>{if(l.publish(NS+t,obj,retain))ok=true;});return ok;}
}

const SL=D.SLIDES, UI=D.UI;
const STUDENT=params.has("s");
const $=id=>document.getElementById(id);
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

function drawQR(canvas,text){
  const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!text||typeof QRLib==="undefined"){ctx.fillStyle="#999";ctx.font="bold 18px sans-serif";ctx.textAlign="center";ctx.fillText("keine Adresse",canvas.width/2,canvas.height/2);return;}
  const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();
  const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
  ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}

/* ======================= Lehrkraft / Tafel ======================= */
function startTafel(){
  document.title="Tafel – Modul 9 live übersetzt";
  $("tafel").hidden=false;
  let T=lsGet("lf2m9T")||{code:codeGen(),i:-1,rev:false,url:""};
  const save=()=>lsSet("lf2m9T",T);save();
  const peers=new Map();           /* pid -> {lang,t} */
  let conn={up:0,all:0};
  const net=new Net((t,p)=>{
    if(!p||typeof p!=="object")return;
    if(t===NS+T.code+"/hello"&&p.pid){peers.set(p.pid,{lang:p.lang||"de",t:Date.now()}); if(p.hello)pub(); renderHead();}
  },(c)=>{conn=net.count();renderHead();if(c)pub();});
  net.sub(T.code+"/hello");
  function pub(){net.pub(T.code+"/state",{i:T.i,rev:T.rev,n:SL.length,ts:Date.now()},true);}
  setInterval(()=>{pub();for(const [k,v] of peers)if(Date.now()-v.t>60000)peers.delete(k);renderHead();},5000);

  function joinUrl(){
    if(location.protocol.startsWith("http"))return location.origin+location.pathname+"?s="+T.code+(LOCAL?"&bc=1":"");
    if(T.url){const u=T.url.trim();return u+(u.includes("?")?"&":"?")+"s="+T.code+(LOCAL?"&bc=1":"");}
    if(LOCAL)return location.href.split("?")[0]+"?s="+T.code+"&bc=1";return "";}
  function counts(){const c={ar:0,vi:0,de:0};for(const v of peers.values())c[v.lang]=(c[v.lang]||0)+1;return c;}
  function renderHead(){
    const c=counts();const n=peers.size;
    $("tkopf").innerHTML=`<span class="ti">Modul 9 · Verkaufsargumente: Merkmal – Vorteil – Nutzen – live übersetzt</span>
      <span class="mini"><canvas id="qrSmall" width="128" height="128"></canvas><span>Code <b>${esc(T.code)}</b><br>${n} Handys (AR ${c.ar} · VI ${c.vi} · DE ${c.de})<br><span class="dot ${conn.up?"on":""}"></span>${conn.up?"verbunden":"keine Verbindung"}</span></span>
      <button id="bZ">‹ Zurück</button><button id="bR">Auflösung</button><button id="bW" class="pri">Weiter ›</button>`;
    drawQR($("qrSmall"),joinUrl());
    $("bZ").onclick=prev;$("bW").onclick=next;$("bR").onclick=reveal;
  }
  function hasRev(){return T.i>=0&&SL[T.i].b.some(b=>b.r);}
  function reveal(){if(T.i>=0&&hasRev()){T.rev=!T.rev;save();pub();render();}}
  function go(i){T.i=Math.max(-1,Math.min(SL.length-1,i));T.rev=false;save();pub();render();}
  function next(){if(hasRev()&&!T.rev){reveal();}else go(T.i+1);}
  function prev(){go(T.i-1);}
  document.addEventListener("keydown",e=>{
    if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
    if(["ArrowRight","PageDown"," ","Enter"].includes(e.key)){e.preventDefault();next();}
    else if(["ArrowLeft","PageUp","Backspace"].includes(e.key)){e.preventDefault();prev();}
    else if(e.key==="r"||e.key==="R"){reveal();}
  });
  function blockHTML(b){
    const hid=b.r&&!T.rev;
    if(hid){return `<div class="verdeckt">${b.k==="pair"?"…":"…"}</div>`;}
    if(b.k==="row")return `<div class="row ${b.hd?"hd":""}">${b.c.map(c=>`<span class="c">${c.map(x=>esc(x.de)).join(" ")}</span>`).join("")}</div>`;
    const x=esc(b.x.de);
    if(b.k==="p")return `<p>${x}</p>`;
    if(b.k==="q")return `<div class="q">${x}</div>`;
    if(b.k==="h")return `<div class="hh">${x}</div>`;
    if(b.k==="li")return `<li>${x}</li>`;
    if(b.k==="pair"){const yh=b.ry&&!T.rev;return `<div class="pair"><span class="x">${x}</span><span class="y">${yh?"…":esc(b.y.de)}</span></div>`;}
    return "";}
  function render(){
    renderHead();
    const M=$("tmain");
    if(T.i<0){
      const u=joinUrl();
      M.innerHTML=`<div class="join"><div><canvas id="qrBig" width="560" height="560"></canvas></div>
        <div><h1>Modul 9 live – in deiner Sprache</h1>
        <p class="muted" style="font-size:.8em">Code: <span class="code">${esc(T.code)}</span></p>
        <div class="sprachen"><div lang="de">${esc(UI.start.de)}</div><div lang="ar" dir="rtl">${esc(UI.start.ar)}</div><div lang="vi">${esc(UI.start.vi)}</div></div>
        ${location.protocol.startsWith("http")||LOCAL?"":`<label class="urlbox">Internetadresse dieser Seite (nur nötig, wenn die Datei lokal geöffnet ist, z. B. https://…github.io/…/modul-9-live.html)<input id="tUrl" value="${esc(T.url)}" placeholder="https://…"></label>`}
        <p class="muted" id="jU" style="word-break:break-all"></p></div></div>`;
      drawQR($("qrBig"),u);$("jU").textContent=u;
      const ti=$("tUrl");if(ti)ti.oninput=()=>{T.url=ti.value;save();renderHead();drawQR($("qrBig"),joinUrl());$("jU").textContent=joinUrl();};
      return;}
    const s=SL[T.i];let h=`<h1>${esc(s.t.de)}</h1>`,ul="";
    for(const b of s.b){if(b.k==="li"&&!(b.r&&!T.rev)){ul+=blockHTML(b);}else{if(ul){h+=`<ul>${ul}</ul>`;ul="";}h+=blockHTML(b);}}
    if(ul)h+=`<ul>${ul}</ul>`;
    M.innerHTML=h+`<p class="muted" style="margin-top:1.5em">Folie ${T.i+1} von ${SL.length}${hasRev()?" · Leertaste/Weiter zeigt die Auflösung":""} · Handys folgen dieser Folie automatisch.</p>`;
  }
  render();
}

function startHandy(){
  const code=params.get("s");
  $("handy").hidden=false;
  document.title="Modul 9 – Übersetzung";
  const S={lang:lsGet("lf2m1_lang"),tr:lsGet("lf2m1_tr"),i:-1,rev:false,free:false,got:false,localRev:{},n:SL.length};
  if(S.tr===null||S.tr===undefined)S.tr=true;
  const pid=lsGet("lf2m1_pid")||rnd(8);lsSet("lf2m1_pid",pid);
  let conn={up:0,all:0};
  const net=new Net((t,p)=>{
    if(t===NS+code+"/state"&&p&&typeof p==="object"&&typeof p.i==="number"){
      S.got=true;S.tState=p;
      if(!S.free){const changed=(S.i!==p.i);S.i=p.i;S.rev=!!p.rev;render(changed);}
      else{S.tI=p.i;S.tRev=!!p.rev;renderFuss();}
    }
  },()=>{conn=net.count();renderKopf();if(conn.up){hello(true);}});
  net.sub(code+"/state");
  function hello(first){net.pub(code+"/hello",{pid:pid,lang:S.lang||"de",hello:!!first});}
  setInterval(()=>hello(false),20000);

  function setLang(l){S.lang=l;lsSet("lf2m1_lang",l);hello(false);render(false);}
  function tx(x){
    const l=S.lang;
    if(l==="de"||!S.tr)return `<span class="de">${esc(x.de)}</span>`;
    return `<span class="de">${esc(x.de)}</span><span class="tl ${l}" lang="${l}" ${l==="ar"?'dir="rtl"':""}>${esc(x[l])}</span>`;
  }
  function revealed(idx){return S.free?!!S.localRev[idx]:S.rev;}
  function renderKopf(){
    if(!S.lang){$("hkopf").innerHTML="";return;}
    const l=S.lang;
    const U=k=>UI[k][l==="de"?"de":l];
    $("hkopf").innerHTML=`<button data-l="de" aria-pressed="${l==="de"}">Deutsch</button><button data-l="ar" lang="ar" aria-pressed="${l==="ar"}">العربية</button><button data-l="vi" lang="vi" aria-pressed="${l==="vi"}">Tiếng Việt</button>
      <span class="st"><span class="dot ${conn.up?"on":""}"></span>${esc(U(conn.up?"verbunden":"keinev"))}</span>`+
      (l!=="de"?`<button class="bigtr" id="bTr" aria-pressed="${S.tr}" ${l==="ar"?'lang="ar"':'lang="vi"'}>${esc(UI.uebers[l])} ${S.tr?"✓":""}</button>`:"");
    $("hkopf").querySelectorAll("button[data-l]").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
    const bt=$("bTr");if(bt)bt.onclick=()=>{S.tr=!S.tr;lsSet("lf2m1_tr",S.tr);renderKopf();render(false);};
  }
  function chooser(){
    $("hmain").innerHTML=`<div class="sprachwahl"><h2>Sprache · اللغة · Ngôn ngữ</h2>
      <button data-l="ar" lang="ar">العربية</button><button data-l="vi" lang="vi">Tiếng Việt</button><button data-l="de">Deutsch</button></div>`;
    $("hmain").querySelectorAll("button").forEach(b=>b.onclick=()=>{setLang(b.dataset.l);renderKopf();});
    $("hfuss").hidden=true;
  }
  function itemHTML(b,idx){
    const l=S.lang;
    if(b.r&&!revealed(idx))return ""; /* wird unten als Button angeboten */
    if(b.k==="row")return `<div class="pairbox">${b.c.map(c=>`<div class="item ${b.hd?"hh":""}">${c.map(x=>tx(x)).join(" ")}</div>`).join("")}</div>`;
    if(b.k==="p")return `<div class="item">${tx(b.x)}</div>`;
    if(b.k==="q")return `<div class="item q">${tx(b.x)}</div>`;
    if(b.k==="h")return `<div class="item hh">${tx(b.x)}</div>`;
    if(b.k==="li")return `<div class="item li">${tx(b.x)}</div>`;
    if(b.k==="pair"){
      const ys=(b.ry&&!revealed(idx))?"":`<div class="item">${tx(b.y)}</div>`;
      return `<div class="pairbox"><div class="item pair"><span class="x">${tx(b.x)}</span></div>${ys}</div>`;}
    return "";
  }
  function render(changed){
    if(!S.lang){chooser();return;}
    renderKopf();
    const M=$("hmain");$("hfuss").hidden=false;
    M.className=(S.lang==="de"||!S.tr)?"nurde":"";
    if(S.i<0){
      M.innerHTML=`<h1>${esc(UI.willkommen.de)}</h1><div class="item">${tx(UI.willkommen)}</div>${S.got?"":`<div class="item">${tx(UI.warte)}</div>`}`;
      renderFuss();return;}
    const s=SL[S.i];const idx=S.i;
    let h=`<h1>${tx(s.t)}</h1>`;
    h=`<h1 class="${S.lang==="de"||!S.tr?"":""}">${esc(s.t.de)}${(S.lang!=="de"&&S.tr)?`<span class="tl ${S.lang}" ${S.lang==="ar"?'dir="rtl" lang="ar"':'lang="vi"'} style="display:block;font-size:1.05rem;color:var(--acc);margin-top:.3em;font-weight:600">${esc(s.t[S.lang])}</span>`:""}</h1>`;
    for(let k=0;k<s.b.length;k++)h+=itemHTML(s.b[k],idx);
    const hasHidden=s.b.some(b=>(b.r||b.ry)&&!revealed(idx));
    if(hasHidden&&S.free)h+=`<button class="antwortbtn" id="bAns">${esc(UI.antwort[S.lang==="de"?"de":S.lang])}</button>`;
    M.innerHTML=h;
    if(changed){M.classList.add("neu");setTimeout(()=>M.classList.remove("neu"),1300);}
    const ba=$("bAns");if(ba)ba.onclick=()=>{S.localRev[idx]=true;render(false);};
    renderFuss();
  }
  function renderFuss(){
    const F=$("hfuss");if(!S.lang)return;
    const l=S.lang==="de"?"de":S.lang;
    const total=SL.length;
    const cur=S.i<0?0:S.i+1;
    F.innerHTML=`<div class="in"><button id="bP" aria-label="zurück">‹</button>
      <div class="mid">${esc(UI.folie[l])} ${cur} ${esc(UI.von[l])} ${total}${S.free?`<br><button id="bT">${esc(UI.zurtafel[l])}</button>`:""}</div>
      <button id="bN" aria-label="weiter">›</button></div>`;
    $("bP").onclick=()=>step(-1);$("bN").onclick=()=>step(1);
    const bt=$("bT");if(bt)bt.onclick=()=>{S.free=false;if(S.tState){S.i=S.tState.i;S.rev=!!S.tState.rev;}render(true);};
  }
  function step(d){S.free=true;S.i=Math.max(-1,Math.min(SL.length-1,S.i+d));render(false);window.scrollTo(0,0);}
  render(false);
  if(S.lang)hello(true);
}

if(STUDENT)startHandy();else startTafel();
</script>

</body>
</html>
