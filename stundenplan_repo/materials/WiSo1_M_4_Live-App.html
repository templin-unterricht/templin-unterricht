<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wann ist Schluss?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#eef1f3;--surface:#fff;--surface2:#f5f7f8;--ink:#1a1f24;--muted:#56606a;--line:#d3d9de;
  --brand:#0f5c6e;--brand-ink:#fff;--ok:#1f7a3f;--bad:#b3261e;--warn:#a15c00;
  --az:#1f5fae;--az-soft:#dde8f7;--be:#c2410c;--be-soft:#fbe6dc;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111518;--surface:#1a2025;--surface2:#151a1e;--ink:#e8edf0;--muted:#a2adb6;--line:#333c43;
  --brand:#5cc3d6;--brand-ink:#08191d;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --az:#7fb0ff;--az-soft:#1b2a40;--be:#ff8a5c;--be-soft:#3a2219;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111518;--surface:#1a2025;--surface2:#151a1e;--ink:#e8edf0;--muted:#a2adb6;--line:#333c43;
  --brand:#5cc3d6;--brand-ink:#08191d;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --az:#7fb0ff;--az-soft:#1b2a40;--be:#ff8a5c;--be-soft:#3a2219;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0 0 .4em;line-height:1.1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.6em 1em}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.45;cursor:default}
input,textarea{font:inherit;width:100%;padding:.6em .7em;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.merk{border-left:6px solid var(--brand);background:var(--surface);border-radius:10px;padding:12px 14px;margin:8px 0}
.term{font-weight:700;border-bottom:3px solid var(--brand)}
.alt{font-weight:400;color:var(--muted);font-size:.9em}
.az{color:var(--az)} .be{color:var(--be)}
/* ---------- Tafel ---------- */
#tafel header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tafel header h1{font-size:1.35rem;margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.steps button{padding:.35em .8em;font-size:.9rem}
.steps button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mini{display:flex;align-items:center;gap:10px;font-size:.9rem}
.mini canvas{width:64px;height:64px;border-radius:6px;background:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px}
.dot.on{background:var(--ok)}
#tMain{padding:20px 22px 40px;max-width:1400px;margin:0 auto}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.ctrl button{font-size:1.05rem}
.big{font-size:clamp(1.6rem,3.2vw,2.6rem)}
.join{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:28px;align-items:start}
.join canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:14px}
.code{font-family:var(--display);font-size:3rem;font-weight:800;letter-spacing:.12em}
.nicks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nicks button{padding:.3em .7em;font-size:.95rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.sit{font-size:clamp(1.3rem,2.4vw,1.9rem);background:var(--surface);border-radius:14px;padding:16px 20px;border:2px solid var(--line)}
.abcd{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.ab{border-radius:14px;padding:14px 16px;background:var(--surface);border:3px solid var(--line);font-size:1.2rem;position:relative}
.ab .L{font-family:var(--display);font-weight:800;font-size:1.6rem;margin-right:8px}
.ab .bar{height:12px;border-radius:6px;background:var(--surface2);margin-top:10px;overflow:hidden}
.ab .bar i{display:block;height:100%;background:var(--brand);transition:width .4s}
.ab .n{position:absolute;right:14px;top:10px;font-family:var(--display);font-size:1.7rem;font-weight:800}
.ab.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.ab.dim{opacity:.4}
.schema{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin-top:12px;font-size:1.15rem}
.schema b{font-family:var(--display)}
.satzb{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.satzb span{background:var(--surface);border:1px dashed var(--brand);border-radius:8px;padding:4px 10px}
.pfgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pfc{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px}
.pfc.A{border-color:var(--az)} .pfc.B{border-color:var(--be)}
.pfc .pc{font-family:var(--display);font-weight:800;font-size:1.5rem}
.mbar{height:10px;border-radius:5px;background:color-mix(in srgb,var(--bad) 35%,var(--surface2));overflow:hidden;margin-top:6px}
.mbar i{display:block;height:100%;background:var(--ok)}
.mirror{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:1.1rem}
.mirror td{padding:10px 12px;background:var(--surface)}
.mirror td:first-child{border-left:6px solid var(--az);border-radius:10px 0 0 10px}
.mirror td:last-child{border-right:6px solid var(--be);border-radius:0 10px 10px 0}
.mirror td.ar{text-align:center;color:var(--muted);font-weight:700;white-space:nowrap}
.mirror th{font-family:var(--display);font-size:1.1rem;text-align:left;padding:0 12px}
.verg{display:flex;align-items:flex-end;gap:14px;height:170px;margin:10px 0}
.verg div{flex:1;background:var(--brand);color:var(--brand-ink);border-radius:10px 10px 0 0;text-align:center;font-family:var(--display);font-weight:800;font-size:1.3rem;padding-top:8px}
.verg div small{display:block;font-family:var(--body);font-weight:400;font-size:.85rem}
.whyl{list-style:none;padding:0;margin:10px 0}
.whyl li{background:var(--surface);border-radius:10px;padding:8px 12px;margin-bottom:6px;font-size:1.1rem}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer{font-family:var(--display);font-size:3rem;font-weight:800;min-width:2.2em;text-align:center;border-radius:50%;background:var(--surface);border:4px solid var(--brand);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{border-radius:14px;padding:14px 16px;color:#fff;font-size:1.2rem;font-weight:700;position:relative}
.o0{background:#b3261e}.o1{background:#1f5fae}.o2{background:#8a5300}.o3{background:#3a7a1c}.o4{background:#8537a3}
.opt.wrong{opacity:.35}
.opt .cnt{position:absolute;right:14px;top:10px;font-family:var(--display);font-size:1.6rem}
.top{list-style:none;padding:0;margin:0}
.top li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--surface);margin-bottom:6px;font-size:1.15rem}
.top li b{font-family:var(--display)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:24px}
.podium div{background:var(--brand);color:var(--brand-ink);border-radius:14px 14px 0 0;width:200px;text-align:center;padding:12px;font-family:var(--display);font-weight:800}
.podium span{display:block;font-size:1.4rem}
.pro{font-size:.75rem;font-weight:700;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
@media (max-width:900px){.two,.join,.opts,.abcd{grid-template-columns:1fr}}
/* ---------- Handy ---------- */
#phone{max-width:560px;margin:0 auto;padding:14px 16px 40px}
#phone .ph-top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.status.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.status.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.pbtn{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:14px;font-size:1.05rem}
.pbtn .L{font-family:var(--display);font-weight:800;margin-right:6px}
.pbtn.sel{outline:4px solid var(--ink);outline-offset:-2px;background:var(--surface2)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.yn button{padding:22px 10px;font-size:1.2rem;font-weight:700;border-radius:14px;border:3px solid}
.yn .A{background:var(--az-soft);border-color:var(--az);color:var(--az)}
.yn .B{background:var(--be-soft);border-color:var(--be);color:var(--be)}
.pcard{border-radius:18px;padding:20px 18px;border:3px solid var(--line);background:var(--surface);font-size:1.35rem;font-weight:700;text-align:center;margin:10px 0}
.popt{display:block;width:100%;margin:10px 0;padding:16px 14px;border-radius:14px;color:#fff;border:none;font-size:1.05rem;font-weight:700;text-align:left}
.bigpts{font-family:var(--display);font-size:2.4rem;font-weight:800}
.prog{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--brand)}
/* ---------- Wörter ---------- */
#help{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:14px 16px 40px}
#help>*{max-width:760px;margin-left:auto;margin-right:auto}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-14px;background:var(--bg);padding:8px 0}
.hw{background:var(--surface);border-left:6px solid var(--brand);border-radius:10px;padding:10px 14px;margin:8px 0;font-size:1.05rem}
.hw b{font-family:var(--display);font-size:1.15rem}
.hbtn{padding:.25em .7em;font-weight:700;border-radius:999px}
:root{--ok-soft:#dff1e5;--bad-soft:#f8e0de;--warn-soft:#fbe9c9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok-soft:#183324;--bad-soft:#3a1d1b;--warn-soft:#3a2c14}}
:root[data-theme="dark"]{--ok-soft:#183324;--bad-soft:#3a1d1b;--warn-soft:#3a2c14}
svg.tree,svg.tlsvg{width:100%;height:auto;display:block}
svg .tn-a{font-family:var(--display);font-weight:700;font-size:19px;fill:var(--ink)}
svg .tn-b{font-family:var(--body);font-size:16px;fill:var(--muted)}
svg .tn-w{fill:var(--ok)} svg .tn-u{fill:var(--bad)}
svg .tl-lab{font-family:var(--body);font-weight:700;font-size:16px;fill:var(--muted)}
.etab{width:100%;border-collapse:collapse;font-size:1.05rem;background:var(--surface);border-radius:10px;overflow:hidden}
.etab th,.etab td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.etab th{font-family:var(--display);background:var(--surface2)}
.mid{font-size:clamp(1.2rem,2vw,1.6rem)}
.qlist{margin:.4em 0;padding-left:1.4em;font-size:1.05rem}.qlist li{margin:.2em 0}
.seq{padding-left:1.4em;margin:10px 0}.seq li{background:var(--surface);border-radius:8px;padding:6px 10px;margin:4px 0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.fbtn{display:flex;flex-direction:column;gap:2px;padding:16px 10px;border-radius:14px;font-size:1.1rem;text-align:center}
.fbtn span{font-size:.9rem;color:var(--muted)}
.fbtn.done{border:2px solid var(--ok);background:var(--ok-soft)}
.yn .W{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.yn .U{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pzin{font-size:1.6rem;text-align:center;letter-spacing:.08em;margin-top:6px}
.pfc.A .mbar i{background:var(--ok)}
</style>
</head>

</div>
<div id="phone" hidden></div>

    this.cid="p"+rnd(10);this.seen=new Map();this.onMsg=onMsg;

function treeSVG(o){o=o||{};const on=new Set(o.path||[]),any=on.size>0,lv=o.leaves!==false;
  let s=`<svg class="tree" viewBox="0 0 900 520" role="img" aria-label="Entscheidungsbaum: Ist die Kündigung wirksam?">`;
  for(const [id,pts,lab,lx,ly] of TE_){const hi=on.has(id);
    s+=`<polyline points="${pts}" fill="none" stroke="${hi?"var(--brand)":"var(--line)"}" stroke-width="${hi?6:3}" ${any&&!hi?'opacity=".45"':""}/>`+
       `<text x="${lx}" y="${ly}" class="tl-lab" ${any&&!hi?'opacity=".45"':""}>${lab}</text>`;}
  for(const id in TN){const n=TN[id],hi=on.has(id),leaf=!!n.r,show=!leaf||lv||hi;
    const fill=leaf&&show?(n.r==="w"?"var(--ok-soft)":"var(--bad-soft)"):"var(--surface)";
    const str=hi?"var(--brand)":leaf&&show?(n.r==="w"?"var(--ok)":"var(--bad)"):"var(--line)";
    s+=`<g ${any&&!hi?'opacity=".45"':""}><rect x="${n.x}" y="${n.y}" width="${n.w}" height="60" rx="10" fill="${fill}" stroke="${str}" stroke-width="${hi?5:2}"/>`;
    const lines=show?n.t:["?"],cx=n.x+n.w/2,y0=n.y+(lines.length===1?37:26);
    lines.forEach((t,i)=>{s+=`<text x="${cx}" y="${y0+i*22}" text-anchor="middle" class="${i===0?"tn-a":"tn-b"}${leaf&&show&&i===0?(n.r==="w"?" tn-w":" tn-u"):""}">${h(t)}</text>`;});
    s+=`</g>`;}
  return s+`</svg>`;}

function tlSVG(o){o=o||{};const X=m=>40+m/24*920,pos=[["a",1,"start"],["b",1,"middle"],["a",1,"middle"],["b",1,"end"],["a",2,"end"],["b",2,"end"]];

  s+=`<line x1="${X(0)}" y1="150" x2="${X(24)}" y2="150" stroke="var(--ink)" stroke-width="3"/>`;
  EV.forEach((e,i)=>{const x=X(e.m),[side,lvl,anc]=pos[i],key=i===4&&o.mark;
    const y1=side==="a"?150-(lvl===1?40:90):150+(lvl===1?40:90);
    s+=`<line x1="${x}" y1="150" x2="${x}" y2="${y1}" stroke="${key?"var(--brand)":"var(--muted)"}" stroke-width="${key?4:2}"/><circle cx="${x}" cy="150" r="${key?11:7}" fill="${key?"var(--brand)":"var(--ink)"}"/>`;
    const ty=side==="a"?y1-30:y1+20;
    s+=`<text x="${x}" y="${ty}" text-anchor="${anc}" class="tn-a"${key?' style="fill:var(--brand)"':""}>${h(e.t)}</text>`;
    if(o.dates!==false)s+=`<text x="${x}" y="${ty+20}" text-anchor="${anc}" class="tn-b">${h(e.d)}${o.pct?` · ${o.pct[i]} % richtig`:""}</text>`;
    else if(o.pct)s+=`<text x="${x}" y="${ty+20}" text-anchor="${anc}" class="tn-b">${o.pct[i]} % richtig gelegt</text>`;});
  if(o.mark)s+=`<text x="${X(22.65)-18}" y="136" text-anchor="end" class="tn-a" style="fill:var(--brand)">Hier ist Schluss!</text>`;
  return s+`</svg>`;}

function normDate(s){s=String(s||"").trim();let d=0,m=0;const p=s.split(/[.\-\/ ,]+/).filter(Boolean);
  if(p.length>=2){d=+p[0];m=+p[1];}else{const x=s.replace(/\D/g,"");if(x.length===4||x.length===8){d=+x.slice(0,2);m=+x.slice(2,4);}else if(x.length===3){d=+x.slice(0,1);m=+x.slice(1);}}
  if(!(d>=1&&d<=31&&m>=1&&m<=12))return null;return String(d).padStart(2,"0")+"."+String(m).padStart(2,"0");}

<script>

function tafelApp(){
  $("tafel").hidden=false;
  const KEY="wisom4ende_tafel";
  const fresh=()=>({code:codeGen(),ph:0,pl:{},kick:[],url:"",w:{i:-1,open:false},z:{st:0},e:{i:-1,open:false},
    fr:{open:true,r:-1,show:false,leaves:false,showY:false},pzShow:false,zgShow:false,
    v:{},zo:{},pz:{},fa:{},fy:{},zg:{},q:-1,qOpen:false,qStart:0,qAns:{}});
  let T=store(KEY);if(!T||!T.code)T=fresh();
  let conn={up:0,all:2},pubT=null,subbed="";
  const net=new Net(onMsg,c=>{conn=c;if(c.up)pub();renderHead();});
  function sub(){if(subbed!==T.code){subbed=T.code;net.sub(T.code+"/in");}}
  sub();
  const save=()=>store(KEY,T);
  const players=()=>Object.keys(T.pl);
  const curKey=()=>T.ph===1&&T.w.i>=0&&T.w.open?"w"+T.w.i:T.ph===2&&T.z.st===3?"z":T.ph===3&&T.e.i>=1&&T.e.open?"e"+T.e.i:null;
  const isInt=(x,lo,hi)=>Number.isInteger(x)&&x>=lo&&x<=hi;

  function onMsg(t,p){
    if(t!==NS+T.code+"/in"||!p||!p.p)return;
    const pid=clean(p.p,12);if(T.kick.includes(pid))return;
    if(p.k==="hi"){const n=clean(p.n,16)||"?";if(!T.pl[pid])T.pl[pid]={n};else T.pl[pid].n=n;}
    else if(!T.pl[pid])return;
    else if(p.k==="v"){const key=curKey();if(!key||p.key!==key||!isInt(p.c,0,3))return;(T.v[key]=T.v[key]||{})[pid]=p.c;}
    else if(p.k==="zo"){if(T.ph!==2||T.z.st!==1||!Array.isArray(p.o)||p.o.length!==EV.length)return;
      const o=p.o.map(Number);if(new Set(o).size!==EV.length||!o.every(x=>isInt(x,0,EV.length-1)))return;T.zo[pid]=o;}
    else if(p.k==="pz"){if(T.ph!==3||!isInt(p.i,0,PZ.length-1)||typeof p.a!=="string"||!/^\d\d\.\d\d$/.test(p.a))return;
      const M=(T.pz[pid]=T.pz[pid]||{});if(M[p.i])return;M[p.i]=p.a;}
    else if(p.k==="fa"){if(T.ph!==4||!T.fr.open||!isInt(p.i,0,FALL.length-1)||!isInt(p.c,0,1)||!isInt(p.g,0,G.length-1))return;
      if((G[p.g].w?1:0)!==p.c)return;(T.fa[pid]=T.fa[pid]||{})[p.i]={c:p.c,g:p.g};}
    else if(p.k==="fy"){if(T.ph!==4||!isInt(p.i,0,FALL.length-1))return;const tx=clean(p.tx,160);if(!tx)return;(T.fy[pid]=T.fy[pid]||{})[p.i]=tx;}
    else if(p.k==="zg"){if(T.ph!==5||!isInt(p.i,0,ZG.length-1)||(p.c!=="E"&&p.c!=="Q"))return;const M=(T.zg[pid]=T.zg[pid]||{});if(M[p.i])return;M[p.i]=p.c;}
    else if(p.k==="a"&&T.ph===7&&T.qOpen&&p.q===T.q){
      const A=(T.qAns[T.q]=T.qAns[T.q]||{});if(A[pid])return;
      const c=p.c;if(!isInt(c,0,QUIZ[T.q].o.length-1))return;
      const dur=qDur(QUIZ[T.q]),s=(Date.now()-T.qStart)/1000;
      A[pid]={c,g:c===QUIZ[T.q].k?1000+Math.round(500*Math.max(0,1-s/dur)):0};
      if(Object.keys(A).length>=players().length)T.qOpen=false;}
    else return;
    save();pub();render();
  }

  /* ---------- Auswertungen ---------- */
  const counts=key=>{const c=[0,0,0,0];const V=T.v[key]||{};for(const id in V)if(T.pl[id])c[V[id]]++;return c;};
  const sum=a=>a.reduce((x,y)=>x+y,0);
  function zoStats(){const ids=players().filter(id=>T.zo[id]);const pct=EV.map((_,i)=>ids.length?Math.round(100*ids.filter(id=>T.zo[id][i]===i).length/ids.length):0);
    return {n:ids.length,all:ids.filter(id=>T.zo[id].every((x,i)=>x===i)).length,pct};}
  const fallOk=(pid,i)=>{const a=(T.fa[pid]||{})[i];return !!a&&a.g===FALL[i].g;};
  const fallRight=pid=>FALL.filter((_,i)=>fallOk(pid,i)).length;
  const pzRight=pid=>PZ.filter((P,i)=>(T.pz[pid]||{})[i]===P.a).length;
  function points(pid){let s=0;for(const qi in T.qAns){if(+qi<T.q||(+qi===T.q&&!T.qOpen)){const a=T.qAns[qi][pid];if(a)s+=a.g;}}return s;}
  function ranking(){return players().map(id=>({id,n:T.pl[id].n,s:points(id)})).sort((a,b)=>b.s-a.s);}

  /* ---------- Zustand an alle Handys ---------- */
  function pub(){clearTimeout(pubT);pubT=setTimeout(()=>{
    const pp={};
    for(const id of players()){const v={};for(const k in T.v){if(T.v[k][id]!=null)v[k]=T.v[k][id];}
      pp[id]={v,zo:T.zo[id]||null,pz:T.pz[id]||{},fa:T.fa[id]||{},fy:Object.keys(T.fy[id]||{}).map(Number),zg:T.zg[id]||{}};}
    const S={ph:T.ph,j:players(),kick:T.kick,w:T.w,z:T.z,e:T.e,fr:{open:T.fr.open,r:T.fr.r,show:T.fr.show},pp,q:T.q,qOpen:T.qOpen,ans:[]};
    if(T.ph===7&&T.q>=0){S.ans=Object.keys(T.qAns[T.q]||{});S.rem=T.qOpen?Math.max(0,qDur(QUIZ[T.q])-(Date.now()-T.qStart)/1000):0;}
    if(T.ph>=7){const r=ranking();S.sc={};let rank=0,last=-1;
      r.forEach((x,i)=>{if(x.s!==last){rank=i+1;last=x.s;}const a=(T.qAns[T.q]||{})[x.id];S.sc[x.id]=[x.s,rank,T.qOpen?0:(a?a.g:0)];});S.np=r.length;}
    net.pub(T.code+"/st",S,true);},120);}
  setInterval(pub,5000);

  function go(ph){
    if(T.ph===2&&ph!==2){if(T.z.st===1)T.z.st=2;if(T.z.st===3)T.z.st=4;}
    T.ph=ph;if(ph!==7)T.qOpen=false;if(ph!==1)T.w.open=false;if(ph!==3)T.e.open=false;save();pub();render();}
  const up=()=>{save();pub();render();};

  /* ---------- Kopfzeile ---------- */
  function joinUrl(){
    const extra=(params.get("broker")?"&broker="+encodeURIComponent(params.get("broker")):"")+(LOCAL?"&bc=1":"");
    if(location.protocol.startsWith("http"))return location.origin+location.pathname+"?s="+T.code+extra;
    if(T.url){const u=T.url.trim();return u+(u.includes("?")?"&":"?")+"s="+T.code+extra;}
    if(LOCAL)return location.href.split("?")[0]+"?s="+T.code+extra;return "";}
  function drawQR(canvas,text){
    const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(!text||typeof QRLib==="undefined"){ctx.fillStyle="#999";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText("keine Adresse",canvas.width/2,canvas.height/2);return;}
    const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();
    const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
    ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}
  function renderHead(){
    $("steps").innerHTML=PHASES.map((p,i)=>`<button data-ph="${i}" class="${i===T.ph?"on":""}">${i} ${p}</button>`).join("");
    $("steps").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.ph));
    $("miniCode").textContent="Code "+T.code;$("miniN").textContent=players().length+" dabei";
    $("conn").innerHTML=`<span class="dot ${conn.up?"on":""}"></span>${conn.up?"verbunden":"keine Verbindung"}`;
    if(!$("bWortT")){const b=document.createElement("button");b.id="bWortT";b.className="hbtn";b.textContent="Wörter";b.title="Wörter einfach erklärt";b.onclick=openWort;$("steps").after(b);}
    drawQR($("qrSmall"),joinUrl());}
  function render(){renderHead();const M=$("tMain");[rStart,rWdh,rZeit,rPzE,rFall,rZg,rMerk,rQuiz,rWin][T.ph](M);}

  function abcd(opts,cnt,right,showCnt){const n=sum(cnt)||1;
    return `<div class="abcd">${opts.map((o,i)=>`<div class="ab ${right==null?"":i===right?"right":"dim"}"><span class="L">${"ABCD"[i]}</span>${h(o)}
      ${showCnt?`<span class="n">${cnt[i]}</span><div class="bar"><i style="width:${Math.round(100*cnt[i]/n)}%"></i></div>`:""}</div>`).join("")}</div>`;}
  const bar=(lab,v,all,cls)=>{const pc=all?Math.round(100*v/all):0;return `<div class="pfc ${cls||""}" style="margin-bottom:8px"><div class="row" style="justify-content:space-between"><span>${lab}</span><b>${v} · ${pc} %</b></div><div class="mbar"><i style="width:${pc}%"></i></div></div>`;};

  /* ---------- 0 Start ---------- */
  function rStart(M){
    const pl=Object.entries(T.pl);
    M.innerHTML=`<div class="join"><div><canvas id="qrBig" width="600" height="600"></canvas></div>
      <div><h2 class="big">Probezeit, Ende, Kündigung: Wann ist Schluss?</h2>
      <p style="font-size:1.25rem">1. QR-Code mit dem Handy scannen.<br>2. Einen Spitznamen eingeben.<br>3. Warten, bis es losgeht.</p>
      <p class="muted">Code: <span class="code">${T.code}</span><br><span id="jU" style="word-break:break-all"></span></p>
      ${location.protocol.startsWith("http")||LOCAL?"":`<label>Internetadresse dieser Seite (nur nötig, wenn die Datei lokal geöffnet ist)<input id="tUrl" value="${h(T.url)}" placeholder="https://…/WiSo%20Modul%204%20-%20Live-App.html"></label>`}
      <h3 style="margin-top:16px">${pl.length} dabei <span class="muted" style="font-size:.9rem;font-weight:400">· Antippen entfernt einen Namen</span></h3>
      <div class="nicks">${pl.map(([id,x])=>`<button data-id="${h(id)}">${h(x.n)}</button>`).join("")}</div>
      <div class="box" style="margin-top:14px"><b>Doppelstunde 1:</b> Phasen 1–3 (Ankommen, Zeitstrahl, Probezeit & Ende) · <b>Doppelstunde 2:</b> Phasen 4–8 (Fall-Rallye, Zeugnis, Merken, Prüfungs-Check). Die Sitzung bleibt gespeichert – in DS 2 einfach weitermachen oder neu starten.</div>
      <div class="ctrl"><button class="pri" id="bGo">Los: Ankommen →</button><button id="bFr">Direkt zur Fall-Rallye (DS 2)</button><button id="bNew">Neue Sitzung (alles löschen)</button></div></div></div>`;
    drawQR($("qrBig"),joinUrl());$("jU").textContent=joinUrl();
    if($("tUrl"))$("tUrl").onchange=e=>{T.url=e.target.value;save();render();};
    M.querySelectorAll(".nicks button").forEach(b=>b.onclick=()=>{const id=b.dataset.id;delete T.pl[id];T.kick.push(id);up();});
    $("bGo").onclick=()=>go(1);$("bFr").onclick=()=>go(4);
    $("bNew").onclick=()=>{if(window.confirm("Neue Sitzung starten? Alle Namen und Ergebnisse werden gelöscht.")){const u=T.url;T=fresh();T.url=u;save();sub();pub();render();}};
  }

  /* ---------- Abstimmung mit Auflösen (Ankommen und Ende) ---------- */
  function hinge(M,list,st,pre,title,onNext,nextLabel){
    const Q=list[st.i],key=pre+st.i,c=counts(key),n=sum(c);
    M.innerHTML=`<p class="muted">${title} · Frage ${st.i+1} von ${list.length} · ${n} von ${players().length} geantwortet</p><h2 class="big">${h(Q.q)}</h2>
      ${abcd(Q.o,c,st.open?null:Q.k,!st.open)}
      ${st.open?"":`<div class="merk" style="font-size:1.2rem;margin-top:14px">${h(Q.x)}</div>`}
      <div class="ctrl">${st.open?`<button class="pri" id="bR">Auflösen</button>`:st.i<list.length-1?`<button class="pri" id="bN">Nächste Frage →</button>`:`<button class="pri" id="bW">${nextLabel}</button>`}</div>`;
    if($("bR"))$("bR").onclick=()=>{st.open=false;up();};
    if($("bN"))$("bN").onclick=()=>{st.i++;st.open=true;up();};
    if($("bW"))$("bW").onclick=onNext;
  }

  /* ---------- 1 Ankommen (Modul 3) ---------- */
  function rWdh(M){
    if(T.w.i<0){M.innerHTML=`<h2 class="big">Ankommen: Was weißt du noch aus Modul 3?</h2><p style="font-size:1.25rem">Vier Fragen zu Rechten und Pflichten. Aus dem Kopf – ohne Buch, ohne Punkte.</p>
      <div class="ctrl"><button class="pri" id="bA">Erste Frage →</button><button id="bSkip">Überspringen →</button></div>`;
      $("bA").onclick=()=>{T.w={i:0,open:true};up();};$("bSkip").onclick=()=>go(2);return;}
    hinge(M,WDH,T.w,"w","Ankommen",()=>go(2),"Weiter: Wann ist Schluss? →");
  }

  /* ---------- 2 Wann ist Schluss? (Zeitstrahl ordnen, dann abstimmen – NICHT auflösen) ---------- */
  function rZeit(M){
    const st=T.z.st,Z=zoStats(),N=players().length;
    if(st===0){M.innerHTML=`<h2 class="big">Wann ist Schluss?</h2>
      <div class="two"><div class="sit">Emre macht eine Ausbildung zum Verkäufer.<br>Sein Vertrag läuft vom <b>01.08.2026</b> bis zum <b>31.07.2028</b>.</div>
      <div style="font-size:1.25rem"><p>Am Handy bekommt ihr sechs Ereigniskarten – <b>ohne Datum</b>.</p><p>Tippt sie in der richtigen Reihenfolge an: Was passiert zuerst, was zuletzt?</p></div></div>
      ${tlSVG({dates:false}).replace(/class="tn-a"[^>]*>[^<]*</g,'class="tn-a">?<')}
      <div class="ctrl"><button class="pri" id="bS">Ordnen starten →</button></div>`;
      $("bS").onclick=()=>{T.z.st=1;up();};return;}
    if(st===1){M.innerHTML=`<div class="qhead"><div><h2 class="big">Ordnet Emres Ausbildung</h2><p style="font-size:1.2rem">Tippt die sechs Karten am Handy der Reihe nach an. Danach „Absenden“.</p></div>
      <div class="box" style="text-align:center"><div class="bigpts">${Z.n}/${N}</div>fertig</div></div>
      <div class="pfgrid">${EV.map(e=>e.t).sort((a,b)=>a.localeCompare(b,"de")).map(t=>`<div class="pfc" style="font-size:1.15rem">${h(t)}</div>`).join("")}</div>
      <div class="ctrl"><button class="pri" id="bC">Ordnen beenden und auflösen</button></div>`;
      $("bC").onclick=()=>{T.z.st=2;up();};return;}
    if(st===2){M.innerHTML=`<h2 class="big">So liegt Emres Ausbildung</h2>
      <p style="font-size:1.2rem">${Z.all} von ${Z.n} haben alle sechs Karten richtig gelegt.</p>
      ${tlSVG({pct:Z.pct})}
      <div class="merk" style="font-size:1.15rem">Jetzt die spannende Frage: <b>An welchem Tag ist Emre kein Azubi mehr?</b></div>
      <div class="ctrl"><button class="pri" id="bV">Abstimmung starten →</button></div>`;
      $("bV").onclick=()=>{T.z.st=3;up();};return;}
    const c=counts("z"),n=sum(c);
    M.innerHTML=`<p class="muted">${n} von ${N} haben gewählt${st===3?"":" · Abstimmung geschlossen"}</p><h2 class="big">${h(ZQ.q)}</h2>
      ${abcd(ZQ.o,c,null,st===4)}
      <div class="satzb"><span>Ich denke, Emre ist am … fertig, weil …</span><span>Ich bin für B, weil …</span></div>
      ${st===4?`<div class="merk" style="font-size:1.15rem;margin-top:12px"><b>Heute noch keine Auflösung.</b> Erst lesen wir nach (Aufgabenblatt „Zum Nachlesen“, Buch S. 18–20) – dann schauen wir, wer richtig lag.</div>`:""}
      <div class="ctrl">${st===3?`<button class="pri" id="bC">Abstimmung schließen</button>`:`<button id="bO">Noch einmal öffnen</button><button class="pri" id="bW">Weiter: Probezeit & Ende →</button>`}</div>`;
    if($("bC"))$("bC").onclick=()=>{T.z.st=4;up();};
    if($("bO"))$("bO").onclick=()=>{T.z.st=3;up();};
    if($("bW"))$("bW").onclick=()=>go(3);
  }

  /* ---------- 3 Probezeit rechnen + Ende der Ausbildung ---------- */
  function rPzE(M){
    if(T.e.i<0){const N=players().length;
      const rows=PZ.map((P,i)=>{let ok=0,all=0;const wr={};for(const id of players()){const a=(T.pz[id]||{})[i];if(!a)continue;all++;if(a===P.a)ok++;else wr[a]=(wr[a]||0)+1;}
        const top=Object.entries(wr).sort((a,b)=>b[1]-a[1]).slice(0,2);const pc=all?Math.round(100*ok/all):null;
        return `<div class="pfc"><div class="row" style="justify-content:space-between"><b>${i+1}${P.pro?' <span class="pro">Profi</span>':""}${P.src?` <span class="muted">${h(P.src)}</span>`:""}</b><span class="pc">${pc==null?"–":pc+" %"}</span></div>
          <div style="margin:4px 0">${h(P.t.length>110?P.t.slice(0,108)+" …":P.t)}</div>
          <div class="mbar"><i style="width:${pc||0}%"></i></div><div class="muted" style="margin-top:4px">${ok} von ${all} richtig${top.length?` · häufig falsch: ${top.map(x=>h(x[0])+" ("+x[1]+")").join(", ")}`:""}</div>
          ${T.pzShow?`<div style="margin-top:6px"><b>Lösung: ${h(P.a)}.</b> ${P.w.map(h).join(" ")}</div>`:""}</div>`;}).join("");
      const fertig=players().filter(id=>Object.keys(T.pz[id]||{}).length>=PZ.length).length;
      M.innerHTML=`<div class="qhead"><div><h2 class="big">Probezeit rechnen</h2><p style="font-size:1.2rem">Am Handy: Tag und Monat eintippen (TT.MM) – wie in der IHK-Prüfung. Ihr seht sofort, ob es stimmt.</p></div>
        <div class="box" style="text-align:center"><div class="bigpts">${fertig}/${N}</div>fertig</div></div>
        <div class="merk" style="font-size:1.15rem"><b>Trick:</b> Beginn am Ersten → Ende am letzten Tag des letzten Monats. Beginn mitten im Monat → Ende am Tag davor. Satz: „Die Probezeit endet mit Ablauf des …“</div>
        <div class="pfgrid">${rows}</div>
        <div class="ctrl"><button id="bSh">${T.pzShow?"Lösungen ausblenden":"Lösungen zeigen"}</button><button class="pri" id="bE">Weiter: Wann ist Emre fertig? →</button></div>`;
      $("bSh").onclick=()=>{T.pzShow=!T.pzShow;save();render();};
      $("bE").onclick=()=>{T.e={i:0,open:false};up();};return;}
    if(T.e.i===0){const c=counts("z"),n=sum(c);
      M.innerHTML=`<p class="muted">Auflösung der Abstimmung von vorhin · ${n} Stimmen</p><h2 class="big">${h(ZQ.q)}</h2>
        ${abcd(ZQ.o,c,ZQ.k,true)}
        <div class="two" style="margin-top:14px"><div class="merk" style="font-size:1.15rem">${h(ZQ.x)}</div><div>${ENDE_TAB}</div></div>
        <div class="ctrl"><button class="pri" id="bN">Nächste Frage: Was, wenn …? →</button></div>`;
      $("bN").onclick=()=>{T.e={i:1,open:true};up();};return;}
    hinge(M,END,T.e,"e","Ende der Ausbildung",()=>go(4),"Weiter: Fall-Rallye (DS 2) →");
  }

  /* ---------- 4 Fall-Rallye (Karten hängen im Raum) ---------- */
  function rFall(M){
    const F=T.fr,N=players().length;
    if(F.r<0){
      const cnt=FALL.map((_,i)=>players().filter(id=>(T.fa[id]||{})[i]).length);
      M.innerHTML=`<div class="qhead"><div><h2 class="big">Fall-Rallye: Ist die Kündigung wirksam?</h2>
        <p style="font-size:1.2rem">Die acht Fallkarten hängen im Raum. Geht zu zweit von Karte zu Karte. Am Handy: Fall antippen → <b>wirksam</b> oder <b>unwirksam</b> → <b>Warum?</b> Ändern geht, solange die Rallye läuft.</p></div>
        <div class="box" style="text-align:center"><div class="bigpts">${players().filter(id=>Object.keys(T.fa[id]||{}).length>=FALL.length).length}/${N}</div>alle 8 fertig</div></div>
        <div class="two"><div class="box">${treeSVG({leaves:F.leaves})}${TREENOTE}</div>
        <div><div class="pfgrid" style="grid-template-columns:repeat(2,1fr)">${FALL.map((f,i)=>`<div class="pfc"><div class="row" style="justify-content:space-between"><b>Fall ${i+1}</b><span class="muted">${cnt[i]} Antworten</span></div><div class="mbar" style="background:var(--surface2)"><i style="width:${N?Math.round(100*cnt[i]/N):0}%;background:var(--brand)"></i></div></div>`).join("")}</div>
        <div class="satzb" style="margin-top:12px">${FSATZ.map(s=>`<span>${h(s)}</span>`).join("")}</div></div></div>
        <div class="ctrl"><button id="bLv">${F.leaves?"Ergebnisfelder ausblenden":"Ergebnisfelder zeigen"}</button>
        <button class="pri" id="bE">Rallye beenden – Karte für Karte auflösen →</button></div>`;
      $("bLv").onclick=()=>{F.leaves=!F.leaves;save();render();};
      $("bE").onclick=()=>{F.open=false;F.r=0;F.show=false;F.showY=false;up();};return;}
    if(F.r>=FALL.length){
      const per=FALL.map((_,i)=>{const ids=players().filter(id=>(T.fa[id]||{})[i]);return {n:ids.length,ok:ids.filter(id=>fallOk(id,i)).length};});
      const L=players().map(id=>({n:T.pl[id].n,k:fallRight(id)})).sort((a,b)=>b.k-a.k);
      M.innerHTML=`<h2 class="big">So lief die Fall-Rallye</h2><div class="two"><div><h3>Ergebnis und Weg richtig</h3>${FALL.map((f,i)=>bar(`Fall ${i+1}${f.knack?" · Knacknuss":""}`,per[i].ok,per[i].n)).join("")}</div>
        <div><h3>Fall-Profis (von 8)</h3><ol class="top">${L.slice(0,10).map((x,i)=>`<li><span>${i+1}. ${h(x.n)}</span><b>${x.k}</b></li>`).join("")}</ol></div></div>
        <div class="ctrl"><button id="bB">← letzter Fall</button><button class="pri" id="bW">Weiter: Zeugnis →</button></div>`;
      $("bB").onclick=()=>{F.r=FALL.length-1;F.show=true;up();};$("bW").onclick=()=>go(5);return;}
    const f=FALL[F.r],ids=players().filter(id=>(T.fa[id]||{})[F.r]),wk=ids.filter(id=>T.fa[id][F.r].c===1).length;
    const gc=G.map((_,g)=>ids.filter(id=>T.fa[id][F.r].g===g).length);
    const Y=players().map(id=>(T.fy[id]||{})[F.r]).filter(Boolean),sol=G[f.g];
    M.innerHTML=`<p class="muted">Fall ${F.r+1} von ${FALL.length}${f.knack?" · Knacknuss":""} · ${ids.length} Antworten</p>
      <div class="two"><div><div class="sit">${h(f.t)}</div>
        <div class="row" style="margin-top:12px;gap:12px"><div class="ab ${F.show?(sol.w?"right":"dim"):""}" style="flex:1"><span class="L">wirksam</span><span class="n">${wk}</span></div>
        <div class="ab ${F.show?(!sol.w?"right":"dim"):""}" style="flex:1"><span class="L">unwirksam</span><span class="n">${ids.length-wk}</span></div></div>
        <h3 style="margin-top:14px">Welcher Weg durch den Baum?</h3>${G.map((g,i)=>bar(h(g.t),gc[i],ids.length,F.show&&i===f.g?"A":"")).join("")}
        ${F.show?`<div class="merk" style="font-size:1.15rem"><b>${sol.w?"wirksam":"unwirksam"}</b> – ${h(f.x)}</div>`:`<div class="merk" style="font-size:1.15rem">Ein Paar erklärt: Ergebnis und Weg durch den Baum.</div>`}
        ${F.showY?`<h3>Profi-Begründungen (${Y.length})</h3><ul class="whyl">${Y.map(t=>`<li>${h(t)}</li>`).join("")||"<li class='muted'>keine</li>"}</ul>`:""}</div>
      <div class="box">${treeSVG({leaves:true,path:F.show?sol.p:[]})}</div></div>
      <div class="ctrl">${F.show?`<button class="pri" id="bN">${F.r<FALL.length-1?"Nächster Fall →":"Gesamtergebnis →"}</button>`:`<button class="pri" id="bL">Lösung zeigen</button>`}
      <button id="bY">${F.showY?"Begründungen ausblenden":`Profi-Begründungen (${Y.length})`}</button>
      ${F.r>0?`<button id="bB">← zurück</button>`:""}<button id="bO">Rallye wieder öffnen</button></div>`;
    if($("bL"))$("bL").onclick=()=>{F.show=true;up();};
    if($("bN"))$("bN").onclick=()=>{F.r++;F.show=false;F.showY=false;up();};
    if($("bB"))$("bB").onclick=()=>{F.r--;F.show=true;up();};
    $("bY").onclick=()=>{F.showY=!F.showY;save();render();};
    $("bO").onclick=()=>{F.open=true;F.r=-1;F.show=false;up();};
  }

  /* ---------- 5 Zeugnis ---------- */
  function rZg(M){
    const N=players().length,fertig=players().filter(id=>Object.keys(T.zg[id]||{}).length>=ZG.length).length;
    const st=ZG.map((c,i)=>{let ok=0,all=0;for(const id of players()){const a=(T.zg[id]||{})[i];if(a){all++;if(a===c.w)ok++;}}return {ok,all};});
    const order=ZG.map((_,i)=>i);if(T.zgShow)order.sort((a,b)=>(st[a].all?st[a].ok/st[a].all:1)-(st[b].all?st[b].ok/st[b].all:1));
    M.innerHTML=`<div class="qhead"><div><h2 class="big">Einfach oder qualifiziert?</h2><p style="font-size:1.2rem">Am Handy: Steht die Angabe schon im <b>einfachen</b> Zeugnis – oder <b>nur im qualifizierten</b>?</p></div>
      <div class="box" style="text-align:center"><div class="bigpts">${fertig}/${N}</div>fertig</div></div>
      <div class="pfgrid">${order.map(i=>{const c=ZG[i],s=st[i],pc=s.all?Math.round(100*s.ok/s.all):null;
        return `<div class="pfc ${T.zgShow?(c.w==="E"?"A":"B"):""}"><div>${h(c.t)}</div>${T.zgShow?`<div style="margin-top:6px"><b class="${c.w==="E"?"az":"be"}">${ZW[c.w]}</b></div>`:""}
          <div class="row" style="justify-content:space-between;margin-top:6px"><span class="pc">${pc==null?"–":pc+" %"}</span><span class="muted">${s.ok} von ${s.all} richtig</span></div><div class="mbar"><i style="width:${pc||0}%"></i></div></div>`;}).join("")}</div>
      ${T.zgShow?`<div class="merk" style="font-size:1.15rem"><b>Regel:</b> Fakten (Art, Dauer, Ziel, Kenntnisse) = einfaches Zeugnis. Sätze über Verhalten und Leistung = nur qualifiziert, und das gibt es nur auf Verlangen (§ 16 BBiG).</div>`:""}
      <div class="ctrl"><button id="bSh">${T.zgShow?"Lösung ausblenden":"Lösung zeigen und sortieren"}</button><button class="pri" id="bW">Weiter: Merken →</button></div>`;
    $("bSh").onclick=()=>{T.zgShow=!T.zgShow;save();render();};$("bW").onclick=()=>go(6);
  }

  /* ---------- 6 Merken ---------- */
  function rMerk(M){
    M.innerHTML=`<h2 class="big">Das merken wir uns</h2>${MERK}
      <p class="muted">Weiter im Aufgabenblatt: Aufgabe 8 und 9 (Prüfungs-Check), Profis Aufgabe 10, dann Selbsttest (Aufgabe 11).</p>
      <div class="ctrl"><button class="pri" id="bNext">Weiter: Prüfungs-Check →</button></div>`;
    $("bNext").onclick=()=>go(7);
  }

  /* ---------- 7 Prüfungs-Check ---------- */
  function rQuiz(M){
    if(T.q<0){M.innerHTML=`<h2 class="big">Prüfungs-Check</h2><p style="font-size:1.25rem">${QUIZ.length} Fragen, die meisten Originale aus der IHK-Prüfung. Die letzten beiden sind für Profis <span class="pro">Profi</span>. Richtig ist wichtiger als schnell.</p>
      <div class="ctrl"><button class="pri" id="bQ">Erste Frage →</button></div>`;$("bQ").onclick=()=>openQ(0);return;}
    const Q=QUIZ[T.q],A=T.qAns[T.q]||{},cnt=Q.o.map((_,i)=>Object.values(A).filter(a=>a.c===i).length),n=Object.keys(A).length,dur=qDur(Q);
    M.innerHTML=`<div class="qhead"><div><p class="muted">Frage ${T.q+1} von ${QUIZ.length}${Q.pro?' <span class="pro">Profi</span>':""} · ${h(Q.src)} · ${n} von ${players().length} geantwortet</p><h2 class="${Q.q.length>160||Q.l?"mid":"big"}">${h(Q.q)}</h2>
      ${Q.l?`<ol class="qlist">${Q.l.map(x=>`<li>${h(x)}</li>`).join("")}</ol>`:""}</div>
      ${T.qOpen?`<div class="timer" id="tm">${dur}</div>`:""}</div>
      <div class="opts">${Q.o.map((o,i)=>`<div class="opt o${i} ${!T.qOpen&&i!==Q.k?"wrong":""}">${"ABCDE"[i]}: ${h(o)}${T.qOpen?"":`<span class="cnt">${cnt[i]}</span>`}</div>`).join("")}</div>
      ${T.qOpen?"":`<div class="merk" style="font-size:1.15rem;margin-top:14px">${h(Q.x)}</div>`}
      <div class="ctrl">${T.qOpen?`<button class="pri" id="bR">Auflösen</button>`:T.q<QUIZ.length-1?`<button class="pri" id="bN">Nächste Frage →</button>`:""}<button id="bW">Zur Siegerehrung</button></div>`;
    if($("bR"))$("bR").onclick=()=>{T.qOpen=false;up();};
    if($("bN"))$("bN").onclick=()=>openQ(T.q+1);
    $("bW").onclick=()=>go(8);
    if(T.qOpen){clearInterval(window._qt);window._qt=setInterval(()=>{const s=Math.max(0,Math.ceil(dur-(Date.now()-T.qStart)/1000));if($("tm"))$("tm").textContent=s;
      if(s<=0&&T.qOpen){T.qOpen=false;up();}if(!T.qOpen)clearInterval(window._qt);},250);}
  }
  function openQ(i){T.q=i;T.qOpen=true;T.qStart=Date.now();up();}

  /* ---------- 8 Sieger ---------- */
  function rWin(M){
    const r=ranking(),L=players().map(id=>({n:T.pl[id].n,k:fallRight(id),p:pzRight(id)})).sort((a,b)=>b.k-a.k||b.p-a.p);
    M.innerHTML=`<h2 class="big">Siegerehrung</h2><div class="two"><div><h3>Prüfungs-Check</h3>
      <div class="podium">${[1,0,2].filter(i=>r[i]).map(i=>`<div style="height:${[190,150,120][i]}px"><span>${i+1}.</span>${h(r[i].n)}<br>${r[i].s}</div>`).join("")}</div>
      <ol class="top" style="margin-top:14px">${r.slice(3,10).map((x,i)=>`<li><span>${i+4}. ${h(x.n)}</span><b>${x.s}</b></li>`).join("")}</ol></div>
      <div><h3>Fall-Profis: Rallye richtig (von 8) · Probezeit (von 5)</h3><ol class="top">${L.slice(0,6).map((x,i)=>`<li><span>${i+1}. ${h(x.n)}</span><b>${x.k} · ${x.p}</b></li>`).join("")}</ol></div></div>`;
  }
  render();
}
</script>
<script>
/* =========================================================
   HANDY (Schülerinnen und Schüler)
   ========================================================= */
function phoneApp(){
  $("phone").hidden=false;
  const KEY="wisom4ende_p_"+roomCode+(params.get("t")||"");
  let me=store(KEY)||{};if(!me.pid){me.pid=rnd(8);store(KEY,me);}
  let S=null,lastKey="",pending=null,qEnd=0,qSel={},vSel={},conn={up:0};
  let zSeq=[],pzFb=null,pzLoc={},pzErr="",frCur=null,frC=null,frStep=0,fySent={},zgLoc={},zgFb=null;
  /* eigene, feste Reihenfolge der Karten (aus der Spieler-ID) */
  let seed=0;for(const ch of me.pid)seed=(seed*31+ch.charCodeAt(0))>>>0;
  const mix=n=>{const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){seed=(seed*1103515245+12345)>>>0;const j=seed%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
  const evOrder=mix(EV.length),zgOrder=mix(ZG.length);
  const net=new Net((t,p)=>{if(t===NS+roomCode+"/st"&&p&&typeof p==="object")onState(p);},c=>{conn=c;if(c.up)hello();});
  net.sub(roomCode+"/st");
  const send=o=>{o.p=me.pid;net.pub(roomCode+"/in",o,false);};
  function hello(){if(me.nick)send({k:"hi",n:me.nick});}
  setInterval(()=>{if(!S)return;
    if(me.nick&&!(S.j||[]).includes(me.pid))hello();
    else if(pending&&pending.done&&!pending.done())send(pending.msg);},2500);
  function onState(p){
    if(p.qOpen&&(!S||!S.qOpen||S.q!==p.q))qEnd=Date.now()+p.rem*1000;
    S=p;
    if((S.kick||[]).includes(me.pid)&&me.nick){me={pid:rnd(8)};store(KEY,me);lastKey="";}
    render();
  }
  const mine=()=>(S&&S.pp&&S.pp[me.pid])||{v:{},zo:null,pz:{},fa:{},fy:[],zg:{}};
  function keyOf(){if(!me.nick)return "join";if(!S)return "wait";
    return JSON.stringify([S.ph,S.w,S.z,S.e,S.fr,mine(),S.q,S.qOpen,(S.ans||[]).includes(me.pid),S.ph>=7&&S.sc?S.sc[me.pid]:0,
      zSeq.length,pzFb,Object.keys(pzLoc).length,pzErr,frCur,frC,frStep,zgFb,Object.keys(zgLoc).length]);}
  const rerender=()=>{lastKey="";render();};
  /* Eingaben und geöffnete Profi-Felder über ein Neuzeichnen retten (Tafel-Updates kommen jederzeit) */
  function render(){const keep={};$("phone").querySelectorAll("input[id],textarea[id]").forEach(x=>{keep[x.id]=[x.value,document.activeElement===x];});
    const op=[...$("phone").querySelectorAll("details")].map(d=>d.open);
    draw();
    for(const id in keep){const x=$(id);if(x&&!x.value){x.value=keep[id][0];if(keep[id][1])x.focus();}}
    $("phone").querySelectorAll("details").forEach((d,i)=>{if(op[i])d.open=true;});}
  function draw(){const k=keyOf();if(k===lastKey)return;lastKey=k;const P=$("phone");
    const top=`<div class="ph-top"><span>Wann ist Schluss? · ${roomCode}</span><span>${h(me.nick||"")} <button class="hbtn" data-wort="1">Wörter</button></span></div>`;
    if(!me.nick){P.innerHTML=top+`<h2>Probezeit, Ende, Kündigung</h2><p>Gib einen Spitznamen ein.</p>
      <input id="nk" maxlength="16" placeholder="Spitzname" autocomplete="off"><div style="height:10px"></div><button class="pri" id="bJ" style="width:100%">Mitmachen</button>`;
      $("bJ").onclick=()=>{const n=clean($("nk").value,16);if(!n)return;me.nick=n;store(KEY,me);hello();rerender();};return;}
    if(!S){P.innerHTML=top+`<p>Verbinde mit der Tafel …</p>`;return;}
    if(S.ph===0){P.innerHTML=top+`<h2>Du bist drin!</h2><p>Warte, bis es an der Tafel losgeht.</p>
      <div class="merk">Heute geht es um Probezeit, Ende der Ausbildung und Kündigung. Neue Wörter findest du oben unter „Wörter“.</div>`;return;}
    if(S.ph===1)return rHinge(P,top,WDH,S.w,"w","Ankommen",1);
    if(S.ph===2)return rZeit(P,top);
    if(S.ph===3)return rPzE(P,top);
    if(S.ph===4)return rFall(P,top);
    if(S.ph===5)return rZg(P,top);
    if(S.ph===6){P.innerHTML=top+`<h2>Das merken wir uns</h2>${MERK_P}`;return;}
    if(S.ph===7)return rQuiz(P,top);
    const sc=(S.sc&&S.sc[me.pid])||[0,"–",0];
    P.innerHTML=top+`<h2>Geschafft!</h2><div class="box"><div class="bigpts">Platz ${sc[1]}</div>${sc[0]} Punkte im Prüfungs-Check · ${S.np||"?"} haben mitgespielt</div>
      <p>Fall-Rallye: <b>${fallRight()} von 8</b> richtig · Probezeit: <b>${pzRight()} von ${PZ.length}</b> richtig.</p><p>Danke fürs Mitmachen!</p>`;
  }
  const fallRight=()=>{const fa=mine().fa;return FALL.filter((f,i)=>fa[i]&&fa[i].g===f.g).length;};
  const pzRight=()=>{const pz=Object.assign({},pzLoc,mine().pz);return PZ.filter((p,i)=>pz[i]===p.a).length;};

  /* Auswahl A–D senden (ändern erlaubt, solange offen) */
  function voteButtons(P,key,opts,isOpen){
    const saved=mine().v[key],sel=vSel[key]!=null?vSel[key]:saved;
    const html=opts.map((o,i)=>`<button class="pbtn ${sel===i?"sel":""}" data-i="${i}"><span class="L">${"ABCD"[i]}</span>${h(o)}</button>`).join("")+
      (sel!=null?`<div class="status ${saved===sel?"ok":""}">${saved===sel?"Gespeichert ✓ Du darfst noch wechseln.":"Wird gesendet …"}</div>`:"");
    return {html,bind:()=>P.querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{const c=+b.dataset.i;vSel[key]=c;
      pending={msg:{k:"v",key,c},done:()=>!isOpen()||mine().v[key]===vSel[key]};send(pending.msg);rerender();})};}

  /* Frage mit Auflösung (Ankommen, Ende) */
  function rHinge(P,top,list,st,pre,title,ph){
    if(st.i<0){P.innerHTML=top+`<h2>${title}</h2><p>Gleich geht es los. Schau an die Tafel.</p>`;return;}
    const Q=list[st.i],key=pre+st.i;
    if(st.open){const i=st.i,ob=pre==="w"?"w":"e",B=voteButtons(P,key,Q.o,()=>S.ph===ph&&S[ob].open&&S[ob].i===i);
      P.innerHTML=top+`<p class="muted">${title} · Frage ${st.i+1} von ${list.length}</p><h2>${h(Q.q)}</h2>`+B.html;B.bind();return;}
    const my=mine().v[key];
    P.innerHTML=top+`<p class="muted">${title} · Frage ${st.i+1} von ${list.length}</p><h2>${h(Q.q)}</h2>
      <div class="status ${my==null?"":my===Q.k?"ok":"bad"}">${my==null?"Keine Antwort.":my===Q.k?"<b>Richtig!</b>":"<b>Leider falsch.</b>"}</div>
      <p><b>Richtig: ${h(Q.o[Q.k])}</b><br>${h(Q.x)}</p>`;
  }

  /* ---------- 2 Wann ist Schluss? ---------- */
  function rZeit(P,top){
    const st=S.z.st,zo=mine().zo;
    if(st===0){P.innerHTML=top+`<h2>Wann ist Schluss?</h2><div class="box">Emre macht eine Ausbildung zum Verkäufer. Sein Vertrag läuft vom <b>01.08.2026</b> bis zum <b>31.07.2028</b>.</div><p>Gleich ordnest du sechs Ereignisse auf seinem Zeitstrahl.</p>`;return;}
    if(st===1){
      if(zo){P.innerHTML=top+`<h2>Gespeichert ✓</h2><p>Deine Reihenfolge ist angekommen. Warte auf die Auflösung an der Tafel.</p>`;return;}
      const left=evOrder.filter(i=>!zSeq.includes(i));
      if(left.length===0){P.innerHTML=top+`<h2>Deine Reihenfolge</h2><ol class="seq">${zSeq.map(i=>`<li>${h(EV[i].t)}</li>`).join("")}</ol>
        <button class="pri" id="bSend" style="width:100%">${pending&&pending.msg.k==="zo"?"Wird gesendet …":"Absenden"}</button><button id="bUndo" style="width:100%;margin-top:8px">Rückgängig</button>`;
        $("bSend").onclick=()=>{pending={msg:{k:"zo",o:zSeq.slice()},done:()=>S.ph!==2||S.z.st!==1||!!mine().zo};send(pending.msg);rerender();};
        $("bUndo").onclick=()=>{zSeq.pop();rerender();};return;}
      P.innerHTML=top+`<p class="muted">${zSeq.length} von ${EV.length} gelegt</p><div class="prog"><i style="width:${Math.round(100*zSeq.length/EV.length)}%"></i></div>
        <h2>${zSeq.length===0?"Was passiert zuerst?":"Was kommt danach?"}</h2>
        ${left.map(i=>`<button class="pbtn" data-i="${i}">${h(EV[i].t)}</button>`).join("")}
        ${zSeq.length?`<ol class="seq">${zSeq.map(i=>`<li>${h(EV[i].t)}</li>`).join("")}</ol><button id="bUndo" style="width:100%">Rückgängig</button>`:""}`;
      P.querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{zSeq.push(+b.dataset.i);rerender();});
      if($("bUndo"))$("bUndo").onclick=()=>{zSeq.pop();rerender();};return;}
    if(st===2){const ok=zo?zo.filter((x,i)=>x===i).length:0;
      P.innerHTML=top+`<h2>Die richtige Reihenfolge</h2>${zo?`<div class="status ${ok===EV.length?"ok":""}"><b>${ok} von ${EV.length}</b> an der richtigen Stelle.</div>`:`<div class="status">Du hast nicht abgegeben.</div>`}
        <ol class="seq">${EV.map((e,i)=>`<li>${zo?(zo[i]===i?"✓ ":"✗ "):""}<b>${h(e.t)}</b><br><span class="muted">${h(e.d)}</span></li>`).join("")}</ol>`;return;}
    if(st===3){const B=voteButtons(P,"z",ZQ.o,()=>S.ph===2&&S.z.st===3);
      P.innerHTML=top+`<h2>${h(ZQ.q)}</h2><p class="muted">Entscheide nach deinem Gefühl. Aufgelöst wird später.</p>`+B.html;B.bind();return;}
    const my=mine().v.z;
    P.innerHTML=top+`<h2>${h(ZQ.q)}</h2><div class="status">${my==null?"Du hast nicht gewählt.":`Deine Wahl: <b>${"ABCD"[my]}</b> – ${h(ZQ.o[my])}`}</div>
      <div class="merk">Die Auflösung kommt später – erst lesen wir nach.</div>`;
  }

  /* ---------- 3 Probezeit rechnen + Ende ---------- */
  function rPzE(P,top){
    if(S.e.i===0){const my=mine().v.z;
      P.innerHTML=top+`<h2>${h(ZQ.q)}</h2><div class="status ${my==null?"":my===ZQ.k?"ok":"bad"}">${my==null?"Du hattest nicht gewählt.":`Deine Wahl vorhin: <b>${"ABCD"[my]}</b> – ${my===ZQ.k?"<b>richtig!</b>":"leider falsch."}`}</div>
        <p><b>Richtig: ${h(ZQ.o[ZQ.k])}</b><br>${h(ZQ.x)}</p>`;return;}
    if(S.e.i>=1)return rHinge(P,top,END,S.e,"e","Ende der Ausbildung",3);
    const ans=Object.assign({},pzLoc,mine().pz),done=Object.keys(ans).length;
    const prog=`<div class="muted">${done} von ${PZ.length} Aufgaben</div><div class="prog"><i style="width:${Math.round(100*done/PZ.length)}%"></i></div>`;
    if(pzFb!=null){const Pz=PZ[pzFb],a=ans[pzFb],ok=a===Pz.a;
      P.innerHTML=top+prog+`<div class="box">${h(Pz.t)}</div>
        <div class="status ${ok?"ok":"bad"}">${ok?"<b>Richtig!</b>":`<b>Leider falsch.</b> Du hast ${h(a)} eingetippt. ${Pz.f&&Pz.f[a]?h(Pz.f[a]):""}`}</div>
        <div class="box" style="margin-top:10px"><b>So rechnest du:</b>${Pz.w.map(x=>`<p style="margin:.3em 0">${h(x)}</p>`).join("")}</div>
        <button class="pri" id="bNx" style="width:100%;margin-top:14px">${done<PZ.length?"Nächste Aufgabe →":"Fertig"}</button>`;
      $("bNx").onclick=()=>{pzFb=null;rerender();};return;}
    const next=PZ.findIndex((_,i)=>!ans[i]);
    if(next<0){P.innerHTML=top+prog+`<h2>Fertig!</h2><div class="box"><div class="bigpts">${pzRight()} von ${PZ.length}</div>richtig gerechnet</div>
      <div class="merk"><span class="pro">Profi</span> Erkläre deinem Nachbarn, warum die Probezeit bei Beginn am 15.08. am 14.10. endet und nicht am 15.10.</div>`;return;}
    const Pz=PZ[next];
    P.innerHTML=top+prog+`<p class="muted">Aufgabe ${next+1}${Pz.pro?' <span class="pro">Profi</span>':""}${Pz.src?" · "+h(Pz.src):""}</p><div class="box" style="font-size:1.1rem">${h(Pz.t)}</div>
      ${Pz.hint?`<p class="muted">Tipp: ${h(Pz.hint)}</p>`:""}
      <label style="display:block;margin-top:12px"><b>Lösung (TT.MM):</b><input id="pzIn" class="pzin" inputmode="decimal" maxlength="10" placeholder="TT.MM" autocomplete="off"></label>
      ${pzErr?`<div class="status bad">${h(pzErr)}</div>`:""}
      <button class="pri" id="bPz" style="width:100%;margin-top:10px">Prüfen</button>`;
    $("bPz").onclick=()=>{const a=normDate($("pzIn").value);if(!a){pzErr="Bitte Tag und Monat eintippen, z. B. 30.11";rerender();return;}
      pzErr="";pzLoc[next]=a;pzFb=next;const i=next;pending={msg:{k:"pz",i,a},done:()=>S.ph!==3||!!mine().pz[i]};send(pending.msg);rerender();};
  }

  /* ---------- 4 Fall-Rallye ---------- */
  function rFall(P,top){
    const fa=mine().fa,F=S.fr;
    if(F.r>=0){
      if(F.r>=FALL.length){P.innerHTML=top+`<h2>Fall-Rallye: Ergebnis</h2><div class="box"><div class="bigpts">${fallRight()} von 8</div>Ergebnis und Weg richtig</div>`;return;}
      const f=FALL[F.r],a=fa[F.r],sol=G[f.g];
      const my=a?`Eure Antwort: <b>${a.c?"wirksam":"unwirksam"}</b> – ${h(G[a.g].t)}`:"Keine Antwort zu diesem Fall.";
      if(!F.show){P.innerHTML=top+`<p class="muted">Auflösung · Fall ${F.r+1}</p><div class="box">${h(f.t)}</div><div class="status">${my}</div><div class="merk">Schau an die Tafel: Welcher Weg durch den Baum?</div>`;return;}
      P.innerHTML=top+`<p class="muted">Auflösung · Fall ${F.r+1}</p><div class="box">${h(f.t)}</div>
        <div class="status ${!a?"":a.g===f.g?"ok":"bad"}">${my}${a?(a.g===f.g?" – <b>richtig!</b>":a.c===(sol.w?1:0)?" – Ergebnis richtig, aber anderer Weg.":" – leider falsch."):""}</div>
        <p><b>Lösung: ${sol.w?"wirksam":"unwirksam"}</b> – ${h(sol.t)}<br>${h(f.x)}</p>`;return;}
    if(!F.open){P.innerHTML=top+`<h2>Rallye beendet</h2><p>Schau an die Tafel.</p>`;return;}
    if(frCur==null){const n=Object.keys(fa).length;
      P.innerHTML=top+`<h2>Fall-Rallye</h2><p>Geht zu zweit zu einer Fallkarte im Raum. Tippt hier die Nummer an.</p>
        <div class="muted">${n} von ${FALL.length} Fällen</div><div class="prog"><i style="width:${Math.round(100*n/FALL.length)}%"></i></div>
        <div class="fgrid">${FALL.map((f,i)=>`<button class="fbtn ${fa[i]?"done":""}" data-i="${i}"><b>Fall ${i+1}</b><span>${fa[i]?(fa[i].c?"wirksam ✓":"unwirksam ✓"):"offen"}</span></button>`).join("")}</div>`;
      P.querySelectorAll(".fbtn").forEach(b=>b.onclick=()=>{frCur=+b.dataset.i;frC=null;frStep=0;rerender();});return;}
    const i=frCur,back=`<button id="bBk" style="width:100%;margin-top:12px">← Zur Übersicht</button>`;
    const bindBack=()=>{$("bBk").onclick=()=>{frCur=null;rerender();};};
    if(frStep===0){P.innerHTML=top+`<p class="muted">Fall ${i+1} · Lies die Karte im Raum.</p><h2>Ist die Kündigung wirksam?</h2>
      <div class="yn"><button class="W" data-c="1">wirksam</button><button class="U" data-c="0">unwirksam</button></div>${back}`;
      P.querySelectorAll(".yn button").forEach(b=>b.onclick=()=>{frC=+b.dataset.c;frStep=1;rerender();});bindBack();return;}
    if(frStep===1){const opts=G.map((g,k)=>k).filter(k=>(G[k].w?1:0)===frC);
      P.innerHTML=top+`<p class="muted">Fall ${i+1} · ${frC?"wirksam":"unwirksam"}</p><h2>Warum?</h2><p class="muted">Welcher Weg durch den Entscheidungsbaum?</p>
        ${opts.map(k=>`<button class="pbtn" data-g="${k}">${h(G[k].t)}</button>`).join("")}<button id="bRe" style="width:100%">← anders entscheiden</button>`;
      P.querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{const g=+b.dataset.g,c=frC;frStep=2;
        pending={msg:{k:"fa",i,c,g},done:()=>S.ph!==4||!S.fr.open||(mine().fa[i]&&mine().fa[i].g===g)};send(pending.msg);rerender();});
      $("bRe").onclick=()=>{frStep=0;rerender();};return;}
    const a=fa[i],pm=pending&&pending.msg,okSent=!!a&&(!pm||pm.k!=="fa"||pm.i!==i||a.g===pm.g),hasY=(mine().fy||[]).includes(i);
    P.innerHTML=top+`<p class="muted">Fall ${i+1}</p><div class="status ${okSent?"ok":""}">${okSent?"Gespeichert ✓ Ihr könnt bis zum Ende der Rallye noch ändern.":"Wird gesendet …"}</div>
      ${hasY?`<div class="status ok" style="margin-top:10px"><span class="pro">Profi</span> Begründung angekommen ✓</div>`:
      `<details style="margin-top:14px" ${fySent[i]?"open":""}><summary><span class="pro">Profi</span> Begründe in einem Satz mit Paragraf</summary>
        <p class="muted">Zum Beispiel: „Die Kündigung ist unwirksam, weil nach § 22 Abs. 3 BBiG …“</p>
        <textarea id="fy" rows="3" maxlength="160">${h(fySent[i]||"")}</textarea><button id="bFy" style="width:100%;margin-top:8px">${fySent[i]?"Wird gesendet …":"Begründung senden"}</button></details>`}
      <button class="pri" id="bOv" style="width:100%;margin-top:14px">Nächster Fall →</button>`;
    $("bOv").onclick=()=>{frCur=null;rerender();};
    if($("bFy"))$("bFy").onclick=()=>{const tx=clean($("fy").value,160);if(!tx)return;fySent[i]=tx;
      pending={msg:{k:"fy",i,tx},done:()=>S.ph!==4||(mine().fy||[]).includes(i)};send(pending.msg);$("bFy").textContent="Wird gesendet …";};
  }

  /* ---------- 5 Zeugnis ---------- */
  function rZg(P,top){
    const ans=Object.assign({},zgLoc,mine().zg),done=Object.keys(ans).length,ok=Object.keys(ans).filter(i=>ans[i]===ZG[i].w).length;
    const prog=`<div class="muted">${done} von ${ZG.length} Karten</div><div class="prog"><i style="width:${Math.round(100*done/ZG.length)}%"></i></div>`;
    if(zgFb!=null){const c=ZG[zgFb],right=ans[zgFb]===c.w;
      P.innerHTML=top+prog+`<div class="pcard">${h(c.t)}</div>
        <div class="status ${right?"ok":"bad"}">${right?"<b>Richtig!</b>":"<b>Leider falsch.</b>"} ${c.w==="E"?"Das ist eine Tatsache – sie steht schon im <b class='az'>einfachen</b> Zeugnis.":"Das sagt etwas über Verhalten oder Leistung – das steht <b class='be'>nur im qualifizierten</b> Zeugnis."}</div>
        <button class="pri" id="bNx" style="width:100%;margin-top:14px">${done<ZG.length?"Nächste Karte →":"Fertig"}</button>`;
      $("bNx").onclick=()=>{zgFb=null;rerender();};return;}
    const next=zgOrder.find(i=>!ans[i]);
    if(next==null){P.innerHTML=top+prog+`<h2>Fertig!</h2><div class="box"><div class="bigpts">${ok} von ${ZG.length}</div>richtig</div>
      <div class="merk"><span class="pro">Profi</span> Warum darf ein Zeugnis keine negativen Aussagen und keine Geheimcodes enthalten? Finde eine Begründung.</div>`;return;}
    P.innerHTML=top+prog+`<p><b>Wo steht das?</b></p><div class="pcard">${h(ZG[next].t)}</div>
      <div class="yn"><button class="A" data-c="E">einfaches Zeugnis</button><button class="B" data-c="Q">nur qualifiziert</button></div>`;
    P.querySelectorAll(".yn button").forEach(b=>b.onclick=()=>{const c=b.dataset.c,i=next;zgLoc[i]=c;zgFb=i;
      pending={msg:{k:"zg",i,c},done:()=>S.ph!==5||!!mine().zg[i]};send(pending.msg);rerender();});
  }

  /* ---------- 7 Prüfungs-Check ---------- */
  function rQuiz(P,top){
    const sc=(S.sc&&S.sc[me.pid])||[0,"–",0];
    if(S.q<0){P.innerHTML=top+`<h2>Prüfungs-Check</h2><p>Gleich geht es los. Lies jede Frage genau. Richtig ist wichtiger als schnell!</p>`;return;}
    const Q=QUIZ[S.q],answered=(S.ans||[]).includes(me.pid);
    const list=Q.l?`<ol class="qlist">${Q.l.map(x=>`<li>${h(x)}</li>`).join("")}</ol>`:"";
    if(S.qOpen){
      if(answered||qSel[S.q]!=null){P.innerHTML=top+`<p class="muted">Frage ${S.q+1}</p><h2>${h(Q.q)}</h2><div class="status ${answered?"ok":""}">${answered?"Antwort gespeichert ✓":"Wird gesendet …"} Warte auf die Auflösung.</div>
        ${Q.pz?`<div class="merk"><b>Profi-Zusatz:</b> ${h(Q.pz)}</div>`:""}`;return;}
      P.innerHTML=top+`<div class="row" style="justify-content:space-between"><span class="muted">Frage ${S.q+1} von ${QUIZ.length}${Q.pro?' <span class="pro">Profi</span>':""}</span><b id="ptm"></b></div><h2>${h(Q.q)}</h2>${list}
        ${Q.o.map((o,i)=>`<button class="popt o${i}" data-i="${i}">${"ABCDE"[i]}: ${h(o)}</button>`).join("")}`;
      P.querySelectorAll(".popt").forEach(b=>b.onclick=()=>{const q=S.q;qSel[q]=+b.dataset.i;pending={msg:{k:"a",q,c:+b.dataset.i},done:()=>S.q!==q||!S.qOpen||(S.ans||[]).includes(me.pid)};send(pending.msg);rerender();});
      const t=()=>{const s=Math.max(0,Math.ceil((qEnd-Date.now())/1000));if($("ptm"))$("ptm").textContent=s+" s";};t();clearInterval(window._pt);window._pt=setInterval(t,250);return;}
    const my=qSel[S.q],ok=my===Q.k;
    P.innerHTML=top+`<p class="muted">Frage ${S.q+1} von ${QUIZ.length}</p>
      <div class="status ${my==null?"":ok?"ok":"bad"}">${my==null?"Keine Antwort.":ok?"<b>Richtig!</b> +"+sc[2]+" Punkte":"<b>Leider falsch.</b>"}</div>
      <p><b>Richtig: ${h(Q.o[Q.k])}</b><br>${h(Q.x)}</p>
      <div class="box"><div class="bigpts">${sc[0]} Punkte</div>Platz ${sc[1]} von ${S.np||"?"}</div>`;
  }
  $("phone").addEventListener("click",e=>{if(e.target.closest("[data-wort]"))openWort();});
  render();
}
const roomCode=(params.get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
if(params.get("woerter")){document.title="Wann ist Schluss? – Wörter";openWort();$("hClose").remove();}else if(roomCode)phoneApp();else tafelApp();
</script>
<script>
/* =========================================================
   QUIZ-MUSIK v2 (Skill live-klassen-app) – eigene Kompositionen, live per WebAudio erzeugt,
   keine Musikdatei, keine Rechte Dritter. Jede Abfrage bekommt ein ANDERES Stück aus dem Pool
   (gemischt, nie zweimal hintereinander). Läuft nur auf der Tafel.
   Ablauf: Loop während der Frage · letzte 10 s schneller · Ticks in den letzten 5 s · Jingle beim Auflösen · Fanfare beim Sieger
   ========================================================= */
const MUSIK_POOL=[
  {name:"Spannung",bpm:124,fast:156,bass:[45,45,41,40],ch:[[69,72,76],[69,72,76],[65,69,72],[64,68,71]],ap:[0,1,2,1,0,2,1,2],arp:"square",kick:[0,4,8,12],snare:[4,12],hat:"off"},
  {name:"Funk",bpm:104,fast:132,swing:.16,bass:[40,40,43,45],bp:[0,3,6,8,10,11,14],bt:"sawtooth",ch:[[64,67,71,74],[64,67,71,74],[67,71,74,77],[69,72,76,79]],ap:[0,2,1,3],as:[2,6,10,13],ad:.07,arp:"sawtooth",kick:[0,6,8],snare:[4,12],hat:"all"},
  {name:"Marimba",bpm:116,fast:144,bass:[48,45,41,43],ch:[[72,76,79],[69,72,76],[65,69,72],[67,71,74]],ap:[0,1,2,1,2,1,0,1],ad:.22,arp:"sine",oct:1,kick:[0,8],snare:[],hat:"none",cl:[3,11]},
  {name:"Chiptune",bpm:144,fast:176,bass:[43,43,40,38],bt:"square",ch:[[67,71,74],[67,71,74],[64,67,71],[62,66,69]],ap:[0,1,2,3,2,1],arp:"square",oct:1,ad:.06,kick:[0,8],snare:[4,12],hat:"none"},
  {name:"Latin",bpm:112,fast:140,bass:[38,38,43,45],bp:[0,3,8,11],ch:[[62,65,69],[62,65,69],[67,70,74],[69,73,76]],ap:[0,2,1,2],as:[0,2,3,6,8,10,11,14],arp:"triangle",kick:[0,6,8,14],snare:[],hat:"off",cl:[0,3,6,10,12]},
  {name:"Jazz",bpm:132,fast:164,swing:.3,walk:1,bass:[41,38,43,36],bp:[0,4,8,12],ch:[[65,69,72,76],[62,65,69,72],[67,70,74,77],[60,64,67,70]],ap:[0,2,1,3],as:[0,6,10],ad:.18,arp:"triangle",kick:[],snare:[],hat:"jazz"},
  {name:"Synthwave",bpm:100,fast:128,bass:[47,43,38,45],bp:[0,2,4,6,8,10,12,14],bt:"sawtooth",ch:[[71,74,78],[67,71,74],[62,66,69],[69,73,76]],ap:[0,1,2,1],arp:"sawtooth",ad:.14,kick:[0,4,8,12],snare:[4,12],hat:"all"},
  {name:"Detektiv",bpm:92,fast:120,bass:[37,37,42,44],bp:[0,3,8,10],ch:[[61,64,68],[61,64,68],[66,69,73],[68,72,75]],ap:[0,1,2,1,2,0],as:[0,2,4,7,8,10,12,15],ad:.12,arp:"triangle",kick:[0],snare:[8],hat:"off"}
];
const Music=(()=>{
  const ls=(k,v)=>{try{if(v===undefined){const x=localStorage.getItem(k);return x==null?null:JSON.parse(x);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}};
  let ctx=null,master=null,timer=null,next=0,step=0,fast=false,nbuf=null,on=ls("quizmusik")!==false;
  let order=[],last=-1,S=MUSIK_POOL[0];
  const mf=m=>440*Math.pow(2,(m-69)/12),AV={square:.04,sawtooth:.03,triangle:.08,sine:.1};
  function pick(){if(!order.length){order=MUSIK_POOL.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
      if(order[0]===last&&order.length>1)order.push(order.shift());}
    last=order.shift();S=MUSIK_POOL[last];return last;}
  function init(){try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();
      master=ctx.createGain();master.gain.value=.24;master.connect(ctx.destination);}
    if(ctx.state==="suspended")ctx.resume();return true;}catch(e){return false;}}
  function tone(f,t,d,type,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
  function noise(t,d,v,hp){if(!nbuf){nbuf=ctx.createBuffer(1,ctx.sampleRate*.3,ctx.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nbuf;f.type="highpass";f.frequency.value=hp;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02);}
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.13);
    g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2);}
  function play(st,t){const bar=Math.floor(st/16)%S.bass.length,s=st%16,ch=S.ch[bar%S.ch.length];
    const bp=S.bp||[0,2,4,6,8,10,12,14];
    if(bp.includes(s)){const off=S.walk?[0,4,7,9][Math.floor(s/4)%4]:(s%4===0?0:12);tone(mf(S.bass[bar]+off),t,S.walk?.3:.16,S.bt||"triangle",S.bt==="sawtooth"?.12:S.bt==="square"?.1:.32);}
    if(!S.as||S.as.includes(s))tone(mf(ch[S.ap[s%S.ap.length]%ch.length]+12*(S.oct||0)+(fast?12:0)),t,S.ad||.09,S.arp,AV[S.arp]||.05);
    if(S.kick.includes(s))kick(t);
    if(S.snare.includes(s))noise(t,.12,.25,1800);
    if(S.cl&&S.cl.includes(s))tone(1250,t,.04,"sine",.18);
    const hat=S.hat;
    if(hat==="all"||fast||(hat==="off"&&s%2===1)||(hat==="jazz"&&(s%4===0||s%8===6)))noise(t,.03,.07,7000);}
  function sched(){const d=60/(fast?S.fast:S.bpm)/4;
    if(next<ctx.currentTime-.05)next=ctx.currentTime+.02;
    while(next<ctx.currentTime+.12){play(step,next+(step%2?d*(S.swing||0):0));next+=d;step++;}}
  const root=()=>S.ch[0][0]%12+60;
  return {
    pool:MUSIK_POOL,
    current(){return S.name;},
    unlock(){if(on)init();},
    isOn(){return on;},
    toggle(){on=!on;ls("quizmusik",on);if(!on)this.stop();return on;},
    start(){if(!on||timer||!init())return;pick();fast=false;step=0;next=ctx.currentTime+.06;timer=setInterval(sched,25);
      try{console.log("[Quiz-Musik] Stück",last,S.name);}catch(e){}},
    hurry(){fast=true;},
    tick(){if(!on||!init())return;tone(1760,ctx.currentTime,.06,"sine",.25);},
    stop(){clearInterval(timer);timer=null;fast=false;},
    reveal(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.03,r=root();
      [0,4,7].forEach((m,i)=>tone(mf(r+m),t+i*.09,.25,"square",.08));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+.3,.9,"triangle",.14));kick(t+.3);noise(t+.3,.25,.25,3000);},
    fanfare(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.05,r=60;
      [[-5,0],[0,.15],[4,.3],[7,.45],[4,.7],[7,.85]].forEach(([m,d])=>tone(mf(r+m),t+d,.22,"square",.09));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+1.05,1.6,"triangle",.15));[0,.45,1.05].forEach(d=>kick(t+d));noise(t+1.05,.5,.3,2500);}
  };})();
/* Quiz-Musik automatisch an die Tafel koppeln: Timer #tm sichtbar = Abfrage läuft (Quiz, Prüfungs-Check, Abstimmung) */
(function MusicAuto(){
  if(new URLSearchParams(location.search).get("s"))return;
  const tf=document.getElementById("tafel"),st=document.getElementById("steps");
  let was=false,lastS=-1,pod=false;
  function btn(){if(!st||document.getElementById("bMus"))return;const b=document.createElement("button");b.id="bMus";b.type="button";
    b.title="Quiz-Musik an oder aus";b.style.cssText="padding:.25em .7em;font-weight:700;border-radius:999px;white-space:nowrap";
    b.onclick=()=>{Music.toggle();if(Music.isOn()&&was)Music.start();lab();};st.after(b);lab();}
  function lab(){const b=document.getElementById("bMus");if(b)b.textContent=Music.isOn()?"Musik: an":"Musik: aus";}
  document.addEventListener("pointerdown",()=>Music.unlock(),true);
  btn();
  setInterval(()=>{if(!tf||tf.hidden)return;btn();
    const tm=document.getElementById("tm"),vis=!!(tm&&tm.offsetParent!==null);
    if(vis){if(!was){was=true;lastS=-1;Music.start();}
      const s=parseInt(tm.textContent,10);if(!isNaN(s)&&s!==lastS){lastS=s;if(s<=10&&s>0)Music.hurry();if(s<=5&&s>0)Music.tick();}}
    else if(was){was=false;Music.reveal();}
    const p=document.querySelector("#tMain .podium"),pv=!!(p&&p.offsetParent!==null);
    if(pv&&!pod){pod=true;Music.fanfare();}if(!pv)pod=false;
  },200);
})();
</script>
