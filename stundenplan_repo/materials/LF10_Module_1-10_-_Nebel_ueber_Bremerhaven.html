<style>

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:12px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.1rem} h2{font-size:1.6rem} h3{font-size:1.2rem}
p{margin:0}

.muted{color:var(--muted)}

button{font:inherit;color:inherit;cursor:pointer}

.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:40px;padding:8px 12px;font-size:.92rem}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.mode:focus-visible,input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1 1 auto}
label.lab{font-weight:700;font-size:.95rem}
input[type=text],input[type=number],input.num{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);min-height:50px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.mode b{font-family:var(--f-display);font-weight:400;font-size:1.35rem}

.mode[aria-pressed="true"]{border-color:var(--lamp);box-shadow:0 0 0 3px color-mix(in srgb,var(--lamp) 25%,transparent)}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lamp)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:10px;min-height:46px;font-weight:700;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.hud{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:.9rem}
.fog{height:10px;border-radius:6px;background:var(--line);overflow:hidden;position:relative}
.fog i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#8fa3a8,#d9e2e3);transition:width .6s}
.letters{display:flex;gap:4px;font-family:var(--f-mono);font-weight:700;font-size:1.05rem;flex-wrap:wrap}

.q{font-weight:700;font-size:1.08rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:52px}

.opt[aria-pressed="true"]{border-color:var(--lamp)}

.opt.wrong{border-color:var(--bad)} .opt.wrong .k{background:var(--bad);color:#1d0703}

.feedback{border-radius:14px;padding:14px;border:2px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.feedback.good{border-color:var(--ok)} .feedback.badf{border-color:var(--bad)}
.verdict{font-family:var(--f-display);font-size:1.4rem}

.react{font-style:italic;color:var(--muted)}
.term{background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:12px;font-size:.95rem;display:flex;flex-direction:column;gap:4px}
.term .t{font-family:var(--f-mono);font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase}
.ledger{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:18px 16px;font-family:var(--f-display);font-size:1.15rem;position:relative;box-shadow:inset 0 0 40px rgba(120,90,40,.25)}
.ledger .big{font-family:var(--f-mono);font-size:3rem;font-weight:700;line-height:1;color:#7a2e1c}
.ledger .date{font-family:var(--f-mono);font-size:.8rem;opacity:.7}
.word{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.word span{width:30px;height:40px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:1.4rem;border-bottom:3px solid var(--lamp)}
.word span.misty{opacity:.4}
.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:2px solid var(--lamp);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:center}
.stars{display:flex;justify-content:center;gap:6px}
.stars svg{width:34px;height:34px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums}
.kpis div{background:var(--panel2);border-radius:10px;padding:8px}
.kpis b{display:block;font-size:1.3rem}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border-left:4px solid var(--line);padding:6px 0 6px 12px;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.rv.ok{border-color:var(--ok)} .rv.half{border-color:var(--lamp)} .rv.no{border-color:var(--bad)}
.rv .mk{font-weight:700}
.rv .ihk{font-size:.9rem;background:var(--panel2);border-radius:8px;padding:8px}
details{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
summary{cursor:pointer;font-weight:700}
.notice{font-size:.9rem;background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.topbtns{display:flex;justify-content:space-between;gap:8px;align-items:center}
.icon-btn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 10px;min-height:40px;font-size:.88rem}
.icon-btn svg{width:18px;height:18px}
.rechen{font-family:var(--f-mono);font-size:.95rem}
@keyframes drift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
@keyframes beam{0%{opacity:.0}10%{opacity:.9}40%{opacity:.0}100%{opacity:0}}
@keyframes flick{0%,100%{opacity:1}45%{opacity:1}47%{opacity:.35}49%{opacity:1}72%{opacity:.6}74%{opacity:1}}
@keyframes rise{from{transform:translateY(8px);opacity:.0}to{transform:none;opacity:1}}
.fogl{animation:drift 14s ease-in-out infinite alternate}
.fogl.b{animation-duration:19s;animation-direction:alternate-reverse}
.beam{animation:beam 5s linear infinite;transform-origin:96px 70px}
.flick{animation:flick 6s infinite}
.appear{animation:rise .45s ease-out}
@media (prefers-reduced-motion: reduce){.fogl,.beam,.flick,.appear{animation:none}}
@media (max-width:420px){ .word{gap:3px} .word span{width:25px;font-size:1.2rem} h1{font-size:1.8rem} .who{grid-template-columns:70px 1fr} .who svg{width:70px} .chips{grid-template-columns:repeat(5,1fr)} }
</style>
</head>

 o:[["„Es tut mir leid, in diesen Pralinen ist Likör. Die darf ich dir erst verkaufen, wenn du 18 bist. Schau mal, hier sind Nougatpralinen ohne Alkohol.“",1],["„Na gut. Wenn sie für deinen Papa sind, ist das in Ordnung.“",0],["„Nein. Das geht nicht. Der Nächste, bitte.“",0]],
 why:"Likörpralinen enthalten Branntwein. Sie dürfen erst ab 18 verkauft werden – egal, für wen sie sind. Freundlich ablehnen in vier Schritten: Bedauern – Grund – Alternative – Abschluss.",
 term:"Jugendschutz (branntweinhaltige Lebensmittel)",ihk:"Jugendschutz: Branntweinhaltige Lebensmittel dürfen nicht an Kinder und Jugendliche unter 18 Jahren abgegeben werden."},
{id:"a1-2",ch:1,m:"a",k:"mc",s:"Eine 16-Jährige legt eine Flasche Sekt aufs Band und zeigt ihren Ausweis.",q:"Darfst du verkaufen?",
 o:[["Ja. Sekt ist ab 16 erlaubt.",1],["Nein. Alkohol gibt es erst ab 18.",0],["Nur, wenn die Eltern dabei sind.",0]],
 why:"Bier, Wein und Sekt dürfen ab 16 Jahren verkauft werden. Der Ausweis zeigt: Sie ist 16. Also ist der Verkauf erlaubt.",
 term:"Altersgrenze 16 (Bier, Wein, Sekt)",ihk:"Bier, Wein und Sekt dürfen erst ab 16 Jahren abgegeben werden; Branntwein erst ab 18 Jahren."},
{id:"a1-3",ch:1,m:"a",k:"mc",s:"Ein Jugendlicher (etwa 16) will Bier und Wodka. Er sagt: „Ich bin 18.“ Einen Ausweis hat er nicht dabei.",q:"Was machst du?",
 o:[["Ich verkaufe gar nichts – auch das Bier nicht. Ohne Ausweis kann ich das Alter nicht prüfen.",1],["Das Bier verkaufe ich, den Wodka nicht.",0],["Ich verkaufe alles. Er hat ja gesagt, dass er 18 ist.",0]],
 why:"Im Zweifel wird der Ausweis verlangt. Ohne Nachweis wird nicht verkauft. Auch Bier nicht, denn vielleicht ist er jünger als 16.",
 term:"Alterskontrolle",ihk:"Im Zweifel ist eine Alterskontrolle durchzuführen; ohne Nachweis erfolgt kein Verkauf."},
{id:"a1-4",ch:1,m:"a",k:"mc",s:"Ein Junge (etwa 14) möchte E-Zigaretten kaufen. „Die sind ohne Nikotin!“, sagt er.",q:"Darfst du verkaufen?",
 o:[["Nein. E-Zigaretten gibt es erst ab 18 – auch ohne Nikotin.",1],["Ja. Ohne Nikotin ist das erlaubt.",0],["Ja, ab 14 ist das erlaubt.",0]],
 why:"Tabakwaren, E-Zigaretten und E-Shishas dürfen erst ab 18 verkauft werden. Das gilt auch für E-Zigaretten ohne Nikotin.",
 term:"Jugendschutz (Tabak, E-Zigaretten)",ihk:"Jugendschutz: E-Zigaretten – auch nikotinfrei – dürfen erst ab 18 Jahren abgegeben werden."},
{id:"a1-5",ch:1,m:"a",k:"rede",s:"Ein 13-Jähriger möchte ein Videospiel mit dem Zeichen „USK ab 16“ kaufen.",q:"Was sagst du?",
 o:[["„Tut mir leid, das Spiel ist erst ab 16 freigegeben. Ich kann es gern für deine Eltern zurücklegen.“",1],["„Kein Problem, Spiele haben keine Altersgrenze.“",0],["„Wenn du bar bezahlst, ist das okay.“",0]],
 why:"Filme und Spiele dürfen nur an Personen verkauft werden, die so alt sind wie auf dem FSK- oder USK-Zeichen steht.",
 term:"Alterskennzeichnung (USK/FSK)",ihk:"Alterskennzeichnung beachten: Abgabe erst ab dem angegebenen Alter (hier 16 Jahre)."},
{id:"a1-6",ch:1,m:"a",k:"mc",s:"Das Mädchen sagt: „Die Pralinen sind doch gar nicht für mich!“",q:"Was stimmt?",
 o:[["Das ist egal. Das Gesetz gilt für jeden Verkauf an Kinder.",1],["Dann darf ich verkaufen, wenn sie es mir verspricht.",0],["Dann darf ich verkaufen, wenn sie einen Zettel von den Eltern hat.",0]],
 why:"„Für die Eltern“ ist keine Ausnahme. Das Jugendschutzgesetz verbietet die Abgabe an Kinder und Jugendliche – egal, für wen die Ware ist.",
 term:"Jugendschutzgesetz (JuSchG)",ihk:"Das Jugendschutzgesetz verbietet die Abgabe von Branntwein an Kinder und Jugendliche unter 18 – egal, für wen die Ware bestimmt ist."},
{id:"p1-1",ch:1,m:"p",k:"mcb",s:"Ein 15-Jähriger kauft von seinem Taschengeld ein Handyspiel für 9,99 € und bezahlt sofort.",q:"Ist der Kaufvertrag wirksam?",
 o:[["Ja, er ist wirksam.",1],["Nein, er ist unwirksam.",0],["Nur mit Unterschrift der Eltern.",0]],
 b:{q:"Warum?",o:[["Er ist beschränkt geschäftsfähig, zahlt aber mit Mitteln zur freien Verfügung (Taschengeld) sofort vollständig (§ 110 BGB).",1],["Ab 14 Jahren ist man voll geschäftsfähig.",0],["Jugendliche dürfen alles kaufen, solange es kein Alkohol ist.",0]]},
 why:"7 bis 17 Jahre: beschränkt geschäftsfähig (§ 106 BGB). Nach § 110 BGB („Taschengeldparagraf“) ist der Vertrag wirksam, weil er sofort vollständig mit Taschengeld bezahlt.",
 term:"Taschengeldparagraf (§ 110 BGB)",ihk:"Der Kaufvertrag ist wirksam, da der beschränkt Geschäftsfähige die Leistung mit Mitteln bewirkt, die ihm zur freien Verfügung überlassen wurden."},
{id:"p1-2",ch:1,m:"p",k:"mcb",s:"Ein 16-jähriger Azubi kauft ohne Wissen der Eltern ein Smartphone für 1.000 €. Er zahlt 10 % an, den Rest in Raten.",q:"Ist der Kaufvertrag rechtswirksam?",
 o:[["Nein, er ist (schwebend) unwirksam.",1],["Ja, er ist wirksam.",0],["Ja, weil er eine Ausbildungsvergütung hat.",0]],
 b:{q:"Warum?",o:[["Der Taschengeldparagraf greift nicht, weil nicht sofort vollständig bezahlt wird. Ohne Zustimmung der Eltern ist der Vertrag nicht wirksam.",1],["Azubis dürfen grundsätzlich keine Teilzahlungsgeschäfte abschließen.",0],["Smartphones fallen nicht unter das Jugendschutzgesetz.",0]]},
 why:"Ein Ratenkauf fällt nie unter § 110 BGB, weil nicht sofort voll bezahlt wird. Er bringt Zahlungspflichten (§ 107), also ist er ohne Einwilligung schwebend unwirksam (§ 108). Gefragt in WiSo S 2022 und S 2026.",
 term:"schwebend unwirksam (§§ 107, 108 BGB)",ihk:"Der Kaufvertrag ist schwebend unwirksam; der Taschengeldparagraf greift nicht, da nicht sofort vollständig bezahlt wird."},
{id:"p1-3",ch:1,m:"p",k:"mcb",s:"Eine 15-Jährige will eine Tafel Schokolade mit Rum-Aroma kaufen. Daneben liegen Likörpralinen.",q:"Darfst du ihr die Schokolade mit Rum-Aroma verkaufen?",
 o:[["Ja.",1],["Nein, erst ab 16.",0],["Nein, erst ab 18.",0]],
 b:{q:"Warum?",o:[["§ 9 JuSchG verbietet nur Lebensmittel, die Branntwein in nicht nur geringfügiger Menge enthalten. Aroma ist kein Branntwein.",1],["Schokolade ist immer erlaubt, auch mit Likör.",0],["Rum ist kein Alkohol.",0]]},
 why:"Likörpralinen enthalten echten Likör (Branntwein) → ab 18. Rum-Aroma ist kein Branntwein bzw. nur geringfügig enthalten → keine Altersgrenze.",
 term:"§ 9 Abs. 1 JuSchG",ihk:"Lebensmittel, die Branntwein in nicht nur geringfügiger Menge enthalten, dürfen nicht an Kinder und Jugendliche abgegeben werden."},
{id:"p1-4",ch:1,m:"p",k:"rede",s:"Eine 14-Jährige möchte für ihre Mutter Eierlikör kaufen (20 % Alkohol, Branntwein). „Die hat mich doch geschickt!“",q:"Welche Antwort bringt im Fachgespräch die meisten Punkte?",
 o:[["„Es tut mir leid, Eierlikör darf ich dir erst verkaufen, wenn du 18 bist – auch wenn er für deine Mutter ist. Vielleicht kann deine Mutter kurz selbst vorbeikommen? Dir noch einen schönen Tag!“",1],["„Ich will das nicht verkaufen. Ich habe keine Lust auf Ärger.“",0],["„Du weißt doch genau, dass das verboten ist. Das solltest du in deinem Alter wissen.“",0],["„Es tut mir leid, das geht nicht.“",0]],
 why:"Volle Punkte: Bedauern, Grund (Gesetz, nicht „ich will nicht“), Alternative und freundlicher Abschluss. Nicht belehren. Nur „das geht nicht“ nennt keinen Grund.",
 term:"Vier Schritte beim Ablehnen",ihk:"Bedauern zeigen – Grund nennen (Gesetz) – Alternative anbieten – freundlich abschließen."},
{id:"p1-5",ch:1,m:"p",k:"mcb",s:"Prüferin: „Was riskiert Ihr Betrieb, wenn Sie trotzdem Branntwein an eine 14-Jährige verkaufen?“",q:"Was antwortest du?",
 o:[["Es ist eine Ordnungswidrigkeit mit Bußgeld.",1],["Nichts, wenn die Kundin gelogen hat.",0],["Der Kaufvertrag wird automatisch zur Straftat.",0]],
 b:{q:"Was gehört noch zur vollständigen Antwort?",o:[["Das Bußgeld kann mich und den Betrieb treffen, und das Image leidet.",1],["Nur die Kundin muss zahlen.",0],["Der Betrieb muss den Laden einen Monat schließen.",0]]},
 why:"Wer gegen das Jugendschutzgesetz verstößt, begeht eine Ordnungswidrigkeit. Das Bußgeld kann hoch sein und trifft auch das Unternehmen.",
 term:"Ordnungswidrigkeit",ihk:"Ein Verstoß gegen das Jugendschutzgesetz ist eine Ordnungswidrigkeit; es droht ein Bußgeld für Mitarbeiter und Betrieb."},
{id:"p1-6",ch:1,m:"p",k:"mcb",s:"Ein 12-Jähriger möchte Wunderkerzen kaufen (Feuerwerk Kategorie F1). Ein 17-Jähriger will Silvesterraketen (Kategorie F2).",q:"Wem darfst du verkaufen?",
 o:[["Nur dem 12-Jährigen.",1],["Beiden.",0],["Keinem von beiden.",0]],
 b:{q:"Warum?",o:[["F1 (Kleinstfeuerwerk) ab 12 Jahren, F2 (Silvesterfeuerwerk) erst ab 18 Jahren.",1],["Feuerwerk ist immer ab 16 erlaubt.",0],["Feuerwerk darf man nur an Erwachsene verkaufen.",0]]},
 why:"Kategorie F1 (Wunderkerzen, Knallerbsen) ab 12 Jahren. Kategorie F2 (Raketen, Böller) ab 18 Jahren.",
 term:"Feuerwerk F1 / F2",ihk:"Feuerwerk der Kategorie F1 ab 12 Jahren, Kategorie F2 erst ab 18 Jahren."},

// ===== Kapitel 2 – Kasse =====
{id:"a2-1",ch:2,m:"a",k:"mc",s:"Der Seemann hat seine Ware aufs Band gelegt. Du hast alles eingescannt. Jetzt merkt er: Er hat kein gültiges Geld.",q:"Ist schon ein Kaufvertrag zustande gekommen?",
 o:[["Ja. Ware aufs Band legen ist der Antrag, Einscannen ist die Annahme.",1],["Nein. Erst wenn bezahlt ist.",0],["Nein. Erst wenn der Kassenbon gedruckt ist.",0]],
 why:"Nach der IHK-Lösung: Zwei übereinstimmende Willenserklärungen (Antrag und Annahme) = Kaufvertrag. Das ist mit dem Einscannen erfüllt.",
 term:"Kaufvertrag (Antrag + Annahme)",ihk:"Ja, weil zwei übereinstimmende Willenserklärungen vorliegen."},
{id:"a2-2",ch:2,m:"a",k:"rede",s:"Herr Brandt hat für 63,40 € eingekauft. Er hat seinen Geldbeutel vergessen. Hinter ihm warten vier Kunden.",q:"Was sagst du?",
 o:[["„Das kann jedem passieren. Ich parke Ihren Einkauf und lege die Sachen zurück. Wann können Sie wieder hier sein?“",1],["„Pech gehabt. Ohne Geld kein Einkauf.“",0],["„Sie haben einen Kaufvertrag! Sie müssen jetzt sofort bezahlen.“",0]],
 why:"Rechtlich gilt der Kaufvertrag. Kundenorientiert drängst du trotzdem nicht: anderes Zahlungsmittel anbieten, Ware zurücklegen oder Vorgang parken, Zeitpunkt klären.",
 term:"Vorgang parken / Ware zurücklegen",ihk:"Kundenorientiert wird die Ware zurückgelegt bzw. der Vorgang geparkt oder ein anderes Zahlungsmittel angeboten."},
{id:"a2-3",ch:2,m:"a",k:"mc",s:"Am Regal steht 2,30 €. Die Kasse zeigt 3,20 €. Der Seemann sagt: „Ich zahle nur, was am Regal steht!“",q:"Hat er einen Rechtsanspruch auf 2,30 €?",
 o:[["Nein. Das Preisschild ist nur eine Aufforderung, ein Angebot zu machen.",1],["Ja. Der Preis am Regal gilt immer.",0],["Ja, aber nur bei Preisen unter 5 €.",0]],
 why:"Die Preisauszeichnung ist kein verbindliches Angebot. Der Kunde hat keinen Rechtsanspruch. Kundenorientiert: entschuldigen, oft aus Kulanz den niedrigeren Preis geben, Schild korrigieren.",
 term:"Preisauszeichnung",ihk:"Der Kunde hat keinen Rechtsanspruch, die Ware zum Auszeichnungspreis zu erhalten."},
{id:"a2-4",ch:2,m:"a",k:"rede",s:"Eine Kundin möchte mit der Girocard ihres Mannes bezahlen.",q:"Was sagst du?",
 o:[["„Die Karte ist leider an Ihren Mann gebunden. Haben Sie eine eigene Karte oder Bargeld dabei? Sonst lege ich Ihnen die Ware gern zurück.“",1],["„Kein Problem. Sie kennen ja die PIN.“",0],["„Das ist Betrug! Ich rufe sofort die Polizei.“",0]],
 why:"Die Girocard ist personengebunden und nicht übertragbar. Freundlich erklären und eine andere Zahlungsmöglichkeit anbieten.",
 term:"Girocard (personengebunden)",ihk:"Die Girocard ist personenbezogen und nicht übertragbar; alternative Zahlungsmöglichkeiten anbieten."},
{id:"a2-5",ch:2,m:"a",k:"mc",s:"Ein älterer Herr sucht verzweifelt in seiner Geldbörse nach den richtigen Münzen.",q:"Worauf achtest du – und was sagst du?",
 o:[["Hilfestellung: „Lassen Sie sich ruhig Zeit. Darf ich Ihnen helfen, das Kleingeld abzuzählen?“",1],["Zeit sparen: „Bitte etwas schneller, hinter Ihnen warten Leute.“",0],["Diebstahl: „Zeigen Sie mir bitte Ihre Geldbörse.“",0]],
 why:"Der Aspekt ist Hilfestellung bzw. Service: Geduld zeigen und Hilfe anbieten.",
 term:"Hilfestellung / Service",ihk:"Hilfestellung, Service: Geduld zeigen, Hilfe anbieten – „Darf ich Ihnen behilflich sein?“"},
{id:"a2-6",ch:2,m:"a",k:"mc",s:"Ein gut gelaunter Kunde erzählt viel. Eine Kiste Wasser bleibt unten im Wagen stehen.",q:"Was machst du?",
 o:[["Ich frage freundlich: „Unten im Wagen steht eine Kiste Wasser – soll die mit?“",1],["Ich sage nichts. Er ist ja nett.",0],["Ich sage laut: „Sie wollten die Kiste wohl nicht bezahlen!“",0]],
 why:"Diebstahlprävention ohne Vorwurf. Ein sehr gesprächiger Kunde kann ablenken – absichtlich oder nicht. Trotzdem den Wagen ansehen.",
 term:"Diebstahlprävention an der Kasse",ihk:"Diebstahlprävention: Ware im Wagen könnte vergessen oder verdeckt sein; höflich bitten, sie aufs Band zu legen."},
{id:"p2-1",ch:2,m:"p",k:"mcb",s:"Alles ist eingescannt: 63,40 €. Der Kunde kann nicht bezahlen.",q:"Ist ein Kaufvertrag zustande gekommen?",
 o:[["Ja.",1],["Nein.",0],["Erst mit dem Kassenbon.",0]],
 b:{q:"Begründung (wie in der IHK-Lösung W 2024/25):",o:[["Der Kunde gibt mit dem Auflegen der Ware einen Antrag ab, der Verkäufer nimmt mit dem Einscannen an: zwei übereinstimmende Willenserklärungen.",1],["Das Preisschild am Regal ist der Antrag, das Nehmen der Ware ist die Annahme.",0],["Ein Kaufvertrag entsteht erst, wenn das Geld in der Kasse liegt.",0]]},
 why:"Antrag (Ware aufs Band) + Annahme (Einscannen) = Kaufvertrag. Der Kunde ist zur Zahlung verpflichtet (§ 433 Abs. 2 BGB).",
 term:"§ 433 Abs. 2 BGB",ihk:"Ja, weil zwei übereinstimmende Willenserklärungen vorliegen."},
{id:"p2-2",ch:2,m:"p",k:"mcb",s:"Am Regal steht für Duschgel 1,60 €. Die Kasse zeigt 6,10 €. Es ist ein Zahlendreher am Regal.",q:"Müssen Sie die Ware für 1,60 € abgeben?",
 o:[["Nein.",1],["Ja.",0],["Ja, wenn der Kunde den Bon fotografiert.",0]],
 b:{q:"Warum? (§§ 145 ff. BGB)",o:[["Die Preisauszeichnung richtet sich an alle und ist nur eine Aufforderung zur Abgabe eines Angebots. Ein Antrag richtet sich an eine bestimmte Person.",1],["Die Preisangabenverordnung erlaubt Fehler bis 10 %.",0],["Ein Kaufvertrag entsteht nur schriftlich.",0]]},
 why:"Preisschild = invitatio ad offerendum. Der Händler will sich nicht an jeden binden (Fehler, ausverkauft). Kundenorientiert: entschuldigen, ggf. Kulanz, Schild korrigieren.",
 term:"Aufforderung zur Abgabe eines Angebots",ihk:"Die Preisauszeichnung ist nur eine Aufforderung, ein Angebot zu machen; kein Rechtsanspruch auf den ausgezeichneten Preis."},
{id:"p2-3",ch:2,m:"p",k:"mcb",s:"Der Kunde hat sein Geld vergessen. Er verlangt: „Stornieren Sie das! Ich muss gar nichts.“",q:"Wie ist die Lage?",
 o:[["Rechtlich gilt der Vertrag – praktisch storniert oder parkt man oft aus Kulanz.",1],["Er hat recht: Ohne Geld gibt es keinen Vertrag.",0],["Er muss sofort bezahlen, sonst rufe ich die Polizei.",0]],
 b:{q:"Warum handelt man kulant?",o:[["Ein Streit an der Kasse schadet mehr als er nützt; die wartenden Kunden und der Kunde selbst sollen zufrieden bleiben.",1],["Weil das Gesetz Stornieren vorschreibt.",0],["Weil der Kassenbon noch nicht gedruckt ist.",0]]},
 why:"Rechtlich nein – der Vertrag gilt. Praktisch storniert man oder parkt den Vorgang aus Kulanz.",
 term:"Kulanz",ihk:"Der Kaufvertrag ist zustande gekommen; kundenorientiert werden Waren zurückgelegt, der Vorgang geparkt oder storniert."},
{id:"p2-4",ch:2,m:"p",k:"rede",s:"Eine Kundin hat ihren Korb im Einkaufswagen so platziert, dass du den Wagen nicht ganz sehen kannst.",q:"Welche Ansprache ist am besten?",
 o:[["„Könnten Sie bitte Ihren Korb einmal anheben, damit ich in Ihren Einkaufswagen schauen kann? Das mache ich bei allen Kunden so.“",1],["„Ich glaube, Sie verstecken da etwas!“",0],["„Korb hoch!“",0],["„Darf ich mal in Ihre Handtasche schauen?“",0]],
 why:"Höflich bitten statt beschuldigen. „Das mache ich bei allen so“ – damit sich niemand verdächtigt fühlt. Taschen kontrolliert die Verkäuferin nicht selbst.",
 term:"Diebstahlprävention",ihk:"Diebstahlprävention: Die Ware könnte verdeckt sein; der Einkaufswagen wird kontrolliert, ohne die Kundin zu verdächtigen."},
{id:"p2-5",ch:2,m:"p",k:"mcb",s:"Prüfer: „Und was tun Sie, damit der falsche Regalpreis nicht wieder passiert?“",q:"Was antwortest du?",
 o:[["Ich korrigiere sofort das Regaletikett bzw. gebe es weiter und prüfe die Nachbarartikel.",1],["Nichts. Das ist Aufgabe der Zentrale.",0],["Ich nehme das Schild ab. Ohne Preis gibt es keinen Fehler.",0]],
 b:{q:"Warum ist das wichtig?",o:[["Falsche Preise verstoßen gegen die Preisangabenverordnung.",1],["Weil der Kunde sonst den Laden verklagen kann.",0],["Weil ohne Schild mehr verkauft wird.",0]]},
 why:"Die Preisangabenverordnung verlangt richtige Preise (Gesamtpreis inkl. USt, ggf. Grundpreis). Ein Schild ohne Preis wäre ebenfalls ein Verstoß.",
 term:"Preisangabenverordnung (PAngV)",ihk:"Ich korrigiere das Regaletikett und prüfe die Nachbarartikel – falsche Preise verstoßen gegen die Preisangabenverordnung."},
{id:"p2-6",ch:2,m:"p",k:"rede",s:"Eine Kundin, etwa 30, hat nicht genug Bargeld dabei.",q:"Welche Ansprache bringt volle Punkte?",
 o:[["„Haben Sie eine Karte, mit der Sie Ihren Einkauf bezahlen können? Wir nehmen Girocard und Kreditkarten.“",1],["„Dann müssen Sie leider etwas zurücklegen.“",0],["„Wie viel haben Sie denn? Zeigen Sie mal.“",0],["„Dann gehen Sie bitte zum Geldautomaten. Der Nächste!“",0]],
 why:"Erst ein anderes Zahlungsmittel anbieten. Das ist kundenorientiert und schließt den Kauf ab.",
 term:"andere Zahlungsmöglichkeit",ihk:"Zahlung: andere Zahlungsmöglichkeit anbieten – „Haben Sie eine Karte …? Wir nehmen Girocard und Kreditkarten.“"},

// ===== Kapitel 3 – Beschwerden =====
{id:"a3-1",ch:3,m:"a",k:"mc",s:"Der Kapitän schimpft laut: „So ein Schrott! Und das bei dem Preis!“",q:"Was tust du zuerst?",
 o:[["Ruhig bleiben und ihn aussprechen lassen. Blickkontakt, nicken, nicht unterbrechen.",1],["Laut zurück: „Schreien Sie hier nicht so rum!“",0],["Sagen: „Nun beruhigen Sie sich doch erst mal!“",0]],
 why:"Erst der Mensch, dann die Sache: Ruhe bewahren, sachlich bleiben, aussprechen lassen. „Nun beruhigen Sie sich doch erst mal!“ kann den Konflikt verschärfen.",
 term:"aktiv zuhören",ihk:"In Ruhe zuhören und den Kunden aussprechen lassen; Ruhe bewahren, sachlich bleiben."},
{id:"a3-2",ch:3,m:"a",k:"mc",s:"Deine Kollegin sagt zum Kapitän: „Oh, da sind Sie aber der Erste, der das beanstandet.“",q:"Ist dieser Satz geeignet?",
 o:[["Nein. Er klingt wie ein Vorwurf. Der Kunde fühlt sich nicht ernst genommen.",1],["Ja. So weiß der Kunde, dass die Ware gut ist.",0],["Ja. Das beruhigt den Kunden.",0]],
 why:"Der Satz klingt so, als ob das Anliegen nicht ernst genommen wird. Das kann den Konflikt verschärfen.",
 term:"Unterstellung vermeiden",ihk:"Die Aussage klingt wie ein Vorwurf, als ob das Anliegen des Kunden nicht ernst genommen würde – ungeeignet."},
{id:"a3-3",ch:3,m:"a",k:"mc",s:"Die Kollegin sagt jetzt: „Wir werden gemeinsam eine Lösung finden.“",q:"Ist dieser Satz geeignet?",
 o:[["Ja. Der Kunde merkt, dass man sich kümmert, und wird einbezogen.",1],["Nein. Man darf nichts versprechen.",0],["Nein. Das klingt zu freundlich.",0]],
 why:"Eine Lösung in Aussicht stellen und Zuversicht zeigen beruhigt. Der Kunde wird einbezogen.",
 term:"Lösung in Aussicht stellen",ihk:"Geeignet: Der Kunde fühlt, dass man sich kümmert, und wird einbezogen."},
{id:"a3-4",ch:3,m:"a",k:"rede",s:"Andere Kunden schauen schon zum Kapitän herüber.",q:"Was sagst du?",
 o:[["„Kommen Sie doch bitte mit zur Information, dort können wir in Ruhe schauen.“",1],["„Alle schauen schon. Das ist Ihnen doch peinlich, oder?“",0],["„Dann gehen Sie bitte. So können wir nicht reden.“",0]],
 why:"Den Kunden in eine ruhige Zone bitten: Er steht nicht vor anderen, und die Situation beruhigt sich. Eine Kollegin übernimmt die Kasse.",
 term:"ruhige Zone",ihk:"Den Kunden in eine ruhige Verkaufszone bitten; eine Kollegin übernimmt die Kasse."},
{id:"a3-5",ch:3,m:"a",k:"mc",s:"Du fragst dich: Warum soll ich die Beschwerde überhaupt so ernst nehmen?",q:"Welcher Grund stimmt?",
 o:[["Enttäuschte Kunden gehen zum Mitbewerber und erzählen ihre schlechte Erfahrung weiter.",1],["Weil das Gesetz es bei jeder Beschwerde vorschreibt.",0],["Damit der Kunde schneller wieder geht.",0]],
 why:"Wer Beschwerden nicht ernst nimmt, verliert Kunden. Kunden-, Umsatz- und Gewinnrückgang sind die Folge.",
 term:"Beschwerde als Chance",ihk:"Enttäuschte Kunden gehen künftig zum Mitbewerber; sie erzählen schlechte Erfahrungen weiter – Kunden-, Umsatz- und Gewinnrückgang."},
{id:"a3-6",ch:3,m:"a",k:"rede",s:"Ein Kunde wollte einen Akkuschrauber aus dem Prospekt. Der ist ausverkauft. „Wozu machen Sie überhaupt Werbung?“",q:"Was sagst du?",
 o:[["„Es tut mir leid, dass er ausverkauft ist. Gern notiere ich Ihre Telefonnummer und melde mich, sobald er da ist.“",1],["„Da hätten Sie eben früher kommen müssen.“",0],["„Für die Werbung ist die Zentrale zuständig, nicht ich.“",0]],
 why:"Bedauern zeigen, Verständnis zeigen, eine Lösung anbieten: benachrichtigen oder ein Alternativangebot zeigen.",
 term:"Beschwerde: Werbeware ausverkauft",ihk:"Verständnis zeigen und sich entschuldigen; eine Lösung anbieten (Benachrichtigung bei Nachlieferung oder Alternativangebot)."},
{id:"p3-1",ch:3,m:"p",k:"mcb",s:"Eine Kundin beschwert sich: Ein Verkäufer war unfreundlich und hat sie lange warten lassen.",q:"Ist das eine Reklamation?",
 o:[["Nein, es ist eine Beschwerde.",1],["Ja, es ist eine Reklamation.",0],["Es ist ein Umtausch.",0]],
 b:{q:"Warum?",o:[["Eine Reklamation ist eine Beschwerde über mangelhafte Ware mit gesetzlichen Rechten. Hier geht es um das Personal.",1],["Reklamationen gibt es nur schriftlich.",0],["Eine Beschwerde ist immer lauter als eine Reklamation.",0]]},
 why:"Beschwerde = jede Unzufriedenheit (Personal, Wartezeit, Sauberkeit …). Reklamation = Beschwerde über mangelhafte Ware, mit gesetzlichen Rechten.",
 term:"Beschwerde ↔ Reklamation",ihk:"Beschwerde: allgemeine Unzufriedenheit, z. B. über unfreundliches Personal. Reklamation: Beschwerde über mangelhafte Ware mit gesetzlichen Rechten."},
{id:"p3-2",ch:3,m:"p",k:"mc",s:"„Beschreiben Sie 4 Möglichkeiten, wie Sie angemessen reagieren!“ Ein Mitschüler hat aufgeschrieben:",q:"Welche Antwort bringt KEINEN Punkt?",
 o:[["„Dem Kunden erklären, dass er die Ware sicher falsch benutzt hat.“",1],["„Sich beim Kunden entschuldigen, Verständnis zeigen.“",0],["„Sachlage prüfen, Zuversicht zur gemeinsamen Lösung zeigen.“",0],["„In Ruhe zuhören und den Kunden aussprechen lassen.“",0]],
 why:"Nicht belehren, nicht kritisieren, keine Unterstellungen. Alle anderen Antworten stehen so in der IHK-Lösung.",
 term:"nicht belehren",ihk:"Den Kunden nicht belehren oder kritisieren; sachlich bleiben."},
{id:"p3-3",ch:3,m:"p",k:"mcb",s:"Prüferin: „Sie haben den Kunden an einen Tisch gebeten. War das richtig?“",q:"Was antwortest du?",
 o:[["Ja, das war richtig.",1],["Nein, man sollte an der Kasse bleiben.",0],["Nur, wenn der Kunde es möchte.",0]],
 b:{q:"Welche Begründung gibst du?",o:[["Damit wir in Ruhe sprechen können, der Kunde nicht vor anderen Kunden steht und sich die Situation beruhigt.",1],["Damit die anderen Kunden nicht merken, dass unsere Ware schlecht ist.",0],["Weil dort die Kamera hängt.",0]]},
 why:"Ruhige Zone: weg vom Blick der anderen Kunden, in Ruhe sprechen, Situation beruhigen.",
 term:"ruhige Zone",ihk:"Den Kunden in eine ruhige Zone bitten, damit in Ruhe gesprochen werden kann und sich die Situation beruhigt."},
{id:"p3-4",ch:3,m:"p",k:"mc",s:"Die Geschäftsleitung will ein Beschwerdemanagement einführen.",q:"Welche Aufgabe gehört dazu?",
 o:[["Beschwerden auswerten und Abläufe verbessern.",1],["Beschwerden möglichst schnell löschen.",0],["Nur schriftliche Beschwerden annehmen.",0]],
 why:"Beschwerdemanagement: Beschwerden annehmen, bearbeiten, Lösungen finden, Kundenzufriedenheit wiederherstellen, Beschwerden auswerten und Abläufe verbessern.",
 term:"Beschwerdemanagement",ihk:"Beschwerden annehmen, bearbeiten und auswerten; Abläufe verbessern (auch durch Kundenbefragungen)."},
{id:"p3-5",ch:3,m:"p",k:"mc",s:"Ein Brief: „Ich musste an der Kasse ewig warten!“ (nach IHK S 2019)",q:"Welche Maßnahme passt zu diesem Kritikpunkt?",
 o:[["Personaleinsatz in Stoßzeiten anpassen, ein Rufsystem für eine zweite Kasse.",1],["Mitarbeitergespräch über Freundlichkeit.",0],["Die Öffnungszeiten verkürzen.",0]],
 why:"Wartezeit → Personaleinsatz in Stoßzeiten anpassen, Mehrfachbedienung, Rufsystem. Unfreundlichkeit → Mitarbeitergespräch, Schulung.",
 term:"Maßnahmen aus Beschwerden",ihk:"Wartezeit: Personaleinsatz in Stoßzeiten anpassen, Mehrfachbedienung, Rufsystem."},
{id:"p3-6",ch:3,m:"p",k:"rede",s:"Der Kapitän: „Die Halskette ist nach zehn Tagen kaputt. So ein Schrott!“",q:"Welche Antwort ist am besten?",
 o:[["„Das ist wirklich ärgerlich, das verstehe ich. Entschuldigen Sie bitte. Kommen Sie doch mit an den Tisch – was genau ist passiert?“",1],["„Haben Sie die Kette vielleicht beim Duschen getragen?“",0],["„Das kann eigentlich nicht sein. Die Ketten sind sehr gut.“",0],["„Beruhigen Sie sich, sonst kann ich Ihnen nicht helfen.“",0]],
 why:"Verständnis + Entschuldigung + ruhige Zone + Grund klären. Keine Unterstellungen („beim Duschen“), nicht abstreiten.",
 term:"Verständnis zeigen",ihk:"Verständnis zeigen und sich entschuldigen; Grund für die Aufregung feststellen."},

// ===== Kapitel 4 – Umtausch / Reklamation =====
{id:"a4-1",ch:4,m:"a",k:"mc",s:"Die Dame bringt einen Pullover. Er ist ganz in Ordnung. „Die Farbe gefällt mir nicht“, sagt sie.",q:"Was liegt vor?",
 o:[["Ein Umtauschwunsch. Die Ware ist fehlerfrei, es gibt keinen Rechtsanspruch.",1],["Eine Reklamation. Sie hat ein Recht auf ihr Geld.",0],["Sie hat 14 Tage Umtauschrecht, das gilt immer.",0]],
 why:"Fehlerfreie Ware: Umtausch nur freiwillig (Kulanz). Im Laden gibt es kein gesetzliches Umtauschrecht.",
 term:"Umtausch (fehlerfreie Ware)",ihk:"Kein Rechtsanspruch auf Umtausch, da die Ware fehlerfrei ist (kein Mangel)."},
{id:"a4-2",ch:4,m:"a",k:"mc",s:"Ein Kunde bringt nach zwei Wochen eine Halskette. Der Verschluss ist kaputt. Du siehst einen Verarbeitungsfehler.",q:"Umtausch oder Reklamation?",
 o:[["Reklamation, da ein Mangel vorliegt.",1],["Umtausch, weil die Kette nicht mehr gefällt.",0],["Kulanz.",0]],
 why:"Das Wort „Mangel“ muss in der Begründung stehen. Nur „Kulanz“ zu schreiben, gibt 0 Punkte.",
 term:"Reklamation",ihk:"Da ein Mangel vorliegt, handelt es sich um eine Reklamation."},
{id:"a4-3",ch:4,m:"a",k:"mc",s:"Du sollst prüfen, ob eine Reklamation berechtigt ist.",q:"Welche drei Fragen stellst du?",
 o:[["Wo wurde die Ware gekauft? Wann wurde sie gekauft? Liegt ein Mangel vor?",1],["Wer hat verkauft? Warum? Wie teuer war es?",0],["Gefällt die Ware? Ist die Verpackung noch da? Ist der Kunde Stammkunde?",0]],
 why:"Drei Prüfkriterien – immer dieselben: Wo (Kaufnachweis), wann (2 Jahre Gewährleistung), Mangel (oder falsch behandelt?).",
 term:"Prüfkriterien",ihk:"Wo wurde der Artikel gekauft? Wann wurde der Artikel gekauft? Liegt ein (berechtigter) Mangel vor?"},
{id:"a4-4",ch:4,m:"a",k:"mc",s:"Die Dame mit dem Glockenhut zeigt ihren Kassenbon: gekauft am 12.11.1926.",q:"Welches Prüfkriterium hilft dir hier am meisten?",
 o:[["Wann gekauft? Die Gewährleistung gilt 2 Jahre ab Übergabe – sie ist längst vorbei.",1],["Gefällt das Kleid noch? Dann muss sie es behalten.",0],["Wie alt ist die Kundin?",0]],
 why:"Die Gewährleistung gilt 2 Jahre ab Übergabe der Ware. Danach gibt es keinen gesetzlichen Anspruch mehr.",
 term:"Gewährleistungsfrist (2 Jahre)",ihk:"Gewährleistung gilt 2 Jahre ab Übergabe."},
{id:"a4-5",ch:4,m:"a",k:"mc",s:"Die Chefin sagt: „Bei Umtauschwünschen sind wir großzügig.“",q:"Warum lohnt sich das?",
 o:[["Kundenzufriedenheit, Vertrauen und Stammkunden – und ein gutes Image.",1],["Weil das Gesetz es so vorschreibt.",0],["Weil die Ware dann teurer verkauft werden kann.",0]],
 why:"Großzügiger Umtausch: zufriedene Kunden, Vertrauen, Kundenbindung, positives Image, schnellerer Kaufabschluss, Abgrenzung von Mitbewerbern.",
 term:"Kulanz lohnt sich",ihk:"Steigerung der Kundenzufriedenheit, positive Imagebildung, Stärkung der Kundenbindung, Schaffung von Vertrauen."},
{id:"a4-6",ch:4,m:"a",k:"mc",s:"Eine Kundin hat im Laden eine fehlerfreie Jacke gekauft. Sie sagt: „Ich habe 14 Tage Widerrufsrecht!“",q:"Stimmt das?",
 o:[["Nein. Das Widerrufsrecht gilt nur bei Käufen im Internet, am Telefon oder außerhalb des Geschäfts.",1],["Ja. 14 Tage gelten für jeden Kauf.",0],["Ja, aber nur mit Originalverpackung.",0]],
 why:"Im Laden gibt es kein Recht, fehlerfreie Ware zurückzugeben. „14 Tage Umtausch“ im Laden ist freiwillig.",
 term:"Widerrufsrecht (nur Fernabsatz)",ihk:"Das 14-tägige Widerrufsrecht gilt nur im Fernabsatz (Internet, Telefon) und außerhalb von Geschäftsräumen."},
{id:"p4-1",ch:4,m:"p",k:"mcb",s:"Eine Kundin möchte einen Artikel umtauschen, weil ihr die Farbe nicht gefällt.",q:"Beurteile die Situation nach der gesetzlichen Regelung.",
 o:[["Kein Rechtsanspruch auf Umtausch.",1],["Rechtsanspruch auf Umtausch.",0],["Rechtsanspruch auf Geld zurück.",0]],
 b:{q:"Begründung für volle Punkte:",o:[["Die Ware ist fehlerfrei; es liegt kein Mangel vor.",1],["Weil der Betrieb das aus Kulanz entscheidet.",0],["Weil das Widerrufsrecht nach 14 Tagen abgelaufen ist.",0]]},
 why:"IHK W 2019/20: „Kulanz“ allein ohne Rechtslage = 0 Punkte. Das Wort Mangel muss in der Begründung stehen.",
 term:"kein Mangel → kein Anspruch",ihk:"Kein Rechtsanspruch auf Umtausch, da die Ware fehlerfrei ist (kein Mangel)."},
{id:"p4-2",ch:4,m:"p",k:"mcb",s:"Im Laden hängt ein Schild: „Reduzierte Ware ist vom Umtausch ausgeschlossen.“ Eine reduzierte Jacke hat eine kaputte Naht.",q:"Sind damit auch Reklamationen ausgeschlossen?",
 o:[["Nein.",1],["Ja.",0],["Nur in den ersten 14 Tagen.",0]],
 b:{q:"Warum?",o:[["Ausschließen kann man nur den freiwilligen Umtausch. Die Gewährleistung gilt auch für reduzierte Ware und kann gegenüber Verbrauchern nicht ausgeschlossen werden.",1],["Weil das Schild nicht groß genug ist.",0],["Weil reduzierte Ware immer umgetauscht werden muss.",0]]},
 why:"Gewährleistung kann gegenüber Verbrauchern nicht ausgeschlossen werden (§ 476 BGB) – außer für den Fehler, wegen dem reduziert wurde und den der Kunde kannte (§ 442 BGB).",
 term:"Gewährleistung bei reduzierter Ware",ihk:"Die gesetzliche Gewährleistung gilt auch für reduzierte Ware; ausgeschlossen werden kann nur der freiwillige Umtausch."},
{id:"p4-3",ch:4,m:"p",k:"mcb",s:"Ein Online-Kunde schickt eine fehlerfreie Jacke nach 10 Tagen zurück. Eine Laden-Kundin will das auch.",q:"Wer hat ein Recht auf Rückgabe?",
 o:[["Nur der Online-Kunde.",1],["Beide.",0],["Nur die Laden-Kundin.",0]],
 b:{q:"Warum? (§ 312g BGB)",o:[["Das Widerrufsrecht gilt nur für Fernabsatzverträge und Verträge außerhalb von Geschäftsräumen. Im Laden konnte die Kundin die Ware vorher prüfen.",1],["Online-Kunden zahlen mehr und haben deshalb mehr Rechte.",0],["Im Laden gilt das Widerrufsrecht nur 7 Tage.",0]]},
 why:"§ 312g BGB: Widerrufsrecht im Fernabsatz. Im Laden ist ein Rückgaberecht für fehlerfreie Ware nur freiwillig (Kulanz).",
 term:"§ 312g BGB",ihk:"Das Widerrufsrecht gilt nur für Fernabsatzverträge; im Laden besteht kein Rechtsanspruch auf Rückgabe fehlerfreier Ware."},
{id:"p4-4",ch:4,m:"p",k:"mc",s:"Die Chefin fragt: „Wie vermeiden wir Umtauschwünsche schon im Verkaufsgespräch?“",q:"Welche Antwort passt?",
 o:[["Genaue Bedarfsermittlung, Ware anprobieren lassen, Pflege erklären, beim Geschenk nach Größe und Geschmack fragen.",1],["Keine Kassenbons mehr ausgeben.",0],["Nur noch reduzierte Ware verkaufen.",0]],
 why:"Wer den Bedarf genau ermittelt und ausprobieren lässt, verkauft passende Ware – dann gibt es weniger Umtausch.",
 term:"Umtausch vermeiden",ihk:"Genaue Bedarfsermittlung, Ware aus- oder anprobieren lassen, Gebrauch und Pflege erklären."},
{id:"p4-5",ch:4,m:"p",k:"mcb",s:"Ein T-Shirt war reduziert – „wegen Fleck“. Die Kundin wusste das. Jetzt will sie den Fleck reklamieren.",q:"Ist das eine berechtigte Reklamation?",
 o:[["Nein.",1],["Ja.",0],["Ja, aber nur mit Kassenbon.",0]],
 b:{q:"Warum?",o:[["Die Gewährleistung gilt nicht für einen Fehler, den die Kundin beim Kauf kannte.",1],["Reduzierte Ware hat nie Gewährleistung.",0],["Flecken sind kein Mangel.",0]]},
 why:"Für den bekannten Fehler (Grund der Reduzierung) gibt es keine Gewährleistung (§ 442 BGB). Für andere Mängel schon.",
 term:"bekannter Mangel",ihk:"Die Gewährleistung gilt auch für reduzierte Ware – nur nicht für einen Fehler, den der Kunde beim Kauf kannte."},
{id:"p4-6",ch:4,m:"p",k:"rede",s:"Eine Kundin bringt einen fehlerfreien Pullover. Er ist ihr zu klein.",q:"Welche Antwort ist kundenorientiert?",
 o:[["„Den Pullover tauschen wir Ihnen gern um. Möchten Sie eine andere Größe oder lieber einen Gutschein?“",1],["„Dazu sind wir nicht verpflichtet.“",0],["„Hätten Sie ihn mal anprobiert.“",0],["„Umtausch nur mit Originalverpackung und innerhalb von 3 Tagen.“",0]],
 why:"Kulanz kundenorientiert: Alternativartikel im gleichen Preisniveau, Gutschein oder Geld zurück anbieten.",
 term:"Kulanz kundenorientiert",ihk:"Alternativartikel im gleichen Preisniveau anbieten, Gutschein anbieten, Geld auszahlen."},

// ===== Kapitel 5 – Rechte bei Mängeln =====
{id:"a5-1",ch:5,m:"a",k:"mc",s:"Die Sturmlaterne ist nach drei Monaten kaputt. Es ist ein Mangel.",q:"Was darf der Fischer zuerst verlangen?",
 o:[["Nacherfüllung: Reparatur oder eine neue Laterne.",1],["Sofort sein Geld zurück.",0],["Nichts. Nur der Hersteller hilft.",0]],
 why:"Stufe 1 der Kundenrechte (vorrangig): Nacherfüllung – Nachbesserung (Reparatur) oder Ersatzlieferung (neue Ware).",
 term:"Nacherfüllung (vorrangig)",ihk:"Im Rahmen der Nacherfüllung kann der Kunde vorrangig Nachbesserung oder Ersatzlieferung verlangen."},
{id:"a5-2",ch:5,m:"a",k:"mc",s:"Der Fischer fragt: „Wie lange habe ich eigentlich Gewährleistung?“",q:"Was ist richtig?",
 o:[["2 Jahre ab Übergabe der Ware.",1],["6 Monate.",0],["So lange, wie der Händler möchte.",0]],
 why:"Die gesetzliche Gewährleistungsfrist beträgt 2 Jahre ab Übergabe (bei gebrauchter Ware kann sie auf 1 Jahr verkürzt werden).",
 term:"Gewährleistungsfrist",ihk:"Die gesetzlich vorgeschriebene Gewährleistungsfrist beträgt zwei Jahre ab Übergabe der Ware."},
{id:"a5-3",ch:5,m:"a",k:"mc",s:"Auf der neuen Laterne steht: „3 Jahre Herstellergarantie“.",q:"Was ist eine Garantie?",
 o:[["Eine freiwillige Leistung von Hersteller oder Händler. Sie geht über die Gewährleistung hinaus.",1],["Ein anderes Wort für Gewährleistung.",0],["Eine Pflicht, die im Gesetz steht.",0]],
 why:"Gewährleistung = Gesetz, Händler. Garantie = freiwillig, Hersteller oder Händler, was in der Garantieerklärung steht.",
 term:"Garantie",ihk:"Garantie ist eine freiwillige Leistung eines Einzelhändlers oder Herstellers und geht über die gesetzliche Gewährleistung hinaus."},
{id:"a5-4",ch:5,m:"a",k:"rede",s:"Der Fischer möchte wissen, wie es jetzt weitergeht.",q:"Was sagst du?",
 o:[["„Sie haben die Wahl: Wir reparieren die Laterne oder Sie bekommen eine neue.“",1],["„Wir entscheiden, was gemacht wird. Sie warten einfach.“",0],["„Geld zurück gibt es sofort, Reparaturen machen wir nicht.“",0]],
 why:"Bei der Nacherfüllung wählt der Kunde: Reparatur oder neue, mangelfreie Ware.",
 term:"Wahl des Kunden",ihk:"Der Kunde wählt: Nachbesserung (Reparatur) oder Ersatzlieferung (Neulieferung)."},
{id:"a5-5",ch:5,m:"a",k:"mc",s:"Die Laterne wurde zweimal repariert. Beide Male hat es nicht geklappt.",q:"Was kann der Fischer jetzt verlangen?",
 o:[["Rücktritt vom Kaufvertrag (Geld zurück) oder Minderung (er zahlt weniger).",1],["Nur eine dritte und vierte Reparatur.",0],["Gar nichts mehr.",0]],
 why:"Nachrangige Rechte, wenn die Nacherfüllung fehlschlägt: Rücktritt, Minderung, Schadensersatz.",
 term:"nachrangige Rechte",ihk:"Nachrangige Rechte: Rücktritt vom Kaufvertrag oder Minderung des Kaufpreises (auch Schadensersatz)."},
{id:"a5-6",ch:5,m:"a",k:"mc",s:"Der Fischer sagt: „Ich behalte die Laterne, aber ich will weniger bezahlen.“",q:"Wie heißt dieses Recht?",
 o:[["Minderung",1],["Rücktritt",0],["Garantie",0]],
 why:"Minderung (Preisminderung): Der Kunde behält die Ware und zahlt weniger.",
 term:"Minderung",ihk:"Minderung: Der Kunde behält die Ware und zahlt einen geringeren Kaufpreis."},
{id:"p5-1",ch:5,m:"p",k:"num",s:"Du einigst dich mit dem Kunden auf eine Kaufpreisminderung von 25 %. Der Kaufpreis betrug 198,00 €.",q:"Wie viel Euro beträgt die Minderung?",
 ans:49.5,unit:"€",rw:"198,00 € × 25 : 100 = 49,50 €",
 why:"Kaufpreis × Minderungssatz : 100 = Minderung in €. Der Kunde zahlt 148,50 € bzw. bekommt 49,50 € zurück.",
 term:"Minderung berechnen",ihk:"198,00 € × 25 : 100 = 49,50 € (IHK W 2022/23)"},
{id:"p5-2",ch:5,m:"p",k:"num",s:"Die Sturmlaterne hat 84,00 € gekostet. Ihr einigt euch auf 15 % Minderung.",q:"Wie viel Euro bekommt der Fischer zurück?",
 ans:12.6,unit:"€",rw:"84,00 € × 15 : 100 = 12,60 €",
 why:"Minderung = Kaufpreis × Minderungssatz : 100. Der Fischer zahlt am Ende 71,40 €.",
 term:"Minderung berechnen",ihk:"Kaufpreis × Minderungssatz : 100 = Minderung in €."},
{id:"p5-3",ch:5,m:"p",k:"mcb",s:"Eine Kundin will sofort vom Kauf zurücktreten. Ihr Toaster ist nach 3 Monaten kaputt.",q:"Darf der Händler zuerst nachbessern?",
 o:[["Ja.",1],["Nein, sie bekommt sofort ihr Geld.",0],["Nein, der Hersteller ist zuständig.",0]],
 b:{q:"Warum? (§§ 323, 440 BGB)",o:[["Der Rücktritt setzt grundsätzlich voraus, dass eine Frist zur Nacherfüllung erfolglos war. Die Nachbesserung gilt nach dem zweiten erfolglosen Versuch als fehlgeschlagen.",1],["Weil Toaster unter die Garantie fallen.",0],["Weil der Rücktritt nur in den ersten 14 Tagen möglich ist.",0]]},
 why:"Nacherfüllung ist vorrangig. Sofort zurücktreten geht nur ausnahmsweise (Nacherfüllung verweigert oder unzumutbar).",
 term:"Vorrang der Nacherfüllung",ihk:"Vorrangig hat der Kunde das Recht auf Nacherfüllung; Rücktritt erst, wenn die Nacherfüllung fehlschlägt."},
{id:"p5-4",ch:5,m:"p",k:"mcb",s:"Ein Mangel zeigt sich 8 Monate nach dem Kauf. Der Händler sagt: „Beweisen Sie erst mal, dass der Fehler schon beim Kauf da war.“",q:"Hat der Händler recht?",
 o:[["Nein.",1],["Ja.",0],["Ja, nach 6 Monaten muss immer der Kunde beweisen.",0]],
 b:{q:"Warum?",o:[["Beweislastumkehr: Zeigt sich der Mangel im 1. Jahr, wird vermutet, dass er schon beim Kauf da war (seit 1.1.2022).",1],["Der Kunde muss nie etwas beweisen.",0],["Weil die Garantie 3 Jahre gilt.",0]]},
 why:"§ 477 BGB: 1 Jahr Beweislastumkehr beim Verbrauchsgüterkauf. Achtung: Ältere IHK-Lösungen nennen noch 6 Monate.",
 term:"Beweislastumkehr (§ 477 BGB)",ihk:"Zeigt sich der Mangel im ersten Jahr, wird vermutet, dass er schon bei Übergabe vorhanden war."},
{id:"p5-5",ch:5,m:"p",k:"mcb",s:"Ein E-Bike-Akku explodiert und beschädigt die Garage des Kunden.",q:"Wer haftet für die beschädigte Garage?",
 o:[["Der Hersteller.",1],["Nur der Händler.",0],["Niemand, das ist Pech.",0]],
 b:{q:"Nach welcher Regel?",o:[["Produkthaftung: Der Hersteller haftet für Schäden an Personen und anderen Sachen durch ein fehlerhaftes Produkt.",1],["Gewährleistung: Der Händler muss die Garage reparieren.",0],["Garantie: Sie deckt alle Schäden ab.",0]]},
 why:"Produkthaftungsgesetz: Hersteller haftet verschuldensunabhängig. Die Gewährleistung gegenüber dem Händler betrifft nur den Akku selbst.",
 term:"Produkthaftung",ihk:"Produkthaftung: Der Hersteller haftet gesetzlich für Schäden an Personen oder anderen Sachen durch ein fehlerhaftes Produkt."},
{id:"p5-6",ch:5,m:"p",k:"mc",s:"„Nennen Sie 3 nachrangige Rechte!“ (IHK S 2023)",q:"Welche Liste bringt volle Punkte?",
 o:[["Schadensersatz · Preisminderung · Rücktritt vom Kaufvertrag",1],["Nachbesserung · Ersatzlieferung · Minderung",0],["Garantie · Umtausch · Gutschein",0]],
 why:"Vorrangig: Nachbesserung, Ersatzlieferung. Nachrangig: Rücktritt, Minderung, Schadensersatz (Ersatz vergeblicher Aufwendungen).",
 term:"Treppe der Kundenrechte",ihk:"Nachrangig: Schadensersatz, Preisminderung, Rücktritt vom Kaufvertrag."},

// ===== Kapitel 6 – Ladendiebstahl =====
{id:"a6-1",ch:6,m:"a",k:"mc",s:"Du siehst, wie ein Mann einen Lippenstift in seine Jackentasche steckt.",q:"Was tust du?",
 o:[["Ruhe bewahren, ihn unauffällig beobachten und die Vorgesetzte oder den Ladendetektiv informieren.",1],["Laut rufen: „Haltet den Dieb!“",0],["Ihm hinterherlaufen und seine Taschen durchsuchen.",0]],
 why:"Nie laut beschuldigen, nicht allein und nicht körperlich eingreifen. Eigenschutz geht vor. Taschen nicht selbst durchsuchen.",
 term:"Verhalten bei Verdacht",ihk:"Ruhe bewahren, Vorgesetzten/Ladendetektiv informieren, diskret und höflich ansprechen – möglichst mit Zeugen."},
{id:"a6-2",ch:6,m:"a",k:"mc",s:"Ein Kunde an der Kasse redet und redet. Eine zweite Person steht dicht neben ihm.",q:"Welche Gefahr steckt darin?",
 o:[["Ablenkung: Eine Person lenkt ab, die andere steckt etwas ein. Ich bleibe konzentriert.",1],["Keine. Gesprächige Kunden sind immer ehrlich.",0],["Die Kasse könnte überhitzen.",0]],
 why:"Ablenkung ist eine typische Diebstahlmethode. Trotzdem freundlich bleiben – aber den Wagen und die Ware im Blick behalten.",
 term:"Diebstahlmethode Ablenkung",ihk:"Ablenkung: sehr gesprächiger Kunde, zwei Personen – eine fragt, die andere steckt ein."},
{id:"a6-3",ch:6,m:"a",k:"mc",s:"Nach der Inventur fehlt viel Ware. Eine Ursache ist Diebstahl.",q:"Welche Maßnahme beugt Diebstahl vor?",
 o:[["Abgeschlossene Vitrinen, Warensicherung und Videoüberwachung.",1],["Das Licht dimmen, damit es gemütlich ist.",0],["Sehr hohe Regale, damit mehr Ware hineinpasst.",0]],
 why:"Vorbeugung: Kameras, Spiegel, Warensicherung, Vitrinen, Ladendetektiv, Mitarbeiter schulen, übersichtliche niedrige Regale.",
 term:"Diebstahlprävention",ihk:"Kameras, Mitarbeiter schulen, Ladendetektiv/Warensicherung, abgeschlossene Vitrinen, Spiegel im Kassenbereich."},
{id:"a6-4",ch:6,m:"a",k:"mc",s:"Teure Markenparfums werden oft gestohlen.",q:"Wo platzierst du sie?",
 o:[["In der Kassenzone, in einer Vitrine oder in Bedienungsnähe – Personal ist immer in der Nähe.",1],["Ganz hinten in der dunklen Ecke.",0],["Draußen vor der Tür.",0]],
 why:"Diebstahlgefährdete Artikel dorthin, wo Personal immer aufmerksam sein kann.",
 term:"Platzierung gefährdeter Ware",ihk:"Diebstahlgefährdete Artikel in Kassenzone, Vitrine oder lagernahe Beratungszone – Personal ist immer in der Nähe."},
{id:"a6-5",ch:6,m:"a",k:"mc",s:"Ein Kollege sagt: „Diebstahl ist mir egal. Das Geld bekommt der Laden ja von der Versicherung.“",q:"Was antwortest du?",
 o:[["Diebstahl führt zu Inventurdifferenzen. Der Schaden fehlt im Gewinn – am Ende zahlen alle Kunden über höhere Preise.",1],["Stimmt, Diebstahl kostet nichts.",0],["Nur Kunden stehlen, Mitarbeiter nie.",0]],
 why:"Diebstahl ist eine Hauptursache für Inventurdifferenzen (Soll ≠ Ist). Es stehlen Kunden, aber auch Mitarbeiter und Lieferanten.",
 term:"Inventurdifferenz",ihk:"Diebstahl ist eine Hauptursache für Inventurdifferenzen; der Schaden mindert den Gewinn."},
{id:"a6-6",ch:6,m:"a",k:"mc",s:"1926 schrie der Reeder Lührs vor allen Kunden: „Behrens, du Dieb!“ Niemand fragte nach.",q:"Wie hätte man bei einem Verdacht richtig gehandelt?",
 o:[["Diskret und höflich ansprechen, in einen Nebenraum bitten, Zeugen und Polizei hinzuziehen.",1],["Genau so: laut, damit alle es hören.",0],["Ihn sofort festhalten und durchsuchen.",0]],
 why:"Niemals laut beschuldigen oder vor anderen bloßstellen. Nicht auf bloßen Verdacht hin festhalten.",
 term:"diskret handeln",ihk:"Diskret und höflich ansprechen, in einen Nebenraum bitten, Vorgesetzten/Polizei hinzuziehen."},
{id:"p6-1",ch:6,m:"p",k:"mcb",s:"Ein Mann steckt vor deinen Augen eine Uhr ein und rennt zum Ausgang.",q:"Darfst du ihn festhalten?",
 o:[["Ja, unter bestimmten Bedingungen.",1],["Ja, auch bei bloßem Verdacht.",0],["Nein, niemals.",0]],
 b:{q:"Unter welchen Bedingungen? (§ 127 Abs. 1 StPO)",o:[["Auf frischer Tat betroffen und fluchtverdächtig oder Identität nicht feststellbar – verhältnismäßig. Eigenschutz geht trotzdem vor.",1],["Immer dann, wenn der Laden es erlaubt.",0],["Nur wenn die Ware mehr als 100 € kostet.",0]]},
 why:"Jedermann darf vorläufig festnehmen (§ 127 StPO). Bei Gegenwehr lieber eine Personenbeschreibung an die Polizei geben.",
 term:"vorläufige Festnahme (§ 127 StPO)",ihk:"Festhalten nur auf frischer Tat bei Fluchtverdacht oder unklarer Identität; Eigenschutz geht vor."},
{id:"p6-2",ch:6,m:"p",k:"mc",s:"Ladendiebstahl ist eine Straftat nach § 242 StGB.",q:"Welche Folgen kann er für den Täter haben?",
 o:[["Strafanzeige (Geld- oder Freiheitsstrafe), Hausverbot, Schadensersatz bzw. Bearbeitungsgebühr.",1],["Nur eine Verwarnung, sonst nichts.",0],["Ein Bußgeld wie beim Falschparken, mehr nicht.",0]],
 why:"Strafanzeige, Hausverbot, Schadensersatz/Bearbeitungsgebühr an den Händler.",
 term:"Folgen für den Täter",ihk:"Strafanzeige (Geld- oder Freiheitsstrafe), Hausverbot; Schadensersatz an den Händler."},
{id:"p6-3",ch:6,m:"p",k:"mc",s:"An der Kasse liegt eine teure Kopfhörer-Packung. Darin stecken aber billige Kopfhörer. Der Preis passt nicht.",q:"Welche Diebstahlmethode ist das?",
 o:[["Verpackung oder Etiketten tauschen.",1],["Ablenkung.",0],["Ware im Kinderwagen verstecken.",0]],
 why:"Etiketten tauschen, Verpackung austauschen: teure Ware in billiger Verpackung oder umgekehrt, der Preis passt nicht.",
 term:"Etiketten/Verpackung tauschen",ihk:"Etiketten tauschen, Verpackung austauschen – Preis passt nicht zur Ware."},
{id:"p6-4",ch:6,m:"p",k:"rede",s:"Du hast beobachtet, wie eine Kundin eine Mütze in ihre Jacke steckt. Sie geht zur Kasse und bezahlt nur die anderen Artikel. Die Filialleiterin ist dabei.",q:"Wie sprichst du sie an?",
 o:[["„Entschuldigen Sie, ich glaube, Sie haben noch etwas in Ihrer Jacke, das Sie nicht bezahlt haben. Kommen Sie bitte kurz mit ins Büro.“",1],["„Ich hab genau gesehen, dass Sie geklaut haben! Alle mal herschauen!“",0],["„Ausziehen, Jacke her!“",0],["„Ach, ist ja nicht so schlimm. Gehen Sie ruhig.“",0]],
 why:"Diskret und höflich, mit Zeugin, in einen Nebenraum bitten. Nicht bloßstellen, nicht selbst durchsuchen, aber auch nicht wegsehen.",
 term:"diskret ansprechen",ihk:"Diskret und höflich ansprechen, in einen Nebenraum bitten, Vorgesetzten/Polizei hinzuziehen."},
{id:"p6-5",ch:6,m:"p",k:"mcb",s:"Die Kundin ist im Büro. Ein Kollege will sofort ihre Tasche ausleeren.",q:"Darf er das?",
 o:[["Nein.",1],["Ja, im Büro ist das erlaubt.",0],["Ja, wenn zwei Mitarbeiter dabei sind.",0]],
 b:{q:"Was ist richtig?",o:[["Taschen nicht selbst durchsuchen – die Polizei rufen lassen.",1],["Die Kundin so lange festhalten, bis sie gesteht.",0],["Die Tasche einfach behalten.",0]]},
 why:"Taschen nicht selbst durchsuchen. Nicht allein handeln, Zeugen bzw. Vorgesetzte und Polizei hinzuziehen.",
 term:"Taschen nicht durchsuchen",ihk:"Person in einen Nebenraum bitten, Polizei rufen lassen; Taschen nicht selbst durchsuchen."},
{id:"p6-6",ch:6,m:"p",k:"mcb",s:"„Behrens, du Dieb!“ – Reeder Lührs hat damals laut vor allen Kunden beschuldigt.",q:"Wie beurteilst du sein Verhalten?",
 o:[["Falsch.",1],["Richtig, so schreckt man Diebe ab.",0],["Richtig, wenn man sich ganz sicher ist.",0]],
 b:{q:"Warum?",o:[["Bei Verdacht niemals laut beschuldigen oder vor anderen bloßstellen – erst diskret klären, Zeugen und Polizei hinzuziehen.",1],["Weil Lührs kein Mitarbeiter war.",0],["Weil Diebstahl damals erlaubt war.",0]]},
 why:"Auch bei einem echten Verdacht: diskret, höflich, mit Zeugen, im Nebenraum. Wer laut beschuldigt, kann einen Unschuldigen bloßstellen.",
 term:"niemanden bloßstellen",ihk:"Niemals laut beschuldigen oder vor anderen bloßstellen; diskret und höflich ansprechen."},

// ===== Kapitel 7 – Kundentypen =====
{id:"a7-1",ch:7,m:"a",k:"mc",s:"Der misstrauische Fischhändler fragt: „Stimmt das wirklich, was Sie da erzählen?“",q:"Womit überzeugst du ihn?",
 o:[["Mit Beweisen: Testergebnis, Gütesiegel, ausprobieren lassen.",1],["Mit einem lauten „Doch, glauben Sie mir einfach!“",0],["Mit dem teuersten Produkt.",0]],
 why:"Der misstrauische Kunde braucht objektive Belege: Testergebnisse, Gütesiegel, ausprobieren, Umtausch/Garantie.",
 term:"misstrauischer Kunde",ihk:"Der misstrauische Kunde wird mit objektiven Belegen (Testergebnisse, Gütesiegel) überzeugt."},
{id:"a7-2",ch:7,m:"a",k:"mc",s:"Die Frau kann sich zwischen fünf Schals nicht entscheiden.",q:"Wie hilfst du ihr?",
 o:[["Auswahl einengen und eine klare Empfehlung geben.",1],["Noch zehn weitere Schals zeigen.",0],["Sagen: „Nehmen Sie doch einfach irgendeinen.“",0]],
 why:"Unentschlossener Kunde: Auswahl einengen, klare Empfehlung, Nutzen wiederholen, Mut machen.",
 term:"unentschlossener Kunde",ihk:"Unentschlossener Kunde: Auswahl einengen, klare Empfehlung geben, Nutzen wiederholen."},
{id:"a7-3",ch:7,m:"a",k:"mc",s:"Der alte Lotse geht am Stock. Die Chefin will mehr ältere Kunden gewinnen.",q:"Welche Maßnahme passt?",
 o:[["Sitzmöglichkeiten, breitere Gänge und große Preisschilder.",1],["Lautere Musik und dunkleres Licht.",0],["Höhere Regale, damit mehr Ware passt.",0]],
 why:"Für Senioren: breitere Gänge, keine zu hohen Regale, Sitzmöglichkeiten, gute Beleuchtung, große Preisschilder, kleinere Packungen, Lieferservice.",
 term:"Senioren als Kunden",ihk:"Breitere Gänge, keine hohen Regale, Sitzmöglichkeiten, Lieferservice, kleinere Packungsgrößen."},
{id:"a7-4",ch:7,m:"a",k:"mc",s:"Eine ältere Kundin steht im Gang.",q:"Woran erkennst du, dass sie Hilfe braucht?",
 o:[["Sie schaut sich suchend nach Personal um und macht ein ratloses Gesicht.",1],["Sie geht zügig zur Kasse.",0],["Sie telefoniert und lacht.",0]],
 why:"Hilfe erkennen an Gestik und Mimik: suchender Blick, ratloses Gesicht, wendet sich hin und her, zuckt mit den Schultern.",
 term:"Hilfe erkennen",ihk:"Kundin schaut sich suchend nach Verkaufspersonal um / macht ein ratloses Gesicht."},
{id:"a7-5",ch:7,m:"a",k:"rede",s:"Eine Kundin fragt nach Herkunft und Bio. Sie ist umweltbewusst.",q:"Was sagst du?",
 o:[["„Das T-Shirt ist aus Bio-Baumwolle und fair hergestellt – hier sehen Sie das Siegel.“",1],["„Das ist heute im Angebot, 30 % billiger.“",0],["„Das ist die teuerste Marke im Laden.“",0]],
 why:"Umweltbewusster Kunde: Nachhaltigkeit, Recycling, Herkunft, Energieeffizienz, Biolabel, Fair Trade.",
 term:"umweltbewusster Kunde",ihk:"Auf Nachhaltigkeit, Herkunftsland, Biolabel und Fair Trade hinweisen."},
{id:"a7-6",ch:7,m:"a",k:"mc",s:"Ein Kunde achtet sehr auf den Preis. Er ist sparsam.",q:"Womit überzeugst du ihn?",
 o:[["Mit Angeboten, Staffelpreisen und einem guten Preis-Leistungs-Verhältnis.",1],["Mit dem teuersten Markenartikel.",0],["Mit einer langen Erklärung zur Herkunft.",0]],
 why:"Sparsamer Kunde: auf Angebote hinweisen, Preis-Leistungs-Verhältnis herausstellen, Staffelpreise, Haltbarkeit.",
 term:"sparsamer Kunde",ihk:"Auf Angebote hinweisen, Preis-Leistungs-Verhältnis herausstellen, Staffelpreise."},
{id:"p7-1",ch:7,m:"p",k:"mcb",s:"Ein Kunde kennt alle Fachbegriffe und hat sich vorher genau informiert.",q:"Wie berätst du ihn?",
 o:[["Fachgespräch auf Augenhöhe, mit Details und Neuigkeiten.",1],["Alles ganz einfach erklären, von Anfang an.",0],["Ihn gar nicht beraten.",0]],
 b:{q:"Worauf achtest du besonders?",o:[["Ihn nicht belehren – er ist sachverständig.",1],["Ihm zeigen, dass ich mehr weiß.",0],["Nur über den Preis sprechen.",0]]},
 why:"Sachverständiger Kunde: Fachgespräch auf Augenhöhe, Details, Neuigkeiten – nicht belehren.",
 term:"sachverständiger Kunde",ihk:"Sachverständiger Kunde: Fachgespräch auf Augenhöhe, Details, Neuigkeiten; nicht belehren."},
{id:"p7-2",ch:7,m:"p",k:"mc",s:"Ein Kunde zeigt dir auf dem Handy einen günstigeren Internetpreis („Smartshopper“).",q:"Womit überzeugst du ihn am ehesten?",
 o:[["Service, Beratung, sofort mitnehmen – ggf. Preis angleichen.",1],["Ihm sagen, dass Internetpreise immer falsch sind.",0],["Den Preis ignorieren und weiterreden.",0]],
 why:"Preisorientierter Kunde: Vorteile des Ladens zeigen (Service, Beratung, sofort mitnehmen), ggf. Preis angleichen.",
 term:"preisorientierter Kunde",ihk:"Preisorientierter Kunde: Service, Beratung, sofortige Verfügbarkeit, ggf. Preisangleichung."},
{id:"p7-3",ch:7,m:"p",k:"mcb",s:"Prüfer (IHK S 2023, 2.2): „Warum brauchen Senioren eine andere Beratung als junge Kunden?“",q:"Was ist die Kernaussage?",
 o:[["Unterschiedliche Kundengruppen haben verschiedene Bedürfnisse.",1],["Senioren kaufen weniger, also braucht man weniger Zeit.",0],["Senioren wollen immer das Billigste.",0]],
 b:{q:"Was folgt daraus?",o:[["Sie brauchen unterschiedliche Servicearten und Beratungsintensität, z. B. mehr Zeit, deutliche Sprache, Lieferservice.",1],["Man sollte sie wie Kinder behandeln.",0],["Man sollte sie an Kollegen weiterschicken.",0]]},
 why:"Verschiedene Bedürfnisse → unterschiedliche Servicearten und Beratungsintensität. Und: Niemand möchte als „alt“ behandelt werden.",
 term:"kundengruppengerechte Beratung",ihk:"Unterschiedliche Kundengruppen haben verschiedene Bedürfnisse und fordern unterschiedliche Beratungsarten und -intensitäten."},
{id:"p7-4",ch:7,m:"p",k:"mc",s:"Die Chefin möchte den Laden „barrierefrei“ machen.",q:"Was bedeutet das?",
 o:[["Alle Menschen – auch mit Rollstuhl, Rollator, Seh- oder Höreinschränkung – können den Laden ohne fremde Hilfe nutzen.",1],["Es gibt keine Kassen mehr.",0],["Der Laden hat keine Türen.",0]],
 why:"Beispiele: Rampen, automatische Türen, breite Gänge, kontrastreiche Beschriftung, barrierefreie Toiletten.",
 term:"Barrierefreiheit",ihk:"Barrierefreiheit: Rampen, automatische Türen, breite Gänge, kontrastreiche Beschriftung, barrierefreie Toiletten."},
{id:"p7-5",ch:7,m:"p",k:"rede",s:"Der alte Lotse sucht einen Wasserkocher. Er ist müde vom Laufen.",q:"Welche Ansprache ist am besten?",
 o:[["„Lassen Sie sich ruhig Zeit. Hier vorne steht ein Stuhl, wenn Sie sich setzen möchten. Ich zeige Ihnen gern zwei Modelle.“",1],["„Na, Opa, soll ich Ihnen das ganz langsam erklären?“",0],["„Die Wasserkocher sind da hinten. Viel Glück!“",0],["„Am besten schicken Sie Ihre Kinder zum Einkaufen.“",0]],
 why:"Zeit nehmen, Sitzmöglichkeit, Hilfe anbieten, ohne aufzudrängen – und mit Respekt. Niemand möchte als „alt“ behandelt werden.",
 term:"Service für Senioren",ihk:"Kundenbezogene Serviceleistung für Senioren: Sitzmöglichkeiten, Geduld, Hilfestellung."},
{id:"p7-6",ch:7,m:"p",k:"mc",s:"IHK S 2023, 2.1: „Mit welchen Argumenten überzeugen Sie den Qualitätsbewussten?“",q:"Welche Antwort bringt volle Punkte?",
 o:[["Auf Gütesiegel und Testergebnisse hinweisen, hochwertige Markenartikel vorlegen.",1],["Auf Angebote und Staffelpreise hinweisen.",0],["Auf Herkunft und Biolabel hinweisen.",0]],
 why:"Qualitätsbewusst → Gütesiegel, Testergebnisse, Markenartikel. Sparsam → Angebote. Umweltbewusst → Herkunft, Bio.",
 term:"qualitätsbewusster Kunde",ihk:"Qualitätsbewusster: auf Gütesiegel und Testergebnisse hinweisen, hochwertige Markenartikel vorlegen."},

// ===== Kapitel 8 – Hochbetrieb, Ladenschluss, Begleitung, Geschenk =====
{id:"a8-1",ch:8,m:"a",k:"rede",s:"Es ist 19:55. Um 20 Uhr ist Ladenschluss. Eine Kundin kommt und möchte eine Jacke anprobieren.",q:"Was sagst du?",
 o:[["„Guten Abend! Probieren Sie die Jacke gern in Ruhe an.“",1],["„Wir machen gleich zu. Kommen Sie morgen wieder.“",0],["Nichts sagen und schon mal das Licht ausmachen.",0]],
 why:"Der Kunde hat das Recht, bis zum Ladenschluss in Ruhe einzukaufen. Nicht drängen, nicht schon aufräumen.",
 term:"kurz vor Ladenschluss",ihk:"Auch kurz vor Ladenschluss vollständig und ohne Zeitdruck beraten."},
{id:"a8-2",ch:8,m:"a",k:"mc",s:"Hochbetrieb: Du berätst eine Kundin. Ein Herr hat eine kurze Frage. Eine Mutter mit Kind wartet.",q:"Was tust du?",
 o:[["Kurze Frage sofort beantworten, Wartende mit Blickkontakt wahrnehmen: „Ich bin gleich für Sie da.“",1],["Nur die erste Kundin bedienen und die anderen nicht beachten.",0],["Alle stehen lassen und eine Pause machen.",0]],
 why:"Hochbetrieb: Reihenfolge, Wartende wahrnehmen, Mehrfachbedienung, kurze Fragen sofort, Hilfe holen, Dank fürs Warten.",
 term:"Mehrfachbedienung",ihk:"Wartende Kunden durch Blickkontakt und kurze Ansprache wahrnehmen (Hochbetrieb)."},
{id:"a8-3",ch:8,m:"a",k:"rede",s:"Der Herr mit dem Zylinder sucht ein Geschenk.",q:"Welche Frage stellst du?",
 o:[["„Für wen soll das Geschenk sein?“",1],["„Soll es ein Buch sein?“",0],["„Wollen Sie etwas Teures?“",0]],
 why:"Offene Fragen (W-Fragen) bringen Infos und in der Prüfung Punkte. Geschlossene Fragen („Soll es …?“) bringen keine Punkte.",
 term:"offene Frage beim Geschenkkauf",ihk:"Für wen soll das Geschenk sein? Für welchen Anlass? Welches Hobby hat die Person?"},
{id:"a8-4",ch:8,m:"a",k:"rede",s:"Der Herr hat sich für ein Geschenk entschieden und bezahlt.",q:"Wie verabschiedest du ihn?",
 o:[["„Vielen Dank für Ihren Einkauf und viel Freude beim Schenken!“",1],["„Tschüss.“",0],["„Der Nächste, bitte!“",0]],
 why:"Kaufbestätigung mit Bezug zum Geschenk. „Auf Wiedersehen“ allein gibt nur 1 Punkt.",
 term:"Kaufbestätigung",ihk:"„Vielen Dank für Ihren Einkauf und viel Freude beim Schenken.“"},
{id:"a8-5",ch:8,m:"a",k:"mc",s:"Eine Kundin kommt mit ihrem Freund. Er kennt sich mit Laufschuhen sehr gut aus.",q:"Wie gehst du mit ihm um?",
 o:[["Ihn einbeziehen und ernst nehmen. Die Entscheidung trifft aber die Kundin.",1],["Ihn ignorieren, er kauft ja nicht.",0],["Gegen ihn argumentieren, damit die Kundin mir glaubt.",0]],
 why:"Begleitpersonen beeinflussen die Entscheidung. Mit Fachwissen: als Partner ernst nehmen. Entscheiden tut der Käufer.",
 term:"Kunden in Begleitung",ihk:"Begleitpersonen einbeziehen und ernst nehmen; die Entscheidung trifft der Käufer."},
{id:"a8-6",ch:8,m:"a",k:"rede",s:"Ein Kunde soll für seine Frau „die Creme von letzter Woche“ mitbringen. Den Namen weiß er nicht.",q:"Was sagst du?",
 o:[["„Haben Sie vielleicht die leere Dose oder ein Foto dabei? Sonst gebe ich Ihnen den Bon mit, dann kann Ihre Frau umtauschen.“",1],["„Ohne Namen kann ich nichts machen.“",0],["„Nehmen Sie einfach die teuerste, die ist bestimmt richtig.“",0]],
 why:"Besorgungskauf: nach Muster, Foto oder genauer Angabe fragen, Umtausch anbieten, Kassenbon mitgeben.",
 term:"Besorgungskauf",ihk:"Besorgungskauf: nach Muster/genauer Angabe fragen, Umtausch anbieten, Kassenbon mitgeben."},
{id:"p8-1",ch:8,m:"p",k:"mcb",s:"Eine Mitschülerin schreibt in der Prüfung als Frage beim Geschenkkauf: „Soll es ein Buch sein?“",q:"Bekommt sie dafür Punkte?",
 o:[["Nein.",1],["Ja, volle Punkte.",0],["Ja, einen halben Punkt.",0]],
 b:{q:"Warum?",o:[["Es ist eine geschlossene Frage: Antwort nur ja oder nein, man erfährt nichts über die Wünsche.",1],["Bücher sind keine guten Geschenke.",0],["Fragen darf man in der Prüfung nicht stellen.",0]]},
 why:"Bewertung IHK: Für geschlossene Fragen gibt es keine Punkte. Offene Fragen oder Alternativfragen in wörtlicher Rede!",
 term:"geschlossene Frage",ihk:"Für geschlossene Fragen gibt es keine Punkte."},
{id:"p8-2",ch:8,m:"p",k:"rede",s:"Lange Schlange. Ein Kunde will einen Einkauf von 450 € mit Dollarnoten bezahlen.",q:"Was sagst du?",
 o:[["„Es tut mir leid, wir können nur Euro annehmen. Möchten Sie mit Karte zahlen? Sonst lege ich Ihnen die Ware gern zurück.“",1],["„Dollar? Das geht natürlich, ich rechne kurz um.“",0],["„Was soll das denn? Hier ist Deutschland!“",0],["„Dann gehen Sie doch zur Bank, ich habe keine Zeit.“",0]],
 why:"Freundlich erklären, dass nur Euro angenommen werden, und Alternativen nennen: Karte, Geldautomat, Ware zurücklegen.",
 term:"Zahlung in fremder Währung",ihk:"Freundlich erklären, dass nur Euro angenommen werden; Kartenzahlung oder Zurücklegen anbieten."},
{id:"p8-3",ch:8,m:"p",k:"mc",s:"Unruhe in der Warteschlange. „Beschreiben Sie 4 Möglichkeiten, wie Sie mit der gereizten Stimmung umgehen!“",q:"Welche Antwort ist FALSCH?",
 o:[["Die Kasse kurz offen lassen, um schneller in der Schlange zu helfen.",1],["Ruhe bewahren, keine Hektik zeigen.",0],["Für die Wartezeit entschuldigen, Blickkontakt.",0],["Kollegin rufen, zweite Kasse öffnen lassen.",0]],
 why:"Die Kasse bleibt nie offen – in Hektik passiert leicht Diebstahl. Die anderen drei stehen in der Lösung.",
 term:"Kundenandrang",ihk:"Ruhe bewahren, Wartende wahrnehmen und entschuldigen, zweite Kasse öffnen lassen, freundlich und sorgfältig kassieren."},
{id:"p8-4",ch:8,m:"p",k:"mcb",s:"Beim Geschenkkauf sagst du: „Falls es nicht passt, kann es gern umgetauscht werden.“",q:"Ist der Umtausch hier rechtlich Pflicht?",
 o:[["Nein, er ist freiwillig (Kulanz).",1],["Ja, bei Geschenken immer.",0],["Ja, 14 Tage lang.",0]],
 b:{q:"Warum bietet man ihn trotzdem an?",o:[["Er nimmt dem Kunden das Risiko, dass das Geschenk nicht gefällt, und beschleunigt die Kaufentscheidung.",1],["Weil das Widerrufsrecht für Geschenke gilt.",0],["Weil Geschenke meist kaputt sind.",0]]},
 why:"Bei fehlerfreier Ware gibt es im Laden kein gesetzliches Umtauschrecht. Das Angebot ist trotzdem verkaufsfördernd.",
 term:"Umtauschangebot beim Geschenk",ihk:"Umtausch fehlerfreier Ware ist freiwillig (Kulanz); er nimmt dem Kunden das Risiko und beschleunigt den Kauf."},
{id:"p8-5",ch:8,m:"p",k:"mcb",s:"Du berätst Frau Kühn beim Schuhe-Anprobieren. Ein Herr fragt nur kurz nach Schuhcreme.",q:"Was machst du?",
 o:[["Frau Kühn kurz Bescheid geben, die kurze Frage beantworten, dann zurück zu Frau Kühn.",1],["Den Herrn warten lassen, bis Frau Kühn fertig ist – egal wie lange.",0],["Frau Kühn stehen lassen und mit dem Herrn mitgehen.",0]],
 b:{q:"Wie heißt das und worauf achtest du?",o:[["Mehrfachbedienung – Kundin A nicht vergessen und für das Warten danken.",1],["Selbstbedienung – jeder sucht selbst.",0],["Vorwahl – die Kundin bedient sich allein.",0]]},

{id:"p9-1",ch:9,m:"p",k:"num",s:"Der Fernseher kostet bar 899,00 €. Über die Partnerbank zahlt der Kunde 24 Raten zu je 39,90 €.",q:"Wie viel Euro zahlt er mehr als bei Barzahlung?",

// ===== Kapitel 10 – Finale / Fachgespräch =====
{id:"a10-1",ch:10,m:"a",k:"mc",s:"Behrens: „Eine Kundin bringt zwei T-Shirts. Sie waren 40 % reduziert. Nach zweimal Tragen sind die Nähte gerissen. Gekauft vor drei Wochen, Bon liegt vor.“",q:"Was liegt vor?",

 term:"Reklamation bei reduzierter Ware",ihk:"Es liegt ein Sachmangel vor; die Gewährleistung gilt auch für reduzierte Ware."},
{id:"a10-2",ch:10,m:"a",k:"mc",s:"Behrens: „Ihr stellt euren Lösungsweg vor. Womit fangt ihr an?“",q:"Was tust du zuerst?",
 o:[["Den Menschen: freundlich begrüßen, zuhören, entschuldigen.",1],["Sofort die Rechtslage erklären.",0],["Sofort den Kassenbon verlangen.",0]],
 why:"Erst der Mensch, dann die Sache. Danach prüfen, Rechtslage, Lösung.",
 term:"Erst der Mensch, dann die Sache",ihk:"Zuerst würde ich die Kundin freundlich begrüßen, ihr zuhören und mich entschuldigen."},
{id:"a10-3",ch:10,m:"a",k:"mc",s:"Behrens: „In welcher Reihenfolge stellt ihr einen Fall im Fachgespräch dar?“",q:"Welche Reihenfolge stimmt?",
 o:[["Fall nennen → Mensch beruhigen → prüfen → Rechtslage → Lösung → Ausblick",1],["Lösung → Rechtslage → Fall nennen → Mensch beruhigen",0],["Rechtslage → Ausblick → Mensch beruhigen → prüfen",0]],

{id:"a10-4",ch:10,m:"a",k:"mc",s:"Behrens: „Ein 14-jähriges Mädchen will alkoholhaltige Pralinen zum Muttertag kaufen.“",q:"Welcher Aspekt ist zu beachten?",
 o:[["Jugendschutz: branntweinhaltige Lebensmittel erst ab 18.",1],["Diebstahlprävention.",0],["Hilfestellung, Service.",0]],
 why:"Kassen-Tabelle (IHK S 2023): Situation erkennen → Aspekt → Ansprache in wörtlicher Rede.",
 term:"Kassen-Tabelle",ihk:"Jugendschutz, branntweinhaltige Lebensmittel erst ab 18 Jahren."},
{id:"a10-5",ch:10,m:"a",k:"mc",s:"Behrens: „Ein Kunde fragt: ‚Kann ich den Fernseher auch abstottern?‘“",q:"Was musst du jetzt beachten?",

 why:"„Abstottern“ = in Raten zahlen. Entscheidungsweg Modul 9: Ratenkauf/Finanzkauf, Pflichtangaben, 14 Tage Widerruf.",
 term:"Entscheidungsweg",ihk:"Bei einem Teilzahlungsgeschäft sind Barzahlungspreis, Teilzahlungspreis, Raten und effektiver Jahreszins anzugeben."},
{id:"a10-6",ch:10,m:"a",k:"mc",s:"Behrens: „Was zählt im Fachgespräch am meisten?“",q:"Was stimmt?",
 o:[["Sagen, was ich tue, und warum („…, weil …“). Beispiele aus meinem Betrieb machen die Antwort stark.",1],["Möglichst schnell und leise antworten.",0],["Nur Paragrafen aufsagen.",0]],

{id:"a10-7",ch:10,m:"a",k:"mc",s:"Behrens: „Ein Kunde beschwert sich lautstark. Ihr stellt fest: Die Ware hat einen Mangel. Was darf der Kunde zuerst verlangen?“",q:"Wähle.",

 why:"Reklamationskette (IHK S 2023, Aufgabe 5): reagieren – prüfen – vorrangige Rechte (Nachbesserung, Ersatzlieferung) – nachrangige Rechte.",
 term:"Reklamationskette",ihk:"Vorrangig: Nachbesserung, Ersatzlieferung · nachrangig: Schadensersatz, Preisminderung, Rücktritt."},

 o:[["Nacherfüllung: neue T-Shirts oder Reparatur.",1],["Sofort Geld zurück.",0],["Nichts, weil reduziert.",0]],
 b:{q:"Warum?",o:[["Nacherfüllung ist vorrangig; Rücktritt erst, wenn sie nicht klappt. Die Reduzierung war nicht wegen der Nähte.",1],["Weil reduzierte Ware nur repariert werden darf.",0],["Weil das Geld schon in der Kasse ist.",0]]},
 why:"Lösungsweg Leonie (M10): Prüfkriterien erfüllt → Reklamation → Nacherfüllung vorrangig. Aus Kulanz kann der Betrieb trotzdem sofort das Geld anbieten.",

{id:"p10-2",ch:10,m:"p",k:"mc",s:"Behrens (IHK S 2023, 11 Punkte): „Kunde beschwert sich laut. a) 3 Reaktionen, b) 3 Prüfkriterien, c) 2 vorrangige und 3 nachrangige Rechte.“",q:"Welche Antwort ist vollständig richtig?",
 o:[["a) zuhören, Verständnis/Entschuldigung, nachfragen · b) wo, wann, Mangel? · c) Nachbesserung, Ersatzlieferung · Schadensersatz, Minderung, Rücktritt",1],["a) belehren, Kollegin rufen, Bon verlangen · b) wo, wann, Mangel? · c) Rücktritt, Minderung · Nachbesserung, Ersatz, Garantie",0],["a) zuhören, entschuldigen, nachfragen · b) Preis, Farbe, Größe · c) Nachbesserung, Ersatzlieferung · Schadensersatz, Minderung, Rücktritt",0]],
 why:"Achtet auf jeden Teil: Belehren ist falsch, Prüfkriterien sind wo/wann/Mangel, vorrangig = Nacherfüllung.",
 term:"Reklamationskette",ihk:"Aussprechen lassen, Verständnis zeigen · wo, wann, Mangel? · Nachbesserung, Ersatzlieferung · Schadensersatz, Preisminderung, Rücktritt."},

 why:"Lösungsweg „Kasse“: ruhig bleiben, entschuldigen, zweite Kasse rufen, nur Euro + Alternativen, Kasse nie offen lassen.",
 term:"Pflichten an der Kasse",ihk:"Trotz der Hektik lasse ich die Kasse nie offen und kontrolliere die Wagen, weil in solchen Situationen leicht Diebstahl passiert."},
{id:"p10-4",ch:10,m:"p",k:"mc",s:"Behrens: „Ihr habt 15 Minuten Vorbereitung. Wie baut ihr euren Stichwortzettel auf?“",q:"Welche Reihenfolge ist richtig?",
 o:[["Was ist passiert? → Was tue ich zuerst (Mensch)? → Rechtslage (Sache)? → Lösung? → Was lerne ich daraus?",1],["Rechtslage → Lösung → Was ist passiert? → Mensch",0],["Lösung → Was lerne ich daraus? → Mensch → Rechtslage",0]],
 why:"Stichwortzettel in fünf Fragen – dann 3–5 Minuten frei sprechen, in ganzen Sätzen mit Fachbegriffen.",

 o:[["Damit wir unsere Rechte beim Lieferanten geltend machen.",1],["Damit wir sie dort neu verkaufen.",0],["Weil wir sie nicht wegwerfen dürfen.",0]],
 b:{q:"Zu welchem Schritt im Lösungsweg gehört das?",o:[["Ausblick – den Prozess zu Ende denken.",1],["Mensch beruhigen.",0],["Prüfkriterien.",0]]},
 why:"Aufbau: … → Lösung → Betrieb/Ausblick. Der Prozess endet nicht beim Kunden.",
 term:"Ausblick im Lösungsweg",ihk:"Zum Schluss würde ich die Ware an den Lieferanten zurückschicken, damit wir unsere Rechte dort geltend machen."}
];

// ---------- Pool ----------
function poolFor(m){return POOL.filter(q=>q.m===m)}
function newCount(m){const seen=new Set(DB.seen[m]);return poolFor(m).filter(q=>!seen.has(q.id)).length}
function draw(m,chs,code){
  const notes=[]; const seen=new Set(code?[]:DB.seen[m]); const out=[];
  chs.forEach(c=>{
    const items=POOL.filter(q=>q.m===m&&q.ch===c); const n=Math.min(PER[m],items.length);
    let fresh=shuffle(items.filter(q=>!seen.has(q.id)));
    if(!code&&fresh.length<n){
      notes.push(c);
      const rest=shuffle(items.filter(q=>seen.has(q.id)));
      DB.seen[m]=DB.seen[m].filter(id=>!items.some(q=>q.id===id));
      fresh=fresh.concat(rest);
    }
    fresh.slice(0,n).forEach(q=>out.push(prep(q)));
  });
  save();
  return {qs:out,notes};
}
function prep(q){
  const o=shuffle(q.o?q.o.map((x,i)=>({t:x[0],ok:!!x[1],i})):[]);
  const b=q.b?{q:q.b.q,o:shuffle(q.b.o.map((x,i)=>({t:x[0],ok:!!x[1],i})))}:null;
  return {q,o,b,sel:null,bsel:null,num:"",phase:q.k==="rede"?"write":"choose",gone:[],res:null,own:"",chk:[]};
}
function drawWrong(m){
  const ids=new Set(DB.wrong[m]);
  const items=POOL.filter(q=>q.m===m&&ids.has(q.id));
  const sel=shuffle(items).slice(0,20).sort((a,b)=>a.ch-b.ch);
  return sel.map(prep);
}

function startGame(kind){
  kind=kind||"normal";
  const m=S.mode; let chs=S.chs.slice().sort((a,b)=>a-b);
  const code=kind==="normal"?S.code.trim().toUpperCase():"";
  RNG=code?mulberry32(hashStr(code+"|"+m+"|"+chs.join(","))):Math.random;
  let d;
  if(kind==="fehler"){const qs=drawWrong(m); if(!qs.length)return; chs=[...new Set(qs.map(x=>x.q.ch))]; d={qs,notes:[]};}
  else { if(!chs.length)return; d=draw(m,chs,code); }
  G={mode:m,kind,code,team:S.team.trim()||"Team Nebel",chs,qs:d.qs,notes:d.notes,i:0,step:"prolog",lanterns:m==="a"?3:0,used:0,fog:15,score:0,max:0,chRes:{},second:{},fixedNow:0};
  G.max=G.qs.reduce((s,x)=>s+maxPts(x),0);
  DB.lastMode=m;DB.lastTeam=S.team;save();
  render(); window.scrollTo(0,0);
}
function maxPts(x){return x.q.k==="mcb"?15:10}
function cur(){return G.qs[G.i]}
function chOf(n){return CHAPTERS[n-1]}
function wrongCount(){return G.qs.filter(x=>x.res&&x.res!=="ok").length}
function updFog(){const total=G.qs.length;const w=G.qs.reduce((s,x)=>s+(x.res==="no"?1:x.res==="half"?0.5:0),0);G.fog=Math.min(100,Math.round(15+w*(85/(total*0.5))))}

}

function parseNum(s){s=String(s).replace(/€|\s/g,"");if(/,/.test(s)){s=s.replace(/\./g,"").replace(",",".")}const v=parseFloat(s);return isNaN(v)?null:v}
function lockMain(){
  const x=cur();
  if(x.q.k==="mcb"){x.phase="reason";render();return}
  x.phase="done";finish(x);
}
function finish(x){
  const q=x.q; let pts=0;
  if(q.k==="num"){const v=parseNum(x.num);x.res=(v!==null&&Math.abs(v-q.ans)<0.011)?"ok":"no";pts=x.res==="ok"?10:0}
  else if(q.k==="mcb"){const a=x.o[x.sel].ok,b=x.b.o[x.bsel].ok;x.res=a&&b?"ok":a?"half":"no";pts=a&&b?15:a?5:0}
  else{x.res=x.o[x.sel].ok?"ok":"no";pts=x.res==="ok"?10:0}
  if(x.gone.length)pts=Math.max(0,pts-3);
  x.pts=pts;G.score+=pts;
  if(!G.code&&!DB.seen[G.mode].includes(q.id))DB.seen[G.mode].push(q.id);
  const wl=DB.wrong[G.mode];
  if(x.res==="ok"){ if(wl.includes(q.id)){DB.wrong[G.mode]=wl.filter(id=>id!==q.id);DB.fixed++;G.fixedNow++;} }
  else if(!wl.includes(q.id)) wl.push(q.id);
  if(x.follow&&x.res==="ok")G.chRes[q.ch]="clear";
  save();
  updFog(); chime(x.res==="ok"); render();
}
function next(){
  G.confirmQuit=false;
  const x=cur(); const c=x.q.ch; const nextQ=G.qs[G.i+1];
  if(x.follow){advance();return}
  if(!nextQ||nextQ.q.ch!==c){
    const items=G.qs.filter(y=>y.q.ch===c&&!y.follow); G.chRes[c]=items.every(y=>y.res==="ok")?"clear":"misty";
    G.step="page"; render(); window.scrollTo(0,0); return;
  }
  G.i++; render(); window.scrollTo(0,0);
}

   <h3>${esc(G.team)}</h3><span class="muted">${G.mode==="a"?"Anfänger":"Profi"}${G.kind==="fehler"?" · Fehler-Nacht":""}${G.code?" · Code "+esc(G.code):""} · Kapitel ${G.chs.join(", ")}</span>
   <div class="stars">${[0,1,2].map(i=>ICON.star(i<stars)).join("")}</div>
   <div class="kpis"><div><b>${G.score}/${G.max}</b>Punkte</div><div><b>${ok}/${tot}</b>ganz richtig</div><div><b>${clears}/${G.chs.length}</b>klare Buchstaben</div></div>
   ${G.used?`<span class="muted" style="font-size:.9rem">Laternen benutzt: ${G.used}</span>`:""}
   ${G.fixedNow?`<span style="font-size:.95rem"><b>${G.fixedNow}</b> alte Fehler ausgebügelt. Auf der Fehlerliste stehen noch ${DB.wrong[G.mode].length}.</span>`:""}
   <span class="muted" style="font-size:.9rem">${pct} %${G.kind==="normal"&&!G.code?" · Rekord auf diesem Gerät: "+DB.best[G.mode]+" %":""}</span></div>
  <div class="panel"><h3>Eure Entscheidungen</h3><div class="review">${review}</div></div>
  <div class="panel"><h3>Noch eine Nacht?</h3>
   <p class="muted" style="font-size:.95rem">${G.code?"Mit demselben Code kommen dieselben Fragen. ":"Beim nächsten Mal kommen zuerst Fragen, die ihr noch nicht hattet. "}Falsche Antworten landen auf eurer Fehlerliste – dafür gibt es auf der Startseite die Fehler-Nacht.</p>
   <div class="row"><button class="btn" id="again">Noch eine Nacht (${G.mode==="a"?"Anfänger":"Profi"})</button><button class="btn ghost" id="other">${G.mode==="a"?"Jetzt als Profi":"Jetzt als Anfänger"}</button><button class="btn ghost" id="home">Startseite</button></div></div>`;
  bindTop();
  $("#again").onclick=()=>{S.mode=G.mode;if(G.kind==="normal")S.chs=G.chs;startGame(G.kind==="fehler"&&DB.wrong[G.mode].length?"fehler":"normal")};
  $("#other").onclick=()=>{S.mode=G.mode==="a"?"p":"a";if(G.kind==="normal")S.chs=G.chs;startGame("normal")};
  $("#home").onclick=()=>{G=null;render();window.scrollTo(0,0)};
}

// Test-Hilfe (nur für automatische Prüfung)
window.__nebel={get G(){return G},get DB(){return DB},POOL,CHAPTERS};
render();
})();
</script>

</body>
