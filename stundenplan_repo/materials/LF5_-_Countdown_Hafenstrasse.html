<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Countdown Hafenstraße</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: eine Handy-Spalte (max. 560 px), oben eine Straßenszene der Hafenstraße, die sich mit jeder Entscheidung verändert. */
:root{
  --bg:#e9eff3; --surface:#ffffff; --surface2:#f3f6f9; --ink:#14263a; --muted:#4c5d70; --line:#cdd8e2;
  --hafen:#16426e; --on-hafen:#ffffff; --boje:#d94f2b; --on-boje:#ffffff; --messing:#f1b93b; --on-messing:#2b1d00;
  --good:#1f7a46; --mid:#9a6400; --bad:#b8321f; --good-bg:#e0f2e7; --mid-bg:#fbefd4; --bad-bg:#fae2dd;
  --display:"Alfa Slab One",Rockwell,"Roboto Slab",Georgia,serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1622; --surface:#142233; --surface2:#1a2b3f; --ink:#e5edf5; --muted:#9fb1c3; --line:#2b3f56;
  --hafen:#6fa8e0; --on-hafen:#06192c; --boje:#f07a57; --on-boje:#2a0b02; --messing:#f4c75c; --on-messing:#2b1d00;
  --good:#5cc98a; --mid:#e9b34a; --bad:#f07f6b; --good-bg:#15301f; --mid-bg:#33280f; --bad-bg:#3a1913; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1622; --surface:#142233; --surface2:#1a2b3f; --ink:#e5edf5; --muted:#9fb1c3; --line:#2b3f56;
  --hafen:#6fa8e0; --on-hafen:#06192c; --boje:#f07a57; --on-boje:#2a0b02; --messing:#f4c75c; --on-messing:#2b1d00;
  --good:#5cc98a; --mid:#e9b34a; --bad:#f07f6b; --good-bg:#15301f; --mid-bg:#33280f; --bad-bg:#3a1913; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;margin:0}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2rem;letter-spacing:.01em}
h2{font-size:1.35rem}
h3{font-size:1.08rem}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--messing);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.label{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* Kopfzeile */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:.85rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.cd{background:var(--boje);color:var(--on-boje);border-color:var(--boje)}
.chip.money{background:var(--messing);color:var(--on-messing);border-color:var(--messing)}
.bar .sp{flex:1}
.iconbtn{display:inline-flex;align-items:center;gap:5px;min-height:36px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.85rem;font-weight:700}
.iconbtn svg{width:18px;height:18px}
.iconbtn[aria-pressed="true"]{background:var(--hafen);color:var(--on-hafen);border-color:var(--hafen)}

/* Szene */
.scene{margin-top:12px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#9fd0ea;line-height:0}
.scene svg{width:100%;height:auto;display:block}

/* Karten, Knöpfe */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.story{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:start}
.story .who{font-weight:700;font-size:.9rem;color:var(--muted)}
.story > div{min-width:0}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--surface2);border:2px solid var(--line);overflow:hidden}
.avatar svg{width:100%;height:100%}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:12px 18px;border-radius:12px;border:0;cursor:pointer;font-weight:700;font-size:1.05rem;background:var(--hafen);color:var(--on-hafen)}
.btn.alt{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn.hot{background:var(--boje);color:var(--on-boje)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;width:100%;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.opt > *{min-width:0}
.opt .t{font-weight:700}
.opt .d{grid-column:1 / -1;font-size:.92rem;color:var(--muted)}
.opt .c{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.opt .why-no{grid-column:1 / -1;font-size:.82rem;color:var(--bad);font-weight:700}
.opt[aria-pressed="true"]{border-color:var(--hafen);box-shadow:0 0 0 2px var(--hafen) inset;background:var(--surface2)}
.opt:disabled{opacity:.55;cursor:not-allowed}
.opt.locked{cursor:default}
.opt.locked{opacity:.55}
.opt.wrongpick{border-color:var(--bad);background:var(--bad-bg);opacity:1}
.opt.chosen{border-color:var(--hafen);background:var(--surface2);opacity:1}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.78rem;font-weight:700;background:var(--surface2);border:1px solid var(--line)}

/* Reaktion */
.react{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center}
.react > div{min-width:0}
.face{width:76px;height:76px}
.bubble{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-weight:700}
.bubble::before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.mood-3 .bubble{background:var(--good-bg)} .mood-2 .bubble{background:var(--surface2)} .mood-1 .bubble,.mood-0 .bubble{background:var(--bad-bg)}
.term{border-left:6px solid var(--messing);background:var(--surface)}
.term .k{font-family:var(--display);font-size:1.15rem}
.hint{border-radius:12px;padding:10px 12px;background:var(--mid-bg);color:var(--ink);font-size:.93rem}
.hint b{color:var(--mid)}
.ok{background:var(--good-bg)} .no{background:var(--bad-bg)}
.fb{border-radius:12px;padding:10px 12px;font-size:.95rem}
.fb.ok b{color:var(--good)} .fb.no b{color:var(--bad)}

/* Start */
.hero{padding-block:22px 6px}
.hero .kicker{font-weight:700;color:var(--boje);letter-spacing:.06em;text-transform:uppercase;font-size:.8rem}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode,.shop{text-align:left;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.mode[aria-pressed="true"],.shop[aria-pressed="true"]{border-color:var(--boje);box-shadow:0 0 0 2px var(--boje) inset}
.mode .n{font-family:var(--display);font-size:1.2rem}
.mode ul{margin:0;padding-left:18px;font-size:.88rem;color:var(--muted)}
.shops{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shop{align-items:center;text-align:center;font-weight:700;font-size:.92rem;padding:10px 6px}
.shop svg{width:54px;height:54px}
.field{display:flex;flex-direction:column;gap:4px}
.field input{font:inherit;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}

/* Zielgruppenkarte */
.flip{perspective:900px}
.flip .inner{position:relative;min-height:190px;transition:transform .7s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .side{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;text-align:center}
.flip .front{background:var(--hafen);color:var(--on-hafen);font-family:var(--display);font-size:1.3rem}
.flip .back{background:var(--surface);border:2px solid var(--boje);transform:rotateY(180deg)}
.flip .back .face{width:84px;height:84px}

/* Mini-Spiel */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cat{min-height:58px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.92rem}
.cat:disabled{cursor:default}
.cat.right{background:var(--good-bg);border-color:var(--good)}
.cat.wrong{background:var(--bad-bg);border-color:var(--bad)}
.item{font-size:1.1rem;font-weight:700;padding:18px 16px;border-radius:var(--r);background:var(--surface);border:2px dashed var(--hafen);text-align:center}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--boje);width:0;transition:width .3s}
.timer{font-variant-numeric:tabular-nums;font-weight:700}

/* Rechnen */
.calc input{font:inherit;font-size:1.3rem;font-variant-numeric:tabular-nums;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}

/* Aktionstag */
.counter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.counter > div{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.counter .label{letter-spacing:.02em;font-size:.7rem}
.counter .v{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.event{border:2px solid var(--boje)}
.event .label{color:var(--boje)}

/* Auswertung */
.score{background:var(--hafen);color:var(--on-hafen);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;text-align:center}
.score .stars{display:flex;justify-content:center;gap:4px}
.score .stars svg{width:34px;height:34px}
.score .pts{font-family:var(--display);font-size:2.4rem;font-variant-numeric:tabular-nums}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpis > div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpis .v{font-family:var(--display);font-size:1.25rem;font-variant-numeric:tabular-nums}
.meter{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px}
.dec{display:grid;grid-template-columns:34px 1fr;gap:10px;padding-block:12px;border-top:1px solid var(--line)}
.dec > div{min-width:0}
.mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.mark.g{background:var(--good)} .mark.m{background:var(--mid)} .mark.b{background:var(--bad)}
.ihk{font-size:.9rem;background:var(--surface2);border-radius:10px;padding:8px 10px;margin-top:6px}
.ihk b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.better{font-size:.9rem;color:var(--hafen);font-weight:700;margin-top:4px}
details summary{cursor:pointer;font-weight:700}

/* Wortspeicher */
.sheet{position:fixed;inset:auto 0 0 0;z-index:40;background:var(--surface);border-top:2px solid var(--hafen);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:70vh;overflow:auto;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{padding:4px 10px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:.9rem}

/* Animation */
@keyframes walk{from{transform:translateX(0)}to{transform:translateX(var(--dx))}}
@keyframes blink{50%{opacity:.35}}
@keyframes bob{50%{transform:translateY(-3px)}}
.blink{animation:blink 1.2s steps(2) infinite}
.bob{animation:bob 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  .blink,.bob{animation:none}
  .flip .inner{transition:none}
  .walker{animation:none!important;opacity:0}
}
@media (max-width:440px){.counter .v{font-size:1.05rem}}
@media (max-width:380px){.modes{grid-template-columns:1fr}.cats{grid-template-columns:1fr}}

/* Version 3 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{font:inherit;font-size:.92rem;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;max-width:100%}
.chipb[aria-pressed="true"]{border-color:var(--hafen);background:var(--surface2);box-shadow:0 0 0 2px var(--hafen) inset}
.chipb:disabled{cursor:default;opacity:.7}
.satzvor{font-weight:700;padding:10px 12px;border-radius:10px;background:var(--mid-bg)}
.duel{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center}
.duel > *{min-width:0}
.duel span{font-weight:700;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9em}
.duel b{font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:grid;grid-template-columns:36px 1fr;gap:8px;align-items:start;opacity:.6}
.badge > div{min-width:0}
.badge svg{width:36px;height:36px;color:var(--muted)}
.badge.on{opacity:1}
.badge.new b{color:var(--boje)}
.actcard{background:var(--hafen);color:var(--on-hafen);border-radius:var(--r);padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:10px}
.actcard .w{font-family:var(--display);font-size:2rem;line-height:1.15;overflow-wrap:anywhere}
.actcard .timer{font-size:1.2rem}
body.tafel .app{max-width:1100px}
.tafelhead{display:flex;gap:20px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding-block:20px 6px}
.bigcode{font-family:var(--display);font-size:2.2rem;letter-spacing:.08em;color:var(--boje)}
.rank{width:100%;border-collapse:collapse;font-size:1rem}
.rank th,.rank td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.rank th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.rank .num{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px}
.dot.on{background:var(--good)}
@media (max-width:440px){.badges{grid-template-columns:1fr}}
</style>
</head>

function updBar(label){

$("#bWords").addEventListener("click", ()=>{
  const sh=$("#sheet"); if(!sh.hidden){ sh.hidden=true; return; }

// ---------- Punkte ----------
function points(){
  if(!S) return {total:0};
  let kunde=0; for(const r of ROUNDS){ const o=optOf(r.id,S.pick[r.id]); if(o) kunde += finalFit(r,o)*10; }
  const bonus = S.rendite ? Math.round(Math.min(Math.max(S.rendite,0),400)/10) : 0;
  const rev = S.bonus||0;
  return {kunde, fach:S.fach, bonus, rev, total: kunde + S.fach + bonus + rev};
}
function maxPoints(){ const extra = 10*5 + 3*10 + 10; return extra + (S.mode==="pro" ? 300 + 3*8*5 + 10*10 + 20 + 20+20+10+10 + 40 : 300 + 3*6*5 + 20 + 20+20+10 + 40); }

function pickVariants(){
  const last = store.get("cdh_last_v") || {}; const lastPq = store.get("cdh_last_pq") || {};
  for (const r of ROUNDS){
    const n = r.vars.length; let opts = [...Array(n).keys()].filter(k=>k!==last[r.id]); if(!opts.length) opts=[0];
    S.v[r.id] = pickOne(opts);
    S.ord[r.id] = shuffle(r.vars[S.v[r.id]].opts.map(o=>o.id));
    const m = r.pqs.length; let po = [...Array(m).keys()].filter(k=>k!==lastPq[r.id]); if(!po.length) po=[0];
    S.pqi[r.id] = pickOne(po);
  }
  store.set("cdh_last_v", S.v); store.set("cdh_last_pq", S.pqi);
}
function startRounds(){ S.i=0; S.view="round"; renderRound(); }

function optHTML(r,o){

     <span class="t">${txt(o.t)}</span><span class="c">${o.cost? eur(o.cost) : "0 €"}</span>

function lockIn(){
  const r = rv(ROUNDS[S.i]), o = r.opts.find(x=>x.id===S.sel); if(!o) return;
  S.pick[r.id]=o.id; S.cost[r.id]=o.cost; S.budget -= o.cost;
  screen.querySelectorAll(".opt").forEach(b=>{ b.disabled=true; b.classList.add("locked"); if(b.dataset.o===o.id) b.classList.add("chosen"); });
  $("#bLock").hidden=true; if($("#bTip")) $("#bTip").hidden=true;
  updBar(`Kapitel ${S.i+1}/10 · noch ${r.days} Tage`);
  drawScene();
  const f = finalFit(r,o), mood = f, P = PERSONAS[S.persona];
  const say = (o.r && o.r[S.persona]) || P.lines[Math.min(3,f)];
  const conf = conflictFor(r.id,o.id);
  let h = `<div class="card react mood-${mood}">${faceSVG(S.persona,mood)}<div><p class="label">${P.name} reagiert</p><p class="bubble">„${esc(say)}“</p></div></div>`;
  if (conf) h += `<div class="hint"><b>Passt nicht zu eurer Linie:</b> ${conf.text}</div>`;
  h += satzHTML(r, o);

    else { $("#after").insertAdjacentHTML("beforeend", `<div class="stack">${termHTML(r)}</div>`); bindNext(); }
  });

}
function termHTML(r){
  return `<div class="card term stack"><p class="label">Fachbegriff</p><p class="k">${r.term.k}</p><p>${r.term.v}</p></div>

}
function pqHTML(r){
  const order = shuffle([0,1,2]); S._pqOrder = order;

     <div class="opts">${order.map(k=>`<button type="button" class="opt" data-k="${k}"><span class="t" style="grid-column:1/-1;font-weight:400">${r.pq.a[k]}</span></button>`).join("")}</div><div id="pqfb"></div></div>`;

function bindPQ(r){
  $("#pq").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k, right = k===0;
    $("#pq").querySelectorAll(".opt").forEach(x=>{ x.disabled=true; x.classList.add("locked"); if(+x.dataset.k===0) x.classList.add("chosen"); });
    S.pq[r.id]=right; if(right) S.fach+=10; else { b.classList.add("wrongpick"); addFehler({q:r.pq.q, a:r.pq.a, e:r.pq.e}); }
    $("#pqfb").innerHTML = `<div class="fb ${right?"ok":"no"}"><b>${right?"Richtig – +10 Fachpunkte.":"Nicht ganz."}</b> ${right?"":"Richtig ist: „"+r.pq.a[0]+"“ "}${r.pq.e}</div>`;
    const t=document.createElement("div"); t.className="stack"; t.innerHTML=termHTML(r); $("#after").appendChild(t); bindNext(); updBar(`Kapitel ${S.i+1}/10 · noch ${r.days} Tage`);
  });
}
function bindNext(){ $("#bNext").onclick = nextStep; }
function nextStep(){
  const r = ROUNDS[S.i];
  if (r.calc && !S.calc.plan) return renderPlanCalc();
  const m = Object.entries(MINIS).find(([k,v])=>v.after===r.id);
  if (m && !S.mini[m[0]]) return renderMini(m[0]);
  if (TEAM_AFTER.includes(r.id) && S.tscene[r.id]===undefined) return renderTeam(r.id);
  if (S.i < ROUNDS.length-1){ S.i++; renderRound(); }
  else if (!S.revDone) renderRevanche();
  else renderAktionstag();
}

// ---------- Rechnen im Werbeplan (Kapitel 4) ----------

  S.view="calc"; Music.phase(false); sheetWords=["Reichweite","Kontakte","Kosten für 1.000 Kontakte","Verbreitungskosten"];

  updBar(`Kapitel 4 · Rechen-Stopp`);
  let body;
  if (S.mode==="pro") body = `<div class="field calc"><label for="iCalc" class="label">Verbreitungskosten in €</label><input id="iCalc" inputmode="decimal" autocomplete="off"></div><button class="btn" id="bCheck" type="button">Prüfen</button>`;
  else { const wrong=[R*pr, R*n*pr*1000/10]; const ch=shuffle([right,...wrong]); body = `<div class="opts">${ch.map(v=>`<button type="button" class="opt" data-v="${v}"><span class="t">${eur(v,2)}</span></button>`).join("")}</div>`; }
  screen.innerHTML = `<div class="row"><span class="tag">M 4 · Werbeplan rechnen</span></div>
   <div class="card stack"><h2>Was kostet die Zeitungsanzeige?</h2>
   <p>Frau Hansen plant zusätzlich eine Anzeige. Sie erreicht <b>${R} Tsd.</b> Leser und erscheint <b>${n}-mal</b>. 1.000 Kontakte kosten <b>${eur(pr,2)}</b>.</p>
   <p class="small muted">Kontakte = Reichweite × Anzahl · Verbreitungskosten = Kontakte (in Tsd.) × Preis für 1.000 Kontakte</p></div>
   ${body}<div id="cfb" class="stack"></div>`;
  const done = ok => { S.calc.plan = ok?"ok":"no"; if(ok) S.fach+=20; updBar("Kapitel 4 · Rechen-Stopp");

  if (S.mode==="pro") $("#bCheck").onclick=()=>{ const v=parseFloat(($("#iCalc").value||"").replace(/\./g,"").replace(",",".")); if(isNaN(v)){ toast("Bitte eine Zahl eingeben."); return; } $("#bCheck").disabled=true; $("#iCalc").disabled=true; done(Math.abs(v-right)<0.011); };
  else screen.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ screen.querySelectorAll(".opt").forEach(x=>{x.disabled=true; if(+x.dataset.v===right) x.classList.add("chosen");}); if(+b.dataset.v!==right) b.classList.add("wrongpick"); done(+b.dataset.v===right); });

}

// ---------- Mini-Spiele ----------
function renderMini(key){
  const M = MINIS[key], n = MODES[S.mode].mini, T = MODES[S.mode].timer;
  S.view="mini"; sheetWords = Object.values(M.cats).map(c=>c.replace(/&shy;/g,""));
  const items = shuffle(S.miniItems[key].slice(0,n)); let idx=0, right=0, left=T, tick=null, over=false;
  updBar(`Mini-Spiel · ${M.title}`);
  screen.innerHTML = `<div class="row"><span class="tag">${M.mod} · Mini-Spiel</span>${T?`<span class="tag timer" id="tm">${T} s</span>`:""}</div>
    <div class="card stack"><h2>${M.title}</h2><p>${M.intro}</p><p class="small muted">${n} Zettel · je richtig 5 Fachpunkte${T?" · Die Uhr läuft!":""}</p></div>
    <button class="btn hot" id="bStart" type="button">Mini-Spiel starten</button><div id="mg" class="stack"></div>`;
  const finish = () => { clearInterval(tick); Music.phase(false); S.mini[key]={right, n}; S.fach += right*5; updBar(`Mini-Spiel · ${M.title}`);
    $("#mg").innerHTML = `<div class="card stack"><h3>${over?"Zeit um! ":""}${right} von ${n} richtig</h3><p>+${right*5} Fachpunkte.</p></div><button class="btn hot" id="bNext" type="button">Weiter</button>`; bindNext(); };
  const show = () => {
    if (idx>=items.length || over) return finish();
    const [t,c] = items[idx];
    Music.phase(true, Math.min(1, idx/items.length + (T? (1-left/T)*0.5 : 0)));
    $("#mg").innerHTML = `<div class="prog"><i style="width:${idx/items.length*100}%"></i></div><p class="item">${t}</p>
      <div class="cats">${Object.entries(M.cats).map(([ck,cl])=>`<button type="button" class="cat" data-c="${ck}">${cl}</button>`).join("")}</div><div id="mfb"></div>`;
    $("#mg").querySelectorAll(".cat").forEach(b=>b.onclick=()=>{
      const ok = b.dataset.c===c; if(ok) right++; else { const lab=x=>M.cats[x].replace(/&shy;/g,""); const oth=shuffle(Object.keys(M.cats).filter(x=>x!==c)).slice(0,2); addFehler({q:`Wohin gehört: „${t}“?`, a:[lab(c), ...oth.map(lab)], e:M.why[c]}); }
      $("#mg").querySelectorAll(".cat").forEach(x=>{ x.disabled=true; if(x.dataset.c===c) x.classList.add("right"); else if(x===b) x.classList.add("wrong"); });
      $("#mfb").innerHTML = `<div class="fb ${ok?"ok":"no"}"><b>${ok?"Richtig!":"Falsch – richtig ist: "+M.cats[c].replace(/&shy;/g,"")+"."}</b> ${M.why[c]}</div><button class="btn" id="bMn" type="button" style="margin-top:10px">${idx<items.length-1?"Nächster Zettel":"Auswerten"}</button>`;
      $("#bMn").onclick = ()=>{ idx++; show(); };
    });
  };
  $("#bStart").onclick = ()=>{ $("#bStart").hidden=true;
    if (T) tick = setInterval(()=>{ left--; const tm=$("#tm"); if(tm) tm.textContent = left+" s"; if(left<=0){ over=true; clearInterval(tick); finish(); } }, 1000);
    show(); };
  window.scrollTo({top:0});
}

// ---------- Aktionstag ----------
function computeUmsatz(){
  const mult=[0.1,0.6,1.4,2.2]; let u=0, spent=0, fsum=0;
  for(const r of ROUNDS){ const o=optOf(r.id,S.pick[r.id]); const f=finalFit(r,o); u += f*130 + o.cost*mult[f]; spent += o.cost; fsum += f; }
  let factor=1; for(const e of S.events) factor *= e.res.f;
  u = Math.round(u*factor/10)*10;
  S.umsatz=u; S.spent=spent; S.avgFit=fsum/ROUNDS.length;
  S.kunden = Math.max(1, Math.round(u / SHOPS[S.shop].bon));
}
function renderAktionstag(){
  S.view="tag"; sheetWords=["Aktionstag","Kundenpromotion","Werbeerfolg","Frequenz","Umsatz"];
  const ev = S.evIds.slice(0, MODES[S.mode].events).map(id=>EVENTS.find(e=>e.id===id));
  S.events = ev.map(e=>({id:e.id, t:e.t, d:e.d, res:e.eff(S)}));
  computeUmsatz();
  updBar("Der Aktionstag");
  drawScene({walkers: reduced()?0:Math.min(14, 4+Math.round(S.avgFit*3))});
  Music.phase(true, 0.7);
  screen.innerHTML = `<div class="card story"><div class="avatar">${speakerSVG("chef")}</div><div><p class="who">Frau Hansen, Inhaberin</p><p>„Heute ist es so weit. Die Türen gehen auf – jetzt zeigt sich, ob eure Werbung wirkt!“</p></div></div>
   ${S.events.map(e=>`<div class="card event stack"><p class="label">Zufall am Aktionstag</p><h3>${e.t}</h3><p>${e.d}</p><p class="fb ${e.res.f>=1.1?"ok":e.res.f<1?"no":""}" style="${e.res.f>=1.1||e.res.f<1?"":"background:var(--surface2)"}"><b>${e.res.f>1?"+":""}${Math.round((e.res.f-1)*100)} % Umsatz.</b> ${e.res.x}</p></div>`).join("")}
   <div class="counter"><div><p class="label">Neue Kunden</p><p class="v" id="k1">0</p></div><div><p class="label">Umsatz&shy;zuwachs</p><p class="v" id="k2">0 €</p></div><div><p class="label">Werbekosten</p><p class="v" id="k3">0 €</p></div></div>
   <div id="kundeBox" class="stack"></div>
   <button class="btn hot" id="bNext" type="button" disabled>Weiter zum Zahlenabend</button>`;
  const dur = reduced()? 0 : 3200, t0 = performance.now();
  const step = now => { const q = dur? Math.min(1,(now-t0)/dur) : 1, e = 1-Math.pow(1-q,3);
    $("#k1").textContent = num(Math.round(S.kunden*e)); $("#k2").textContent = eur(Math.round(S.umsatz*e/10)*10); $("#k3").textContent = eur(Math.round(S.spent*e));
    if(q<1) requestAnimationFrame(step); else { Music.phase(false); if(!S._kShown){ S._kShown=true; showKunde(()=>{ $("#bNext").disabled=false; }); } } };
  requestAnimationFrame(step);
  $("#bNext").onclick = renderZahlen;
  window.scrollTo({top:0});
}

// ---------- Zahlenabend (Werbeerfolgskontrolle, M 5) ----------
function renderZahlen(){
  S.view="zahlen"; Music.phase(false); sheetWords=["Werbeerfolgskontrolle","wirtschaftlich","nicht wirtschaftlich","Erfolg der Werbung","Werberendite","Umsatzzuwachs","Werbekosten","Kassenbon","Warenwirtschaftssystem"];

  const E = S.E; const pct = Math.max(10, Math.min(40, 10 + 5*Math.round(S.avgFit*2))); const K = E*pct/100;
  const R = Math.round(S.umsatz*100/S.spent);
  S.erfolg = {E,K,pct}; S.rendite = R;
  const tasks = [
    {key:"erfolg", h:"Rechnung 1: Erfolg der Werbung", p:`Zum Aktionstag habt ihr <b>${E} Stammkunden</b> persönlich eingeladen. <b>${K}</b> von ihnen haben gekauft.`, f:"Erfolg der Werbung = Zahl der Käufer × 100 ÷ Zahl der eingeladenen Kunden",
     right:pct, unit:"%", wrong:[Math.round(E*100/K), Math.round(K/E*100)/100], steps:`<ol class="steps"><li>${K} × 100 = ${num(K*100)}</li><li>${num(K*100)} ÷ ${E} = <b>${pct} %</b></li></ol><p>Der Erfolg der Werbung beträgt ${pct} %. Das ist eine nicht wirtschaftliche Werbeerfolgskontrolle: Sie misst, wie die Werbung bei den Eingeladenen angekommen ist.</p>`},
    {key:"rendite", h:"Rechnung 2: Werberendite", p:`Die Werbung hat <b>${eur(S.spent)}</b> gekostet. Der Umsatz ist durch die Aktion um <b>${eur(S.umsatz)}</b> gestiegen.`, f:"Werberendite = Umsatzzuwachs × 100 ÷ Werbekosten",
     right:R, unit:"%", wrong:[Math.round(S.spent*100/S.umsatz), Math.round(S.umsatz/S.spent*100)/100], steps:`<ol class="steps"><li>${num(S.umsatz)} × 100 = ${num(S.umsatz*100)}</li><li>${num(S.umsatz*100)} ÷ ${num(S.spent)} = <b>${num(R)} %</b> (gerundet)</li></ol><p>Die Werberendite beträgt rund ${num(R)} %. ${R>100?"Der Umsatzzuwachs ist größer als die Werbekosten.":"Der Umsatzzuwachs ist kleiner als die Werbekosten."}</p>`}
  ];

  const zw = $("#zw");

    let body;
    if (S.mode==="pro") body = `<div class="field calc"><label class="label" for="i_${t.key}">Ergebnis in %, auf ganze Zahl gerundet</label><input id="i_${t.key}" inputmode="decimal" autocomplete="off"></div><button class="btn" type="button" id="c_${t.key}">Prüfen</button>`;
    else body = `<div class="opts">${shuffle(uniq(t.right,t.wrong)).map(v=>`<button type="button" class="opt" data-v="${v}"><span class="t">${num(v, v%1?2:0)} %</span></button>`).join("")}</div>`;
    box.innerHTML = `<div class="card stack"><h2>${t.h}</h2><p>${t.p}</p><p class="small muted">${t.f}</p></div>${body}<div id="f_${t.key}" class="stack"></div>`;
    const done = ok => { S.calc[t.key]=ok?"ok":"no"; if(ok) S.fach+=20; updBar("Der Zahlenabend");
      $("#f_"+t.key).innerHTML = `<div class="fb ${ok?"ok":"no"}"><b>${ok?"Richtig – +20 Fachpunkte.":"Leider falsch."}</b> So geht’s:${t.steps}</div><button class="btn hot" type="button" id="n_${t.key}">Weiter</button>`;

    else box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ box.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; if(+x.dataset.v===t.right) x.classList.add("chosen"); }); if(+b.dataset.v!==t.right) b.classList.add("wrongpick"); done(+b.dataset.v===t.right); });

    box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const x=a[+b.dataset.k]; box.querySelectorAll(".opt").forEach(y=>{ y.disabled=true; if(a[+y.dataset.k].r) y.classList.add("chosen"); });
      if(!x.r) b.classList.add("wrongpick"); S.calc.wirt = x.r?"ok":"no"; if(x.r) S.fach+=10; updBar("Der Zahlenabend");

const NS = "cdh1/";
function rnd(n){const a="abcdefghijkmnpqrstuvwxyz23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s;}
function codeGen(){const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(5));for(const x of r)s+=a[x%a.length];return s;}
class Net{
  constructor(onMsg,onStatus){
    this.cid="p"+rnd(10);this.seen=new Map();this.onMsg=onMsg;
    const st=()=>onStatus(this.count());
    try{ this.links=LOCAL?[new LocalLink(this.cid,(t,p,r)=>this.recv(t,p,r),st)]:BROKERS.map(u=>new MqttLink(u,this.cid,(t,p,r)=>this.recv(t,p,r),st)); }catch(e){ this.links=[]; }
  }
  count(){return {up:this.links.filter(l=>l.up).length,all:this.links.length};}
  recv(t,p,r){
    if(p&&typeof p==="object"&&p.mid){const now=Date.now();if(this.seen.has(p.mid))return;this.seen.set(p.mid,now);
      if(this.seen.size>3000){for(const [k,v] of this.seen){if(now-v>600000)this.seen.delete(k);}}}
    this.onMsg(t,p,r);
  }
  sub(t){this.links.forEach(l=>l.subscribe(NS+t));}
  pub(t,obj,retain){obj.mid=rnd(12);let ok=false;this.links.forEach(l=>{if(l.publish(NS+t,obj,retain))ok=true;});return ok;}
}
function cleanCode(s){ return String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8); }

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function prepareGame(keepPersona){

  S.view="team"; Music.phase(false); sheetWords = ["Teamarbeit","Teamleitung","Zielvereinbarung","Protokoll","Gesprächsregeln","Stimmungsbild","Feedback"];
  updBar(`Teampause ${n+1}/3`);
  const order = shuffle([0,1,2]);
  screen.innerHTML = `<div class="row"><span class="tag">M 11 · Teamarbeit</span><span class="tag">Teampause ${n+1} von 3</span></div>
   <div class="card stack"><svg viewBox="0 0 200 60" style="width:100%;max-width:260px;height:auto" aria-hidden="true"><rect x="30" y="38" width="140" height="8" rx="3" fill="#7d3426"/>${[50,85,120,155].map((x,k)=>`<circle cx="${x}" cy="22" r="10" fill="${["#e7b48c","#c99467","#f1c7a2","#d6a57c"][k]}"/><rect x="${x-10}" y="32" width="20" height="8" rx="3" fill="${["#d94f2b","#2f8f6d","#16426e","#f1b93b"][k]}"/>`).join("")}</svg>
   <p class="label">Teampause</p><h2>${sc.q}</h2></div>
   <div class="opts">${order.map(k=>`<button type="button" class="opt" data-k="${k}"><span class="t" style="grid-column:1/-1;font-weight:400">${sc.a[k]}</span></button>`).join("")}</div><div id="tfb" class="stack"></div>`;
  screen.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const ok = +b.dataset.k===0;
    screen.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; x.classList.add("locked"); if(+x.dataset.k===0) x.classList.add("chosen"); });
    if (ok) S.fach += 10; else { b.classList.add("wrongpick"); addFehler({q:sc.q, a:sc.a, e:sc.e}); }
    S.tscene[rid] = ok; updBar(`Teampause ${n+1}/3`);
    $("#tfb").innerHTML = `<div class="fb ${ok?"ok":"no"}"><b>${ok?"Richtig – +10 Fachpunkte.":"Nicht ganz."}</b> ${sc.e}</div><button class="btn hot" id="bNext" type="button">Weiter</button>`;
    bindNext();
  });
  window.scrollTo({top:0});
}

// ---------- Kundenszene am Aktionstag ----------
function showKunde(onDone){
  const K = KUNDEN[S.kundeIdx], P = PERSONAS[S.persona], order = shuffle([0,1,2]);
  const box = $("#kundeBox"); if(!box){ onDone(); return; }
  box.innerHTML = `<div class="card stack"><p class="label">Kundin oder Kunde fragt · wörtliche Rede</p>
    <div class="react mood-2">${faceSVG(S.persona,2)}<div><p class="label">${P.name}</p><p class="bubble">„${esc(K.q)}“</p></div></div>
    <h3>Was antwortet ihr?</h3>
    <div class="opts">${order.map(k=>`<button type="button" class="opt" data-k="${k}"><span class="t" style="grid-column:1/-1;font-weight:400">${K.a[k]}</span></button>`).join("")}</div><div id="kfb"></div></div>`;
  box.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const k = +b.dataset.k, ok = k===0;
    box.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; x.classList.add("locked"); if(+x.dataset.k===0) x.classList.add("chosen"); });
    if (ok) S.fach += 10; else { b.classList.add("wrongpick"); addFehler({q:`${P.name.split(",")[0]} fragt: „${K.q}“ Was antwortet ihr?`, a:K.a, e:"Zum Kunden: freundlich, einfach, mit Nutzen. Fachsprache gehört in die Prüfung."}); }
    S.kundeOk = ok; updBar("Der Aktionstag");
    const msg = ok ? "<b>Perfekt – +10 Fachpunkte.</b> Freundlich, einfach und mit Nutzen für den Kunden."
      : k===1 ? "<b>Inhaltlich richtig – aber das ist Prüfungssprache.</b> So redet niemand mit Kunden. Zum Kunden sprecht ihr einfach und freundlich."
      : "<b>Das geht nicht.</b> Die Antwort ist unfreundlich oder fachlich falsch.";
    $("#kfb").innerHTML = `<div class="fb ${ok?"ok":"no"}">${msg}</div>`;
    onDone();
  });
}

// ---------- Abzeichen, Duell, Activity ----------
function resultExtras(sat){
  const R = S.rendite, KR = kaltRendite(), win = R > KR;
  if (!S.saved){
    S.saved = true; saveFehler();
    const have = new Set(store.get("cdh_badges")||[]), fl = new Set(store.get("cdh_fluester")||[]);
    if (sat >= 80) fl.add(S.persona);
    const picked = ROUNDS.map(r=>optOf(r.id,S.pick[r.id]));
    const earn = [];
    if (!picked.some(o=>o.bad) && !hasFl("uwg")) earn.push("sauber");
    if (R >= 300) earn.push("spar");
    if (win) earn.push("kalt");
    if (["plan","erfolg","rendite"].every(k=>S.calc[k]==="ok")) earn.push("rechen");
    if (ROUNDS.every(r=>S.satz[r.id]===true)) earn.push("satz");
    if (TEAM_AFTER.every(r=>S.tscene[r]===true)) earn.push("team");
    if (S.kundeOk) earn.push("kunde");
    if (S.rev && S.rev.n>0 && S.rev.right===S.rev.n) earn.push("revanche");
    if (fl.size >= Object.keys(PERSONAS).length) earn.push("fluester");
    S.newBadges = earn.filter(b=>!have.has(b)); S.gameBadges = earn;
    earn.forEach(b=>have.add(b)); store.set("cdh_badges",[...have]); store.set("cdh_fluester",[...fl]);
    S.allBadges = have; S.flCount = fl.size;
  }
  const max = Math.max(R, KR, 100);
  const duel = `<div class="card stack ${win?"":"event"}"><p class="label">Das Duell</p><h2>${win?"Ihr schlagt den MEGAMARKT!":"Kalt liegt diesmal vorn."}</h2>
    <div class="duel"><span>${esc(S.laden)}</span><div class="meter"><i style="width:${R/max*100}%;background:var(--hafen)"></i></div><b>${num(R)} %</b>
    <span>MEGAMARKT</span><div class="meter"><i style="width:${KR/max*100}%;background:var(--bad)"></i></div><b>${num(KR)} %</b></div>
    <p class="small muted">Werberendite im Vergleich. Kalts Werte hängen davon ab, wie gut ihr auf seine Konter reagiert habt.</p></div>`;
  const badges = `<div class="card stack"><p class="label">Abzeichen</p><h3>${S.newBadges.length? "Neu freigeschaltet: "+S.newBadges.map(id=>BADGES.find(b=>b.id===id).n).join(", ") : "Eure Sammlung"}</h3>
    <div class="badges">${BADGES.map(b=>{ const on = S.allBadges.has(b.id), nw = S.newBadges.includes(b.id);
      return `<div class="badge ${on?"on":""} ${nw?"new":""}"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="17" fill="${on?"#f1b93b":"none"}" stroke="${on?"#9a6400":"currentColor"}" stroke-width="2" ${on?"":'stroke-dasharray="3 3" opacity=".5"'}/>${on?'<path d="M13 20 l5 5 l9 -11" fill="none" stroke="#2b1d00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>':""}</svg><div><b>${b.n}${b.id==="fluester"?` (${S.flCount}/7)`:""}</b><p class="small muted">${b.d}</p></div></div>`; }).join("")}</div>
    <p class="small muted">Abzeichen werden nur auf diesem Gerät gesammelt.</p></div>`;
  return duel + badges;
}
function renderActivity(){
  S.view="activity"; Music.phase(false);
  const words = shuffle([...new Set(ROUNDS.flatMap(r=>r.words))]).slice(0,3);
  let i=0, got=0, tick=null;
  updBar("Activity-Runde");
  const show = () => {
    clearInterval(tick);
    if (i>=words.length){ screen.innerHTML = `<div class="card stack"><h2>${got} von ${words.length} erraten</h2><p>Gut gemacht! Zurück zur Auswertung.</p></div><button class="btn hot" id="bBack" type="button">Zur Auswertung</button>`; $("#bBack").onclick = renderResult; return; }
    let left = 60;
    screen.innerHTML = `<div class="card stack"><p class="label">Activity · Karte ${i+1} von ${words.length}</p><p class="small muted">Eine Person aus dem Team stellt den Begriff vor der Klasse dar. Die Klasse rät.</p></div>
      <div class="actcard"><p class="label" style="color:inherit">${ACTIVITY_TASKS[i%3]}</p><p class="w">${esc(words[i])}</p><p class="timer" id="atm">60 s</p></div>
      <div class="row"><button class="btn" id="bGot" type="button" style="flex:1">Erraten!</button><button class="btn alt" id="bSkip" type="button" style="flex:1">Weiter</button></div>`;
    tick = setInterval(()=>{ left--; const t=$("#atm"); if(t) t.textContent = left>0 ? left+" s" : "Zeit um!"; if(left<=0) clearInterval(tick); }, 1000);
    $("#bGot").onclick = ()=>{ got++; i++; show(); };
    $("#bSkip").onclick = ()=>{ i++; show(); };
  };
  show(); window.scrollTo({top:0});
}

// ---------- Live-Rangliste ----------
let teamNet = null, lastPing = 0, pingTimer = null;
function livePing(force){
  if (!S || !S.code) return;
  if (!teamNet){ teamNet = new Net(()=>{}, ()=>{}); S.cid = S.cid || rnd(8); }
  if (!S.cid) S.cid = rnd(8);
  const now = Date.now(); if (!force && now-lastPing < 1500) return; lastPing = now;
  const kap = S.view==="round" ? `Kapitel ${S.i+1}` : S.view==="result" ? "fertig" : S.view==="tag" ? "Aktionstag" : S.view==="zahlen" ? "Zahlenabend" : `Kapitel ${S.i+1}`;
  teamNet.pub("k/"+S.code+"/in", {cid:S.cid, team:clip(S.team,24), laden:clip(S.laden,22), mode:S.mode, persona:PERSONAS[S.persona].name, kap, prog:S.done?10:S.i, pts:points().total, rend:S.done?S.rendite:null, kalt:S.done?kaltRendite():null, done:!!S.done});
  if (!pingTimer) pingTimer = setInterval(()=>livePing(true), 8000);
}
const clip = (s,n) => String(s||"").replace(/[\u0000-\u001f]/g," ").slice(0,n);
function drawQR(canvas,text){
  const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!text||typeof QRLib==="undefined"){ctx.fillStyle="#999";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText("Code eingeben",canvas.width/2,canvas.height/2);return;}
  const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();
  const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
  ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}
function joinUrl(code){
  const extra = (params.get("broker")?"&broker="+encodeURIComponent(params.get("broker")):"")+(LOCAL?"&bc=1":"");
  if (location.protocol.startsWith("http") && !/claude|anthropic/.test(location.hostname)) return location.origin+location.pathname+"?k="+code+extra;
  if (LOCAL) return location.href.split("?")[0]+"?k="+code+extra;
  return "";
}
function renderTafel(){
  S = null; Music.phase(false); $("#bar").hidden=true; $("#scene").hidden=true;
  document.body.classList.add("tafel");
  let code = store.get("cdh_tafel_code") || codeGen(); store.set("cdh_tafel_code", code);
  const teams = new Map(); let conn = {up:0};
  const net = new Net((t,p)=>{ if(!p||typeof p!=="object"||!p.cid) return; teams.set(String(p.cid).slice(0,12), Object.assign({}, p, {seen:Date.now()})); draw(); }, c=>{ conn=c; head(); });
  net.sub("k/"+code+"/in");
  const url = joinUrl(code);
  screen.innerHTML = `<div class="tafelhead"><div class="stack" style="gap:6px;min-width:0"><span class="kicker" style="color:var(--boje);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.8rem">Countdown Hafenstraße · Klassenduell</span><h1>Live-Rangliste</h1>
      <p>Klassencode: <b class="bigcode">${code}</b></p><p class="small muted">Alle Teams geben diesen Code beim Start ein oder scannen den QR-Code. Dann spielen alle dieselbe Ausgangslage: gleiche Branche, gleiche Zielgruppe, gleiche Situationen und Zufälle.</p>
      <p class="small" id="conn"></p><div class="row"><button class="btn alt" id="bNewCode" type="button" style="width:auto">Neuer Code</button><button class="btn alt" id="bTBack" type="button" style="width:auto">Zum Spiel</button></div></div>
      <canvas id="qrBig" width="220" height="220" style="border-radius:12px;max-width:100%"></canvas></div>
    <div class="card" style="overflow-x:auto"><table class="rank"><thead><tr><th>#</th><th>Team</th><th>Modus</th><th>Stand</th><th class="num">Punkte</th><th class="num">Werberendite</th><th>Duell</th></tr></thead><tbody id="rk"><tr><td colspan="7" class="muted">Noch keine Teams. Sobald ein Team mit dem Code spielt, erscheint es hier.</td></tr></tbody></table></div>`;
  drawQR($("#qrBig"), url);
  const head = () => { const c=$("#conn"); if(c) c.innerHTML = conn.up ? `<span class="dot on"></span> verbunden` : `<span class="dot"></span> keine Verbindung – die Live-Rangliste braucht die Fassung aus dem Ordner bzw. von GitHub Pages und Internet.`; };
  const draw = () => {
    const now = Date.now(); const arr = [...teams.values()].filter(t=>now-t.seen<20*60000);
    arr.sort((a,b)=> (b.done-a.done) || (b.pts-a.pts) || (b.prog-a.prog));
    const tb = $("#rk"); if(!tb) return;
    if (!arr.length) return;
    tb.innerHTML = arr.map((t,k)=>`<tr><td>${k+1}</td><td><b>${esc(clip(t.team,24))}</b><br><span class="small muted">${esc(clip(t.laden,22))}</span></td><td>${t.mode==="pro"?"Profi":"Anfänger"}</td>
      <td><div class="meter" style="min-width:80px"><i style="width:${Math.min(10,+t.prog||0)*10}%;background:var(--boje)"></i></div><span class="small">${esc(clip(t.kap,16))}</span></td>
      <td class="num"><b>${+t.pts||0}</b></td><td class="num">${t.rend!=null?num(+t.rend)+" %":"–"}</td><td>${t.done ? ((+t.rend > +t.kalt) ? "Kalt besiegt" : "Kalt vorn") : "–"}</td></tr>`).join("");
  };
  head();
  $("#bNewCode").onclick = ()=>{ store.set("cdh_tafel_code", codeGen()); location.reload(); };
  $("#bTBack").onclick = ()=>{ document.body.classList.remove("tafel"); renderStart(); };
}

// ---------- Start ----------
(function boot(){
  const m = store.get("cdh_music"); Music.on = m===true; updMusicBtn();
  const k = cleanCode(params.get("k")); if (k) prefs.code = k;
  if (params.get("tafel")==="1") renderTafel(); else renderStart();
})();

</script>
