<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stufe für Stufe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:wght@400;600;800&display=swap">
<style>
/* Layout: eine Spalte wie ein Gesprächsprotokoll; oben Statusleiste (Stimmung, Punkte, Stufe), darunter die Treppe mit Kundin und Sprechblase, dann die Aufgabenkarten */
:root{
  --bg:#eef0f5; --surface:#ffffff; --surface2:#f4f2f7; --ink:#1f1b2d; --muted:#5a5568; --line:#d6d2e0;
  --berry:#9e2457; --on-berry:#ffffff; --apricot:#f2a541; --on-apricot:#2b1a00; --teal:#16706a;
  --good:#1d7f47; --mid:#9a6400; --bad:#bf3626; --good-bg:#e1f3e8; --mid-bg:#fbf0d6; --bad-bg:#fbe3df;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131d; --surface:#1f1c2a; --surface2:#282435; --ink:#ece9f3; --muted:#aaa4ba; --line:#3a3549;
  --berry:#ec6f9f; --on-berry:#2a0715; --apricot:#f5b960; --on-apricot:#2b1a00; --teal:#4cc2b8;
  --good:#63d18f; --mid:#eebc4a; --bad:#f2846f; --good-bg:#173626; --mid-bg:#3a3017; --bad-bg:#40221d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131d; --surface:#1f1c2a; --surface2:#282435; --ink:#ece9f3; --muted:#aaa4ba; --line:#3a3549;
  --berry:#ec6f9f; --on-berry:#2a0715; --apricot:#f5b960; --on-apricot:#2b1a00; --teal:#4cc2b8;
  --good:#63d18f; --mid:#eebc4a; --bad:#f2846f; --good-bg:#173626; --mid-bg:#3a3017; --bad-bg:#40221d; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:22px 22px}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(2.4rem,8vw,3.8rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.45rem,4.6vw,1.95rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:1.15rem;font-weight:800}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--apricot);outline-offset:2px;border-radius:8px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:8px 16px;
  background:var(--surface);border-bottom:2px solid var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:6px}
.brand svg{width:26px;height:26px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);font-weight:800;font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.pts{background:var(--apricot);color:var(--on-apricot);border-color:transparent}
.bar .sp{flex:1}
.prog{display:flex;gap:4px;width:100%}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.done{background:var(--teal)}
.prog i.now{background:var(--berry)}

main{padding-top:18px;display:grid;gap:16px}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:18px;box-shadow:4px 4px 0 var(--ink);min-width:0}
.eyebrow{font-weight:800;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--berry)}
.lead{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:12px}
.small{font-size:.9rem;color:var(--muted)}

.btn{border:2px solid var(--ink);background:var(--berry);color:var(--on-berry);font-weight:800;font-size:1.05rem;padding:12px 20px;border-radius:12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.sun{background:var(--apricot);color:var(--on-apricot)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.wide{width:100%}
.linkbtn{background:none;border:none;color:var(--berry);font-weight:800;text-decoration:underline;cursor:pointer;padding:0}

input[type=text],textarea{width:100%;border:2px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:1.05rem}
textarea{min-height:92px;resize:vertical;line-height:1.45}
input[type=text]:focus,textarea:focus{border-color:var(--berry);outline:none}
label.fl{font-weight:800;font-size:.95rem;display:block;margin-bottom:4px}

/* Auswahlkarten */
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ch{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;cursor:pointer;text-align:left;display:grid;gap:4px;justify-items:start;min-width:0}
.ch svg{width:54px;height:54px}
.ch b{font-family:var(--display);font-size:1.1rem}
.ch .small{hyphens:auto;overflow-wrap:anywhere}
.choice.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice.three .ch{padding:10px}
.ch.sel{border-color:var(--berry);background:var(--surface);box-shadow:0 0 0 3px var(--berry) inset}

/* Stufenwahl */
.steps8{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.st{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;min-width:0}
.st .n{grid-row:span 2;width:34px;height:34px;border-radius:9px;background:var(--surface);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.st .nm{font-weight:800;line-height:1.2}
.st .md{font-size:.82rem;color:var(--muted);grid-column:2}
.st .bx{grid-row:span 2;grid-column:3;width:24px;height:24px;border-radius:6px;border:2px solid var(--ink);display:grid;place-items:center;background:var(--surface)}
.st.on{border-color:var(--berry);background:var(--surface)}
.st.on .n{background:var(--berry);color:var(--on-berry)}
.st.on .bx{background:var(--berry)}
.st.on .bx::after{content:"";width:6px;height:11px;border:solid var(--on-berry);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.wr{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--apricot);color:var(--on-apricot);padding:0 6px;border-radius:5px;margin-left:4px;vertical-align:1px}

/* Prüfungsbalken */
.heat{display:grid;gap:6px}
.hr{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3.4em;gap:8px;align-items:center;font-size:.92rem}
.hr .tr{height:14px;border-radius:7px;background:var(--surface2);border:1.5px solid var(--line);overflow:hidden}
.hr .fi{height:100%;background:var(--berry);border-radius:6px}
.hr .v{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.hr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Szene */
.scene{border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;background:#dfe7f3;display:grid;grid-template-columns:minmax(0,1fr);position:relative}
.scene svg{display:block;width:100%;height:auto}
.talk{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.talk .face{width:96px;height:96px;border-radius:50%;border:2px solid var(--ink);background:#f7e8d7;overflow:hidden}
.talk .face svg{width:100%;height:100%;display:block}
.bubble{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:10px 14px;font-weight:600;min-width:0}
.bubble::before{content:"";position:absolute;left:-11px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--ink);border-left:0;width:0;height:0;border-right-width:11px}
.bubble::after{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:var(--surface);border-left:0;border-right-width:8px}
.bubble .who{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mood{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:800}
.mood .tr{flex:1;height:12px;border-radius:6px;background:var(--surface2);border:1.5px solid var(--line);overflow:hidden}
.mood .fi{height:100%;transition:width .5s ease}

/* Optionen */
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:3px;min-width:0}
.opt:hover:not([disabled]){border-color:var(--berry)}
.opt.sel{border-color:var(--berry);background:var(--surface);box-shadow:0 0 0 3px var(--berry) inset}
.opt[disabled]{cursor:default}
.opt .t{font-weight:800;font-size:1.05rem;line-height:1.25}
.opt .d{font-size:.93rem;color:var(--muted)}
.opt.r3{border-color:var(--good);background:var(--good-bg)}
.opt.r1,.opt.r2{border-color:var(--mid);background:var(--mid-bg)}
.opt.r0{border-color:var(--bad);background:var(--bad-bg)}

.term{border:2px dashed var(--teal);border-radius:12px;padding:12px 14px;display:grid;gap:4px;background:var(--surface2)}
.term b{font-family:var(--display);font-size:1.15rem;color:var(--teal)}
.fb{border-radius:12px;padding:10px 14px;font-weight:600}
.fb.good{background:var(--good-bg);color:var(--ink);border:2px solid var(--good)}
.fb.mid{background:var(--mid-bg);color:var(--ink);border:2px solid var(--mid)}
.fb.bad{background:var(--bad-bg);color:var(--ink);border:2px solid var(--bad)}
.hint{border-left:4px solid var(--apricot);padding:6px 12px;background:var(--surface2);border-radius:0 10px 10px 0;font-size:.95rem}

/* Satzbaukasten */
.sentence{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.35;background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:3.2em}
.sentence .gap{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--line);margin:0 2px}
.sentence .w{border-bottom:3px solid var(--berry)}
.sentence .w.ok{border-color:var(--good)}
.sentence .w.no{border-color:var(--bad);text-decoration:line-through;text-decoration-color:var(--bad)}
.slot{display:grid;gap:6px}
.slot .lbl{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;text-align:left;max-width:100%}
.chip.sel{border-color:var(--berry);box-shadow:0 0 0 2px var(--berry) inset}
.chip.ok{border-color:var(--good);background:var(--good-bg)}
.chip.no{border-color:var(--bad);background:var(--bad-bg)}
.chip[disabled]{cursor:default}
.ws{display:flex;flex-wrap:wrap;gap:6px}
.ws span{font-size:.85rem;background:var(--surface2);border:1.5px solid var(--line);border-radius:6px;padding:1px 8px}

.checks{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:.95rem}
.checks li::before{content:"";flex:none;width:18px;height:18px;margin-top:3px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.checks li.ok::before{background:var(--good);border-color:var(--good)}
.checks li.no::before{background:var(--bad);border-color:var(--bad)}
.muster{border:2px solid var(--teal);border-radius:12px;padding:12px 14px;background:var(--surface2);display:grid;gap:6px}
.muster .src{font-size:.8rem;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.05em}
.quote{font-style:italic}

/* Persona-Karte */
.flip{perspective:900px}
.flip .inner{transition:transform .6s;transform-style:preserve-3d;position:relative;min-height:290px}
.flip.turned .inner{transform:rotateY(180deg)}
.flip .side{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--ink);border-radius:var(--r);background:var(--surface);box-shadow:4px 4px 0 var(--ink);padding:18px;display:grid;place-items:center}
.flip .back{transform:rotateY(180deg);place-items:stretch}
.flip .front{background:var(--berry);color:var(--on-berry)}
.pcard{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start}
.pcard .face{width:110px;height:110px;border-radius:50%;border:2px solid var(--ink);overflow:hidden;background:#f7e8d7}
.pcard .face svg{width:100%;height:100%;display:block}
dl.facts{margin:0;display:grid;gap:4px}
dl.facts dt{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
dl.facts dd{margin:0 0 4px}

/* Reihenfolge-Spiel */
.ladder{display:grid;gap:6px}
.ladder .pl{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
.ladder .pl .n{width:34px;height:30px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;background:var(--surface)}
.ladder .pl .c{border:2px dashed var(--line);border-radius:10px;padding:4px 10px;min-height:34px;font-weight:700}
.ladder .pl .c.f{border-style:solid;border-color:var(--berry)}
.ladder .pl .c.ok{border-color:var(--good);background:var(--good-bg)}
.ladder .pl .c.no{border-color:var(--bad);background:var(--bad-bg)}

/* Quiz */
.qbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.qb{border:2px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 4px;cursor:pointer;display:grid;justify-items:center;font-size:.78rem;line-height:1.15;font-weight:700;min-width:0}
.qb .n{font-family:var(--display);font-weight:800;font-size:1.2rem}
.qb.ok{border-color:var(--good);background:var(--good-bg)}
.qb.no{border-color:var(--bad);background:var(--bad-bg)}

/* Auswertung */
.score{background:var(--berry);color:var(--on-berry);border:2px solid var(--ink);border-radius:var(--r);box-shadow:4px 4px 0 var(--ink);padding:18px;display:grid;gap:10px;text-align:center;justify-items:center}
.score .big{font-family:var(--display);font-weight:800;font-size:clamp(3rem,13vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px}
.stars svg{width:42px;height:42px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.82rem;color:var(--muted);font-weight:700}
.rv{border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;background:var(--surface2)}
.rv .hd{display:flex;gap:10px;align-items:center}
.mk{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.mk.g{background:var(--good)} .mk.m{background:var(--mid)} .mk.b{background:var(--bad)}
:root[data-theme="dark"] .mk{color:#15131d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mk{color:#15131d}}
.said{font-family:var(--display);font-weight:600;border-left:4px solid var(--berry);padding-left:10px}
details summary{cursor:pointer;font-weight:800}
.tiny{font-size:.8rem;color:var(--muted)}


/* Modi */
.choice.two{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ch.mode svg{width:44px;height:44px}
.newc{font-size:.78rem;font-weight:800;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--teal)}
.dlg{display:grid;gap:8px}
.ln{border:2px solid var(--line);border-radius:14px;padding:8px 12px;text-align:left;background:var(--surface2);max-width:88%;cursor:pointer;display:grid;gap:2px;font-weight:600}
.ln .who{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ln.v{justify-self:start;border-color:var(--berry)}
.ln.k{justify-self:end;background:var(--surface)}
.ln[disabled]{cursor:default}
.ln.no{border-color:var(--bad);background:var(--bad-bg)}
.ln.hit{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 0 0 3px var(--bad) inset}
.ln.fixed{border-color:var(--good);background:var(--good-bg)}

@keyframes pop{0%{transform:scale(.85);opacity:.3}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){
  body{font-size:16px}
  .talk{grid-template-columns:72px 1fr}
  .talk .face{width:72px;height:72px}
  .pcard{grid-template-columns:80px 1fr}
  .pcard .face{width:80px;height:80px}
  .card{padding:14px}
  .qb{font-size:.7rem}
  .flip .inner{min-height:340px}
}
</style>

/* ===== Hilfsfunktionen ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => String(Math.round(n * 10) / 10).replace('.', ',');
function fill(str) {
  if (typeof str !== 'string') return str;
  for (let k = 0; k < 3; k++) str = str.replace(/\{(\w+)\}/g, (m, key) => {
    const sh = SHOPS[S.shop] || {}, pe = PERSONAS[S.per] || {};
    if (key in sh) return sh[key];
    if (key in pe) return pe[key];
    return m;
  });
  return str;
}
function PV(ph, key) { const v = S.var && S.var[ph.id]; return (v && v[key] !== undefined) ? v[key] : ph[key]; }
function pickTxt(obj) { if (!obj) return ''; return (obj[S.per] ?? obj[S.shop] ?? obj.all ?? ''); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

/* ===== Grafiken ===== */
function faceSVG(look, mood) {
  const L = look, sk = L.skin, hr = L.hair;
  const brow = mood === 'sad' ? 'M36 44 L50 40 M70 40 L84 44' : mood === 'happy' ? 'M36 40 Q43 35 50 39 M70 39 Q77 35 84 40' : 'M36 41 L50 41 M70 41 L84 41';
  const mouth = mood === 'happy' ? '<path d="M44 74 Q60 90 76 74 Q60 82 44 74Z" fill="#7a2230"/>' : mood === 'sad' ? '<path d="M46 82 Q60 70 74 82" fill="none" stroke="#5a2a20" stroke-width="3.5" stroke-linecap="round"/>' : '<path d="M48 78 Q60 82 72 78" fill="none" stroke="#5a2a20" stroke-width="3.5" stroke-linecap="round"/>';
  let hairBack = '', hairFront = '';
  if (L.style === 'bob') { hairBack = `<path d="M24 60 Q22 18 60 16 Q98 18 96 60 L96 84 Q86 90 80 84 L80 50 L40 50 L40 84 Q34 90 24 84Z" fill="${hr}"/>`; hairFront = `<path d="M32 46 Q40 22 66 22 Q90 26 88 48 Q70 34 52 40 Q40 44 32 46Z" fill="${hr}"/>`; }
  if (L.style === 'short') { hairFront = `<path d="M30 48 Q30 20 60 18 Q90 20 90 48 Q84 34 70 32 Q56 36 44 32 Q34 36 30 48Z" fill="${hr}"/>`; }
  if (L.style === 'tail') { hairBack = `<path d="M84 40 Q108 50 100 92 Q96 70 86 60Z" fill="${hr}"/>`; hairFront = `<path d="M30 52 Q28 18 62 18 Q92 20 90 50 Q78 30 58 32 Q40 34 30 52Z" fill="${hr}"/>`; }
  if (L.style === 'crop') { hairFront = `<path d="M32 44 Q34 20 60 19 Q86 20 88 44 Q74 30 60 30 Q46 30 32 44Z" fill="${hr}"/>`; }
  const beard = L.beard ? `<path d="M34 66 Q36 100 60 102 Q84 100 86 66 Q80 84 60 86 Q40 84 34 66Z" fill="${hr}" opacity=".9"/>` : '';
  const glasses = L.glasses ? `<g fill="none" stroke="#2a2a2a" stroke-width="3"><circle cx="45" cy="54" r="9"/><circle cx="75" cy="54" r="9"/><path d="M54 54 L66 54"/></g>` : '';
  const lines = L.grey ? `<path d="M40 66 Q44 68 46 66 M74 66 Q76 68 80 66" stroke="#b98a70" stroke-width="2" fill="none"/>` : '';
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><rect width="120" height="120" fill="#f7e8d7"/>${hairBack}
  <path d="M18 120 Q22 98 60 96 Q98 98 102 120Z" fill="${L.top}"/><rect x="52" y="84" width="16" height="16" fill="${sk}"/>
  <ellipse cx="60" cy="58" rx="28" ry="32" fill="${sk}"/><circle cx="32" cy="60" r="5" fill="${sk}"/><circle cx="88" cy="60" r="5" fill="${sk}"/>
  ${beard}${hairFront}<path d="${brow}" stroke="${hr === '#c9c4bd' ? '#8d877f' : hr}" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <circle cx="45" cy="54" r="3.6" fill="#231a14"/><circle cx="75" cy="54" r="3.6" fill="#231a14"/>${glasses}${lines}${mouth}</svg>`;
}

const LOGO = `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 27 H11 V21 H17 V15 H23 V9 H29 V27Z" fill="var(--berry)"/><path d="M4 10 Q4 4 11 4 H16 Q22 4 22 9 Q22 14 16 14 H12 L8 17 L9 14 Q4 14 4 10Z" fill="var(--apricot)" stroke="var(--ink)" stroke-width="1.5"/></svg>`;
function star(on) { return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="${on ? '#f2a541' : 'none'}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`; }

function sceneSVG() {
  const P = PERSONAS[S.per];
  const resCol = f => f >= 3 ? '#2e9a5c' : f >= 1 ? '#d39a1c' : '#d24b36';
  let g = `<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#cfd5e1"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b8bfce" stroke-width="2.5"/></pattern></defs>`;
  g += `<rect y="-24" width="640" height="216" fill="#dfe7f3"/><rect y="188" width="640" height="4" fill="#c3cbe0"/>`;
  g += `<g transform="translate(536 -18)"><rect width="98" height="24" rx="6" fill="#1f1b2d"/><text x="49" y="16" text-anchor="middle" font-size="10.5" font-weight="800" fill="#f2a541" font-family="Nunito Sans,system-ui,sans-serif">KAUF&#8209;ABSCHLUSS</text></g>`;
  const cur = (S.screen === 'play' || S.screen === 'event') ? S.list[S.i] : null;
  let figX = 30, figY = 188;
  PHASES.forEach((ph, i) => {
    const x = 6 + i * 78, top = 154 - i * 16, w = 78;
    const on = S.sel.has(ph.id), r = S.res[ph.id];
    let fill = on ? '#ffffff' : 'url(#hatch)';
    if (r && r.fit != null) fill = resCol(r.fit);
    const isCur = cur === ph.id;
    g += `<rect x="${x}" y="${top}" width="${w}" height="${188 - top}" fill="${fill}" stroke="${isCur ? '#f2a541' : '#1f1b2d'}" stroke-width="${isCur ? 4 : 2}"/>`;
    const txtCol = r && r.fit != null ? '#ffffff' : on ? '#1f1b2d' : '#6d7487';
    g += `<text x="${x + w / 2}" y="${top + 20}" text-anchor="middle" font-size="17" font-weight="800" fill="${txtCol}" font-family="Bricolage Grotesque,Trebuchet MS,sans-serif">${ph.id}</text>`;
    g += `<text x="${x + w / 2}" y="${top + 31}" text-anchor="middle" font-size="10" font-weight="700" fill="${txtCol}" font-family="Nunito Sans,system-ui,sans-serif">${ph.short}</text>`;
    if (isCur) { figX = x + w / 2; figY = top; }
  });
  if (S.screen === 'result' || S.screen === 'quiz') { const last = Math.max(...S.list); figX = 6 + (last - 1) * 78 + 39; figY = 154 - (last - 1) * 16; }
  if (S.screen === 'order' || S.screen === 'draw') { figX = 30; figY = 188; }
  const person = (x, y, col, head) => `<g transform="translate(${x} ${y})"><rect x="-8" y="-30" width="16" height="22" rx="7" fill="${col}" stroke="#1f1b2d" stroke-width="1.6"/><rect x="-7" y="-10" width="5" height="10" fill="#2a2a38"/><rect x="2" y="-10" width="5" height="10" fill="#2a2a38"/><circle cx="0" cy="-37" r="7.5" fill="${head}" stroke="#1f1b2d" stroke-width="1.6"/></g>`;
  g += person(figX - 14, figY, '#9e2457', '#e8b892');
  g += person(figX + 14, figY, P.look.top, P.look.skin);
  if (S.screen === 'result' && S.bought) g += `<g transform="translate(${figX + 26} ${figY - 20})"><rect width="16" height="16" rx="2" fill="#f2a541" stroke="#1f1b2d" stroke-width="1.6"/><path d="M4 4 Q8 -4 12 4" fill="none" stroke="#1f1b2d" stroke-width="1.6"/></g>`;
  return `<svg viewBox="0 -24 640 216" role="img" aria-label="Treppe mit acht Stufen des Verkaufsgesprächs">${g}</svg>`;
}

const S = { mode:null, screen:'start', team:'', level:null, shop:null, per:null, sel:new Set([1,2,3,4,5,6,7,8]), list:[], i:0, step:'decide', res:{}, mood:55, pts:0, max:0, evAt:-1, ev:null, evRes:null, order:null, quiz:null, bubble:'', face:'ok', known:false, bought:false, lastPer:null };

function moodCol() { return S.mood >= 65 ? 'var(--good)' : S.mood >= 40 ? 'var(--mid)' : 'var(--bad)'; }
function addMood(d) { S.mood = clamp(S.mood + d, 0, 100); }
function addPts(p, m) { S.pts += p; S.max += m; }

function renderBar() {
  const inGame = ['play','event','order','quiz','result'].includes(S.screen);
  let h = `<div class="brand">${LOGO}Stufe für Stufe</div><span class="sp"></span>`;
  const mb = modeBar(); if (mb !== null) { $('#bar').innerHTML = h + mb; return; }
  if (inGame) {
    h += `<span class="pill" title="Stimmung der Kundschaft">Stimmung ${Math.round(S.mood)}</span><span class="pill pts">${fmt(S.pts)} Punkte</span>`;
    const n = S.list.length;
    h += `<div class="prog">${S.list.map((id, k) => `<i class="${S.screen === 'result' || S.screen === 'quiz' || k < S.i ? 'done' : (k === S.i && S.screen === 'play') ? 'now' : ''}"></i>`).join('')}</div>`;
  }
  $('#bar').innerHTML = h;
}

function talk() {
  const P = PERSONAS[S.per];
  return `<div class="talk"><div class="face">${faceSVG(P.look, S.face)}</div><div class="bubble pop"><div class="who">${esc(P.name)}</div>${esc(fill(S.bubble))}</div></div>

}

function render() {
  renderBar();
  const app = $('#app');
  stopTimer();
  const f = { start:vStart, phases:vPhases, draw:vDraw, order:vOrder, play:vPlay, event:vEvent, quiz:vQuiz, result:vResult, fehler:vFehler, ansturm:vAnsturm, blitz:vBlitz, mres:vModeResult }[S.screen];
  app.innerHTML = f();
  bind();
  afterRender();
}

/* ===== Spielrunde ===== */
function curPh() { return PHASES.find(p => p.id === S.list[S.i]); }
function fitOf(ph, k) {

/* Basis: Satzbaukasten */

/* Profi: selbst formulieren */
function evalChecks(ph, texts) {
  const sh = SHOPS[S.shop], pe = PERSONAS[S.per];
  return PV(ph,'profi').checks.map(c => {
    const f = c.f == null ? 0 : c.f; const t = f === -1 ? texts.join(' ') : (texts[f] || '');
    let ok;
    if (c.re === 'KURZ') ok = new RegExp(sh.kurz, 'i').test(t);
    else if (c.re === 'ZTYP') ok = new RegExp(sh.zTyp.slice(0, 6), 'i').test(t);
    else if (c.re === 'NAME') ok = new RegExp(pe.name.split(' ').pop(), 'i').test(t);
    else if (c.re === 'BEFORE' || c.re === 'AFTER') {
      const m = t.match(/\d[\d.,]*\s*(€|euro|eur)?/i);
      if (!m) ok = false; else { const before = t.slice(0, m.index), after = t.slice(m.index + m[0].length); const wc = s => (s.match(/[A-Za-zÄÖÜäöüß]{2,}/g) || []).length; ok = c.re === 'BEFORE' ? wc(before) >= 4 : wc(after) >= 4; }
    } else ok = c.re.test(t);
    if (c.neg) ok = !ok;
    return { l: fill(c.l), ok, must: c.must };
  });
}

/* ===== Ablauf ===== */
function drawPersona(exclude) {
  const ids = Object.keys(PERSONAS).filter(id => id !== exclude);
  S.per = ids[Math.floor(Math.random() * ids.length)];
}
function startGame(keep) {
  S.list = [...S.sel].sort((a, b) => a - b);
  if (!keep || !S.var) { S.var = {}; S.list.forEach(id => { const pool = [{ vid: id + 'a' }].concat(VARIANTS[id] || []); const v = pickUnseen('gv' + id, pool, 1, x => x.vid)[0]; S.var[id] = v.vid.endsWith('a') ? null : v; }); }
  S.i = 0; S.step = 'decide'; S.res = {}; S.mood = 55; S.pts = 0; S.max = 0; S.ev = null; S.evRes = null; S.evOrder = null; S.bought = false; S.newRecord = false;
  S.evAt = S.list.length >= 2 ? Math.floor((S.list.length - 1) / 2) : -1;
  S.ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
  S.face = 'ok'; S.bubble = 'Guten Tag …';
  if (S.list.length >= 5) { S.order = { pool: shuffle(PHASES.map(p => p.id)), placed: [], checked: false }; S.screen = 'order'; S.bubble = 'Ich komme gleich rein – baut schon mal eure Treppe auf.'; }
  else S.screen = 'play';
  render(); window.scrollTo(0, 0);
}
function nextPhase() {
  if (S.i === S.evAt && !S.evRes) { S.screen = 'event'; S.face = 'ok'; S.bubble = '…'; render(); window.scrollTo(0, 0); return; }
  if (S.i + 1 < S.list.length) { S.i++; S.step = 'decide'; S.screen = 'play'; S.bubble = '…'; render(); window.scrollTo(0, 0); return; }
  startQuiz();
}
function startQuiz() {
  const items = pickUnseen('satz', QUIZ, 6, q => q.id);
  S.quiz = { items, k: 0, pick: null }; S.screen = 'quiz'; render(); window.scrollTo(0, 0);
}
function finish() {
  S.bought = S.sel.has(8) && S.mood >= 45 && S.res[8] && S.res[8].fit > 0;
  S.face = S.mood >= 60 ? 'happy' : S.mood >= 40 ? 'ok' : 'sad';
  S.bubble = S.sel.has(8) ? (S.bought ? 'Vielen Dank, ich komme gern wieder!' : 'Ich überlege es mir noch mal …') : 'Danke für die Beratung!';
  const pct = S.max ? Math.round(S.pts / S.max * 100) : 0;
  const rec = store('sfs-rekord') || {};
  if (pct > (rec[S.level] || 0)) { rec[S.level] = pct; store('sfs-rekord', rec); S.newRecord = true; }
  store('sfs-runden', (store('sfs-runden') || 0) + 1);
  S.screen = 'result'; render(); window.scrollTo(0, 0);
}

/* ===== Ereignisse ===== */
function bind() {
  const app = $('#app');
  app.onclick = e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset;
    if (modeClick(b, d)) return;
    if (d.lvl) { S.level = d.lvl; S.team = ($('#team') || {}).value || S.team; render(); return; }
    if (d.shop) { S.shop = d.shop; S.team = ($('#team') || {}).value || S.team; render(); return; }
    if (b.id === 'toPhases') { S.team = $('#team').value.trim(); S.screen = 'phases'; render(); window.scrollTo(0, 0); return; }
    if (d.ph) { const id = +d.ph; S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); render(); return; }
    if (d.pre) { S.sel = new Set(d.pre === 'all' ? [1,2,3,4,5,6,7,8] : d.pre === 'hits' ? [1,2,3,5,6,8] : []); render(); return; }
    if (b.id === 'back') { S.screen = 'start'; render(); return; }
    if (b.id === 'toDraw') { drawPersona(); S.turned = false; S.screen = 'draw'; render(); window.scrollTo(0, 0); return; }
    if (b.id === 'turn') { S.turned = true; $('#flip').classList.add('turned'); $('#go').disabled = false; return; }
    if (b.id === 'redraw') { drawPersona(S.per); S.turned = false; render(); return; }
    if (b.id === 'go') { startGame(); return; }
    /* Treppe */
    if (d.ord) { S.order.placed.push(+d.ord); render(); return; }
    if (b.id === 'orderReset') { S.order.placed = []; render(); return; }
    if (b.id === 'orderCheck') { const O = S.order; O.checked = true; O.right = O.placed.filter((id, k) => id === k + 1).length; O.p = Math.ceil(O.right / 2); addPts(O.p, 4); S.face = O.right >= 6 ? 'happy' : 'ok'; S.bubble = O.right === 8 ? 'Ihr kennt die Stufen – dann mal los!' : 'Gut, dann schauen wir mal, wie ihr Stufe für Stufe vorgeht.'; render(); return; }
    if (b.id === 'orderNext') { S.screen = 'play'; S.face = 'ok'; S.bubble = '…'; render(); window.scrollTo(0, 0); return; }
    /* Entscheidung */
    const ph = S.screen === 'play' ? curPh() : null;
    if (d.opt != null && ph) { S.res[ph.id] = { opt: +d.opt }; render(); return; }
    if (b.id === 'lock') {
      const R = S.res[ph.id]; R.locked = true; R.fit = fitOf(ph, R.opt);
      addPts(R.fit, 3); addMood([-15, -5, 5, 12][R.fit]);
      S.face = R.fit >= 3 ? 'happy' : R.fit >= 1 ? 'ok' : 'sad';
      S.bubble = pickTxt(PV(ph,'opts')[R.opt].re);
      render(); return;
    }
    if (b.id === 'toSay') { S.step = 'say'; render(); $('#app').scrollIntoView({ block: 'start' }); return; }
    /* Basis */
    if (d.b != null && d.s != null) { const B = S.res[ph.id].builds[+d.b]; B.sel[+d.s] = +d.k; render(); return; }
    if (d.check != null) {
      const bi = +d.check, B = S.res[ph.id].builds[bi], bdef = PV(ph,'basis')[bi];
      B.tries++; B.lastWrong = {};
      B.ok = bdef.slots.map((sl, si) => { const c = sl.ch[B.sel[si]]; if (!c.ok) B.lastWrong[si] = c.why; return !!c.ok; });
      if (B.ok.every(Boolean)) { B.done = true; B.pts = B.tries === 1 ? 2 : 1; addPts(B.pts, 2); addMood(B.tries === 1 ? 5 : 1); S.face = 'happy'; S.bubble = 'Ja, so gefällt mir das.'; }
      else if (B.tries >= 2) { B.done = true; B.pts = 0; addPts(0, 2); addMood(-3); B.showRight = true; bdef.slots.forEach((sl, si) => { B.sel[si] = sl.ch.findIndex(c => c.ok); B.ok[si] = true; }); S.face = 'ok'; S.bubble = 'Hm …'; }
      else { S.face = 'ok'; S.bubble = 'Hm, das klang noch nicht ganz richtig.'; }
      render(); return;
    }
    /* Profi */
    if (b.id === 'submit') { S.res[ph.id].submitted = true; render(); return; }
    if (d.self != null) { const R = S.res[ph.id]; R.self = +d.self; addPts(R.self, 2); addMood([-3, 2, 6][R.self]); S.face = R.self === 2 ? 'happy' : 'ok'; S.bubble = R.self === 2 ? 'Das haben Sie schön gesagt.' : 'Aha …'; render(); return; }
    if (b.id === 'toWhy') { S.step = 'why'; render(); return; }
    if (d.why != null) { const R = S.res[ph.id]; R.whyPick = +d.why; const ok = !!PV(ph,'why').opts[R.whyPick].ok; addPts(ok ? 1 : 0, 1); if (ok) addMood(3); render(); return; }
    if (b.id === 'next') { nextPhase(); return; }
    /* Zwischenfall */
    if (d.ev != null) { const k = +d.ev, ok = !!S.ev.opts[k].ok; S.evRes = { k, ok }; addPts(ok ? 1 : 0, 1); addMood(ok ? 8 : -10); S.face = ok ? 'happy' : 'sad'; S.bubble = ok ? 'Das ist aufmerksam, danke.' : 'Hm. Das gefällt mir gar nicht.'; render(); return; }
    if (b.id === 'evNext') { if (S.i + 1 < S.list.length) { S.i++; S.step = 'decide'; S.screen = 'play'; S.bubble = '…'; render(); window.scrollTo(0, 0); } else startQuiz(); return; }
    /* Quiz */
    if (d.q != null) { const Q = S.quiz; Q.pick = +d.q; const ok = Q.pick === Q.items[Q.k].p; addPts(ok ? 1 : 0, 1); render(); return; }
    if (b.id === 'qNext') { const Q = S.quiz; if (Q.k + 1 < Q.items.length) { Q.k++; Q.pick = null; render(); } else finish(); return; }
    /* Neue Runde */
    if (b.id === 'againNew') { drawPersona(S.per); S.turned = false; S.screen = 'draw'; render(); window.scrollTo(0, 0); return; }
    if (b.id === 'againSame') { startGame(true); return; }
    if (b.id === 'againSetup') { S.screen = 'start'; render(); window.scrollTo(0, 0); return; }
  };
  app.oninput = e => {
    const t = e.target;
    if (t.dataset && t.dataset.tx != null) {
      const ph = curPh(), R = S.res[ph.id]; R.texts[+t.dataset.tx] = t.value;
      const res = evalChecks(ph, R.texts);
      const lis = document.querySelectorAll('#checks li');
      res.forEach((c, k) => { lis[k].className = c.ok ? 'ok' : 'no'; });
      const sb = $('#submit'); if (sb) sb.disabled = !R.texts.every(x => x.trim().length >= 6);
    }
    if (t.id === 'team') S.team = t.value;
  };
}

/* ===== Gesehen-Speicher: keine doppelten Fragen, solange es neue gibt ===== */

}

/* ===== Blitzrunde ===== */

  let h = `<section class="card stack"><span class="eyebrow">Blitzrunde · ${lvlTag()} · Bonus ×${mult}</span><h2>Welche Stufe ist das?</h2><div class="sentence">${esc(q.s)}</div>
  <div class="qbtns">${PHASES.map(p => `<button class="qb" data-bz="${p.id}"><span class="n">${p.id}</span>${esc(p.short)}</button>`).join('')}</div>`;
  if (B.last) h += `<div class="fb ${B.last.ok ? 'good' : 'bad'} pop">${B.last.ok ? `Richtig! +${B.last.add}` : `Das war Stufe ${B.last.q.p}: ${esc(PHASES[B.last.q.p - 1].name)}.`}</div>`;
  return h + `</section>`;
}
function endBlitz() {
  const B = S.bz; if (B.over) return; B.over = true; stopTimer();
  modeResult('blitz');
}

/* ===== Auswertung der Modi ===== */
function modeResult(mode) {
  stopTimer(); S.mres = mode;
  const rec = store('sfs-modrek') || {}, key = mode + '-' + S.level;
  const score = mode === 'fehler' ? S.fe.pts : mode === 'ansturm' ? S.an.umsatz : S.bz.pts;
  S.newRecord = score > (rec[key] || 0); if (S.newRecord) { rec[key] = score; store('sfs-modrek', rec); }
  S.recVal = Math.max(score, rec[key] || 0);
  S.screen = 'mres'; render(); window.scrollTo(0, 0);
}
function vModeResult() {
  const m = S.mres; let big = '', sub = '', kpis = [], list = '';
  if (m === 'fehler') {
    const F = S.fe; big = `${F.pts} / ${F.max}`; sub = 'Punkte im Fehler-Detektiv';
    kpis = [[F.items.length, 'Gespräche'], [F.items.reduce((a, d) => a + d.errs.length, 0), 'Fehler gesucht'], [Math.round(F.pts / Math.max(1, F.max) * 100) + ' %', 'der Punkte']];
    list = F.items.map(D => `<div class="rv"><b>${esc(D.ort)}</b>${D.errs.map(E => `<p><span class="small">Fehler: ${esc(FTYPES[E.ty])}</span><br>„${esc(D.lines[E.l][1])}“ → <b>${esc(E.fix.find(x => x.ok).t)}</b></p>`).join('')}</div>`).join('');
  }
  if (m === 'ansturm') {
    const A = S.an; big = `${A.umsatz} €`; sub = 'Umsatz bis Ladenschluss';
    kpis = [[`${A.happy} / ${A.items.length}`, 'Kunden begeistert'], [`${A.pts} / ${A.items.length * 2}`, 'Fachpunkte'], [A.dur / 1000 + ' s', 'Zeit pro Kunde']];
    list = A.log.map(l => `<div class="rv"><div class="hd"><span class="mk ${l.s === 2 ? 'g' : l.s === 1 ? 'm' : 'b'}">${l.s === 2 ? '✓' : l.s === 1 ? '~' : '✗'}</span><div style="min-width:0"><b>Stufe ${l.it.p}:</b> ${esc(l.it.k)}</div></div><p>Beste Antwort: <b>${esc(l.it.o.find(o => o[1] === 2)[0])}</b></p><p class="small">${esc(l.it.w)}</p></div>`).join('');
  }
  if (m === 'blitz') {
    const B = S.bz; big = `${B.pts}`; sub = 'Punkte in der Blitzrunde';
    kpis = [[`${B.right} / ${B.log.length}`, 'Sätze richtig'], [B.best, 'längste Serie'], [B.dur / 1000 + ' s', 'Spielzeit']];
    const wrong = B.log.filter(l => !l.ok);
    list = wrong.length ? `<h3>Das solltet ihr euch noch einmal ansehen</h3>` + wrong.map(l => `<div class="rv"><p>${esc(l.q.s)}</p><p class="small">Ihr: Stufe ${l.pick} · richtig: <b>Stufe ${l.q.p} – ${esc(PHASES[l.q.p - 1].name)}</b></p></div>`).join('') : '<p>Kein einziger Fehler – stark!</p>';
  }
  const [n, t] = newCount(m);
  return `<section class="score"><span class="eyebrow" style="color:inherit;opacity:.85">${esc(MODES[m].name)} · ${lvlTag()} · zum Zeigen</span><div class="big">${big}</div><p>${sub}</p><p><b>${esc(S.team || 'Team ohne Namen')}</b></p></section>
  <section class="card stack"><div class="kpis">${kpis.map(k => `<div class="kpi"><div class="v">${k[0]}</div><div class="l">${k[1]}</div></div>`).join('')}</div>
  <p class="small">${S.newRecord ? '<b>Neuer Rekord auf diesem Gerät!</b> ' : ''}Rekord (${lvlTag()}): ${m === 'ansturm' ? S.recVal + ' €' : S.recVal + ' Punkte'} · nur auf diesem Gerät gespeichert.</p>
  <p class="small">${n ? `Noch ${n} von ${t} ${MODES[m].unit} neu.` : `Ihr habt alle ${t} ${MODES[m].unit} gespielt – ab jetzt wird neu gemischt.`}</p></section>
  <section class="card stack"><h2>Auflösung</h2>${list}</section>
  <section class="card stack"><div class="row"><button class="btn" id="mAgain">Nochmal – mit neuen Fragen</button><button class="btn ghost" id="mHome">Anderer Modus</button></div></section>`;
}

/* ===== Klicks der Modi ===== */
function modeClick(b, d) {
  if (d.mode) { S.mode = d.mode; const t = $('#team'); if (t) S.team = t.value; render(); const x = $('#startMode') || $('#toPhases'); if (x) x.scrollIntoView({ block: 'center', behavior: 'smooth' }); return true; }
  if (b.id === 'startMode') { const t = $('#team'); if (t) S.team = t.value.trim(); ({ fehler:startFehler, ansturm:startAnsturm, blitz:startBlitz })[S.mode](); return true; }
  if (b.id === 'mAgain') { ({ fehler:startFehler, ansturm:startAnsturm, blitz:startBlitz })[S.mres](); return true; }
  if (b.id === 'mHome') { S.screen = 'start'; render(); window.scrollTo(0, 0); return true; }
  /* Fehler-Detektiv */
  if (S.screen === 'fehler') {
    const F = S.fe, { E } = feCur();
    if (d.fl != null) {
      const i = +d.fl;
      if (i === E.l) { const p = F.tries ? 0 : 1; F.pts += p; F.max += 1; F.stage = 'type'; }
      else { F.wrong.push(i); F.tries++; if (F.tries >= 2) { F.max += 1; F.stage = 'type'; } }
      render(); return true;
    }
    if (d.ft) { F.typePick = d.ft; F.max += 1; if (d.ft === E.ty) F.pts += 1; render(); return true; }
    if (b.id === 'feToFix') { F.stage = 'fix'; render(); return true; }
    if (d.ff != null) { F.fixPick = +d.ff; F.max += 2; if (E.fix[F.fixPick].ok) F.pts += 2; render(); return true; }
    if (b.id === 'feSub') { F.sub = true; render(); return true; }
    if (d.fself != null) { F.self = +d.fself; F.max += 2; F.pts += F.self; render(); return true; }
    if (b.id === 'feNext') { feAdvance(); return true; }
  }
  /* Kundenansturm */
  if (S.screen === 'ansturm') {
    if (d.an != null && S.an.pick == null) { answerAnsturm(+d.an); return true; }
    if (b.id === 'anNext') { const A = S.an; if (A.k + 1 < A.items.length) { A.k++; anPrep(); render(); window.scrollTo(0, 0); } else modeResult('ansturm'); return true; }
  }
  /* Blitzrunde */
  if (S.screen === 'blitz' && d.bz != null) {
    const B = S.bz; if (B.over) return true;
    const q = B.queue[B.k % B.queue.length], pick = +d.bz, ok = pick === q.p;
    let add = 0;
    if (ok) { B.streak++; add = B.streak > 6 ? 3 : B.streak > 3 ? 2 : 1; B.pts += add; B.right++; B.best = Math.max(B.best, B.streak); } else B.streak = 0;
    B.log.push({ q, pick, ok }); B.last = { ok, add, q }; B.k++;
    if (B.k < B.queue.length) seenAdd('satz', [B.queue[B.k].id]);
    if (Date.now() >= B.end) { endBlitz(); return true; }
    render(); return true;
  }
  return false;
}
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.fetx) { S.fe.text = e.target.value; const sb = $('#feSub'); if (sb) sb.disabled = e.target.value.trim().length < 6; } });

init();
</script></body></html>
