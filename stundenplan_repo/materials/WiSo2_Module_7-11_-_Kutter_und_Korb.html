<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turbulenz bei Kutter &amp; Korb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,700;62..125,800;62..125,900&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>

body{margin:0}
/* Layout: eine Spalte wie ein Handy – oben Statusleiste mit Kasse, Sicherheit, Wissen; darunter Hafen-Szene vor dem Laden; darunter der Chat. Auswertung als Kassenbon von Kutter & Korb */
:root{
  --bg:#e4ebef; --surface:#ffffff; --surface2:#eef3f6; --ink:#10233a; --muted:#4a5f72; --line:#c4d2dc;
  --teal:#1d4e73; --on-teal:#ffffff; --tag:#f2c230; --on-tag:#2a2000; --signal:#e8452c;
  --bin:#ffffff; --bout:#dcebf5; --sys:#eaf1f5;
  --good:#1f7a45; --bad:#c03a2b; --mid:#8f6200; --good-bg:#dcf1e4; --bad-bg:#fbe3e0; --mid-bg:#f8edd3;
  --paper:#fbfaf5; --on-paper:#1f2222; --phone:#10233a; --on-phone:#e6eff5;
  --display:"Archivo","Arial Narrow","Avenir Next Condensed","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1724; --surface:#132233; --surface2:#1a2c40; --ink:#e2ecf3; --muted:#9fb3c4; --line:#2b4157;
  --teal:#7cc4e4; --on-teal:#06202f; --tag:#f0c43a; --on-tag:#241b00; --signal:#ff7a5c;
  --bin:#1a2d41; --bout:#17405c; --sys:#152739;
  --good:#5fd08f; --bad:#f08a7c; --mid:#e8c15c; --good-bg:#153527; --bad-bg:#3f211d; --mid-bg:#3a3018;
  --paper:#f2efe6; --on-paper:#1f2222; --phone:#050d16; --on-phone:#e6eff5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1724; --surface:#132233; --surface2:#1a2c40; --ink:#e2ecf3; --muted:#9fb3c4; --line:#2b4157;
  --teal:#7cc4e4; --on-teal:#06202f; --tag:#f0c43a; --on-tag:#241b00; --signal:#ff7a5c;
  --bin:#1a2d41; --bout:#17405c; --sys:#152739;
  --good:#5fd08f; --bad:#f08a7c; --mid:#e8c15c; --good-bg:#153527; --bad-bg:#3f211d; --mid-bg:#3a3018;
  --paper:#f2efe6; --on-paper:#1f2222; --phone:#050d16; --on-phone:#e6eff5; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--phone)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.08;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,8.5vw,3.4rem)}
h2{font-size:clamp(1.35rem,5vw,1.8rem)}
h3{font-size:1.15rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)} .small{font-size:.9rem} .mono{font-family:var(--mono)}
.stack{display:grid;gap:12px} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}

/* Statusleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--phone);color:var(--on-phone)}
.bar .in{max-width:720px;margin:0 auto;display:grid;gap:6px}
.bar .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:6px;white-space:nowrap}
.brand svg{width:24px;height:24px}
.clock{font-family:var(--mono);font-size:.85rem;opacity:.85;white-space:nowrap}
.ib{display:inline-flex;align-items:center;gap:5px;border:1.5px solid rgba(255,255,255,.28);background:transparent;color:var(--on-phone);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.82rem;cursor:pointer;min-height:32px}
.ib svg{width:16px;height:16px}
.ib[aria-pressed="true"]{background:var(--tag);color:var(--on-tag);border-color:transparent}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meter{display:grid;gap:2px;min-width:0}
.meter .lab{display:flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter .lab svg{width:13px;height:13px;flex:none}
.meter .lab b{margin-left:auto;font-family:var(--mono);font-weight:600}
.meter .tr{height:7px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden}
.meter .fi{height:100%;border-radius:4px;transition:width .6s ease}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}
.steps i.ok{background:#5fd08f}.steps i.no{background:#f08a7c}.steps i.mi{background:#9fd8d0}.steps i.now{background:var(--tag)}
.delta{display:inline-block;font-family:var(--mono);font-weight:600;font-size:.8rem;padding:0 6px;border-radius:6px;margin-left:4px}
.delta.up{background:var(--good-bg);color:var(--good)}.delta.dn{background:var(--bad-bg);color:var(--bad)}

main{padding-top:16px;display:grid;gap:16px;overflow-x:clip}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.eyebrow{font-family:var(--mono);font-weight:600;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.lead{color:var(--muted)}
.btn{border:none;background:var(--teal);color:var(--on-teal);font-weight:700;font-size:1.05rem;padding:13px 20px;border-radius:14px;cursor:pointer;min-height:50px;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.tag{background:var(--tag);color:var(--on-tag)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);font-weight:700;font-size:.85rem}
.chip.tag{background:var(--tag);color:var(--on-tag);border-color:transparent}
input[type=text]{width:100%;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 12px;min-height:48px}

/* Hero */
.hero{display:grid;gap:14px;padding-top:6px}
.hero .kicker{font-family:var(--mono);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1 .q{color:var(--teal)}
.heroart{border-radius:var(--r);overflow:hidden;border:1.5px solid var(--line)}
.heroart>svg,.scene>svg{display:block;width:100%;height:auto}
.scene{border-radius:var(--r);overflow:hidden;border:1.5px solid var(--line);background:#16353a}

/* Module */
.mods{display:flex;gap:6px;flex-wrap:wrap}
.mods button{min-width:48px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-weight:700;cursor:pointer;display:grid;place-items:center;line-height:1.1;padding:4px 8px}
.mods button small{font-weight:400;font-size:.68rem;color:var(--muted)}
.mods button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal);border-color:transparent}
.mods button[aria-pressed="true"] small{color:inherit;opacity:.85}
.check{display:flex;gap:8px;align-items:center;font-size:.95rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--teal)}

/* Modus-Karten */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;cursor:pointer;display:grid;gap:4px;align-content:start;min-height:128px}
.mode:hover{border-color:var(--teal)}
.mode svg{width:30px;height:30px;color:var(--teal)}
.mode b{font-family:var(--display);font-size:1.08rem}
.mode span{font-size:.86rem;color:var(--muted);line-height:1.35}
.mode .pg{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:4px}
.mode .pg i{display:block;height:100%;background:var(--teal)}
.mode .nw{position:absolute;top:10px;right:10px;font-size:.7rem;font-weight:700;background:var(--tag);color:var(--on-tag);border-radius:999px;padding:1px 7px}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.mode.lock::after{content:"gesperrt";position:absolute;top:10px;right:10px;font-size:.7rem;font-weight:700;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
@media (min-width:640px){.modes{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* Persona-Karte */
.turn{animation:turn .6s ease both}
@keyframes turn{from{transform:perspective(900px) rotateY(80deg);opacity:.2}to{transform:none;opacity:1}}
.flip{perspective:1000px}
.flip .inner{position:relative;transition:transform .7s;transform-style:preserve-3d;min-height:360px}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);padding:18px;display:grid;gap:10px;align-content:start}
.flip .back{transform:rotateY(180deg)}
.flip .front{place-items:center;align-content:center;background:var(--teal);color:var(--on-teal);text-align:center}
.pcard{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.pcard svg{width:96px;height:96px}
.facts{display:grid;gap:4px;padding:0;margin:0;list-style:none}
.facts li{display:flex;gap:8px;align-items:baseline}
.facts li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--teal);flex:none;transform:translateY(-1px)}
.sign{display:inline-block;font-family:var(--display);font-weight:800;color:#fff;padding:4px 10px;border-radius:8px}

/* Chat */
.phone{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;min-width:0}
.ph-head{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--surface2);border-bottom:1.5px solid var(--line)}
.ph-head svg{width:42px;height:42px;flex:none}
.ph-head b{display:block;line-height:1.2}
.ph-head small{color:var(--muted)}
.thread{padding:14px;display:grid;gap:10px;background:
  radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1.5px) 0 0/18px 18px,var(--surface)}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.bub.in{background:var(--bin);border:1.5px solid var(--line);border-bottom-left-radius:4px;justify-self:start}
.bub.out{background:var(--bout);border-bottom-right-radius:4px;justify-self:end}
.bub.sys{justify-self:center;max-width:94%;background:var(--sys);border:1.5px dashed var(--line);font-size:.92rem;color:var(--muted);text-align:center;border-radius:12px}
.bub .tm{display:block;font-family:var(--mono);font-size:.7rem;color:var(--muted);text-align:right;margin-top:2px}
.typing{justify-self:start;background:var(--bin);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.answers{display:grid;gap:8px;padding:12px 14px 14px;border-top:1.5px solid var(--line);background:var(--surface2)}
.answers .hint{font-size:.85rem;color:var(--muted);font-weight:700}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 13px;cursor:pointer;min-height:50px;display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--bout)}
.opt[aria-pressed="true"] .dot{border-color:var(--teal);background:radial-gradient(circle,var(--teal) 45%,transparent 50%)}
.opt.gone{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.opt[disabled]{cursor:default}
.term{border-radius:14px;background:var(--tag);color:var(--on-tag);padding:12px 14px;display:grid;gap:2px}
.term .eyebrow{color:var(--on-tag);opacity:.8}
.term b{font-family:var(--display);font-size:1.15rem}

/* Mini-Spiele */
.mini-item{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.mini-item .lbl{font-family:var(--mono);font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:44px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface2);font-weight:700;cursor:pointer;padding:6px 10px;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal);border-color:transparent}
.seg button.right{outline:3px solid var(--good)}
.mini-item.ok{border-color:var(--good);background:var(--good-bg)}
.mini-item.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{font-size:.92rem}

/* Ergebnis */
.ok-t{color:var(--good)}.no-t{color:var(--bad)}.mid-t{color:var(--mid)}
.bon{background:var(--paper);color:var(--on-paper);font-family:var(--mono);font-size:.88rem;line-height:1.5;padding:22px 18px 16px;max-width:420px;width:100%;justify-self:center;position:relative;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) bottom/16px 10px repeat-x;
          mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) bottom/16px 10px repeat-x;
  box-shadow:0 10px 30px rgba(0,0,0,.18)}
.bon .c{text-align:center}
.bon .big{font-size:1.15rem;font-weight:600;letter-spacing:.04em}
.bon hr{border:none;border-top:1.5px dashed #9a9a92;margin:8px 0}
.bon .ln{display:flex;gap:6px}
.bon .ln span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bon .stars{font-size:1.5rem;letter-spacing:.2em;text-align:center}
.bon svg{display:block;margin:8px auto 0;width:80%;height:46px}
.rev{display:grid;gap:10px}
.rv{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;background:var(--surface)}
.rv .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:700;flex:none}
.mark.ok{background:var(--good-bg);color:var(--good)}.mark.mid{background:var(--mid-bg);color:var(--mid)}.mark.no{background:var(--bad-bg);color:var(--bad)}
.ihk{border-left:4px solid var(--teal);background:var(--surface2);padding:8px 10px;border-radius:0 10px 10px 0;font-size:.92rem}
.better{font-size:.93rem}
details.wb{border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface)}
details.wb summary{cursor:pointer;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{display:grid;justify-items:center;text-align:center;gap:4px;padding:8px;border-radius:12px;border:1.5px solid var(--line);font-size:.78rem;background:var(--surface)}
.badge svg{width:44px;height:44px}
.badge.off{opacity:.38;filter:grayscale(1)}
.timer{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--tag);transition:width .25s linear}
.note{font-size:.9rem;padding:10px 12px;border-radius:12px;background:var(--mid-bg);color:var(--ink)}
.confirm{border:1.5px solid var(--bad);background:var(--bad-bg);border-radius:12px;padding:12px;display:grid;gap:8px}
.walk{animation:walk 2.4s ease-in-out both}
@keyframes walk{from{transform:translateX(-60px)}to{transform:none}}
.pop{animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.es{display:block;margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);font-style:italic;font-size:.9em;color:var(--muted)}
.term .es{color:var(--on-tag);opacity:.85;border-color:rgba(0,0,0,.2)}
.roles{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 14px;font-size:.85rem;background:var(--sys);border-bottom:1.5px solid var(--line)}
.frame{background:var(--surface);border:1.5px dashed var(--teal);border-radius:12px;padding:10px 12px;line-height:1.6}
.gap{background:var(--tag);color:var(--on-tag);border-radius:6px;padding:0 6px;font-weight:700}
/* Tafel (Beamer) */
.wrap.wide{max-width:1200px}
.tafel{max-width:1200px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.tafel{grid-template-columns:340px minmax(0,1fr)}}
.tafel canvas{width:100%;max-width:300px;height:auto;border-radius:12px;background:#fff;display:block}
.rank{width:100%;border-collapse:collapse;font-size:1.05rem}
.rank th,.rank td{padding:8px 10px;border-bottom:1.5px solid var(--line);text-align:left}
.rank td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.rank tr.top td{background:var(--mid-bg)}
.bigcode{font-family:var(--mono);font-size:2.2rem;font-weight:600;letter-spacing:.12em}
.dotc{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px}.dotc.on{background:var(--good)}
.tafel .card{align-content:start}.tafel .card>.btn{justify-self:start}



h1{font-stretch:88%;font-weight:900;letter-spacing:-.015em}
.hero h1 .q{color:var(--signal)}
.alarm{font-size:.82rem;font-weight:700;background:var(--signal);color:#fff;border-radius:8px;padding:3px 10px;justify-self:start}
.btn.danger{background:var(--bad);color:#fff}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.front{background:var(--teal);color:var(--on-teal);text-align:center;justify-items:center;min-height:300px;align-content:center}
.signrow{display:flex;gap:12px;align-items:center}
.signrow svg{flex:none}
.lager{border-radius:12px;overflow:hidden;border:1.5px solid var(--line);max-width:560px}
.lager svg{display:block;width:100%;height:auto}
.ending{border-width:2px}
.ending.ok{border-color:var(--good);background:var(--good-bg)}
.ending.ruin{border-color:var(--mid);background:var(--mid-bg)}
.ending.still{border-color:var(--bad);background:var(--bad-bg)}
select{min-height:44px;border-radius:10px;padding:6px;border:1.5px solid var(--line);background:var(--surface2)}
.bub.sys svg{display:block;margin:4px auto}
.spot{cursor:pointer}.spot:focus{outline:none}
.rivalbar{font-size:.78rem;font-family:var(--mono);opacity:.85}
.bub.sys.rival{border-style:solid;border-color:var(--tag)}
.stack>*{min-width:0}
@media (max-width:460px){.rank{font-size:.9rem}.rank th,.rank td{padding:6px 6px}}

</style>

function QRCode(typeNumber, errorCorrectLevel) {
	this.typeNumber = typeNumber;
	this.errorCorrectLevel = errorCorrectLevel;
	this.modules = null;
	this.moduleCount = 0;
	this.dataCache = null;
	this.dataList = [];

QRCode.prototype = {
	
	addData : function(data) {
		var newData = new QR8bitByte(data);
		this.dataList.push(newData);
		this.dataCache = null;
	},
	
	isDark : function(row, col) {
		if (row < 0 || this.moduleCount <= row || col < 0 || this.moduleCount <= col) {
			throw new Error(row + "," + col);
		}
		return this.modules[row][col];
	},

	getModuleCount : function() {
		return this.moduleCount;
	},
	
	make : function() {
		// Calculate automatically typeNumber if provided is < 1
		if (this.typeNumber < 1 ){
			var typeNumber = 1;
			for (typeNumber = 1; typeNumber < 40; typeNumber++) {
				var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, this.errorCorrectLevel);

				var buffer = new QRBitBuffer();
				var totalDataCount = 0;
				for (var i = 0; i < rsBlocks.length; i++) {
					totalDataCount += rsBlocks[i].dataCount;
				}

				for (var x = 0; x < this.dataList.length; x++) {
					var data = this.dataList[x];
					buffer.put(data.mode, 4);
					buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
					data.write(buffer);
				}
				if (buffer.getLengthInBits() <= totalDataCount * 8)
					break;
			}
			this.typeNumber = typeNumber;
		}
		this.makeImpl(false, this.getBestMaskPattern() );
	},
	
	makeImpl : function(test, maskPattern) {
		
		this.moduleCount = this.typeNumber * 4 + 17;
		this.modules = new Array(this.moduleCount);
		
		for (var row = 0; row < this.moduleCount; row++) {
			
			this.modules[row] = new Array(this.moduleCount);
			
			for (var col = 0; col < this.moduleCount; col++) {
				this.modules[row][col] = null;//(col + row) % 3;
			}
		}
	
		this.setupPositionProbePattern(0, 0);
		this.setupPositionProbePattern(this.moduleCount - 7, 0);
		this.setupPositionProbePattern(0, this.moduleCount - 7);
		this.setupPositionAdjustPattern();
		this.setupTimingPattern();
		this.setupTypeInfo(test, maskPattern);
		
		if (this.typeNumber >= 7) {
			this.setupTypeNumber(test);
		}
	
		if (this.dataCache === null) {
			this.dataCache = QRCode.createData(this.typeNumber, this.errorCorrectLevel, this.dataList);
		}
	
		this.mapData(this.dataCache, maskPattern);

	setupPositionProbePattern : function(row, col)  {
		
		for (var r = -1; r <= 7; r++) {
			
			if (row + r <= -1 || this.moduleCount <= row + r) continue;
			
			for (var c = -1; c <= 7; c++) {
				
				if (col + c <= -1 || this.moduleCount <= col + c) continue;
				
				if ( (0 <= r && r <= 6 && (c === 0 || c === 6) ) || 
                     (0 <= c && c <= 6 && (r === 0 || r === 6) ) || 
                     (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
					this.modules[row + r][col + c] = true;
				} else {
					this.modules[row + r][col + c] = false;
				}
			}		
		}		
	},
	
	getBestMaskPattern : function() {
	
		var minLostPoint = 0;
		var pattern = 0;
	
		for (var i = 0; i < 8; i++) {
			
			this.makeImpl(true, i);
	
			var lostPoint = QRUtil.getLostPoint(this);
	
			if (i === 0 || minLostPoint >  lostPoint) {
				minLostPoint = lostPoint;
				pattern = i;
			}
		}
	
		return pattern;
	},
	
	createMovieClip : function(target_mc, instance_name, depth) {
	
		var qr_mc = target_mc.createEmptyMovieClip(instance_name, depth);
		var cs = 1;
	
		this.make();

		for (var row = 0; row < this.modules.length; row++) {
			
			var y = row * cs;
			
			for (var col = 0; col < this.modules[row].length; col++) {
	
				var x = col * cs;
				var dark = this.modules[row][col];
			
				if (dark) {
					qr_mc.beginFill(0, 100);
					qr_mc.moveTo(x, y);
					qr_mc.lineTo(x + cs, y);
					qr_mc.lineTo(x + cs, y + cs);
					qr_mc.lineTo(x, y + cs);
					qr_mc.endFill();
				}
			}
		}
		
		return qr_mc;
	},

	setupTimingPattern : function() {
		
		for (var r = 8; r < this.moduleCount - 8; r++) {
			if (this.modules[r][6] !== null) {
				continue;
			}
			this.modules[r][6] = (r % 2 === 0);
		}
	
		for (var c = 8; c < this.moduleCount - 8; c++) {
			if (this.modules[6][c] !== null) {
				continue;
			}
			this.modules[6][c] = (c % 2 === 0);
		}
	},
	
	setupPositionAdjustPattern : function() {
	
		var pos = QRUtil.getPatternPosition(this.typeNumber);
		
		for (var i = 0; i < pos.length; i++) {
		
			for (var j = 0; j < pos.length; j++) {
			
				var row = pos[i];
				var col = pos[j];
				
				if (this.modules[row][col] !== null) {
					continue;
				}
				
				for (var r = -2; r <= 2; r++) {
				
					for (var c = -2; c <= 2; c++) {
					
						if (Math.abs(r) === 2 || 
                            Math.abs(c) === 2 ||
                            (r === 0 && c === 0) ) {
							this.modules[row + r][col + c] = true;
						} else {
							this.modules[row + r][col + c] = false;
						}
					}
				}
			}
		}
	},
	
	setupTypeNumber : function(test) {
	
		var bits = QRUtil.getBCHTypeNumber(this.typeNumber);
        var mod;
	
		for (var i = 0; i < 18; i++) {
			mod = (!test && ( (bits >> i) & 1) === 1);
			this.modules[Math.floor(i / 3)][i % 3 + this.moduleCount - 8 - 3] = mod;
		}
	
		for (var x = 0; x < 18; x++) {
			mod = (!test && ( (bits >> x) & 1) === 1);
			this.modules[x % 3 + this.moduleCount - 8 - 3][Math.floor(x / 3)] = mod;
		}
	},
	
	setupTypeInfo : function(test, maskPattern) {
	
		var data = (this.errorCorrectLevel << 3) | maskPattern;
		var bits = QRUtil.getBCHTypeInfo(data);
        var mod;
	
		// vertical		
		for (var v = 0; v < 15; v++) {
	
			mod = (!test && ( (bits >> v) & 1) === 1);
	
			if (v < 6) {
				this.modules[v][8] = mod;
			} else if (v < 8) {
				this.modules[v + 1][8] = mod;
			} else {
				this.modules[this.moduleCount - 15 + v][8] = mod;
			}
		}
	
		// horizontal
		for (var h = 0; h < 15; h++) {
	
			mod = (!test && ( (bits >> h) & 1) === 1);
			
			if (h < 8) {
				this.modules[8][this.moduleCount - h - 1] = mod;
			} else if (h < 9) {
				this.modules[8][15 - h - 1 + 1] = mod;
			} else {
				this.modules[8][15 - h - 1] = mod;
			}
		}
	
		// fixed module
		this.modules[this.moduleCount - 8][8] = (!test);
	
	},
	
	mapData : function(data, maskPattern) {
		
		var inc = -1;
		var row = this.moduleCount - 1;
		var bitIndex = 7;
		var byteIndex = 0;
		
		for (var col = this.moduleCount - 1; col > 0; col -= 2) {
	
			if (col === 6) col--;
	
			while (true) {
	
				for (var c = 0; c < 2; c++) {
					
					if (this.modules[row][col - c] === null) {
						
						var dark = false;
	
						if (byteIndex < data.length) {
							dark = ( ( (data[byteIndex] >>> bitIndex) & 1) === 1);
						}
	
						var mask = QRUtil.getMask(maskPattern, row, col - c);
	
						if (mask) {
							dark = !dark;
						}
						
						this.modules[row][col - c] = dark;
						bitIndex--;
	
						if (bitIndex === -1) {
							byteIndex++;
							bitIndex = 7;
						}
					}
				}
								
				row += inc;
	
				if (row < 0 || this.moduleCount <= row) {
					row -= inc;
					inc = -inc;
					break;
				}
			}
		}
		
	}

};

QRCode.PAD0 = 0xEC;
QRCode.PAD1 = 0x11;

QRCode.createData = function(typeNumber, errorCorrectLevel, dataList) {
	
	var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectLevel);
	
	var buffer = new QRBitBuffer();
	
	for (var i = 0; i < dataList.length; i++) {
		var data = dataList[i];
		buffer.put(data.mode, 4);
		buffer.put(data.getLength(), QRUtil.getLengthInBits(data.mode, typeNumber) );
		data.write(buffer);
	}

	// calc num max data.
	var totalDataCount = 0;
	for (var x = 0; x < rsBlocks.length; x++) {
		totalDataCount += rsBlocks[x].dataCount;
	}

	if (buffer.getLengthInBits() > totalDataCount * 8) {
		throw new Error("code length overflow. (" + 
            buffer.getLengthInBits() + 
            ">" +  
            totalDataCount * 8 + 
            ")");
	}

	// end code
	if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
		buffer.put(0, 4);
	}

	// padding
	while (buffer.getLengthInBits() % 8 !== 0) {
		buffer.putBit(false);
	}

	// padding
	while (true) {
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD0, 8);
		
		if (buffer.getLengthInBits() >= totalDataCount * 8) {
			break;
		}
		buffer.put(QRCode.PAD1, 8);
	}

	return QRCode.createBytes(buffer, rsBlocks);
};

QRCode.createBytes = function(buffer, rsBlocks) {

	var offset = 0;
	
	var maxDcCount = 0;
	var maxEcCount = 0;
	
	var dcdata = new Array(rsBlocks.length);
	var ecdata = new Array(rsBlocks.length);
	
	for (var r = 0; r < rsBlocks.length; r++) {

		var dcCount = rsBlocks[r].dataCount;
		var ecCount = rsBlocks[r].totalCount - dcCount;

		maxDcCount = Math.max(maxDcCount, dcCount);
		maxEcCount = Math.max(maxEcCount, ecCount);
		
		dcdata[r] = new Array(dcCount);
		
		for (var i = 0; i < dcdata[r].length; i++) {
			dcdata[r][i] = 0xff & buffer.buffer[i + offset];
		}
		offset += dcCount;
		
		var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
		var rawPoly = new QRPolynomial(dcdata[r], rsPoly.getLength() - 1);

		var modPoly = rawPoly.mod(rsPoly);
		ecdata[r] = new Array(rsPoly.getLength() - 1);
		for (var x = 0; x < ecdata[r].length; x++) {
            var modIndex = x + modPoly.getLength() - ecdata[r].length;
			ecdata[r][x] = (modIndex >= 0)? modPoly.get(modIndex) : 0;
		}

	}
	
	var totalCodeCount = 0;
	for (var y = 0; y < rsBlocks.length; y++) {
		totalCodeCount += rsBlocks[y].totalCount;
	}

	var data = new Array(totalCodeCount);
	var index = 0;

	for (var z = 0; z < maxDcCount; z++) {
		for (var s = 0; s < rsBlocks.length; s++) {
			if (z < dcdata[s].length) {
				data[index++] = dcdata[s][z];
			}
		}
	}

	for (var xx = 0; xx < maxEcCount; xx++) {
		for (var t = 0; t < rsBlocks.length; t++) {
			if (xx < ecdata[t].length) {
				data[index++] = ecdata[t][xx];
			}
		}
	}

	return data;

};

    while(this.buf.length>=2){
      let mult=1,len=0,i=1,b;
      do{if(i>=this.buf.length)return;b=this.buf[i++];len+=(b&127)*mult;mult*=128;}while(b&128);

    this.bc.onmessage=e=>{const m=e.data;if(this.subs.has(m.t))onMsg(m.t,m.p,false);};setTimeout(()=>onStatus(true),50);}

 weil:'… weil die Ausbildung mit der Bekanntgabe des Prüfungsergebnisses endet.'},
{id:'a2',area:'m7a',from:'tim',title:'Tim will sofort wechseln',src:SRC.BBiG,
 msg:p=>`Hey ${NM(p)}! Ich habe im März bei der Fischbude „Möwe“ einen Vertrag unterschrieben: „sofort nach bestandener Prüfung“. Heute bestanden! Mein Ausbildungsbetrieb sagt, ich muss bis 31. Juli bleiben, sonst gibt's Ärger. Stimmt das?`,
 opts:[
  {t:'Ja. Ohne Zustimmung deines Betriebs darfst du nicht wechseln.',law:0,why:'Falsch. Die Ausbildung endet mit dem Ergebnis. Eine Zustimmung des alten Betriebs braucht Tim nicht.'},
  {t:'Nein. Deine Ausbildung ist heute zu Ende. Du kannst morgen bei der „Möwe“ anfangen. Den Vertrag durftest du im März schon schließen.',law:2,why:'Richtig. Die Ausbildung endet mit der Bekanntgabe des Ergebnisses (§ 21 BBiG). Einen Arbeitsvertrag darf man in den letzten sechs Monaten der Ausbildung schließen (§ 12 BBiG).'},
  {t:'Du darfst morgen anfangen. Aber bis das IHK-Zeugnis da ist, zahlt die „Möwe“ dir nur Azubi-Geld.',law:1,why:'Teilweise. Tim darf morgen anfangen. Aber er ist ab dann Arbeitnehmer und bekommt sein vereinbartes Gehalt – kein Azubi-Geld.'}
 ],
 term:'Vertrag in den letzten sechs Monaten',def:'In den letzten sechs Monaten der Ausbildung darf man einen Arbeitsvertrag schließen – auch mit einem anderen Betrieb.',
 ihk:'Sie kann die Stelle bei der Winter KG am Tag nach der Bekanntgabe des Prüfungsergebnisses antreten (IHK Sommer 2021, Aufgabe 22).',
 weil:'… weil man in den letzten sechs Monaten der Ausbildung einen Arbeitsvertrag schließen darf und die Ausbildung mit dem Ergebnis endet.'},
{id:'a3',area:'m7a',from:'svea',title:'Nicht übernommen',src:SRC.SGB,
 msg:p=>`Unsere zweite Azubi Jana wird nicht übernommen. Das weiß sie seit dem 20. März. Ihre Ausbildung endet am 31. Juli. Sie will sich am 1. Juli bei der Agentur für Arbeit melden. Reicht das?`,
 opts:[
  {t:'Ja. Melden muss man sich erst, wenn man wirklich arbeitslos ist.',law:0,why:'Falsch. Wer weiß, dass die Stelle endet, muss sich früh arbeitsuchend melden.'},
  {t:'Nein. Sie muss sich spätestens drei Monate vor dem Ende melden, also bis 30. April. Sonst droht eine Woche Sperrzeit.',law:2,why:'Richtig. Spätestens 3 Monate vor dem Ende arbeitsuchend melden. Wer zu spät kommt, bekommt 1 Woche Sperrzeit (Modul 4).'},
  {t:'Nein, sie ist zu spät. Jetzt bekommt sie gar kein Arbeitslosengeld mehr.',law:1,why:'Teilweise. Sie ist zu spät. Das kostet aber „nur“ 1 Woche Sperrzeit. Den Anspruch verliert sie nicht.'}
 ],
 term:'Arbeitsuchend melden',def:'Spätestens 3 Monate vor dem Ende melden. Erfährt man es später, innerhalb von 3 Tagen.',
 ihk:'Wer weiß, dass sein Arbeits- oder Ausbildungsverhältnis endet, muss sich spätestens drei Monate vorher bei der Agentur für Arbeit arbeitsuchend melden. Wer sich zu spät meldet, bekommt eine Sperrzeit von einer Woche.',
 weil:'… weil man sich spätestens drei Monate vor dem Ende arbeitsuchend melden muss.'},
{id:'a4',area:'m7a',from:'hansen',title:'Einfach weitergearbeitet',src:SRC.BBiG,
 msg:p=>`${NM(p)}, du stehst ja seit deiner Prüfung einfach weiter im Laden. Unterschrieben haben wir nichts. Dann bist du jetzt Aushilfe auf Probe. Ich kann dich jederzeit nach Hause schicken.`,
 opts:[
  {t:'Stimmt. Ohne Unterschrift habe ich keinen Vertrag.',law:0,why:'Falsch. Wer nach der Ausbildung weiterarbeitet, ohne dass etwas vereinbart ist, hat automatisch einen Arbeitsvertrag.'},
  {t:'Nein. Ich arbeite nach der Ausbildung weiter, ohne dass wir etwas vereinbart haben. Damit habe ich einen unbefristeten Arbeitsvertrag.',law:2,why:'Richtig. Wird der Azubi im Anschluss weiterbeschäftigt, ohne dass etwas vereinbart ist, gilt ein Arbeitsverhältnis auf unbestimmte Zeit (§ 24 BBiG).'},
  {t:'Dann bin ich jetzt befristet angestellt, bis wir unterschreiben.',law:0,why:'Falsch. Eine Befristung muss schriftlich vereinbart sein. Hier gilt ein unbefristeter Vertrag (§ 24 BBiG).'}
 ],
 term:'Weiterbeschäftigung',def:'Weiterarbeiten nach der Ausbildung ohne Vereinbarung = unbefristeter Arbeitsvertrag.',
 ihk:'Werden Auszubildende im Anschluss an das Berufsausbildungsverhältnis beschäftigt, ohne dass hierüber ausdrücklich etwas vereinbart worden ist, so gilt ein Arbeitsverhältnis auf unbestimmte Zeit als begründet (§ 24 BBiG).',
 weil:'… weil man nach der Ausbildung ohne Vereinbarung automatisch unbefristet angestellt ist.'},
/* ---------- Modul 7b: Das Gespräch ---------- */
{id:'b1',area:'m7b',from:'jule',title:'Kinder geplant?',src:SRC.AGG,
 msg:p=>`Ich übernehme im Juli die Geschäftsführung von meinem Vater. Darum noch ein paar Fragen, ${NM(p)}. Planen Sie in den nächsten Jahren Kinder?`,
 opts:[
  {t:'Ich muss ehrlich antworten. Sonst kann der Vertrag später angefochten werden.',law:0,why:'Falsch. Die Frage ist unzulässig. Man muss sie nicht beantworten und darf sogar die Unwahrheit sagen. Anfechten kann der Betrieb dann nicht.'},
  {t:'Diese Frage ist nicht erlaubt. Ich muss sie nicht beantworten.',law:2,why:'Richtig. Fragen nach Schwangerschaft oder Kinderwunsch sind unzulässig. Sie benachteiligen wegen des Geschlechts (AGG).'},
  {t:'Darauf antworte ich erst, wenn der Vertrag unterschrieben ist.',law:0,why:'Falsch. Die Frage ist unzulässig – vor und nach der Unterschrift.'}
 ],
 term:'Unzulässige Frage',def:'Fragen nach Schwangerschaft, Kinderwunsch, Religion, Gewerkschaft oder Partei muss man nicht beantworten.',
 ihk:'Die Frage nach einer Schwangerschaft ist unzulässig, weil sie Bewerberinnen wegen des Geschlechts benachteiligt (AGG). Die Bewerberin darf schweigen oder die Unwahrheit sagen.',
 weil:'… weil die Frage nach Kinderwunsch oder Schwangerschaft wegen des Geschlechts benachteiligt.'},
{id:'b2',area:'m7b',from:'jule',title:'In der Gewerkschaft?',src:SRC.GG,
 msg:p=>`Sind Sie Mitglied bei ver.di? Mein Vater hatte mit der Gewerkschaft schon mal Ärger.`,
 opts:[
  {t:'Das muss ich nicht sagen. Die Mitgliedschaft in einer Gewerkschaft ist geschützt.',law:2,why:'Richtig. Die Koalitionsfreiheit schützt die Mitgliedschaft in einer Gewerkschaft (Art. 9 GG). Die Frage ist unzulässig.'},
  {t:'Nein. Und Gewerkschaften finde ich auch nicht gut.',law:0,why:'Falsch. Niemand muss diese Frage beantworten. Wer es trotzdem tut, schadet sich vielleicht selbst.'},
  {t:'Diese Frage ist erlaubt, wenn der Betrieb im Handelsverband ist.',law:0,why:'Falsch. Die Frage ist immer unzulässig – egal ob der Betrieb im Arbeitgeberverband ist.'}
 ],
 term:'Koalitionsfreiheit',def:'Jeder darf einer Gewerkschaft beitreten. Der Betrieb darf danach nicht fragen.',
 ihk:'Die Frage nach der Gewerkschaftszugehörigkeit ist unzulässig. Die Koalitionsfreiheit schützt die Mitgliedschaft (Art. 9 Abs. 3 GG).',
 weil:'… weil das Grundgesetz die Mitgliedschaft in einer Gewerkschaft schützt.'},
{id:'b3',area:'m7b',from:'jule',title:'Vorstrafen?',src:null,
 msg:p=>`Bei uns arbeiten Sie an der Kasse und zählen abends den Tresor. Sind Sie wegen Diebstahls oder Betrugs vorbestraft?`,
 opts:[
  {t:'Darauf antworte ich nicht. Nach Vorstrafen darf nie gefragt werden.',law:0,why:'Falsch. Bei Stellen mit Geld oder Warenverantwortung darf nach passenden Vorstrafen gefragt werden.'},
  {t:'Das darf sie fragen, weil ich mit Geld arbeite. Ich antworte ehrlich.',law:2,why:'Richtig. Bei Stellen mit Geld- oder Warenverantwortung darf nach einschlägigen Vorstrafen gefragt werden, also Diebstahl oder Betrug.'},
  {t:'Das darf sie fragen. Dann darf sie auch nach allen anderen Strafen fragen, zum Beispiel wegen zu schnellen Fahrens.',law:0,why:'Falsch. Erlaubt sind nur Fragen nach Vorstrafen, die zur Stelle passen. Für die Kasse sind das Diebstahl und Betrug.'}
 ],
 term:'Zulässige Frage',def:'Erlaubt sind Fragen, die mit der Stelle zu tun haben: Erfahrung, Arbeitszeit, bei Geld auch passende Vorstrafen.',
 ihk:'Zulässig sind Fragen, die die Eignung für die Stelle betreffen. Bei Stellen mit Geld- oder Warenverantwortung darf nach einschlägigen Vorstrafen gefragt werden.',
 weil:'… weil bei Stellen mit Geldverantwortung nach passenden Vorstrafen gefragt werden darf.'},
{id:'b4',area:'m7b',from:'hansen',title:'Fahrtkosten der Bewerberin',src:null,
 msg:p=>`Wir suchen noch eine Verkäuferin. Ich habe eine Bewerberin aus Bremen zum Gespräch eingeladen. Jetzt will sie ihre Fahrtkosten. Muss ich die zahlen?`,
 opts:[
  {t:'Nein. Fahrtkosten zahlt immer die Bewerberin.',law:0,why:'Falsch. Wer zum Gespräch einlädt, muss die Fahrtkosten erstatten.'},
  {t:'Ja. Sie haben sie eingeladen. Dann müssen Sie die Fahrtkosten erstatten – außer Sie haben das vorher ausgeschlossen.',law:2,why:'Richtig. Lädt der Betrieb ein, muss er die Fahrtkosten erstatten. Das gilt nur nicht, wenn er es vorher ausgeschlossen hat.'},
  {t:'Nur wenn sie die Stelle auch bekommt.',law:0,why:'Falsch. Ob sie die Stelle bekommt, ist egal. Die Einladung zählt.'}
 ],
 term:'Vorstellungskosten',def:'Wer zum Vorstellungsgespräch einlädt, erstattet die Fahrtkosten – außer es wurde vorher ausgeschlossen.',
 ihk:'Lädt der Betrieb zu einem Vorstellungsgespräch ein, muss er die Fahrtkosten erstatten, wenn er dies nicht vorher ausgeschlossen hat.',
 weil:'… weil der einladende Betrieb die Fahrtkosten erstatten muss, wenn er das nicht vorher ausgeschlossen hat.'},
{id:'b5',area:'m7b',from:'hansen',title:'Arbeitspapiere',src:null,
 msg:p=>`Für unsere neue Kollegin: Welche Papiere braucht sie am ersten Arbeitstag? Wir verkaufen ja Fisch und Feinkost.`,
 opts:[
  {t:'Steuer-ID, Sozialversicherungsnummer, Mitgliedsbescheinigung der Krankenkasse, Bankverbindung und die Belehrung nach dem Infektionsschutzgesetz.',law:2,why:'Richtig. Das sind die Arbeitspapiere. Wer mit Lebensmitteln arbeitet, braucht zusätzlich die Belehrung nach dem Infektionsschutzgesetz.'},
  {t:'Steuer-ID, Sozialversicherungsnummer, Krankenkasse und Bankverbindung.',law:1,why:'Teilweise. Es fehlt die Belehrung nach dem Infektionsschutzgesetz. Die ist bei Lebensmitteln Pflicht.'},
  {t:'Personalausweis und das letzte Schulzeugnis reichen.',law:0,why:'Falsch. Für Lohn und Sozialversicherung braucht der Betrieb Steuer-ID, Sozialversicherungsnummer, Krankenkasse und Bankverbindung.'}
 ],
 term:'Arbeitspapiere',def:'Steuer-ID, Sozialversicherungsnummer, Bescheinigung der Krankenkasse, Bankverbindung – bei Lebensmitteln auch die Belehrung nach dem Infektionsschutzgesetz.',
 ihk:'Zum ersten Arbeitstag bringt der Arbeitnehmer seine Arbeitspapiere mit: Steuer-Identifikationsnummer, Sozialversicherungsnummer, Mitgliedsbescheinigung der Krankenkasse und Bankverbindung; bei Lebensmitteln die Belehrung nach dem Infektionsschutzgesetz.',
 weil:'… weil der Betrieb diese Angaben für Lohn, Steuer und Sozialversicherung braucht.'},
{id:'b6',area:'m7b',from:'jule',title:'Oft krank?',src:null,
 msg:p=>`Letzte Frage. Sind Sie oft krank?`,
 opts:[
  {t:'So allgemein darf sie das nicht fragen. Erlaubt wäre nur: eine Krankheit, die mich für diese Arbeit ungeeignet macht.',law:2,why:'Richtig. Erlaubt ist nur die enge Frage nach Krankheiten, die die Arbeit konkret betreffen.'},
  {t:'Nach der Gesundheit darf nie gefragt werden.',law:1,why:'Teilweise. Die allgemeine Frage ist unzulässig. Die enge Frage nach einer Krankheit, die für diese Arbeit ungeeignet macht, ist aber erlaubt.'},
  {t:'Die Frage ist erlaubt. Ich muss alle Krankheiten der letzten Jahre aufzählen.',law:0,why:'Falsch. So weit darf der Betrieb nicht fragen.'}
 ],
 term:'Frage nach Krankheit',def:'Erlaubt ist nur die Frage nach Krankheiten, die für die Stelle ungeeignet machen.',
 ihk:'Zulässig ist nur die Frage nach Krankheiten, die die Eignung für die konkrete Arbeit betreffen. Die allgemeine Frage „Sind Sie oft krank?“ ist unzulässig.',
 weil:'… weil nur Krankheiten zählen, die für genau diese Arbeit ungeeignet machen.'},
/* ---------- Modul 7c: Der Arbeitsvertrag ---------- */
{id:'c1',area:'m7c',from:'hansen',title:'Per Handschlag',src:SRC.NachwG,
 msg:p=>`So, ${NM(p)}: Ab 1. August bist du fest bei uns, 2.500 € brutto. Das machen wir per Handschlag. Aufschreiben brauchen wir nichts, oder?`,
 opts:[
  {t:'Ohne unterschriebenen Vertrag gilt gar nichts.',law:0,why:'Falsch. Ein Arbeitsvertrag ist auch mündlich gültig.'},
  {t:'Der Handschlag gilt. Aber Sie müssen mir die wichtigsten Bedingungen aufschreiben und aushändigen. Das verlangt das Nachweisgesetz.',law:2,why:'Richtig. Der Vertrag ist mündlich gültig. Der Arbeitgeber muss die wichtigsten Bedingungen aber schriftlich festhalten und aushändigen. Seit 2025 reicht meist die Textform, zum Beispiel eine E-Mail.'},
  {t:'Klar. Ein Handschlag reicht. Mehr braucht man nie.',law:0,why:'Falsch. Der Vertrag gilt zwar. Aber nach dem Nachweisgesetz muss der Betrieb die Bedingungen aufschreiben.'}
 ],
 term:'Nachweisgesetz',def:'Der Arbeitgeber muss die wichtigsten Bedingungen aufschreiben und aushändigen.',
 ihk:'Ein Arbeitsvertrag ist auch mündlich gültig. Nach dem Nachweisgesetz muss der Arbeitgeber die wesentlichen Vertragsbedingungen aufschreiben und dem Arbeitnehmer aushändigen.',
 weil:'… weil der Arbeitgeber die wichtigsten Bedingungen nach dem Nachweisgesetz aufschreiben muss.'},
{id:'c2',area:'m7c',from:'hansen',title:'Befristung per WhatsApp',src:SRC.TzBfG,
 msg:p=>`Kleine Änderung, ${NM(p)}: Ich stelle dich erstmal für 12 Monate befristet ein. Hiermit per WhatsApp vereinbart. Okay?`,
 opts:[
  {t:'Okay. WhatsApp ist ja auch schriftlich.',law:0,why:'Falsch. Eine Befristung braucht die Schriftform mit Unterschrift beider Seiten. WhatsApp reicht nicht.'},
  {t:'Eine Befristung muss schriftlich mit beiden Unterschriften vereinbart sein. Per WhatsApp ist sie unwirksam. Dann gilt mein Vertrag unbefristet.',law:2,why:'Richtig. Ohne Schriftform ist die Befristung unwirksam. Der Vertrag gilt als unbefristet.'},
  {t:'Befristungen sind nach der Ausbildung verboten.',law:0,why:'Falsch. Befristen ist erlaubt. Ohne sachlichen Grund höchstens 2 Jahre. Aber nur schriftlich.'}
 ],
 term:'Befristung',def:'Ein befristeter Vertrag endet automatisch. Die Befristung muss schriftlich mit Unterschrift beider Seiten vereinbart sein.',
 ihk:'Die Befristung eines Arbeitsvertrags bedarf zu ihrer Wirksamkeit der Schriftform. Fehlt sie, gilt der Vertrag als auf unbestimmte Zeit geschlossen.',
 weil:'… weil eine Befristung nur mit Schriftform und beiden Unterschriften wirksam ist.'},
{id:'c3',area:'m7c',from:'hansen',title:'Neun Monate Probezeit',src:null,
 msg:p=>`Die neue Kollegin aus Bremen fängt im August an. Ich schreibe ihr neun Monate Probezeit in den Vertrag. Dann kann ich sie lange schnell wieder loswerden.`,
 opts:[
  {t:'Neun Monate gehen nicht. Die Probezeit darf höchstens sechs Monate dauern. In der Zeit beträgt die Kündigungsfrist zwei Wochen.',law:2,why:'Richtig. Probezeit höchstens 6 Monate, Kündigungsfrist dann 2 Wochen.'},
  {t:'Das geht. Die Länge der Probezeit ist frei.',law:0,why:'Falsch. Die Probezeit darf höchstens 6 Monate dauern.'},
  {t:'Höchstens vier Monate – wie in der Ausbildung.',law:0,why:'Falsch. 1 bis 4 Monate gelten für die Ausbildung. Im Arbeitsvertrag sind bis zu 6 Monate möglich.'}
 ],
 term:'Probezeit',def:'Im Arbeitsvertrag höchstens 6 Monate. Kündigungsfrist dann 2 Wochen.',
 ihk:'Die Probezeit im Arbeitsverhältnis darf höchstens sechs Monate dauern. Während der Probezeit kann mit einer Frist von zwei Wochen gekündigt werden.',
 weil:'… weil die Probezeit höchstens sechs Monate dauern darf.'},
{id:'c4',area:'m7c',from:'merle',title:'Minijob ohne Rechte?',src:SRC.EFZG,
 msg:p=>`Ich habe bei euch einen Minijob, 550 € im Monat. Herr Hansen sagt: „Minijobber bekommen keinen Urlaub und bei Krankheit kein Geld.“ Ist das so?`,
 opts:[
  {t:'Ja. Minijobs sind keine richtigen Arbeitsverträge.',law:0,why:'Falsch. Minijobs sind normale Arbeitsverhältnisse.'},
  {t:'Nein. Auch du hast Anspruch auf Urlaub, auf Geld bei Krankheit und auf den Mindestlohn.',law:2,why:'Richtig. Urlaub, Entgeltfortzahlung (6 Wochen) und Mindestlohn gelten auch im Minijob.'},
  {t:'Urlaub bekommst du. Geld bei Krankheit aber nicht.',law:1,why:'Teilweise. Urlaub stimmt. Aber auch die Entgeltfortzahlung bei Krankheit gilt im Minijob.'}
 ],
 term:'Minijob',def:'Bis 633 € im Monat (Stand 2027). Urlaub, Entgeltfortzahlung und Mindestlohn gelten auch hier.',
 ihk:'Minijobber haben dieselben Rechte wie andere Arbeitnehmer: Anspruch auf Urlaub, Entgeltfortzahlung im Krankheitsfall und Mindestlohn. Der Arbeitgeber zahlt Pauschalbeiträge.',
 weil:'… weil Urlaub, Entgeltfortzahlung und Mindestlohn auch im Minijob gelten.'},
{id:'c5',area:'m7c',from:'ole',title:'Ole will weniger arbeiten',src:SRC.TzBfG,
 msg:p=>`Ich bin seit drei Jahren hier und will nur noch 25 Stunden arbeiten. Wegen meines Rückens. Herr Hansen sagt: „Teilzeit gibt es nur für Mütter.“ Hat er recht?`,
 opts:[
  {t:'Ja. Teilzeit gibt es nur mit Kindern.',law:0,why:'Falsch. Den Anspruch auf Teilzeit haben alle, nicht nur Eltern.'},
  {t:'Nein. Nach sechs Monaten im Betrieb hast du Anspruch auf Teilzeit. Wir haben mehr als 15 Beschäftigte.',law:2,why:'Richtig. Nach 6 Monaten besteht ein Anspruch auf Teilzeit, wenn der Betrieb mehr als 15 Beschäftigte hat. Kutter & Korb hat 18.'},
  {t:'Nein. Aber in Teilzeit verlierst du deinen Urlaub.',law:1,why:'Teilweise. Ole hat Anspruch auf Teilzeit. Er behält aber alle Rechte, auch Urlaub – anteilig.'}
 ],
 term:'Teilzeit',def:'Weniger Stunden, gleiche Rechte. Anspruch nach 6 Monaten in Betrieben mit mehr als 15 Beschäftigten.',
 ihk:'Teilzeitbeschäftigte haben die gleichen Rechte wie Vollzeitbeschäftigte (anteilig). Nach sechs Monaten besteht in Betrieben mit mehr als 15 Beschäftigten ein Anspruch auf Verringerung der Arbeitszeit.',
 weil:'… weil man nach sechs Monaten in einem Betrieb mit mehr als 15 Beschäftigten Anspruch auf Teilzeit hat.'},
{id:'c6',area:'m7c',from:'hansen',title:'„Gehalt nach Absprache“',src:SRC.NachwG,
 msg:p=>`Ich schreibe deine Bedingungen jetzt auf: Name, Beginn, „Gehalt nach Absprache“. Fertig. Mehr muss da nicht rein.`,
 opts:[
  {t:'Das reicht. Hauptsache, es steht etwas auf Papier.',law:0,why:'Falsch. Das Nachweisgesetz nennt viel mehr Pflichtangaben.'},
  {t:'Da fehlt viel: Arbeitsort, Tätigkeit, Probezeit, Gehalt mit Zuschlägen, Arbeitszeit, Urlaub, Kündigungsfristen und der Hinweis auf den Tarifvertrag.',law:2,why:'Richtig. Das sind die Pflichtangaben nach dem Nachweisgesetz.'},
  {t:'Es fehlt nur noch die genaue Gehaltssumme.',law:1,why:'Teilweise. Das Gehalt fehlt. Aber auch Arbeitszeit, Urlaub, Kündigungsfristen und der Hinweis auf den Tarifvertrag fehlen.'}
 ],
 term:'Inhalt des Arbeitsvertrags',def:'Namen, Beginn, Arbeitsort, Tätigkeit, Probezeit, Gehalt, Arbeitszeit, Urlaub, Kündigungsfristen, Hinweis auf Tarifvertrag.',
 ihk:'Nach dem Nachweisgesetz gehören in den Nachweis: Namen und Anschriften, Beginn, Arbeitsort, Tätigkeit, Probezeit, Gehalt und Zuschläge, Arbeitszeit, Urlaub, Kündigungsfristen und der Hinweis auf Tarifverträge und Betriebsvereinbarungen.',
 weil:'… weil das Nachweisgesetz diese Angaben vorschreibt.'},
/* ---------- Modul 8a: Rechte und Pflichten ---------- */
{id:'d1',area:'m8a',from:'tim',title:'Geschenkkörbe privat',src:SRC.HGB,
 msg:p=>`Du kennst doch die Stammkunden von Kutter & Korb. Mach abends privat Geschenkkörbe für sie. Zum halben Preis! Die Ware kaufen wir im Großhandel. Wir teilen den Gewinn.`,
 opts:[
  {t:'Gute Idee. Nach Feierabend darf ich machen, was ich will.',law:0,k:-8,why:'Falsch. Wer dem eigenen Betrieb mit dessen Kunden Konkurrenz macht, verletzt das Wettbewerbsverbot.'},
  {t:'Nein. Das wäre Konkurrenz für meinen eigenen Betrieb. Das verbietet das Wettbewerbsverbot. Es droht sogar eine fristlose Kündigung.',law:2,why:'Richtig. Während des Arbeitsverhältnisses darf man dem Betrieb keine Konkurrenz machen (§ 60 HGB). Folgen: Abmahnung, Kündigung, Schadenersatz.'},
  {t:'Nur wenn ich Herrn Hansen nichts davon erzähle.',law:0,k:-8,why:'Falsch. Das Verbot gilt auch heimlich. Fliegt es auf, droht die fristlose Kündigung.'}
 ],
 term:'Wettbewerbsverbot',def:'Dem eigenen Betrieb keine Konkurrenz machen.',
 ihk:'Der Arbeitnehmer darf während des Arbeitsverhältnisses dem Arbeitgeber keine Konkurrenz machen (Wettbewerbsverbot, § 60 HGB). Bei Verstößen drohen Abmahnung, Kündigung und Schadenersatz.',
 weil:'… weil man dem eigenen Betrieb während des Arbeitsverhältnisses keine Konkurrenz machen darf.'},
{id:'d2',area:'m8a',from:'tim',title:'Wann wird der Tresor geleert?',src:null,
 msg:p=>`Sag mal, wie viel Umsatz macht ihr samstags? Und wann bringt dein Chef das Geld zur Bank? Nur so aus Neugier.`,
 opts:[
  {t:'So 4.000 €. Das Geld bringt er immer um 18 Uhr weg.',law:0,k:-6,why:'Falsch. Umsatz und Geldwege sind Geschäftsgeheimnisse. Das verletzt die Schweigepflicht.'},
  {t:'Das sage ich dir nicht. Das sind Geschäftsgeheimnisse. Da habe ich Schweigepflicht.',law:2,why:'Richtig. Betriebs- und Geschäftsgeheimnisse muss man für sich behalten. Sonst drohen Abmahnung oder Kündigung.'},
  {t:'Den Umsatz sage ich dir. Nur den Termin für die Bank nicht.',law:1,why:'Teilweise. Auch der Umsatz ist ein Geschäftsgeheimnis.'}
 ],
 term:'Schweigepflicht',def:'Betriebs- und Geschäftsgeheimnisse für sich behalten.',
 ihk:'Der Arbeitnehmer muss Betriebs- und Geschäftsgeheimnisse wahren (Schweigepflicht). Verletzt er sie, drohen Abmahnung und Kündigung.',
 weil:'… weil Betriebs- und Geschäftsgeheimnisse unter die Schweigepflicht fallen.'},
{id:'d3',area:'m8a',from:'merle',title:'Das Gehalt kommt zu spät',src:SRC.BGB,
 msg:p=>`Herr Hansen zahlt seit zwei Monaten erst am 20. des nächsten Monats. Im Vertrag steht „zum Monatsende“. Ich muss meine Miete aber am 1. zahlen. Was kann ich tun?`,
 opts:[
  {t:'Nichts. Hauptsache, das Geld kommt irgendwann.',law:0,why:'Falsch. Der Arbeitgeber muss pünktlich zahlen.'},
  {t:'Er verletzt seine Vergütungspflicht. Du kannst pünktliche Zahlung verlangen und sogar Verzugszinsen.',law:2,why:'Richtig. Der Arbeitgeber muss das Gehalt pünktlich zahlen (Vergütungspflicht). Sonst kann man Zahlung und Verzugszinsen verlangen.'},
  {t:'Dann darfst du sofort fristlos kündigen und bekommst eine Abfindung.',law:0,why:'Falsch. Zuerst verlangt man pünktliche Zahlung. Eine Abfindung gibt es dafür nicht automatisch.'}
 ],
 term:'Vergütungspflicht',def:'Der Arbeitgeber muss das Gehalt pünktlich zahlen.',
 ihk:'Der Arbeitgeber hat die Pflicht, das vereinbarte Gehalt pünktlich zu zahlen (Vergütungspflicht). Zahlt er zu spät, kann der Arbeitnehmer Zahlung und Verzugszinsen verlangen.',
 weil:'… weil der Arbeitgeber das Gehalt pünktlich zahlen muss.'},
{id:'d4',area:'m8a',from:'hansen',title:'26 oder 30 Tage Urlaub?',src:SRC.TVG,
 msg:p=>`In deinem Vertrag stehen 26 Arbeitstage Urlaub. Der Tarifvertrag sagt 30. Bei uns gilt der Tarifvertrag. Aber Vertrag ist Vertrag – also 26.`,
 opts:[
  {t:'Stimmt. Was ich unterschrieben habe, gilt.',law:0,why:'Falsch. Gilt der Tarifvertrag, darf der Arbeitsvertrag ihn nicht verschlechtern.'},
  {t:'Nein. Der Arbeitsvertrag darf den Tarifvertrag nicht verschlechtern. Es gilt die günstigere Regel: 30 Tage.',law:2,why:'Richtig. Rangfolge und Günstigkeitsprinzip: Es gilt die für den Arbeitnehmer günstigere Regel.'},
  {t:'Nein. Es gelten 20 Tage. Das Gesetz steht immer über allem.',law:0,why:'Falsch. Das Gesetz ist nur die Untergrenze. Tarifvertrag und Vertrag dürfen mehr geben.'}
 ],
 term:'Günstigkeitsprinzip',def:'Weichen Regeln voneinander ab, gilt die für den Arbeitnehmer günstigere.',
 ihk:'Rangfolge: Gesetz – Tarifvertrag – Betriebsvereinbarung – Arbeitsvertrag. Die untere Stufe darf die obere nicht verschlechtern. Es gilt die für den Arbeitnehmer günstigere Regel (Günstigkeitsprinzip).',
 weil:'… weil bei Abweichungen die für den Arbeitnehmer günstigere Regel gilt.'},
{id:'d5',area:'m8a',from:'hansen',title:'20 Minuten Pause',src:SRC.ArbZG,
 msg:p=>`Ich habe in alle neuen Verträge geschrieben: „Bei 8 Stunden Arbeit 20 Minuten Pause.“ Wer unterschreibt, ist einverstanden.`,
 opts:[
  {t:'Das ist unwirksam. Das Arbeitszeitgesetz verlangt bei mehr als 6 Stunden 30 Minuten Pause. Das Gesetz steht über dem Vertrag.',law:2,why:'Richtig. Ein Vertrag darf das Gesetz nicht verschlechtern.'},
  {t:'Wer unterschreibt, ist selbst schuld.',law:0,why:'Falsch. Auch mit Unterschrift gilt das Gesetz. Die Klausel ist unwirksam.'},
  {t:'Das ist unwirksam. Es müssen 60 Minuten sein.',law:1,why:'Teilweise. Unwirksam stimmt. Aber Erwachsene brauchen bei mehr als 6 Stunden 30 Minuten. 60 Minuten gelten für Jugendliche.'}
 ],
 term:'Rangfolge der Regeln',def:'Grundgesetz → Gesetz → Tarifvertrag → Betriebsvereinbarung → Arbeitsvertrag.',
 ihk:'Ein Arbeitsvertrag darf gesetzliche Mindestregeln nicht unterschreiten. Bei mehr als 6 Stunden Arbeit sind mindestens 30 Minuten Pause vorgeschrieben (§ 4 ArbZG).',
 weil:'… weil das Arbeitszeitgesetz über dem Arbeitsvertrag steht.'},
{id:'d6',area:'m8a',from:'hansen',title:'Krank – und dann?',src:SRC.EFZG,
 msg:p=>`${NM(p)}, nur damit das klar ist: Wenn du mal krank bist, meldest du dich einfach, wenn du wieder da bist. Ich will nicht morgens angerufen werden.`,
 opts:[
  {t:'Okay. Dann sage ich erst Bescheid, wenn ich wieder komme.',law:0,why:'Falsch. Krankheit muss man sofort melden (Anzeigepflicht).'},
  {t:'Ich muss mich sofort krankmelden. Ab dem 4. Tag brauche ich eine Bescheinigung vom Arzt. Sie dürfen sie auch schon ab dem 1. Tag verlangen.',law:2,why:'Richtig. Krankheit sofort melden. Ab dem 4. Kalendertag braucht man eine Krankschreibung. Der Betrieb darf sie früher verlangen.'},
  {t:'Ich muss mich sofort melden. Eine Krankschreibung brauche ich nie.',law:1,why:'Teilweise. Sofort melden stimmt. Ab dem 4. Tag braucht man aber eine ärztliche Bescheinigung.'}
 ],
 term:'Anzeigepflicht',def:'Krankheit sofort dem Betrieb melden. Ab dem 4. Tag eine ärztliche Bescheinigung.',
 ihk:'Der Arbeitnehmer muss eine Arbeitsunfähigkeit unverzüglich melden. Dauert sie länger als drei Kalendertage, braucht er eine ärztliche Bescheinigung; der Arbeitgeber darf sie früher verlangen.',
 weil:'… weil man eine Krankheit sofort melden muss und ab dem 4. Tag eine Bescheinigung braucht.'},
/* ---------- Sozialversicherung (Wiederholung M1–6) ---------- */
{id:'s1',area:'sv',from:'merle',title:'Wo melde ich mich an?',src:SRC.SGB,
 msg:p=>`Unsere neue Kollegin fragt: „Muss ich mich selbst bei der Rentenversicherung und der Krankenkasse anmelden?“`,
 opts:[
  {t:'Ja. Jede Versicherung muss man selbst anmelden.',law:0,why:'Falsch. Das macht der Arbeitgeber.'},
  {t:'Nein. Sie sucht sich eine Krankenkasse aus. Der Betrieb meldet sie dort an und überweist alle Beiträge an die Krankenkasse.',law:2,why:'Richtig. Der Arbeitgeber meldet bei der gewählten Krankenkasse an. Die Krankenkasse ist die Einzugsstelle und verteilt das Geld.'},
  {t:'Nein. Der Betrieb überweist alle Beiträge direkt an die Rentenversicherung.',law:0,why:'Falsch. Der Gesamtsozialversicherungsbeitrag geht an die Krankenkasse. Sie verteilt ihn weiter.'}
 ],
 term:'Einzugsstelle',def:'Die Krankenkasse sammelt alle Beiträge ein und verteilt sie an Renten-, Arbeitslosen- und Pflegeversicherung.',
 ihk:'Der Arbeitgeber meldet den Beschäftigten bei der Krankenkasse an, zieht den Arbeitnehmeranteil vom Gehalt ab und überweist den Gesamtsozialversicherungsbeitrag an die Krankenkasse (Einzugsstelle).',
 weil:'… weil der Arbeitgeber anmeldet und die Krankenkasse die Beiträge einzieht.'},
{id:'s2',area:'sv',from:'hansen',title:'18,6 % für die Rente?',src:SRC.SGB,
 msg:p=>`Deine erste Abrechnung, ${NM(p)}: 2.500 € brutto. Für die Rentenversicherung ziehe ich dir 18,6 % ab, also 465 €.`,
 opts:[
  {t:'18,6 % ist der ganze Beitrag. Ich zahle nur die Hälfte: 9,3 %, also 232,50 €.',law:2,why:'Richtig. 2.500 € × 9,3 : 100 = 232,50 €. Den Rest zahlt der Arbeitgeber.'},
  {t:'Stimmt so. Die Rente zahle ich ganz allein.',law:0,k:0,why:'Falsch. Rentenbeiträge zahlen Arbeitnehmer und Arbeitgeber je zur Hälfte.'},
  {t:'Ich zahle die Hälfte, also 9,3 % = 23,25 €.',law:1,why:'Teilweise. 9,3 % stimmt. Aber falsch gerechnet: 2.500 € × 9,3 : 100 = 232,50 €.'}
 ],
 term:'Arbeitnehmeranteil',def:'Kranken-, Pflege-, Renten- und Arbeitslosenversicherung: je zur Hälfte. Unfallversicherung: nur der Arbeitgeber.',
 ihk:'Beitrag = Bruttogehalt × Arbeitnehmersatz : 100. Rentenversicherung 2027: 18,6 %, davon trägt der Arbeitnehmer 9,3 %.',
 weil:'… weil Arbeitnehmer und Arbeitgeber den Rentenbeitrag je zur Hälfte zahlen.'},
{id:'s3',area:'sv',from:'hansen',title:'Pflegeversicherung: 2,7 %?',src:SRC.SGB,
 msg:p=>`Bei der Pflegeversicherung habe ich dir 2,7 % abgezogen. Das stimmt doch, oder?`,
 note:p=>`${NM(p)}: ${p.a.txt}, ${p.a.kid?'ein Kind':'keine Kinder'}.`,
 opts:[
  {t:p=>p.a.kid?'Stimmt – ich habe zwar ein Kind, aber über 23 zahlen alle den Zuschlag.':'Stimmt. Ich bin kinderlos und über 23. Dann kommen 0,9 % Zuschlag zu den 1,8 % dazu.',law:p=>(!p.a.kid&&p.a.age>=23)?2:0,why:p=>(!p.a.kid&&p.a.age>=23)?'Richtig. Kinderlose ab 23 zahlen 0,9 % Zuschlag allein: 1,8 % + 0,9 % = 2,7 %.':'Falsch. Den Zuschlag von 0,9 % zahlen nur Kinderlose ab 23.'},
  {t:p=>p.a.kid?'Falsch. Ich habe ein Kind. Ich zahle nur meine Hälfte: 1,8 %.':p.a.age<23?'Falsch. Ich bin unter 23. Ich zahle nur meine Hälfte: 1,8 %.':'Falsch. Ich zahle immer nur die Hälfte: 1,8 %.',law:p=>(!p.a.kid&&p.a.age>=23)?0:2,why:p=>(!p.a.kid&&p.a.age>=23)?'Falsch. Kinderlose ab 23 zahlen 0,9 % Zuschlag. Also 2,7 %.':'Richtig. Den Zuschlag zahlen nur Kinderlose ab 23. Hier gilt die halbe Pflegeversicherung: 1,8 %.'},
  {t:'Die Pflegeversicherung zahlt der Arbeitgeber ganz allein.',law:0,why:'Falsch. Das gilt nur für die Unfallversicherung.'}
 ],
 term:'Zuschlag für Kinderlose',def:'In der Pflegeversicherung zahlen Kinderlose ab 23 einen Zuschlag (2027: 0,9 %) allein.',
 ihk:'Pflegeversicherung 3,6 %, je zur Hälfte. Kinderlose ab 23 zahlen einen Zuschlag (2027 geplant: 0,9 %) allein.',
 weil:'… weil nur Kinderlose ab 23 den Zuschlag zur Pflegeversicherung zahlen.'},
{id:'s4',area:'sv',from:'ole',title:'Acht Wochen krank',src:SRC.EFZG,
 msg:p=>`Ich bin seit acht Wochen krank, wegen meines Rückens. Herr Hansen zahlt kein Gehalt mehr! Ist das nicht Betrug?`,
 opts:[
  {t:'Ja. Der Betrieb muss bei Krankheit immer weiterzahlen.',law:0,why:'Falsch. Der Betrieb zahlt nur 6 Wochen.'},
  {t:'Nein. Der Betrieb zahlt 6 Wochen. Ab der 7. Woche zahlt deine Krankenkasse Krankengeld: 70 % vom Brutto, höchstens 90 % vom Netto.',law:2,why:'Richtig. 6 Wochen Entgeltfortzahlung, danach Krankengeld der Krankenkasse.'},
  {t:'Nein. Ab der 7. Woche bekommst du Arbeitslosengeld.',law:0,why:'Falsch. Ole ist nicht arbeitslos. Er bekommt Krankengeld von der Krankenkasse.'}
 ],
 term:'Krankengeld',def:'Ab der 7. Woche: 70 % vom Brutto, höchstens 90 % vom Netto, von der Krankenkasse.',
 ihk:'Die ersten 6 Wochen zahlt der Arbeitgeber das Gehalt weiter (Entgeltfortzahlung). Ab der 7. Woche zahlt die Krankenkasse Krankengeld: 70 % vom Brutto, höchstens 90 % vom Netto.',
 weil:'… weil der Betrieb nur 6 Wochen zahlt und danach die Krankenkasse Krankengeld zahlt.'},
{id:'s5',area:'sv',from:'ole',title:'Eine Kur für den Rücken',src:SRC.SGB,
 msg:p=>`Meine Ärztin sagt, ich soll drei Wochen zur Kur, damit ich weiter arbeiten kann. Wer bezahlt das?`,
 opts:[
  {t:'Die Rentenversicherung. Sie zahlt Reha, damit du arbeitsfähig bleibst.',law:2,why:'Richtig. „Reha vor Rente“: Die Rentenversicherung zahlt, damit sie später keine Erwerbsminderungsrente zahlen muss.'},
  {t:'Die Berufsgenossenschaft.',law:0,why:'Falsch. Die BG zahlt nur nach Arbeitsunfällen und bei Berufskrankheiten.'},
  {t:'Die Agentur für Arbeit.',law:0,why:'Falsch. Die Agentur hilft bei Arbeitslosigkeit und Weiterbildung.'}
 ],
 term:'Reha vor Rente',def:'Die Rentenversicherung zahlt Kuren, damit man arbeitsfähig bleibt.',
 ihk:'Die Deutsche Rentenversicherung übernimmt die Kosten für Kuren zur Erhaltung der Arbeitsfähigkeit (IHK Winter 2021/22, Aufgabe 20).',
 weil:'… weil die Rentenversicherung Reha zahlt, damit man arbeitsfähig bleibt.'},
{id:'s6',area:'sv',from:'hansen',title:'Merle kündigt selbst',src:SRC.SGB,
 msg:p=>`Merle will selbst kündigen. Sie hat keine Lust mehr auf Samstage. Sie sagt: „Dann bekomme ich eben Arbeitslosengeld.“ Stimmt das?`,
 opts:[
  {t:'Ja. Arbeitslosengeld gibt es sofort.',law:0,why:'Falsch. Bei einer eigenen Kündigung ohne wichtigen Grund gibt es eine Sperrzeit.'},
  {t:'Nicht sofort. Wer ohne wichtigen Grund selbst kündigt, bekommt 12 Wochen Sperrzeit.',law:2,why:'Richtig. Eigene Kündigung ohne wichtigen Grund: 12 Wochen Sperrzeit.'},
  {t:'Nein. Wer selbst kündigt, bekommt nie Arbeitslosengeld.',law:1,why:'Teilweise. Es gibt eine Sperrzeit von 12 Wochen. Danach gibt es Arbeitslosengeld.'}
 ],
 term:'Sperrzeit',def:'Eine Zeit ohne Arbeitslosengeld. Eigene Kündigung ohne wichtigen Grund: 12 Wochen.',
 ihk:'Wer selbst kündigt oder einen Aufhebungsvertrag schließt, ohne einen wichtigen Grund zu haben, erhält eine Sperrzeit von 12 Wochen.',
 weil:'… weil eine eigene Kündigung ohne wichtigen Grund 12 Wochen Sperrzeit bringt.'},
/* ---------- Unfall (Wiederholung M5) ---------- */
{id:'u1',area:'unf',from:'hansen',title:'Kemal im Kühlraum',src:SRC.SGB,
 msg:p=>`Kemal ist im Kühlraum ausgerutscht. Handgelenk gebrochen, vier Wochen krank. Pflaster drauf und gut. Verbandbuch und Berufsgenossenschaft brauchen wir nicht, oder?`,
 opts:[
  {t:'Doch. Wir tragen es ins Verbandbuch ein. Er geht zum D-Arzt. Und weil er mehr als 3 Tage krank ist, schicken Sie innerhalb von 3 Tagen eine Unfallanzeige an die BG.',law:2,s:6,why:'Richtig. Verbandbuch, Durchgangsarzt und Unfallanzeige an die BG bei mehr als 3 Tagen Arbeitsunfähigkeit.'},
  {t:'Stimmt. Die BG muss nur bei Todesfällen informiert werden.',law:0,k:-6,why:'Falsch. Ab mehr als 3 Tagen Arbeitsunfähigkeit muss der Betrieb eine Unfallanzeige schicken.'},
  {t:'Wir tragen es ins Verbandbuch ein. Das reicht.',law:1,why:'Teilweise. Das Verbandbuch ist richtig. Bei mehr als 3 Tagen Arbeitsunfähigkeit kommt die Unfallanzeige an die BG dazu.'}
 ],
 term:'Unfallanzeige',def:'Bei mehr als 3 Tagen Arbeitsunfähigkeit schickt der Arbeitgeber innerhalb von 3 Tagen eine Unfallanzeige an die BG.',
 ihk:'Ist ein Beschäftigter nach einem Arbeitsunfall mehr als drei Tage arbeitsunfähig, muss der Arbeitgeber innerhalb von drei Tagen eine Unfallanzeige an die Berufsgenossenschaft erstatten.',
 weil:'… weil bei mehr als drei Tagen Arbeitsunfähigkeit eine Unfallanzeige an die BG Pflicht ist.'},
{id:'u2',area:'unf',from:'merle',title:'Unfall beim Einkaufen',src:SRC.SGB,
 msg:p=>`Ich war nach der Arbeit noch im Supermarkt einkaufen. Dort bin ich gestolpert. Ist das ein Wegeunfall?`,
 opts:[
  {t:'Ja. Alles auf dem Heimweg ist versichert.',law:0,why:'Falsch. Private Unterbrechungen wie Einkaufen sind nicht versichert.'},
  {t:'Nein. Das Einkaufen ist eine private Unterbrechung. Dann zahlt die Krankenkasse, nicht die BG.',law:2,why:'Richtig. Versichert ist nur der direkte Weg. Während privater Unterbrechungen besteht kein Schutz der Unfallversicherung.'},
  {t:'Ja, wenn der Supermarkt auf dem Heimweg liegt.',law:0,why:'Falsch. Auch dann: Während des Einkaufs ist man nicht versichert.'}
 ],
 term:'Wegeunfall',def:'Unfall auf dem direkten Weg zur Arbeit oder zurück. Umwege zur Kita oder für eine Fahrgemeinschaft sind versichert, Einkaufen nicht.',
 ihk:'Die Berufsgenossenschaft übernimmt Heilkosten für Unfälle, die auf dem direkten Weg zur Arbeit passieren (IHK Sommer 2020, Aufgabe 24). Private Unterbrechungen sind nicht versichert.',
 weil:'… weil nur der direkte Weg versichert ist und Einkaufen privat ist.'},
{id:'u3',area:'unf',from:'svea',title:'Umweg über die Kita',src:SRC.SGB,
 msg:p=>`Ich bringe morgens meinen Sohn in die Kita. Das ist ein Umweg. Heute bin ich auf dem Kita-Parkplatz ausgerutscht. Zahlt die BG?`,
 opts:[
  {t:'Ja. Der Umweg zur Kinderbetreuung ist versichert. Das ist ein Wegeunfall.',law:2,why:'Richtig. Umwege, um Kinder in die Kita zu bringen, sind versichert.'},
  {t:'Nein. Nur der direkte Weg ist versichert.',law:0,why:'Falsch. Der Umweg zur Kita ist ausdrücklich versichert.'},
  {t:'Nein. Die Kita gehört zur Freizeit.',law:0,why:'Falsch. Der Weg zur Kinderbetreuung ist versichert.'}
 ],
 term:'Versicherter Umweg',def:'Umwege zur Kita oder für eine Fahrgemeinschaft sind versichert.',
 ihk:'Versichert sind auch Umwege, um Kinder zur Kita zu bringen, oder für eine Fahrgemeinschaft.',
 weil:'… weil der Umweg zur Kinderbetreuung zur versicherten Strecke gehört.'},
{id:'u4',area:'unf',from:'hansen',title:'Kundin rutscht aus',src:null,
 msg:p=>`Eine Kundin ist vor der Fischtheke ausgerutscht. Das zahlt doch unsere Berufsgenossenschaft, oder?`,
 opts:[
  {t:'Ja. Alles, was im Laden passiert, zahlt die BG.',law:0,why:'Falsch. Kunden sind nicht über die BG versichert.'},
  {t:'Nein. Kunden sind nicht unfallversichert. Hier zahlt eventuell die Haftpflichtversicherung des Ladens.',law:2,why:'Richtig. Die BG versichert Beschäftigte. Für Kunden haftet ggf. die Haftpflichtversicherung des Geschäfts.'},
  {t:'Nein. Das zahlt die Krankenkasse von Kutter & Korb.',law:0,why:'Falsch. Ein Geschäft hat keine Krankenkasse. Es geht um die Haftpflichtversicherung.'}
 ],
 term:'Wer ist versichert?',def:'Die BG versichert Beschäftigte, Azubis, Minijobber, auch Schüler – aber keine Kunden.',
 ihk:'Kunden sind nicht über die Berufsgenossenschaft versichert. Heilkosten für den Unfall eines Kunden übernimmt die BG nicht (IHK Sommer 2020, Aufgabe 24).',
 weil:'… weil die Berufsgenossenschaft nur Beschäftigte versichert.'},
/* ---------- Modul 10a: Die BG kommt ---------- */
{id:'e1',area:'m10a',from:'weiss',title:'Wer ist verantwortlich?',src:SRC.ArbSchG,
 msg:p=>`Guten Tag, ich bin Frau Weiß von der BGHW. Ich schaue mir heute Ihren Laden an. Erste Frage: Wer ist hier für den Arbeitsschutz verantwortlich?`,
 opts:[
  {t:'Jeder für sich selbst.',law:0,why:'Falsch. Alle müssen mitmachen. Die Verantwortung trägt aber der Arbeitgeber.'},
  {t:'Herr Hansen als Arbeitgeber. Er muss Gefahren beurteilen, Schutzmaßnahmen treffen und uns unterweisen.',law:2,why:'Richtig. Nach dem Arbeitsschutzgesetz trägt der Arbeitgeber die Verantwortung.'},
  {t:'Die Berufsgenossenschaft. Sie sind doch dafür da.',law:0,why:'Falsch. Die BG berät und kontrolliert. Verantwortlich ist der Arbeitgeber.'}
 ],
 term:'Gefährdungsbeurteilung',def:'Der Arbeitgeber prüft, welche Gefahren es gibt, und trifft Schutzmaßnahmen.',
 ihk:'Der Arbeitgeber ist verantwortlich: Er muss Gefahren beurteilen (Gefährdungsbeurteilung), Schutzmaßnahmen treffen und die Beschäftigten unterweisen (Arbeitsschutzgesetz).',
 weil:'… weil nach dem Arbeitsschutzgesetz der Arbeitgeber verantwortlich ist.'},
{id:'e2',area:'m10a',from:'hansen',title:'Die Unterweisung',src:SRC.ArbSchG,
 msg:p=>`Unser neuer Azubi fängt Montag an. Die Unfallverhütungsvorschriften hängen im Pausenraum. Er soll sie lesen. Das reicht als Unterweisung.`,
 opts:[
  {t:'Das reicht. Wer lesen kann, ist unterwiesen.',law:0,why:'Falsch. Ein Aushang ersetzt keine Unterweisung.'},
  {t:'Nein. Er muss vor dem ersten Arbeitstag unterwiesen werden – verständlich und für seinen Arbeitsplatz. Bei Jugendlichen alle sechs Monate wieder.',law:2,why:'Richtig. Unterweisung bei der Einstellung und regelmäßig, Jugendliche halbjährlich. Sie wird dokumentiert und unterschrieben.'},
  {t:'Nein. Er muss nach sechs Monaten unterwiesen werden.',law:0,why:'Falsch. Die Unterweisung kommt vor Arbeitsbeginn, nicht erst nach sechs Monaten.'}
 ],
 term:'Unterweisung',def:'Bei der Einstellung und regelmäßig (mind. einmal im Jahr, Jugendliche halbjährlich), während der Arbeitszeit.',
 ihk:'Die Unterweisungen sind bei Neueinstellungen sowie in regelmäßigen Abständen notwendig (IHK Sommer 2026, Aufgabe 29).',
 weil:'… weil der Arbeitgeber vor Arbeitsbeginn und danach regelmäßig unterweisen muss.'},
{id:'e3',area:'m10a',from:'hansen',title:'Wer macht die UVV?',src:SRC.UVV,
 msg:p=>`Wer erlässt eigentlich diese Unfallverhütungsvorschriften? Die Gewerbeaufsicht?`,
 opts:[
  {t:'Die Berufsgenossenschaft. Die Vorschriften sind verbindlich und müssen im Betrieb aushängen.',law:2,why:'Richtig. Die BG erlässt die UVV. Sie sind verbindlich.'},
  {t:'Die Gewerbeaufsicht.',law:0,why:'Falsch. Die Gewerbeaufsicht überwacht die Gesetze. Die UVV erlässt die Berufsgenossenschaft.'},
  {t:'Der Handelsverband.',law:0,why:'Falsch. Der Handelsverband ist der Arbeitgeberverband. Er erlässt keine UVV.'}
 ],
 term:'Unfallverhütungsvorschriften (UVV)',def:'Von der Berufsgenossenschaft erlassen, verbindlich, im Betrieb ausgehängt.',
 ihk:'Die verbindlichen Unfallverhütungsvorschriften erlässt die zuständige Berufsgenossenschaft (IHK Sommer 2026, Aufgabe 27).',
 weil:'… weil die Berufsgenossenschaft die Unfallverhütungsvorschriften erlässt.'},
{id:'e4',area:'m10a',from:'hansen',title:'Ole als Sicherheitsbeauftragter',src:null,
 msg:p=>`Ich mache Ole zum Sicherheitsbeauftragten. Dann haftet er, wenn etwas passiert. Und ich bin fein raus.`,
 opts:[
  {t:'Gute Idee. Dann ist Ole verantwortlich.',law:0,why:'Falsch. Der Sicherheitsbeauftragte haftet nicht.'},
  {t:'Ole kann Sie unterstützen und auf Mängel achten. Haften muss er nicht. Die Verantwortung bleibt bei Ihnen.',law:2,why:'Richtig. Der Sicherheitsbeauftragte unterstützt die Geschäftsleitung. Er haftet nicht und ist kein Vorgesetzter.'},
  {t:'Dann ist Ole ab jetzt Chef im Lager. Alle müssen tun, was er sagt.',law:0,why:'Falsch. Der Sicherheitsbeauftragte ist kein Vorgesetzter.'}
 ],
 term:'Sicherheitsbeauftragter',def:'Ein Kollege, der den Arbeitgeber unterstützt. Er haftet nicht und ist kein Vorgesetzter.',
 ihk:'Der Sicherheitsbeauftragte unterstützt die Geschäftsleitung bei der Unfallverhütung (IHK Sommer 2026, Aufgabe 28). Er haftet nicht.',
 weil:'… weil der Sicherheitsbeauftragte nur unterstützt und nicht haftet.'},
{id:'e5',area:'m10a',from:'hansen',title:'Wer kann uns dichtmachen?',src:null,
 msg:p=>`Frau Weiß war streng. Wer kann uns eigentlich ein Bußgeld geben oder den Laden zumachen, wenn wir die Gesetze nicht einhalten?`,
 opts:[
  {t:'Die Gewerbeaufsicht. Sie ist eine staatliche Behörde. Sie kann Bußgelder verhängen und Betriebsteile stilllegen.',law:2,why:'Richtig. Die Gewerbeaufsicht überwacht die Arbeitsschutzgesetze und kann Bußgelder verhängen und Betriebsteile stilllegen.'},
  {t:'Der Sicherheitsbeauftragte.',law:0,why:'Falsch. Er ist ein Kollege und hat keine solche Macht.'},
  {t:'Niemand. Arbeitsschutz ist nur eine Empfehlung.',law:0,k:-6,why:'Falsch. Arbeitsschutz ist Pflicht. Die Gewerbeaufsicht kontrolliert das.'}
 ],
 term:'Gewerbeaufsicht',def:'Staatliche Behörde: überwacht die Arbeitsschutzgesetze, verhängt Bußgelder, kann Betriebsteile stilllegen.',
 ihk:'Die Gewerbeaufsicht (staatliche Behörde) überwacht die Einhaltung der Arbeitsschutzgesetze. Sie kann Bußgelder verhängen und Betriebsteile stilllegen.',
 weil:'… weil die Gewerbeaufsicht als staatliche Behörde die Gesetze überwacht.'},
{id:'e6',area:'m10a',from:'hansen',title:'Ersthelfer?',src:SRC.UVV,
 msg:p=>`Ersthelfer brauchen wir doch nicht. Bei einem Unfall kommt der Notarzt.`,
 opts:[
  {t:'Doch. Im Handel müssen mindestens 5 % der Beschäftigten Ersthelfer sein. Die BG schult sie.',law:2,why:'Richtig. Im Handel mindestens 5 % Ersthelfer. Die BG bildet sie aus.'},
  {t:'Doch. Alle Beschäftigten müssen in Erster Hilfe ausgebildet sein.',law:1,why:'Teilweise. Ersthelfer braucht man. Aber nicht alle müssen ausgebildet sein, im Handel mindestens 5 %.'},
  {t:'Stimmt. Der Notarzt reicht.',law:0,why:'Falsch. Bis der Notarzt kommt, vergeht Zeit. Darum braucht jeder Betrieb Ersthelfer.'}
 ],
 term:'Ersthelfer',def:'Leisten Erste Hilfe bis der Rettungsdienst kommt. Im Handel mindestens 5 % der Beschäftigten.',
 ihk:'Ersthelfer und Brandschutzhelfer leisten Erste Hilfe bzw. bekämpfen Entstehungsbrände; im Handel mindestens 5 % der Beschäftigten. Nicht jeder Mitarbeiter muss in Erster Hilfe ausgebildet sein.',
 weil:'… weil im Handel mindestens 5 % der Beschäftigten Ersthelfer sein müssen.'},
{id:'e7',area:'m10a',from:'ole',title:'Die Schuhe drücken',src:SRC.ArbSchG,
 msg:p=>`Die Sicherheitsschuhe im Lager drücken. Ich ziehe wieder meine Turnschuhe an. Ist ja mein Fuß.`,
 opts:[
  {t:'Wenn die Gefährdungsbeurteilung Sicherheitsschuhe vorschreibt, musst du sie tragen. Sonst verletzt du deine Pflichten. Lass dir passende geben.',law:2,why:'Richtig. Beschäftigte müssen die Schutzausrüstung benutzen. Sonst ist eine Abmahnung möglich.'},
  {t:'Stimmt. Jeder entscheidet selbst über seine Sicherheit.',law:0,why:'Falsch. Sicherheitsbestimmungen sind Pflicht für alle (IHK Sommer 2026, Aufgabe 25).'},
  {t:'Dann trag sie nur, wenn Frau Weiß von der BG da ist.',law:0,why:'Falsch. Die Schutzausrüstung schützt immer, nicht nur bei Kontrollen.'}
 ],
 term:'Schutzausrüstung',def:'Beschäftigte müssen vorgeschriebene Schutzausrüstung benutzen.',
 ihk:'Alle Beschäftigten müssen Weisungen befolgen und die vorgeschriebene Schutzausrüstung benutzen. Niemand kann selbst entscheiden, welche Sicherheitsbestimmungen er einhält.',
 weil:'… weil Beschäftigte die vorgeschriebene Schutzausrüstung benutzen müssen.'},
/* ---------- Modul 10b: Gefahren im Laden ---------- */
{id:'g1',area:'m10b',from:'ole',title:'Schnell auf die Kiste',src:SRC.UVV,
 msg:p=>`Die Leiter steht hinten im Kühlraum. Ich steige schnell auf eine Fischkiste, um an das oberste Regal zu kommen. Dauert nur eine Sekunde.`,
 opts:[
  {t:'Stopp! Absturzgefahr. Hol die Leiter oder einen Tritt.',law:2,why:'Richtig. Kisten sind keine Leiter. Immer Leiter oder Tritt benutzen.'},
  {t:'Okay, aber halte dich gut fest.',law:0,why:'Falsch. Kisten können kippen. Absturzgefahr.'},
  {t:'Ich halte die Kiste fest, dann geht das.',law:0,why:'Falsch. Auch festgehalten bleibt die Kiste kein sicheres Arbeitsmittel.'}
 ],
 term:'Geeignetes Arbeitsmittel',def:'Zum Hochsteigen nur Leiter oder Tritt benutzen – keine Kisten oder Stühle.',
 ihk:'Zum Erreichen hoher Regale sind geeignete Arbeitsmittel wie Leitern oder Tritte zu benutzen. Wer auf Kisten steigt, riskiert einen Absturz.',
 weil:'… weil Kisten kippen können und nur Leiter oder Tritt sichere Arbeitsmittel sind.'},
{id:'g2',area:'m10b',from:'hansen',title:'Körbe vor dem Notausgang',src:SRC.ArbStaettV,
 msg:p=>`Im Advent haben wir 200 Geschenkkörbe. Stell die Rollcontainer vor den Notausgang. Ist ja nur bis Weihnachten.`,
 opts:[
  {t:'Das geht nicht. Notausgänge und Fluchtwege müssen immer frei sein.',law:2,why:'Richtig. Notausgänge und Fluchtwege immer frei halten (Arbeitsstättenverordnung).'},
  {t:'Okay. Im Notfall schieben wir sie schnell weg.',law:0,why:'Falsch. Im Notfall zählt jede Sekunde. Der Notausgang muss frei sein.'},
  {t:'Okay, aber nur nachts, wenn keine Kunden da sind.',law:0,why:'Falsch. Auch dann muss der Notausgang frei bleiben.'}
 ],
 term:'Fluchtweg',def:'Notausgänge und Fluchtwege müssen immer frei sein.',
 ihk:'Notausgänge und Fluchtwege sind immer frei zu halten (Arbeitsstättenverordnung). Die Gewerbeaufsicht kann bei Verstößen Bußgelder verhängen.',
 weil:'… weil Notausgänge und Fluchtwege immer frei sein müssen.'},
{id:'g3',area:'m10b',from:'merle',title:'Keil unter die Tür',src:null,
 msg:p=>`Die schwere Brandschutztür zum Lager fällt immer zu. Ich schiebe einen Holzkeil drunter. Dann geht das Einräumen schneller.`,
 opts:[
  {t:'Bitte nicht. Im Brandfall breiten sich sonst Feuer und Rauch aus. Brandschutztüren nie verkeilen.',law:2,why:'Richtig. Brandschutztüren müssen von selbst schließen können.'},
  {t:'Gute Idee. Dann kommen auch die Feuerwehrleute schneller rein.',law:0,why:'Falsch. Eine offene Brandschutztür lässt Rauch und Feuer durch (IHK Winter 2021/22, Aufgabe 21).'},
  {t:'Okay, aber nur, wenn ich dabei bin.',law:1,why:'Teilweise. Auch kurz offen ist riskant. Brandschutztüren dürfen nicht verkeilt werden.'}
 ],
 term:'Brandschutztür',def:'Muss von selbst schließen. Nie mit Keil offen halten.',
 ihk:'Die Brandschutztür zwischen Lager- und Verkaufsraum darf nicht offen stehen, sonst breiten sich Feuer und Rauch aus (IHK Winter 2021/22, Aufgabe 21).',
 weil:'… weil sich durch eine offene Brandschutztür Feuer und Rauch ausbreiten.'},
{id:'g4',area:'m10b',from:'kemal',title:'Wasserkocher vom Flohmarkt',src:SRC.ProdSG,
 msg:p=>`Ich habe für den Pausenraum einen Wasserkocher vom Flohmarkt mitgebracht. Da ist kein CE-Zeichen drauf. Egal, oder?`,
 opts:[
  {t:'Nicht benutzen. Ohne CE-Zeichen ist nicht erklärt, dass er die EU-Vorgaben erfüllt. Wir melden das.',law:2,why:'Richtig. Geräte müssen sicher sein. CE: Der Hersteller erklärt, dass er die EU-Vorgaben erfüllt.'},
  {t:'Egal. Hauptsache, er kocht.',law:0,why:'Falsch. Ein unsicheres Gerät kann einen Stromschlag oder Brand verursachen.'},
  {t:'Das GS-Zeichen ist sowieso Pflicht. Ohne das darf man nie etwas benutzen.',law:0,why:'Falsch. Das GS-Zeichen („geprüfte Sicherheit“) ist freiwillig. Das CE-Zeichen fehlt hier.'}
 ],
 term:'CE- und GS-Zeichen',def:'CE: Hersteller erklärt, dass EU-Vorgaben erfüllt sind. GS: von einer unabhängigen Stelle geprüft.',
 ihk:'Geräte und Maschinen müssen sicher sein (Produktsicherheitsgesetz). CE: Der Hersteller erklärt, dass EU-Vorgaben erfüllt sind. GS = „geprüfte Sicherheit“, von einer unabhängigen Stelle geprüft.',
 weil:'… weil ein Gerät ohne CE-Zeichen nicht als sicher erklärt ist.'},
{id:'g5',area:'m10b',from:'hansen',title:'Es brennt im Lager',src:null,
 msg:p=>`${NM(p)}! Im Lager brennt ein Karton! Was machst du zuerst?`,
 opts:[
  {t:'Brand melden: Notruf 112 und Alarm. Dann Kunden nach draußen bringen. Löschen nur, wenn es ohne Gefahr geht.',law:2,why:'Richtig. Reihenfolge: melden, Menschen retten, löschen wenn gefahrlos, Türen schließen, Sammelplatz.'},
  {t:'Ich hole sofort meine Tasche aus dem Spind.',law:0,why:'Falsch. Niemals zurücklaufen, um Sachen zu holen.'},
  {t:'Ich fahre mit dem Lastenaufzug nach unten zum Feuerlöscher.',law:0,why:'Falsch. Im Brandfall nie den Aufzug benutzen.'}
 ],
 term:'Verhalten im Brandfall',def:'1 melden (112, Alarm) · 2 Menschen retten · 3 löschen, wenn gefahrlos · 4 Türen schließen · 5 Sammelplatz.',
 ihk:'Im Brandfall: Brand melden (Notruf 112, Hausalarm), Menschen in Sicherheit bringen, wenn ohne Gefahr möglich löschen, Türen schließen, zum Sammelplatz gehen. Verboten: Aufzug benutzen, zurücklaufen.',
 weil:'… weil zuerst gemeldet und Menschen gerettet werden müssen.'},
{id:'g6',area:'m10b',from:'kemal',title:'Das blaue Schild',src:null,
 msg:p=>`An der Lagertür hängt ein rundes blaues Schild mit einem Schuh. Was heißt das?`,
 note:'Das Schild: rund, blau, weißer Sicherheitsschuh.',
 opts:[
  {t:'Ein Gebotszeichen: Hier muss man Sicherheitsschuhe tragen.',law:2,why:'Richtig. Rund und blau = Gebot. Hier: Fußschutz benutzen.'},
