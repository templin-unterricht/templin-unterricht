  {t:'Ein Verbotszeichen: Hier darf man keine Schuhe tragen.',law:0,why:'Falsch. Verbotszeichen sind rund, rot und durchgestrichen.'},
  {t:'Ein Rettungszeichen: Hier ist der Fluchtweg.',law:0,why:'Falsch. Rettungszeichen sind grün und rechteckig.'}
 ],
 term:'Sicherheitszeichen',def:'Rund rot = Verbot · rund blau = Gebot · Dreieck gelb = Warnung · Rechteck grün = Rettung · Rechteck rot = Brandschutz.',
 ihk:'Gebotszeichen sind rund und blau, Verbotszeichen rund, rot und durchgestrichen, Warnzeichen gelbe Dreiecke, Rettungszeichen grüne Rechtecke, Brandschutzzeichen rote Rechtecke.',
 weil:'… weil runde blaue Zeichen sagen, was man tun muss.'},
{id:'g7',area:'m10b',from:'svea',title:'Nasser Boden',src:null,
 msg:p=>`Ich habe die Fischtheke gerade sauber gemacht. Der Boden davor ist noch nass. Kunden kommen gleich. Lassen wir das trocknen?`,
 opts:[
  {t:'Sofort trockenwischen und bis dahin ein Warnschild aufstellen. Rutschen ist die häufigste Unfallursache im Handel.',law:2,why:'Richtig. Nasse Böden sofort wischen und absichern.'},
  {t:'Das trocknet von allein.',law:0,why:'Falsch. Bis dahin kann jemand ausrutschen.'},
  {t:'Ich sage den Kunden einfach Bescheid, wenn sie kommen.',law:1,why:'Teilweise. Warnen ist gut. Aber besser: sofort wischen und ein Warnschild aufstellen.'}
 ],
 term:'Rutschgefahr',def:'Häufigste Unfallursache im Handel. Nasse Stellen sofort wischen und absichern.',
 ihk:'Nasser Boden ohne Warnschild ist gefährlich: Rutschgefahr – häufigste Unfallursache im Handel; sofort wischen und absichern.',
 weil:'… weil Rutschen die häufigste Unfallursache im Handel ist.'},
{id:'g8',area:'m10b',from:'ole',title:'Der Türgriff im Kühlraum',src:SRC.UVV,
 msg:p=>`Der Innengriff der Kühlraumtür ist locker. Ich schraube den nach Feierabend selbst wieder fest. Dann müssen wir Herrn Hansen nicht stören.`,
 opts:[
  {t:'Bitte nicht selbst reparieren. Wir melden den Mangel sofort Herrn Hansen und warnen die anderen.',law:2,why:'Richtig. Mängel sofort melden – aber nicht selbst reparieren.'},
  {t:'Gute Idee. Mängel muss jeder selbst beheben.',law:0,why:'Falsch. Beschäftigte sollen Mängel melden, nicht selbst beseitigen (IHK Sommer 2026, Aufgabe 25).'},
  {t:'Das ist nicht so wichtig. Das hat Zeit bis zur nächsten Kontrolle.',law:0,why:'Falsch. Ein kaputter Innengriff kann gefährlich sein. Sofort melden.'}
 ],
 term:'Mängel melden',def:'Mängel an Geräten und Unfälle sofort melden – aber Geräte nicht selbst reparieren.',
 ihk:'Jeder Mitarbeiter ist verpflichtet, Arbeitsunfälle unverzüglich zu melden. Sicherheitsmängel an Arbeitsgeräten werden gemeldet, nicht selbst beseitigt (IHK Sommer 2026, Aufgabe 25).',
 weil:'… weil Beschäftigte Mängel melden, aber nicht selbst reparieren sollen.'},
/* ---------- Modul 11: Dienstplan im Advent ---------- */
{id:'h1',area:'m11',from:'hansen',title:'Weihnachtsmarkt bis 21 Uhr',src:p=>p.a.minor?SRC.JArbSchG:p.a.preg?SRC.MuSchG:SRC.ArbZG,
 msg:p=>`Wir haben einen Stand auf dem Weihnachtsmarkt. ${NM(p)}, du machst Freitag die Spätschicht von 13 bis 21 Uhr. Pause eine Stunde.`,
 note:p=>p.a.minor?'Mia ist 17.':p.a.preg?'Lea ist schwanger. Eine Genehmigung der Behörde gibt es nicht.':`${NM(p)} ist ${p.a.age}.`,
 opts:[
  {t:p=>p.a.minor?'Das geht nicht. Mit 17 darf ich nur bis 20 Uhr arbeiten.':p.a.preg?'Das geht nicht. Schwangere dürfen nach 20 Uhr nicht arbeiten.':'Das ist erlaubt. 7 Stunden Arbeit, genug Pause. Für Erwachsene gibt es keine Grenze um 20 Uhr.',law:2,why:p=>p.a.minor?'Richtig. Jugendliche dürfen nur von 6 bis 20 Uhr arbeiten (JArbSchG).':p.a.preg?'Richtig. Schwangere dürfen zwischen 20 und 6 Uhr nicht arbeiten. Bis 22 Uhr nur mit Genehmigung (MuSchG).':'Richtig. Für Erwachsene gibt es im Arbeitszeitgesetz keine Uhrzeitgrenze. 7 Stunden Arbeit mit 60 Minuten Pause sind erlaubt.'},
  {t:p=>p.a.minor||p.a.preg?'Das geht. Auf dem Weihnachtsmarkt gelten andere Regeln.':'Das geht nicht. Nach 20 Uhr darf niemand im Einzelhandel arbeiten.',law:0,why:p=>p.a.minor?'Falsch. Auch auf dem Weihnachtsmarkt gilt: Jugendliche nur bis 20 Uhr.':p.a.preg?'Falsch. Der Mutterschutz gilt überall.':'Falsch. Für Erwachsene gibt es keine Uhrzeitgrenze. Auf die Öffnungszeiten achtet das Ladenschlussrecht.'},
  {t:'Das geht, wenn ich danach einen Tag frei bekomme.',law:p=>p.a.minor||p.a.preg?0:1,why:p=>p.a.minor||p.a.preg?'Falsch. Ein freier Tag ändert nichts an der Uhrzeitgrenze.':'Teilweise. Erlaubt ist es auch ohne freien Tag.'}
 ],
 term:'Uhrzeitgrenzen',def:'Jugendliche 6–20 Uhr · Schwangere nicht 20–6 Uhr · Erwachsene: keine Grenze im ArbZG.',
 ihk:'Jugendliche dürfen nur in der Zeit von 6 bis 20 Uhr beschäftigt werden. Schwangere dürfen zwischen 20 und 6 Uhr nicht arbeiten (bis 22 Uhr nur mit Genehmigung). Für Erwachsene legt das Arbeitszeitgesetz keine Uhrzeit fest.',
 weil:p=>p.a.minor?'… weil Jugendliche nur von 6 bis 20 Uhr arbeiten dürfen.':p.a.preg?'… weil Schwangere zwischen 20 und 6 Uhr nicht arbeiten dürfen.':'… weil das Arbeitszeitgesetz für Erwachsene keine Uhrzeitgrenze setzt.'},
{id:'h2',area:'m11',from:'hansen',title:'Inventur bis 22 Uhr',src:p=>p.a.minor?SRC.JArbSchG:p.a.preg?SRC.MuSchG:SRC.ArbZG,
 msg:p=>`Freitag ist Inventur bis 22 Uhr. Samstag fängst du um 7 Uhr wieder an, ${NM(p)}. Der Laden ist voll.`,
 opts:[
  {t:'Das geht. Zwischen den Schichten liegen 9 Stunden.',law:0,why:p=>p.a.minor?'Falsch. Jugendliche dürfen nur bis 20 Uhr arbeiten und brauchen 12 Stunden Ruhezeit.':p.a.preg?'Falsch. Schwangere dürfen nach 20 Uhr nicht arbeiten. Außerdem sind 9 Stunden Ruhezeit zu wenig.':'Falsch. Erwachsene brauchen 11 Stunden Ruhezeit.'},
  {t:p=>p.a.minor?'Das geht nicht. Ich darf nur bis 20 Uhr arbeiten und brauche 12 Stunden Ruhezeit.':p.a.preg?'Das geht nicht. Nach 20 Uhr darf ich als Schwangere nicht arbeiten. Und ich brauche 11 Stunden Ruhezeit.':'Das geht nicht. Ich brauche 11 Stunden Ruhezeit. Nach 22 Uhr frühestens um 9 Uhr.',law:2,why:p=>p.a.minor?'Richtig. Jugendliche: 6 bis 20 Uhr und 12 Stunden Ruhezeit.':p.a.preg?'Richtig. Schwangere nicht 20 bis 6 Uhr, Ruhezeit 11 Stunden.':'Richtig. 22 Uhr + 11 Stunden = 9 Uhr.'},
  {t:'Das geht nicht. Ich brauche 8 Stunden Schlaf, also frühestens um 6 Uhr.',law:0,why:'Falsch. Es geht nicht um Schlaf, sondern um die Ruhezeit nach dem Gesetz.'}
 ],
 term:'Ruhezeit',def:'Zeit zwischen Feierabend und nächstem Arbeitsbeginn: Erwachsene 11 Stunden, Jugendliche 12 Stunden.',
 ihk:'Nach Arbeitsende müssen Erwachsene eine ununterbrochene Ruhezeit von mindestens 11 Stunden haben (§ 5 ArbZG), Jugendliche mindestens 12 Stunden (§ 13 JArbSchG).',
 weil:p=>p.a.minor?'… weil Jugendliche 12 Stunden Ruhezeit brauchen.':'… weil zwischen zwei Schichten mindestens 11 Stunden Ruhezeit liegen müssen.'},
{id:'h3',area:'m11',from:'hansen',title:'Zehneinhalb Stunden im Laden',src:p=>p.a.minor?SRC.JArbSchG:p.a.preg?SRC.MuSchG:SRC.ArbZG,
 msg:p=>`Montag brauche ich dich von 8 bis 19 Uhr, ${NM(p)}. Pause 45 Minuten. Ist ja Advent.`,
 opts:[
  {t:'Das sind über 10 Stunden Arbeit. Das ist verboten.',law:2,why:p=>p.a.minor?'Richtig. 11 Stunden minus 45 Minuten Pause = 10 ¼ Stunden. Jugendliche dürfen höchstens 8 (8,5) Stunden arbeiten.':p.a.preg?'Richtig. 10 ¼ Stunden sind zu viel. Schwangere dürfen höchstens 8,5 Stunden am Tag arbeiten.':'Richtig. 11 Stunden minus 45 Minuten Pause = 10 ¼ Stunden. Mehr als 10 Stunden sind verboten (§ 3 ArbZG).'},
  {t:'Das geht. Im Advent sind längere Tage erlaubt.',law:0,why:'Falsch. Auch im Advent gelten die Höchstgrenzen.'},
  {t:'Das geht, wenn ich die Überstunden bezahlt bekomme.',law:0,why:'Falsch. Geld ändert nichts an der Höchstarbeitszeit.'}
 ],
 term:'Höchstarbeitszeit',def:'Erwachsene 8 Stunden werktäglich, bis 10 mit Ausgleich. Jugendliche 8 (8,5) Stunden. Schwangere höchstens 8,5 Stunden.',
 ihk:'Die werktägliche Arbeitszeit darf 8 Stunden nicht überschreiten. Sie kann auf bis zu 10 Stunden verlängert werden, wenn ein Ausgleich erfolgt (§ 3 ArbZG). Jugendliche: höchstens 8 Stunden täglich (8,5, wenn an anderen Tagen weniger).',
 weil:p=>p.a.minor?'… weil Jugendliche höchstens 8 (8,5) Stunden am Tag arbeiten dürfen.':p.a.preg?'… weil Schwangere höchstens 8,5 Stunden am Tag arbeiten dürfen.':'… weil Erwachsene höchstens 10 Stunden am Tag arbeiten dürfen.'},
{id:'h4',area:'m11',from:'kemal',title:'Nach der Schule in den Laden',src:SRC.JArbSchG,
 msg:p=>`Ich hatte heute sechs Stunden Berufsschule bis 13:15 Uhr. Herr Hansen will, dass ich danach noch bis 18 Uhr im Laden helfe. Muss ich?`,
 note:'Es ist Kemals einziger langer Schultag in dieser Woche. Kemal ist 16.',
 opts:[
  {t:'Nein. Nach mehr als fünf Unterrichtsstunden darfst du einmal pro Woche nicht mehr arbeiten. Der Tag zählt wie ein voller Arbeitstag.',law:2,why:'Richtig. Einmal pro Woche: nach mehr als 5 Unterrichtsstunden keine Arbeit mehr (§ 9 JArbSchG).'},
  {t:'Ja. Schule zählt nicht als Arbeitszeit.',law:0,why:'Falsch. Schulzeit wird angerechnet. Nach einem langen Schultag ist frei.'},
  {t:'Ja, aber nur bis 16 Uhr.',law:0,why:'Falsch. Nach einem langen Schultag darf er gar nicht mehr arbeiten.'}
 ],
 term:'Langer Berufsschultag',def:'Jugendliche: einmal pro Woche nach mehr als 5 Unterrichtsstunden frei.',
 ihk:'Jugendliche dürfen an einem Berufsschultag mit mehr als fünf Unterrichtsstunden von mindestens je 45 Minuten einmal in der Woche nicht beschäftigt werden (§ 9 JArbSchG).',
 weil:'… weil Jugendliche nach einem Schultag mit mehr als fünf Stunden einmal pro Woche frei haben.'},
{id:'h5',area:'m11',from:'malte',title:'Malte wird Vater',src:SRC.BEEG,
 msg:p=>`Meine Freundin bekommt im Februar ein Baby. Ich will ein Jahr Elternzeit nehmen. Herr Hansen sagt: „Nur, wenn ich zustimme.“ Kann er das verbieten?`,
 opts:[
  {t:'Nein. Elternzeit braucht keine Zustimmung. Du musst sie nur rechtzeitig anmelden. Und du hast Kündigungsschutz.',law:2,why:'Richtig. Bis zu 3 Jahre je Elternteil, keine Zustimmung nötig, Kündigungsschutz.'},
  {t:'Ja. Ohne Zustimmung vom Chef gibt es keine Elternzeit.',law:0,why:'Falsch. Elternzeit ist ein Recht. Der Chef muss nicht zustimmen.'},
  {t:'Nein. Und Herr Hansen muss dir das Elterngeld bezahlen.',law:1,why:'Teilweise. Keine Zustimmung nötig stimmt. Aber das Elterngeld zahlt die Elterngeldstelle, nicht der Betrieb.'}
 ],
 term:'Elternzeit',def:'Bis zu 3 Jahre je Elternteil, unbezahlt, mit Kündigungsschutz. Elterngeld vom Staat.',
 ihk:'Elternzeit (BEEG): bis zu 3 Jahre je Elternteil, keine Zustimmung nötig, Kündigungsschutz. Elterngeld rund 65–67 % des Nettos.',
 weil:'… weil Elternzeit ein Recht ist, für das der Arbeitgeber nicht zustimmen muss.'},
{id:'h6',area:'m11',from:'svea',title:'Schwanger und Kisten schleppen',src:SRC.MuSchG,
 msg:p=>`Ich bin im fünften Monat schwanger. Herr Hansen will, dass ich heute die Lieferung mit den schweren Fischkisten auspacke. Muss ich das machen?`,
 opts:[
  {t:'Nein. Schwangere dürfen keine schweren Lasten tragen. Das verbietet das Mutterschutzgesetz.',law:2,why:'Richtig. Schwangere dürfen keine schweren Lasten heben.'},
  {t:'Ja, wenn du dich fit fühlst.',law:0,why:'Falsch. Der Schutz gilt unabhängig vom Gefühl.'},
  {t:'Nein. Schwangere dürfen gar nicht mehr arbeiten.',law:0,why:'Falsch. Schwangere dürfen arbeiten, nur nicht schwer. Die Schutzfrist beginnt 6 Wochen vor der Geburt.'}
 ],
 term:'Mutterschutz',def:'Keine schweren Lasten, nicht 20–6 Uhr, Schutzfrist 6 Wochen vor und 8 Wochen nach der Geburt, Kündigungsschutz.',
 ihk:'Schwangere dürfen keine schweren Lasten heben. Die Schutzfrist beginnt 6 Wochen vor der Geburt und endet 8 Wochen danach (MuSchG).',
 weil:'… weil das Mutterschutzgesetz schwere Arbeit für Schwangere verbietet.'},
{id:'h7',area:'m11',from:'hansen',title:'Wie viel Urlaub steht dir zu?',src:p=>p.a.minor?SRC.JArbSchG:SRC.BUrlG,
 msg:p=>`Für den Urlaubsplan: Wie viel Urlaub steht dir eigentlich nach dem Gesetz mindestens zu, ${NM(p)}? Den Tarifvertrag lassen wir mal weg.`,
 note:p=>p.a.minor?'Mia ist am 1. Januar 17.':`${NM(p)} ist ${p.a.age}.`,
 opts:[
  {t:p=>p.a.minor?'Mit 17 sind es mindestens 25 Werktage.':'Mindestens 24 Werktage. Bei einer 5-Tage-Woche sind das 20 Arbeitstage.',law:2,why:p=>p.a.minor?'Richtig. Unter 18: 25 Werktage (JArbSchG). Es zählt das Alter am 1. Januar.':'Richtig. Bundesurlaubsgesetz: 24 Werktage = 20 Arbeitstage bei 5-Tage-Woche.'},
  {t:'Mindestens 30 Tage. Das steht im Gesetz.',law:0,why:'Falsch. 30 Tage gibt es oft im Tarifvertrag. Das Gesetz gibt weniger.'},
  {t:p=>p.a.minor?'Wie alle: 24 Werktage.':'Mindestens 24 Arbeitstage.',law:0,why:p=>p.a.minor?'Falsch. Jugendliche bekommen mehr: unter 18 sind es 25 Werktage.':'Falsch. Es sind 24 Werktage, nicht Arbeitstage. Werktage sind Montag bis Samstag.'}
 ],
 term:'Mindesturlaub',def:'Erwachsene 24 Werktage. Jugendliche: unter 16: 30 · unter 17: 27 · unter 18: 25 Werktage.',
 ihk:'Der Urlaub beträgt jährlich mindestens 24 Werktage (§ 3 BUrlG). Jugendliche erhalten unter 16 Jahren 30, unter 17 Jahren 27 und unter 18 Jahren 25 Werktage (§ 19 JArbSchG).',
 weil:p=>p.a.minor?'… weil Jugendliche unter 18 mindestens 25 Werktage Urlaub haben.':'… weil das Bundesurlaubsgesetz mindestens 24 Werktage vorschreibt.'},
{id:'h8',area:'m11',from:'hansen',title:'Verkaufsoffener Sonntag',src:p=>p.a.minor?SRC.JArbSchG:p.a.preg?SRC.MuSchG:SRC.ArbZG,
 msg:p=>`Am zweiten Advent ist verkaufsoffener Sonntag, 12 bis 18 Uhr. Du bist dabei, ${NM(p)}. Dafür hast du am Dienstag frei.`,
 opts:[
  {t:p=>p.a.minor?'Am Sonntag darf ich mit 17 gar nicht arbeiten.':p.a.preg?'Als Schwangere arbeite ich sonntags nur, wenn ich ausdrücklich einwillige.':'Das ist erlaubt. Am genehmigten Sonntag mit Ersatzruhetag geht das.',law:2,why:p=>p.a.minor?'Richtig. Jugendliche dürfen im Einzelhandel nicht sonntags arbeiten.':p.a.preg?'Richtig. Schwangere arbeiten nicht sonntags, außer sie willigen ein.':'Richtig. An genehmigten verkaufsoffenen Sonntagen mit Ersatzruhetag ist das erlaubt.'},
  {t:'Sonntags darf im Einzelhandel nie jemand arbeiten.',law:p=>p.a.minor?1:0,why:p=>p.a.minor?'Teilweise. Für Mia stimmt das. Erwachsene dürfen an genehmigten Sonntagen mit Ersatzruhetag arbeiten.':'Falsch. An genehmigten verkaufsoffenen Sonntagen dürfen Erwachsene arbeiten, mit Ersatzruhetag.'},
  {t:'Das geht auch ohne freien Dienstag.',law:0,why:'Falsch. Wer sonntags arbeitet, bekommt einen Ersatzruhetag.'}
 ],
 term:'Sonntagsarbeit',def:'Erwachsene nur an genehmigten Sonntagen mit Ersatzruhetag. Jugendliche im Handel nie. Schwangere nur mit Einwilligung.',
 ihk:'Sonntags dürfen Erwachsene im Einzelhandel nur an genehmigten verkaufsoffenen Sonntagen mit Ersatzruhetag arbeiten. Jugendliche nicht. Schwangere nur, wenn sie einwilligen.',
 weil:p=>p.a.minor?'… weil Jugendliche im Einzelhandel sonntags nicht arbeiten dürfen.':'… weil Sonntagsarbeit nur an genehmigten Sonntagen mit Ersatzruhetag erlaubt ist.'},
/* ---------- Modul 8b: Das Arbeitszeugnis ---------- */
{id:'z1',area:'m8b',from:'merle',title:'„Stets zu unserer vollen Zufriedenheit“',src:null,
 msg:p=>`Ich höre bei Kutter & Korb auf. Im Zeugnis steht: „Sie erledigte die ihr übertragenen Aufgaben stets zu unserer vollen Zufriedenheit.“ Ist das gut?`,
 opts:[
  {t:'Ja. Das ist die Note gut (2).',law:2,why:'Richtig. „stets zur vollen Zufriedenheit“ = gut.'},
  {t:'Das ist sehr gut (1).',law:0,why:'Falsch. Für sehr gut steht dort „stets zur vollsten Zufriedenheit“.'},
  {t:'Das ist nur befriedigend (3).',law:0,why:'Falsch. Befriedigend wäre „zur vollen Zufriedenheit“ ohne „stets“.'}
 ],
 term:'Zeugnissprache',def:'vollsten + stets = 1 · stets vollen = 2 · vollen = 3 · zu unserer Zufriedenheit = 4 · im Großen und Ganzen = 5 · bemühte sich = 6.',
 ihk:'Arbeitszeugnisse müssen wahr und wohlwollend sein. Darum gibt es feste Formeln: „stets zu unserer vollen Zufriedenheit“ entspricht der Note gut.',
 weil:'… weil „stets zu unserer vollen Zufriedenheit“ in der Zeugnissprache gut bedeutet.'},
{id:'z2',area:'m8b',from:'hansen',title:'„Er bemühte sich“',src:SRC.GewO,
 msg:p=>`Für Ole schreibe ich ins Zeugnis: „Er bemühte sich, die ihm übertragenen Aufgaben zu unserer Zufriedenheit zu erledigen.“ Klingt doch nett, oder?`,
 opts:[
  {t:'Das klingt nett, ist aber die Note ungenügend (6). Ein Zeugnis muss wohlwollend sein. Ole kann eine Berichtigung verlangen.',law:2,k:3,why:'Richtig. „bemühte sich“ = ungenügend. Zeugnisse müssen wahr und wohlwollend sein.'},
  {t:'Klingt nett. Das ist mindestens befriedigend.',law:0,k:-5,why:'Falsch. „bemühte sich“ ist die schlechteste Formel: ungenügend.'},
  {t:'Das ist erlaubt. Geheime Zeichen sind normal.',law:0,k:-5,why:'Falsch. Geheime Zeichen und negative Andeutungen sind verboten.'}
 ],
 term:'Wahr und wohlwollend',def:'Das Zeugnis darf das berufliche Fortkommen nicht unnötig erschweren.',
 ihk:'Jeder Arbeitnehmer hat am Ende Anspruch auf ein schriftliches Zeugnis (§ 109 Gewerbeordnung). Es muss wahr und wohlwollend sein; „bemühte sich“ entspricht der Note ungenügend.',
 weil:'… weil ein Zeugnis wohlwollend sein muss und „bemühte sich“ ungenügend heißt.'},
{id:'z3',area:'m8b',from:'tim',title:'Nur Art und Dauer',src:SRC.GewO,
 msg:p=>`Ich höre bei der „Möwe“ auf. Mein Chef will mir nur ein Zeugnis mit Tätigkeit und Dauer geben. Zu Leistung und Verhalten schreibt er nichts. Darf er das?`,
 opts:[
  {t:'Das ist ein einfaches Zeugnis. Wenn du es verlangst, muss er dir ein qualifiziertes geben – mit Leistung und Verhalten.',law:2,why:'Richtig. Einfaches Zeugnis: Art und Dauer. Qualifiziertes Zeugnis mit Leistung und Verhalten auf Verlangen.'},
  {t:'Ja. Mehr als Art und Dauer muss nie drinstehen.',law:0,why:'Falsch. Auf Verlangen gibt es ein qualifiziertes Zeugnis.'},
  {t:'Nein. Er muss immer ein qualifiziertes Zeugnis schreiben, auch ohne dass du fragst.',law:1,why:'Teilweise. Das qualifizierte Zeugnis gibt es nur, wenn man es verlangt.'}
 ],
 term:'Qualifiziertes Zeugnis',def:'Enthält zusätzlich Leistung und Verhalten. Gibt es, wenn der Arbeitnehmer es verlangt.',
 ihk:'Ein Recht auf ein qualifiziertes Zeugnis besteht, wenn der Arbeitnehmer es verlangt (IHK Winter 2021/22, Aufgabe 19). Das einfache Zeugnis nennt nur Art und Dauer der Tätigkeit.',
 weil:'… weil es das qualifizierte Zeugnis gibt, wenn der Arbeitnehmer es verlangt.'},
{id:'z4',area:'m8b',from:'hansen',title:'Zeugnis gegen Gebühr',src:SRC.GewO,
 msg:p=>`Zeugnisse schreiben macht Arbeit. Ab jetzt nehme ich dafür 50 € Gebühr.`,
 opts:[
  {t:'Das geht nicht. Am Ende hat jeder Anspruch auf ein Zeugnis. Die Kosten trägt der Betrieb.',law:2,k:2,why:'Richtig. Zeugnispflicht des Arbeitgebers. Kosten trägt der Betrieb.'},
  {t:'Das ist fair. Arbeit kostet Geld.',law:0,k:-4,why:'Falsch. Das Zeugnis ist eine Pflicht des Arbeitgebers.'},
  {t:'Nur für qualifizierte Zeugnisse darf er Geld nehmen.',law:0,k:-4,why:'Falsch. Auch das qualifizierte Zeugnis ist kostenlos.'}
 ],
 term:'Zeugnispflicht',def:'Der Arbeitgeber muss am Ende ein Zeugnis ausstellen – kostenlos.',
 ihk:'Jeder Arbeitnehmer bekommt am Ende ein schriftliches Zeugnis (§ 109 Gewerbeordnung), Azubis nach § 16 BBiG. Die Kosten trägt der Betrieb.',
 weil:'… weil der Arbeitgeber zum Zeugnis verpflichtet ist und die Kosten trägt.'},
/* ---------- Modul 9: Kündigung ---------- */
{id:'k1',area:'m9',from:'hansen',title:'Kündigung per WhatsApp',src:SRC.BGB,
 msg:p=>`Ich schicke Malte gleich eine WhatsApp: „Du brauchst ab März nicht mehr zu kommen.“ Das geht schnell und ist schriftlich.`,
 opts:[
  {t:'Das ist unwirksam. Eine Kündigung muss schriftlich mit Ihrer eigenen Unterschrift sein. WhatsApp, SMS oder E-Mail reichen nicht.',law:2,k:3,why:'Richtig. Kündigung nur schriftlich mit eigenhändiger Unterschrift (§ 623 BGB).'},
  {t:'Das geht. WhatsApp ist schriftlich.',law:0,k:-10,why:'Falsch. Die Kündigung braucht eine eigenhändige Unterschrift.'},
  {t:'Das geht, wenn Sie ihn vorher anrufen.',law:0,k:-10,why:'Falsch. Auch mündlich und per Messenger ist die Kündigung unwirksam.'}
 ],
 term:'Schriftform der Kündigung',def:'Immer schriftlich mit eigenhändiger Unterschrift. E-Mail, SMS, WhatsApp reichen nicht.',
 ihk:'Die Kündigung eines Arbeitsverhältnisses bedarf der Schriftform mit eigenhändiger Unterschrift; die elektronische Form ist ausgeschlossen (§ 623 BGB).',
 weil:'… weil eine Kündigung nur mit Schriftform und eigenhändiger Unterschrift wirksam ist.'},
{id:'k2',area:'m9',from:'hansen',title:'200 € aus der Kasse',src:SRC.BGB,
 msg:p=>`Die Kamera zeigt es klar: Ein Aushilfskollege hat gestern 200 € aus der Kasse eingesteckt. Darf ich ihm fristlos kündigen? Oder muss ich erst abmahnen?`,
 opts:[
  {t:'Ja, fristlos – auch ohne Abmahnung. Diebstahl ist ein wichtiger Grund. Sie müssen innerhalb von zwei Wochen kündigen.',law:2,why:'Richtig. Diebstahl ist ein wichtiger Grund. Fristlos innerhalb von 2 Wochen, nachdem man davon erfahren hat.'},
  {t:'Nein. Erst muss eine Abmahnung kommen.',law:0,why:'Falsch. Bei Diebstahl ist keine Abmahnung nötig.'},
  {t:'Ja, aber Sie haben dafür ein halbes Jahr Zeit.',law:0,why:'Falsch. Die fristlose Kündigung muss innerhalb von 2 Wochen kommen.'}
 ],
 term:'Außerordentliche Kündigung',def:'Fristlos aus wichtigem Grund (z. B. Diebstahl), innerhalb von 2 Wochen nach Kenntnis.',
 ihk:'Eine außerordentliche (fristlose) Kündigung braucht einen wichtigen Grund, z. B. Diebstahl. Sie muss innerhalb von zwei Wochen erfolgen, nachdem man vom Grund erfahren hat.',
 weil:'… weil Diebstahl ein wichtiger Grund für eine fristlose Kündigung ist.'},
{id:'k3',area:'m9',from:'hansen',title:'Kündigung in der Elternzeit',src:SRC.BEEG,
 msg:p=>`Malte ist seit Februar in Elternzeit. Eigentlich brauche ich ihn nicht mehr. Ich kündige ihm jetzt ordentlich.`,
 opts:[
  {t:'Das geht nicht. In der Elternzeit hat Malte besonderen Kündigungsschutz.',law:2,why:'Richtig. Eltern in Elternzeit haben besonderen Kündigungsschutz.'},
  {t:'Das geht, wenn Sie die Frist einhalten.',law:0,k:-10,why:'Falsch. Der besondere Kündigungsschutz gilt trotzdem.'},
  {t:'Das geht, wenn Sie ihm eine Abfindung zahlen.',law:0,k:-10,why:'Falsch. Eine Abfindung hebt den Kündigungsschutz nicht auf.'}
 ],
 term:'Besonderer Kündigungsschutz',def:'Azubis nach der Probezeit, Schwangere und Mütter bis 4 Monate nach der Geburt, Eltern in Elternzeit, Betriebsrat und JAV, schwerbehinderte Menschen.',
 ihk:'Einen besonderen gesetzlichen Kündigungsschutz genießen u. a. Auszubildende nach der Probezeit und Beschäftigte in Elternzeit (IHK Sommer 2023, Aufgabe 15).',
 weil:'… weil Eltern in Elternzeit besonderen Kündigungsschutz haben.'},
{id:'k4',area:'m9',from:'hansen',title:p=>p.a.preg?'Schwanger – und gekündigt?':'Svea ist schwanger',src:SRC.MuSchG,
 msg:p=>p.a.preg?`Lea, du bist ja schwanger. Ehrlich gesagt plane ich ohne dich. Ich kündige dir lieber jetzt mit Frist.`:`Svea ist schwanger und hat es mir gesagt. Ich kündige ihr lieber jetzt, bevor sie ausfällt.`,
 opts:[
  {t:p=>p.a.preg?'Das geht nicht. Ich bin schwanger und habe es Ihnen gesagt. Dann habe ich besonderen Kündigungsschutz – bis 4 Monate nach der Geburt.':'Das geht nicht. Sie hat besonderen Kündigungsschutz – bis 4 Monate nach der Geburt.',law:2,why:'Richtig. Schwangere und Mütter bis 4 Monate nach der Geburt haben besonderen Kündigungsschutz (MuSchG).'},
  {t:'Das geht, wenn die Kündigung schriftlich ist.',law:0,k:-10,why:'Falsch. Auch eine schriftliche Kündigung ist unwirksam.'},
  {t:'Das geht nur nach der Geburt.',law:0,k:-10,why:'Falsch. Der Schutz gilt in der Schwangerschaft und bis 4 Monate nach der Geburt.'}
 ],
 term:'Kündigungsschutz im Mutterschutz',def:'Während der Schwangerschaft und bis 4 Monate nach der Geburt darf nicht gekündigt werden.',
 ihk:'Schwangere und Mütter bis vier Monate nach der Geburt haben besonderen Kündigungsschutz (Mutterschutzgesetz).',
 weil:'… weil Schwangere bis vier Monate nach der Geburt besonderen Kündigungsschutz haben.'},
{id:'k5',area:'m9',from:'merle',title:'Bis wann muss ich noch arbeiten?',src:SRC.BGB,
 msg:p=>`Ich bin seit drei Jahren hier und kündige selbst. Meine Kündigung gebe ich am 10. März ab. Einen Tarifvertrag für Kündigungsfristen lassen wir weg. Wann ist mein letzter Tag?`,
 opts:[
  {t:'Am 15. April. 4 Wochen ab dem 11. März enden am 7. April. Der nächste Termin ist der 15.',law:2,why:'Richtig. Arbeitnehmer: 4 Wochen zum 15. oder zum Monatsende. 28 Tage ab dem 11. März = 7. April → 15. April.'},
  {t:'Am 7. April. Genau 4 Wochen.',law:1,why:'Teilweise. 4 Wochen stimmt. Aber die Frist endet nur zum 15. oder zum Monatsende: 15. April.'},
  {t:'Am 31. Mai. Nach drei Jahren gilt eine längere Frist.',law:0,why:'Falsch. Längere Fristen gelten nur, wenn der Arbeitgeber kündigt.'}
 ],
 term:'Kündigungsfrist',def:'Grundfrist: 4 Wochen zum 15. oder zum Monatsende. Längere Fristen gelten nur für den Arbeitgeber.',
 ihk:'Die gesetzliche Kündigungsfrist beträgt vier Wochen zum 15. oder zum Ende eines Kalendermonats. Für den Arbeitgeber verlängert sie sich mit der Betriebszugehörigkeit (§ 622 BGB).',
 weil:'… weil für Arbeitnehmer immer die Grundfrist von vier Wochen zum 15. oder zum Monatsende gilt.'},
{id:'k6',area:'m9',from:'hansen',title:'„Unsympathisch“',src:SRC.KSchG,
 msg:p=>`Svea ist seit drei Jahren hier. Ich finde sie einfach unsympathisch. Ich kündige ihr ordentlich mit Frist. Einen Grund brauche ich ja nicht.`,
 opts:[
  {t:'Doch. Wir haben mehr als 10 Beschäftigte und sie ist länger als 6 Monate hier. Dann gilt das Kündigungsschutzgesetz. „Unsympathisch“ ist kein Grund.',law:2,k:3,why:'Richtig. Mit Kündigungsschutzgesetz muss die Kündigung sozial gerechtfertigt sein: personen-, verhaltens- oder betriebsbedingt.'},
  {t:'Stimmt. Bei einer ordentlichen Kündigung braucht man nie einen Grund.',law:0,k:-10,why:'Falsch. Im Betrieb mit mehr als 10 Beschäftigten gilt nach 6 Monaten das Kündigungsschutzgesetz.'},
  {t:'Sie dürfen nur nach einer Abmahnung kündigen.',law:1,why:'Teilweise. Eine Abmahnung braucht man bei Verhaltensgründen. Hier fehlt aber jeder Grund.'}
 ],
 term:'Kündigungsschutzgesetz',def:'Gilt nach 6 Monaten in Betrieben mit mehr als 10 Beschäftigten. Kündigung muss personen-, verhaltens- oder betriebsbedingt sein.',
 ihk:'Das Kündigungsschutzgesetz gilt, wenn man länger als 6 Monate im Betrieb ist und der Betrieb mehr als 10 Beschäftigte hat. Dann muss die Kündigung sozial gerechtfertigt sein.',
 weil:'… weil das Kündigungsschutzgesetz eine sozial gerechtfertigte Kündigung verlangt.'},
{id:'k7',area:'m9',from:'hansen',title:'Kündigung in der Probezeit',src:SRC.BGB,
 msg:p=>`Die neue Kollegin aus Bremen ist im zweiten Monat. Sie kündigt schriftlich mit zwei Wochen Frist. Geht das so schnell?`,
 opts:[
  {t:'Ja. In der Probezeit beträgt die Kündigungsfrist zwei Wochen.',law:2,why:'Richtig. Probezeit: 2 Wochen Frist.'},
  {t:'Nein. Sie muss 4 Wochen zum Monatsende einhalten.',law:0,why:'Falsch. In der Probezeit gilt eine Frist von 2 Wochen.'},
  {t:'Nein. In der Probezeit darf nur der Betrieb kündigen.',law:0,why:'Falsch. Beide Seiten dürfen in der Probezeit kündigen.'}
 ],
 term:'Kündigung in der Probezeit',def:'Beide Seiten können mit 2 Wochen Frist kündigen.',
 ihk:'Während einer vereinbarten Probezeit von höchstens sechs Monaten kann das Arbeitsverhältnis mit einer Frist von zwei Wochen gekündigt werden (§ 622 Abs. 3 BGB).',
 weil:'… weil in der Probezeit eine Kündigungsfrist von zwei Wochen gilt.'},
{id:'k8',area:'m9',from:'merle',title:'Ein Aufhebungsvertrag',src:SRC.SGB,
 msg:p=>`Herr Hansen bietet mir einen Aufhebungsvertrag an. Wir beenden alles einvernehmlich zum 31. März. Ich habe noch keine neue Stelle. Gute Idee?`,
 opts:[
  {t:'Vorsicht. Ein Aufhebungsvertrag ist schriftlich und beendet den Job sicher. Ohne wichtigen Grund gibt es meist 12 Wochen Sperrzeit beim Arbeitslosengeld.',law:2,why:'Richtig. Aufhebungsvertrag: beide Seiten einigen sich schriftlich. Achtung Sperrzeit (Modul 4).'},
  {t:'Super. Das ist besser als eine Kündigung. Arbeitslosengeld gibt es sofort.',law:0,why:'Falsch. Ein Aufhebungsvertrag zählt wie eine eigene Kündigung: meist 12 Wochen Sperrzeit.'},
  {t:'Unterschreib nicht. Aufhebungsverträge sind verboten.',law:0,why:'Falsch. Aufhebungsverträge sind erlaubt. Man sollte nur die Folgen kennen.'}
 ],
 term:'Aufhebungsvertrag',def:'Beide Seiten beenden den Vertrag schriftlich. Meist 12 Wochen Sperrzeit.',
 ihk:'Beim Aufhebungsvertrag einigen sich beide Seiten schriftlich auf ein Ende. Ohne wichtigen Grund droht beim Arbeitslosengeld meist eine Sperrzeit von 12 Wochen.',
 weil:'… weil ein Aufhebungsvertrag ohne wichtigen Grund zu einer Sperrzeit führt.'}
];

/* ===== Folgefälle (Verzweigungen): kommen nach einer falschen Antwort ===== */
const FOLLOW=[
{id:'f1',after:['a1','a4'],area:'m7a',from:'jule',title:'Folgefall: Noch Azubi-Geld?',src:SRC.BBiG,
 msg:p=>`${NM(p)}, ich gehe gerade die Abrechnungen durch. Du hast seit dem Prüfungsergebnis Mitte Juni voll als Verkäufer(in) gearbeitet. Mein Vater hat dir bis Ende Juli trotzdem nur Azubi-Geld gezahlt. Passt das?`,
 opts:[
  {t:'Nein. Seit dem Tag nach dem Ergebnis bin ich Arbeitnehmer(in). Mir steht ab dann das Gehalt einer Fachkraft zu.',law:2,why:'Richtig. Die Ausbildung endet mit dem Ergebnis. Wer weiterarbeitet, ist Arbeitnehmer und bekommt Gehalt.'},
  {t:'Ja. Laut Vertrag war ich ja bis 31. Juli Azubi.',law:0,why:'Falsch. Das Datum im Vertrag zählt nicht, wenn die Prüfung früher bestanden ist (§ 21 BBiG).'},
  {t:'Das ist egal. Das Geld ist ja schon ausgezahlt.',law:0,why:'Falsch. Zu wenig gezahltes Gehalt kann man nachfordern.'}
 ],
 term:'Ende der Ausbildung',def:'Mit der Bekanntgabe des Ergebnisses ist man keine Azubi mehr.',
 ihk:'Die Ausbildung endet mit der Bekanntgabe des Prüfungsergebnisses. Wer danach weiterarbeitet, steht in einem Arbeitsverhältnis (§§ 21, 24 BBiG).',
 weil:'… weil die Ausbildung mit dem Ergebnis endet und danach ein Arbeitsverhältnis gilt.'},
{id:'f2',after:['b1','b2','b6'],area:'m7b',from:'svea',title:'Folgefall: Die nächste Bewerberin',src:SRC.AGG,
 msg:p=>`Morgen stellt sich eine neue Kollegin vor. Sie fragt mich: „Was mache ich, wenn Jule mich fragt, ob ich schwanger bin oder in der Gewerkschaft?“ Was soll ich ihr sagen?`,
 opts:[
  {t:'Diese Fragen sind unzulässig. Sie muss nicht antworten. Sie darf sogar die Unwahrheit sagen.',law:2,why:'Richtig. Bei unzulässigen Fragen gibt es ein „Recht zur Lüge“. Das schützt das AGG bzw. das Grundgesetz.'},
  {t:'Sie muss ehrlich antworten, sonst ist der Vertrag ungültig.',law:0,why:'Falsch. Bei unzulässigen Fragen darf sie schweigen oder die Unwahrheit sagen.'},
  {t:'Sie soll einfach gehen. Das Gespräch ist dann vorbei.',law:0,why:'Falsch. Sie muss nicht gehen. Sie muss die Frage nur nicht beantworten.'}
 ],
 term:'Recht zur Lüge',def:'Auf unzulässige Fragen darf man schweigen oder die Unwahrheit sagen.',
 ihk:'Unzulässige Fragen (Schwangerschaft, Kinderwunsch, Religion, Gewerkschaft, Partei) muss man nicht beantworten. Man darf sogar die Unwahrheit sagen. Das schützt das Allgemeine Gleichbehandlungsgesetz.',
 weil:'… weil man auf unzulässige Fragen schweigen oder die Unwahrheit sagen darf.'},
{id:'f3',after:['c1','c2','c6'],area:'m7c',from:'hansen',title:'Folgefall: Ende Juli ist Schluss?',src:SRC.TzBfG,
 msg:p=>`${NM(p)}, wir hatten doch per WhatsApp 12 Monate vereinbart. Im nächsten Juli ist also Schluss. Dann brauche ich dich nicht mehr.`,
 opts:[
  {t:'Die Befristung war nicht schriftlich mit beiden Unterschriften. Sie ist unwirksam. Mein Vertrag gilt unbefristet.',law:2,why:'Richtig. Ohne Schriftform keine wirksame Befristung. Der Vertrag läuft unbefristet weiter.'},
  {t:'Stimmt. Dann suche ich mir etwas Neues.',law:0,why:'Falsch. Die Befristung per WhatsApp ist unwirksam.'},
  {t:'Dann müssen Sie mir jetzt eine Abfindung zahlen.',law:0,why:'Falsch. Es geht nicht um eine Abfindung. Der Vertrag läuft einfach weiter.'}
 ],
 term:'Schriftform der Befristung',def:'Ohne Schriftform mit Unterschrift beider Seiten gilt der Vertrag unbefristet.',
 ihk:'Die Befristung eines Arbeitsvertrags bedarf der Schriftform. Ohne sie gilt der Vertrag als unbefristet.',
 weil:'… weil eine Befristung ohne Schriftform unwirksam ist.'},
{id:'f4',after:['u1','u2','u4'],area:'unf',from:'kemal',title:'Folgefall: Die Hand tut wieder weh',src:SRC.SGB,
 msg:p=>`Mein Handgelenk vom Sturz im Kühlraum tut wieder weh. Die Ärztin sagt, das kommt vom Unfall. Aber im Betrieb wurde damals nichts aufgeschrieben. Ist das schlimm?`,
 opts:[
  {t:'Ja. Die BG zahlt nur Unfälle, von denen sie weiß. Darum gehört jede Verletzung ins Verbandbuch. Wir melden den Unfall jetzt noch nach.',law:2,why:'Richtig. Ohne Nachweis fehlt bei Spätfolgen der Beweis. Dann zahlt die BG keine Reha, Umschulung oder Rente.'},
  {t:'Nein. Die Krankenkasse zahlt ja sowieso alles.',law:0,why:'Falsch. Bei Arbeitsunfällen zahlt die BG mehr, z. B. Unfallrente. Dafür braucht sie den Nachweis.'},
  {t:'Nein. Du kannst Herrn Hansen auf Schmerzensgeld verklagen.',law:0,why:'Falsch. Bei Arbeitsunfällen zahlt die BG. Der Arbeitgeber haftet in der Regel nicht selbst.'}
 ],
 term:'Verbandbuch',def:'Jede Verletzung eintragen, auch kleine. So lässt sich später ein Arbeitsunfall beweisen.',
 ihk:'Jede Verletzung wird ins Verbandbuch eingetragen. So lässt sich später beweisen, dass es ein Arbeitsunfall war. Die BG übernimmt nur Unfälle, von denen sie weiß.',
 weil:'… weil die BG bei Spätfolgen einen Nachweis über den Unfall braucht.'},
{id:'f5',after:['g1','g2','g3','g8','e2','e7'],area:'m10b',from:'weiss',title:'Folgefall: Die Nachkontrolle',src:SRC.UVV,
 msg:p=>`Ich bin zur Nachkontrolle da. Ich habe wieder Mängel gefunden. ${NM(p)}, was tun Sie, wenn Sie selbst einen Mangel oder eine Gefahr entdecken?`,
 opts:[
  {t:'Ich melde ihn sofort, warne die Kollegen und repariere nichts selbst.',law:2,why:'Richtig. Mängel sofort melden, nicht selbst beseitigen.'},
  {t:'Ich repariere ihn sofort selbst.',law:0,why:'Falsch. Geräte nicht selbst reparieren. Melden!'},
  {t:'Ich warte, bis die BG ihn bei der nächsten Kontrolle findet.',law:0,why:'Falsch. Bis dahin kann ein Unfall passieren.'}
 ],
 term:'Pflichten der Beschäftigten',def:'Weisungen befolgen, Schutzausrüstung tragen, Mängel und Unfälle sofort melden.',
 ihk:'Alle Beschäftigten müssen Weisungen befolgen, Schutzausrüstung benutzen und Mängel und Unfälle sofort melden – Mängel an Geräten aber nicht selbst reparieren.',
 weil:'… weil Beschäftigte Mängel melden müssen, aber nicht selbst reparieren sollen.'},
{id:'f6',after:['h1','h2','h3','h8'],area:'m11',from:'hansen',title:'Folgefall: Du hast doch zugestimmt',src:null,
 msg:p=>`Die Gewerbeaufsicht hat unsere Dienstpläne aus dem Advent geprüft. Aber ${NM(p)}, du hattest doch zugestimmt. Dann ist doch alles in Ordnung, oder?`,
 opts:[
  {t:'Nein. Die Schutzgesetze gelten auch, wenn ich zustimme. Beim nächsten Plan achten wir darauf.',law:2,why:'Richtig. Arbeitszeitgesetz, Jugendarbeitsschutz und Mutterschutz gelten immer, auch mit Zustimmung.'},
  {t:'Ja. Wer zustimmt, ist selbst verantwortlich.',law:0,k:-6,why:'Falsch. Auf den gesetzlichen Schutz kann man nicht verzichten.'},
  {t:'Ja, wenn ich die Stunden bezahlt bekommen habe.',law:0,k:-6,why:'Falsch. Bezahlung ändert nichts an den Höchstgrenzen.'}
 ],
 term:'Schutzgesetze',def:'Arbeitsschutzgesetze gelten immer – auch, wenn man zustimmt.',
 ihk:'Arbeitszeitgesetz, Jugendarbeitsschutzgesetz und Mutterschutzgesetz sind zwingendes Recht. Arbeitnehmer können nicht darauf verzichten.',
 weil:'… weil man auf gesetzlichen Arbeitsschutz nicht verzichten kann.'},
{id:'f7',after:['k1','k3','k4','k6'],area:'m9',from:'malte',title:'Folgefall: Die Kündigung ist da',src:SRC.KSchG,
 msg:p=>`Ich habe die Kündigung bekommen. Ich glaube, sie ist unwirksam. Ich warte erstmal ab, ob Herr Hansen es sich anders überlegt. Oder?`,
 opts:[
  {t:'Nicht warten! Innerhalb von 3 Wochen musst du beim Arbeitsgericht Klage einreichen. Sonst gilt die Kündigung als wirksam.',law:2,why:'Richtig. Kündigungsschutzklage innerhalb von 3 Wochen. Sonst gilt die Kündigung als wirksam.'},
  {t:'Abwarten ist gut. Für eine Klage hast du ein Jahr Zeit.',law:0,why:'Falsch. Die Frist beträgt nur 3 Wochen.'},
  {t:'Eine unwirksame Kündigung gilt nie. Du musst gar nichts tun.',law:0,why:'Falsch. Wer nicht innerhalb von 3 Wochen klagt, verliert den Schutz.'}
 ],
 term:'Kündigungsschutzklage',def:'Innerhalb von 3 Wochen beim Arbeitsgericht – sonst gilt die Kündigung als wirksam.',
 ihk:'Die Kündigungsschutzklage muss innerhalb von drei Wochen nach Zugang der Kündigung beim Arbeitsgericht erhoben werden, sonst gilt die Kündigung als wirksam.',
 weil:'… weil die Kündigung sonst nach drei Wochen als wirksam gilt.'},
{id:'f8',after:['s2','s3'],area:'sv',from:'hansen',title:'Folgefall: Die zweite Abrechnung',src:SRC.SGB,
 msg:p=>`Zweite Abrechnung, ${NM(p)}: 2.500 € brutto. Arbeitslosenversicherung 2,6 %, also 65 €. Jetzt stimmt alles, oder?`,
 opts:[
  {t:'Nein. 2,6 % ist der ganze Beitrag. Ich zahle die Hälfte: 1,3 %, also 32,50 €.',law:2,why:'Richtig. 2.500 € × 1,3 : 100 = 32,50 €.'},
  {t:'Ja. Die Arbeitslosenversicherung zahlt man allein.',law:0,why:'Falsch. Auch sie wird je zur Hälfte bezahlt.'},
  {t:'Nein. Ich zahle gar nichts. Ich werde ja nicht arbeitslos.',law:0,why:'Falsch. Die Arbeitslosenversicherung ist eine Pflichtversicherung.'}
 ],
 term:'Hälfte/Hälfte',def:'KV, PV, RV, ALV: Arbeitnehmer und Arbeitgeber zahlen je die Hälfte. UV: nur der Arbeitgeber.',
 ihk:'Arbeitslosenversicherung 2,6 %, davon 1,3 % Arbeitnehmeranteil. Beitrag = Brutto × Satz : 100.',
 weil:'… weil Arbeitnehmer und Arbeitgeber den Beitrag je zur Hälfte zahlen.'}
];
/* ===== Verzweigung: Die Vertragsentscheidung im Juli verändert die Geschichte im Februar ===== */
const BRANCH=[
{id:'v1',when:'bad',area:'m9',from:'hansen',title:'Verzweigung: Ende Februar ist Schluss?',src:SRC.KSchG,
 msg:p=>`${NM(p)}, erinnerst du dich an den Sommer? Wir haben nichts Richtiges unterschrieben. Du bist für mich eine Aushilfe. Ende Februar ist Schluss, ich verlängere nicht. Eine Kündigung brauche ich dafür nicht.`,
 note:'Folge eurer Entscheidung im Juli: Der Vertrag wurde nicht sauber geschlossen.',
 opts:[
  {t:'Doch. Ich habe einen unbefristeten Vertrag, weil eine Befristung nur schriftlich wirksam ist. Sie müssten schriftlich kündigen, mit Frist. Und das Kündigungsschutzgesetz gilt.',law:2,k:4,why:'Richtig. Ohne wirksame Befristung gilt der Vertrag unbefristet. Er endet nur durch Kündigung (schriftlich, mit Frist) oder Aufhebungsvertrag. Bei mehr als 10 Beschäftigten und mehr als 6 Monaten gilt das Kündigungsschutzgesetz.'},
  {t:'Stimmt. Dann suche ich mir bis Ende Februar etwas Neues.',law:0,why:'Falsch. Der Vertrag läuft unbefristet. Ohne wirksame Kündigung endet er nicht.'},
  {t:'Dann gehe ich in einem Jahr zum Arbeitsgericht.',law:0,why:'Falsch. Wer sich gegen eine Kündigung wehrt, muss innerhalb von 3 Wochen klagen.'}
 ],
 term:'Unbefristeter Vertrag',def:'Endet nur durch Kündigung, Aufhebungsvertrag oder Rente – nicht von selbst.',
 ihk:'Ist die Befristung unwirksam, gilt der Arbeitsvertrag als auf unbestimmte Zeit geschlossen. Er kann nur durch Kündigung oder Aufhebungsvertrag beendet werden.',
 weil:'… weil ein unbefristeter Vertrag nur durch eine wirksame Kündigung endet.'},
{id:'v2',when:'good',area:'m9',from:'hansen',title:'Verzweigung: Eine Stelle fällt weg',src:SRC.KSchG,
 msg:p=>`${NM(p)}, der Winter war schlecht. Ich muss einer Person im Verkauf betriebsbedingt kündigen. Dein Vertrag ist ja sauber. Aber du bist am kürzesten als Fachkraft dabei – also trifft es dich. Fertig.`,
 note:'Folge eurer Entscheidung im Juli: Euer Vertrag ist sauber. Jetzt geht es um den Kündigungsschutz.',
 opts:[
  {t:'So einfach geht das nicht. Bei einer betriebsbedingten Kündigung müssen Sie eine Sozialauswahl machen: Betriebszugehörigkeit, Alter, Unterhaltspflichten, Schwerbehinderung. Und die Kündigung muss schriftlich sein.',law:2,k:4,why:'Richtig. Gilt das Kündigungsschutzgesetz, zählt bei betriebsbedingter Kündigung die Sozialauswahl. Gekündigt wird, wen es am wenigsten hart trifft.'},
  {t:'Okay. Wer zuletzt kommt, geht zuerst. Das ist die Regel.',law:0,why:'Falsch. Die Betriebszugehörigkeit ist nur ein Punkt der Sozialauswahl. Alter, Unterhaltspflichten und Schwerbehinderung zählen auch.'},
  {t:'Betriebsbedingte Kündigungen sind in Deutschland verboten.',law:0,why:'Falsch. Betriebsbedingte Kündigungen sind erlaubt. Sie müssen aber sozial gerechtfertigt sein.'}
 ],
 term:'Sozialauswahl',def:'Betriebszugehörigkeit, Lebensalter, Unterhaltspflichten, Schwerbehinderung: Gekündigt wird, wen es am wenigsten hart trifft.',
 ihk:'Bei einer betriebsbedingten Kündigung ist eine Sozialauswahl vorzunehmen (Betriebszugehörigkeit, Lebensalter, Unterhaltspflichten, Schwerbehinderung).',
 weil:'… weil bei betriebsbedingter Kündigung eine Sozialauswahl gemacht werden muss.'}
];
const ALLSC=()=>SCENES.concat(FOLLOW,BRANCH);

/* ===== Prüfungsfragen (a = Index der richtigen Antwort im Original; wird gemischt) ===== */
const QS=[
// Modul 7
{id:'q01',mod:7,ihk:'Sommer 2021, Aufgabe 22',q:'Frau Herbst hat im März einen Arbeitsvertrag mit der Winter KG geschlossen: Sie fängt „sofort nach bestandener Prüfung“ an. Laut Vertrag endet ihre Ausbildung am 31. Juli. Am 14. Juli besteht sie. Wann kann sie frühestens bei der Winter KG anfangen?',o:['am 15. Juli','am 1. August','erst wenn der Ausbildungsbetrieb zustimmt','am 15. Juli, aber bis zum IHK-Zeugnis mit Azubi-Geld'],a:0,why:'Die Ausbildung endet mit der Bekanntgabe des Ergebnisses, nicht mit dem Vertragsdatum.'},
{id:'q02',mod:7,q:'Ist ein mündlich geschlossener Arbeitsvertrag gültig?',o:['Ja, der Arbeitgeber muss die Bedingungen aber aufschreiben (Nachweisgesetz).','Nein, ein Arbeitsvertrag muss immer unterschrieben sein.','Nur bei Minijobs.'],a:0,why:'Arbeitsverträge sind formfrei. Das Nachweisgesetz verlangt nur, dass die Bedingungen aufgeschrieben werden.'},
{id:'q03',mod:7,q:'Was muss beim Arbeitsvertrag schriftlich mit Unterschrift beider Seiten vereinbart werden?',o:['die Befristung','das Gehalt','die Probezeit'],a:0,why:'Nur die Befristung braucht die Schriftform. Sonst gilt der Vertrag unbefristet.'},
{id:'q04',mod:7,q:'Wie lange darf die Probezeit im Arbeitsverhältnis höchstens dauern?',o:['6 Monate','4 Monate','12 Monate'],a:0,why:'Höchstens 6 Monate. 1 bis 4 Monate gelten in der Ausbildung.'},
{id:'q05',mod:7,tf:true,q:'Wahr oder falsch? Die Frage „Sind Sie in einer Gewerkschaft?“ ist im Vorstellungsgespräch erlaubt.',o:['falsch','wahr'],a:0,why:'Unzulässig: Die Koalitionsfreiheit schützt die Mitgliedschaft (Art. 9 GG).'},
{id:'q06',mod:7,tf:true,q:'Wahr oder falsch? Minijobber haben keinen Anspruch auf Urlaub.',o:['falsch','wahr'],a:0,why:'Urlaub, Entgeltfortzahlung und Mindestlohn gelten auch im Minijob.'},
{id:'q07',mod:7,q:'Mia besteht die Prüfung und arbeitet am nächsten Tag einfach weiter. Niemand hat etwas vereinbart. Was gilt?',o:['ein unbefristeter Arbeitsvertrag','ein befristeter Vertrag bis zur Unterschrift','gar kein Vertrag'],a:0,why:'Weiterarbeit ohne Vereinbarung = Arbeitsverhältnis auf unbestimmte Zeit (§ 24 BBiG).'},
{id:'q08',mod:7,q:'Wie lange darf ein Arbeitsvertrag ohne sachlichen Grund höchstens befristet werden?',o:['2 Jahre','6 Monate','5 Jahre'],a:0,why:'Ohne sachlichen Grund höchstens 2 Jahre, bis zu dreimal verlängerbar.'},
{id:'q09',mod:7,q:'Welche Frage ist im Vorstellungsgespräch für eine Kassenstelle erlaubt?',o:['Sind Sie wegen Diebstahls vorbestraft?','Welcher Religion gehören Sie an?','Wen haben Sie gewählt?'],a:0,why:'Bei Geld- oder Warenverantwortung darf nach einschlägigen Vorstrafen gefragt werden.'},
{id:'q10',mod:7,q:'Bis wann muss man sich spätestens arbeitsuchend melden, wenn man nicht übernommen wird?',o:['3 Monate vor dem Ende','1 Monat vor dem Ende','am ersten Tag ohne Arbeit'],a:0,why:'Spätestens 3 Monate vorher, sonst 1 Woche Sperrzeit.'},
// Modul 8
{id:'q11',mod:8,ihk:'Winter 2021/22, Aufgabe 19',q:'Frau Lorenz hat ihre Ausbildung beendet. Hat sie ein Recht auf ein qualifiziertes Ausbildungszeugnis?',o:['Ja, wenn sie es verlangt.','Ja, wenn sie die Kosten selbst trägt.','Nein, das IHK-Prüfungszeugnis reicht.','Nein, über die Ausbildung gibt es keine Zeugnisse.'],a:0,why:'Das einfache Zeugnis gibt es immer, das qualifizierte auf Verlangen (§ 16 BBiG). Kosten trägt der Betrieb.'},
{id:'q12',mod:8,q:'Was enthält ein qualifiziertes Zeugnis zusätzlich zum einfachen?',o:['Leistung und Verhalten','das Gehalt','die Krankheitstage'],a:0,why:'Einfach: Art und Dauer. Qualifiziert: zusätzlich Leistung und Verhalten.'},
{id:'q13',mod:8,q:'„Sie erledigte die ihr übertragenen Aufgaben stets zu unserer vollsten Zufriedenheit.“ Welche Note ist das?',o:['sehr gut','gut','befriedigend'],a:0,why:'„stets“ + „vollsten“ = sehr gut.'},
{id:'q14',mod:8,q:'„Er bemühte sich, die ihm übertragenen Aufgaben zu unserer Zufriedenheit zu erledigen.“ Welche Note ist das?',o:['ungenügend','ausreichend','befriedigend'],a:0,why:'„bemühte sich“ ist die schlechteste Formel.'},
{id:'q15',mod:8,q:'Welche Pflicht hat der Arbeitgeber?',o:['Fürsorgepflicht','Wettbewerbsverbot','Schweigepflicht'],a:0,why:'Fürsorge (Gesundheit schützen, gleich behandeln) ist eine Arbeitgeberpflicht. Die anderen sind Pflichten des Arbeitnehmers.'},
{id:'q16',mod:8,q:'Arbeitsvertrag: 26 Arbeitstage Urlaub. Tarifvertrag (gilt im Betrieb): 30. Was gilt?',o:['30 Tage','26 Tage','20 Tage'],a:0,why:'Günstigkeitsprinzip: Es gilt die für den Arbeitnehmer günstigere Regel.'},
{id:'q17',mod:8,q:'Welche Rangfolge stimmt (von oben nach unten)?',o:['Gesetz – Tarifvertrag – Betriebsvereinbarung – Arbeitsvertrag','Arbeitsvertrag – Tarifvertrag – Gesetz – Betriebsvereinbarung','Tarifvertrag – Gesetz – Arbeitsvertrag – Betriebsvereinbarung'],a:0,why:'Die untere Stufe darf die obere nicht verschlechtern.'},
{id:'q18',mod:8,tf:true,q:'Wahr oder falsch? In einem Arbeitszeugnis dürfen geheime Zeichen stehen.',o:['falsch','wahr'],a:0,why:'Geheime Zeichen und negative Andeutungen sind verboten. Das Zeugnis muss wohlwollend sein.'},
{id:'q19',mod:8,q:'Eine Verkäuferin erzählt Freunden, wann der Tresor geleert wird. Welche Pflicht verletzt sie?',o:['Schweigepflicht','Arbeitspflicht','Anzeigepflicht'],a:0,why:'Betriebs- und Geschäftsgeheimnisse muss man wahren.'},
// Modul 9
{id:'q20',mod:9,ihk:'Sommer 2023, Aufgabe 15',q:'Wer genießt besonderen gesetzlichen Kündigungsschutz? Herr Brugger (17, Azubi im 2. Jahr) und Herr Dengler (40, in Elternzeit) – oder …',o:['Brugger und Dengler','Axmann (Azubi in der Probezeit) und Conrad (befristet)','Eisen (Abteilungsleiterin) und Fischer (Ausbildungsleiterin)'],a:0,why:'Azubi nach der Probezeit und Elternzeit. In der Probezeit gibt es keinen besonderen Schutz.'},
{id:'q21',mod:9,q:'Welche Kündigung ist wirksam?',o:['schriftlich mit eigenhändiger Unterschrift','per E-Mail','per WhatsApp'],a:0,why:'Kündigung nur schriftlich mit eigenhändiger Unterschrift (§ 623 BGB).'},
{id:'q22',mod:9,q:'Wie lang ist die gesetzliche Grundkündigungsfrist?',o:['4 Wochen zum 15. oder zum Monatsende','2 Wochen','3 Monate zum Quartalsende'],a:0,why:'Grundfrist 4 Wochen zum 15. oder zum Monatsende. In der Probezeit 2 Wochen.'},
{id:'q23',mod:9,q:'Innerhalb welcher Frist muss eine Kündigungsschutzklage erhoben werden?',o:['3 Wochen','3 Monate','1 Jahr'],a:0,why:'Innerhalb von 3 Wochen beim Arbeitsgericht, sonst gilt die Kündigung als wirksam.'},
{id:'q24',mod:9,q:'Wann gilt das Kündigungsschutzgesetz?',o:['nach 6 Monaten im Betrieb mit mehr als 10 Beschäftigten','ab dem ersten Tag in jedem Betrieb','nur für Beschäftigte über 50'],a:0,why:'Länger als 6 Monate im Betrieb und mehr als 10 Beschäftigte (Azubis zählen nicht).'},
{id:'q25',mod:9,q:'Ein Verkäufer steckt nachweislich 200 € aus der Kasse ein. Was ist möglich?',o:['fristlose Kündigung ohne Abmahnung','nur eine Abmahnung','nur eine ordentliche Kündigung'],a:0,why:'Diebstahl ist ein wichtiger Grund.'},
{id:'q26',mod:9,q:'Welche drei Gründe kennt das Kündigungsschutzgesetz?',o:['personen-, verhaltens- und betriebsbedingt','alters-, kranken- und lohnbedingt','fristlos, ordentlich und befristet'],a:0,why:'Nur dann ist die Kündigung sozial gerechtfertigt.'},
{id:'q27',mod:9,q:'Was zählt bei der Sozialauswahl?',o:['Betriebszugehörigkeit, Alter, Unterhaltspflichten, Schwerbehinderung','Leistung, Aussehen, Wohnort','Gehalt und Zeugnisnote'],a:0,why:'Gekündigt wird, wen es am wenigsten hart trifft.'},
{id:'q28',mod:9,tf:true,q:'Wahr oder falsch? Bei einer ordentlichen Kündigung durch den Arbeitnehmer gelten nach 5 Jahren längere Fristen.',o:['falsch','wahr'],a:0,why:'Die längeren Fristen gelten nur, wenn der Arbeitgeber kündigt.'},
{id:'q29',mod:9,q:'Welche Folge hat ein Aufhebungsvertrag ohne wichtigen Grund meistens?',o:['12 Wochen Sperrzeit beim Arbeitslosengeld','eine Abfindung von einem Monatsgehalt','eine Verlängerung der Kündigungsfrist'],a:0,why:'Ein Aufhebungsvertrag zählt wie eine eigene Kündigung.'},
// Modul 10
{id:'q30',mod:10,ihk:'Sommer 2026, Aufgabe 25',q:'Welche Regelung entspricht den Unfallverhütungsvorschriften im Einzelhandel?',o:['Jeder Mitarbeiter muss Arbeitsunfälle unverzüglich melden.','Jeder Mitarbeiter muss Sicherheitsmängel an Geräten selbst beseitigen.','Jeder Mitarbeiter muss in Erster Hilfe ausgebildet sein.','Jeder Mitarbeiter muss im Verkaufsraum Sicherheitsschuhe tragen.'],a:0,why:'Mängel melden statt selbst beseitigen. Erste Hilfe nur ein Teil der Belegschaft.'},
{id:'q31',mod:10,ihk:'Sommer 2026, Aufgabe 27',q:'Wer erlässt die verbindlichen Unfallverhütungsvorschriften?',o:['die zuständige Berufsgenossenschaft','die Gewerbeaufsicht','das Ordnungsamt','der Einzelhandelsverband'],a:0,why:'Die Gewerbeaufsicht überwacht Gesetze, erlässt aber keine UVV.'},
{id:'q32',mod:10,ihk:'Sommer 2026, Aufgabe 28',q:'Was trifft auf den Sicherheitsbeauftragten zu?',o:['Er unterstützt die Geschäftsleitung bei der Unfallverhütung.','Er haftet bei allen Arbeitsunfällen.','Er ist die einzige Person, die Brände löschen darf.','Er ist ein Organ laut Betriebsverfassungsgesetz.'],a:0,why:'Er unterstützt, haftet nicht und ist kein Vorgesetzter.'},
{id:'q33',mod:10,ihk:'Sommer 2026, Aufgabe 29',q:'Welche Regelung zur Unterweisung ist richtig?',o:['bei Neueinstellungen und in regelmäßigen Abständen','nur bei ungelernten Kräften','nicht nötig, wenn die UVV aushängen','erst nach 6 Monaten Beschäftigung'],a:0,why:'Unterweisung bei Einstellung und regelmäßig, Jugendliche halbjährlich.'},
{id:'q34',mod:10,ihk:'Winter 2021/22, Aufgabe 21',q:'Welcher Vorschlag dient NICHT dem vorbeugenden Brandschutz?',o:['Die Brandschutztür zwischen Lager und Verkaufsraum soll stets offen stehen.','Feuerlöscher sichtbar und erreichbar anbringen.','Regelmäßig Probealarme durchführen.','Strahler mit Abstand zu Schaustücken anbringen.'],a:0,why:'Brandschutztüren müssen schließen können.'},
{id:'q35',mod:10,q:'Wie sehen Gebotszeichen aus?',o:['rund und blau','rund, rot, durchgestrichen','dreieckig und gelb'],a:0,why:'Rund + blau = Gebot.'},
{id:'q36',mod:10,q:'Wie sehen Rettungszeichen aus?',o:['grünes Rechteck','rotes Rechteck','gelbes Dreieck'],a:0,why:'Grünes Rechteck = Rettung. Rotes Rechteck = Brandschutz.'},
{id:'q37',mod:10,q:'Welche Behörde kann Bußgelder verhängen und Betriebsteile stilllegen?',o:['die Gewerbeaufsicht','der Sicherheitsbeauftragte','die Krankenkasse'],a:0,why:'Die Gewerbeaufsicht überwacht als staatliche Behörde die Arbeitsschutzgesetze.'},
{id:'q38',mod:10,q:'Was ist im Brandfall verboten?',o:['den Aufzug benutzen','die 112 anrufen','Türen schließen'],a:0,why:'Im Brandfall nie den Aufzug benutzen und nicht zurücklaufen.'},
{id:'q39',mod:10,q:'Was ist die häufigste Unfallursache im Handel?',o:['Rutschen, Stolpern, Stürzen','Stromschläge','Verbrennungen'],a:0,why:'Rutschgefahr: sofort wischen und absichern.'},
{id:'q40',mod:10,q:'Wer muss einen Betriebsarzt und eine Fachkraft für Arbeitssicherheit bestellen?',o:['der Arbeitgeber (Arbeitssicherheitsgesetz)','der Betriebsrat','die Berufsgenossenschaft'],a:0,why:'Nach dem Arbeitssicherheitsgesetz bestellt der Betrieb sie. Sie beraten den Arbeitgeber.'},
{id:'q41',mod:10,q:'Was bedeutet das GS-Zeichen?',o:['geprüfte Sicherheit durch eine unabhängige Stelle','Hersteller erklärt EU-Vorgaben','gesundheitsschädlich'],a:0,why:'GS = geprüfte Sicherheit. CE = Erklärung des Herstellers.'},
{id:'q42',mod:10,tf:true,q:'Wahr oder falsch? Technischer Arbeitsschutz regelt Arbeitszeit und Urlaub.',o:['falsch','wahr'],a:0,why:'Das ist sozialer Arbeitsschutz. Technischer Arbeitsschutz: Maschinen, Räume, Brandschutz, Gefahrstoffe.'},
// Modul 11
{id:'q43',mod:11,ihk:'Sommer 2021, Aufgabe 20',q:'Frau Herbst möchte am Tag vor der schriftlichen Abschlussprüfung freigestellt werden. Muss der Betrieb sie freistellen?',o:['Ja, unabhängig von ihrem Alter.','Ja, aber nur weil sie minderjährig ist.','Ja, aber mit Abzug von der Vergütung.','Nur wenn der Prüfungstag ein Berufsschultag ist.'],a:0,why:'Der Arbeitstag vor der schriftlichen Prüfung ist frei, bezahlt und für alle Azubis (§ 15 BBiG).'},
{id:'q44',mod:11,ihk:'Sommer 2021, Aufgabe 21',q:'Frau Herbst (17) arbeitet montags von 9:00 bis 18:00 Uhr. Wann muss sie spätestens eine Pause bekommen?',o:['13:30 Uhr','12:00 Uhr','14:30 Uhr','12:30 Uhr'],a:0,why:'9:00 Uhr + 4,5 Stunden = 13:30 Uhr.'},
{id:'q45',mod:11,q:'Wie lange müssen Erwachsene zwischen zwei Arbeitstagen frei haben?',o:['11 Stunden','12 Stunden','8 Stunden'],a:0,why:'Erwachsene 11, Jugendliche 12 Stunden Ruhezeit.'},
{id:'q46',mod:11,q:'Wie viel Pause brauchen Erwachsene bei 7 Stunden Arbeit?',o:['30 Minuten','60 Minuten','15 Minuten'],a:0,why:'Mehr als 6 Stunden: 30 Minuten. Mehr als 9 Stunden: 45 Minuten.'},
{id:'q47',mod:11,q:'Wie viele Werktage Urlaub hat eine 17-Jährige mindestens?',o:['25','24','30'],a:0,why:'Unter 18: 25 Werktage (JArbSchG).'},
{id:'q48',mod:11,q:'Wie lange gilt das Beschäftigungsverbot nach der Geburt?',o:['8 Wochen (bei Früh- und Mehrlingsgeburten 12)','6 Wochen','4 Monate'],a:0,why:'Schutzfrist: 6 Wochen vor, 8 Wochen nach der Geburt.'},

{id:'q50',mod:11,q:'Bis wie viel Uhr dürfen Jugendliche im Einzelhandel arbeiten?',o:['20 Uhr','21 Uhr','22 Uhr'],a:0,why:'Jugendliche nur von 6 bis 20 Uhr.'},
{id:'q51',mod:11,tf:true,q:'Wahr oder falsch? Erwachsene dürfen bis zu 10 Stunden am Tag arbeiten, wenn es einen Ausgleich gibt.',o:['wahr','falsch'],a:0,why:'8 Stunden, bis 10 Stunden mit Ausgleich (§ 3 ArbZG).'},

{id:'q53',mod:6,ihk:'Sommer 2021, Aufgabe 25',q:'Welcher Sachverhalt über die Pflegeversicherung trifft zu?',o:['Gesetzlich Krankenversicherte sind automatisch in der Pflegeversicherung ihrer Krankenkasse.','Privat Versicherte sind von der Pflegeversicherung befreit.','Der Beitrag ist für alle gleich hoch, mit oder ohne Kinder.','Nur Personen über 23 zahlen ein.'],a:0,why:'Kinderlose ab 23 zahlen mehr. Privat Versicherte brauchen eine private Pflegeversicherung.'},

{id:'q55',mod:6,ihk:'Winter 2021/22, Aufgabe 20',q:'Welche Leistung erhalten Sie von der Deutschen Rentenversicherung?',o:['Kuren zur Erhaltung der Arbeitsfähigkeit','Elterngeld','Krankengeld nach 6 Wochen','Umschulung nach einem Arbeitsunfall'],a:0,why:'Reha vor Rente. Umschulung nach Arbeitsunfall zahlt die BG.'},
{id:'q56',mod:6,ihk:'Sommer 2018, Aufgabe 27',q:'Ehemalige Mitarbeiter eines insolventen Betriebs werden zu Kaufleuten im Einzelhandel umgeschult. Wer zahlt?',o:['die Agentur für Arbeit','die IHK','die künftigen Betriebe','Teilnehmer und Agentur je zur Hälfte'],a:0,why:'Umschulung ist eine Leistung der Arbeitslosenversicherung.'},
{id:'q57',mod:6,ihk:'Sommer 2020, Aufgabe 24',q:'Welche Leistung übernimmt die Berufsgenossenschaft?',o:['Heilkosten für Unfälle auf dem direkten Weg zur Arbeit','Heilkosten für den Unfall eines Kunden','Grippeschutzimpfung','Unfälle in der Freizeit'],a:0,why:'Kunden und Freizeit sind nicht versichert. Impfung zahlt die Krankenkasse.'},
{id:'q58',mod:6,ihk:'Sommer 2021, Aufgabe 24',q:'Eine Mitarbeiterin hatte auf dem direkten Weg zur Arbeit einen Unfall und ist eine Woche krank. Was muss der Betrieb tun?',o:['den Unfall der Berufsgenossenschaft melden','die Lohnzahlung sofort einstellen','die Pflegeversicherung informieren','den Polizeibericht anfordern'],a:0,why:'Wegeunfall, mehr als 3 Tage arbeitsunfähig → Unfallanzeige an die BG.'},
{id:'q59',mod:6,ihk:'Sommer 2021, Aufgabe 28',q:'Ein Mitarbeiter verletzt sich bei Lagerarbeiten so schwer, dass er umschulen muss. Wer trägt die Kosten?',o:['die Berufsgenossenschaft','der Arbeitgeber','seine private Unfallversicherung','der Einzelhandelsverband'],a:0,why:'Umschulung nach einem Arbeitsunfall zahlt die BG.'},
{id:'q60',mod:6,ihk:'Sommer 2018, Aufgabe 21',q:'Frau Schuster verdient 1.700,00 € brutto. 9,3 % gehen an die Rentenversicherung. Wie hoch ist ihr Arbeitnehmeranteil?',o:['158,10 €','316,20 €','15,81 €','170,00 €'],a:0,why:'1.700 × 9,3 : 100 = 158,10 €.'},
{id:'q61',mod:6,ihk:'Sommer 2021, Aufgabe 23',q:'Frau Tomaschek verdient statt 1.800,00 € jetzt 1.920,00 € brutto. Wie viel mehr wird ihr für die Rentenversicherung (9,3 %) abgezogen?',o:['11,16 €','22,32 €','12,00 €','178,56 €'],a:0,why:'120 € × 9,3 : 100 = 11,16 €.'},
{id:'q62',mod:6,q:'Wer zahlt den Beitrag zur Unfallversicherung?',o:['nur der Arbeitgeber','Arbeitnehmer und Arbeitgeber je zur Hälfte','nur der Arbeitnehmer'],a:0,why:'Die Unfallversicherung zahlt der Arbeitgeber allein.'},
{id:'q63',mod:6,q:'Wie hoch ist das Krankengeld?',o:['70 % vom Brutto, höchstens 90 % vom Netto','100 % vom Netto','60 % vom Netto'],a:0,why:'Ab der 7. Woche zahlt die Krankenkasse Krankengeld.'},
{id:'q64',mod:6,q:'Ab wann muss der Betrieb einen Arbeitsunfall der BG melden?',o:['wenn jemand mehr als 3 Tage arbeitsunfähig ist','bei jedem Pflaster','erst nach 6 Wochen'],a:0,why:'Mehr als 3 Tage arbeitsunfähig → Unfallanzeige innerhalb von 3 Tagen.'}

/* ===== Für Profis (Freitext, Musterlösung aus den Lösungsblättern) ===== */
const PROFIS=[
{id:'p01',mod:7,q:'Eine Bewerberin verschweigt im Vorstellungsgespräch ihre Schwangerschaft. Nach drei Monaten will der Arbeitgeber den Vertrag wegen arglistiger Täuschung anfechten. Prüft mit dem Vier-Schritte-Schema.',a:'Problem: Darf der Arbeitgeber anfechten? Regel: Eine Täuschung berechtigt nur zur Anfechtung, wenn die Frage zulässig war. Die Frage nach der Schwangerschaft ist unzulässig (AGG) – es gilt ein „Recht zur Lüge“. Ergebnis: keine Anfechtung, der Vertrag bleibt; dazu Kündigungsschutz nach dem Mutterschutzgesetz.'},
{id:'p02',mod:7,q:'Beurteilt, warum das Gesetz für die Befristung die Schriftform verlangt, für den Arbeitsvertrag selbst aber nicht.',a:'Die Befristung nimmt dem Arbeitnehmer den Kündigungsschutz – er soll vorher klar sehen, worauf er sich einlässt (Warn- und Beweisfunktion). Der unbefristete Vertrag ist der Normalfall und schützt den Arbeitnehmer; da reicht der Nachweis.'},
{id:'p03',mod:7,q:'Vergleicht Ausbildungsvertrag und Arbeitsvertrag in drei Punkten (Ziel, Form, Probezeit, Kündigung).',a:'Ausbildung: Ziel Berufsausbildung, schriftlich/Textform mit Pflichtangaben, Probezeit 1–4 Monate, nach der Probezeit nur aus wichtigem Grund kündbar (Arbeitgeber). Arbeitsvertrag: Ziel Arbeit gegen Lohn, formfrei (Nachweis), Probezeit bis 6 Monate, ordentlich kündbar.'},
{id:'p04',mod:8,q:'Der Tarifvertrag sieht 36 Werktage Urlaub vor. Lena ist nicht in der Gewerkschaft, ihr Betrieb nicht im Arbeitgeberverband, im Vertrag stehen 24 Werktage. Wie viel Urlaub steht ihr zu?',a:'Ohne beidseitige Tarifbindung gilt der Tarifvertrag nur, wenn er allgemeinverbindlich ist oder der Arbeitsvertrag auf ihn verweist. Sonst gilt der Vertrag – aber nie weniger als das Gesetz: 24 Werktage (BUrlG).'},
{id:'p05',mod:8,q:'Erläutert den Widerspruch „wahr und wohlwollend“ und beurteilt, ob die Zeugnissprache sinnvoll ist.',a:'Wahr: keine falschen guten Noten (Schutz des nächsten Arbeitgebers). Wohlwollend: keine unnötigen Hürden für den Arbeitnehmer. Die Formelsprache löst den Konflikt, ist für Laien aber schwer lesbar. Pro: vergleichbar. Contra: versteckte Botschaften.'},
{id:'p06',mod:9,q:'Die Super Mode GmbH will Peter Fuchs (43, verheiratet, zwei Kinder in Ausbildung, 12 Jahre im Betrieb) betriebsbedingt kündigen. Im Büro arbeiten auch Jana K. (26, ledig, 2 Jahre) und Olaf P. (58, verheiratet, 30 Jahre). Wem müsste gekündigt werden?',a:'Vergleich nach Betriebszugehörigkeit, Alter, Unterhaltspflichten: Jana K. ist am wenigsten schutzwürdig. Die Kündigung von Peter Fuchs ist nicht sozial gerechtfertigt, wenn Jana vergleichbare Arbeit macht.'},
{id:'p07',mod:9,q:'Beurteilt die These: „Der Kündigungsschutz verhindert, dass Betriebe neue Leute einstellen.“',a:'Pro: Betriebe scheuen Festeinstellungen und befristen lieber. Contra: Schutz vor Willkür, Sicherheit für Familien; kleine Betriebe (bis 10) sind ausgenommen, die Probezeit erlaubt Ausprobieren. Urteil begründet.'},
{id:'p08',mod:9,q:'Erklärt, warum eine Kündigungsschutzklage innerhalb von 3 Wochen erhoben werden muss.',a:'Rechtssicherheit: Beide Seiten sollen schnell wissen, ob das Arbeitsverhältnis endet. Der Betrieb muss planen können.'},
{id:'p09',mod:10,q:'Erstellt für das Lager von Kutter & Korb eine kleine Gefährdungsbeurteilung: drei Gefährdungen, je Risiko und Maßnahme nach dem STOP-Prinzip (Substitution, Technik, Organisation, Persönliche Schutzausrüstung).',a:'z. B. Kisten heben – mittel – Hubwagen (T), Pausen/Wechsel (O), Sicherheitsschuhe (P); Leiter – hoch – Tritt mit Bügel (T), Unterweisung (O); Glasbruch – mittel – Kunststoffkästen (S), Handschuhe (P).'},
{id:'p10',mod:10,q:'Erklärt, warum die persönliche Schutzausrüstung im STOP-Prinzip am Ende steht.',a:'Wer die Gefahr beseitigt oder technisch abschirmt, schützt alle zuverlässig. Schutzausrüstung wirkt nur, wenn jeder Einzelne sie richtig trägt – das letzte Mittel.'},
{id:'p11',mod:10,q:'Beurteilt: „Arbeitsschutz kostet nur Geld.“ Bezieht BG-Beiträge, Ausfallzeiten und Image ein.',a:'Unfälle kosten mehr: Lohnfortzahlung, Ersatzpersonal, höhere BG-Beiträge, Bußgelder, Imageschaden. Arbeitsschutz senkt Ausfälle und erhöht die Motivation.'},
{id:'p12',mod:11,q:'Beurteilt, warum das Gesetz Jugendliche strenger schützt als Erwachsene.',a:'Jugendliche sind noch in der Entwicklung, brauchen mehr Erholung und Zeit für die Schule; sie können sich schlechter gegen Druck wehren.'},
{id:'p13',mod:6,q:'Kemal verletzt sich durch einen Fehler seiner Chefin. Er will sie auf Schmerzensgeld verklagen. Geht das? (Stichwort: Haftungsablösung)',a:'Bei Arbeitsunfällen haften Arbeitgeber und Kollegen nicht für Personenschäden, die BG zahlt – außer bei Vorsatz oder auf dem allgemeinen Arbeitsweg. Hier: Fehler, kein Vorsatz → Kemal kann nicht klagen, die BG zahlt.'},
{id:'p14',mod:6,q:'Kasse A verlangt 2,5 % Zusatzbeitrag, Kasse B 3,4 %. Wie viel spart Ayşe (2.500 € brutto) im Jahr mit Kasse A?',a:'Unterschied 0,9 %, Arbeitnehmeranteil die Hälfte = 0,45 %. 2.500 € × 0,45 : 100 = 11,25 € im Monat × 12 = 135 € im Jahr.'},
{id:'p15',mod:6,q:'Begründet, warum die Arbeitgeber die Unfallversicherung allein bezahlen.',a:'Die Unfallversicherung ersetzt die Haftung des Arbeitgebers: Er ist für die Sicherheit verantwortlich und wird dafür von Schadenersatz befreit. Hohe Beiträge bei vielen Unfällen sind ein Anreiz zur Unfallverhütung.'}
