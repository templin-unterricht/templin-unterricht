/* ===== Spanisch (Sprachhilfe): m = Nachricht, n = Hinweis, o = Antworten, t = Fachbegriff, w = Regel (Krise) ===== */
const ESN=p=>p.a.n;
const ES={
 a1:{m:p=>`¡Enhorabuena, ${ESN(p)}! Hoy ha llegado el resultado: aprobado. Tu contrato de formación dura hasta el 31 de julio. Hasta entonces eres aprendiz con sueldo de aprendiz. En agosto hablamos de un contrato.`,o:['Vale. Hasta el 31 de julio sigo siendo aprendiz.','Mi formación termina hoy con el resultado. Si mañana sigo trabajando, soy trabajador/a cualificado/a. Sin acuerdo, el contrato es incluso indefinido.','Entonces me quedo en casa hasta finales de julio. El sueldo de aprendiz sigue.'],t:'Fin de la formación: termina cuando se comunica el resultado del examen.'},
 a2:{m:p=>`¡Hola ${ESN(p)}! En marzo firmé un contrato con el puesto de pescado «Möwe»: «inmediatamente después de aprobar». ¡Hoy he aprobado! Mi empresa de formación dice que tengo que quedarme hasta el 31 de julio. ¿Es verdad?`,o:['Sí. Sin el permiso de tu empresa no puedes cambiar.','No. Tu formación termina hoy. Mañana puedes empezar en «Möwe». El contrato lo podías firmar ya en marzo.','Puedes empezar mañana. Pero hasta que llegue el certificado de la Cámara, «Möwe» solo te paga sueldo de aprendiz.'],t:'En los últimos seis meses de la formación se puede firmar un contrato de trabajo, también con otra empresa.'},
 a3:{m:'Nuestra otra aprendiz, Jana, no se queda. Lo sabe desde el 20 de marzo. Su formación termina el 31 de julio. Quiere inscribirse en la Agencia de Empleo el 1 de julio. ¿Es suficiente?',o:['Sí. Hay que inscribirse solo cuando uno ya está en paro.','No. Tiene que inscribirse como muy tarde tres meses antes del final, o sea, hasta el 30 de abril. Si no, hay una semana de sanción.','No, llega tarde. Ahora ya no recibe nada de prestación por desempleo.'],t:'Inscribirse como demandante de empleo: como muy tarde 3 meses antes del final.'},
 a4:{m:p=>`${ESN(p)}, desde el examen sigues trabajando en la tienda. No hemos firmado nada. Entonces ahora eres ayudante a prueba. Te puedo mandar a casa cuando quiera.`,o:['Es verdad. Sin firma no tengo contrato.','No. Sigo trabajando después de la formación sin ningún acuerdo. Por eso tengo un contrato indefinido.','Entonces ahora tengo un contrato temporal hasta que firmemos.'],t:'Seguir trabajando después de la formación sin acuerdo = contrato indefinido.'},
 b1:{m:p=>`En julio asumo la dirección de la tienda de mi padre. Por eso unas preguntas, ${ESN(p)}. ¿Planea tener hijos en los próximos años?`,o:['Tengo que contestar con sinceridad. Si no, el contrato se puede anular después.','Esta pregunta no está permitida. No tengo que contestarla.','Contesto solo cuando el contrato esté firmado.'],t:'Pregunta no permitida: embarazo, deseo de tener hijos, religión, sindicato o partido.'},
 b2:{m:'¿Es usted miembro de ver.di? Mi padre ya tuvo problemas con el sindicato.',o:['No tengo que decirlo. Ser miembro de un sindicato está protegido.','No. Y además los sindicatos no me gustan.','Esta pregunta está permitida si la empresa está en la asociación de comercio.'],t:'Libertad sindical: todos pueden entrar en un sindicato. La empresa no puede preguntar.'},
 b3:{m:'Aquí trabaja en la caja y por la noche cuenta la caja fuerte. ¿Tiene antecedentes por robo o fraude?',o:['No contesto. Nunca se puede preguntar por antecedentes.','Puede preguntarlo porque trabajo con dinero. Contesto con sinceridad.','Puede preguntarlo. Entonces también puede preguntar por todas las demás multas, por ejemplo por exceso de velocidad.'],t:'Pregunta permitida: experiencia, horario y, con dinero, antecedentes que tengan que ver con el puesto.'},
 b4:{m:'Buscamos otra vendedora. He invitado a una candidata de Bremen a una entrevista. Ahora quiere que le pague el viaje. ¿Tengo que pagarlo?',o:['No. El viaje lo paga siempre la candidata.','Sí. Usted la ha invitado. Entonces tiene que pagar el viaje, salvo que lo haya excluido antes.','Solo si consigue el puesto.'],t:'Gastos de la entrevista: quien invita paga el viaje, salvo que lo excluya antes.'},
 b5:{m:'Para la nueva compañera: ¿qué documentos necesita el primer día? Vendemos pescado y productos delicatessen.',o:['Número fiscal, número de la Seguridad Social, certificado de la caja de enfermedad, cuenta bancaria y la instrucción según la Ley de Protección contra Infecciones.','Número fiscal, número de la Seguridad Social, caja de enfermedad y cuenta bancaria.','Basta con el DNI y el último certificado escolar.'],t:'Documentos de trabajo: número fiscal, Seguridad Social, caja de enfermedad, banco; con alimentos también la instrucción sobre infecciones.'},
 b6:{m:'Última pregunta. ¿Está usted enfermo/a a menudo?',o:['Así en general no lo puede preguntar. Solo está permitido: una enfermedad que me haga no apto/a para este trabajo.','Nunca se puede preguntar por la salud.','La pregunta está permitida. Tengo que decir todas las enfermedades de los últimos años.'],t:'Pregunta por enfermedad: solo se permite si la enfermedad impide este trabajo.'},
 c1:{m:p=>`Bueno, ${ESN(p)}: desde el 1 de agosto eres fijo/a con nosotros, 2.500 € brutos. Lo hacemos con un apretón de manos. No hace falta escribir nada, ¿no?`,o:['Sin contrato firmado no vale nada.','El apretón de manos vale. Pero usted tiene que escribirme las condiciones más importantes y dármelas. Lo exige la Ley de Prueba (Nachweisgesetz).','Claro. Un apretón de manos basta. Nunca hace falta más.'],t:'Nachweisgesetz: el empleador tiene que escribir y entregar las condiciones más importantes.'},
 c2:{m:p=>`Un pequeño cambio, ${ESN(p)}: primero te contrato por 12 meses, con fecha de fin. Queda acordado por WhatsApp. ¿Vale?`,o:['Vale. WhatsApp también es por escrito.','Un contrato temporal tiene que acordarse por escrito con las dos firmas. Por WhatsApp no es válido. Entonces mi contrato es indefinido.','Los contratos temporales están prohibidos después de la formación.'],t:'Contrato temporal: termina solo. La fecha de fin necesita forma escrita con la firma de los dos.'},
 c3:{m:'La nueva compañera de Bremen empieza en agosto. Le pongo nueve meses de período de prueba en el contrato. Así puedo despedirla rápido durante mucho tiempo.',o:['Nueve meses no se puede. El período de prueba dura como máximo seis meses. En ese tiempo el preaviso es de dos semanas.','Sí se puede. La duración es libre.','Como máximo cuatro meses, como en la formación.'],t:'Período de prueba: en el contrato de trabajo como máximo 6 meses; preaviso de 2 semanas.'},
 c4:{m:'Tengo un minijob con vosotros, 550 € al mes. El señor Hansen dice: «Los minijobbers no tienen vacaciones ni cobran si están enfermos». ¿Es así?',o:['Sí. Los minijobs no son contratos de verdad.','No. Tú también tienes derecho a vacaciones, a cobrar si estás enfermo/a y al salario mínimo.','Vacaciones sí. Pero dinero cuando estás enfermo/a no.'],t:'Minijob: hasta 633 € al mes (2027). Vacaciones, pago por enfermedad y salario mínimo también valen.'},
 c5:{m:'Llevo tres años aquí y quiero trabajar solo 25 horas. Por mi espalda. El señor Hansen dice: «La jornada parcial es solo para madres». ¿Tiene razón?',o:['Sí. Jornada parcial solo con hijos.','No. Después de seis meses en la empresa tienes derecho a jornada parcial. Tenemos más de 15 empleados.','No. Pero con jornada parcial pierdes tus vacaciones.'],t:'Jornada parcial: menos horas, mismos derechos. Derecho después de 6 meses en empresas con más de 15 empleados.'},
 c6:{m:'Ahora escribo tus condiciones: nombre, inicio, «sueldo según acuerdo». Listo. No hace falta más.',o:['Basta. Lo importante es que haya algo en papel.','Falta mucho: lugar de trabajo, tarea, período de prueba, sueldo con pluses, horario, vacaciones, plazos de despido y la referencia al convenio colectivo.','Solo falta la cantidad exacta del sueldo.'],t:'Contenido del contrato: nombres, inicio, lugar, tarea, prueba, sueldo, horario, vacaciones, plazos de despido, convenio.'},
 d1:{m:'Tú conoces a los clientes fijos de Kutter & Korb. Prepara por la tarde cestas de regalo para ellos, en privado. ¡A mitad de precio! La mercancía la compramos al por mayor. Repartimos la ganancia.',o:['Buena idea. Después del trabajo puedo hacer lo que quiera.','No. Eso sería competencia para mi propia empresa. Lo prohíbe la prohibición de competencia. Incluso me pueden despedir sin preaviso.','Solo si no se lo cuento al señor Hansen.'],t:'Prohibición de competencia: no hacer competencia a la propia empresa.'},
 d2:{m:'Oye, ¿cuánto vendéis los sábados? ¿Y cuándo lleva tu jefe el dinero al banco? Solo por curiosidad.',o:['Unos 4.000 €. El dinero lo lleva siempre a las 18 h.','No te lo digo. Son secretos de la empresa. Tengo deber de confidencialidad.','Las ventas te las digo. Solo la hora del banco no.'],t:'Deber de confidencialidad: guardar los secretos de la empresa.'},
 d3:{m:'Desde hace dos meses el señor Hansen paga solo el día 20 del mes siguiente. En el contrato pone «a final de mes». Pero yo pago el alquiler el día 1. ¿Qué puedo hacer?',o:['Nada. Lo importante es que el dinero llegue algún día.','Incumple su obligación de pagar. Puedes exigir el pago puntual e incluso intereses de demora.','Entonces puedes despedirte sin preaviso y recibes una indemnización.'],t:'Obligación de pago: el empleador tiene que pagar el sueldo a tiempo.'},
 d4:{m:'En tu contrato pone 26 días de vacaciones. El convenio colectivo dice 30. Aquí vale el convenio. Pero un contrato es un contrato, así que 26.',o:['Es verdad. Lo que firmé es lo que vale.','No. El contrato no puede empeorar el convenio. Vale la regla más favorable: 30 días.','No. Valen 20 días. La ley está siempre por encima de todo.'],t:'Principio de favorabilidad: si las reglas son distintas, vale la más favorable para el trabajador.'},
 d5:{m:'En todos los contratos nuevos he puesto: «Con 8 horas de trabajo, 20 minutos de pausa». Quien firma, está de acuerdo.',o:['No es válido. La Ley de Jornada exige 30 minutos de pausa con más de 6 horas. La ley está por encima del contrato.','Quien firma, tiene la culpa.','No es válido. Tienen que ser 60 minutos.'],t:'Orden de las reglas: Constitución → ley → convenio → acuerdo de empresa → contrato.'},
 d6:{m:p=>`${ESN(p)}, que quede claro: si alguna vez estás enfermo/a, avisas cuando vuelvas. No quiero que me llamen por la mañana.`,o:['Vale. Entonces aviso cuando vuelva.','Tengo que avisar enseguida. Desde el 4.º día necesito un certificado médico. Usted puede pedirlo ya desde el primer día.','Tengo que avisar enseguida. Un certificado no lo necesito nunca.'],t:'Obligación de avisar: comunicar la enfermedad enseguida; desde el 4.º día, certificado médico.'},
 s1:{m:'La nueva compañera pregunta: «¿Tengo que darme de alta yo misma en el seguro de pensiones y en la caja de enfermedad?».',o:['Sí. Cada seguro hay que darlo de alta uno mismo.','No. Ella elige una caja de enfermedad. La empresa la da de alta allí y paga todas las cuotas a la caja.','No. La empresa paga todas las cuotas directamente al seguro de pensiones.'],t:'Entidad recaudadora: la caja de enfermedad cobra todas las cuotas y las reparte.'},
 s2:{m:p=>`Tu primera nómina, ${ESN(p)}: 2.500 € brutos. Para el seguro de pensiones te descuento el 18,6 %, o sea, 465 €.`,o:['El 18,6 % es la cuota entera. Yo pago solo la mitad: 9,3 %, es decir, 232,50 €.','Está bien así. La pensión la pago yo solo/a.','Pago la mitad, o sea, 9,3 % = 23,25 €.'],t:'Parte del trabajador: salud, dependencia, pensiones y desempleo a medias. Accidentes: solo el empleador.'},
 s3:{m:'En el seguro de dependencia te he descontado el 2,7 %. Está bien, ¿no?',n:p=>`${ESN(p)}: ${p.a.age} años, ${p.a.kid?'un hijo':'sin hijos'}.`,o:[p=>p.a.kid?'Está bien: tengo un hijo, pero a partir de 23 todos pagan el recargo.':'Está bien. No tengo hijos y tengo más de 23. Entonces se suma un 0,9 % al 1,8 %.',p=>p.a.kid?'No está bien. Tengo un hijo. Pago solo mi mitad: 1,8 %.':p.a.age<23?'No está bien. Tengo menos de 23. Pago solo mi mitad: 1,8 %.':'No está bien. Siempre pago solo la mitad: 1,8 %.','El seguro de dependencia lo paga solo el empleador.'],t:'Recargo para personas sin hijos: desde los 23 pagan un recargo (2027: 0,9 %) solas.'},
 s4:{m:'Llevo ocho semanas enfermo por mi espalda. ¡El señor Hansen ya no me paga! ¿No es un fraude?',o:['Sí. La empresa tiene que pagar siempre cuando estás enfermo.','No. La empresa paga 6 semanas. Desde la 7.ª semana tu caja de enfermedad paga el subsidio: 70 % del bruto, como máximo 90 % del neto.','No. Desde la 7.ª semana recibes prestación por desempleo.'],t:'Subsidio por enfermedad: desde la 7.ª semana, 70 % del bruto, máximo 90 % del neto, de la caja de enfermedad.'},
 s5:{m:'Mi médica dice que tengo que ir tres semanas a rehabilitación para poder seguir trabajando. ¿Quién lo paga?',o:['El seguro de pensiones. Paga la rehabilitación para que sigas pudiendo trabajar.','La mutua de accidentes (BG).','La Agencia de Empleo.'],t:'Rehabilitación antes que pensión: el seguro de pensiones paga curas para seguir trabajando.'},
 s6:{m:'Merle quiere despedirse ella misma. Ya no quiere trabajar los sábados. Dice: «Entonces cobro el paro». ¿Es así?',o:['Sí. El paro llega enseguida.','No enseguida. Quien se despide sin un motivo importante tiene 12 semanas de sanción.','No. Quien se despide nunca recibe paro.'],t:'Período de sanción: tiempo sin prestación. Despedirse sin motivo importante: 12 semanas.'},
 u1:{m:'Kemal se ha resbalado en la cámara frigorífica. Muñeca rota, cuatro semanas de baja. Una tirita y listo. El libro de primeros auxilios y la mutua no hacen falta, ¿no?',o:['Sí hacen falta. Lo apuntamos en el libro de primeros auxilios. Va al médico de la mutua (D-Arzt). Y como estará más de 3 días de baja, usted envía en 3 días un parte de accidente a la mutua.','Es verdad. A la mutua solo hay que avisar si alguien muere.','Lo apuntamos en el libro de primeros auxilios. Con eso basta.'],t:'Parte de accidente: con más de 3 días de baja, el empleador lo envía a la mutua en 3 días.'},
 u2:{m:'Después del trabajo fui al supermercado a comprar. Allí me tropecé. ¿Es un accidente de trayecto?',o:['Sí. Todo el camino a casa está asegurado.','No. Comprar es una interrupción privada. Entonces paga la caja de enfermedad, no la mutua.','Sí, si el supermercado está en el camino a casa.'],t:'Accidente de trayecto: en el camino directo al trabajo o de vuelta. Desvíos a la guardería sí; ir de compras no.'},
 u3:{m:'Por la mañana llevo a mi hijo a la guardería. Es un desvío. Hoy me resbalé en el aparcamiento de la guardería. ¿Paga la mutua?',o:['Sí. El desvío para el cuidado de niños está asegurado. Es un accidente de trayecto.','No. Solo el camino directo está asegurado.','No. La guardería es tiempo libre.'],t:'Desvío asegurado: los desvíos a la guardería o para compartir coche están asegurados.'},
 u4:{m:'Una clienta se ha resbalado delante del mostrador de pescado. Eso lo paga nuestra mutua, ¿no?',o:['Sí. Todo lo que pasa en la tienda lo paga la mutua.','No. Los clientes no tienen seguro de accidentes laborales. Aquí paga quizá el seguro de responsabilidad civil de la tienda.','No. Lo paga la caja de enfermedad de Kutter & Korb.'],t:'¿Quién está asegurado? La mutua asegura a empleados, aprendices, minijobbers, también escolares, pero no a clientes.'},
 e1:{m:'Buenos días, soy la señora Weiß de la BGHW (mutua). Hoy reviso su tienda. Primera pregunta: ¿quién es aquí responsable de la seguridad laboral?',o:['Cada uno de sí mismo.','El señor Hansen como empleador. Tiene que evaluar los peligros, tomar medidas y darnos la instrucción.','La mutua. Para eso está usted.'],t:'Evaluación de riesgos: el empleador revisa los peligros y toma medidas de protección.'},
 e2:{m:'Nuestro nuevo aprendiz empieza el lunes. Las normas de prevención de accidentes están colgadas en la sala de descanso. Que las lea. Con eso basta como instrucción.',o:['Basta. Quien sabe leer, ya está instruido.','No. Tiene que recibir la instrucción antes del primer día, de forma comprensible y para su puesto. Con jóvenes, cada seis meses otra vez.','No. Hay que darle la instrucción a los seis meses.'],t:'Instrucción: al contratar y con regularidad (mínimo 1 vez al año; jóvenes cada 6 meses), en horario de trabajo.'},
 e3:{m:'¿Quién hace en realidad estas normas de prevención de accidentes? ¿La inspección de trabajo?',o:['La mutua (Berufsgenossenschaft). Las normas son obligatorias y tienen que estar colgadas en la empresa.','La inspección de trabajo.','La asociación de comercio.'],t:'Normas de prevención (UVV): las hace la mutua, son obligatorias y se cuelgan en la empresa.'},
 e4:{m:'Nombro a Ole encargado de seguridad. Así él responde si pasa algo. Y yo quedo libre.',o:['Buena idea. Entonces Ole es el responsable.','Ole puede ayudarle y vigilar los fallos. Pero no tiene que responder. La responsabilidad sigue siendo suya.','Entonces Ole es desde ahora jefe del almacén. Todos tienen que hacer lo que dice.'],t:'Encargado de seguridad: un compañero que ayuda al empleador. No responde y no es jefe.'},
 e5:{m:'La señora Weiß fue muy estricta. ¿Quién nos puede poner una multa o cerrar la tienda si no cumplimos las leyes?',o:['La inspección de trabajo (Gewerbeaufsicht). Es una autoridad del Estado. Puede poner multas y cerrar partes de la empresa.','El encargado de seguridad.','Nadie. La seguridad laboral es solo una recomendación.'],t:'Inspección de trabajo: autoridad estatal; vigila las leyes, pone multas y puede cerrar partes de la empresa.'},
 e6:{m:'Socorristas no necesitamos. Si hay un accidente, viene el médico de urgencias.',o:['Sí necesitamos. En el comercio al menos el 5 % de los empleados tienen que ser socorristas. La mutua los forma.','Sí. Todos los empleados tienen que tener formación en primeros auxilios.','Es verdad. Con el médico de urgencias basta.'],t:'Socorristas: ayudan hasta que llega la ambulancia. En el comercio, al menos el 5 % de la plantilla.'},
 e7:{m:'Los zapatos de seguridad del almacén me aprietan. Me pongo otra vez mis zapatillas. Es mi pie.',o:['Si la evaluación de riesgos exige zapatos de seguridad, tienes que llevarlos. Si no, incumples tus obligaciones. Pide unos que te queden bien.','Es verdad. Cada uno decide sobre su seguridad.','Entonces llévalos solo cuando venga la señora Weiß de la mutua.'],t:'Equipo de protección: los empleados tienen que usar el equipo obligatorio.'},
 g1:{m:'La escalera está atrás en la cámara frigorífica. Me subo rápido a una caja de pescado para llegar a la estantería de arriba. Es solo un segundo.',o:['¡Para! Peligro de caída. Trae la escalera o un taburete.','Vale, pero agárrate bien.','Yo sujeto la caja, así sí se puede.'],t:'Medio de trabajo adecuado: para subir, solo escalera o taburete, nunca cajas o sillas.'},
 g2:{m:'En Adviento tenemos 200 cestas de regalo. Pon los carros delante de la salida de emergencia. Es solo hasta Navidad.',o:['Eso no se puede. Las salidas de emergencia y las vías de evacuación tienen que estar siempre libres.','Vale. En caso de emergencia los apartamos rápido.','Vale, pero solo por la noche, cuando no hay clientes.'],t:'Vía de evacuación: salidas de emergencia y vías de escape siempre libres.'},
 g3:{m:'La pesada puerta cortafuegos del almacén siempre se cierra. Le pongo una cuña de madera debajo. Así se ordena más rápido.',o:['Por favor, no. En caso de incendio, el fuego y el humo se extienden. Nunca bloquear las puertas cortafuegos.','Buena idea. Así los bomberos entran más rápido.','Vale, pero solo cuando yo esté.'],t:'Puerta cortafuegos: tiene que cerrarse sola. Nunca sujetarla con una cuña.'},
 g4:{m:'He traído para la sala de descanso un hervidor del mercadillo. No tiene el sello CE. Da igual, ¿no?',o:['No lo uses. Sin el sello CE no está declarado que cumple las normas de la UE. Lo comunicamos.','Da igual. Lo importante es que hierva.','El sello GS es obligatorio de todas formas. Sin él no se puede usar nada.'],t:'Sello CE y GS: CE = el fabricante declara que cumple la UE. GS = probado por una entidad independiente.'},
 g5:{m:p=>`¡${ESN(p)}! ¡En el almacén se quema una caja! ¿Qué haces primero?`,o:['Avisar del incendio: llamar al 112 y dar la alarma. Después sacar a los clientes. Apagar solo si no hay peligro.','Voy enseguida a por mi bolso a la taquilla.','Bajo con el montacargas al extintor.'],t:'En caso de incendio: 1 avisar (112, alarma) · 2 salvar personas · 3 apagar si no hay peligro · 4 cerrar puertas · 5 punto de reunión.'},
 g6:{m:'En la puerta del almacén hay una señal redonda y azul con un zapato. ¿Qué significa?',n:'La señal: redonda, azul, zapato de seguridad blanco.',o:['Una señal de obligación: aquí hay que llevar zapatos de seguridad.','Una señal de prohibición: aquí no se pueden llevar zapatos.','Una señal de salvamento: aquí está la vía de evacuación.'],t:'Señales: redonda roja = prohibición · redonda azul = obligación · triángulo amarillo = advertencia · rectángulo verde = salvamento · rectángulo rojo = incendios.'},
 g7:{m:'Acabo de limpiar el mostrador de pescado. El suelo delante todavía está mojado. Ahora vienen clientes. ¿Lo dejamos secar?',o:['Secarlo enseguida y, hasta entonces, poner una señal de aviso. Resbalar es la causa más frecuente de accidentes en el comercio.','Se seca solo.','Les aviso a los clientes cuando lleguen.'],t:'Peligro de resbalar: causa más frecuente de accidentes en el comercio. Secar y señalizar enseguida.'},
 g8:{m:'La manilla interior de la puerta de la cámara frigorífica está floja. La aprieto yo mismo después del trabajo. Así no molestamos al señor Hansen.',o:['Por favor, no la arregles tú. Avisamos enseguida al señor Hansen del fallo y avisamos a los demás.','Buena idea. Cada uno tiene que arreglar los fallos.','No es tan importante. Puede esperar hasta la próxima inspección.'],t:'Avisar de fallos: avisar enseguida de fallos y accidentes, pero no reparar los aparatos uno mismo.'},
 h1:{m:p=>`Tenemos un puesto en el mercado de Navidad. ${ESN(p)}, el viernes haces el turno de tarde de 13 a 21 h. Una hora de pausa.`,n:p=>p.a.minor?'Mia tiene 17 años.':p.a.preg?'Lea está embarazada. No hay permiso de la autoridad.':`${ESN(p)} tiene ${p.a.age} años.`,o:[p=>p.a.minor?'Eso no se puede. Con 17 años solo puedo trabajar hasta las 20 h.':p.a.preg?'Eso no se puede. Las embarazadas no pueden trabajar después de las 20 h.':'Está permitido. 7 horas de trabajo, pausa suficiente. Para adultos no hay límite a las 20 h.',p=>p.a.minor||p.a.preg?'Se puede. En el mercado de Navidad hay otras reglas.':'No se puede. Después de las 20 h nadie puede trabajar en el comercio.','Se puede si después tengo un día libre.'],t:'Límites de horario: jóvenes 6–20 h · embarazadas no de 20 a 6 h · adultos: sin límite en la ley de jornada.'},
 h2:{m:p=>`El viernes hay inventario hasta las 22 h. El sábado empiezas otra vez a las 7 h, ${ESN(p)}. La tienda está llena.`,o:['Se puede. Entre los turnos hay 9 horas.',p=>p.a.minor?'No se puede. Solo puedo trabajar hasta las 20 h y necesito 12 horas de descanso.':p.a.preg?'No se puede. Embarazada no puedo trabajar después de las 20 h. Y necesito 11 horas de descanso.':'No se puede. Necesito 11 horas de descanso. Después de las 22 h, como pronto a las 9 h.','No se puede. Necesito 8 horas de sueño, o sea, como pronto a las 6 h.'],t:'Descanso: tiempo entre el fin del trabajo y el siguiente inicio. Adultos 11 h, jóvenes 12 h.'},
 h3:{m:p=>`El lunes te necesito de 8 a 19 h, ${ESN(p)}. Pausa de 45 minutos. Es Adviento.`,o:['Son más de 10 horas de trabajo. Está prohibido.','Se puede. En Adviento se permiten días más largos.','Se puede si me pagan las horas extra.'],t:'Jornada máxima: adultos 8 h, hasta 10 con compensación. Jóvenes 8 (8,5) h. Embarazadas máximo 8,5 h.'},
 h4:{m:'Hoy he tenido seis horas de escuela hasta las 13:15. El señor Hansen quiere que después ayude en la tienda hasta las 18 h. ¿Tengo que hacerlo?',n:'Es el único día largo de escuela de Kemal esta semana. Kemal tiene 16 años.',o:['No. Después de más de cinco horas de clase, una vez por semana ya no puedes trabajar. El día cuenta como un día completo de trabajo.','Sí. La escuela no cuenta como tiempo de trabajo.','Sí, pero solo hasta las 16 h.'],t:'Día largo de escuela: los jóvenes, una vez por semana, libres después de más de 5 horas de clase.'},
 h5:{m:'Mi novia va a tener un bebé en febrero. Quiero tomar un año de permiso parental. El señor Hansen dice: «Solo si yo lo autorizo». ¿Puede prohibirlo?',o:['No. El permiso parental no necesita autorización. Solo tienes que avisar a tiempo. Y estás protegido contra el despido.','Sí. Sin autorización del jefe no hay permiso parental.','No. Y el señor Hansen tiene que pagarte la ayuda parental (Elterngeld).'],t:'Permiso parental: hasta 3 años por cada padre o madre, sin sueldo, con protección contra el despido. Elterngeld del Estado.'},
 h6:{m:'Estoy embarazada de cinco meses. El señor Hansen quiere que hoy desempaque la entrega con las cajas pesadas de pescado. ¿Tengo que hacerlo?',o:['No. Las embarazadas no pueden llevar cargas pesadas. Lo prohíbe la Ley de Protección de la Maternidad.','Sí, si te sientes bien.','No. Las embarazadas ya no pueden trabajar nada.'],t:'Protección de la maternidad: nada de cargas pesadas, no de 20 a 6 h, 6 semanas antes y 8 después del parto, protección contra el despido.'},
 h7:{m:p=>`Para el plan de vacaciones: ¿cuántas vacaciones te corresponden como mínimo por ley, ${ESN(p)}? El convenio lo dejamos fuera.`,n:p=>p.a.minor?'Mia tiene 17 años el 1 de enero.':`${ESN(p)} tiene ${p.a.age} años.`,o:[p=>p.a.minor?'Con 17 años son como mínimo 25 días laborables.':'Como mínimo 24 días laborables. Con semana de 5 días son 20 días de trabajo.','Como mínimo 30 días. Está en la ley.',p=>p.a.minor?'Como todos: 24 días laborables.':'Como mínimo 24 días de trabajo.'],t:'Vacaciones mínimas: adultos 24 días laborables. Jóvenes: menos de 16: 30 · menos de 17: 27 · menos de 18: 25.'},
 h8:{m:p=>`El segundo domingo de Adviento abren las tiendas, de 12 a 18 h. Tú estás, ${ESN(p)}. A cambio tienes libre el martes.`,o:[p=>p.a.minor?'Con 17 años no puedo trabajar en domingo.':p.a.preg?'Embarazada, trabajo en domingo solo si lo acepto expresamente.':'Está permitido. En un domingo autorizado y con día de descanso a cambio, se puede.','Los domingos nadie puede trabajar en el comercio.','También se puede sin el martes libre.'],t:'Trabajo en domingo: adultos solo en domingos autorizados con día de descanso. Jóvenes en el comercio nunca. Embarazadas solo si aceptan.'},
 z1:{m:'Dejo Kutter & Korb. En el certificado pone: «Realizó las tareas encomendadas siempre a nuestra plena satisfacción». ¿Es bueno?',o:['Sí. Es la nota «bien» (2).','Es «sobresaliente» (1).','Es solo «suficiente» (3).'],t:'Lenguaje de certificados: máxima + siempre = 1 · siempre plena = 2 · plena = 3 · a nuestra satisfacción = 4 · en general = 5 · se esforzó = 6.'},
 z2:{m:'Para Ole escribo en el certificado: «Se esforzó por realizar las tareas encomendadas a nuestra satisfacción». Suena bonito, ¿no?',o:['Suena bonito, pero es la nota «insuficiente» (6). Un certificado tiene que ser benévolo. Ole puede pedir una corrección.','Suena bonito. Es como mínimo «suficiente».','Está permitido. Las señales secretas son normales.'],t:'Verdadero y benévolo: el certificado no puede dificultar sin necesidad el futuro profesional.'},
 z3:{m:'Dejo «Möwe». Mi jefe solo me quiere dar un certificado con la tarea y la duración. Sobre rendimiento y comportamiento no escribe nada. ¿Puede?',o:['Es un certificado simple. Si lo pides, tiene que darte uno cualificado, con rendimiento y comportamiento.','Sí. Nunca tiene que poner más que la tarea y la duración.','No. Siempre tiene que escribir un certificado cualificado, aunque no lo pidas.'],t:'Certificado cualificado: incluye además rendimiento y comportamiento. Se da si el trabajador lo pide.'},
 z4:{m:'Escribir certificados da trabajo. A partir de ahora cobro 50 € por ello.',o:['Eso no se puede. Al final, todos tienen derecho a un certificado. Los costes los paga la empresa.','Es justo. El trabajo cuesta dinero.','Solo puede cobrar por los certificados cualificados.'],t:'Obligación de dar certificado: el empleador tiene que hacerlo al final, gratis.'},
 k1:{m:'Ahora le mando a Malte un WhatsApp: «Desde marzo ya no tienes que venir». Es rápido y por escrito.',o:['No es válido. Un despido tiene que ser por escrito con su firma a mano. WhatsApp, SMS o correo no bastan.','Se puede. WhatsApp es por escrito.','Se puede si antes le llama.'],t:'Forma escrita del despido: siempre por escrito con firma a mano. Correo, SMS o WhatsApp no bastan.'},
 k2:{m:'La cámara lo muestra claro: un ayudante se llevó ayer 200 € de la caja. ¿Puedo despedirlo sin preaviso? ¿O primero tengo que amonestarlo?',o:['Sí, sin preaviso, también sin amonestación. El robo es un motivo importante. Tiene que despedirlo en dos semanas.','No. Primero tiene que haber una amonestación.','Sí, pero para eso tiene medio año.'],t:'Despido extraordinario: sin preaviso por un motivo importante (p. ej. robo), en 2 semanas desde que se sabe.'},
 k3:{m:'Malte está de permiso parental desde febrero. En realidad ya no lo necesito. Le despido ahora de forma ordinaria.',o:['Eso no se puede. Durante el permiso parental Malte tiene protección especial contra el despido.','Se puede si respeta el plazo.','Se puede si le paga una indemnización.'],t:'Protección especial: aprendices tras la prueba, embarazadas y madres hasta 4 meses tras el parto, permiso parental, comité de empresa, personas con discapacidad grave.'},
 k4:{m:p=>p.a.preg?'Lea, estás embarazada. Sinceramente, planifico sin ti. Prefiero despedirte ahora con preaviso.':'Svea está embarazada y me lo ha dicho. Prefiero despedirla ahora, antes de que falte.',o:[p=>p.a.preg?'Eso no se puede. Estoy embarazada y se lo he dicho. Entonces tengo protección especial, hasta 4 meses después del parto.':'Eso no se puede. Ella tiene protección especial, hasta 4 meses después del parto.','Se puede si el despido es por escrito.','Solo se puede después del parto.'],t:'Protección en la maternidad: durante el embarazo y hasta 4 meses después del parto no se puede despedir.'},
 k5:{m:'Llevo tres años aquí y me despido yo. Entrego mi carta el 10 de marzo. Dejamos fuera el convenio para los plazos. ¿Cuál es mi último día?',o:['El 15 de abril. 4 semanas desde el 11 de marzo terminan el 7 de abril. La siguiente fecha es el 15.','El 7 de abril. Exactamente 4 semanas.','El 31 de mayo. Después de tres años vale un plazo más largo.'],t:'Plazo de preaviso: base 4 semanas al día 15 o a final de mes. Los plazos más largos solo valen para el empleador.'},
 k6:{m:'Svea lleva tres años aquí. Simplemente me cae mal. La despido de forma ordinaria con plazo. No necesito un motivo.',o:['Sí lo necesita. Tenemos más de 10 empleados y ella lleva más de 6 meses. Entonces vale la Ley de Protección contra el Despido. «Me cae mal» no es un motivo.','Es verdad. En un despido ordinario nunca hace falta motivo.','Solo puede despedirla después de una amonestación.'],t:'Ley de Protección contra el Despido: vale después de 6 meses en empresas con más de 10 empleados. El despido tiene que tener un motivo personal, de conducta o de la empresa.'},
 k7:{m:'La nueva compañera de Bremen está en su segundo mes. Se despide por escrito con dos semanas de plazo. ¿Se puede tan rápido?',o:['Sí. En el período de prueba el plazo de preaviso es de dos semanas.','No. Tiene que respetar 4 semanas a final de mes.','No. En el período de prueba solo puede despedir la empresa.'],t:'Despido en el período de prueba: las dos partes pueden despedir con 2 semanas de plazo.'},
 k8:{m:'El señor Hansen me ofrece un acuerdo de rescisión. Terminamos todo de mutuo acuerdo el 31 de marzo. Todavía no tengo otro trabajo. ¿Buena idea?',o:['Cuidado. Un acuerdo de rescisión es por escrito y termina el trabajo seguro. Sin motivo importante suele haber 12 semanas de sanción en el paro.','Genial. Es mejor que un despido. El paro llega enseguida.','No firmes. Los acuerdos de rescisión están prohibidos.'],t:'Acuerdo de rescisión: las dos partes terminan el contrato por escrito. Normalmente 12 semanas de sanción.'},
 f1:{m:p=>`${ESN(p)}, estoy revisando las nóminas. Desde el resultado del examen a mediados de junio has trabajado como vendedor/a. Aun así, mi padre te pagó solo sueldo de aprendiz hasta finales de julio. ¿Está bien?`,o:['No. Desde el día después del resultado soy trabajador/a. Desde entonces me corresponde el sueldo de trabajador/a cualificado/a.','Sí. Según el contrato yo era aprendiz hasta el 31 de julio.','Da igual. El dinero ya está pagado.'],t:'Fin de la formación: con el resultado ya no se es aprendiz.'},
 f2:{m:'Mañana viene una nueva compañera a la entrevista. Me pregunta: «¿Qué hago si Jule me pregunta si estoy embarazada o si estoy en el sindicato?». ¿Qué le digo?',o:['Esas preguntas no están permitidas. No tiene que contestar. Incluso puede decir algo que no es verdad.','Tiene que contestar con sinceridad, si no el contrato no es válido.','Que simplemente se vaya. La entrevista termina.'],t:'Derecho a mentir: ante preguntas no permitidas se puede callar o no decir la verdad.'},
 f3:{m:p=>`${ESN(p)}, acordamos 12 meses por WhatsApp. Entonces el próximo julio se acaba. Después ya no te necesito.`,o:['La fecha de fin no fue por escrito con las dos firmas. No es válida. Mi contrato es indefinido.','Es verdad. Entonces busco otra cosa.','Entonces me tiene que pagar ahora una indemnización.'],t:'Forma escrita del contrato temporal: sin ella, el contrato es indefinido.'},
 f4:{m:'Me vuelve a doler la muñeca de la caída en la cámara frigorífica. La médica dice que viene del accidente. Pero en la empresa no se apuntó nada. ¿Es grave?',o:['Sí. La mutua solo paga accidentes que conoce. Por eso cada herida va al libro de primeros auxilios. Ahora comunicamos el accidente.','No. La caja de enfermedad paga todo de todas formas.','No. Puedes demandar al señor Hansen por daños morales.'],t:'Libro de primeros auxilios: apuntar cada herida, también las pequeñas. Así se puede probar después un accidente laboral.'},
 f5:{m:p=>`Vengo a la inspección de control. He vuelto a encontrar fallos. ${ESN(p)}, ¿qué hace usted si descubre un fallo o un peligro?`,o:['Lo comunico enseguida, aviso a los compañeros y no reparo nada yo mismo/a.','Lo reparo yo mismo/a enseguida.','Espero a que la mutua lo encuentre en la próxima inspección.'],t:'Obligaciones de los empleados: seguir instrucciones, llevar el equipo de protección, avisar enseguida de fallos y accidentes.'},
 f6:{m:p=>`La inspección de trabajo ha revisado nuestros horarios de Adviento. Pero ${ESN(p)}, tú estabas de acuerdo. Entonces todo está bien, ¿no?`,o:['No. Las leyes de protección valen aunque yo esté de acuerdo. En el próximo plan lo tenemos en cuenta.','Sí. Quien está de acuerdo es responsable.','Sí, si me pagaron las horas.'],t:'Leyes de protección: valen siempre, también si uno está de acuerdo.'},
 f7:{m:'Me ha llegado el despido. Creo que no es válido. Primero espero a ver si el señor Hansen cambia de opinión. ¿No?',o:['¡No esperes! En 3 semanas tienes que presentar una demanda en el Juzgado de lo Social. Si no, el despido se considera válido.','Esperar está bien. Para demandar tienes un año.','Un despido no válido nunca vale. No tienes que hacer nada.'],t:'Demanda contra el despido: en 3 semanas en el Juzgado de lo Social; si no, el despido vale.'},
 f8:{m:p=>`Segunda nómina, ${ESN(p)}: 2.500 € brutos. Seguro de desempleo 2,6 %, o sea, 65 €. Ahora todo está bien, ¿no?`,o:['No. El 2,6 % es la cuota entera. Yo pago la mitad: 1,3 %, es decir, 32,50 €.','Sí. El seguro de desempleo lo paga uno solo.','No. No pago nada. Yo no me voy a quedar en paro.'],t:'Mitad y mitad: salud, dependencia, pensiones y desempleo a medias. Accidentes: solo el empleador.'},
 v1:{m:p=>`${ESN(p)}, ¿te acuerdas del verano? No firmamos nada de verdad. Para mí eres ayudante. A finales de febrero se acaba, no renuevo. Para eso no necesito un despido.`,n:'Consecuencia de vuestra decisión de julio: el contrato no se hizo bien.',o:['Sí lo necesita. Tengo un contrato indefinido, porque una fecha de fin solo vale por escrito. Usted tendría que despedirme por escrito, con plazo. Y vale la Ley de Protección contra el Despido.','Es verdad. Entonces busco otra cosa hasta finales de febrero.','Entonces voy al Juzgado de lo Social dentro de un año.'],t:'Contrato indefinido: termina solo con despido, acuerdo de rescisión o jubilación, no termina solo.'},
 v2:{m:p=>`${ESN(p)}, el invierno fue malo. Tengo que despedir a una persona de ventas por motivos de la empresa. Tu contrato está bien hecho. Pero eres quien lleva menos tiempo como trabajador/a cualificado/a, así que te toca a ti. Punto.`,n:'Consecuencia de vuestra decisión de julio: vuestro contrato está bien. Ahora se trata de la protección contra el despido.',o:['No es tan fácil. En un despido por motivos de la empresa tiene que hacer una selección social: antigüedad, edad, obligaciones de manutención, discapacidad grave. Y el despido tiene que ser por escrito.','Vale. Quien llega el último se va el primero. Es la regla.','Los despidos por motivos de la empresa están prohibidos en Alemania.'],t:'Selección social: antigüedad, edad, obligaciones de manutención, discapacidad grave. Se despide a quien menos le afecta.'},
 c01:{m:'¡Sale humo del almacén! ¿Qué haces enseguida?',o:['Llamar al 112 y dar la alarma, después sacar a los clientes.','Primero vaciar la caja y salvar el dinero.','Bajar con el montacargas al almacén y mirar.'],w:'En caso de incendio: avisar, salvar personas, apagar solo sin peligro. Nunca el ascensor.'},
 c02:{m:'Me he cortado la mano con el cúter. Sangra. ¿Y ahora?',o:['Llamar al socorrista, curar la herida y apuntarlo todo en el libro de primeros auxilios.','Tirita, seguir trabajando, no apuntar nada.','Mandarlo a casa enseguida, sin curarlo.'],w:'Dar primeros auxilios y apuntar cada herida en el libro, también las pequeñas.'},
 c03:{m:'Acabo de ver que la salida de emergencia está bloqueada con carros. ¿Qué pasa ahora?',o:['La despejamos enseguida. Las vías de evacuación tienen que estar siempre libres.','Es solo temporal, hasta Navidad.','La salida de emergencia nunca se usa.'],w:'Salidas de emergencia y vías de evacuación siempre libres.'},
 c04:{m:'Estoy escribiendo un SMS al ayudante: «Estás despedido». ¿Lo envío?',o:['No. Un despido necesita forma escrita con firma a mano.','Sí. Un SMS también es por escrito.','Sí, pero con un saludo amable.'],w:'Despido solo por escrito con firma a mano.'},
 c05:{m:p=>p.a.minor?'Mia, hoy hay muchísimo trabajo. ¡Quédate por favor hasta las 21 h!':'Kemal (16) tiene que quedarse hoy hasta las 21 h. La tienda está llena.',o:['No se puede. Los jóvenes solo pueden trabajar hasta las 20 h.','En Adviento, por excepción, se puede.','Solo si se paga aparte.'],w:'Jóvenes: solo de 6 a 20 h.'},
 c06:{m:'Ha llegado el pescado: 20 cajas. Svea está embarazada. Tiene que ayudar a descargar, ¡todos a trabajar!',o:['Svea hace trabajo ligero. Las embarazadas no pueden llevar cargas pesadas.','Si quiere, puede ayudar.','Svea tiene que irse a casa enseguida.'],w:'Protección de la maternidad: nada de cargas pesadas. Trabajar sí puede.'},
 c07:{m:'Un periodista del diario local te pregunta en la tienda: «¿Cuánto vende Kutter & Korb en Adviento?».',o:['No digo nada. Pregunte por favor al señor Hansen.','Le digo la cifra de la caja.','Hago un cálculo en voz alta.'],w:'Deber de confidencialidad: guardar los secretos de la empresa.'},
 c08:{m:'En el mostrador de pescado se ha salido agua con hielo. Ahora llega un grupo en autobús.',o:['Secar enseguida y poner una señal de aviso.','Los clientes ya tendrán cuidado.','Pongo un cartón encima.'],w:'Resbalar es la causa más frecuente de accidentes en el comercio.'},
 c09:{m:'Merle ha llamado, está enferma. Dile que venga igualmente. ¡Es sábado!',o:['Quien está enfermo no tiene que trabajar. Ella avisa y desde el 4.º día trae certificado.','La llamo y le digo que tiene que venir.','Entonces no cobra ese día.'],w:'Con enfermedad se paga el sueldo durante 6 semanas. Estar enfermo no es incumplir el contrato.'},
 c10:{m:'Hoy me he enterado: un ayudante sacó dinero de la caja hace tres días. Espero con el despido hasta después de Navidad.',o:['No espere. Sin preaviso solo se puede en las dos semanas después de saberlo.','Bien. Hasta Semana Santa también hay tiempo.','Primero tiene que haber una amonestación.'],w:'El despido sin preaviso tiene que hacerse en 2 semanas desde que se sabe.'}
};

/* Ziehen ohne Wiederholung pro Modus */
function draw(pool,n,key,r,challenge){
  if(challenge)return shuffle(pool,r).slice(0,n);
  const seen=new Set(ST.seen[key]||[]);
  let fresh=pool.filter(x=>!seen.has(x.id));
  let out=shuffle(fresh,r).slice(0,n);
  if(out.length<n){
    const ids=new Set(pool.map(x=>x.id));
    ST.seen[key]=(ST.seen[key]||[]).filter(id=>!ids.has(id));
    ST.resetNote[key.split(':')[0]]=true;
    const rest=shuffle(pool.filter(x=>!out.includes(x)),r);
    out=out.concat(rest.slice(0,n-out.length));
  }
  return out;
}

const MUS={ctx:null,on:false,timer:null,step:0,tempo:112,int:0,gain:null};
function musCtx(){if(!MUS.ctx){try{MUS.ctx=new (window.AudioContext||window.webkitAudioContext)();MUS.gain=MUS.ctx.createGain();MUS.gain.gain.value=.3;MUS.gain.connect(MUS.ctx.destination)}catch(e){MUS.ctx=null}}return MUS.ctx}
function tone(f,t,d,type,v){const c=MUS.ctx;const o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+d+.02)}
function noise(t,d,v){const c=MUS.ctx;const b=c.createBuffer(1,Math.max(1,Math.floor(c.sampleRate*d)),c.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);const s=c.createBufferSource();s.buffer=b;const g=c.createGain();g.gain.value=v||.06;const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=6000;s.connect(hp);hp.connect(g);g.connect(MUS.gain);s.start(t)}
const BASS=[49,49,58.3,49,43.7,43.7,55,43.7];
function musTick(){if(!MUS.ctx||!MUS.on)return;const c=MUS.ctx,t=c.currentTime+.05,st=MUS.step++;const b=BASS[Math.floor(st/2)%8];
  if(st%2===0)tone(b,t,.22,'sawtooth',.1);
  if(st%4===0)tone(98,t,.09,'sine',.25);
  noise(t,.04,MUS.int>1?.07:.04);
  if(MUS.int>0&&st%8===6)tone(b*4,t,.12,'triangle',.05);
  if(MUS.int>2&&st%2===1)tone(b*6,t,.06,'square',.03);
  clearTimeout(MUS.timer);MUS.timer=setTimeout(musTick,60000/(MUS.tempo+MUS.int*10)/2)}
function musStart(int){MUS.int=int||0;if(!ST.music||document.hidden)return;if(!musCtx())return;if(MUS.ctx.state==='suspended')MUS.ctx.resume();if(!MUS.on){MUS.on=true;MUS.step=0;musTick()}}
function musStop(){MUS.on=false;clearTimeout(MUS.timer)}
function musTusch(){if(!ST.music||!musCtx())return;const t=MUS.ctx.currentTime+.05;[392,523,659,784].forEach((f,i)=>tone(f,t+i*.09,.5,'triangle',.09))}

function doSend(){
  const st=G.steps[G.i],sc=st.sc||st.cr,p=st.p||G.p,S=st.s;if(S.sel===null)return;
  const o=sc.opts[S.sel],law=V(o.law,p);S.law=law;
  if(G.profi&&law===2&&!st.cr){
    const others=shuffle(SCENES.filter(x=>x.area!==sc.area&&x.weil),G.r).slice(0,2).map(x=>V(x.weil,p));
    const all=[V(sc.weil,p),...others];const ord=shuffle([0,1,2],G.r);S.wopts=ord.map(i=>all[i]);S.wright=ord.indexOf(0);S.phase='weil';render();return}
  finishScene();
}
function finishScene(){
  const st=G.steps[G.i],sc=st.sc||st.cr,p=st.p||G.p,S=st.s;const o=sc.opts[S.sel],law=S.law;
  let pts=PTS[law];if(G.profi&&law===2&&!st.cr){pts=S.weil===S.wright?10:6}
  const {dk,ds}=deltas(sc,o,law);
  G.kasse=clamp(G.kasse+dk,0,100);G.sich=clamp(G.sich+ds,0,100);G.wis+=pts;G.max+=10;
  G.lastD={k:dk,s:ds,wis:pts};
  if(sc.area)G.choices[sc.area]=G.choices[sc.area]===0?0:law;
  if(G.rival&&!st.cr){const R=G.rival;const x=G.rr();const rl=x<.55?2:x<.7?1:0;const ro=sc.opts.find(q=>V(q.law,p)===rl)||sc.opts.find(q=>V(q.law,p)===0)||o;const rd=deltas(sc,ro,V(ro.law,p));R.kasse=clamp(R.kasse+rd.dk,0,100);R.sich=clamp(R.sich+rd.ds,0,100);R.n++;if(V(ro.law,p)===2)R.right++;st.rv=V(ro.law,p)}
  st.res=law===2?'ok':'no';
  if(law<2){if(!st.cr)addWrongScene(sc,p)}else if(G.mode==='wdh'&&!st.cr)fixWrongScene(sc,p);
  G.log.push({type:st.cr?'crisis':'scene',sc,p,sel:S.sel,law,pts,weilOk:S.weil===undefined?null:S.weil===S.wright});
  markSeen((G.challenge?'klassik':G.mode)+(st.cr?':c':':s'),sc.id);if(st.cr)markSeen('krise:c',sc.id);
  if(law===0&&['klassik','krise','profi','challenge'].includes(G.mode)&&!st.cr&&(G.fuDone||[]).length<2){
    const F=FOLLOW.find(f=>f.after.includes(sc.id)&&avail(f,p)&&!(G.fuDone||[]).includes(f.id));
    if(F){G.fuDone=(G.fuDone||[]).concat(F.id);let j=-1;for(let k=G.i+1;k<G.steps.length;k++){if(G.steps[k].t==='scene'){j=k;break}}
      const at=j>=0?j+1:G.i+1;G.steps.splice(at,0,{t:'scene',sc:F,fu:true,ord:(G.steps[at-1]||st).ord+.001});}
  }
  S.re=react(sc,o,law,G.r);S.phase='typing';save();render();
  setTimeout(()=>{if(G&&G.steps[G.i]===st){S.phase='done';render()}},matchMedia('(prefers-reduced-motion: reduce)').matches?50:900);
}

/* ===== Auswertung ===== */
function finishGame(){
  if(G.finished)return;G.finished=true;
  const quiz=G.mode==='blitz'||G.mode==='pruef';
  ST.total+=G.wis;ST.games++;
  if(!quiz&&G.mode!=='fehler'&&G.mode!=='wdh'){if(!ST.played.a.includes(G.p.a.id))ST.played.a.push(G.p.a.id)}
  const sc=G.max?Math.min(100,Math.round(G.wis/G.max*100)):0;G.pc=sc;
  ST.best[G.mode]=Math.max(ST.best[G.mode]||0,sc);
  const s=stars(G),B=ST.badges,add=id=>{if(!B.includes(id)){B.push(id);G.newBadges=(G.newBadges||[]).concat(id)}};
  const story=['klassik','krise','challenge','profi'].includes(G.mode);
  add('b1');if(ST.played.a.length>=4)add('b2');
  if(story&&s===3&&G.kasse>=60&&G.sich>=60)add('b3');
  if(G.mode==='blitz'&&G.log.filter(l=>l.ok).length>=8)add('b4');
  if(G.mode==='pruef'&&sc>=81)add('b5');
  if(G.mode==='fehler'&&G.log.length&&G.log.every(l=>l.pts>=10))add('b6');
  if(ST.fixed>=5)add('b7');
  if(G.mode==='profi'&&s===3)add('b8');
  if(story&&G.sich>=85)add('b9');
  if((G.mode==='klassik'||G.mode==='krise'||G.mode==='challenge')&&s===3&&!ST.profi){ST.profi=true;G.profiUnlocked=true}
  save();musStop();musTusch();queueResult();
}

const NS='kutterkorb1/';
function rnd(n){const a='abcdefghijkmnpqrstuvwxyz23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s}
function codeGen(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(5));for(const x of r)s+=a[x%a.length];return s}
const cleanS=(s,m)=>String(s==null?'':s).replace(/[\u0000-\u001f\u007f​-‏‪-‮]/g,' ').trim().slice(0,m);
class Net{
  constructor(onMsg,onStatus){this.cid='k'+rnd(10);this.seen=new Map();this.onMsg=onMsg;const st=()=>onStatus(this.count());
    try{this.links=LOCAL?[new LocalLink(this.cid,(t,p,r)=>this.recv(t,p,r),st)]:BROKERS.map(u=>new MqttLink(u,this.cid,(t,p,r)=>this.recv(t,p,r),st))}catch(e){this.links=[]}}
  count(){return{up:this.links.filter(l=>l.up).length,all:this.links.length}}
  recv(t,p,r){if(p&&typeof p==='object'&&p.mid){if(this.seen.has(p.mid))return;this.seen.set(p.mid,Date.now());if(this.seen.size>3000)this.seen.clear()}this.onMsg(t,p,r)}
  sub(t){this.links.forEach(l=>l.subscribe(NS+t))}
  pub(t,obj,retain){obj.mid=rnd(12);let ok=false;this.links.forEach(l=>{if(l.publish(NS+t,obj,retain))ok=true});return ok}
}
