<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Das Erdbeer-Imperium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Layout: eine Spalte wie ein Hof-Klemmbrett; oben die Hafenszene, die mit jeder Station bunter wird, darunter die Stationskarte */
:root{
  --bg:#eaf1f4; --surface:#ffffff; --surface2:#f4f8f9; --ink:#1b2a33; --muted:#53656f; --line:#cbd8de;
  --berry:#c8213a; --on-berry:#ffffff; --berry-soft:#fbe4e7; --leaf:#2d7a46; --leaf-soft:#e0f1e5;
  --straw:#f2b632; --on-straw:#2b1d00; --harbor:#1f4f78; --sour:#7fae1e; --sour-soft:#eef5dc;
  --good:#1d7f47; --mid:#9a6a00; --bad:#b92f22; --good-bg:#e1f3e8; --mid-bg:#fbf0d6; --bad-bg:#fbe3df;
  --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1820; --surface:#15232d; --surface2:#1b2d39; --ink:#e7eff3; --muted:#a2b5bf; --line:#2c4251;
  --berry:#ff6b7f; --on-berry:#2a0008; --berry-soft:#3d1a21; --leaf:#6fcf8f; --leaf-soft:#173726;
  --straw:#f5c75a; --on-straw:#2b1d00; --harbor:#7fb4e3; --sour:#b4dd55; --sour-soft:#26321a;
  --good:#63d18f; --mid:#eebc4a; --bad:#f2846f; --good-bg:#183a28; --mid-bg:#3a3017; --bad-bg:#40221d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1820; --surface:#15232d; --surface2:#1b2d39; --ink:#e7eff3; --muted:#a2b5bf; --line:#2c4251;
  --berry:#ff6b7f; --on-berry:#2a0008; --berry-soft:#3d1a21; --leaf:#6fcf8f; --leaf-soft:#173726;
  --straw:#f5c75a; --on-straw:#2b1d00; --harbor:#7fb4e3; --sour:#b4dd55; --sour-soft:#26321a;
  --good:#63d18f; --mid:#eebc4a; --bad:#f2846f; --good-bg:#183a28; --mid-bg:#3a3017; --bad-bg:#40221d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px;margin:0}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(2.1rem,8vw,3.4rem);color:var(--berry)}
h2{font-size:clamp(1.45rem,5vw,1.9rem)}
h3{font-size:1.2rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--straw);outline-offset:2px;border-radius:8px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Statusleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:8px 16px;
  background:var(--surface);border-bottom:3px solid var(--berry);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.15rem;display:flex;align-items:center;gap:6px;margin-right:auto;color:var(--berry)}
.brand svg{width:26px;height:26px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--surface2);
  border:1px solid var(--line);font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg{width:16px;height:16px}
.iconbtn{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);border-radius:999px;
  padding:5px 11px;font-weight:700;font-size:.88rem;cursor:pointer;min-height:36px}
.iconbtn svg{width:18px;height:18px}
.iconbtn[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}

/* Szene */
.scene{margin:14px 0 12px;border-radius:var(--r);overflow:hidden;border:2px solid var(--ink);background:#bfe0f0;max-width:100%}
.scene svg{display:block;width:100%;height:auto}
.scene .el{transition:opacity .6s ease, transform .6s ease;opacity:0}
.scene .el.on{opacity:1}
.scene .stk{opacity:0;transition:opacity .4s}
.scene .stk.on{opacity:1}
.scene .grey{filter:grayscale(1);opacity:.55}

/* Karten */
.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px}
.card.hero{border-color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 22px;border-radius:14px;
  border:2px solid var(--ink);background:var(--berry);color:var(--on-berry);font-weight:700;font-size:1.05rem;cursor:pointer;
  box-shadow:0 4px 0 var(--ink);transition:transform .1s, box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn.sec{background:var(--surface);color:var(--ink)}
.btn.leaf{background:var(--leaf);color:#fff}
.btn.wide{width:100%}
input[type=text],input[type=number],select{width:100%;min-height:50px;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
label{font-weight:700}

/* Modus-Karten */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{text-align:left;border:3px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.mode svg{width:44px;height:44px}
.mode h3{color:var(--ink)}
.mode[aria-pressed="true"]{border-color:var(--berry);background:var(--berry-soft)}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--leaf);border-radius:99px}

/* Station */
.sthead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.clock{font-family:var(--display);font-size:1.3rem;background:var(--ink);color:var(--bg);padding:2px 10px;border-radius:8px;font-variant-numeric:tabular-nums}
.modtag{font-weight:700;font-size:.85rem;color:var(--leaf);background:var(--leaf-soft);border-radius:999px;padding:3px 10px}
.sab{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:start}
.sab svg{width:56px;height:56px}
.bubble{background:var(--sour-soft);border:2px solid var(--sour);border-radius:14px;padding:10px 12px;position:relative;min-width:0}
.bubble b{display:block;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.question{font-family:var(--display);font-size:1.35rem;line-height:1.2;text-wrap:balance}
.ws{display:flex;flex-wrap:wrap;gap:6px}
.ws span{font-size:.85rem;padding:3px 9px;border-radius:999px;border:1px dashed var(--muted);color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;text-align:left;width:100%;min-height:62px;
  border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface);cursor:pointer}
.opt .let{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);background:var(--surface2);border:2px solid var(--line)}
.opt .cost{font-size:.82rem;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--berry);background:var(--berry-soft)}
.opt[aria-pressed="true"] .let{background:var(--berry);color:var(--on-berry);border-color:var(--berry)}
.opt[disabled]{opacity:.45;cursor:not-allowed}
.opt.locked{cursor:default}
.hint{background:var(--mid-bg);border-radius:12px;padding:10px 12px;font-size:.95rem}
.react{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center}
.react svg{width:72px;height:72px}
.react .bubble{background:var(--surface2);border-color:var(--line)}
.term{border:2px solid var(--leaf);background:var(--leaf-soft);border-radius:14px;padding:12px 14px}
.term h3{color:var(--leaf)}
.mark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:800;flex:none}
.mark.g{background:var(--good-bg);color:var(--good)} .mark.m{background:var(--mid-bg);color:var(--mid)} .mark.b{background:var(--bad-bg);color:var(--bad)}
.fb{border-radius:12px;padding:10px 12px;font-size:.95rem}
.fb.g{background:var(--good-bg)} .fb.m{background:var(--mid-bg)} .fb.b{background:var(--bad-bg)}
.crisis{border-color:var(--bad);box-shadow:0 0 0 4px var(--bad-bg)}
.crisis .eyebrow{color:var(--bad)}

/* Persona */
.persona{display:grid;grid-template-columns:84px 1fr;gap:12px;align-items:center}
.persona svg{width:84px;height:84px}
.flip{perspective:800px}
.flip .inner{transition:transform .7s;transform-style:preserve-3d;position:relative}
.flip.turned .inner{transform:rotateY(180deg)}
.flip .face,.flip .back{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .back{transform:rotateY(180deg);position:absolute;inset:0}
.satbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.satbar i{display:block;height:100%;background:var(--berry);transition:width .5s}

/* Zuordnen */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;min-height:46px}
.chip[aria-pressed="true"]{border-color:var(--berry);background:var(--berry-soft)}
.chip.ok{border-color:var(--good);background:var(--good-bg);cursor:default}
.chip.no{border-color:var(--bad);background:var(--bad-bg);cursor:default}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.cat{border:2px dashed var(--muted);border-radius:14px;padding:10px;min-height:80px;background:var(--surface2);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.cat strong{font-family:var(--display);font-weight:400;font-size:1.05rem}
.cat .in{font-size:.85rem;display:flex;flex-direction:column;gap:4px}
.cat .in span{border-radius:8px;padding:2px 6px}

/* Grundriss */
.plan{max-width:560px;margin:0 auto;width:100%}
.plan svg{width:100%;height:auto;display:block}
.zone{cursor:pointer}
.zone circle{transition:transform .2s;transform-origin:center;transform-box:fill-box}
.zone:hover circle,.zone:focus circle{transform:scale(1.12)}

/* Eröffnung */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--surface2);border-radius:14px;padding:10px;text-align:center;min-width:0}
.kpi b{display:block;font-family:var(--display);font-size:clamp(1.3rem,5vw,1.9rem);font-weight:400;font-variant-numeric:tabular-nums;color:var(--berry)}
.kpi span{font-size:.8rem;color:var(--muted)}

/* Regal-Chaos */
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#8a5a3b;padding:10px;border-radius:12px;border:3px solid #5d3a22}
.slot{aspect-ratio:3/4;max-width:100%;border:none;border-radius:10px;background:#f6ecd9;cursor:pointer;display:grid;place-items:center;position:relative;padding:4px}
.slot svg{width:90%;height:90%}
.slot .lbl{position:absolute;bottom:3px;left:3px;right:3px;font-size:.62rem;font-weight:700;background:rgba(0,0,0,.65);color:#fff;border-radius:6px;padding:1px 3px;line-height:1.2}
.slot.fixed{outline:3px solid #2d7a46}
.timer{font-family:var(--display);font-size:2.4rem;color:var(--berry);font-variant-numeric:tabular-nums}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;font-size:.88rem}

/* Ergebnis */
.scorecard{border:3px solid var(--ink);border-radius:20px;padding:18px;background:var(--surface);text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:46px;height:46px}
.big{font-family:var(--display);font-size:clamp(2.2rem,9vw,3.2rem);color:var(--berry);font-variant-numeric:tabular-nums;line-height:1}
.evalrow{display:grid;grid-template-columns:32px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.evalrow .det{display:flex;flex-direction:column;gap:5px;min-width:0}
.ihk{border-left:4px solid var(--harbor);padding:4px 10px;font-size:.92rem;background:var(--surface2);border-radius:0 8px 8px 0}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;font-size:.82rem;display:flex;flex-direction:column;align-items:center;gap:3px}
.badge svg{width:42px;height:42px}
.badge.off{opacity:.38;filter:grayscale(1)}
details{border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface)}
summary{cursor:pointer;font-weight:700}
.note{font-size:.85rem;color:var(--muted)}
.confirm{border:2px solid var(--bad);background:var(--bad-bg);border-radius:12px;padding:12px}
@media (max-width:440px){ .brand span.bt,.iconbtn span{display:none} .bar{flex-wrap:nowrap}
 .modes{grid-template-columns:1fr 1fr} .opt{grid-template-columns:32px 1fr} .opt .cost{grid-column:2} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .3s}
</style>
</head>

  vars:[

 {key:'s2', mod:2, time:'21:00', title:'Mit allen Sinnen', modname:'Mit allen Sinnen',
  ws:['die Akzentbeleuchtung','die Grundbeleuchtung','der Duft','die Hintergrundmusik','die Verweildauer','die Kaufbereitschaft'],
  vars:[
   {id:'s2v1', sab:'Der Saure Apfel hat an der Lüftung gedreht. Es riecht nach Putzmittel und aus den Boxen dröhnt laute Technomusik.',
    q:'Welchen Duft und welche Musik stellst du ein?', hint:'Duft und Musik müssen zur Ware und zu den Gästen passen.',
    opts:[{t:'Duft von frischen Erdbeerwaffeln aus der Backstube, dazu leise ländliche Musik',q:2,c:2,st:'E',fit:{senior:1,fam:1},why:'Ein Duft, der zur Ware passt, steigert Kaufbereitschaft und Verweildauer. Ruhige Musik lässt die Gäste länger bleiben.'},
          {t:'Laute Technomusik, kein Duft',q:0,c:0,fit:{senior:-1},why:'Musik muss zur Zielgruppe passen und darf nicht zu laut sein. Putzmittelgeruch schreckt ab.'},
          {t:'Lavendel-Raumduft und das Radio',q:1,c:1,why:'Lavendel passt nicht zu Erdbeeren und Backwaren. Das Radio ist nicht gezielt ausgewählt.'}],
    term:['der Duft','Ein Duft passend zur Ware (Kaffee, Backwaren) steigert Kaufbereitschaft und Verweildauer und bleibt lange in Erinnerung.'],
    ihk:'Musik muss zur Zielgruppe passen. Ruhige Musik: Kunden bleiben länger. Duft passend zur Ware steigert Kaufbereitschaft und Verweildauer.',
    weil:['… weil Duft und Musik zur Ware und zu den Gästen passen und sie länger bleiben.','… weil laute Musik die Gäste schneller durch den Laden treibt.','… weil Duft gesetzlich vorgeschrieben ist.']},
   {id:'s2v2', sab:'Über der Erdbeertheke hat der Saure Apfel kalte, bläuliche Lampen eingeschraubt. Die Erdbeeren sehen blass aus.',
    q:'Was machst du mit dem Licht über den Erdbeeren?', hint:'Rote Ware wirkt unter warmem Licht frisch.',
    opts:[{t:'Warmes Akzentlicht genau auf die Erdbeertheke richten',q:2,c:2,why:'Warmes Licht lässt rote Ware frisch und lecker wirken. Akzentbeleuchtung betont einzelne Waren.'},
          {t:'Die kalten Lampen bleiben. Hauptsache hell.',q:0,c:0,why:'Unter kaltem Licht wirken Erdbeeren blass und grau. Die Lichtfarbe muss zur Ware passen.'},
          {t:'Die Grundbeleuchtung in der ganzen Halle heller drehen',q:1,c:1,why:'Die Grundbeleuchtung sorgt für Licht auf der ganzen Fläche. Die Erdbeeren werden so aber nicht hervorgehoben, und das Licht bleibt kalt.'}],
    term:['die Akzentbeleuchtung','betont einzelne Waren, Dekoinseln und Warenbilder – zum Beispiel ein Spot auf die Erdbeeren.'],
    ihk:'Beleuchtung hat einen wesentlichen Einfluss auf die Verkaufsförderung und wird gezielt eingesetzt.',
    weil:['… weil warmes Licht Rotes frisch wirken lässt und den Blick auf die Ware lenkt.','… weil kaltes Licht Strom spart.','… weil helles Licht die Preise größer macht.']},
   {id:'s2v3', sab:'Auf der Aktionsfläche „Erdbeer-Sommer“ fehlt noch ein Sinn. Der Saure Apfel meckert: „Probieren lassen? Viel zu teuer!“',
    q:'Wie sprichst du den Geschmackssinn an?', hint:'Fünf Sinne: sehen, hören, riechen, schmecken, fühlen.',
    opts:[{t:'Verkostung: Die Gäste probieren Erdbeermarmelade auf frischem Brot.',q:2,c:1,st:'E',fit:{tour:1,fam:1},why:'So wird der Geschmackssinn angesprochen. Die Gäste überzeugen sich selbst und bleiben länger.'},
          {t:'Ein großes Plakat: „Schmeckt lecker!“',q:1,c:0,why:'Ein Plakat spricht nur das Sehen an, nicht das Schmecken.'},
          {t:'Gar nichts. Die Gläser bleiben zu.',q:0,c:0,why:'So bleibt der Geschmackssinn ungenutzt. Gerade bei Lebensmitteln überzeugt Probieren.'}],
    term:['die Sinnenansprache','Sehen, Hören, Riechen, Schmecken und Fühlen – je mehr Sinne, desto stärker das Einkaufserlebnis.'],
    ihk:'Schmecken: Kunden dürfen neue Produkte probieren, damit sie sich vom Geschmack überzeugen.',
    weil:['… weil die Gäste sich durch Probieren selbst vom Geschmack überzeugen.','… weil man dann die Ware nicht mehr auszeichnen muss.','… weil Verkostungen vorgeschrieben sind.']}
  ]},
 {key:'s3', mod:3, time:'22:00', title:'Das Schaufenster am Eingang', modname:'Schaufenster',
  ws:['der Blickfang','das Fantasiefenster','das Anlassfenster','das Stapelfenster','weniger ist mehr','die Fernwirkung'],
  vars:[
   {id:'s3v1', sab:'Das große Schaufenster im Eingangsbereich des Dorfes ist leer. Der Saure Apfel hat die ganze Deko in den Ententeich geworfen.',
    q:'Welches Schaufenster baust du für die Eröffnung?', hint:'Wer vom Parkplatz kommt und vorbeigeht, schaut nur drei bis vier Sekunden hin.',
    opts:[{t:'Fantasiefenster: riesiger Erdbeerkorb, Plüsch-Erdbeeren, alte Marmeladenküche, Leitgedanke „Erdbeer-Sommer auf dem Land“',q:2,c:3,st:'E',fit:{tour:1,fam:1},why:'Eine originelle Szene unter einem Leitgedanken weckt Gefühle und bringt vorbeigehende Gäste zum Stehenbleiben.'},
          {t:'Stapelfenster: 300 Marmeladengläser übereinander',q:1,c:1,why:'Ein Stapelfenster zeigt eine Warengruppe in großer Menge. Das geht, weckt aber wenig Gefühle.'},
          {t:'Das Fenster bleibt leer, man sieht direkt in die Halle.',q:1,c:0,why:'Ein Durchblickfenster lässt in den Laden schauen. Am Eröffnungstag fehlt aber ein Blickfang.'}],
    term:['das Fantasiefenster','originelle Szene, immer unter einem Leitgedanken, zum Beispiel eine Strandszene zum Thema Urlaub.'],
    ihk:'Aufgaben eines Schaufensters: Aufmerksamkeit wecken, über Sortiment und Preise informieren, Gefühle ansprechen, ins Geschäft locken, Image zeigen.',
    weil:['… weil eine Szene mit Leitgedanken in wenigen Sekunden auffällt und Gefühle weckt.','… weil man so möglichst viel Ware zeigt.','… weil Schaufenster immer voll sein müssen.']},
   {id:'s3v2', sab:'Der Saure Apfel hat das Schaufenster „verbessert“: vollgestopft, der Blickfang genau in der Mitte, das Licht tagsüber aus.',
    q:'Wie gestaltest du das Fenster neu?', hint:'Denk an die zehn Gestaltungsgrundsätze.',
    opts:[{t:'Wenige Artikel, Blickfang rechts oben, Podeste in verschiedenen Höhen, Licht auch tagsüber an, Preise gut lesbar',q:2,c:2,why:'Weniger ist mehr. Der Blickfang steht nicht genau in der Mitte. Das Fenster ist dreidimensional, beleuchtet und zeigt Preise.'},
          {t:'Noch mehr Artikel hineinstellen, damit jeder etwas findet',q:0,c:1,why:'Ein überladenes Fenster wirkt unruhig. Grundsatz: Weniger ist mehr.'},
          {t:'Schöne Deko, aber der Blickfang bleibt in der Mitte und das Licht nur abends an',q:1,c:0,why:'Der Blickfang soll an eine gute Stelle, aber nicht genau in die Mitte. Fenster auch tagsüber beleuchten, sonst spiegelt die Scheibe.'}],
    term:['der Blickfang','Das, was zuerst ins Auge fällt. Er steht an einer guten Stelle, aber nicht genau in der Mitte; Aufbau als Pyramide.'],
    ihk:'Gestaltungsgrundsätze: Weniger ist mehr, Blickfang setzen, auch tagsüber beleuchten, regelmäßig neu dekorieren, sauber, Preise zeigen.',
    weil:['… weil ein klares Fenster mit Blickfang in drei bis vier Sekunden wirkt.','… weil Licht am Tag nichts bringt.','… weil der Blickfang immer in die Mitte gehört.']},
   {id:'s3v3', sab:'Am Eröffnungssonntag ist Muttertag. Der Saure Apfel hat die alte Osterdeko aus dem Lager ins Fenster gestellt.',
    q:'Was kommt ins Schaufenster?', hint:'Ein besonderer Anlass kann im Mittelpunkt stehen.',
    opts:[{t:'Anlassfenster zum Muttertag: großes Erdbeer-Herz, Geschenkkörbe mit Marmelade, Schild „Danke, Mama!“',q:2,c:2,st:'E',fit:{tour:1,fam:1},why:'Beim Anlassfenster steht ein besonderer Anlass im Mittelpunkt. Der Muttertag passt genau.'},
          {t:'Übersichtsfenster: aus jeder Manufaktur ein Artikel',q:1,c:1,why:'Ein Übersichtsfenster informiert über das Sortiment. Den Anlass Muttertag nutzt es aber nicht.'},
          {t:'Die Osterdeko bleibt stehen.',q:0,c:0,why:'Deko muss regelmäßig gewechselt werden. Alte Deko wirkt ungepflegt, Die Gäste gewöhnen sich daran.'}],
    term:['das Anlassfenster','Ein besonderer Anlass steht im Mittelpunkt: Weihnachten, Schulanfang, Muttertag, Stadtfest.'],
    ihk:'Anlassfenster: Ein besonderer Anlass wie Weihnachten steht im Mittelpunkt.',
    weil:['… weil am Muttertag viele Familien ein Geschenk suchen und das Fenster dazu passt.','… weil Osterdeko das ganze Jahr passt.','… weil ein Anlassfenster keine Preise braucht.']}
  ]},
 {key:'s4', mod:4, time:'23:00', title:'Theke oder Selbstbedienung?', modname:'Verkaufsformen',
  ws:['die Vollbedienung','die Vorwahl','die Selbstbedienung','warenbezogen','die Kontaktaufnahme','der stumme Verkäufer'],
  vars:[
   {id:'s4v1', sab:'In der Backstube gibt es frischen Erdbeerkuchen am Stück. Der Saure Apfel hat die Kuchen offen auf einen Tisch gestellt: „Nehmt euch einfach!“',
    q:'Welche Verkaufsform passt zum Erdbeerkuchen am Stück?', hint:'Offene Lebensmittel müssen hygienisch verpackt werden.',
    opts:[{t:'Vollbedienung an der Theke: Das Personal schneidet, berät und verpackt.',q:2,c:2,fit:{senior:1},why:'Offene, empfindliche Lebensmittel gehören in die Vollbedienung. Der Kunde hat keinen direkten Zugang, das Personal bedient.'},
          {t:'Selbstbedienung: Die Gäste nehmen sich ihr Stück selbst.',q:0,c:0,why:'Offene Lebensmittel brauchen Hygiene. In Selbstbedienung gibt es kaum Kontrolle.'},
          {t:'Vorwahl: Die Kuchen stehen offen, Personal hilft bei Bedarf.',q:0,c:0,why:'Bei Vorwahl hat der Kunde Zugang zur Ware. Das passt zu Kleidung oder Schuhen, nicht zu offenem Kuchen.'}],
    term:['die Vollbedienung','Kunde hat keinen direkten Zugang zur Ware. Das Personal legt vor, berät und verpackt.'],
    ihk:'Vollbedienung: Kunde hat keinen direkten Zugang zur Ware, das Personal bedient – zum Beispiel offene Lebensmittel wie Käse.',
    weil:['… weil offene Lebensmittel hygienisch vorgelegt und verpackt werden müssen.','… weil Vollbedienung am wenigsten Personal braucht.','… weil Kuchen diebstahlgefährdet ist.']},
   {id:'s4v2', sab:'In der Textil-Ecke (Vorwahl) hält sich eine Kundin eine Erdbeer-Schürze an und schaut sich suchend um. Der Saure Apfel flüstert: „Frag einfach: Kann ich helfen?“',
    q:'Was sagst du zur Kundin?', hint:'Eine Ja-Nein-Frage beendet das Gespräch schnell.',
    opts:[{t:'„Die Schürze gibt es auch in Grün mit kleinen Erdbeeren. Soll ich sie Ihnen zeigen?“',q:2,c:0,fit:{senior:1,tour:1},why:'Die Kundin zeigt Signale (sucht, schaut sich um). Jetzt passt eine warenbezogene Ansprache.'},
          {t:'„Kann ich Ihnen helfen?“',q:1,c:0,why:'Darauf kommt oft: „Nein danke, ich schaue nur.“ Dann ist das Gespräch zu Ende.'},
          {t:'Gleich hinlaufen, wenn sie die Ecke betritt, und alle Schürzen erklären',q:0,c:0,why:'In der Vorwahl soll der Kunde erst in Ruhe schauen. Wer sofort losredet, bedrängt.'}],
    term:['die warenbezogene Kontaktaufnahme','Man spricht über die Ware, die der Kunde ansieht – keine Ja-Nein-Frage.'],
    ihk:'Anzeichen für Beratungswunsch: sucht Blickkontakt, schaut sich suchend um, betrachtet einen Artikel längere Zeit, wirkt orientierungslos.',
    weil:['… weil die Kundin Signale zeigt und eine Frage zur Ware das Gespräch öffnet.','… weil man Kunden in der Vorwahl immer sofort ansprechen muss.','… weil Ja-Nein-Fragen besonders höflich sind.']},
   {id:'s4v3', sab:'Die abgepackten Erdbeer-Bonbons in Tüten sind günstig und bekannt. Der Saure Apfel will sie hinter eine Theke stellen.',
    q:'Welche Verkaufsform passt zu den Bonbon-Tüten?', hint:'Wie erklärungsbedürftig ist eine Bonbontüte?',
    opts:[{t:'Selbstbedienung: Die Tüten stehen frei im Regal.',q:2,c:0,fit:{eilig:1},why:'Problemlose, bekannte Ware braucht keine Beratung. Selbstbedienung spart Personalkosten. Die Präsentation ist der „stumme Verkäufer“.'},
          {t:'Vollbedienung: Personal reicht jede Tüte über die Theke.',q:0,c:3,why:'Zu viel Personal für eine problemlose Ware. Die Kosten sind hoch, die Gäste warten.'},
          {t:'Vorwahl mit Beratung auf Wunsch',q:1,c:1,why:'Möglich, aber Beratung braucht bei Bonbons kaum jemand.'}],
    term:['die Selbstbedienung','Kunde nimmt die Ware selbst und bringt sie zur Kasse. Platzierung, Regal und Preisschild müssen verkaufen.'],
    ihk:'Je erklärungsbedürftiger und wertvoller die Ware, desto mehr Bedienung. Selbstbedienung: niedrige Personalkosten, viele Kunden gleichzeitig.',
    weil:['… weil problemlose Ware keine Beratung braucht und Selbstbedienung Personalkosten spart.','… weil Bonbons besonders erklärungsbedürftig sind.','… weil Selbstbedienung höhere Preise ermöglicht.']}
  ]},
 {key:'s5', mod:5, time:'00:00', title:'Die Erdbeer-Rennbahn', modname:'Raumaufteilung und Laufwege',
  ws:['der Loop (Rundlauf)','der Zwangsumlauf','der Individualumlauf','die Sackgasse','übersichtlich','barrierefrei'],
  vars:[
   {id:'s5v1', sab:'Der Saure Apfel hat einen Bauplan voller Sackgassen hinterlassen.',
    q:'Wie führst du die Gäste durch das Erlebnis-Dorf?', hint:'Kunden sollen an möglichst viel Ware vorbeikommen, ohne sich eingesperrt zu fühlen.',
    opts:[{t:'Loop: ein Rundweg rechts herum durch die ganze Halle, an allen Manufakturen vorbei',q:2,c:2,why:'Beim Loop geht man kein Wegstück doppelt und kommt an möglichst viel Ware vorbei. Die meisten Kunden gehen rechts herum.'},
          {t:'Zwangsumlauf mit Absperrbändern, ohne Abkürzung bis zur Kasse',q:1,c:1,fit:{eilig:-1,senior:-1},why:'Die Gäste sehen alles. Eilige ärgern sich aber über lange Wege. In der Praxis ist der Zwangsumlauf selten.'},
          {t:'Freie Gänge mit Sackgassen',q:0,c:0,why:'In Sackgassen müssen Kunden umkehren. Solche Bereiche werden gemieden.'}],
    term:['der Loop','ein Rundweg durch den ganzen Laden, kein Wegstück wird doppelt gegangen.'],
    ihk:'Ziel der Raumordnung: ein flüssiger Kundenstrom – Kunden kommen an möglichst vielen Waren vorbei, ohne sich gelenkt oder eingeengt zu fühlen.',
    weil:['… weil die Gäste an möglichst viel Ware vorbeikommen, ohne umzukehren.','… weil ein Rundweg weniger Platz für Ware lässt.','… weil Kunden am liebsten in Sackgassen stöbern.']},
   {id:'s5v2', sab:'Der Saure Apfel hat die Pfeile auf dem Boden vertauscht.',
    q:'In welche Richtung soll der Hauptweg vom Eingang aus führen?', hint:'Etwa 70 Prozent der Kunden gehen rechts.',
    opts:[{t:'Rechts herum, also gegen den Uhrzeigersinn, an den Außenwänden entlang',q:2,c:0,why:'Etwa 70 Prozent der Kunden gehen rechts und schauen nach rechts. Sie laufen gegen den Uhrzeigersinn und mögen die Außengänge.'},
          {t:'Links herum, also im Uhrzeigersinn',q:0,c:0,why:'Das ist gegen die natürliche Laufrichtung. Viele Gäste würden gegen den Strom laufen.'},
          {t:'Keine Pfeile. Die Gäste finden ihren Weg schon.',q:1,c:0,fit:{eilig:-1},why:'Ein Individualumlauf ist erlaubt. Ohne Lenkung des Kundenlaufs bleiben aber Bereiche leer.'}],
    term:['der Kundenlauf','Kunden gehen meist rechts, gegen den Uhrzeigersinn, und bevorzugen die Außengänge.'],
    ihk:'Etwa 70 % der Kunden gehen rechts und schauen nach rechts; sie laufen gegen den Uhrzeigersinn und bevorzugen die Außengänge.',
    weil:['… weil die meisten Kunden ohnehin rechts herum gehen.','… weil Kunden lieber nach links schauen.','… weil der Uhrzeigersinn Glück bringt.']},
   {id:'s5v3', sab:'Der Saure Apfel hat 2,20 Meter hohe Regale in die Mitte gestellt und die Gänge auf 80 Zentimeter verengt.',
    q:'Was machst du?', hint:'Denk an Kinderwagen und Rollator.',
    opts:[{t:'Regale in der Mitte höchstens etwa 1,50 m hoch, breite Gänge für Kinderwagen und Rollator',q:2,c:2,fit:{senior:1,fam:1},why:'Niedrige Warenträger in der Mitte sorgen für Übersicht. Breite Gänge ohne Barrieren lassen alle gut durchkommen.'},
          {t:'Alles so lassen, aber Hinweisschilder aufhängen',q:1,c:1,fit:{senior:-1,fam:-1},why:'Schilder helfen bei der Orientierung. Die Übersicht fehlt aber und die Gänge bleiben zu eng.'},
          {t:'Zusätzlich Kartons mit Ware in die Gänge stellen',q:0,c:0,fit:{senior:-1,fam:-1},why:'Kartons im Gang sind Barrieren und eine Unfallgefahr.'}],
    term:['übersichtlich und barrierefrei','Warenträger in der Mitte höchstens etwa 1,50 m, breite Gänge, keine Kartons im Weg.'],
    ihk:'Kriterien für die Anordnung der Warenträger: genügend breite Gänge, Übersichtlichkeit, klare Struktur, Lenkung des Kundenlaufs, gute Erreichbarkeit der Ware, keine Barrieren.',
    weil:['… weil Gäste den Raum überblicken und mit Kinderwagen oder Rollator durchkommen.','… weil hohe Regale mehr Gemütlichkeit bringen.','… weil enge Gänge die Verweildauer erhöhen.']}
  ]},
 {key:'s6', mod:6, time:'01:00', title:'Starke und schwache Zonen', modname:'Verkaufszonen',
  ws:['verkaufsstark','verkaufsschwach','die Kassenzone','der Impulsartikel','der Mussartikel','der Magnetartikel'],
  vars:[
   {id:'s6v1', sab:'Die warmen Erdbeer-Lollies aus der Bonbon-Manufaktur sollen eine Zweitplatzierung bekommen. Der Saure Apfel will sie hinten im Textilbereich verstecken.',
    q:'Wo baust du das Lolly-Display auf?', hint:'Lollies kauft man spontan.',
    opts:[{t:'In der Kassenzone',q:2,c:1,fit:{fam:1},why:'Lollies sind Impulsartikel. In der Kassenzone warten die Kunden und greifen spontan zu.'},
          {t:'Hinten in der Ecke beim Textilbereich',q:0,c:0,why:'Ecken und hintere Bereiche werden gemieden. Dort sieht die Lollies kaum jemand.'},
          {t:'Im Mittelgang zwischen den Regalen',q:1,c:0,why:'Mittelgänge sind verkaufsschwach. Impulsartikel gehören dorthin, wo viele Kunden vorbeikommen oder warten.'}],
    term:['der Impulsartikel','wird spontan gekauft (Süßigkeiten, Kaugummi). Platz: Kassenzone, Eingang, Gondelköpfe.'],
    ihk:'Impulsartikel – Kassenzone – Kunden warten und greifen spontan zu.',
    weil:['… weil die Gäste an der Kasse warten und spontan zugreifen.','… weil die Kassenzone verkaufsschwach ist.','… weil Lollies Mussartikel sind.']},
   {id:'s6v2', sab:'Mehl und Zucker für Erdbeerkuchen will der Saure Apfel direkt an den Eingang stellen.',
    q:'Wohin kommen Mehl und Zucker?', hint:'Wer Mehl braucht, sucht es sowieso.',
    opts:[{t:'Weiter hinten in die Halle',q:2,c:0,fit:{eilig:-1},why:'Mehl und Zucker sind Mussartikel (Suchartikel). Kunden suchen sie sowieso und laufen dafür an viel anderer Ware vorbei.'},
          {t:'Direkt an den Eingang',q:0,c:0,fit:{eilig:1},why:'Dann nehmen die Kunden das Mehl und gehen gleich zur Kasse. An der übrigen Ware kommen sie nicht vorbei.'},
          {t:'Rechts am Hauptweg auf die beste Fläche',q:1,c:0,why:'Der starke Platz ist verschenkt. Dorthin gehören Neuheiten und Artikel mit hoher Spanne.'}],
    term:['der Mussartikel','wird sowieso gekauft und gezielt gesucht: Milch, Mehl, Zucker, Brot. Platz: hinten oder im Mittelgang.'],
    ihk:'Muss- oder Suchartikel – hinterer Bereich oder Mittelgang – Kunden suchen sie sowieso und laufen dafür an anderer Ware vorbei.',
    weil:['… weil Kunden Mussartikel gezielt suchen und unterwegs an viel Ware vorbeikommen.','… weil Mehl eine hohe Gewinnspanne hat.','… weil Mehl schnell verdirbt.']},
   {id:'s6v3', sab:'In der hinteren linken Ecke hat der Saure Apfel das Licht ausgeschaltet. Niemand geht dorthin.',
    q:'Wie wertest du die schwache Ecke auf?', hint:'Schwache Zonen brauchen einen Grund, dorthin zu gehen.',
    opts:[{t:'Magnetartikel (Schoko-Erdbeeren im Super-Angebot), helles Licht und eine Verkostung',q:2,c:2,why:'Magnetartikel locken Kunden in schwache Zonen. Mehr Licht und eine Verkostung werten die Ecke zusätzlich auf.'},
          {t:'Nur ein Schild: „Hier gibt es auch was!“',q:1,c:0,why:'Ein Schild allein ist kein Grund, in die Ecke zu gehen. Dunkle Bereiche werden gemieden.'},
          {t:'Die Ecke bleibt dunkel und leer.',q:0,c:0,why:'Dunkle Ecken werden gemieden. Die Fläche bringt keinen Umsatz.'}],
    term:['der Magnetartikel','zieht Kunden an, z. B. ein starkes Angebot. Platz: in schwachen Zonen, damit sie belebt werden.'],
    ihk:'Schwache Zonen aufwerten: Sonderangebote platzieren, Suchartikel platzieren, Displays aufstellen, Beleuchtung verbessern, Aktionsfläche einrichten.',
    weil:['… weil ein starkes Angebot und gutes Licht die Gäste in die Ecke locken.','… weil Ecken immer verkaufsstark sind.','… weil Magnetartikel an die Kasse gehören.']}
  ]},
 {key:'s7', mod:7, time:'02:00', title:'Tische, Vitrinen, Displays', modname:'Warenträger und Platzierungsarten',
  ws:['die Verbundplatzierung','die Warengruppenplatzierung','die Zweitplatzierung','die Vitrine','das Display','der Stopper'],
  vars:[
   {id:'s7v1', sab:'Der Frühstückstisch „Frühstück auf dem Erdbeerhof“ ist leer. Der Saure Apfel hat nur Klopapier daraufgelegt.',
    q:'Was kommt auf den Tisch?', hint:'Welche Artikel ergänzen sich zu einem Frühstück?',
    opts:[{t:'Erdbeermarmelade, Brötchen, Butter, Kaffee und Frühstücksbrettchen zusammen',q:2,c:2,st:'E',fit:{fam:1,tour:1},why:'Das ist eine Verbundplatzierung: Artikel, die sich ergänzen, stehen zusammen. Für Gäste bequem, für den Laden mehr Zusatzkäufe.'},
          {t:'Alle Marmeladensorten nebeneinander',q:1,c:1,why:'Das ist eine Warengruppenplatzierung (gleichartige Artikel), keine Verbundplatzierung.'},
          {t:'Was gerade übrig ist, Hauptsache voll',q:0,c:0,why:'Ohne Thema und ohne Zusammenhang entsteht kein Bedarfsbündel. Der Tisch wirkt beliebig.'}],
    term:['die Verbundplatzierung','Artikel, die sich gegenseitig ergänzen, stehen zusammen (Bedarfsbündel).'],
    ihk:'Verbundplatzierung ist die Platzierung von Artikeln, die sich gegenseitig ergänzen, zum Beispiel Grillfleisch mit Grillsoßen und Getränken.',

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let rnd = Math.random, CH = null;
function seeded(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; }
  let a=h>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function dayCode(){ const d=new Date(); return 'ERDBEER-'+String(d.getDate()).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0'); }
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const euro = n => n.toFixed(2).replace('.',',') + ' €';
const MODES = {
  anf:{n:'Anfänger', d:'Mit Wortspeicher, Tipps und Rechenhilfe. Ihr habt etwas mehr Geld.', budget:20, crises:0, events:1, chaosProblems:6},
  pro:{n:'Profi', d:'Ohne Hilfen. Jede Entscheidung braucht die richtige Begründung. Knappes Geld und Saboteur-Krisen.', budget:16, crises:2, events:2, chaosProblems:9}
};

/* ---------- Speicher (nur auf diesem Gerät) ---------- */
const KEY='baal-erdbeer-imperium-v1';
let STORE_OK = true;
let S = {seen:{anf:{},pro:{}}, rec:{anf:0,pro:0}, badges:[], personas:[], games:0, music:false};
try{ const raw = localStorage.getItem(KEY); if(raw){ S = Object.assign(S, JSON.parse(raw)); } }catch(e){ STORE_OK=false; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ STORE_OK=false; } }
let NOTICE = [];
/* zieht n Einträge, die auf diesem Gerät in diesem Modus noch nicht vorkamen */
function draw(pool, n, poolKey, mode){
  if(CH) return shuffle(pool).slice(0,n); /* Klassen-Challenge: gleiche Ziehung für alle, ohne Gedächtnis */
  const seen = (S.seen[mode][poolKey] ||= []);
  const fresh = shuffle(pool.filter(x => !seen.includes(x.id)));
  if(fresh.length >= n){ const pick=fresh.slice(0,n); pick.forEach(x=>seen.push(x.id)); return pick; }
  /* Pool aufgebraucht: neu mischen, zuerst die restlichen neuen Einträge */
  if(seen.length) NOTICE.push(poolKey);
  const last = seen[seen.length-1];
  const rest = shuffle(pool.filter(x => !fresh.includes(x))).sort((x,y)=>(x.id===last)-(y.id===last));
  const pick = [...fresh, ...rest].slice(0,n);
  S.seen[mode][poolKey] = pick.map(x=>x.id);
  return pick;
}
function unseenCount(mode){
  let tot=0, un=0;
  STATIONS.forEach(st => { const seen=S.seen[mode][st.key]||[]; tot+=st.vars.length; un+=st.vars.filter(v=>!seen.includes(v.id)).length; });
  return {tot, un};
}

/* ---------- Musik (Web Audio, standardmäßig aus) ---------- */
const Music = {
  ctx:null, timer:null, step:0, tempo:112, master:null,
  ensure(){ if(!this.ctx){ try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); this.master=this.ctx.createGain(); this.master.gain.value=.3; this.master.connect(this.ctx.destination);}catch(e){ this.ctx=null; } } return this.ctx; },
  note(freq, t, dur, type='triangle', vol=.25){ const c=this.ctx; const o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+.02); },
  hat(t){ const c=this.ctx; const b=c.createBuffer(1, c.sampleRate*.05, c.sampleRate); const d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=c.createBufferSource(); s.buffer=b; const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.value=6000; const g=c.createGain(); g.gain.value=.12; s.connect(f); f.connect(g); g.connect(this.master); s.start(t); },
  start(intensity=1){ if(!S.music || document.hidden) return; if(!this.ensure()) return; this.ctx.resume(); this.stop(); this.step=0; this.tempo=104+intensity*10;
    const bass=[110,110,130.8,98]; const arp=[220,261.6,329.6,392,329.6,261.6,246.9,293.7];
    const tick=()=>{ const t=this.ctx.currentTime+.05; const s=this.step++; const bar=Math.floor(s/8)%4;
      if(s%2===0) this.note(bass[bar]/2, t, .25, 'sine', .45);
      if(s%2===1) this.hat(t);
      this.note(arp[s%8]*(bar===3?1.12:1), t, .12, 'square', .05);
      this.tempo=Math.min(this.tempo+.15, 150);
      this.timer=setTimeout(tick, 60000/this.tempo/2); };
    tick(); },
  stop(){ clearTimeout(this.timer); this.timer=null; },
  tusch(){ if(!S.music || !this.ensure()) return; this.ctx.resume(); const t=this.ctx.currentTime+.05; [261.6,329.6,392,523.3].forEach((f,i)=>this.note(f,t+i*.09,.9,'triangle',.18)); }
};
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) Music.stop(); });

let G = null;
function newGame(mode, team, personaId, code){
  NOTICE = [];
  const persona = PERSONAS.find(p=>p.id===personaId) || shuffle(PERSONAS)[0];
  const vars = STATIONS.map(st => ({st, v: draw(st.vars, 1, st.key, mode)[0]}));
  const crises = MODES[mode].crises ? draw(CRISES, MODES[mode].crises, 'crises', mode) : [];
  const sortset = draw(SORTSETS, 1, 'sortsets', mode)[0];
  const placeItems = draw(PLACEITEMS, 4, 'place', mode);
  const events = draw(EVENTS, MODES[mode].events, 'events', mode);
  const profi = draw(PROFIS, 1, 'profis', mode)[0];
  const talk = draw(TALKS, 1, 'talks', mode)[0];
  rnd = Math.random; CH = null;
  save();
  const steps=[];
  vars.forEach((x,i)=>{ steps.push({t:'st', i});
    if(i===2 && crises[0]) steps.push({t:'cr', c:crises[0]});
    if(i===3) steps.push({t:'sort'});
    if(i===5) steps.push({t:'place'});
    if(i===7 && crises[1]) steps.push({t:'cr', c:crises[1]});
    if(i===8) steps.push({t:'talk'}); });
  steps.push({t:'open'},{t:'chaos'},{t:'result'});
  G = {mode, code: code||'', talk, talkRes:null, team: team||'Team Erdbeere', persona, vars, crises, sortset:shuffleSet(sortset), placeItems, events, profi,
       budget: MODES[mode].budget, spent:0, strat:null, sat:50, steps, k:0, res:{}, crRes:[], sortPts:0, sortMax:0, placePts:0, chaos:null, eventsRes:[]};
  renderStep();
}

function stationSum(){ return STATIONS.reduce((a,st)=>a+(G.res[st.key]?G.res[st.key].q:0),0); }
function renderOpening(){
  const sum=stationSum();

  bindBar();

  const dots = Array.from({length:12},(_,i)=>{ const c=document.createElementNS('http://www.w3.org/2000/svg','circle'); c.setAttribute('r','5'); c.setAttribute('fill',cols[i%6]); c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','1.5'); wg.appendChild(c); return {c, off:i/12}; });

  const count=(el,to,fmt,dur=1800)=>{ if(reduce){ el.textContent=fmt(to); return; } const s=performance.now(); const f=(n)=>{ const p=Math.min(1,(n-s)/dur); el.textContent=fmt(to*(1-Math.pow(1-p,3))); if(p<1) requestAnimationFrame(f); }; requestAnimationFrame(f); };

  $$('.slot').forEach(b=>b.onclick=()=>{ if(!running) return; const s=state[+b.dataset.i];
    if(s.k==='ok'||s.fixed){ if(s.k==='ok'){ miss++; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); } return; }
    s.fixed=true; fixedN++; b.classList.add('fixed'); b.innerHTML=ART.jar('fixed'); b.setAttribute('aria-label',`Glas ${+b.dataset.i+1}: ${CHAOS_KINDS[s.k].fix}`);
    $('#cnt').textContent=`${fixedN} von ${nProb} behoben`; if(fixedN===nProb) end(); });
}

/* ---------- Auswertung ---------- */
function renderResult(){
  Music.stop();
  const pro=G.mode==='pro';
  const stPts = STATIONS.reduce((a,st)=>a+G.res[st.key].pts,0);
  const crPts = G.crRes.reduce((a,r)=>a+r.o.q,0);
  const tPts = G.talkRes ? G.talkRes.o.q : 0;
  const total = stPts + crPts + G.sortPts + G.placePts + G.chaos.pts + tPts;
  const max = 22 + G.crRes.length*2 + G.sortMax + 4 + 4 + 2;
  const pct = total/max;
  const stars = pct>=.85?3:pct>=.65?2:pct>=.4?1:0;
  const title = ['Der Saure Apfel hat gewonnen – diesmal.','Probezeit verlängert','Leitung Erlebnis-Dorf Bremerhaven','Head of Visual Merchandising für alle Baal-Dörfer im Norden'][stars];
  const baalSays = ['„Hm. Morgen fangen wir noch mal von vorn an. Schaut euch die Auswertung genau an.“','„Ein Anfang! Aber der Saure Apfel hat noch zu viele Spuren hinterlassen.“','„Gute Arbeit! Ein paar Kleinigkeiten, dann seid ihr ganz oben.“','„Großartig! Ihr habt den Sauren Apfel geschlagen. Ab morgen seid ihr für alle Baal-Dörfer im Norden zuständig!“'][stars];
  // Speichern
  S.games++; const isRec = total > (S.rec[G.mode]||0); if(isRec) S.rec[G.mode]=total;
  if(!S.personas.includes(G.persona.id)) S.personas.push(G.persona.id);
  const award=id=>{ if(!S.badges.includes(id)) S.badges.push(id); };
  award('b1'); if(stars===3) award(pro?'b3':'b2'); if(S.personas.length>=4) award('b6');
  if(STATIONS.every(st=>G.res[st.key].q===2)) award('b7');
  save();
  const notice = NOTICE.length?`<p class="fb m">Alle Szenen in einem Bereich geschafft – dort geht es jetzt von vorn los, neu gemischt.</p>`:'';
  app().innerHTML = bar() + `
  <div class="stack" style="margin-top:14px">
   <div class="scorecard">
    <span class="eyebrow">20:00 Uhr · Das Fazit von Rupert Baal</span>
    <div class="row" style="justify-content:center">${ART.baal('width="70" height="70"')}<div class="bubble" style="background:var(--surface2);border-color:var(--line);text-align:left;max-width:440px">${esc(baalSays)}</div></div>
    <div class="stars">${[0,1,2].map(i=>ART.star(i<stars)).join('')}</div>
    <div class="big">${total} / ${max}</div><span>Punkte${isRec?' · <strong>Neuer Rekord!</strong>':''}</span>
    <h2>${esc(title)}</h2>
    <p><strong>${esc(G.team)}</strong> · ${MODES[G.mode].n}${G.code?' · Challenge '+esc(G.code):''} · Gast: ${esc(G.persona.name)}</p>
    <div class="kpis" style="width:100%"><div class="kpi"><b>${G.kpi.visitors.toLocaleString('de-DE')}</b><span>Gäste</span></div><div class="kpi"><b>${G.kpi.stay}</b><span>Min. im Laden</span></div><div class="kpi"><b>${Math.round(G.kpi.revenue/1000).toLocaleString('de-DE')} Tsd. €</b><span>Umsatz</span></div></div>
    <div style="width:100%;text-align:left"><span class="small">Zufriedenheit von ${esc(G.persona.name)}: ${G.sat} %</span><div class="satbar"><i style="width:${G.sat}%"></i></div></div>
    <p class="small muted">Stationen ${stPts}/22 · ${G.crRes.length?`Krisen ${crPts}/${G.crRes.length*2} · `:''}Kisten ${G.sortPts}/${G.sortMax} · Grundriss ${G.placePts}/4 · Kundengespräch ${tPts}/2 · Regal-Chaos ${G.chaos.pts}/4 · Budget übrig: ${G.budget-G.spent} Tsd. €</p>
   </div>
   ${notice}
   <div class="card stack"><h2>Was der Saure Apfel angerichtet hat – und was ihr gemacht habt</h2>
    <p class="small muted">✓ richtig · ~ teilweise · ✗ falsch${pro?' · Im Profi-Modus zählt die volle Punktzahl nur mit der richtigen Begründung.':''}</p>
    ${STATIONS.map((st,i)=>{ const r=G.res[st.key]; const best=r.v.opts? r.v.opts.find(o=>o.q===2):null; return `<div class="evalrow">${MARK(r.q)}<div class="det">
      <span class="eyebrow">Station ${i+1} · Modul ${st.mod} · ${esc(st.modname)}</span>
      <strong>${esc(r.o.t)}</strong><span>${esc(r.o.why)}</span>
      ${r.q<2&&best&&best.t!==r.o.t?`<span><strong>Besser:</strong> ${esc(best.t)}</span>`:''}
      ${pro&&r.v.weil?`<span class="small">${r.weilOK?'✓ Begründung richtig':`✗ Begründung falsch. Richtig: ${esc(r.v.weil[0])}`}</span>`:''}
      ${r.conflict?'<span class="small">~ passte nicht zu eurer Strategie aus Station 1</span>':''}
      <div class="ihk"><strong>So steht es in der Prüfung:</strong> ${esc(r.v.ihk)}</div></div></div>`; }).join('')}
    ${G.talkRes?`<div class="evalrow">${MARK(G.talkRes.o.q)}<div class="det"><span class="eyebrow">Kundengespräch · Modul ${G.talk.mod}</span><strong>${esc(G.talkRes.o.t)}</strong><span>${esc(G.talkRes.o.why)}</span>${G.talkRes.o.q<2?`<span><strong>Besser:</strong> ${esc(G.talk.opts.find(o=>o.q===2).t)}</span>`:''}</div></div>`:''}
    ${G.placeLog.map(p=>`<div class="evalrow">${MARK(p.ok?2:0)}<div class="det"><span class="eyebrow">Grundriss · Modul 6</span><strong>${esc(p.it.n)} → Zone ${p.z}</strong><span>${esc(p.it.kind)}: ${esc(p.it.why)}</span></div></div>`).join('')}
   </div>
   <div class="card stack"><span class="eyebrow">Für Profis · Modul ${G.profi.mod}</span><p><strong>${esc(G.profi.q)}</strong></p>
    <details><summary>Musterlösung zeigen</summary><p style="margin-top:8px">${esc(G.profi.a)}</p></details></div>
   <div class="card stack"><h3>Nochmal spielen</h3>
    <div class="row"><button class="btn" id="again">Neue Nacht, gleicher Modus</button><button class="btn sec" id="other">${pro?'Zum Anfänger-Modus':'Zum Profi-Modus'}</button><button class="btn sec" id="home">Startseite</button></div>
    <p class="note">Beim nächsten Spiel kommen andere Szenen, Gäste und Ereignisse – so lange, bis ihr alle kennt.</p></div>
  </div>`;
  bindBar(); Music.tusch();
  $('#again').onclick=()=>renderPersonaDraw(G.mode, G.team, G.code);
  $('#other').onclick=()=>renderPersonaDraw(pro?'anf':'pro', G.team);
  $('#home').onclick=()=>renderStart(G.mode);
}
/* ---------- Kundengespräch ---------- */
function renderTalk(){
  const c=G.talk; const order=shuffle(c.opts.map((o,idx)=>({...o,idx})));
  app().innerHTML = bar() + `
  <div class="stack" style="margin-top:14px"><div class="card stack">
   <div class="sthead"><span class="clock">${G.practice?'Übung':'04:30'}</span><span class="modtag">Kundengespräch · Modul ${c.mod}</span></div>
   <h2>Generalprobe: Ein Gast spricht euch an</h2>
   <p class="small">Baal testet das Team mit einer Probekundschaft. Was sagt ihr? Achtet auf wörtliche Rede, wie in der Prüfung.</p>
   <div class="react">${ART.face(G.persona.id,1)}<div class="bubble"><b>${esc(c.who)}</b>${esc(c.say)}</div></div>
   <div class="opts">${order.map((o,n)=>`<button class="opt" data-idx="${o.idx}" aria-pressed="false"><span class="let">${'ABC'[n]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
   <button class="btn wide" id="lockBtn" disabled>Das sagen wir</button><div id="after" class="stack"></div></div></div>`;
  bindBar();
  let pick=null;
  $$('.opt').forEach(b=>b.onclick=()=>{ if(b.classList.contains('locked')) return; pick=+b.dataset.idx; $$('.opt').forEach(x=>x.setAttribute('aria-pressed',x===b)); $('#lockBtn').disabled=false; });
  $('#lockBtn').onclick=()=>{ const o=c.opts[pick]; $$('.opt').forEach(x=>{x.classList.add('locked'); if(+x.dataset.idx!==pick) x.disabled=true;}); $('#lockBtn').hidden=true;
    G.talkRes={o}; G.sat=Math.max(0,Math.min(100,G.sat+(o.q-1)*6));
    $('#after').innerHTML=`<p class="fb ${o.q===2?'g':o.q===1?'m':'b'} pop">${MARK(o.q)} ${esc(o.why)}</p>${o.q<2?`<p class="small"><strong>Besser:</strong> ${esc(c.opts.find(x=>x.q===2).t)}</p>`:''}<button class="btn wide" id="nextBtn">Weiter</button>`;
    $('#nextBtn').onclick=go; };
}

/* ---------- Fehlerjagd ---------- */
function renderHunt(){
  const pro=G.mode==='pro';
  const items=G.hunt; const marked=new Set();
  app().innerHTML = bar() + `
  <div class="stack" style="margin-top:14px"><div class="card stack">
   <div class="sthead"><span class="clock">Übung</span><span class="modtag">Fehlerjagd · Module 2–11</span></div>
   <h2>Der Probe-Laden des Sauren Apfels</h2>
   <div class="sab">${ART.apple()}<div class="bubble"><b>Der Saure Apfel</b>In meinem Laden sind ${pro?'einige':items.filter(x=>x.err).length} Fehler versteckt. Findet ihr sie alle? Hehehe!</div></div>
   <p>Tippt auf alles, was <strong>falsch</strong> ist. Dann „Prüfen“.</p>
   <div class="opts">${items.map((it,n)=>`<button class="opt hu" data-n="${n}" aria-pressed="false"><span class="let">${n+1}</span><span>${esc(it.t)}</span>${pro?'':`<span class="cost">Modul ${it.mod}</span>`}</button>`).join('')}</div>
   <button class="btn wide" id="lockBtn">Prüfen</button><div id="after" class="stack"></div></div></div>`;
  bindBar();
  $$('.hu').forEach(b=>b.onclick=()=>{ if(b.classList.contains('locked')) return; const n=+b.dataset.n; marked.has(n)?marked.delete(n):marked.add(n); b.setAttribute('aria-pressed', marked.has(n)); });
  $('#lockBtn').onclick=()=>{ $('#lockBtn').hidden=true; let ok=0;
    $$('.hu').forEach(b=>{ const n=+b.dataset.n, it=items[n], right=(marked.has(n)===it.err); if(right) ok++; b.classList.add('locked');
      b.insertAdjacentHTML('afterend', `<p class="fb ${right?'g':'b'}">${MARK(right?2:0)} ${it.err?'Fehler':'In Ordnung'}${right?'':marked.has(n)?' – das war richtig so':' – übersehen'}. ${esc(it.why)}</p>`); });
    G.huntPts=ok;
    $('#after').innerHTML=`<p class="fb ${ok===items.length?'g':ok>=items.length-2?'m':'b'} pop"><strong>${ok} von ${items.length}</strong> richtig eingeschätzt.</p><button class="btn wide" id="nextBtn">Zur Auswertung</button>`;
    $('#nextBtn').onclick=go; };
}

/* ---------- Einzeln üben ---------- */
function startPractice(mode, team, kind){
  const persona = shuffle(PERSONAS)[0];
  G = {mode, practice:kind, team: team||'Team Erdbeere', persona, vars: STATIONS.map(st=>({st, v:st.vars[0]})), crises:[], budget:99, spent:0, strat:null, sat:50,
       k:0, res:{}, crRes:[], sortPts:0, sortMax:0, placePts:0, placeLog:[], talkRes:null, steps:[]};
  if(kind.startsWith('st:')){ const i=+kind.slice(3); G.vars[i].v = draw(STATIONS[i].vars, 1, STATIONS[i].key, mode)[0]; G.steps=[{t:'st', i}]; }
  else if(kind==='talk'){ G.talk = draw(TALKS,1,'talks',mode)[0]; G.steps=[{t:'talk'}]; }
  else if(kind==='hunt'){ const e=draw(HUNT.filter(h=>h.err), mode==='pro'?4:3, 'hunt_err', mode), o=draw(HUNT.filter(h=>!h.err), mode==='pro'?4:4, 'hunt_ok', mode); G.hunt=shuffle([...e,...o]); G.steps=[{t:'hunt'}]; }
  else if(kind==='sort'){ G.sortset = shuffleSet(draw(SORTSETS,1,'sortsets',mode)[0]); G.steps=[{t:'sort'}]; }
  else if(kind==='place'){ G.placeItems = draw(PLACEITEMS,4,'place',mode); G.steps=[{t:'place'}]; }
  save();
  G.steps.push({t:'presult'});
  renderStep();
}
function renderPracticeResult(){
  let html='';
  const r=Object.values(G.res)[0];
  if(r){ const best=r.v.opts.find(o=>o.q===2);
    html=`<div class="evalrow">${MARK(r.q)}<div class="det"><span class="eyebrow">Modul ${r.st.mod} · ${esc(r.st.modname)}</span><strong>${esc(r.o.t)}</strong><span>${esc(r.o.why)}</span>
     ${r.q<2&&best?`<span><strong>Besser:</strong> ${esc(best.t)}</span>`:''}
     ${G.mode==='pro'&&r.v.weil?`<span class="small">${r.weilOK?'✓ Begründung richtig':`✗ Begründung falsch. Richtig: ${esc(r.v.weil[0])}`}</span>`:''}
     <div class="ihk"><strong>So steht es in der Prüfung:</strong> ${esc(r.v.ihk)}</div></div></div>`; }
  else if(G.talkRes) html=`<div class="evalrow">${MARK(G.talkRes.o.q)}<div class="det"><strong>${esc(G.talkRes.o.t)}</strong><span>${esc(G.talkRes.o.why)}</span></div></div>`;
  else if(G.practice==='hunt') html=`<p><strong>${G.huntPts} von ${G.hunt.length}</strong> richtig eingeschätzt.</p>`;
  else if(G.practice==='sort') html=`<p><strong>${G.sortPts} von ${G.sortMax}</strong> richtig zugeordnet.</p>`;
  else if(G.practice==='place') html=G.placeLog.map(p=>`<div class="evalrow">${MARK(p.ok?2:0)}<div class="det"><strong>${esc(p.it.n)} → Zone ${p.z}</strong><span>${esc(p.it.kind)}: ${esc(p.it.why)}</span></div></div>`).join('');
  const kind=G.practice, mode=G.mode, team=G.team;
  app().innerHTML = bar() + `<div class="stack" style="margin-top:14px"><div class="card stack"><span class="eyebrow">Übung · ${MODES[mode].n}</span><h2>Auswertung</h2>${html}
   <div class="row"><button class="btn" id="again">Noch eine Runde</button><button class="btn sec" id="home">Startseite</button></div>
   <p class="note">Bei „Noch eine Runde“ kommt – wenn vorhanden – eine neue Szene.</p></div></div>`;
  bindBar();
  $('#again').onclick=()=>startPractice(mode, team, kind);
  $('#home').onclick=()=>renderStart(mode);
}

renderStart();

</script>
</body>
</html>
