<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meine Lernkartei</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1f2a33;--mute:#5d6b76;--line:#d9d1c1;--accent:#1F4E79;--accent-ink:#fff;--soft:#e4ecf4;--ok:#2f7d4f;--ok-soft:#dff1e6;--bad:#b4442f;--bad-soft:#f8e1dc;--rule:#c9dcef;--shadow:0 10px 26px -14px rgba(40,30,10,.35);
 --f1:#b4442f;--f2:#c67a1c;--f3:#b39a1a;--f4:#4f8a3a;--f5:#1F4E79;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a20;--card:#1d252d;--ink:#e9eef2;--mute:#9fb0bd;--line:#33414d;--accent:#7fb2e0;--accent-ink:#0f1a24;--soft:#23313d;--ok:#6cc890;--ok-soft:#1b3326;--bad:#ee8f7b;--bad-soft:#3a2320;--rule:#2b3f52;--shadow:0 10px 26px -14px rgba(0,0,0,.7);
 --f1:#ee8f7b;--f2:#eeb066;--f3:#e2cf6a;--f4:#8fcf76;--f5:#7fb2e0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a20;--card:#1d252d;--ink:#e9eef2;--mute:#9fb0bd;--line:#33414d;--accent:#7fb2e0;--accent-ink:#0f1a24;--soft:#23313d;--ok:#6cc890;--ok-soft:#1b3326;--bad:#ee8f7b;--bad-soft:#3a2320;--rule:#2b3f52;--shadow:0 10px 26px -14px rgba(0,0,0,.7);
 --f1:#ee8f7b;--f2:#eeb066;--f3:#e2cf6a;--f4:#8fcf76;--f5:#7fb2e0;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-family:Fraunces,Georgia,serif;font-size:30px;margin:0;line-height:1.1}
h2{font-family:Fraunces,Georgia,serif;font-size:22px;margin:0 0 10px}
.sub{color:var(--mute);font-size:14px}
button{font:inherit;cursor:pointer;border-radius:10px;border:2px solid transparent;padding:9px 15px;font-weight:700}
.b1{background:var(--accent);color:var(--accent-ink)}
.b2{background:transparent;color:var(--ink);border-color:var(--line)}
.bok{background:var(--ok);color:#fff}.bbad{background:var(--bad);color:#fff}
.small{padding:5px 10px;font-size:14px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.decks{display:grid;gap:12px}
.deck{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.deck .name{font-weight:700;font-size:18px}
.bars{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.bar{font-size:12px;border-radius:6px;padding:2px 7px;color:#fff;font-variant-numeric:tabular-nums}
.bar.f1{background:var(--f1)}.bar.f2{background:var(--f2)}.bar.f3{background:var(--f3);color:#222}.bar.f4{background:var(--f4)}.bar.f5{background:var(--f5)}
:root[data-theme="dark"] .bar,.dk .bar{color:#111}
.due{font-weight:700;color:var(--accent)}
label{font-weight:700;font-size:14px;display:block;margin:10px 0 4px}
input[type=text],textarea,select{width:100%;font:inherit;padding:9px 11px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.list{margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;padding:9px 0;border-top:1px solid var(--line);align-items:start}
.list li:first-child{border-top:0}
.fach{font-size:12px;color:var(--mute)}
/* Lernkarte */
.stage{perspective:1200px;margin:8px 0 14px}
.flash{position:relative;min-height:240px;border-radius:12px;cursor:pointer;transition:transform .45s;transform-style:preserve-3d}
.flash.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);
 padding:34px 22px 22px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;
 background-image:linear-gradient(var(--bad) 0 0),repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);background-size:100% 2px,100% 100%;background-position:0 26px,0 26px;background-repeat:no-repeat,repeat}
.face.back{transform:rotateY(180deg)}
.face .tag{position:absolute;top:6px;left:12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.face .txt{white-space:pre-wrap;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.flash{transition:none}}
.prog{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.center{text-align:center}
.note{font-size:14px;color:var(--mute)}
.msg{border-radius:10px;padding:9px 12px;margin-top:10px;font-size:15px}
.msg.ok{background:var(--ok-soft)}.msg.bad{background:var(--bad-soft)}
.confirm{background:var(--bad-soft);border-radius:10px;padding:10px 12px;margin-top:10px}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}
.boxes div{border-radius:10px;padding:8px 4px;text-align:center;border:2px solid var(--line);font-size:13px}
.boxes b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
@media (max-width:480px){.list li{grid-template-columns:1fr}.deck{grid-template-columns:1fr}.face{font-size:18px}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
var KEY='lernkartei_v1';
var INTERVAL=[0,0,2,7,14,30]; // Tage bis zur nächsten Wiederholung je Fach (Fach 1 = jeden Lerntag)
var FACHNAME=['','jeden Lerntag','alle 2–3 Tage','einmal pro Woche','alle 2 Wochen','vor der Klausur'];
var STARTER={name:'Beispiel: Lernen lernen (Methoden Modul 1)',cards:[
 ['Was wirkt beim Lernen stärker: Wiederlesen oder Abfragen?','Abfragen – jedes Abrufen macht die Erinnerung stärker.'],
 ['Wie viele Dinge kann das Arbeitsgedächtnis etwa gleichzeitig halten?','etwa vier'],
 ['Warum täuscht das gute Gefühl beim Wiederlesen?','Alles kommt bekannt vor, aber das Gehirn muss nichts tun.'],
 ['Was ist besser: 1 Stunde am Abend vorher oder 4 × 15 Minuten an verschiedenen Tagen?','4 × 15 Minuten verteilt'],
 ['Wohin kommt eine Karte, deren Antwort du nicht weißt?','zurück in Fach 1'],
 ['Nenne die vier Regeln für gute Lernkarten.','eine Frage pro Karte · vorne eine echte Frage · hinten kurze Antwort · in deinen Worten'],
 ['Wie lange darf die Probezeit in der Ausbildung dauern?','mindestens 1 Monat, höchstens 4 Monate'],
 ['Was verrät dir die Punktzahl einer Prüfungsaufgabe?','wie viele Dinge verlangt sind']]};
var mem=null, st, view={name:'home'};
function today(){var d=new Date();d.setHours(0,0,0,0);return Math.floor(d.getTime()/864e5);}
function uid(){return Math.random().toString(36).slice(2,10);}
function mkCard(f,b){return {id:uid(),f:f,b:b,fach:1,due:today()};}
function mkDeck(name,pairs){return {id:uid(),name:name,cards:(pairs||[]).map(function(p){return mkCard(p[0],p[1]);})};}
function load(){try{var s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){mem=st;}}
st=load()||{decks:[mkDeck(STARTER.name,STARTER.cards)]};
var saveOK=true;try{localStorage.setItem(KEY+'_t','1');localStorage.removeItem(KEY+'_t');}catch(e){saveOK=false;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function deck(id){for(var i=0;i<st.decks.length;i++)if(st.decks[i].id===id)return st.decks[i];return null;}
function dueCards(d){var t=today();return d.cards.filter(function(c){return c.due<=t;});}
function counts(d){var n=[0,0,0,0,0,0];d.cards.forEach(function(c){n[c.fach]++;});return n;}
function bars(d){var n=counts(d),h='';for(var i=1;i<=5;i++)h+='<span class="bar f'+i+'" title="Fach '+i+'">Fach '+i+': '+n[i]+'</span>';return h;}
var app=document.getElementById('app');
function go(v){view=v;render();window.scrollTo(0,0);}

function render(){
 if(view.name==='home')return home();
 if(view.name==='deck')return deckView();
 if(view.name==='learn')return learn();
 if(view.name==='share')return share();
}
function home(){
 var h='<header><div><h1>Meine Lernkartei</h1><div class="sub">Abfragen statt Wiederlesen · Verteilen statt Pauken</div></div><button class="b1" id="new">+ Neuer Stapel</button></header>';
 if(!saveOK)h+='<div class="msg bad">Dieser Browser speichert gerade nicht. Deine Karten sind weg, wenn du die Seite schließt. Öffne die Kartei in einem normalen (nicht privaten) Fenster.</div>';
 h+='<div id="newbox"></div><div class="decks">';
 if(!st.decks.length)h+='<div class="panel note">Noch keine Stapel. Lege oben einen neuen Stapel an.</div>';
 st.decks.forEach(function(d){var du=dueCards(d).length;
  h+='<div class="panel deck"><div><div class="name">'+esc(d.name)+'</div><div class="note">'+d.cards.length+' Karten · <span class="due">'+du+' heute fällig</span></div><div class="bars">'+bars(d)+'</div></div>'+
   '<div class="row"><button class="b1" data-learn="'+d.id+'"'+(d.cards.length?'':' disabled')+'>Lernen</button><button class="b2" data-open="'+d.id+'">Karten</button></div></div>';});
 h+='</div><div class="panel note"><b>So funktioniert die Lernkartei:</b> Neue Karten liegen in Fach 1. Weißt du die Antwort, wandert die Karte ein Fach weiter und kommt später wieder dran. Weißt du sie nicht, geht sie zurück in Fach 1. '+
    'Fach 1: '+FACHNAME[1]+' · Fach 2: '+FACHNAME[2]+' · Fach 3: '+FACHNAME[3]+' · Fach 4: '+FACHNAME[4]+' · Fach 5: '+FACHNAME[5]+'.<br><br>Deine Karten werden nur auf diesem Gerät in diesem Browser gespeichert. Mit „Teilen“ im Stapel kannst du sie als Text sichern oder an andere weitergeben.</div>';
 app.innerHTML=h;
 document.getElementById('new').onclick=function(){var b=document.getElementById('newbox');
  b.innerHTML='<div class="panel"><label for="nn">Name des Stapels</label><input type="text" id="nn" placeholder="z. B. LF 1 – Ausbildungsvertrag"><div class="row" style="margin-top:10px"><button class="b1" id="nok">Anlegen</button><button class="b2" id="nimp">Stapel aus Text einfügen</button><button class="b2" id="nx">Abbrechen</button></div></div>';
  var inp=document.getElementById('nn');inp.focus();
  function mk(){var n=inp.value.trim()||'Neuer Stapel';var d=mkDeck(n,[]);st.decks.unshift(d);save();go({name:'deck',id:d.id});}
  document.getElementById('nok').onclick=mk;inp.onkeydown=function(e){if(e.key==='Enter')mk();};
  document.getElementById('nimp').onclick=function(){var d=mkDeck(inp.value.trim()||'Importierter Stapel',[]);st.decks.unshift(d);save();go({name:'share',id:d.id,imp:true});};
  document.getElementById('nx').onclick=function(){b.innerHTML='';};};
 app.querySelectorAll('[data-learn]').forEach(function(b){b.onclick=function(){startLearn(b.dataset.learn,false);};});
 app.querySelectorAll('[data-open]').forEach(function(b){b.onclick=function(){go({name:'deck',id:b.dataset.open});};});
}
function deckView(){
 var d=deck(view.id);if(!d)return go({name:'home'});
 var h='<header><div><button class="b2 small" id="back">← Alle Stapel</button></div><div class="row"><button class="b2 small" id="share">Teilen / Einfügen</button><button class="b2 small" id="ren">Umbenennen</button><button class="b2 small" id="del">Stapel löschen</button></div></header>';
 h+='<h2>'+esc(d.name)+'</h2><div id="conf"></div>';
 h+='<div class="panel"><label for="ff">Vorderseite (Frage)</label><textarea id="ff" placeholder="Eine echte Frage, am besten mit Operator: Nenne …, Erkläre …"></textarea>'+
   '<label for="bb">Rückseite (kurze Antwort)</label><textarea id="bb" placeholder="So kurz, dass du sie auswendig sagen kannst"></textarea>'+
   '<div class="row" style="margin-top:10px"><button class="b1" id="add">Karte speichern</button><span class="note" id="addmsg"></span></div></div>';
 h+='<div class="panel"><div class="row" style="justify-content:space-between"><b>'+d.cards.length+' Karten</b><div class="row">'+(d.cards.length?'<button class="b1 small" id="lrn">Lernen</button><button class="b2 small" id="all">Alle üben</button><button class="b2 small" id="reset">Alle zurück in Fach 1</button>':'')+'</div></div><div class="bars">'+bars(d)+'</div><ul class="list" id="cl">';
 d.cards.forEach(function(c){h+='<li><div>'+esc(c.f)+'<div class="fach">Fach '+c.fach+'</div></div><div>'+esc(c.b)+'</div><div class="row"><button class="b2 small" data-ed="'+c.id+'">Ändern</button><button class="b2 small" data-rm="'+c.id+'" aria-label="Karte löschen">✕</button></div></li>';});
 h+='</ul></div>';
 app.innerHTML=h;
 var editing=null;
 document.getElementById('back').onclick=function(){go({name:'home'});};
 document.getElementById('share').onclick=function(){go({name:'share',id:d.id});};
 document.getElementById('ren').onclick=function(){var c=document.getElementById('conf');c.innerHTML='<div class="panel"><label for="rn">Neuer Name</label><input type="text" id="rn" value="'+esc(d.name)+'"><div class="row" style="margin-top:8px"><button class="b1" id="rok">Speichern</button></div></div>';
  document.getElementById('rok').onclick=function(){d.name=document.getElementById('rn').value.trim()||d.name;save();render();};};
 document.getElementById('del').onclick=function(){var c=document.getElementById('conf');c.innerHTML='<div class="confirm">Stapel „'+esc(d.name)+'“ mit allen '+d.cards.length+' Karten wirklich löschen? <div class="row" style="margin-top:8px"><button class="bbad" id="dok">Ja, löschen</button><button class="b2" id="dno">Nein</button></div></div>';
  document.getElementById('dok').onclick=function(){st.decks=st.decks.filter(function(x){return x.id!==d.id;});save();go({name:'home'});};
  document.getElementById('dno').onclick=function(){c.innerHTML='';};};
 var ff=document.getElementById('ff'),bb=document.getElementById('bb');
 document.getElementById('add').onclick=function(){var f=ff.value.trim(),b=bb.value.trim(),m=document.getElementById('addmsg');
  if(!f||!b){m.textContent='Bitte Vorder- und Rückseite ausfüllen.';return;}
  if(editing){editing.f=f;editing.b=b;editing=null;}else d.cards.push(mkCard(f,b));save();render();document.getElementById('addmsg').textContent='Gespeichert ✓';document.getElementById('ff').focus();};
 app.querySelectorAll('[data-ed]').forEach(function(b){b.onclick=function(){var c=d.cards.filter(function(x){return x.id===b.dataset.ed;})[0];editing=c;ff.value=c.f;bb.value=c.b;ff.focus();document.getElementById('add').textContent='Änderung speichern';};});
 app.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){d.cards=d.cards.filter(function(x){return x.id!==b.dataset.rm;});save();render();};});
 var l=document.getElementById('lrn');if(l){l.onclick=function(){startLearn(d.id,false);};document.getElementById('all').onclick=function(){startLearn(d.id,true);};
  document.getElementById('reset').onclick=function(){d.cards.forEach(function(c){c.fach=1;c.due=today();});save();render();};}
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startLearn(id,all){var d=deck(id);var q=all?d.cards.slice():dueCards(d);go({name:'learn',id:id,all:all,queue:shuffle(q.map(function(c){return c.id;})),total:q.length,right:0,wrong:0,flipped:false});}
function learn(){
 var d=deck(view.id);if(!d)return go({name:'home'});
 var h='<header><button class="b2 small" id="back">← '+esc(d.name)+'</button><span class="note">'+(view.all?'Alle Karten üben':'Heute fällige Karten')+'</span></header>';
 if(!view.queue.length){
  h+='<div class="panel center"><h2>'+(view.total?'Geschafft!':'Heute ist nichts fällig')+'</h2>';
  if(view.total)h+='<p>Gewusst: <b>'+view.right+'</b> · Noch nicht: <b>'+view.wrong+'</b></p>';
  else h+='<p class="note">Alle Karten ruhen gerade in ihren Fächern. Genau so soll es sein – verteiltes Lernen. Wenn du trotzdem üben willst:</p>';
  h+='<div class="boxes">';var n=counts(d);for(var i=1;i<=5;i++)h+='<div style="border-color:var(--f'+i+')"><b>'+n[i]+'</b>Fach '+i+'</div>';
  h+='</div><div class="row" style="justify-content:center"><button class="b1" id="again">Alle Karten üben</button><button class="b2" id="home">Zu den Stapeln</button></div></div>';
  app.innerHTML=h;document.getElementById('back').onclick=function(){go({name:'deck',id:d.id});};
  document.getElementById('again').onclick=function(){startLearn(d.id,true);};document.getElementById('home').onclick=function(){go({name:'home'});};return;}
 var c=d.cards.filter(function(x){return x.id===view.queue[0];})[0];if(!c){view.queue.shift();return learn();}
 var done=view.total-view.queue.length;
 h+='<div class="note">Karte '+(done+1)+' von '+view.total+' · liegt in Fach '+c.fach+'</div><div class="prog"><i style="width:'+Math.round(done/view.total*100)+'%"></i></div>';
 h+='<div class="stage"><div class="flash'+(view.flipped?' flipped':'')+'" id="flash" role="button" tabindex="0" aria-label="Karte umdrehen"><div class="face front"><span class="tag">Frage</span><div class="txt">'+esc(c.f)+'</div></div><div class="face back"><span class="tag">Antwort</span><div class="txt">'+esc(c.b)+'</div></div></div></div>';
 h+=view.flipped?'<div class="row" style="justify-content:center"><button class="bbad" id="no">✗ Wusste ich nicht</button><button class="bok" id="yes">✓ Gewusst</button></div><p class="note center">Sei ehrlich zu dir – nur so kommen die schweren Karten öfter dran.</p>'
   :'<div class="row" style="justify-content:center"><button class="b1" id="turn">Antwort zeigen</button></div><p class="note center">Erst im Kopf (oder laut) antworten, dann umdrehen.</p>';
 app.innerHTML=h;
 document.getElementById('back').onclick=function(){go({name:'deck',id:d.id});};
 function flip(){view.flipped=true;render();var y=document.getElementById('yes');if(y)y.focus();}
 var fl=document.getElementById('flash');fl.onclick=function(){if(!view.flipped)flip();};fl.onkeydown=function(e){if((e.key==='Enter'||e.key===' ')&&!view.flipped){e.preventDefault();flip();}};
 if(!view.flipped){document.getElementById('turn').onclick=flip;document.getElementById('turn').focus();}
 else{document.getElementById('yes').onclick=function(){answer(c,true);};document.getElementById('no').onclick=function(){answer(c,false);};}
}
function answer(c,ok){
 if(!view.all||true){ if(ok){c.fach=Math.min(5,c.fach+1);c.due=today()+INTERVAL[c.fach];view.right++;view.queue.shift();}
  else{c.fach=1;c.due=today();view.wrong++;var id=view.queue.shift();view.queue.push(id);view.total++;} }
 save();view.flipped=false;render();
}
function toText(d){return d.cards.map(function(c){return c.f.replace(/\n/g,' ')+' | '+c.b.replace(/\n/g,' ');}).join('\n');}
function share(){
 var d=deck(view.id);if(!d)return go({name:'home'});
 var h='<header><button class="b2 small" id="back">← '+esc(d.name)+'</button></header><h2>Teilen und Einfügen</h2>';
 h+='<div class="panel"><b>Karten als Text weitergeben</b><p class="note">Kopiere den Text und schicke ihn z. B. über itslearning. Jede Zeile ist eine Karte: <code>Frage | Antwort</code></p><textarea id="out" readonly rows="8">'+esc(toText(d))+'</textarea><div class="row" style="margin-top:8px"><button class="b1" id="copy">Text kopieren</button><span class="note" id="cmsg"></span></div></div>';
 h+='<div class="panel"><b>Karten aus Text einfügen</b><p class="note">Füge Zeilen im Format <code>Frage | Antwort</code> ein – zum Beispiel einen Stapel, den deine Lehrkraft auf itslearning gestellt hat. Die Karten kommen zusätzlich in diesen Stapel.</p><textarea id="inp" rows="8" placeholder="Wie lange dauert die Probezeit? | 1 bis 4 Monate"></textarea><div class="row" style="margin-top:8px"><button class="b1" id="imp">Einfügen</button><span class="note" id="imsg"></span></div></div>';
 app.innerHTML=h;
 document.getElementById('back').onclick=function(){go({name:'deck',id:d.id});};
 document.getElementById('copy').onclick=function(){var t=document.getElementById('out'),m=document.getElementById('cmsg');
  function fb(){t.focus();t.select();m.textContent='Text ist markiert – jetzt mit Strg+C / Kopieren kopieren.';}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(function(){m.textContent='Kopiert ✓';},fb);}else fb();};
 document.getElementById('imp').onclick=function(){var lines=document.getElementById('inp').value.split(/\r?\n/),n=0,bad=0;
  lines.forEach(function(l){if(!l.trim())return;var i=l.indexOf('|');if(i<0){i=l.indexOf('\t');}if(i<0){bad++;return;}var f=l.slice(0,i).trim(),b=l.slice(i+1).trim();if(f&&b){d.cards.push(mkCard(f,b));n++;}else bad++;});
  save();var m=document.getElementById('imsg');m.textContent=n+' Karten eingefügt'+(bad?', '+bad+' Zeilen ohne „|“ übersprungen':'')+'.';document.getElementById('out').value=toText(d);document.getElementById('inp').value='';};
 if(view.imp)document.getElementById('inp').focus();
}
render();
})();
