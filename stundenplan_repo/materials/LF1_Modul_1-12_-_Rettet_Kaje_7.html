/* Layout: eine Spalte wie ein Logbuch am Hafen – Szene oben, HUD als Schiffsanzeige, darunter die Karte der Woche */
:root{

  --navy:#173B57; --on-navy:#FFFFFF; --signal:#C8372D; --brass:#C98E17; --sea:#1B7A82;
  --ok:#2C8049; --okbg:#E0F0E5; --mid:#9A6510; --midbg:#FAEFD6; --bad:#B8322A; --badbg:#F7E1DE;
  --shadow:0 1px 2px rgba(19,34,45,.06),0 8px 22px rgba(19,34,45,.09);
  --f-disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D161D; --surface:#15222C; --surface2:#1B2B37; --ink:#E3EBF0; --ink2:#9DB1C0; --line:#2A3C4A;
  --navy:#86B9DE; --on-navy:#0D161D; --signal:#F07A6F; --brass:#E8B84A; --sea:#53BFC6;
  --ok:#62C987; --okbg:#173224; --mid:#E8B84A; --midbg:#382D12; --bad:#F07A6F; --badbg:#3B1C19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D161D; --surface:#15222C; --surface2:#1B2B37; --ink:#E3EBF0; --ink2:#9DB1C0; --line:#2A3C4A;
  --navy:#86B9DE; --on-navy:#0D161D; --signal:#F07A6F; --brass:#E8B84A; --sea:#53BFC6;
  --ok:#62C987; --okbg:#173224; --mid:#E8B84A; --midbg:#382D12; --bad:#F07A6F; --badbg:#3B1C19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;margin:0}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-disp);font-weight:800;letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(44px,12vw,72px)} h2{font-size:30px} h3{font-size:22px}
p{margin:0}
.lbl{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.quiet{background:var(--surface2);border-radius:var(--r);padding:14px 16px}
.muted{color:var(--ink2)}
.small{font-size:15px}
button{font:inherit;color:inherit}
.btn{appearance:none;border:0;border-radius:10px;background:var(--navy);color:var(--on-navy);font-weight:700;font-size:18px;padding:14px 20px;min-height:52px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn.signal{background:var(--signal);color:#fff}
.btn.wide{width:100%}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
input[type=text]{font:inherit;font-size:18px;width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--navy)}
/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy)}
.hud-in{max-width:660px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:800;font-size:22px;letter-spacing:.04em;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (max-width:480px){.hud-in{gap:6px 10px}.brand{order:0;flex:1 1 55%;max-width:none;font-size:20px}.iconbtn{order:1}.iconbtn .t{display:none}.hud .stat{order:2;flex:1 1 28%;flex-direction:row;align-items:baseline;gap:5px}.hud .sp{display:none}.trust{order:3}}
.hud .stat{display:flex;flex-direction:column;line-height:1.1;font-variant-numeric:tabular-nums}
.hud .stat b{font-size:17px}
.hud .stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hud .sp{flex:1}
.iconbtn{background:transparent;border:1.5px solid currentColor;border-radius:9px;color:inherit;min-width:44px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;cursor:pointer;font-size:14px;font-weight:700}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-pressed="true"]{background:var(--on-navy);color:var(--navy)}
.trust{width:100%;height:6px;background:rgba(255,255,255,.22);border-radius:3px;overflow:hidden}
.trust i{display:block;height:100%;background:var(--brass);width:0;transition:width .6s}
/* Szene */
.scene{margin-top:14px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#9CC6DB}
.scene svg{display:block;width:100%;height:auto}
.fade{transition:opacity .6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes gull{0%{transform:translateX(-40px)}100%{transform:translateX(440px)}}
.gull{animation:gull 18s linear infinite}
.boat{animation:bob 3s ease-in-out infinite}
@keyframes walk{0%{transform:translateX(-30px);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--to,230px));opacity:0}}
.walker{animation:walk 3.2s linear infinite}
@media (prefers-reduced-motion:reduce){.gull,.boat,.walker{animation:none}.trust i{transition:none}}
/* Optionen */
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;min-height:64px}
.opt .tag{flex:none;width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-family:var(--f-disp);font-size:20px}
.opt .body{flex:1;min-width:0}
.opt .cost{flex:none;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:15px;white-space:nowrap}
.opt[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.opt[aria-pressed="true"] .tag{background:var(--navy);color:var(--on-navy)}
.opt:disabled{opacity:.42;cursor:not-allowed}
.opt.locked{cursor:default}
.opt.r-ok{border-color:var(--ok);background:var(--okbg)}
.opt.r-mid{border-color:var(--mid);background:var(--midbg)}
.opt.r-bad{border-color:var(--bad);background:var(--badbg)}
.why{font-size:15px;margin-top:6px}
/* Personen */
.persona{display:flex;gap:14px;align-items:center}
.persona svg{flex:none;width:76px;height:76px}
.bubble{position:relative;background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:17px;min-width:0}
.bubble:before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-left:0;border-right-color:var(--surface2)}
.term{border-left:6px solid var(--brass);background:var(--surface);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;box-shadow:var(--shadow)}
.term h3{color:var(--navy)}
.ihk{border:1.5px dashed var(--ink2);border-radius:10px;padding:10px 12px;font-size:15px}
.ihk b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
/* Auswahlkarten */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:120px;justify-content:center}
.tile svg{width:54px;height:54px}
.tile b{font-size:16px}
.tile small{font-size:13px;color:var(--ink2)}
.tile[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
@media (max-width:420px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tile{padding:10px 4px}.tile b{font-size:14px}}
/* Kartenziehen */
.flip{perspective:900px;max-width:340px;margin:0 auto;width:100%}
.flip-in{position:relative;transition:transform .8s;transform-style:preserve-3d;min-height:300px}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.face.back{background:var(--navy);color:var(--on-navy)}
.face.front{background:var(--surface);border:2px solid var(--line);transform:rotateY(180deg)}
.face.front svg{width:110px;height:110px}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}}
/* Minispiele */
.chip{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;min-height:48px;font-size:16px;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--navy);background:var(--surface2)}
.chip:disabled{opacity:.35}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cats.five{grid-template-columns:repeat(2,minmax(0,1fr))}
.slot{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:10px;padding:8px 10px;min-height:50px;background:var(--surface)}
.slot .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:15px}
.slot .s{font-size:13px;color:var(--ink2);display:block}
.slot.filled{border-style:solid;border-color:var(--navy)}
.slot.ok{border-color:var(--ok);background:var(--okbg)} .slot.no{border-color:var(--bad);background:var(--badbg)}
.pyr .slot{margin-inline:auto}
.timer{font-family:var(--f-disp);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--signal)}
.fb{border-radius:10px;padding:10px 12px;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--ink)} .fb.no{background:var(--badbg);color:var(--ink)}
/* Tabelle */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
/* Auswertung */
.scorecard{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px}
.stars{display:flex;gap:6px}
.stars svg{width:40px;height:40px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-variant-numeric:tabular-nums}
.kpi b{display:block;font-size:24px;font-family:var(--f-disp)}
.kpi span{font-size:12px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.bar{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea)}
.res{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.mark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:800;flex:none}
.mark.ok{background:var(--okbg);color:var(--ok)} .mark.mid{background:var(--midbg);color:var(--mid)} .mark.no{background:var(--badbg);color:var(--bad)}
.better{font-size:15px;background:var(--surface2);border-radius:8px;padding:8px 10px}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(10,20,28,.55);display:flex;align-items:flex-end;justify-content:center}
.drawer .sheet{background:var(--surface);color:var(--ink);width:100%;max-width:660px;border-radius:16px 16px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.words{display:flex;flex-wrap:wrap;gap:8px}
.words span{background:var(--surface2);border-radius:20px;padding:6px 12px;font-size:16px}
.event{border:2px solid var(--signal);border-radius:12px;background:var(--surface);padding:16px}
.event .lbl{color:var(--signal)}
.count{font-family:var(--f-disp);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.hint{font-size:14px;color:var(--ink2)}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--sea)} .progress i.now{background:var(--brass)}
</style>

     fit:{mia:2,fam:3,pet:3,lin:1},res:'Die Leute bleiben stehen. Das brauchen sie wirklich.',
     why:'Existenzbedürfnisse müssen befriedigt werden. Dafür haben die Leute auch Bedarf – also Geld. Daraus wird Nachfrage.'},

     fit:{mia:2,fam:2,pet:2,lin:2},res:'Die Regale stehen. Und ihr habt Geld gespart.',term:'Minimalprinzip',
     why:'Das Ziel steht fest (40 Meter). Die Mittel sollen möglichst gering sein. Das ist das Minimalprinzip.'},

     fit:{mia:2,fam:3,pet:2,lin:2},res:'Viel Platz für Ware. Aber die Kasse ist leerer.',term:'Maximalprinzip',
     why:'Die Mittel stehen fest (1 600 €). Der Nutzen soll möglichst groß sein. Das ist das Maximalprinzip.'},
    {t:'Ihr wollt mit möglichst wenig Geld möglichst viele Regale kaufen.',cost:0,q:0,st:'N',
     fit:{mia:0,fam:0,pet:0,lin:0},res:'Kein Händler kann das anbieten. Eine Woche vergeht. Die Ware liegt weiter in Kartons.',term:'unsinnige Formulierung',
     why:'Hier steht gar nichts fest. Mit 0 € bekommt man nichts. Diese Formulierung widerspricht dem ökonomischen Prinzip.'}

  term:{n:'Das ökonomische Prinzip', d:'Maximalprinzip: Die Mittel stehen fest, der Nutzen soll möglichst groß sein. Minimalprinzip: Das Ziel steht fest, die Mittel sollen möglichst gering sein.'},
  ihk:'Die Maxikauf GmbH bestellt 200 Stehleuchten beim preisgünstigsten Anbieter, den sie durch Angebotsvergleich ermittelt. → Minimalprinzip',
  words:['die Knappheit','die Mittel','der Nutzen','das Ziel','das ökonomische Prinzip','das Maximalprinzip','das Minimalprinzip','möglichst','gegeben'],
  pro:{q:'In welchem Fall handelt euer Laden nach dem Minimalprinzip?',
    o:['Mit zwei zusätzlichen Aushilfen wollt ihr einen möglichst hohen Umsatz erzielen.','Eine Werbeaktion soll 10 000 € Umsatz bringen – mit möglichst niedrigen Kosten.','Mit 500 € Werbegeld wollt ihr möglichst viele Kunden erreichen.','Ihr schöpft euer Einkaufsgeld voll aus und kauft nur die beste Qualität.'],a:1,

const BASE = {};
for (const id in CH){ BASE[id] = Object.assign({}, CH[id]); }
function pickFresh(key, n){
  const seen = store.get('kaje7_seen') || {};
  let list = (seen[key] || []).filter(x => x < n);
  let pool = []; for (let i=0;i<n;i++) if (!list.includes(i)) pool.push(i);
  if (!pool.length){ const last = list[list.length-1]; list = []; pool = []; for (let i=0;i<n;i++) if (i!==last || n===1) pool.push(i); }
  const v = pool[Math.floor(Math.random()*pool.length)];
  list.push(v); seen[key] = list; store.set('kaje7_seen', seen); return v;
}
function chooseVariants(){
  S.var = S.var || {}; S.pv = S.pv || {};
  for (const id of chapters()){
    const nv = 1 + ((BASE[id].alt||[]).length);
    if (S.var[id] === undefined) S.var[id] = pickFresh('v_'+id, nv);
    const np = (BASE[id].pros||[BASE[id].pro]).length;
    if (S.pv[id] === undefined) S.pv[id] = pickFresh('p_'+id, np);
  }
  if (S.kv === undefined) S.kv = pickFresh('k_'+S.branch, KETTE_ALL[S.branch].length);
  if (S.pk === undefined) S.pk = pickFresh('y_'+S.branch, PYR_ALL[S.branch].length);
}
function applyVariants(){
  if (!S || !S.branch) return;
  for (const id in BASE){
    const b = BASE[id], v = (S.var && S.var[id]) || 0;
    const alt = v>0 && b.alt ? b.alt[v-1] : {};
    CH[id] = Object.assign({}, b, alt);
    if (id==='m5'){ if (!alt.opts) CH[id].opts = marktOpts(); if (!('extra' in alt)) CH[id].extra = 'markt'; if (!alt.story) CH[id].story = b.story; }
    const pros = b.pros || [b.pro]; CH[id].pro = pros[(S.pv && S.pv[id]) || 0] || pros[0];
  }
  MK = CH.m5.mk || 'fest';
  KETTE[S.branch] = KETTE_ALL[S.branch][S.kv || 0];
  PYR[S.branch] = PYR_ALL[S.branch][S.pk || 0];
}
function has(t){ return chapters().some(id => S.ch[id]!==undefined && CH[id].opts && (CH[id].opts[S.ch[id]].tg||[]).includes(t)); }

const RECH_IDS = ['m4','m5','m11','m12'];
const rnd = a => a[Math.floor(Math.random()*a.length)];
const fmt = (v,d=2) => v.toLocaleString('de-DE',{minimumFractionDigits:d, maximumFractionDigits:d});
function rechGen(id){
  if (id==='m4'){
    for (let k=0;k<20;k++){
      const m = rnd([30,40,50]), pa = rnd([18,20,22,24]), pb = Math.round(m*pa*rnd([0.9,0.95,1.05])/10)*10, pc = rnd([16,17,18,19]), L = rnd([60,90,120]);
      const A = m*pa, B = pb, C = m*pc+L, mn = Math.min(A,B,C);
      if ([A,B,C].filter(x=>x===mn).length===1) return {q:`Ihr braucht ${m} Meter Regal und vergleicht drei Angebote (Minimalprinzip): A: ${pa} € je Meter. B: ${eur(pb)} pauschal. C: ${pc} € je Meter plus ${L} € Lieferung. Wie viel kostet das günstigste Angebot?`, ans:mn, unit:'€', steps:`A: ${m} · ${pa} € = ${eur(A)} · B: ${eur(B)} · C: ${m} · ${pc} € + ${L} € = ${eur(C)} → günstigstes Angebot: ${eur(mn)}`};
    }
  }
  if (id==='m5'){
    const t = MARKTS[MK==='imbiss'?'imbiss':'fest'], b = t.b[S.branch];
    const tbl = b.p.map((p,i)=>`${fmt(p)} €: Nachfrage ${t.N[i]}, Angebot ${t.A[i]}`).join(' · ');
    if (Math.random()<0.5) return {q:`Markt für ${b.ware}: ${tbl}. Wie groß ist der Nachfrageüberschuss bei ${fmt(b.p[0])} €? (in ${b.unit})`, ans:t.N[0]-t.A[0], unit:b.unit, steps:`Nachfrage ${t.N[0]} − Angebot ${t.A[0]} = ${t.N[0]-t.A[0]} ${b.unit} Nachfrageüberschuss`};
    return {q:`Markt für ${b.ware}: ${tbl}. Wie viel Umsatz machen alle Händler zusammen beim Gleichgewichtspreis?`, ans:b.p[2]*t.N[2], unit:'€', steps:`Gleichgewichtspreis ${fmt(b.p[2])} €, Menge ${t.N[2]} → ${fmt(b.p[2])} € · ${t.N[2]} = ${eur(b.p[2]*t.N[2])}`};
  }
  if (id==='m11'){
    if (Math.random()<0.6){ const K = rnd([40000,50000,60000,80000,100000]), r = rnd([4,5,6,7.5,8,10,12.5]), G = K*r/100;
      return {q:`Euer Laden hat ${eur(K)} Kapital eingesetzt und ${eur(G)} Gewinn gemacht. Wie hoch ist die Rentabilität in %?`, ans:r, unit:'%', steps:`Rentabilität = Gewinn · 100 : Kapital = ${eur(G)} · 100 : ${eur(K)} = ${fmt(r,1).replace(',0','')} %`}; }
    const Ko = rnd([100000,120000,150000,200000]), f = rnd([1.1,1.2,1.25,0.9]), L = Math.round(Ko*f);
    return {q:`Leistungen ${eur(L)}, Kosten ${eur(Ko)}. Berechnet die Wirtschaftlichkeit (Leistungen : Kosten).`, ans:f, unit:'', steps:`${eur(L)} : ${eur(Ko)} = ${fmt(f)} → ${f>1?'größer als 1: der Laden arbeitet wirtschaftlich':'kleiner als 1: der Laden arbeitet nicht wirtschaftlich'}`};
  }
  if (id==='m12'){
    const AB = rnd([100,150,200]), E = Math.round((800+Math.random()*800)*100)/100, A = rnd([12,35,48.5]), soll = Math.round((AB+E-A)*100)/100;
    return {q:`Kassenabschluss nach Arbeitsanweisung: Anfangsbestand ${eur(AB)}, Bareinnahmen ${fmt(E)} €, Auszahlung für Porto ${fmt(A)} €. Wie viel Geld muss in der Kasse sein?`, ans:soll, unit:'€', steps:`${fmt(AB)} € + ${fmt(E)} € − ${fmt(A)} € = ${fmt(soll)} €`};
  }
  return null;
}

  const seen = store.get('kaje7_krseen') || [];
  let fresh2 = pool.filter(k=>!seen.includes(k.id)); if (!fresh2.length){ fresh2 = pool; store.set('kaje7_krseen', []); }

}

function varObj(id, v){
  const b = BASE[id], alt = v>0 && b.alt ? b.alt[v-1] : {};

  if (id==='m5'){ if (!alt.opts) o.opts = marktOpts(); o.extra = ('extra' in alt) ? alt.extra : 'markt'; o.mk = alt.mk || 'fest'; }

}
function retryList(){
  const wrong = chapters().filter(id => CH[id].type==='dec' && S.ch[id]!==undefined && optQ(id,S.ch[id])<2);

}
function vRetry(){

         : `<button class="btn wide" data-act="rLock" ${ui.rSel==null?'disabled':''}>Antwort festlegen</button>`}</div>`;

// ---------- Zusatzwerte für die Berechnung ----------
function calcExtra(){
  let got=0, max=0, tr=0, k=0;
  for (const id in (S.satz||{})){ max += 4; got += 2*S.satz[id].ok; }
  for (const b of (S.boss||[])){ if (!b) continue; max += 2; if (b.ok) got += 2; }
  for (const id in (S.rech||{})){ max += 3; if (S.rech[id].ok) got += 3; }
  for (const x of (S.kroll||[])){ tr += x.tr; k += x.k; }
  for (const c of (S.cp||[])){ if (c.ok) tr += 6; }
  for (const r of (S.retry||[])){ if (r && r.q===2) tr += 2; }
  for (const e of (S.extras||[])){ tr += EX(e).t; k += EX(e).k; }
  return {got, max, tr, k};
}

const music = {
  ctx:null, master:null, want:false, active:false, intensity:0, timer:null, step:0, next:0,
  ensure(){ if (!this.ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return false; this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value = 0.3; this.master.connect(this.ctx.destination);} return true; },
  setWant(v){ this.want = v; store.set('kaje7_music', v); this.update(); },
  phase(on, inten){ this.active = on; if (inten!==undefined) this.intensity = inten; this.update(); },
  update(){ const play = this.want && this.active && !document.hidden; if (play) this.start(); else this.stop(); },
  start(){ if (this.timer || !this.ensure()) return; if (this.ctx.state==='suspended') this.ctx.resume(); this.next = this.ctx.currentTime + 0.05; this.step = 0; this.timer = setInterval(()=>this.tick(), 50); },
  stop(){ if (this.timer){ clearInterval(this.timer); this.timer = null; } },
  tick(){ const ctx = this.ctx; const bpm = 116 + this.intensity*28; const st = 60/bpm/4;
    while (this.next < ctx.currentTime + 0.15){ this.note(this.step, this.next); this.next += st; this.step = (this.step+1) % 64; } },
  osc(type, f, t, dur, vol, filt){ const ctx=this.ctx, o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    if (filt){ const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=filt; o.connect(lp); lp.connect(g);} else o.connect(g);
    g.connect(this.master); o.start(t); o.stop(t+dur+0.02); return o; },
  note(s, t){ const ctx=this.ctx; const m = n => 440*Math.pow(2,(n-69)/12);
    const bar = Math.floor(s/16), q = s%16; const roots=[45,45,48,43];
    if (q%4===0){ const o=this.osc('sine',120,t,0.25,0.9); o.frequency.exponentialRampToValueAtTime(45,t+0.18); }
    if (q%2===1){ const len=0.04, buf=ctx.createBuffer(1,ctx.sampleRate*len,ctx.sampleRate), d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      const src=ctx.createBufferSource(); src.buffer=buf; const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000; const g=ctx.createGain(); g.gain.value=0.12; src.connect(hp); hp.connect(g); g.connect(this.master); src.start(t); }
    if (q%2===0) this.osc('sawtooth', m(roots[bar]+(q%8===6?7:0)), t, 0.16, 0.18, 600+this.intensity*500);
    if (this.intensity>0.4 && q%2===0){ const arp=[0,3,7,12,7,3,0,7]; this.osc('square', m(roots[bar]+24+arp[(q/2)%8]), t, 0.09, 0.035, 2400); } },
  fanfare(){ if (!this.want || !this.ensure()) return; if (this.ctx.state==='suspended') this.ctx.resume(); const t=this.ctx.currentTime+0.05; [72,76,79,84].forEach((n,i)=>this.osc('triangle',440*Math.pow(2,(n-69)/12),t+i*0.14,i===3?0.8:0.2,0.25)); }
};

// ---------- Berechnung ----------
function fitOf(id, i, pid){ const o = CH[id].opts[i]; let f = o.fit[pid]; if (S.conf[id]) f = Math.max(0, f-1); return f; }
function calc(){
  if (!S || !S.persona) return {trust:50, fach:0, fachMax:0, zufr:0, kunden:0, cash:S?S.cash:0};
  let got=0, max=0, fsum=0, fn=0;
  const per = {mia:[0,0],fam:[0,0],pet:[0,0],lin:[0,0]};
  for (const id of chapters()){
    const c = CH[id];
    if (c.type==='dec' && S.ch[id]!==undefined){ got += optQ(id,S.ch[id])*5; max += 10; fsum += fitOf(id,S.ch[id],S.persona); fn++;
      for (const p in per){ per[p][0]+=fitOf(id,S.ch[id],p); per[p][1]++; } }
    const mi = S.mini[id]; if (mi && mi.done){ got += 10*mi.got/mi.max; max += 10; }
    if (S.pro[id]){ max += 5; if (S.pro[id].ok) got += 5; }
  }
  const ex = calcExtra(); got += ex.got; max += ex.max;
  const fach = max ? got/max : 0.5, zufr = fn ? fsum/(fn*3) : 0.5;
  let ev = 0, evK = 0; for (const e of S.events){ ev += e.r.t; evK += e.r.k; }
  const cashPart = S.cash < 0 ? 0 : Math.min(1, S.cash/(S.start*0.25));
  let trust = Math.round(100*(0.5*fach + 0.35*zufr + 0.15*cashPart)) + ev + ex.tr;
  trust = Math.max(0, Math.min(100, trust));
  const kunden = Math.max(0, Math.round(80 + 120*zufr + evK + ex.k));
  const perc = {}; for (const p in per) perc[p] = per[p][1] ? per[p][0]/(per[p][1]*3) : 0;
  return {trust, fach, got:Math.round(got), fachMax:max, zufr, kunden, cash:S.cash, per:perc};
}
function hud(){
  const on = S && S.persona && S.phase!=='intro';
  $('#hud').hidden = !on; if (!on) return;
  const sc = calc();
  $('#hudShop').textContent = shopName().toUpperCase();
  $('#hudWeek').textContent = S.phase==='result'||S.phase==='finale' ? 'Ende' : `${S.idx+1}/${chapters().length}`;
  $('#hudCash').textContent = eur(S.cash);
  $('#hudTrust').textContent = sc.trust+' %';
  $('#hudTrustBar').style.width = sc.trust+'%';
}

function vDecide(id, c){
  const locked = ui.step==='react';
  const opts = (ui.order||[0,1,2]).map((i,k)=>{

function miniFinished(){ const m=ui.mi; if (!m) return true; if (ui.mk==='strom'||ui.mk==='abt') return m.i>=m.items.length; if (ui.mk==='kette') return m.checked && (S.mode!=='pro'||m.secChecked); return m.checked; }

function modStatus(id){
  const c = CH[id]; let lvl = 2;
  if (c.type==='dec' && S.ch[id]!==undefined) lvl = optQ(id,S.ch[id]);
  const mi = S.mini[id]; if (mi && mi.done){ const r = mi.got/mi.max; const l = r>=0.8?2:r>=0.5?1:0; lvl = c.type==='dec' ? Math.min(lvl,l) : l; }
  if (S.pro[id] && !S.pro[id].ok && lvl===2) lvl = 1;
  return lvl;
}
function betterFor(id){
  const c = CH[id], ch = S.ch[id], p = S.persona;
  const sc = i => optQ(id,i)*2 + (i===ch ? fitOf(id,i,p) : c.opts[i].fit[p]);
  let best = null, bs = sc(ch);
  c.opts.forEach((o,i)=>{ if (i===ch || optQ(id,i)<1) return; if (o.cost > S.start) return; const s = sc(i); if (s>bs){ bs=s; best=i; } });
  return best;
}

   ${S.events.length?`<div class="card stack"><h3>Zufallsereignis</h3>${S.events.map(e=>`<p><b>${esc(EVENTS.find(x=>x.id===e.id).title)}:</b> ${esc(e.r.txt)}</p>`).join('')}</div>`:''}
   <div class="card stack"><h3>Jede Entscheidung erklärt</h3>${det}</div>
   <div class="card stack" style="border:2px solid var(--brass)"><h3>Prüfungskasten</h3>
     ${weak.length ? `<p>Diese Sätze solltet ihr noch üben:</p>${weak.slice(0,4).map(id=>`<p class="small">• <b>Modul ${CH[id].mod}:</b> ${esc(CH[id].ihk)}</p>`).join('')}` : `<p>Alles sicher. Lernt trotzdem die Sätze in „So steht es in der Prüfung“ auswendig – so klingen die IHK-Aufgaben.</p>`}</div>
   <div class="card stack"><span class="lbl">Für Profis</span><p><b>${esc(fq.q)}</b></p>
     <details class="quiet"><summary style="cursor:pointer;font-weight:700">Musterantwort zeigen</summary><p class="small" style="margin-top:8px">${esc(fq.a)}</p></details></div>
   <div class="stack" style="gap:10px">
     <button class="btn wide" data-act="againNew">Neue Zielgruppe ziehen</button>
     <button class="btn ghost wide" data-act="againSame">Gleiche Zielgruppe – besser machen</button>
     <button class="btn ghost wide" data-act="againBranch">Andere Branche oder anderer Modus</button>
   </div></div>`;
}

// ---------- Ablauf ----------
function enterChapter(){
  const id = curId(), c = CH[id];
  clearInterval(ui.tm); ui = {step:'story', sel:null, order:[0,1,2], termShown:false, proSel:null};
  music.phase(false);
  S.phase='chapter'; save(); render();
}
function afterChapterRender(){

}
function nextAfter(id){
  const c = CH[id];
  if (S.mode==='pro' && !S.pro[id]){ ui.step='pro'; ui.proSel=null; ui.proOrder=null; music.phase(false); render(); window.scrollTo(0,0); return; }
  if (needsRech(id)){ ui.step='rech'; ui.rech=null; render(); window.scrollTo(0,0); return; }
  nextChapter();
}
function newFin(){ return {stage:'boss', boss:pickBoss(), bi:0, step:0, ev:pickEvents(), retry:[], ri:0, counted:false}; }
function startFinale(){
  S.phase='finale'; S.cashPre = S.cash; S.boss=[]; S.retry=[]; S.events=[];
  clearInterval(ui.tm); ui = {fin:newFin()}; bossTimer(); save(); render(); window.scrollTo(0,0);
}
function nextChapter(){
  awardCard(curId());
  const q = [], more = S.idx+1 < chapters().length;
  if (more && (CP_AT[S.block]||[]).includes(S.idx)) q.push({type:'cp', at:S.idx, rq:rescueQuestion()});
  if (more && (KROLL_AT[S.block]||[]).includes(S.idx)){ const k = pickKroll(); if (k) q.push({type:'kroll', id:k}); }
  S.idx++;
  if (S.idx >= chapters().length){ S.idx = chapters().length-1; startFinale(); return; }
  if (q.length){ S.phase='inter'; clearInterval(ui.tm); ui = {inter:{queue:q, i:0}}; music.phase(false); save(); render(); window.scrollTo(0,0); return; }
  enterChapter(); window.scrollTo(0,0);
}
function newGame(keep){
  const old = S;
  S = fresh();
  if (keep){ S.team=old.team; S.shop=old.shop; S.branch=old.branch; S.mode=old.mode; S.block=old.block; S.round=(old.round||0)+1; }
  return S;
}
function startRun(){
  S.start = START_CASH[S.mode][S.block]; S.cash = S.start; S.idx = 0; S.ch={}; S.conf={}; S.mini={}; S.pro={}; S.profile=null; S.events=[]; S.flags={}; S.done=false;
  S.var={}; S.pv={}; delete S.kv; delete S.pk; chooseVariants(); applyVariants();
  S.satz={}; S.rech={}; S.kroll=[]; S.cp=[]; S.extras=[]; S.cards=[]; S.boss=[]; S.retry=[]; S.newCard=null;
  enterChapter();
}

app.addEventListener('input', e=>{
  if (e.target.id==='inTeam'){ S.team = e.target.value; const b = app.querySelector('[data-act="toDraw"]'); if (b) b.disabled = !(S.team.trim() && S.branch); }
  if (e.target.id==='inShop'){ S.shop = e.target.value; drawScene(); }
});
app.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act; if (!a) return;
  const id = S.phase==='chapter' ? curId() : null;
  switch(a){
    case 'new': S = fresh(); S.phase='setup'; render(); break;
    case 'resume': { const sv = store.get('kaje7_save'); if (sv){ S = sv; chooseVariants(); applyVariants(); ['satz','rech'].forEach(k=>{ if (!S[k]) S[k]={}; }); ['kroll','cp','extras','cards','boss','retry'].forEach(k=>{ if (!S[k]) S[k]=[]; });
      if (S.phase==='chapter' || S.phase==='inter') enterChapter(); else if (S.phase==='finale'){ if (S.cashPre!==undefined) S.cash = S.cashPre; startFinale(); } else render(); } break; }
    case 'branch': case 'mode': case 'block': S[a] = b.dataset.v; render(); break;
    case 'toDraw': S.phase='draw'; S.persona=null; render(); break;
    case 'draw': { const ps = Object.keys(PERSONAS).filter(p=>p!==S.lastPersona); S.persona = ps[Math.floor(Math.random()*ps.length)]; render(); break; }
    case 'startGame': startRun(); break;
    case 'goDecide': S.newCard=null; ui.step='decide'; ui.order = shuffle([0,1,2]); render(); break;
    case 'goMini': S.newCard=null; startMini(CH[id].mini); render(); break;
    case 'pick': ui.sel = +b.dataset.i; render(); break;
    case 'lock': {
      const c = CH[id], i = ui.sel, o = c.opts[i];
      S.ch[id] = i; S.cash -= o.cost;
      if (c.setsProfile && !S.profile) S.profile = o.st;
      else if (S.profile && S.profile!=='N' && o.st!=='N' && o.st!==S.profile) S.conf[id] = true;
      ui.step='react'; save(); render(); break; }
    case 'afterDecide': if (CH[id].after){ startMini(CH[id].after); render(); window.scrollTo(0,0); } else nextAfter(id); break;
    case 'afterMini': nextAfter(id); break;
    case 'proPick': ui.proSel = +b.dataset.i; render(); break;
    case 'proLock': { const p = CH[id].pro; S.pro[id] = {pick:ui.proSel, ok:ui.proSel===p.a}; save(); render(); break; }
    case 'nextCh': nextChapter(); break;
    case 'mAns': {
      const m = ui.mi, it = m.items[m.i]; let ok;
      if (ui.mk==='strom'){ if (S.mode==='pro'){ const [k,d] = b.dataset.v.split('|'); ok = k===it.k && d===it.d; } else ok = b.dataset.v===it.k; }
      else ok = +b.dataset.v===it.c;
      const w = ui.mk==='strom' ? it.w : `Das gehört zu: ${ABT_CATS[it.c]}.`;
      m.fb = {ok, w}; m.log.push({t:it.t, ok, w}); render(); break; }
    case 'mNext': ui.mi.i++; ui.mi.fb=null; render(); break;
    case 'slot': { const m=ui.mi; const n=(ui.mk==='kette'?KETTE[S.branch]:PYR[S.branch]).length; for(let j=0;j<n;j++){ if (m.slots[j]===undefined){ m.slots[j]=+b.dataset.k; break; } } render(); break; }
    case 'unslot': { const m=ui.mi; m.slots[+b.dataset.j]=undefined; render(); break; }
    case 'checkOrder': checkOrder(); if (!(ui.mk==='kette' && S.mode==='pro')) clearInterval(ui.tm); render(); break;
    case 'sec': ui.mi.sec[+b.dataset.j] = +b.dataset.s; render(); break;
    case 'checkSec': checkSec(); clearInterval(ui.tm); render(); break;
    case 'evRun': { const e = EVENTS.find(x=>x.id===ui.fin.ev[ui.fin.step]); const r = e.eval(S); S.events.push({id:e.id, r}); S.cash += r.c; if (e.id==='schiff') S.flags.schiff = true; save(); render(); break; }
    case 'evNext': ui.fin.step++; if (ui.fin.step >= ui.fin.ev.length){ ui.fin.stage='retry'; ui.fin.retry = retryList(); ui.fin.ri=0; } render(); window.scrollTo(0,0); break;
    case 'count': b.disabled = true; countUp(); break;
    case 'toResult': {
      S.phase='result'; S.done=true; store.del('kaje7_save');
      const sc = calc(); const rec = store.get('kaje7_rekord') || {}; const key = S.mode+'_'+S.block;
      render(); if (!rec[key] || sc.trust > rec[key]){ rec[key] = sc.trust; store.set('kaje7_rekord', rec); }
      window.scrollTo(0,0); break; }
    case 'buyEx': { const x = EX(b.dataset.v); if (x && x.cost<=S.cash-RESERVE && !S.extras.includes(x.id)){ S.cash -= x.cost; S.extras.push(x.id); save(); render(); } break; }
    case 'satz': ui.satz[b.dataset.k] = +b.dataset.i; render(); break;
    case 'satzCheck': { const subj = satzSubject(id); const ok = (ui.satz.r===subj?1:0) + (CH[id].opts[ui.satz.f].term===CH[id].opts[subj].term?1:0); S.satz[id] = {ok}; save(); render(); break; }
    case 'afterPro': nextAfter(id); break;
    case 'rechCheck': { const v = parseNum($('#inRech').value); if (v===null){ $('#inRech').focus(); break; } S.rech[id] = {val:$('#inRech').value, ok: Math.abs(v-ui.rech.ans) < 0.011, ans:ui.rech.ans}; save(); render(); break; }
    case 'krPick': ui.krSel = +b.dataset.i; render(); break;
    case 'krLock': { const it = ui.inter.queue[ui.inter.i], k = KROLL.find(x=>x.id===it.id), o = k.o[ui.krSel]; S.kroll.push({id:k.id, pick:ui.krSel, q:o.q, tr:o.tr, k:o.k, c:o.c}); S.cash += o.c; save(); render(); break; }
    case 'cpPick': ui.cpSel = +b.dataset.i; render(); break;
    case 'cpLock': { const it = ui.inter.queue[ui.inter.i], p = (BASE[it.rq.id].pros||[BASE[it.rq.id].pro])[it.rq.i]; S.cp.push({at:it.at, trust:calc().trust, yellow:true, pick:ui.cpSel, ok:ui.cpSel===p.a, q:p.q}); save(); render(); break; }
    case 'interNext': { const it = ui.inter.queue[ui.inter.i]; if (it.type==='cp' && !S.cp.find(x=>x.at===it.at)) S.cp.push({at:it.at, trust:calc().trust, yellow:false, ok:false});
      ui.inter.i++; ui.krOrder=null; ui.krSel=null; ui.cpOrder=null; ui.cpSel=null;
      if (ui.inter.i >= ui.inter.queue.length) enterChapter(); else { save(); render(); } window.scrollTo(0,0); break; }
    case 'bossPick': ui.bossSel = +b.dataset.i; render(); break;
    case 'bossLock': lockBoss(ui.bossSel); break;
    case 'bossNext': ui.fin.bi++; ui.bossSel=null; if (ui.fin.bi < ui.fin.boss.length) bossTimer(); render(); window.scrollTo(0,0); break;
    case 'bossDone': ui.fin.stage='events'; ui.fin.step=0; if (!ui.fin.ev.length){ ui.fin.stage='retry'; ui.fin.retry=retryList(); } render(); window.scrollTo(0,0); break;
    case 'rPick': ui.rSel = +b.dataset.i; render(); break;
    case 'rLock': { const it = ui.fin.retry[ui.fin.ri], o = varObj(it.id, it.v); S.retry[ui.fin.ri] = {id:it.id, v:it.v, pick:ui.rSel, q:T(o.opts[ui.rSel].q)}; save(); render(); break; }
    case 'rNext': ui.fin.ri++; ui.rSel=null; ui.rOrder=null; render(); window.scrollTo(0,0); break;
    case 'retryDone': ui.fin.stage='decide'; render(); window.scrollTo(0,0); break;
    case 'againNew': { const lp = S.persona; newGame(true); S.lastPersona = lp; S.phase='draw'; render(); window.scrollTo(0,0); break; }
    case 'againSame': { const p = S.persona; newGame(true); S.persona = p; startRun(); window.scrollTo(0,0); break; }
    case 'againBranch': newGame(true); S.phase='setup'; render(); window.scrollTo(0,0); break;
  }
});

app.addEventListener('click', e=>{ if (S.phase==='draw' && !S.persona && e.target.closest('#flip')){ const btn = app.querySelector('[data-act="draw"]'); if (btn) btn.click(); } });

// Wortspeicher
$('#btnWords').addEventListener('click', ()=>{
  const d = $('#drawer');
  const ids = S && S.phase==='chapter' ? [curId()] : chapters();
  const words = [...new Set(ids.flatMap(id=>CH[id].words))];
  d.innerHTML = `<div class="sheet stack" role="dialog" aria-label="Wortspeicher"><div class="row" style="justify-content:space-between"><h3>Wortspeicher</h3><button class="btn ghost" data-close style="min-height:44px;padding:8px 14px">Schließen</button></div>
    ${S && S.phase==='chapter' ? `<p class="muted small">Modul ${CH[curId()].mod} · ${esc(CH[curId()].topic)}</p>`:''}<div class="words">${words.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>`;
  d.hidden = false;
});
$('#drawer').addEventListener('click', e=>{ if (e.target.id==='drawer' || e.target.closest('[data-close]')) $('#drawer').hidden = true; });
$('#btnMusic').addEventListener('click', ()=>{
  music.setWant(!music.want); syncMusicBtn();
  if (music.want){ music.ensure(); if (music.ctx && music.ctx.state==='suspended') music.ctx.resume();
    const t = document.createElement('div'); t.className='fb ok'; t.style.cssText='position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;max-width:620px;margin:0 auto';
    t.textContent='Musik an – sie spielt bei den Minispielen und im Finale. Bitte Kopfhörer nutzen oder leise stellen.'; document.body.appendChild(t); setTimeout(()=>t.remove(), 3500); }
});

// Start
function start(data){
  music.want = !!store.get('kaje7_music'); syncMusicBtn();
  if (data && data.S && data.S.phase){ S = data.S; ui = data.ui || {}; if (S.phase==='chapter' && !ui.step) enterChapter(); else render(); }
  else { S = fresh(); render(); }
}
window.claude?.hot?.snapshot?.(()=>({S, ui:Object.assign({}, ui, {tm:null})}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
