<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ladenmacher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito+Sans:wght@400;600;800&display=swap">
<style>
/* Layout: eine Spalte wie ein Bauplan-Klemmbrett; oben Statusleiste (Budget, Kundin, Schritt), darunter Ladenbild und Entscheidungskarten */
:root{
  --bg:#e7efec; --surface:#ffffff; --surface2:#f2f7f5; --ink:#15302d; --muted:#4b625e; --line:#c9d8d4;
  --petrol:#0e6a64; --on-petrol:#ffffff; --coral:#d9492f; --sun:#f3b42c; --on-sun:#2a1f00;
  --good:#1d7f47; --mid:#a86f00; --bad:#bf3626; --good-bg:#e1f3e8; --mid-bg:#fbf0d6; --bad-bg:#fbe3df;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1b1a; --surface:#162725; --surface2:#1c312e; --ink:#e6f0ed; --muted:#9fb6b1; --line:#2d4744;
  --petrol:#43b5aa; --on-petrol:#062120; --coral:#f0806a; --sun:#f5c454; --on-sun:#2a1f00;
  --good:#63d18f; --mid:#eebc4a; --bad:#f2846f; --good-bg:#183a28; --mid-bg:#3a3017; --bad-bg:#40221d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1b1a; --surface:#162725; --surface2:#1c312e; --ink:#e6f0ed; --muted:#9fb6b1; --line:#2d4744;
  --petrol:#43b5aa; --on-petrol:#062120; --coral:#f0806a; --sun:#f5c454; --on-sun:#2a1f00;
  --good:#63d18f; --mid:#eebc4a; --bad:#f2846f; --good-bg:#183a28; --mid-bg:#3a3017; --bad-bg:#40221d; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 40px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px;background-position:-1px -1px}
.wrap{max-width:860px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(2.3rem,7vw,3.6rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(1.5rem,4.5vw,2rem);font-weight:800}
h3{font-size:1.2rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:8px}

/* Statusleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:8px 16px;
  background:var(--surface);border-bottom:2px solid var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.3rem;display:flex;align-items:center;gap:6px}
.brand svg{width:28px;height:28px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.money{background:var(--sun);color:var(--on-sun);border-color:transparent}
.bar .sp{flex:1}
.iconbtn{border:1.5px solid var(--line);background:var(--surface2);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.9rem;cursor:pointer}
.steps{display:flex;gap:4px;width:100%}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.done{background:var(--petrol)}
.steps i.now{background:var(--coral)}

main{padding-top:18px;display:grid;gap:16px}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:18px;box-shadow:4px 4px 0 var(--ink)}
.eyebrow{font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--petrol)}
.lead{color:var(--muted);font-size:1.02rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:12px}

.btn{border:2px solid var(--ink);background:var(--petrol);color:var(--on-petrol);font-weight:800;font-size:1.05rem;padding:12px 20px;border-radius:12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.sun{background:var(--sun);color:var(--on-sun)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}

/* Szene */
.scene{display:grid;grid-template-columns:1fr 2fr;gap:8px;border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;background:#bfe1ec}
.scene svg{display:block;width:100%;height:auto}
.scene .lbl{position:absolute;left:6px;top:6px;background:rgba(255,255,255,.85);color:#15302d;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:6px}
.scene>div{position:relative;min-width:0}

/* Optionen */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opt{position:relative;text-align:left;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:6px;align-content:start;min-width:0}
.opt:hover:not([disabled]){border-color:var(--petrol)}
.opt.sel{border-color:var(--petrol);background:var(--surface);box-shadow:0 0 0 3px var(--petrol) inset}
.opt[disabled]{cursor:default}
.opt.off{opacity:.45}
.opt .t{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.15}
.opt .d{font-size:.95rem;color:var(--muted)}
.tag{justify-self:start;font-family:var(--display);font-weight:700;font-size:.95rem;background:var(--sun);color:var(--on-sun);padding:0 10px;border-radius:4px 10px 10px 4px;position:relative;padding-left:16px;font-variant-numeric:tabular-nums}
.tag::before{content:"";position:absolute;left:5px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--surface2)}
.tag.free{background:var(--line);color:var(--ink)}
.toomuch{font-size:.85rem;font-weight:800;color:var(--bad)}

/* Reaktion */
.react{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;border-radius:12px;padding:12px;border:2px solid var(--line);background:var(--surface2)}
.react svg{width:72px;height:72px}
.bubble{font-family:var(--display);font-size:1.2rem;font-weight:700;line-height:1.2}
.term{border-left:6px solid var(--petrol);padding:8px 12px;background:var(--surface2);border-radius:0 10px 10px 0}
.term b{color:var(--petrol)}
.m3{color:var(--good)}.m2{color:var(--mid)}.m1{color:var(--mid)}.m0{color:var(--bad)}

/* Start */
.hero{display:grid;gap:14px}
.heroart{border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;background:#bfe1ec}
.heroart svg{display:block;width:100%;height:auto}
.field{display:grid;gap:4px}
.field label{font-weight:800;font-size:.95rem}
.field input{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);width:100%}
.field input:focus{border-color:var(--petrol);outline:none}
.shops{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shop{border:2px solid var(--line);border-radius:12px;background:var(--surface2);padding:10px;cursor:pointer;display:grid;gap:4px;justify-items:center;text-align:center;font-weight:800}
.shop svg{width:100%;max-width:120px;height:auto}
.shop.sel{border-color:var(--petrol);box-shadow:0 0 0 3px var(--petrol) inset;background:var(--surface)}
@media (max-width:460px){.shops{grid-template-columns:1fr 1fr 1fr;gap:6px}.shop{padding:6px;font-size:.85rem}}

/* Zielgruppen-Karte */
.drawcard{perspective:900px;display:grid;justify-items:center}
.flip{width:min(320px,100%);aspect-ratio:3/4;max-width:100%;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,1.4,.5,1)}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--ink);border-radius:18px;box-shadow:5px 5px 0 var(--ink);display:grid;place-items:center;padding:18px;text-align:center}
.face.front{background:repeating-linear-gradient(45deg,var(--petrol) 0 14px,#0b5853 14px 28px);color:#fff;font-family:var(--display);font-size:3rem;font-weight:800}
.face.back{background:var(--surface);transform:rotateY(180deg);align-content:center;gap:10px}
.face.back svg{width:120px;height:120px}

/* Sortieren / Platzieren */
.sortitem{font-family:var(--display);font-size:1.6rem;font-weight:800;text-align:center;padding:18px;border:2px dashed var(--ink);border-radius:12px;background:var(--surface2)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{border:2px solid var(--ink);border-radius:12px;padding:12px;background:var(--surface);cursor:pointer;text-align:left;display:grid;gap:2px}
.bin b{font-family:var(--display);font-size:1.1rem}
.bin span{font-size:.85rem;color:var(--muted)}
.bin.ok{background:var(--good-bg);border-color:var(--good)}
.bin.no{background:var(--bad-bg);border-color:var(--bad)}
.fb{border-radius:10px;padding:10px 12px;font-weight:600}
.fb.ok{background:var(--good-bg);color:var(--ink);border:2px solid var(--good)}
.fb.no{background:var(--bad-bg);color:var(--ink);border:2px solid var(--bad)}
.plan{max-width:560px;width:100%;justify-self:center;border:2px solid var(--ink);border-radius:var(--r);background:#f6f3ea;overflow:hidden}
.plan svg{display:block;width:100%;height:auto}
.spot{cursor:pointer}
.spot:focus-visible{outline:none}
.spot:focus-visible circle,.spot:hover circle{stroke:#d9492f;stroke-width:4}
.spotbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.spotbtns button{border:2px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;font-weight:700}
.spotbtns button b{font-family:var(--display);color:var(--coral);margin-right:4px}

/* Ergebnis */
.event{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;border:2px solid var(--ink);border-radius:14px;padding:14px;background:var(--sun);color:var(--on-sun);box-shadow:4px 4px 0 var(--ink)}
.event svg{width:56px;height:56px}
.event h3{color:var(--on-sun)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface2)}
.stat .k{font-size:.8rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stars{font-size:2.2rem;letter-spacing:4px;color:var(--sun);-webkit-text-stroke:1.5px var(--ink);line-height:1}
.stars .e{color:transparent}
.score{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.big{font-family:var(--display);font-weight:800;font-size:clamp(3rem,12vw,4.6rem);line-height:.9;font-variant-numeric:tabular-nums;color:var(--petrol)}
.meter{height:14px;border-radius:7px;background:var(--line);overflow:hidden;border:1.5px solid var(--ink)}
.meter i{display:block;height:100%;background:var(--petrol)}
.senses{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sense{border:2px solid var(--line);border-radius:10px;padding:6px 2px;text-align:center;font-size:.78rem;font-weight:800;color:var(--muted);display:grid;justify-items:center;gap:2px}
.sense svg{width:30px;height:30px}
.sense.on{border-color:var(--good);color:var(--good);background:var(--good-bg)}
.list{display:grid;gap:10px}
.dec{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;border-bottom:1.5px dashed var(--line);padding-bottom:10px}
.dec:last-child{border-bottom:0}
.mark{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;border:2px solid currentColor;font-family:var(--display);font-size:1.1rem}
.dec .h{font-weight:800}
.dec .why{font-size:.95rem;color:var(--muted)}
.dec .ihk{font-size:.92rem;margin-top:4px;padding:6px 10px;background:var(--surface2);border-radius:8px}
.exam{border:2px solid var(--petrol);border-radius:12px;padding:14px;display:grid;gap:8px}
.exam ul{margin:0;padding-left:20px}
.profi{border:2px dashed var(--ink);border-radius:12px;padding:14px;background:var(--surface2)}
.showcard{text-align:center;display:grid;gap:6px;justify-items:center;background:var(--petrol);color:var(--on-petrol);border-color:var(--ink)}
.showcard .big{color:var(--on-petrol)}
.note{font-size:.85rem;color:var(--muted)}

/* Wortspeicher */
dialog{border:2px solid var(--ink);border-radius:var(--r);background:var(--surface);color:var(--ink);max-width:min(620px,calc(100vw - 32px));width:100%;padding:0;box-shadow:6px 6px 0 var(--ink)}
dialog::backdrop{background:rgba(10,25,23,.55)}
.dlg{padding:18px;display:grid;gap:10px;max-height:80vh;overflow:auto}
.dlg dl{margin:0;display:grid;gap:8px}
.dlg dt{font-weight:800;color:var(--petrol)}
.dlg dd{margin:0 0 4px}

.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.85);opacity:.3}to{transform:none;opacity:1}}
.note-anim{animation:float 2.4s ease-in-out infinite}
.note-anim.fast{animation-duration:.9s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap">
  <div class="bar" id="bar"></div>
  <main id="screen" aria-live="polite"></main>
</div>
<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>

<script>
(function(){
"use strict";
const START_BUDGET = 40000;
const $ = s => document.querySelector(s);
const eur = n => n.toLocaleString("de-DE") + " €";
const rnd = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Daten ---------- */
const SHOPS = {
  lebensmittel:{name:"Frischemarkt", ware:"Lebensmittel", def:"Marktliebe"},
  mode:{name:"Modeladen", ware:"Mode", def:"Fadenwerk"},
  technik:{name:"Technikladen", ware:"Elektronik", def:"Steckdose & Co."}
};
const TGS = {
  fam:{name:"Familien mit Kindern", short:"Familien", text:"Eltern mit kleinen Kindern. Sie haben wenig Zeit. Die Kinder werden schnell ungeduldig.", col:"#e58a3a"},
  jung:{name:"Junge Leute (16 bis 25)", short:"Junge Leute", text:"Sie mögen Trends, Spaß und machen gern Fotos für Social Media. Das Geld ist knapp.", col:"#7b5cd6"},
  alt:{name:"Ältere Kunden (65+)", short:"Ältere Kunden", text:"Sie wollen Ruhe, Übersicht, gute Beratung und auch mal eine Sitzgelegenheit.", col:"#3f86c4"},
  spar:{name:"Schnäppchenjäger", short:"Schnäppchenjäger", text:"Sie vergleichen Preise. Hauptsache günstig. Deko ist ihnen egal.", col:"#d4a017"},
  genuss:{name:"Kunden mit hohen Ansprüchen", short:"Anspruchsvolle", text:"Sie wollen Qualität, Beratung und etwas Besonderes erleben. Der Preis ist nicht so wichtig.", col:"#1d8a6a"}
};

const ROUNDS = [
 {id:"strategie", el:"Strategie", sinn:null, q:"Welche Strategie verfolgt euer Laden?",
  sub:"Das ist die erste große Entscheidung. Sie bestimmt Preise, Einrichtung und Service.",
  term:["Discount- und Erlebnisstrategie","Discount: dauerhaft niedrige Preise, dafür einfache Gestaltung. Erlebnis: Einkaufen wird zum Erlebnis – mit Atmosphäre, Beratung und Extras."],
  ihk:"Discountstrategie: dauerhaft niedrige Preise, einfache Gestaltung, wenig Beratung. Erlebnisstrategie: aufwendige Gestaltung (Licht, Farben, Deko, Düfte, Ruhezonen), viel Beratung und Zusatzangebote.",
  opts:[
   {k:"D", t:"Discountstrategie", d:"Ware im Karton, kaum Deko, wenig Personal. Dafür immer niedrige Preise.", cost:0, style:"D",
    fit:{fam:2,jung:2,alt:1,spar:3,genuss:0}, why:"Spart Kosten. Passt zu Kunden, denen der Preis am wichtigsten ist."},
   {k:"E", t:"Erlebnisstrategie", d:"Schönes Licht, Deko, viel Beratung und Extras. Die Preise sind etwas höher.", cost:10000, style:"E",
    fit:{fam:2,jung:2,alt:3,spar:0,genuss:3}, why:"Kostet Geld, aber Kunden bleiben länger, kaufen mehr und kommen wieder."},
   {k:"M", t:"Mischform", d:"Preise eher günstig, aber trotzdem gemütlich: Holzoptik, warmes Licht, breite Gänge.", cost:5000, style:"N",
    fit:{fam:3,jung:3,alt:2,spar:2,genuss:1}, why:"Viele Discounter machen das heute: günstig bleiben, aber Kunden sollen sich wohlfühlen."}
  ]},
 {id:"umfeld", el:"Element 1: Ladenumfeld", sinn:"sehen", q:"Wie sieht euer Laden von außen aus?",
  sub:"Schaufenster, Fassade, Eingang und Logo. Kunden entscheiden in wenigen Sekunden, ob sie hineingehen.",
  term:["Ladenumfeld","Gebäude, Fassade, Schaufenster, Eingang und Logo. Ziel: Kunden erkennen den Laden sofort wieder (Wiedererkennungswert)."],
  ihk:"Zum Ladenumfeld gehören Gebäude, Fassade, Schaufenster, Eingang und Logo. Ziel: Die Kunden erkennen den Laden sofort wieder.",
  opts:[
   {k:"a", t:"Schaufenster mit Thema", d:"Ein gestaltetes Schaufenster mit Licht und Deko. Großes Logo über dem Eingang.", cost:8000, style:"E", senses:["sehen"],
    fit:{fam:3,jung:3,alt:3,spar:2,genuss:3}, why:"Lockt Kunden von der Straße herein und bleibt im Kopf."},
   {k:"b", t:"Preise ins Fenster", d:"Große gelbe Preisplakate im Fenster. Schlichte Fassade, gut lesbares Logo.", cost:2000, style:"D", senses:["sehen"],
    fit:{fam:2,jung:1,alt:1,spar:3,genuss:0}, why:"Günstig und klar. Schnäppchenjäger sehen sofort: Hier ist es billig."},
   {k:"c", t:"Fenster zukleben", d:"Hinter dem Fenster steht das Lager. Also Folie drauf und ein kleines Schild.", cost:0, style:"D", bad:true,
    fit:{fam:0,jung:0,alt:0,spar:0,genuss:0}, why:"Niemand sieht, was es gibt. Kein Wiedererkennungswert, niemand wird hereingelockt."}
  ]},
 {id:"licht", el:"Element 2: Verkaufsraum", sinn:"sehen", q:"Welches Licht bekommt euer Laden?",
  sub:"Licht lenkt den Blick. Helle Bereiche ziehen Kunden an, dunkle werden gemieden.",
  term:["Grund-, Warenwand- und Akzentbeleuchtung","Grundbeleuchtung macht die ganze Fläche hell. Warenwandbeleuchtung hebt die Ware an den Wänden hervor. Akzentbeleuchtung (Spots) betont einzelne Waren."],
  ihk:"Beleuchtung hat einen wesentlichen Einfluss auf die Verkaufsförderung und wird gezielt eingesetzt: Grund-, Warenwand- und Akzentbeleuchtung. Die Lichtfarbe muss zur Ware passen.",
  opts:[
   {k:"a", t:"Nur Neonröhren", d:"Kaltes, weißes Licht. Überall gleich hell.", cost:1000, style:"D",
    fit:{fam:1,jung:1,alt:1,spar:2,genuss:0}, shop:{lebensmittel:-1}, why:"Alles ist hell, aber nichts fällt auf. Kaltes Licht lässt Obst, Fleisch und Brot blass wirken."},
   {k:"b", t:"Licht-Mix", d:"Grundbeleuchtung, Licht an den Warenwänden und Spots auf die Neuheiten.", cost:7000, style:"N", senses:["sehen"], verweil:2,
    fit:{fam:3,jung:3,alt:3,spar:2,genuss:3}, why:"Genau so steht es im Buch: drei Arten von Licht, gezielt eingesetzt."},
   {k:"c", t:"Disco-Licht", d:"Raum fast dunkel, dazu bunte Spots in Pink und Blau.", cost:4000, style:"E", bad:true,
    fit:{fam:0,jung:1,alt:0,spar:0,genuss:0}, why:"Dunkle Bereiche werden gemieden. Farben der Ware wirken unecht, Preise sind schlecht lesbar."}
  ]},
 {id:"farbe", el:"Element 2: Verkaufsraum", sinn:"sehen", q:"Welche Farben bekommt euer Laden?",
  sub:"Farben ordnen den Laden, wirken auf die Stimmung und sorgen für Wiedererkennung (Hausfarbe).",
  term:["Farbwirkung","Farben wirken emotional. Rot und Gelb aktivieren. Blau und Grün beruhigen und wirken frisch. Schwarz wirkt elegant."],
  ihk:"Farben wirken emotional und beeinflussen die Stimmung der Kunden, z. B. wirkt Grün in der Obstabteilung frisch, Rot aktiviert bei Sonderangeboten.",

const txt = (v) => (v && typeof v==="object") ? v[S.shop] : v;
function spent(){ let c=0; ROUNDS.forEach(r=>{ const k=S.choices[r.id]; if(k){ c+=r.opts.find(o=>o.k===k).cost; } }); return c; }
function budget(){ return START_BUDGET - spent(); }
function fitOf(r,o){
  if(o.bad) return {v:o.fit[S.tg], clash:false};
  let v=o.fit[S.tg] + ((o.shop&&o.shop[S.shop])||0), clash=false;
  if(r.id!=="strategie"){
    if(S.strat==="D" && o.style==="E"){ v-=1; clash="D"; }
    if(S.strat==="E" && o.style==="D"){ v-=1; clash="E"; }
  }
  return {v:Math.max(0,Math.min(3,v)), clash};
}
function maxFit(r){ return Math.max(...r.opts.map(o=>fitOf(r,o).v)); }
function fitHint(r,o,f){
  if(f.v>=3) return "";
  const tg=TGS[S.tg].short, w=(o.tgWhy&&o.tgWhy[S.tg])||"";
  if(f.v>=maxFit(r)) return (w?w+" ":"")+`Das war für ${tg} trotzdem die beste Wahl in dieser Runde.`;
  const b=bestOption(r);
  return (w?w+" ":"")+(b&&b.k!==o.k?`Besser für ${tg}: ${txt(b.t)}.`:"");
}
function sensesOf(st){
  const s=new Set();
  ROUNDS.forEach(r=>{ const k=st.choices[r.id]; if(!k) return; const o=r.opts.find(x=>x.k===k); if(o.senses && !o.bad) o.senses.forEach(x=>s.add(x)); });
  return [...s];
}

      <div class="field"><label for="team">Euer Teamname</label><input id="team" maxlength="30" value="${esc(S.team)}" placeholder="z. B. Lena und Emir"></div>
      <div class="field"><label for="store">So heißt euer Laden</label><input id="store" maxlength="18" value="${esc(S.store)}" placeholder="z. B. Marktliebe"></div>
      <div class="field"><label id="shoplbl">Was verkauft ihr?</label><div class="shops" role="group" aria-labelledby="shoplbl">${shops}</div></div>
      <div class="row"><button class="btn" data-act="go" ${S.shop?"":"disabled"}>Zielgruppe ziehen</button>${resume}</div>
      <p class="note">Euer Spielstand wird nur auf diesem Gerät gespeichert.</p>
    </div></section>`;
}
function vDraw(){
  const t=TGS[S.tg];
  return `<section class="card stack">
    <span class="eyebrow">Eure Zielgruppe</span>
    <h2>Für wen richtet ihr den Laden ein?</h2>
    <div class="drawcard"><div class="flip" id="flip">
      <div class="face front">?</div>
      <div class="face back">${persona(S.tg,3)}<h3>${t.name}</h3><p>${t.text}</p></div>
    </div></div>
    <p class="lead">Diese Person bewertet jede Entscheidung. Achtet auf ihr Gesicht.</p>
    <button class="btn wide" data-act="startrounds">Los geht's: Laden einrichten</button></section>`;
}
function vRound(){
  const r=ROUNDS[S.ri], chosen=S.choices[r.id], locked=S.locked[r.id], bud=budget() + (chosen&&!locked? r.opts.find(o=>o.k===chosen).cost:0);
  const opts = r.opts.map(o=>{
    const tooMuch = !locked && o.cost > bud;
    const cls = ["opt", chosen===o.k?"sel":"", locked&&chosen!==o.k?"off":""].join(" ");
    return `<button class="${cls}" data-act="pick" data-k="${o.k}" ${locked||tooMuch?"disabled":""} aria-pressed="${chosen===o.k}">
      <span class="tag ${o.cost?"":"free"}">${o.cost?eur(o.cost):"kostenlos"}</span>
      <span class="t">${txt(o.t)}</span><span class="d">${txt(o.d)}</span>
      ${tooMuch?`<span class="toomuch">Zu teuer für euer Budget</span>`:""}</button>`;
  }).join("");
  let after="";
  if(locked){
    const o=r.opts.find(x=>x.k===chosen), f=fitOf(r,o);
    after = `<div class="react pop">${persona(S.tg,f.v)}<div><p class="bubble m${f.v}">„${rnd(MOOD[f.v])}“</p>${f.clash?`<p class="note" style="margin-top:4px">${CLASH[f.clash]}</p>`:""}${fitHint(r,o,f)?`<p class="note" style="margin-top:4px"><b>Warum?</b> ${fitHint(r,o,f)}</p>`:""}</div></div>
      <div class="term"><b>Fachbegriff: ${r.term[0]}</b><br>${r.term[1]}</div>
      <button class="btn wide" data-act="next">${S.ri<ROUNDS.length-1?"Weiter":"Weiter zur Einrichtung"}</button>`;
  } else {
    after = `<button class="btn wide" data-act="lock" ${chosen?"":"disabled"}>Entscheidung festlegen</button>`;
  }
  const sinn = r.sinn ? ` · Sinn: ${SENSE_NAMES[r.sinn]}` : "";
  return `${sceneHTML()}
   <section class="card stack">
    <span class="eyebrow">Schritt ${S.ri+1} von ${STEPS.length} · ${r.el}${sinn}</span>
    <h2>${r.q}</h2><p class="lead">${r.sub}</p>
    <div class="opts">${opts}</div>${after}</section>`;
}
function vSort(){
  const done = S.sortI>=S.sortList.length;
  const right = S.sortRes.filter(Boolean).length;
  if(done) return `<section class="card stack"><span class="eyebrow">Schritt 9 von ${STEPS.length} · Ladeneinrichtung</span>
    <h2>Die Einrichtung steht!</h2><p class="lead">${right} von ${S.sortList.length} richtig zugeordnet. Für jede richtige Zuordnung gibt es Fachpunkte.</p>
    <div class="term"><b>Zur Ladeneinrichtung gehören:</b><br>Warenträger (Regale, Gondeln, Vitrinen, Tische) · Verkaufshilfen (Einkaufswagen, Kasse, Umkleidekabine) · interne Werbemittel (Plakate, Infotafeln, Deckenhänger) · sonstige Einrichtung (Diebstahlsicherung, Videoüberwachung, Sammelboxen).</div>
    <button class="btn wide" data-act="toplace">Weiter: Ware platzieren</button></section>`;
  const it=S.sortList[S.sortI], ans=S.sortRes.length>S.sortI;
  const bins=Object.keys(BINS).map(k=>{ let c=""; if(ans){ if(k===it[1]) c="ok"; else if(S.lastBin===k) c="no"; }
    return `<button class="bin ${c}" data-act="bin" data-k="${k}" ${ans?"disabled":""}><b>${BINS[k][0]}</b><span>${BINS[k][1]}</span></button>`; }).join("");
  const fb = ans ? (S.sortRes[S.sortI] ? `<div class="fb ok pop">Richtig! ${it[0]} → <b>${BINS[it[1]][0]}</b></div>` : `<div class="fb no pop">Nicht ganz. ${it[0]} → <b>${BINS[it[1]][0]}</b></div>`)+`<button class="btn wide" data-act="sortnext">Weiter</button>` : "";
  return `<section class="card stack"><span class="eyebrow">Schritt 9 von ${STEPS.length} · Ladeneinrichtung · ${S.sortI+1} von ${S.sortList.length}</span>
    <h2>Der Lieferwagen ist da! Wohin gehört das?</h2><p class="lead">Ordnet jedes Teil richtig ein. So lernt ihr, was zur Ladeneinrichtung gehört.</p>
    <div class="sortitem pop">${it[0]}</div><div class="bins">${bins}</div>${fb}</section>`;
}
function artikel(k){ return k==="V"?"eine":k==="I"?"ein":k==="W"?"ein":"eine"; }
function vPlace(){
  const placed={}; S.placeRes.forEach((r,i)=>{ if(r) placed[S.placeList[i].ok]=1; });
  const done=S.placeI>=S.placeList.length;
  if(done){
    const right=S.placeRes.filter(Boolean).length;
    return `<div class="plan">${planSVG(placed,true)}</div><section class="card stack"><span class="eyebrow">Schritt 10 von ${STEPS.length} · Element 3: Platzierung der Waren</span>
      <h2>Alles steht an seinem Platz.</h2><p class="lead">${right} von 4 richtig platziert. Die rote Linie zeigt den Kundenlauf: Die meisten Kunden gehen rechts herum, gegen den Uhrzeigersinn.</p>
      <button class="btn sun wide" data-act="toopen">Eröffnungstag starten!</button></section>`;
  }
  const it=S.placeList[S.placeI], ans=S.placeRes.length>S.placeI;
  const btns = Object.keys(SPOTS).map(k=>`<button data-act="spot" data-spot="${k}" ${ans?"disabled":""}><b>${k}</b>${SPOTS[k].name}</button>`).join("");
  const fb = ans ? (S.placeRes[S.placeI] ? `<div class="fb ok pop">Richtig: Platz ${it.ok}. ${it.why}</div>` : `<div class="fb no pop">Besser wäre Platz ${it.ok} (${SPOTS[it.ok].name}). ${it.why}</div>`)+`<button class="btn wide" data-act="placenext">Weiter</button>` : "";
  return `<div class="plan">${planSVG(placed,false)}</div>
   <section class="card stack"><span class="eyebrow">Schritt 10 von ${STEPS.length} · Element 3: Platzierung der Waren · ${S.placeI+1} von 4</span>
   <h2>Wohin kommt: ${it.t}?</h2><p class="lead">Tippt auf einen Platz im Grundriss oder wählt unten.</p>
   <div class="spotbtns">${btns}</div>${fb}</section>`;
}
function vOpen(){
  return `<div class="plan">${planSVG({},true,true)}</div>
   <section class="card stack" id="opencard"><span class="eyebrow">Schritt 11 von ${STEPS.length} · Eröffnungstag</span>
   <h2>Die Türen gehen auf …</h2>
   <div id="eventbox"><p class="lead">Moment, gerade passiert etwas …</p></div>
   <div class="stats"><div class="stat"><div class="k">Kunden heute</div><div class="v" id="cK">0</div></div><div class="stat"><div class="k">Umsatz heute</div><div class="v" id="cU">0 €</div></div></div>
   <button class="btn sun wide" data-act="toresult" id="toresult" hidden>Zur Auswertung</button></section>`;
}

/* ---------- Berechnung ---------- */
function compute(){
  let sum=0, mx=0, verweil=8;
  ROUNDS.forEach(r=>{ const o=r.opts.find(x=>x.k===S.choices[r.id]); const f=fitOf(r,o); sum+=f.v; mx+=maxFit(r); if(!o.bad) verweil+=(o.verweil||0); });
  const zuf = Math.min(100, Math.round(sum/Math.max(1,mx)*100));
  const senses = sensesOf(S);
  const ev = EVENTS.find(e=>e.id===S.event);
  const [mult, evText, evVerweil] = ev.f(S);
  verweil += (evVerweil||0);
  const umf = fitOf(ROUNDS[1], ROUNDS[1].opts.find(o=>o.k===S.choices.umfeld)).v;
  const kunden = Math.round(220*(0.45+zuf/100)*(0.7+umf*0.15)*mult);
  const bon = {D:14,M:19,E:26}[S.strat] * (0.85 + Math.min(verweil,30)/100);
  const umsatz = Math.round(kunden*bon/10)*10;
  const fach = S.sortRes.filter(Boolean).length*15 + S.placeRes.filter(Boolean).length*30;
  const rest = budget();
  const parts = {zuf:zuf*4, sinne:senses.length*30, verweil:Math.min(verweil,30)*3, fach, budget:Math.round(rest/500)};
  const pts = Object.values(parts).reduce((a,b)=>a+b,0);
  const max = 400+150+90+240+80;
  const pct = pts/max;
  const stars = pct>=.82?5:pct>=.68?4:pct>=.52?3:pct>=.38?2:1;
  return {zuf, senses, verweil, kunden, umsatz, fach, rest, parts, pts, stars, evText, mult};
}

function runOpening(){
  const R = compute(); S.result = R; save();
  const ev = EVENTS.find(e=>e.id===S.event);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(()=>{
    const good = R.mult>=1.02, bad = R.mult<0.98;
    $("#eventbox").innerHTML = `<div class="event pop"><svg viewBox="0 0 56 56" aria-hidden="true"><rect x="4" y="4" width="48" height="48" rx="10" fill="#fff" stroke="#15302d" stroke-width="3"/><text x="28" y="40" text-anchor="middle" font-family="Baloo 2,sans-serif" font-weight="800" font-size="32" fill="#d9492f">!</text></svg>
      <div><h3>${ev.t}</h3><p>${R.evText} ${good?"<b>Mehr Kunden!</b>":bad?"<b>Weniger Kunden.</b>":""}</p></div></div>`;
    animateWalkers(R, reduce);
    countUp($("#cK"), R.kunden, "", reduce);
    countUp($("#cU"), R.umsatz, " €", reduce, ()=>{ $("#toresult").hidden=false; });
  }, reduce?0:1400);
}
function countUp(el,to,suf,reduce,done){
  if(reduce){ el.textContent=to.toLocaleString("de-DE")+suf; done&&done(); return; }
  const t0=performance.now(), d=3200;
  (function f(t){ const p=Math.min(1,(t-t0)/d), e=1-Math.pow(1-p,3); el.textContent=Math.round(to*e).toLocaleString("de-DE")+suf; if(p<1) requestAnimationFrame(f); else done&&done(); })(t0);
}
function animateWalkers(R, reduce){
  const path=document.getElementById("lauf"), g=document.getElementById("walkers"); if(!path||!g) return;
  const L=path.getTotalLength(), n=Math.max(4,Math.min(16,Math.round(R.kunden/22)));
  const happy=R.zuf/100;
  const ws=[]; for(let i=0;i<n;i++){ const unhappy=Math.random()>happy+0.1;
    const col = unhappy?"#bf3626":(Math.random()<happy?"#1d7f47":"#e0a21a");
    const c=document.createElementNS("http://www.w3.org/2000/svg","g");
    c.innerHTML=`<circle r="7" fill="${col}" stroke="#15302d" stroke-width="1.5"/><circle cx="-2.2" cy="-1.5" r="1" fill="#fff"/><circle cx="2.2" cy="-1.5" r="1" fill="#fff"/>`;
    g.appendChild(c); ws.push({c,delay:i*380,stop:unhappy?0.25+Math.random()*0.2:1, speed:0.00011+Math.random()*0.00005}); }
  if(reduce){ ws.forEach((w,i)=>{ const p=path.getPointAtLength(L*(i+1)/(n+1)*w.stop); w.c.setAttribute("transform",`translate(${p.x} ${p.y})`); }); return; }
  const t0=performance.now();
  (function f(t){ let alive=false;
    ws.forEach(w=>{ let p=(t-t0-w.delay)*w.speed; if(p<0){ w.c.setAttribute("opacity","0"); alive=true; return; }
      w.c.setAttribute("opacity","1");
      let pos;
      if(p<=w.stop){ pos=p; alive=true; }
      else if(w.stop<1){ const back=p-w.stop; pos=Math.max(0,w.stop-back); if(pos>0) alive=true; else w.c.setAttribute("opacity","0"); }
      else { pos=1; w.c.setAttribute("opacity","0"); }
      const pt=path.getPointAtLength(L*Math.min(pos,1)); w.c.setAttribute("transform",`translate(${pt.x} ${pt.y})`); });
    if(alive && document.getElementById("walkers")===g) requestAnimationFrame(f);
  })(t0);
}

function vResult(){
  const R=S.result || compute(); S.result=R;
  const b=best();
  if(!b || R.pts>b.pts) setBest({pts:R.pts, store:S.store||SHOPS[S.shop].def, tg:TGS[S.tg].short});
  const isRecord = !b || R.pts>b.pts;
  const stars = "★★★★★".split("").map((s,i)=>`<span class="${i<R.stars?"":"e"}">★</span>`).join("");
  const senses = Object.keys(SENSE_NAMES).map(k=>`<div class="sense ${R.senses.includes(k)?"on":""}">${SENSE_ICONS[k]}${SENSE_NAMES[k]}</div>`).join("");
  const decs = ROUNDS.map(r=>{ const o=r.opts.find(x=>x.k===S.choices[r.id]); const f=fitOf(r,o);
    const top = f.v>=3 || f.v>=maxFit(r);
    const sym=top?"✓":f.v===2?"~":"✗", cls=top?"m3":f.v===2?"m2":"m0";
    const hint=fitHint(r,o,f);
    return `<div class="dec"><span class="mark ${cls}" aria-label="${f.v>=3?"passt":top?"beste Wahl":f.v===2?"teilweise":"passt nicht"}">${sym}</span><div>
      <p class="h">${r.el.replace(/^Element \d: /,"")}: ${txt(o.t)}</p>
      <p class="why">${o.why}${f.clash?" "+CLASH[f.clash]:""}${hint?` <b>Für ${TGS[S.tg].short}:</b> ${hint}`:""}</p>
      <p class="ihk"><b>So steht es in der Prüfung:</b> ${r.ihk}</p></div></div>`; }).join("");
  const profi = PROFI[(S.result.pts + S.tg.length) % PROFI.length];
  return `<section class="card showcard pop">
     <span class="eyebrow" style="color:inherit">${esc(S.team||"Euer Team")} · ${esc(S.store||SHOPS[S.shop].def)} · ${SHOPS[S.shop].name} · ${TGS[S.tg].short}</span>
     <div class="stars" aria-label="${R.stars} von 5 Sternen">${stars}</div>
     <div class="big">${R.pts}</div><p><b>Ladenpunkte</b>${isRecord?" · Neuer Rekord auf diesem Gerät!":""}</p>
     <p class="note" style="color:inherit">Zeigt diese Karte der Klasse.</p></section>
   <section class="card stack">
     <h2>Euer Eröffnungstag</h2>
     <div class="stats">
       <div class="stat"><div class="k">Kunden</div><div class="v">${R.kunden}</div></div>
       <div class="stat"><div class="k">Umsatz</div><div class="v">${R.umsatz.toLocaleString("de-DE")} €</div></div>
       <div class="stat"><div class="k">Verweildauer</div><div class="v">${R.verweil} Min.</div></div>
       <div class="stat"><div class="k">Restbudget</div><div class="v">${eur(R.rest)}</div></div>
     </div>
     <div class="stack" style="gap:6px"><div class="row"><b>Kundenzufriedenheit</b><span class="sp"></span><b>${R.zuf} %</b></div><div class="meter"><i style="width:${R.zuf}%"></i></div></div>
     <div class="stack" style="gap:6px"><b>Diese Sinne habt ihr angesprochen (${R.senses.length} von 5)</b><div class="senses">${senses}</div></div>
     <p class="note">Ladenpunkte: Zufriedenheit ${R.parts.zuf} · Sinne ${R.parts.sinne} · Verweildauer ${R.parts.verweil} · Fachwissen ${R.parts.fach} · Restbudget ${R.parts.budget}</p>
   </section>
   <section class="card stack"><h2>Eure Entscheidungen</h2><p class="lead">✓ passt gut (oder beste Wahl für eure Zielgruppe) · ~ geht so · ✗ passt nicht zu eurer Zielgruppe</p><div class="list">${decs}</div></section>
   <section class="card exam"><span class="eyebrow">Das kommt in der Prüfung</span>
     <h3>Visual Merchandising</h3>
     <p>„Optische Verkaufsförderung“: Verkaufsraum und Ware werden so gestaltet, dass eine besondere Einkaufsatmosphäre entsteht und die Kunden zum Kauf angeregt werden.</p>
     <h3>Drei Elemente der Verkaufsraumgestaltung</h3>
     <ul><li>Ladenumfeld (Fassade, Schaufenster, Eingang, Logo)</li><li>Verkaufsräume (Licht, Farben, Musik, Duft, Material, Ruhezonen)</li><li>Platzierung der Waren</li></ul>
     <h3>Ziele einer Umgestaltung</h3>
     <ul><li>Kunden: Einkaufserlebnis steigern, angenehmere Atmosphäre, neue Kaufanreize</li><li>Betrieb: Abgrenzung vom Wettbewerb, Neukunden gewinnen, Stammkunden binden, Umsatz steigern</li></ul>
   </section>
   <section class="profi"><span class="eyebrow">Für Profis</span><p style="margin-top:6px">${profi}</p><p class="note" style="margin-top:6px">Schreibt eure Antwort ins Heft. Nutzt „weil“ oder „da“.</p></section>
   <section class="card stack"><h2>Nochmal spielen?</h2><p class="lead">Neue Zielgruppe, neues Ereignis – schafft ihr mehr Punkte?</p>
     <div class="row"><button class="btn sun" data-act="again">Neue Zielgruppe ziehen</button><button class="btn ghost" data-act="retry">Gleiche Zielgruppe, besser machen</button><button class="btn ghost" data-act="restart">Anderen Laden wählen</button></div></section>`;
}
function bestOption(r){ let b=null,bv=-1; r.opts.forEach(o=>{ const v=fitOf(r,o).v - o.cost/100000; if(v>bv){bv=v;b=o;} }); return b; }

/* ---------- Ablauf ---------- */
function newGame(keepTg){
  const keep={team:S.team, store:S.store, shop:S.shop, tg:S.tg};
  S=fresh(); S.team=keep.team; S.store=keep.store; S.shop=keep.shop;
  if(keepTg){ S.tg=keep.tg; } else { const opts=Object.keys(TGS).filter(k=>k!==keep.tg); S.tg=rnd(opts); }
  S.sortList = shuffle(SORT).slice(0,8);
  const evs = EVENTS.map(e=>e.id); S.event=rnd(evs);
}
document.addEventListener("click", e=>{
  const t=e.target.closest("[data-act]"); if(!t) return;
  const a=t.dataset.act;
  if(a==="glossar"){ $("#dlgbody").innerHTML=`<div class="row"><h2>Wortspeicher</h2><span class="sp" style="flex:1"></span><button class="iconbtn" data-act="close">Schließen</button></div><dl>${GLOSSAR.map(g=>`<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join("")}</dl>`; try{$("#dlg").showModal();}catch(err){$("#dlg").setAttribute("open","");} return; }
  if(a==="close"){ $("#dlg").close ? $("#dlg").close() : $("#dlg").removeAttribute("open"); return; }
  if(a==="shop"){ readInputs(); S.shop=t.dataset.k; render(); return; }
  if(a==="go"){ readInputs(); const shop=S.shop; newGame(false); S.shop=shop; S.screen="draw"; render(); setTimeout(()=>{ const f=$("#flip"); f&&f.classList.add("on"); }, 500); return; }
  if(a==="resume"){ readInputs(); S.screen = S.result? "result" : (S.screen==="start" ? (S._last||"round") : S.screen); render(); return; }
  if(a==="startrounds"){ S.screen="round"; S.ri=0; render(); scrollTop(); return; }
  if(a==="pick"){ const r=ROUNDS[S.ri]; S.choices[r.id]=t.dataset.k; if(r.id==="strategie") S.strat=t.dataset.k; render(); return; }
  if(a==="lock"){ const r=ROUNDS[S.ri]; if(S.choices[r.id]){ S.locked[r.id]=true; render(); } return; }
  if(a==="next"){ if(S.ri<ROUNDS.length-1){ S.ri++; } else { S.screen="sort"; S.sortI=0; S.sortRes=[]; } render(); scrollTop(); return; }
  if(a==="bin"){ const it=S.sortList[S.sortI]; S.lastBin=t.dataset.k; S.sortRes[S.sortI]= t.dataset.k===it[1]; render(); return; }
  if(a==="sortnext"){ S.sortI++; render(); return; }
  if(a==="toplace"){ S.screen="place"; S.placeList=shuffle(placeItems(S.shop,S.choices.extra)); S.placeI=0; S.placeRes=[]; render(); scrollTop(); return; }
  if(a==="spot"){ placeAt(t.dataset.spot); return; }
  if(a==="placenext"){ S.placeI++; render(); return; }
  if(a==="toopen"){ S.screen="open"; render(); scrollTop(); return; }
  if(a==="toresult"){ S.screen="result"; render(); scrollTop(); return; }
  if(a==="again"){ newGame(false); S.screen="draw"; render(); scrollTop(); setTimeout(()=>{ const f=$("#flip"); f&&f.classList.add("on"); }, 500); return; }
  if(a==="retry"){ newGame(true); S.screen="round"; S.ri=0; render(); scrollTop(); return; }
  if(a==="restart"){ const k={team:S.team,store:S.store}; S=fresh(); S.team=k.team; S.store=k.store; render(); scrollTop(); return; }
});
document.addEventListener("keydown", e=>{ if((e.key==="Enter"||e.key===" ") && e.target.classList && e.target.classList.contains("spot")){ e.preventDefault(); placeAt(e.target.dataset.spot); } });
document.addEventListener("click", e=>{ const sp=e.target.closest(".spot"); if(sp && S.screen==="place") placeAt(sp.dataset.spot); });
function placeAt(k){ if(S.screen!=="place" || S.placeI>=S.placeList.length || S.placeRes.length>S.placeI) return; S.placeRes[S.placeI] = (k===S.placeList[S.placeI].ok); render(); }
function readInputs(){ const a=$("#team"), b=$("#store"); if(a) S.team=a.value.trim(); if(b) S.store=b.value.trim(); }
document.addEventListener("input", e=>{ if(e.target.id==="team"||e.target.id==="store"){ readInputs(); save(); } });
function scrollTop(){ try{ window.scrollTo({top:0,behavior:"smooth"}); }catch(e){ window.scrollTo(0,0); } }

// Beim Laden: laufendes Spiel fortsetzen
if(S.screen==="draw"){ render(); const f=$("#flip"); f&&f.classList.add("on"); }
else if(S.screen==="open"){ S.screen = "result"; render(); }
else render();
})();
</script>

</body>
