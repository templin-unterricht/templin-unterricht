<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Outlet-Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#f1efe9;--surface:#fff;--surface2:#f7f5f0;--ink:#1f1d18;--muted:#5f5a4f;--line:#d9d3c6;
  --brand:#7a3e00;--brand-ink:#fff;--ok:#1f7a3f;--bad:#b3261e;--warn:#a15c00;
  --kauf:#1f5fae;--kauf-soft:#dde8f7;--verk:#c2410c;--verk-soft:#fbe6dc;--beob:#5b4b8a;--beob-soft:#e9e3f5;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#f0a95a;--brand-ink:#1a1209;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --kauf:#7fb0ff;--kauf-soft:#1b2a40;--verk:#ff8a5c;--verk-soft:#3a2219;--beob:#b9a6f0;--beob-soft:#2a2340;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#f0a95a;--brand-ink:#1a1209;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --kauf:#7fb0ff;--kauf-soft:#1b2a40;--verk:#ff8a5c;--verk-soft:#3a2219;--beob:#b9a6f0;--beob-soft:#2a2340;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0 0 .4em;line-height:1.1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.6em 1em}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.45;cursor:default}
input,textarea{font:inherit;width:100%;padding:.6em .7em;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.merk{border-left:6px solid var(--brand);background:var(--surface);border-radius:10px;padding:12px 14px;margin:8px 0}
.merk b.k{color:var(--kauf)} .merk b.v{color:var(--verk)}
.term{font-weight:700;border-bottom:3px solid var(--brand)}
.alt{font-weight:400;color:var(--muted);font-size:.9em}
/* ---------- Tafel ---------- */
#tafel header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tafel header h1{font-size:1.35rem;margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.steps button{padding:.35em .8em;font-size:.9rem}
.steps button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mini{display:flex;align-items:center;gap:10px;font-size:.9rem}
.mini canvas{width:64px;height:64px;border-radius:6px;background:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px}
.dot.on{background:var(--ok)}
#tMain{padding:20px 22px 40px;max-width:1400px;margin:0 auto}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.ctrl button{font-size:1.05rem}
.big{font-size:clamp(1.6rem,3.2vw,2.6rem)}
.join{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:28px;align-items:start}
.join canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:14px}
.code{font-family:var(--display);font-size:3rem;font-weight:800;letter-spacing:.12em}
.nicks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nicks button{padding:.3em .7em;font-size:.95rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.clock{font-family:var(--display);font-size:3rem;font-weight:800}
.chip{display:inline-block;border-radius:999px;padding:.2em .7em;margin:3px;font-weight:700;font-family:var(--display)}
.chip.k{background:var(--kauf-soft);color:var(--kauf)} .chip.v{background:var(--verk-soft);color:var(--verk)}
.banner{border-radius:12px;padding:12px 16px;margin-top:14px;font-size:1.2rem}
.banner.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));border:2px solid var(--ok)}
.banner.nf{background:var(--kauf-soft);border:2px solid var(--kauf)}
.banner.af{background:var(--verk-soft);border:2px solid var(--verk)}
.banner.info{background:var(--surface);border:2px solid var(--brand)}
.satz{display:block;margin-top:6px;font-size:1rem;color:var(--muted)}
.hbar{display:grid;grid-template-columns:140px 1fr 60px;gap:10px;align-items:center;margin:10px 0;font-size:1.15rem}
.hbar .t{height:34px;border-radius:8px;background:var(--surface2);overflow:hidden}
.hbar .t i{display:block;height:100%;transition:width .4s}
.hbar b{font-family:var(--display);font-size:1.8rem;text-align:right}
table.mt{border-collapse:collapse;width:100%;background:var(--surface);border-radius:12px;overflow:hidden;font-size:1.05rem}
table.mt th,table.mt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
table.mt th{background:var(--surface2);font-size:.9rem}
table.mt tr.cur td{outline:3px solid var(--brand);outline-offset:-3px}
table.mt tr.eq td{background:color-mix(in srgb,var(--ok) 18%,var(--surface));font-weight:700}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{font-family:var(--display);font-weight:800;font-size:1.1rem;padding:.4em .8em}
.pchips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pchips button.done{border-color:var(--ok);border-width:2px}
.scen{text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line)}
.scen b{display:block;font-family:var(--display);font-size:1.3rem;margin-bottom:4px}
svg text{font-family:var(--body)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer{font-family:var(--display);font-size:3rem;font-weight:800;min-width:2.2em;text-align:center;border-radius:50%;background:var(--surface);border:4px solid var(--brand);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{border-radius:14px;padding:14px 16px;color:#fff;font-size:1.2rem;font-weight:700;position:relative}
.o0{background:#b3261e}.o1{background:#1f5fae}.o2{background:#8a5300}.o3{background:#3a7a1c}.o4{background:#8537a3}
.opt.wrong{opacity:.35}
.opt .cnt{position:absolute;right:14px;top:10px;font-family:var(--display);font-size:1.6rem}
.top{list-style:none;padding:0;margin:0}
.top li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--surface);margin-bottom:6px;font-size:1.15rem}
.top li b{font-family:var(--display)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:24px}
.podium div{background:var(--brand);color:var(--brand-ink);border-radius:14px 14px 0 0;width:200px;text-align:center;padding:12px;font-family:var(--display);font-weight:800}
.podium span{display:block;font-size:1.4rem}
.pro{font-size:.75rem;font-weight:700;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.qtab{border-collapse:collapse;margin:8px 0;background:var(--surface)}
.qtab td,.qtab th{border:1px solid var(--line);padding:4px 10px;text-align:center}
@media (max-width:900px){.two,.three,.join,.opts{grid-template-columns:1fr}}
/* ---------- Handy ---------- */
#phone{max-width:560px;margin:0 auto;padding:14px 16px 40px}
#phone .ph-top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.card{border-radius:18px;padding:16px 18px;border:3px solid;margin-bottom:12px}
.card.K{background:var(--kauf-soft);border-color:var(--kauf)} .card.V{background:var(--verk-soft);border-color:var(--verk)} .card.B{background:var(--beob-soft);border-color:var(--beob)}
.card .role{font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase}
.card.K .role{color:var(--kauf)} .card.V .role{color:var(--verk)} .card.B .role{color:var(--beob)}
.card .val{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1.05}
.card .cd{margin-top:8px;font-size:1rem}
.card .cd b{font-family:var(--display);font-size:1.8rem;letter-spacing:.1em}
.step{display:flex;align-items:center;gap:8px;margin:8px 0}
.step button{font-size:1.2rem;font-weight:800;padding:.5em .7em;min-width:3.2em}
.step .pv{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:2rem}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.status.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.status.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.yn button{padding:20px 10px;font-size:1.2rem;font-weight:700;border-radius:14px;border:3px solid var(--line)}
.yn button.sel{outline:4px solid var(--ink);outline-offset:1px}
.yn .y{background:color-mix(in srgb,var(--ok) 18%,var(--surface));border-color:var(--ok)}
.yn .n{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:var(--bad)}
.pbtn{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:14px;font-size:1.05rem}
.pbtn.sel{outline:4px solid var(--ink);outline-offset:-2px}
.popt{display:block;width:100%;margin:10px 0;padding:16px 14px;border-radius:14px;color:#fff;border:none;font-size:1.05rem;font-weight:700;text-align:left}
.bigpts{font-family:var(--display);font-size:2.4rem;font-weight:800}
.ansage{font-family:var(--display);font-weight:800;font-size:3rem;text-align:center;margin:6px 0}

.o5{background:#0f6b6b}
.ico{width:1.6em;height:1.6em;flex:none}
.fchip{display:inline-flex;align-items:center;gap:8px;color:#fff;border-radius:10px;padding:6px 12px;font-family:var(--display);font-weight:800;font-size:1.15rem}
.fchip.sm{font-size:.95rem;padding:4px 10px}.fchip.sm .ico{width:1.3em;height:1.3em}
.opt{display:flex;align-items:center;gap:10px}
.opts.six{grid-template-columns:1fr 1fr 1fr}.opts.six .opt{font-size:1.35rem}.opts.six .ico{width:2em;height:2em}
.popt{display:flex;align-items:center;gap:10px}
.scen.st0{border-color:var(--verk)}.scen.st1{border-color:var(--kauf)}.scen.st2{border-color:var(--beob)}
.scen{background:var(--surface);font-size:1.15rem}
.slist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.srow{display:grid;grid-template-columns:minmax(260px,1.3fr) 200px 1.5fr;gap:14px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:1.1rem}
.srow.yes{border-color:var(--ok)}.srow.no{border-color:var(--bad)}
.sbar{position:relative;height:30px;border-radius:8px;background:var(--surface2);overflow:hidden}
.sbar i{display:block;height:100%;background:var(--brand);opacity:.55;transition:width .4s}
.sbar b{position:absolute;right:8px;top:2px;font-family:var(--display);font-size:1.2rem}
.nein{color:var(--bad);font-weight:700}
.obar{display:grid;grid-template-columns:210px 100px 1fr;gap:12px;align-items:center;margin:8px 0;padding:6px 8px;border-radius:10px;border:2px solid var(--line);background:var(--surface)}
.obar.no{border-color:var(--bad)}.obar.yes{border-color:var(--ok)}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}
.fgrid.c{grid-template-columns:repeat(3,1fr)}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fhead{display:flex;align-items:center;gap:10px;color:#fff;padding:10px 12px;font-family:var(--display);font-weight:800;font-size:1.2rem;border-radius:0}
.fgrid.c>.fhead{border-radius:12px}
.fhead small{font-family:var(--body);font-weight:400;font-size:.8rem}
.fbody{padding:10px 12px}
.sig{display:inline-block;margin-top:4px;font-size:.92rem;background:var(--surface2);border-radius:6px;padding:1px 6px}
.mbtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:14px;font-size:1.05rem;border:2px solid var(--line)}
.mbtn.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.box2{flex:none;width:28px;height:28px;border:2px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800}
.prow{border-radius:12px;padding:10px 12px;margin:8px 0;border:2px solid var(--line);background:var(--surface)}
.prow.ok{border-color:var(--ok)}.prow.bad{border-color:var(--bad)}
.prow .fchip{margin-top:6px}
@media (max-width:900px){.srow,.obar{grid-template-columns:1fr}.opts.six,.fgrid,.fgrid.c{grid-template-columns:1fr}}
#phone .fgrid{grid-template-columns:1fr}
</style>
</head>

 {q:"Das Warenhaus Maxikauf GmbH erfüllt verschiedene Funktionen gegenüber dem Verbraucher. Welche Situation erfüllt die Beratungsfunktion?",o:["Ein Kunde lässt sich in der Schmuckabteilung durch die Warenpräsentation in den Vitrinen anregen.","Eine Mutter sucht für ihre Tochter ein Smartphone. Eine Verkäuferin erklärt ihr den Unterschied zwischen verschiedenen Modellen.","Ein Stammkunde fragt nach einem ausverkauften Artikel und soll nächste Woche wiederkommen.","Eine Kundin fragt, ob der Pullover aus Schurwolle ist. Sie wird auf das Etikett verwiesen.","Im Regal fehlen Sektflaschen. Ein Mitarbeiter bringt sie dem Kunden aus dem Lager."],k:1,x:"IHK-Original (leicht gekürzt). Beratung = jemand erklärt. Der Sekt aus dem Lager ist Zeitüberbrückung (Lagerhaltung).",pz:"Welche Aufgabe beschreibt Antwort E?"},
 {q:"Welche Aussage über die Maxikauf GmbH beschreibt die Raumüberbrückung?",o:["Die Maxikauf GmbH verfügt über ein geräumiges Reservelager.","Die Maxikauf GmbH bietet den Kunden eine große Auswahl an Waren an.","Die Maxikauf GmbH bezieht Waren aus der ganzen Welt und bietet sie vor Ort an.","Die Maxikauf GmbH kauft Waren in größeren Mengen ein und verkauft sie in haushaltsüblichen Mengen.","Die Maxikauf GmbH bietet den Kunden Parkplätze, Rolltreppen und Kundentoiletten."],k:2,x:"IHK-Original (Zuordnung). Aus der ganzen Welt → vor Ort = Raumüberbrückung. A = Zeitüberbrückung, B = Sortimentsbildung, D = Mengenausgleich, E = Service."},
 {q:"Und jetzt: Welche Aussage beschreibt die Servicefunktion?",o:["Die Maxikauf GmbH verfügt über ein geräumiges Reservelager.","Die Maxikauf GmbH bietet den Kunden eine große Auswahl an Waren an.","Die Maxikauf GmbH zahlt den Mitarbeitern Urlaubs- und Weihnachtsgeld.","Die Maxikauf GmbH kauft Waren in größeren Mengen ein und verkauft sie in haushaltsüblichen Mengen.","Die Maxikauf GmbH bietet den Kunden Parkplätze, Rolltreppen und Kundentoiletten."],k:4,x:"IHK-Original (Zuordnung). Parkplätze, Rolltreppen, Toiletten = Service für die Kunden. Urlaubsgeld ist eine Leistung für die Mitarbeiter – keine Aufgabe des Einzelhandels."},
 {q:"Das Ziel der Merlin GmbH ist es, durch die Sortimentsbildung möglichst viele Kundenwünsche zu erfüllen. Mit welcher Maßnahme wird die Sortimentsbildung beschrieben?",o:["Durch die Anpreisung von Waren mit dem Ziel der Gewinnmaximierung","Durch die Beratung der Hersteller über die Wünsche der Kunden","Durch eine kundenorientierte Auswahl an Waren","Durch den Einkauf von Waren des gehobenen Bedarfs","Durch die Bereithaltung von Waren mit dem Ziel der ständigen Lieferbereitschaft"],k:2,x:"IHK-Original (Zwischenprüfung Frühjahr 2023). Sortimentsbildung = kundenorientierte Auswahl. E (Bereithaltung) = Zeitüberbrückung."},
 {q:"Das Warenhaus Maxikauf GmbH bietet Serviceleistungen vor und nach dem Kauf an. Welche Funktion des Einzelhandels erfüllt die Maxikauf GmbH damit?",o:["die gesetzlich festgelegten Kundendienstleistungen","die Beratungsfunktion des Einzelhandels","die Kundendienstfunktion des Einzelhandels","die Sortimentsfunktion","teilweise die Produktwerbung für den Hersteller"],k:2,x:"IHK-Original (WiSo Winter 2018/19). Service = Kundendienst. Gesetzlich vorgeschrieben ist der Service nicht."},
 {pro:1,q:"Ein Hersteller verkauft nur noch über seinen eigenen Online-Shop. Welche Aufgabe des Einzelhandels kann er seinen Kunden nicht bieten?",o:["Raumüberbrückung","Mengenausgleich","Sortimentsbildung mit Waren vieler Hersteller","Zeitüberbrückung","Service"],k:2,x:"Er hat nur seine eigene Marke. Vergleichen zwischen vielen Herstellern geht nur beim Händler."},
 {pro:1,q:"Lena spart im Outlet 20 €. Warum ist die gleiche Jeans im Modeladen teurer?",o:["Der Modeladen übernimmt Aufgaben – Auswahl, kurzer Weg, Beratung, Kürzen –, die Kosten verursachen.","Der Modeladen stellt die Jeans selbst her.","Der Staat schreibt den höheren Preis vor.","Im Outlet ist die Qualität immer schlechter.","Der Hersteller verlangt vom Modeladen weniger als vom Outlet."],k:0,x:"Die Aufgaben des Einzelhandels sind Leistungen. Wer sie nutzt, bezahlt sie mit. Wer sie nicht braucht, kann sparen – und erledigt sie selbst."}];
const ALLQ=[].concat(WARM.map(q=>Object.assign(q,{set:"warm"})),BLITZ.map(q=>Object.assign(q,{set:"blitz"})),QUIZ.map(q=>Object.assign(q,{set:"quiz"})));
const SETS={warm:[0,WARM.length],blitz:[WARM.length,WARM.length+BLITZ.length],quiz:[WARM.length+BLITZ.length,ALLQ.length]};
const PH_SET={1:"warm",4:"blitz",7:"quiz"};
const durOf=Q=>Q.set==="blitz"?20:Q.set==="warm"?25:Q.pro?45:30;
const PHASES=["Start","Ankommen","Outlet-Tour","Begriffe","Zuordnungs-Blitz","Online-Schock","Merken","Prüfungs-Check","Sieger"];

/* Merk-Inhalte (Tafel und Handy) */
function merkHtml(compact){
  return `<div class="merk">Der Einzelhandel steht zwischen Hersteller bzw. Großhandel und Verbraucher. Er versorgt die Verbraucher <span class="term">bedarfsgerecht</span> mit Waren und übernimmt dabei <span class="term">Aufgaben</span> <span class="alt">(Funktionen)</span>, die der Verbraucher sonst selbst erledigen müsste.</div>
  <div class="fgrid${compact?" c":""}">${FN.map((f,i)=>`<div class="fcard"><div class="fhead o${i}">${ICO[i]}<span>${f.t}${f.alt?`<small> (${f.alt})</small>`:""}</span></div>
    <div class="fbody"><b>${f.e}</b><br><span class="muted">Outlet-Tour: ${f.b}</span><br><span class="sig">Signalwort: ${f.sw}</span></div></div>`).join("")}</div>
  <div class="merk"><b>Prüfungsregel:</b> Die Hauptaufgabe des Einzelhandels ist, ein <span class="term">Sortiment</span> zusammenzustellen und an die Verbraucher zu <span class="term">verkaufen</span> – also ihren Bedarf zu befriedigen. Der Einzelhandel <b>stellt nichts her</b> und <b>plant keine Produktion</b>.</div>
  <div class="merk"><b>Satzbausteine:</b> Mein Betrieb übernimmt die Aufgabe …, indem er … · Ein Beispiel dafür ist … · Ohne meinen Betrieb müsste der Kunde …</div>`;}

</script>
<script>
/* =========================================================
   TAFEL (Lehrkraft, Beamer)
   ========================================================= */
function tafelApp(){
  $("tafel").hidden=false;
  const KEY="outlettour_tafel";
  const fresh=()=>({code:codeGen(),ph:0,pl:{},kick:[],url:"",q:-1,qOpen:false,qStart:0,qAns:{},cur:{warm:-1,blitz:-1,quiz:-1},
    ms:{tour:{},on:{}},ord:[],rev:0,s5:0,vote:{}});
  let T=store(KEY);if(!T||!T.code)T=fresh();
  let conn={up:0,all:2},pubT=null,subbed="";
  const net=new Net(onMsg,c=>{conn=c;if(c.up)pub();renderHead();});
  function sub(){if(subbed!==T.code){subbed=T.code;net.sub(T.code+"/in");}}
  sub();
  const save=()=>store(KEY,T);
  const players=()=>Object.keys(T.pl);

  function onMsg(t,p){
    if(t!==NS+T.code+"/in"||!p||!p.p)return;
    const pid=clean(p.p,12);if(T.kick.includes(pid))return;
    if(p.k==="hi"){const n=clean(p.n,16)||"?";if(!T.pl[pid])T.pl[pid]={n};else T.pl[pid].n=n;}
    else if(!T.pl[pid])return;
    else if(p.k==="m"&&((p.st==="tour"&&T.ph===2)||(p.st==="on"&&T.ph===5&&T.s5===1))&&Array.isArray(p.a)){
      const max=p.st==="tour"?STMT.length:FN.length;
      const a=[...new Set(p.a.filter(x=>Number.isInteger(x)&&x>=0&&x<max))];T.ms[p.st][pid]=a;}
    else if(p.k==="v"&&T.ph===5&&T.s5===0&&typeof p.y==="boolean"){T.vote[pid]=p.y;}
    else if(p.k==="a"&&T.qOpen&&p.q===T.q&&ALLQ[T.q]&&ALLQ[T.q].set===PH_SET[T.ph]){
      const A=(T.qAns[T.q]=T.qAns[T.q]||{});if(A[pid])return;
      const Q=ALLQ[T.q],c=p.c;if(!Number.isInteger(c)||c<0||c>=Q.o.length)return;
      const s=(Date.now()-T.qStart)/1000;
      A[pid]={c,g:c===Q.k&&Q.set!=="warm"?1000+Math.round(500*Math.max(0,1-s/durOf(Q))):0};
      if(Object.keys(A).length>=players().length)T.qOpen=false;}
    else return;
    save();pub();render();
  }

  /* ---------- Punkte ---------- */
  function points(pid){let s=0;for(const qi in T.qAns){if(+qi!==T.q||!T.qOpen){const a=T.qAns[qi][pid];if(a)s+=a.g;}}return s;}
  function ranking(){return players().map(id=>({id,n:T.pl[id].n,s:points(id)})).sort((a,b)=>b.s-a.s);}
  const tourCount=()=>{const c=STMT.map(()=>0);for(const id in T.ms.tour)for(const i of T.ms.tour[id])c[i]++;return c;};
  const onCount=()=>{const c=FN.map(()=>0);for(const id in T.ms.on)for(const i of T.ms.on[id])c[i]++;return c;};
  const voteRes=()=>{let y=0,n=0;for(const id in T.vote)T.vote[id]?y++:n++;return {y,n};};

  /* ---------- Zustand an alle Handys ---------- */
  function pub(){clearTimeout(pubT);pubT=setTimeout(()=>{
    const S={ph:T.ph,j:players(),kick:T.kick,q:T.q,qOpen:T.qOpen,ans:[],md:{tour:Object.keys(T.ms.tour),on:Object.keys(T.ms.on)},
      ord:T.ord,rev:T.rev,s5:T.s5,vd:Object.keys(T.vote)};
    if(T.ph===5&&T.s5===2){S.vr=voteRes();S.oc=onCount();}
    if(T.q>=0){S.ans=Object.keys(T.qAns[T.q]||{});S.rem=T.qOpen?Math.max(0,durOf(ALLQ[T.q])-(Date.now()-T.qStart)/1000):0;}
    const r=ranking();S.sc={};let rank=0,last=-1;
    r.forEach((x,i)=>{if(x.s!==last){rank=i+1;last=x.s;}const a=(T.qAns[T.q]||{})[x.id];S.sc[x.id]=[x.s,rank,T.qOpen?0:(a?a.g:0)];});S.np=r.length;
    net.pub(T.code+"/st",S,true);},120);}
  setInterval(pub,5000);

  function go(ph){T.ph=ph;T.qOpen=false;
    if(ph===3&&T.rev===0){const c=tourCount();T.ord=STMT.map((_,i)=>i).sort((a,b)=>c[b]-c[a]||a-b);}
    save();pub();render();}

  /* ---------- Kopfzeile ---------- */
  function joinUrl(){
    const extra=(params.get("broker")?"&broker="+encodeURIComponent(params.get("broker")):"")+(LOCAL?"&bc=1":"");
    if(location.protocol.startsWith("http"))return location.origin+location.pathname+"?s="+T.code+extra;
    if(T.url){const u=T.url.trim();return u+(u.includes("?")?"&":"?")+"s="+T.code+extra;}
    if(LOCAL)return location.href.split("?")[0]+"?s="+T.code+extra;return "";}
  function drawQR(canvas,text){
    const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(!text||typeof QRLib==="undefined"){ctx.fillStyle="#999";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText("keine Adresse",canvas.width/2,canvas.height/2);return;}
    const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();
    const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
    ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}
  function renderHead(){
    $("steps").innerHTML=PHASES.map((p,i)=>`<button data-ph="${i}" class="${i===T.ph?"on":""}">${i} ${p}</button>`).join("");
    $("steps").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.ph));
    $("miniCode").textContent="Code "+T.code;$("miniN").textContent=players().length+" dabei";
    $("conn").innerHTML=`<span class="dot ${conn.up?"on":""}"></span>${conn.up?"verbunden":"keine Verbindung"}`;
    drawQR($("qrSmall"),joinUrl());}
  function render(){renderHead();const M=$("tMain");
    [rStart,M=>rQuiz(M,"warm"),rTour,rBegriffe,M=>rQuiz(M,"blitz"),rOnline,rMerk,M=>rQuiz(M,"quiz"),rWin][T.ph](M);}
  const nextBtn=(ph,label)=>`<button class="pri" data-go="${ph}">${label} →</button>`;
  const bindGo=M=>M.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(+b.dataset.go));

  /* ---------- 0 Start ---------- */
  function rStart(M){
    const pl=Object.entries(T.pl);
    M.innerHTML=`<div class="join"><div><canvas id="qrBig" width="600" height="600"></canvas></div>
      <div><h2 class="big">Die Outlet-Tour</h2>
      <p style="font-size:1.25rem">Warum kauft ihr nicht alles direkt beim Hersteller? Das wäre doch billiger …</p>
      <p style="font-size:1.15rem">1. QR-Code mit dem Handy scannen.<br>2. Einen Spitznamen eingeben.<br>3. Warten, bis es losgeht.</p>
      <p class="muted">Code: <span class="code">${T.code}</span><br><span id="jU" style="word-break:break-all"></span></p>
      ${location.protocol.startsWith("http")||LOCAL?"":`<label>Internetadresse dieser Seite (nur nötig, wenn die Datei lokal geöffnet ist)<input id="tUrl" value="${h(T.url)}" placeholder="https://…/outlet-tour/"></label>`}
      <h3 style="margin-top:16px">${pl.length} dabei <span class="muted" style="font-size:.9rem;font-weight:400">· Antippen entfernt einen Namen</span></h3>
      <div class="nicks">${pl.map(([id,x])=>`<button data-id="${h(id)}">${h(x.n)}</button>`).join("")}</div>
      <div class="ctrl">${nextBtn(1,"Los: Ankommen")}<button id="bNew">Neue Sitzung (alles löschen)</button></div></div></div>`;
    drawQR($("qrBig"),joinUrl());$("jU").textContent=joinUrl();
    if($("tUrl"))$("tUrl").onchange=e=>{T.url=e.target.value;save();render();};
    M.querySelectorAll(".nicks button").forEach(b=>b.onclick=()=>{const id=b.dataset.id;delete T.pl[id];T.kick.push(id);
      delete T.ms.tour[id];delete T.ms.on[id];delete T.vote[id];save();pub();render();});
    bindGo(M);
    $("bNew").onclick=()=>{if(window.confirm("Neue Sitzung starten? Alle Namen und Ergebnisse werden gelöscht.")){const u=T.url;T=fresh();T.url=u;save();sub();pub();render();}};
  }

  /* ---------- 2 Outlet-Tour ---------- */
  function rTour(M){
    const n=Object.keys(T.ms.tour).length;
    M.innerHTML=`<h2 class="big">Die Outlet-Tour</h2>
      <div class="three">${STATIONS.map((s,i)=>`<div class="scen st${i}"><b>${s.t}</b>${h(s.x)}</div>`).join("")}</div>
      <div class="banner info"><b>Auf dem Handy:</b> Lies die drei Stationen. Dann tippe an: <b>Was übernimmt der Modeladen für Tom?</b> Lena muss das im Outlet selbst erledigen – oder sie verzichtet darauf.</div>
      <p class="big" style="margin-top:18px"><b>${n}</b> von ${players().length} haben abgeschickt</p>
      <div class="ctrl">${nextBtn(3,"Weiter: Begriffe")}</div>`;
    bindGo(M);
  }

  /* ---------- 3 Begriffe aus euren Antworten ---------- */
  function rBegriffe(M){
    const c=tourCount(),n=Math.max(1,Object.keys(T.ms.tour).length),ord=T.ord.length?T.ord:STMT.map((_,i)=>i);
    M.innerHTML=`<h2 class="big">Was der Modeladen für Tom übernimmt</h2>
      <p class="muted" style="font-size:1.1rem">Eure Antworten – sortiert nach Häufigkeit. Erst vermuten: Wie heißt diese Aufgabe im Buch? Dann aufdecken.</p>
      <div class="slist">${ord.map((i,j)=>{const s=STMT[i],open=j<T.rev;
        return `<div class="srow ${open?(s.f<0?"no":"yes"):""}"><div class="stxt">${h(s.t)}</div>
          <div class="sbar"><i style="width:${Math.round(100*c[i]/n)}%"></i><b>${c[i]}</b></div>
          <div class="sres">${!open?`<span class="muted">?</span>`:s.f<0?`<span class="nein">${h(s.w)}</span>`:`${fchip(s.f)}<span class="satz">Der Modeladen übernimmt ${FN[s.f].a} ${FN[s.f].t}, ${h(s.s)}</span>`}</div></div>`;}).join("")}</div>
      ${T.rev>=STMT.length?`<div class="banner ok">Der Modeladen übernimmt für Tom <b>sechs Aufgaben</b>. Lena muss sie im Outlet selbst erledigen – oder verzichten. Dafür spart sie 20 €.</div>`:""}
      <div class="ctrl">${T.rev<STMT.length?`<button class="pri" id="bRev">Aufdecken (${T.rev+1}/${STMT.length})</button><button id="bAll">Alle aufdecken</button>`:""}
        ${T.rev>0?`<button id="bBack">Zurück</button>`:""}${nextBtn(4,"Weiter: Zuordnungs-Blitz")}</div>`;
    const set=v=>{T.rev=v;save();pub();render();};
    if($("bRev"))$("bRev").onclick=()=>set(T.rev+1);
    if($("bAll"))$("bAll").onclick=()=>set(STMT.length);
    if($("bBack"))$("bBack").onclick=()=>set(T.rev-1);
    bindGo(M);
  }

  /* ---------- 5 Online-Schock ---------- */
  function rOnline(M){
    const nv=Object.keys(T.vote).length,no=Object.keys(T.ms.on).length;let body="";
    if(T.s5===0)body=`<p style="font-size:1.4rem">Erst vermuten: <b>Braucht man den Modeladen dann überhaupt noch?</b></p>
      <p class="big"><b>${nv}</b> von ${players().length} haben abgestimmt</p>
      <div class="ctrl"><button class="pri" id="b1">Weiter: Welche Aufgaben muss der Hersteller selbst übernehmen? →</button></div>`;
    else if(T.s5===1)body=`<p style="font-size:1.4rem">Auf dem Handy: <b>Welche Aufgaben des Einzelhandels muss der Hersteller jetzt selbst übernehmen?</b> Alle passenden antippen.</p>
      <p class="big"><b>${no}</b> von ${players().length} haben abgeschickt</p>
      <div class="ctrl"><button class="pri" id="b2">Auflösen</button></div>`;
    else{const c=onCount(),n=Math.max(1,no),v=voteRes();
      body=`<div class="two"><div>${FN.map((f,i)=>`<div class="obar ${ON_OK[i]?"yes":"no"}">${fchip(i,1)}<div class="sbar"><i style="width:${Math.round(100*c[i]/n)}%"></i><b>${c[i]}</b></div>
          <div class="ox"><b>${ON_OK[i]?"Ja – muss er selbst machen.":"Nein – das fehlt!"}</b> ${h(ON_X[i])}</div></div>`).join("")}</div>
        <div><div class="box"><h3>Eure Vermutung: Braucht man den Modeladen noch?</h3><p class="big">Ja: <b>${v.y}</b> · Nein: <b>${v.n}</b></p></div>
          <div class="merk" style="font-size:1.1rem"><b>Die Aufgaben verschwinden nicht.</b> Wenn der Händler wegfällt, muss der Hersteller sie selbst übernehmen – oder der Kunde. Nur die <span class="term">Sortimentsbildung</span> über viele Marken kann ein einzelner Hersteller nicht bieten.</div>
          <div class="merk"><b>Profi-Frage:</b> Wird der stationäre Einzelhandel überflüssig? Nenne ein Argument dafür und zwei dagegen.
          <details><summary>Lösungsidee</summary>Dafür: bequem, oft günstiger. Dagegen: viele Marken zum Vergleichen, persönliche Beratung, Anprobieren, Ware sofort mitnehmen. Der Handel verändert sich, wird aber nicht überflüssig.</details></div></div></div>
        <div class="ctrl">${nextBtn(6,"Weiter: Merken")}</div>`;}
    M.innerHTML=`<h2 class="big">Online-Schock</h2><div class="banner af" style="font-size:1.4rem">${h(ON_TXT)}</div>${body}
      <div class="ctrl" style="justify-content:flex-end">${T.s5>0?`<button id="b0">Schritt zurück</button>`:""}</div>`;
    const st=v=>{T.s5=v;save();pub();render();};
    if($("b1"))$("b1").onclick=()=>st(1);if($("b2"))$("b2").onclick=()=>st(2);if($("b0"))$("b0").onclick=()=>st(T.s5-1);
    bindGo(M);
  }

  /* ---------- 6 Merken ---------- */
  function rMerk(M){
    M.innerHTML=`<h2 class="big">Die Aufgaben des Einzelhandels <span class="muted" style="font-size:1rem">Buch S. 63</span></h2>${merkHtml(false)}
      <p class="muted">Weiter im Arbeitsblatt: Aufgabe 3 (Vorgemacht), Aufgabe 4 und 5.</p>
      <div class="ctrl">${nextBtn(7,"Weiter: Prüfungs-Check")}</div>`;
    bindGo(M);
  }

  /* ---------- 1/4/7 Fragen ---------- */
  function optHtml(Q,i,cls){return `<div class="${cls} o${i}">${Q.fn?ICO[i]:""}<span>${Q.fn?"":"ABCDEF"[i]+": "}${h(Q.o[i])}</span>`;}
  function rQuiz(M,set){
    const [a,b]=SETS[set],len=b-a,ci=T.cur[set];
    const INTRO={warm:["Ankommen","Zwei Fragen aus Modul 6. Hier gibt es noch keine Punkte – einfach aufwärmen."],
      blitz:["Zuordnungs-Blitz",`${len} Situationen. Welche Aufgabe erfüllt der Betrieb? Achtet auf die Signalwörter. Ab jetzt gibt es Punkte!`],
      quiz:["Prüfungs-Check",`${len} Fragen, fast alle Originalaufgaben der IHK. Die letzten beiden für Profis <span class="pro">Profi</span>. Richtig ist wichtiger als schnell.`]}[set];
    const NEXT={warm:[2,"Weiter: Outlet-Tour"],blitz:[5,"Weiter: Online-Schock"],quiz:[8,"Zur Siegerehrung"]}[set];
    if(ci<0){M.innerHTML=`<h2 class="big">${INTRO[0]}</h2><p style="font-size:1.25rem">${INTRO[1]}</p>
      ${set==="blitz"?`<div class="fgrid c">${FN.map((f,i)=>`<div class="fhead o${i}">${ICO[i]}<span>${f.t}<small><br>${f.sw}</small></span></div>`).join("")}</div>`:""}
      <div class="ctrl"><button class="pri" id="bQ">Erste Frage →</button>${nextBtn(NEXT[0],"Überspringen: "+NEXT[1].replace("Weiter: ",""))}</div>`;
      $("bQ").onclick=()=>openQ(set,0);bindGo(M);return;}
    const gi=a+ci,Q=ALLQ[gi],A=T.qAns[gi]||{},open=T.qOpen&&T.q===gi,cnt=Q.o.map((_,i)=>Object.values(A).filter(x=>x.c===i).length),n=Object.keys(A).length;
    M.innerHTML=`<div class="qhead"><div><p class="muted">${INTRO[0]} · Frage ${ci+1} von ${len}${Q.pro?' <span class="pro">Profi</span>':""} · ${n} von ${players().length} geantwortet</p>
      <h2 class="big">${Q.fn?"Welche Aufgabe? ":""}${h(Q.q)}</h2></div>${open?`<div class="timer" id="tm">${durOf(Q)}</div>`:""}</div>
      <div class="opts ${Q.fn?"six":""}">${Q.o.map((o,i)=>optHtml(Q,i,`opt ${!open&&i!==Q.k?"wrong":""}`)+(open?"":`<span class="cnt">${cnt[i]}</span>`)+`</div>`).join("")}</div>
      ${open?"":`<div class="merk" style="font-size:1.15rem;margin-top:14px">${h(Q.x)}</div>`}
      <div class="ctrl">${open?`<button class="pri" id="bR">Auflösen</button>`:ci<len-1?`<button class="pri" id="bN">Nächste Frage →</button>`:nextBtn(NEXT[0],NEXT[1])}
        ${!open&&ci<len-1?nextBtn(NEXT[0],NEXT[1]):""}</div>`;
    if($("bR"))$("bR").onclick=()=>{T.qOpen=false;save();pub();render();};
    if($("bN"))$("bN").onclick=()=>openQ(set,ci+1);
    bindGo(M);
    if(open){const dur=durOf(Q);clearInterval(window._qt);window._qt=setInterval(()=>{const s=Math.max(0,Math.ceil(dur-(Date.now()-T.qStart)/1000));if($("tm"))$("tm").textContent=s;
      if(s<=0&&T.qOpen){T.qOpen=false;save();pub();render();}if(!T.qOpen)clearInterval(window._qt);},250);}
  }
  function openQ(set,i){T.cur[set]=i;T.q=SETS[set][0]+i;T.qOpen=true;T.qStart=Date.now();save();pub();render();}

  /* ---------- 8 Sieger ---------- */
  function rWin(M){
    const r=ranking();
    M.innerHTML=`<h2 class="big">Siegerehrung</h2><p class="muted">Punkte aus Zuordnungs-Blitz und Prüfungs-Check</p>
      <div class="podium">${[1,0,2].filter(i=>r[i]).map(i=>`<div style="height:${[190,150,120][i]}px"><span>${i+1}.</span>${h(r[i].n)}<br>${r[i].s}</div>`).join("")}</div>
      <ol class="top" style="margin-top:14px;max-width:640px;margin-left:auto;margin-right:auto">${r.slice(3,10).map((x,i)=>`<li><span>${i+4}. ${h(x.n)}</span><b>${x.s}</b></li>`).join("")}</ol>`;
  }
  render();
}

<script>
/* =========================================================
   HANDY (Schülerinnen und Schüler)
   ========================================================= */
function phoneApp(){
  $("phone").hidden=false;
  const KEY="outlettour_p_"+roomCode+(params.get("t")||"");
  let me=store(KEY)||{};if(!me.pid){me.pid=rnd(8);store(KEY,me);}
  me.sel=me.sel||{tour:[],on:[]};me.ts=me.ts||0;
  let S=null,lastKey="",pending=null,qEnd=0,qSel={},vSel=null,conn={up:0};
  const keep=()=>store(KEY,me);
  const net=new Net((t,p)=>{if(t===NS+roomCode+"/st"&&p&&typeof p==="object")onState(p);},c=>{conn=c;if(c.up)hello();});
  net.sub(roomCode+"/st");
  const send=o=>{o.p=me.pid;net.pub(roomCode+"/in",o,false);};
  function hello(){if(me.nick)send({k:"hi",n:me.nick});}
  setInterval(()=>{if(!S)return;
    if(me.nick&&!(S.j||[]).includes(me.pid))hello();
    else if(pending&&pending.done&&!pending.done())send(pending.msg);},2500);
  function onState(p){
    if(p.qOpen&&(!S||!S.qOpen||S.q!==p.q))qEnd=Date.now()+p.rem*1000;
    S=p;
    if((S.kick||[]).includes(me.pid)&&me.nick){me={pid:rnd(8),sel:{tour:[],on:[]},ts:0};keep();lastKey="";}
    render();
  }
  const sent=st=>((S.md||{})[st]||[]).includes(me.pid);
  function keyOf(){if(!me.nick)return "join";if(!S)return "wait";
    return JSON.stringify([S.ph,S.q,S.qOpen,(S.ans||[]).includes(me.pid),S.sc?S.sc[me.pid]:0,S.rev,S.ord,S.s5,sent("tour"),sent("on"),(S.vd||[]).includes(me.pid),S.vr,S.oc]);}
  function render(force){const k=keyOf();if(k===lastKey&&!force)return;lastKey=k;const P=$("phone");
    const sc=(S&&S.sc&&S.sc[me.pid])||[0,"–",0];
    const top=`<div class="ph-top"><span>Outlet-Tour · ${roomCode}</span><span>${h(me.nick||"")}${S&&S.ph>=4?` · ${sc[0]} P.`:""}</span></div>`;
    if(!me.nick){P.innerHTML=top+`<h2>Willkommen zur Outlet-Tour!</h2><p>Gib einen Spitznamen ein.</p>
      <input id="nk" maxlength="16" placeholder="Spitzname" autocomplete="off"><div style="height:10px"></div><button class="pri" id="bJ" style="width:100%">Mitmachen</button>`;
      $("bJ").onclick=()=>{const n=clean($("nk").value,16);if(!n)return;me.nick=n;keep();hello();lastKey="";render();};return;}
    if(!S){P.innerHTML=top+`<p>Verbinde mit der Tafel …</p>`;return;}
    if(S.ph===0){P.innerHTML=top+`<h2>Du bist drin!</h2><p>Warte, bis es an der Tafel losgeht.</p>`;return;}
    if(PH_SET[S.ph])return rQuiz(P,top,PH_SET[S.ph]);
    if(S.ph===2)return rTour(P,top);
    if(S.ph===3)return rBegriffe(P,top);
    if(S.ph===5)return rOnline(P,top);
    if(S.ph===6){P.innerHTML=top+`<h2>Das merken wir uns</h2>${merkHtml(true)}`;return;}
    P.innerHTML=top+`<h2>Geschafft!</h2><div class="box"><div class="bigpts">Platz ${sc[1]}</div>${sc[0]} Punkte · ${S.np||"?"} haben mitgespielt</div><p>Danke fürs Mitmachen!</p>`;
  }
  const rer=()=>render(true);

  /* Mehrfachauswahl */
  function multi(P,st,items,ask){
    const sel=me.sel[st];
    P.insertAdjacentHTML("beforeend",`<h2>${ask}</h2><p class="muted">Alle passenden antippen, dann abschicken.</p>
      ${items.map((t,i)=>`<button class="mbtn ${sel.includes(i)?"sel":""}" data-i="${i}"><span class="box2">${sel.includes(i)?"✓":""}</span><span>${t}</span></button>`).join("")}
      <button class="pri" id="bSend" style="width:100%;margin-top:10px">Abschicken (${sel.length} gewählt)</button>`);
    P.querySelectorAll(".mbtn").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,a=me.sel[st];const j=a.indexOf(i);if(j<0)a.push(i);else a.splice(j,1);keep();rer();});
    $("bSend").onclick=()=>{const ph=S.ph;pending={msg:{k:"m",st,a:me.sel[st].slice()},done:()=>S.ph!==ph||sent(st)};send(pending.msg);me["sent_"+st]=1;keep();rer();};
  }

  /* ---------- 2 Outlet-Tour ---------- */
  function rTour(P,top){
    if(me.sent_tour){P.innerHTML=top+`<h2>Abgeschickt ${sent("tour")?"✓":"…"}</h2><p>Du hast ${me.sel.tour.length} Aussagen gewählt. Warte auf die Auswertung an der Tafel.</p>
      <div class="merk"><b>Profi-Zusatz:</b> Welche Aufgaben übernimmt ein Online-Händler wie Zalando – und welche nicht?</div>
      <button id="bChg">Auswahl ändern</button>`;$("bChg").onclick=()=>{me.sent_tour=0;keep();rer();};return;}
    rTourEdit(P,top);
  }
  function rTourEdit(P,top){
    if(me.ts<STATIONS.length){const s=STATIONS[me.ts];
      P.innerHTML=top+`<p class="muted">Station ${me.ts+1} von 3</p><div class="scen st${me.ts}" style="font-size:1.15rem"><b>${s.t}</b>${h(s.x)}</div>
        <div class="row" style="margin-top:12px">${me.ts>0?`<button id="bB">← zurück</button>`:""}<button class="pri" id="bF" style="flex:1">${me.ts<2?"Nächste Station →":"Weiter zur Frage →"}</button></div>`;
      $("bF").onclick=()=>{me.ts++;keep();rer();};if($("bB"))$("bB").onclick=()=>{me.ts--;keep();rer();};return;}
    P.innerHTML=top;
    multi(P,"tour",STMT.map(s=>h(s.t)),"Was übernimmt der Modeladen für Tom?");
    P.insertAdjacentHTML("beforeend",`<p><button id="bSt">Stationen noch einmal lesen</button></p>`);
    $("bSt").onclick=()=>{me.ts=0;keep();rer();};
  }

  /* ---------- 3 Begriffe ---------- */
  function rBegriffe(P,top){
    const ord=S.ord&&S.ord.length?S.ord:STMT.map((_,i)=>i),open=ord.slice(0,S.rev||0),mine=me.sel.tour;let ok=0;
    const rows=open.map(i=>{const s=STMT[i],chose=mine.includes(i),right=chose===(s.f>=0);if(right)ok++;
      return `<div class="prow ${right?"ok":"bad"}"><div><b>${right?"✓":"✗"}</b> ${h(s.t)} <span class="muted">(${chose?"gewählt":"nicht gewählt"})</span></div>
        ${s.f>=0?`${fchip(s.f,1)}<span class="satz">Der Modeladen übernimmt ${FN[s.f].a} ${FN[s.f].t}, ${h(s.s)}</span>`:`<span class="nein">${h(s.w)}</span>`}</div>`;}).join("");
    P.innerHTML=top+`<h2>Wie heißt das im Buch?</h2><p>Schau an die Tafel. Vermute zuerst – dann wird aufgedeckt.</p>
      ${open.length?`<div class="status">${ok} von ${open.length} richtig eingeschätzt</div>`:""}${rows}`;
  }

  /* ---------- 5 Online-Schock ---------- */
  function rOnline(P,top){
    const head=top+`<div class="banner af">${h(ON_TXT)}</div>`;
    if(S.s5===0){const done=(S.vd||[]).includes(me.pid);
      P.innerHTML=head+`<h2>Braucht man den Modeladen dann überhaupt noch?</h2>
        <div class="yn"><button class="y ${vSel===true?"sel":""}" data-y="1">Ja</button><button class="n ${vSel===false?"sel":""}" data-y="0">Nein</button></div>
        ${vSel!=null?`<div class="status ${done?"ok":""}">${done?"Gespeichert ✓":"Wird gesendet …"} Du kannst noch umentscheiden.</div>`:""}`;
      P.querySelectorAll(".yn button").forEach(b=>b.onclick=()=>{vSel=b.dataset.y==="1";pending={msg:{k:"v",y:vSel},done:()=>S.s5!==0||(S.vd||[]).includes(me.pid)};send(pending.msg);rer();});return;}
    if(S.s5===1){
      if(me.sent_on){P.innerHTML=head+`<h2>Abgeschickt ${sent("on")?"✓":"…"}</h2><p>Warte auf die Auflösung.</p>
        <div class="merk"><b>Profi-Frage:</b> Wird der stationäre Einzelhandel überflüssig? Überlege ein Argument dafür und zwei dagegen.</div>
        <button id="bChg">Auswahl ändern</button>`;$("bChg").onclick=()=>{me.sent_on=0;keep();rer();};return;}
      P.innerHTML=head;multi(P,"on",FN.map((f,i)=>fchip(i,1)),"Welche Aufgaben muss der Hersteller jetzt selbst übernehmen?");return;}
    const mine=me.sel.on;
    P.innerHTML=head+`<h2>Auflösung</h2>${FN.map((f,i)=>{const right=mine.includes(i)===ON_OK[i];
      return `<div class="prow ${right?"ok":"bad"}"><div><b>${right?"✓":"✗"}</b> ${fchip(i,1)} <span class="muted">(${mine.includes(i)?"gewählt":"nicht gewählt"})</span></div><span class="satz"><b>${ON_OK[i]?"Ja.":"Nein – das fehlt!"}</b> ${h(ON_X[i])}</span></div>`;}).join("")}
      <div class="merk">Die Aufgaben verschwinden nicht. Fällt der Händler weg, macht sie der Hersteller – oder der Kunde.</div>`;
  }

  /* ---------- 1/4/7 Fragen ---------- */
  function rQuiz(P,top,set){
    const [a,b]=SETS[set],sc=(S.sc&&S.sc[me.pid])||[0,"–",0];
    const name={warm:"Ankommen",blitz:"Zuordnungs-Blitz",quiz:"Prüfungs-Check"}[set];
    if(S.q<a||S.q>=b){P.innerHTML=top+`<h2>${name}</h2><p>Gleich geht es los. Lies jede Frage genau. Richtig ist wichtiger als schnell!</p>`;return;}
    const Q=ALLQ[S.q],nr=S.q-a+1,len=b-a,answered=(S.ans||[]).includes(me.pid);
    const label=i=>`${Q.fn?ICO[i]:""}<span>${Q.fn?"":"ABCDEF"[i]+": "}${h(Q.o[i])}</span>`;
    if(S.qOpen){
      if(answered||qSel[S.q]!=null){P.innerHTML=top+`<p class="muted">${name} · Frage ${nr}</p><h2>${h(Q.q)}</h2><div class="status ${answered?"ok":""}">${answered?"Antwort gespeichert ✓":"Wird gesendet …"} Warte auf die Auflösung.</div>
        ${Q.pz?`<div class="merk"><b>Profi-Zusatz:</b> ${h(Q.pz)}</div>`:""}`;return;}
      P.innerHTML=top+`<div class="row" style="justify-content:space-between"><span class="muted">${name} · Frage ${nr} von ${len}${Q.pro?' <span class="pro">Profi</span>':""}</span><b id="ptm"></b></div>
        <h2>${Q.fn?"Welche Aufgabe? ":""}${h(Q.q)}</h2>
        ${Q.o.map((o,i)=>`<button class="popt o${i}" data-i="${i}">${label(i)}</button>`).join("")}`;
      P.querySelectorAll(".popt").forEach(bt=>bt.onclick=()=>{const q=S.q;qSel[q]=+bt.dataset.i;pending={msg:{k:"a",q,c:+bt.dataset.i},done:()=>S.q!==q||!S.qOpen||(S.ans||[]).includes(me.pid)};send(pending.msg);rer();});
      const t=()=>{const s=Math.max(0,Math.ceil((qEnd-Date.now())/1000));if($("ptm"))$("ptm").textContent=s+" s";};t();clearInterval(window._pt);window._pt=setInterval(t,250);return;}
    const my=qSel[S.q],ok=my===Q.k;
    P.innerHTML=top+`<p class="muted">${name} · Frage ${nr} von ${len}</p>
      <div class="status ${my==null?"":ok?"ok":"bad"}">${my==null?"Keine Antwort.":ok?"<b>Richtig!</b>"+(set==="warm"?"":" +"+sc[2]+" Punkte"):"<b>Leider falsch.</b>"}</div>
      <p><b>Richtig: ${h(Q.o[Q.k])}</b><br>${h(Q.x)}</p>
      ${set==="warm"?"":`<div class="box"><div class="bigpts">${sc[0]} Punkte</div>Platz ${sc[1]} von ${S.np||"?"}</div>`}`;
  }
  render();
}
const roomCode=(params.get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
if(roomCode)phoneApp();else tafelApp();
</script>
<script>
/* =========================================================
   QUIZ-MUSIK v2 (Skill live-klassen-app) – eigene Kompositionen, live per WebAudio erzeugt,
   keine Musikdatei, keine Rechte Dritter. Jede Abfrage bekommt ein ANDERES Stück aus dem Pool
   (gemischt, nie zweimal hintereinander). Läuft nur auf der Tafel.
   Ablauf: Loop während der Frage · letzte 10 s schneller · Ticks in den letzten 5 s · Jingle beim Auflösen · Fanfare beim Sieger
   ========================================================= */
const MUSIK_POOL=[
  {name:"Spannung",bpm:124,fast:156,bass:[45,45,41,40],ch:[[69,72,76],[69,72,76],[65,69,72],[64,68,71]],ap:[0,1,2,1,0,2,1,2],arp:"square",kick:[0,4,8,12],snare:[4,12],hat:"off"},
  {name:"Funk",bpm:104,fast:132,swing:.16,bass:[40,40,43,45],bp:[0,3,6,8,10,11,14],bt:"sawtooth",ch:[[64,67,71,74],[64,67,71,74],[67,71,74,77],[69,72,76,79]],ap:[0,2,1,3],as:[2,6,10,13],ad:.07,arp:"sawtooth",kick:[0,6,8],snare:[4,12],hat:"all"},
  {name:"Marimba",bpm:116,fast:144,bass:[48,45,41,43],ch:[[72,76,79],[69,72,76],[65,69,72],[67,71,74]],ap:[0,1,2,1,2,1,0,1],ad:.22,arp:"sine",oct:1,kick:[0,8],snare:[],hat:"none",cl:[3,11]},
  {name:"Chiptune",bpm:144,fast:176,bass:[43,43,40,38],bt:"square",ch:[[67,71,74],[67,71,74],[64,67,71],[62,66,69]],ap:[0,1,2,3,2,1],arp:"square",oct:1,ad:.06,kick:[0,8],snare:[4,12],hat:"none"},
  {name:"Latin",bpm:112,fast:140,bass:[38,38,43,45],bp:[0,3,8,11],ch:[[62,65,69],[62,65,69],[67,70,74],[69,73,76]],ap:[0,2,1,2],as:[0,2,3,6,8,10,11,14],arp:"triangle",kick:[0,6,8,14],snare:[],hat:"off",cl:[0,3,6,10,12]},
  {name:"Jazz",bpm:132,fast:164,swing:.3,walk:1,bass:[41,38,43,36],bp:[0,4,8,12],ch:[[65,69,72,76],[62,65,69,72],[67,70,74,77],[60,64,67,70]],ap:[0,2,1,3],as:[0,6,10],ad:.18,arp:"triangle",kick:[],snare:[],hat:"jazz"},
  {name:"Synthwave",bpm:100,fast:128,bass:[47,43,38,45],bp:[0,2,4,6,8,10,12,14],bt:"sawtooth",ch:[[71,74,78],[67,71,74],[62,66,69],[69,73,76]],ap:[0,1,2,1],arp:"sawtooth",ad:.14,kick:[0,4,8,12],snare:[4,12],hat:"all"},
  {name:"Detektiv",bpm:92,fast:120,bass:[37,37,42,44],bp:[0,3,8,10],ch:[[61,64,68],[61,64,68],[66,69,73],[68,72,75]],ap:[0,1,2,1,2,0],as:[0,2,4,7,8,10,12,15],ad:.12,arp:"triangle",kick:[0],snare:[8],hat:"off"}
];
const Music=(()=>{
  const ls=(k,v)=>{try{if(v===undefined){const x=localStorage.getItem(k);return x==null?null:JSON.parse(x);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}};
  let ctx=null,master=null,timer=null,next=0,step=0,fast=false,nbuf=null,on=ls("quizmusik")!==false;
  let order=[],last=-1,S=MUSIK_POOL[0];
  const mf=m=>440*Math.pow(2,(m-69)/12),AV={square:.04,sawtooth:.03,triangle:.08,sine:.1};
  function pick(){if(!order.length){order=MUSIK_POOL.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
      if(order[0]===last&&order.length>1)order.push(order.shift());}
    last=order.shift();S=MUSIK_POOL[last];return last;}
  function init(){try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();
      master=ctx.createGain();master.gain.value=.24;master.connect(ctx.destination);}
    if(ctx.state==="suspended")ctx.resume();return true;}catch(e){return false;}}
  function tone(f,t,d,type,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
  function noise(t,d,v,hp){if(!nbuf){nbuf=ctx.createBuffer(1,ctx.sampleRate*.3,ctx.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nbuf;f.type="highpass";f.frequency.value=hp;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02);}
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.13);
    g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2);}
  function play(st,t){const bar=Math.floor(st/16)%S.bass.length,s=st%16,ch=S.ch[bar%S.ch.length];
    const bp=S.bp||[0,2,4,6,8,10,12,14];
    if(bp.includes(s)){const off=S.walk?[0,4,7,9][Math.floor(s/4)%4]:(s%4===0?0:12);tone(mf(S.bass[bar]+off),t,S.walk?.3:.16,S.bt||"triangle",S.bt==="sawtooth"?.12:S.bt==="square"?.1:.32);}
    if(!S.as||S.as.includes(s))tone(mf(ch[S.ap[s%S.ap.length]%ch.length]+12*(S.oct||0)+(fast?12:0)),t,S.ad||.09,S.arp,AV[S.arp]||.05);
    if(S.kick.includes(s))kick(t);
    if(S.snare.includes(s))noise(t,.12,.25,1800);
    if(S.cl&&S.cl.includes(s))tone(1250,t,.04,"sine",.18);
    const hat=S.hat;
    if(hat==="all"||fast||(hat==="off"&&s%2===1)||(hat==="jazz"&&(s%4===0||s%8===6)))noise(t,.03,.07,7000);}
  function sched(){const d=60/(fast?S.fast:S.bpm)/4;
    if(next<ctx.currentTime-.05)next=ctx.currentTime+.02;
    while(next<ctx.currentTime+.12){play(step,next+(step%2?d*(S.swing||0):0));next+=d;step++;}}
  const root=()=>S.ch[0][0]%12+60;
  return {
    pool:MUSIK_POOL,
    current(){return S.name;},
    unlock(){if(on)init();},
    isOn(){return on;},
    toggle(){on=!on;ls("quizmusik",on);if(!on)this.stop();return on;},
    start(){if(!on||timer||!init())return;pick();fast=false;step=0;next=ctx.currentTime+.06;timer=setInterval(sched,25);
      try{console.log("[Quiz-Musik] Stück",last,S.name);}catch(e){}},
    hurry(){fast=true;},
    tick(){if(!on||!init())return;tone(1760,ctx.currentTime,.06,"sine",.25);},
    stop(){clearInterval(timer);timer=null;fast=false;},
    reveal(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.03,r=root();
      [0,4,7].forEach((m,i)=>tone(mf(r+m),t+i*.09,.25,"square",.08));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+.3,.9,"triangle",.14));kick(t+.3);noise(t+.3,.25,.25,3000);},
    fanfare(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.05,r=60;
      [[-5,0],[0,.15],[4,.3],[7,.45],[4,.7],[7,.85]].forEach(([m,d])=>tone(mf(r+m),t+d,.22,"square",.09));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+1.05,1.6,"triangle",.15));[0,.45,1.05].forEach(d=>kick(t+d));noise(t+1.05,.5,.3,2500);}
  };})();
/* Quiz-Musik automatisch an die Tafel koppeln: Timer #tm sichtbar = Abfrage läuft (Quiz, Prüfungs-Check, Abstimmung) */
(function MusicAuto(){
  if(new URLSearchParams(location.search).get("s"))return;
  const tf=document.getElementById("tafel"),st=document.getElementById("steps");
  let was=false,lastS=-1,pod=false;
  function btn(){if(!st||document.getElementById("bMus"))return;const b=document.createElement("button");b.id="bMus";b.type="button";
    b.title="Quiz-Musik an oder aus";b.style.cssText="padding:.25em .7em;font-weight:700;border-radius:999px;white-space:nowrap";
    b.onclick=()=>{Music.toggle();if(Music.isOn()&&was)Music.start();lab();};st.after(b);lab();}
  function lab(){const b=document.getElementById("bMus");if(b)b.textContent=Music.isOn()?"Musik: an":"Musik: aus";}
  document.addEventListener("pointerdown",()=>Music.unlock(),true);
  btn();
  setInterval(()=>{if(!tf||tf.hidden)return;btn();
    const tm=document.getElementById("tm"),vis=!!(tm&&tm.offsetParent!==null);
    if(vis){if(!was){was=true;lastS=-1;Music.start();}
      const s=parseInt(tm.textContent,10);if(!isNaN(s)&&s!==lastS){lastS=s;if(s<=10&&s>0)Music.hurry();if(s<=5&&s>0)Music.tick();}}
    else if(was){was=false;Music.reveal();}
    const p=document.querySelector("#tMain .podium"),pv=!!(p&&p.offsetParent!==null);
    if(pv&&!pod){pod=true;Music.fanfare();}if(!pv)pod=false;
  },200);
})();
