<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akte Nordstadt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Atkinson+Hyperlegible:wght@400;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: eine Spalte wie eine Ermittlungsakte – oben Statusleiste, darunter Pinnwand-Szene, darunter die aktuelle Akte im Aktendeckel */
:root{
  --bg:#e4ebf0; --surface:#fbfcfd; --surface2:#eef3f6; --ink:#172636; --muted:#4b5c6c; --line:#c3cfd8;
  --navy:#1f4767; --on-navy:#ffffff; --manila:#efd9a0; --manila2:#e3c77f; --on-manila:#3a2b06;
  --stamp:#bf3328; --evid:#1f7a4b; --signal:#ffe066; --on-signal:#2b2300; --opbg:#cfe3f5; --on-op:#0f2d47;
  --good:#1f7a4b; --bad:#bf3328; --mid:#9a6a00; --good-bg:#def2e6; --bad-bg:#fbe2df; --mid-bg:#faefd2;
  --display:"Alfa Slab One","Rockwell","Georgia",serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Courier Prime","Courier New",ui-monospace,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1620; --surface:#15212d; --surface2:#1b2a38; --ink:#e3ebf2; --muted:#a2b3c3; --line:#2e4152;
  --navy:#78b0dc; --on-navy:#07131d; --manila:#c9ae68; --manila2:#b39550; --on-manila:#1f1602;
  --stamp:#f2806f; --evid:#62cf92; --signal:#e9c84a; --on-signal:#211a00; --opbg:#1f3b55; --on-op:#d8ebfb;
  --good:#62cf92; --bad:#f2806f; --mid:#e9c25a; --good-bg:#16352a; --bad-bg:#41211d; --mid-bg:#3a3018; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1620; --surface:#15212d; --surface2:#1b2a38; --ink:#e3ebf2; --muted:#a2b3c3; --line:#2e4152;
  --navy:#78b0dc; --on-navy:#07131d; --manila:#c9ae68; --manila2:#b39550; --on-manila:#1f1602;
  --stamp:#f2806f; --evid:#62cf92; --signal:#e9c84a; --on-signal:#211a00; --opbg:#1f3b55; --on-op:#d8ebfb;
  --good:#62cf92; --bad:#f2806f; --mid:#e9c25a; --good-bg:#16352a; --bad-bg:#41211d; --mid-bg:#3a3018; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.12;text-wrap:balance;margin:0}
h1{font-size:clamp(2.2rem,8vw,3.4rem);letter-spacing:.01em}
h2{font-size:clamp(1.35rem,4.6vw,1.8rem)}
h3{font-size:1.15rem}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.small{font-size:.9rem}

/* Statusleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:8px 16px 6px;background:var(--surface);border-bottom:2px solid var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:1.15rem;display:flex;align-items:center;gap:6px;white-space:nowrap}
.brand svg{width:26px;height:26px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);font-weight:700;font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.pts{background:var(--navy);color:var(--on-navy);border-color:transparent}
.pill.alarm{border-color:var(--stamp);color:var(--stamp)}
.pill svg{width:14px;height:14px}
.iconbtn{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);background:var(--surface2);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.85rem;cursor:pointer;min-height:32px}
.iconbtn svg{width:16px;height:16px}
.iconbtn[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:transparent}
.steps{display:flex;gap:3px;width:100%}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.ok{background:var(--evid)}
.steps i.no{background:var(--stamp)}
.steps i.mini{background:var(--navy);opacity:.55}
.steps i.now{background:var(--signal);outline:1.5px solid var(--ink)}

main{padding-top:16px;display:grid;gap:16px;overflow-x:clip;overflow-clip-margin:10px}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:18px;box-shadow:4px 4px 0 var(--ink);min-width:0}
.eyebrow{font-family:var(--mono);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--navy)}
.lead{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:12px}
.btn{border:2px solid var(--ink);background:var(--navy);color:var(--on-navy);font-weight:700;font-size:1.05rem;padding:12px 20px;border-radius:12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s;min-height:48px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.sig{background:var(--signal);color:var(--on-signal)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}

/* Szene */
.scene{border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;background:#1d3a52;box-shadow:4px 4px 0 var(--ink)}
.scene svg{display:block;width:100%;height:auto}

/* Akte */
.akte{position:relative;background:var(--manila);color:var(--on-manila);border:2px solid var(--ink);border-radius:4px 14px 14px 14px;padding:18px;box-shadow:4px 4px 0 var(--ink);margin-top:22px;min-width:0}
.akte::before{content:attr(data-tab);position:absolute;left:-2px;top:-26px;height:26px;padding:3px 14px 0;background:var(--manila2);border:2px solid var(--ink);border-bottom:none;border-radius:10px 10px 0 0;font-family:var(--mono);font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
.akte h2{color:var(--on-manila)}
.akte .story{font-size:1.05rem}
.sheet{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink);border-radius:10px;padding:14px;min-width:0}
.q{font-weight:700;font-size:1.1rem;line-height:1.55}
.q .w{border-radius:4px;padding:0 1px}
.q button.w{border:none;background:none;padding:0 2px;cursor:pointer;font-weight:700;border-bottom:2px dotted var(--line)}
.q button.w.on{background:var(--signal);color:var(--on-signal);border-bottom-color:transparent}
.hl-op{background:var(--opbg);color:var(--on-op);border-radius:4px;padding:0 3px}
.hl-sig{background:var(--signal);color:var(--on-signal);border-radius:4px;padding:0 3px}
.q .miss{outline:2px dashed var(--stamp);outline-offset:1px}
.q .wrongtap{text-decoration:line-through;text-decoration-color:var(--stamp)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.85rem}
.persona-mini{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center}
.persona-mini svg{width:52px;height:52px}

.opts{display:grid;gap:10px}
.opt{position:relative;text-align:left;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;min-height:52px;min-width:0}
.opt:hover:not([disabled]){border-color:var(--navy)}
.opt .k{font-family:var(--mono);font-weight:700;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--surface);border:1.5px solid var(--line)}
.opt.sel{border-color:var(--navy);background:var(--surface);box-shadow:0 0 0 3px var(--navy) inset}
.opt.sel .k{background:var(--navy);color:var(--on-navy);border-color:transparent}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.inp{font:inherit;font-family:var(--mono);font-size:1.25rem;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%;max-width:260px}
.inp:focus{border-color:var(--navy);outline:none}

.bet{display:grid;gap:6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.chip small{font-weight:400;opacity:.85}

.stamp{position:absolute;right:12px;top:-20px;font-family:var(--display);font-size:1.2rem;letter-spacing:.06em;padding:2px 12px;border:4px solid currentColor;border-radius:8px;transform:rotate(-8deg);opacity:.92;pointer-events:none;background:color-mix(in srgb,var(--manila) 70%,transparent)}
.stamp.ok{color:var(--good)} .stamp.no{color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.stamp{animation:thump .35s ease-out}}
@keyframes thump{0%{transform:rotate(-8deg) scale(2.2);opacity:0}70%{transform:rotate(-8deg) scale(.95);opacity:1}100%{transform:rotate(-8deg) scale(1)}}

.react{display:grid;grid-template-columns:68px 1fr;gap:12px;align-items:center;border-radius:12px;padding:12px;border:2px solid var(--line);background:var(--surface2)}
.react svg{width:68px;height:68px}
.bubble{font-weight:700;font-size:1.08rem;line-height:1.3}
.term{border-left:6px solid var(--navy);padding:10px 12px;background:var(--surface2);border-radius:0 10px 10px 0}
.term b{color:var(--navy)}
.clue{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;border:2px dashed var(--evid);background:var(--good-bg)}
.clue svg{width:40px;height:40px}
.warn{padding:10px 12px;border-radius:10px;border:2px dashed var(--stamp);background:var(--bad-bg)}
.joker{padding:10px 12px;border-radius:10px;border:2px solid var(--navy);background:var(--surface2)}

/* Start */
.hero{display:grid;gap:14px}
.field{display:grid;gap:4px}
.field label{font-weight:700;font-size:.95rem}
.field input{padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-size:1.05rem}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{text-align:left;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:4px;min-width:0}
.mode.sel{border-color:var(--navy);box-shadow:0 0 0 3px var(--navy) inset;background:var(--surface)}
.mode[disabled]{opacity:.55;cursor:not-allowed}
.mode .t{font-family:var(--display);font-size:1.25rem}
.lock{font-size:.85rem;font-weight:700;color:var(--stamp)}

/* Personenkarte */
.flipwrap{perspective:900px;max-width:340px;margin:0 auto;width:100%}
.flip{position:relative;transform-style:preserve-3d;transition:transform .7s;min-height:300px}
.flip.turned{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--ink);border-radius:var(--r);box-shadow:4px 4px 0 var(--ink);display:grid;place-items:center;padding:16px}
.face.front{background:var(--navy);color:var(--on-navy)}
.face.back{background:var(--surface);transform:rotateY(180deg);align-content:start;gap:8px;justify-items:center;text-align:center}
.face.back svg.pf{width:120px;height:120px}
.facts{display:grid;gap:4px;width:100%;text-align:left;font-size:.95rem}
.facts div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-bottom:2px}
.facts b{text-align:right}

/* Mini-Spiele */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat{border:2px solid var(--ink);background:var(--surface2);border-radius:12px;padding:12px 8px;font-weight:700;cursor:pointer;min-height:56px;display:grid;gap:2px;justify-items:center;text-align:center}
.cat small{font-weight:400;color:var(--muted);font-size:.8rem}
.cat[disabled]{cursor:default;opacity:.6}
.cat.right{background:var(--good-bg);border-color:var(--good);opacity:1}
.cat.wrong{background:var(--bad-bg);border-color:var(--bad);opacity:1}
.item{font-size:1.15rem;font-weight:700;padding:14px;border:2px dashed var(--ink);border-radius:12px;background:var(--surface);text-align:center}
.timer{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.timer.low{color:var(--stamp)}
.contract{border:2px solid var(--ink);border-radius:8px;background:var(--surface);overflow:hidden}
.contract h3{font-family:var(--mono);font-weight:700;text-align:center;padding:10px;border-bottom:2px solid var(--ink);font-size:1rem;letter-spacing:.04em}
.crow{display:grid;grid-template-columns:minmax(0,9.5em) minmax(0,1fr);gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;width:100%;background:none;border-left:none;border-right:none;border-top:none;cursor:pointer;font-size:.97rem}
.crow:last-child{border-bottom:none}
.crow .lab{overflow-wrap:anywhere;font-family:var(--mono);font-weight:700;font-size:.85rem;color:var(--muted)}
.crow.flag{background:var(--mid-bg);box-shadow:inset 5px 0 0 var(--mid)}
.crow.found{background:var(--good-bg);box-shadow:inset 5px 0 0 var(--good)}
.crow.missed{background:var(--bad-bg);box-shadow:inset 5px 0 0 var(--bad)}
.crow.false{background:var(--mid-bg);box-shadow:inset 5px 0 0 var(--mid)}
.crow .why{grid-column:1/-1;font-size:.9rem;font-weight:700}
.crow[disabled]{cursor:default}
.calc{display:grid;gap:10px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--surface2)}

/* Finale */
.suspects{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.sus{text-align:left;border:2px solid var(--ink);background:var(--surface);border-radius:12px;padding:12px;cursor:pointer;display:grid;gap:6px;min-width:0}
.sus svg{width:76px;height:76px}
.sus.sel{box-shadow:0 0 0 4px var(--stamp) inset}
.sus.out{opacity:.5}
.sus ul{margin:0;padding-left:18px;font-size:.92rem}
.cluelist{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.cluelist li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;padding:8px 10px;background:var(--surface2);border-radius:8px;border:1.5px solid var(--line)}
.cluelist li span.n{font-family:var(--mono);font-weight:700;color:var(--evid)}

/* Auswertung */
.scorecard{background:var(--navy);color:var(--on-navy);border:2px solid var(--ink);border-radius:var(--r);padding:20px;box-shadow:4px 4px 0 var(--ink);display:grid;gap:10px;text-align:center}
.scorecard .big{font-family:var(--display);font-size:clamp(2.6rem,12vw,4rem);line-height:1;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:38px;height:38px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface2);border:1.5px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:2px}
.kpi b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:8px}
.barrow{display:grid;grid-template-columns:minmax(0,8.5em) 1fr 3.2em;gap:8px;align-items:center;font-size:.92rem}
.track{height:14px;border-radius:7px;background:var(--surface2);border:1.5px solid var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--evid)}
.track i.lowv{background:var(--stamp)}
.track i.midv{background:var(--mid)}
.review{display:grid;gap:10px}
.rv{border:2px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;background:var(--surface)}
.rv.ok{border-left:8px solid var(--good)} .rv.no{border-left:8px solid var(--bad)}
.rv .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rv .mark{font-family:var(--display);font-size:1.2rem}
.rv .ihk{font-size:.95rem;background:var(--surface2);border-radius:8px;padding:8px 10px}
.rv .ihk b{color:var(--navy)}
details{border:2px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--surface)}
details summary{cursor:pointer;font-weight:700}
.gloss{display:grid;gap:8px;margin-top:10px}
.gloss div{border-bottom:1px dashed var(--line);padding-bottom:6px}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,20,30,.55);display:grid;place-items:center;padding:16px}
.overlay .card{max-width:560px;width:100%;max-height:85vh;overflow:auto}
.note{font-size:.85rem;color:var(--muted)}
@media (max-width:480px){
  .card,.akte{padding:14px}
  .cats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .crow{grid-template-columns:minmax(0,1fr)}
  .barrow{grid-template-columns:minmax(0,6.5em) 1fr 3em}
}
</style>

<script>
/* ===================== DATEN ===================== */
const AREAS={
  op:{name:"Operatoren",short:"Op",mod:"Einschub Operatoren"},

};
/* Reihenfolge der 8 Akten = Zeitleiste der Ausbildung */
const SLOTS=[
  {a:"m1",when:"1. Tag"},
  {a:"m2",when:"Vertragsunterschrift"},
  {a:"op",when:"1. Berufsschultag"},
  {a:"m3",when:"Woche 3"},

  {a:"m4p",when:"Monat 3"},
  {a:"m4k",when:"Monat 7"},
  {a:"m5",when:"Ende des 1. Jahres"}
];

const PERSONAS=[
  {n:"Emre Yilmaz",a:16,g:"m",vb:"Hauptschulabschluss",verk:false,start:[2026,8,1],skin:"#c99a6e",hair:"#1f1712",hs:"short",shirt:"#2f6f9f"},
  {n:"Lena Kowalski",a:17,g:"w",vb:"Realschulabschluss",verk:false,start:[2026,8,1],skin:"#f1c9a5",hair:"#c58b3c",hs:"long",shirt:"#c0504d"},
  {n:"Sara Becker",a:19,g:"w",vb:"Abitur",verk:true,start:[2026,9,1],skin:"#e8b98f",hair:"#3a2516",hs:"bun",shirt:"#3b8a6e"},
  {n:"Mia Hoffmann",a:17,g:"w",vb:"Hauptschulabschluss",verk:false,start:[2026,8,15],skin:"#f3d2b5",hair:"#5a3a22",hs:"pony",shirt:"#7a4fa0"},
  {n:"Kofi Mensah",a:21,g:"m",vb:"Ausbildung zum Fachlageristen",verk:true,start:[2026,10,1],skin:"#7a4b2a",hair:"#120c08",hs:"curly",shirt:"#d08a2c"},
  {n:"Jonas Petersen",a:18,g:"m",vb:"Realschulabschluss",verk:false,start:[2026,9,15],skin:"#f0c8a8",hair:"#d9b56a",hs:"short",shirt:"#3d5a80"}
];

/* Hilfen für Datumsrechnung (UTC, ohne Sommerzeit-Probleme) */
const D=(y,m,d)=>new Date(Date.UTC(y,m-1,d));
const fd=(dt)=>String(dt.getUTCDate()).padStart(2,"0")+"."+String(dt.getUTCMonth()+1).padStart(2,"0")+"."+dt.getUTCFullYear();
const addDays=(dt,n)=>new Date(dt.getTime()+n*864e5);
const probEnde=(s,months)=>D(s[0],s[1]+months,s[2]-1);
const eur=(x)=>x.toLocaleString("de-DE",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";

/* Pflichten für die parametrische Akte */
const PFLICHTEN=[
  ["Werkzeuge und Kasse pfleglich behandeln","Azubi"],["den Ausbildungsnachweis regelmäßig durchsehen","Betrieb"],

{a:"m4p",id:"m4-ende",type:"date",t:"Wann endet die Probezeit?",s:"",
 make:(p,R)=>{const m=R.pick([2,3,4]);const e=probEnde(p.start,m);const s=D(p.start[0],p.start[1],p.start[2]);
  const cand=[addDays(e,1),probEnde(p.start,m+1),probEnde(p.start,m-1),addDays(e,-1)].map(fd);
  const wrong=[...new Set(cand)].filter(x=>x!==fd(e)).map(x=>({x}));wrong.forEach(w=>w.toString=function(){return this.x});
  return{s:`{N} beginnt die Ausbildung am ${fd(s)}. Im Vertrag steht eine Probezeit von ${m} Monaten. Der Saboteur will {N} am Tag nach der Probezeit noch „schnell ohne Grund“ kündigen.`,
  qb:`Mit Ablauf welchen Tages [[endet]] die Probezeit?`,qp:`{{Tragen Sie}} das Datum ein, mit dessen Ablauf die Probezeit [[endet]] (TT.MM.JJJJ)!`,
  date:fd(e),o:[[fd(e),1,`${m} Monate ab dem ${fd(s)}: Die Probezeit endet mit Ablauf des ${fd(e)}.`]].concat(wrong.slice(0,2).map(x=>[x.x,0,`Nicht ganz: Die Probezeit endet mit Ablauf des ${fd(e)}.`])),
  ihk:`Beginn ${fd(s)} + ${m} Monate → endet mit Ablauf des ${fd(e)}.`}},
 f:["Probezeit berechnen","Beginnt die Ausbildung am Ersten, endet die Probezeit am letzten Tag des letzten Monats. Mitten im Monat: am Tag davor."],
 src:"Lehrbuch S. 18 · Modul 4, Aufgabe 2 und 3",hint:"Beginn am 1.? Ende am Monatsletzten. Beginn am 15.? Ende am 14."},

 make:(p,R)=>{const v=R.int(10,18)*5,w=R.int(8,18)*5,s=R.int(10,19)*5,f=R.int(10,19)*5;const tot=Math.round((v*.25+w*.15+s*.10+f*.5)*100)/100;

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function inst(card,p,R,mode){
  const b=Object.assign({},card);if(card.make)Object.assign(b,card.make(p,R));
  let type=b.type||"mc";
  if(mode==="b"&&(type==="num"||type==="date"))type="mc";
  const q=mode==="p"?(b.qp||b.qb):(b.qb||b.qp);
  let opts=[],steps=null;
  if(type==="order"){steps=b.steps.map((t,i)=>({t:fill(t,p),i}));R.shuffle(steps)}
  else if(b.o){
    let all=b.o.map(o=>({t:o[0],ok:!!o[1],why:o[2],p:o[3]==="p"}));
    if(mode==="b"){
      const right=all.filter(o=>o.ok),wrong=R.shuffle(all.filter(o=>!o.ok&&!o.p));
      let pick=right.concat(wrong.slice(0,Math.max(0,3-right.length)));
      if(pick.length<3)pick=pick.concat(R.shuffle(all.filter(o=>!o.ok&&o.p)).slice(0,3-pick.length));
      opts=b.noshuffle?all.filter(o=>pick.includes(o)):R.shuffle(pick);
    }else{opts=b.noshuffle?all.slice(0,5):R.shuffle(all.slice(0,5))}
    opts=opts.map(o=>({t:fill(o.t,p),ok:o.ok,why:fill(o.why,p)}));
  }
  return{id:b.id,a:b.a,t:fill(b.t,p),s:fill(b.s,p),q:fill(q,p),type,opts,steps,date:b.date||null,num:b.num??null,unit:b.unit||"",sol:fill(b.sol||"",p),
    f:[fill(b.f[0],p),fill(b.f[1],p)],ihk:fill(b.ihk,p),src:b.src,hint:fill(b.hint,p)};
}

    if(k===1&&mode==="p"){const w=R.pick([6,7]);ill=w;end=addDays(end,w*7)}
    const s=D(st[0],st[1],st[2]);
    const wrong=[addDays(probEnde(st,m),1),D(st[0],st[1]+m,st[2]),probEnde(st,m+1)].filter(x=>fd(x)!==fd(end)).map(fd);
    const opts=R.shuffle([fd(end)].concat([...new Set(wrong)].slice(0,2)));
    const who=k===0?p.n.split(" ")[0]:R.pick(["Ali","Nele","Can","Jana","Tom"]);
    tasks.push({who,start:fd(s),m,ill,ans:fd(end),opts,base:fd(probEnde(st,m))});
  }
  return{tasks,i:0,res:[],fb:null,time:mode==="p"?150:null};
}

function parseQ(q){const segs=[];const re=/\{\{(.+?)\}\}|\[\[(.+?)\]\]/g;let last=0,m,g=0;
  while((m=re.exec(q))){if(m.index>last)segs.push({t:q.slice(last,m.index),k:null});segs.push({t:m[1]||m[2],k:m[1]?"op":"sig",g:g++});last=re.lastIndex}
  if(last<q.length)segs.push({t:q.slice(last),k:null});return{segs,groups:g}}
function qWords(q){const{segs}=parseQ(q);const words=[];segs.forEach(s=>{s.t.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){words.push({sp:w});return}if(!s.k&&/^[^0-9A-Za-zÄÖÜäöüß]+$/.test(w)){words.push({sp:w});return}words.push({t:w,k:s.k,g:s.g})})});return words}
function qHTML(q,mode,cur){
  if(mode==="b"||!cur||cur.phase!=="mark"&&!cur.mark){const{segs}=parseQ(q);return segs.map(s=>s.k?`<span class="hl-${s.k}">${esc(s.t)}</span>`:esc(s.t)).join("")}
  const words=qWords(q);let idx=0;
  if(cur.phase==="mark")return words.map(w=>{if(w.sp)return w.sp;const i=idx++;return`<button type="button" class="w ${cur.taps.includes(i)?"on":""}" data-act="tap" data-w="${i}">${esc(w.t)}</button>`}).join("");
  // nach dem Markieren: Auflösung
  const found=new Set();words.filter(w=>!w.sp).forEach((w,i)=>{if(cur.taps.includes(i)&&w.k)found.add(w.g)});
  return words.map(w=>{if(w.sp)return w.sp;const i=idx++;let c="";if(w.k){c="hl-"+w.k+(found.has(w.g)?"":" miss")}else if(cur.taps.includes(i))c="wrongtap";return c?`<span class="${c}">${esc(w.t)}</span>`:esc(w.t)}).join("");
}

       ${cur.joker?`<div class="joker small"><b>Buch-Joker:</b> ${esc(c.hint)}<br><span class="muted">Nachlesen: ${esc(c.src)}</span><br><span class="muted">Mit Joker zählt nur „unsicher“.</span></div>`:S.joker>0?`<button class="btn ghost" data-act="joker" type="button">${ICON.book.replace('viewBox','style="width:18px;height:18px;vertical-align:-3px" viewBox')} Buch-Joker (${S.joker} übrig)</button>`:`<p class="small muted">Keine Joker mehr.</p>`}

function canLock(c,cur){if(!cur.bet)return false;
  if(c.type==="mc")return cur.sel.length===1;if(c.type==="multi")return cur.sel.length===2;
  if(c.type==="order")return cur.order.length===c.steps.length;
  if(c.type==="date")return /^\s*\d{1,2}\.\d{1,2}\.(\d{2}|\d{4})\s*$/.test(cur.input);
  if(c.type==="num")return /\d/.test(cur.input);return false}
function normDate(s){const m=s.trim().match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})$/);if(!m)return"";let y=m[3];if(y.length===2)y="20"+y;return m[1].padStart(2,"0")+"."+m[2].padStart(2,"0")+"."+y}
function judge(c,cur){
  if(c.type==="mc")return c.opts[cur.sel[0]].ok;
  if(c.type==="multi")return cur.sel.every(i=>c.opts[i].ok)&&cur.sel.length===2;
  if(c.type==="order")return cur.order.every((si,k)=>c.steps[si].i===k);
  if(c.type==="date")return normDate(cur.input)===c.date;
  if(c.type==="num"){const v=parseFloat(cur.input.replace(/\s|€/g,"").replace(/\.(?=\d{3}\b)/g,"").replace(",","."));return Math.abs(v-c.num)<0.015}
}
function lockAkte(){const st=FLOW[S.step];const c=curCard(),cur=S.cur;const ok=judge(c,cur);
  const bet=cur.joker?1:cur.bet;let pts=ok?10+5*(bet-1):-5*(bet-1);if(st.k==="wdh")pts=ok?5+5*(bet-1):-5*(bet-1);
  if(cur.mark)pts+=cur.mark.pts;
  let clue=null;if(ok){clue=giveClue()}else{S.alarm=Math.min(5,S.alarm+1)}
  S.pts+=pts;cur.done=true;cur.res={ok,pts,bet,clue};
  const rec={id:c.id,a:c.a,ok,bet,joker:cur.joker,pts,sel:cur.sel.slice(),order:cur.order.slice(),input:cur.input,wdh:st.k==="wdh"};
  if(st.k==="akte")S.ans[st.i]=rec;else S.wdh.res=rec;

function giveClue(){if(S.clues>=S.cluelist.length)return null;const c=S.cluelist[S.clues];S.clues++;return c}

  const stars=q>=.8?3:q>=.6?2:1;
  const sure=ak.filter(r=>r.bet===3),sureOk=sure.filter(r=>r.ok).length;
  const per={};Object.keys(AREAS).forEach(a=>per[a]={n:0,ok:0});ak.forEach(r=>{per[r.a].n++;if(r.ok)per[r.a].ok++});
  per.m1.n+=W.items.length;per.m1.ok+=whoOk;per.m2.n+=V.n;per.m2.ok+=vOk;per.m4p.n+=C.tasks.length;per.m4p.ok+=cOk;
  if(S.wdh&&S.wdh.res){per[S.wdh.card.a].n++;if(S.wdh.res.ok)per[S.wdh.card.a].ok++}
  return{okA,whoOk,vOk,cOk,q,stars,sure:sure.length,sureOk,per,good,tot}}
function optText(c,r){if(c.type==="mc"||c.type==="multi")return r.sel.map(i=>c.opts[i].t).join(" + ");if(c.type==="order")return r.order.map(i=>i+1).join(" → ")+" (eure Reihenfolge)";return r.input}
function rightText(c){if(c.type==="mc"||c.type==="multi")return c.opts.filter(o=>o.ok).map(o=>o.t).join(" + ");if(c.type==="order")return c.steps.slice().sort((a,b)=>a.i-b.i).map(s=>s.t).join(" → ");if(c.type==="date")return c.date;return c.sol||String(c.num).replace(".",",")}
function whyText(c,r){if(c.type==="mc"){const o=c.opts[r.sel[0]];return o.why}if(c.type==="multi")return r.ok?"Beide Kennziffern stimmen.":r.sel.map(i=>c.opts[i]).filter(o=>!o.ok).map(o=>o.t+": "+o.why).join(" ");if(c.type==="order")return r.ok?"Problem – Regel – Anwenden – Ergebnis.":"Die Reihenfolge ist immer: Problem – Regel – Anwenden – Ergebnis.";if(c.type==="date")return r.ok?"Richtig gerechnet.":"Richtig wäre: "+c.date+".";return r.ok?"Richtig gerechnet: "+c.sol:"Rechenweg: "+c.sol}
function resultView(){const st=stats();const p=persona(S.pi);const items=S.deck.map((c,i)=>[c,S.ans[i]]);if(S.wdh&&S.wdh.res)items.push([S.wdh.card,S.wdh.res]);
  const pr=PROFIS[S.profiIdx%PROFIS.length];
  return`<section class="scorecard" aria-label="Punktekarte">
    <p class="eyebrow" style="color:inherit;opacity:.85">Fall ${esc(S.code)} · ${S.mode==="p"?"Profi":"Basis"}</p>
    <p style="font-family:var(--display);font-size:1.4rem">${esc(S.team)}</p>
    <div class="big">${S.pts} Punkte</div>
    <div class="stars">${[1,2,3].map(k=>ICON.star(k<=st.stars)).join("")}</div>
    <p>${S.finale.right?"Saboteur überführt":"Saboteur entkommen"} · begleitet: ${esc(p.n)} (${p.a})</p>
    <p class="small" style="opacity:.85">${S.newRec?"Neuer Rekord auf diesem Gerät!":"Rekord auf diesem Gerät: "+M.rec[S.mode]+" P."}</p>
   </section>
   <section class="card stack"><h2>Eure Bilanz</h2>
    <div class="kpis"><div class="kpi"><span class="small muted">Akten richtig</span><b>${st.okA}/8</b></div><div class="kpi"><span class="small muted">Fachquote</span><b>${Math.round(st.q*100)} %</b></div><div class="kpi"><span class="small muted">Beweise</span><b>${S.clues}</b></div><div class="kpi"><span class="small muted">„Ganz sicher“ und richtig</span><b>${st.sureOk}/${st.sure}</b></div></div>
    <p class="small">${st.sure===0?"Ihr habt nie „ganz sicher“ gewählt. Traut euch – wer die Regel kennt, darf sicher sein.":st.sureOk===st.sure?"Wenn ihr sicher wart, lagt ihr richtig. Gute Selbsteinschätzung!":"Manchmal wart ihr „ganz sicher“ und lagt falsch. Schaut euch genau diese Akten unten an."}</p>
    <div class="bars">${Object.keys(AREAS).map(a=>{const v=st.per[a];if(!v.n)return"";const q=v.ok/v.n;return`<div class="barrow"><span>${esc(AREAS[a].short)} ${a==="m4k"?"Kündigung":a==="m4p"?"Probezeit":""}</span><span class="track"><i class="${q<.5?"lowv":q<.8?"midv":""}" style="width:${Math.round(q*100)}%"></i></span><span class="mono">${v.ok}/${v.n}</span></div>`}).join("")}</div>
    <p class="note">Rot = dort nachlernen: im Modul die Seite „Zum Nachlesen“ und den Prüfungs-Check.</p>
   </section>
   <section class="card stack"><h2>Alle Akten mit Begründung</h2><div class="review">
    ${items.map(([c,r],k)=>r?`<article class="rv ${r.ok?"ok":"no"}"><div class="h"><span class="mark ${r.ok?"m3":"m0"}">${r.ok?"✓":"✗"}</span><b>${r.wdh?"Zweite Chance":"Akte "+(k+1)} · ${esc(AREAS[c.a].short)} · ${esc(c.t)}</b></div>
     <p class="small"><b>Eure Antwort:</b> ${esc(optText(c,r))}</p>
     <p class="small">${esc(whyText(c,r))}</p>
     ${!r.ok?`<p class="small"><b>Besser:</b> ${esc(rightText(c))}</p>`:""}
     <p class="ihk"><b>So steht es in der Prüfung:</b> ${esc(c.ihk)}<br><span class="muted">Nachlesen: ${esc(c.src)}</span></p></article>`:"").join("")}
   </div></section>
   <section class="card stack"><h2>Prüfungstipp WiSo</h2>
    <p>Die WiSo-Prüfung hat Ankreuzaufgaben (60 Minuten, 10 % der Note). Lies zuerst den letzten Satz, markiere Operator und Signalwörter (<span class="hl-sig">nicht</span>, <span class="hl-sig">2</span>, <span class="hl-sig">spätestens</span>, <span class="hl-sig">frühestens</span>) und prüfe jede Antwort an der Regel.</p>
   </section>
   <details class="card"><summary>Für Profis: ${esc(pr.m)}</summary><div class="stack" style="margin-top:10px"><p><b>${esc(pr.q)}</b></p><details><summary>Lösung zeigen</summary><p style="margin-top:8px">${esc(pr.a)}</p></details></div></details>
   <section class="card stack"><h2>Noch eine Akte?</h2>
    <button class="btn wide" data-act="again-new" type="button">Neuer Fall (andere Person, andere Akten)</button>
    <button class="btn ghost wide" data-act="again-same" type="button">Gleichen Fall besser lösen (Code ${esc(S.code)})</button>
    <button class="btn ghost wide" data-act="again-mode" type="button">${S.mode==="p"?"Zum Basis-Modus":"Zum Profi-Modus"}${S.mode==="b"&&!M.unlock?" (noch gesperrt)":""}</button>
    <button class="btn ghost wide" data-act="home" type="button">Zum Start</button>
   </section>`;
}
function finishGame(){const st=stats();S.screen="result";S.newRec=S.pts>(M.rec[S.mode]||0);if(S.newRec)M.rec[S.mode]=S.pts;
  if(S.mode==="b"&&st.stars>=3)M.unlock=true;saveMeta();Music.stop();Music.tusch()}

/* ---------- Ablauf ---------- */
function advance(){stopTimer();S.cur=null;S.step++;
  while(S.step<FLOW.length){const st=FLOW[S.step];
    if(st.k==="wdh"){const wrong=S.ans.findIndex(r=>r&&!r.ok);if(wrong<0){S.step++;continue}
      if(!S.wdh){S.wdh={card:S.reserve[S.deck[wrong].a],res:null}}}
    break}
  window.scrollTo(0,0);render()}

/* ---------- Aktionen ---------- */
const A={
  gloss(){const ov=$("#ov");ov.innerHTML=`<div class="overlay" data-act="close"><div class="card" role="dialog" aria-modal="true" aria-label="Wortspeicher" data-stop="1"><div class="row"><h2>Wortspeicher</h2><span class="sp"></span><button class="btn ghost" data-act="close" type="button">Schließen</button></div><div class="gloss">${GLOSS.map(g=>`<div><b>${esc(g[0])}</b><br><span class="small">${esc(g[1])}</span></div>`).join("")}</div></div></div>`},
  close(el,ev){if(ev&&ev.target.closest("[data-stop]")&&!ev.target.closest("button[data-act=close]"))return;$("#ov").innerHTML=""},
  music(){M.music=!M.music;saveMeta();if(M.music){Music.ensure();if(Music.ctx&&Music.ctx.state==="suspended")Music.ctx.resume()}else Music.stop();renderBar();syncMusic()},
  mode(el){if(el.disabled)return;draft.mode=el.dataset.m;render()},
  unlock(){if((draft.teacher||"").trim().toUpperCase()==="LOTSE"){M.unlock=true;saveMeta();draft.mode="p"}render()},
  new(){newGame(draft.team.trim(),draft.mode==="p"&&M.unlock?"p":"b",draft.code);render()},
  resume(){S=loadJ(KEY);render()},
  flip(){S.flipped=true;render()},
  go(){S.screen="play";S.step=0;S.cur=null;render()},
  tap(el){const i=+el.dataset.w;const t=S.cur.taps;const k=t.indexOf(i);if(k>=0)t.splice(k,1);else t.push(i);render()},
  markcheck(){const c=curCard();const words=qWords(c.q).filter(w=>!w.sp);const groups=new Set(words.filter(w=>w.k).map(w=>w.g));const found=new Set();let wrong=0;
    S.cur.taps.forEach(i=>{const w=words[i];if(w&&w.k)found.add(w.g);else wrong++});const pts=Math.max(0,found.size-wrong);
    S.cur.mark={found:found.size,total:groups.size,wrong,pts};S.cur.phase="choose";render()},
  pick(el){const c=curCard();const i=+el.dataset.i;const s=S.cur.sel;if(c.type==="multi"){const k=s.indexOf(i);if(k>=0)s.splice(k,1);else if(s.length<2)s.push(i)}else S.cur.sel=[i];render()},
  ord(el){const i=+el.dataset.i;const o=S.cur.order;if(!o.includes(i))o.push(i);render()},
  ordreset(){S.cur.order=[];render()},
  bet(el){if(el.disabled)return;S.cur.bet=+el.dataset.v;render()},
  joker(){if(S.joker<=0)return;S.joker--;S.cur.joker=true;S.cur.bet=1;render()},
  lock(){const c=curCard();if(!canLock(c,S.cur))return;lockAkte();render();const r=document.querySelector(".react");if(r)r.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})},
  next(){if(FLOW[S.step].k==="vertrag"&&!S.vertrag.checked)return;advance()},
  who(el){const W=S.who;if(W.fb)return;const it=W.items[W.i];const ok=el.dataset.c===it.c;W.res.push({ok});if(ok)S.pts+=2;W.fb={ok,pick:el.dataset.c};render()},
  whonext(){const W=S.who;W.fb=null;W.i++;render()},
  flagrow(el){const V=S.vertrag;const i=+el.dataset.i;const k=V.flags.indexOf(i);if(k>=0)V.flags.splice(k,1);else V.flags.push(i);render()},
  vcheck(){const V=S.vertrag;V.checked=true;const f=V.rows.filter((r,i)=>r.err&&V.flags.includes(i)).length,fa=V.flags.filter(i=>!V.rows[i].err).length;V.pts=Math.max(0,f*3-fa*2);S.pts+=V.pts;render()},
  cpick(el){const C=S.calc;if(C.fb)return;const t=C.tasks[C.i];const ok=el.dataset.v===t.ans;C.res.push({ok});if(ok)S.pts+=5;C.fb={ok,pick:el.dataset.v};render()},
  cgo(){const C=S.calc;if(C.fb)return;const t=C.tasks[C.i];const v=normDate(C.input||"");const ok=v===t.ans;C.res.push({ok,input:C.input});if(ok)S.pts+=5;C.fb={ok,pick:v};render()},
  cnext(){const C=S.calc;C.fb=null;C.input="";C.i++;render()},
  evgo(){resolveEvent();render()},
  evq(el){resolveEvent(+el.dataset.i);render()},
  accuse(el){if(S.finale.done)return;S.finale.sel=+el.dataset.i;render()},
  accusego(){const F=S.finale;if(F.sel==null)return;F.done=true;F.right=F.sel===S.culprit;if(F.right)S.pts+=25;Music.stop();render()},
  toresult(){finishGame();window.scrollTo(0,0);render()},
  "again-new"(){const m=S.mode,t=S.team;newGame(t,m,"");render()},
  "again-same"(){const m=S.mode,t=S.team,c=S.code;newGame(t,m,c);render()},
  "again-mode"(){if(S.mode==="b"&&!M.unlock){draft.team=S.team;S=null;try{localStorage.removeItem(KEY)}catch(e){}render();return}const m=S.mode==="p"?"b":"p",t=S.team;newGame(t,m,"");render()},
  home(){draft.team=S?S.team:"";S=null;try{localStorage.removeItem(KEY)}catch(e){}render()}
};
document.addEventListener("click",ev=>{const el=ev.target.closest("[data-act]");if(!el)return;if(el.disabled)return;
  if(Music.ctx&&Music.ctx.state==="suspended"&&M.music)Music.ctx.resume();
  const f=A[el.dataset.act];if(f)f(el,ev)});
document.addEventListener("input",ev=>{const t=ev.target;
  if(t.id==="team")draft.team=t.value;else if(t.id==="code")draft.code=t.value;else if(t.id==="teacher")draft.teacher=t.value;
  else if(t.id==="ans"&&S&&S.cur){S.cur.input=t.value;const b=document.querySelector('[data-act="lock"]');if(b)b.disabled=!canLock(curCard(),S.cur);save()}
  else if(t.id==="cin"&&S){S.calc.input=t.value}});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")$("#ov").innerHTML="";if(ev.key==="Enter"&&ev.target.id==="cin")A.cgo()});

/* Start */
(function boot(){const hot=window.claude&&window.claude.hot;
  try{hot&&hot.snapshot&&hot.snapshot(()=>({S,draft}))}catch(e){}
  const start=(d)=>{if(d&&d.S){S=d.S;draft=d.draft||draft}render()};
  if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||{});
})();
</script></body></html>
