<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Werbe-Check LF 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800;125,900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: Handy zuerst. Eine Karte pro Fall wie ein Prospektblatt, Preisschild-Gelb als einzige laute Farbe, am Ende die Lernlandkarte. */
:root{
  --bg:#f1efe8; --paper:#ffffff; --paper2:#f7f5ef; --ink:#1d1b17; --muted:#5f5a50; --line:#d9d4c7;
  --tag:#ffd23f; --tag-ink:#1d1b17; --red:#c8251d; --red-ink:#ffffff; --ok:#1e6e3c; --ok-soft:#e1f1e5; --no:#a3271f; --no-soft:#f8e2df;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16150f; --paper:#211f19; --paper2:#1b1a15; --ink:#f1ede2; --muted:#b0a999; --line:#3a372e;
  --tag:#ffd23f; --tag-ink:#1d1b17; --red:#ff6b5e; --red-ink:#1d1b17; --ok:#7dd69a; --ok-soft:#1d3324; --no:#ff8a7f; --no-soft:#3a1f1c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16150f; --paper:#211f19; --paper2:#1b1a15; --ink:#f1ede2; --muted:#b0a999; --line:#3a372e;
  --tag:#ffd23f; --tag-ink:#1d1b17; --red:#ff6b5e; --red-ink:#1d1b17; --ok:#7dd69a; --ok-soft:#1d3324; --no:#ff8a7f; --no-soft:#3a1f1c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.55;margin:0}
.wrap{max-width:40rem;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--display);font-stretch:112%;line-height:1.08;text-wrap:balance;margin:0}
.eyebrow{font-family:var(--display);font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btn{background:var(--ink);color:var(--paper);border:0;border-radius:999px;padding:.8rem 1.4rem;font-family:var(--display);font-weight:800;font-stretch:112%;font-size:1.05rem}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.screen{display:flex;flex-direction:column;gap:18px}
/* Start */
.hero{background:var(--paper);border:2px solid var(--ink);padding:24px 20px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:900;font-stretch:125%;text-transform:uppercase;letter-spacing:-.01em}
.hero h1 span{background:var(--tag);color:var(--tag-ink);padding:0 .15em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.hero p{max-width:34rem;margin:14px 0 0}
.burst{position:absolute;right:-14px;top:-14px;width:108px;height:108px;background:var(--red);color:var(--red-ink);display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:900;font-stretch:112%;font-size:.95rem;line-height:1.05;transform:rotate(12deg);clip-path:polygon(50% 0,61% 13%,77% 5%,80% 22%,97% 24%,90% 40%,100% 52%,88% 63%,94% 80%,77% 81%,72% 97%,57% 89%,44% 100%,36% 86%,19% 93%,17% 76%,2% 70%,10% 55%,0 42%,13% 32%,9% 15%,26% 15%,33% 1%)}
.burst span{padding:18px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.fact{background:var(--paper);border-top:4px solid var(--ink);padding:10px 12px}
.fact b{display:block;font-family:var(--display);font-size:1.6rem;font-stretch:112%;font-variant-numeric:tabular-nums}
.fact small{color:var(--muted);font-size:.85rem}
.howto{background:var(--paper2);border:1px dashed var(--line);padding:14px 16px}
.howto ol{margin:6px 0 0;padding-left:1.2rem}
/* Fall */
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;background:var(--line);border-radius:3px}
.progress i.done{background:var(--ink)}
.progress i.now{background:var(--red)}
.case{background:var(--paper);border:2px solid var(--ink);display:flex;flex-direction:column}
.case-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:2px solid var(--ink)}
.chip{background:var(--tag);color:var(--tag-ink);font-family:var(--display);font-weight:800;font-size:.8rem;padding:.2rem .55rem;letter-spacing:.04em;text-transform:uppercase}
.scene{padding:16px 16px 4px}
.scene .label{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.ad{border:1.5px solid var(--line);background:var(--paper2);padding:14px;font-size:1rem}
.ad .big{font-family:var(--display);font-weight:900;font-stretch:112%;font-size:1.35rem;line-height:1.1}
.ad .price{display:inline-block;background:var(--tag);color:var(--tag-ink);font-family:var(--display);font-weight:900;font-size:1.5rem;padding:.05em .3em;margin-top:6px;font-variant-numeric:tabular-nums}
.ad s{color:var(--muted)}
.q{padding:14px 16px 0}
.q h2{font-size:1.3rem}
.opts{display:grid;gap:8px;padding:14px 16px 16px}
.opt{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:.75rem .9rem;font-size:1rem;line-height:1.35}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--no);background:var(--no-soft)}
.reveal{border-top:2px solid var(--ink);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:1.1rem}
.verdict.ok{color:var(--ok)} .verdict.no{color:var(--no)}
.teaser{background:var(--tag);color:var(--tag-ink);padding:10px 12px;font-size:.98rem}
.teaser b{font-family:var(--display);font-stretch:112%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.star{background:transparent;border:2px solid var(--ink);border-radius:999px;padding:.45rem .9rem;font-size:.92rem}
.star[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
/* Ende */
.score{background:var(--paper);border:2px solid var(--ink);padding:18px}
.score .num{font-family:var(--display);font-weight:900;font-stretch:125%;font-size:3rem;font-variant-numeric:tabular-nums;line-height:1}
.map{display:grid;gap:8px}
.mod{display:grid;grid-template-columns:3rem 1fr auto;gap:10px;align-items:center;background:var(--paper);border:1.5px solid var(--line);padding:10px 12px}
.mod.fav{border:2px solid var(--ink);box-shadow:4px 4px 0 var(--tag)}
.mod .n{font-family:var(--display);font-weight:900;font-size:1.3rem;font-stretch:112%;font-variant-numeric:tabular-nums}
.mod .t{min-width:0}
.mod .t b{display:block;line-height:1.25}
.mod .t small{color:var(--muted)}
.mod .p{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums;text-align:right;font-size:.95rem}
.mod .p small{display:block;color:var(--muted);font-family:var(--body);font-weight:400;font-size:.78rem}
.hot{font-size:.72rem;background:var(--red);color:var(--red-ink);padding:.05rem .4rem;font-family:var(--display);font-weight:800;letter-spacing:.05em;text-transform:uppercase;margin-left:4px;vertical-align:2px}
.note{color:var(--muted);font-size:.92rem}
@media (max-width:420px){.facts{grid-template-columns:1fr 1fr 1fr}.fact b{font-size:1.3rem}}
@media (prefers-reduced-motion:no-preference){.case,.score{animation:pop .25s ease-out}@keyframes pop{from{transform:translateY(6px)}to{transform:none}}}
</style>
</head>
<body>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
const MODS=[
 {n:1,t:"Werbung und Werbearten",ds:"2",p:10,hot:true},
 {n:2,t:"Werbegrundsätze und Werbebotschaft",ds:"1,5",p:8},
 {n:3,t:"Werbemittel und Werbeträger",ds:"1,5",p:8,hot:true},
 {n:4,t:"Der Werbeplan",ds:"2",p:12,hot:true},
 {n:5,t:"Werbeerfolgskontrolle",ds:"1",p:6},
 {n:6,t:"Verkaufsförderung und Öffentlichkeitsarbeit",ds:"1,5",p:8},
 {n:7,t:"Kundenbindung heute",ds:"1,5",p:8,hot:true},
 {n:8,t:"Das UWG",ds:"2",p:12},
 {n:9,t:"Verpackung und Verpackungsgesetz",ds:"2",p:12,hot:true},
 {n:10,t:"Warenzustellung",ds:"1",p:4},
 {n:11,t:"Teamarbeit",ds:"2",p:12,hot:true}
];
const CASES=[
 {m:1,label:"Im Briefkasten von Frau Yilmaz",
  ad:'<div class="big">Liebe Frau Yilmaz, alles Gute zum Geburtstag!</div><div>Als Dankeschön für Ihre Treue: 15 € Gutschein für Ihren nächsten Einkauf.</div><div class="note">Ihr Modehaus Nordstern</div>',
  q:"Wen spricht diese Werbung an?",
  o:["Alle Menschen in Bremerhaven","Genau eine Person, persönlich","Nur Leute, die gerade Geburtstag haben"],a:1,
  e:"Das ist Direktwerbung: Eine bestimmte Person wird persönlich angesprochen. Ein Radiospot dagegen ist Massenwerbung.",
  tz:"Jede Werbung beantwortet <b>drei Fragen gleichzeitig</b>. Welche das sind und wie du damit neun Werbearten sortierst, lernst du in <b>Modul 1</b>."},
 {m:2,label:"Eine Anzeige soll dich vom Sofa in den Laden holen",
  ad:'<div class="big">A … I … D … A</div><div>Vier Buchstaben, vier Schritte. So ist fast jede gute Werbung aufgebaut.</div>',
  q:"Was muss eine Werbung als Allererstes schaffen?",
  o:["Dass du sofort kaufst","Dass du hinschaust","Dass du den Preis kennst"],a:1,
  e:"Das A am Anfang steht für Attention, also Aufmerksamkeit. Wer nicht hinschaut, liest den Rest gar nicht erst.",
  tz:"Wofür die anderen drei Buchstaben stehen und warum Werbung <b>wahr, klar, wirksam und wirtschaftlich</b> sein muss, erfährst du in <b>Modul 2</b>."},
 {m:3,label:"An der Ecke Hafenstraße",
  ad:'<div class="big">Ein Plakat klebt an einer Litfaßsäule.</div><div>Auf dem Plakat: „Große Eröffnung am Samstag!“</div>',
  q:"Was davon ist das Werbemittel?",
  o:["Das Plakat","Die Litfaßsäule","Beides zusammen"],a:0,
  e:"Das Plakat ist das Werbemittel: Es trägt die Botschaft. Die Litfaßsäule ist der Werbeträger: Sie bringt das Plakat zu den Leuten.",
  tz:"Genau dieser Unterschied kommt in der Abschlussprüfung <b>immer wieder</b> dran. In <b>Modul 3</b> wirst du darin sicher."},
 {m:4,label:"Planung für das Sommerfest",
  ad:'<div class="big">Flyer für unser Sommerfest</div><div>Verteilt werden sie nur in den Stadtteilen Lehe und Geestemünde.</div>',
  q:"Wie nennt man das Gebiet, in dem geworben wird?",
  o:["Streukreis","Streugebiet","Streuzeit"],a:1,
  e:"Das ist das Streugebiet. Der Streukreis sagt, wen du ansprichst. Die Streuzeit sagt, wann du wirbst.",
  tz:"Wer, wo, wann und für wie viel Geld? In <b>Modul 4</b> stellst du einen kompletten <b>Werbeplan</b> selbst auf."},
 {m:5,label:"Nach der Rabattaktion",
  ad:'<div>Die Werbung hat gekostet:</div><div class="price">2.000 €</div><div style="margin-top:8px">Der Umsatz ist danach gestiegen um:</div><div class="price">10.000 €</div>',
  q:"Hat sich die Werbung gelohnt?",
  o:["Ja, ganz sicher. Das sind 8.000 € Gewinn.","Wahrscheinlich. Aber ganz sicher weiß man es nie."],a:1,
  e:"Mehr Umsatz ist noch kein Gewinn. Und vielleicht haben auch das gute Wetter oder die Ferien geholfen. Die Werberendite liegt hier bei 500 %.",
  tz:"Wie man auf <b>500 %</b> kommt und warum sich Werbeerfolg nie ganz genau messen lässt, rechnest du in <b>Modul 5</b> nach."},
 {m:6,label:"Samstag im Supermarkt",
  ad:'<div class="big">Probieren Sie unseren neuen Bergkäse!</div><div>Eine Mitarbeiterin steht mit einem Tablett am Kühlregal.</div>',
  q:"Ist das Werbung?",
  o:["Ja, das ist ganz normale Werbung","Nein, das ist Verkaufsförderung"],a:1,
  e:"Eine Verkostung im Laden ist Verkaufsförderung. Sie passiert direkt am Verkaufsort und soll genau jetzt zum Kaufen anregen.",
  tz:"Was Kunden-, Mitarbeiter- und Händlerpromotion sind und wo <b>Öffentlichkeitsarbeit</b> beginnt, lernst du in <b>Modul 6</b>."},
 {m:7,label:"An der Kasse",
  ad:'<div class="big">„Haben Sie unsere Kundenkarte?“</div><div>Für jeden Einkauf gibt es Punkte. Dafür musst du nur die Karte zeigen.</div>',
  q:"Warum schenkt dir der Laden diese Punkte?",
  o:["Aus Dankbarkeit, einfach so","Damit du wiederkommst, und damit er erfährt, was du kaufst","Weil ein Gesetz das vorschreibt"],a:1,
  e:"Kundenkarten binden Kunden an den Laden. Außerdem liefern sie Daten über das Kaufverhalten. Mit diesen Daten muss der Betrieb vorsichtig umgehen.",
  tz:"Kundenbindung ist das <b>zweitstärkste Prüfungsthema</b> in diesem Lernfeld. Karte, App, Newsletter und Coupons kommen in <b>Modul 7</b>."},
 {m:8,label:"Im Schaufenster eines Sportgeschäfts",
  ad:'<div>Montag: Wanderschuhe</div><div class="price">120,00 €</div><div style="margin-top:8px">Donnerstag: „Sonderangebot!“</div><div class="price"><s>120,00 €</s> 99,00 €</div><div style="margin-top:8px">Samstag: wieder 120,00 €</div>',
  q:"Darf der Laden so werben?",
  o:["Ja, der Laden darf seine Preise ja selbst festlegen","Nein, das ist verboten"],a:1,
  e:"Der Preis von 120 € war nie ernst gemeint. Er sollte nur die Ersparnis größer aussehen lassen. Man nennt das einen Mondpreis, und das ist irreführende Werbung.",
  tz:"Welche Tricks das <b>Gesetz gegen den unlauteren Wettbewerb</b> noch verbietet, findest du in <b>Modul 8</b> heraus. Am Ende kommst du nur mit diesem Wissen aus einem <b>Escape Room</b>."},
 {m:9,label:"Im Kühlregal",
  ad:'<div class="big">Ein leerer Joghurtbecher landet im gelben Sack.</div>',
  q:"Wer bezahlt dafür, dass er eingesammelt und verwertet wird?",
  o:["Die Stadt, aus der Müllgebühr","Der Betrieb, der die Verpackung in Umlauf bringt, über ein Rücknahmesystem","Niemand, das passiert einfach"],a:1,
  e:"Wer Verpackungen in Umlauf bringt, muss sich einem System anschließen und dafür bezahlen. Das steht im Verpackungsgesetz.",
  tz:"Was eine Verpackung außer Schützen noch alles leistet, erfährst du in <b>Modul 9</b>. Dazu gibt es eine <b>Verpackungs-Rallye</b>."},
 {m:10,label:"Das neue Sofa muss zum Kunden",
  ad:'<div class="big">Ein Spediteur und ein Frachtführer</div><div>Beide haben mit dem Transport zu tun.</div>',
  q:"Wer fährt den LKW selbst?",
  o:["Der Spediteur","Der Frachtführer"],a:1,
  e:"Der Frachtführer befördert die Ware selbst. Der Spediteur organisiert den Transport und beauftragt dafür einen Frachtführer.",
  tz:"Wann sich ein eigener Lieferwagen lohnt und wann nicht, klärst du in <b>Modul 10</b>."},
 {m:11,label:"Nach der Teamsitzung",
  ad:'<div class="big">45 Minuten geredet.</div><div>Danach weiß keiner, wer jetzt was erledigen soll.</div>',
  q:"Was hat in dieser Sitzung gefehlt?",
  o:["Mehr Leute im Raum","Ein Abschluss mit Ergebnissen: wer macht was bis wann","Eine längere Sitzung"],a:1,
  e:"Eine gute Sitzung endet mit festen Ergebnissen und klaren Aufgaben. Sonst war die Zeit verschenkt.",
  tz:"Die <b>fünf Phasen</b> einer Teamsitzung lernst du in <b>Modul 11</b>. Danach leitest du selbst eine Sitzung."}
];
const KEY="lf5-einstieg-v1";
let store={};try{store=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){store={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
let st={i:-1,hits:0,stars:new Set(store.stars||[]),answered:false};
const app=document.getElementById("app");

function start(){
 const prev=store.runs&&store.runs.length?`<p class="note">Du hast den Werbe-Check schon ${store.runs.length}× gemacht. Letztes Ergebnis: ${store.runs[store.runs.length-1]} von 11.</p>`:"";
 app.innerHTML=`<section class="screen">
 <div class="hero"><div class="burst"><span>11 Fälle · 10 Min.</span></div>
  <p class="eyebrow">Lernfeld 5 · Werben und den Verkauf fördern</p>
  <h1 style="margin-top:8px">Der <span>Werbe-Check</span></h1>
  <p>Du siehst jeden Tag Werbung. Auf dem Handy, im Briefkasten, im Laden. Ab jetzt schaust du hinter die Kulissen: Wer will dich damit erreichen? Was darf Werbung, und was nicht?</p>
  <p>Hier warten 11 kleine Fälle aus dem Ladenalltag. Tipp einfach deine Antwort an. <b>Das ist kein Test.</b> Du darfst falsch liegen, genau dafür ist das Lernfeld da.</p>
 </div>
 <div class="facts">
  <div class="fact"><b>11</b><small>Module</small></div>
  <div class="fact"><b>20</b><small>Doppelstunden</small></div>
  <div class="fact"><b>100</b><small>Punkte im Punktekonto</small></div>
 </div>
 ${prev}
 <div class="row"><button class="btn" id="go">Los geht’s</button><button class="btn ghost" id="map">Gleich zur Übersicht</button></div>
 </section>`;
 document.getElementById("go").onclick=()=>{st.i=0;st.hits=0;show()};
 document.getElementById("map").onclick=()=>end(true);
}
function bar(){return `<div class="progress" aria-label="Fall ${st.i+1} von 11">${CASES.map((_,k)=>`<i class="${k<st.i?"done":k===st.i?"now":""}"></i>`).join("")}</div>`}
function show(){
 const c=CASES[st.i];st.answered=false;
 app.innerHTML=`<section class="screen">${bar()}
 <article class="case">
  <div class="case-head"><span class="eyebrow">Fall ${st.i+1} von 11</span><span class="chip">Modul ${c.m}</span></div>
  <div class="scene"><div class="label">${c.label}</div><div class="ad">${c.ad}</div></div>
  <div class="q"><h2>${c.q}</h2></div>
  <div class="opts">${c.o.map((t,k)=>`<button class="opt" data-k="${k}">${t}</button>`).join("")}</div>
  <div class="reveal" id="rv" hidden></div>
 </article></section>`;
 app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 window.scrollTo({top:0});
}
function pick(k){
 if(st.answered)return;st.answered=true;
 const c=CASES[st.i],ok=k===c.a;if(ok)st.hits++;
 app.querySelectorAll(".opt").forEach(b=>{const j=+b.dataset.k;b.disabled=true;if(j===c.a)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
 const rv=document.getElementById("rv");rv.hidden=false;
 const on=st.stars.has(c.m);
 rv.innerHTML=`<div class="verdict ${ok?"ok":"no"}">${ok?"Richtig gedacht!":"Knapp daneben, kein Problem."}</div>
 <div>${c.e}</div>
 <div class="teaser">${c.tz}</div>
 <div class="row"><button class="star" id="st" aria-pressed="${on}">${on?"★ Bin gespannt drauf":"☆ Darauf bin ich gespannt"}</button>
 <button class="btn" id="nx">${st.i<10?"Nächster Fall":"Zur Lernlandkarte"}</button></div>`;
 document.getElementById("st").onclick=e=>{const b=e.currentTarget;if(st.stars.has(c.m))st.stars.delete(c.m);else st.stars.add(c.m);const p=st.stars.has(c.m);b.setAttribute("aria-pressed",p);b.textContent=p?"★ Bin gespannt drauf":"☆ Darauf bin ich gespannt";store.stars=[...st.stars];save()};
 document.getElementById("nx").onclick=()=>{if(st.i<10){st.i++;show()}else end(false)};
 document.getElementById("nx").focus({preventScroll:true});
}
function end(skip){
 let scoreHtml="";
 if(!skip){
  store.runs=(store.runs||[]).concat(st.hits);save();
  const first=store.runs.length>1?`<p>Beim ersten Mal hattest du <b>${store.runs[0]} von 11</b>. Schau mal, was sich getan hat.</p>`:`<p>Mach den Werbe-Check am Ende von Lernfeld 5 noch einmal. Dann siehst du schwarz auf weiß, was du dazugelernt hast.</p>`;
  scoreHtml=`<div class="score"><p class="eyebrow">Dein Ergebnis</p><div class="num">${st.hits} / 11</div>
  <p>${st.hits>=9?"Du hast schon einen guten Riecher für Werbung. In den Modulen bekommst du die Fachbegriffe dazu, die in der Prüfung zählen.":st.hits>=5?"Ein guter Start. Einiges ahnst du schon, den Rest holst du dir in den Modulen.":"Viel Neues also. Umso mehr wirst du in diesem Lernfeld dazulernen."}</p>${first}</div>`;
 }
 const fav=st.stars.size?`<p class="note">Mit Rahmen markiert: die Module, auf die du gespannt bist.</p>`:"";
 app.innerHTML=`<section class="screen">${scoreHtml}
 <div><p class="eyebrow">Dein Weg durch Lernfeld 5</p><h2 style="font-size:1.7rem;margin-top:4px">Die Lernlandkarte</h2>
 <p class="note" style="margin-top:6px"><span class="hot">Prüfung</span> = kommt in der Abschlussprüfung besonders oft dran. ${fav}</p></div>
