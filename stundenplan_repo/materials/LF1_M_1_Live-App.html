<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wer gibt wem was? – Wirtschaftskreislauf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#f1efe9;--surface:#fff;--surface2:#f7f5f0;--ink:#1f1d18;--muted:#5f5a4f;--line:#d9d3c6;
  --brand:#7a3e00;--brand-ink:#fff;--ok:#1f7a3f;--bad:#b3261e;--warn:#a15c00;
  --kauf:#1f5fae;--kauf-soft:#dde8f7;--verk:#c2410c;--verk-soft:#fbe6dc;--beob:#5b4b8a;--beob-soft:#e9e3f5;--gut:#1f5fae;--geld:#b3261e;--hh:#1f5fae;--hh-soft:#dde8f7;--un:#c2410c;--un-soft:#fbe6dc;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;

  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#f0a95a;--brand-ink:#1a1209;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --kauf:#7fb0ff;--kauf-soft:#1b2a40;--verk:#ff8a5c;--verk-soft:#3a2219;--beob:#b9a6f0;--beob-soft:#2a2340;--gut:#7fb0ff;--geld:#ff8a80;--hh:#7fb0ff;--hh-soft:#1b2a40;--un:#ff8a5c;--un-soft:#3a2219;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#f0a95a;--brand-ink:#1a1209;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --kauf:#7fb0ff;--kauf-soft:#1b2a40;--verk:#ff8a5c;--verk-soft:#3a2219;--beob:#b9a6f0;--beob-soft:#2a2340;--gut:#7fb0ff;--geld:#ff8a80;--hh:#7fb0ff;--hh-soft:#1b2a40;--un:#ff8a5c;--un-soft:#3a2219;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0 0 .4em;line-height:1.1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.6em 1em}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.45;cursor:default}
input,textarea{font:inherit;width:100%;padding:.6em .7em;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.merk{border-left:6px solid var(--brand);background:var(--surface);border-radius:10px;padding:12px 14px;margin:8px 0}
.merk b.k{color:var(--kauf)} .merk b.v{color:var(--verk)}
.term{font-weight:700;border-bottom:3px solid var(--brand)}
.alt{font-weight:400;color:var(--muted);font-size:.9em}
/* ---------- Tafel ---------- */
#tafel header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tafel header h1{font-size:1.35rem;margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.steps button{padding:.35em .8em;font-size:.9rem}
.steps button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mini{display:flex;align-items:center;gap:10px;font-size:.9rem}
.mini canvas{width:64px;height:64px;border-radius:6px;background:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px}
.dot.on{background:var(--ok)}
#tMain{padding:20px 22px 40px;max-width:1400px;margin:0 auto}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.ctrl button{font-size:1.05rem}
.big{font-size:clamp(1.6rem,3.2vw,2.6rem)}
.join{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:28px;align-items:start}
.join canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:14px}
.code{font-family:var(--display);font-size:3rem;font-weight:800;letter-spacing:.12em}
.nicks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nicks button{padding:.3em .7em;font-size:.95rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.clock{font-family:var(--display);font-size:3rem;font-weight:800}
.chip{display:inline-block;border-radius:999px;padding:.2em .7em;margin:3px;font-weight:700;font-family:var(--display)}
.chip.k{background:var(--kauf-soft);color:var(--kauf)} .chip.v{background:var(--verk-soft);color:var(--verk)}
.banner{border-radius:12px;padding:12px 16px;margin-top:14px;font-size:1.2rem}
.banner.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));border:2px solid var(--ok)}
.banner.nf{background:var(--kauf-soft);border:2px solid var(--kauf)}
.banner.af{background:var(--verk-soft);border:2px solid var(--verk)}
.banner.info{background:var(--surface);border:2px solid var(--brand)}
.satz{display:block;margin-top:6px;font-size:1rem;color:var(--muted)}
.hbar{display:grid;grid-template-columns:140px 1fr 60px;gap:10px;align-items:center;margin:10px 0;font-size:1.15rem}
.hbar .t{height:34px;border-radius:8px;background:var(--surface2);overflow:hidden}
.hbar .t i{display:block;height:100%;transition:width .4s}
.hbar b{font-family:var(--display);font-size:1.8rem;text-align:right}
table.mt{border-collapse:collapse;width:100%;background:var(--surface);border-radius:12px;overflow:hidden;font-size:1.05rem}
table.mt th,table.mt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
table.mt th{background:var(--surface2);font-size:.9rem}
table.mt tr.cur td{outline:3px solid var(--brand);outline-offset:-3px}
table.mt tr.eq td{background:color-mix(in srgb,var(--ok) 18%,var(--surface));font-weight:700}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{font-family:var(--display);font-weight:800;font-size:1.1rem;padding:.4em .8em}
.pchips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pchips button.done{border-color:var(--ok);border-width:2px}
.scen{text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line)}
.scen b{display:block;font-family:var(--display);font-size:1.3rem;margin-bottom:4px}
svg text{font-family:var(--body)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer{font-family:var(--display);font-size:3rem;font-weight:800;min-width:2.2em;text-align:center;border-radius:50%;background:var(--surface);border:4px solid var(--brand);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{border-radius:14px;padding:14px 16px;color:#fff;font-size:1.2rem;font-weight:700;position:relative}
.o0{background:#b3261e}.o1{background:#1f5fae}.o2{background:#8a5300}.o3{background:#3a7a1c}.o4{background:#8537a3}
.opt.wrong{opacity:.35}
.opt .cnt{position:absolute;right:14px;top:10px;font-family:var(--display);font-size:1.6rem}
.top{list-style:none;padding:0;margin:0}
.top li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--surface);margin-bottom:6px;font-size:1.15rem}
.top li b{font-family:var(--display)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:24px}
.podium div{background:var(--brand);color:var(--brand-ink);border-radius:14px 14px 0 0;width:200px;text-align:center;padding:12px;font-family:var(--display);font-weight:800}
.podium span{display:block;font-size:1.4rem}
.pro{font-size:.75rem;font-weight:700;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.qtab{border-collapse:collapse;margin:8px 0;background:var(--surface)}
.qtab td,.qtab th{border:1px solid var(--line);padding:4px 10px;text-align:center}
@media (max-width:900px){.two,.three,.join,.opts{grid-template-columns:1fr}}
/* ---------- Handy ---------- */
#phone{max-width:560px;margin:0 auto;padding:14px 16px 40px}
#phone .ph-top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.card{border-radius:18px;padding:16px 18px;border:3px solid;margin-bottom:12px}
.card.K{background:var(--kauf-soft);border-color:var(--kauf)} .card.V{background:var(--verk-soft);border-color:var(--verk)} .card.B{background:var(--beob-soft);border-color:var(--beob)}
.card .role{font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase}
.card.K .role{color:var(--kauf)} .card.V .role{color:var(--verk)} .card.B .role{color:var(--beob)}
.card .val{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1.05}
.card .cd{margin-top:8px;font-size:1rem}
.card .cd b{font-family:var(--display);font-size:1.8rem;letter-spacing:.1em}
.step{display:flex;align-items:center;gap:8px;margin:8px 0}
.step button{font-size:1.2rem;font-weight:800;padding:.5em .7em;min-width:3.2em}
.step .pv{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:2rem}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.status.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.status.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.yn button{padding:20px 10px;font-size:1.2rem;font-weight:700;border-radius:14px;border:3px solid var(--line)}
.yn button.sel{outline:4px solid var(--ink);outline-offset:1px}
.yn .y{background:color-mix(in srgb,var(--ok) 18%,var(--surface));border-color:var(--ok)}
.yn .n{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:var(--bad)}
.pbtn{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:14px;font-size:1.05rem}
.pbtn.sel{outline:4px solid var(--ink);outline-offset:-2px}
.popt{display:block;width:100%;margin:10px 0;padding:16px 14px;border-radius:14px;color:#fff;border:none;font-size:1.05rem;font-weight:700;text-align:left}
.bigpts{font-family:var(--display);font-size:2.4rem;font-weight:800}
.ansage{font-family:var(--display);font-weight:800;font-size:3rem;text-align:center;margin:6px 0}
/* ---------- Erklärung ---------- */
#help{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:14px 16px 40px}
#help>*{max-width:760px;margin-left:auto;margin-right:auto}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-14px;background:var(--bg);padding:8px 0}
.htabs{display:flex;gap:8px;margin:6px auto 12px}
.htabs button{flex:1;font-weight:700}
.htabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.hbody{font-size:1.1rem;line-height:1.5}
.hs{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.hs summary{font-family:var(--display);font-size:1.2rem}
.hs[open] summary{margin-bottom:6px}
.hw{background:var(--surface);border-left:6px solid var(--brand);border-radius:10px;padding:10px 14px;margin:8px 0}
.hw b{font-family:var(--display);font-size:1.15rem}
.hbtn{padding:.25em .7em;font-weight:700;border-radius:999px}
/* ---------- Kreislauf ---------- */
.card.H{background:var(--hh-soft);border-color:var(--hh)} .card.U{background:var(--un-soft);border-color:var(--un)}
.card.H .role{color:var(--hh)} .card.U .role{color:var(--un)}
.card .val{font-size:2rem}
.minicard{display:inline-block;border-radius:999px;padding:.25em .9em;font-weight:700;font-family:var(--display);margin-bottom:10px}
.minicard.H{background:var(--hh-soft);color:var(--hh)} .minicard.U{background:var(--un-soft);color:var(--un)}
.chip.g{background:var(--hh-soft);color:var(--gut)} .chip.m{background:color-mix(in srgb,var(--geld) 14%,var(--surface));color:var(--geld)}
.merk b.g{color:var(--gut)} .merk b.m{color:var(--geld)}
.netwrap{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(260px,1fr);gap:16px;align-items:start}
.feed{margin:0;padding-left:1.1em} .feed li{margin:4px 0}
.pbtn.act{border-width:3px} .pbtn.act.g{border-color:var(--gut)} .pbtn.act.m{border-color:var(--geld)} .pbtn:disabled{opacity:.5}
.yn .g2{background:var(--hh-soft);border-color:var(--gut);color:var(--gut)} .yn .m2{background:color-mix(in srgb,var(--geld) 12%,var(--surface));border-color:var(--geld);color:var(--geld)}
@media (max-width:900px){.netwrap{grid-template-columns:1fr}}
</style>

/* Netz der Klasse (digitales Wollknäuel) */
function netSVG(N,ex,o){o=o||{};
  const H=N.filter(n=>n.r==="H"),U=N.filter(n=>n.r==="U"),pos={},W=1100,HT=620,cx=550,cy=310,R=255;
  const place=(arr,a0,a1)=>arr.forEach((n,i)=>{const a=(a0+(a1-a0)*(arr.length===1?.5:i/(arr.length-1)))*Math.PI/180;pos[n.id]=[cx+320*Math.cos(a),cy+R*Math.sin(a)];});
  place(H,125,235);place(U,-55,55);
  let s=`<svg viewBox="0 0 ${W} ${HT}" style="width:100%;background:var(--surface);border-radius:12px" role="img" aria-label="Netz aus Güter- und Geldströmen der Klasse">
  <defs><marker id="ng" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0L10,5L0,10z" style="fill:var(--gut)"/></marker>
  <marker id="nm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0L10,5L0,10z" style="fill:var(--geld)"/></marker>
  <marker id="nx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0L10,5L0,10z" style="fill:var(--line)"/></marker></defs>
  <text x="60" y="34" font-size="22" font-weight="700" style="fill:var(--hh)">Private Haushalte</text><text x="1040" y="34" text-anchor="end" font-size="22" font-weight="700" style="fill:var(--un)">Unternehmen</text>`;
  const pk={};
  const arc=(a,b,k,cls,dead)=>{const A=pos[a],B=pos[b];if(!A||!B)return "";const dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L;
    const sh=34,A2=[A[0]+ux*sh,A[1]+uy*sh],B2=[B[0]-ux*sh,B[1]-uy*sh],off=26+16*k,mx=(A2[0]+B2[0])/2-uy*off,my=(A2[1]+B2[1])/2+ux*off;
    const col=dead?"var(--line)":cls==="gut"?"var(--gut)":"var(--geld)";
    return `<path d="M${A2[0].toFixed(1)},${A2[1].toFixed(1)} Q${mx.toFixed(1)},${my.toFixed(1)} ${B2[0].toFixed(1)},${B2[1].toFixed(1)}" fill="none" style="stroke:${col}" stroke-width="${o.thin?2:3}" ${cls==="geld"?'stroke-dasharray="9 6"':""} marker-end="url(#${dead?"nx":cls==="gut"?"ng":"nm"})" opacity="${dead?.6:.9}"/>`;};
  for(const e of ex){const key=[e.h,e.u].sort().join("|"),k=pk[key]=(pk[key]||0)+1,dead=o.dead&&(e.h===o.dead||e.u===o.dead);
    if(e.t==="W"){s+=arc(e.u,e.h,k-1,"gut",dead)+arc(e.h,e.u,k-1,"geld",dead);}else{s+=arc(e.h,e.u,k-1,"gut",dead)+arc(e.u,e.h,k-1,"geld",dead);}}
  for(const n of N){const p=pos[n.id];if(!p)continue;const a=o.aff?o.aff[n.id]:0,isH=n.r==="H";
    const ring=a===9?"var(--bad)":a===1||a===2?"var(--bad)":a===3?"var(--warn)":isH?"var(--hh)":"var(--un)";
    s+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="30" style="fill:${isH?"var(--hh-soft)":"var(--un-soft)"};stroke:${ring}" stroke-width="${a?6:3}"/>`;
    if(a===9)s+=`<path d="M${p[0]-20},${p[1]-20}L${p[0]+20},${p[1]+20}M${p[0]+20},${p[1]-20}L${p[0]-20},${p[1]+20}" style="stroke:var(--bad)" stroke-width="6"/>`;
    const tx=isH?p[0]-38:p[0]+38,an=isH?"end":"start";
    s+=`<text x="${tx.toFixed(1)}" y="${(p[1]-3).toFixed(1)}" text-anchor="${an}" font-size="17" font-weight="700" style="fill:var(--ink)">${h(n.nick)}</text><text x="${tx.toFixed(1)}" y="${(p[1]+16).toFixed(1)}" text-anchor="${an}" font-size="14" style="fill:var(--muted)">${h(n.card)}</text>`;
    if(n.k)s+=`<text x="${p[0].toFixed(1)}" y="${(p[1]+6).toFixed(1)}" text-anchor="middle" font-size="17" font-weight="700" style="fill:var(--ink)">${n.k}</text>`;}
  return s+`</svg>`;}

  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.13);
    g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2);}
  function play(st,t){const bar=Math.floor(st/16)%S.bass.length,s=st%16,ch=S.ch[bar%S.ch.length];
    const bp=S.bp||[0,2,4,6,8,10,12,14];
    if(bp.includes(s)){const off=S.walk?[0,4,7,9][Math.floor(s/4)%4]:(s%4===0?0:12);tone(mf(S.bass[bar]+off),t,S.walk?.3:.16,S.bt||"triangle",S.bt==="sawtooth"?.12:S.bt==="square"?.1:.32);}
    if(!S.as||S.as.includes(s))tone(mf(ch[S.ap[s%S.ap.length]%ch.length]+12*(S.oct||0)+(fast?12:0)),t,S.ad||.09,S.arp,AV[S.arp]||.05);
    if(S.kick.includes(s))kick(t);
    if(S.snare.includes(s))noise(t,.12,.25,1800);
    if(S.cl&&S.cl.includes(s))tone(1250,t,.04,"sine",.18);
    const hat=S.hat;
    if(hat==="all"||fast||(hat==="off"&&s%2===1)||(hat==="jazz"&&(s%4===0||s%8===6)))noise(t,.03,.07,7000);}
  function sched(){const d=60/(fast?S.fast:S.bpm)/4;
    if(next<ctx.currentTime-.05)next=ctx.currentTime+.02;
    while(next<ctx.currentTime+.12){play(step,next+(step%2?d*(S.swing||0):0));next+=d;step++;}}
  const root=()=>S.ch[0][0]%12+60;
  return {
    pool:MUSIK_POOL,
    current(){return S.name;},
    unlock(){if(on)init();},
    isOn(){return on;},
    toggle(){on=!on;ls("quizmusik",on);if(!on)this.stop();return on;},
    start(){if(!on||timer||!init())return;pick();fast=false;step=0;next=ctx.currentTime+.06;timer=setInterval(sched,25);
      try{console.log("[Quiz-Musik] Stück",last,S.name);}catch(e){}},
    hurry(){fast=true;},
    tick(){if(!on||!init())return;tone(1760,ctx.currentTime,.06,"sine",.25);},
    stop(){clearInterval(timer);timer=null;fast=false;},
    reveal(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.03,r=root();
      [0,4,7].forEach((m,i)=>tone(mf(r+m),t+i*.09,.25,"square",.08));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+.3,.9,"triangle",.14));kick(t+.3);noise(t+.3,.25,.25,3000);},
    fanfare(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.05,r=60;
      [[-5,0],[0,.15],[4,.3],[7,.45],[4,.7],[7,.85]].forEach(([m,d])=>tone(mf(r+m),t+d,.22,"square",.09));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+1.05,1.6,"triangle",.15));[0,.45,1.05].forEach(d=>kick(t+d));noise(t+1.05,.5,.3,2500);}
  };})();

/* =========================================================
   TAFEL (Lehrkraft, Beamer)
   ========================================================= */
function tafelApp(){
  $("tafel").hidden=false;
  const KEY="kreislauf_tafel";
  const fresh=()=>({code:codeGen(),ph:0,pl:{},dealt:false,play:false,rq:{},ex:[],sst:{},ln:{},err:{A:0,B:0,K:0,W:0,P:0},
    st:{u:null,step:0},pred:{},b:{n:0,open:false,v:{}},za:{},zshow:false,q:-1,qOpen:false,qStart:0,qAns:{},kick:[],url:""});
  let T=store(KEY);if(!T||!T.code)T=fresh();
  let conn={up:0,all:2},pubT=null,subbed="";
  const net=new Net(onMsg,c=>{conn=c;if(c.up)pub();renderHead();});
  function sub(){if(subbed!==T.code){subbed=T.code;net.sub(T.code+"/in");}}
  sub();
  const save=()=>store(KEY,T);
  const players=()=>Object.keys(T.pl);
  const role=id=>T.pl[id]?T.pl[id].r:null;
  const cardName=id=>{const P=T.pl[id];if(!P||P.c==null)return "";return P.r==="H"?PAIRS[P.c].h.n:PAIRS[P.c].u.n;};
  const nick=id=>T.pl[id]?T.pl[id].n:"?";
  const reqOf=id=>Object.values(T.rq).find(r=>r.h===id||r.u===id);
  const inc=id=>T.ex.filter(e=>e.h===id&&e.t!=="W").length;
  const buys=id=>T.ex.filter(e=>e.h===id&&e.t==="W").length;
  const fdn=id=>T.ex.filter(e=>e.h===id||e.u===id).length;

  function onMsg(t,p){
    if(t!==NS+T.code+"/in"||!p||!p.p)return;
    const pid=clean(p.p,12);if(T.kick.includes(pid))return;
    if(p.k==="hi"){const n=clean(p.n,16)||"?";
      if(!T.pl[pid]){T.pl[pid]={n,r:T.dealt?"B":null,c:null};}else T.pl[pid].n=n;
      save();pub();render();return;}
    if(!T.pl[pid])return;
    const n=typeof p.n==="string"?p.n.slice(0,12):"";
    if(n&&T.ln[pid]===n){pub();return;}      /* schon verarbeitet – nur bestätigen */
    let ok=true;
    if(p.k==="rq")onReq(pid,p);
    else if(p.k==="rx")onCancel(pid,p);
    else if(p.k==="an")onAnswer(pid,p);
    else if(p.k==="pr"&&T.ph===2&&T.st.step===1&&Number.isInteger(p.c)&&p.c>=0&&p.c<PRED.length){T.pred[pid]=p.c;}
    else if(p.k==="bv"&&T.ph===3&&T.b.open&&p.a===T.b.n&&Number.isInteger(p.c)&&p.c>=0&&p.c<4){(T.b.v[T.b.n]=T.b.v[T.b.n]||{})[pid]=p.c;}
    else if(p.k==="z"&&T.ph===4&&Number.isInteger(p.i)&&p.i>=0&&p.i<ZU.length&&(p.s===0||p.s===1)&&(p.r===0||p.r===1)){
      const A=(T.za[pid]=T.za[pid]||{});if(!A[p.i])A[p.i]=[p.s,p.r];}
    else if(p.k==="a"&&T.ph===6&&T.qOpen&&p.q===T.q){
      const A=(T.qAns[T.q]=T.qAns[T.q]||{});
      if(!A[pid]){const c=p.c;if(Number.isInteger(c)&&c>=0&&c<QUIZ[T.q].o.length){
        const dur=QUIZ[T.q].pro?DURPRO:DUR,s=(Date.now()-T.qStart)/1000;
        A[pid]={c,g:c===QUIZ[T.q].k?1000+Math.round(500*Math.max(0,1-s/dur)):0};
        if(Object.keys(A).length>=players().length)T.qOpen=false;}}}
    else ok=false;
    if(!ok)return;
    if(n)T.ln[pid]=n;
    save();pub();render();
  }

  /* ---------- Spielen: Anfragen ---------- */
  function onReq(pid,p){
    const P=T.pl[pid];if(T.ph!==1||!T.play||P.r!=="H")return;
    const t=p.t,u=clean(p.u,12);
    if(!(t==="W"||PAIRS[P.c].h.f.includes(t)))return;
    if(reqOf(pid)){T.sst[pid]="Du hast schon eine offene Anfrage.";return;}
    if(!T.pl[u]||T.pl[u].r!=="U"){T.sst[pid]="Dieses Unternehmen gibt es nicht.";return;}
    if(t==="W"&&inc(pid)*PERBUY<=buys(pid)){T.sst[pid]=inc(pid)?"Dein Geld ist ausgegeben. Verdiene erst wieder Einkommen.":"Du hast noch kein Geld. Biete zuerst deine Arbeit an.";return;}
    if(reqOf(u)){T.sst[pid]=`${nick(u)} ist gerade beschäftigt. Versuch es gleich noch einmal oder geh zu einem anderen Unternehmen.`;return;}
    const id=rnd(6);T.rq[id]={id,h:pid,u,t,step:"u",err:0};T.sst[pid]="";T.sst[u]="";
  }
  function onCancel(pid,p){const R=T.rq[p.id];if(!R||R.h!==pid||R.step!=="u")return;delete T.rq[p.id];T.sst[pid]="";T.sst[R.u]=`${nick(pid)} hat die Anfrage zurückgezogen.`;}
  function onAnswer(pid,p){
    const R=T.rq[p.id];if(T.ph!==1||!R||!Number.isInteger(p.c))return;
    if(R.step==="u"&&R.u===pid){
      if(p.c!==UOK[R.t]){R.err++;T.err[R.t]++;T.sst[pid]="Nicht ganz. "+HINT_U[R.t];return;}
      if(R.t==="W"){R.step="h";T.sst[pid]="";T.sst[R.h]="";return;}
      finish(R);return;}
    if(R.step==="h"&&R.h===pid){
      if(p.c!==HOK){R.err++;T.err.P++;T.sst[pid]="Nicht ganz. "+HINT_H;return;}
      finish(R);}
  }
  function finish(R){delete T.rq[R.id];T.ex.push({h:R.h,u:R.u,t:R.t,e:R.err});
    const w=PAIRS[T.pl[R.u].c].u.w;
    if(R.t==="W"){T.sst[R.h]=`ok:Gekauft: ${w}. Du hast mit Konsumausgaben bezahlt.`;T.sst[R.u]=`ok:Verkauft: ${w}. Du hast Konsumausgaben eingenommen.`;}
    else{T.sst[R.h]=`ok:Du gibst ${FN[R.t]} und bekommst ${GELD[R.t]}. Jetzt kannst du einkaufen.`;T.sst[R.u]=`ok:Du bekommst ${FN[R.t]} und zahlst ${GELD[R.t]}.`;}
  }
  function deal(){
    const ids=shuffle(players()),C=shuffle(cardsFor(ids.length));
    ids.forEach((id,i)=>{const c=C[i];Object.assign(T.pl[id],c?{r:c.r,c:c.c}:{r:"B",c:null});});
    T.dealt=true;T.play=false;T.rq={};T.ex=[];T.sst={};T.err={A:0,B:0,K:0,W:0,P:0};
  }
  function sentence(e){const w=PAIRS[T.pl[e.u]?T.pl[e.u].c:0].u.w;
    return e.t==="W"?`${cardName(e.u)} → ${cardName(e.h)}: ${w} · zurück: Konsumausgaben`:`${cardName(e.h)} → ${cardName(e.u)}: ${FN[e.t]} · zurück: ${GELD[e.t]}`;}

  /* ---------- Störung ---------- */
  function affected(){const A={};const u=T.st.u;if(!u)return A;A[u]=9;
    const lost=new Set();
    for(const e of T.ex){if(e.u!==u)continue;if(e.t!=="W"){A[e.h]=1;lost.add(e.h);}else if(!A[e.h])A[e.h]=2;}
    for(const e of T.ex){if(e.t==="W"&&lost.has(e.h)&&e.u!==u&&!A[e.u])A[e.u]=3;}
    return A;}

  /* ---------- Begriffe: Zahlen der Klasse ---------- */
  function counts(){const f={A:0,B:0,K:0};let w=0;for(const e of T.ex){if(e.t==="W")w++;else f[e.t]++;}
    const nf=f.A+f.B+f.K,parts=[f.A?f.A+"× Arbeit":"",f.B?f.B+"× Boden":"",f.K?f.K+"× Kapital":""].filter(Boolean).join(", ");
    const gp=[f.A?f.A+"× Lohn":"",f.B?f.B+"× Miete":"",f.K?f.K+"× Zinsen":""].filter(Boolean).join(", ");
    return {f,w,nf,txt:[nf?parts:"",nf?gp:"",w?w+"× Ware":"",w?w+"× bezahlt":""]};}

  /* ---------- Quiz ---------- */
  function points(pid){let s=0;for(const qi in T.qAns){if(+qi<T.q||(+qi===T.q&&!T.qOpen)){const a=T.qAns[qi][pid];if(a)s+=a.g;}}return s;}
  function ranking(){return players().map(id=>({id,n:T.pl[id].n,s:points(id)})).sort((a,b)=>b.s-a.s);}

  /* ---------- Zustand an alle Handys ---------- */
  function pub(){clearTimeout(pubT);pubT=setTimeout(()=>{
    const pp={},aff=T.ph===2&&T.st.step===2?affected():{};
    for(const id of players()){const P=T.pl[id],R=reqOf(id);
      let rq=null;if(R){const me=R.h===id?"h":"u",o=me==="h"?R.u:R.h;rq={id:R.id,t:R.t,step:R.step,me,o:nick(o),oc:T.pl[o]?T.pl[o].c:0};}
      pp[id]={r:P.r,c:P.c,st:T.sst[id]||"",ln:T.ln[id]||"",rq,tal:[inc(id),buys(id),fdn(id)],a:aff[id]||0,zd:Object.keys(T.za[id]||{}).map(Number)};}
    const S={ph:T.ph,dealt:T.dealt,play:T.play,pp,kick:T.kick,j:players(),
      co:players().filter(id=>T.pl[id].r==="U").map(id=>[id,T.pl[id].c,T.pl[id].n]).sort((a,b)=>a[1]-b[1]),
      fd:T.ph===1?T.ex.slice(-5).reverse().map(sentence):[],ne:T.ex.length,
      st:T.st.u?{c:T.pl[T.st.u]?T.pl[T.st.u].c:0,step:T.st.step}:{c:-1,step:T.st.step},pd:Object.keys(T.pred),
      b:{n:T.b.n,open:T.b.open,vd:Object.keys(T.b.v[T.b.n]||{})},
      q:T.q,qOpen:T.qOpen,ans:[]};
    if(T.ph===6&&T.q>=0){S.ans=Object.keys(T.qAns[T.q]||{});S.rem=T.qOpen?Math.max(0,(QUIZ[T.q].pro?DURPRO:DUR)-(Date.now()-T.qStart)/1000):0;}
    if(T.ph>=6){const r=ranking();S.sc={};let rank=0,last=-1;
      r.forEach((x,i)=>{if(x.s!==last){rank=i+1;last=x.s;}const a=(T.qAns[T.q]||{})[x.id];S.sc[x.id]=[x.s,rank,T.qOpen?0:(a?a.g:0)];});S.np=r.length;}
    net.pub(T.code+"/st",S,true);},120);}
  setInterval(pub,5000);

  function go(ph){if(ph!==1){T.play=false;T.rq={};}T.ph=ph;save();pub();render();}

  /* ---------- Kopfzeile ---------- */
  function joinUrl(){
    const extra=(params.get("broker")?"&broker="+encodeURIComponent(params.get("broker")):"")+(LOCAL?"&bc=1":"");
    if(location.protocol.startsWith("http"))return location.origin+location.pathname+"?s="+T.code+extra;
    if(T.url){const u=T.url.trim();return u+(u.includes("?")?"&":"?")+"s="+T.code+extra;}
    if(LOCAL)return location.href.split("?")[0]+"?s="+T.code+extra;return "";}
  function drawQR(canvas,text){
    const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(!text||typeof QRLib==="undefined"){ctx.fillStyle="#999";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText("keine Adresse",canvas.width/2,canvas.height/2);return;}
    const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();
    const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
    ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}
  function renderHead(){
    $("steps").innerHTML=PHASES.map((p,i)=>`<button data-ph="${i}" class="${i===T.ph?"on":""}">${i} ${p}</button>`).join("");
    $("steps").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.ph));
    $("miniCode").textContent="Code "+T.code;$("miniN").textContent=players().length+" dabei";
    $("conn").innerHTML=`<span class="dot ${conn.up?"on":""}"></span>${conn.up?"verbunden":"keine Verbindung"}`;
    if(!$("bMus")){const b=document.createElement("button");b.id="bMus";b.className="hbtn";b.title="Quiz-Musik an oder aus";b.onclick=()=>{Music.toggle();if(Music.isOn()&&T.ph===6&&T.qOpen)Music.start();renderHead();};$("steps").after(b);}
    $("bMus").textContent=Music.isOn()?"Musik: an":"Musik: aus";
    if(!$("bHelpT")){const b=document.createElement("button");b.id="bHelpT";b.className="hbtn";b.textContent="Erklärung";b.title="Erklärung in einfacher Sprache";b.onclick=()=>openHilfe(T.ph);$("steps").after(b);}
    drawQR($("qrSmall"),joinUrl());}
  let revQ=-2,winDone=false;
  document.addEventListener("pointerdown",()=>Music.unlock());
  function render(){renderHead();const M=$("tMain");[rStart,rPlay,rStoer,rBeg,rZu,rMerk,rQuiz,rWin][T.ph](M);
    if(T.ph===6&&T.qOpen)Music.start();else if(!(T.ph===6&&T.q>=0&&!T.qOpen&&revQ!==T.q))Music.stop();
    if(T.ph===6&&T.q>=0&&!T.qOpen&&revQ!==T.q){revQ=T.q;Music.reveal();}
    if(T.ph===6&&T.qOpen)revQ=-2;
    if(T.ph===7&&!winDone){winDone=true;Music.fanfare();}if(T.ph!==7)winDone=false;}
  const on=(id,f)=>{if($(id))$(id).onclick=()=>{f();save();pub();render();};};

  /* ---------- 0 Start ---------- */
  function rStart(M){
    const pl=Object.entries(T.pl);
    M.innerHTML=`<div class="join"><div><canvas id="qrBig" width="600" height="600"></canvas></div>
      <div><h2 class="big">Wer gibt wem was?</h2>
      <p style="font-size:1.25rem">1. QR-Code mit dem Handy scannen.<br>2. Einen Spitznamen eingeben.<br>3. Gleich bekommt jeder eine Rollenkarte: <b style="color:var(--hh)">Haushalt</b> oder <b style="color:var(--un)">Unternehmen</b>.</p>
      <p class="muted">Code: <span class="code">${T.code}</span><br><span id="jU" style="word-break:break-all"></span></p>
      <p class="muted">Erklärung in einfacher Sprache: auf jedem Handy (Knopf „Hilfe“) und oben über „Erklärung“. Ohne Spiel, z. B. für itslearning: diese Adresse mit <b>?hilfe=1</b> am Ende.</p>
      ${location.protocol.startsWith("http")||LOCAL?"":`<label>Internetadresse dieser Seite (nur nötig, wenn die Datei lokal geöffnet ist)<input id="tUrl" value="${h(T.url)}" placeholder="https://…/kreislauf/"></label>`}
      <h3 style="margin-top:16px">${pl.length} dabei <span class="muted" style="font-size:.9rem;font-weight:400">· Antippen entfernt einen Namen</span></h3>
      <div class="nicks">${pl.map(([id,x])=>`<button data-id="${h(id)}">${h(x.n)}</button>`).join("")}</div>
      <div class="ctrl"><button class="pri" id="bGo">Los: Spielen →</button><button id="bNew">Neue Sitzung (alles löschen)</button></div></div></div>`;
    drawQR($("qrBig"),joinUrl());$("jU").textContent=joinUrl();
    if($("tUrl"))$("tUrl").onchange=e=>{T.url=e.target.value;save();render();};
    M.querySelectorAll(".nicks button").forEach(b=>b.onclick=()=>{const id=b.dataset.id;delete T.pl[id];T.kick.push(id);
      for(const k in T.rq){if(T.rq[k].h===id||T.rq[k].u===id)delete T.rq[k];}save();pub();render();});
    $("bGo").onclick=()=>go(1);
    $("bNew").onclick=()=>{if(window.confirm("Neue Sitzung starten? Alle Namen und Ergebnisse werden gelöscht.")){const u=T.url;T=fresh();T.url=u;save();sub();pub();render();}};
  }

  /* ---------- 1 Spielen ---------- */
  function nodes(){return players().filter(id=>T.pl[id].r==="H"||T.pl[id].r==="U").map(id=>({id,r:T.pl[id].r,c:T.pl[id].c,nick:T.pl[id].n,card:cardName(id)}))
    .sort((a,b)=>a.c-b.c);}
  function rPlay(M){
    const ids=players();
    if(!T.dealt){const C=cardsFor(ids.length),nH=C.filter(c=>c.r==="H").length,nB=ids.length-C.length;
      M.innerHTML=`<h2 class="big">Das Wollknäuel-Spiel – digital</h2>
      <div class="three"><div class="box"><h3 style="color:var(--hh)">Private Haushalte</h3>Ihr könnt <b>arbeiten</b> (manche auch etwas vermieten oder Geld leihen). Dafür bekommt ihr Geld. Mit dem Geld könnt ihr <b>einkaufen</b>.</div>
      <div class="box"><h3 style="color:var(--un)">Unternehmen</h3>Ihr braucht <b>Mitarbeiter</b> und wollt <b>Waren verkaufen</b>. Wartet, bis ein Haushalt zu euch kommt.</div>
      <div class="box"><h3>So geht es</h3>Der Haushalt wählt am Handy, was er tun will, und das Unternehmen. Dann <b>aufstehen, hingehen, Hand geben</b>. Das Unternehmen tippt, was es dafür gibt. Ohne Einkommen kein Einkauf!</div></div>
      <p class="muted">${ids.length} dabei → ${nH} Haushalte, ${nH} Unternehmen${nB>0?`, ${nB} × Staat (Profi-Beobachter)`:""}.</p>
      <div class="ctrl"><button class="pri" id="bDeal">Karten verteilen</button></div>`;
      on("bDeal",deal);return;}
    const late=ids.filter(i=>T.pl[i].r==="B").length,c=counts(),err=T.err;
    const open=Object.values(T.rq).length,errs=err.A+err.B+err.K+err.W+err.P;
    M.innerHTML=`<div class="row" style="justify-content:space-between"><h2 class="big" style="margin:0">${T.play?"Gebt und nehmt!":T.ex.length?"Pause – schaut euch das Netz an":"Bereit?"}</h2>
      <div class="row"><span class="chip g">${c.nf+c.w} × Güter</span><span class="chip m">${c.nf+c.w} × Geld</span>${open?`<span class="chip">${open} unterwegs</span>`:""}</div></div>
      <div class="netwrap" style="margin-top:10px"><div>${netSVG(nodes(),T.ex,{thin:T.ex.length>30})}</div>
      <div><div class="box"><h3>Satzbausteine</h3><p style="font-size:1.15rem">„Ich gebe <b>…</b> an <b>…</b>“<br>„Dafür bekomme ich <b>…</b>“</p></div>
        <div class="box" style="margin-top:10px"><h3>Zuletzt</h3><ul class="feed">${T.ex.slice(-6).reverse().map(e=>`<li>${h(sentence(e))}</li>`).join("")||"<li class='muted'>noch nichts</li>"}</ul></div>
        ${errs?`<div class="box" style="margin-top:10px"><h3>Stolpersteine</h3><p>${errs} Fehlversuche · am häufigsten bei: ${[["A","Lohn für Arbeit"],["B","Miete für Boden"],["K","Zinsen für Kapital"],["W","Ware geben"],["P","Konsumausgaben zahlen"]].filter(x=>err[x[0]]).sort((a,b)=>err[b[0]]-err[a[0]]).slice(0,2).map(x=>x[1]+" ("+err[x[0]]+")").join(", ")}</p></div>`:""}</div></div>
      <div class="ctrl">${T.play?`<button class="pri" id="bStop">Stopp – alle setzen sich</button>`:`<button class="pri" id="bPlay">${T.ex.length?"Weiterspielen":"Spiel starten"}</button>`}
        ${!T.play&&T.ex.length?`<button class="pri" id="bNext">Weiter: Störung →</button>`:""}
        ${!T.play&&(late||!T.ex.length)?`<button id="bRe">Karten neu verteilen${late?` (${late} ohne Karte)`:""}</button>`:""}</div>
      ${!T.play?`<p class="muted">Tipp: Wer nach dem Verteilen kommt, wird „Staat“ (Profi-Beobachter). „Karten neu verteilen“ löscht das Netz.</p>`:""}`;
    on("bPlay",()=>{T.play=true;});on("bStop",()=>{T.play=false;T.rq={};});on("bNext",()=>go(2));
    if($("bRe"))$("bRe").onclick=()=>{if(!T.ex.length||window.confirm("Karten neu verteilen? Das Netz wird gelöscht.")){deal();save();pub();render();}};
  }

  /* ---------- 2 Störung ---------- */
  function rStoer(M){
    const N=nodes();
    if(T.st.step===0||!T.st.u){
      const us=N.filter(n=>n.r==="U").map(n=>({...n,k:T.ex.filter(e=>e.u===n.id).length})).sort((a,b)=>b.k-a.k);
      M.innerHTML=`<h2 class="big">Störung: Ein Unternehmen muss schließen</h2><p class="muted">Wähle ein Unternehmen. Am meisten passiert bei einem Unternehmen mit vielen Fäden – vor allem mit Mitarbeitern.</p>
        <div class="three">${us.map(n=>`<button class="scen" data-id="${h(n.id)}"><b>${h(n.card)}</b>${h(n.nick)} · ${n.k} Fäden · ${T.ex.filter(e=>e.u===n.id&&e.t!=="W").length} Mitarbeiter/Vermieter</button>`).join("")}</div>
        <div class="ctrl"><button id="bSkip">Überspringen: Begriffe →</button></div>`;
      M.querySelectorAll(".scen").forEach(b=>b.onclick=()=>{T.st={u:b.dataset.id,step:1};T.pred={};save();pub();render();});
      on("bSkip",()=>go(3));return;}
    const nm=cardName(T.st.u),cnt=PRED.map((_,i)=>Object.values(T.pred).filter(x=>x===i).length),tot=Object.keys(T.pred).length;
    const head=`<div class="banner info"><b>${h(nm)} schließt.</b> Alle Mitarbeiter verlieren ihren Job, der Laden ist zu.</div>`;
    if(T.st.step===1){
      M.innerHTML=head+`<h2 class="big" style="margin-top:16px">Was passiert jetzt? Vermutet am Handy!</h2>
        <div class="three">${PRED.map((t,i)=>`<div class="box"><p>${h(t)}</p><div class="clock">${cnt[i]}</div></div>`).join("")}</div>
        <p class="muted">${tot} von ${players().length} haben abgestimmt.</p>
        <div class="ctrl"><button class="pri" id="bShow">Auflösen: Fäden reißen →</button></div>`;
      on("bShow",()=>{T.st.step=2;});return;}
    const A=affected(),d=Object.keys(A).filter(i=>A[i]===1),k=Object.keys(A).filter(i=>A[i]===2),f=Object.keys(A).filter(i=>A[i]===3);
    const names=a=>a.map(i=>`<b>${h(cardName(i))}</b>`).join(", ");
    M.innerHTML=head+`<div class="netwrap" style="margin-top:10px"><div>${netSVG(N,T.ex,{dead:T.st.u,aff:A,thin:T.ex.length>30})}</div>
      <div><div class="merk" style="font-size:1.15rem"><b>Kettenreaktion</b><br>
        ${d.length?`① Kein Einkommen mehr: ${names(d)}.<br>`:"① Hier hat niemand gearbeitet – darum verliert niemand sein Einkommen.<br>"}
        ${k.length?`② Diese Kunden bekommen keine Ware mehr: ${names(k)}.<br>`:""}
        ${f.length?`③ Wer kein Einkommen hat, kauft weniger. Weniger Konsumausgaben bei: ${names(f)}.`:d.length?"③ Diese Haushalte haben noch nirgends eingekauft – aber ohne Einkommen können sie es auch nicht mehr.":""}</div>
        <div class="merk"><b>Haushalte und Unternehmen sind voneinander abhängig.</b> Fällt ein Strom weg, fehlt auch der Gegenstrom.</div>
        <p>Eure Vermutung: <b>${cnt[PRED_OK]}</b> von ${tot} lagen richtig.</p>
        <p class="muted">Rot umrandet: verliert Einkommen oder Ware · gelb: verliert Kunden.</p></div></div>
      <div class="ctrl"><button id="bAgain">Anderes Unternehmen</button><button class="pri" id="bNext">Weiter: Begriffe →</button></div>`;
    on("bAgain",()=>{T.st={u:null,step:0};T.pred={};});on("bNext",()=>go(3));
  }

  /* ---------- 3 Begriffe ---------- */
  function rBeg(M){
    const B=T.b,c=counts(),cur=B.n,V=B.v[cur]||{},vc=[0,1,2,3].map(i=>Object.values(V).filter(x=>x===i).length),nv=Object.keys(V).length;
    const last=cur>0?B.v[cur-1]||{}:null,lr=last?Object.values(last).filter(x=>x===cur-1).length:0,ln=last?Object.keys(last).length:0;
    let side="";
    if(cur<4&&B.open)side=`<h3>Pfeil ${cur+1}: Was fließt hier?</h3><p class="muted">${nv} von ${players().length} haben getippt.</p>
      ${BEG.map((b,i)=>`<div class="hbar"><span>${"ABCD"[i]}: ${h(b.t)}</span><div class="t"><i style="width:${nv?100*vc[i]/nv:0}%;background:var(--brand)"></i></div><b>${T.peek?vc[i]:"?"}</b></div>`).join("")}`;
    else if(cur<4)side=`<p style="font-size:1.2rem">Aus eurem Netz wird ein einfaches Bild: nur noch <b>ein</b> Kasten für alle Haushalte und <b>einer</b> für alle Unternehmen.</p>
      <p>Links an den Pfeilen stehen eure Zahlen. Was fließt auf Pfeil ${cur+1}? Erst tippen alle am Handy, dann decken wir auf.</p>`;
    const done=BEG.slice(0,cur).map((b,i)=>`<div class="merk"><b class="${i%2?"m":"g"}">${i+1} · ${b.s}</b> <span class="muted">${b.dir}</span><br><span class="term">${h(b.t)}</span> (${h(b.sub)}) <span class="alt">${h(b.alt)}</span><span class="satz">„${h(b.sb)}“</span></div>`).join("");
    M.innerHTML=`<h2 class="big">Vom Netz zum Wirtschaftskreislauf</h2>
      <div class="two"><div>${kreislauf({rev:cur,hi:cur<4?cur:-1,cnt:c.txt,w:900})}
        ${cur>0&&ln?`<p class="muted">Pfeil ${cur}: ${lr} von ${ln} lagen richtig.</p>`:""}</div>
        <div>${side}${done}</div></div>
      <div class="ctrl">${cur<4?(B.open?`<button class="pri" id="bRev">Aufdecken</button><button id="bPeek">${T.peek?"Zahlen verbergen":"Zahlen live zeigen"}</button>`:`<button class="pri" id="bVote">Pfeil ${cur+1}: am Handy tippen lassen</button><button id="bDirect">ohne Abstimmung aufdecken</button>`):`<button class="pri" id="bNext">Weiter: Zuordnen →</button>`}
        ${cur>0?`<button id="bBack">einen Schritt zurück</button>`:""}</div>`;
    on("bVote",()=>{B.open=true;B.v[cur]={};T.peek=false;});on("bRev",()=>{B.open=false;B.n++;});on("bDirect",()=>{B.n++;});
    on("bBack",()=>{B.open=false;B.n=Math.max(0,B.n-1);});on("bNext",()=>go(4));
    if($("bPeek"))$("bPeek").onclick=()=>{T.peek=!T.peek;render();};
  }

  /* ---------- 4 Zuordnen ---------- */
  function rZu(M){
    const rows=ZU.map((z,i)=>{let n=0,s=0,r=0;for(const id in T.za){const a=T.za[id][i];if(!a)continue;n++;if(a[0]===z.s)s++;if(a[0]===z.s&&a[1]===z.r)r++;}return {z,i,n,s,r};});
    const np=Object.keys(T.za).length,worst=rows.filter(x=>x.n>=2&&!x.z.pro).sort((a,b)=>a.r/a.n-b.r/b.n)[0];
    M.innerHTML=`<h2 class="big">Güterstrom oder Geldstrom? Und in welche Richtung?</h2>
      <p class="muted">Aufgabe 4.2 aus dem Arbeitsblatt – jeder arbeitet in seinem Tempo am Handy. ${np} haben angefangen.</p>
      <table class="mt"><tr><th style="text-align:left">Vorgang</th><th>beantwortet</th><th>Strom richtig</th><th>Strom + Richtung richtig</th>${T.zshow?"<th>Lösung</th>":""}</tr>
      ${rows.map(x=>`<tr class="${worst&&worst.i===x.i?"cur":""}"><td style="text-align:left">${x.i+1}. ${h(x.z.t)}${x.z.pro?' <span class="pro">Profi</span>':""}</td><td>${x.n}</td>
        <td>${x.n?Math.round(100*x.s/x.n)+" %":"–"}</td><td><b>${x.n?Math.round(100*x.r/x.n)+" %":"–"}</b></td>${T.zshow?`<td><span class="chip ${x.z.s?"m":"g"}">${ZS[x.z.s]}</span> ${ZR[x.z.r]}</td>`:""}</tr>`).join("")}</table>
      ${worst&&worst.r<worst.n?`<div class="banner info"><b>Besprechen:</b> Fall ${worst.i+1} hat die meisten Fehler.<span class="satz">${h(worst.z.x)}</span></div>`:""}
      <div class="ctrl"><button id="bSol">${T.zshow?"Lösungen verbergen":"Lösungen zeigen"}</button><button class="pri" id="bNext">Weiter: Merken →</button></div>`;
    on("bSol",()=>{T.zshow=!T.zshow;});on("bNext",()=>go(5));
  }

  /* ---------- 5 Merken ---------- */
  function rMerk(M){
    M.innerHTML=`<h2 class="big">Das merken wir uns</h2><div class="two"><div>${MERK}</div><div>${kreislauf({rev:4,cnt:counts().txt,w:900})}
      <p class="muted">Weiter im Arbeitsblatt: Aufgabe 3 (Vorgemacht), Aufgabe 4.1 (Schaubild beschriften) und Aufgabe 5 (Kreislauf in meinem Betrieb).</p></div></div>
      <div class="ctrl"><button class="pri" id="bNext">Weiter: Prüfungs-Check →</button></div>`;
    on("bNext",()=>go(6));
  }

  /* ---------- 6 Prüfungs-Check ---------- */
  function rQuiz(M){
    if(T.q<0){M.innerHTML=`<h2 class="big">Prüfungs-Check</h2><p style="font-size:1.25rem">${QUIZ.length} Fragen im Stil der IHK-Prüfung, die ersten fünf sind Originalaufgaben oder fast wörtlich. Die letzten beiden sind für Profis <span class="pro">Profi</span>. Richtig ist wichtiger als schnell.</p>
      <div class="ctrl"><button class="pri" id="bQ">Erste Frage →</button></div>`;$("bQ").onclick=()=>openQ(0);return;}
    const Q=QUIZ[T.q],A=T.qAns[T.q]||{},cnt=Q.o.map((_,i)=>Object.values(A).filter(a=>a.c===i).length),n=Object.keys(A).length,dur=Q.pro?DURPRO:DUR;
    M.innerHTML=`<div class="qhead"><div><p class="muted">Frage ${T.q+1} von ${QUIZ.length}${Q.pro?' <span class="pro">Profi</span>':""} · ${n} von ${players().length} geantwortet</p><h2 class="big">${h(Q.q)}</h2></div>
      ${T.qOpen?`<div class="timer" id="tm">${dur}</div>`:""}</div>
      ${Q.g?kreislauf({rev:0,legend:true,w:560,id:"q"}):""}
      <div class="opts">${Q.o.map((o,i)=>`<div class="opt o${i} ${!T.qOpen&&i!==Q.k?"wrong":""}">${"ABCDE"[i]}: ${h(o)}${T.qOpen?"":`<span class="cnt">${cnt[i]}</span>`}</div>`).join("")}</div>
      ${T.qOpen?"":`<div class="merk" style="font-size:1.15rem;margin-top:14px">${h(Q.x)}</div>`}
      <div class="ctrl">${T.qOpen?`<button class="pri" id="bR">Auflösen</button>`:T.q<QUIZ.length-1?`<button class="pri" id="bN">Nächste Frage →</button>`:""}<button id="bW">Zur Siegerehrung</button></div>`;
    if($("bR"))$("bR").onclick=()=>{T.qOpen=false;save();pub();render();};
    if($("bN"))$("bN").onclick=()=>openQ(T.q+1);
    $("bW").onclick=()=>{T.qOpen=false;go(7);};
    if(T.qOpen){clearInterval(window._qt);let lastS=-1;window._qt=setInterval(()=>{const s=Math.max(0,Math.ceil(dur-(Date.now()-T.qStart)/1000));if($("tm"))$("tm").textContent=s;if(s!==lastS){lastS=s;if(s<=10&&s>0)Music.hurry();if(s<=5&&s>0)Music.tick();}
      if(s<=0&&T.qOpen){T.qOpen=false;save();pub();render();}if(!T.qOpen)clearInterval(window._qt);},250);}
  }
  function openQ(i){T.q=i;T.qOpen=true;T.qStart=Date.now();save();pub();render();}

  /* ---------- 7 Sieger ---------- */
  function rWin(M){
    const r=ranking(),f=players().filter(id=>T.pl[id].r==="H"||T.pl[id].r==="U").map(id=>({n:T.pl[id].n,c:cardName(id),r:T.pl[id].r,k:fdn(id)})).sort((a,b)=>b.k-a.k);
    M.innerHTML=`<h2 class="big">Siegerehrung</h2><div class="two"><div><h3>Prüfungs-Check</h3>
      <div class="podium">${[1,0,2].filter(i=>r[i]).map(i=>`<div style="height:${[190,150,120][i]}px"><span>${i+1}.</span>${h(r[i].n)}<br>${r[i].s}</div>`).join("")}</div>
      <ol class="top" style="margin-top:14px">${r.slice(3,10).map((x,i)=>`<li><span>${i+4}. ${h(x.n)}</span><b>${x.s}</b></li>`).join("")}</ol></div>
      <div><h3>Die meisten Fäden im Netz</h3><ol class="top">${f.slice(0,5).map((x,i)=>`<li><span>${i+1}. <span class="chip ${x.r==="H"?"k":"v"}">${h(x.c)}</span>${h(x.n)}</span><b>${x.k}</b></li>`).join("")}</ol>
      <p class="muted">Insgesamt ${T.ex.length} Tauschgeschäfte = ${T.ex.length*2} Fäden: ${T.ex.length} Güterströme und ${T.ex.length} Geldströme.</p></div></div>`;
  }
  render();
}
</script>
<script>
/* =========================================================
   HANDY (Schülerinnen und Schüler)
   ========================================================= */
function phoneApp(){
  $("phone").hidden=false;
  const KEY="kreislauf_p_"+roomCode+(params.get("t")||"");
  let me=store(KEY)||{};if(!me.pid){me.pid=rnd(8);store(KEY,me);}
  let S=null,lastKey="",pending=null,qEnd=0,qSel={},bSel={},pSel=null,ui={a:null},zi=0,zSel={},zRes={},conn={up:0};
  const net=new Net((t,p)=>{if(t===NS+roomCode+"/st"&&p&&typeof p==="object")onState(p);},c=>{conn=c;if(c.up)hello();});
  net.sub(roomCode+"/st");
  const send=o=>{o.p=me.pid;net.pub(roomCode+"/in",o,false);};
  function hello(){if(me.nick)send({k:"hi",n:me.nick});}
  /* Aktion mit Kennung senden und so lange wiederholen, bis die Tafel sie bestätigt */
  function act(o){o.n=rnd(8);const n=o.n;pending={msg:o,done:()=>{const m=mine();return !m||m.ln===n;}};send(o);}
  setInterval(()=>{if(!S)return;
    if(me.nick&&!(S.j||[]).includes(me.pid))hello();
    else if(pending&&!pending.done())send(pending.msg);},2500);
  function onState(p){
    if(p.qOpen&&(!S||!S.qOpen||S.q!==p.q))qEnd=Date.now()+p.rem*1000;
    const oldPh=S?S.ph:-1;S=p;
    if(S.ph!==oldPh)ui={a:null};
    if((S.kick||[]).includes(me.pid)&&me.nick){me={pid:rnd(8)};store(KEY,me);lastKey="";}
    render();
  }
  const mine=()=>(S&&S.pp&&S.pp[me.pid])||null;
  function keyOf(){if(!me.nick)return "join";if(!S)return "wait";const m=mine();
    const base=[S.ph,S.dealt,m&&m.r,m&&m.c,(S.j||[]).includes(me.pid)];
    if(S.ph===1)return JSON.stringify([base,S.play,m&&m.rq,m&&m.st,m&&m.tal,ui,m&&m.r==="B"?S.fd:0,m&&m.r==="H"&&ui.a==="W"||ui.a==="F2"?S.co:0]);
    if(S.ph===2)return JSON.stringify([base,S.st,S.pd.includes(me.pid),m&&m.a,pSel]);
    if(S.ph===3)return JSON.stringify([base,S.b,S.b.vd.includes(me.pid),bSel]);
    if(S.ph===4)return JSON.stringify([base,zi,zSel,zRes]);
    return JSON.stringify([base,S.q,S.qOpen,(S.ans||[]).includes(me.pid),S.sc?S.sc[me.pid]:0,S.np]);}
  function cardHtml(m){
    if(!m||!m.r)return `<div class="card B"><div class="role">Noch keine Karte</div>Gleich verteilt die Lehrkraft die Rollenkarten.</div>`;
    if(m.r==="B")return `<div class="card B"><div class="role">Staat · Profi-Beobachter</div><div class="cd">Im einfachen Kreislauf gibt es dich noch nicht. Du beobachtest das Netz.</div></div>`;
    const P=PAIRS[m.c],x=m.r==="H"?P.h:P.u;
    return `<div class="card ${m.r}"><div class="role">${m.r==="H"?"Privater Haushalt":"Unternehmen"}</div><div class="val">${h(x.n)}</div><div class="cd">${h(x.x)}</div></div>`;}
  function stat(m){if(!m||!m.st)return "";const ok=m.st.startsWith("ok:");return `<div class="status ${ok?"ok":"bad"}">${h(ok?m.st.slice(3):m.st)}</div>`;}
  function render(){const k=keyOf();if(k===lastKey)return;lastKey=k;const P=$("phone");
    const top=`<div class="ph-top"><span>Kreislauf · ${roomCode}</span><span>${h(me.nick||"")} <button class="hbtn" data-help="1">Hilfe</button></span></div>`;
    if(!me.nick){P.innerHTML=top+`<h2>Wer gibt wem was?</h2><p>Gib einen Spitznamen ein.</p>
      <input id="nk" maxlength="16" placeholder="Spitzname" autocomplete="off"><div style="height:10px"></div><button class="pri" id="bJ" style="width:100%">Mitmachen</button>`;
      $("bJ").onclick=()=>{const n=clean($("nk").value,16);if(!n)return;me.nick=n;store(KEY,me);hello();lastKey="";render();};return;}
    if(!S){P.innerHTML=top+`<p>Verbinde mit der Tafel …</p>`;return;}
    const m=mine();
    if(S.ph===0){P.innerHTML=top+`<h2>Du bist drin!</h2><p>Warte, bis es an der Tafel losgeht.</p>
      <div class="merk">Lies schon mal, wie das Spiel geht. Die Erklärung ist in einfacher Sprache.</div><button class="pri" data-help="1" style="width:100%">Wie geht das Spiel?</button>`;return;}
    if(S.ph===1)return rPlay(P,top,m);
    if(S.ph===2)return rStoer(P,top,m);
    if(S.ph===3)return rBeg(P,top);
    if(S.ph===4)return rZu(P,top);
    if(S.ph===5){P.innerHTML=top+`<h2>Das merken wir uns</h2>${MERK}${kreislauf({rev:4,id:"m"})}`;return;}
    if(S.ph===6)return rQuiz(P,top);
    const sc=(S.sc&&S.sc[me.pid])||[0,"–",0];
    P.innerHTML=top+`<h2>Geschafft!</h2><div class="box"><div class="bigpts">Platz ${sc[1]}</div>${sc[0]} Punkte im Prüfungs-Check · ${S.np||"?"} haben mitgespielt</div>
      ${m&&m.tal?`<p>Im Netz hattest du <b>${m.tal[2]}</b> Tauschgeschäfte.</p>`:""}<p>Danke fürs Mitmachen!</p>`;
  }
  const rerender=()=>{lastKey="";render();};

  /* ---------- 1 Spielen ---------- */
  function rPlay(P,top,m){
    if(!S.dealt||!m||!m.r){P.innerHTML=top+cardHtml(m)+`<p>Gleich bekommst du deine Rollenkarte.</p>`;return;}
    if(m.r==="B"){P.innerHTML=top+cardHtml(m)+`<div class="merk"><b>Dein Profi-Auftrag:</b> Du bist der Staat. Beobachte das Netz. Überlege: Welche Fäden würdest du zu den Haushalten und zu den Unternehmen spannen? (Tipp: Steuern, Sozialleistungen, Schulen.) Du berichtest gleich.</div>
      <p><b>Zuletzt im Netz</b> (${S.ne} Tauschgeschäfte):</p><ul class="feed">${(S.fd||[]).map(s=>`<li>${h(s)}</li>`).join("")||"<li class='muted'>noch nichts</li>"}</ul>`;return;}
    const tal=m.tal||[0,0,0],R=m.rq;
    const tally=m.r==="H"?`<p class="muted">Einkommen: ${tal[0]}× · Einkäufe: ${tal[1]}× · noch möglich: ${Math.max(0,tal[0]*PERBUY-tal[1])}</p>`:`<p class="muted">Deine Fäden: ${tal[2]}</p>`;
    if(!S.play){P.innerHTML=top+cardHtml(m)+stat(m)+tally+`<p><b>${S.ne?"Pause. Schau an die Tafel.":"Warte auf den Start."}</b></p>
      ${m.r==="H"?`<div class="merk">Du kannst <b>arbeiten</b> und <b>einkaufen</b>. Aber ohne Einkommen kein Einkauf!</div>`:`<div class="merk">Du brauchst Mitarbeiter und willst verkaufen. Ruf laut, was du suchst!</div>`}`;return;}
    const card=m.r==="H"?PAIRS[m.c].h:PAIRS[m.c].u;
    const mini=`<div class="minicard ${m.r}">${h(card.n)}</div>`;
    /* offene Anfrage */
    if(R){
      const oc=R.me==="h"?PAIRS[R.oc].u:PAIRS[R.oc].h;
      if(R.me==="h"&&R.step==="u"){P.innerHTML=top+mini+`<div class="box"><h2>Geh jetzt zu ${h(R.o)}</h2><p class="ansage" style="font-size:1.6rem">${h(oc.n)}</p>
        <p>Steh auf, geh hin und gib die Hand. Sag: „Ich ${R.t==="W"?"möchte bei dir einkaufen":"gebe dir "+FN[R.t]}.“</p><p class="muted">${h(R.o)} tippt jetzt auf dem Handy, was du dafür bekommst.</p>
        <button id="bX" style="width:100%">Zurückziehen</button></div>`;
        $("bX").onclick=()=>{act({k:"rx",id:R.id});$("bX").textContent="Gesendet …";};return;}
      if(R.me==="u"&&R.step==="u"){const opts=uOpts(R.t,card.w);
        P.innerHTML=top+mini+`<div class="box"><h2>${h(R.o)} kommt zu dir</h2><p><b>${h(oc.n)}</b> ${FOFFER[R.t]}.</p>
          <p><b>Was gibst du ${R.t==="W"?"ihm/ihr":"dafür"}?</b></p>${opts.map((o,i)=>`<button class="pbtn" data-i="${i}">${h(o)}</button>`).join("")}</div>${stat(m)}`;
        P.querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{act({k:"an",id:R.id,c:+b.dataset.i});P.querySelectorAll(".pbtn").forEach(x=>x.disabled=true);b.textContent="Gesendet …";});return;}
      if(R.me==="h"&&R.step==="h"){
        P.innerHTML=top+mini+`<div class="box"><h2>${h(oc.n)} gibt dir: ${h(oc.w)}</h2><p><b>Was gibst du dafür?</b></p>
          ${HOPTS.map((o,i)=>`<button class="pbtn" data-i="${i}">${h(o)}</button>`).join("")}</div>${stat(m)}`;
        P.querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{act({k:"an",id:R.id,c:+b.dataset.i});P.querySelectorAll(".pbtn").forEach(x=>x.disabled=true);b.textContent="Gesendet …";});return;}
      P.innerHTML=top+mini+`<div class="box"><h2>${h(R.o)} bezahlt jetzt …</h2><p>Warte kurz.</p></div>`;return;}
    if(m.r==="U"){P.innerHTML=top+cardHtml(m)+stat(m)+tally+`<div class="merk">Warte, bis ein Haushalt zu dir kommt. Ruf laut, was du suchst: Mitarbeiter? Kunden?</div>`;return;}
    /* Haushalt: Menü, eine Handlung pro Bildschirm */
    const can=tal[0]*PERBUY>tal[1],fs=card.f.split("");
    if(!ui.a){P.innerHTML=top+cardHtml(m)+stat(m)+tally+`<p><b>Was willst du tun?</b></p>
      <button class="pbtn act g" id="aF"><b>Ich gebe etwas</b><br><small>arbeiten${fs.includes("B")?", vermieten":""}${fs.includes("K")?", Geld leihen":""} – dafür bekomme ich Einkommen</small></button>
      <button class="pbtn act m" id="aW" ${can?"":"disabled"}><b>Ich kaufe ein</b><br><small>${can?"Waren oder Dienstleistungen":tal[0]?"Dein Geld ist ausgegeben. Erst wieder arbeiten!":"Geht erst, wenn du Einkommen hast."}</small></button>`;
      $("aF").onclick=()=>{ui=fs.length>1?{a:"F"}:{a:"F2",f:fs[0]};rerender();};
      $("aW").onclick=()=>{if(can){ui={a:"W"};rerender();}};return;}
    const back=`<button id="bB" style="width:100%;margin-top:8px">Zurück</button>`;
    if(ui.a==="F"){P.innerHTML=top+mini+`<p><b>Was gibst du?</b></p>${fs.map(f=>`<button class="pbtn" data-f="${f}">${h(FVERB[f])}</button>`).join("")}`+back;
      P.querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{ui={a:"F2",f:b.dataset.f};rerender();});$("bB").onclick=()=>{ui={a:null};rerender();};return;}
    const t=ui.a==="W"?"W":ui.f;
    P.innerHTML=top+mini+`<p><b>${t==="W"?"Wo kaufst du ein?":"Bei welchem Unternehmen? ("+FN[t]+")"}</b></p>
      ${(S.co||[]).map(([id,c,n])=>`<button class="pbtn" data-u="${h(id)}"><b>${h(PAIRS[c].u.n)}</b><br><small>${t==="W"?h(PAIRS[c].u.w)+" · ":""}Spitzname: ${h(n)}</small></button>`).join("")}`+back;
    P.querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{act({k:"rq",u:b.dataset.u,t});ui={a:null};P.querySelectorAll(".pbtn").forEach(x=>x.disabled=true);b.textContent="Gesendet …";});
    $("bB").onclick=()=>{ui={a:null};rerender();};
  }

  /* ---------- 2 Störung ---------- */
  function rStoer(P,top,m){
    if(S.st.c<0||S.st.step===0){P.innerHTML=top+`<h2>Achtung …</h2><p>Gleich passiert etwas in eurer Wirtschaft. Schau an die Tafel.</p>`;return;}
    const nm=PAIRS[S.st.c].u.n,head=`<div class="banner info"><b>${h(nm)} schließt.</b></div>`;
    if(S.st.step===1){const sent=S.pd.includes(me.pid);
      P.innerHTML=top+head+`<p><b>Was passiert jetzt?</b> Vermute!</p>${PRED.map((t,i)=>`<button class="pbtn ${pSel===i?"sel":""}" data-i="${i}">${h(t)}</button>`).join("")}${sent?`<div class="status ok">Angekommen ✓</div>`:""}`;
      P.querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{pSel=+b.dataset.i;act({k:"pr",c:pSel});rerender();});return;}
    const a=m?m.a:0,msg={9:"Das bist du! Dein Unternehmen ist geschlossen. Du zahlst keinen Lohn mehr und verkaufst nichts mehr.",
      1:"Du verlierst dein Einkommen! Ohne Lohn (oder Miete) kannst du bald nicht mehr einkaufen.",2:"Hier hast du eingekauft. Jetzt bekommst du dort keine Ware mehr.",
      3:"Deine Kunden haben kein Einkommen mehr. Sie kaufen weniger bei dir. Dir fehlen Konsumausgaben."}[a];
    P.innerHTML=top+head+(pSel!=null?`<div class="status ${pSel===PRED_OK?"ok":"bad"}">${pSel===PRED_OK?"Deine Vermutung war richtig!":"Deine Vermutung: "+h(PRED[pSel])}</div>`:"")+
      (msg?`<div class="banner ${a===3?"af":"nf"}" style="font-size:1.05rem">${msg}</div>`:`<p>Dich trifft es diesmal nicht direkt. Schau an die Tafel: Wen trifft es?</p>`)+
      `<div class="merk">Haushalte und Unternehmen sind voneinander abhängig. Fällt ein Strom weg, fehlt auch der Gegenstrom.</div>`;
  }

  /* ---------- 3 Begriffe ---------- */
  function rBeg(P,top){
    const B=S.b;
    if(B.n>=4){P.innerHTML=top+`<h2>Alle vier Pfeile</h2>${kreislauf({rev:4,id:"p"})}<p>Schau an die Tafel.</p>`;return;}
    if(!B.open){P.innerHTML=top+`<h2>Pfeil ${B.n+1}</h2>${kreislauf({rev:B.n,hi:B.n,id:"p"})}<p>Schau an die Tafel. Gleich tippst du, was hier fließt.</p>`;return;}
    const sent=B.vd.includes(me.pid),sel=bSel[B.n];
    P.innerHTML=top+`<h2>Pfeil ${B.n+1}: Was fließt hier?</h2>${kreislauf({rev:B.n,hi:B.n,id:"p"})}
      ${BEG.map((b,i)=>`<button class="pbtn ${sel===i?"sel":""}" data-i="${i}"><b>${"ABCD"[i]}: ${h(b.t)}</b><br><small>${h(b.sub)}</small></button>`).join("")}${sent?`<div class="status ok">Angekommen ✓ Schau an die Tafel.</div>`:""}`;
    P.querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{const a=B.n;bSel[a]=+b.dataset.i;act({k:"bv",a,c:bSel[a]});rerender();});
  }

  /* ---------- 4 Zuordnen ---------- */
  function rZu(P,top){
    const base=ZU.filter(z=>!z.pro).length;
    if(zi>=ZU.length){const ok=Object.keys(zRes).filter(i=>zRes[i]).length;
      P.innerHTML=top+`<h2>Fertig!</h2><div class="box"><div class="bigpts">${ok} von ${Object.keys(zRes).length}</div>ganz richtig (Strom und Richtung)</div><p>Schau an die Tafel.</p>`;return;}
    const z=ZU[zi],s=zSel[zi]||{},done=zRes[zi]!=null;
    let html=top+`<div class="row" style="justify-content:space-between"><span class="muted">Fall ${zi+1} von ${zi<base?base:ZU.length}</span>${z.pro?'<span class="pro">Profi</span>':""}</div>
      <div class="box"><h2 style="font-size:1.25rem">${h(z.t)}</h2></div>`;
    if(!done){
      if(s.s==null){html+=`<p><b>1. Welcher Strom?</b></p><div class="yn"><button class="g2" data-s="0">Güterstrom</button><button class="m2" data-s="1">Geldstrom</button></div>`;}
      else{html+=`<p class="muted">Strom: <b>${ZS[s.s]}</b></p><p><b>2. In welche Richtung?</b></p>${ZR.map((r,i)=>`<button class="pbtn" data-r="${i}">${r}</button>`).join("")}`;}
      P.innerHTML=html;
      P.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{zSel[zi]={s:+b.dataset.s};rerender();});
      P.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{const r=+b.dataset.r,i=zi;zSel[i]={s:s.s,r};zRes[i]=s.s===z.s&&r===z.r;act({k:"z",i,s:s.s,r});rerender();});return;}
    const ok=zRes[zi],sOk=s.s===z.s;
    html+=`<div class="status ${ok?"ok":"bad"}">${ok?"<b>Richtig!</b>":sOk?"<b>Strom richtig, Richtung falsch.</b>":"<b>Leider falsch.</b>"} Lösung: ${ZS[z.s]}, ${ZR[z.r]}</div><p>${h(z.x)}</p>`;
    const next=zi+1;
    if(next===base)html+=`<button class="pri" id="bN" style="width:100%">Profi-Fälle (freiwillig) →</button><button id="bF" style="width:100%;margin-top:8px">Fertig</button>`;
    else html+=`<button class="pri" id="bN" style="width:100%">${next<ZU.length?"Nächster Fall →":"Fertig"}</button>`;
    P.innerHTML=html;$("bN").onclick=()=>{zi=next;rerender();};if($("bF"))$("bF").onclick=()=>{zi=ZU.length;rerender();};
  }

  /* ---------- 6 Prüfungs-Check ---------- */
  function rQuiz(P,top){
    const sc=(S.sc&&S.sc[me.pid])||[0,"–",0];
    if(S.q<0){P.innerHTML=top+`<h2>Prüfungs-Check</h2><p>Gleich geht es los. Lies jede Frage genau. Richtig ist wichtiger als schnell!</p>`;return;}
    const Q=QUIZ[S.q],answered=(S.ans||[]).includes(me.pid),extra=Q.g?kreislauf({rev:0,legend:true,id:"q"}):"";
    if(S.qOpen){
      if(answered||qSel[S.q]!=null){P.innerHTML=top+`<p class="muted">Frage ${S.q+1}</p><h2>${h(Q.q)}</h2><div class="status ${answered?"ok":""}">${answered?"Antwort gespeichert ✓":"Wird gesendet …"} Warte auf die Auflösung.</div>`;return;}
      P.innerHTML=top+`<div class="row" style="justify-content:space-between"><span class="muted">Frage ${S.q+1} von ${QUIZ.length}${Q.pro?' <span class="pro">Profi</span>':""}</span><b id="ptm"></b></div><h2>${h(Q.q)}</h2>${extra}
        ${Q.o.map((o,i)=>`<button class="popt o${i}" data-i="${i}">${"ABCDE"[i]}: ${h(o)}</button>`).join("")}`;
      P.querySelectorAll(".popt").forEach(b=>b.onclick=()=>{const q=S.q;qSel[q]=+b.dataset.i;pending={msg:{k:"a",q,c:+b.dataset.i},done:()=>S.q!==q||!S.qOpen||(S.ans||[]).includes(me.pid)};send(pending.msg);rerender();});
      const t=()=>{const s=Math.max(0,Math.ceil((qEnd-Date.now())/1000));if($("ptm"))$("ptm").textContent=s+" s";};t();clearInterval(window._pt);window._pt=setInterval(t,250);return;}
    const my=qSel[S.q],ok=my===Q.k;
    P.innerHTML=top+`<p class="muted">Frage ${S.q+1} von ${QUIZ.length}</p>
      <div class="status ${my==null?"":ok?"ok":"bad"}">${my==null?"Keine Antwort.":ok?"<b>Richtig!</b> +"+sc[2]+" Punkte":"<b>Leider falsch.</b>"}</div>
      <p><b>Richtig: ${h(Q.o[Q.k])}</b><br>${h(Q.x)}</p>
      <div class="box"><div class="bigpts">${sc[0]} Punkte</div>Platz ${sc[1]} von ${S.np||"?"}</div>`;
  }
  $("phone").addEventListener("click",e=>{if(e.target.closest("[data-help]"))openHilfe(S?S.ph:0);});
  render();
}
const roomCode=(params.get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
if(params.get("hilfe")){document.title="Wer gibt wem was? – Erklärung";openHilfe(-1,true);}else if(roomCode)phoneApp();else tafelApp();
</script>
</body>
</html>
