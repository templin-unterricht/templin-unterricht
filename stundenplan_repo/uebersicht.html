<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Lernstoff – Übersicht</title>
<style>
:root{
  --bg:#f4f6fb;--card:#fff;--ink:#1c2433;--mut:#5d6b82;--line:#dce2ee;--pri:#2b3a67;--priink:#fff;--focus:#7b4dd6;
  --de-bg:#fff4bf;--de-line:#e2b900;--de-ink:#5c4700;
  --mu-bg:#dce9ff;--mu-line:#4a84e8;--mu-ink:#12408f;
  --ok:#14894c;--okbg:#e0f4e9;--new:#d6336c;
  --sh:0 1px 2px rgba(20,30,60,.08),0 4px 14px rgba(20,30,60,.06);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f131b;--card:#192030;--ink:#e8ecf5;--mut:#9aa7bf;--line:#2b3548;--pri:#8ea6ff;--priink:#0b1020;--focus:#b79cff;
  --de-bg:#3a3010;--de-line:#b58f00;--de-ink:#ffe27a;
  --mu-bg:#14284f;--mu-line:#4a7fe0;--mu-ink:#b9d0ff;
  --ok:#4cd08a;--okbg:#113423;--new:#ff7fb0;
  --sh:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Ethiopic","Noto Sans Arabic",sans-serif}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{max-width:1100px;margin:0 auto;padding:0 16px 40px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.top .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;flex:1 1 auto;min-width:0;line-height:1.2}
.top h1 small{display:block;font-size:13px;font-weight:400;color:var(--mut)}
body.embed .top h1{display:none}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;min-width:44px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:var(--sh)}
.iconbtn:hover{border-color:var(--pri)}
select.iconbtn{padding-inline:10px;max-width:180px}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:0 12px;min-height:44px;box-shadow:var(--sh)}
.search input{flex:1;border:0;background:transparent;outline:none;min-width:0;padding:10px 0}
.search:focus-within{border-color:var(--focus)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:12px 0 4px;font-size:13px;color:var(--mut)}
.sw{display:inline-block;width:16px;height:16px;border-radius:5px;vertical-align:-3px;margin-inline-end:6px;border:2px solid}
.sw.de{background:var(--de-bg);border-color:var(--de-line)}
.sw.mu{background:var(--mu-bg);border-color:var(--mu-line)}
.legend label{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-inline-start:auto}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 6px;font-size:14px;color:var(--mut)}
.crumb a{color:var(--pri);text-decoration:none;font-weight:600}
.crumb a:hover{text-decoration:underline}
h2{font-size:20px;margin:22px 0 10px}
h3{font-size:16px;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:start;border:0;background:var(--card);border-radius:18px;padding:14px;cursor:pointer;box-shadow:var(--sh);border-top:6px solid hsl(var(--h) 65% 55%);min-height:150px;text-decoration:none;position:relative}
.tile:hover{transform:translateY(-2px)}
.bub{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;background:hsl(var(--h) 70% 90%)}
@media(prefers-color-scheme:dark){.bub{background:hsl(var(--h) 35% 24%)}.tile{border-top-color:hsl(var(--h) 55% 60%)}}
.tag{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--mut);text-transform:uppercase}
.tn{font-weight:700;line-height:1.25;font-size:15px;overflow-wrap:anywhere;hyphens:auto}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.small{font-size:12.5px;color:var(--mut)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:14px 16px;margin:10px 0}
.hero{display:flex;gap:14px;align-items:flex-start;background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--sh);border-inline-start:8px solid hsl(var(--h) 65% 55%)}
.hero .bub{flex:none;width:64px;height:64px;font-size:38px}
.hero h2{margin:2px 0 6px;font-size:21px}
.hero p{margin:0}
.mods{display:grid;gap:8px;margin:10px 0}
.mod{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:8px 10px;box-shadow:var(--sh);border:2px solid transparent}
.mod:hover{border-color:var(--pri)}
.mod.isdone{background:var(--okbg)}
.mod a.main{flex:1;min-width:0;text-decoration:none;display:flex;gap:10px;align-items:center;padding:6px 2px}
.ml{flex:none;min-width:46px;text-align:center;font-weight:800;font-size:13px;border-radius:10px;padding:6px 6px;background:hsl(var(--h) 70% 90%);color:#222}
@media(prefers-color-scheme:dark){.ml{background:hsl(var(--h) 35% 26%);color:#fff}}
.mtt{min-width:0}
.mtt b{display:block;line-height:1.25}
.cats{display:flex;gap:3px;flex-wrap:wrap;font-size:14px;margin-top:2px;opacity:.95}
.sq{width:44px;height:44px;flex:none;border:0;background:transparent;border-radius:12px;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center}
.sq:hover{background:var(--line)}
.sq.on.chk{color:var(--ok)}
.sq .box{width:26px;height:26px;border-radius:8px;border:3px solid var(--mut);display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
.sq.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.folder{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);text-decoration:none;border:2px dashed var(--line);margin:10px 0}
.folder:hover{border-color:var(--pri)}
.folder .fi{font-size:34px}
.folder b{display:block}
.catg{margin:18px 0 6px;font-weight:700;display:flex;gap:8px;align-items:center}
.mats{display:grid;gap:8px}
.matrow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.mat{flex:1 1 280px;display:flex;align-items:center;gap:12px;text-decoration:none;border-radius:14px;padding:10px 12px;border:2px solid;min-height:56px;box-shadow:var(--sh)}
.mat.de{background:var(--de-bg);border-color:var(--de-line);color:var(--de-ink)}
.mat.mu{background:var(--mu-bg);border-color:var(--mu-line);color:var(--mu-ink)}
.mat:hover{filter:brightness(.97);transform:translateY(-1px)}
.mat .mi{font-size:26px;flex:none}
.mat{flex-wrap:wrap}
.mat .mt{flex:1 1 150px;min-width:0}
.mat .mt b{display:block;line-height:1.25}
.mat .mt small{display:block;opacity:.85}
.mat .mb{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;align-items:center;max-width:46%}
.pill{font-size:11px;font-weight:700;border-radius:99px;padding:2px 8px;background:rgba(0,0,0,.09);white-space:nowrap}
@media(prefers-color-scheme:dark){.pill{background:rgba(255,255,255,.14)}}
.pill.me{background:var(--mu-line);color:#fff}
.pill.new{background:var(--new);color:#fff}
.pill.dl{background:#fff;color:#333;border:1px solid rgba(0,0,0,.2)}
.sol{flex:0 1 auto;display:flex;align-items:center;gap:8px;text-decoration:none;border-radius:14px;padding:10px 14px;border:2px solid var(--de-line);background:var(--de-bg);color:var(--de-ink);font-weight:700;box-shadow:var(--sh)}
.sol.mu{border-color:var(--mu-line);background:var(--mu-bg);color:var(--mu-ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.chip{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12.5px;font-weight:700;background:var(--line);text-decoration:none;color:var(--ink)}
a.chip:hover{background:var(--pri);color:var(--priink)}
.note{font-size:13px;color:var(--mut);margin-top:6px}
.empty{padding:18px;text-align:center;color:var(--mut)}
.nav2{display:flex;gap:10px;justify-content:space-between;margin:22px 0 6px;flex-wrap:wrap}
.nav2 a{flex:1 1 200px;text-decoration:none;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--sh);font-weight:600}
.favs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px}
.favs a{flex:none;min-width:180px;max-width:240px;text-decoration:none;background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--sh);border-inline-start:6px solid hsl(var(--h) 65% 55%)}
.ov{position:fixed;inset:0;background:rgba(10,14,25,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.ov .box{background:var(--card);border-radius:20px;padding:20px;max-width:340px;width:100%;text-align:center}
.ov canvas{width:260px;height:260px;max-width:100%;background:#fff;border-radius:10px;image-rendering:pixelated}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:28px;font-size:12.5px;color:var(--mut)}
.ringwrap{display:flex;align-items:center;gap:12px;margin:12px 0}
.ringwrap .bar{flex:1;height:12px;margin:0}
[dir=rtl] .crumb a:first-child{margin-inline-start:0}
@media(max-width:560px){.mat .mb{max-width:100%;justify-content:flex-start}.top h1{font-size:19px}}
@media print{.top,.legend,.foot,.sq{display:none}}
</style>

var GENERIC=/^(aufgaben|lösungen|lösung|einstiegsmaterial|selbsttest|einstieg|live|digital|übersetzt|mehrsprachig|online-fassung|arbeitsblatt|online|digitales|live-app|pt|es|pt\/es|portugiesisch|de|ar|vi|uk|ti|-|–|·|:)$/i;

  return parts.join(' ').replace(/^[-–·:]+\s*/,'').trim();
}

    return pa-pb;
  });
}

function rangeChips(g,s,ids){
  if(!ids||!ids.length)return '<span class="chip">'+esc(t('allMods'))+'</span>';
  var order=s.modules.map(function(m){return m.id;});
  var idx=ids.map(function(x){return order.indexOf(x);}).filter(function(i){return i>-1;}).sort(function(a,b){return a-b;});
  var out=[],i=0;
  while(i<idx.length){var j=i;while(j+1<idx.length&&idx[j+1]===idx[j]+1)j++;
    var a=s.modules[idx[i]],b=s.modules[idx[j]];
    var lab=i===j?a.label:a.label+'–'+b.label.replace(/^\D+/,'');
    out.push('<a class="chip" href="#/m/'+g.id+'/'+s.id+'/'+a.id+'">'+esc(lab)+'</a>');
    i=j+1;}
  return out.join('');
}

var lastHash=null;
function render(keepScroll){
  var focusQ=document.activeElement&&document.activeElement.id==='q';
  var pos=document.activeElement&&document.activeElement.selectionStart;
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  var body=q.trim().length>=2?viewSearch():route();
  app.innerHTML=top()+'<main>'+body+'</main><div class="foot"><span>'+(lang!=='de'?'🌐 '+esc(t('mt')):'')+'</span><span>'+esc(D.built||'')+'</span></div>';
  if(focusQ){var el=document.getElementById('q');if(el){el.focus();try{el.setSelectionRange(pos,pos);}catch(e){}}}
  if(!keepScroll&&lastHash!==location.hash){window.scrollTo(0,0);}
  lastHash=location.hash;
}
window.addEventListener('hashchange',function(){render(false);});

/* ---------- Ereignisse ---------- */
app.addEventListener('input',function(e){
  if(e.target.id==='q'){q=e.target.value;render(true);}
});
app.addEventListener('change',function(e){
  if(e.target.id==='lang'){lang=e.target.value;try{localStorage.setItem('ds_lang',lang);}catch(x){}render(true);}
  if(e.target.getAttribute&&e.target.getAttribute('data-act')==='onlyLang'){onlyLang=e.target.checked;store.set('ueb_onlylang',onlyLang);render(true);}
});
app.addEventListener('click',function(e){
  var a=e.target.closest&&e.target.closest('[data-act],[data-clear]');
  if(!a)return;
  if(a.hasAttribute('data-clear')){q='';setTimeout(function(){render(false);},0);return;}
  var act=a.getAttribute('data-act'),k=a.getAttribute('data-k');
  if(act==='done'){done[k]=!done[k];if(!done[k])delete done[k];store.set('ueb_done_v1',done);render(true);}
  else if(act==='fav'){favs[k]=!favs[k];if(!favs[k])delete favs[k];store.set('ueb_fav_v1',favs);render(true);}
  else if(act==='qr'){showQR();}
});

function showQR(){
  var url=location.href.split('#')[0].replace(/([?&])embed=1&?/,'$1').replace(/[?&]$/,'');
  var ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="box" role="dialog" aria-modal="true"><h2 style="margin-top:0">'+esc(t('qr'))+'</h2><canvas id="qrc" width="260" height="260"></canvas><p class="small">'+esc(t('qrText'))+'</p><p class="small" style="word-break:break-all">'+esc(url)+'</p><div class="chips" style="justify-content:center"><button class="iconbtn" id="qcp">'+esc(t('copyLink'))+'</button><button class="iconbtn" id="qcl">'+esc(t('close'))+'</button></div></div>';
  document.body.appendChild(ov);
  var close=function(){ov.remove();};
  ov.addEventListener('click',function(e){if(e.target===ov)close();});
  ov.querySelector('#qcl').onclick=close;
  ov.querySelector('#qcp').onclick=function(){var b=this;try{navigator.clipboard.writeText(url).then(function(){b.textContent=t('copied');});}catch(e){}};
  var draw=function(){
    try{
      var c=ov.querySelector('#qrc'),ctx=c.getContext('2d');
      var qr=new QRLib.QRCode(-1,QRLib.ECL.M);qr.addData(url);qr.make();
      var n=qr.getModuleCount(),quiet=2,cell=Math.floor(c.width/(n+quiet*2)),off=Math.floor((c.width-cell*n)/2);
      ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#000';
      for(var r=0;r<n;r++)for(var cc=0;cc<n;cc++)if(qr.isDark(r,cc))ctx.fillRect(off+cc*cell,off+r*cell,cell,cell);
    }catch(e){}
  };
  if(window.QRLib)draw();
  else{var sc=document.createElement('script');sc.src='uebersicht_qr.js';sc.onload=draw;document.head.appendChild(sc);}
}

render(false);
})();
</script>
</body>
</html>
