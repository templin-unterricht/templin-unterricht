<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sturm über dem Hafenstore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: eine schmale App-Spalte wie ein Logbuch – oben Hafenkarte und Anzeigen, darunter die Szene des Tages, dann die Karten mit Entscheidungen. */
:root{
  --bg:#E6ECEE; --paper:#F8FAFA; --ink:#0F2730; --muted:#4D6670; --line:#C5D2D6;
  --accent:#D4511C; --accent-ink:#FFFFFF; --sea:#1D5C6C; --sea-soft:#D3E4E8;
  --ok:#25744A; --ok-soft:#DDF0E4; --bad:#B4271E; --bad-soft:#F8E0DD;
  --krake:#6A46A6; --krake-soft:#E9E1F5; --gold:#B88412;
  --f-display:'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif;
  --f-body:'Atkinson Hyperlegible', 'Segoe UI', Verdana, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B181D; --paper:#132329; --ink:#E3ECEE; --muted:#93AAB2; --line:#284049;
  --accent:#F07A42; --accent-ink:#1A0D06; --sea:#5FB0C2; --sea-soft:#163944;
  --ok:#5EC089; --ok-soft:#163626; --bad:#F2796E; --bad-soft:#3E1C1A;
  --krake:#B595EC; --krake-soft:#2C2240; --gold:#E2B54A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0B181D; --paper:#132329; --ink:#E3ECEE; --muted:#93AAB2; --line:#284049;
  --accent:#F07A42; --accent-ink:#1A0D06; --sea:#5FB0C2; --sea-soft:#163944;
  --ok:#5EC089; --ok-soft:#163626; --bad:#F2796E; --bad-soft:#3E1C1A;
  --krake:#B595EC; --krake-soft:#2C2240; --gold:#E2B54A; color-scheme:dark }
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
.app{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.05;text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:clamp(2.6rem,11vw,4.2rem);text-transform:uppercase}
h2{font-size:1.9rem;text-transform:uppercase}
h3{font-size:1.35rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Kopfleiste */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.hud-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.route{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;min-width:0}
.route i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-style:normal;font-family:var(--f-mono);font-size:.62rem;color:var(--muted);flex:none}
.route i.done{background:var(--sea);border-color:var(--sea);color:var(--paper)}
.route i.now{border-color:var(--accent);color:var(--accent);font-weight:600;transform:scale(1.15)}
.tools{display:flex;gap:6px;flex:none}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.iconbtn[aria-pressed="true"]{background:var(--sea);border-color:var(--sea);color:var(--paper)}
.meters{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center}
.meter{display:flex;flex-direction:column;gap:3px;min-width:0}
.meter .lab{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);gap:4px}
.bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;border-radius:5px;transition:width .6s ease}
.bar.v b{background:var(--ok)} .bar.k b{background:var(--krake)}
.pts{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;text-align:right;line-height:1.1}
.pts small{display:block;font-family:var(--f-body);font-weight:400;font-size:.7rem;color:var(--muted)}

/* Szene */
.scene{margin-top:14px;border-radius:var(--r);overflow:hidden;aspect-ratio:8/3;max-width:100%;background:#9fc3cf;position:relative}
.scene svg{display:block;width:100%;height:100%}
.place{position:absolute;left:10px;bottom:10px;background:rgba(10,30,38,.78);color:#fff;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
.wave{animation:drift 7s ease-in-out infinite alternate}
.wave2{animation:drift 9s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}
.rain{animation:rain .7s linear infinite}
@keyframes rain{from{transform:translate(0,-40px)}to{transform:translate(-20px,40px)}}
.beam{animation:beam 4s ease-in-out infinite alternate;transform-origin:500px 70px}
@keyframes beam{from{opacity:.25;transform:rotate(-8deg)}to{opacity:.6;transform:rotate(8deg)}}
.fw{animation:fw 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fw{0%{transform:scale(.1);opacity:0}20%{opacity:1}100%{transform:scale(1.25);opacity:0}}
.flash{animation:flash 5s linear infinite}
@keyframes flash{0%,88%,100%{opacity:0}90%,93%{opacity:1}}
@media (prefers-reduced-motion: reduce){.wave,.wave2,.rain,.beam,.fw,.flash{animation:none}.bar b{transition:none}}

/* Karten */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;margin-top:14px}
.card.krake{border-color:var(--krake);background:linear-gradient(var(--krake-soft),var(--paper) 70%)}
.situ{background:var(--sea-soft);border-radius:10px;padding:12px 14px}
.q{font-weight:700;font-size:1.12rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:14px 16px;min-height:54px;border-radius:12px;border:2px solid var(--line);background:var(--paper);display:flex;gap:12px;align-items:flex-start;line-height:1.35}
.opt .key{flex:none;width:26px;height:26px;border-radius:7px;background:var(--sea-soft);color:var(--sea);font-family:var(--f-mono);font-weight:600;display:grid;place-items:center;font-size:.85rem}
.opt .tx{min-width:0}
.opt.num .tx{font-family:var(--f-mono);font-weight:600;font-size:1.08rem}
.opt:hover:not(:disabled){border-color:var(--sea)}
.opt.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.opt.sel .key{background:var(--accent);color:var(--accent-ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .ft{display:block;font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--muted);margin-top:3px}
.btn{border:none;border-radius:12px;padding:14px 20px;min-height:52px;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sec{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.wide{width:100%}
.inp{display:flex;gap:8px;align-items:center}
.inp input{flex:1;min-width:0;font-family:var(--f-mono);font-size:1.3rem;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.inp span{font-family:var(--f-mono);font-size:1.2rem;color:var(--muted)}
.hint{border-left:4px solid var(--gold);padding:8px 12px;background:var(--sea-soft);border-radius:0 10px 10px 0;font-size:.95rem}
.fb{display:flex;flex-direction:column;gap:10px}
.way{font-family:var(--f-mono);font-size:.92rem;background:var(--bg);border-radius:10px;padding:10px 12px;overflow-x:auto}
.ihk{font-size:.92rem;color:var(--muted)}
.ihk b{color:var(--ink)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:var(--sea-soft);color:var(--sea)}
.tag.k{background:var(--krake-soft);color:var(--krake)}
.tag.g{background:var(--accent);color:var(--accent-ink)}

/* Hanna */
.talk{display:flex;gap:12px;align-items:flex-start}
.talk svg{width:64px;height:64px;flex:none}
.bubble{position:relative;background:var(--sea-soft);border-radius:14px;padding:10px 14px;min-width:0}
.bubble.k{background:var(--krake-soft)}
.bubble b{display:block}

/* Start */
.hero{padding-block:24px 6px;display:flex;flex-direction:column;gap:12px}
.hero p.lead{font-size:1.1rem;max-width:34ch}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{text-align:left;border:2px solid var(--line);border-radius:var(--r);background:var(--paper);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.mode svg{width:44px;height:44px}
.mode .nm{font-family:var(--f-display);font-weight:800;font-size:clamp(1.25rem,5.5vw,1.6rem);overflow-wrap:anywhere;text-transform:uppercase;line-height:1}
.mode .ds{font-size:.9rem;color:var(--muted)}
.mode.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.prog{display:block;font-size:.78rem;color:var(--muted)}
.prog .bar{display:block;height:6px;margin-top:4px}
.prog .bar b{background:var(--sea)}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700}
label.f input{font:inherit;font-weight:400;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.note{font-size:.85rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{font-size:.85rem;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;max-width:calc(100% - 32px);z-index:20}

/* Ende */
.score{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.score div{background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.score b{display:block;font-family:var(--f-mono);font-size:1.4rem}
.score span{font-size:.75rem;color:var(--muted)}
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:42px;height:42px}
table.res{width:100%;border-collapse:collapse;font-size:.9rem}
table.res td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.res td:last-child{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{display:flex;gap:8px;align-items:center;font-size:.82rem;line-height:1.25;opacity:.35}
.badge.on{opacity:1}
.badge svg{width:40px;height:40px;flex:none}
details{border:1px solid var(--line);border-radius:12px;padding:10px 14px;background:var(--paper)}
details summary{cursor:pointer;font-weight:700}
.wl{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.wl div{border-top:1px solid var(--line);padding-top:8px;font-size:.9rem}

/* Werkzeugkarte */
.overlay{position:fixed;inset:0;background:rgba(5,15,20,.55);z-index:30;display:flex;justify-content:center;align-items:flex-start;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto}
.sheet{background:var(--paper);border-radius:var(--r);max-width:640px;width:100%;padding:18px;display:flex;flex-direction:column;gap:14px}
.sheet h3{font-size:1.3rem}
.tw{overflow-x:auto}
.tw table{border-collapse:collapse;font-size:.88rem;min-width:100%}
.tw td,.tw th{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tw th{background:var(--sea-soft)}
.treppe{display:flex;flex-direction:column-reverse;gap:4px;font-size:.88rem}
.treppe div{background:var(--sea-soft);border-radius:8px;padding:6px 10px}
.treppe div:nth-child(2){margin-left:8%}.treppe div:nth-child(3){margin-left:16%}.treppe div:nth-child(4){margin-left:24%}
.confirm{border:2px solid var(--bad);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.card > .tag{align-self:flex-start}
#code{font-size:1.05rem}
.roles{display:flex;flex-direction:column;gap:6px;background:var(--bg);border:1px dashed var(--sea);border-radius:10px;padding:10px 12px;font-size:.92rem}
.said{align-self:flex-start;border:2px solid var(--sea);background:var(--paper);border-radius:10px;padding:8px 12px;font-weight:700;min-height:44px}
.said[aria-pressed="true"]{background:var(--sea);color:var(--paper)}
.opt-box{padding:10px 14px}
.opt-box summary{font-weight:700}
.opt-box[open]{display:flex;flex-direction:column;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two input{min-width:0;width:100%}
ol.tl{margin:6px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px}
ol.tl li{padding-left:4px}
.tlb{text-align:left;width:100%;border:2px solid var(--accent);background:var(--paper);border-radius:10px;padding:10px 12px;line-height:1.35}
.tlb.right{border-color:var(--ok);background:var(--ok-soft)} .tlb.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tlb:disabled{cursor:default;color:var(--ink)}
.dayp{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dayb{text-align:left;border:2px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-height:58px;line-height:1.25}
.dayb b{font-family:var(--f-display);font-size:1.2rem;text-transform:uppercase}
.dayb span{font-size:.82rem;color:var(--muted);overflow-wrap:anywhere;hyphens:auto}
.dayb{min-width:0}
.dayb:hover{border-color:var(--sea)}
@media (max-width:420px){ .meters{grid-template-columns:1fr 1fr} .pts{grid-column:1/-1;text-align:left;display:flex;gap:8px;align-items:baseline} .pts small{display:inline} .route i{width:18px;height:18px} }
@media (max-width:360px){ .modes{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="app">
  <header id="hud" class="hud" hidden>
    <div class="hud-top"><div class="route" aria-label="Hafenkarte: Tag 1 bis 10"></div>
      <div class="tools"><button class="iconbtn" id="toolbtn" aria-label="Werkzeugkarte öffnen"></button><button class="iconbtn" id="musicbtn" aria-label="Musik an"></button></div></div>
    <div class="meters">
      <div class="meter"><div class="lab"><span>Kundenvertrauen</span><span class="vval mono">50 %</span></div><div class="bar v"><b style="width:50%"></b></div></div>
      <div class="meter"><div class="lab"><span>Krake-Druck</span><span class="kval mono">55 %</span></div><div class="bar k"><b style="width:55%"></b></div></div>
      <div class="pts">0<small>Punkte</small></div>
    </div>
  </header>
  <main id="app"></main>
</div>
<script>
/* ===== DATEN: Kapitel 1–5 =====
   Option: [Text, Fehlertyp (null = richtig), Prüfrechnung]  – die erste Option ist immer richtig, sie wird beim Anzeigen gemischt.
   Frage: id, q, o, w (Rechenweg), p (So steht es in der Prüfung), h (Tipp), n/d (Zahl für Eingabe im Profi-Modus), pro (nur Profi) */
const KAP = [];

KAP.push({
  nr:1, ort:'Weserdeich am Leuchtturm', szene:'deich', modul:'Modul 1 · Das Prozent-Werkzeug',
  titel:'Der Faktor-Kompass',
  story:'Erster Tag. Hanna Lührs wartet am Deich. Der Wind ist kalt. Sie gibt euch einen alten Kompass. „Auf dem Schiff hat mich der Kompass geführt. Im Laden führt euch der Faktor. Plus 19 % heißt mal 1,19. Minus 10 % heißt mal 0,9. Merkt euch das.“',
  wort:['der Faktor','der Grundwert (100 %)','der Prozentwert','der Prozentsatz','der Aufschlag','der Nachlass','runden'],
  dec:[
    {id:'k1d1', s:'Kollegin Jette kauft eine Regenjacke für 148,00 €. Mitarbeiter bekommen 8 % Personalrabatt. Sie steht an deiner Kasse.',
     q:'Welchen Betrag tippst du in die Kasse?',
     o:[['136,16 €',null,'148*0.92'],['159,84 €','Rabatt aufgeschlagen statt abgezogen','148*1.08'],['11,84 €','Nur den Rabatt ausgerechnet, nicht den Zahlbetrag','148*0.08'],['137,04 €','Zurückgerechnet (: 1,08) statt abgezogen','148/1.08'],['133,20 €','Falscher Faktor: 10 % statt 8 %','148*0.9']],
     w:'– 8 % → · 0,92 · 148,00 · 0,92 = 136,16 €', p:'148,00 · 0,92 = 136,16 €',
     y:['weil minus 8 % mal (1 – 0,08) = mal 0,92 bedeutet','weil man beim Rabatt durch 1,08 teilt','weil der Rabatt zum Preis dazukommt'],
     h:'Minus p % heißt mal (1 – p : 100). 1 – 0,08 = ?'},
    {id:'k1d2', s:'Ein Segler kauft ein Marine-Fernglas für 649,00 €. Er leistet eine Anzahlung von 30 %. Den Rest zahlt er bei Abholung.',
     q:'Wie hoch ist die Anzahlung?',
     o:[['194,70 €',null,'649*0.3'],['454,30 €','Restbetrag statt Anzahlung ausgerechnet','649*0.7'],['843,70 €','30 % aufgeschlagen statt Anteil berechnet','649*1.3'],['19,47 €','Komma verrutscht: 3 % statt 30 %','649*0.03'],['499,23 €','Zurückgerechnet (: 1,3) statt Anteil berechnet','649/1.3']],
     w:'30 % von 649,00 € → 649,00 · 0,3 = 194,70 €', p:'649,00 · 0,3 = 194,70 €',
     y:['weil 30 % als Dezimalzahl 0,3 sind und der Prozentwert = Grundwert · 0,3 ist','weil man 649 durch 30 teilt','weil 30 % immer der Rest sind'],
     h:'30 % sind 30 von 100 – also 0,3.'},
    {id:'k1d3', s:'Eine Kundin hat einen Coupon über 25 % auf ihren ganzen Einkauf. Der Einkauf kostet 312,40 €.',
     q:'Wie viel muss sie bezahlen?',
     o:[['234,30 €',null,'312.4*0.75'],['390,50 €','Rabatt aufgeschlagen statt abgezogen','312.4*1.25'],['78,10 €','Nur den Rabatt ausgerechnet','312.4*0.25'],['249,92 €','Zurückgerechnet (: 1,25) statt abgezogen','312.4/1.25'],['281,16 €','Falscher Faktor: 10 % statt 25 %','312.4*0.9']],
     w:'– 25 % → · 0,75 · 312,40 · 0,75 = 234,30 €', p:'312,40 · 0,75 = 234,30 €',
     y:['weil minus 25 % mal 0,75 bedeutet – Preis und Nachlass in einem Schritt','weil man 25 % zum Preis addiert','weil man durch 1,25 teilt'],
     h:'– 25 % → mal (1 – 0,25).'}
  ],
  pool:[
    {id:'q101', q:'+ 19 % Umsatzsteuer. Welcher Faktor?', o:[['· 1,19',null],['· 0,19','Nur der Steueranteil, ohne den Preis'],['· 1,9','Komma verrutscht'],['· 0,81','Minus statt plus'],['· 19','Prozentzahl statt Faktor']], w:'100 % + 19 % = 119 % = 1,19', p:'plus p % → mal (1 + p : 100)'},
    {id:'q102', q:'– 10 % Rabatt. Welcher Faktor?', o:[['· 0,9',null],['· 1,1','Plus statt minus'],['· 0,1','Nur der Rabatt'],['· 0,09','Komma verrutscht'],['· 10','Prozentzahl statt Faktor']], w:'100 % – 10 % = 90 % = 0,9', p:'minus p % → mal (1 – p : 100)'},

function hashStr(t){ let h=1779033703^t.length; for(let i=0;i<t.length;i++){ h=Math.imul(h^t.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return h>>>0; }
function RND(){ if(G&&G.code){ G.rs=(G.rs+0x6D2B79F5)|0; let t=G.rs; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296; } return Math.random(); }
function tagesCode(){ const d=new Date(); return 'HAFEN-'+String(d.getDate()).padStart(2,'0')+String(d.getMonth()+1).padStart(2,'0'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(RND()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pnum(t){ const m=String(t).replace(/\s/g,'').replace(/[€%]/g,'').match(/-?[\d.]*\d(,\d+)?|-?\d+(\.\d+)?/); if(!m) return NaN;
  let x=m[0]; if(x.includes(',')) x=x.replace(/\./g,'').replace(',','.'); else if((x.match(/\./g)||[]).length>1 || /\.\d{3}$/.test(x)&&x.length>5) x=x.replace(/\./g,''); return parseFloat(x); }
function fmtN(v,d){ return v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function isNumOpt(t){ return /^[\d.]+(,\d+)?\s*(€|%)?(\s*je|$)/.test(t); }

/* Gesehene Aufgaben je Modus – zuerst Neues ziehen */
function seen(){ return sget('seen_'+G.mode,[]); }
function markSeen(id){ const s=seen(); if(!s.includes(id)){ s.push(id); sset('seen_'+G.mode,s);} }
function pickFrom(ids,n,label){
  if(G&&G.code) return shuffle(ids).slice(0,n);
  let s=seen(), fresh=ids.filter(i=>!s.includes(i));
  if(fresh.length<n){ // Pool erschöpft → zurücksetzen
    sset('seen_'+G.mode,s.filter(i=>!ids.includes(i)));
    if(ids.length>n && label) toast('Alle Aufgaben aus „'+label+'“ geschafft – jetzt geht es gemischt von vorn los.');
    const rest=shuffle(ids.filter(i=>!fresh.includes(i)));
    return shuffle(fresh).concat(rest).slice(0,n);
  }
  return shuffle(fresh).slice(0,n);
}
function allIds(mode){ const ids=[]; KAP.forEach(k=>{k.dec.forEach(d=>ids.push(d.id)); k.pool.forEach(q=>{ if(mode==='pro'||!q.pro) ids.push(q.id);});}); EREIG.forEach(e=>ids.push(e.id)); FINALE.forEach(f=>ids.push(f.id)); SHOW.forEach(s=>ids.push(s.id)); return ids; }
function wrongList(){ return sget('wrong_'+G.mode,[]); }
function addWrong(id){ const w=wrongList(); if(!w.includes(id)){ w.push(id); sset('wrong_'+G.mode,w);} }
function delWrong(id){ const w=wrongList(); const i=w.indexOf(id); if(i>=0){ w.splice(i,1); sset('wrong_'+G.mode,w); const c=sget('fixed',0)+1; sset('fixed',c); if(c>=5) giveBadge('bz'); } }

function byId(id){
  for(const k of KAP){ for(const d of k.dec) if(d.id===id) return d; for(const q of k.pool) if(q.id===id) return q; }
  return EREIG.find(e=>e.id===id)||FINALE.find(f=>f.id===id)||SHOW.find(s=>s.id===id);
}

/* Spielzustand */
let G = null;
function newGame(mode,team,opt){
  opt=opt||{};
  G = {mode, team:team||'Team Hafen', code:opt.code||'', rs:hashStr((opt.code||'')+'|'+mode+(opt.day!=null?'|'+opt.day:'')), roles:opt.roles||null, turn:0, single:opt.day!=null, ch:opt.day!=null?opt.day:0, step:0, plan:null, pts:0, max:0, V:50, K:55, chRes:[], log:[], over:false, hints:0};
  planChapter(); save(); renderChapter();
}
function save(){ if(G) sset('game',G); }

function planChapter(){
  const c=G.ch;
  if(c<9){
    const k=KAP[c], pro=G.mode==='pro';
    const dec=pickFrom(k.dec.map(d=>d.id),1,'Tag '+(c+1))[0];
    const pool=k.pool.filter(q=>pro||!q.pro).map(q=>q.id);
    const n=pro?3:2;
    let quiz=pickFrom(pool,n,k.titel).map(id=>({id,second:false}));
    const w=wrongList().filter(id=>pool.includes(id) && !quiz.some(q=>q.id===id));
    if(!G.code && w.length && RND()<0.7){ quiz[quiz.length-1]={id:shuffle(w)[0],second:true}; }
    quiz.forEach(q=>{ const it=byId(q.id); q.inp = pro && it.n!==undefined && RND()<0.5; });
    const ev = c>0 ? pickFrom(EREIG.map(e=>e.id),1,'Ereignisse')[0] : null;
    G.plan={dec, why:pro, quiz, ev};
    const steps=['intro','dec']; if(pro) steps.push('why'); if(TALKS[c]) steps.push('talk'); quiz.forEach((q,i)=>steps.push('q'+i)); if(ev) steps.push('ev'); steps.push('sum');
    G.steps=steps;
  } else {
    const chain=pickFrom(FINALE.map(f=>f.id),1,'Finale')[0], show=pickFrom(SHOW.map(s=>s.id),1,'Showdown')[0];
    const f=FINALE.find(x=>x.id===chain);
    G.plan={chain, show, inp:f.steps.map(s=>G.mode==='pro'&&s.n!==undefined&&RND()<0.5)};
    G.steps=['intro','f0','f1','f2','f3','f4','show','end'];
  }
  G.step=0; G.chRes[c]={ok:0,n:0};
}

/* Punkte und Anzeigen */
function addRes(ok,pts,dv,dk,id){
  G.max+=pts; if(ok) G.pts+=pts;
  G.V=Math.max(0,Math.min(100,G.V+dv)); G.K=Math.max(0,Math.min(100,G.K+dk));
  const r=G.chRes[G.ch]; r.n++; if(ok) r.ok++;
  if(id){ if(ok) delWrong(id); else addWrong(id); }
  hud();
}
function hud(){
  const h=$('#hud'); if(!h||!G) return;

  h.querySelector('.bar.k b').style.width=G.K+'%'; h.querySelector('.kval').textContent=Math.round(G.K)+' %';
  h.querySelector('.pts').innerHTML=`${G.pts}<small>Punkte · ${G.mode==='pro'?'Profi':'Anfänger'}</small>`;
}

/* ---------- Kapitel ---------- */
function renderChapter(){
  hud(); save();
  const c=G.ch, st=G.steps[G.step];
  const isFin=c===9, k=KAP[c];
  const sceneKey=isFin?'finale':k.szene, place=isFin?'Hafenfest · Finale':k.ort;
  let body='';
  if(st==='intro') body=introCard();
  app().innerHTML=`<div class="scene">${scene(sceneKey)}<span class="place">${esc(place)}</span></div><div id="stage">${body}</div>`;
  window.scrollTo({top:0});
  if(st==='intro'){ MUSIK.calm(); $('#next').onclick=nextStep; return; }
  runStep(st);
}
function introCard(){
  const c=G.ch;
  if(c===9){ return `<div class="card"><span class="eyebrow">Tag 10 · Finale</span><h2>Das Hafenfest</h2>
    <p>Feuerwerk über der Weser. Tausende Gäste. Und auf der Bühne: der Manager von Krake24. Die Zentrale hat eine letzte Prüfungsaufgabe geschickt – fünf Schritte, eine Kette wie in der IHK-Prüfung. Danach kommt der Showdown.</p>
    <div class="talk">${hannaSVG('neutral')}<div class="bubble"><b>Hanna</b>„Jetzt zählt alles, was ihr gelernt habt. Rechenweg im Kopf, Werkzeugkarte in der Hand. Volle Kraft voraus!“</div></div>
    <p class="note">Im Finale zählt jede Aufgabe doppelt.</p>
    <button class="btn wide" id="next">Zum Finale</button></div>`; }
  const k=KAP[c];
  return `<div class="card"><span class="eyebrow">Tag ${c+1} von 10 · ${esc(k.modul)}</span><h2>${esc(k.titel)}</h2>
    <div class="talk">${hannaSVG('neutral')}<div class="bubble"><b>Hanna</b>${esc(k.story)}</div></div>
    <div><span class="eyebrow">Wortspeicher</span><div class="chips">${k.wort.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>
    <button class="btn wide" id="next">Los geht's</button></div>`;
}
function nextStep(){
  G.step++;
  if(G.step>=G.steps.length){ return; }
  save();
  const st=G.steps[G.step];
  $('#stage').innerHTML=''; runStep(st); window.scrollTo({top:$('.scene').offsetHeight*0.6,behavior:'smooth'});
}
function nextChapter(){
  G.ch++; planChapter(); save(); renderChapter();
}

function runStep(st){
  const c=G.ch, pro=G.mode==='pro';
  if(c<9){
    const k=KAP[c];
    if(st==='dec'){ const d=byId(G.plan.dec); markSeen(d.id);
      ask({tag:'Entscheidung', ctx:d.s, q:d.q, item:d, pts:10, dv:8, dk:-6, kb:8, big:true, input:false}, ok=>{ G._decOk=ok; if(!ok) krakeTaunt(); }); }
    else if(st==='why'){ const d=byId(G.plan.dec);
      if(c===8){ fehlerFrage(d); }
      else askWhy(d); }
    else if(st[0]==='q'){ const qp=G.plan.quiz[+st.slice(1)], it=byId(qp.id); markSeen(it.id);
      ask({tag:qp.second?'Zweite Chance':'Aufgabe', ctx:'', q:it.q, item:it, pts:5, dv:1, dk:-2, kb:2.5, input:qp.inp}); }
    else if(st==='ev'){ const e=byId(G.plan.ev); markSeen(e.id);
      ask({tag:'Zufallsereignis', title:e.t, ctx:e.s, q:e.q, item:e, pts:5, dv:3, dk:-2, kb:2.5, input:false}); }
    else if(st==='talk'){ talkGame(); }
    else if(st==='sum'){ summary(); }
  } else {
    const f=FINALE.find(x=>x.id===G.plan.chain);
    if(st[0]==='f'){ const i=+st.slice(1), s=f.steps[i]; if(i===0) markSeen(f.id);
      ask({tag:'Finale · Schritt '+(i+1)+' von 5', ctx:i===0?f.s:'', q:s.q, item:Object.assign({p:''},s), pts:10, dv:3, dk:-3, kb:4, input:G.plan.inp[i]}); }
    else if(st==='show'){ const s=byId(G.plan.show); markSeen(s.id);
      ask({tag:'Showdown', krake:true, ctx:s.s, q:s.q, item:s, pts:15, dv:10, dk:-10, kb:12, input:false}, ok=>{ if(!ok) krakeTaunt(); }); }
    else if(st==='end'){ renderEnd(); }
  }
}

/* Eine Frage stellen: Multiple Choice oder Eingabe */
function ask(cfg,after){
  const pro=G.mode==='pro', it=cfg.item; const hintText=it.h||(G.ch<9?MERKE[G.ch]:'');
  const correct=it.o[0];
  let opts;
  if(pro) opts=[correct].concat(it.o.slice(1,5));
  else { const wr=shuffle(it.o.slice(1)).slice(0,2); opts=[correct].concat(wr); }
  opts=shuffle(opts);
  const allNum=opts.every(o=>isNumOpt(o[0]));
  const isIn=cfg.input && it.n!==undefined;
  const d=it.d!==undefined?it.d:2, unit=it.u||'';
  const st=$('#stage');
  const card=document.createElement('div'); card.className='card'+(cfg.krake?' krake':'');
  card.innerHTML=`<div class="row" style="justify-content:space-between"><span class="tag ${cfg.tag==='Zufallsereignis'?'g':cfg.krake?'k':''}">${esc(cfg.tag)}</span>${!pro&&hintText?`<button class="btn sec" id="hintb" style="min-height:40px;padding:6px 12px;font-size:.9rem">Hanna fragen (–2)</button>`:''}</div>
    ${rolesHTML()}
    ${cfg.title?`<h3>${esc(cfg.title)}</h3>`:''}
    ${cfg.ctx?`<div class="situ">${esc(cfg.ctx)}</div>`:''}
    <p class="q">${esc(cfg.q)}</p>
    <div id="hintbox"></div>
    ${isIn?`<div class="inp"><input id="ans" type="text" inputmode="decimal" autocomplete="off" placeholder="${d===0?'0':'0,'+'0'.repeat(d)}" aria-label="Ergebnis eingeben"><span>${unit}</span></div><p class="note">Runden: ${d===0?'ganze Zahl':d+' Nachkommastellen'}. Komma oder Punkt geht beide.</p>`
      :`<div class="opts">${opts.map((o,i)=>`<button class="opt ${allNum?'num':''}" data-i="${i}"><span class="key">${'ABCDE'[i]}</span><span class="tx">${esc(o[0])}</span></button>`).join('')}</div>`}
    <button class="btn wide" id="lock" disabled>Entscheidung festlegen</button>
    <div id="fb"></div>`;
  st.appendChild(card);
  MUSIK.tense(G.ch);
  let sel=-1, chosen=false, said=!G.roles;
  const upd=()=>{ card.querySelector('#lock').disabled=!(chosen&&said); };
  const sb=card.querySelector('.said'); if(sb) sb.onclick=()=>{ said=!said; sb.setAttribute('aria-pressed',said); sb.textContent=said?'✓ '+sb.dataset.n+' hat begründet':sb.dataset.n+' hat begründet'; upd(); };
  if(isIn){ const a=card.querySelector('#ans'); a.oninput=()=>{ chosen=!!a.value.trim(); upd(); }; a.onkeydown=e=>{ if(e.key==='Enter'&&a.value.trim()) card.querySelector('#lock').click(); }; }
  else card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ sel=+b.dataset.i; card.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b)); chosen=true; upd(); });
  const hb=card.querySelector('#hintb');
  if(hb) hb.onclick=()=>{ hb.disabled=true; G.pts=Math.max(0,G.pts-2); G.hints++; hud(); card.querySelector('#hintbox').innerHTML=`<div class="hint"><b>Hanna:</b> ${esc(hintText)}</div>`; };
  card.querySelector('#lock').onclick=()=>{
    let ok, fehler='', yourText='';
    if(isIn){ const v=pnum(card.querySelector('#ans').value); ok=Math.abs(v-it.n)<0.5*Math.pow(10,-d)+1e-9;
      yourText=card.querySelector('#ans').value; card.querySelector('#ans').disabled=true;
      if(!ok){ const m=it.o.slice(1).find(o=>isNumOpt(o[0]) && Math.abs(pnum(o[0])-v)<0.5*Math.pow(10,-d)+1e-9); fehler=m?m[1]:'Rechne noch einmal mit der Werkzeugkarte nach.'; } }
    else { ok=opts[sel]===correct; if(!ok) fehler=opts[sel][1];
      card.querySelectorAll('.opt').forEach((b,i)=>{ b.disabled=true; if(opts[i]===correct) b.classList.add('right'); else if(i===sel) b.classList.add('wrong');
        if(opts[i]!==correct && (i===sel || pro)) b.querySelector('.tx').insertAdjacentHTML('beforeend',`<span class="ft">${esc(opts[i][1])}</span>`); }); }
    card.querySelector('#lock').remove(); if(hb) hb.remove(); if(sb) sb.disabled=true; if(G.roles) G.turn++;
    addRes(ok,cfg.pts,ok?cfg.dv:-(cfg.dv+3),ok?cfg.dk:cfg.kb,it.id||null);
    G.log.push({ch:G.ch,id:it.id||null,q:cfg.q,ok,w:it.w||'',p:it.p||'',right:correct[0]});
    MUSIK.calm(); if(ok) MUSIK.ding(); else MUSIK.thud();
    const mood=ok?'happy':'worried', line=(ok?OKLINES:NOLINES)[Math.floor(Math.random()*(ok?OKLINES:NOLINES).length)];
    card.querySelector('#fb').innerHTML=`<div class="fb">
      <div class="talk">${hannaSVG(mood)}<div class="bubble"><b>${ok?'Richtig!':'Nicht ganz.'}</b>${esc(line)}${!ok&&fehler?`<br>Dein Fehler: <b style="display:inline">${esc(fehler)}</b>`:''}${!ok?`<br>Richtig ist: <b style="display:inline">${esc(correct[0])}</b>`:''}</div></div>
      ${it.w?`<div class="way">${esc(it.w)}</div>`:''}
      ${it.p?`<p class="ihk"><b>So steht es in der Prüfung:</b> ${esc(it.p)}</p>`:''}
      <button class="btn wide" id="weiter">Weiter</button></div>`;
    if(after) after(ok);
    save();
    card.querySelector('#weiter').onclick=nextStep;
    card.querySelector('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
  };
}

/* Profi: Begründung mit „weil“ */
function askWhy(d){
  const ok0=G._decOk!==false;
  const opts=shuffle(d.y.map((t,i)=>[t,i===0]));
  const st=$('#stage'); const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<span class="tag">Profi · Begründen</span><p class="q">Begründet: Warum ist ${d.o[0][0].length<60?'„'+esc(d.o[0][0])+'“':'diese Antwort'} richtig?</p><p class="note">Wählt den „weil“-Satz, der fachlich stimmt.</p>
   ${!ok0?`<p class="note">Eure Entscheidung war falsch – begründet jetzt die richtige Antwort. Punkte gibt es nur für richtige Entscheidung <b>und</b> richtige Begründung.</p>`:''}
   <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="key">${'ABC'[i]}</span><span class="tx">Richtig, ${esc(o[0])}.</span></button>`).join('')}</div>
   <button class="btn wide" id="lock" disabled>Begründung festlegen</button><div id="fb"></div>`;
  st.appendChild(card); MUSIK.calm();
  let sel=-1;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ sel=+b.dataset.i; card.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b)); card.querySelector('#lock').disabled=false; });
  card.querySelector('#lock').onclick=()=>{
    const ok=opts[sel][1];
    card.querySelectorAll('.opt').forEach((b,i)=>{ b.disabled=true; if(opts[i][1]) b.classList.add('right'); else if(i===sel) b.classList.add('wrong'); });
    card.querySelector('#lock').remove();
    const full=ok&&ok0;
    addRes(full,5,full?2:0,full?-1:1,null);
    card.querySelector('#fb').innerHTML=`<div class="fb"><div class="talk">${hannaSVG(ok?'happy':'worried')}<div class="bubble"><b>${ok?'Gut begründet.':'Die Begründung passt nicht.'}</b>${ok?(ok0?'Entscheidung und Begründung stimmen: +5 Punkte.':'Begründung richtig – aber die Entscheidung war falsch. Keine Punkte.'):'Richtig ist: … '+esc(d.y[0])+'.'}</div></div>
      <p class="ihk"><b>Satzbaustein:</b> Aussage + „weil/da“ + Fachbegriff.</p><button class="btn wide" id="weiter">Weiter</button></div>`;
    card.querySelector('#weiter').onclick=nextStep; save();
  };
}
/* Profi, Tag 9: Welcher Fehler steckt hinter einer falschen Zahl? */
function fehlerFrage(d){
  const wrongs=d.o.slice(1); const target=wrongs[Math.floor(RND()*wrongs.length)];
  const others=shuffle(wrongs.filter(w=>w!==target && w[1]!==target[1])).slice(0,2).map(w=>[w[1],false]);
  const opts=shuffle([[target[1],true]].concat(others));
  const st=$('#stage'); const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<span class="tag">Profi · Ablenker-Detektiv</span><p class="q">In Hannas Logbuch steht auch die falsche Zahl <span class="mono">${esc(target[0])}</span>. Welcher Fehler steckt dahinter?</p>
   <div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="key">${'ABC'[i]}</span><span class="tx">${esc(o[0])}</span></button>`).join('')}</div>
   <button class="btn wide" id="lock" disabled>Festlegen</button><div id="fb"></div>`;
  st.appendChild(card); MUSIK.calm();
  let sel=-1;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ sel=+b.dataset.i; card.querySelectorAll('.opt').forEach(x=>x.classList.toggle('sel',x===b)); card.querySelector('#lock').disabled=false; });
  card.querySelector('#lock').onclick=()=>{
    const ok=opts[sel][1];
    card.querySelectorAll('.opt').forEach((b,i)=>{ b.disabled=true; if(opts[i][1]) b.classList.add('right'); else if(i===sel) b.classList.add('wrong'); });
    card.querySelector('#lock').remove();
    addRes(ok,5,ok?2:0,ok?-1:1,null);
    card.querySelector('#fb').innerHTML=`<div class="fb"><div class="talk">${hannaSVG(ok?'happy':'worried')}<div class="bubble"><b>${ok?'Fehler erkannt!':'Nicht ganz.'}</b>${esc(target[0])} entsteht so: ${esc(target[1])}.</div></div><button class="btn wide" id="weiter">Weiter</button></div>`;
    card.querySelector('#weiter').onclick=nextStep; save();
  };
}
function krakeTaunt(){ const el=document.createElement('div'); el.className='talk'; el.style.marginTop='10px'; el.innerHTML=`${krakeSVG()}<div class="bubble k">${esc(KRAKELINES[Math.floor(Math.random()*KRAKELINES.length)])}</div>`; const fb=$('#stage .card:last-child #fb .fb'); if(fb) fb.insertBefore(el,fb.lastElementChild); }

/* Rollen im Zweierteam */
function rolesHTML(){
  if(!G||!G.roles) return '';
  const a=G.roles[G.turn%2], b=G.roles[(G.turn+1)%2];
  return `<div class="roles"><span>Am Steuer: <b>${esc(a)}</b> – entscheidet</span><span>Lotse: <b>${esc(b)}</b> – sagt laut, warum („… weil …“)</span><button class="said" type="button" aria-pressed="false" data-n="${esc(b)}">${esc(b)} hat begründet</button></div>`;
}

/* Mini-Spiel: Kundengespräch ordnen (Tag 6–8) */
function talkGame(){
  const t=TALKS[G.ch], pro=G.mode==='pro';
  const pool=shuffle(t.lines.map((x,i)=>({x,i})).concat(pro?[{x:t.wrong,i:-1}]:[]));
  let picked=[];
  const st=$('#stage'); const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<span class="tag">Kundengespräch</span><div class="situ">${esc(t.s)}</div>
    <p class="q">Legt das Gespräch in die richtige Reihenfolge: Tippt die Sätze nacheinander an.${pro?' Achtung: Ein Satz gehört nicht hinein.':''}</p>
    <div><span class="eyebrow">Euer Gespräch</span><ol class="tl" id="tl"></ol></div>
    <div class="opts" id="tp"></div>
    <button class="btn wide" id="lock" disabled>Gespräch festlegen</button><div id="fb"></div>`;
  st.appendChild(card); MUSIK.calm();
  const draw=()=>{
    card.querySelector('#tl').innerHTML=picked.length?picked.map((p,k)=>`<li><button class="tlb" data-k="${k}" type="button">${esc(p.x)}</button></li>`).join(''):'<li class="note">Noch leer – tippt unten den ersten Satz an.</li>';
    card.querySelector('#tp').innerHTML=pool.filter(p=>!picked.includes(p)).map(p=>`<button class="opt" data-i="${pool.indexOf(p)}" type="button"><span class="tx">${esc(p.x)}</span></button>`).join('');
    card.querySelectorAll('#tp .opt').forEach(b=>b.onclick=()=>{ if(picked.length<4){ picked.push(pool[+b.dataset.i]); draw(); } });
    card.querySelectorAll('.tlb').forEach(b=>b.onclick=()=>{ picked.splice(+b.dataset.k,1); draw(); });
    card.querySelector('#lock').disabled=picked.length!==4;
  };
  draw();
  card.querySelector('#lock').onclick=()=>{
    const ok=picked.map(p=>p.i).join()==='0,1,2,3';
    card.querySelector('#lock').remove(); card.querySelector('#tp').remove();
    card.querySelectorAll('.tlb').forEach((b,k)=>{ b.disabled=true; b.classList.add(picked[k].i===k?'right':'wrong'); });
    addRes(ok,5,ok?1:-4,ok?-2:2.5,null);
    G.log.push({ch:G.ch,id:null,q:'Kundengespräch: '+t.s,ok,w:t.lines.map((x,i)=>(i+1)+'. '+x).join(' '),p:t.p,right:'Reihenfolge siehe Rechenweg'});
    card.querySelector('#fb').innerHTML=`<div class="fb"><div class="talk">${hannaSVG(ok?'happy':'worried')}<div class="bubble"><b>${ok?'Starkes Gespräch!':'Die Reihenfolge stimmt noch nicht.'}</b>${ok?'So überzeugt ihr Kunden.':'So geht es:'}</div></div>
      <ol class="tl">${t.lines.map((x,i)=>`<li><span class="eyebrow">${esc(t.tags[i])}</span><br>${esc(x)}</li>`).join('')}</ol>
      ${pro?`<p class="ihk"><b>Gehört nicht hinein:</b> ${esc(t.wrong)} – ${esc(t.fehler)}</p>`:''}
      <p class="ihk"><b>In der Prüfung schreibe ich:</b> ${esc(t.p)}</p>
      <button class="btn wide" id="weiter">Weiter</button></div>`;
    card.querySelector('#weiter').onclick=nextStep; save();
  };
}

/* Tagesbilanz */
function summary(){
  const c=G.ch, r=G.chRes[c], k=KAP[c];
  const perfect=r.ok===r.n;
  if(perfect){ const map={0:'b1',1:'b2',5:'b6',7:'b8',8:'b9'}; if(map[c]) giveBadge(map[c]); }
  const st=$('#stage'); const card=document.createElement('div'); card.className='card';
  card.innerHTML=`<span class="eyebrow">Tagesbilanz · Tag ${c+1}</span><h2>${perfect?'Tag ohne Fehler!':r.ok>=r.n/2?'Guter Tag':'Harter Tag'}</h2>
    <div class="score"><div><b>${r.ok}/${r.n}</b><span>richtig</span></div><div><b>${G.V} %</b><span>Kundenvertrauen</span></div><div><b>${Math.round(G.K)} %</b><span>Krake-Druck</span></div></div>
    <div class="hint"><b>Das nehme ich mit:</b> ${esc(MERKE[c])}</div>
    <button class="btn wide" id="nextday">${G.single?'Zur Auswertung':c===8?'Zum Hafenfest-Finale':'Weiter zu Tag '+(c+2)}</button>`;
  st.appendChild(card); MUSIK.calm();
  card.querySelector('#nextday').onclick=G.single?renderDayEnd:nextChapter;
}
function giveBadge(id){ const b=sget('badges',[]); if(!b.includes(id)){ b.push(id); sset('badges',b); const bd=BADGES.find(x=>x.id===id); toast('Neues Abzeichen: '+bd.t); } }

/* ---------- Ende ---------- */
function renderDayEnd(){
  G.over=true; MUSIK.fanfare(); sdel('game');
  const c=G.ch, r=G.chRes[c], pct=G.max?Math.round(G.pts/G.max*100):0, stars=pct>=85?3:pct>=60?2:1;
  const wr=G.log.filter(l=>!l.ok), name=c<9?KAP[c].titel:'Das Hafenfest', mod=c<9?KAP[c].modul:'Finale · alle Module';
  const best=sget('bestday_'+G.mode,{}); const rec=!best[c]||pct>best[c]; if(rec){ best[c]=pct; sset('bestday_'+G.mode,best); }
  app().innerHTML=`<div class="scene">${scene(c<9?KAP[c].szene:'finale')}<span class="place">Tag ${c+1} · Ergebnis</span></div>
  <div class="card"><span class="eyebrow">Punktekarte zum Zeigen · ${esc(mod)}${G.code?' · Klassen-Challenge '+esc(G.code):''}${G.roles?' · '+esc(G.roles.join(' & ')):''}</span><h2>Tag ${c+1}: ${esc(name)}</h2>
    <div class="stars">${[1,2,3].map(i=>ICON.star(i<=stars)).join('')}</div>
    <div class="talk">${hannaSVG(pct>=60?'happy':'worried')}<div class="bubble"><b>Hanna</b>${pct>=85?'Klarer Kurs! Diesen Tag habt ihr im Griff.':pct>=60?'Gut gemacht. Ein paar Wellen waren noch dabei.':'Das üben wir noch. Spielt den Tag noch einmal – ihr bekommt neue Aufgaben.'}</div></div>
    <div class="score"><div><b>${G.pts}</b><span>von ${G.max} Punkten</span></div><div><b>${pct} %</b><span>${rec?'neuer Tagesrekord!':'Rekord: '+best[c]+' %'}</span></div><div><b>${r.ok}/${r.n}</b><span>richtig · ${G.mode==='pro'?'Profi':'Anfänger'}</span></div></div>
    ${c<9?`<div class="hint"><b>Das nehme ich mit:</b> ${esc(MERKE[c])}</div>`:''}
    ${G.hints?`<p class="note">Hanna-Tipps genutzt: ${G.hints} (je –2 Punkte)</p>`:''}
  </div>
  ${wr.length?`<details class="card"><summary>Das übst du noch (${wr.length})</summary><div class="wl">${wr.map(l=>`<div>${esc(l.q)}<br>Richtig: <b>${esc(l.right)}</b>${l.w?`<div class="way" style="margin-top:6px">${esc(l.w)}</div>`:''}</div>`).join('')}</div></details>`:''}
  <div class="card"><div class="row"><button class="btn" id="again">Tag ${c+1} nochmal</button>${c<9?`<button class="btn sec" id="nxt">Tag ${c+2} spielen</button>`:''}<button class="btn sec" id="home">Startseite</button></div></div>`;
  $('#hud').hidden=true; window.scrollTo(0,0);
  const t=G.team, m=G.mode, o={code:G.code, roles:G.roles};
  $('#again').onclick=()=>newGame(m,t,Object.assign({},o,{day:c}));
  if($('#nxt')) $('#nxt').onclick=()=>newGame(m,t,Object.assign({},o,{day:c+1}));
  $('#home').onclick=renderStart;
}
function renderEnd(){
  if(G.single) return renderDayEnd();
  G.over=true; save(); MUSIK.fanfare();
  const pct=G.max?Math.round(G.pts/G.max*100):0;
  const stars=pct>=85?3:pct>=60?2:1;
  const saved=G.K<=60;
  if(saved) giveBadge('br'); if(G.mode==='pro'&&stars===3) giveBadge('bk');
  const best=sget('best_'+G.mode,null); const rec=!best||pct>best.pct; if(rec) sset('best_'+G.mode,{pct,stars,team:G.team});
  sdel('game');
  const end = G.K<=30?['Krake24 gibt auf!','Der Manager von Krake24 packt seine Sachen. Die Zentrale ist begeistert: Der Hafenstore bleibt – und wird zur Vorzeige-Filiale.','happy']
    : saved?['Gerettet – knapp!','Die Zentrale gibt grünes Licht. Der Hafenstore bleibt. Aber Krake24 lauert noch im Hafenbecken.','happy']
    : ['Krake24 ist noch da …','Die Zentrale gibt euch eine letzte Chance. Revanche? Spielt noch einmal – ihr bekommt neue Aufgaben.','worried'];
  const wr=G.log.filter(l=>!l.ok);
  app().innerHTML=`<div class="scene">${scene(saved?'finale':'sturm')}<span class="place">Hafenfest · Ergebnis</span></div>
  <div class="card"><span class="eyebrow">Punktekarte zum Zeigen${G.code?' · Klassen-Challenge '+esc(G.code):''}${G.roles?' · '+esc(G.roles.join(' & ')):''}</span><h2>${esc(end[0])}</h2>
    <div class="stars">${[1,2,3].map(i=>ICON.star(i<=stars)).join('')}</div>
    <div class="talk">${hannaSVG(end[2])}<div class="bubble"><b>Hanna</b>${esc(end[1])}</div></div>
    <div class="score"><div><b>${G.pts}</b><span>von ${G.max} Punkten</span></div><div><b>${pct} %</b><span>${rec?'neuer Rekord!':'Rekord: '+best.pct+' %'}</span></div><div><b>${G.mode==='pro'?'Profi':'Anf.'}</b><span>${esc(G.team)}</span></div></div>
    <div class="meters"><div class="meter"><div class="lab"><span>Kundenvertrauen</span><span>${G.V} %</span></div><div class="bar v"><b style="width:${G.V}%"></b></div></div><div class="meter"><div class="lab"><span>Krake-Druck</span><span>${Math.round(G.K)} %</span></div><div class="bar k"><b style="width:${G.K}%"></b></div></div></div>
    <table class="res">${G.chRes.map((r,i)=>`<tr><td>${i<9?'Tag '+(i+1)+' · '+esc(KAP[i].modul.replace(/^Modul \d+ · /,'')):'Finale'}</td><td>${r.ok}/${r.n} ${r.ok===r.n?'✓':''}</td></tr>`).join('')}</table>
    ${G.hints?`<p class="note">Hanna-Tipps genutzt: ${G.hints} (je –2 Punkte)</p>`:''}
  </div>
  ${wr.length?`<details class="card"><summary>Das übst du noch (${wr.length})</summary><div class="wl">${wr.map(l=>`<div><b>Tag ${l.ch+1}:</b> ${esc(l.q)}<br>Richtig: <b>${esc(l.right)}</b>${l.w?`<div class="way" style="margin-top:6px">${esc(l.w)}</div>`:''}</div>`).join('')}</div><p class="note" style="margin-top:8px">Diese Aufgaben kommen im nächsten Spiel als „Zweite Chance“ wieder.</p></details>`:''}
  <div class="card"><div class="row"><button class="btn" id="again">Nochmal (${G.mode==='pro'?'Profi':'Anfänger'})</button><button class="btn sec" id="other">${G.mode==='pro'?'Anfänger':'Profi'} spielen</button><button class="btn sec" id="home">Startseite</button></div>
  <p class="note">Beim nächsten Spiel bekommt ihr neue Aufgaben, solange es auf diesem Gerät noch ungesehene gibt.</p></div>`;
  $('#hud').hidden=true; window.scrollTo(0,0);
  const t=G.team, m=G.mode, o={code:G.code, roles:G.roles};
  $('#again').onclick=()=>newGameIntro(m,t,o);
  $('#other').onclick=()=>newGameIntro(m==='pro'?'anf':'pro',t,o);
  $('#home').onclick=renderStart;
}

/* ---------- Werkzeugkarte ---------- */
function openTools(){
  const o=document.createElement('div'); o.className='overlay'; o.setAttribute('role','dialog'); o.setAttribute('aria-label','Werkzeugkarte');
  o.innerHTML=`<div class="sheet"><div class="row" style="justify-content:space-between"><h3>Werkzeugkarte</h3><button class="btn sec" id="cl" style="min-height:40px;padding:6px 14px">Schließen</button></div>
  <div class="tw"><table><tr><th>Prozent</th><th>Faktor</th><th>Prozent</th><th>Faktor</th></tr>
   ${[['+ 5 %','1,05','– 2 %','0,98'],['+ 7 %','1,07','– 3 %','0,97'],['+ 10 %','1,1','– 5 %','0,95'],['+ 19 %','1,19','– 10 %','0,9'],['+ 25 %','1,25','– 20 %','0,8'],['+ 50 %','1,5','– 25 %','0,75'],['+ 60 %','1,6','– 30 %','0,7']].map(r=>`<tr>${r.map((c,i)=>`<td class="${i%2?'mono':''}">${c}</td>`).join('')}</tr>`).join('')}</table></div>
  <p class="note">plus p % → mal (1 + p : 100) · minus p % → mal (1 – p : 100) · zurück → geteilt durch denselben Faktor</p>
  <h3>Die Preistreppe</h3>
  <div class="treppe"><div>Bezugspreis</div><div>+ Handlungskosten = Selbstkosten</div><div>+ Gewinn = Nettoverkaufspreis</div><div>+ Umsatzsteuer = Bruttoverkaufspreis</div></div>
  <p class="note">Vorher: Listeneinkaufspreis – Rabatt – Skonto + Bezugskosten = Bezugspreis (immer netto)</p>
  <h3>Formeln</h3>
  <div class="tw"><table>
   ${[['Kalkulationsfaktor','Bruttoverkaufspreis : Bezugspreis (4 Stellen)'],['Bezugspreis rückwärts','Bruttoverkaufspreis : Faktor'],['Kalkulationszuschlag','(BVP – Bezugspreis) : Bezugspreis · 100'],['Handlungskostenzuschlag','Handlungskosten : Wareneinsatz · 100'],['Gewinnzuschlag','Gewinn : Selbstkosten · 100'],['Preissenkung in %','(alt – neu) : alt · 100'],['alter Preis','neuer Preis : (1 – p : 100)'],['netto aus brutto','brutto : 1,19 (Lebensmittel : 1,07)'],['Einheitspreis','alle Beträge zusammen : Anzahl aller Stücke'],['Grundpreis','Preis : Menge in kg oder l']].map(r=>`<tr><td>${r[0]}</td><td class="mono">${r[1]}</td></tr>`).join('')}</table></div>
  <h3>Runden und Prüfen</h3><p>Zwischenergebnisse nicht runden. Euro: 2 Stellen · Faktor: 4 Stellen. Verkaufspreis größer als Bezugspreis? Faktor größer als 1?</p>
  <h3>Bezugskosten oder Handlungskosten?</h3><p><b>Bezugskosten:</b> Fracht, Porto, Rollgeld, Verpackung des Lieferers, Transportversicherung, Zoll. <b>Handlungskosten:</b> Personal, Miete, Energie, Werbung, Lager, Versicherungen, Büro.</p>
  </div>`;
  document.body.appendChild(o);
  const close=()=>{ o.remove(); $('#toolbtn').focus(); };
  o.querySelector('#cl').onclick=close; o.onclick=e=>{ if(e.target===o) close(); };
  o.addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });
  o.querySelector('#cl').focus();
}

/* ---------- Musik (Web Audio, Standard aus) ---------- */
const MUSIK = (()=>{
  let ctx=null, on=sget('music',false), timer=null, step=0, level=0, master=null, playing=false;
  function ensure(){ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); master=ctx.createGain(); master.gain.value=0.3; master.connect(ctx.destination);}catch(e){ ctx=null; } } return ctx; }
  function tone(f,t,dur,type,vol){ if(!ctx) return; const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type||'triangle'; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05); }
  const bass=[110,110,130.81,98], arp=[220,261.63,329.63,261.63,246.94,293.66,349.23,293.66];
  function tick(){ if(!ctx||!playing) return; const t=ctx.currentTime+0.05, bpm=104+level*4, sp=60/bpm/2;
    for(let i=0;i<4;i++){ const s=step+i, tt=t+i*sp; if(s%2===0) tone(bass[Math.floor(s/8)%4]/1,tt,sp*1.6,'sawtooth',0.07); tone(arp[s%8]*(level>6?2:1),tt,sp*0.8,'triangle',0.05+level*0.004); if(s%4===2) tone(2000,tt,0.03,'square',0.015); }
    step+=4; timer=setTimeout(tick, sp*4*1000-30); }
  function start(){ if(!on||!ensure()) return; if(ctx.state==='suspended') ctx.resume(); if(!playing){ playing=true; tick(); } }
  function stop(){ playing=false; clearTimeout(timer); }
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) stop(); });
  return {
    get on(){return on;},
    unlock(){ if(on) ensure(); },
    toggle(){ on=!on; sset('music',on); if(on){ ensure(); toast('Musik an – bitte leise stellen oder Kopfhörer nutzen.'); } else stop(); return on; },
    tense(l){ level=l||0; start(); },
    calm(){ stop(); },
    stop,
    ding(){ if(on&&ensure()){ const t=ctx.currentTime; tone(659.25,t,0.15,'sine',0.15); tone(987.77,t+0.1,0.25,'sine',0.15);} },
    thud(){ if(on&&ensure()){ const t=ctx.currentTime; tone(155.56,t,0.3,'sine',0.18); tone(116.54,t+0.15,0.4,'sine',0.15);} },
    fanfare(){ stop(); if(on&&ensure()){ const t=ctx.currentTime; [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*0.14,0.5,'triangle',0.16)); } }
  };
})();

/* ---------- Start ---------- */
function boot(){
  const tb=$('#toolbtn'), mb=$('#musicbtn');
  tb.innerHTML=ICON.tool; tb.onclick=openTools;
  const setM=()=>{ mb.innerHTML=MUSIK.on?ICON.musicOn:ICON.musicOff; mb.setAttribute('aria-pressed',MUSIK.on); mb.setAttribute('aria-label',MUSIK.on?'Musik aus':'Musik an'); };
  setM(); mb.onclick=()=>{ MUSIK.toggle(); setM(); };
  sget('x',null);
  renderStart();
}
boot();
