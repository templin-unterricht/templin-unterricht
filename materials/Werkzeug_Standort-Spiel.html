<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Standort-Spiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#edf0ee;--surface:#fff;--surface2:#f6f8f7;--ink:#18221f;--muted:#56655f;--line:#cfd8d4;
  --brand:#0f5c4c;--brand-ink:#fff;--tag:#fff7d6;--tag-line:#d9c77a;--ok:#1f7a3f;--bad:#b3261e;--warn:#a15c00;
  --s0:#3a7a1c;--s1:#0e7c86;--s2:#1f5fae;--s3:#c2410c;--s4:#8537a3;
  --s0-soft:#e1efd8;--s1-soft:#d8eff1;--s2-soft:#dde8f7;--s3-soft:#fbe6dc;--s4-soft:#efe1f5;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111816;--surface:#1a2320;--surface2:#151d1a;--ink:#e8efec;--muted:#9fb0a9;--line:#2f3d38;
  --brand:#5cc2a6;--brand-ink:#0b1512;--tag:#2e2a17;--tag-line:#6e6331;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --s0:#8fd46a;--s1:#5fd0da;--s2:#7fb0ff;--s3:#ff8a5c;--s4:#d59af0;
  --s0-soft:#1f3218;--s1-soft:#163236;--s2-soft:#1b2a40;--s3-soft:#3a2219;--s4-soft:#33203d;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111816;--surface:#1a2320;--surface2:#151d1a;--ink:#e8efec;--muted:#9fb0a9;--line:#2f3d38;
  --brand:#5cc2a6;--brand-ink:#0b1512;--tag:#2e2a17;--tag-line:#6e6331;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --s0:#8fd46a;--s1:#5fd0da;--s2:#7fb0ff;--s3:#ff8a5c;--s4:#d59af0;
  --s0-soft:#1f3218;--s1-soft:#163236;--s2-soft:#1b2a40;--s3-soft:#3a2219;--s4-soft:#33203d;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0 0 .4em;line-height:1.1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.6em 1em}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.45;cursor:default}
input,textarea{font:inherit;width:100%;padding:.6em .7em;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;background:var(--tag);border:2px dashed var(--tag-line);border-radius:12px;padding:.5em .9em;font-family:var(--display);font-weight:800;font-stretch:112%}
.merk{border-left:6px solid var(--brand);background:var(--surface);border-radius:10px;padding:12px 14px;margin:8px 0}
/* ---------- Tafel ---------- */
#tafel header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tafel header h1{font-size:1.35rem;margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.steps button{padding:.35em .8em;font-size:.9rem}
.steps button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mini{display:flex;align-items:center;gap:10px;font-size:.9rem}
.mini canvas{width:64px;height:64px;border-radius:6px;background:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px}
.dot.on{background:var(--ok)}
#tMain{padding:20px 22px 40px;max-width:1400px;margin:0 auto}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.ctrl button{font-size:1.05rem}
.big{font-size:clamp(1.6rem,3.2vw,2.6rem)}
.join{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:28px;align-items:start}
.join canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:14px}
.code{font-family:var(--display);font-size:3rem;font-weight:800;letter-spacing:.12em}
.nicks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nicks button{padding:.3em .7em;font-size:.95rem}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.gitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .4s}
.sortTop{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.sortTop .tag{font-size:clamp(1.5rem,3vw,2.4rem)}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.col{border-radius:14px;padding:12px;background:var(--surface);border:3px solid transparent;min-height:210px;display:flex;flex-direction:column}
.col h3{font-size:1.25rem;margin:0}
.col .m{font-size:.9rem;color:var(--muted);min-height:2.6em}
.col .vbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;margin-top:8px;min-height:90px}
.col .vfill{border-radius:8px 8px 0 0;transition:height .4s;min-height:2px}
.col .num{font-family:var(--display);font-size:1.8rem;font-weight:800;text-align:center}
.col .prev{font-size:.85rem;color:var(--muted);text-align:center}
.col.right{border-color:var(--ok);box-shadow:0 0 0 4px color-mix(in srgb,var(--ok) 25%,transparent)}
.col.dim{opacity:.45}
.banner{border-radius:12px;padding:12px 16px;margin-top:14px;font-size:1.15rem}
.banner.streit{background:color-mix(in srgb,var(--warn) 18%,var(--surface));border:2px solid var(--warn)}
.banner.loes{background:color-mix(in srgb,var(--ok) 15%,var(--surface));border:2px solid var(--ok)}
.why{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin-top:12px}
.why div{background:var(--surface);border-radius:10px;padding:8px 10px;border-left:6px solid var(--line);font-size:.95rem}
.pro{font-size:.75rem;font-weight:700;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:1px 6px;margin-left:6px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer{font-family:var(--display);font-size:3rem;font-weight:800;min-width:2.2em;text-align:center;border-radius:50%;background:var(--surface);border:4px solid var(--brand);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{border-radius:14px;padding:16px;color:#fff;font-size:1.3rem;font-weight:700;position:relative}
.opt small{display:block;font-weight:400;font-size:1rem;opacity:.9}
.o0{background:#b3261e}.o1{background:#1f5fae}.o2{background:#a15c00}.o3{background:#3a7a1c}.o4{background:#8537a3}
.opt.wrong{opacity:.35}
.opt .cnt{position:absolute;right:14px;top:12px;font-family:var(--display);font-size:1.6rem}
.top{list-style:none;padding:0;margin:0;counter-reset:r}
.top li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--surface);margin-bottom:6px;font-size:1.2rem}
.top li b{font-family:var(--display)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:30px}
.podium div{background:var(--brand);color:var(--brand-ink);border-radius:14px 14px 0 0;width:200px;text-align:center;padding:12px;font-family:var(--display);font-weight:800}
.podium span{display:block;font-size:1.4rem}
.strat5{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.strat5 div{border-radius:12px;padding:12px;border-top:8px solid}
@media (max-width:900px){.cols,.strat5{grid-template-columns:1fr 1fr}.join{grid-template-columns:1fr}.opts{grid-template-columns:1fr}}
/* ---------- Handy ---------- */
#phone{max-width:560px;margin:0 auto;padding:14px 16px 40px}
#phone .ph-top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.pbtn{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:14px;border:3px solid transparent;color:var(--ink)}
.pbtn b{display:block;font-family:var(--display);font-size:1.25rem}
.pbtn.sel{outline:4px solid var(--ink);outline-offset:-2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:.55em .8em;border-radius:999px}
.chips button.sel{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.status.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.status.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.popt{display:block;width:100%;margin:10px 0;padding:18px 14px;border-radius:14px;color:#fff;border:none;font-size:1.15rem;font-weight:700;text-align:left}
.popt.sel{outline:5px solid var(--ink);outline-offset:2px}
.bigpts{font-family:var(--display);font-size:2.4rem;font-weight:800}
details{margin-top:10px}
summary{cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div id="tafel" hidden>

    <h1>Wo eröffnest du deinen Laden?</h1>
    <nav class="steps" id="steps"></nav>
    <div class="mini"><canvas id="qrSmall" width="128" height="128"></canvas><div><b id="miniCode"></b><br><span id="miniN"></span><br><span id="conn"></span></div></div>
  </header>
  <main id="tMain"></main>
</div>
<div id="phone" hidden></div>

    const fk=FAK.map((f,i)=>[f,cur.f[i]]).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
    M.innerHTML=`<div class="sortTop"><span class="muted">Geschäft ${T.card+1} von ${CARDS.length}${T.round===2?" · <b>2. Abstimmung</b>":""}</span>
        <span class="tag">${h(C.t)}</span><span class="muted">${cur.n} von ${Object.keys(T.pl).length} abgestimmt</span></div>
      <div class="cols">${ORTE.map((s,i)=>`<div class="col ${sol&&C.e.includes(i)?"right":""} ${sol&&!C.e.includes(i)?"dim":""}" style="background:${svs(i)}">
        <h3 style="color:${sv(i)}">${s.n}</h3><div class="m">${s.m.join(" · ")}</div>
        <div class="vbar">${show?`<div class="num">${pct(cur.c[i],cur.n)} %</div><div class="vfill" style="height:${Math.round(100*cur.c[i]/max)}px;background:${sv(i)}"></div>`:`<div class="num muted">?</div>`}</div>
        ${show&&r1?`<div class="prev">vorher ${pct(r1.c[i],r1.n)} %</div>`:""}</div>`).join("")}</div>
      ${show&&fk.length?`<div class="merk"><b>Eure Gründe:</b> ${fk.map(x=>h(x[0])+" "+x[1]).join(" · ")}</div>`:""}
      ${streit?`<div class="banner streit"><b>Streitfall!</b> Ihr seid euch nicht einig. Sprecht 1 Minute mit eurem Nachbarn: Welcher Standortfaktor ist für dieses Geschäft am wichtigsten? Dann stimmt ihr nochmal ab.</div>`:""}
      ${sol?`<div class="banner loes"><b>Gut passt: ${C.e.map(i=>ORTE[i].n).join(" oder ")}.</b> ${h(C.x)}${C.e.length>1?`<br><span class="muted">Mehrere Orte sind richtig. Entscheidend ist eine Begründung mit Standortfaktoren.</span>`:""}</div>`:""}
      ${show&&C.p?`<div class="merk"><b>Für Profis:</b> ${h(C.p)}</div>`:""}
      ${show&&reasons.length?`<h3 style="margin-top:14px">Eure Begründungen</h3><div class="why">${reasons.map(x=>`<div style="border-left-color:${sv(x.c)}"><b style="color:${sv(x.c)}">${ORTE[x.c].n}</b>${x.pr?'<span class="pro">Profi</span>':""}<br>${h(x.w)}</div>`).join("")}</div>`:""}
      <div class="ctrl">
        <button id="bBack" ${T.card===0&&T.rev===0&&T.round===1?"disabled":""}>← zurück</button>
        ${T.rev===0?`<button class="pri" id="bShow">Ergebnis zeigen</button>`:""}
        ${T.rev===1&&T.round===1?`<button class="${streit?"pri":""}" id="bAgain">Nach Diskussion nochmal abstimmen</button>`:""}
        ${T.rev===1?`<button class="${streit?"":"pri"}" id="bSol">Lösung zeigen</button>`:""}
        ${T.rev===2?(T.card<CARDS.length-1?`<button class="pri" id="bNext">Nächstes Geschäft →</button>`:`<button class="pri" id="bMerk">Weiter: Merken →</button>`):""}
      </div>`;
    const set=(o)=>{Object.assign(T,o);save();pub();render();};
    $("bBack").onclick=()=>{if(T.rev>0)set({rev:T.rev-1});else if(T.round===2)set({round:1,rev:1});else if(T.card>0)set({card:T.card-1,round:1,rev:2});};
    if($("bShow"))$("bShow").onclick=()=>set({rev:1});
    if($("bAgain"))$("bAgain").onclick=()=>set({round:2,rev:0});
    if($("bSol"))$("bSol").onclick=()=>set({rev:2});
    if($("bNext"))$("bNext").onclick=()=>set({card:T.card+1,round:1,rev:0});
    if($("bMerk"))$("bMerk").onclick=()=>go(3);
  }

  function rMerk(M){
    const fsum=FAK.map(()=>0);let tot=0,okk=0;const maj=[];
    CARDS.forEach((c,i)=>{const x=counts(lastKey(i));x.f.forEach((v,j)=>fsum[j]+=v);tot+=x.n;okk+=c.e.reduce((a,e)=>a+x.c[e],0);
      if(x.n){const m=x.c.indexOf(Math.max(...x.c));maj.push(`${h(c.t)}: <b>${ORTE[m].n.split(" · ")[1]}</b>`);}});
    const fr=FAK.map((f,i)=>[f,fsum[i]]).sort((a,b)=>b[1]-a[1]);
    M.innerHTML=`<h2 class="big">Das merken wir uns</h2>
      <div class="cols" style="grid-template-columns:1fr 1fr">
        <div class="box"><h3>Standortfaktoren</h3><p style="font-size:1.2rem">${fr.map(x=>`<span class="tag" style="font-size:1.1rem;margin:4px">${h(x[0])}${x[1]?` <span class="muted">(${x[1]})</span>`:""}</span>`).join(" ")}</p><p class="muted">In Klammern: so oft habt ihr den Grund genannt.</p></div>
        <div class="box"><h3>Standort und Betriebsform</h3><p style="font-size:1.15rem"><b>Innenstadt:</b> Fachgeschäft, Warenhaus<br><b>Stadtrand:</b> Verbrauchermarkt, Fachmarkt, Möbel- und Baumarkt</p>${maj.length?`<p class="muted">Eure Mehrheit: ${maj.join(" · ")}</p>`:""}</div>
      </div>
      <div class="merk" style="font-size:1.15rem"><b>Prüfung:</b> In der Innenstadt ist die <b>Erreichbarkeit für Kunden</b> am wichtigsten – nicht die Parkplätze.</div>
      <div class="merk" style="font-size:1.15rem"><b>Discounter</b> = schmales, flaches Sortiment, sehr niedrige Preise, einfache Ausstattung.</div>
      ${tot?`<p style="font-size:1.15rem">So oft habt ihr einen gut passenden Ort gewählt: <b>${pct(okk,tot)} %</b></p>`:""}
      <p class="muted">Jetzt: Aufgabe 2 im Heft ausfüllen. Danach: Standort-Cup.</p>
      <div class="ctrl"><button class="pri" id="bGo">Weiter: Standort-Cup →</button></div>`;
    $("bGo").onclick=()=>go(4);
  }

  let tick=null;
  function rCup(M){
    clearInterval(tick);
    if(T.q<0){
      M.innerHTML=`<h2 class="big">Standort-Cup</h2>
        <p style="font-size:1.25rem">${QUIZ.length} Fragen · je ${DUR} Sekunden · Antwort auf dem Handy.<br><b>Richtig = 1000 Punkte</b>, dazu bis zu 500 Punkte für Tempo.<br>Erst lesen, dann tippen: Richtig ist wichtiger als schnell!</p>
        <div class="ctrl"><button class="pri" id="bQ">Erste Frage starten</button></div>`;
      $("bQ").onclick=startQ;return;}
    const Q=QUIZ[T.q],A=T.qAns[T.q]||{},cnt=Q.o.map((_,i)=>Object.values(A).filter(a=>a.c===i).length);
    const nA=Object.keys(A).length,nP=Object.keys(T.pl).length,open=T.qOpen;
    const r=ranking().slice(0,5);
    M.innerHTML=`<div class="qhead"><div><span class="muted">Frage ${T.q+1} von ${QUIZ.length} · ${nA} von ${nP} geantwortet</span><h2 class="big" style="margin-top:6px">${h(Q.q)}</h2></div>
        ${open?`<div class="timer" id="tm">${DUR}</div>`:""}</div>
      <div class="opts">${Q.o.map((o,i)=>`<div class="opt o${i} ${!open&&i!==Q.k?"wrong":""}">${"ABCDE"[i]}: ${h(o)}${!open?`<span class="cnt">${cnt[i]}</span>`:""}</div>`).join("")}</div>
      ${!open?`<div class="banner loes"><b>Richtig: ${h(Q.o[Q.k])}</b><br>${h(Q.x)}</div>
        <h3 style="margin-top:16px">Top 5</h3><ol class="top">${r.map((x,i)=>`<li><span>${i+1}. ${h(x.n)}</span><b>${x.s}</b></li>`).join("")}</ol>`:""}
      <div class="ctrl">${open?`<button id="bStop">Zeit beenden</button>`:(T.q<QUIZ.length-1?`<button class="pri" id="bQ">Nächste Frage →</button>`:`<button class="pri" id="bWin">Siegerehrung →</button>`)}</div>`;
    if(open){const upd=()=>{const s=Math.max(0,Math.ceil(DUR-(Date.now()-T.qStart)/1000));if($("tm"))$("tm").textContent=s;if(s<=0){closeQ();save();pub();render();}};upd();tick=setInterval(upd,250);
      $("bStop").onclick=()=>{closeQ();save();pub();render();};}
    if($("bQ"))$("bQ").onclick=startQ;
    if($("bWin"))$("bWin").onclick=()=>go(5);
  }
  function startQ(){T.q++;T.qOpen=true;T.qStart=Date.now();T.qAns[T.q]={};save();pub();render();}

  function rWin(M){
    clearInterval(tick);const r=ranking();
    const pod=[r[1],r[0],r[2]],hgt=[150,210,110],pl=["2","1","3"];
    M.innerHTML=`<h2 class="big" style="text-align:center">Siegerehrung</h2>
      <div class="podium">${pod.map((x,i)=>x?`<div style="height:${hgt[i]}px"><span>${pl[i]}. Platz</span>${h(x.n)}<br>${x.s}</div>`:"").join("")}</div>
      <ol class="top" style="max-width:520px;margin:24px auto">${r.slice(3,10).map((x,i)=>`<li><span>${i+4}. ${h(x.n)}</span><b>${x.s}</b></li>`).join("")}</ol>
      <p class="muted" style="text-align:center">Jede und jeder sieht den eigenen Platz auf dem Handy.</p>
      <div class="ctrl" style="justify-content:center"><button id="bRe">Cup neu starten</button></div>`;
    $("bRe").onclick=()=>{T.q=-1;T.qOpen=false;T.qAns={};go(4);};
  }
  if(T.ph===4&&T.qOpen&&Date.now()-T.qStart>DUR*1000)T.qOpen=false;
  render();pub();
}

/* =========================================================
   HANDY (Azubis)
   ========================================================= */
function phoneApp(){
  $("phone").hidden=false;
  const KEY="standort_p_"+roomCode;
  let me=store(KEY)||{};if(!me.pid){me.pid=rnd(8);store(KEY,me);}
  let S=null,lastKey="",pending=null,qEnd=0,draft={w:"",pr:"",pro:false},gSel=[],vSel={},fSel={},qSel={},conn={up:0};
  const net=new Net((t,p)=>{if(t===NS+roomCode+"/st"&&p&&typeof p==="object"){onState(p);}},c=>{conn=c;if(c.up)hello();});
  net.sub(roomCode+"/st");
  const send=o=>{o.p=me.pid;net.pub(roomCode+"/in",o,false);};
  function hello(){if(me.nick)send({k:"hi",n:me.nick});}
  setInterval(()=>{
    if(!S)return;
    if(me.nick&&!(S.j||[]).includes(me.pid))hello();
    else if(pending&&pending.ph===S.ph&&!(S.ans||[]).includes(me.pid))send(pending.msg);
  },2500);
  function onState(p){
    if(S&&S.q!==p.q)qSel={};
    if(p.qOpen&&(!S||!S.qOpen||S.q!==p.q))qEnd=Date.now()+p.rem*1000;
    S=p;
    if((S.kick||[]).includes(me.pid)&&me.nick){me={pid:rnd(8)};store(KEY,me);lastKey="";}
    render();
  }
  function keyOf(){if(!me.nick)return "join";if(!S)return "wait";
    return [S.ph,S.card,S.round,S.rev,S.q,S.qOpen,(S.ans||[]).includes(me.pid),S.ph>=4?JSON.stringify(S.sc&&S.sc[me.pid]):""].join("|");}
  function render(){const k=keyOf();if(k===lastKey)return;lastKey=k;const P=$("phone");
    const top=`<div class="ph-top"><span>Standort-Spiel · ${roomCode}</span><span>${h(me.nick||"")}</span></div>`;
    if(!me.nick){P.innerHTML=top+`<h2>Willkommen!</h2><p>Gib einen Spitznamen ein. Er erscheint in der Rangliste.</p>
      <input id="nk" maxlength="16" placeholder="Spitzname" autocomplete="off"><div style="height:10px"></div><button class="pri" id="bJ" style="width:100%">Mitmachen</button>
      ${(S&&(S.kick||[]).length)?"":""}`;
      $("bJ").onclick=()=>{const n=clean($("nk").value,16);if(!n)return;me.nick=n;store(KEY,me);hello();lastKey="";render();};return;}
    if(!S){P.innerHTML=top+`<p>Verbinde mit der Tafel …</p>`;return;}
    const answered=(S.ans||[]).includes(me.pid);
    if(S.ph===0){P.innerHTML=top+`<h2>Du bist drin!</h2><p>Warte, bis es an der Tafel losgeht.</p>`;return;}
    if(S.ph===1){
      P.innerHTML=top+`<h2>Ihr wollt einen Laden eröffnen.</h2><p>Worauf achtest du bei der Wahl des Ortes? Tippe bis zu 3 Gründe an.</p>
        <div class="chips">${FAK.map((c,i)=>`<button data-i="${i}" class="${gSel.includes(i)?"sel":""}">${h(c)}</button>`).join("")}</div>
        <div style="height:12px"></div><button class="pri" id="bG" style="width:100%">Abschicken</button>
        ${answered?`<div class="status ok">Angekommen ✓ Du kannst noch ändern und neu abschicken.</div>`:""}`;
      P.querySelectorAll(".chips button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(gSel.includes(i))gSel=gSel.filter(x=>x!==i);else if(gSel.length<3)gSel=gSel.concat(i);else return;b.classList.toggle("sel");});
      $("bG").onclick=()=>{pending={ph:1,msg:{k:"g",a:gSel}};send(pending.msg);$("bG").textContent="Gesendet …";};return;}
    if(S.ph===2){
      const C=CARDS[S.card],vk=S.card+":"+S.round,my=vSel[vk],fs=fSel[vk]||(fSel[vk]=[]);
      if(S.rev===0){
        P.innerHTML=top+`<p class="muted">Geschäft ${S.card+1} von ${CARDS.length}${S.round===2?" · 2. Abstimmung":""}</p>
          <div class="tag" style="font-size:1.4rem">${h(C.t)}</div><p>Wo eröffnest du diesen Laden? Tippe.</p>
          ${ORTE.map((s,i)=>`<button class="pbtn ${my===i?"sel":""}" data-i="${i}" style="background:${svs(i)};border-color:${sv(i)}"><b style="color:${sv(i)}">${s.n}</b>${s.m.join(" · ")}</button>`).join("")}
          <div class="status ok" id="vst" ${answered?"":"hidden"}>Abgestimmt ✓ Du kannst noch ändern.</div>
          <p><b>Warum?</b> Tippe die Gründe an:</p>
          <div class="chips" id="fc">${FAK.map((c,i)=>`<button data-i="${i}" class="${fs.includes(i)?"sel":""}">${h(c)}</button>`).join("")}</div>
          <details ${draft.w?"open":""}><summary>Eigene Begründung (freiwillig, ohne Namen an der Tafel)</summary><p class="muted">Satzanfang: „Wir wählen …, weil …“</p><textarea id="tw" rows="2" maxlength="140">${h(draft.w)}</textarea></details>
          <details ${draft.pro?"open":""} id="dp"><summary>Profi-Auftrag</summary><p>${h(C.p||PROFI)}</p><textarea id="tp" rows="2" maxlength="140">${h(draft.pr)}</textarea></details>
          <div style="height:8px"></div><button id="bW" style="width:100%" ${my==null?"disabled":""}>Begründung mitschicken</button>`;
        const sendV=()=>{if(vSel[vk]==null)return;const pro=!!draft.pr.trim();const w=(draft.w.trim()+(pro?(draft.w.trim()?" · ":"")+draft.pr.trim():"")).slice(0,140);
          pending={ph:2,msg:{k:"v",i:S.card,r:S.round,c:vSel[vk],f:fSel[vk]||[],w,pr:pro}};send(pending.msg);};
        P.querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{vSel[vk]=+b.dataset.i;sendV();lastKey="";render();});
        P.querySelectorAll("#fc button").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,a=fSel[vk];const j=a.indexOf(i);if(j>=0)a.splice(j,1);else a.push(i);b.classList.toggle("sel");sendV();});
        $("tw").oninput=e=>{draft.w=e.target.value;};$("tp").oninput=e=>{draft.pr=e.target.value;};
        $("dp").ontoggle=e=>{draft.pro=e.target.open;};
        $("bW").onclick=()=>{sendV();$("bW").textContent="Begründung gesendet ✓";draft={w:"",pr:"",pro:false};};
        return;}
      draft={w:"",pr:"",pro:false};
      if(S.rev===1){P.innerHTML=top+`<div class="tag" style="font-size:1.3rem">${h(C.t)}</div>
        <div class="status">Du hast gewählt: <b>${my!=null?ORTE[my].n:"–"}</b>.<br>Schau an die Tafel. Welche Gründe nennen die anderen? Wer hat die besseren Argumente?</div>`;return;}
      const ok=C.e.includes(my);
      P.innerHTML=top+`<div class="tag" style="font-size:1.3rem">${h(C.t)}</div>
        <div class="status ${my==null?"":ok?"ok":"bad"}">${my==null?"":ok?"<b>Passt!</b> ":"<b>Passt weniger gut.</b> "}Gut passt: <b>${C.e.map(i=>ORTE[i].n).join(" oder ")}</b></div><p>${h(C.x)}</p>${C.e.length>1?`<p class="muted">Mehrere Orte sind richtig – die Begründung zählt.</p>`:""}`;return;}
    if(S.ph===3){P.innerHTML=top+`<h2>Das merken wir uns</h2>
      <div class="merk"><b>Standortfaktoren:</b> ${FAK.join(" · ")}</div>
      <div class="merk"><b>Innenstadt:</b> Fachgeschäft, Warenhaus<br><b>Stadtrand:</b> Verbrauchermarkt, Fachmarkt, Möbel- und Baumarkt</div>
      <div class="merk"><b>Prüfung:</b> In der Innenstadt zählt vor allem die Erreichbarkeit für Kunden – nicht die Parkplätze.</div>
      <div class="merk"><b>Discounter</b> = schmales, flaches Sortiment, sehr niedrige Preise, einfache Ausstattung.</div>`;return;}
    const sc=(S.sc&&S.sc[me.pid])||[0,"–",0];
    if(S.ph===4){
      if(S.q<0){P.innerHTML=top+`<h2>Standort-Cup</h2><p>Gleich geht es los. Lies jede Frage genau. Richtig ist wichtiger als schnell!</p>`;return;}
      const Q=QUIZ[S.q];
      if(S.qOpen){
        if(answered||qSel[S.q]!=null){P.innerHTML=top+`<p class="muted">Frage ${S.q+1}</p><h2>${h(Q.q)}</h2><div class="status ${answered?"ok":""}">${answered?"Antwort gespeichert ✓":"Wird gesendet …"} Warte auf die Auflösung.</div>`;return;}
        P.innerHTML=top+`<div class="row" style="justify-content:space-between"><span class="muted">Frage ${S.q+1} von ${QUIZ.length}</span><b id="ptm"></b></div><h2>${h(Q.q)}</h2>
          ${Q.o.map((o,i)=>`<button class="popt o${i}" data-i="${i}">${"ABCDE"[i]}: ${h(o)}</button>`).join("")}`;
        P.querySelectorAll(".popt").forEach(b=>b.onclick=()=>{qSel[S.q]=+b.dataset.i;pending={ph:4,msg:{k:"a",q:S.q,c:+b.dataset.i}};send(pending.msg);lastKey="";render();});
        const t=()=>{const s=Math.max(0,Math.ceil((qEnd-Date.now())/1000));if($("ptm"))$("ptm").textContent=s+" s";};t();clearInterval(window._pt);window._pt=setInterval(t,250);
        return;}
      const my=qSel[S.q],ok=my===Q.k;
      P.innerHTML=top+`<p class="muted">Frage ${S.q+1} von ${QUIZ.length}</p>
        <div class="status ${my==null?"":ok?"ok":"bad"}">${my==null?"Keine Antwort.":ok?"<b>Richtig!</b> +"+sc[2]+" Punkte":"<b>Leider falsch.</b>"}</div>
        <p><b>Richtig: ${h(Q.o[Q.k])}</b><br>${h(Q.x)}</p>
        <div class="box"><div class="bigpts">${sc[0]} Punkte</div>Platz ${sc[1]} von ${S.np||"?"}</div>`;return;}
    if(S.ph===5){P.innerHTML=top+`<h2>Geschafft!</h2><div class="box"><div class="bigpts">Platz ${sc[1]}</div>${sc[0]} Punkte · ${S.np||"?"} haben mitgespielt</div><p>Danke fürs Mitmachen!</p>`;return;}
  }
  render();
}
</script>

  {name:"Jazz",bpm:132,fast:164,swing:.3,walk:1,bass:[41,38,43,36],bp:[0,4,8,12],ch:[[65,69,72,76],[62,65,69,72],[67,70,74,77],[60,64,67,70]],ap:[0,2,1,3],as:[0,6,10],ad:.18,arp:"triangle",kick:[],snare:[],hat:"jazz"},
  {name:"Synthwave",bpm:100,fast:128,bass:[47,43,38,45],bp:[0,2,4,6,8,10,12,14],bt:"sawtooth",ch:[[71,74,78],[67,71,74],[62,66,69],[69,73,76]],ap:[0,1,2,1],arp:"sawtooth",ad:.14,kick:[0,4,8,12],snare:[4,12],hat:"all"},
  {name:"Detektiv",bpm:92,fast:120,bass:[37,37,42,44],bp:[0,3,8,10],ch:[[61,64,68],[61,64,68],[66,69,73],[68,72,75]],ap:[0,1,2,1,2,0],as:[0,2,4,7,8,10,12,15],ad:.12,arp:"triangle",kick:[0],snare:[8],hat:"off"}
];
const Music=(()=>{
  const ls=(k,v)=>{try{if(v===undefined){const x=localStorage.getItem(k);return x==null?null:JSON.parse(x);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}};
  let ctx=null,master=null,timer=null,next=0,step=0,fast=false,nbuf=null,on=ls("quizmusik")!==false;
  let order=[],last=-1,S=MUSIK_POOL[0];
  const mf=m=>440*Math.pow(2,(m-69)/12),AV={square:.04,sawtooth:.03,triangle:.08,sine:.1};
  function pick(){if(!order.length){order=MUSIK_POOL.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
      if(order[0]===last&&order.length>1)order.push(order.shift());}
    last=order.shift();S=MUSIK_POOL[last];return last;}
  function init(){try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();
      master=ctx.createGain();master.gain.value=.24;master.connect(ctx.destination);}
    if(ctx.state==="suspended")ctx.resume();return true;}catch(e){return false;}}
  function tone(f,t,d,type,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
  function noise(t,d,v,hp){if(!nbuf){nbuf=ctx.createBuffer(1,ctx.sampleRate*.3,ctx.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nbuf;f.type="highpass";f.frequency.value=hp;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02);}
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.13);
    g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2);}
  function play(st,t){const bar=Math.floor(st/16)%S.bass.length,s=st%16,ch=S.ch[bar%S.ch.length];
    const bp=S.bp||[0,2,4,6,8,10,12,14];
    if(bp.includes(s)){const off=S.walk?[0,4,7,9][Math.floor(s/4)%4]:(s%4===0?0:12);tone(mf(S.bass[bar]+off),t,S.walk?.3:.16,S.bt||"triangle",S.bt==="sawtooth"?.12:S.bt==="square"?.1:.32);}
    if(!S.as||S.as.includes(s))tone(mf(ch[S.ap[s%S.ap.length]%ch.length]+12*(S.oct||0)+(fast?12:0)),t,S.ad||.09,S.arp,AV[S.arp]||.05);
    if(S.kick.includes(s))kick(t);
    if(S.snare.includes(s))noise(t,.12,.25,1800);
    if(S.cl&&S.cl.includes(s))tone(1250,t,.04,"sine",.18);
    const hat=S.hat;
    if(hat==="all"||fast||(hat==="off"&&s%2===1)||(hat==="jazz"&&(s%4===0||s%8===6)))noise(t,.03,.07,7000);}
  function sched(){const d=60/(fast?S.fast:S.bpm)/4;
    if(next<ctx.currentTime-.05)next=ctx.currentTime+.02;
    while(next<ctx.currentTime+.12){play(step,next+(step%2?d*(S.swing||0):0));next+=d;step++;}}
  const root=()=>S.ch[0][0]%12+60;
  return {
    pool:MUSIK_POOL,
    current(){return S.name;},
    unlock(){if(on)init();},
    isOn(){return on;},
    toggle(){on=!on;ls("quizmusik",on);if(!on)this.stop();return on;},
    start(){if(!on||timer||!init())return;pick();fast=false;step=0;next=ctx.currentTime+.06;timer=setInterval(sched,25);
      try{console.log("[Quiz-Musik] Stück",last,S.name);}catch(e){}},
    hurry(){fast=true;},
    tick(){if(!on||!init())return;tone(1760,ctx.currentTime,.06,"sine",.25);},
    stop(){clearInterval(timer);timer=null;fast=false;},
    reveal(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.03,r=root();
      [0,4,7].forEach((m,i)=>tone(mf(r+m),t+i*.09,.25,"square",.08));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+.3,.9,"triangle",.14));kick(t+.3);noise(t+.3,.25,.25,3000);},
    fanfare(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.05,r=60;
      [[-5,0],[0,.15],[4,.3],[7,.45],[4,.7],[7,.85]].forEach(([m,d])=>tone(mf(r+m),t+d,.22,"square",.09));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+1.05,1.6,"triangle",.15));[0,.45,1.05].forEach(d=>kick(t+d));noise(t+1.05,.5,.3,2500);}
  };})();
/* Quiz-Musik automatisch an die Tafel koppeln: Timer #tm sichtbar = Abfrage läuft (Quiz, Prüfungs-Check, Abstimmung) */
(function MusicAuto(){
  if(new URLSearchParams(location.search).get("s"))return;
  const tf=document.getElementById("tafel"),st=document.getElementById("steps");
  let was=false,lastS=-1,pod=false;
  function btn(){if(!st||document.getElementById("bMus"))return;const b=document.createElement("button");b.id="bMus";b.type="button";
    b.title="Quiz-Musik an oder aus";b.style.cssText="padding:.25em .7em;font-weight:700;border-radius:999px;white-space:nowrap";
    b.onclick=()=>{Music.toggle();if(Music.isOn()&&was)Music.start();lab();};st.after(b);lab();}
  function lab(){const b=document.getElementById("bMus");if(b)b.textContent=Music.isOn()?"Musik: an":"Musik: aus";}
  document.addEventListener("pointerdown",()=>Music.unlock(),true);
  btn();
  setInterval(()=>{if(!tf||tf.hidden)return;btn();
    const tm=document.getElementById("tm"),vis=!!(tm&&tm.offsetParent!==null);
    if(vis){if(!was){was=true;lastS=-1;Music.start();}
      const s=parseInt(tm.textContent,10);if(!isNaN(s)&&s!==lastS){lastS=s;if(s<=10&&s>0)Music.hurry();if(s<=5&&s>0)Music.tick();}}
    else if(was){was=false;Music.reveal();}
    const p=document.querySelector("#tMain .podium"),pv=!!(p&&p.offsetParent!==null);
    if(pv&&!pod){pod=true;Music.fanfare();}if(!pv)pod=false;
  },200);
})();
</script>
