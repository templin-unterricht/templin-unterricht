<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modul 8 – Selbsttest mehrsprachig – Das Sortiment</title>
<style>
  :root{--blau:#1F4E79;--blauhell:#9DC3E6;--blauflaeche:#EAF1F8;--rosa:#E5B8B7;--grau:#F2F2F2;--graulinie:#BFBFBF;--grautext:#595959;--rot:#C00000;--gruen:#2E6B45;--serif:Georgia,"Times New Roman",serif;--sans:Arial,Helvetica,sans-serif;--tr:#7a3d00;--trbg:#FFF4E5}
  *{box-sizing:border-box}
  body{margin:0;background:#fff;color:#111;font-family:var(--serif);font-size:17px;line-height:1.6}
  .blatt{max-width:820px;margin:0 auto;padding:18px 18px 90px}
  header.kopf{border:1px solid #000;display:flex;align-items:stretch;margin-bottom:18px}
  header.kopf .li{flex:0 0 32%;padding:12px 14px;border-right:1px solid #000;font-family:var(--sans);font-size:14px}
  header.kopf .mi{flex:1;padding:12px 14px;text-align:center}
  header.kopf .mi .lf{font-family:var(--sans);font-weight:bold;font-size:17px}
  header.kopf .mi .lftxt{font-family:var(--sans);font-size:14px;padding-bottom:8px;border-bottom:1px solid #000;margin-bottom:8px}
  header.kopf .mi .mod{font-family:var(--sans);font-weight:bold;font-size:17px}
  h1{font-family:var(--sans);color:var(--blau);font-size:25px;margin:0 0 6px;border-bottom:2px solid var(--blauhell);padding-bottom:8px}
  .unter{font-family:var(--sans);font-size:14px;color:var(--grautext);margin:0 0 14px}
  h2{font-family:var(--sans);color:var(--blau);font-size:19px;margin:30px 0 4px;border-bottom:1px solid var(--blauhell);padding-bottom:5px}
  .hinweis{font-family:var(--sans);font-size:14px;color:var(--grautext);margin:0 0 14px;font-style:italic}
  /* Sprachleiste */
  .langbar{position:sticky;top:0;z-index:20;background:#fff;border:1px solid var(--blauhell);border-radius:8px;padding:8px 10px;margin:0 0 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--sans);box-shadow:0 2px 6px rgba(0,0,0,.08)}
  .langbar .lbl{font-size:13px;color:var(--grautext);margin-right:4px}
  .lb{font-family:var(--sans);font-size:14px;border:1px solid var(--blau);background:#fff;color:var(--blau);border-radius:18px;padding:6px 12px;cursor:pointer;min-height:36px;margin:0}
  .lb[aria-pressed=true]{background:var(--blau);color:#fff}
  .frage{margin:0 0 22px;padding:0 0 4px}
  .frage>p.txt{margin:0 0 6px;font-weight:bold}
  .frage .nr{color:var(--blau);font-family:var(--sans)}
  .qlang{display:flex;gap:4px;margin:2px 0 6px;flex-wrap:wrap}
  .qlang button{font-family:var(--sans);font-size:12px;border:1px solid var(--graulinie);background:#fff;color:var(--grautext);border-radius:12px;padding:3px 8px;cursor:pointer;margin:0;min-height:28px}
  .qlang button[aria-pressed=true]{background:var(--trbg);border-color:var(--tr);color:var(--tr);font-weight:bold}
  .trl{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Ethiopic","Nyala","Abyssinica SIL",sans-serif;font-size:15px;color:var(--tr);background:var(--trbg);border-left:3px solid #E9A659;padding:2px 8px;margin:3px 0 4px;border-radius:2px;display:block;line-height:1.45;font-weight:normal}
  label.opt{display:block;padding:6px 8px 6px 2px;cursor:pointer;border-radius:3px}
  label.opt:hover{background:var(--blauflaeche)}
  label.opt input{margin-right:9px}
  label.opt .trl{margin-left:24px}
  table.zuord{border-collapse:collapse;width:100%;margin-bottom:8px}
  table.zuord th{background:var(--rosa);font-family:var(--sans);font-size:14px;text-align:left;padding:8px 10px;border:1px solid var(--graulinie)}
  table.zuord td{border:1px solid var(--graulinie);padding:8px 10px;vertical-align:middle}
  table.zuord td.begriff{font-weight:bold;width:34%}
  select,input[type=text]{font-family:var(--sans);font-size:15px;padding:6px;border:1px solid var(--graulinie);border-radius:3px;background:#fff;max-width:100%}
  table.zuord select{width:100%}
  .speicher{background:var(--blauflaeche);border:1px solid var(--blauhell);padding:12px 14px;margin:0 0 14px;font-family:var(--sans);font-size:15px}
  .speicher b{color:var(--blau)}
  .speicher .w{display:inline-block;margin:2px 6px 2px 0;padding:2px 8px;background:#fff;border:1px solid var(--blauhell);border-radius:12px}
  .speicher .w small{color:var(--tr);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Ethiopic","Nyala","Abyssinica SIL",sans-serif}
  .lueckentext{line-height:2.5}
  .lueckentext select{width:auto;min-width:170px}
  button.gross{font-family:var(--sans);font-size:17px;font-weight:bold;color:#fff;background:var(--blau);border:0;border-radius:4px;padding:14px 30px;cursor:pointer;margin-top:26px}
  button.gross:hover{background:#17395a}
  button.zweit{background:#fff;color:var(--blau);border:1px solid var(--blau);font-weight:normal;font-size:15px;padding:9px 18px;margin-left:0}
  #ergebnis{display:none}
  .note{display:flex;align-items:center;gap:26px;border:2px solid var(--blau);padding:20px 24px;margin-bottom:8px;flex-wrap:wrap}
  .note .zahl{font-family:var(--sans);font-size:74px;font-weight:bold;color:var(--blau);line-height:1}
  .note .daten{font-family:var(--sans);font-size:16px}
  .note .daten .gross{font-size:22px;font-weight:bold}
  .namensfeld{font-family:var(--sans);font-size:15px;margin:14px 0 26px}
  .namensfeld input{width:260px}
  .detail{border-top:1px solid var(--graulinie);padding:12px 0}
  .detail .kopfz{font-family:var(--sans);font-weight:bold;font-size:15px}
  .detail .kopfz .ok{color:var(--gruen)}
  .detail .kopfz .nein{color:var(--rot)}
  .detail .loesung{margin:6px 0 0;padding:8px 12px;background:var(--grau);border-left:4px solid var(--rot);font-size:16px}
  .detail .loesung b{color:var(--rot)}
  .konto{font-family:var(--sans);font-size:15px;background:var(--blauflaeche);border:1px solid var(--blauhell);padding:10px 14px;margin:10px 0}
  @media (max-width:600px){.langbar{position:static}}
  @media print{button,.langbar,.qlang{display:none}}
</style>
</head>
<body>
<div class="blatt">
  <header class="kopf">
    <div class="li">Datum:<br><br>Name:</div>

      <div class="lf">Lernfeld 1</div>

  <h1 id="h1"></h1>

  <form id="test" onsubmit="return false">

    <p class="hinweis" id="p1h"></p>
    <div id="mc"></div>

    <div class="speicher" id="speicher"></div>
    <div class="lueckentext" id="luecken"></div>
    <div id="gaptr"></div>
    <button type="button" class="gross" id="auswerten"></button>
  </form>
  <div id="ergebnis">
    <h1 id="rh"></h1>
    <div class="note">
      <div class="zahl" id="notezahl">–</div>
      <div class="daten">

        <div id="prozent">0 %</div>
        <div id="notetext" style="color:#595959"></div>
      </div>
    </div>
    <div class="konto" id="konto"></div>
    <div class="namensfeld"><span id="namelbl"></span>: <input type="text" id="name" placeholder="…"></div>
    <div id="details"></div>
    <button type="button" id="nochmal" class="gross zweit"></button>
  </div>
</div>

    D.luecken.forEach(function(w,i){
      var sel=document.querySelector('select[name="l'+i+'"]'); var cur=sel.value;
      var o='<option value="">'+esc(ui("pick",""))+'</option>';
      D.speicher.map(function(s,k){return k;}).sort(function(a,b){return D.speicher[a].localeCompare(D.speicher[b],"de");}).forEach(function(k){
        o+='<option value="'+k+'">'+esc(D.speicher[k])+(gl?" ("+esc(t(D.id_w[k],gl))+")":"")+'</option>';
      });
      sel.innerHTML=o; sel.value=cur;
    });
    document.getElementById("gaptr").innerHTML=gl?'<div class="trl"><b>'+esc(ui("gaphint",gl))+'</b> '+esc(t(D.id_text,gl))+'</div>':"";
  }
  function renderAll(){ renderLangBar(); renderStatic(); renderQ(); }
  document.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.classList.contains("lb")){
      gl=b.getAttribute("data-l"); ql={};
      try{ localStorage.setItem("lf1_st_lang",gl); }catch(x){}
      renderAll(); if(document.getElementById("ergebnis").style.display==="block") renderResult(last);
    } else if(b.hasAttribute("data-q")){
      var key=b.getAttribute("data-q"), l=b.getAttribute("data-l");
      ql[key]=(langOf(key)===l)?"":l; renderQ();
    }
  });

  /* ---------- Auswertung ---------- */
  function note(p){if(p>=92)return[1,"g1"];if(p>=81)return[2,"g2"];if(p>=67)return[3,"g3"];if(p>=50)return[4,"g4"];if(p>=30)return[5,"g5"];return[6,"g6"];}
  var last=null;
  function renderResult(r){
    document.getElementById("notezahl").textContent=r.n[0];
    document.getElementById("notetext").textContent=ui(r.n[1],"")+(gl?" · "+ui(r.n[1],gl):"");
    document.getElementById("punkte").textContent=r.punkte;
    document.getElementById("prozent").textContent=r.proz+" %";
    var lp=Math.round(r.proz/100*D.lp*2)/2, ls=String(lp).replace(".",",");
    function ktxt(l){ return D.lp==0 ? ui("konto0",l) : ui("konto",l).replace("{x}",ls).replace("{y}",D.lp); }
    document.getElementById("konto").innerHTML="<b>"+esc(ktxt(""))+"</b>"+(gl?'<span class="trl">'+esc(ktxt(gl))+'</span>':"");
    var box=document.getElementById("details");box.innerHTML="";
    r.det.forEach(function(d){
      var el=document.createElement("div");el.className="detail";
      var head=ui("part","")+" "+d.teil+", "+(d.kind==="q"?ui("question","")+" "+d.nr:d.kind==="z"?d.label:ui("gap","")+" "+d.nr);
      var h='<div class="kopfz">'+esc(head)+': '+(d.ok?'<span class="ok">'+esc(ui("ok",""))+'</span>':'<span class="nein">'+esc(ui("bad",""))+'</span>')+(gl?' <small style="font-weight:normal;color:#7a3d00">('+esc(ui(d.ok?"ok":"bad",gl))+')</small>':"")+'</div>';
      if(!d.ok){
        h+='<div class="loesung"><b>'+esc(ui("right",""))+'</b> '+esc(d.de)+(gl&&d.tid?'<span class="trl"><b>'+esc(ui("right",gl))+'</b> '+esc(t(d.tid,gl))+'</span>':"")+(d.erkl?'<br>'+esc(d.erkl):'')+'</div>';
      }
      el.innerHTML=h;box.appendChild(el);
    });
  }
  document.getElementById("auswerten").addEventListener("click",function(){
    var punkte=0,det=[];
    D.mc.forEach(function(q,i){
      var sel=document.querySelector('input[name="mc'+i+'"]:checked');
      var ok=!!sel&&Number(sel.value)===q.r; if(ok)punkte++;
      det.push({kind:"q",teil:1,nr:i+1,ok:ok,de:q.o[q.r],tid:q.id[q.r+1],erkl:q.e});
    });
    D.z.forEach(function(z,i){
      var v=document.querySelector('select[name="z'+i+'"]').value;
      var ok=(v!==""&&Number(v)===i); if(ok)punkte++;
      det.push({kind:"z",teil:2,label:z.b,ok:ok,de:z.e,tid:z.id[1],erkl:""});
    });
    D.luecken.forEach(function(w,i){
      var v=document.querySelector('select[name="l'+i+'"]').value;
      var k=D.speicher.indexOf(w);
      var ok=(v!==""&&Number(v)===k); if(ok)punkte++;
      det.push({kind:"l",teil:3,nr:i+1,ok:ok,de:w,tid:D.id_w[k],erkl:""});
    });
    var proz=Math.round(punkte/TOTAL*100);
    last={punkte:punkte,proz:proz,n:note(proz),det:det};
    renderResult(last);
    document.getElementById("test").style.display="none";
    document.getElementById("ergebnis").style.display="block";
    window.scrollTo(0,0);
  });
  document.getElementById("nochmal").addEventListener("click",function(){location.reload();});
  renderAll();
})();
</script>
</body>
</html>
