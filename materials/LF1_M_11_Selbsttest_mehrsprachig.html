  var LANGS = [{"c": "uk", "n": "Українська", "f": "🇺🇦"}, {"c": "ti", "n": "ትግርኛ", "f": "🌐"}, {"c": "pt", "n": "Português", "f": "🇵🇹"}, {"c": "es", "n": "Español", "f": "🇪🇸"}];
  var TOTAL = D.mc.length + D.z.length + D.luecken.length;
  var gl = "";                       // globale Sprache ("" = aus)
  try{ gl = localStorage.getItem("lf1_st_lang") || ""; }catch(e){}
  if(gl && !TR[gl]) gl = "";
  var ql = {};                        // Sprache pro Frage (Schlüssel)
  function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
  function mische(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function t(id,l){ return (l && TR[l] && TR[l][id]) || ""; }
  function ui(k,l){ return (UI[k] && (l? UI[k][l] : UI[k].de)) || ""; }
  function langOf(key){ return (key in ql) ? ql[key] : gl; }
  function setText(id,k){
    var el=document.getElementById(id); el.innerHTML=esc(ui(k,""))+(gl?'<span class="trl">'+esc(ui(k,gl))+'</span>':"");
  }

  /* ---------- Daten mischen ---------- */
  var mcPerm = D.mc.map(function(q){return mische(q.o.map(function(_,i){return i;}));});
  var zOrder = mische(D.z.map(function(_,i){return i;}));   // Reihenfolge der Erklärungen
  var wOrder = mische(D.speicher.map(function(_,i){return i;}));

  /* ---------- Aufbau ---------- */
  var mcBox=document.getElementById("mc");
  D.mc.forEach(function(q,i){
    var d=document.createElement("div");d.className="frage";d.setAttribute("data-key","q"+i);
    var h='<p class="txt"><span class="nr">'+(i+1)+'.</span> '+esc(q.f)+'</p><div class="qlang"></div><div class="qtr"></div>';
    mcPerm[i].forEach(function(k){
      h+='<label class="opt"><input type="radio" name="mc'+i+'" value="'+k+'"><span>'+esc(q.o[k])+'</span><span class="otr" data-i="'+k+'"></span></label>';
    });
    d.innerHTML=h;mcBox.appendChild(d);
  });
  var zBox=document.getElementById("zuord");
  D.z.forEach(function(z,i){
    var tr=document.createElement("tr");
    tr.innerHTML='<td class="begriff">'+esc(z.b)+'<span class="btr" data-i="'+i+'"></span></td><td><select name="z'+i+'"></select></td>';
    zBox.appendChild(tr);
  });
  var lBox=document.getElementById("luecken");
  (function(){
    var html="";
    for(var i=0;i<D.text.length;i++){
      html+=esc(D.text[i]);
      if(i<D.luecken.length) html+='<select name="l'+i+'"></select>';
    }
    lBox.innerHTML=html;
  })();

  /* ---------- Anzeige der Übersetzungen ---------- */
  function renderLangBar(){
    var h='<span class="lbl">🌐 '+esc(ui("lang",""))+':</span>';
    h+='<button type="button" class="lb" data-l="" aria-pressed="'+(gl===""?"true":"false")+'">'+esc(ui("off",""))+'</button>';
    LANGS.forEach(function(L){ h+='<button type="button" class="lb" data-l="'+L.c+'" aria-pressed="'+(gl===L.c?"true":"false")+'">'+L.f+' '+esc(L.n)+'</button>'; });
    document.getElementById("langbar").innerHTML=h;
  }
  function renderStatic(){
    var h1=document.getElementById("h1"); h1.innerHTML="Selbsttest: "+esc(D.title)+(gl?'<span class="trl" style="font-size:16px">'+esc(t(D.id_title,gl))+'</span>':"");
    setText("unter","intro"); setText("p1","part1"); setText("p1h","h1"); setText("p2","part2"); setText("p2h","h2"); setText("p3","part3"); setText("p3h","h3");
    var thb=document.getElementById("thb"); thb.innerHTML=esc(ui("term",""))+(gl?" · "+esc(ui("term",gl)):"");
    var the=document.getElementById("the"); the.innerHTML=esc(ui("expl",""))+(gl?" · "+esc(ui("expl",gl)):"");
    var b=document.getElementById("auswerten"); b.textContent=ui("eval","")+(gl?" · "+ui("eval",gl):"");
    document.getElementById("nochmal").textContent=ui("again","")+(gl?" · "+ui("again",gl):"");
    document.getElementById("rh").innerHTML=esc(ui("result",""))+(gl?'<span class="trl" style="font-size:16px">'+esc(ui("result",gl))+'</span>':"");
    document.getElementById("ofpts").textContent=ui("ofpts","")+(gl?" · "+ui("ofpts",gl):"");
    document.getElementById("namelbl").textContent=ui("name","")+(gl?" · "+ui("name",gl):"");
  }
  function renderQ(){
    var qs=mcBox.querySelectorAll(".frage");
    D.mc.forEach(function(q,i){
      var box=qs[i], key="q"+i, l=langOf(key);
      var bar=box.querySelector(".qlang");
      var h="";
      LANGS.forEach(function(L){h+='<button type="button" data-q="'+key+'" data-l="'+L.c+'" aria-pressed="'+(l===L.c?"true":"false")+'">'+L.f+' '+L.c.toUpperCase()+'</button>';});
      bar.innerHTML=h;
      var qt=box.querySelector(".qtr"); qt.innerHTML=l?'<span class="trl">'+esc(t(q.id[0],l))+'</span>':"";
      box.querySelectorAll(".otr").forEach(function(sp){
        var k=+sp.getAttribute("data-i"); sp.innerHTML=l?'<span class="trl">'+esc(t(q.id[k+1],l))+'</span>':"";
      });
    });
    // Zuordnung
    document.querySelectorAll(".btr").forEach(function(sp){
      var i=+sp.getAttribute("data-i"), l=gl;
      sp.innerHTML=l?'<span class="trl">'+esc(t(D.z[i].id[0],l))+'</span>':"";
    });
    D.z.forEach(function(z,i){
      var sel=document.querySelector('select[name="z'+i+'"]'); var cur=sel.value;
      var o='<option value="">'+esc(ui("pick",""))+(gl?" / "+esc(ui("pick",gl)):"")+'</option>';
      zOrder.forEach(function(k){ o+='<option value="'+k+'">'+esc(D.z[k].e)+(gl?" — "+esc(t(D.z[k].id[1],gl)):"")+'</option>'; });
      sel.innerHTML=o; sel.value=cur;

    // Wortspeicher + Lücken
    var sp=document.getElementById("speicher"), h='<b>'+esc(ui("wordbank",""))+':</b> ';
    wOrder.forEach(function(k){ h+='<span class="w">'+esc(D.speicher[k])+(gl?' <small>('+esc(t(D.id_w[k],gl))+')</small>':"")+'</span>'; });
    sp.innerHTML=h;
    D.luecken.forEach(function(w,i){
      var sel=document.querySelector('select[name="l'+i+'"]'); var cur=sel.value;
      var o='<option value="">'+esc(ui("pick",""))+'</option>';
      D.speicher.map(function(s,k){return k;}).sort(function(a,b){return D.speicher[a].localeCompare(D.speicher[b],"de");}).forEach(function(k){
        o+='<option value="'+k+'">'+esc(D.speicher[k])+(gl?" ("+esc(t(D.id_w[k],gl))+")":"")+'</option>';
      });
      sel.innerHTML=o; sel.value=cur;
    });
    document.getElementById("gaptr").innerHTML=gl?'<div class="trl"><b>'+esc(ui("gaphint",gl))+'</b> '+esc(t(D.id_text,gl))+'</div>':"";
  }
  function renderAll(){ renderLangBar(); renderStatic(); renderQ(); }
  document.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.classList.contains("lb")){
      gl=b.getAttribute("data-l"); ql={};
      try{ localStorage.setItem("lf1_st_lang",gl); }catch(x){}
      renderAll(); if(document.getElementById("ergebnis").style.display==="block") renderResult(last);
    } else if(b.hasAttribute("data-q")){
      var key=b.getAttribute("data-q"), l=b.getAttribute("data-l");
      ql[key]=(langOf(key)===l)?"":l; renderQ();
    }
  });

  /* ---------- Auswertung ---------- */
  function note(p){if(p>=92)return[1,"g1"];if(p>=81)return[2,"g2"];if(p>=67)return[3,"g3"];if(p>=50)return[4,"g4"];if(p>=30)return[5,"g5"];return[6,"g6"];}
  var last=null;
  function renderResult(r){
    document.getElementById("notezahl").textContent=r.n[0];
    document.getElementById("notetext").textContent=ui(r.n[1],"")+(gl?" · "+ui(r.n[1],gl):"");
    document.getElementById("punkte").textContent=r.punkte;
    document.getElementById("prozent").textContent=r.proz+" %";
    var lp=Math.round(r.proz/100*D.lp*2)/2, ls=String(lp).replace(".",",");
    function ktxt(l){ return D.lp==0 ? ui("konto0",l) : ui("konto",l).replace("{x}",ls).replace("{y}",D.lp); }
    document.getElementById("konto").innerHTML="<b>"+esc(ktxt(""))+"</b>"+(gl?'<span class="trl">'+esc(ktxt(gl))+'</span>':"");
    var box=document.getElementById("details");box.innerHTML="";
    r.det.forEach(function(d){
      var el=document.createElement("div");el.className="detail";
      var head=ui("part","")+" "+d.teil+", "+(d.kind==="q"?ui("question","")+" "+d.nr:d.kind==="z"?d.label:ui("gap","")+" "+d.nr);
      var h='<div class="kopfz">'+esc(head)+': '+(d.ok?'<span class="ok">'+esc(ui("ok",""))+'</span>':'<span class="nein">'+esc(ui("bad",""))+'</span>')+(gl?' <small style="font-weight:normal;color:#7a3d00">('+esc(ui(d.ok?"ok":"bad",gl))+')</small>':"")+'</div>';
      if(!d.ok){
        h+='<div class="loesung"><b>'+esc(ui("right",""))+'</b> '+esc(d.de)+(gl&&d.tid?'<span class="trl"><b>'+esc(ui("right",gl))+'</b> '+esc(t(d.tid,gl))+'</span>':"")+(d.erkl?'<br>'+esc(d.erkl):'')+'</div>';
      }
      el.innerHTML=h;box.appendChild(el);
    });
  }
  document.getElementById("auswerten").addEventListener("click",function(){
    var punkte=0,det=[];
    D.mc.forEach(function(q,i){
      var sel=document.querySelector('input[name="mc'+i+'"]:checked');
      var ok=!!sel&&Number(sel.value)===q.r; if(ok)punkte++;
      det.push({kind:"q",teil:1,nr:i+1,ok:ok,de:q.o[q.r],tid:q.id[q.r+1],erkl:q.e});
    });
    D.z.forEach(function(z,i){
      var v=document.querySelector('select[name="z'+i+'"]').value;
      var ok=(v!==""&&Number(v)===i); if(ok)punkte++;
      det.push({kind:"z",teil:2,label:z.b,ok:ok,de:z.e,tid:z.id[1],erkl:""});
    });
    D.luecken.forEach(function(w,i){
      var v=document.querySelector('select[name="l'+i+'"]').value;
      var k=D.speicher.indexOf(w);
      var ok=(v!==""&&Number(v)===k); if(ok)punkte++;
      det.push({kind:"l",teil:3,nr:i+1,ok:ok,de:w,tid:D.id_w[k],erkl:""});
    });
    var proz=Math.round(punkte/TOTAL*100);
    last={punkte:punkte,proz:proz,n:note(proz),det:det};
    renderResult(last);
    document.getElementById("test").style.display="none";
    document.getElementById("ergebnis").style.display="block";
    window.scrollTo(0,0);
  });
  document.getElementById("nochmal").addEventListener("click",function(){location.reload();});
  renderAll();
})();
