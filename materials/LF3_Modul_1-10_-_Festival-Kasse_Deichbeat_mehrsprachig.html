i Soll artı 5 € verir – fazla para kasa fazlasıdır ve bunun bir nedeni vardır.","vi":"…vì Ist trừ Soll được +5 € – thừa tiền là Überschuss, và nó có nguyên nhân.","ar":"…لأن الفعلي ناقص المطلوب يعطي زائد 5 € – المال الزائد فائض، وله سبب."},"…weil ein Überschuss bedeutet, dass ein Kunde zu viel Rückgeld bekommen hat.":{"tr":"…çünkü kasa fazlası, bir müşterinin fazla para üstü aldığı anlamına gelir.","vi":"…vì thừa tiền nghĩa là một khách đã nhận thối lại quá nhiều.","ar":"…لأن الفائض يعني أن زبوناً حصل على باقٍ أكثر من اللازم."},"…weil Soll und Ist nie gleich sein können.":{"tr":"…çünkü Soll ve Ist hiçbir zaman eşit olamaz.","vi":"…vì Soll và Ist không bao giờ có thể bằng nhau.","ar":"…لأن المطلوب والفعلي لا يمكن أن يتساويا أبداً."},"Ole Brodersen will morgen bei allen Ständen einen Kassensturz machen. Kevin grinst: „Den sagt er doch vorher an. Dann zählen wir vorher schön nach.“":{"tr":"Ole Brodersen yarın bütün standlarda bir Kassensturz (kasa sayımı, sürpriz kasa kontrolü) yapmak istiyor. Kevin sırıtıyor: „Onu önceden söyler zaten. O zaman önceden güzelce sayarız.“","vi":"Ole Brodersen ngày mai muốn kiểm kê quỹ đột xuất (Kassensturz) ở tất cả các quầy. Kevin cười nhếch mép: „Ông ấy báo trước mà. Vậy trước đó mình đếm cho kỹ.“","ar":"يريد Ole Brodersen غداً إجراء جرد مفاجئ للصندوق (Kassensturz) عند جميع الأكشاك. يبتسم Kevin: „هو يعلن عنه مسبقاً. إذن نعدّ قبلها جيداً.“"},"Was antwortet ihr?":{"tr":"Ne cevap verirsiniz?","vi":"Các bạn trả lời sao?","ar":"بماذا تجيبون؟"},"Kassensturz":{"tr":"Kasa sayımı","vi":"Kiểm kê quỹ đột xuất (Kassensturz)","ar":"جرد الصندوق المفاجئ"},"Überraschender Soll-Ist-Vergleich während des Tages.":{"tr":"Gün içinde sürpriz Soll-Ist karşılaştırması.","vi":"So sánh Soll-Ist đột xuất trong ngày.","ar":"مقارنة مفاجئة بين المطلوب والفعلي خلال اليوم."},"Ein Kassensturz ist ein überraschender Soll-Ist-Vergleich während des Tages.":{"tr":"Kasa sayımı, gün içinde yapılan sürpriz bir Soll-Ist karşılaştırmasıdır.","vi":"Kassensturz là việc so sánh Soll-Ist đột xuất trong ngày.","ar":"جرد الصندوق المفاجئ (Kassensturz) هو مقارنة مفاجئة بين المطلوب والفعلي خلال اليوم."},"„Ein Kassensturz kommt überraschend. Wir halten unsere Kasse einfach immer in Ordnung.“":{"tr":"„Kasa sayımı sürpriz gelir. Biz kasamızı hep düzenli tutarız.“","vi":"„Kassensturz đến bất ngờ. Chúng ta cứ luôn giữ quỹ gọn gàng, đúng sổ sách.“","ar":"„الجرد المفاجئ يأتي بشكل مفاجئ. نحن نُبقي صندوقنا مرتباً دائماً.“"},"Überraschend? Ach du Schreck …":{"tr":"Sürpriz mi? Eyvah …","vi":"Bất ngờ ư? Trời ơi …","ar":"مفاجئ؟ يا للهول …"},"Ein Kassensturz ist ein überraschender Soll-Ist-Vergleich während des Tages. So zeigt er den echten Stand.":{"tr":"Kasa sayımı, gün içinde yapılan sürpriz bir Soll-Ist karşılaştırmasıdır. Böylece gerçek durumu gösterir.","vi":"Kassensturz là việc so sánh Soll-Ist đột xuất trong ngày. Nhờ vậy nó cho thấy tình trạng thật.","ar":"جرد الصندوق المفاجئ هو مقارنة مفاجئة بين المطلوب والفعلي خلال اليوم. هكذا يُظهر الوضع الحقيقي."},"„Wir legen vorher Geld aus eigener Tasche nach, falls was fehlt.“":{"tr":"„Bir şey eksikse önceden kendi cebimizden para ekleriz.“","vi":"„Chúng ta bù tiền túi trước nếu thiếu.“","ar":"„نضيف قبلها مالاً من جيبنا إن كان ينقص شيء.“"},"Gute Idee, mach ich auch!":{"tr":"İyi fikir, ben de yaparım!","vi":"Ý hay, tôi cũng làm vậy!","ar":"فكرة جيدة، سأفعل مثلكم!"},"Damit verdeckt man Fehler. Der Kassensturz soll den echten Stand zeigen.":{"tr":"Bununla hatalar gizlenir. Kasa sayımı gerçek durumu göstermelidir.","vi":"Như vậy là che giấu lỗi. Kassensturz phải cho thấy tình trạng thật.","ar":"بهذا تُخفى الأخطاء. الجرد المفاجئ يجب أن يُظهر الوضع الحقيقي."},"„Kassensturz heißt, die Kasse ist kaputt. Das betrifft uns nicht.“":{"tr":"„Kasa sayımı, kasanın bozuk olması demek. Bu bizi ilgilendirmez.“","vi":"„Kassensturz nghĩa là máy tính tiền bị hỏng. Chuyện này không liên quan đến chúng ta.“","ar":"„الجرد المفاجئ يعني أن الصندوق معطّل. هذا لا يخصنا.“"},"Hä? Na dann.":{"tr":"Ha? Neyse.","vi":"Hả? Thôi được.","ar":"ماذا؟ حسناً إذن."},"Kassensturz bedeutet: Soll-Bestand und Ist-Bestand werden überraschend verglichen.":{"tr":"Kasa sayımı şu demek: Soll bakiye ve Ist bakiye sürpriz olarak karşılaştırılır.","vi":"Kassensturz nghĩa là: số tiền theo sổ sách (Soll) và số tiền thực đếm (Ist) được so sánh đột xuất.","ar":"الجرد المفاجئ يعني: تُقارَن الأرصدة المطلوبة (Soll-Bestand) والفعلية (Ist-Bestand) بشكل مفاجئ."},"…weil ein angekündigter Kassensturz Fehler verdecken könnte – überraschend zeigt er den echten Stand.":{"tr":"…çünkü önceden duyurulan bir kasa sayımı hataları gizleyebilir – sürpriz olunca gerçek durumu gösterir.","vi":"…vì Kassensturz được báo trước có thể che giấu lỗi – đột xuất mới cho thấy tình trạng thật.","ar":"…لأن الجرد المفاجئ المعلَن عنه قد يُخفي الأخطاء – أما المفاجئ فيُظهر الوضع الحقيقي."},"…weil beim Kassensturz das Wechselgeld abgeholt wird.":{"tr":"…çünkü kasa sayımında bozuk para alınır.","vi":"…vì khi Kassensturz, tiền lẻ để thối bị mang đi.","ar":"…لأنه في الجرد المفاجئ تُؤخذ الفكّة."},"…weil ein Kassensturz nur einmal im Jahr erlaubt ist.":{"tr":"…çünkü kasa sayımına yılda sadece bir kez izin verilir.","vi":"…vì Kassensturz chỉ được phép làm một lần mỗi năm.","ar":"…لأن الجرد المفاجئ مسموح مرة واحدة فقط في السنة."},"Kevin zieht seinen Leuten Fehlbeträge einfach vom Lohn ab. Was gilt?":{"tr":"Kevin çalışanlarının kasa açıklarını doğrudan maaşlarından kesiyor. Hukuken durum nedir?","vi":"Kevin cứ trừ tiền thiếu (Fehlbetrag) vào lương của nhân viên. Quy định thế nào?","ar":"يخصم Kevin العجز (Fehlbetrag) من أجور موظفيه ببساطة. ماذا يقول القانون؟"},"Ohne besondere Vereinbarung haften Beschäftigte nur bei Vorsatz oder grober Fahrlässigkeit – einfach abziehen darf der Betrieb nicht.":{"tr":"Özel bir anlaşma olmadan çalışanlar sadece kasıt veya ağır ihmal durumunda sorumludur – işletme doğrudan kesemez.","vi":"Nếu không có thỏa thuận đặc biệt, người lao động chỉ chịu trách nhiệm khi cố ý hoặc sơ suất nghiêm trọng – cửa hàng không được tự ý trừ lương.","ar":"بدون اتفاق خاص يتحمل العاملون المسؤولية فقط عند العمد أو الإهمال الجسيم – ولا يجوز للمحل الخصم ببساطة."},"Das ist erlaubt: Jeder Fehlbetrag geht vom Lohn ab.":{"tr":"Bu serbest: Her kasa açığı maaştan kesilir.","vi":"Được phép: Mọi khoản thiếu tiền đều bị trừ vào lương.","ar":"هذا مسموح: كل عجز يُخصم من الأجر."},"Das ist erlaubt, wenn der Fehlbetrag unter 50 € liegt.":{"tr":"Kasa açığı 50 € nun altındaysa serbest.","vi":"Được phép nếu khoản thiếu dưới 50 €.","ar":"هذا مسموح إذا كان العجز أقل من 50 €."},"Kartenzahlungen 3.150,00 €; Wechselgeld 600,00 €; Kassenbestand am Schichtende 3.450,00 €; Abschöpfung 2.000,00 €. Wie hoch ist der Tagesumsatz?":{"tr":"Kartlı ödemeler 3.150,00 €; bozuk para 600,00 €; vardiya sonunda kasa bakiyesi 3.450,00 €; kasadan ara para çekme 2.000,00 €. Günlük ciro ne kadar?","vi":"Thanh toán bằng thẻ 3.150,00 €; tiền lẻ để thối 600,00 €; số tiền trong quỹ cuối ca 3.450,00 €; khoản rút bớt 2.000,00 €. Doanh thu trong ngày là bao nhiêu?","ar":"الدفع بالبطاقات 3.150,00 €؛ الفكّة 600,00 €؛ رصيد الصندوق في نهاية الوردية 3.450,00 €؛ المبلغ المسحوب 2.000,00 €. كم مبيعات اليوم؟"},"Familientag":{"tr":"Aile günü","vi":"Ngày gia đình","ar":"يوم العائلة"},"Wer darf kaufen? Geschäftsfähigkeit":{"tr":"Kim satın alabilir? Hukuki işlem ehliyeti (Geschäftsfähigkeit)","vi":"Ai được mua hàng? Năng lực hành vi (Geschäftsfähigkeit)","ar":"من يحق له الشراء؟ الأهلية القانونية (Geschäftsfähigkeit)"},"Sonntag, 11 Uhr. Familientag auf dem Deichbeat! Überall Kinder und Jugendliche. Kevins Bude bleibt heute zu – er hat gestern Ärger mit dem Ordnungsamt bekommen. Jetzt ist euer Stand allein in der Reihe.":{"tr":"Pazar, saat 11. Deichbeat'te aile günü! Her yerde çocuklar ve gençler. Kevin'in standı bugün kapalı – dün düzenleme denetim ofisiyle (Ordnungsamt) başı derde girdi. Şimdi sırada sizin standınız tek başına.","vi":"Chủ Nhật, 11 giờ. Ngày gia đình tại Deichbeat! Khắp nơi là trẻ em và thanh thiếu niên. Quầy của Kevin hôm nay đóng cửa – hôm qua anh ta bị cơ quan quản lý trật tự làm phiền. Giờ quầy của các bạn đứng một mình trong dãy.","ar":"الأحد، الساعة 11. يوم العائلة في Deichbeat! في كل مكان أطفال ومراهقون. كشك Kevin مغلق اليوم – فقد حصل أمس على مشكلة مع مكتب النظام (Ordnungsamt). والآن كشككم وحده في الصف."},"die Rechtsfähigkeit":{"tr":"hak ehliyeti","vi":"năng lực pháp luật","ar":"أهلية الوجوب (Rechtsfähigkeit)"},"die Geschäftsfähigkeit":{"tr":"hukuki işlem ehliyeti","vi":"năng lực hành vi","ar":"الأهلية القانونية (Geschäftsfähigkeit)"},"geschäftsunfähig":{"tr":"hukuki işlem ehliyetsiz","vi":"không có năng lực hành vi","ar":"عديم الأهلية (geschäftsunfähig)"},"beschränkt geschäftsfähig":{"tr":"sınırlı hukuki işlem ehliyetli","vi":"có năng lực hành vi hạn chế","ar":"ناقص الأهلية (beschränkt geschäftsfähig)"},"voll geschäftsfähig":{"tr":"tam hukuki işlem ehliyetli","vi":"có năng lực hành vi đầy đủ","ar":"كامل الأهلية (voll geschäftsfähig)"},"der gesetzliche Vertreter":{"tr":"yasal temsilci","vi":"người đại diện theo pháp luật","ar":"الممثل القانوني (der gesetzliche Vertreter)"},"die Zustimmung":{"tr":"onay","vi":"sự đồng ý","ar":"الموافقة (Zustimmung)"},"schwebend unwirksam":{"tr":"askıda (geçici olarak geçersiz)","vi":"chưa có hiệu lực (tạm thời)","ar":"معلّق (غير نافذ مؤقتاً) (schwebend unwirksam)"},"nichtig":{"tr":"geçersiz (hükümsüz)","vi":"vô hiệu","ar":"باطل (nichtig)"},"der Taschengeldparagraf":{"tr":"harçlık maddesi","vi":"điều khoản tiền tiêu vặt","ar":"مادة المصروف الشخصي (Taschengeldparagraf)"},"der Botengang":{"tr":"ulaklık (haberci olarak gönderilme)","vi":"việc đi mua hộ","ar":"المشوار بالتكليف (Botengang)"},"6 Jahre alt":{"tr":"6 yaşında","vi":"6 tuổi","ar":"عمره 6 سنوات"},"Finn, 6 Jahre, will mit seinem Taschengeld einen Leuchtstab für 3,00 € kaufen. Seine Eltern sind nicht dabei.":{"tr":"6 yaşındaki Finn harçlığıyla 3,00 € lik bir ışıklı çubuk almak istiyor. Ailesi yanında değil.","vi":"Finn, 6 tuổi, muốn dùng tiền tiêu vặt để mua một que phát sáng giá 3,00 €. Bố mẹ em không đi cùng.","ar":"Finn، عمره 6 سنوات، يريد أن يشتري بمصروفه عصا مضيئة بسعر 3,00 €. أهله ليسوا معه."},"Was machst du?":{"tr":"Ne yaparsın?","vi":"Bạn làm gì?","ar":"ماذا تفعل؟"},"Geschäftsunfähig":{"tr":"Hukuki işlem ehliyetsiz (geschäftsunfähig)","vi":"Không có năng lực hành vi (geschäftsunfähig)","ar":"عديم الأهلية (geschäftsunfähig)"},"Kinder unter 7 Jahren. Ihr Kauf ist nichtig (von Anfang an ungültig). Ausnahme: Botengang.":{"tr":"7 yaşın altındaki çocuklar. Alışverişleri geçersizdir (nichtig – baştan beri geçersiz). İstisna: ulaklık (Botengang).","vi":"Trẻ em dưới 7 tuổi. Việc mua bán của các em là vô hiệu (nichtig, không có giá trị ngay từ đầu). Ngoại lệ: đi mua hộ (Botengang).","ar":"الأطفال دون 7 سنوات. شراؤهم باطل (nichtig، أي غير صالح من الأساس). الاستثناء: المشوار بالتكليف (Botengang)."},"„Nein, weil sie geschäftsunfähig ist.“ – Kinder unter 7: Der Kauf ist nichtig, auch mit Taschengeld.":{"tr":"„Hayır, çünkü hukuki işlem ehliyeti yok.“ – 7 yaşın altındaki çocuklar: Alışveriş geçersizdir, harçlıkla da.","vi":"„Không, vì em không có năng lực hành vi.“ – Trẻ dưới 7 tuổi: Việc mua là vô hiệu, kể cả có tiền tiêu vặt.","ar":"„لا، لأنه عديم الأهلية.“ – الأطفال دون 7 سنوات: الشراء باطل، حتى مع المصروف."},"Freundlich ablehnen: „Komm doch mit Mama oder Papa wieder, dann klappt das.“":{"tr":"Nazikçe reddet: „Anne veya babanla tekrar gel, o zaman olur.“","vi":"Từ chối thân thiện: „Em hãy quay lại cùng mẹ hoặc bố nhé, như vậy sẽ được.“","ar":"الرفض بلطف: „تعال مع ماما أو بابا، وعندها يمكن ذلك.“"},"Okay … ich hol Papa!":{"tr":"Tamam … babamı getiriyorum!","vi":"Dạ … để em đi gọi bố!","ar":"حسناً … سأحضر بابا!"},"Kinder unter 7 sind geschäftsunfähig. Ihr Kauf ist nichtig – auch mit Taschengeld und bei kleinen Beträgen.":{"tr":"7 yaşın altındaki çocukların hukuki işlem ehliyeti yoktur. Alışverişleri geçersizdir – harçlıkla ve küçük tutarlarda da.","vi":"Trẻ em dưới 7 tuổi không có năng lực hành vi. Việc mua của các em là vô hiệu – kể cả có tiền tiêu vặt và với số tiền nhỏ.","ar":"الأطفال دون 7 سنوات عديمو الأهلية. شراؤهم باطل – حتى مع المصروف وحتى بمبالغ صغيرة."},"Verkaufen – Taschengeld ist Taschengeld.":{"tr":"Sat – harçlık harçlıktır.","vi":"Bán – tiền tiêu vặt thì là tiền tiêu vặt.","ar":"البيع – المصروف هو المصروف."},"Juhu, leuchtet!":{"tr":"Yaşasın, yanıyor!","vi":"Hoan hô, sáng quá!","ar":"هيه، إنها تضيء!"},"Der Taschengeldparagraf gilt erst ab 7. Der Kauf ist nichtig, die Eltern bekommen ihr Geld zurück.":{"tr":"Harçlık maddesi ancak 7 yaşından itibaren geçerlidir. Alışveriş geçersizdir, ailesi parasını geri alır.","vi":"Điều khoản tiền tiêu vặt (Taschengeldparagraf) chỉ áp dụng từ 7 tuổi. Việc mua là vô hiệu, bố mẹ được nhận lại tiền.","ar":"مادة المصروف الشخصي تسري من عمر 7 فقط. الشراء باطل، ويستعيد الأهل نقودهم."},"Verkaufen, wenn er genau passend zahlt.":{"tr":"Tam parasını öderse sat.","vi":"Bán, nếu em trả đúng số tiền.","ar":"البيع إذا دفع المبلغ بالضبط."},"Hier, drei Euro!":{"tr":"Buyur, üç avro!","vi":"Đây, ba euro!","ar":"تفضل، ثلاثة يورو!"},"Passend zahlen ändert nichts. Unter 7 ist der Kauf nichtig.":{"tr":"Tam para ödemek bir şeyi değiştirmez. 7 yaşın altında alışveriş geçersizdir.","vi":"Trả đúng số tiền không thay đổi gì. Dưới 7 tuổi thì việc mua là vô hiệu.","ar":"الدفع بالمبلغ المضبوط لا يغيّر شيئاً. دون 7 سنوات يكون الشراء باطلاً."},"…weil Kinder unter 7 geschäftsunfähig sind – ihr Kauf ist nichtig, auch mit Taschengeld.":{"tr":"…çünkü 7 yaşın altındaki çocukların hukuki işlem ehliyeti yoktur – alışverişleri geçersizdir, harçlıkla da.","vi":"…vì trẻ em dưới 7 tuổi không có năng lực hành vi – việc mua của các em là vô hiệu, kể cả có tiền tiêu vặt.","ar":"…لأن الأطفال دون 7 سنوات عديمو الأهلية – شراؤهم باطل، حتى مع المصروف."},"…weil Kinder unter 7 noch nicht rechtsfähig sind.":{"tr":"…çünkü 7 yaşın altındaki çocukların henüz hak ehliyeti yoktur.","vi":"…vì trẻ em dưới 7 tuổi chưa có năng lực pháp luật.","ar":"…لأن الأطفال دون 7 سنوات ليست لهم أهلية الوجوب بعد."},"…weil der Taschengeldparagraf erst ab 5 € gilt.":{"tr":"…çünkü harçlık maddesi ancak 5 € dan itibaren geçerlidir.","vi":"…vì điều khoản tiền tiêu vặt chỉ áp dụng từ 5 €.","ar":"…لأن مادة المصروف الشخصي تسري فقط من 5 €."},"6 Jahre alt, mit Einkaufszettel":{"tr":"6 yaşında, alışveriş listesiyle","vi":"6 tuổi, có giấy ghi đồ cần mua","ar":"عمرها 6 سنوات، ومعها قائمة مشتريات"},"Emma, 6 Jahre, bringt einen Zettel von ihrer Mutter: „Bitte 2 Wasser und 1 Sonnencreme.“ Das Geld hat die Mutter mitgegeben. Sie wartet am Kinderkarussell.":{"tr":"6 yaşındaki Emma annesinden bir not getiriyor: „Lütfen 2 su ve 1 güneş kremi.“ Parayı annesi vermiş. Annesi çocuk atlıkarıncasının yanında bekliyor.","vi":"Emma, 6 tuổi, mang đến một tờ giấy của mẹ: „Xin mua 2 chai nước và 1 tuýp kem chống nắng.“ Mẹ đã đưa tiền cho em. Mẹ đang đợi ở vòng quay trẻ em.","ar":"Emma، عمرها 6 سنوات، تحمل ورقة من أمها: „من فضلك 2 ماء و1 كريم واقٍ من الشمس.“ الأم أعطتها النقود. وهي تنتظر عند دوّامة الأطفال."},"Botengang":{"tr":"Ulaklık (Botengang)","vi":"Đi mua hộ (Botengang)","ar":"المشوار بالتكليف (Botengang)"},"Ein Kind kauft im Auftrag der Eltern ein und überbringt nur deren Willen. Der Kauf ist gültig.":{"tr":"Bir çocuk ebeveynlerinin görevlendirmesiyle alışveriş yapar ve sadece onların iradesini iletir. Alışveriş geçerlidir.","vi":"Trẻ em mua theo yêu cầu của bố mẹ và chỉ truyền đạt ý muốn của họ. Việc mua có giá trị.","ar":"طفل يشتري بتكليف من أهله وينقل إرادتهم فقط. الشراء صحيح."},"Der 6-jährige Ben kauft mit Einkaufszettel und Geld seiner Mutter ein Brot → gültig (Botengang: Ben überbringt nur den Willen der Mutter).":{"tr":"6 yaşındaki Ben, annesinin alışveriş listesi ve parasıyla ekmek alıyor → geçerli (ulaklık: Ben sadece annesinin iradesini iletiyor).","vi":"Ben 6 tuổi mua một ổ bánh mì bằng giấy ghi và tiền của mẹ → có giá trị (Botengang: Ben chỉ truyền đạt ý muốn của mẹ).","ar":"Ben البالغ 6 سنوات يشتري خبزاً بقائمة مشتريات أمه ونقودها ← صحيح (Botengang: Ben ينقل إرادة أمه فقط)."},"Verkaufen – das ist ein Botengang. Emma überbringt nur den Willen der Mutter.":{"tr":"Sat – bu bir ulaklıktır (Botengang). Emma sadece annesinin iradesini iletiyor.","vi":"Bán – đây là đi mua hộ. Emma chỉ truyền đạt ý muốn của mẹ.","ar":"البيع – هذا مشوار بتكليف. Emma تنقل إرادة أمها فقط."},"Danke! Mama winkt schon.":{"tr":"Teşekkürler! Annem şimdiden el sallıyor.","vi":"Cảm ơn! Mẹ đang vẫy tay kìa.","ar":"شكراً! ماما تلوّح لي."},"Beim Botengang kauft eigentlich die Mutter. Das Kind überbringt nur ihre Willenserklärung. Der Kauf ist gültig.":{"tr":"Ulaklıkta aslında anne alışveriş yapar. Çocuk sadece onun irade beyanını iletir. Alışveriş geçerlidir.","vi":"Khi đi mua hộ, thực ra người mua là mẹ. Đứa trẻ chỉ truyền đạt tuyên bố ý chí của mẹ. Việc mua có giá trị.","ar":"في المشوار بالتكليف تشتري الأم في الحقيقة. والطفل ينقل تعبيرها عن الإرادة فقط. الشراء صحيح."},"Ablehnen – unter 7 geht gar nichts.":{"tr":"Reddet – 7 yaşın altında hiçbir şey olmaz.","vi":"Từ chối – dưới 7 tuổi thì không được gì cả.","ar":"الرفض – دون 7 سنوات لا شيء يجوز."},"Aber Mama hat doch gesagt …":{"tr":"Ama annem söyledi ki …","vi":"Nhưng mẹ đã nói là …","ar":"لكن ماما قالت …"},"Vorsichtig, aber hier unnötig: Beim Botengang ist der Kauf gültig.":{"tr":"Temkinli, ama burada gereksiz: Ulaklıkta alışveriş geçerlidir.","vi":"Thận trọng, nhưng ở đây không cần thiết: Khi đi mua hộ, việc mua có giá trị.","ar":"حذر، لكنه هنا غير ضروري: في المشوار بالتكليف يكون الشراء صحيحاً."},"Verkaufen, weil Sonnencreme ein Notfall ist.":{"tr":"Sat, çünkü güneş kremi acil bir durumdur.","vi":"Bán, vì kem chống nắng là trường hợp khẩn cấp.","ar":"البيع، لأن الكريم الواقي من الشمس حالة طارئة."},"Okay!":{"tr":"Tamam!","vi":"Dạ!","ar":"حسناً!"},"Ob Notfall oder nicht, spielt keine Rolle. Gültig ist der Kauf wegen des Botengangs.":{"tr":"Acil olup olmaması önemli değil. Alışveriş ulaklık nedeniyle geçerlidir.","vi":"Khẩn cấp hay không không quan trọng. Việc mua có giá trị là nhờ đi mua hộ.","ar":"سواء كانت حالة طارئة أم لا، لا يهم. الشراء صحيح بسبب المشوار بالتكليف."},"…weil das Kind beim Botengang nur den Willen der Mutter überbringt.":{"tr":"…çünkü çocuk ulaklıkta sadece annesinin iradesini iletir.","vi":"…vì khi đi mua hộ, đứa trẻ chỉ truyền đạt ý muốn của mẹ.","ar":"…لأن الطفل في المشوار بالتكليف ينقل إرادة الأم فقط."},"…weil Kinder ab 6 beschränkt geschäftsfähig sind.":{"tr":"…çünkü 6 yaşından itibaren çocuklar sınırlı hukuki işlem ehliyetlidir.","vi":"…vì trẻ em từ 6 tuổi có năng lực hành vi hạn chế.","ar":"…لأن الأطفال من عمر 6 سنوات ناقصو الأهلية."},"…weil Sonnencreme nicht unter das Kaufrecht fällt.":{"tr":"…çünkü güneş kremi satış hukukuna girmez.","vi":"…vì kem chống nắng không thuộc luật mua bán.","ar":"…لأن الكريم الواقي من الشمس لا يدخل في قانون البيع."},"14 Jahre alt":{"tr":"14 yaşında","vi":"14 tuổi","ar":"عمرها 14 سنة"},"Leonie, 14, kauft ein Band-T-Shirt für 25,00 €. Sie zahlt bar von ihrem Taschengeld.":{"tr":"14 yaşındaki Leonie 25,00 € lik bir grup tişörtü alıyor. Harçlığından nakit ödüyor.","vi":"Leonie, 14 tuổi, mua một chiếc áo thun ban nhạc giá 25,00 €. Em trả bằng tiền mặt từ tiền tiêu vặt.","ar":"Leonie، 14 سنة، تشتري قميصاً عليه شعار فرقة بسعر 25,00 €. تدفع نقداً من مصروفها."},"Taschengeldparagraf (§ 110 BGB)":{"tr":"Harçlık maddesi (§ 110 BGB)","vi":"Điều khoản tiền tiêu vặt (§ 110 BGB)","ar":"مادة المصروف الشخصي (Taschengeldparagraf) (§ 110 BGB)"},"Beschränkt Geschäftsfähige kaufen gültig, wenn sie sofort und vollständig mit Geld zur freien Verfügung bezahlen.":{"tr":"Sınırlı hukuki işlem ehliyetliler, serbestçe kullanabilecekleri parayla hemen ve tamamen öderlerse geçerli alışveriş yaparlar.","vi":"Người có năng lực hành vi hạn chế mua có giá trị nếu trả ngay và đầy đủ bằng tiền được tự do sử dụng.","ar":"ناقصو الأهلية يشترون بشكل صحيح إذا دفعوا فوراً وبالكامل بمال تحت تصرفهم الحر."},"Im Rahmen des „Taschengeldparagrafen“ abgeschlossene Kaufverträge sind auch ohne Zustimmung des gesetzlichen Vertreters gültig.":{"tr":"„Harçlık maddesi“ kapsamında yapılan satış sözleşmeleri yasal temsilcinin onayı olmadan da geçerlidir.","vi":"Các hợp đồng mua bán trong phạm vi „điều khoản tiền tiêu vặt“ có giá trị kể cả khi không có sự đồng ý của người đại diện theo pháp luật.","ar":"عقود البيع المبرمة في إطار „مادة المصروف الشخصي“ صحيحة حتى بدون موافقة الممثل القانوني."},"Verkaufen: Taschengeldparagraf. Sie zahlt sofort und vollständig mit Geld zur freien Verfügung.":{"tr":"Sat: Harçlık maddesi. O, serbestçe kullanabileceği parayla hemen ve tamamen ödüyor.","vi":"Bán: điều khoản tiền tiêu vặt. Em trả ngay và đầy đủ bằng tiền được tự do sử dụng.","ar":"البيع: مادة المصروف الشخصي. هي تدفع فوراً وبالكامل بمال تحت تصرفها الحر."},"Yes! Mein erstes Band-Shirt!":{"tr":"Yes! İlk grup tişörtüm!","vi":"Yes! Chiếc áo ban nhạc đầu tiên của mình!","ar":"رائع! قميصي الأول لفرقتي!"},"Ab 7 ist man beschränkt geschäftsfähig. Mit Taschengeld, sofort und vollständig bezahlt, ist der Kauf gültig.":{"tr":"7 yaşından itibaren sınırlı hukuki işlem ehliyeti vardır. Harçlıkla, hemen ve tamamen ödenirse alışveriş geçerlidir.","vi":"Từ 7 tuổi là có năng lực hành vi hạn chế. Nếu trả bằng tiền tiêu vặt, ngay và đầy đủ, thì việc mua có giá trị.","ar":"من عمر 7 يكون الإنسان ناقص الأهلية. بالمصروف، وبالدفع فوراً وبالكامل، يكون الشراء صحيحاً."},"Verkaufen, aber vorher die Eltern anrufen.":{"tr":"Sat, ama önce ailesini ara.","vi":"Bán, nhưng gọi điện cho bố mẹ trước.","ar":"البيع، لكن بعد الاتصال بالأهل أولاً."},"Echt jetzt? Das ist so peinlich …":{"tr":"Gerçekten mi? Bu çok utanç verici …","vi":"Thật á? Ngại quá đi …","ar":"حقاً الآن؟ هذا محرج جداً …"},"Nicht nötig: Beim Taschengeldparagrafen braucht es keine Zustimmung der Eltern.":{"tr":"Gerek yok: Harçlık maddesinde ailenin onayı gerekmez.","vi":"Không cần: Với điều khoản tiền tiêu vặt, không cần bố mẹ đồng ý.","ar":"غير ضروري: في مادة المصروف الشخصي لا حاجة إلى موافقة الأهل."},"Ablehnen – unter 18 nur mit Eltern.":{"tr":"Reddet – 18 yaşın altında sadece ailesiyle.","vi":"Từ chối – dưới 18 tuổi chỉ được mua khi có bố mẹ.","ar":"الرفض – دون 18 سنة فقط مع الأهل."},"Aber das ist mein Taschengeld!":{"tr":"Ama bu benim harçlığım!","vi":"Nhưng đây là tiền tiêu vặt của em mà!","ar":"لكن هذا مصروفي!"},"Falsch: Mit dem Taschengeldparagrafen darf sie allein kaufen.":{"tr":"Yanlış: Harçlık maddesiyle tek başına alışveriş yapabilir.","vi":"Sai: Với điều khoản tiền tiêu vặt, em được phép tự mua.","ar":"خطأ: بمادة المصروف الشخصي يحق لها أن تشتري بمفردها."},"…weil Jugendliche ab 7 mit Taschengeld gültig kaufen, wenn sie sofort und vollständig bezahlen.":{"tr":"…çünkü gençler 7 yaşından itibaren harçlıkla yaptıkları alışverişi, hemen ve tam olarak ödedikleri takdirde geçerli şekilde yapabilir.","vi":"…vì thanh thiếu niên từ 7 tuổi có thể mua hợp lệ bằng tiền tiêu vặt, nếu trả ngay và trả đủ.","ar":"…لأن القاصرين من عمر 7 سنوات يشترون شراءً صحيحاً بمصروف الجيب إذا دفعوا فوراً وبالكامل."},"…weil man ab 14 voll geschäftsfähig ist.":{"tr":"…çünkü insan 14 yaşından itibaren tam hukuki işlem ehliyetine (Geschäftsfähigkeit) sahiptir.","vi":"…vì từ 14 tuổi là có đầy đủ năng lực hành vi (Geschäftsfähigkeit).","ar":"…لأن الإنسان يصبح كامل الأهلية (geschäftsfähig) من عمر 14."},"…weil der Kauf schwebend unwirksam ist.":{"tr":"…çünkü alışveriş askıda (geçici olarak geçersiz, schwebend unwirksam) durumdadır.","vi":"…vì việc mua bán đó chưa có hiệu lực (schwebend unwirksam).","ar":"…لأن الشراء schwebend unwirksam (معلّق، غير نافذ مؤقتاً)."},"16 Jahre alt":{"tr":"16 yaşında","vi":"16 tuổi","ar":"عمره 16 سنة"},"Jonas, 16, will die große Bluetooth-Box für 349,00 € kaufen – bar, von seinen Ersparnissen. Seine Eltern wissen nichts davon.":{"tr":"16 yaşındaki Jonas, 349,00 € tutarındaki büyük Bluetooth hoparlörü nakit olarak, birikimlerinden almak istiyor. Ailesinin bundan haberi yok.","vi":"Jonas, 16 tuổi, muốn mua chiếc loa Bluetooth lớn giá 349,00 € – trả tiền mặt, bằng tiền tiết kiệm của mình. Bố mẹ cậu không biết gì về việc này.","ar":"يريد يوناس، 16 سنة، شراء مكبّر الصوت الكبير بلوتوث بسعر 349,00 € – نقداً، من مدخراته. أهله لا يعرفون شيئاً عن ذلك."},"Schwebend unwirksam":{"tr":"Askıda (geçici olarak geçersiz)","vi":"Chưa có hiệu lực (schwebend unwirksam)","ar":"معلّق (غير نافذ مؤقتاً)"},"Der Kauf eines beschränkt Geschäftsfähigen gilt erst, wenn die Eltern zustimmen. Sagen sie Nein, ist er von Anfang an ungültig.":{"tr":"Sınırlı hukuki işlem ehliyeti olan (beschränkt Geschäftsfähiger) bir kişinin alışverişi, ancak ebeveynler onaylarsa geçerli olur. Hayır derlerse baştan geçersizdir.","vi":"Việc mua của người có năng lực hành vi hạn chế (beschränkt Geschäftsfähiger) chỉ có hiệu lực khi bố mẹ đồng ý. Nếu bố mẹ từ chối, việc mua vô hiệu ngay từ đầu.","ar":"شراء ناقص الأهلية (beschränkt geschäftsfähig) لا يصبح نافذاً إلا بموافقة الأهل. وإذا رفضوا، يكون باطلاً من البداية."},"Die Eltern können die Rücknahme verlangen, da der Vertrag bis zu deren Ablehnung schwebend unwirksam war.":{"tr":"Ebeveynler malın geri alınmasını isteyebilir, çünkü sözleşme onların reddine kadar askıda (geçici olarak geçersiz, schwebend unwirksam) idi.","vi":"Bố mẹ có thể yêu cầu trả lại hàng, vì hợp đồng chưa có hiệu lực (schwebend unwirksam) cho đến khi bố mẹ từ chối.","ar":"يستطيع الأهل طلب إعادة البضاعة، لأن العقد كان schwebend unwirksam (معلّق، غير نافذ مؤقتاً) حتى رفضهم."},"„Weil die Box so teuer ist, brauche ich die Zustimmung deiner Eltern. Ich lege sie dir gern bis heute Abend zurück.“":{"tr":"„Hoparlör çok pahalı olduğu için ailenin onayı gerekiyor. İstersen bu akşama kadar senin için ayırırım.“","vi":"„Vì chiếc loa này đắt, em cần có sự đồng ý của bố mẹ. Chị sẵn lòng giữ lại cho em đến tối nay.“","ar":"„بما أن مكبّر الصوت غالٍ، أحتاج إلى موافقة أهلك. يسعدني أن أحجزه لك حتى المساء.“"},"Hm, okay. Ich ruf meinen Vater an.":{"tr":"Hmm, tamam. Babamı arayacağım.","vi":"Ừm, được rồi. Em sẽ gọi cho bố em.","ar":"همم، حسناً. سأتصل بأبي."},"Ersparnisse für eine große Anschaffung fallen nicht unter den Taschengeldparagrafen. Ohne Zustimmung ist der Kauf schwebend unwirksam.":{"tr":"Büyük bir alışveriş için yapılan birikimler harçlık maddesi (Taschengeldparagraf) kapsamına girmez. Onay olmadan alışveriş askıda (geçici olarak geçersiz) kalır.","vi":"Tiền tiết kiệm dùng cho một món mua lớn không thuộc điều khoản tiền tiêu vặt (Taschengeldparagraf). Không có sự đồng ý của bố mẹ thì việc mua chưa có hiệu lực (schwebend unwirksam).","ar":"المدخرات لشراء شيء كبير لا تدخل ضمن مادة مصروف الجيب (Taschengeldparagraf). بدون موافقة يكون الشراء schwebend unwirksam (معلّق، غير نافذ مؤقتاً)."},"Verkaufen – Barzahlung ist immer gültig.":{"tr":"Sat – nakit ödeme her zaman geçerlidir.","vi":"Bán – trả tiền mặt luôn hợp lệ.","ar":"أبيع – الدفع نقداً صحيح دائماً."},"Läuft!":{"tr":"Tamamdır!","vi":"Xong!","ar":"تمام!"},"Barzahlung allein reicht nicht. Sagen die Eltern Nein, ist der Kauf von Anfang an ungültig.":{"tr":"Tek başına nakit ödeme yetmez. Ebeveynler hayır derse alışveriş baştan geçersizdir.","vi":"Chỉ trả tiền mặt là chưa đủ. Nếu bố mẹ từ chối, việc mua vô hiệu ngay từ đầu.","ar":"الدفع نقداً وحده لا يكفي. إذا رفض الأهل، يكون الشراء باطلاً من البداية."},"Verkaufen und hoffen, dass die Eltern nichts merken.":{"tr":"Sat ve ebeveynlerin fark etmemesini umut et.","vi":"Bán và hy vọng bố mẹ không phát hiện.","ar":"أبيع وآمل ألّا ينتبه الأهل."},"Die merken das eh nicht.":{"tr":"Zaten fark etmezler.","vi":"Dù sao họ cũng không biết đâu.","ar":"لن ينتبهوا على أي حال."},"Der Kauf ist schwebend unwirksam. Die Eltern können die Rücknahme verlangen.":{"tr":"Alışveriş askıda (geçici olarak geçersiz). Ebeveynler malın geri alınmasını isteyebilir.","vi":"Việc mua chưa có hiệu lực (schwebend unwirksam). Bố mẹ có thể yêu cầu trả lại hàng.","ar":"الشراء معلّق (غير نافذ مؤقتاً). يستطيع الأهل طلب إعادة البضاعة."},"…weil Ersparnisse für eine große Anschaffung nicht unter den Taschengeldparagrafen fallen.":{"tr":"…çünkü büyük bir alışveriş için yapılan birikimler harçlık maddesi (Taschengeldparagraf) kapsamına girmez.","vi":"…vì tiền tiết kiệm cho một món mua lớn không thuộc điều khoản tiền tiêu vặt (Taschengeldparagraf).","ar":"…لأن المدخرات لشراء شيء كبير لا تدخل ضمن مادة مصروف الجيب."},"…weil Barkäufe von Minderjährigen immer nichtig sind.":{"tr":"…çünkü reşit olmayanların nakit alışverişleri her zaman geçersizdir (nichtig).","vi":"…vì việc mua bằng tiền mặt của trẻ vị thành niên luôn vô hiệu (nichtig).","ar":"…لأن مشتريات القاصرين النقدية باطلة دائماً."},"…weil die Eltern nur innerhalb von 8 Tagen widersprechen dürfen.":{"tr":"…çünkü ebeveynler yalnızca 8 gün içinde itiraz edebilir.","vi":"…vì bố mẹ chỉ được phản đối trong vòng 8 ngày.","ar":"…لأن الأهل يحق لهم الاعتراض خلال 8 أيام فقط."},"Was ist der Unterschied zwischen Rechtsfähigkeit und Geschäftsfähigkeit?":{"tr":"Hak ehliyeti (Rechtsfähigkeit) ile hukuki işlem ehliyeti (Geschäftsfähigkeit) arasındaki fark nedir?","vi":"Sự khác nhau giữa năng lực pháp luật (Rechtsfähigkeit) và năng lực hành vi (Geschäftsfähigkeit) là gì?","ar":"ما الفرق بين الأهلية القانونية العامة (Rechtsfähigkeit) وأهلية إبرام العقود (Geschäftsfähigkeit)؟"},"Rechtsfähig ist jeder Mensch ab der Geburt. Geschäftsfähig ist man ab 7 beschränkt und ab 18 voll.":{"tr":"Her insan doğumdan itibaren hak ehliyetine sahiptir. Hukuki işlem ehliyeti 7 yaşından itibaren sınırlı, 18 yaşından itibaren tamdır.","vi":"Mọi người đều có năng lực pháp luật từ khi sinh ra. Năng lực hành vi: từ 7 tuổi là hạn chế, từ 18 tuổi là đầy đủ.","ar":"كل إنسان يتمتع بـ Rechtsfähigkeit (أهلية اكتساب الحقوق) منذ الولادة. أما Geschäftsfähigkeit (أهلية إبرام العقود) فتكون ناقصة من عمر 7 وكاملة من عمر 18."},"Rechtsfähig ist man ab 18, geschäftsfähig ab 7.":{"tr":"Hak ehliyeti 18 yaşından itibaren, hukuki işlem ehliyeti 7 yaşından itibaren başlar.","vi":"Có năng lực pháp luật từ 18 tuổi, có năng lực hành vi từ 7 tuổi.","ar":"يتمتع الإنسان بأهلية اكتساب الحقوق من عمر 18، وبأهلية إبرام العقود من عمر 7."},"Beide Wörter bedeuten dasselbe.":{"tr":"İki kelime aynı anlama gelir.","vi":"Hai từ này có nghĩa giống nhau.","ar":"الكلمتان تعنيان الشيء نفسه."},"Simone (17) ist Auszubildende. In welchem Fall kommt KEIN gültiger Vertrag zustande?":{"tr":"Simone (17) çırak. Hangi durumda geçerli bir sözleşme OLUŞMAZ?","vi":"Simone (17 tuổi) là học viên học nghề. Trường hợp nào KHÔNG hình thành hợp đồng có hiệu lực?","ar":"سيمونه (17 سنة) متدرّبة. في أي حالة لا ينشأ عقد صحيح؟"},"Sie schließt ohne Wissen der Eltern einen Ratenkauf über einen Computer ab.":{"tr":"Ailesinin haberi olmadan bilgisayar için taksitli alışveriş (Ratenkauf) sözleşmesi yapıyor.","vi":"Cô ấy ký hợp đồng mua máy tính trả góp mà bố mẹ không biết.","ar":"تُبرم، دون علم الأهل، عقد شراء بالتقسيط لحاسوب."},"Sie kauft eine Monatskarte für den Weg zum Ausbildungsbetrieb.":{"tr":"Eğitim aldığı işyerine gidip gelmek için aylık bilet alıyor.","vi":"Cô ấy mua vé tháng để đi đến nơi học nghề.","ar":"تشتري بطاقة شهرية للطريق إلى مكان التدريب."},"Sie kauft auf Anweisung des Abteilungsleiters Büromaterial für den Betrieb.":{"tr":"Bölüm müdürünün talimatıyla işyeri için büro malzemesi alıyor.","vi":"Theo chỉ thị của trưởng bộ phận, cô ấy mua văn phòng phẩm cho doanh nghiệp.","ar":"تشتري، بتعليمات من رئيس القسم، مستلزمات مكتبية للشركة."},"Ein etwa 12-jähriges Mädchen will Kopfhörer für 129,00 € bar bezahlen. Was trifft zu?":{"tr":"12 yaşlarında bir kız çocuğu 129,00 € tutarındaki kulaklığı nakit ödemek istiyor. Hangisi doğrudur?","vi":"Một bé gái khoảng 12 tuổi muốn trả 129,00 € tiền mặt để mua tai nghe. Điều nào đúng?","ar":"فتاة عمرها نحو 12 سنة تريد دفع ثمن سمّاعات رأس بسعر 129,00 € نقداً. ما الصحيح؟"},"Der Kauf wäre schwebend unwirksam – ich lege die Kopfhörer zurück, bis die Eltern zustimmen.":{"tr":"Alışveriş askıda (geçici olarak geçersiz) olur – ebeveynler onaylayana kadar kulaklığı ayırırım.","vi":"Việc mua sẽ chưa có hiệu lực (schwebend unwirksam) – tôi giữ tai nghe lại cho đến khi bố mẹ đồng ý.","ar":"الشراء سيكون schwebend unwirksam (معلّق، غير نافذ مؤقتاً) – سأحجز السمّاعات حتى يوافق الأهل."},"Der Kauf ist nichtig, weil sie unter 14 ist.":{"tr":"Alışveriş geçersizdir (nichtig), çünkü 14 yaşından küçük.","vi":"Việc mua vô hiệu (nichtig) vì bé dưới 14 tuổi.","ar":"الشراء باطل (nichtig) لأن عمرها أقل من 14."},"Der Kauf ist gültig, weil sie bar bezahlt.":{"tr":"Alışveriş geçerlidir, çünkü nakit ödüyor.","vi":"Việc mua hợp lệ vì bé trả tiền mặt.","ar":"الشراء صحيح لأنها تدفع نقداً."},"Pannen im Büro-Zelt":{"tr":"Büro çadırında aksilikler","vi":"Sự cố trong lều văn phòng","ar":"أعطال في خيمة المكتب"},"Rechtsgeschäfte, Nichtigkeit, Anfechtung":{"tr":"Hukuki işlemler (Rechtsgeschäfte), geçersizlik (Nichtigkeit), iptal edilebilirlik (Anfechtung)","vi":"Giao dịch pháp lý (Rechtsgeschäfte), vô hiệu (Nichtigkeit), hủy bỏ (Anfechtung)","ar":"التصرفات القانونية، البطلان، الإبطال"},"Sonntag, 14 Uhr. Jana sitzt im Büro-Zelt und bestellt für den Abschlussabend. Dabei geht einiges schief – und auch am Stand gibt es seltsame „Geschäfte“.":{"tr":"Pazar, saat 14. Jana büro çadırında oturuyor ve kapanış akşamı için sipariş veriyor. Bu sırada birçok şey ters gidiyor – standda da garip „işlemler“ oluyor.","vi":"Chủ nhật, 14 giờ. Jana ngồi trong lều văn phòng và đặt hàng cho buổi tối bế mạc. Có nhiều chuyện trục trặc – và ở gian hàng cũng có những „giao dịch“ kỳ lạ.","ar":"الأحد، الساعة 14. تجلس ياناه في خيمة المكتب وتطلب بضائع لأمسية الختام. تسير أمور كثيرة بشكل خاطئ – وفي الكشك أيضاً هناك „صفقات“ غريبة."},"die Willenserklärung":{"tr":"irade beyanı","vi":"tuyên bố ý chí","ar":"التعبير عن الإرادة"},"das Rechtsgeschäft":{"tr":"hukuki işlem","vi":"giao dịch pháp lý","ar":"التصرف القانوني"},"einseitig":{"tr":"tek taraflı","vi":"một phía","ar":"من طرف واحد"},"zweiseitig":{"tr":"iki taraflı","vi":"hai phía","ar":"من طرفين"},"schlüssiges Handeln":{"tr":"örtülü davranış (davranışla irade bildirme)","vi":"hành vi ngầm hiểu","ar":"التصرف الضمني (بالسلوك)"},"anfechtbar":{"tr":"iptal edilebilir","vi":"có thể bị hủy bỏ","ar":"قابل للإبطال"},"anfechten":{"tr":"iptal etmek (sözleşmeyi iptal etme hakkını kullanmak)","vi":"hủy bỏ (hợp đồng)","ar":"يُبطل (يطعن في العقد)"},"der Irrtum":{"tr":"yanılma","vi":"sự nhầm lẫn","ar":"الغلط"},"die arglistige Täuschung":{"tr":"hileli aldatma","vi":"sự lừa dối có chủ ý","ar":"الخداع المتعمّد"},"die widerrechtliche Drohung":{"tr":"hukuka aykırı tehdit","vi":"sự đe dọa trái pháp luật","ar":"التهديد غير المشروع"},"das Scherzgeschäft":{"tr":"şaka amaçlı işlem","vi":"giao dịch đùa","ar":"صفقة المزاح"},"unverzüglich":{"tr":"gecikmeden","vi":"ngay lập tức, không chậm trễ","ar":"دون تأخير"},"Jana hat beim Getränke-Großhändler 500 Kisten Wasser bestellt. Gemeint waren 50. Sie merkt es eine Stunde später.":{"tr":"Jana toptan içecek satıcısından 500 kasa su sipariş etti. Kastettiği 50 idi. Bunu bir saat sonra fark ediyor.","vi":"Jana đã đặt 500 thùng nước ở nhà bán buôn đồ uống. Ý của cô là 50. Một giờ sau cô mới nhận ra.","ar":"طلبت ياناه من تاجر المشروبات بالجملة 500 صندوق ماء. المقصود كان 50. تنتبه بعد ساعة."},"Was rät ihr Jana?":{"tr":"Jana'ya ne tavsiye edersin?","vi":"Bạn khuyên Jana thế nào?","ar":"ماذا تنصح ياناه؟"},"Anfechtbar: Irrtum in der Erklärung":{"tr":"İptal edilebilir (anfechtbar): beyan yanılgısı","vi":"Có thể bị hủy bỏ (anfechtbar): nhầm lẫn trong tuyên bố","ar":"قابل للإبطال: غلط في التعبير عن الإرادة"},"Man hat sich verschrieben, vertippt oder versprochen. Der Vertrag gilt, bis man unverzüglich anficht.":{"tr":"Yanlış yazdı, yanlış tuşladı veya yanlış söyledi. Sözleşme, gecikmeden iptal edilene (unverzüglich anfechten) kadar geçerlidir.","vi":"Người ta viết sai, gõ sai hoặc nói nhầm. Hợp đồng có hiệu lực cho đến khi người đó hủy bỏ (anfechten) ngay lập tức.","ar":"أخطأ الشخص في الكتابة أو في الطباعة أو في الكلام. العقد يسري حتى يُبطله دون تأخير."},"Anfechtung ist berechtigt, wenn im Angebot anstatt 300,00 € versehentlich nur 30,00 € als Stückpreis angegeben wurden.":{"tr":"Teklifte birim fiyat yanlışlıkla 300,00 € yerine sadece 30,00 € yazılmışsa iptal haklıdır.","vi":"Việc hủy bỏ là chính đáng nếu trong báo giá lỡ ghi đơn giá chỉ là 30,00 € thay vì 300,00 €.","ar":"الإبطال مبرَّر إذا ذُكر في العرض سهواً سعر القطعة 30,00 € فقط بدلاً من 300,00 €."},"Sofort beim Großhändler anfechten: Sie hat sich vertippt (Irrtum in der Erklärung).":{"tr":"Hemen toptancıya iptal bildir (anfechten): Yanlış tuşladı (beyan yanılgısı).","vi":"Hủy bỏ (anfechten) ngay với nhà bán buôn: cô ấy gõ nhầm (nhầm lẫn trong tuyên bố).","ar":"أبطلي العقد فوراً لدى تاجر الجملة: أخطأتِ في الطباعة (غلط في التعبير عن الإرادة)."},"Gut, ich ruf gleich an und schick eine Mail hinterher.":{"tr":"İyi, hemen arayacağım ve arkasından e-posta göndereceğim.","vi":"Được, tôi gọi ngay và gửi thêm email sau.","ar":"جيد، سأتصل حالاً ثم أرسل رسالة بريد إلكتروني."},"Ein Erklärungsirrtum macht den Vertrag anfechtbar. Anfechten muss man unverzüglich, also sofort nach dem Entdecken.":{"tr":"Beyan yanılgısı sözleşmeyi iptal edilebilir yapar. İptal gecikmeden, yani fark edilir edilmez yapılmalıdır.","vi":"Nhầm lẫn trong tuyên bố làm hợp đồng có thể bị hủy bỏ (anfechtbar). Phải hủy bỏ ngay lập tức (unverzüglich), tức là ngay sau khi phát hiện.","ar":"الغلط في التعبير يجعل العقد قابلاً للإبطال (anfechtbar). يجب الإبطال دون تأخير (unverzüglich)، أي فور اكتشاف الخطأ."},"Bis Montag warten und dann anfechten.":{"tr":"Pazartesiye kadar bekle, sonra iptal et.","vi":"Đợi đến thứ Hai rồi mới hủy bỏ.","ar":"انتظري حتى يوم الاثنين ثم أبطلي."},"Montag? Bis dahin ist der Lkw schon unterwegs …":{"tr":"Pazartesi mi? O zamana kadar kamyon yola çıkmış olur …","vi":"Thứ Hai ư? Đến lúc đó xe tải đã lên đường rồi …","ar":"الاثنين؟ حتى ذلك الحين تكون الشاحنة في الطريق …"},"Anfechtbar ja – aber unverzüglich. Wer lange wartet, verliert das Recht.":{"tr":"İptal edilebilir, evet – ama gecikmeden. Uzun bekleyen hakkını kaybeder.","vi":"Có thể hủy bỏ – nhưng phải ngay lập tức. Ai chờ lâu sẽ mất quyền.","ar":"قابل للإبطال نعم – لكن دون تأخير. من ينتظر طويلاً يفقد هذا الحق."},"Nichts tun. Bestellt ist bestellt.":{"tr":"Hiçbir şey yapma. Sipariş verildi, verildi.","vi":"Không làm gì cả. Đã đặt là đã đặt.","ar":"لا تفعلي شيئاً. المطلوب مطلوب."},"500 Kisten? Wo soll ich die hinstellen?!":{"tr":"500 kasa mı? Bunları nereye koyacağım?!","vi":"500 thùng? Biết để ở đâu bây giờ?!","ar":"500 صندوق؟ أين سأضعها؟!"},"Ein Erklärungsirrtum darf angefochten werden. Man muss nicht für einen Tippfehler zahlen.":{"tr":"Beyan yanılgısı iptal edilebilir. Yazım hatası için ödeme yapmak gerekmez.","vi":"Nhầm lẫn trong tuyên bố được phép hủy bỏ. Không phải trả tiền cho một lỗi gõ.","ar":"يجوز إبطال العقد بسبب غلط في التعبير. لا يجب الدفع بسبب خطأ في الطباعة."},"…weil ein Erklärungsirrtum den Vertrag anfechtbar macht – aber nur bei unverzüglicher Anfechtung.":{"tr":"…çünkü beyan yanılgısı sözleşmeyi iptal edilebilir yapar – ama yalnızca gecikmeden iptal edilirse.","vi":"…vì nhầm lẫn trong tuyên bố làm hợp đồng có thể bị hủy bỏ – nhưng chỉ khi hủy bỏ ngay lập tức (unverzüglich).","ar":"…لأن الغلط في التعبير يجعل العقد قابلاً للإبطال – لكن فقط إذا تم الإبطال دون تأخير."},"…weil der Vertrag wegen des Fehlers von selbst nichtig ist.":{"tr":"…çünkü sözleşme hata yüzünden kendiliğinden geçersizdir (nichtig).","vi":"…vì hợp đồng tự động vô hiệu (nichtig) do lỗi đó.","ar":"…لأن العقد يصبح باطلاً من تلقاء نفسه بسبب الخطأ."},"…weil man für jede Anfechtung ein Jahr Zeit hat.":{"tr":"…çünkü her iptal için bir yıl süre vardır.","vi":"…vì với mỗi lần hủy bỏ, người ta có một năm thời gian.","ar":"…لأن لكل إبطال مهلة سنة واحدة."},"hat eine Regenjacke gekauft":{"tr":"yağmurluk satın aldı","vi":"đã mua một chiếc áo mưa","ar":"اشترى معطفاً للمطر"},"Herr Peters hat morgens eine Regenjacke für 39 € gekauft. Jetzt scheint die Sonne. Er sagt: „Ich will den Kauf anfechten!“":{"tr":"Bay Peters sabah 39 € karşılığında bir yağmurluk satın aldı. Şimdi hava güneşli. Diyor ki: „Alışverişi iptal etmek istiyorum!“","vi":"Sáng nay ông Peters đã mua một chiếc áo mưa giá 39 €. Bây giờ trời nắng. Ông nói: „Tôi muốn hủy bỏ việc mua này!“","ar":"اشترى السيد بيترس صباحاً معطفاً للمطر بسعر 39 €. الآن الشمس مشرقة. يقول: „أريد إبطال الشراء!“"},"Was antwortest du?":{"tr":"Ne cevap verirsin?","vi":"Bạn trả lời thế nào?","ar":"ماذا تجيب؟"},"Motivirrtum":{"tr":"Saik yanılgısı (Motivirrtum)","vi":"Nhầm lẫn về động cơ (Motivirrtum)","ar":"غلط في الدافع"},"Man irrt sich nur über seine Gründe („Ich dachte, ich brauche das noch.“). Kein Anfechtungsgrund.":{"tr":"Kişi yalnızca kendi nedenleri konusunda yanılıyor („Buna hâlâ ihtiyacım olacağını sanmıştım.“). İptal nedeni değildir.","vi":"Người ta chỉ nhầm về lý do của mình („Tôi tưởng tôi vẫn cần nó.“). Đây không phải là lý do để hủy bỏ.","ar":"يخطئ الشخص فقط في أسبابه („ظننت أنني ما زلت أحتاج إلى هذا.“). هذا ليس سبباً للإبطال."},"Kein Anfechtungsgrund: Er hat sich nur über seinen Geschmack bzw. seine Gründe geirrt (Motivirrtum). Der Vertrag bleibt gültig. Ein Umtausch ist nur Kulanz.":{"tr":"İptal nedeni yok: Sadece zevki veya nedenleri konusunda yanıldı (saik yanılgısı, Motivirrtum). Sözleşme geçerli kalır. Değişim sadece iyi niyet göstergesidir (Kulanz).","vi":"Không phải lý do hủy bỏ: ông chỉ nhầm về sở thích hay lý do của mình (nhầm lẫn về động cơ, Motivirrtum). Hợp đồng vẫn có hiệu lực. Đổi hàng chỉ là sự thiện chí (Kulanz).","ar":"ليس سبباً للإبطال: أخطأ فقط في ذوقه أو في أسبابه (Motivirrtum – غلط في الدافع). العقد يبقى صحيحاً. والاستبدال مجرد لطف من المتجر (Kulanz)."},"„Das ist leider kein Grund zum Anfechten – Sie haben sich nur über Ihren Grund geirrt. Ich frage meine Chefin, ob wir aus Kulanz umtauschen.“":{"tr":"„Maalesef bu iptal için bir neden değil – sadece kendi nedeniniz konusunda yanıldınız. Müdüremize iyi niyet göstergesi (Kulanz) olarak değişim yapıp yapamayacağımızı soracağım.“","vi":"„Rất tiếc, đó không phải là lý do để hủy bỏ – ông chỉ nhầm về lý do của mình. Tôi sẽ hỏi chị trưởng cửa hàng xem chúng tôi có thể đổi hàng vì thiện chí (Kulanz) không.“","ar":"„للأسف هذا ليس سبباً للإبطال – لقد أخطأتم فقط في سببكم. سأسأل مديرتي إن كان يمكننا الاستبدال من باب اللطف.“"},"Na gut. Wäre nett, wenn's klappt.":{"tr":"Peki. Olursa güzel olur.","vi":"Thôi được. Mong là được.","ar":"حسناً. سيكون لطيفاً لو نجح الأمر."},"Ein Motivirrtum (Irrtum über die eigenen Gründe) ist kein Anfechtungsgrund. Ein Umtausch ist nur Kulanz.":{"tr":"Saik yanılgısı (Motivirrtum, kişinin kendi nedenleri konusunda yanılması) iptal nedeni değildir. Değişim sadece iyi niyet göstergesidir (Kulanz).","vi":"Nhầm lẫn về động cơ (Motivirrtum, nhầm về lý do của chính mình) không phải lý do hủy bỏ. Đổi hàng chỉ là sự thiện chí (Kulanz).","ar":"Motivirrtum (الغلط في الأسباب الشخصية) ليس سبباً للإبطال. والاستبدال مجرد لطف من المتجر."},"„Klar, ein Wetterirrtum ist ein Anfechtungsgrund.“":{"tr":"„Tabii, hava durumu yanılgısı bir iptal nedenidir.“","vi":"„Tất nhiên rồi, nhầm về thời tiết là lý do hủy bỏ.“","ar":"„طبعاً، الخطأ في توقع الطقس سبب للإبطال.“"},"Wusste ich's doch!":{"tr":"Zaten biliyordum!","vi":"Tôi biết mà!","ar":"كنت أعلم ذلك!"},"Falsch: Ein Motivirrtum ist nicht anfechtbar.":{"tr":"Yanlış: Saik yanılgısı iptal edilemez.","vi":"Sai: nhầm lẫn về động cơ (Motivirrtum) không thể hủy bỏ.","ar":"خطأ: الغلط في الدافع لا يُبطل العقد."},"„Der Vertrag ist nichtig, weil sich das Wetter geändert hat.“":{"tr":"„Hava değiştiği için sözleşme geçersizdir (nichtig).“","vi":"„Hợp đồng vô hiệu vì thời tiết đã thay đổi.“","ar":"„العقد باطل لأن الطقس تغيّر.“"},"Prima, dann Geld zurück!":{"tr":"Harika, o zaman para iadesi!","vi":"Tuyệt, vậy trả lại tiền cho tôi!","ar":"ممتاز، إذن أسترد مالي!"},"Der Vertrag ist gültig. Nichtig ist ein Vertrag z. B. mit Kindern unter 7 oder bei einem Scherzgeschäft.":{"tr":"Sözleşme geçerlidir. Geçersiz (nichtig) sözleşme örneğin 7 yaşından küçük çocuklarla veya şaka amaçlı işlemde (Scherzgeschäft) yapılan sözleşmedir.","vi":"Hợp đồng có hiệu lực. Hợp đồng vô hiệu (nichtig) ví dụ như với trẻ dưới 7 tuổi hoặc trong giao dịch đùa (Scherzgeschäft).","ar":"العقد صحيح. العقد يكون باطلاً (nichtig) مثلاً مع الأطفال دون 7 سنوات أو في صفقة المزاح."},"…weil ein Motivirrtum kein Anfechtungsgrund ist – ein Umtausch ist nur Kulanz.":{"tr":"…çünkü saik yanılgısı (Motivirrtum) bir iptal nedeni değildir – değişim sadece iyi niyet göstergesidir (Kulanz).","vi":"…vì nhầm lẫn về động cơ không phải lý do hủy bỏ – đổi hàng chỉ là sự thiện chí (Kulanz).","ar":"…لأن الغلط في الدافع ليس سبباً للإبطال – والاستبدال مجرد لطف من المتجر."},"…weil jeder Kauf 14 Tage lang anfechtbar ist.":{"tr":"…çünkü her alışveriş 14 gün boyunca iptal edilebilir.","vi":"…vì mọi việc mua đều có thể hủy bỏ trong 14 ngày.","ar":"…لأن كل عملية شراء قابلة للإبطال خلال 14 يوماً."},"…weil eine Regenjacke ein Scherzgeschäft ist.":{"tr":"…çünkü yağmurluk bir şaka amaçlı işlemdir.","vi":"…vì áo mưa là một giao dịch đùa (Scherzgeschäft).","ar":"…لأن معطف المطر صفقة مزاح."},"Ein Händler hat euch 50 Band-Shirts als „Original-Merch“ verkauft. Jetzt kommt heraus: Es sind Fälschungen – und er wusste es.":{"tr":"Bir satıcı size 50 grup tişörtünü „orijinal ürün“ diye sattı. Şimdi anlaşılıyor: Bunlar sahte – ve satıcı bunu biliyordu.","vi":"Một người bán đã bán cho các bạn 50 áo thun ban nhạc là „hàng chính hãng“. Giờ lộ ra: đó là hàng giả – và ông ta biết điều đó.","ar":"باع لكم تاجر 50 قميصاً للفرقة الموسيقية على أنها „بضاعة أصلية (Original-Merch)“. الآن يتبيّن: إنها مقلّدة – وكان يعلم ذلك."},"Was ist jetzt richtig?":{"tr":"Şimdi doğru olan nedir?","vi":"Bây giờ điều gì là đúng?","ar":"ما الصحيح الآن؟"},"Arglistige Täuschung":{"tr":"Hileli aldatma (arglistige Täuschung)","vi":"Lừa dối có chủ ý (arglistige Täuschung)","ar":"الخداع المتعمّد"},"Jemand verschweigt oder lügt absichtlich. Der Vertrag ist anfechtbar – 1 Jahr ab Entdecken.":{"tr":"Biri kasıtlı olarak gerçeği gizliyor veya yalan söylüyor. Sözleşme iptal edilebilir (anfechtbar) – fark edildiği andan itibaren 1 yıl içinde.","vi":"Ai đó cố tình giấu giếm hoặc nói dối. Hợp đồng có thể bị hủy bỏ (anfechtbar) – trong 1 năm kể từ khi phát hiện.","ar":"شخص يُخفي الحقيقة أو يكذب عمداً. العقد قابل للإبطال – لمدة 1 سنة من وقت الاكتشاف."},"Ein Händler verkauft eine vergoldete Kette als „echte Goldkette“ → anfechtbar (arglistige Täuschung).":{"tr":"Bir satıcı altın kaplama zinciri „gerçek altın zincir“ diye satıyor → iptal edilebilir (hileli aldatma).","vi":"Một người bán bán sợi dây chuyền mạ vàng là „dây chuyền vàng thật“ → có thể hủy bỏ (lừa dối có chủ ý).","ar":"تاجر يبيع سلسلة مطلية بالذهب على أنها „سلسلة ذهب حقيقية“ → قابل للإبطال (خداع متعمّد)."},"Den Kaufvertrag wegen arglistiger Täuschung anfechten. Dafür habt ihr 1 Jahr ab Entdecken Zeit.":{"tr":"Satış sözleşmesini hileli aldatma nedeniyle iptal edin. Bunun için fark ettiğiniz andan itibaren 1 yıl süreniz var.","vi":"Hủy bỏ hợp đồng mua bán vì bị lừa dối có chủ ý. Các bạn có 1 năm kể từ khi phát hiện.","ar":"أبطلوا عقد البيع بسبب الخداع المتعمّد (arglistige Täuschung). لديكم لذلك 1 سنة من وقت الاكتشاف."},"Gut. Ich schreibe ihm heute noch.":{"tr":"İyi. Bugün ona yazacağım.","vi":"Tốt. Hôm nay tôi sẽ viết thư cho ông ta.","ar":"جيد. سأكتب له اليوم."},"Bei arglistiger Täuschung ist der Vertrag anfechtbar. Frist: 1 Jahr ab Entdecken der Täuschung.":{"tr":"Hileli aldatmada sözleşme iptal edilebilir. Süre: Aldatmanın fark edildiği andan itibaren 1 yıl.","vi":"Khi bị lừa dối có chủ ý, hợp đồng có thể bị hủy bỏ. Thời hạn: 1 năm kể từ khi phát hiện ra sự lừa dối.","ar":"عند الخداع المتعمّد يكون العقد قابلاً للإبطال. المهلة: 1 سنة من اكتشاف الخداع."},"Nichts tun – der Vertrag ist bei Täuschung automatisch nichtig.":{"tr":"Hiçbir şey yapma – aldatma durumunda sözleşme otomatik olarak geçersizdir (nichtig).","vi":"Không làm gì – khi bị lừa dối, hợp đồng tự động vô hiệu (nichtig).","ar":"لا تفعلوا شيئاً – العقد باطل تلقائياً عند الخداع."},"Automatisch? Bist du sicher?":{"tr":"Otomatik mi? Emin misin?","vi":"Tự động ư? Bạn chắc chứ?","ar":"تلقائياً؟ هل أنت متأكد؟"},"Bei Täuschung ist der Vertrag anfechtbar, nicht automatisch nichtig. Man muss aktiv anfechten.":{"tr":"Aldatma durumunda sözleşme iptal edilebilir, otomatik olarak geçersiz değildir. Kişi aktif olarak iptal etmelidir.","vi":"Khi bị lừa dối, hợp đồng có thể bị hủy bỏ, không tự động vô hiệu. Phải chủ động hủy bỏ.","ar":"عند الخداع يكون العقد قابلاً للإبطال، وليس باطلاً تلقائياً. يجب أن يقوم الشخص بالإبطال بنفسه."},"Nichts tun – gekauft ist gekauft.":{"tr":"Hiçbir şey yapma – alınan alındı.","vi":"Không làm gì – mua rồi là mua rồi.","ar":"لا تفعلوا شيئاً – ما اشتُري قد اشتُري."},"Dann bleiben wir auf den Fälschungen sitzen …":{"tr":"O zaman sahte ürünlerle baş başa kalırız …","vi":"Vậy thì chúng ta phải ôm đống hàng giả …","ar":"إذن سنبقى عالقين مع المقلّدات …"},"Wer getäuscht wurde, kann anfechten. Dann ist der Vertrag von Anfang an nichtig.":{"tr":"Aldatılan kişi sözleşmeyi iptal edebilir. O zaman sözleşme baştan geçersiz (nichtig) olur.","vi":"Ai bị lừa dối có thể hủy bỏ. Khi đó hợp đồng vô hiệu ngay từ đầu.","ar":"من تعرّض للخداع يستطيع الإبطال. عندئذٍ يكون العقد باطلاً من البداية."},"…weil man bei arglistiger Täuschung innerhalb eines Jahres nach dem Entdecken anfechten kann.":{"tr":"…çünkü hileli aldatmada, fark edildikten sonra bir yıl içinde iptal edilebilir.","vi":"…vì khi bị lừa dối có chủ ý, người ta có thể hủy bỏ trong vòng một năm sau khi phát hiện.","ar":"…لأنه يمكن الإبطال عند الخداع المتعمّد خلال سنة من الاكتشاف."},"…weil bei Täuschung eine Frist von 3 Tagen gilt.":{"tr":"…çünkü aldatmada 3 günlük süre geçerlidir.","vi":"…vì khi bị lừa dối có thời hạn 3 ngày.","ar":"…لأن مهلة 3 أيام تسري عند الخداع."},"…weil ein Vertrag mit Täuschung nichtig ist, ohne dass man etwas tun muss.":{"tr":"…çünkü aldatma içeren bir sözleşme, kişi hiçbir şey yapmasa da geçersizdir (nichtig).","vi":"…vì hợp đồng có sự lừa dối là vô hiệu (nichtig), không cần làm gì.","ar":"…لأن العقد المشوب بالخداع باطل دون أن يضطر الشخص إلى فعل شيء."},"Gitarrist der Band":{"tr":"Grubun gitaristi","vi":"Tay guitar của ban nhạc","ar":"عازف الغيتار في الفرقة"},"Der Gitarrist Mo lacht am Stand: „Für eine Cola verkauf ich dir meine Gitarre!“ Alle lachen mit. Lina will die Gitarre am Abend abholen.":{"tr":"Gitarist Mo standda gülerek: „Bir kola karşılığında gitarımı sana satarım!“ diyor. Herkes birlikte gülüyor. Lina gitarı akşam almak istiyor.","vi":"Tay guitar Mo cười ở gian hàng: „Một lon cola thì tôi bán cho bạn cây guitar của tôi!“ Mọi người cùng cười. Lina muốn đến lấy cây guitar vào buổi tối.","ar":"يضحك عازف الغيتار مو عند الكشك: „مقابل مشروب كولا أبيعك غيتاري!“ الجميع يضحكون معه. تريد لينا أن تأخذ الغيتار في المساء."},"Was gilt?":{"tr":"Ne geçerlidir?","vi":"Điều gì đúng?","ar":"ما الذي يسري؟"},"Scherzgeschäft":{"tr":"Şaka amaçlı işlem (Scherzgeschäft)","vi":"Giao dịch đùa (Scherzgeschäft)","ar":"صفقة المزاح"},"Beide wissen, dass es nicht ernst gemeint ist. Das Rechtsgeschäft ist nichtig.":{"tr":"İkisi de bunun ciddi olmadığını biliyor. Hukuki işlem geçersizdir (nichtig).","vi":"Cả hai đều biết đó không phải nói nghiêm túc. Giao dịch pháp lý đó vô hiệu (nichtig).","ar":"كلاهما يعلم أن الأمر غير جدّي. التصرف القانوني باطل."},"Tom sagt im Spaß zu Kollegen: „Für eine Flasche Wasser gebe ich euch mein Monatsgehalt!“ → nichtig (Scherzgeschäft).":{"tr":"Tom şaka olarak iş arkadaşlarına: „Bir şişe su karşılığında size aylık maaşımı veririm!“ diyor → geçersiz (nichtig, şaka amaçlı işlem).","vi":"Tom nói đùa với đồng nghiệp: „Một chai nước đổi lấy lương tháng của tôi!“ → vô hiệu (giao dịch đùa, Scherzgeschäft).","ar":"يقول توم مازحاً لزملائه: „مقابل زجاجة ماء أعطيكم راتبي الشهري!“ → باطل (صفقة مزاح)."},"Kein Vertrag: Das war ein Scherzgeschäft. Beide wussten, dass es nicht ernst gemeint war – es ist nichtig.":{"tr":"Sözleşme yok: Bu bir şaka amaçlı işlemdi (Scherzgeschäft). İkisi de bunun ciddi olmadığını biliyordu – geçersizdir (nichtig).","vi":"Không có hợp đồng: đó là giao dịch đùa (Scherzgeschäft). Cả hai đều biết đó không phải nói nghiêm túc – giao dịch vô hiệu (nichtig).","ar":"لا يوجد عقد: كانت هذه صفقة مزاح (Scherzgeschäft). كلاهما كان يعلم أن الأمر غير جدّي – وهي باطلة."},"Haha, genau! Die Cola nehm ich aber trotzdem.":{"tr":"Haha, aynen! Ama kolayı yine de alırım.","vi":"Ha ha, đúng rồi! Nhưng tôi vẫn lấy lon cola nhé.","ar":"هاها، بالضبط! لكنني سآخذ الكولا مع ذلك."},"Ein Scherzgeschäft ist nichtig, wenn beide wissen, dass es nicht ernst gemeint ist.":{"tr":"İkisi de ciddi olmadığını biliyorsa şaka amaçlı işlem geçersizdir (nichtig).","vi":"Giao dịch đùa là vô hiệu (nichtig) khi cả hai đều biết đó không phải nói nghiêm túc.","ar":"صفقة المزاح باطلة إذا كان كلا الطرفين يعلم أن الأمر غير جدّي."},"Mo muss den Vertrag erst anfechten.":{"tr":"Mo sözleşmeyi önce iptal etmek zorundadır.","vi":"Mo phải hủy bỏ hợp đồng trước đã.","ar":"على مو أن يُبطل العقد أولاً."},"Anfechten? Für einen Witz?":{"tr":"İptal mi? Bir şaka için mi?","vi":"Hủy bỏ ư? Vì một trò đùa?","ar":"يُبطل؟ من أجل نكتة؟"},"Bei einem Scherzgeschäft gibt es von Anfang an keinen Vertrag. Man muss nichts anfechten.":{"tr":"Şaka amaçlı işlemde baştan hiç sözleşme yoktur. Hiçbir şeyi iptal etmek gerekmez.","vi":"Với giao dịch đùa (Scherzgeschäft), ngay từ đầu không có hợp đồng. Không cần hủy bỏ gì cả.","ar":"في صفقة المزاح لا يوجد عقد من البداية. لا حاجة إلى الإبطال."},"Gültig – gesagt ist gesagt.":{"tr":"Geçerli – söylenen söylenmiştir.","vi":"Có hiệu lực – nói là nói.","ar":"صحيح – ما قيل قد قيل."},"Vergiss es! Das war ein Witz!":{"tr":"Boş ver! Şakaydı!","vi":"Quên đi! Đó chỉ là chuyện đùa!","ar":"انسَ الأمر! كانت نكتة!"},"Ein Scherz ist keine ernsthafte Willenserklärung. Das Geschäft ist nichtig.":{"tr":"Şaka ciddi bir irade beyanı değildir. İşlem geçersizdir (nichtig).","vi":"Một lời đùa không phải là tuyên bố ý chí nghiêm túc. Giao dịch đó vô hiệu (nichtig).","ar":"المزاح ليس تعبيراً جدّياً عن الإرادة. الصفقة باطلة."},"…weil ein Scherzgeschäft nichtig ist, wenn beide wissen, dass es nicht ernst gemeint ist.":{"tr":"…çünkü ikisi de ciddi olmadığını biliyorsa şaka amaçlı işlem geçersizdir (nichtig).","vi":"…vì giao dịch đùa là vô hiệu (nichtig) khi cả hai đều biết đó không phải nói nghiêm túc.","ar":"…لأن صفقة المزاح باطلة إذا كان كلا الطرفين يعلم أن الأمر غير جدّي."},"…weil mündliche Verträge immer nichtig sind.":{"tr":"…çünkü sözlü sözleşmeler her zaman geçersizdir.","vi":"…vì hợp đồng miệng luôn vô hiệu.","ar":"…لأن العقود الشفهية باطلة دائماً."},"…weil Musiker beschränkt geschäftsfähig sind.":{"tr":"…çünkü müzisyenlerin hukuki işlem ehliyeti sınırlıdır.","vi":"…vì nhạc sĩ có năng lực hành vi hạn chế.","ar":"…لأن الموسيقيين ناقصو الأهلية."},"Ein Online-Shop schreibt in die AGB: „Reklamationen nur innerhalb von 3 Tagen nach Lieferung.“ Gilt das gegenüber Privatkunden?":{"tr":"Bir online mağaza AGB'ye (genel işlem koşulları) şunu yazıyor: „Şikâyetler teslimattan sonra yalnızca 3 gün içinde yapılabilir.“ Bu, bireysel müşteriler için geçerli mi?","vi":"Một cửa hàng online ghi trong điều khoản chung (AGB): „Chỉ được khiếu nại trong vòng 3 ngày sau khi giao hàng.“ Điều này có áp dụng với khách hàng cá nhân không?","ar":"يكتب متجر إلكتروني في الشروط العامة (AGB): „الشكاوى فقط خلال 3 أيام بعد التسليم.“ هل يسري هذا على الزبائن الأفراد؟"},"Nein – die Klausel benachteiligt Kunden unangemessen. Die gesetzliche Gewährleistung beträgt 2 Jahre.":{"tr":"Hayır – bu madde müşterileri haksız yere zor durumda bırakır. Yasal garanti süresi (Gewährleistung) 2 yıldır.","vi":"Không – điều khoản này gây bất lợi quá mức cho khách hàng. Bảo hành theo luật (Gewährleistung) là 2 năm.","ar":"لا – هذا البند يضر بالزبائن بشكل غير معقول. الضمان القانوني (Gewährleistung) مدته سنتان (2 سنة)."},"Ja – AGB gelten immer.":{"tr":"Evet – AGB her zaman geçerlidir.","vi":"Có – điều khoản chung (AGB) luôn có hiệu lực.","ar":"نعم – الشروط العامة تسري دائماً."},"Ja – wenn der Shop die Klausel fett druckt.":{"tr":"Evet – mağaza maddeyi kalın yazarsa.","vi":"Có – nếu cửa hàng in đậm điều khoản đó.","ar":"نعم – إذا طبع المتجر البند بخط عريض."},"Was ist der Unterschied zwischen nichtig und anfechtbar?":{"tr":"Geçersiz (nichtig) ile iptal edilebilir (anfechtbar) arasındaki fark nedir?","vi":"Sự khác nhau giữa vô hiệu (nichtig) và có thể bị hủy bỏ (anfechtbar) là gì?","ar":"ما الفرق بين الباطل (nichtig) والقابل للإبطال (anfechtbar)؟"},"Nichtig: von Anfang an kein Vertrag. Anfechtbar: Der Vertrag gilt, bis jemand aktiv anficht.":{"tr":"Geçersiz: baştan hiç sözleşme yok. İptal edilebilir: Biri aktif olarak iptal edene kadar sözleşme geçerlidir.","vi":"Vô hiệu: ngay từ đầu không có hợp đồng. Có thể bị hủy bỏ: hợp đồng có hiệu lực cho đến khi có người chủ động hủy bỏ.","ar":"باطل: لا يوجد عقد من البداية. قابل للإبطال: العقد يسري حتى يُبطله أحدهم بنفسه."},"Nichtig heißt: Man muss innerhalb eines Jahres anfechten.":{"tr":"Geçersiz demek: Bir yıl içinde iptal etmek gerekir.","vi":"Vô hiệu nghĩa là: phải hủy bỏ trong vòng một năm.","ar":"باطل يعني: يجب الإبطال خلال سنة واحدة."},"Anfechtbar heißt: Der Vertrag hat nie gegolten.":{"tr":"İptal edilebilir demek: Sözleşme hiç geçerli olmamıştır.","vi":"Có thể bị hủy bỏ nghĩa là: hợp đồng chưa từng có hiệu lực.","ar":"قابل للإبطال يعني: العقد لم يسرِ قط."},"Der letzte Abend beginnt":{"tr":"Son akşam başlıyor","vi":"Buổi tối cuối cùng bắt đầu","ar":"تبدأ الأمسية الأخيرة"},"Der Kaufvertrag":{"tr":"Satış sözleşmesi (Kaufvertrag)","vi":"Hợp đồng mua bán (Kaufvertrag)","ar":"عقد البيع"},"Sonntag, 17 Uhr. Der letzte Abend beginnt, am Stand ist richtig viel los. Nach drei Tagen sind die Preisschilder ziemlich durcheinander – und Jana braucht Nachschub.":{"tr":"Pazar, saat 17. Son akşam başlıyor, standda gerçekten çok yoğunluk var. Üç gün sonra fiyat etiketleri epey karışmış – ve Jana'nın yeni mal alması gerekiyor.","vi":"Chủ nhật, 17 giờ. Buổi tối cuối cùng bắt đầu, gian hàng rất đông khách. Sau ba ngày, các bảng giá khá lộn xộn – và Jana cần hàng bổ sung.","ar":"الأحد، الساعة 17. تبدأ الأمسية الأخيرة، والكشك مزدحم جداً. بعد ثلاثة أيام أصبحت بطاقات الأسعار مبعثرة – وياناه تحتاج إلى بضاعة إضافية."},"der Antrag":{"tr":"teklif","vi":"đề nghị (Antrag)","ar":"الإيجاب"},"die Annahme":{"tr":"kabul","vi":"chấp nhận (Annahme)","ar":"القبول"},"das Angebot":{"tr":"satış teklifi","vi":"báo giá (Angebot)","ar":"العرض"},"die Bestellung":{"tr":"sipariş","vi":"đơn đặt hàng","ar":"الطلب (أمر الشراء)"},"die Auftragsbestätigung":{"tr":"sipariş onayı","vi":"xác nhận đơn hàng","ar":"تأكيد الطلب"},"verbindlich":{"tr":"bağlayıcı","vi":"có tính ràng buộc","ar":"مُلزِم"},"unverbindlich":{"tr":"bağlayıcı olmayan","vi":"không ràng buộc","ar":"غير مُلزِم"},"die Freizeichnungsklausel":{"tr":"bağlayıcılığı kaldıran madde","vi":"điều khoản miễn ràng buộc (Freizeichnungsklausel)","ar":"بند عدم الالتزام بالعرض"},"die Anpreisung":{"tr":"övme (reklam amaçlı tanıtım)","vi":"quảng cáo giới thiệu (Anpreisung)","ar":"الدعاية (الترويج)"},"die Pflicht":{"tr":"yükümlülük","vi":"nghĩa vụ","ar":"الواجب"},"der Verbrauchsgüterkauf":{"tr":"tüketici satışı","vi":"mua bán hàng tiêu dùng (Verbrauchsgüterkauf)","ar":"بيع سلع الاستهلاك للمستهلك"},"der Handelskauf":{"tr":"ticari satış","vi":"mua bán thương mại (Handelskauf)","ar":"البيع التجاري"},"Gast mit Powerbank":{"tr":"Powerbank'li misafir","vi":"Khách có sạc dự phòng","ar":"زبون مع شاحن متنقل"},"Am Stand steht auf dem Schild: Powerbank 19,99 €. Die Kasse zeigt 29,99 €. Herr Yilmaz verlangt den Preis vom Schild.":{"tr":"Standdaki etikette şu yazıyor: Powerbank 19,99 €. Kasa 29,99 € gösteriyor. Bay Yilmaz etiketteki fiyatı istiyor.","vi":"Ở gian hàng, trên bảng ghi: Sạc dự phòng 19,99 €. Máy tính tiền hiển thị 29,99 €. Ông Yilmaz đòi giá trên bảng.","ar":"على اللافتة في الكشك مكتوب: شاحن متنقل (Powerbank) 19,99 €. الصندوق يُظهر 29,99 €. يطالب السيد يلماز بالسعر الموجود على اللافتة."},"Anpreisung (kein Angebot)":{"tr":"Övme (Anpreisung, teklif değil)","vi":"Quảng cáo giới thiệu (Anpreisung, không phải báo giá)","ar":"دعاية (وليست عرضاً)"},"Schaufenster, Regal, Prospekt, Onlineshop richten sich an alle. Sie sind eine Aufforderung, ein Angebot abzugeben.":{"tr":"Vitrin, raf, broşür, online mağaza herkese yöneliktir. Bunlar bir teklif vermeye davettir.","vi":"Tủ kính, kệ hàng, tờ rơi, cửa hàng online hướng đến mọi người. Đó là lời mời đưa ra một đề nghị (Angebot).","ar":"واجهة المحل والرف والنشرة والمتجر الإلكتروني موجّهة للجميع. إنها دعوة لتقديم عرض."},"Sie können die Forderung ablehnen, da eine im Schaufenster ausgestellte Ware rechtlich ein unverbindliches Angebot ist.":{"tr":"Talebi reddedebilirsiniz, çünkü vitrinde sergilenen mal hukuken bağlayıcı olmayan bir tekliftir.","vi":"Bạn có thể từ chối yêu cầu đó, vì về mặt pháp lý hàng trưng bày trong tủ kính là một báo giá không ràng buộc.","ar":"يمكنكم رفض المطالبة، لأن البضاعة المعروضة في واجهة المحل هي من الناحية القانونية عرض غير مُلزِم."},"„Danke für den Hinweis! Dann bekommen Sie die Powerbank zum Preis auf dem Schild. Ich lasse das Schild gleich korrigieren.“":{"tr":"„İşaret ettiğiniz için teşekkürler! O zaman powerbank'i etiketteki fiyata alırsınız. Etiketi hemen düzelttireceğim.“","vi":"„Cảm ơn ông đã nhắc! Vậy ông sẽ được mua sạc dự phòng với giá trên bảng. Tôi sẽ cho sửa bảng ngay.“","ar":"„شكراً على التنبيه! إذن ستحصل على الشاحن بالسعر الموجود على اللافتة. سأصحّح اللافتة حالاً.“"},"Das ist fair. Danke!":{"tr":"Bu adil. Teşekkürler!","vi":"Thế là công bằng. Cảm ơn!","ar":"هذا عادل. شكراً!"},"Rechtlich ist das Schild kein Angebot – der Kunde macht an der Kasse den Antrag. Kundenorientiert und üblich ist es aber, den ausgezeichneten Preis zu geben.":{"tr":"Hukuken etiket bir teklif değildir – müşteri kasada teklifi (Antrag) yapar. Ancak müşteri odaklı (kundenorientiert) ve alışılmış olan, etiketteki fiyatı vermektir.","vi":"Về mặt pháp lý, bảng giá không phải là báo giá – khách hàng đưa ra đề nghị (Antrag) tại quầy thu ngân. Nhưng hướng đến khách hàng (kundenorientiert) và theo thông lệ thì nên bán theo giá đã niêm yết.","ar":"من الناحية القانونية اللافتة ليست عرضاً – الزبون يقدّم الإيجاب (Antrag) عند الصندوق. لكن من المعتاد، وبما يخدم العميل (kundenorientiert)، إعطاء السعر المكتوب."},"„Das Schild ist kein verbindliches Angebot. Sie zahlen 29,99 €.“":{"tr":"„Etiket bağlayıcı bir teklif değil. 29,99 € ödersiniz.“","vi":"„Bảng giá không phải là báo giá ràng buộc. Ông trả 29,99 €.“","ar":"„اللافتة ليست عرضاً مُلزِماً. ستدفع 29,99 €.“"},"Rechtlich vielleicht. Aber nett ist das nicht.":{"tr":"Hukuken belki. Ama bu hoş değil.","vi":"Có thể đúng về pháp lý. Nhưng như vậy không tử tế.","ar":"ربما قانونياً. لكن هذا ليس لطيفاً."},"Rechtlich richtig: Ausgestellte Ware ist kein verbindliches Angebot. Kundenorientiert wäre es, den Schildpreis zu geben.":{"tr":"Hukuken doğru: Sergilenen mal bağlayıcı bir teklif değildir. Müşteri odaklı (kundenorientiert) olan, etiket fiyatını vermektir.","vi":"Đúng về pháp lý: hàng trưng bày không phải là báo giá ràng buộc. Hướng đến khách hàng (kundenorientiert) thì nên bán theo giá trên bảng.","ar":"صحيح قانونياً: البضاعة المعروضة ليست عرضاً مُلزِماً. لكن الأفضل للعميل إعطاء سعر اللافتة."},"„Rechtlich muss ich Ihnen den Preis auf dem Schild geben.“":{"tr":"„Hukuken size etiketteki fiyatı vermek zorundayım.“","vi":"„Về mặt pháp lý, tôi phải bán cho ông giá trên bảng.“","ar":"„من الناحية القانونية يجب أن أعطيك السعر الموجود على اللافتة.“"},"Na dann – her damit.":{"tr":"O zaman – verin bakalım.","vi":"Vậy thì đưa đây.","ar":"حسناً إذن – هاتِ الشاحن."},"Die Begründung ist falsch: Ware im Regal oder Schaufenster ist kein verbindliches Angebot.":{"tr":"Gerekçe yanlış: Raftaki veya vitrindeki mal bağlayıcı bir teklif değildir.","vi":"Lý do sai: hàng trên kệ hoặc trong tủ kính không phải là báo giá ràng buộc.","ar":"التعليل خاطئ: البضاعة على الرف أو في الواجهة ليست عرضاً مُلزِماً."},"…weil die Ware am Stand kein verbindliches Angebot ist – den Schildpreis gibt man aus Kundenorientierung.":{"tr":"…çünkü standdaki mal bağlayıcı bir teklif değildir – etiket fiyatı müşteri odaklılık (Kundenorientierung) nedeniyle verilir.","vi":"…vì hàng ở gian hàng không phải là báo giá ràng buộc – bán theo giá trên bảng là vì hướng đến khách hàng (Kundenorientierung).","ar":"…لأن البضاعة في الكشك ليست عرضاً مُلزِماً – ويُعطى سعر اللافتة مراعاةً للعميل."},"…weil jedes Preisschild ein verbindliches Angebot ist.":{"tr":"…çünkü her fiyat etiketi bağlayıcı bir tekliftir.","vi":"…vì mọi bảng giá đều là báo giá ràng buộc.","ar":"…لأن كل بطاقة سعر هي عرض مُلزِم."},"…weil der Kunde nach drei Tagen ein Recht auf den Schildpreis hat.":{"tr":"…çünkü müşterinin üç gün sonra etiket fiyatı hakkı vardır.","vi":"…vì sau ba ngày khách hàng có quyền được mua theo giá trên bảng.","ar":"…لأن للزبون الحق في سعر اللافتة بعد ثلاثة أيام."},"Gast mit leerem Handy-Akku":{"tr":"Telefon bataryası bitmiş misafir","vi":"Khách có điện thoại hết pin","ar":"زبون ببطارية هاتف فارغة"},"Ben legt ein Festival-Cap auf den Tresen. Du scannst es: „Das macht 18 Euro.“ Da merkt er: Handy-Akku leer, kein Bargeld. „Dann ist ja noch nichts gekauft.“":{"tr":"Ben tezgâha bir festival şapkası koyuyor. Sen okutuyorsun: „18 Euro tutuyor.“ O sırada fark ediyor: Telefonunun bataryası bitmiş, nakit parası yok. „O zaman henüz bir şey satın alınmadı.“","vi":"Ben đặt một chiếc mũ lưỡi trai của lễ hội lên quầy. Bạn quét mã: „Tổng cộng 18 euro.“ Lúc đó anh nhận ra: điện thoại hết pin, không có tiền mặt. „Vậy là chưa mua gì cả.“","ar":"يضع بن قبعة المهرجان على الطاولة. تمسحها بالماسح: „المبلغ 18 يورو.“ فينتبه: بطارية الهاتف فارغة ولا يملك نقداً. „إذن لم يتم شراء شيء بعد.“"},"Was stimmt?":{"tr":"Hangisi doğru?","vi":"Điều gì đúng?","ar":"ما الصحيح؟"},"Antrag und Annahme an der Kasse":{"tr":"Kasada teklif (Antrag) ve kabul (Annahme)","vi":"Đề nghị (Antrag) và chấp nhận (Annahme) tại quầy thu ngân","ar":"الإيجاب والقبول عند الصندوق"},"Antrag: Kunde legt die Ware aufs Band. Annahme: Kassenkraft scannt und nennt den Preis.":{"tr":"Teklif: Müşteri malı banda koyar. Kabul: Kasiyer okutur ve fiyatı söyler.","vi":"Đề nghị: khách đặt hàng lên băng chuyền. Chấp nhận: nhân viên thu ngân quét mã và nói giá.","ar":"الإيجاب: الزبون يضع البضاعة على السير. القبول: موظفة الصندوق تمسح البضاعة وتذكر السعر."},"Antrag: Der Kunde legt die Ware auf das Transportband an der Kasse. Annahme: Die Kassiererin scannt die Artikel und nennt den Kaufpreis.":{"tr":"Teklif: Müşteri malı kasadaki banda koyar. Kabul: Kasiyer ürünleri okutur ve satış fiyatını söyler.","vi":"Đề nghị (Antrag): khách đặt hàng lên băng chuyền ở quầy thu ngân. Chấp nhận (Annahme): nhân viên thu ngân quét hàng và nói giá mua.","ar":"الإيجاب (Antrag): يضع الزبون البضاعة على السير الناقل عند الصندوق. القبول (Annahme): تمسح الكاشيرة المنتجات وتذكر سعر البيع."},"„Doch, der Kaufvertrag ist schon da: Sie haben das Cap hingelegt, ich habe es gescannt. Ich lege es Ihnen zurück, bis Sie Geld holen.“":{"tr":"„Hayır, satış sözleşmesi (Kaufvertrag) zaten oluştu: Siz şapkayı koydunuz, ben okuttum. Siz para getirene kadar şapkayı ayırırım.“","vi":"„Có chứ, hợp đồng mua bán đã có rồi: ông đã đặt chiếc mũ xuống, tôi đã quét mã. Tôi sẽ giữ lại cho ông cho đến khi ông lấy được tiền.“","ar":"„بل عقد البيع موجود بالفعل: لقد وضعت القبعة وأنا مسحتها. سأحجزها لك حتى تحضر المال.“"},"Ach so. Okay, ich bin in 10 Minuten zurück.":{"tr":"Ha, öyle mi. Tamam, 10 dakika içinde dönerim.","vi":"À ra vậy. Được, 10 phút nữa tôi quay lại.","ar":"آها. حسناً، سأعود بعد 10 دقائق."},"Ware hinlegen = Antrag. Scannen und Preis nennen = Annahme. Zwei übereinstimmende Willenserklärungen = Kaufvertrag.":{"tr":"Malı koymak = teklif. Okutmak ve fiyatı söylemek = kabul. İki uyuşan irade beyanı = satış sözleşmesi.","vi":"Đặt hàng xuống = đề nghị (Antrag). Quét mã và nói giá = chấp nhận (Annahme). Hai tuyên bố ý chí khớp nhau = hợp đồng mua bán.","ar":"وضع البضاعة = إيجاب. المسح وذكر السعر = قبول. تعبيران متطابقان عن الإرادة = عقد بيع."},"„Stimmt, ein Kaufvertrag entsteht erst beim Bezahlen.“":{"tr":"„Doğru, satış sözleşmesi ancak ödeme sırasında oluşur.“","vi":"„Đúng, hợp đồng mua bán chỉ hình thành khi thanh toán.“","ar":"„صحيح، عقد البيع ينشأ فقط عند الدفع.“"},"Gut, dann tschüss!":{"tr":"İyi, o zaman hoşça kal!","vi":"Vậy thì thôi, tạm biệt!","ar":"جيد، إذن وداعاً!"},"Beim Bezahlen wird der Vertrag erfüllt. Zustande kommt er schon beim Scannen.":{"tr":"Ödeme sırasında sözleşme yerine getirilir. Sözleşme ise okutma anında oluşur.","vi":"Hợp đồng được thực hiện khi thanh toán. Nhưng hợp đồng đã hình thành ngay khi quét mã.","ar":"عند الدفع يُنفَّذ العقد. أما نشوؤه فيكون عند المسح."},"„Der Vertrag war schon da, als Sie das Cap vom Ständer genommen haben.“":{"tr":"„Sözleşme, şapkayı askıdan aldığınız anda zaten oluştu.“","vi":"„Hợp đồng đã có từ lúc ông lấy chiếc mũ khỏi giá.“","ar":"„كان العقد موجوداً منذ أخذتَ القبعة من الحامل.“"},"Echt? Schon da?":{"tr":"Gerçekten mi? Zaten oluştu mu?","vi":"Thật à? Đã có rồi sao?","ar":"حقاً؟ موجود منذ ذلك الحين؟"},"Das Nehmen aus dem Regal ist noch kein Antrag. Antrag ist das Hinlegen an der Kasse.":{"tr":"Raftan almak henüz teklif değildir. Teklif, malı kasada koymaktır.","vi":"Lấy hàng khỏi kệ chưa phải là đề nghị (Antrag). Đề nghị là việc đặt hàng xuống ở quầy thu ngân.","ar":"أخذ البضاعة من الرف ليس إيجاباً بعد. الإيجاب هو وضعها عند الصندوق."},"…weil zwei übereinstimmende Willenserklärungen vorliegen: hinlegen = Antrag, scannen = Annahme.":{"tr":"…çünkü iki uyuşan irade beyanı var: koymak = teklif, okutmak = kabul.","vi":"…vì có hai tuyên bố ý chí khớp nhau: đặt hàng xuống = đề nghị, quét mã = chấp nhận.","ar":"…لأنه يوجد تعبيران متطابقان عن الإرادة: وضع البضاعة = إيجاب، المسح = قبول."},"…weil ein Kaufvertrag erst mit der Bezahlung entsteht.":{"tr":"…çünkü satış sözleşmesi ancak ödeme ile oluşur.","vi":"…vì hợp đồng mua bán chỉ hình thành khi thanh toán.","ar":"…لأن عقد البيع لا ينشأ إلا بالدفع."},"…weil das Herausnehmen aus dem Regal schon der Antrag ist.":{"tr":"…çünkü raftan almak zaten tekliftir.","vi":"…vì việc lấy hàng khỏi kệ đã là đề nghị rồi.","ar":"…لأن أخذ البضاعة من الرف هو بحد ذاته الإيجاب."},"bestellt Regencapes nach":{"tr":"yağmur pelerini yeniden sipariş ediyor","vi":"đặt thêm áo mưa choàng","ar":"يطلب معاطف مطر إضافية"},"Jana bestellt Regencapes: 10.08. Anfrage · 11.08. Angebot „solange der Vorrat reicht“ · 12.08. Bestellung · 13.08. Auftragsbestätigung · 14.08. Lieferung · 30.08. Zahlung.":{"tr":"Jana yağmur pelerini sipariş ediyor: 10.08. Talep · 11.08. Teklif „stok bitene kadar“ · 12.08. Sipariş · 13.08. Sipariş onayı · 14.08. Teslimat · 30.08. Ödeme.","vi":"Jana đặt áo mưa choàng: 10.08. Hỏi giá · 11.08. Báo giá „còn hàng là còn bán“ · 12.08. Đơn đặt hàng · 13.08. Xác nhận đơn hàng · 14.08. Giao hàng · 30.08. Thanh toán.","ar":"تطلب ياناه معاطف مطر: 10.08. استفسار · 11.08. عرض „حتى نفاد الكمية“ · 12.08. طلب · 13.08. تأكيد الطلب · 14.08. تسليم · 30.08. دفع."},"An welchem Tag ist der Kaufvertrag zustande gekommen?":{"tr":"Satış sözleşmesi hangi gün oluştu?","vi":"Hợp đồng mua bán hình thành vào ngày nào?","ar":"في أي يوم نشأ عقد البيع؟"},"Freizeichnungsklausel":{"tr":"Bağlayıcılığı kaldıran madde (Freizeichnungsklausel)","vi":"Điều khoản miễn ràng buộc (Freizeichnungsklausel)","ar":"بند عدم الالتزام بالعرض (Freizeichnungsklausel)"},"„freibleibend“, „unverbindlich“, „solange der Vorrat reicht“: Das Angebot ist unverbindlich. Erst die Auftragsbestätigung macht den Vertrag.":{"tr":"„freibleibend“ (değişikliğe açık), „unverbindlich“ (bağlayıcı değil), „solange der Vorrat reicht“ (stok bitene kadar): Teklif bağlayıcı değildir. Sözleşmeyi ancak sipariş onayı (Auftragsbestätigung) oluşturur.","vi":"„freibleibend“ (không ràng buộc), „unverbindlich“ (không ràng buộc), „solange der Vorrat reicht“ (còn hàng là còn bán): báo giá không có tính ràng buộc. Chỉ khi có xác nhận đơn hàng thì mới có hợp đồng.","ar":"„freibleibend“ (غير ملزم)، „unverbindlich“ (غير مُلزِم)، „solange der Vorrat reicht“ (حتى نفاد الكمية): العرض غير مُلزِم. فقط تأكيد الطلب (Auftragsbestätigung) ينشئ العقد."},"Datumsaufgabe: 1. Antrag suchen (ist das Angebot verbindlich?). 2. Annahme suchen. 3. Das Datum der Annahme ist der Tag des Kaufvertrags.":{"tr":"Tarih sorusu: 1. Teklifi (Antrag) bul (satış teklifi bağlayıcı mı?). 2. Kabulü (Annahme) bul. 3. Kabulün tarihi, satış sözleşmesinin günüdür.","vi":"Bài tập về ngày tháng: 1. Tìm đề nghị (Antrag) (báo giá có ràng buộc không?). 2. Tìm chấp nhận (Annahme). 3. Ngày chấp nhận là ngày của hợp đồng mua bán.","ar":"مسألة تاريخ: 1. ابحث عن الإيجاب (هل العرض مُلزِم؟). 2. ابحث عن القبول. 3. تاريخ القبول هو يوم عقد البيع."},"Am 13.08. – mit der Auftragsbestätigung.":{"tr":"13.08. günü – sipariş onayı ile.","vi":"Ngày 13.08. – với xác nhận đơn hàng.","ar":"في 13.08. – مع تأكيد الطلب."},"Richtig. Das Angebot war ja unverbindlich.":{"tr":"Doğru. Çünkü satış teklifi bağlayıcı değildi.","vi":"Đúng. Vì báo giá không có tính ràng buộc.","ar":"صحيح. فالعرض كان غير مُلزِم."},"„Solange der Vorrat reicht“ macht das Angebot unverbindlich. Die Bestellung ist der Antrag, die Auftragsbestätigung die Annahme.":{"tr":"„Stok bitene kadar“ satış teklifini bağlayıcı olmaktan çıkarır. Sipariş teklif (Antrag), sipariş onayı ise kabuldür (Annahme).","vi":"„Còn hàng là còn bán“ làm báo giá không ràng buộc. Đơn đặt hàng là đề nghị (Antrag), xác nhận đơn hàng là chấp nhận (Annahme).","ar":"عبارة „حتى نفاد الكمية“ تجعل العرض غير مُلزِم. الطلب هو الإيجاب، وتأكيد الطلب هو القبول."},"Am 12.08. – mit der Bestellung.":{"tr":"12.08. günü – sipariş ile.","vi":"Ngày 12.08. – với đơn đặt hàng.","ar":"في 12.08. – مع الطلب."},"Fast. Aber war das Angebot verbindlich?":{"tr":"Neredeyse. Ama satış teklifi bağlayıcı mıydı?","vi":"Gần đúng. Nhưng báo giá có ràng buộc không?","ar":"تقريباً. لكن هل كان العرض مُلزِماً؟"},"Das wäre richtig bei einem verbindlichen Angebot. „Solange der Vorrat reicht“ ist eine Freizeichnungsklausel.":{"tr":"Bağlayıcı bir satış teklifinde bu doğru olurdu. „Stok bitene kadar“ bir bağlayıcılığı kaldıran maddedir (Freizeichnungsklausel).","vi":"Điều đó sẽ đúng nếu báo giá có tính ràng buộc. „Còn hàng là còn bán“ là một điều khoản miễn ràng buộc (Freizeichnungsklausel).","ar":"هذا يكون صحيحاً مع عرض مُلزِم. أما „حتى نفاد الكمية“ فهي Freizeichnungsklausel (بند عدم الالتزام بالعرض)."},"Am 14.08. – mit der Lieferung.":{"tr":"14.08. günü – teslimat ile.","vi":"Ngày 14.08. – với việc giao hàng.","ar":"في 14.08. – مع التسليم."},"Lieferung? Da war der Vertrag längst da.":{"tr":"Teslimat mı? O zaman sözleşme çoktan oluşmuştu.","vi":"Giao hàng ư? Lúc đó hợp đồng đã có từ lâu rồi.","ar":"التسليم؟ كان العقد موجوداً قبل ذلك بوقت طويل."},"Lieferung und Zahlung sind nie das Datum des Kaufvertrags.":{"tr":"Teslimat ve ödeme hiçbir zaman satış sözleşmesinin tarihi değildir.","vi":"Giao hàng và thanh toán không bao giờ là ngày của hợp đồng mua bán.","ar":"التسليم والدفع ليسا أبداً تاريخ عقد البيع."},"…weil „solange der Vorrat reicht“ das Angebot unverbindlich macht: Bestellung = Antrag, Auftragsbestätigung = Annahme.":{"tr":"…çünkü „stok bitene kadar“ satış teklifini bağlayıcı olmaktan çıkarır: sipariş = teklif (Antrag), sipariş onayı = kabul (Annahme).","vi":"…vì „còn hàng là còn bán“ làm báo giá không ràng buộc: đơn đặt hàng = đề nghị, xác nhận đơn hàng = chấp nhận.","ar":"…لأن „حتى نفاد الكمية“ تجعل العرض غير مُلزِم: الطلب = إيجاب، تأكيد الطلب = قبول."},"…weil ein Kaufvertrag immer mit der Lieferung entsteht.":{"tr":"…çünkü satış sözleşmesi her zaman teslimatla oluşur.","vi":"…vì hợp đồng mua bán luôn hình thành khi giao hàng.","ar":"…لأن عقد البيع ينشأ دائماً مع التسليم."},"…weil die Anfrage schon der Antrag ist.":{"tr":"…çünkü talep (Anfrage) zaten tekliftir.","vi":"…vì việc hỏi giá đã là đề nghị rồi.","ar":"…لأن الاستفسار هو بحد ذاته الإيجاب."},"Der Vertrag mit dem Großhändler steht. Jana fragt: „Was müssen wir als Käufer jetzt noch tun?“":{"tr":"Toptancıyla sözleşme tamam. Jana soruyor: „Alıcı olarak şimdi başka ne yapmamız gerekiyor?“","vi":"Hợp đồng với nhà bán buôn đã xong. Jana hỏi: „Với tư cách người mua, bây giờ chúng ta còn phải làm gì nữa?“","ar":"العقد مع تاجر الجملة تم. تسأل ياناه: „ماذا يجب علينا أن نفعل بعد كمشترين؟“"},"Was sind die Pflichten des Käufers?":{"tr":"Alıcının yükümlülükleri nelerdir?","vi":"Nghĩa vụ của người mua là gì?","ar":"ما هي واجبات المشتري؟"},"Pflichten aus dem Kaufvertrag":{"tr":"Satış sözleşmesinden doğan yükümlülükler","vi":"Nghĩa vụ theo hợp đồng mua bán","ar":"الواجبات الناشئة عن عقد البيع"},"Verkäufer: Ware mangelfrei und rechtzeitig übergeben, Eigentum verschaffen, Kaufpreis annehmen. Käufer: Kaufpreis bezahlen, Ware abnehmen.":{"tr":"Satıcı: Malı kusursuz ve zamanında teslim etmek, mülkiyeti geçirmek, satış bedelini kabul etmek. Alıcı: Satış bedelini ödemek, malı teslim almak.","vi":"Người bán: giao hàng không có lỗi và đúng hạn, chuyển quyền sở hữu, nhận tiền mua hàng. Người mua: trả tiền mua hàng, nhận hàng.","ar":"البائع: تسليم البضاعة خالية من العيوب وفي الوقت المناسب، ونقل الملكية، وقبول الثمن. المشتري: دفع الثمن (Kaufpreis) واستلام البضاعة."},"Pflichten des Käufers: den Kaufpreis bezahlen, die Ware abnehmen.":{"tr":"Alıcının yükümlülükleri: satış bedelini ödemek, malı teslim almak.","vi":"Nghĩa vụ của người mua: trả tiền mua hàng, nhận hàng.","ar":"واجبات المشتري: دفع الثمن واستلام البضاعة."},"Die Ware abnehmen und den Kaufpreis bezahlen.":{"tr":"Malı teslim almak ve satış bedelini ödemek.","vi":"Nhận hàng và trả tiền mua hàng.","ar":"استلام البضاعة ودفع الثمن."},"Genau. Und der Großhändler liefert mangelfrei.":{"tr":"Aynen. Toptancı da kusursuz teslim eder.","vi":"Chính xác. Và nhà bán buôn giao hàng không có lỗi.","ar":"بالضبط. وتاجر الجملة يسلّم بضاعة خالية من العيوب."},"Der Käufer muss den Kaufpreis bezahlen und die Ware abnehmen.":{"tr":"Alıcı satış bedelini ödemek ve malı teslim almak zorundadır.","vi":"Người mua phải trả tiền mua hàng và nhận hàng.","ar":"على المشتري أن يدفع الثمن وأن يستلم البضاعة."},"Nur bezahlen. Abnehmen muss man nichts.":{"tr":"Sadece ödemek. Teslim almak gerekmez.","vi":"Chỉ phải trả tiền. Không phải nhận hàng.","ar":"فقط الدفع. لا يجب استلام شيء."},"Und wer nimmt den Lkw in Empfang?":{"tr":"Peki kamyonu kim karşılayacak?","vi":"Vậy ai sẽ nhận chiếc xe tải?","ar":"ومن سيستقبل الشاحنة؟"},"Bezahlen ist richtig. Die zweite Pflicht ist: die Ware abnehmen.":{"tr":"Ödemek doğru. İkinci yükümlülük: malı teslim almak.","vi":"Trả tiền là đúng. Nghĩa vụ thứ hai là: nhận hàng.","ar":"الدفع صحيح. والواجب الثاني هو: استلام البضاعة."},"Die Ware mangelfrei und rechtzeitig übergeben.":{"tr":"Malı kusursuz ve zamanında teslim etmek.","vi":"Giao hàng không có lỗi và đúng hạn.","ar":"تسليم البضاعة خالية من العيوب وفي الوقت المناسب."},"Das ist doch Sache des Großhändlers!":{"tr":"Bu toptancının işi değil mi!","vi":"Đó là việc của nhà bán buôn mà!","ar":"هذا شأن تاجر الجملة!"},"Das ist eine Pflicht des Verkäufers, nicht des Käufers.":{"tr":"Bu satıcının yükümlülüğüdür, alıcının değil.","vi":"Đó là nghĩa vụ của người bán, không phải của người mua.","ar":"هذا واجب البائع، وليس المشتري."},"…weil der Käufer zwei Pflichten hat: Kaufpreis bezahlen und Ware abnehmen.":{"tr":"…çünkü alıcının iki yükümlülüğü vardır: satış bedelini ödemek ve malı teslim almak.","vi":"…vì người mua có hai nghĩa vụ: trả tiền mua hàng và nhận hàng.","ar":"…لأن على المشتري واجبين: دفع الثمن واستلام البضاعة."},"…weil der Käufer dem Verkäufer das Eigentum verschaffen muss.":{"tr":"…çünkü alıcı, satıcıya mülkiyeti geçirmek zorundadır.","vi":"…vì người mua phải chuyển quyền sở hữu cho người bán.","ar":"…لأن على المشتري أن ينقل الملكية إلى البائع."},"…weil der Käufer die Ware rechtzeitig übergeben muss.":{"tr":"…çünkü alıcı malı zamanında teslim etmek zorundadır.","vi":"…vì người mua phải giao hàng đúng hạn.","ar":"…لأن على المشتري تسليم البضاعة في الوقت المناسب."},"kauft ein Regencape":{"tr":"yağmur pelerini satın alıyor","vi":"mua một chiếc áo mưa choàng","ar":"تشتري معطف مطر"},"Frau Nowak, eine Rentnerin, kauft bei euch ein Regencape. Lina fragt: „Was ist das eigentlich für ein Kaufvertrag?“":{"tr":"Emekli Bayan Nowak sizden bir yağmur pelerini satın alıyor. Lina soruyor: „Bu aslında nasıl bir satış sözleşmesi?“","vi":"Bà Nowak, một người về hưu, mua một chiếc áo mưa choàng ở chỗ các bạn. Lina hỏi: „Thực ra đây là loại hợp đồng mua bán nào vậy?“","ar":"السيدة نوفاك، وهي متقاعدة، تشتري منكم معطف مطر. تسأل لينا: „أي نوع من عقود البيع هذا في الواقع؟“"},"Arten des Kaufvertrags":{"tr":"Satış sözleşmesi türleri","vi":"Các loại hợp đồng mua bán","ar":"أنواع عقد البيع"},"Bürgerlicher Kauf: privat ↔ privat. Einseitiger Handelskauf: Unternehmen → Privatperson. Zweiseitiger Handelskauf: Unternehmen ↔ Unter
