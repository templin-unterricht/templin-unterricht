026 · 16:42","vi":"Fr 14.08.2026 · 16:42 Uhr","ar":"الجمعة 14.08.2026 · الساعة 16:42"},"NORDLICHT MARKT · Pop-up-Store Deichbeat-Festival, Stand 14 · Nordholz":{"tr":"NORDLICHT MARKT · Deichbeat festivali pop-up mağazası, Stand 14 · Nordholz","vi":"NORDLICHT MARKT · Pop-up-Store Deichbeat-Festival, Stand 14 · Nordholz","ar":"NORDLICHT MARKT · متجر مؤقت (Pop-up-Store) في مهرجان Deichbeat، الكشك 14 · Nordholz"},"Sonnencreme 50 ml 8,99 € A":{"tr":"Güneş kremi 50 ml 8,99 € A","vi":"Sonnencreme 50 ml 8,99 € A","ar":"كريم واقي من الشمس 50 ml 8,99 € A"},"Brezel":{"tr":"Pretzel","vi":"Bánh quy xoắn (Brezel)","ar":"بريتزل"},"2 Stk × 2,20 €":{"tr":"2 adet × 2,20 €","vi":"2 Stk × 2,20 €","ar":"2 قطعة × 2,20 €"},"4,40 € B":{"tr":"4,40 € B","vi":"4,40 € B","ar":"4,40 € B"},"SUMME 13,39 €":{"tr":"TOPLAM 13,39 €","vi":"SUMME 13,39 €","ar":"المجموع 13,39 €"},"Bar gegeben 20,00 €":{"tr":"Nakit verilen 20,00 €","vi":"Bar gegeben 20,00 €","ar":"المدفوع نقداً 20,00 €"},"Rückgeld 6,61 €":{"tr":"Para üstü 6,61 €","vi":"Rückgeld 6,61 €","ar":"الباقي 6,61 €"},"A 19 % netto 7,55 USt 1,44 B 7 % netto 4,11 USt 0,29":{"tr":"A 19 % net 7,55 KDV 1,44 B 7 % net 4,11 KDV 0,29","vi":"A 19 % netto 7,55 USt 1,44 B 7 % netto 4,11 USt 0,29","ar":"A 19 % صافي 7,55 ضريبة 1,44 B 7 % صافي 4,11 ضريبة 0,29"},"Bon 0417 · Kasse 1 · Lina":{"tr":"Fiş 0417 · Kasa 1 · Lina","vi":"Bon 0417 · Kasse 1 · Lina","ar":"إيصال 0417 · صندوق الدفع 1 · Lina"},"TSE-Transaktion 88231 · Signatur 7F3A…":{"tr":"TSE işlemi 88231 · İmza 7F3A…","vi":"TSE-Transaktion 88231 · Signatur 7F3A…","ar":"معاملة TSE 88231 · التوقيع 7F3A…"},"Junger Mann":{"tr":"Genç adam","vi":"Chàng trai trẻ","ar":"شاب"},"Junge":{"tr":"Oğlan çocuğu","vi":"Cậu bé","ar":"ولد"},"Zwei Mädchen":{"tr":"İki kız","vi":"Hai cô bé","ar":"فتاتان"},"Du selbst":{"tr":"Sen kendin","vi":"Chính bạn","ar":"أنت نفسك"},"Scannerkasse (POS-System) Elektronische Kasse, die mit dem Warenwirtschaftssystem verbunden ist. POS = Point of Sale = Ort des Verkaufs.":{"tr":"Barkod okuyuculu kasa (POS sistemi): Mal yönetim sistemine bağlı elektronik kasa. POS = Point of Sale = satış noktası.","vi":"Máy tính tiền có máy quét mã vạch (POS-System): Máy tính tiền điện tử được nối với hệ thống quản lý hàng hóa. POS = Point of Sale = nơi bán hàng.","ar":"صندوق دفع بماسح باركود (Scannerkasse / نظام POS): صندوق إلكتروني متصل بنظام إدارة البضائع. POS = Point of Sale = مكان البيع."},"„Hm. Sieht professionell aus. Mal sehen, ob ihr schneller seid als ich.“":{"tr":"„Hm. Profesyonel görünüyor. Bakalım benden hızlı olacak mısınız.“","vi":"„Hm. Trông chuyên nghiệp đấy. Để xem các bạn có nhanh hơn tôi không.“","ar":"„همم. يبدو احترافياً. لنرَ إن كنتم أسرع مني.“"},"„Ha, viel Spaß beim Tippen bei 40.000 Gästen!“":{"tr":"„Ha, 40.000 misafirle elle girmenin tadını çıkarın!“","vi":"„Ha, chúc vui khi gõ cho 40.000 khách!“","ar":"„ها، أتمنى لكم وقتاً ممتعاً في الكتابة مع 40.000 ضيف!“"},"„Genau so mach ich das auch. Wer braucht schon Bons?“":{"tr":"„Ben de tam böyle yapıyorum. Fişe kim ihtiyaç duyar ki?“","vi":"„Tôi cũng làm đúng như vậy. Ai cần hóa đơn chứ?“","ar":"„هكذا أفعل أنا أيضاً. من يحتاج إلى الإيصالات أصلاً؟“"},"GTIN und Price-Look-Up (PLU) Die GTIN ist die 13-stellige Artikelnummer unter dem Strichcode. Beim Scannen holt die Kasse damit den Preis aus dem Artikelstamm.":{"tr":"GTIN ve Price-Look-Up (PLU): GTIN (ürün barkod numarası), çizgi kodun altındaki 13 haneli ürün numarasıdır. Tarama sırasında kasa fiyatı bununla Artikelstamm (ürün ana verisi) içinden alır.","vi":"GTIN (mã số hàng hóa) và Price-Look-Up (PLU, tra giá): GTIN là mã số hàng hóa gồm 13 chữ số dưới mã vạch. Khi quét, máy tính tiền dùng mã này để lấy giá từ dữ liệu hàng hóa (Artikelstamm).","ar":"GTIN و Price-Look-Up (PLU) (البحث عن السعر): GTIN هو رقم المنتج المكوّن من 13 رقماً تحت الباركود. عند المسح يجلب الصندوق به السعر من Artikelstamm (ملف بيانات المنتجات)."},"„Das ging ja fix. Sehr gut!“":{"tr":"„Çok çabuk oldu. Çok iyi!“","vi":"„Nhanh quá. Rất tốt!“","ar":"„كان ذلك سريعاً. ممتاز!“"},"„Das dauert ja ewig. Gleich ist Einlass!“":{"tr":"„Bu çok uzun sürer. Birazdan giriş başlıyor!“","vi":"„Lâu quá. Sắp cho khách vào rồi!“","ar":"„هذا يستغرق وقتاً طويلاً. سيبدأ الدخول بعد قليل!“"},"„Und wenn ihr das vergesst? Das wird Chaos!“":{"tr":"„Peki unutursanız? Her şey karışır!“","vi":"„Nếu các bạn quên thì sao? Sẽ loạn mất!“","ar":"„وماذا لو نسيتم ذلك؟ ستكون فوضى!“"},"Belegausgabepflicht Seit 2020 bekommt jeder Kunde einen Beleg, auf Papier oder elektronisch (E-Bon). Er muss ihn nicht mitnehmen.":{"tr":"Fiş verme zorunluluğu (Belegausgabepflicht): 2020'den beri her müşteri kâğıt veya elektronik (E-Bon) bir fiş (Beleg) alır. Müşterinin fişi yanında götürmesi gerekmez.","vi":"Nghĩa vụ xuất hóa đơn (Belegausgabepflicht): Từ năm 2020, mỗi khách hàng nhận một hóa đơn (Beleg), bằng giấy hoặc điện tử (E-Bon). Khách không bắt buộc phải mang theo.","ar":"Belegausgabepflicht (واجب إصدار الإيصال): منذ 2020 يحصل كل عميل على إيصال، على الورق أو إلكترونياً (E-Bon). ولا يجب عليه أخذه معه."},"„Ah, okay. Dann leg ich ihn halt in den Müll da.“":{"tr":"„Ha, tamam. O zaman şuradaki çöpe atarım.“","vi":"„À, được rồi. Vậy tôi bỏ vào thùng rác đằng kia.“","ar":"„آه، حسناً. إذن سأضعه في سلة المهملات هناك.“"},"„Cool, geht schneller.“":{"tr":"„Harika, daha hızlı.“","vi":"„Tuyệt, nhanh hơn.“","ar":"„رائع، أسرع هكذا.“"},"„Okay … komisches System.“":{"tr":"„Tamam … garip bir sistem.“","vi":"„Được rồi … hệ thống lạ thật.“","ar":"„حسناً… نظام غريب.“"},"Storno Ein falsch erfasster Artikel wird in der Kasse rückgängig gemacht. Der falsche Bon wird aufbewahrt.":{"tr":"Storno (iptal): Yanlış girilen ürün kasada geri alınır. Yanlış fiş saklanır.","vi":"Hủy (Storno): Mặt hàng nhập sai được hủy trong máy tính tiền. Hóa đơn sai được giữ lại.","ar":"Storno (إلغاء): المنتج المسجَّل خطأً يُلغى في الصندوق. ويُحتفظ بالإيصال الخاطئ."},"„Okay, Storno … und der Bon kommt in die Kassenschublade. Danke!“":{"tr":"„Tamam, iptal … ve fiş kasa çekmecesine gidiyor. Teşekkürler!“","vi":"„Được rồi, hủy (Storno) … và hóa đơn bỏ vào ngăn kéo quỹ. Cảm ơn!“","ar":"„حسناً، Storno (إلغاء)… والإيصال يذهب إلى درج الصندوق. شكراً!“"},"„Gut, weg damit.“":{"tr":"„İyi, atayım.“","vi":"„Tốt, bỏ đi.“","ar":"„جيد، لنتخلص منه.“"},"„Hm, dann zahlt die Kundin aber zu viel …“":{"tr":"„Hmm, ama o zaman müşteri fazla öder …“","vi":"„Hừm, vậy thì khách sẽ trả quá nhiều …“","ar":"„همم، لكن حينها ستدفع العميلة أكثر من اللازم…“"},"Vorbereitende Tätigkeiten Kasse anmelden · Wechselgeld holen, einzählen und prüfen · Bonrollen prüfen · Geräte testen · Tüten bereitlegen · Ordnung.":{"tr":"Hazırlık işleri: Kasayı açmak · bozuk parayı (Wechselgeld) almak, saymak ve kontrol etmek · fiş rulolarını kontrol etmek · cihazları denemek · poşetleri hazırlamak · düzen.","vi":"Công việc chuẩn bị: Đăng nhập máy tính tiền · Lấy tiền lẻ để thối (Wechselgeld), đếm và kiểm tra · Kiểm tra cuộn giấy hóa đơn · Thử thiết bị · Chuẩn bị túi · Giữ gọn gàng.","ar":"الأعمال التحضيرية: تسجيل الدخول إلى الصندوق · إحضار Wechselgeld (الفكّة) وعدّها وفحصها · فحص لفات الإيصالات · اختبار الأجهزة · تجهيز الأكياس · ترتيب المكان."},"„Alles gezählt: 300 € Wechselgeld. Jetzt kann es losgehen!“":{"tr":"„Hepsi sayıldı: 300 € bozuk para. Şimdi başlayabiliriz!“","vi":"„Đã đếm xong: 300 € tiền lẻ để thối. Giờ có thể bắt đầu!“","ar":"„تم عدّ كل شيء: 300 € فكّة. الآن يمكننا البدء!“"},"„Okay … aber wie viel war jetzt eigentlich drin?“":{"tr":"„Tamam … ama içinde tam olarak ne kadar vardı?“","vi":"„Được rồi … nhưng thực ra trong đó có bao nhiêu nhỉ?“","ar":"„حسناً… لكن كم كان فيه فعلاً؟“"},"„Schönes Foto! Aber … wo ist die Bonrolle?“":{"tr":"„Güzel fotoğraf! Ama … fiş rulosu nerede?“","vi":"„Ảnh đẹp đấy! Nhưng … cuộn giấy hóa đơn đâu rồi?“","ar":"„صورة جميلة! لكن… أين لفة الإيصالات (Bonrolle)؟“"},"Kassieranweisung Regeln des Betriebs für die Kasse, z. B. Scheine prüfen, Rückgeld vorzählen, kein privates Geld, keine Familie abkassieren.":{"tr":"Kassieranweisung (kasa talimatı): İşletmenin kasa kuralları, örneğin banknotları kontrol etmek, para üstünü sesli saymak, özel para olmaması, aileden birinin ödemesini almamak.","vi":"Hướng dẫn thu ngân: Quy định của cửa hàng về quầy thu ngân, ví dụ: kiểm tra tiền giấy, đếm to tiền thối lại, không để tiền riêng, không tự thu tiền người nhà.","ar":"Kassieranweisung (تعليمات العمل على الصندوق): قواعد المحل الخاصة بالصندوق، مثلاً فحص الأوراق النقدية، العدّ أمام العميل عند ردّ الباقي (Rückgeld)، لا مال خاص، لا تحصيل من الأقارب."},"„Stimmt, steht ja in der Kassieranweisung. Mach ich.“":{"tr":"„Doğru, kasa talimatında yazıyor. Yaparım.“","vi":"„Đúng rồi, có trong hướng dẫn thu ngân mà. Mình sẽ làm vậy.“","ar":"„صحيح، هذا مكتوب في Kassieranweisung (تعليمات العمل على الصندوق). سأفعل ذلك.“"},"„Okay, das Portemonnaie kommt in den Spind.“":{"tr":"„Tamam, cüzdan dolaba gidiyor.“","vi":"„Được rồi, ví sẽ cất vào tủ cá nhân.“","ar":"„حسناً، المحفظة ستذهب إلى الخزانة.“"},"„Super, dann bleibt alles hier liegen.“":{"tr":"„Süper, o zaman her şey burada kalır.“","vi":"„Tuyệt, vậy mọi thứ cứ để nguyên ở đây.“","ar":"„ممتاز، إذن يبقى كل شيء هنا.“"},"Geldscheinhalter Der Schein des Kunden wird sichtbar eingeklemmt und erst nach dem Rückgeld in die Kasse gelegt.":{"tr":"Geldscheinhalter (banknot tutucu): Müşterinin banknotu görünür şekilde sıkıştırılır ve ancak para üstü verildikten sonra kasaya konur.","vi":"Kẹp giữ tiền giấy: Tờ tiền của khách được kẹp ở chỗ nhìn thấy và chỉ bỏ vào quỹ sau khi đã đưa tiền thối lại.","ar":"Geldscheinhalter (حامل الأوراق النقدية): تُثبَّت ورقة العميل بشكل ظاهر، ولا توضع في الصندوق إلا بعد ردّ الباقي (Rückgeld)."},"„Perfekt, stimmt genau. Danke!“":{"tr":"„Mükemmel, tam doğru. Teşekkürler!“","vi":"„Hoàn hảo, đúng chính xác. Cảm ơn!“","ar":"„ممتاز، بالضبط. شكراً!“"},"„Äh … stimmt das jetzt? Ich zähl lieber nach.“":{"tr":"„Şey … bu doğru mu şimdi? Ben yine de sayayım.“","vi":"„Ơ … có đúng không nhỉ? Tôi đếm lại cho chắc.“","ar":"„همم… هل هذا صحيح؟ الأفضل أن أعدّ بنفسي.“"},"„Moment! Ich hab Ihnen doch einen Hunderter gegeben!“":{"tr":"„Bir dakika! Ben size yüz euroluk verdim!“","vi":"„Khoan! Tôi đã đưa bạn tờ một trăm mà!“","ar":"„لحظة! لقد أعطيتك ورقة مئة!“"},"Kundenorientiertes Verhalten Begrüßung, Blickkontakt, Kauf bestätigen, Ware sorgsam behandeln, Service anbieten, sich bedanken und verabschieden.":{"tr":"Müşteri odaklı davranış: Selamlama, göz teması, alışverişi onaylama, ürüne özenle davranma, hizmet sunma, teşekkür etme ve vedalaşma.","vi":"Cách cư xử hướng đến khách hàng: Chào hỏi, giao tiếp bằng mắt, xác nhận việc mua, xử lý hàng cẩn thận, đề nghị dịch vụ, cảm ơn và chào tạm biệt.","ar":"السلوك الموجّه نحو العميل (kundenorientiert): التحية، التواصل بالعينين، تأكيد الشراء، التعامل مع البضاعة بعناية، عرض خدمة، الشكر والتوديع."},"„Danke, das ist lieb. Hier komm ich morgen wieder her!“":{"tr":"„Teşekkürler, ne güzel. Yarın da buraya gelirim!“","vi":"„Cảm ơn, bạn thật tốt. Ngày mai tôi sẽ quay lại đây!“","ar":"„شكراً، هذا لطيف. سأعود إلى هنا غداً!“"},"„Nein danke, ich will nur schnell weiter …“":{"tr":"„Hayır teşekkürler, ben sadece çabuk geçmek istiyorum …“","vi":"„Không, cảm ơn, tôi chỉ muốn đi nhanh thôi …“","ar":"„لا شكراً، أريد أن أكمل طريقي بسرعة…“"},"„Na, gemütlich ist anders.“":{"tr":"„Hiç de rahat değil.“","vi":"„Thế thì không thoải mái chút nào.“","ar":"„هذا ليس مريحاً أبداً.“"},"Fühlen – Sehen – Kippen Fühlen: Papier und Relief. Sehen (gegen das Licht): Wasserzeichen, Sicherheitsfaden, Porträtfenster. Kippen: Hologramm, Smaragdzahl.":{"tr":"Dokun – Bak – Eğ: Dokun: kâğıt ve kabartma. Bak (ışığa doğru): filigran, güvenlik şeridi, portre penceresi. Eğ: hologram, zümrüt rakam (Smaragdzahl).","vi":"Sờ – Nhìn – Nghiêng: Sờ: giấy và nét nổi. Nhìn (soi dưới ánh sáng): hình mờ, dây bảo an, ô chân dung. Nghiêng: hình ba chiều (hologram), số màu ngọc lục bảo.","ar":"اللمس – النظر – الإمالة: اللمس: الورق والملمس البارز (Relief). النظر (ضد الضوء): العلامة المائية، خيط الأمان، نافذة الصورة. الإمالة: الهولوغرام، الرقم الزمردي."},"„Ähm … ist irgendwas?“":{"tr":"„Şey … bir sorun mu var?“","vi":"„Ừm … có gì không ổn à?“","ar":"„ممم… هل هناك شيء غريب؟“"},"„Na also, passt doch.“":{"tr":"„Gördün mü, uyuyor.“","vi":"„Thấy chưa, ổn mà.“","ar":"„إذن، لا مشكلة.“"},"„Danke, schönen Abend noch!“":{"tr":"„Teşekkürler, iyi akşamlar!“","vi":"„Cảm ơn, chúc buổi tối vui vẻ!“","ar":"„شكراً، أمسية سعيدة!“"},"Echtheitsprüfung erklären Freundlich sagen, dass alle Scheine geprüft werden. So fühlt sich niemand beschuldigt.":{"tr":"Gerçeklik kontrolünü açıklamak: Tüm banknotların kontrol edildiğini güler yüzle söylemek. Böylece kimse suçlanmış hissetmez.","vi":"Giải thích việc kiểm tra tiền thật: Nói thân thiện rằng tất cả các tờ tiền đều được kiểm tra. Như vậy không ai cảm thấy bị nghi ngờ.","ar":"شرح فحص الأصالة: قل بلطف إن كل الأوراق تُفحص. هكذا لا يشعر أحد بأنه متَّهم."},"„Ach so, bei allen. Na gut, dann ist ja alles okay.“":{"tr":"„Ha, herkeste. Peki, o zaman sorun yok.“","vi":"„À, với tất cả mọi người. Thôi được, vậy thì ổn.“","ar":"„آه، مع الجميع. حسناً، إذن لا بأس.“"},"„Hallo? Ich rede mit Ihnen!“":{"tr":"„Alo? Sizinle konuşuyorum!“","vi":"„Alo? Tôi đang nói chuyện với bạn đấy!“","ar":"„مرحباً؟ أنا أكلّمك!“"},"„Wie bitte?! Das ist ja eine Frechheit!“":{"tr":"„Efendim?! Bu bir saygısızlık!“","vi":"„Cái gì?! Thật là vô lễ!“","ar":"„ماذا؟! هذه وقاحة!“"},"Verdacht auf Falschgeld Ruhig bleiben · Schein einbehalten · Vorgesetzte rufen · Kunden bitten zu warten · sich den Kunden merken.":{"tr":"Sahte para şüphesi: Sakin kalmak · banknota el koymak · amiri çağırmak · müşteriden beklemesini istemek · müşteriyi aklında tutmak.","vi":"Nghi ngờ tiền giả: Giữ bình tĩnh · Giữ lại tờ tiền · Gọi cấp trên · Nhờ khách chờ · Ghi nhớ đặc điểm của khách.","ar":"الاشتباه بنقود مزيّفة (Falschgeld): التزام الهدوء · الاحتفاظ بالورقة · استدعاء المسؤولة · طلب الانتظار من العميل · تذكّر شكل العميل."},"„Ich … ähm … na gut, ich warte.“":{"tr":"„Ben … şey … tamam, bekliyorum.“","vi":"„Tôi … ừm … thôi được, tôi chờ.“","ar":"„أنا… ممم… حسناً، سأنتظر.“"},"„Danke, Kumpel! Tschüss!“":{"tr":"„Sağ ol, dostum! Hoşça kal!“","vi":"„Cảm ơn bạn! Tạm biệt!“","ar":"„شكراً يا صديقي! إلى اللقاء!“"},"„Lass mich los! Ich hab gar nichts gemacht!“":{"tr":"„Bırak beni! Ben hiçbir şey yapmadım!“","vi":"„Buông tôi ra! Tôi có làm gì đâu!“","ar":"„اتركني! لم أفعل شيئاً!“"},"Münzannahme Bei einer Zahlung muss niemand mehr als 50 Münzen annehmen.":{"tr":"Madeni para kabulü: Bir ödemede kimse 50'den fazla madeni parayı kabul etmek zorunda değildir.","vi":"Nhận tiền xu: Trong một lần thanh toán, không ai bắt buộc phải nhận nhiều hơn 50 đồng tiền xu.","ar":"قبول العملات المعدنية: في دفعة واحدة لا يجب على أحد قبول أكثر من 50 عملة معدنية."},"„Ach so, das wusste ich nicht. Dann nehm ich die Karte.“":{"tr":"„Ha, bunu bilmiyordum. O zaman kartı vereyim.“","vi":"„À, ra vậy, tôi không biết. Vậy tôi dùng thẻ.“","ar":"„آه، لم أكن أعرف ذلك. إذن سأستخدم البطاقة.“"},"„Danke, junger Mensch!“":{"tr":"„Sağ ol, genç!“","vi":"„Cảm ơn, bạn trẻ!“","ar":"„شكراً أيها الشاب!“"},"„Was? Das ist doch Geld!“":{"tr":"„Ne? Bu da para!“","vi":"„Gì cơ? Đó cũng là tiền mà!“","ar":"„ماذا؟ هذه نقود!“"},"Kreditkarten-Symbole Die Symbole an der Kasse zeigen dem Kunden: Diese Kreditkarten werden hier angenommen.":{"tr":"Kredi kartı simgeleri: Kasadaki simgeler müşteriye şunu gösterir: Bu kredi kartları burada kabul edilir.","vi":"Biểu tượng thẻ tín dụng: Các biểu tượng ở quầy thu ngân cho khách biết: Ở đây nhận những thẻ tín dụng này.","ar":"رموز بطاقات الائتمان: الرموز عند الصندوق تُظهر للعميل: هذه بطاقات الائتمان مقبولة هنا."},"„Sehr gut. So weiß jeder sofort Bescheid.“":{"tr":"„Çok iyi. Böylece herkes hemen bilgi sahibi olur.“","vi":"„Rất tốt. Như vậy ai cũng biết ngay.“","ar":"„ممتاز. هكذا يعرف الجميع فوراً.“"},"„Nur Bargeld? Dann gehen die Leute zum Nachbarn.“":{"tr":"„Sadece nakit mi? O zaman insanlar komşuya gider.“","vi":"„Chỉ tiền mặt? Vậy mọi người sẽ sang quầy hàng xóm.“","ar":"„نقداً فقط؟ حينها سيذهب الناس إلى الجار.“"},"„Bei der Schlange fragt doch keiner. Die gehen einfach.“":{"tr":"„Kuyrukta kimse sormaz. Gidip başka yere giderler.“","vi":"„Khi hàng người dài thì chẳng ai hỏi đâu. Họ bỏ đi luôn.“","ar":"„في الطابور لا أحد يسأل. يذهبون ببساطة.“"},"Mobile Payment Zahlen mit Smartphone oder Smartwatch. Die Daten gehen per Funk (NFC) an das Lesegerät. Der Kunde bestätigt auf seinem Gerät.":{"tr":"Mobile Payment (telefonla ödeme): Akıllı telefon veya akıllı saatle ödeme. Veriler radyo ile (NFC) okuyucuya gider. Müşteri kendi cihazında onaylar.","vi":"Thanh toán di động (Mobile Payment): Thanh toán bằng điện thoại thông minh hoặc đồng hồ thông minh. Dữ liệu được gửi qua sóng không dây (NFC) đến máy đọc. Khách xác nhận trên thiết bị của mình.","ar":"الدفع عبر الهاتف (Mobile Payment): الدفع بالهاتف الذكي أو الساعة الذكية. تنتقل البيانات لاسلكياً (NFC) إلى جهاز القراءة. يؤكد العميل على جهازه."},"„Piep – fertig! Das ging schnell.“":{"tr":"„Bip – bitti! Çabuk oldu.“","vi":"„Bíp – xong rồi! Nhanh thật.“","ar":"„بيب – انتهى! كان ذلك سريعاً.“"},"„PIN? Die weiß ich gar nicht …“":{"tr":"„PIN mi? Ben onu bilmiyorum bile …“","vi":"„PIN á? Tôi chẳng biết nữa …“","ar":"„PIN؟ لا أعرفه أصلاً…“"},"„Schade. Dann kauf ich drüben.“":{"tr":"„Yazık. O zaman karşıdan alırım.“","vi":"„Tiếc quá. Vậy tôi mua bên kia.“","ar":"„للأسف. إذن سأشتري من الكشك المقابل.“"},"PIN beim kontaktlosen Zahlen Ohne PIN meist bis 50 €. Darüber, nach mehreren Zahlungen hintereinander oder per Zufall wird eine PIN verlangt.":{"tr":"Temassız ödemede PIN: PIN'siz genellikle 50 € a kadar. Bunun üzerinde, art arda birkaç ödemeden sonra veya rastgele PIN istenir.","vi":"PIN khi thanh toán không tiếp xúc: Thường không cần PIN nếu dưới 50 €. Nếu số tiền cao hơn, thanh toán nhiều lần liên tiếp hoặc ngẫu nhiên thì sẽ bị yêu cầu nhập PIN.","ar":"PIN (الرقم السري) عند الدفع بدون تلامس: بدون رمز PIN عادةً حتى 50 €. وإذا زاد المبلغ، أو بعد عدة عمليات دفع متتالية، أو بشكل عشوائي، يُطلب رمز PIN."},"„Ach so. Na gut, dann tippe ich sie ein.“":{"tr":"„Anladım. Peki, o zaman giriyorum.“","vi":"„À ra vậy. Được rồi, vậy tôi sẽ nhập.“","ar":"„آه، فهمت. حسناً، سأدخله.“"},"„Bar? Ich hab doch gar kein Bargeld dabei.“":{"tr":"„Nakit mi? Yanımda hiç nakit yok ki.“","vi":"„Tiền mặt ư? Tôi có mang tiền mặt đâu.“","ar":"„نقداً؟ ليس معي نقود أصلاً.“"},"„Meine Karte ist nicht kaputt!“":{"tr":"„Kartım bozuk değil!“","vi":"„Thẻ của tôi không hỏng!“","ar":"„بطاقتي ليست معطّلة!“"},"Datenschutz (DSGVO) Kundendaten nur mit Einwilligung speichern, vertraulich behandeln, nicht an Dritte weitergeben, nur so viele wie nötig.":{"tr":"Veri koruma (DSGVO – Avrupa kişisel verileri koruma yasası): Müşteri verilerini sadece izinle kaydet, gizli tut, üçüncü kişilere verme, sadece gerektiği kadar topla.","vi":"Bảo vệ dữ liệu (DSGVO – quy định bảo vệ dữ liệu của châu Âu): Chỉ lưu dữ liệu khách hàng khi có sự đồng ý, giữ bí mật, không chuyển cho bên thứ ba, chỉ lưu những gì cần thiết.","ar":"حماية البيانات (DSGVO): تخزين بيانات الزبائن فقط بموافقتهم، ومعاملتها بسرية، وعدم إعطائها لأطراف ثالثة، وبالقدر الضروري فقط."},"„Pff. Dann eben nicht.“":{"tr":"„Pff. Peki, o zaman olmasın.“","vi":"„Hứ. Thôi vậy.“","ar":"„تف. إذن لا بأس.“"},"„Na, besser als nichts!“":{"tr":"„Hiç yoktan iyi!“","vi":"„Thôi, còn hơn không!“","ar":"„حسناً، أفضل من لا شيء!“"},"„Versprochen! Ehrenwort!“":{"tr":"„Söz! Namus sözü!“","vi":"„Hứa! Tôi thề!“","ar":"„أعدك! أعطيك كلمة شرف!“"},"Jugendschutz: Alkohol Bier, Wein, Sekt und Mischgetränke mit Bier oder Wein ab 16. Branntwein und Mischgetränke mit Branntwein ab 18.":{"tr":"Gençlerin korunması (Jugendschutz): Alkol: Bira, şarap, köpüklü şarap ve bira veya şarap içeren karışık içecekler 16 yaşından itibaren. Branntwein (damıtılmış sert içki) ve Branntwein içeren karışık içecekler 18 yaşından itibaren.","vi":"Bảo vệ thanh thiếu niên: Rượu: Bia, rượu vang, rượu sâm banh và đồ uống pha với bia hoặc rượu vang: từ 16 tuổi. Rượu mạnh (Branntwein) và đồ uống pha với rượu mạnh: từ 18 tuổi.","ar":"حماية الأحداث: الكحول: البيرة والنبيذ والشمبانيا والمشروبات المخلوطة بالبيرة أو النبيذ من عمر 16. المشروبات الروحية القوية (Branntwein) والمشروبات المخلوطة بها من عمر 18."},"„Okay … dann halt zwei Limos.“":{"tr":"„Tamam … o zaman iki limonata.“","vi":"„Ok … vậy thì hai chai Limo vậy.“","ar":"„حسناً … إذن علبتا ليموناضة.“"},"„Boah, wie unfreundlich!“":{"tr":"„Off, ne kadar kaba!“","vi":"„Trời, sao thô lỗ vậy!“","ar":"„يا للوقاحة!“"},"„Danke! Easy.“":{"tr":"„Sağ ol! Kolay.“","vi":"„Cảm ơn! Dễ ợt.“","ar":"„شكراً! سهل.“"},"Jugendschutz: Tabak Tabakwaren, E-Zigaretten und Shishas – mit und ohne Nikotin – erst ab 18 Jahren.":{"tr":"Gençlerin korunması (Jugendschutz): Tütün: Tütün ürünleri, elektronik sigaralar ve nargileler – nikotinli ve nikotinsiz – ancak 18 yaşından itibaren.","vi":"Bảo vệ thanh thiếu niên: Thuốc lá: Sản phẩm thuốc lá, thuốc lá điện tử và shisha – có hoặc không có nicotin – chỉ từ 18 tuổi.","ar":"حماية الأحداث: التبغ: منتجات التبغ والسجائر الإلكترونية والشيشة – بنيكوتين أو بدونه – من عمر 18 سنة فقط."},"„Echt? Auch ohne Nikotin? Okay, dann ein Wasser.“":{"tr":"„Gerçekten mi? Nikotinsiz de mi? Tamam, o zaman bir su.“","vi":"„Thật á? Không có nicotin cũng không được ạ? Ok, vậy cho cháu chai nước.“","ar":"„حقاً؟ حتى بدون نيكوتين؟ حسناً، إذن ماء.“"},"„Was ist denn dein Problem?“":{"tr":"„Senin sorunun ne?“","vi":"„Bạn bị làm sao vậy?“","ar":"„ما مشكلتك أنت؟“"},"„Danke! Wusste ich doch.“":{"tr":"„Sağ ol! Biliyordum zaten.“","vi":"„Cảm ơn! Em biết mà.“","ar":"„شكراً! كنت أعرف ذلك.“"},"Hilfestellung / Alternative anbieten Höflich sagen, was los ist (mit Grund), und eine Lösung anbieten: bar zahlen, zurücklegen, andere Kasse.":{"tr":"Yardım / alternatif sunmak: Kibarca ne olduğunu söyle (sebebiyle birlikte) ve bir çözüm sun: nakit ödeme, kenara ayırma, başka kasa.","vi":"Hỗ trợ (Hilfestellung) / đưa ra phương án thay thế: Lịch sự nói rõ chuyện gì đang xảy ra (kèm lý do) và đưa ra giải pháp: trả tiền mặt, để hàng lại, dùng quầy khác.","ar":"تقديم المساعدة (Hilfestellung) / عرض بديل: قل بأدب ما الذي حدث (مع السبب)، وقدّم حلاً: الدفع نقداً، أو حجز المشتريات جانباً، أو صندوق آخر."},"„Ich hol schnell Geld vom Automaten. Danke fürs Zurücklegen!“":{"tr":"„Hemen bankamatikten para çekip geliyorum. Kenara ayırdığınız için teşekkürler!“","vi":"„Tôi đi rút tiền ở máy ATM một chút. Cảm ơn đã giữ hàng giúp!“","ar":"„سأحضر نقوداً بسرعة من الصراف الآلي. شكراً لأنكم حجزتم لي المشتريات!“"},"„Aha. Und jetzt?“":{"tr":"„Anladım. Peki şimdi ne olacak?“","vi":"„À. Rồi sao nữa?“","ar":"„آها. وماذا الآن؟“"},"„Unfassbar. Hier kauf ich nie wieder.“":{"tr":"„İnanılmaz. Buradan bir daha asla alışveriş yapmam.“","vi":"„Không thể tin được. Tôi không bao giờ mua ở đây nữa.“","ar":"„لا يُصدَّق. لن أشتري من هنا أبداً.“"},"Ergonomie am Kassenplatz Stuhl und Theke auf die Körpergröße einstellen, Sitzen und Stehen wechseln, Stehhilfe, Handscanner für schwere Ware, Pausen.":{"tr":"Kasa yerinde ergonomi: Sandalye ve tezgahı boya göre ayarla, oturmayı ve ayakta durmayı değiştir, ayakta durma desteği, ağır mallar için el tarayıcısı, molalar.","vi":"Công thái học (Ergonomie) tại vị trí thu ngân: Chỉnh ghế và quầy cho vừa chiều cao cơ thể, đổi giữa ngồi và đứng, dùng giá tựa để đứng, dùng máy quét cầm tay cho hàng nặng, nghỉ giải lao.","ar":"بيئة العمل المريحة (Ergonomie) عند الصندوق: ضبط الكرسي والطاولة حسب طول الجسم، والتبديل بين الجلوس والوقوف، ومسند الوقوف (Stehhilfe)، وماسح يدوي للبضاعة الثقيلة، واستراحات."},"„Puh, viel besser. Und ich vertippe mich nicht mehr.“":{"tr":"„Oh, çok daha iyi. Ve artık yanlış tuşlamıyorum.“","vi":"„Phù, khá hơn nhiều. Và tôi cũng không bấm nhầm nữa.“","ar":"„أف، أفضل بكثير. ولم أعد أخطئ في الإدخال.“"},"„Geht so … der Rücken zwickt immer noch.“":{"tr":"„Şöyle böyle … sırtım hâlâ sızlıyor.“","vi":"„Cũng tàm tạm … lưng vẫn còn nhói.“","ar":"„ليس تماماً … الظهر ما زال يؤلمني.“"},"„Au … ich hab mich schon zweimal vertippt.“":{"tr":"„Ay … iki kez yanlış tuşladım bile.“","vi":"„Úi … tôi đã bấm nhầm hai lần rồi.“","ar":"„آه … أخطأت مرتين في الإدخال.“"},"Diebstahlprävention Einkaufswagen und Umverpackungen kontrollieren, damit nichts vergessen oder versteckt wird. Freundlich ansprechen.":{"tr":"Hırsızlığın önlenmesi: Alışveriş arabasını ve dış ambalajları kontrol et, böylece hiçbir şey unutulmaz veya saklanmaz. Samimi bir şekilde hitap et.","vi":"Phòng chống trộm cắp (Diebstahlprävention): Kiểm tra xe đẩy và bao bì ngoài để không bị quên hoặc giấu hàng. Hỏi thân thiện.","ar":"منع السرقة (Diebstahlprävention): فحص عربة التسوق والتغليف الخارجي حتى لا يُنسى شيء ولا يُخبَّأ. والتحدث مع الزبون بلطف."},"„Oh, den hätte ich glatt vergessen. Danke!“":{"tr":"„Ah, onu neredeyse unutuyordum. Teşekkürler!“","vi":"„Ôi, tôi quên mất thùng đó. Cảm ơn!“","ar":"„آه، كدت أنساها. شكراً!“"},"„Tschüss!“":{"tr":"„Hoşça kal!“","vi":"„Tạm biệt!“","ar":"„إلى اللقاء!“"},"„Wie bitte?! Das ist ja unverschämt!“":{"tr":"„Efendim?! Bu çok terbiyesizlik!“","vi":"„Cái gì?! Thật là xấc xược!“","ar":"„ماذا؟! هذه وقاحة!“"},"Kassenbericht Kassenschlussbestand + Abschöpfungen − Wechselgeld = Tageslosung. Tageslosung + Kartenzahlungen = Tagesumsatz.":{"tr":"Kasa raporu: Kasa kapanış bakiyesi + kasadan ara para çekmeler − bozuk para = günlük nakit hasılat. Günlük nakit hasılat + kartlı ödemeler = günlük ciro.","vi":"Báo cáo quỹ (Kassenbericht): Số tiền cuối ca + các khoản rút bớt − tiền lẻ để thối = doanh thu tiền mặt trong ngày (Tageslosung). Doanh thu tiền mặt trong ngày + thanh toán bằng thẻ = doanh thu trong ngày (Tagesumsatz).","ar":"تقرير الصندوق (Kassenbericht): رصيد نهاية الصندوق + المسحوبات − الفكّة = حصيلة اليوم النقدية. حصيلة اليوم النقدية + الدفع بالبطاقات = مبيعات اليوم."},"„Ach so! Die 2.000 € haben wir ja eingenommen. Ich rechne neu.“":{"tr":"„Anladım! O 2.000 € yi biz kazandık zaten. Yeniden hesaplıyorum.“","vi":"„À ra vậy! 2.000 € này chúng ta đã thu được mà. Tôi tính lại.“","ar":"„آه فهمت! لقد استلمنا الـ 2.000 € فعلاً. سأحسب من جديد.“"},"„Okay … aber die Zahl ist immer noch so klein.“":{"tr":"„Tamam … ama sayı hâlâ çok küçük.“","vi":"„Ok … nhưng con số vẫn nhỏ quá.“","ar":"„حسناً … لكن الرقم ما زال صغيراً جداً.“"},"„Dann haben wir heute ja kaum was verdient?!“":{"tr":"„O zaman bugün neredeyse hiç kazanmadık mı?!“","vi":"„Vậy hôm nay chúng ta hầu như không kiếm được gì sao?!“","ar":"„إذن لم نربح اليوم تقريباً شيئاً؟!“"},"Tageslosung und Tagesumsatz Tageslosung = alle Bareinnahmen. Tagesumsatz = bar + Karte.":{"tr":"Günlük nakit hasılat ve günlük ciro: Günlük nakit hasılat = tüm nakit gelirler. Günlük ciro = nakit + kart.","vi":"Doanh thu tiền mặt trong ngày (Tageslosung) và doanh thu trong ngày (Tagesumsatz): Tageslosung = toàn bộ tiền mặt thu được. Tagesumsatz = tiền mặt + thẻ.","ar":"حصيلة اليوم النقدية ومبيعات اليوم (Tageslosung und Tagesumsatz): حصيلة اليوم النقدية = كل الإيرادات النقدية. مبيعات اليوم = النقد + البطاقة."},"„Genau. Und beides will ich sehen.“":{"tr":"„Aynen. Ve ikisini de görmek istiyorum.“","vi":"„Chính xác. Và tôi muốn xem cả hai.“","ar":"„بالضبط. وأريد أن أرى الاثنين.“"},"„Nein, das ist der Kassenschlussbestand. Da fehlt was.“":{"tr":"„Hayır, o kasa kapanış bakiyesidir. Eksik var.“","vi":"„Không, đó là số tiền trong quỹ cuối ca. Thiếu mất một phần.“","ar":"„لا، هذا هو رصيد نهاية الصندوق. وينقصه شيء.“"},"„Das ist der Tagesumsatz. Nicht verwechseln!“":{"tr":"„O günlük cirodur. Karıştırmayın!“","vi":"„Đó là Tagesumsatz. Đừng nhầm lẫn!“","ar":"„هذه هي مبيعات اليوم. لا تخلط بينهما!“"},"Kassendifferenz Ist − Soll. Plus = Überschuss (zu viel Geld). Minus = Fehlbetrag (zu wenig Geld).":{"tr":"Kasa farkı: Ist − Soll. Artı = kasa fazlası (fazla para). Eksi = kasa açığı (az para).","vi":"Chênh lệch quỹ (Kassendifferenz): Ist − Soll. Dương = thừa tiền (Überschuss, nhiều tiền hơn). Âm = thiếu tiền (Fehlbetrag, ít tiền hơn).","ar":"فرق الصندوق (Kassendifferenz): الفعلي − المطلوب. زائد = فائض (مال زائد). ناقص = عجز (مال ناقص)."},"„Richtig. Vielleicht hat ein Gast zu wenig zurückbekommen.“":{"tr":"„Doğru. Belki bir misafir az para üstü aldı.“","vi":"„Đúng. Có thể một khách đã nhận thối lại quá ít.“","ar":"„صحيح. ربما حصل ضيف على باقٍ أقل من اللازم.“"},"„Fehlbetrag? Es ist doch zu viel Geld da!“":{"tr":"„Kasa açığı mı? Para fazla ki!“","vi":"„Thiếu tiền ư? Rõ ràng đang thừa tiền mà!“","ar":"„عجز؟ المال هنا زائد!“"},"„Auf keinen Fall. Das Geld gehört dem Betrieb.“":{"tr":"„Asla. Para işletmeye aittir.“","vi":"„Tuyệt đối không. Số tiền này thuộc về cửa hàng.“","ar":"„إطلاقاً لا. المال يخص المحل.“"},"Kassensturz Überraschender Soll-Ist-Vergleich während des Tages.":{"tr":"Kasa sayımı: Gün içinde sürpriz Soll-Ist karşılaştırması.","vi":"Kiểm kê quỹ đột xuất (Kassensturz): So sánh Soll-Ist đột xuất trong ngày.","ar":"جرد الصندوق المفاجئ: مقارنة مفاجئة بين المطلوب والفعلي خلال اليوم."},"„Überraschend? Ach du Schreck …“":{"tr":"„Sürpriz mi? Eyvah …“","vi":"„Bất ngờ ư? Trời ơi …“","ar":"„مفاجئ؟ يا للهول …“"},"„Gute Idee, mach ich auch!“":{"tr":"„İyi fikir, ben de yaparım!“","vi":"„Ý hay, tôi cũng làm vậy!“","ar":"„فكرة جيدة، سأفعل مثلكم!“"},"„Hä? Na dann.“":{"tr":"„Ha? Neyse.“","vi":"„Hả? Thôi được.“","ar":"„ماذا؟ حسناً إذن.“"},"Geschäftsunfähig Kinder unter 7 Jahren. Ihr Kauf ist nichtig (von Anfang an ungültig). Ausnahme: Botengang.":{"tr":"Hukuki işlem ehliyetsiz (geschäftsunfähig): 7 yaşın altındaki çocuklar. Alışverişleri geçersizdir (nichtig – baştan beri geçersiz). İstisna: ulaklık (Botengang).","vi":"Không có năng lực hành vi (geschäftsunfähig): Trẻ em dưới 7 tuổi. Việc mua bán của các em là vô hiệu (nichtig, không có giá trị ngay từ đầu). Ngoại lệ: đi mua hộ (Botengang).","ar":"عديم الأهلية (geschäftsunfähig): الأطفال دون 7 سنوات. شراؤهم باطل (nichtig، أي غير صالح من الأساس). الاستثناء: المشوار بالتكليف (Botengang)."},"„Okay … ich hol Papa!“":{"tr":"„Tamam … babamı getiriyorum!“","vi":"„Dạ … để em đi gọi bố!“","ar":"„حسناً … سأحضر بابا!“"},"„Juhu, leuchtet!“":{"tr":"„Yaşasın, yanıyor!“","vi":"„Hoan hô, sáng quá!“","ar":"„هيه، إنها تضيء!“"},"„Hier, drei Euro!“":{"tr":"„Buyur, üç avro!“","vi":"„Đây, ba euro!“","ar":"„تفضل، ثلاثة يورو!“"},"Botengang Ein Kind kauft im Auftrag der Eltern ein und überbringt nur deren Willen. Der Kauf ist gültig.":{"tr":"Ulaklık (Botengang): Bir çocuk ebeveynlerinin görevlendirmesiyle alışveriş yapar ve sadece onların iradesini iletir. Alışveriş geçerlidir.","vi":"Đi mua hộ (Botengang): Trẻ em mua theo yêu cầu của bố mẹ và chỉ truyền đạt ý muốn của họ. Việc mua có giá trị.","ar":"المشوار بالتكليف (Botengang): طفل يشتري بتكليف من أهله وينقل إرادتهم فقط. الشراء صحيح."},"„Danke! Mama winkt schon.“":{"tr":"„Teşekkürler! Annem şimdiden el sallıyor.“","vi":"„Cảm ơn! Mẹ đang vẫy tay kìa.“","ar":"„شكراً! ماما تلوّح لي.“"},"„Aber Mama hat doch gesagt …“":{"tr":"„Ama annem söyledi ki …“","vi":"„Nhưng mẹ đã nói là …“","ar":"„لكن ماما قالت …“"},"„Okay!“":{"tr":"„Tamam!“","vi":"„Dạ!“","ar":"„حسناً!“"},"Taschengeldparagraf (§ 110 BGB) Beschränkt Geschäftsfähige kaufen gültig, wenn sie sofort und vollständig mit Geld zur freien Verfügung bezahlen.":{"tr":"Harçlık maddesi (§ 110 BGB): Sınırlı hukuki işlem ehliyetliler, serbestçe kullanabilecekleri parayla hemen ve tamamen öderlerse geçerli alışveriş yaparlar.","vi":"Điều khoản tiền tiêu vặt (§ 110 BGB): Người có năng lực hành vi hạn chế mua có giá trị nếu trả ngay và đầy đủ bằng tiền được tự do sử dụng.","ar":"مادة المصروف الشخصي (Taschengeldparagraf) (§ 110 BGB): ناقصو الأهلية يشترون بشكل صحيح إذا دفعوا فوراً وبالكامل بمال تحت تصرفهم الحر."},"„Yes! Mein erstes Band-Shirt!“":{"tr":"„Yes! İlk grup tişörtüm!“","vi":"„Yes! Chiếc áo ban nhạc đầu tiên của mình!“","ar":"„رائع! قميصي الأول لفرقتي!“"},"„Echt jetzt? Das ist so peinlich …“":{"tr":"„Gerçekten mi? Bu çok utanç verici …“","vi":"„Thật á? Ngại quá đi …“","ar":"„حقاً الآن؟ هذا محرج جداً …“"},"„Aber das ist mein Taschengeld!“":{"tr":"„Ama bu benim harçlığım!“","vi":"„Nhưng đây là tiền tiêu vặt của em mà!“","ar":"„لكن هذا مصروفي!“"},"Schwebend unwirksam Der Kauf eines beschränkt Geschäftsfähigen gilt erst, wenn die Eltern zustimmen. Sagen sie Nein, ist er von Anfang an ungültig.":{"tr":"Askıda (geçici olarak geçersiz): Sınırlı hukuki işlem ehliyeti olan (beschränkt Geschäftsfähiger) bir kişinin alışverişi, ancak ebeveynler onaylarsa geçerli olur. Hayır derlerse baştan geçersizdir.","vi":"Chưa có hiệu lực (schwebend unwirksam): Việc mua của người có năng lực hành vi hạn chế (beschränkt Geschäftsfähiger) chỉ có hiệu lực khi bố mẹ đồng ý. Nếu bố mẹ từ chối, việc mua vô hiệu ngay từ đầu.","ar":"معلّق (غير نافذ مؤقتاً): شراء ناقص الأهلية (beschränkt geschäftsfähig) لا يصبح نافذاً إلا بموافقة الأهل. وإذا رفضوا، يكون باطلاً من البداية."},"„Hm, okay. Ich ruf meinen Vater an.“":{"tr":"„Hmm, tamam. Babamı arayacağım.“","vi":"„Ừm, được rồi. Em sẽ gọi cho bố em.“","ar":"„همم، حسناً. سأتصل بأبي.“"},"„Läuft!“":{"tr":"„Tamamdır!“","vi":"„Xong!“","ar":"„تمام!“"},"„Die merken das eh nicht.“":{"tr":"„Zaten fark etmezler.“","vi":"„Dù sao họ cũng không biết đâu.“","ar":"„لن ينتبهوا على أي حال.“"},"Anfechtbar: Irrtum in der Erklärung Man hat sich verschrieben, vertippt oder versprochen. Der Vertrag gilt, bis man unverzüglich anficht.":{"tr":"İptal edilebilir (anfechtbar): beyan yanılgısı: Yanlış yazdı, yanlış tuşladı veya yanlış söyledi. Sözleşme, gecikmeden iptal edilene (unverzüglich anfechten) kadar geçerlidir.","vi":"Có thể bị hủy bỏ (anfechtbar): nhầm lẫn trong tuyên bố: Người ta viết sai, gõ sai hoặc nói nhầm. Hợp đồng có hiệu lực cho đến khi người đó hủy bỏ (anfechten) ngay lập tức.","ar":"قابل للإبطال: غلط في التعبير عن الإرادة: أخطأ الشخص في الكتابة أو في الطباعة أو في الكلام. العقد يسري حتى يُبطله دون تأخير."},"„Gut, ich ruf gleich an und schick eine Mail hinterher.“":{"tr":"„İyi, hemen arayacağım ve arkasından e-posta göndereceğim.“","vi":"„Được, tôi gọi ngay và gửi thêm email sau.“","ar":"„جيد، سأتصل حالاً ثم أرسل رسالة بريد إلكتروني.“"},"„Montag? Bis dahin ist der Lkw schon unterwegs …“":{"tr":"„Pazartesi mi? O zamana kadar kamyon yola çıkmış olur …“","vi":"„Thứ Hai ư? Đến lúc đó xe tải đã lên đường rồi …“","ar":"„الاثنين؟ حتى ذلك الحين تكون الشاحنة في الطريق …“"},"„500 Kisten? Wo soll ich die hinstellen?!“":{"tr":"„500 kasa mı? Bunları nereye koyacağım?!“","vi":"„500 thùng? Biết để ở đâu bây giờ?!“","ar":"„500 صندوق؟ أين سأضعها؟!“"},"Motivirrtum Man irrt sich nur über seine Gründe („Ich dachte, ich brauche das noch.“). Kein Anfechtungsgrund.":{"tr":"Saik yanılgısı (Motivirrtum): Kişi yalnızca kendi nedenleri konusunda yanılıyor („Buna hâlâ ihtiyacım olacağını sanmıştım.“). İptal nedeni değildir.","vi":"Nhầm lẫn về động cơ (Motivirrtum): Người ta chỉ nhầm về lý do của mình („Tôi tưởng tôi vẫn cần nó.“). Đây không phải là lý do để hủy bỏ.","ar":"غلط في الدافع: يخطئ الشخص فقط في أسبابه („ظننت أنني ما زلت أحتاج إلى هذا.“). هذا ليس سبباً للإبطال."},"„Na gut. Wäre nett, wenn's klappt.“":{"tr":"„Peki. Olursa güzel olur.“","vi":"„Thôi được. Mong là được.“","ar":"„حسناً. سيكون لطيفاً لو نجح الأمر.“"},"„Wusste ich's doch!“":{"tr":"„Zaten biliyordum!“","vi":"„Tôi biết mà!“","ar":"„كنت أعلم ذلك!“"},"„Prima, dann Geld zurück!“":{"tr":"„Harika, o zaman para iadesi!“","vi":"„Tuyệt, vậy trả lại tiền cho tôi!“","ar":"„ممتاز، إذن أسترد مالي!“"},"Arglistige Täuschung Jemand verschweigt oder lügt absichtlich. Der Vertrag ist anfechtbar – 1 Jahr ab Entdecken.":{"tr":"Hileli aldatma (arglistige Täuschung): Biri kasıtlı olarak gerçeği gizliyor veya yalan söylüyor. Sözleşme iptal edilebilir (anfechtbar) – fark edildiği andan itibaren 1 yıl içinde.","vi":"Lừa dối có chủ ý (arglistige Täuschung): Ai đó cố tình giấu giếm hoặc nói dối. Hợp đồng có thể bị hủy bỏ (anfechtbar) – trong 1 năm kể từ khi phát hiện.","ar":"الخداع المتعمّد: شخص يُخفي الحقيقة أو يكذب عمداً. العقد قابل للإبطال – لمدة 1 سنة من وقت الاكتشاف."},"„Gut. Ich schreibe ihm heute noch.“":{"tr":"„İyi. Bugün ona yazacağım.“","vi":"„Tốt. Hôm nay tôi sẽ viết thư cho ông ta.“","ar":"„جيد. سأكتب له اليوم.“"},"„Automatisch? Bist du sicher?“":{"tr":"„Otomatik mi? Emin misin?“","vi":"„Tự động ư? Bạn chắc chứ?“","ar":"„تلقائياً؟ هل أنت متأكد؟“"},"„Dann bleiben wir auf den Fälschungen sitzen …“":{"tr":"„O zaman sahte ürünlerle baş başa kalırız …“","vi":"„Vậy thì chúng ta phải ôm đống hàng giả …“","ar":"„إذن سنبقى عالقين مع المقلّدات …“"},"Scherzgeschäft Beide wissen, dass es nicht ernst gemeint ist. Das Rechtsgeschäft ist nichtig.":{"tr":"Şaka amaçlı işlem (Scherzgeschäft): İkisi de bunun ciddi olmadığını biliyor. Hukuki işlem geçersizdir (nichtig).","vi":"Giao dịch đùa (Scherzgeschäft): Cả hai đều biết đó không phải nói nghiêm túc. Giao dịch pháp lý đó vô hiệu (nichtig).","ar":"صفقة المزاح: كلاهما يعلم أن الأمر غير جدّي. التصرف القانوني باطل."},"„Haha, genau! Die Cola nehm ich aber trotzdem.“":{"tr":"„Haha, aynen! Ama kolayı yine de alırım.“","vi":"„Ha ha, đúng rồi! Nhưng tôi vẫn lấy lon cola nhé.“","ar":"„هاها، بالضبط! لكنني سآخذ الكولا مع ذلك.“"},"„Anfechten? Für einen Witz?“":{"tr":"„İptal mi? Bir şaka için mi?“","vi":"„Hủy bỏ ư? Vì một trò đùa?“","ar":"„يُبطل؟ من أجل نكتة؟“"},"„Vergiss es! Das war ein Witz!“":{"tr":"„Boş ver! Şakaydı!“","vi":"„Quên đi! Đó chỉ là chuyện đùa!“","ar":"„انسَ الأمر! كانت نكتة!“"},"Anpreisung (kein Angebot) Schaufenster, Regal, Prospekt, Onlineshop richten sich an alle. Sie sind eine Aufforderung, ein Angebot abzugeben.":{"tr":"Övme (Anpreisung, teklif değil): Vitrin, raf, broşür, online mağaza herkese yöneliktir. Bunlar bir teklif vermeye davettir.","vi":"Quảng cáo giới thiệu (Anpreisung, không phải báo giá): Tủ kính, kệ hàng, tờ rơi, cửa hàng online hướng đến mọi người. Đó là lời mời đưa ra một đề nghị (Angebot).","ar":"دعاية (وليست عرضاً): واجهة المحل والرف والنشرة والمتجر الإلكتروني موجّهة للجميع. إنها دعوة لتقديم عرض."},"„Das ist fair. Danke!“":{"tr":"„Bu adil. Teşekkürler!“","vi":"„Thế là công bằng. Cảm ơn!“","ar":"„هذا عادل. شكراً!“"},"„Rechtlich vielleicht. Aber nett ist das nicht.“":{"tr":"„Hukuken belki. Ama bu hoş değil.“","vi":"„Có thể đúng về pháp lý. Nhưng như vậy không tử tế.“","ar":"„ربما قانونياً. لكن هذا ليس لطيفاً.“"},"„Na dann – her damit.“":{"tr":"„O zaman – verin bakalım.“","vi":"„Vậy thì đưa đây.“","ar":"„حسناً إذن – هاتِ الشاحن.“"},"Antrag und Annahme an der Kasse Antrag: Kunde legt die Ware aufs Band. Annahme: Kassenkraft scannt und nennt den Preis.":{"tr":"Kasada teklif (Antrag) ve kabul (Annahme): Teklif: Müşteri malı banda koyar. Kabul: Kasiyer okutur ve fiyatı söyler.","vi":"Đề nghị (Antrag) và chấp nhận (Annahme) tại quầy thu ngân: Đề nghị: khách đặt hàng lên băng chuyền. Chấp nhận: nhân viên thu ngân quét mã và nói giá.","ar":"الإيجاب والقبول عند الصندوق: الإيجاب: الزبون يضع البضاعة على السير. القبول: موظفة الصندوق تمسح البضاعة وتذكر السعر."},"„Ach so. Okay, ich bin in 10 Minuten zurück.“":{"tr":"„Ha, öyle mi. Tamam, 10 dakika içinde dönerim.“","vi":"„À ra vậy. Được, 10 phút nữa tôi quay lại.“","ar":"„آها. حسناً، سأعود بعد 10 دقائق.“"},"„Gut, dann tschüss!“":{"tr":"„İyi, o zaman hoşça kal!“","vi":"„Vậy thì thôi, tạm biệt!“","ar":"„جيد، إذن وداعاً!“"},"„Echt? Schon da?“":{"tr":"„Gerçekten mi? Zaten oluştu mu?“","vi":"„Thật à? Đã có rồi sao?“","ar":"„حقاً؟ موجود منذ ذلك الحين؟“"},"Freizeichnungsklausel „freibleibend“, „unverbindlich“, „solange der Vorrat reicht“: Das Angebot ist unverbindlich. Erst die Auftragsbestätigung macht den Vertrag.":{"tr":"Bağlayıcılığı kaldıran madde (Freizeichnungsklausel): „freibleibend“ (değişikliğe açık), „unverbindlich“ (bağlayıcı değil), „solange der Vorrat reicht“ (stok bitene kadar): Teklif bağlayıcı değildir. Sözleşmeyi ancak sipariş onayı (Auftragsbestätigung) oluşturur.","vi":"Điều khoản miễn ràng buộc (Freizeichnungsklausel): „freibleibend“ (không ràng buộc), „unverbindlich“ (không ràng buộc), „solange der Vorrat reicht“ (còn hàng là còn bán): báo giá không có tính ràng buộc. Chỉ khi có xác nhận đơn hàng thì mới có hợp đồng.","ar":"بند عدم الالتزام بالعرض (Freizeichnungsklausel): „freibleibend“ (غير ملزم)، „unverbindlich“ (غير مُلزِم)، „solange der Vorrat reicht“ (حتى نفاد الكمية): العرض غير مُلزِم. فقط تأكيد الطلب (Auftragsbestätigung) ينشئ العقد."},"„Richtig. Das Angebot war ja unverbindlich.“":{"tr":"„Doğru. Çünkü satış teklifi bağlayıcı değildi.“","vi":"„Đúng. Vì báo giá không có tính ràng buộc.“","ar":"„صحيح. فالعرض كان غير مُلزِم.“"},"„Fast. Aber war das Angebot verbindlich?“":{"tr":"„Neredeyse. Ama satış teklifi bağlayıcı mıydı?“","vi":"„Gần đúng. Nhưng báo giá có ràng buộc không?“","ar":"„تقريباً. لكن هل كان العرض مُلزِماً؟“"},"„Lieferung? Da war der Vertrag längst da.“":{"tr":"„Teslimat mı? O zaman sözleşme çoktan oluşmuştu.“","vi":"„Giao hàng ư? Lúc đó hợp đồng đã có từ lâu rồi.“","ar":"„التسليم؟ كان العقد موجوداً قبل ذلك بوقت طويل.“"},"Pflichten aus dem Kaufvertrag Verkäufer: Ware mangelfrei und rechtzeitig übergeben, Eigentum verschaffen, Kaufpreis annehmen. Käufer: Kaufpreis bezahlen, Ware abnehmen.":{"tr":"Satış sözleşmesinden doğan yükümlülükler: Satıcı: Malı kusursuz ve zamanında teslim etmek, mülkiyeti geçirmek, satış bedelini kabul etmek. Alıcı: Satış bedelini ödemek, malı teslim almak.","vi":"Nghĩa vụ theo hợp đồng mua bán: Người bán: giao hàng không có lỗi và đúng hạn, chuyển quyền sở hữu, nhận tiền mua hàng. Người mua: trả tiền mua hàng, nhận hàng.","ar":"الواجبات الناشئة عن عقد البيع: البائع: تسليم البضاعة خالية من العيوب وفي الوقت المناسب، ونقل الملكية، وقبول الثمن. المشتري: دفع الثمن (Kaufpreis) واستلام البضاعة."},"„Genau. Und der Großhändler liefert mangelfrei.“":{"tr":"„Aynen. Toptancı da kusursuz teslim eder.“","vi":"„Chính xác. Và nhà bán buôn giao hàng không có lỗi.“","ar":"„بالضبط. وتاجر الجملة يسلّم بضاعة خالية من العيوب.“"},"„Und wer nimmt den Lkw in Empfang?“":{"tr":"„Peki kamyonu kim karşılayacak?“","vi":"„Vậy ai sẽ nhận chiếc xe tải?“","ar":"„ومن سيستقبل الشاحنة؟“"},"„Das ist doch Sache des Großhändlers!“":{"tr":"„Bu toptancının işi değil mi!“","vi":"„Đó là việc của nhà bán buôn mà!“","ar":"„هذا شأن تاجر الجملة!“"},"Arten des Kaufvertrags Bürgerlicher Kauf: privat ↔ privat. Einseitiger Handelskauf: Unternehmen → Privatperson. Zweiseitiger Handelskauf: Unternehmen ↔ Unternehmen.":{"tr":"Satış sözleşmesi türleri: Medeni satış (bürgerlicher Kauf): özel kişi ↔ özel kişi. Tek taraflı ticari satış (einseitiger Handelskauf): işletme → özel kişi. İki taraflı ticari satış (zweiseitiger Handelskauf): işletme ↔ işletme.","vi":"Các loại hợp đồng mua bán: Mua bán dân sự (bürgerlicher Kauf): cá nhân ↔ cá nhân. Mua bán thương mại một phía (einseitiger Handelskauf): doanh nghiệp → cá nhân. Mua bán thương mại hai phía (zweiseitiger Handelskauf): doanh nghiệp ↔ doanh nghiệp.","ar":"أنواع عقد البيع: البيع المدني (bürgerlicher Kauf): فرد ↔ فرد. البيع التجاري من طرف واحد: شركة → فرد. البيع التجاري من طرفين: شركة ↔ شركة."},"„Ich bin ganz privat hier, ja!“":{"tr":"„Ben buraya tamamen özel olarak geldim, evet!“","vi":"„Tôi đến đây hoàn toàn với tư cách cá nhân, đúng vậy!“","ar":"„أنا هنا بصفتي الشخصية تماماً، نعم!“"},"„Ich bin doch keine Firma!“":{"tr":"„Ben şirket değilim ki!“","vi":"„Tôi đâu phải công ty!“","ar":"„لكنني لست شركة!“"},"„Hm, ihr seid doch ein Geschäft, oder?“":{"tr":"„Hmm, siz bir işletmesiniz, değil mi?“","vi":"„Ừm, các bạn là một cửa hàng mà, đúng không?“","ar":"„همم، أنتم متجر، أليس كذلك؟“"},"Besitz und Eigentum Besitz = tatsächliche Herrschaft: Wer hat die Sache? Eigentum = rechtliche Herrschaft: Wem gehört die Sache?":{"tr":"Zilyetlik (Besitz) ve mülkiyet (Eigentum): Zilyetlik (Besitz) = fiilî hâkimiyet: Şey kimde? Mülkiyet (Eigentum) = hukuki hâkimiyet: Şey kimin?","vi":"Sự chiếm hữu (Besitz) và quyền sở hữu (Eigentum): Chiếm hữu (Besitz) = quyền kiểm soát thực tế: ai đang giữ vật? Sở hữu (Eigentum) = quyền kiểm soát pháp lý: vật thuộc về ai?","ar":"الحيازة والملكية: الحيازة (Besitz) = السيطرة الفعلية: من لديه الشيء؟ الملكية (Eigentum) = السيطرة القانونية: لمن يعود الشيء؟"},"„Stimmt, gemietet heißt nicht gekauft.“":{"tr":"„Doğru, kiralamak satın almak demek değildir.“","vi":"„Đúng, thuê không có nghĩa là mua.“","ar":"„صحيح، مستأجرة لا تعني مشتراة.“"},"„Hä? Dann dürfen wir sie mitnehmen?“":{"tr":"„Ne? O zaman götürebilir miyiz?“","vi":"„Hả? Vậy chúng ta được mang đi à?“","ar":"„ماذا؟ إذن يحق لنا أن نأخذها؟“"},"„Super, ab in den Wagen!“":{"tr":"„Süper, arabaya!“","vi":"„Tuyệt, đưa lên xe thôi!“","ar":"„رائع، إلى السيارة!“"},"Gestohlene Sachen An gestohlenen Sachen kann man kein Eigentum erwerben – auch nicht, wenn man nichts vom Diebstahl wusste.":{"tr":"Çalıntı eşyalar: Çalıntı eşyalar üzerinde mülkiyet kazanılamaz – hırsızlıktan haberi olmasa bile.","vi":"Đồ bị đánh cắp: Với đồ bị đánh cắp, người ta không thể có được quyền sở hữu – kể cả khi không biết gì về vụ trộm.","ar":"الأشياء المسروقة: لا يمكن اكتساب ملكية الأشياء المسروقة – حتى لو لم يكن الشخص يعلم بالسرقة."},"„Hm. Dann sind die 150 € wohl weg.“":{"tr":"„Hmm. O zaman 150 € gitmiş.“","vi":"„Ừm. Vậy 150 € coi như mất rồi.“","ar":"„همم. إذن ضاعت الـ 150 € على ما يبدو.“"},"„Sag ich doch!“":{"tr":"„Ben de öyle diyorum!“","vi":"„Tôi đã nói mà!“","ar":"„هذا ما قلته!“"},"„Genau, ihr seid ja unschuldig.“":{"tr":"„Aynen, siz suçsuzsunuz.“","vi":"„Đúng, các bạn vô tội mà.“","ar":"„بالضبط، أنتم أبرياء.“"},"Eigentumsvorbehalt „Die Ware bleibt bis zur vollständigen Bezahlung unser Eigentum.“ Käufer = Besitzer, Verkäufer = Eigentümer.":{"tr":"Mülkiyetin saklı tutulması (Eigentumsvorbehalt): „Mal, tam ödemeye kadar bizim mülkiyetimizde kalır.“ Alıcı = zilyet (Besitzer), satıcı = mülk sahibi (Eigentümer).","vi":"Bảo lưu quyền sở hữu (Eigentumsvorbehalt): „Hàng vẫn là tài sản của chúng tôi cho đến khi thanh toán đầy đủ.“ Người mua = người chiếm hữu, người bán = chủ sở hữu.","ar":"الاحتفاظ بالملكية: „تبقى البضاعة ملكنا حتى الدفع الكامل.“ المشتري = الحائز، البائع = المالك."},"„Ganz genau. Und ich freu mich auf die Zahlung.“":{"tr":"„Aynen öyle. Ödemeyi bekliyorum.“","vi":"„Chính xác. Và tôi mong chờ khoản thanh toán.“","ar":"„بالضبط. وأنا أتطلع إلى الدفع.“"},"„Ohne Vorbehalt ja – aber wir haben einen vereinbart!“":{"tr":"„Saklı tutma olmasaydı evet – ama biz bir tane kararlaştırdık!“","vi":"„Nếu không có bảo lưu thì đúng – nhưng chúng ta đã thỏa thuận có bảo lưu!“","ar":"„بدون الشرط نعم – لكننا اتفقنا على شرط!“"},"„Besitzer? Die Shirts liegen doch bei euch!“":{"tr":"„Zilyet mi? Tişörtler sizde duruyor ya!“","vi":"„Người chiếm hữu? Áo thun đang ở chỗ các bạn mà!“","ar":"„حائزون؟ القمصان عندكم!“"},"Datum des Eigentumsübergangs Ohne Eigentumsvorbehalt: Tag der Lieferung. Mit Eigentumsvorbehalt: Tag der vollständigen Zahlung.":{"tr":"Mülkiyetin geçiş tarihi: Eigentumsvorbehalt (mülkiyetin saklı tutulması) olmadan: teslimat günü. Mülkiyetin saklı tutulması ile: tam ödeme günü.","vi":"Ngày chuyển quyền sở hữu: Không có Eigentumsvorbehalt (bảo lưu quyền sở hữu): ngày giao hàng. Có Eigentumsvorbehalt: ngày thanh toán đầy đủ.","ar":"تاريخ انتقال الملكية: بدون Eigentumsvorbehalt (الاحتفاظ بالملكية): يوم التسليم. مع الاحتفاظ بالملكية: يوم الدفع الكامل."},"„Richtig. Der Eigentumsvorbehalt gilt bis zur Zahlung.“":{"tr":"„Doğru. Mülkiyetin saklı tutulması ödemeye kadar geçerlidir.“","vi":"„Đúng. Eigentumsvorbehalt (bảo lưu quyền sở hữu) có hiệu lực cho đến khi thanh toán.“","ar":"„صحيح. الاحتفاظ بالملكية ساري حتى الدفع.“"},"„Ohne Vorbehalt stimmt das. Lies die AGB!“":{"tr":"„Saklı tutma olmadan bu doğrudur. AGB'yi (genel işlem koşulları) oku!“","vi":"„Nếu không có bảo lưu thì đúng. Hãy đọc AGB (điều khoản kinh doanh chung)!“","ar":"„هذا صحيح بدون احتفاظ بالملكية. اقرأ الشروط العامة (AGB)!“"},"„Wir haben doch bezahlt!“":{"tr":"„Ama biz ödedik!“","vi":"„Chúng tôi đã trả tiền rồi mà!“","ar":"„لكننا دفعنا!“"},"Tafel an der Kasse ab 16: Bier, Wein, Sekt, Mischgetränke mit Bier oder Wein ab 18: Branntwein (Schnaps, Wodka, Likör) und Mischgetränke damit, Lebensmittel mit Branntwein, Tabak, E-Zigaretten (auch ohne Nikotin), Feuerwerk F2":{"tr":"Kasadaki tabela – 16 yaşından itibaren: bira, şarap, köpüklü şarap, bira veya şarap içeren karışık içecekler – 18 yaşından itibaren: Branntwein (distile sert alkol: schnaps, votka, likör) ve bunlarla yapılan karışık içecekler, sert alkollü gıdalar, tütün, e-sigaralar (nikotinsiz de), havai fişek F2","vi":"Bảng ở quầy thu ngân – từ 16 tuổi: bia, rượu vang, rượu sâm panh, đồ uống pha với bia hoặc rượu vang – từ 18 tuổi: rượu mạnh (Branntwein: schnaps, vodka, rượu mùi) và đồ uống pha với rượu mạnh, thực phẩm có rượu mạnh, thuốc lá, thuốc lá điện tử (cả loại không nicotin), pháo hoa loại F2","ar":"لوحة عند صندوق الدفع – من سن 16: البيرة، النبيذ، الشمبانيا (Sekt)، المشروبات المخلوطة بالبيرة أو النبيذ – من سن 18: المشروبات الروحية القوية (Branntwein) مثل الشنابس والفودكا والليكور والمشروبات المخلوطة بها، الأطعمة المحتوية على Branntwein، التبغ، السجائر الإلكترونية (حتى بدون نيكوتين)، الألعاب النارية F2"}};</script>

    mode: { de: 'Lesemodus: Antippen übersetzt nur (Knöpfe sind gesperrt)', tr: 'Okuma modu: dokunma yalnızca çevirir (düğmeler kilitli)', vi: 'Chế độ đọc: chạm chỉ để dịch (nút bị khóa)', ar: 'وضع القراءة: اللمس للترجمة فقط (الأزرار مقفلة)' },
    none: { tr: '(Bu metin için çeviri yok)', vi: '(Chưa có bản dịch cho đoạn này)', ar: '(لا توجد ترجمة لهذا النص)' }
  };

  function textOf(el) {

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  /* ---------- Wörterbuch ---------- */
  var EX = Object.create(null), TPL = [];
  Object.keys(DATA).forEach(function (key) {
    var v = DATA[key], k = norm(key);
    if (/\{\d+\}/.test(k)) {

      var re = new RegExp('^' + parts.map(function (p) { return p.replace(/[.*+?^$()|[\]\\{}]/g, '\\$&'); }).join('(.+?)') + '$');
      TPL.push({ re: re, nums: nums, v: v, len: k.length });

  });
  TPL.sort(function (a, b) { return b.len - a.len; });
  var CACHE = {}, CN = 0;
  function compose(k, lang) {   // Satz aus mehreren bekannten Teilen (z. B. Gesprächsbausteine) mit „…“ für leere Felder
    if (!/^[„…]/.test(k)) return null;
    var w = k.split(' '), memo = {};
    function go(i) {
      if (i === w.length) return [];
