<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deichbeat Festival-Kasse</title>
<style>
/* Layout: eine Spalte wie ein Festival-Handy-Ticket – Armband oben, Szene, dann die Karte mit der Entscheidung. */
:root{
  --bg:#E8EFF1; --surface:#FFFFFF; --surface2:#F3F7F8; --ink:#15202A; --muted:#556371; --line:#D2DCE1;
  --accent:#E4572E; --accent-ink:#FFFFFF; --teal:#1F8A8A; --gold:#E9A21F;
  --good:#22804F; --mid:#B07A0C; --bad:#B8362A; --goodbg:#E2F2E9; --midbg:#FBF0D6; --badbg:#F8E0DC;
  --display:"Bungee", "Arial Black", Impact, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#17212A; --surface2:#1E2A34; --ink:#E8EEF2; --muted:#9DAAB5; --line:#2C3A45;
  --accent:#FF7448; --accent-ink:#1A0C06; --teal:#4DB8B3; --gold:#F5C25A;
  --good:#5CC88A; --mid:#E7B04A; --bad:#F27D6D; --goodbg:#16302A; --midbg:#33290F; --badbg:#3A1D1A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#17212A; --surface2:#1E2A34; --ink:#E8EEF2; --muted:#9DAAB5; --line:#2C3A45;
  --accent:#FF7448; --accent-ink:#1A0C06; --teal:#4DB8B3; --gold:#F5C25A;
  --good:#5CC88A; --mid:#E7B04A; --bad:#F27D6D; --goodbg:#16302A; --midbg:#33290F; --badbg:#3A1D1A; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.45; margin:0}
#app{max-width:640px; margin:0 auto; padding-inline:16px; padding-block:0 40px}
h1,h2,h3{text-wrap:balance; margin:0}
h1{font-family:var(--display); font-weight:400; font-size:clamp(28px,7vw,40px); line-height:1.05; letter-spacing:.01em}
h2{font-family:var(--display); font-weight:400; font-size:clamp(21px,5.2vw,26px); line-height:1.15}
h3{font-size:18px}
p{margin:0}
button{font:inherit; color:inherit}
.stack{display:flex; flex-direction:column; gap:14px}
.row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.muted{color:var(--muted)}
.small{font-size:15px}
.lbl{font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}

/* Festival-Armband */
.band{position:relative; margin-inline:-16px; padding:10px 16px 10px 52px; color:#fff;
  background:repeating-linear-gradient(-45deg, #D9482A 0 10px, #E4572E 10px 20px); display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:46px}
.band::before{content:""; position:absolute; left:14px; top:50%; width:24px; height:24px; transform:translateY(-50%); border-radius:5px; background:#F3F3F3; box-shadow:inset 0 0 0 4px #BDBDBD}
.band .bt{font-family:var(--display); font-size:14px; letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.band .bm{font-size:13px; font-weight:700; background:rgba(0,0,0,.22); padding:3px 9px; border-radius:99px; white-space:nowrap}

/* Szene */
.scene{margin-inline:-16px; line-height:0; border-bottom:3px solid var(--ink)}
.scene svg{width:100%; height:auto; display:block; max-height:230px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}
.crowd g{animation:bob 1.6s ease-in-out infinite}
.crowd g:nth-child(2n){animation-delay:.4s}.crowd g:nth-child(3n){animation-delay:.9s}
.beam{animation:glow 2.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){ .crowd g,.beam{animation:none} *{transition:none!important} }

/* HUD */
.hud{display:grid; grid-template-columns:1fr auto; gap:6px 14px; align-items:center; padding:12px 0 4px}
.meter{height:12px; border-radius:99px; background:var(--surface2); border:1px solid var(--line); overflow:hidden}
.meter i{display:block; height:100%; background:linear-gradient(90deg,var(--teal),var(--gold)); transition:width .6s}
.hud .pts{font-variant-numeric:tabular-nums; font-weight:700; text-align:right}
.lineup{display:flex; gap:4px; padding:4px 0 10px; overflow-x:auto}
.lineup span{flex:1 0 auto; min-width:26px; text-align:center; font-size:12px; font-weight:700; padding:3px 4px; border-radius:6px; background:var(--surface2); color:var(--muted); border:1px solid var(--line)}
.lineup span.done{background:var(--teal); color:#fff; border-color:transparent}
.lineup span.now{background:var(--accent); color:var(--accent-ink); border-color:transparent}

/* Karten */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px}
.tag{display:inline-flex; gap:6px; align-items:center; font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--accent)}
.slot{font-family:var(--display); font-size:13px; background:var(--ink); color:var(--bg); padding:3px 8px; border-radius:6px; letter-spacing:.05em}

/* Buttons */
.btn{display:inline-flex; justify-content:center; align-items:center; gap:8px; min-height:52px; padding:12px 20px; border-radius:12px; border:2px solid var(--ink);
  background:var(--ink); color:var(--bg); font-weight:700; font-size:17px; cursor:pointer; text-align:center}
.btn.alt{background:transparent; color:var(--ink)}
.btn.hot{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.wide{width:100%}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.chip:focus-visible,.bonl:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.linkbtn{background:none; border:0; padding:6px 0; color:var(--muted); text-decoration:underline; cursor:pointer; font-size:15px}

/* Optionen */
.opts{display:flex; flex-direction:column; gap:10px}
.opt{display:grid; grid-template-columns:30px 1fr; gap:10px; align-items:start; text-align:left; width:100%; padding:14px; border-radius:12px; border:2px solid var(--line); background:var(--surface); cursor:pointer; font-size:17px; line-height:1.35}
.opt .k{width:30px; height:30px; border-radius:8px; display:grid; place-items:center; font-weight:700; background:var(--surface2); border:1px solid var(--line)}
.opt.sel{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset}
.opt.sel .k{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.opt.r2{border-color:var(--good); background:var(--goodbg)} .opt.r1{border-color:var(--mid); background:var(--midbg)} .opt.r0{border-color:var(--bad); background:var(--badbg)}
.opt.gone{opacity:.35; text-decoration:line-through; pointer-events:none}
.opt:disabled{cursor:default; color:inherit}

/* Persona */
.who{display:grid; grid-template-columns:76px 1fr; gap:12px; align-items:center}
.who svg{width:76px; height:76px}
.who b{display:block; font-size:18px}
.bubble{position:relative; background:var(--surface2); border:2px solid var(--ink); border-radius:16px; padding:12px 14px; font-size:17px}
.bubble::before{content:""; position:absolute; left:26px; top:-11px; width:18px; height:18px; background:var(--surface2); border-left:2px solid var(--ink); border-top:2px solid var(--ink); transform:rotate(45deg)}
.sit{font-size:18px}
.res{display:inline-flex; align-items:center; gap:8px; font-weight:700; padding:6px 12px; border-radius:99px}
.res.r2{background:var(--goodbg); color:var(--good)} .res.r1{background:var(--midbg); color:var(--mid)} .res.r0{background:var(--badbg); color:var(--bad)}
.term{border-left:6px solid var(--teal); background:var(--surface2); border-radius:0 12px 12px 0; padding:12px 14px}
.term b{color:var(--teal)}
.words{display:flex; flex-wrap:wrap; gap:6px}
.words span{background:var(--surface2); border:1px solid var(--line); border-radius:99px; padding:3px 10px; font-size:15px}

/* Kacheln Start */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
.tile{display:flex; flex-direction:column; gap:4px; text-align:left; padding:14px; border-radius:12px; border:2px solid var(--line); background:var(--surface); cursor:pointer; min-height:92px}
.tile svg{width:34px; height:34px}
.tile b{font-size:17px} .tile span{font-size:14px; color:var(--muted)}
.tile.on{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent) inset}
input[type=text]{width:100%; min-height:52px; padding:12px 14px; border-radius:12px; border:2px solid var(--line); background:var(--surface); font:inherit; color:var(--ink)}
input[type=text]:focus{outline:3px solid var(--gold); border-color:var(--ink)}
.prog{display:grid; gap:4px}
.note{font-size:15px; color:var(--muted); background:var(--surface2); border-radius:10px; padding:10px 12px}

/* Mini-Spiele */
.chips{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px}
.chip{min-height:52px; padding:10px; border-radius:12px; border:2px solid var(--line); background:var(--surface); cursor:pointer; font-weight:700; font-size:16px}
.chip.ok{border-color:var(--good); background:var(--goodbg); color:var(--good)} .chip.no{border-color:var(--bad); background:var(--badbg); color:var(--bad)}
.chip.amp-n{border-color:#C0392B} .chip.amp-s{border-color:#D4A017} .chip.amp-g{border-color:#2E8B57}
.dot{display:inline-block; width:14px; height:14px; border-radius:50%; vertical-align:-2px; margin-right:6px}
.fb{border-radius:12px; padding:10px 14px; font-size:16px}
.fb.ok{background:var(--goodbg); color:var(--ink); border-left:6px solid var(--good)} .fb.no{background:var(--badbg); color:var(--ink); border-left:6px solid var(--bad)}
.bon{font-family:"Courier New", ui-monospace, monospace; background:#FFFDF6; color:#222; border-radius:6px; padding:12px 8px; box-shadow:0 2px 0 #ccc; max-width:360px; margin:0 auto; width:100%}
.bonl{display:block; width:100%; text-align:left; background:none; border:0; border-radius:4px; padding:3px 6px; font:inherit; font-size:14px; color:#222; cursor:pointer; white-space:pre-wrap}
.bonl:hover{background:#F1ECD9}
.bonl.ok{background:#CDEBD7} .bonl.no{background:#F6CFC9}
.seq{display:flex; flex-direction:column; gap:8px}
.seq .placed{padding:10px 12px; border-radius:10px; background:var(--goodbg); border-left:6px solid var(--good); font-size:16px}
.shake{animation:shake .35s} @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.calc{display:flex; flex-direction:column; gap:12px; font-variant-numeric:tabular-nums}
.crow{display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:center; border-bottom:1px solid var(--line); padding-bottom:10px}
.crow:last-child{border-bottom:0; padding-bottom:0}
.crow .t{grid-column:1/-1}
.calc .v{text-align:right; font-weight:700; white-space:nowrap}
.pm{display:flex; gap:6px}
.pm button{width:46px; min-height:44px; border-radius:10px; border:2px solid var(--line); background:var(--surface); font-weight:700; font-size:20px; cursor:pointer}
.pm button.on{border-color:var(--accent); background:var(--accent); color:var(--accent-ink)}
.tl{display:flex; flex-direction:column; gap:6px; border-left:4px solid var(--line); margin-left:8px; padding-left:12px}
.tl button{display:grid; grid-template-columns:96px 1fr; gap:8px; text-align:left; padding:10px; border-radius:10px; border:2px solid var(--line); background:var(--surface); cursor:pointer; font-size:16px}
.tl button b{font-variant-numeric:tabular-nums}
.tl button.ok{border-color:var(--good); background:var(--goodbg)} .tl button.no{border-color:var(--bad); background:var(--badbg)}

/* Auswertung */
.score{background:var(--ink); color:var(--bg); border-radius:18px; padding:20px; display:grid; gap:10px; text-align:center}
.score .big{font-family:var(--display); font-size:44px; line-height:1}
.stars{display:flex; justify-content:center; gap:6px} .stars svg{width:40px; height:40px}
.kv{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; font-size:14px}
.kv div{background:rgba(127,127,127,.18); border-radius:10px; padding:8px 4px} .kv b{display:block; font-size:18px; font-variant-numeric:tabular-nums}
.vs{display:grid; gap:8px}
.vs .r{display:grid; grid-template-columns:92px 1fr 44px; gap:8px; align-items:center; font-size:15px; text-align:left}
.ev{display:grid; gap:10px}
.evhead{display:grid; grid-template-columns:52px 1fr; gap:12px; align-items:center}
.evhead svg{width:52px; height:52px}
.review{display:grid; gap:10px}
.rv{border-left:6px solid var(--line); padding:8px 0 8px 12px; display:grid; gap:4px}
.rv.r2{border-color:var(--good)} .rv.r1{border-color:var(--mid)} .rv.r0{border-color:var(--bad)}
.rv .ihk{font-size:15px; background:var(--surface2); border-radius:8px; padding:8px 10px}
details summary{cursor:pointer; font-weight:700; padding:8px 0}
.toast{position:fixed; left:50%; bottom:calc(16px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:15px; max-width:90vw; z-index:9}
.phone{background:var(--surface2); border:1px solid var(--line); border-radius:18px; padding:12px; display:grid; gap:8px}
.vm{display:grid; grid-template-columns:44px 1fr; gap:10px; align-items:center}
.vm .wave{height:22px; background:repeating-linear-gradient(90deg,var(--teal) 0 3px,transparent 3px 6px); border-radius:4px; opacity:.7}

.mus{display:grid; place-items:center; width:36px; height:36px; border-radius:10px; border:0; background:rgba(0,0,0,.22); color:#fff; cursor:pointer; padding:0}
.mus svg{width:22px; height:22px}
.mus:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<script>
// ===================== DATEN TEIL 1: Kapitel 1–5 (Block A) =====================
// s: 2 = beste Wahl, 1 = teilweise, 0 = falsch. say = Reaktion der Person, why = Begründung (Auswertung)
// look: s Hautton 1–4, h Haarfarbe, st Frisur (kurz|lang|zopf|cap|locken|glatze|dutt), c Shirtfarbe, a Alter (k|t|e|o)
const CH = [
{ id:"k1", mod:1, day:"FR", time:"14:00", title:"Die Kasse steht noch nicht", topic:"Die Kasse und der Kassenbon",
  story:"Freitag, 14 Uhr. In zwei Stunden öffnet das Deichbeat-Festival. Euer Stand steht, die Kasse noch nicht. Jana ruft an: „Ich stecke mit dem Lieferwagen im Stau. Ihr baut die Kasse auf. Ich verlasse mich auf euch!“",
  words:["das Kassensystem","der Scanner","der Bondrucker","das Kartenterminal","die GTIN","das Warenwirtschaftssystem (WWS)","der Artikelstamm","die TSE","die Belegausgabepflicht","der Kassenbon","stornieren"],
  decs:[
   [ {id:"k1d1a", who:{n:"Kevin Zack", d:"Chef der Snackbude Zack nebenan", look:{s:1,h:"#C9A24A",st:"cap",c:"#8E44AD",a:"e"}},
      sit:"Im Lieferwagen liegen eine Scannerkasse mit Verbindung zum Warenwirtschaftssystem und eine alte Kasse ohne Scanner. Kevin von nebenan ruft: „Nehmt doch eine Geldkassette, das geht am schnellsten!“",
      q:"Womit kassiert ihr?",
      opts:[
       {t:"Scannerkasse mit Scanner, Bondrucker und Kartenterminal aufbauen.", s:2, say:"Hm. Sieht professionell aus. Mal sehen, ob ihr schneller seid als ich.", why:"Die Scannerkasse kassiert schnell und fehlerfrei. Jeder Verkauf wird artikelgenau erfasst, der Lagerbestand wird automatisch fortgeschrieben."},
       {t:"Die alte Kasse nehmen und alle Preise per Hand eintippen.", s:1, say:"Ha, viel Spaß beim Tippen bei 40.000 Gästen!", why:"Das geht, ist aber langsam und es gibt Tippfehler. Es fehlen genaue Verkaufsdaten für die Nachbestellung."},
       {t:"Geldkassette nehmen. Bons gibt es dann eben nicht.", s:0, say:"Genau so mach ich das auch. Wer braucht schon Bons?", why:"Seit 2020 gilt die Belegausgabepflicht: Jeder Kunde bekommt einen Beleg. Elektronische Kassen brauchen eine TSE."}],
      term:"Scannerkasse (POS-System)", def:"Elektronische Kasse, die mit dem Warenwirtschaftssystem verbunden ist. POS = Point of Sale = Ort des Verkaufs.",
      ihk:"Vorteile der Scannerkasse: schnelle und genaue Erfassung der Verkaufsdaten, genaue Fortschreibung des Lagerbestands, schnelles und fehlerfreies Kassieren.",
      weil:["…weil jeder Verkauf artikelgenau erfasst und der Lagerbestand automatisch fortgeschrieben wird.","…weil es mit einer Scannerkasse keine Kassendifferenzen mehr geben kann.","…weil man mit einer Scannerkasse keine Inventur mehr machen muss."]},
     {id:"k1d1b", who:{n:"Ole Brodersen", d:"Festivalleiter", look:{s:2,h:"#6B6B6B",st:"glatze",c:"#2C3E50",a:"o"}},
      sit:"Ole Brodersen von der Festivalleitung kommt vorbei: „Wasser kostet auf dem ganzen Gelände 2,50 € statt 2,00 €. Bitte sofort ändern!“ 300 Flaschen sind schon im Kühlschrank.",
      q:"Wie ändert ihr den Preis?",
      opts:[
       {t:"Den Preis einmal zentral im Artikelstamm ändern und das Preisschild am Stand tauschen.", s:2, say:"Das ging ja fix. Sehr gut!", why:"Der Scanner liest die GTIN. Die Kasse holt den Preis aus dem Artikelstamm (Price-Look-Up). Eine Änderung im System reicht."},
       {t:"Alle 300 Flaschen mit neuen Preisetiketten bekleben.", s:1, say:"Das dauert ja ewig. Gleich ist Einlass!", why:"Das ist unnötige Arbeit. Die Kasse liest den Preis nicht vom Etikett, sondern holt ihn über die GTIN aus dem System."},
       {t:"Nichts ändern. An der Kasse tippt ihr jedes Mal 0,50 € dazu.", s:0, say:"Und wenn ihr das vergesst? Das wird Chaos!", why:"So entstehen Fehler und falsche Verkaufsdaten. Preise werden zentral im System geändert."}],
      term:"GTIN und Price-Look-Up (PLU)", def:"Die GTIN ist die 13-stellige Artikelnummer unter dem Strichcode. Beim Scannen holt die Kasse damit den Preis aus dem Artikelstamm.",
      ihk:"Nutzen der GTIN: schnelleres und fehlerfreies Kassieren, bessere Bestandserfassung, zentrale Preisänderung.",
      weil:["…weil die Kasse den Preis über die GTIN aus dem Artikelstamm holt.","…weil der Preis direkt in der GTIN steht.","…weil die TSE alle Preise automatisch anpasst."]} ],
   [ {id:"k1d2a", who:{n:"Paul", d:"Gast, kauft eine Cola", look:{s:1,h:"#3B2A1E",st:"locken",c:"#27AE60",a:"t"}},
      sit:"Paul kauft eine Cola. Er winkt ab: „Den Bon brauch ich nicht, schmeiß weg!“ Nebenan bei Kevin gibt es gar keine Bons: „Spart Papier!“",
      q:"Was macht ihr mit dem Bon?",
      opts:[
       {t:"Den Bon trotzdem ausgeben: „Ihr Bon – Sie müssen ihn nicht mitnehmen.“", s:2, say:"Ah, okay. Dann leg ich ihn halt in den Müll da.", why:"Seit 2020 gilt die Belegausgabepflicht. Der Betrieb muss einen Beleg ausgeben (Papier oder E-Bon). Der Kunde muss ihn aber nicht mitnehmen."},
       {t:"Wenn der Gast keinen Bon will, wird auch keiner erstellt.", s:0, say:"Cool, geht schneller.", why:"Das verstößt gegen die Belegausgabepflicht. Jeder Verkauf bekommt einen Beleg."},
       {t:"Bons nur bei Kartenzahlung drucken, bei Bargeld nicht.", s:0, say:"Okay … komisches System.", why:"Die Belegausgabepflicht gilt für jede Zahlungsart, auch bei Bargeld."}],
      term:"Belegausgabepflicht", def:"Seit 2020 bekommt jeder Kunde einen Beleg, auf Papier oder elektronisch (E-Bon). Er muss ihn nicht mitnehmen.",
      ihk:"Belegausgabepflicht seit 2020: Jeder Kunde bekommt einen Beleg, auf Papier oder elektronisch (E-Bon).",
      weil:["…weil seit 2020 jeder Kunde einen Beleg bekommt – mitnehmen muss er ihn aber nicht.","…weil der Kunde den Bon immer mitnehmen muss.","…weil auf dem Bon der Einkaufspreis des Geschäfts steht."]},
     {id:"k1d2b", who:{n:"Lina", d:"eure Kollegin an Kasse 2", look:{s:3,h:"#1E1410",st:"zopf",c:"#E4572E",a:"t"}},
      sit:"Lina hat aus Versehen 3 Sonnencremes statt 1 eingescannt. Der Bon ist schon gedruckt. Sie flüstert: „Ich zerreiß den einfach.“",
      q:"Was sagt ihr Lina?",
      opts:[
       {t:"„Den Fehler stornieren und den falschen Bon aufbewahren.“", s:2, say:"Okay, Storno … und der Bon kommt in die Kassenschublade. Danke!", why:"Ein Tippfehler wird storniert. Der falsche Bon wird aufbewahrt, weil er für die Kassenabrechnung gebraucht wird."},
       {t:"„Zerreiß ihn und tipp den Einkauf einfach neu.“", s:0, say:"Gut, weg damit.", why:"Ohne Storno stimmt die Kasse am Abend nicht. Die TSE hat den Vorgang gespeichert. Falsche Bons werden aufbewahrt."},
       {t:"„Lass es so. Am Abend fällt das schon auf.“", s:0, say:"Hm, dann zahlt die Kundin aber zu viel …", why:"Die Kundin würde zu viel bezahlen. Fehler werden sofort storniert."}],
      term:"Storno", def:"Ein falsch erfasster Artikel wird in der Kasse rückgängig gemacht. Der falsche Bon wird aufbewahrt.",
      ihk:"Ein Tippfehler wird storniert; der falsche Bon wird aufbewahrt, weil er für die Kassenabrechnung gebraucht wird.",
      weil:["…weil der falsche Bon für die Kassenabrechnung gebraucht wird.","…weil man Umsätze in der Kasse einfach löschen darf.","…weil die Kundin den falschen Bon behalten muss."]} ] ],
  mini:"bon",
  profi:[
   {id:"p1a", q:"Seit 2020 braucht jede elektronische Kasse eine TSE. Welches Problem will der Staat damit lösen?", opts:["Niemand soll Umsätze nachträglich löschen oder ändern können – das verhindert Steuerbetrug.","Die Kasse soll schneller drucken.","Kunden sollen keinen Bon mehr brauchen."]},
   {id:"p1b", q:"Viele Gäste lassen den Bon liegen. Welche Lösung schont die Umwelt und hält die Pflicht ein?", opts:["Einen elektronischen Bon (E-Bon) per App oder QR-Code anbieten.","Gar keine Bons mehr ausgeben.","Bons nur an Stammkunden ausgeben."]} ] },

  words:["die Kassieranweisung","das Wechselgeld","einzählen","die Bonrolle","der Geldscheinhalter","vorzählen","das Rückgeld","der Blickkontakt","kundenorientiert","die Kundenbindung","der Zusatzartikel"],

       {t:"„Passt schon, ist doch Familie.“", s:0, say:"Super, dann bleibt alles hier liegen.", why:"Privates Geld an der Kasse führt zu Streit bei Kassendifferenzen. Familie kassiert eine andere Person ab."}],

      ihk:"Kassieranweisung: kein privates Geld im Kassenbereich · keine Familienangehörigen selbst abkassieren · Fehler stornieren und den falschen Bon aufbewahren.",
      weil:["…weil die Kassieranweisung privates Geld an der Kasse und das Abkassieren der eigenen Familie verbietet.","…weil Familienangehörige keinen Rabatt bekommen dürfen.","…weil privates Geld die TSE stört."]} ],
   [ {id:"k2d2a", who:{n:"Herr Demir", d:"Gast mit 50-€-Schein", look:{s:2,h:"#2B2B2B",st:"kurz",c:"#2980B9",a:"e"}},

       {t:"Schein prüfen und 36,60 € still in die Hand drücken.", s:1, say:"Äh … stimmt das jetzt? Ich zähl lieber nach.", why:"Der Betrag stimmt, aber das Rückgeld wird laut vorgezählt. So sieht der Kunde, dass alles passt."},
       {t:"Schein sofort in die Kasse legen und schnell 36,60 € rausgeben.", s:0, say:"Moment! Ich hab Ihnen doch einen Hunderter gegeben!", why:"Liegt der Schein schon in der Kasse, kann man nicht mehr zeigen, welcher Schein gegeben wurde."}],

     {id:"k2d2b", who:{n:"Frau Albers", d:"Mutter mit zwei Kindern", look:{s:1,h:"#A0522D",st:"dutt",c:"#16A085",a:"e"}},

       {t:"Freundlich grüßen und ihr noch drei Zusatzartikel anbieten.", s:1, say:"Nein danke, ich will nur schnell weiter …", why:"Freundlich ist gut. Zusatzangebote stören aber bei langer Schlange und wenn sie aufdringlich sind."},
       {t:"Schnell scannen, Betrag sagen, nächster Kunde.", s:0, say:"Na, gemütlich ist anders.", why:"Ohne Gruß und Blickkontakt fühlt sich die Kundin nicht wohl. Das schadet dem Image."}],

      weil:["…weil die Kasse der erste und letzte Eindruck ist und zufriedene Kunden wiederkommen.","…weil freundliche Kassenkräfte mehr Lohn bekommen.","…weil man ohne Begrüßung keinen Bon drucken darf."]} ] ],

  profi:[
   {id:"p2a", q:"An vielen Kassen sollen Zusatzartikel angeboten werden. Wann stören solche Angebote?", opts:["Bei langer Schlange, wenn sie aufdringlich sind oder nicht zum Einkauf passen.","Nie – Zusatzangebote freuen jeden Kunden.","Nur bei Kartenzahlung."]},
   {id:"p2b", q:"Ein Gast kauft für 89,75 € und zahlt mit 100 €. Wie zählst du richtig vor?", opts:["„89,75 … plus 25 Cent sind 90 Euro, plus 10 Euro sind 100 Euro. Bitte, 10,25 € zurück.“","„100 minus 89,75 macht 11,25 € zurück.“","„Hier sind 10,25 €.“ – ohne Vorzählen."]} ] },

{ id:"k3", mod:3, day:"FR", time:"22:00", title:"Headliner-Nacht", topic:"Bargeld und Falschgeld",
  story:"22 Uhr. Auf der Hauptbühne spielt der Headliner. Es ist dunkel und laut. Alle wollen schnell bezahlen – und genau jetzt kommen die schwierigen Fälle.",
  words:["das Bargeld","die Banknote","das Sicherheitsmerkmal","das Relief","das Wasserzeichen","der Sicherheitsfaden","das Hologramm","die Smaragdzahl","der Prüfstift","das Falschgeld","der Verdacht"],
  decs:[
   [ {id:"k3d1a", who:{n:"Junger Mann", d:"zahlt ein Wasser mit 100 €", look:{s:1,h:"#D4B26A",st:"kurz",c:"#34495E",a:"e"}},
      sit:"Ein junger Mann zahlt ein Wasser mit einem 100-€-Schein. Der Schein fühlt sich glatt an, fast wie Kopierpapier.",
      q:"Wie prüfst du den Schein?",
      opts:[
       {t:"Fühlen, gegen das Licht halten und kippen: Relief, Wasserzeichen, Sicherheitsfaden, Hologramm, Smaragdzahl.", s:2, say:"Ähm … ist irgendwas?", why:"Man prüft immer mehrere Merkmale mit Fühlen – Sehen – Kippen. Ein glattes Papier ist schon ein Warnzeichen."},
       {t:"Nur mit dem Prüfstift drüber. Wenn der nichts zeigt, ist alles gut.", s:1, say:"Na also, passt doch.", why:"Der Prüfstift prüft nur das Papier. Man muss immer mehrere Merkmale prüfen."},
       {t:"Im Dunkeln sieht man eh nichts. Einfach annehmen.", s:0, say:"Danke, schönen Abend noch!", why:"Gerade bei Hektik und Dunkelheit wird Falschgeld ausgegeben. Falschgeld wird ohne Ersatz eingezogen."}],
      term:"Fühlen – Sehen – Kippen", def:"Fühlen: Papier und Relief. Sehen (gegen das Licht): Wasserzeichen, Sicherheitsfaden, Porträtfenster. Kippen: Hologramm, Smaragdzahl.",
      ihk:"Sicherheitsmerkmale: Baumwollpapier, Relief, Sicherheitsfaden, Porträt-Wasserzeichen, Porträt-Hologramm, Porträtfenster, Smaragdzahl. Hilfsmittel: Prüfstift, UV-Lampe, Prüfgerät.",
      weil:["…weil man immer mehrere Merkmale prüfen muss – der Prüfstift prüft nur das Papier.","…weil ein einziges Merkmal immer ausreicht.","…weil die Bank Falschgeld sofort ersetzt."]},
     {id:"k3d1b", who:{n:"Frau Jansen", d:"Kundin mit 50-€-Schein", look:{s:2,h:"#8B5A2B",st:"lang",c:"#C0392B",a:"e"}},
      sit:"Du prüfst den 50-€-Schein von Frau Jansen. Sie sagt laut: „Das ist ja peinlich! Was sollen die Leute hinter mir denken? Vertrauen Sie mir etwa nicht?“",
      q:"Was sagst du?",
      opts:[
       {t:"„Das machen wir laut Kassieranweisung bei allen Kunden so. Das hat nichts mit Ihnen zu tun. Es dauert nur einen Moment.“", s:2, say:"Ach so, bei allen. Na gut, dann ist ja alles okay.", why:"Kunden empfinden die Prüfung manchmal als Misstrauen. Man erklärt freundlich, dass sie alle betrifft."},
       {t:"Nichts sagen und einfach weiter prüfen.", s:1, say:"Hallo? Ich rede mit Ihnen!", why:"Die Prüfung ist richtig, aber die Kundin braucht eine freundliche Erklärung."},
       {t:"„Bei Ihnen muss ich besonders aufpassen.“", s:0, say:"Wie bitte?! Das ist ja eine Frechheit!", why:"Das beschuldigt die Kundin. Man bleibt höflich und erklärt, dass man alle Scheine prüft."}],
      term:"Echtheitsprüfung erklären", def:"Freundlich sagen, dass alle Scheine geprüft werden. So fühlt sich niemand beschuldigt.",
      ihk:"„Aufgrund unserer Kassieranweisung muss ich bei allen Kunden den Schein auf Echtheit überprüfen. Das hat nichts mit Ihrer Person zu tun. Es dauert nur einen Moment.“",
      weil:["…weil Kunden die Prüfung als Misstrauen empfinden können – man erklärt, dass sie alle betrifft.","…weil Kunden die Prüfung verweigern dürfen.","…weil man nur verdächtige Kunden prüfen soll."]} ],
   [ {id:"k3d2a", who:{n:"Junger Mann", d:"wird nervös", look:{s:1,h:"#D4B26A",st:"kurz",c:"#34495E",a:"e"}},
      sit:"Der Schein ist eindeutig falsch: kein Hologramm, kein Wasserzeichen. Der Mann wird nervös: „Gib her, ich zahl mit was anderem.“",
      q:"Was tust du?",
      opts:[
       {t:"Ruhig bleiben, Schein nicht zurückgeben, Mann bitten zu warten, Jana anrufen.", s:2, say:"Ich … ähm … na gut, ich warte.", why:"Bei Verdacht: ruhig bleiben, Schein einbehalten, Vorgesetzte rufen, Kunden bitten zu warten. Die Polizei verständigt die Vorgesetzte."},
       {t:"Schein zurückgeben und einen anderen verlangen.", s:0, say:"Danke, Kumpel! Tschüss!", why:"Dann gibt er den falschen Schein woanders aus. Falschgeld darf nicht zurück in Umlauf."},
       {t:"Den Mann am Arm festhalten und laut „Betrüger!“ rufen.", s:0, say:"Lass mich los! Ich hab gar nichts gemacht!", why:"Man beschuldigt den Kunden nicht und hält ihn nicht fest. Man bleibt ruhig und holt Hilfe."}],
      term:"Verdacht auf Falschgeld", def:"Ruhig bleiben · Schein einbehalten · Vorgesetzte rufen · Kunden bitten zu warten · sich den Kunden merken.",
      ihk:"Maßnahmen bei Falschgeld-Verdacht: Vorgesetzten benachrichtigen · Geldschein einbehalten · Kunden bitten zu warten.",
      weil:["…weil Falschgeld nicht zurück in Umlauf darf – wer es wissentlich weitergibt, macht sich strafbar.","…weil die Kassenkraft den Kunden festhalten muss.","…weil die Bank den falschen Schein sofort ersetzt."]},
     {id:"k3d2b", who:{n:"Herr Kowalski", d:"Gast mit einer Tüte voller Münzen", look:{s:1,h:"#B0B0B0",st:"kurz",c:"#7F8C8D",a:"o"}},
      sit:"Herr Kowalski kauft Snacks für 24,80 € und will mit einer Tüte Münzen zahlen – etwa 90 Stück. Hinter ihm wird es voll.",
      q:"Was sagst du?",
      opts:[
       {t:"„Es tut mir leid, bei einer Zahlung muss ich höchstens 50 Münzen annehmen. Haben Sie einen Schein oder eine Karte?“", s:2, say:"Ach so, das wusste ich nicht. Dann nehm ich die Karte.", why:"Niemand muss bei einer Zahlung mehr als 50 Münzen annehmen. Freiwillig darf man mehr annehmen."},
       {t:"Alles annehmen und zählen. Die Schlange muss eben warten.", s:1, say:"Danke, junger Mensch!", why:"Das darf man freiwillig. Bei langer Schlange ist es aber ungünstig – man muss es nicht."},
       {t:"„Münzen nehmen wir grundsätzlich nicht.“", s:0, say:"Was? Das ist doch Geld!", why:"Münzen sind Bargeld. Ablehnen darf man nur, was über 50 Münzen hinausgeht."}],
      term:"Münzannahme", def:"Bei einer Zahlung muss niemand mehr als 50 Münzen annehmen.",
      ihk:"„Es tut mir leid, bei einer Zahlung darf ich höchstens 50 Münzen annehmen. Haben Sie vielleicht einen Schein oder eine Karte dabei?“",
      weil:["…weil niemand bei einer Zahlung mehr als 50 Münzen annehmen muss.","…weil man Münzen nur bei einer Kartenstörung annehmen darf.","…weil man höchstens 20 Münzen annehmen darf."]} ] ],
  mini:"fsk",
  profi:[
   {id:"p3a", q:"Bargeld kostet den Händler auch Geld. Welche Kosten sind gemeint?", opts:["Zählen und Abrechnen kostet Arbeitszeit, Transport zur Bank und Versicherung kosten Geld.","Für jede Barzahlung zahlt der Händler eine Gebühr an das Kreditkartenunternehmen.","Bargeld kostet nichts – nur Karten verursachen Kosten."]},
   {id:"p3b", q:"Warum nennst du den Wert eines Scheins laut, sobald du ihn bekommst?", opts:["Kunde und Kassenkraft wissen beide, welcher Schein gegeben wurde – so gibt es keinen Streit ums Rückgeld.","Weil der Schein sonst nicht in die Kasse passt.","Weil das die TSE verlangt."]} ] },

{ id:"k4", mod:4, day:"SA", time:"12:00", title:"40.000 Gäste und alle wollen zahlen", topic:"Karte, Handy, Gutschein",
  story:"Samstag, 12 Uhr. Die Sonne knallt, das Gelände ist voll. Fast alle wollen mit Karte oder Handy zahlen. Jana schickt eine Sprachnachricht: „Heute zählt jede Minute an der Schlange!“",
  words:["die girocard","die Debitkarte","die Kreditkarte","die PIN","das Kartenterminal","kontaktlos","die NFC-Funktion","das Mobile Payment","die Gebühr","der Gutschein","der Coupon","die Kundenkarte","der Datenschutz"],
  decs:[
   [ {id:"k4d1a", who:{n:"Ole Brodersen", d:"Festivalleiter", look:{s:2,h:"#6B6B6B",st:"glatze",c:"#2C3E50",a:"o"}},

      q:"Was hängt ihr an die Kasse?",
      opts:[
       {t:"Das Kontaktlos-Zeichen und die Symbole der beiden Kreditkarten, gut sichtbar.", s:2, say:"Sehr gut. So weiß jeder sofort Bescheid.", why:"Die Symbole zeigen: Diese Karten werden angenommen. Kartenzahlung bringt Spontankäufe, schnelle Abwicklung und kein Falschgeld."},
       {t:"Ein Schild „Nur Bargeld“ – so spart ihr die Gebühren.", s:1, say:"Nur Bargeld? Dann gehen die Leute zum Nachbarn.", why:"Gebühren sparen ist ein Grund. Aber ohne Karte gibt es weniger Spontankäufe und längere Schlangen."},
       {t:"Gar nichts. Wer fragt, bekommt eine Antwort.", s:0, say:"Bei der Schlange fragt doch keiner. Die gehen einfach.", why:"Kunden wollen vorher sehen, wie sie zahlen können. Die Symbole an der Kasse zeigen das."}],
      term:"Kreditkarten-Symbole", def:"Die Symbole an der Kasse zeigen dem Kunden: Diese Kreditkarten werden hier angenommen.",
      ihk:"Bedeutung der Symbole: Das Geschäft akzeptiert die Zahlung mit diesen Kreditkarten. Vorteile: Spontankäufe, Umsatzsteigerung, Kundenservice, Zahlungssicherheit, kein Falschgeld. Nachteile: Technik, Gebühren, späterer Zahlungseingang.",
      weil:["…weil Kartenzahlung schnell geht, Spontankäufe bringt und es kein Falschgeld gibt – dafür zahlt der Betrieb Gebühren.","…weil Kartenzahlung für den Betrieb keine Kosten hat.","…weil das Geld bei Kartenzahlung sofort in der Kasse liegt."]},
     {id:"k4d1b", who:{n:"Mara", d:"Gast mit Smartphone", look:{s:4,h:"#120C08",st:"locken",c:"#F39C12",a:"t"}},
      sit:"Mara hält ihr Smartphone hoch: „Kann ich mit dem Handy zahlen?“ Euer Terminal kann NFC.",
      q:"Was sagst du?",
      opts:[
       {t:"„Klar! Ich gebe den Betrag ein, Sie halten das Handy an das Lesegerät und bestätigen auf dem Handy. Den Beleg bekommen Sie gleich.“", s:2, say:"Piep – fertig! Das ging schnell.", why:"So läuft Mobile Payment in drei Schritten: Betrag nennen – Handy an das Lesegerät, auf dem Handy bestätigen – Beleg übergeben."},
       {t:"„Geht, aber Sie müssen danach noch Ihre PIN hier eintippen.“", s:1, say:"PIN? Die weiß ich gar nicht …", why:"Beim Handy bestätigt der Kunde meist auf seinem Gerät (Fingerabdruck, Gesicht, Code)."},
       {t:"„Nein, mit dem Handy geht das hier nicht.“", s:0, say:"Schade. Dann kauf ich drüben.", why:"Euer Terminal kann NFC. Damit ist Zahlen mit Smartphone möglich."}],
      term:"Mobile Payment", def:"Zahlen mit Smartphone oder Smartwatch. Die Daten gehen per Funk (NFC) an das Lesegerät. Der Kunde bestätigt auf seinem Gerät.",
      ihk:"Ablauf in 3 Schritten: In der Kasse Kartenzahlung wählen und Betrag nennen. Der Kunde hält das Smartphone an das Lesegerät und bestätigt. Beleg übergeben.",
      weil:["…weil die Daten per Funk (NFC) übertragen werden und der Kunde auf seinem Handy bestätigt.","…weil beim Mobile Payment immer eine Unterschrift nötig ist.","…weil das Geld vom Konto des Händlers abgebucht wird."]} ],
   [ {id:"k4d2a", who:{n:"Frau Okafor", d:"zahlt 64 € kontaktlos", look:{s:4,h:"#1A1A1A",st:"dutt",c:"#9B59B6",a:"e"}},
      sit:"Frau Okafor zahlt 64 € kontaktlos mit Karte. Das Terminal verlangt plötzlich die PIN. Sie ist sauer: „Sonst geht das doch immer ohne!“",
      q:"Was sagst du?",
      opts:[
       {t:"„Das ist normal: Über einem bestimmten Betrag fragt das Terminal zur Sicherheit nach der PIN.“", s:2, say:"Ach so. Na gut, dann tippe ich sie ein.", why:"Ohne PIN geht es meist bis 50 €. Eine PIN kann verlangt werden bei höheren Beträgen, nach mehreren Zahlungen oder per Zufall."},
       {t:"„Dann zahlen Sie bitte bar.“", s:1, say:"Bar? Ich hab doch gar kein Bargeld dabei.", why:"Das hilft der Kundin nicht. Besser erklären, warum die PIN kommt."},
       {t:"„Da ist wohl Ihre Karte kaputt.“", s:0, say:"Meine Karte ist nicht kaputt!", why:"Die Karte ist in Ordnung. Die PIN-Abfrage ist eine Sicherheitsfunktion."}],
      term:"PIN beim kontaktlosen Zahlen", def:"Ohne PIN meist bis 50 €. Darüber, nach mehreren Zahlungen hintereinander oder per Zufall wird eine PIN verlangt.",
      ihk:"Fall mit zusätzlicher PIN: Betrag über der festgelegten Höhe, mehrere Zahlungen mit derselben Karte, Zufallsabfrage.",
      weil:["…weil ohne PIN meist nur bis 50 € gezahlt werden kann – darüber oder per Zufall fragt das Terminal zur Sicherheit.","…weil kontaktlos nur mit Kreditkarte funktioniert.","…weil die PIN immer bei der dritten Zahlung am Tag kommt."]},
     {id:"k4d2b", who:{n:"Kevin Zack", d:"Chef der Snackbude Zack", look:{s:1,h:"#C9A24A",st:"cap",c:"#8E44AD",a:"e"}},
      sit:"Ihr macht ein Gewinnspiel für die Nordlicht-Kundenkarte. 300 Gäste haben ihre E-Mail-Adresse angegeben. Kevin bietet euch 200 € für die Liste.",
      q:"Was macht ihr?",
      opts:[
       {t:"Ablehnen: Die Daten werden vertraulich behandelt und nicht an Dritte weitergegeben.", s:2, say:"Pff. Dann eben nicht.", why:"Nach der DSGVO werden Kundendaten nur mit Einwilligung gespeichert, vertraulich behandelt und nicht ohne Zustimmung weitergegeben."},
       {t:"Nur die Namen verkaufen, ohne E-Mail-Adressen.", s:0, say:"Na, besser als nichts!", why:"Auch Namen sind Kundendaten. Sie dürfen nicht ohne Zustimmung an Dritte gehen."},
       {t:"Die Liste geben, wenn Kevin verspricht, sie nicht weiterzugeben.", s:0, say:"Versprochen! Ehrenwort!", why:"Kevin ist ein Dritter. Ohne Zustimmung der Kunden darf er die Daten nicht bekommen."}],
      term:"Datenschutz (DSGVO)", def:"Kundendaten nur mit Einwilligung speichern, vertraulich behandeln, nicht an Dritte weitergeben, nur so viele wie nötig.",
      ihk:"Gesetzlich korrekter Umgang: Kundendaten vertraulich behandeln und nicht (ohne Zustimmung) an Dritte weitergeben.",
      weil:["…weil die DSGVO verlangt, Kundendaten vertraulich zu behandeln und nicht ohne Zustimmung an Dritte zu geben.","…weil Kundendaten nur einen Tag gespeichert werden dürfen.","…weil man Daten nur verkaufen darf, wenn es mehr als 500 € bringt."]} ] ],

  profi:[
   {id:"p4a", q:"Ein kleines Café will nur noch Kartenzahlung annehmen. Was ist ein Nachteil für die Kunden?", opts:["Menschen ohne Karte, Kinder und manche Ältere werden ausgeschlossen, und niemand kann anonym zahlen.","Kunden müssen dann Gebühren an das Café zahlen.","Kartenzahlung dauert immer länger als Bargeld."]},
   {id:"p4b", q:"Eure Kundenkarte gibt 1 % Rabatt. Warum lohnt sich das trotzdem für den Betrieb?", opts:["Kunden kommen öfter wieder, und der Betrieb erfährt, wer was kauft – Sortiment und Werbung lassen sich anpassen.","Weil der Staat den Rabatt bezahlt.","Weil Kunden mit Kundenkarte keinen Bon brauchen."]},
   {id:"p4c", q:"Eine Kundin hat 1.384 Bonuspunkte (1 Punkt = 0,01 €). Sie kauft für 42,45 € ein und verrechnet die Punkte. Wie viel zahlt sie noch?", opts:["28,61 €","29,61 €","13,84 €"]} ] },

{ id:"k5", mod:5, day:"SA", time:"18:00", title:"Hitze, Schlange, Jugendliche", topic:"Besondere Situationen an der Kasse",
  story:"Samstag, 18 Uhr. Ihr steht seit sieben Stunden an der Kasse. Es ist heiß, viele Jugendliche sind unterwegs. Nebenan verkauft Kevin alles an jeden – das kann nicht gut gehen.",
  words:["der Jugendschutz","das Jugendschutzgesetz","volljährig","den Ausweis zeigen lassen","branntweinhaltig","die Diebstahlprävention","die Hilfestellung","zurücklegen","die Ergonomie","die Stehhilfe","die Pause","die wörtliche Rede"],
  decs:[
   [ {id:"k5d1a", who:{n:"Zwei Mädchen", d:"etwa 16 Jahre alt", look:{s:2,h:"#5A3825",st:"lang",c:"#E91E63",a:"t"}},
      sit:"Zwei Mädchen, etwa 16, wollen zwei Dosen Wodka-Mix. „Die sind für meinen Bruder, der ist 20!“",
      q:"Was sagst du?",
      opts:[
       {t:"Ausweis zeigen lassen. „Tut mir leid, Getränke mit Wodka darf ich erst ab 18 verkaufen – auch für deinen Bruder. Wie wär's mit unserer Limo?“", s:2, say:"Okay … dann halt zwei Limos.", why:"Jugendschutz: Branntwein und Mischgetränke mit Branntwein erst ab 18. Dass sie für jemand anderen sind, ändert nichts. Freundlich ablehnen und eine Lösung anbieten."},
       {t:"„Ihr seht zu jung aus. Geht weg.“", s:1, say:"Boah, wie unfreundlich!", why:"Die Ablehnung ist richtig. Aber man bleibt höflich, nennt den Grund und bietet eine Lösung an."},
       {t:"Verkaufen – der Bruder ist ja 20.", s:0, say:"Danke! Easy.", why:"Verstoß gegen das Jugendschutzgesetz. Mischgetränke mit Branntwein gibt es erst ab 18, egal für wen."}],
      term:"Jugendschutz: Alkohol", def:"Bier, Wein, Sekt und Mischgetränke mit Bier oder Wein ab 16. Branntwein und Mischgetränke mit Branntwein ab 18.",
      ihk:"Aspekt: Jugendschutz (1 Punkt). Ansprache in wörtlicher Rede, freundlich mit Lösung (2 Punkte).",
      weil:["…weil Mischgetränke mit Branntwein erst ab 18 verkauft werden dürfen – auch wenn sie für jemand anderen sind.","…weil Mischgetränke mit Branntwein ab 16 erlaubt sind, wenn ein Erwachsener zustimmt.","…weil Jugendliche unter 18 gar keinen Alkohol kaufen dürfen."]},
     {id:"k5d1b", who:{n:"Junge", d:"etwa 15 Jahre alt", look:{s:3,h:"#2A1B12",st:"kurz",c:"#3498DB",a:"t"}},
      sit:"Ein Junge, etwa 15, will eine E-Zigarette ohne Nikotin. „Da ist doch gar kein Nikotin drin!“",
      q:"Was sagst du?",
      opts:[
       {t:"„Tut mir leid, E-Zigaretten darf ich erst ab 18 verkaufen – auch ohne Nikotin. Darf ich dir ein kaltes Wasser anbieten?“", s:2, say:"Echt? Auch ohne Nikotin? Okay, dann ein Wasser.", why:"Tabakwaren und E-Zigaretten gibt es erst ab 18, auch ohne Nikotin. Freundlich erklären und eine Lösung anbieten."},
       {t:"„Ausweis!“ – und ihn ohne Erklärung wegschicken.", s:1, say:"Was ist denn dein Problem?", why:"Die Ablehnung ist richtig, aber man erklärt höflich den Grund."},
       {t:"Verkaufen – ohne Nikotin ist das erlaubt.", s:0, say:"Danke! Wusste ich doch.", why:"Falsch: E-Zigaretten sind mit und ohne Nikotin erst ab 18 erlaubt."}],
      term:"Jugendschutz: Tabak", def:"Tabakwaren, E-Zigaretten und Shishas – mit und ohne Nikotin – erst ab 18 Jahren.",
      ihk:"„Tut mir leid, Zigaretten darf ich erst an Personen ab 18 verkaufen – auch wenn sie für deinen Vater sind.“",
      weil:["…weil Tabakwaren und E-Zigaretten erst ab 18 verkauft werden dürfen – auch ohne Nikotin.","…weil E-Zigaretten ohne Nikotin ab 16 erlaubt sind.","…weil man E-Zigaretten nur an Raucher verkaufen darf."]} ],
   [ {id:"k5d2a", who:{n:"Herr Becker", d:"Gast mit vollem Korb", look:{s:1,h:"#7B5B3A",st:"kurz",c:"#1ABC9C",a:"e"}},
      sit:"Das Kartenterminal hat plötzlich kein Netz. Herr Becker hat einen vollen Korb und will mit Karte zahlen.",
      q:"Was sagst du?",
      opts:[
       {t:"„Es tut mir leid, unser Terminal hat gerade eine Störung. Können Sie bar zahlen? Sonst lege ich Ihnen den Einkauf gern kurz zurück.“", s:2, say:"Ich hol schnell Geld vom Automaten. Danke fürs Zurücklegen!", why:"In besonderen Situationen: höflich sagen, was los ist, und eine Lösung anbieten (Hilfestellung)."},
       {t:"Wortlos auf ein Schild „Heute nur bar“ zeigen.", s:1, say:"Aha. Und jetzt?", why:"Die Information stimmt, aber es fehlt die freundliche Ansprache und eine Lösung."},
       {t:"„Pech gehabt, dann eben nicht.“", s:0, say:"Unfassbar. Hier kauf ich nie wieder.", why:"Unfreundlich und ohne Lösung. So verliert der Stand Kunden."}],
      term:"Hilfestellung / Alternative anbieten", def:"Höflich sagen, was los ist (mit Grund), und eine Lösung anbieten: bar zahlen, zurücklegen, andere Kasse.",
      ihk:"„Es tut mir leid, unser Kartenterminal hat gerade eine Störung. Können Sie bar bezahlen? Sonst öffnet meine Kollegin gleich die Nachbarkasse.“",
      weil:["…weil man in besonderen Situationen höflich sagt, was los ist, und eine Lösung anbietet.","…weil man bei Technikausfall den Kauf sofort abbrechen muss.","…weil der Kunde bei einer Störung nichts bezahlen muss."]},
     {id:"k5d2b", who:{n:"Du selbst", d:"seit 7 Stunden an der Kasse", look:{s:2,h:"#4A3020",st:"kurz",c:"#E4572E",a:"t"}},
      sit:"Du stehst seit sieben Stunden an der Kasse. Dein Rücken tut weh, die Theke ist viel zu niedrig. Kisten mit Wasser hebst du jedes Mal aufs Band.",
      q:"Was tust du?",
      opts:[
       {t:"Pause machen. Danach Theke auf deine Größe einstellen, mit Stehhilfe abwechseln und schwere Kisten mit dem Handscanner erfassen.", s:2, say:"Puh, viel besser. Und ich vertippe mich nicht mehr.", why:"Pausen helfen gegen Fehler. Ein passend eingestellter Arbeitsplatz, Wechsel von Stehen und Sitzen und der Handscanner schonen den Rücken."},
       {t:"Nur kurz strecken und weitermachen. Pausen kosten Umsatz.", s:1, say:"Geht so … der Rücken zwickt immer noch.", why:"Ausgleichsübungen sind gut, aber Pausen sind wichtig. Erwachsene haben bei mehr als 6 Stunden Arbeit mindestens 30 Minuten Pause, Jugendliche schon bei mehr als 4,5 Stunden."},
       {t:"Durchziehen bis Mitternacht und die Kisten weiter heben.", s:0, say:"Au … ich hab mich schon zweimal vertippt.", why:"Ohne Pause steigen Fehler und Rückenschmerzen. Schwere Ware wird mit dem Handscanner erfasst."}],
      term:"Ergonomie am Kassenplatz", def:"Stuhl und Theke auf die Körpergröße einstellen, Sitzen und Stehen wechseln, Stehhilfe, Handscanner für schwere Ware, Pausen.",
      ihk:"Ergonomische Maßnahmen: Stuhl und Kassentisch auf die Körpergröße einstellen, damit ich aufrecht sitze. Zwischen Sitzen und Stehen wechseln und eine Stehhilfe nutzen, damit der Rücken entlastet wird.",
      weil:["…weil Pausen helfen, konzentriert zu bleiben, und ein eingestellter Arbeitsplatz den Rücken schont.","…weil Pausen nur Jugendlichen zustehen.","…weil man an der Kasse nur sitzen darf."]},
     {id:"k5d2c", who:{n:"Frau Lüders", d:"Gast mit Bollerwagen", look:{s:1,h:"#D9C3A0",st:"lang",c:"#2ECC71",a:"e"}},
      sit:"Frau Lüders legt nur die Chips aufs Band. Unten in ihrem Bollerwagen liegt noch ein Karton Wasser.",
      q:"Was sagst du?",
      opts:[
       {t:"„Unten im Wagen liegt noch ein Karton Wasser. Den scanne ich gleich mit, dann müssen Sie ihn nicht heben.“", s:2, say:"Oh, den hätte ich glatt vergessen. Danke!", why:"Diebstahlprävention: Den Wagen kontrollieren, damit nichts vergessen oder versteckt wird – höflich und als Service."},
       {t:"Nichts sagen und nur die Chips kassieren.", s:0, say:"Tschüss!", why:"Der Karton wird nicht bezahlt. Der Wagen wird kontrolliert."},
       {t:"„Sie wollen wohl das Wasser klauen?“", s:0, say:"Wie bitte?! Das ist ja unverschämt!", why:"Man beschuldigt niemanden. Man spricht es freundlich als Service an."}],
      term:"Diebstahlprävention", def:"Einkaufswagen und Umverpackungen kontrollieren, damit nichts vergessen oder versteckt wird. Freundlich ansprechen.",
      ihk:"Aspekt: Diebstahlprävention. „Könnten Sie bitte Ihren Korb einmal kurz anheben, damit ich sehe, ob noch etwas darunter liegt?“",
      weil:["…weil man den Wagen kontrolliert, damit nichts vergessen oder versteckt wird – und es höflich anspricht.","…weil man Kunden mit Bollerwagen immer durchsuchen muss.","…weil Getränke nicht gescannt werden müssen."]} ] ],
  mini:"jugend",
  profi:[
   {id:"p5a", q:"Ein 17-Jähriger möchte eine Flasche Wein und eine Flasche Wodka kaufen. Was darfst du verkaufen?", opts:["Nur den Wein – Wodka ist Branntwein und erst ab 18.","Beides – er ist ja fast 18.","Nichts – Alkohol gibt es erst ab 18."]},
   {id:"p5b", q:"Ein Stand führt „Challenge 25“ ein: Ausweis von allen, die jünger als 25 aussehen. Was ist der Vorteil für die Kassenkraft?", opts:["Sie hat eine klare Regel, muss nicht schätzen und hat weniger Diskussionen.","Sie darf dann auch an 17-Jährige Wodka verkaufen.","Sie muss nie mehr einen Ausweis prüfen."]} ] },

{ id:"k6", mod:6, day:"SA", time:"23:30", title:"Kassenschluss", topic:"Kassenabrechnung",
  story:"Samstag, 23:30 Uhr. Die Bühne ist dunkel. Jana ist endlich da – mit dem Lieferwagen. „Zeigt mir eure Abrechnung!“ Bei Kevin nebenan ist es auffällig still. Dort war vorhin das Ordnungsamt.",
  words:["der Kassenanfangsbestand","das Wechselgeld","die Abschöpfung","der Kassenschlussbestand","die Tageslosung","der Tagesumsatz","der Kassenbericht","der Soll-Bestand","der Ist-Bestand","die Kassendifferenz","der Überschuss","der Fehlbetrag","der Kassensturz"],
  decs:[
   [ {id:"k6d1a", who:{n:"Lina", d:"hat den Kassenbericht geschrieben", look:{s:3,h:"#1E1410",st:"zopf",c:"#E4572E",a:"t"}},
      sit:"Lina zeigt ihren Kassenbericht. Sie hat die Abschöpfung von 2.000 € abgezogen und das Wechselgeld von 300 € addiert.",
      q:"Was sagt ihr Lina?",
      opts:[
       {t:"„Andersherum: Die Abschöpfung wird addiert, das Wechselgeld wird abgezogen.“", s:2, say:"Ach so! Die 2.000 € haben wir ja eingenommen. Ich rechne neu.", why:"Alles, was aus der Kasse genommen wurde, wird addiert. Das Wechselgeld war schon morgens drin und ist kein Umsatz – es wird abgezogen."},
       {t:"„Nur das Wechselgeld musst du abziehen. Der Rest stimmt.“", s:1, say:"Okay … aber die Zahl ist immer noch so klein.", why:"Das Wechselgeld ist richtig korrigiert. Die Abschöpfung ist aber auch Umsatz und wird addiert."},
       {t:"„Stimmt so. Was aus der Kasse genommen wurde, ist weg.“", s:0, say:"Dann haben wir heute ja kaum was verdient?!", why:"Die Abschöpfung ist eingenommenes Geld, das nur nicht mehr in der Kasse liegt. Sie wird addiert."}],
      term:"Kassenbericht", def:"Kassenschlussbestand + Abschöpfungen − Wechselgeld = Tageslosung. Tageslosung + Kartenzahlungen = Tagesumsatz.",
      ihk:"Merksatz: Alles, was aus der Kasse genommen wurde, wird addiert. Das Wechselgeld, das schon morgens drin war, wird abgezogen.",
      weil:["…weil die Abschöpfung eingenommenes Geld ist und das Wechselgeld schon morgens in der Kasse war.","…weil das Wechselgeld zum Umsatz gehört.","…weil Kartenzahlungen von der Tageslosung abgezogen werden."]},
     {id:"k6d1b", who:{n:"Jana Ahrens", d:"eure Chefin", look:{s:2,h:"#B5651D",st:"dutt",c:"#1F8A8A",a:"e"}},
      sit:"Jana fragt: „Wie hoch war heute die Tageslosung?“ Lina will die Kartenzahlungen dazurechnen.",
      q:"Was ist richtig?",
      opts:[
       {t:"„Tageslosung sind nur die Bareinnahmen. Bar plus Karte ist der Tagesumsatz.“", s:2, say:"Genau. Und beides will ich sehen.", why:"Tageslosung = alle Bareinnahmen eines Tages. Tagesumsatz = alle Einnahmen: bar + Karte."},
       {t:"„Tageslosung ist das Geld, das jetzt in der Kasse liegt.“", s:0, say:"Nein, das ist der Kassenschlussbestand. Da fehlt was.", why:"In der Kasse liegt der Kassenschlussbestand. Für die Tageslosung kommt die Abschöpfung dazu, das Wechselgeld kommt weg."},
       {t:"„Tageslosung ist alles zusammen: bar und Karte.“", s:0, say:"Das ist der Tagesumsatz. Nicht verwechseln!", why:"Bar + Karte ist der Tagesumsatz. Die Tageslosung umfasst nur das Bargeld."}],
      term:"Tageslosung und Tagesumsatz", def:"Tageslosung = alle Bareinnahmen. Tagesumsatz = bar + Karte.",
      ihk:"„Ermitteln Sie den Tagesumsatz! Geben Sie den Rechenweg an!“ – je 1 Punkt für das Addieren, das Subtrahieren und das Ergebnis.",
      weil:["…weil die Tageslosung nur das Bargeld umfasst und erst mit den Kartenzahlungen der Tagesumsatz entsteht.","…weil Kartenzahlungen immer zur Tageslosung gehören.","…weil die Tageslosung das Wechselgeld für morgen ist."]} ],
   [ {id:"k6d2a", who:{n:"Jana Ahrens", d:"eure Chefin", look:{s:2,h:"#B5651D",st:"dutt",c:"#1F8A8A",a:"e"}},
      sit:"Laut Kasse sollen 1.230,00 € in der Kasse sein (Soll). Ihr zählt 1.235,00 € (Ist). Lina jubelt: „5 € Trinkgeld für uns!“",
      q:"Was sagt ihr?",
      opts:[
       {t:"„Das ist ein Überschuss von 5 €. Den melden wir und suchen die Ursache, z. B. zu wenig Rückgeld gegeben.“", s:2, say:"Richtig. Vielleicht hat ein Gast zu wenig zurückbekommen.", why:"Ist − Soll = +5 € → Überschuss. Ursachen: zu wenig Rückgeld, Wechselgeld stimmte morgens nicht, Eingabefehler."},
       {t:"„Das ist ein Fehlbetrag. Wir legen 5 € aus eigener Tasche dazu.“", s:0, say:"Fehlbetrag? Es ist doch zu viel Geld da!", why:"Zu viel Geld ist ein Überschuss, kein Fehlbetrag. Ein Fehlbetrag heißt: zu wenig Geld."},
       {t:"„Super, die 5 € teilen wir uns!“", s:0, say:"Auf keinen Fall. Das Geld gehört dem Betrieb.", why:"Eine Kassendifferenz wird gemeldet. Das Geld gehört dem Betrieb, vielleicht auch einem Kunden."}],
      term:"Kassendifferenz", def:"Ist − Soll. Plus = Überschuss (zu viel Geld). Minus = Fehlbetrag (zu wenig Geld).",
      ihk:"5 € zu viel in der Kasse – mögliche Gründe: zu wenig Wechselgeld herausgegeben, Wechselgeld stimmte schon beim Einzählen nicht, Eingabefehler.",
      weil:["…weil Ist minus Soll plus 5 € ergibt – zu viel Geld ist ein Überschuss, und der hat eine Ursache.","…weil ein Überschuss bedeutet, dass ein Kunde zu viel Rückgeld bekommen hat.","…weil Soll und Ist nie gleich sein können."]},
     {id:"k6d2b", who:{n:"Kevin Zack", d:"Chef der Snackbude Zack", look:{s:1,h:"#C9A24A",st:"cap",c:"#8E44AD",a:"e"}},
      sit:"Ole Brodersen will morgen bei allen Ständen einen Kassensturz machen. Kevin grinst: „Den sagt er doch vorher an. Dann zählen wir vorher schön nach.“",
      q:"Was antwortet ihr?",
      opts:[
       {t:"„Ein Kassensturz kommt überraschend. Wir halten unsere Kasse einfach immer in Ordnung.“", s:2, say:"Überraschend? Ach du Schreck …", why:"Ein Kassensturz ist ein überraschender Soll-Ist-Vergleich während des Tages. So zeigt er den echten Stand."},
       {t:"„Wir legen vorher Geld aus eigener Tasche nach, falls was fehlt.“", s:0, say:"Gute Idee, mach ich auch!", why:"Damit verdeckt man Fehler. Der Kassensturz soll den echten Stand zeigen."},
       {t:"„Kassensturz heißt, die Kasse ist kaputt. Das betrifft uns nicht.“", s:0, say:"Hä? Na dann.", why:"Kassensturz bedeutet: Soll-Bestand und Ist-Bestand werden überraschend verglichen."}],
      term:"Kassensturz", def:"Überraschender Soll-Ist-Vergleich während des Tages.",
      ihk:"Ein Kassensturz ist ein überraschender Soll-Ist-Vergleich während des Tages.",
      weil:["…weil ein angekündigter Kassensturz Fehler verdecken könnte – überraschend zeigt er den echten Stand.","…weil beim Kassensturz das Wechselgeld abgeholt wird.","…weil ein Kassensturz nur einmal im Jahr erlaubt ist."]} ] ],
  mini:"bericht",
  profi:[
   {id:"p6a", q:"Kevin zieht seinen Leuten Fehlbeträge einfach vom Lohn ab. Was gilt?", opts:["Ohne besondere Vereinbarung haften Beschäftigte nur bei Vorsatz oder grober Fahrlässigkeit – einfach abziehen darf der Betrieb nicht.","Das ist erlaubt: Jeder Fehlbetrag geht vom Lohn ab.","Das ist erlaubt, wenn der Fehlbetrag unter 50 € liegt."]},
   {id:"p6b", q:"Kartenzahlungen 3.150,00 €; Wechselgeld 600,00 €; Kassenbestand am Schichtende 3.450,00 €; Abschöpfung 2.000,00 €. Wie hoch ist der Tagesumsatz?", opts:["8.000,00 €","9.200,00 €","4.000,00 €"]} ] },

{ id:"k7", mod:7, day:"SO", time:"11:00", title:"Familientag", topic:"Wer darf kaufen? Geschäftsfähigkeit",
  story:"Sonntag, 11 Uhr. Familientag auf dem Deichbeat! Überall Kinder und Jugendliche. Kevins Bude bleibt heute zu – er hat gestern Ärger mit dem Ordnungsamt bekommen. Jetzt ist euer Stand allein in der Reihe.",
  words:["die Rechtsfähigkeit","die Geschäftsfähigkeit","geschäftsunfähig","beschränkt geschäftsfähig","voll geschäftsfähig","der gesetzliche Vertreter","die Zustimmung","schwebend unwirksam","nichtig","der Taschengeldparagraf","der Botengang"],
  decs:[
   [ {id:"k7d1a", who:{n:"Finn", d:"6 Jahre alt", look:{s:1,h:"#E3C16F",st:"kurz",c:"#F1C40F",a:"k"}},
      sit:"Finn, 6 Jahre, will mit seinem Taschengeld einen Leuchtstab für 3,00 € kaufen. Seine Eltern sind nicht dabei.",
      q:"Was machst du?",
      opts:[
       {t:"Freundlich ablehnen: „Komm doch mit Mama oder Papa wieder, dann klappt das.“", s:2, say:"Okay … ich hol Papa!", why:"Kinder unter 7 sind geschäftsunfähig. Ihr Kauf ist nichtig – auch mit Taschengeld und bei kleinen Beträgen."},
       {t:"Verkaufen – Taschengeld ist Taschengeld.", s:0, say:"Juhu, leuchtet!", why:"Der Taschengeldparagraf gilt erst ab 7. Der Kauf ist nichtig, die Eltern bekommen ihr Geld zurück."},
       {t:"Verkaufen, wenn er genau passend zahlt.", s:0, say:"Hier, drei Euro!", why:"Passend zahlen ändert nichts. Unter 7 ist der Kauf nichtig."}],
      term:"Geschäftsunfähig", def:"Kinder unter 7 Jahren. Ihr Kauf ist nichtig (von Anfang an ungültig). Ausnahme: Botengang.",
      ihk:"„Nein, weil sie geschäftsunfähig ist.“ – Kinder unter 7: Der Kauf ist nichtig, auch mit Taschengeld.",
      weil:["…weil Kinder unter 7 geschäftsunfähig sind – ihr Kauf ist nichtig, auch mit Taschengeld.","…weil Kinder unter 7 noch nicht rechtsfähig sind.","…weil der Taschengeldparagraf erst ab 5 € gilt."]},
     {id:"k7d1b", who:{n:"Emma", d:"6 Jahre alt, mit Einkaufszettel", look:{s:3,h:"#2B1A10",st:"zopf",c:"#FF6F91",a:"k"}},
      sit:"Emma, 6 Jahre, bringt einen Zettel von ihrer Mutter: „Bitte 2 Wasser und 1 Sonnencreme.“ Das Geld hat die Mutter mitgegeben. Sie wartet am Kinderkarussell.",
      q:"Was machst du?",
      opts:[
       {t:"Verkaufen – das ist ein Botengang. Emma überbringt nur den Willen der Mutter.", s:2, say:"Danke! Mama winkt schon.", why:"Beim Botengang kauft eigentlich die Mutter. Das Kind überbringt nur ihre Willenserklärung. Der Kauf ist gültig."},
       {t:"Ablehnen – unter 7 geht gar nichts.", s:1, say:"Aber Mama hat doch gesagt …", why:"Vorsichtig, aber hier unnötig: Beim Botengang ist der Kauf gültig."},
       {t:"Verkaufen, weil Sonnencreme ein Notfall ist.", s:0, say:"Okay!", why:"Ob Notfall oder nicht, spielt keine Rolle. Gültig ist der Kauf wegen des Botengangs."}],
      term:"Botengang", def:"Ein Kind kauft im Auftrag der Eltern ein und überbringt nur deren Willen. Der Kauf ist gültig.",
      ihk:"Der 6-jährige Ben kauft mit Einkaufszettel und Geld seiner Mutter ein Brot → gültig (Botengang: Ben überbringt nur den Willen der Mutter).",
      weil:["…weil das Kind beim Botengang nur den Willen der Mutter überbringt.","…weil Kinder ab 6 beschränkt geschäftsfähig sind.","…weil Sonnencreme nicht unter das Kaufrecht fällt."]} ],
   [ {id:"k7d2a", who:{n:"Leonie", d:"14 Jahre alt", look:{s:2,h:"#6E3B1F",st:"lang",c:"#00A6A6",a:"t"}},
      sit:"Leonie, 14, kauft ein Band-T-Shirt für 25,00 €. Sie zahlt bar von ihrem Taschengeld.",
      q:"Was machst du?",
      opts:[
       {t:"Verkaufen: Taschengeldparagraf. Sie zahlt sofort und vollständig mit Geld zur freien Verfügung.", s:2, say:"Yes! Mein erstes Band-Shirt!", why:"Ab 7 ist man beschränkt geschäftsfähig. Mit Taschengeld, sofort und vollständig bezahlt, ist der Kauf gültig."},
       {t:"Verkaufen, aber vorher die Eltern anrufen.", s:1, say:"Echt jetzt? Das ist so peinlich …", why:"Nicht nötig: Beim Taschengeldparagrafen braucht es keine Zustimmung der Eltern."},
       {t:"Ablehnen – unter 18 nur mit Eltern.", s:0, say:"Aber das ist mein Taschengeld!", why:"Falsch: Mit dem Taschengeldparagrafen darf sie allein kaufen."}],
      term:"Taschengeldparagraf (§ 110 BGB)", def:"Beschränkt Geschäftsfähige kaufen gültig, wenn sie sofort und vollständig mit Geld zur freien Verfügung bezahlen.",
      ihk:"Im Rahmen des „Taschengeldparagrafen“ abgeschlossene Kaufverträge sind auch ohne Zustimmung des gesetzlichen Vertreters gültig.",
      weil:["…weil Jugendliche ab 7 mit Taschengeld gültig kaufen, wenn sie sofort und vollständig bezahlen.","…weil man ab 14 voll geschäftsfähig ist.","…weil der Kauf schwebend unwirksam ist."]},
     {id:"k7d2b", who:{n:"Jonas", d:"16 Jahre alt", look:{s:1,h:"#3E2A1C",st:"cap",c:"#D35400",a:"t"}},
      sit:"Jonas, 16, will die große Bluetooth-Box für 349,00 € kaufen – bar, von seinen Ersparnissen. Seine Eltern wissen nichts davon.",
      q:"Was machst du?",
      opts:[
       {t:"„Weil die Box so teuer ist, brauche ich die Zustimmung deiner Eltern. Ich lege sie dir gern bis heute Abend zurück.“", s:2, say:"Hm, okay. Ich ruf meinen Vater an.", why:"Ersparnisse für eine große Anschaffung fallen nicht unter den Taschengeldparagrafen. Ohne Zustimmung ist der Kauf schwebend unwirksam."},
       {t:"Verkaufen – Barzahlung ist immer gültig.", s:0, say:"Läuft!", why:"Barzahlung allein reicht nicht. Sagen die Eltern Nein, ist der Kauf von Anfang an ungültig."},
       {t:"Verkaufen und hoffen, dass die Eltern nichts merken.", s:0, say:"Die merken das eh nicht.", why:"Der Kauf ist schwebend unwirksam. Die Eltern können die Rücknahme verlangen."}],
      term:"Schwebend unwirksam", def:"Der Kauf eines beschränkt Geschäftsfähigen gilt erst, wenn die Eltern zustimmen. Sagen sie Nein, ist er von Anfang an ungültig.",
      ihk:"Die Eltern können die Rücknahme verlangen, da der Vertrag bis zu deren Ablehnung schwebend unwirksam war.",
      weil:["…weil Ersparnisse für eine große Anschaffung nicht unter den Taschengeldparagrafen fallen.","…weil Barkäufe von Minderjährigen immer nichtig sind.","…weil die Eltern nur innerhalb von 8 Tagen widersprechen dürfen."]} ] ],
  mini:"ampel",
  profi:[
   {id:"p7a", q:"Was ist der Unterschied zwischen Rechtsfähigkeit und Geschäftsfähigkeit?", opts:["Rechtsfähig ist jeder Mensch ab der Geburt. Geschäftsfähig ist man ab 7 beschränkt und ab 18 voll.","Rechtsfähig ist man ab 18, geschäftsfähig ab 7.","Beide Wörter bedeuten dasselbe."]},
   {id:"p7b", q:"Simone (17) ist Auszubildende. In welchem Fall kommt KEIN gültiger Vertrag zustande?", opts:["Sie schließt ohne Wissen der Eltern einen Ratenkauf über einen Computer ab.","Sie kauft eine Monatskarte für den Weg zum Ausbildungsbetrieb.","Sie kauft auf Anweisung des Abteilungsleiters Büromaterial für den Betrieb."]},
   {id:"p7c", q:"Ein etwa 12-jähriges Mädchen will Kopfhörer für 129,00 € bar bezahlen. Was trifft zu?", opts:["Der Kauf wäre schwebend unwirksam – ich lege die Kopfhörer zurück, bis die Eltern zustimmen.","Der Kauf ist nichtig, weil sie unter 14 ist.","Der Kauf ist gültig, weil sie bar bezahlt."]} ] },

{ id:"k8", mod:8, day:"SO", time:"14:00", title:"Pannen im Büro-Zelt", topic:"Rechtsgeschäfte, Nichtigkeit, Anfechtung",
  story:"Sonntag, 14 Uhr. Jana sitzt im Büro-Zelt und bestellt für den Abschlussabend. Dabei geht einiges schief – und auch am Stand gibt es seltsame „Geschäfte“.",
  words:["die Willenserklärung","das Rechtsgeschäft","einseitig","zweiseitig","schlüssiges Handeln","nichtig","anfechtbar","anfechten","der Irrtum","die arglistige Täuschung","die widerrechtliche Drohung","das Scherzgeschäft","unverzüglich"],
  decs:[
   [ {id:"k8d1a", who:{n:"Jana Ahrens", d:"eure Chefin", look:{s:2,h:"#B5651D",st:"dutt",c:"#1F8A8A",a:"e"}},
      sit:"Jana hat beim Getränke-Großhändler 500 Kisten Wasser bestellt. Gemeint waren 50. Sie merkt es eine Stunde später.",
      q:"Was rät ihr Jana?",
      opts:[
       {t:"Sofort beim Großhändler anfechten: Sie hat sich vertippt (Irrtum in der Erklärung).", s:2, say:"Gut, ich ruf gleich an und schick eine Mail hinterher.", why:"Ein Erklärungsirrtum macht den Vertrag anfechtbar. Anfechten muss man unverzüglich, also sofort nach dem Entdecken."},
       {t:"Bis Montag warten und dann anfechten.", s:1, say:"Montag? Bis dahin ist der Lkw schon unterwegs …", why:"Anfechtbar ja – aber unverzüglich. Wer lange wartet, verliert das Recht."},
       {t:"Nichts tun. Bestellt ist bestellt.", s:0, say:"500 Kisten? Wo soll ich die hinstellen?!", why:"Ein Erklärungsirrtum darf angefochten werden. Man muss nicht für einen Tippfehler zahlen."}],
      term:"Anfechtbar: Irrtum in der Erklärung", def:"Man hat sich verschrieben, vertippt oder versprochen. Der Vertrag gilt, bis man unverzüglich anficht.",
      ihk:"Anfechtung ist berechtigt, wenn im Angebot anstatt 300,00 € versehentlich nur 30,00 € als Stückpreis angegeben wurden.",
      weil:["…weil ein Erklärungsirrtum den Vertrag anfechtbar macht – aber nur bei unverzüglicher Anfechtung.","…weil der Vertrag wegen des Fehlers von selbst nichtig ist.","…weil man für jede Anfechtung ein Jahr Zeit hat."]},
     {id:"k8d1b", who:{n:"Herr Peters", d:"hat eine Regenjacke gekauft", look:{s:1,h:"#8D6E63",st:"kurz",c:"#5D6D7E",a:"e"}},
      sit:"Herr Peters hat morgens eine Regenjacke für 39 € gekauft. Jetzt scheint die Sonne. Er sagt: „Ich will den Kauf anfechten!“",
      q:"Was antwortest du?",
      opts:[
       {t:"„Das ist leider kein Grund zum Anfechten – Sie haben sich nur über Ihren Grund geirrt. Ich frage meine Chefin, ob wir aus Kulanz umtauschen.“", s:2, say:"Na gut. Wäre nett, wenn's klappt.", why:"Ein Motivirrtum (Irrtum über die eigenen Gründe) ist kein Anfechtungsgrund. Ein Umtausch ist nur Kulanz."},
       {t:"„Klar, ein Wetterirrtum ist ein Anfechtungsgrund.“", s:0, say:"Wusste ich's doch!", why:"Falsch: Ein Motivirrtum ist nicht anfechtbar."},
       {t:"„Der Vertrag ist nichtig, weil sich das Wetter geändert hat.“", s:0, say:"Prima, dann Geld zurück!", why:"Der Vertrag ist gültig. Nichtig ist ein Vertrag z. B. mit Kindern unter 7 oder bei einem Scherzgeschäft."}],
      term:"Motivirrtum", def:"Man irrt sich nur über seine Gründe („Ich dachte, ich brauche das noch.“). Kein Anfechtungsgrund.",
      ihk:"Kein Anfechtungsgrund: Er hat sich nur über seinen Geschmack bzw. seine Gründe geirrt (Motivirrtum). Der Vertrag bleibt gültig. Ein Umtausch ist nur Kulanz.",
      weil:["…weil ein Motivirrtum kein Anfechtungsgrund ist – ein Umtausch ist nur Kulanz.","…weil jeder Kauf 14 Tage lang anfechtbar ist.","…weil eine Regenjacke ein Scherzgeschäft ist."]} ],
   [ {id:"k8d2a", who:{n:"Jana Ahrens", d:"eure Chefin", look:{s:2,h:"#B5651D",st:"dutt",c:"#1F8A8A",a:"e"}},
      sit:"Ein Händler hat euch 50 Band-Shirts als „Original-Merch“ verkauft. Jetzt kommt heraus: Es sind Fälschungen – und er wusste es.",
      q:"Was ist jetzt richtig?",
      opts:[
       {t:"Den Kaufvertrag wegen arglistiger Täuschung anfechten. Dafür habt ihr 1 Jahr ab Entdecken Zeit.", s:2, say:"Gut. Ich schreibe ihm heute noch.", why:"Bei arglistiger Täuschung ist der Vertrag anfechtbar. Frist: 1 Jahr ab Entdecken der Täuschung."},
       {t:"Nichts tun – der Vertrag ist bei Täuschung automatisch nichtig.", s:0, say:"Automatisch? Bist du sicher?", why:"Bei Täuschung ist der Vertrag anfechtbar, nicht automatisch nichtig. Man muss aktiv anfechten."},
       {t:"Nichts tun – gekauft ist gekauft.", s:0, say:"Dann bleiben wir auf den Fälschungen sitzen …", why:"Wer getäuscht wurde, kann anfechten. Dann ist der Vertrag von Anfang an nichtig."}],
      term:"Arglistige Täuschung", def:"Jemand verschweigt oder lügt absichtlich. Der Vertrag ist anfechtbar – 1 Jahr ab Entdecken.",
      ihk:"Ein Händler verkauft eine vergoldete Kette als „echte Goldkette“ → anfechtbar (arglistige Täuschung).",
      weil:["…weil man bei arglistiger Täuschung innerhalb eines Jahres nach dem Entdecken anfechten kann.","…weil bei Täuschung eine Frist von 3 Tagen gilt.","…weil ein Vertrag mit Täuschung nichtig ist, ohne dass man etwas tun muss."]},
     {id:"k8d2b", who:{n:"Mo", d:"Gitarrist der Band", look:{s:4,h:"#0F0F0F",st:"locken",c:"#212F3D",a:"e"}},
      sit:"Der Gitarrist Mo lacht am Stand: „Für eine Cola verkauf ich dir meine Gitarre!“ Alle lachen mit. Lina will die Gitarre am Abend abholen.",
      q:"Was gilt?",
      opts:[
       {t:"Kein Vertrag: Das war ein Scherzgeschäft. Beide wussten, dass es nicht ernst gemeint war – es ist nichtig.", s:2, say:"Haha, genau! Die Cola nehm ich aber trotzdem.", why:"Ein Scherzgeschäft ist nichtig, wenn beide wissen, dass es nicht ernst gemeint ist."},
       {t:"Mo muss den Vertrag erst anfechten.", s:0, say:"Anfechten? Für einen Witz?", why:"Bei einem Scherzgeschäft gibt es von Anfang an keinen Vertrag. Man muss nichts anfechten."},
       {t:"Gültig – gesagt ist gesagt.", s:0, say:"Vergiss es! Das war ein Witz!", why:"Ein Scherz ist keine ernsthafte Willenserklärung. Das Geschäft ist nichtig."}],
      term:"Scherzgeschäft", def:"Beide wissen, dass es nicht ernst gemeint ist. Das Rechtsgeschäft ist nichtig.",
      ihk:"Tom sagt im Spaß zu Kollegen: „Für eine Flasche Wasser gebe ich euch mein Monatsgehalt!“ → nichtig (Scherzgeschäft).",
      weil:["…weil ein Scherzgeschäft nichtig ist, wenn beide wissen, dass es nicht ernst gemeint ist.","…weil mündliche Verträge immer nichtig sind.","…weil Musiker beschränkt geschäftsfähig sind."]} ] ],
  mini:"gna",
  profi:[
   {id:"p8a", q:"Ein Online-Shop schreibt in die AGB: „Reklamationen nur innerhalb von 3 Tagen nach Lieferung.“ Gilt das gegenüber Privatkunden?", opts:["Nein – die Klausel benachteiligt Kunden unangemessen. Die gesetzliche Gewährleistung beträgt 2 Jahre.","Ja – AGB gelten immer.","Ja – wenn der Shop die Klausel fett druckt."]},
   {id:"p8b", q:"Was ist der Unterschied zwischen nichtig und anfechtbar?", opts:["Nichtig: von Anfang an kein Vertrag. Anfechtbar: Der Vertrag gilt, bis jemand aktiv anficht.","Nichtig heißt: Man muss innerhalb eines Jahres anfechten.","Anfechtbar heißt: Der Vertrag hat nie gegolten."]} ] },

{ id:"k9", mod:9, day:"SO", time:"17:00", title:"Der letzte Abend beginnt", topic:"Der Kaufvertrag",
  story:"Sonntag, 17 Uhr. Der letzte Abend beginnt, am Stand ist richtig viel los. Nach drei Tagen sind die Preisschilder ziemlich durcheinander – und Jana braucht Nachschub.",
  words:["der Antrag","die Annahme","das Angebot","die Bestellung","die Auftragsbestätigung","verbindlich","unverbindlich","die Freizeichnungsklausel","die Anpreisung","die Pflicht","der Verbrauchsgüterkauf","der Handelskauf"],
  decs:[
   [ {id:"k9d1a", who:{n:"Herr Yilmaz", d:"Gast mit Powerbank", look:{s:3,h:"#1C1C1C",st:"kurz",c:"#16A085",a:"e"}},
      sit:"Am Stand steht auf dem Schild: Powerbank 19,99 €. Die Kasse zeigt 29,99 €. Herr Yilmaz verlangt den Preis vom Schild.",
      q:"Was sagst du?",
      opts:[
       {t:"„Danke für den Hinweis! Dann bekommen Sie die Powerbank zum Preis auf dem Schild. Ich lasse das Schild gleich korrigieren.“", s:2, say:"Das ist fair. Danke!", why:"Rechtlich ist das Schild kein Angebot – der Kunde macht an der Kasse den Antrag. Kundenorientiert und üblich ist es aber, den ausgezeichneten Preis zu geben."},
       {t:"„Das Schild ist kein verbindliches Angebot. Sie zahlen 29,99 €.“", s:1, say:"Rechtlich vielleicht. Aber nett ist das nicht.", why:"Rechtlich richtig: Ausgestellte Ware ist kein verbindliches Angebot. Kundenorientiert wäre es, den Schildpreis zu geben."},
       {t:"„Rechtlich muss ich Ihnen den Preis auf dem Schild geben.“", s:0, say:"Na dann – her damit.", why:"Die Begründung ist falsch: Ware im Regal oder Schaufenster ist kein verbindliches Angebot."}],
      term:"Anpreisung (kein Angebot)", def:"Schaufenster, Regal, Prospekt, Onlineshop richten sich an alle. Sie sind eine Aufforderung, ein Angebot abzugeben.",
      ihk:"Sie können die Forderung ablehnen, da eine im Schaufenster ausgestellte Ware rechtlich ein unverbindliches Angebot ist.",
      weil:["…weil die Ware am Stand kein verbindliches Angebot ist – den Schildpreis gibt man aus Kundenorientierung.","…weil jedes Preisschild ein verbindliches Angebot ist.","…weil der Kunde nach drei Tagen ein Recht auf den Schildpreis hat."]},
     {id:"k9d1b", who:{n:"Ben", d:"Gast mit leerem Handy-Akku", look:{s:2,h:"#5C4033",st:"cap",c:"#E67E22",a:"e"}},
      sit:"Ben legt ein Festival-Cap auf den Tresen. Du scannst es: „Das macht 18 Euro.“ Da merkt er: Handy-Akku leer, kein Bargeld. „Dann ist ja noch nichts gekauft.“",
      q:"Was stimmt?",
      opts:[
       {t:"„Doch, der Kaufvertrag ist schon da: Sie haben das Cap hingelegt, ich habe es gescannt. Ich lege es Ihnen zurück, bis Sie Geld holen.“", s:2, say:"Ach so. Okay, ich bin in 10 Minuten zurück.", why:"Ware hinlegen = Antrag. Scannen und Preis nennen = Annahme. Zwei übereinstimmende Willenserklärungen = Kaufvertrag."},
       {t:"„Stimmt, ein Kaufvertrag entsteht erst beim Bezahlen.“", s:0, say:"Gut, dann tschüss!", why:"Beim Bezahlen wird der Vertrag erfüllt. Zustande kommt er schon beim Scannen."},
       {t:"„Der Vertrag war schon da, als Sie das Cap vom Ständer genommen haben.“", s:0, say:"Echt? Schon da?", why:"Das Nehmen aus dem Regal ist noch kein Antrag. Antrag ist das Hinlegen an der Kasse."}],
      term:"Antrag und Annahme an der Kasse", def:"Antrag: Kunde legt die Ware aufs Band. Annahme: Kassenkraft scannt und nennt den Preis.",
      ihk:"Antrag: Der Kunde legt die Ware auf das Transportband an der Kasse. Annahme: Die Kassiererin scannt die Artikel und nennt den Kaufpreis.",
      weil:["…weil zwei übereinstimmende Willenserklärungen vorliegen: hinlegen = Antrag, scannen = Annahme.","…weil ein Kaufvertrag erst mit der Bezahlung entsteht.","…weil das Herausnehmen aus dem Regal schon der Antrag ist."]} ],
   [ {id:"k9d2a", who:{n:"Jana Ahrens", d:"bestellt Regencapes nach", look:{s:2,h:"#B5651D",st:"dutt",c:"#1F8A8A",a:"e"}},
      sit:"Jana bestellt Regencapes: 10.08. Anfrage · 11.08. Angebot „solange der Vorrat reicht“ · 12.08. Bestellung · 13.08. Auftragsbestätigung · 14.08. Lieferung · 30.08. Zahlung.",
      q:"An welchem Tag ist der Kaufvertrag zustande gekommen?",
      opts:[
       {t:"Am 13.08. – mit der Auftragsbestätigung.", s:2, say:"Richtig. Das Angebot war ja unverbindlich.", why:"„Solange der Vorrat reicht“ macht das Angebot unverbindlich. Die Bestellung ist der Antrag, die Auftragsbestätigung die Annahme."},
       {t:"Am 12.08. – mit der Bestellung.", s:0, say:"Fast. Aber war das Angebot verbindlich?", why:"Das wäre richtig bei einem verbindlichen Angebot. „Solange der Vorrat reicht“ ist eine Freizeichnungsklausel."},
       {t:"Am 14.08. – mit der Lieferung.", s:0, say:"Lieferung? Da war der Vertrag längst da.", why:"Lieferung und Zahlung sind nie das Datum des Kaufvertrags."}],
      term:"Freizeichnungsklausel", def:"„freibleibend“, „unverbindlich“, „solange der Vorrat reicht“: Das Angebot ist unverbindlich. Erst die Auftragsbestätigung macht den Vertrag.",
      ihk:"Datumsaufgabe: 1. Antrag suchen (ist das Angebot verbindlich?). 2. Annahme suchen. 3. Das Datum der Annahme ist der Tag des Kaufvertrags.",
      weil:["…weil „solange der Vorrat reicht“ das Angebot unverbindlich macht: Bestellung = Antrag, Auftragsbestätigung = Annahme.","…weil ein Kaufvertrag immer mit der Lieferung entsteht.","…weil die Anfrage schon der Antrag ist."]},
     {id:"k9d2b", who:{n:"Jana Ahrens", d:"eure Chefin", look:{s:2,h:"#B5651D",st:"dutt",c:"#1F8A8A",a:"e"}},
      sit:"Der Vertrag mit dem Großhändler steht. Jana fragt: „Was müssen wir als Käufer jetzt noch tun?“",
      q:"Was sind die Pflichten des Käufers?",
      opts:[
       {t:"Die Ware abnehmen und den Kaufpreis bezahlen.", s:2, say:"Genau. Und der Großhändler liefert mangelfrei.", why:"Der Käufer muss den Kaufpreis bezahlen und die Ware abnehmen."},
       {t:"Nur bezahlen. Abnehmen muss man nichts.", s:1, say:"Und wer nimmt den Lkw in Empfang?", why:"Bezahlen ist richtig. Die zweite Pflicht ist: die Ware abnehmen."},
       {t:"Die Ware mangelfrei und rechtzeitig übergeben.", s:0, say:"Das ist doch Sache des Großhändlers!", why:"Das ist eine Pflicht des Verkäufers, nicht des Käufers."}],
      term:"Pflichten aus dem Kaufvertrag", def:"Verkäufer: Ware mangelfrei und rechtzeitig übergeben, Eigentum verschaffen, Kaufpreis annehmen. Käufer: Kaufpreis bezahlen, Ware abnehmen.",
      ihk:"Pflichten des Käufers: den Kaufpreis bezahlen, die Ware abnehmen.",
      weil:["…weil der Käufer zwei Pflichten hat: Kaufpreis bezahlen und Ware abnehmen.","…weil der Käufer dem Verkäufer das Eigentum verschaffen muss.","…weil der Käufer die Ware rechtzeitig übergeben muss."]},
     {id:"k9d2c", who:{n:"Frau Nowak", d:"kauft ein Regencape", look:{s:1,h:"#C7A27C",st:"lang",c:"#AF7AC5",a:"o"}},
      sit:"Frau Nowak, eine Rentnerin, kauft bei euch ein Regencape. Lina fragt: „Was ist das eigentlich für ein Kaufvertrag?“",
      q:"Was antwortet ihr?",
      opts:[
       {t:"Einseitiger Handelskauf (Verbrauchsgüterkauf): Ein Unternehmen verkauft an eine Privatperson.", s:2, say:"Ich bin ganz privat hier, ja!", why:"Verkauft ein Unternehmen an eine Privatperson, ist das ein einseitiger Handelskauf (Verbrauchsgüterkauf)."},
       {t:"Zweiseitiger Handelskauf.", s:0, say:"Ich bin doch keine Firma!", why:"Zweiseitiger Handelskauf: Beide sind Unternehmen (Kaufleute)."},
       {t:"Bürgerlicher Kauf.", s:0, say:"Hm, ihr seid doch ein Geschäft, oder?", why:"Bürgerlicher Kauf: Privatperson kauft von Privatperson, z. B. Flohmarkt."}],
      term:"Arten des Kaufvertrags", def:"Bürgerlicher Kauf: privat ↔ privat. Einseitiger Handelskauf: Unternehmen → Privatperson. Zweiseitiger Handelskauf: Unternehmen ↔ Unternehmen.",
      ihk:"Einseitiger Handelskauf, weil Frau Müller eine Privatperson ist.",
      weil:["…weil ein Unternehmen an eine Privatperson verkauft.","…weil beide Seiten Kaufleute sind.","…weil auf Festivals immer der bürgerliche Kauf gilt."]} ] ],
  mini:"zeit",
  profi:[
   {id:"p9a", q:"Max (19) bietet Arne in der Pause seinen Laptop für 200 € an. Arne will überlegen. Nachmittags verkauft Max an Hannes. Am nächsten Tag sagt Arne: „Ich nehme ihn!“ Muss Max an Arne liefern?", opts:["Nein – ein mündlicher Antrag unter Anwesenden kann nur sofort angenommen werden.","Ja – ein Antrag gilt immer 14 Tage.","Ja – Arne wurde zuerst gefragt."]},
   {id:"p9b", q:"Ein Angebot ist ohne Einschränkung. Ihr bestellt aber mit 10 % statt 5 % Rabatt. Der Lieferant bestätigt die 10 %. Wann entsteht der Kaufvertrag?", opts:["Mit der Auftragsbestätigung – die abweichende Bestellung ist ein neuer Antrag.","Mit der Bestellung, weil ein Angebot vorlag.","Mit der Lieferung."]} ] },

{ id:"k10", mod:10, day:"SO", time:"23:00", title:"Abbau und Entscheidung", topic:"Besitz und Eigentum",
  story:"Sonntag, 23 Uhr. Der letzte Song ist gespielt. Abbau! Jetzt muss geklärt werden, was wem gehört. Und dann verkündet Ole Brodersen, welcher Stand 2027 wiederkommen darf.",
  words:["der Besitz","der Besitzer","das Eigentum","der Eigentümer","die tatsächliche Herrschaft","die rechtliche Herrschaft","die Einigung","die Übergabe","der Eigentumsvorbehalt","die Rate","der Teilzahlungskauf"],
  decs:[
   [ {id:"k10d1a", who:{n:"Lina", d:"packt den Lieferwagen", look:{s:3,h:"#1E1410",st:"zopf",c:"#E4572E",a:"t"}},
      sit:"Lina will die gemietete Kühltruhe mit ins Lager nach Bremerhaven nehmen: „Die steht seit drei Tagen bei uns. Also gehört sie uns.“",
      q:"Was sagt ihr?",
      opts:[
       {t:"„Nein. Wir sind nur Besitzer. Eigentümer bleibt der Vermieter – die Truhe geht zurück.“", s:2, say:"Stimmt, gemietet heißt nicht gekauft.", why:"Besitz = tatsächliche Herrschaft (wer hat die Sache?). Eigentum = rechtliche Herrschaft (wem gehört sie?). Beim Mieten fallen beide auseinander."},
       {t:"„Wir sind Eigentümer, der Vermieter ist Besitzer.“", s:0, say:"Hä? Dann dürfen wir sie mitnehmen?", why:"Genau andersherum: Ihr habt die Truhe (Besitzer), sie gehört dem Vermieter (Eigentümer)."},
       {t:"„Stimmt. Wer etwas drei Tage hat, wird Eigentümer.“", s:0, say:"Super, ab in den Wagen!", why:"Durch Haben wird man nicht Eigentümer. Eigentum geht durch Einigung und Übergabe über."}],
      term:"Besitz und Eigentum", def:"Besitz = tatsächliche Herrschaft: Wer hat die Sache? Eigentum = rechtliche Herrschaft: Wem gehört die Sache?",
      ihk:"Eigentum ist die rechtliche Herrschaft, Besitz ist die tatsächliche Herrschaft.",

let RNG = Math.random, CHAL = false;
function seedRng(str){ let h = 1779033703 ^ str.length; for(let i=0;i<str.length;i++){ h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = h<<13 | h>>>19; } let a = h>>>0;
  return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14)>>>0) / 4294967296; }; }
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(RNG()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
