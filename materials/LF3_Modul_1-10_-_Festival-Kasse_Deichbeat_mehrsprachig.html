nehmen.":{"tr":"Medeni satış (bürgerlicher Kauf): özel kişi ↔ özel kişi. Tek taraflı ticari satış (einseitiger Handelskauf): işletme → özel kişi. İki taraflı ticari satış (zweiseitiger Handelskauf): işletme ↔ işletme.","vi":"Mua bán dân sự (bürgerlicher Kauf): cá nhân ↔ cá nhân. Mua bán thương mại một phía (einseitiger Handelskauf): doanh nghiệp → cá nhân. Mua bán thương mại hai phía (zweiseitiger Handelskauf): doanh nghiệp ↔ doanh nghiệp.","ar":"البيع المدني (bürgerlicher Kauf): فرد ↔ فرد. البيع التجاري من طرف واحد: شركة → فرد. البيع التجاري من طرفين: شركة ↔ شركة."},"Einseitiger Handelskauf, weil Frau Müller eine Privatperson ist.":{"tr":"Tek taraflı ticari satış, çünkü Bayan Müller özel kişidir.","vi":"Mua bán thương mại một phía (einseitiger Handelskauf), vì bà Müller là cá nhân.","ar":"بيع تجاري من طرف واحد، لأن السيدة مولر فرد عادي."},"Einseitiger Handelskauf (Verbrauchsgüterkauf): Ein Unternehmen verkauft an eine Privatperson.":{"tr":"Tek taraflı ticari satış (Verbrauchsgüterkauf, tüketici satışı): Bir işletme özel kişiye satar.","vi":"Mua bán thương mại một phía (einseitiger Handelskauf, Verbrauchsgüterkauf): một doanh nghiệp bán cho một cá nhân.","ar":"بيع تجاري من طرف واحد (Verbrauchsgüterkauf – بيع سلع الاستهلاك): شركة تبيع لفرد."},"Ich bin ganz privat hier, ja!":{"tr":"Ben buraya tamamen özel olarak geldim, evet!","vi":"Tôi đến đây hoàn toàn với tư cách cá nhân, đúng vậy!","ar":"أنا هنا بصفتي الشخصية تماماً، نعم!"},"Verkauft ein Unternehmen an eine Privatperson, ist das ein einseitiger Handelskauf (Verbrauchsgüterkauf).":{"tr":"Bir işletme özel kişiye satış yaparsa bu tek taraflı ticari satıştır (Verbrauchsgüterkauf, tüketici satışı).","vi":"Khi một doanh nghiệp bán cho một cá nhân, đó là mua bán thương mại một phía (einseitiger Handelskauf, Verbrauchsgüterkauf).","ar":"إذا باعت شركة لفرد، فهذا بيع تجاري من طرف واحد (Verbrauchsgüterkauf – بيع سلع الاستهلاك)."},"Zweiseitiger Handelskauf.":{"tr":"İki taraflı ticari satış.","vi":"Mua bán thương mại hai phía (zweiseitiger Handelskauf).","ar":"بيع تجاري من طرفين."},"Ich bin doch keine Firma!":{"tr":"Ben şirket değilim ki!","vi":"Tôi đâu phải công ty!","ar":"لكنني لست شركة!"},"Zweiseitiger Handelskauf: Beide sind Unternehmen (Kaufleute).":{"tr":"İki taraflı ticari satış: İkisi de işletmedir (tüccar, Kaufleute).","vi":"Mua bán thương mại hai phía (zweiseitiger Handelskauf): cả hai đều là doanh nghiệp (thương nhân).","ar":"بيع تجاري من طرفين: كلاهما شركة (تاجر)."},"Bürgerlicher Kauf.":{"tr":"Medeni satış.","vi":"Mua bán dân sự (bürgerlicher Kauf).","ar":"بيع مدني."},"Hm, ihr seid doch ein Geschäft, oder?":{"tr":"Hmm, siz bir işletmesiniz, değil mi?","vi":"Ừm, các bạn là một cửa hàng mà, đúng không?","ar":"همم، أنتم متجر، أليس كذلك؟"},"Bürgerlicher Kauf: Privatperson kauft von Privatperson, z. B. Flohmarkt.":{"tr":"Medeni satış: Özel kişi özel kişiden satın alır, örneğin bit pazarı.","vi":"Mua bán dân sự (bürgerlicher Kauf): cá nhân mua của cá nhân, ví dụ ở chợ đồ cũ.","ar":"بيع مدني: فرد يشتري من فرد، مثلاً في سوق الأشياء المستعملة."},"…weil ein Unternehmen an eine Privatperson verkauft.":{"tr":"…çünkü bir işletme özel kişiye satış yapıyor.","vi":"…vì một doanh nghiệp bán cho một cá nhân.","ar":"…لأن شركة تبيع لفرد."},"…weil beide Seiten Kaufleute sind.":{"tr":"…çünkü iki taraf da tüccardır (Kaufleute).","vi":"…vì cả hai bên đều là thương nhân.","ar":"…لأن الطرفين تاجران."},"…weil auf Festivals immer der bürgerliche Kauf gilt.":{"tr":"…çünkü festivallerde her zaman medeni satış (bürgerlicher Kauf) geçerlidir.","vi":"…vì ở lễ hội luôn áp dụng mua bán dân sự.","ar":"…لأن البيع المدني يسري دائماً في المهرجانات."},"Max (19) bietet Arne in der Pause seinen Laptop für 200 € an. Arne will überlegen. Nachmittags verkauft Max an Hannes. Am nächsten Tag sagt Arne: „Ich nehme ihn!“ Muss Max an Arne liefern?":{"tr":"Max (19) teneffüste Arne'ye dizüstü bilgisayarını 200 € karşılığında sunuyor. Arne düşünmek istiyor. Öğleden sonra Max bilgisayarı Hannes'e satıyor. Ertesi gün Arne: „Alıyorum!“ diyor. Max, Arne'ye teslim etmek zorunda mı?","vi":"Max (19 tuổi) chào bán chiếc laptop của mình cho Arne với giá 200 € trong giờ nghỉ. Arne muốn suy nghĩ. Buổi chiều Max bán cho Hannes. Hôm sau Arne nói: „Tôi lấy nó!“ Max có phải giao cho Arne không?","ar":"يعرض ماكس (19 سنة) على آرنه حاسوبه المحمول بسعر 200 € في الاستراحة. يريد آرنه أن يفكر. بعد الظهر يبيعه ماكس لهانس. في اليوم التالي يقول آرنه: „أنا آخذه!“ هل على ماكس أن يسلّم الحاسوب لآرنه؟"},"Nein – ein mündlicher Antrag unter Anwesenden kann nur sofort angenommen werden.":{"tr":"Hayır – hazır bulunanlar arasında yapılan sözlü teklif (Antrag) ancak hemen kabul edilebilir.","vi":"Không – một đề nghị bằng miệng giữa những người có mặt chỉ có thể được chấp nhận ngay lập tức.","ar":"لا – الإيجاب الشفهي بين حاضرين لا يمكن قبوله إلا فوراً."},"Ja – ein Antrag gilt immer 14 Tage.":{"tr":"Evet – bir teklif her zaman 14 gün geçerlidir.","vi":"Có – một đề nghị luôn có hiệu lực 14 ngày.","ar":"نعم – الإيجاب يسري دائماً 14 يوماً."},"Ja – Arne wurde zuerst gefragt.":{"tr":"Evet – önce Arne'ye sorulmuştu.","vi":"Có – Arne được hỏi trước.","ar":"نعم – آرنه كان أول من سُئل."},"Ein Angebot ist ohne Einschränkung. Ihr bestellt aber mit 10 % statt 5 % Rabatt. Der Lieferant bestätigt die 10 %. Wann entsteht der Kaufvertrag?":{"tr":"Bir satış teklifi kısıtlama içermiyor. Ama siz %5 yerine %10 indirimle sipariş veriyorsunuz. Tedarikçi %10'u onaylıyor. Satış sözleşmesi ne zaman oluşur?","vi":"Một báo giá không có điều kiện hạn chế. Nhưng các bạn đặt hàng với giảm giá 10 % thay vì 5 %. Nhà cung cấp xác nhận 10 %. Hợp đồng mua bán hình thành khi nào?","ar":"العرض بلا أي قيود. لكنكم تطلبون بخصم 10 % بدلاً من 5 %. يؤكد المورّد الـ 10 %. متى ينشأ عقد البيع؟"},"Mit der Auftragsbestätigung – die abweichende Bestellung ist ein neuer Antrag.":{"tr":"Sipariş onayı (Auftragsbestätigung) ile – farklı olan sipariş yeni bir tekliftir (Antrag).","vi":"Khi có xác nhận đơn hàng – đơn đặt hàng khác với báo giá là một đề nghị mới.","ar":"مع تأكيد الطلب – فالطلب المخالف إيجاب جديد."},"Mit der Bestellung, weil ein Angebot vorlag.":{"tr":"Siparişle, çünkü bir satış teklifi vardı.","vi":"Khi có đơn đặt hàng, vì đã có báo giá.","ar":"مع الطلب، لأنه كان هناك عرض."},"Mit der Lieferung.":{"tr":"Teslimatla.","vi":"Khi giao hàng.","ar":"مع التسليم."},"Abbau und Entscheidung":{"tr":"Söküm ve karar","vi":"Dọn dẹp và quyết định","ar":"التفكيك والقرار"},"Besitz und Eigentum":{"tr":"Zilyetlik (Besitz) ve mülkiyet (Eigentum)","vi":"Sự chiếm hữu (Besitz) và quyền sở hữu (Eigentum)","ar":"الحيازة والملكية"},"Sonntag, 23 Uhr. Der letzte Song ist gespielt. Abbau! Jetzt muss geklärt werden, was wem gehört. Und dann verkündet Ole Brodersen, welcher Stand 2027 wiederkommen darf.":{"tr":"Pazar, saat 23. Son şarkı çalındı. Söküm zamanı! Şimdi neyin kime ait olduğu netleşmeli. Sonra Ole Brodersen hangi standın 2027'de tekrar gelebileceğini açıklıyor.","vi":"Chủ nhật, 23 giờ. Bài hát cuối cùng đã kết thúc. Dỡ gian hàng! Bây giờ phải làm rõ cái gì thuộc về ai. Rồi ông Ole Brodersen sẽ thông báo gian hàng nào được quay lại năm 2027.","ar":"الأحد، الساعة 23. عُزفت الأغنية الأخيرة. التفكيك! الآن يجب توضيح لمن يعود كل شيء. ثم يعلن أولي برودرسن أي كشك سيعود في 2027."},"der Besitz":{"tr":"zilyetlik (elinde bulundurma)","vi":"sự chiếm hữu","ar":"الحيازة"},"der Besitzer":{"tr":"zilyet (elinde bulunduran)","vi":"người chiếm hữu","ar":"الحائز"},"das Eigentum":{"tr":"mülkiyet","vi":"quyền sở hữu","ar":"الملكية"},"der Eigentümer":{"tr":"mülk sahibi","vi":"chủ sở hữu","ar":"المالك"},"die tatsächliche Herrschaft":{"tr":"fiilî hâkimiyet","vi":"quyền kiểm soát thực tế","ar":"السيطرة الفعلية"},"die rechtliche Herrschaft":{"tr":"hukuki hâkimiyet","vi":"quyền kiểm soát pháp lý","ar":"السيطرة القانونية"},"die Einigung":{"tr":"anlaşma","vi":"sự thỏa thuận","ar":"الاتفاق"},"die Übergabe":{"tr":"teslim","vi":"sự bàn giao","ar":"التسليم"},"der Eigentumsvorbehalt":{"tr":"mülkiyetin saklı tutulması","vi":"bảo lưu quyền sở hữu","ar":"الاحتفاظ بالملكية"},"die Rate":{"tr":"taksit","vi":"khoản trả góp (từng kỳ)","ar":"القسط"},"der Teilzahlungskauf":{"tr":"taksitli satış","vi":"mua trả góp (Teilzahlungskauf)","ar":"البيع بالتقسيط"},"packt den Lieferwagen":{"tr":"teslimat aracını yüklüyor","vi":"xếp hàng lên xe tải","ar":"يحمّل سيارة التوصيل"},"Lina will die gemietete Kühltruhe mit ins Lager nach Bremerhaven nehmen: „Die steht seit drei Tagen bei uns. Also gehört sie uns.“":{"tr":"Lina kiralanan dondurucuyu Bremerhaven'daki depoya götürmek istiyor: „Üç gündür bizde duruyor. Yani bize ait.“","vi":"Lina muốn mang chiếc tủ đông thuê về kho ở Bremerhaven: „Nó ở chỗ chúng ta ba ngày rồi. Vậy là nó thuộc về chúng ta.“","ar":"تريد لينا أن تأخذ الثلاجة المستأجرة معها إلى المستودع في Bremerhaven: „هي عندنا منذ ثلاثة أيام. إذن هي ملكنا.“"},"Besitz = tatsächliche Herrschaft: Wer hat die Sache? Eigentum = rechtliche Herrschaft: Wem gehört die Sache?":{"tr":"Zilyetlik (Besitz) = fiilî hâkimiyet: Şey kimde? Mülkiyet (Eigentum) = hukuki hâkimiyet: Şey kimin?","vi":"Chiếm hữu (Besitz) = quyền kiểm soát thực tế: ai đang giữ vật? Sở hữu (Eigentum) = quyền kiểm soát pháp lý: vật thuộc về ai?","ar":"الحيازة (Besitz) = السيطرة الفعلية: من لديه الشيء؟ الملكية (Eigentum) = السيطرة القانونية: لمن يعود الشيء؟"},"Eigentum ist die rechtliche Herrschaft, Besitz ist die tatsächliche Herrschaft.":{"tr":"Mülkiyet hukuki hâkimiyettir, zilyetlik ise fiilî hâkimiyettir.","vi":"Sở hữu (Eigentum) là quyền kiểm soát pháp lý, chiếm hữu (Besitz) là quyền kiểm soát thực tế.","ar":"الملكية هي السيطرة القانونية، والحيازة هي السيطرة الفعلية."},"„Nein. Wir sind nur Besitzer. Eigentümer bleibt der Vermieter – die Truhe geht zurück.“":{"tr":"„Hayır. Biz sadece zilyetiz (Besitzer). Mülk sahibi (Eigentümer) kiraya veren kalır – dondurucu geri gider.“","vi":"„Không. Chúng ta chỉ là người chiếm hữu (Besitzer). Chủ sở hữu (Eigentümer) vẫn là bên cho thuê – chiếc tủ phải trả lại.“","ar":"„لا. نحن مجرد حائزين. يبقى المالك هو المؤجِّر – الثلاجة تعود إليه.“"},"Stimmt, gemietet heißt nicht gekauft.":{"tr":"Doğru, kiralamak satın almak demek değildir.","vi":"Đúng, thuê không có nghĩa là mua.","ar":"صحيح، مستأجرة لا تعني مشتراة."},"Besitz = tatsächliche Herrschaft (wer hat die Sache?). Eigentum = rechtliche Herrschaft (wem gehört sie?). Beim Mieten fallen beide auseinander.":{"tr":"Zilyetlik (Besitz) = fiilî hâkimiyet (şey kimde?). Mülkiyet (Eigentum) = hukuki hâkimiyet (kimin?). Kiralamada ikisi ayrılır.","vi":"Chiếm hữu (Besitz) = quyền kiểm soát thực tế (ai đang giữ vật?). Sở hữu (Eigentum) = quyền kiểm soát pháp lý (vật thuộc về ai?). Khi thuê, hai điều này tách rời nhau.","ar":"الحيازة = السيطرة الفعلية (من لديه الشيء؟). الملكية = السيطرة القانونية (لمن يعود؟). في الإيجار ينفصل الاثنان."},"„Wir sind Eigentümer, der Vermieter ist Besitzer.“":{"tr":"„Biz mülk sahibiyiz (Eigentümer), kiraya veren zilyettir (Besitzer).“","vi":"„Chúng ta là chủ sở hữu, bên cho thuê là người chiếm hữu.“","ar":"„نحن المالكون، والمؤجِّر هو الحائز.“"},"Hä? Dann dürfen wir sie mitnehmen?":{"tr":"Ne? O zaman götürebilir miyiz?","vi":"Hả? Vậy chúng ta được mang đi à?","ar":"ماذا؟ إذن يحق لنا أن نأخذها؟"},"Genau andersherum: Ihr habt die Truhe (Besitzer), sie gehört dem Vermieter (Eigentümer).":{"tr":"Tam tersi: Dondurucu sizde (zilyet), kiraya verene ait (mülk sahibi).","vi":"Ngược lại hoàn toàn: các bạn đang giữ chiếc tủ (người chiếm hữu), nó thuộc về bên cho thuê (chủ sở hữu).","ar":"العكس تماماً: أنتم لديكم الثلاجة (حائزون)، وهي تعود للمؤجِّر (مالك)."},"„Stimmt. Wer etwas drei Tage hat, wird Eigentümer.“":{"tr":"„Doğru. Bir şeye üç gün sahip olan, mülk sahibi olur.“","vi":"„Đúng. Ai giữ một vật ba ngày thì trở thành chủ sở hữu.“","ar":"„صحيح. من يحتفظ بشيء ثلاثة أيام يصبح مالكاً.“"},"Super, ab in den Wagen!":{"tr":"Süper, arabaya!","vi":"Tuyệt, đưa lên xe thôi!","ar":"رائع، إلى السيارة!"},"Durch Haben wird man nicht Eigentümer. Eigentum geht durch Einigung und Übergabe über.":{"tr":"Elinde bulundurmakla kimse mülk sahibi olmaz. Mülkiyet anlaşma ve teslimle geçer.","vi":"Chỉ cần đang giữ thì không trở thành chủ sở hữu. Quyền sở hữu được chuyển qua thỏa thuận (Einigung) và bàn giao (Übergabe).","ar":"لا يصبح الإنسان مالكاً لمجرد أن الشيء لديه. تنتقل الملكية بالاتفاق والتسليم."},"…weil Besitz die tatsächliche und Eigentum die rechtliche Herrschaft über eine Sache ist.":{"tr":"…çünkü zilyetlik bir şey üzerindeki fiilî, mülkiyet ise hukuki hâkimiyettir.","vi":"…vì chiếm hữu là quyền kiểm soát thực tế còn sở hữu là quyền kiểm soát pháp lý đối với một vật.","ar":"…لأن الحيازة هي السيطرة الفعلية والملكية هي السيطرة القانونية على شيء."},"…weil Eigentum die tatsächliche und Besitz die rechtliche Herrschaft ist.":{"tr":"…çünkü mülkiyet fiilî, zilyetlik ise hukuki hâkimiyettir.","vi":"…vì sở hữu là quyền kiểm soát thực tế còn chiếm hữu là quyền kiểm soát pháp lý.","ar":"…لأن الملكية هي السيطرة الفعلية والحيازة هي السيطرة القانونية."},"…weil Eigentum nur durch Eintragung ins Grundbuch übergeht.":{"tr":"…çünkü mülkiyet yalnızca tapu siciline kayıtla geçer.","vi":"…vì quyền sở hữu chỉ được chuyển qua việc đăng ký vào sổ địa chính.","ar":"…لأن الملكية لا تنتقل إلا بالتسجيل في السجل العقاري."},"hat einen „Tipp“":{"tr":"bir „ipucu“ aldı","vi":"có một „mẹo“","ar":"لديه „نصيحة“"},"Beim Abbau habt ihr einem Fremden ein fast neues Lastenrad für 150 € abgekauft. Jetzt kommt raus: Es war gestohlen. Kevin sagt: „Egal, ihr habt bezahlt. Also gehört es euch.“":{"tr":"Söküm sırasında yabancı birinden 150 € karşılığında neredeyse yeni bir yük bisikleti satın aldınız. Şimdi ortaya çıkıyor: Çalıntıymış. Kevin: „Fark etmez, ödediniz. Yani sizin.“ diyor.","vi":"Khi dỡ gian hàng, các bạn mua của một người lạ chiếc xe đạp chở hàng gần như mới với giá 150 €. Giờ lộ ra: nó là đồ ăn trộm. Kevin nói: „Kệ, các bạn đã trả tiền. Vậy là nó thuộc về các bạn.“","ar":"عند التفكيك اشتريتم من شخص غريب دراجة شحن شبه جديدة بسعر 150 €. الآن يتبيّن: كانت مسروقة. يقول كيفن: „لا يهم، لقد دفعتم. إذن هي لكم.“"},"Gestohlene Sachen":{"tr":"Çalıntı eşyalar","vi":"Đồ bị đánh cắp","ar":"الأشياء المسروقة"},"An gestohlenen Sachen kann man kein Eigentum erwerben – auch nicht, wenn man nichts vom Diebstahl wusste.":{"tr":"Çalıntı eşyalar üzerinde mülkiyet kazanılamaz – hırsızlıktan haberi olmasa bile.","vi":"Với đồ bị đánh cắp, người ta không thể có được quyền sở hữu – kể cả khi không biết gì về vụ trộm.","ar":"لا يمكن اكتساب ملكية الأشياء المسروقة – حتى لو لم يكن الشخص يعلم بالسرقة."},"Janine kauft auf einem Flohmarkt ein silbernes Armband, ohne zu wissen, dass es gestohlen ist → Das Eigentum geht nicht über.":{"tr":"Janine bit pazarında çalıntı olduğunu bilmeden gümüş bir bilezik satın alıyor → Mülkiyet geçmez.","vi":"Janine mua một chiếc vòng tay bạc ở chợ đồ cũ mà không biết nó bị đánh cắp → Quyền sở hữu không được chuyển.","ar":"تشتري ياناين سواراً فضياً في سوق الأشياء المستعملة دون أن تعلم أنه مسروق → لا تنتقل الملكية."},"„Nein. An gestohlenen Sachen kann man kein Eigentum erwerben – auch wenn man nichts wusste. Das Rad geht zurück.“":{"tr":"„Hayır. Çalıntı eşyalar üzerinde mülkiyet kazanılamaz – bilmeseniz bile. Bisiklet geri gider.“","vi":"„Không. Với đồ bị đánh cắp, không thể có quyền sở hữu – dù không biết gì. Chiếc xe phải trả lại.“","ar":"„لا. لا يمكن اكتساب ملكية الأشياء المسروقة – حتى لو لم نكن نعلم. الدراجة تعود.“"},"Hm. Dann sind die 150 € wohl weg.":{"tr":"Hmm. O zaman 150 € gitmiş.","vi":"Ừm. Vậy 150 € coi như mất rồi.","ar":"همم. إذن ضاعت الـ 150 € على ما يبدو."},"An gestohlenen Sachen erwirbt man kein Eigentum, auch nicht gutgläubig. Eigentümer bleibt die bestohlene Person.":{"tr":"Çalıntı eşyalar üzerinde, iyi niyetle bile mülkiyet kazanılamaz. Mülk sahibi, hırsızlığa uğrayan kişi kalır.","vi":"Với đồ bị đánh cắp, người ta không có được quyền sở hữu, kể cả khi ngay tình. Chủ sở hữu vẫn là người bị mất trộm.","ar":"لا تُكتسب ملكية الأشياء المسروقة، حتى بحسن نية. يبقى المالك هو الشخص الذي سُرق منه الشيء."},"„Wir haben bezahlt, also sind wir Eigentümer.“":{"tr":"„Ödedik, yani mülk sahibi biziz.“","vi":"„Chúng ta đã trả tiền, nên chúng ta là chủ sở hữu.“","ar":"„لقد دفعنا، إذن نحن المالكون.“"},"Sag ich doch!":{"tr":"Ben de öyle diyorum!","vi":"Tôi đã nói mà!","ar":"هذا ما قلته!"},"Bezahlen reicht nicht. Bei gestohlenen Sachen bleibt der Bestohlene Eigentümer.":{"tr":"Ödemek yetmez. Çalıntı eşyalarda hırsızlığa uğrayan kişi mülk sahibi kalır.","vi":"Trả tiền là chưa đủ. Với đồ bị đánh cắp, người bị mất trộm vẫn là chủ sở hữu.","ar":"الدفع لا يكفي. في الأشياء المسروقة يبقى من سُرق منه الشيء هو المالك."},"„Wir sind Eigentümer, weil wir vom Diebstahl nichts wussten.“":{"tr":"„Hırsızlıktan haberimiz olmadığı için mülk sahibi biziz.“","vi":"„Chúng ta là chủ sở hữu vì chúng ta không biết gì về vụ trộm.“","ar":"„نحن المالكون لأننا لم نكن نعلم بالسرقة.“"},"Genau, ihr seid ja unschuldig.":{"tr":"Aynen, siz suçsuzsunuz.","vi":"Đúng, các bạn vô tội mà.","ar":"بالضبط، أنتم أبرياء."},"Auch wer nichts wusste, wird an gestohlenen Sachen nicht Eigentümer.":{"tr":"Bilmeyen kişi de çalıntı eşyalar üzerinde mülk sahibi olmaz.","vi":"Dù không biết gì, người ta cũng không trở thành chủ sở hữu của đồ bị đánh cắp.","ar":"حتى من لم يكن يعلم لا يصبح مالكاً للأشياء المسروقة."},"…weil man an gestohlenen Sachen kein Eigentum erwerben kann – auch nicht gutgläubig.":{"tr":"…çünkü çalıntı eşyalar üzerinde mülkiyet kazanılamaz – iyi niyetle bile.","vi":"…vì với đồ bị đánh cắp, người ta không thể có được quyền sở hữu – kể cả khi ngay tình.","ar":"…لأنه لا يمكن اكتساب ملكية الأشياء المسروقة – حتى بحسن نية."},"…weil man durch Bezahlen immer Eigentümer wird.":{"tr":"…çünkü ödeme yapmakla her zaman mülk sahibi olunur.","vi":"…vì chỉ cần trả tiền là luôn trở thành chủ sở hữu.","ar":"…لأن الإنسان يصبح مالكاً دائماً بالدفع."},"…weil Fahrräder unbewegliche Sachen sind.":{"tr":"…çünkü bisikletler taşınmaz mallardır.","vi":"…vì xe đạp là tài sản bất động.","ar":"…لأن الدراجات أشياء غير منقولة."},"Merch-Lieferant":{"tr":"Ürün tedarikçisi (Merch)","vi":"Nhà cung cấp hàng lưu niệm (Merch)","ar":"مورّد البضائع الدعائية (Merch)"},"Herr Brandt hat euch die Band-Shirts „unter Eigentumsvorbehalt“ geliefert. Die Rechnung ist noch nicht bezahlt. Er fragt: „Wem gehören die Shirts im Moment?“":{"tr":"Bay Brandt grup tişörtlerini size „mülkiyet saklı kalmak kaydıyla“ (unter Eigentumsvorbehalt) teslim etti. Fatura henüz ödenmedi. Soruyor: „Tişörtler şu anda kime ait?“","vi":"Ông Brandt đã giao áo thun ban nhạc cho các bạn „với bảo lưu quyền sở hữu“ (Eigentumsvorbehalt). Hóa đơn chưa được thanh toán. Ông hỏi: „Hiện giờ những chiếc áo thun thuộc về ai?“","ar":"سلّم السيد براندت القمصان „بشرط الاحتفاظ بالملكية“. الفاتورة لم تُدفع بعد. يسأل: „لمن تعود القمصان في الوقت الحالي؟“"},"Eigentumsvorbehalt":{"tr":"Mülkiyetin saklı tutulması (Eigentumsvorbehalt)","vi":"Bảo lưu quyền sở hữu (Eigentumsvorbehalt)","ar":"الاحتفاظ بالملكية"},"„Die Ware bleibt bis zur vollständigen Bezahlung unser Eigentum.“ Käufer = Besitzer, Verkäufer = Eigentümer.":{"tr":"„Mal, tam ödemeye kadar bizim mülkiyetimizde kalır.“ Alıcı = zilyet (Besitzer), satıcı = mülk sahibi (Eigentümer).","vi":"„Hàng vẫn là tài sản của chúng tôi cho đến khi thanh toán đầy đủ.“ Người mua = người chiếm hữu, người bán = chủ sở hữu.","ar":"„تبقى البضاعة ملكنا حتى الدفع الكامل.“ المشتري = الحائز، البائع = المالك."},"Herr Meier ist Besitzer. Die Kaufhaus Hansa GmbH ist Eigentümer bis zur Zahlung der letzten Rate.":{"tr":"Bay Meier zilyettir (Besitzer). Kaufhaus Hansa GmbH, son taksit ödenene kadar mülk sahibidir (Eigentümer).","vi":"Ông Meier là người chiếm hữu (Besitzer). Kaufhaus Hansa GmbH là chủ sở hữu (Eigentümer) cho đến khi trả kỳ cuối cùng.","ar":"السيد ماير هو الحائز. وشركة Kaufhaus Hansa GmbH هي المالك حتى دفع القسط الأخير."},"„Wir sind Besitzer. Sie bleiben Eigentümer, bis die Rechnung ganz bezahlt ist.“":{"tr":"„Biz zilyetiz (Besitzer). Fatura tamamen ödenene kadar siz mülk sahibi (Eigentümer) kalırsınız.“","vi":"„Chúng tôi là người chiếm hữu. Ông vẫn là chủ sở hữu cho đến khi hóa đơn được thanh toán đầy đủ.“","ar":"„نحن الحائزون. وأنتم تبقون المالكين حتى تُدفع الفاتورة بالكامل.“"},"Ganz genau. Und ich freu mich auf die Zahlung.":{"tr":"Aynen öyle. Ödemeyi bekliyorum.","vi":"Chính xác. Và tôi mong chờ khoản thanh toán.","ar":"بالضبط. وأنا أتطلع إلى الدفع."},"Mit Eigentumsvorbehalt: Der Käufer ist Besitzer, der Verkäufer bleibt Eigentümer bis zur vollständigen Zahlung.":{"tr":"Mülkiyetin saklı tutulmasında: Alıcı zilyettir, satıcı tam ödemeye kadar mülk sahibi kalır.","vi":"Có bảo lưu quyền sở hữu (Eigentumsvorbehalt): người mua là người chiếm hữu, người bán vẫn là chủ sở hữu cho đến khi thanh toán đầy đủ.","ar":"مع الاحتفاظ بالملكية: المشتري هو الحائز، ويبقى البائع هو المالك حتى الدفع الكامل."},"„Wir sind Besitzer und Eigentümer, weil die Shirts geliefert wurden.“":{"tr":"„Tişörtler teslim edildiği için hem zilyet hem mülk sahibi biziz.“","vi":"„Chúng tôi vừa là người chiếm hữu vừa là chủ sở hữu, vì áo thun đã được giao.“","ar":"„نحن الحائزون والمالكون لأن القمصان سُلّمت.“"},"Ohne Vorbehalt ja – aber wir haben einen vereinbart!":{"tr":"Saklı tutma olmasaydı evet – ama biz bir tane kararlaştırdık!","vi":"Nếu không có bảo lưu thì đúng – nhưng chúng ta đã thỏa thuận có bảo lưu!","ar":"بدون الشرط نعم – لكننا اتفقنا على شرط!"},"Das wäre richtig ohne Eigentumsvorbehalt (Einigung + Übergabe). Mit Vorbehalt bleibt der Lieferant Eigentümer.":{"tr":"Bu, mülkiyet saklı tutulmasaydı doğru olurdu (anlaşma + teslim). Saklı tutmada tedarikçi mülk sahibi kalır.","vi":"Điều đó sẽ đúng nếu không có bảo lưu quyền sở hữu (thỏa thuận + bàn giao). Có bảo lưu thì nhà cung cấp vẫn là chủ sở hữu.","ar":"هذا يكون صحيحاً بدون الاحتفاظ بالملكية (اتفاق + تسليم). ومع الشرط يبقى المورّد هو المالك."},"„Sie sind Besitzer und Eigentümer.“":{"tr":"„Siz hem zilyet hem mülk sahibisiniz.“","vi":"„Ông vừa là người chiếm hữu vừa là chủ sở hữu.“","ar":"„أنتم الحائزون والمالكون.“"},"Besitzer? Die Shirts liegen doch bei euch!":{"tr":"Zilyet mi? Tişörtler sizde duruyor ya!","vi":"Người chiếm hữu? Áo thun đang ở chỗ các bạn mà!","ar":"حائزون؟ القمصان عندكم!"},"Ihr habt die Shirts – also seid ihr Besitzer. Der Lieferant ist nur Eigentümer.":{"tr":"Tişörtler sizde – yani zilyet sizsiniz. Tedarikçi sadece mülk sahibidir.","vi":"Các bạn đang giữ áo thun – nên các bạn là người chiếm hữu. Nhà cung cấp chỉ là chủ sở hữu.","ar":"القمصان لديكم – إذن أنتم الحائزون. والمورّد هو المالك فقط."},"…weil der Verkäufer mit dem Eigentumsvorbehalt seine Kaufpreisforderung absichert.":{"tr":"…çünkü satıcı, mülkiyetin saklı tutulmasıyla (Eigentumsvorbehalt) satış bedeli alacağını güvence altına alır.","vi":"…vì người bán dùng bảo lưu quyền sở hữu để bảo đảm khoản tiền mua hàng được trả.","ar":"…لأن البائع يؤمّن بالاحتفاظ بالملكية حقه في الثمن."},"…weil man schon mit der ersten Rate Eigentümer wird.":{"tr":"…çünkü ilk taksitle zaten mülk sahibi olunur.","vi":"…vì chỉ với kỳ trả góp đầu tiên là đã trở thành chủ sở hữu.","ar":"…لأن الإنسان يصبح مالكاً بالقسط الأول."},"…weil sonst kein gültiger Kaufvertrag zustande kommt.":{"tr":"…çünkü aksi hâlde geçerli bir satış sözleşmesi oluşmaz.","vi":"…vì nếu không thì không hình thành hợp đồng mua bán có hiệu lực.","ar":"…لأنه بدون ذلك لا ينشأ عقد بيع صحيح."},"prüft die Rechnungen":{"tr":"faturaları kontrol ediyor","vi":"kiểm tra các hóa đơn","ar":"يراجع الفواتير"},"Die Gartenstühle für den Stand: 18.07. Lieferung mit Rechnung · 10.08. Zahlung. In den AGB steht: „Die Ware bleibt bis zur vollständigen Bezahlung unser Eigentum.“":{"tr":"Stand için bahçe sandalyeleri: 18.07. Faturalı teslimat · 10.08. Ödeme. Genel işlem koşullarında (AGB) şöyle yazıyor: „Mal, tamamen ödenene kadar bizim mülkiyetimizde kalır.“","vi":"Ghế vườn cho quầy hàng: 18.07. giao hàng kèm hóa đơn · 10.08. thanh toán. Trong AGB (điều khoản kinh doanh chung) ghi: „Hàng hóa vẫn thuộc quyền sở hữu của chúng tôi cho đến khi được thanh toán đầy đủ.“","ar":"كراسي الحديقة للبسطة: 18.07. التسليم مع الفاتورة · 10.08. الدفع. في الشروط العامة (AGB) مكتوب: „تبقى البضاعة ملكًا لنا حتى الدفع الكامل.“"},"Seit wann gehören euch die Stühle?":{"tr":"Sandalyeler ne zamandan beri size ait?","vi":"Từ khi nào những chiếc ghế thuộc về các bạn?","ar":"منذ متى أصبحت الكراسي ملكًا لكم؟"},"Datum des Eigentumsübergangs":{"tr":"Mülkiyetin geçiş tarihi","vi":"Ngày chuyển quyền sở hữu","ar":"تاريخ انتقال الملكية"},"Ohne Eigentumsvorbehalt: Tag der Lieferung. Mit Eigentumsvorbehalt: Tag der vollständigen Zahlung.":{"tr":"Eigentumsvorbehalt (mülkiyetin saklı tutulması) olmadan: teslimat günü. Mülkiyetin saklı tutulması ile: tam ödeme günü.","vi":"Không có Eigentumsvorbehalt (bảo lưu quyền sở hữu): ngày giao hàng. Có Eigentumsvorbehalt: ngày thanh toán đầy đủ.","ar":"بدون Eigentumsvorbehalt (الاحتفاظ بالملكية): يوم التسليم. مع الاحتفاظ بالملكية: يوم الدفع الكامل."},"Zu welchem Zeitpunkt wird die Kaufhaus Hansa GmbH Eigentümerin? – Bei Lieferung unter Eigentumsvorbehalt: am Tag des Zahlungseingangs.":{"tr":"Kaufhaus Hansa GmbH hangi anda malik (Eigentümerin) olur? – Mülkiyetin saklı tutulması ile yapılan teslimatta: ödemenin geldiği gün.","vi":"Vào thời điểm nào Kaufhaus Hansa GmbH trở thành chủ sở hữu? – Khi giao hàng có Eigentumsvorbehalt (bảo lưu quyền sở hữu): vào ngày nhận được tiền thanh toán.","ar":"متى تصبح Kaufhaus Hansa GmbH مالكة؟ – عند التسليم مع Eigentumsvorbehalt (الاحتفاظ بالملكية): في يوم وصول الدفع."},"Seit dem 10.08. – mit der vollständigen Zahlung.":{"tr":"10.08.'den beri – tam ödeme ile.","vi":"Từ ngày 10.08. – khi thanh toán đầy đủ.","ar":"منذ 10.08. – مع الدفع الكامل."},"Richtig. Der Eigentumsvorbehalt gilt bis zur Zahlung.":{"tr":"Doğru. Mülkiyetin saklı tutulması ödemeye kadar geçerlidir.","vi":"Đúng. Eigentumsvorbehalt (bảo lưu quyền sở hữu) có hiệu lực cho đến khi thanh toán.","ar":"صحيح. الاحتفاظ بالملكية ساري حتى الدفع."},"Mit Eigentumsvorbehalt geht das Eigentum am Tag der vollständigen Zahlung über.":{"tr":"Mülkiyetin saklı tutulması ile mülkiyet, tam ödeme gününde geçer.","vi":"Có Eigentumsvorbehalt (bảo lưu quyền sở hữu), quyền sở hữu chuyển đi vào ngày thanh toán đầy đủ.","ar":"مع الاحتفاظ بالملكية تنتقل الملكية في يوم الدفع الكامل."},"Seit dem 18.07. – mit der Lieferung.":{"tr":"18.07.'den beri – teslimatla.","vi":"Từ ngày 18.07. – khi giao hàng.","ar":"منذ 18.07. – مع التسليم."},"Ohne Vorbehalt stimmt das. Lies die AGB!":{"tr":"Saklı tutma olmadan bu doğrudur. AGB'yi (genel işlem koşulları) oku!","vi":"Nếu không có bảo lưu thì đúng. Hãy đọc AGB (điều khoản kinh doanh chung)!","ar":"هذا صحيح بدون احتفاظ بالملكية. اقرأ الشروط العامة (AGB)!"},"Ohne Eigentumsvorbehalt wäre es der Tag der Lieferung (Einigung + Übergabe).":{"tr":"Mülkiyetin saklı tutulması olmasaydı teslimat günü olurdu (anlaşma + teslim).","vi":"Nếu không có Eigentumsvorbehalt (bảo lưu quyền sở hữu) thì là ngày giao hàng (thỏa thuận + bàn giao).","ar":"بدون احتفاظ بالملكية يكون الموعد يوم التسليم (الاتفاق + التسليم)."},"Gar nicht – die Stühle bleiben immer Eigentum des Lieferanten.":{"tr":"Hiçbir zaman – sandalyeler her zaman tedarikçinin mülkiyetinde kalır.","vi":"Không bao giờ – những chiếc ghế luôn là tài sản của nhà cung cấp.","ar":"أبدًا – تبقى الكراسي دائمًا ملكًا للمورّد."},"Wir haben doch bezahlt!":{"tr":"Ama biz ödedik!","vi":"Chúng tôi đã trả tiền rồi mà!","ar":"لكننا دفعنا!"},"Nach der vollständigen Zahlung wird der Käufer Eigentümer.":{"tr":"Tam ödemeden sonra alıcı malik olur.","vi":"Sau khi thanh toán đầy đủ, người mua trở thành chủ sở hữu.","ar":"بعد الدفع الكامل يصبح المشتري مالكًا."},"…weil mit Eigentumsvorbehalt das Eigentum erst mit der vollständigen Zahlung übergeht.":{"tr":"…çünkü mülkiyetin saklı tutulması ile mülkiyet ancak tam ödeme ile geçer.","vi":"…vì với Eigentumsvorbehalt (bảo lưu quyền sở hữu), quyền sở hữu chỉ chuyển đi khi thanh toán đầy đủ.","ar":"…لأن الملكية مع الاحتفاظ بالملكية لا تنتقل إلا مع الدفع الكامل."},"…weil das Eigentum immer am Tag der Bestellung übergeht.":{"tr":"…çünkü mülkiyet her zaman sipariş gününde geçer.","vi":"…vì quyền sở hữu luôn chuyển đi vào ngày đặt hàng.","ar":"…لأن الملكية تنتقل دائمًا يوم الطلب."},"…weil bewegliche Sachen nur beim Notar übergehen.":{"tr":"…çünkü taşınır mallar sadece noterde devredilir.","vi":"…vì động sản chỉ chuyển quyền sở hữu tại công chứng viên.","ar":"…لأن الأشياء المنقولة لا تنتقل إلا عند الكاتب العدل."},"Ein Bäcker kauft Mehl unter Eigentumsvorbehalt und backt daraus Brot. Schützt der Eigentumsvorbehalt den Lieferanten noch?":{"tr":"Bir fırıncı mülkiyetin saklı tutulması (Eigentumsvorbehalt) ile un satın alıp ondan ekmek pişiriyor. Mülkiyetin saklı tutulması tedarikçiyi hâlâ korur mu?","vi":"Một thợ làm bánh mua bột mì có Eigentumsvorbehalt (bảo lưu quyền sở hữu) và dùng nó nướng bánh mì. Eigentumsvorbehalt còn bảo vệ nhà cung cấp không?","ar":"خبّاز يشتري الطحين مع Eigentumsvorbehalt (الاحتفاظ بالملكية) ويصنع منه الخبز. هل لا يزال الاحتفاظ بالملكية يحمي المورّد؟"},"Nein – durch das Backen entsteht eine neue Sache, der Eigentumsvorbehalt erlischt.":{"tr":"Hayır – pişirmeyle yeni bir şey ortaya çıkar, mülkiyetin saklı tutulması sona erer.","vi":"Không – nướng bánh tạo ra một vật mới, Eigentumsvorbehalt (bảo lưu quyền sở hữu) chấm dứt.","ar":"لا – بالخبز يظهر شيء جديد، فينتهي الاحتفاظ بالملكية."},"Ja – der Lieferant wird Eigentümer des Brotes.":{"tr":"Evet – tedarikçi ekmeğin maliki olur.","vi":"Có – nhà cung cấp trở thành chủ sở hữu của bánh mì.","ar":"نعم – يصبح المورّد مالك الخبز."},"Ja – bis das Brot verkauft ist.":{"tr":"Evet – ekmek satılana kadar.","vi":"Có – cho đến khi bánh mì được bán.","ar":"نعم – حتى يُباع الخبز."},"Ein Lieferant gibt euch Kaffeeautomaten in Kommission: Ihr bezahlt nur, was ihr verkauft. Wer ist was bei der Lieferung?":{"tr":"Bir tedarikçi size kahve makinelerini komisyonla (Kommission) veriyor: Sadece sattığınız kadarını ödersiniz. Teslimatta kim ne olur?","vi":"Một nhà cung cấp giao máy pha cà phê cho các bạn theo hình thức Kommission (ký gửi): các bạn chỉ trả tiền cho phần đã bán. Ai là gì khi giao hàng?","ar":"مورّد يعطيكم آلات قهوة بالأمانة (Kommission): تدفعون فقط ما تبيعونه. من هو ماذا عند التسليم؟"},"Ihr seid Besitzer, der Lieferant bleibt Eigentümer.":{"tr":"Siz zilyetsiniz (Besitzer), tedarikçi malik (Eigentümer) kalır.","vi":"Các bạn là người chiếm hữu (Besitzer), nhà cung cấp vẫn là chủ sở hữu (Eigentümer).","ar":"أنتم Besitzer (الحائز)، ويبقى المورّد Eigentümer (المالك)."},"Ihr seid Eigentümer, weil ihr die Geräte im eigenen Namen verkauft.":{"tr":"Siz malik olursunuz, çünkü cihazları kendi adınıza satıyorsunuz.","vi":"Các bạn là chủ sở hữu, vì các bạn bán thiết bị dưới tên của mình.","ar":"أنتم المالكون، لأنكم تبيعون الأجهزة باسمكم."},"Die späteren Kunden sind schon Eigentümer.":{"tr":"Sonraki müşteriler zaten malik.","vi":"Những khách hàng sau này đã là chủ sở hữu rồi.","ar":"الزبائن اللاحقون هم المالكون بالفعل."},"Auf dem Bon steht nie der Einkaufspreis, den das Geschäft selbst bezahlt hat.":{"tr":"Fişte, işletmenin kendisinin ödediği alış fiyatı hiçbir zaman yazmaz.","vi":"Trên hóa đơn (biên lai) không bao giờ ghi giá mua vào mà cửa hàng đã trả.","ar":"لا يظهر على الإيصال أبدًا سعر الشراء الذي دفعه المتجر نفسه."},"Die Artikel erfassen (scannen).":{"tr":"Ürünleri okut (tara).","vi":"Ghi nhận các mặt hàng (quét mã).","ar":"تسجيل المنتجات (مسحها بالماسح)."},"Die Kaufsumme ermitteln.":{"tr":"Alışveriş toplamını belirle.","vi":"Tính tổng số tiền mua hàng.","ar":"حساب مبلغ الشراء."},"Den Betrag laut und deutlich nennen – ggf. nach der Kundenkarte fragen.":{"tr":"Tutarı yüksek sesle ve net söyle – gerekirse müşteri kartını sor.","vi":"Nói to và rõ số tiền – nếu cần thì hỏi thẻ khách hàng.","ar":"ذكر المبلغ بصوت عالٍ وواضح – وعند الحاجة السؤال عن بطاقة الزبون."},"Den Geldschein annehmen, den Wert laut nennen und auf Echtheit prüfen.":{"tr":"Parayı al, değerini yüksek sesle söyle ve sahte olup olmadığını kontrol et.","vi":"Nhận tờ tiền, nói to mệnh giá và kiểm tra tiền thật.","ar":"استلام الورقة النقدية، وذكر قيمتها بصوت عالٍ، وفحص أصالتها."},"Den Geldschein sichtbar in den Geldscheinhalter klemmen.":{"tr":"Banknotu görünür şekilde banknot tutucuya sıkıştır.","vi":"Kẹp tờ tiền vào giá kẹp tiền ở chỗ dễ na uyulmamış (noter yok).","vi":"Không tuân thủ quy định về hình thức (thiếu công chứng viên).","ar":"لم يُراعَ الشكل المطلوب قانونًا (لا يوجد كاتب عدل)."},"Ein Kunde unterschreibt einen Vertrag, weil ihm mit Schlägen gedroht wird.":{"tr":"Bir müşteri, dövmekle tehdit edildiği için sözleşme imzalıyor.","vi":"Một khách hàng ký hợp đồng vì bị đe dọa đánh.","ar":"زبون يوقّع عقدًا لأنه مهدَّد بالضرب."},"Widerrechtliche Drohung.":{"tr":"Hukuka aykırı tehdit.","vi":"Đe dọa trái pháp luật.","ar":"تهديد غير مشروع."},"Der 9-jährige Moritz kauft von seinem 6-jährigen Freund einen Modellbausatz für 4 €.":{"tr":"9 yaşındaki Moritz, 6 yaşındaki arkadaşından 4 € karşılığında bir maket seti alıyor.","vi":"Moritz 9 tuổi mua của người bạn 6 tuổi một bộ lắp ráp mô hình giá 4 €.","ar":"موريتس (9 سنوات) يشتري من صديقه (6 سنوات) مجسّمًا للتركيب بـ 4 €."},"Der Verkäufer ist unter 7 – geschäftsunfähig.":{"tr":"Satıcı 7 yaşın altında – hukuki işlem ehliyeti yok.","vi":"Người bán dưới 7 tuổi – không có năng lực hành vi.","ar":"البائع عمره أقل من 7 سنوات – geschäftsunfähig (عديم الأهلية)."},"Die 20-jährige Carmen bestellt für ihren Betrieb versehentlich 200 statt 20 Packungen Christbaumschmuck.":{"tr":"20 yaşındaki Carmen işletmesi için yanlışlıkla 20 yerine 200 paket Noel ağacı süsü sipariş ediyor.","vi":"Carmen 20 tuổi vô tình đặt cho cơ sở của mình 200 thay vì 20 hộp đồ trang trí cây thông Noel.","ar":"كارمن (20 سنة) تطلب لمنشأتها بالخطأ 200 عبوة بدل 20 من زينة شجرة الميلاد."},"Erklärungsirrtum.":{"tr":"Beyan hatası.","vi":"Nhầm lẫn khi thể hiện ý chí.","ar":"Erklärungsirrtum (خطأ في التعبير عن الإرادة)."},"Der 18-jährige Elias kündigt seinen Ausbildungsvertrag schriftlich.":{"tr":"18 yaşındaki Elias meslek eğitimi sözleşmesini yazılı olarak feshediyor.","vi":"Elias 18 tuổi làm đơn chấm dứt hợp đồng học nghề bằng văn bản.","ar":"إلياس (18 سنة) ينهي عقد تدريبه كتابيًا."},"Volljährig – einseitiges Rechtsgeschäft.":{"tr":"Reşit – tek taraflı hukuki işlem.","vi":"Đã đủ tuổi trưởng thành – giao dịch pháp lý đơn phương.","ar":"بالغ – تصرف قانوني من طرف واحد."},"Jemand kauft Drogen.":{"tr":"Biri uyuşturucu alıyor.","vi":"Có người mua ma túy.","ar":"شخص يشتري مخدرات."},"Verstoß gegen ein Gesetz.":{"tr":"Bir kanuna aykırılık.","vi":"Vi phạm một đạo luật.","ar":"مخالفة للقانون."},"Anfrage über 20 Schlitten":{"tr":"20 kızak için talep","vi":"Hỏi giá 20 chiếc xe trượt tuyết","ar":"استفسار عن 20 مزلجة"},"Angebot: 29,00 € netto, „solange der Vorrat reicht“":{"tr":"Teklif: 29,00 € net, „stok yettiği sürece“","vi":"Chào hàng: 29,00 € chưa thuế, „cho đến khi hết hàng“","ar":"العرض: 29,00 € صافي (netto)، „ما دام المخزون متوفرًا“"},"Bestellung":{"tr":"Sipariş","vi":"Đặt hàng","ar":"الطلب"},"Auftragsbestätigung":{"tr":"Sipariş onayı","vi":"Xác nhận đơn hàng","ar":"تأكيد الطلب"},"Wareneingang":{"tr":"Mal girişi","vi":"Nhập hàng","ar":"وصول البضاعة"},"Zahlungseingang":{"tr":"Ödeme girişi","vi":"Nhận thanh toán","ar":"وصول الدفع"},"„Solange der Vorrat reicht“ = unverbindlich. Bestellung = Antrag, Auftragsbestätigung = Annahme.":{"tr":"„Stok yettiği sürece“ = bağlayıcı değil. Sipariş = teklif (Antrag), sipariş onayı = kabul (Annahme).","vi":"„Cho đến khi hết hàng“ = không ràng buộc. Đặt hàng = Antrag (đề nghị), xác nhận đơn hàng = Annahme (chấp nhận).","ar":"„ما دام المخزون متوفرًا“ = غير ملزم. الطلب = Antrag (الإيجاب)، تأكيد الطلب = Annahme (القبول)."},"Anfrage über Verkaufstresen":{"tr":"Satış tezgahları için talep","vi":"Hỏi giá quầy bán hàng","ar":"استفسار عن طاولات بيع"},"Angebot ohne Einschränkung: 3 Tresen zu je 850 €, 5 % Rabatt":{"tr":"Kısıtlamasız teklif: her biri 850 € olan 3 tezgah, 5 % indirim","vi":"Chào hàng không hạn chế: 3 quầy, mỗi quầy 850 €, giảm giá 5 %","ar":"عرض بدون قيد: 3 طاولات بسعر 850 € للواحدة، خصم 5 %"},"Bestellung genau zu diesen Bedingungen":{"tr":"Tam bu koşullarda sipariş","vi":"Đặt hàng đúng theo các điều kiện này","ar":"طلب بهذه الشروط تمامًا"},"Lieferung":{"tr":"Teslimat","vi":"Giao hàng","ar":"التسليم"},"Zahlung":{"tr":"Ödeme","vi":"Thanh toán","ar":"الدفع"},"Verbindliches Angebot = Antrag. Die unveränderte Bestellung ist die Annahme.":{"tr":"Bağlayıcı teklif = Antrag (teklif). Değiştirilmemiş sipariş kabuldür.","vi":"Chào hàng ràng buộc = Antrag (đề nghị). Đơn đặt hàng không thay đổi chính là Annahme (chấp nhận).","ar":"العرض الملزم = Antrag (الإيجاب). الطلب دون تغيير هو Annahme (القبول)."},"Angebot: 3 Tresen zu je 850 €, „Preis freibleibend“":{"tr":"Teklif: her biri 850 € olan 3 tezgah, „fiyat bağlayıcı değildir“","vi":"Chào hàng: 3 quầy, mỗi quầy 850 €, „giá có thể thay đổi“","ar":"العرض: 3 طاولات بسعر 850 € للواحدة، „السعر غير ملزم“"},"„Freibleibend“ = unverbindlich. Erst die Auftragsbestätigung nimmt die Bestellung an.":{"tr":"„Bağlayıcı değildir“ = bağlayıcı olmayan teklif. Siparişi ancak sipariş onayı kabul eder.","vi":"„Giá có thể thay đổi“ = không ràng buộc. Chỉ khi xác nhận đơn hàng thì đơn đặt hàng mới được chấp nhận.","ar":"„Freibleibend“ (غير ملزم) = غير ملزم. تأكيد الطلب فقط هو الذي يقبل الطلب."},"Anzeige in einer Fachzeitschrift: Vitrine zu 450 €":{"tr":"Bir meslek dergisinde ilan: 450 € vitrin","vi":"Quảng cáo trên tạp chí chuyên ngành: tủ trưng bày giá 450 €","ar":"إعلان في مجلة متخصصة: فاترينة بـ 450 €"},"Bestellung von 5 Vitrinen, Lieferung frei Haus":{"tr":"5 vitrin siparişi, adrese teslim ücretsiz","vi":"Đặt hàng 5 tủ trưng bày, giao hàng miễn phí tận nơi","ar":"طلب 5 فاترينات، التسليم مجانًا إلى الباب"},"Lieferant am Telefon: frei Haus geht nicht, bietet 100 € Frachtpauschale – ihr sagt sofort Ja":{"tr":"Tedarikçi telefonda: ücretsiz teslimat olmaz, 100 € nakliye ücreti öneriyor – siz hemen evet diyorsunuz","vi":"Nhà cung cấp nói qua điện thoại: không giao miễn phí được, đề nghị phí vận chuyển trọn gói 100 € – các bạn đồng ý ngay","ar":"المورّد على الهاتف: التسليم المجاني إلى الباب غير ممكن، ويعرض 100 € رسوم شحن مقطوعة – أنتم توافقون فورًا"},"Die Anzeige ist kein Angebot. Der Lieferant ändert die Bestellung (neuer Antrag). Ihr nehmt am Telefon an.":{"tr":"İlan teklif değildir. Tedarikçi siparişi değiştirir (yeni teklif). Siz telefonda kabul edersiniz.","vi":"Quảng cáo không phải là chào hàng. Nhà cung cấp thay đổi đơn đặt hàng (đề nghị mới). Các bạn chấp nhận qua điện thoại.","ar":"الإعلان ليس عرضًا. المورّد يغيّر الطلب (إيجاب جديد). أنتم تقبلون على الهاتف."},"Angebot „solange Vorrat reicht“":{"tr":"Teklif „stok yettiği sürece“","vi":"Chào hàng „cho đến khi hết hàng“","ar":"عرض „ما دام المخزون متوفرًا“"},"Unverbindliches Angebot: Die Auftragsbestätigung ist die Annahme.":{"tr":"Bağlayıcı olmayan teklif: Sipariş onayı kabuldür.","vi":"Chào hàng không ràng buộc: xác nhận đơn hàng là Annahme (chấp nhận).","ar":"عرض غير ملزم: تأكيد الطلب هو القبول (Annahme)."},"Angebot ohne Einschränkung mit 5 % Rabatt":{"tr":"Kısıtlamasız teklif, 5 % indirimli","vi":"Chào hàng không hạn chế với giảm giá 5 %","ar":"عرض بدون قيد مع خصم 5 %"},"Bestellung – aber mit 10 % Rabatt":{"tr":"Sipariş – ama 10 % indirimle","vi":"Đặt hàng – nhưng với giảm giá 10 %","ar":"طلب – لكن بخصم 10 %"},"Lieferant bestätigt die 10 %":{"tr":"Tedarikçi 10 %'u onaylıyor","vi":"Nhà cung cấp xác nhận 10 %","ar":"المورّد يؤكد الـ 10 %"},"Die Bestellung weicht vom Angebot ab – sie ist ein neuer Antrag. Die Bestätigung ist die Annahme.":{"tr":"Sipariş tekliften farklıdır – yeni bir tekliftir. Onay kabuldür.","vi":"Đơn đặt hàng khác với chào hàng – đó là một Antrag (đề nghị) mới. Việc xác nhận là Annahme (chấp nhận).","ar":"الطلب يختلف عن العرض – فهو إيجاب جديد (Antrag). التأكيد هو القبول (Annahme)."},"Lena leiht sich das Fahrrad ihres Bruders für eine Woche.":{"tr":"Lena bir haftalığına erkek kardeşinin bisikletini ödünç alıyor.","vi":"Lena mượn xe đạp của anh trai trong một tuần.","ar":"لينا تستعير دراجة أخيها لمدة أسبوع."},"Herr Kraus wohnt zur Miete in einer Wohnung von Frau Sommer.":{"tr":"Bay Kraus, Bayan Sommer'in bir dairesinde kiracı olarak oturuyor.","vi":"Ông Kraus thuê một căn hộ của bà Sommer để ở.","ar":"السيد كراوس يسكن بالإيجار في شقة تملكها السيدة زومر."},"Ein Dieb hat ein Handy gestohlen.":{"tr":"Bir hırsız cep telefonu çaldı.","vi":"Một tên trộm đã lấy cắp một chiếc điện thoại.","ar":"لصّ سرق هاتفًا."},"Eine Kundin hat eine Hose bar bezahlt und mitgenommen.":{"tr":"Bir müşteri pantolonu nakit ödedi ve yanında götürdü.","vi":"Một khách nữ đã trả tiền mặt cho chiếc quần và mang đi.","ar":"زبونة دفعت ثمن بنطال نقدًا وأخذته معها."},"Herr Meier hat einen Fernseher auf Raten mit Eigentumsvorbehalt gekauft. Zwei Raten fehlen noch.":{"tr":"Bay Meier mülkiyetin saklı tutulması ile taksitle televizyon aldı. İki taksit daha eksik.","vi":"Ông Meier mua một chiếc tivi trả góp có Eigentumsvorbehalt (bảo lưu quyền sở hữu). Còn thiếu hai kỳ trả góp.","ar":"السيد ماير اشترى تلفازًا بالتقسيط مع Eigentumsvorbehalt (الاحتفاظ بالملكية). بقي قسطان."},"Ein Kunde gibt seine Jacke an der Garderobe eines Restaurants ab.":{"tr":"Bir müşteri ceketini bir restoranın vestiyerinde bırakıyor.","vi":"Một khách gửi áo khoác ở chỗ giữ đồ của nhà hàng.","ar":"زبون يترك سترته في غرفة المعاطف في مطعم."},"Eine Frau hat Cans gestohlenes E-Bike auf dem Flohmarkt gekauft.":{"tr":"Bir kadın, Can'ın çalınan e-bisikletini bit pazarında satın aldı.","vi":"Một phụ nữ đã mua chiếc xe đạp điện bị Can lấy cắp ở chợ trời.","ar":"امرأة اشترت في سوق الخردة دراجة كهربائية مسروقة تخص كان."},"Euer Stand hat die Kühltruhe für das Festival gemietet.":{"tr":"Standınız festival için dondurucu kiraladı.","vi":"Quầy của các bạn đã thuê tủ đông cho lễ hội.","ar":"بسطتكم استأجرت الثلاجة الصندوقية للمهرجان."},"Besuch vom Finanzamt":{"tr":"Maliye'den ziyaret","vi":"Cơ quan thuế đến kiểm tra","ar":"زيارة من مصلحة الضرائب"},"Zwei Prüferinnen vom Finanzamt schauen sich überraschend die Kassen auf dem Gelände an.":{"tr":"Maliyeden iki denetçi sürpriz olarak alandaki kasalara bakıyor.","vi":"Hai thanh tra viên của cơ quan thuế bất ngờ đến xem các quầy thu ngân trong khu vực.","ar":"مفتشتان من مصلحة الضرائب تتفقدان فجأة صناديق الدفع في الموقع."},"Eure Kasse arbeitet sauber: Jeder Gast bekommt einen Bon, Fehler sind storniert. Die Prüferinnen nicken zufrieden.":{"tr":"Kasanız düzgün çalışıyor: Her müşteri fiş alıyor, hatalar iptal edilmiş. Denetçiler memnun başlarını sallıyor.","vi":"Quầy thu ngân của các bạn làm việc sạch sẽ: mỗi khách đều nhận hóa đơn (biên lai), lỗi đã được hủy (Storno). Các thanh tra viên gật đầu hài lòng.","ar":"صندوقكم يعمل بشكل نظيف: كل ضيف يحصل على إيصال، والأخطاء ملغاة. المفتشتان تومئان برضا."},"Bei euch fehlen Bons oder ein Fehler ist nicht sauber storniert. Ihr müsst lange erklären, die Schlange wächst.":{"tr":"Sizde fişler eksik veya bir hata düzgün iptal edilmemiş. Uzun uzun açıklamanız gerekiyor, kuyruk büyüyor.","vi":"Chỗ các bạn thiếu hóa đơn (biên lai) hoặc một lỗi chưa được hủy (Storno) đúng cách. Các bạn phải giải thích lâu, hàng người chờ dài ra.","ar":"عندكم إيصالات ناقصة أو خطأ لم يُلغَ بشكل سليم. عليكم الشرح طويلًا، والطابور يزداد."},"Testkauf der Festivalleitung":{"tr":"Festival yönetiminin test alışverişi","vi":"Mua thử của ban tổ chức lễ hội","ar":"شراء تجريبي من إدارة المهرجان"},"Ole Brodersen schickt einen Testkäufer an alle Stände. Niemand weiß, wer es ist.":{"tr":"Ole Brodersen tüm standlara bir test müşterisi gönderiyor. Kimse kim olduğunu bilmiyor.","vi":"Ole Brodersen cử một người mua thử đến tất cả các quầy. Không ai biết đó là ai.","ar":"Ole Brodersen يرسل مشتريًا تجريبيًا إلى كل البسطات. لا أحد يعرف من هو."},"Freundlich gegrüßt, Rückgeld vorgezählt, Schein im Halter: Der Testkäufer gibt euch die Bestnote.":{"tr":"Güler yüzle selamlandı, para üstü sayıldı, banknot tutucuda: Test müşterisi size en yüksek notu veriyor.","vi":"Chào hỏi thân thiện, đếm tiền thối lại (Rückgeld) cho khách xem, tờ tiền để trong giá kẹp: người mua thử cho các bạn điểm cao nhất.","ar":"تحية ودودة، الباقي معدود أمام الزبون، الورقة النقدية في الحامل: المشتري التجريبي يمنحكم أعلى تقييم."},"Der Testkäufer notiert: unfreundlich oder unordentlich kassiert. Das gibt Minuspunkte bei Ole.":{"tr":"Test müşterisi not alıyor: kasada nazik olmayan veya düzensiz. Bu, Ole'de eksi puan demek.","vi":"Người mua thử ghi lại: thu tiền không thân thiện hoặc không gọn gàng. Điều đó bị trừ điểm ở chỗ Ole.","ar":"المشتري التجريبي يسجّل: تحصيل غير ودود أو غير منظم. هذا يعني نقاطًا سلبية عند Ole."},"Warnung der Polizei":{"tr":"Polis uyarısı","vi":"Cảnh báo của cảnh sát","ar":"تحذير من الشرطة"},"Die Polizei warnt alle Stände: Auf dem Gelände sind falsche 50er und 100er unterwegs.":{"tr":"Polis tüm standları uyarıyor: Alanda sahte 50'lik ve 100'lük banknotlar dolaşıyor.","vi":"Cảnh sát cảnh báo tất cả các quầy: trong khu vực đang lưu hành tiền giả mệnh giá 50 và 100.","ar":"الشرطة تحذّر كل البسطات: في الموقع أوراق مزيّفة من فئة 50 و100 متداولة."},"Ihr prüft jeden Schein mit Fühlen – Sehen – Kippen. Bei euch kommt kein Falschgeld in die Kasse.":{"tr":"Her banknotu Dokunmak – Bakmak – Eğmek ile kontrol ediyorsunuz. Sizde kasaya sahte para (Falschgeld) girmiyor.","vi":"Các bạn kiểm tra từng tờ tiền bằng Sờ – Nhìn – Nghiêng. Chỗ các bạn không có tiền giả (Falschgeld) vào két.","ar":"تفحصون كل ورقة بـ اللمس – النظر – الإمالة. لا تدخل عندكم نقود مزيّفة (Falschgeld) إلى الصندوق."},"Ein falscher Schein ist in eurer Kasse gelandet. Er wird ohne Ersatz eingezogen.":{"tr":"Kasanıza sahte bir banknot girmiş. Karşılığı ödenmeden el konuluyor.","vi":"Một tờ tiền giả đã lọt vào két của các bạn. Nó bị thu giữ mà không được đền bù.","ar":"ورقة مزيّفة وصلت إلى صندوقكم. تُصادَر دون تعويض."},"Ansturm nach dem Headliner":{"tr":"Baş sanatçıdan sonra izdiham","vi":"Đám đông sau ca sĩ chính","ar":"هجوم الزبائن بعد النجم الرئيسي"},"Nach dem Konzert stehen 2.000 Leute gleichzeitig an den Ständen.":{"tr":"Konserden sonra aynı anda 2.000 kişi standların önünde bekliyor.","vi":"Sau buổi hòa nhạc, 2.000 người cùng lúc xếp hàng ở các quầy.","ar":"بعد الحفل يقف 2.000 شخص في وقت واحد عند البسطات."},"Kontaktlos und mit dem Handy geht es blitzschnell. Eure Schlange ist die kürzeste.":{"tr":"Temassız ve telefonla çok hızlı gidiyor. Sizin kuyruğunuz en kısa.","vi":"Thanh toán không tiếp xúc và bằng điện thoại thì cực nhanh. Hàng của các bạn ngắn nhất.","ar":"الدفع بدون تلامس وبالهاتف سريع جدًا. طابوركم هو الأقصر."},"Es hakt beim Bezahlen. Viele Gäste geben auf und gehen weiter.":{"tr":"Ödemede aksama var. Birçok müşteri vazgeçip gidiyor.","vi":"Việc thanh toán bị trục trặc. Nhiều khách bỏ cuộc và đi tiếp.","ar":"هناك مشكلة في الدفع. كثير من الضيوف يستسلمون ويمضون."},"Testkauf vom Ordnungsamt":{"tr":"Düzen Kontrol Dairesinin (Ordnungsamt) test alışverişi","vi":"Mua thử của Ordnungsamt (cơ quan quản lý trật tự)","ar":"شراء تجريبي من مكتب النظام العام"},"Das Ordnungsamt schickt eine 16-Jährige zum Testkauf: Sie will Wodka-Mix und Zigaretten.":{"tr":"Ordnungsamt test alışverişi için 16 yaşında birini gönderiyor: Votka karışımı ve sigara istiyor.","vi":"Ordnungsamt (cơ quan quản lý trật tự) cử một cô gái 16 tuổi đi mua thử: cô muốn mua vodka pha và thuốc lá.","ar":"مكتب النظام العام يرسل فتاة عمرها 16 سنة لشراء تجريبي: تريد مزيج فودكا وسجائر."},"Ihr lasst euch den Ausweis zeigen und verkauft nichts davon. Das Ordnungsamt lobt euren Stand. Kevin nebenan bekommt dagegen Ärger.":{"tr":"Kimlik göstermesini istiyor ve bunlardan hiçbirini satmıyorsunuz. Ordnungsamt standınızı övüyor. Yandaki Kevin ise başını belaya sokuyor.","vi":"Các bạn yêu cầu xem giấy tờ tùy thân và không bán gì trong số đó. Ordnungsamt (cơ quan quản lý trật tự) khen quầy của các bạn. Ngược lại Kevin ở bên cạnh bị rắc rối.","ar":"تطلبون منها الهوية ولا تبيعون شيئًا من ذلك. مكتب النظام العام يمدح بسطتكم. أما Kevin المجاور فيقع في مشكلة."},"Es gibt eine Verwarnung vom Ordnungsamt. Ole Brodersen ist gar nicht begeistert.":{"tr":"Ordnungsamt'tan uyarı geliyor. Ole Brodersen hiç memnun değil.","vi":"Có một lời cảnh cáo từ Ordnungsamt (cơ quan quản lý trật tự). Ole Brodersen không hề vui.","ar":"يصدر إنذار من مكتب النظام العام. Ole Brodersen غير سعيد إطلاقًا."},"Hitzewelle":{"tr":"Sıcak hava dalgası","vi":"Đợt nắng nóng","ar":"موجة حر"},"34 Grad im Schatten. Am Stand gibt es keinen Schatten.":{"tr":"Gölgede 34 derece. Standda gölge yok.","vi":"34 độ trong bóng râm. Ở quầy không có bóng râm.","ar":"34 درجة في الظل. وعند البسطة لا يوجد ظل."},"Ihr macht Pausen, trinkt genug und bleibt freundlich. Fehler an der Kasse: null.":{"tr":"Mola veriyorsunuz, yeterince su içiyorsunuz ve nazik kalıyorsunuz. Kasada hata: sıfır.","vi":"Các bạn nghỉ giải lao, uống đủ nước và vẫn thân thiện. Lỗi ở quầy thu ngân: không có.","ar":"تأخذون استراحات، وتشربون ما يكفي، وتبقون ودودين. أخطاء الصندوق: صفر."},"Ohne Pausen werdet ihr müde. Es gibt Tippfehler und genervte Gäste.":{"tr":"Molasız yoruluyorsunuz. Yazım hataları ve sinirli müşteriler oluyor.","vi":"Không nghỉ thì các bạn sẽ mệt. Có lỗi gõ nhầm và khách khó chịu.","ar":"بدون استراحات تتعبون. تحدث أخطاء كتابة وضيوف منزعجون."},"Kassensturz um Mitternacht":{"tr":"Gece yarısı kasa sayımı (Kassensturz)","vi":"Kassensturz (kiểm kê quỹ đột xuất) lúc nửa đêm","ar":"Kassensturz (جرد الصندوق المفاجئ) عند منتصف الليل"},"Ole Brodersen steht plötzlich mit einer Liste am Stand: „Kassensturz! Bitte zählen.“":{"tr":"Ole Brodersen birden elinde bir listeyle standda beliriyor: „Kasa sayımı! Lütfen sayın.“","vi":"Ole Brodersen bất ngờ đứng ở quầy với một danh sách: „Kiểm kê quỹ đột xuất! Xin hãy đếm.“","ar":"يقف Ole Brodersen فجأة عند البسطة وبيده قائمة: „جرد الصندوق المفاجئ! من فضلكم عدّوا.“"},"Soll und Ist passen, die Abrechnung ist richtig. Ole macht einen grünen Haken.":{"tr":"Olması gereken ile mevcut tutuyor, hesap doğru. Ole yeşil bir onay işareti koyuyor.","vi":"Số phải có và số thực tế khớp nhau, quyết toán đúng. Ole đánh dấu tích xanh.","ar":"المطلوب (Soll) والفعلي (Ist) متطابقان، والحساب صحيح. يضع Ole علامة صح خضراء."},"Eure Abrechnung hat Fehler. Ole muss zweimal nachrechnen lassen.":{"tr":"Hesabınızda hatalar var. Ole iki kez yeniden hesaplatmak zorunda kalıyor.","vi":"Quyết toán của các bạn có lỗi. Ole phải bắt tính lại hai lần.","ar":"في حسابكم أخطاء. على Ole أن يطلب إعادة الحساب مرتين."},"Ein Vater kommt zurück":{"tr":"Bir baba geri geliyor","vi":"Một người cha quay lại","ar":"أب يعود"},"Ein Vater steht am Stand: „Mein Kind hat hier heute etwas gekauft. Darf es das überhaupt?“":{"tr":"Bir baba standa geliyor: „Çocuğum bugün burada bir şey aldı. Buna hakkı var mı?“","vi":"Một người cha đứng ở quầy: „Con tôi hôm nay đã mua gì đó ở đây. Nó có được phép mua không?“","ar":"أب يقف عند البسطة: „ابني (أو ابنتي) اشترى هنا شيئًا اليوم. هل يحق له ذلك أصلًا؟“"},"Ihr habt bei den Kindern und Jugendlichen alles richtig gemacht. Der Vater bedankt sich.":{"tr":"Çocuklarla ve gençlerle her şeyi doğru yaptınız. Baba teşekkür ediyor.","vi":"Các bạn đã làm đúng mọi thứ với trẻ em và thanh thiếu niên. Người cha cảm ơn.","ar":"تصرفتم بشكل صحيح تمامًا مع الأطفال والشباب. الأب يشكركم."},"Ein Kauf war ungültig. Ihr müsst das Geld zurückgeben, und der Vater ist sauer.":{"tr":"Bir alım geçersizdi. Parayı iade etmeniz gerekiyor ve baba kızgın.","vi":"Một giao dịch mua không hợp lệ. Các bạn phải trả lại tiền, và người cha tức giận.","ar":"كان أحد المشتريات غير صحيح. عليكم إرجاع المال، والأب غاضب."},"Mail vom Großhändler":{"tr":"Toptancıdan e-posta","vi":"Thư từ nhà bán buôn","ar":"رسالة من تاجر الجملة"},"Der Großhändler schreibt: Er will alle Bestellungen vom Wochenende klären.":{"tr":"Toptancı yazıyor: Hafta sonundan kalan tüm siparişleri netleştirmek istiyor.","vi":"Nhà bán buôn viết: ông muốn làm rõ tất cả các đơn đặt hàng cuối tuần.","ar":"تاجر الجملة يكتب: يريد توضيح كل طلبات عطلة الأسبوع."},"Ihr wisst, was gültig, nichtig und anfechtbar ist. In zehn Minuten ist alles geklärt.":{"tr":"Neyin geçerli (gültig), geçersiz (nichtig) ve iptal edilebilir (anfechtbar) olduğunu biliyorsunuz. On dakikada her şey netleşiyor.","vi":"Các bạn biết thế nào là có hiệu lực, vô hiệu (nichtig) và có thể bị hủy bỏ (anfechtbar). Trong mười phút mọi thứ được làm rõ.","ar":"أنتم تعرفون ما هو صحيح (gültig) وباطل (nichtig) وقابل للإبطال (anfechtbar). خلال عشر دقائق يتضح كل شيء."},"Ihr seid unsicher. Jana muss :"Hayır","vi":"Không","ar":"لا"},"{1} Situation, die ihr noch nicht richtig hattet":{"tr":"Henüz doğru yapamadığınız {1} durum","vi":"{1} tình huống các bạn chưa làm đúng","ar":"{1} موقف لم تجيبوا عنه بشكل صحيح بعد"},"{1} Situationen, die ihr noch nicht richtig hattet":{"tr":"Henüz doğru yapamadığınız {1} durum","vi":"{1} tình huống các bạn chưa làm đúng","ar":"{1} مواقف لم تجيبوا عنها بشكل صحيح بعد"},"Neue Fälle für euch: {1} von {2}":{"tr":"Sizin için yeni vakalar: {2} içinden {1}","vi":"Tình huống mới cho các bạn: {1} trên {2}","ar":"حالات جديدة لكم: {1} من {2}"},"Sonntag, 10:30 Uhr":{"tr":"Pazar, 10:30","vi":"Chủ nhật, 10:30","ar":"الأحد، 10:30"},"Freitag, 13:45 Uhr":{"tr":"Cuma, 13:45","vi":"Thứ Sáu, 13:45","ar":"الجمعة، 13:45"},"Der letzte Festivaltag":{"tr":"Festivalin son günü","vi":"Ngày cuối của lễ hội","ar":"آخر يوم في المهرجان"},"Willkommen am Deich":{"tr":"Deich'a hoş geldiniz","vi":"Chào mừng đến Deich","ar":"أهلاً بكم عند السد (Deich)"},"„Hallo {1}! Heute spielt ihr nur die Situationen, die beim letzten Mal noch nicht geklappt haben. Zeigt Ole, dass ihr dazugelernt habt!“":{"tr":"„Merhaba {1}! Bugün yalnızca geçen sefer işe yaramayan durumları oynuyorsunuz. Ole'ye bir şeyler öğrendiğinizi gösterin!“","vi":"„Xin chào {1}! Hôm nay các bạn chỉ chơi những tình huống mà lần trước chưa làm được. Hãy cho Ole thấy các bạn đã học thêm được!“","ar":"„مرحباً {1}! اليوم تلعبون فقط المواقف التي لم تنجح في المرة الماضية. أثبتوا لـ Ole أنكم تعلّمتم المزيد!“"},"„Hallo {1}! Freitag und Samstag liefen super. Heute ist Familientag, und heute geht es um Recht: Wer darf was kaufen? Welche Verträge gelten? Ole Brodersen entscheidet heute Abend, wer 2027 wiederkommt.“":{"tr":"„Merhaba {1}! Cuma ve Cumartesi harikaydı. Bugün aile günü ve bugün konu hukuk: Kim ne satın alabilir? Hangi sözleşmeler geçerli? Ole Brodersen bu akşam 2027'de kimin geri döneceğine karar veriyor.“","vi":"„Xin chào {1}! Thứ Sáu và thứ Bảy diễn ra rất tốt. Hôm nay là ngày gia đình, và hôm nay nói về pháp luật: Ai được mua gì? Hợp đồng nào có hiệu lực? Tối nay Ole Brodersen quyết định ai được quay lại năm 2027.“","ar":"„مرحباً {1}! الجمعة والسبت سارا بشكل رائع. اليوم يوم العائلات، واليوم الموضوع هو القانون: من يحق له شراء ماذا؟ أي العقود صالحة؟ Ole Brodersen يقرر الليلة من سيعود في 2027.“"},"„Hallo {1}! Ich stecke mit dem Lieferwagen im Stau auf der A27. Ihr müsst den Stand allein starten. Ole Brodersen von der Festivalleitung beobachtet alle Stände. Nur der beste darf 2027 wiederkommen. Und passt auf Kevin von der Snackbude Zack nebenan auf – der nimmt es mit den Regeln nicht so genau.“":{"tr":"„Merhaba {1}! Teslimat aracıyla A27'de trafikte sıkıştım. Standı tek başınıza açmanız gerekiyor. Festival yönetiminden Ole Brodersen tüm standları izliyor. 2027'de yalnızca en iyisi geri dönebilir. Ve yan taraftaki Snackbude Zack'tan Kevin'e dikkat edin – kurallara pek uymaz.“","vi":"„Xin chào {1}! Mình đang kẹt xe trên đường A27 với xe tải giao hàng. Các bạn phải tự mở gian hàng. Ole Brodersen của ban tổ chức lễ hội đang quan sát tất cả các gian hàng. Chỉ gian hàng tốt nhất mới được quay lại năm 2027. Và hãy cẩn thận với Kevin ở quầy đồ ăn nhanh Snackbude Zack bên cạnh – anh ấy không làm đúng quy định lắm.“","ar":"„مرحباً {1}! أنا عالقة بشاحنة التوصيل في الازدحام على A27. عليكم أن تبدأوا الكشك وحدكم. Ole Brodersen من إدارة المهرجان يراقب كل الأكشاك. فقط الأفضل يحق له العودة في 2027. وانتبهوا إلى Kevin من Snackbude Zack المجاور – فهو لا يلتزم بالقواعد كثيراً.“"},"So spielt ihr: Ihr trefft gemeinsam Entscheidungen. Die Gäste reagieren sofort. Gute Entscheidungen bringen Punkte und Festival-Ruf.":{"tr":"Nasıl oynanır: Kararları birlikte verirsiniz. Misafirler hemen tepki verir. İyi kararlar puan ve festival itibarı kazandırır.","vi":"Cách chơi: Các bạn cùng nhau đưa ra quyết định. Khách phản ứng ngay lập tức. Quyết định tốt mang lại điểm và danh tiếng tại lễ hội (Festival-Ruf).","ar":"طريقة اللعب: تتخذون القرارات معاً. يتفاعل الضيوف فوراً. القرارات الجيدة تجلب النقاط وسمعة ا
