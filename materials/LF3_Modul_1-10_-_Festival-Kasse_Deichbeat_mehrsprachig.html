// Ziehen ohne Wiederholung: zuerst Ungesehenes
function pick(pool, n, key){
  if(CHAL) return shuffle(pool).slice(0, n);
  const seen = STORE.seen[key] || []; let fresh = pool.filter(x => !seen.includes(x.id));
  if(fresh.length < n){ if(seen.length) toast("Alle Fälle hier geschafft – jetzt geht es gemischt von vorn los."); STORE.seen[key] = seen.filter(id => fresh.some(f=>f.id===id)); fresh = fresh.concat(shuffle(pool.filter(x => !fresh.includes(x)))); }
  else fresh = shuffle(fresh);
  return fresh.slice(0, n);
}
function markSeen(key, id){ STORE.seen[key] = STORE.seen[key] || []; if(!STORE.seen[key].includes(id)) STORE.seen[key].push(id); if(key.startsWith("d-")){ STORE.ever = STORE.ever || []; if(!STORE.ever.includes(id)) STORE.ever.push(id); } saveStore(); }
function decVariantsTotal(){ let n=0; CH.forEach(c=>c.decs.forEach(v=>n+=v.length)); return n; }
function decVariantsSeen(){ const e = STORE.ever || []; let n=0; CH.forEach(c=>c.decs.forEach(v=>{ n += v.filter(x=>e.includes(x.id)).length; })); return n; }

// ---------- Musik (Web Audio, eigene Bausteine, Standard aus) ----------
const MUS = { on:false, ac:null, master:null, timer:null, step:0, next:0, fanfare:false }; MUS.on = !!STORE.music;
function audioInit(){ if(MUS.ac) { if(MUS.ac.state==="suspended") MUS.ac.resume(); return; }
  try{ const AC = window.AudioContext || window.webkitAudioContext; MUS.ac = new AC(); MUS.master = MUS.ac.createGain(); MUS.master.gain.value = 0.3; MUS.master.connect(MUS.ac.destination); }catch(e){ MUS.ac = null; } }
function tone(f, t, d, type, vol){ const ac = MUS.ac, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+d); o.connect(g); g.connect(MUS.master); o.start(t); o.stop(t+d+0.02); }
function kick(t){ const ac = MUS.ac, o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t+0.12); g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.18); o.connect(g); g.connect(MUS.master); o.start(t); o.stop(t+0.2); }
function noise(t, d, vol, hp){ const ac = MUS.ac, b = ac.createBuffer(1, Math.floor(ac.sampleRate*d), ac.sampleRate), x = b.getChannelData(0); for(let i=0;i<x.length;i++) x[i] = Math.random()*2-1;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; f.type = "highpass"; f.frequency.value = hp; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+d); s.connect(f); f.connect(g); g.connect(MUS.master); s.start(t); }
const midi = n => 440*Math.pow(2,(n-69)/12);
const BASS = [45,0,45,57,0,45,0,52, 48,0,48,55,0,47,0,43];
function tick(){ const ac = MUS.ac; if(!ac) return; const sp = 60/124/4;
  const hot = ui.m && ui.m.n && ui.m.i >= ui.m.n-1;
  while(MUS.next < ac.currentTime + 0.15){ const st = MUS.step % 16, t = MUS.next;
    if(st%4===0) kick(t);
    if(st===4 || st===12) noise(t, 0.12, 0.35, 1200);
    if(st%2===1 || hot) noise(t, 0.04, hot?0.16:0.12, 7000);
    if(BASS[st]) tone(midi(BASS[st] + (hot?12:0)), t, sp*1.6, "sawtooth", 0.12);
    if(hot && st%4===2) tone(midi(69 + [0,3,7,10][(MUS.step>>2)%4]), t, sp, "square", 0.05);
    MUS.next += sp; MUS.step++; } }
function musicStart(){ if(MUS.timer || !MUS.ac) return; MUS.next = MUS.ac.currentTime + 0.05; MUS.step = 0; MUS.timer = setInterval(tick, 40); }
function musicStop(){ if(MUS.timer){ clearInterval(MUS.timer); MUS.timer = null; } }
function fanfare(){ if(!MUS.ac) return; const t = MUS.ac.currentTime + 0.05; [57,61,64,69].forEach((n,i)=> tone(midi(n), t+i*0.13, 0.25, "square", 0.12)); [57,61,64,69].forEach(n => tone(midi(n), t+0.6, 1.1, "triangle", 0.12)); kick(t+0.6); }
function musicSync(){ const want = MUS.on && !document.hidden && S && S.step==="mini" && ui.m && !ui.m.done && !ui.fb;
  if(want){ audioInit(); musicStart(); } else musicStop();
  if(MUS.on && S && S.step==="final" && !MUS.fanfare){ MUS.fanfare = true; audioInit(); fanfare(); }
  if(S && S.step!=="final") MUS.fanfare = false; }
document.addEventListener("visibilitychange", musicSync);

const MINI_TITLE = {bon:"Bon-Detektive", ablauf:"Kassieren in der richtigen Reihenfolge", fsk:"Echt oder falsch? Fühlen – Sehen – Kippen", zahlart:"Welche Zahlungsart ist das?", jugend:"Jugendschutz-Check", bericht:"Der Kassenbericht", ampel:"Die Geschäftsfähigkeits-Ampel", gna:"Gültig, nichtig oder anfechtbar?", zeit:"Wann ist der Kaufvertrag da?", besitz:"Besitzer oder Eigentümer?"};
function drawMini(t, mode){ const pro = mode==="pro"; const m = {};
  if(t==="bon"){ const easy = ["anschrift","datum","artikel","summe","zahl","rueck","bon"], hard = ["stnr","gtin","ust","tse","ep","gp"];
    const e = shuffle(easy), hd = shuffle(hard); m.items = pro ? shuffle([hd[0],hd[1],hd[2],e[0]]) : shuffle([e[0],e[1],e[2],hd[0]]); m.n = 4; }
  if(t==="ablauf"){ m.items = shuffle(ABLAUF.map((x,i)=>i)); m.placed = pro ? [] : [0]; m.n = 1; }
  if(t==="fsk"){ m.items = pick(FSK, pro?5:4, "m-fsk"); m.n = m.items.length; }
  if(t==="zahlart"){ m.items = pick(ZAHL, 5, "m-zahl"); m.n = 5; m.zo = m.items.map(it => shuffle([it.a].concat(shuffle(ZAHL.filter(z=>z.a!==it.a).map(z=>z.a)).slice(0,3)))); }
  if(t==="jugend"){ let it = pick(JUG, 5, "m-jug"); if(it.filter(x=>x.ok).length<2){ const ok = shuffle(JUG.filter(x=>x.ok && !it.includes(x))); it[it.findIndex(x=>!x.ok)] = ok[0]; } m.items = shuffle(it); m.n = 5; }
  if(t==="bericht"){ const r = (a,b,st)=> Math.round((a + Math.floor(RNG()*((b-a)/st+1))*st)*100)/100;
    m.v = { end:r(1200,3600,0.1), absch:[1000,1500,2000][Math.floor(RNG()*3)], wg:[200,250,300,400][Math.floor(RNG()*4)], card:r(1800,4800,0.1) }; m.n = 1; }
  if(t==="ampel"){ m.items = pick(AMPEL, 5, "m-ampel"); m.n = 5; }
  if(t==="gna"){ m.items = pick(GNA, 5, "m-gna"); m.n = 5; }
  if(t==="zeit"){ m.items = pick(ZEIT, 2, "m-zeit"); m.n = 2; }
  if(t==="besitz"){ m.items = pick(BESITZ, 4, "m-besitz"); m.n = 4; }
  return m;
}

const parseNum = s => { s = String(s||"").replace(/\s|€/g,""); if(s.includes(",")) s = s.replace(/\./g,"").replace(",","."); else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,""); const n = parseFloat(s); return isNaN(n)?null:n; };

  sign(b){ ui.m.sign[b.dataset.g] = b.dataset.v; render(); },
  signchk(){ const m = ui.m; m.signOk = m.sign.absch==="+" && m.sign.wg==="-"; m.got += (m.sign.absch==="+"?2:0) + (m.sign.wg==="-"?2:0); m.stage = 1; render(); },
  calc(b){ const m = ui.m, st = +b.dataset.v; const val = parseNum($("#in"+st) && $("#in"+st).value); if(val==null){ toast("Bitte eine Zahl eingeben, z. B. 2.345,60"); return; }
    if(st===1){ m.losOk = Math.abs(val-m.los)<0.005; if(m.losOk) m.got += 3; m.stage = 2; } else { m.umsOk = Math.abs(val-m.ums)<0.005; if(m.umsOk) m.got += 3; m.stage = 3; } render(); },
  bdone(){ ACT.minidone(); },
  bes(b){ const m = ui.m; if(b.dataset.g==="b") m.pickB = +b.dataset.v; else m.pickE = +b.dataset.v; render(); },
  beschk(){ const m = ui.m, it = m.items[m.i]; const okB = m.pickB===it.b, okE = m.pickE===it.e; m.got += (okB?0.5:0) + (okE?0.5:0); markSeen("m-besitz", it.id);
    ui.fb = {ok: okB&&okE, html: `Besitzer: <b>${esc(it.p[it.b])}</b> (hat die Sache) · Eigentümer: <b>${esc(it.p[it.e])}</b> (ihm gehört sie).`}; render(); },
  minidone(){ finishMini(); afterMini(); render(); toTop(); },
  tasp(b){ ui.ta = b.dataset.v; render(); },
  tsl(b){ ui.ts = ui.ts || [null,null,null]; ui.ts[+b.dataset.g] = +b.dataset.v; render(); },
  tchk(){ checkTalk(); render(); },
  tnext(){ afterTalk(); render(); toTop(); },
  pans(b){ ui.pa = +b.dataset.v; const ok = ui.pa===0; markSeen("p-"+chap().id, ui.pq.id); S.prof.push({ch:chap().id, q:ui.pq, ok}); S.max += 5; if(ok){ S.pts += 5; addRuf(2); } render(); },
  pnext(){ advanceChapter(); render(); toTop(); },
  evnext(){ ui.evDone = true; advanceChapter(); render(); toTop(); },
  again(){ pre = {team:S.team, route:S.route, mode:S.mode, code:S.code||""}; newGame(); },
  menu(){ pre = {team:S.team, route:S.route, mode:S.mode, code:S.code||""}; S = null; ui = {}; render(); toTop(); }
};
function keepTeam(){ const t = $("#team"); if(t) pre.team = t.value; const c = $("#code"); if(c) pre.code = c.value; }
function toTop(){ window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if(!b || b.disabled) return; const f = ACT[b.dataset.act]; if(f) f(b); });
document.addEventListener("input", e => { if(e.target.id==="team") pre.team = e.target.value; if(e.target.id==="code") pre.code = e.target.value; });
document.addEventListener("keydown", e => { if(e.key==="Enter" && e.target.id && /^in[12]$/.test(e.target.id)){ const b = e.target.parentElement.querySelector('[data-act="calc"]'); if(b) b.click(); } });
render();
</script>

<script id="uebersetzungen">window.UB_I18N={"Die Kasse steht noch nicht":{"tr":"Kasa henüz kurulmadı","vi":"Quầy thu ngân chưa được dựng","ar":"الصندوق لم يُجهَّز بعد"},"Die Kasse und der Kassenbon":{"tr":"Kasa ve fiş (Kassenbon)","vi":"Quầy thu ngân và hóa đơn (Kassenbon)","ar":"صندوق الدفع (Kasse) والإيصال (Kassenbon)"},"Freitag, 14 Uhr. In zwei Stunden öffnet das Deichbeat-Festival. Euer Stand steht, die Kasse noch nicht. Jana ruft an: „Ich stecke mit dem Lieferwagen im Stau. Ihr baut die Kasse auf. Ich verlasse mich auf euch!“":{"tr":"Cuma, saat 14. İki saat sonra Deichbeat festivali açılıyor. Standınız hazır, kasa henüz değil. Jana arıyor: „Teslimat aracıyla trafikte sıkıştım. Kasayı siz kurun. Size güveniyorum!“","vi":"Thứ Sáu, 14 giờ. Hai tiếng nữa lễ hội Deichbeat mở cửa. Gian hàng của các bạn đã dựng xong, quầy thu ngân thì chưa. Jana gọi điện: „Mình đang bị kẹt xe với xe tải giao hàng. Các bạn dựng quầy thu ngân nhé. Mình tin vào các bạn!“","ar":"الجمعة، الساعة 14. بعد ساعتين يفتح مهرجان Deichbeat. كشككم جاهز، لكن الصندوق لم يُجهَّز بعد. Jana تتصل: „أنا عالقة بسيارة التوصيل في الازدحام. أنتم تجهّزون الصندوق. أنا أعتمد عليكم!“"},"das Kassensystem":{"tr":"kasa sistemi","vi":"hệ thống thu ngân (Kassensystem)","ar":"نظام الدفع (das Kassensystem)"},"der Scanner":{"tr":"barkod okuyucu (tarayıcı)","vi":"máy quét mã vạch (Scanner)","ar":"الماسح الضوئي (der Scanner)"},"der Bondrucker":{"tr":"fiş yazıcısı","vi":"máy in hóa đơn (Bondrucker)","ar":"طابعة الإيصالات (der Bondrucker)"},"das Kartenterminal":{"tr":"kart terminali","vi":"máy quẹt thẻ (Kartenterminal)","ar":"جهاز البطاقات (das Kartenterminal)"},"die GTIN":{"tr":"GTIN (ürün barkod numarası)","vi":"GTIN (mã số sản phẩm thương mại toàn cầu, mã vạch)","ar":"رقم GTIN (رقم تعريف السلعة)"},"das Warenwirtschaftssystem (WWS)":{"tr":"mal yönetim sistemi (WWS)","vi":"hệ thống quản lý hàng hóa (WWS)","ar":"نظام إدارة البضائع (WWS)"},"der Artikelstamm":{"tr":"ürün ana kaydı","vi":"danh mục mặt hàng (Artikelstamm)","ar":"بيانات الأصناف الأساسية (der Artikelstamm)"},"die TSE":{"tr":"TSE (kasa güvenlik modülü)","vi":"TSE (thiết bị an ninh kỹ thuật chống gian lận ở máy tính tiền)","ar":"وحدة TSE (وحدة الأمان التقنية للصندوق)"},"die Belegausgabepflicht":{"tr":"fiş verme zorunluluğu","vi":"nghĩa vụ xuất hóa đơn (Belegausgabepflicht)","ar":"واجب إصدار الإيصال (Belegausgabepflicht)"},"der Kassenbon":{"tr":"fiş","vi":"hóa đơn (Kassenbon)","ar":"الإيصال (Kassenbon)"},"stornieren":{"tr":"iptal etmek","vi":"hủy (stornieren)","ar":"إلغاء (stornieren)"},"Chef der Snackbude Zack nebenan":{"tr":"Yandaki Snackbude Zack'in patronu","vi":"Ông chủ quán ăn nhanh Zack bên cạnh","ar":"صاحب كشك الوجبات الخفيفة Zack المجاور"},"Im Lieferwagen liegen eine Scannerkasse mit Verbindung zum Warenwirtschaftssystem und eine alte Kasse ohne Scanner. Kevin von nebenan ruft: „Nehmt doch eine Geldkassette, das geht am schnellsten!“":{"tr":"Teslimat aracında mal yönetim sistemine (Warenwirtschaftssystem) bağlı bir barkod okuyuculu kasa (Scannerkasse) ve okuyucusuz eski bir kasa var. Yandan Kevin sesleniyor: „Bir para kasası (Geldkassette) alın, en hızlısı bu!“","vi":"Trong xe tải có một Scannerkasse (máy tính tiền có máy quét mã vạch) nối với hệ thống quản lý hàng hóa và một máy tính tiền cũ không có máy quét. Kevin bên cạnh gọi sang: „Cứ lấy hộp đựng tiền đi, thế là nhanh nhất!“","ar":"في سيارة التوصيل يوجد صندوق دفع بماسح باركود (Scannerkasse) متصل بنظام إدارة البضائع (Warenwirtschaftssystem) وصندوق قديم بدون ماسح. Kevin من الكشك المجاور ينادي: „خذوا صندوق نقود بسيط، هذا أسرع شيء!“"},"Womit kassiert ihr?":{"tr":"Kasada neyle ödeme alırsınız?","vi":"Các bạn thu tiền bằng gì?","ar":"بماذا تحصّلون المبلغ؟"},"Scannerkasse (POS-System)":{"tr":"Barkod okuyuculu kasa (POS sistemi)","vi":"Máy tính tiền có máy quét mã vạch (POS-System)","ar":"صندوق دفع بماسح باركود (Scannerkasse / نظام POS)"},"Elektronische Kasse, die mit dem Warenwirtschaftssystem verbunden ist. POS = Point of Sale = Ort des Verkaufs.":{"tr":"Mal yönetim sistemine bağlı elektronik kasa. POS = Point of Sale = satış noktası.","vi":"Máy tính tiền điện tử được nối với hệ thống quản lý hàng hóa. POS = Point of Sale = nơi bán hàng.","ar":"صندوق إلكتروني متصل بنظام إدارة البضائع. POS = Point of Sale = مكان البيع."},"Vorteile der Scannerkasse: schnelle und genaue Erfassung der Verkaufsdaten, genaue Fortschreibung des Lagerbestands, schnelles und fehlerfreies Kassieren.":{"tr":"Barkod okuyuculu kasanın avantajları: satış verilerinin hızlı ve doğru kaydı, stok miktarının doğru güncellenmesi, hızlı ve hatasız ödeme alma.","vi":"Ưu điểm của máy tính tiền có máy quét mã vạch: ghi nhận dữ liệu bán hàng nhanh và chính xác, cập nhật chính xác lượng hàng tồn kho, thu tiền nhanh và không sai sót.","ar":"مزايا الصندوق بماسح الباركود: تسجيل سريع ودقيق لبيانات المبيعات، تحديث دقيق لمخزون المستودع، تحصيل سريع وبدون أخطاء."},"Scannerkasse mit Scanner, Bondrucker und Kartenterminal aufbauen.":{"tr":"Barkod okuyucu, fiş yazıcısı ve kart terminaliyle barkod okuyuculu kasayı kur.","vi":"Dựng máy tính tiền có máy quét mã vạch cùng máy quét, máy in hóa đơn và máy quẹt thẻ.","ar":"تجهيز صندوق الدفع بماسح الباركود مع الماسح وطابعة الإيصالات وجهاز البطاقات."},"Hm. Sieht professionell aus. Mal sehen, ob ihr schneller seid als ich.":{"tr":"Hm. Profesyonel görünüyor. Bakalım benden hızlı olacak mısınız.","vi":"Hm. Trông chuyên nghiệp đấy. Để xem các bạn có nhanh hơn tôi không.","ar":"همم. يبدو احترافياً. لنرَ إن كنتم أسرع مني."},"Die Scannerkasse kassiert schnell und fehlerfrei. Jeder Verkauf wird artikelgenau erfasst, der Lagerbestand wird automatisch fortgeschrieben.":{"tr":"Barkod okuyuculu kasa hızlı ve hatasız çalışır. Her satış ürün bazında kaydedilir, stok miktarı otomatik güncellenir.","vi":"Máy tính tiền có máy quét mã vạch thu tiền nhanh và không sai sót. Mỗi lần bán hàng được ghi nhận chính xác theo từng mặt hàng, lượng hàng tồn kho được tự động cập nhật.","ar":"صندوق الدفع بماسح الباركود يحصّل بسرعة وبدون أخطاء. كل عملية بيع تُسجَّل لكل صنف بدقة، ويتم تحديث مخزون المستودع تلقائياً."},"Die alte Kasse nehmen und alle Preise per Hand eintippen.":{"tr":"Eski kasayı alıp tüm fiyatları elle girmek.","vi":"Lấy máy tính tiền cũ và gõ tay tất cả giá vào.","ar":"استخدام الصندوق القديم وكتابة كل الأسعار باليد."},"Ha, viel Spaß beim Tippen bei 40.000 Gästen!":{"tr":"Ha, 40.000 misafirle elle girmenin tadını çıkarın!","vi":"Ha, chúc vui khi gõ cho 40.000 khách!","ar":"ها، أتمنى لكم وقتاً ممتعاً في الكتابة مع 40.000 ضيف!"},"Das geht, ist aber langsam und es gibt Tippfehler. Es fehlen genaue Verkaufsdaten für die Nachbestellung.":{"tr":"Olur, ama yavaştır ve yazım hataları olur. Yeniden sipariş için doğru satış verileri eksik kalır.","vi":"Cách này làm được, nhưng chậm và có lỗi gõ nhầm. Thiếu dữ liệu bán hàng chính xác để đặt hàng bổ sung.","ar":"هذا ممكن، لكنه بطيء وتحدث أخطاء في الكتابة. وتنقص بيانات المبيعات الدقيقة لإعادة الطلب."},"Geldkassette nehmen. Bons gibt es dann eben nicht.":{"tr":"Para kasasını almak. Yani fiş verilmez.","vi":"Lấy hộp đựng tiền. Vậy thì không có hóa đơn.","ar":"أخذ صندوق نقود بسيط. لا توجد إيصالات إذن."},"Genau so mach ich das auch. Wer braucht schon Bons?":{"tr":"Ben de tam böyle yapıyorum. Fişe kim ihtiyaç duyar ki?","vi":"Tôi cũng làm đúng như vậy. Ai cần hóa đơn chứ?","ar":"هكذا أفعل أنا أيضاً. من يحتاج إلى الإيصالات أصلاً؟"},"Seit 2020 gilt die Belegausgabepflicht: Jeder Kunde bekommt einen Beleg. Elektronische Kassen brauchen eine TSE.":{"tr":"2020'den beri fiş verme zorunluluğu (Belegausgabepflicht) geçerli: Her müşteri bir fiş alır. Elektronik kasalar TSE (kasa güvenlik modülü) gerektirir.","vi":"Từ năm 2020 có Belegausgabepflicht (nghĩa vụ xuất hóa đơn): mỗi khách hàng đều nhận được một hóa đơn. Máy tính tiền điện tử cần có TSE (thiết bị an ninh chống gian lận).","ar":"منذ عام 2020 يسري واجب إصدار الإيصال (Belegausgabepflicht): كل زبون يحصل على إيصال. الصناديق الإلكترونية تحتاج إلى TSE (وحدة الأمان التقنية)."},"…weil jeder Verkauf artikelgenau erfasst und der Lagerbestand automatisch fortgeschrieben wird.":{"tr":"…çünkü her satış ürün bazında kaydedilir ve stok miktarı otomatik güncellenir.","vi":"…vì mỗi lần bán hàng được ghi nhận chính xác theo từng mặt hàng và lượng hàng tồn kho được tự động cập nhật.","ar":"…لأن كل عملية بيع تُسجَّل لكل صنف بدقة ويتم تحديث مخزون المستودع تلقائياً."},"…weil es mit einer Scannerkasse keine Kassendifferenzen mehr geben kann.":{"tr":"…çünkü barkod okuyuculu kasayla artık kasa farkı (Kassendifferenz) olamaz.","vi":"…vì với máy tính tiền có máy quét mã vạch thì không thể còn chênh lệch quỹ nữa.","ar":"…لأنه مع صندوق الدفع بماسح الباركود لم يعد يمكن أن توجد فروق في الصندوق (Kassendifferenzen)."},"…weil man mit einer Scannerkasse keine Inventur mehr machen muss.":{"tr":"…çünkü Scannerkasse (barkod okuyuculu kasa) ile artık envanter (Inventur) sayımı yapmak gerekmez.","vi":"…vì với máy tính tiền có máy quét mã vạch (Scannerkasse) thì không cần kiểm kê hàng tồn (Inventur) nữa.","ar":"…لأنه مع Scannerkasse (صندوق دفع بماسح باركود) لا حاجة لإجراء الجرد (Inventur) بعد الآن."},"Festivalleiter":{"tr":"Festival yöneticisi","vi":"Trưởng ban tổ chức lễ hội","ar":"مدير المهرجان"},"Ole Brodersen von der Festivalleitung kommt vorbei: „Wasser kostet auf dem ganzen Gelände 2,50 € statt 2,00 €. Bitte sofort ändern!“ 300 Flaschen sind schon im Kühlschrank.":{"tr":"Festival yönetiminden Ole Brodersen uğrar: „Tüm alanda su 2,00 € yerine 2,50 €. Lütfen hemen değiştirin!“ Buzdolabında şimdiden 300 şişe var.","vi":"Ole Brodersen của ban tổ chức lễ hội ghé qua: „Nước trên toàn khu vực giá 2,50 € thay vì 2,00 €. Hãy đổi ngay!“ 300 chai đã nằm trong tủ lạnh.","ar":"يأتي Ole Brodersen من إدارة المهرجان: „سعر الماء في كل الموقع 2,50 € بدل 2,00 €. من فضلكم غيّروه فوراً!“ يوجد 300 زجاجة في الثلاجة بالفعل."},"Wie ändert ihr den Preis?":{"tr":"Fiyatı nasıl değiştirirsiniz?","vi":"Các bạn đổi giá như thế nào?","ar":"كيف تغيّرون السعر؟"},"GTIN und Price-Look-Up (PLU)":{"tr":"GTIN ve Price-Look-Up (PLU)","vi":"GTIN (mã số hàng hóa) và Price-Look-Up (PLU, tra giá)","ar":"GTIN و Price-Look-Up (PLU) (البحث عن السعر)"},"Die GTIN ist die 13-stellige Artikelnummer unter dem Strichcode. Beim Scannen holt die Kasse damit den Preis aus dem Artikelstamm.":{"tr":"GTIN (ürün barkod numarası), çizgi kodun altındaki 13 haneli ürün numarasıdır. Tarama sırasında kasa fiyatı bununla Artikelstamm (ürün ana verisi) içinden alır.","vi":"GTIN là mã số hàng hóa gồm 13 chữ số dưới mã vạch. Khi quét, máy tính tiền dùng mã này để lấy giá từ dữ liệu hàng hóa (Artikelstamm).","ar":"GTIN هو رقم المنتج المكوّن من 13 رقماً تحت الباركود. عند المسح يجلب الصندوق به السعر من Artikelstamm (ملف بيانات المنتجات)."},"Nutzen der GTIN: schnelleres und fehlerfreies Kassieren, bessere Bestandserfassung, zentrale Preisänderung.":{"tr":"GTIN'in faydası: daha hızlı ve hatasız kasa işlemi, daha iyi stok takibi, fiyatın merkezden değiştirilmesi.","vi":"Lợi ích của GTIN: thu tiền nhanh và không sai sót, quản lý hàng tồn tốt hơn, đổi giá tập trung.","ar":"فائدة GTIN: تحصيل أسرع وبلا أخطاء، وتسجيل أفضل للمخزون، وتغيير السعر مركزياً."},"Den Preis einmal zentral im Artikelstamm ändern und das Preisschild am Stand tauschen.":{"tr":"Fiyatı bir kez merkezden Artikelstamm (ürün ana verisi) içinde değiştirin ve standdaki fiyat etiketini yenileyin.","vi":"Đổi giá một lần ở dữ liệu hàng hóa (Artikelstamm) và thay bảng giá ở quầy.","ar":"تغيير السعر مرة واحدة مركزياً في Artikelstamm (ملف بيانات المنتجات) واستبدال لوحة السعر في الكشك."},"Das ging ja fix. Sehr gut!":{"tr":"Çok çabuk oldu. Çok iyi!","vi":"Nhanh quá. Rất tốt!","ar":"كان ذلك سريعاً. ممتاز!"},"Der Scanner liest die GTIN. Die Kasse holt den Preis aus dem Artikelstamm (Price-Look-Up). Eine Änderung im System reicht.":{"tr":"Tarayıcı GTIN'i okur. Kasa fiyatı Artikelstamm (ürün ana verisi) içinden alır (Price-Look-Up). Sistemde yapılan bir değişiklik yeterlidir.","vi":"Máy quét đọc GTIN. Máy tính tiền lấy giá từ dữ liệu hàng hóa (Price-Look-Up). Chỉ cần đổi trong hệ thống là đủ.","ar":"الماسح يقرأ GTIN. الصندوق يجلب السعر من Artikelstamm (ملف بيانات المنتجات) (Price-Look-Up). يكفي تغيير واحد في النظام."},"Alle 300 Flaschen mit neuen Preisetiketten bekleben.":{"tr":"300 şişenin hepsine yeni fiyat etiketi yapıştırmak.","vi":"Dán nhãn giá mới lên cả 300 chai.","ar":"لصق ملصقات أسعار جديدة على كل الزجاجات الـ 300."},"Das dauert ja ewig. Gleich ist Einlass!":{"tr":"Bu çok uzun sürer. Birazdan giriş başlıyor!","vi":"Lâu quá. Sắp cho khách vào rồi!","ar":"هذا يستغرق وقتاً طويلاً. سيبدأ الدخول بعد قليل!"},"Das ist unnötige Arbeit. Die Kasse liest den Preis nicht vom Etikett, sondern holt ihn über die GTIN aus dem System.":{"tr":"Bu gereksiz iş. Kasa fiyatı etiketten okumaz, GTIN üzerinden sistemden alır.","vi":"Đó là việc làm thừa. Máy tính tiền không đọc giá từ nhãn, mà lấy giá từ hệ thống qua GTIN.","ar":"هذا عمل غير ضروري. الصندوق لا يقرأ السعر من الملصق، بل يجلبه من النظام عبر GTIN."},"Nichts ändern. An der Kasse tippt ihr jedes Mal 0,50 € dazu.":{"tr":"Hiçbir şey değiştirmemek. Kasada her seferinde 0,50 € eklersiniz.","vi":"Không đổi gì. Ở quầy thu ngân lần nào các bạn cũng gõ thêm 0,50 €.","ar":"لا تغيّروا شيئاً. وعند الصندوق تضيفون 0,50 € في كل مرة."},"Und wenn ihr das vergesst? Das wird Chaos!":{"tr":"Peki unutursanız? Her şey karışır!","vi":"Nếu các bạn quên thì sao? Sẽ loạn mất!","ar":"وماذا لو نسيتم ذلك؟ ستكون فوضى!"},"So entstehen Fehler und falsche Verkaufsdaten. Preise werden zentral im System geändert.":{"tr":"Böylece hatalar ve yanlış satış verileri oluşur. Fiyatlar merkezden sistemde değiştirilir.","vi":"Như vậy sẽ gây lỗi và dữ liệu bán hàng sai. Giá được đổi tập trung trong hệ thống.","ar":"هكذا تحدث أخطاء وبيانات مبيعات خاطئة. تُغيَّر الأسعار مركزياً في النظام."},"…weil die Kasse den Preis über die GTIN aus dem Artikelstamm holt.":{"tr":"…çünkü kasa fiyatı GTIN üzerinden Artikelstamm (ürün ana verisi) içinden alır.","vi":"…vì máy tính tiền lấy giá từ dữ liệu hàng hóa (Artikelstamm) qua GTIN.","ar":"…لأن الصندوق يجلب السعر عبر GTIN من Artikelstamm (ملف بيانات المنتجات)."},"…weil der Preis direkt in der GTIN steht.":{"tr":"…çünkü fiyat doğrudan GTIN'in içinde yazar.","vi":"…vì giá nằm ngay trong GTIN.","ar":"…لأن السعر مكتوب مباشرة داخل GTIN."},"…weil die TSE alle Preise automatisch anpasst.":{"tr":"…çünkü TSE (kasa güvenlik modülü) tüm fiyatları otomatik olarak ayarlar.","vi":"…vì TSE (thiết bị bảo mật chống gian lận quầy thu ngân) tự động điều chỉnh mọi giá.","ar":"…لأن TSE (وحدة الأمان التقنية) تعدّل كل الأسعار تلقائياً."},"Gast, kauft eine Cola":{"tr":"Misafir, bir kola alıyor","vi":"Khách mua một chai Cola","ar":"ضيف يشتري كولا"},"Paul kauft eine Cola. Er winkt ab: „Den Bon brauch ich nicht, schmeiß weg!“ Nebenan bei Kevin gibt es gar keine Bons: „Spart Papier!“":{"tr":"Paul bir kola alıyor. Elini sallar: „Fişi istemiyorum, at gitsin!“ Yandaki Kevin'de hiç fiş yok: „Kâğıt tasarrufu!“","vi":"Paul mua một chai Cola. Anh ấy xua tay: „Tôi không cần hóa đơn (Bon), vứt đi!“ Bên cạnh, chỗ Kevin hoàn toàn không có hóa đơn: „Tiết kiệm giấy!“","ar":"Paul يشتري كولا. يرفض بيده: „لا أحتاج الإيصال، ارمِه!“ وبجانبه عند Kevin لا توجد إيصالات أصلاً: „نوفّر الورق!“"},"Was macht ihr mit dem Bon?":{"tr":"Fişi ne yaparsınız?","vi":"Các bạn làm gì với hóa đơn?","ar":"ماذا تفعلون بالإيصال؟"},"Belegausgabepflicht":{"tr":"Fiş verme zorunluluğu (Belegausgabepflicht)","vi":"Nghĩa vụ xuất hóa đơn (Belegausgabepflicht)","ar":"Belegausgabepflicht (واجب إصدار الإيصال)"},"Seit 2020 bekommt jeder Kunde einen Beleg, auf Papier oder elektronisch (E-Bon). Er muss ihn nicht mitnehmen.":{"tr":"2020'den beri her müşteri kâğıt veya elektronik (E-Bon) bir fiş (Beleg) alır. Müşterinin fişi yanında götürmesi gerekmez.","vi":"Từ năm 2020, mỗi khách hàng nhận một hóa đơn (Beleg), bằng giấy hoặc điện tử (E-Bon). Khách không bắt buộc phải mang theo.","ar":"منذ 2020 يحصل كل عميل على إيصال، على الورق أو إلكترونياً (E-Bon). ولا يجب عليه أخذه معه."},"Belegausgabepflicht seit 2020: Jeder Kunde bekommt einen Beleg, auf Papier oder elektronisch (E-Bon).":{"tr":"2020'den beri Belegausgabepflicht (fiş verme zorunluluğu): Her müşteri kâğıt veya elektronik (E-Bon) bir fiş alır.","vi":"Nghĩa vụ xuất hóa đơn (Belegausgabepflicht) từ năm 2020: Mỗi khách hàng nhận một hóa đơn, bằng giấy hoặc điện tử (E-Bon).","ar":"Belegausgabepflicht (واجب إصدار الإيصال) منذ 2020: كل عميل يحصل على إيصال، على الورق أو إلكترونياً (E-Bon)."},"Den Bon trotzdem ausgeben: „Ihr Bon – Sie müssen ihn nicht mitnehmen.“":{"tr":"Fişi yine de vermek: „Fişiniz – yanınızda götürmek zorunda değilsiniz.“","vi":"Vẫn xuất hóa đơn: „Đây là hóa đơn của bạn – bạn không bắt buộc phải mang theo.“","ar":"أعطِ الإيصال رغم ذلك: „هذا إيصالكم – لا يجب أن تأخذوه معكم.“"},"Ah, okay. Dann leg ich ihn halt in den Müll da.":{"tr":"Ha, tamam. O zaman şuradaki çöpe atarım.","vi":"À, được rồi. Vậy tôi bỏ vào thùng rác đằng kia.","ar":"آه، حسناً. إذن سأضعه في سلة المهملات هناك."},"Seit 2020 gilt die Belegausgabepflicht. Der Betrieb muss einen Beleg ausgeben (Papier oder E-Bon). Der Kunde muss ihn aber nicht mitnehmen.":{"tr":"2020'den beri Belegausgabepflicht (fiş verme zorunluluğu) geçerlidir. İşletme bir fiş vermek zorundadır (kâğıt veya E-Bon). Ama müşteri fişi götürmek zorunda değildir.","vi":"Từ năm 2020 có nghĩa vụ xuất hóa đơn (Belegausgabepflicht). Cửa hàng phải xuất hóa đơn (giấy hoặc E-Bon). Nhưng khách không bắt buộc phải mang theo.","ar":"منذ 2020 يسري Belegausgabepflicht (واجب إصدار الإيصال). على المحل أن يُصدر إيصالاً (ورقياً أو E-Bon). لكن العميل لا يجب أن يأخذه معه."},"Wenn der Gast keinen Bon will, wird auch keiner erstellt.":{"tr":"Misafir fiş istemiyorsa fiş de oluşturulmaz.","vi":"Nếu khách không muốn hóa đơn thì cũng không lập hóa đơn.","ar":"إذا لم يرد الضيف إيصالاً، فلا يُنشأ أي إيصال."},"Cool, geht schneller.":{"tr":"Harika, daha hızlı.","vi":"Tuyệt, nhanh hơn.","ar":"رائع، أسرع هكذا."},"Das verstößt gegen die Belegausgabepflicht. Jeder Verkauf bekommt einen Beleg.":{"tr":"Bu, Belegausgabepflicht (fiş verme zorunluluğu) kuralına aykırıdır. Her satışa bir fiş verilir.","vi":"Làm vậy là vi phạm nghĩa vụ xuất hóa đơn (Belegausgabepflicht). Mỗi lần bán hàng đều có hóa đơn.","ar":"هذا مخالف لـ Belegausgabepflicht (واجب إصدار الإيصال). كل عملية بيع تحصل على إيصال."},"Bons nur bei Kartenzahlung drucken, bei Bargeld nicht.":{"tr":"Fişleri sadece kartla ödemede yazdırmak, nakit ödemede yazdırmamak.","vi":"Chỉ in hóa đơn khi thanh toán bằng thẻ, tiền mặt thì không.","ar":"طباعة الإيصالات فقط عند الدفع بالبطاقة، وليس عند الدفع نقداً."},"Okay … komisches System.":{"tr":"Tamam … garip bir sistem.","vi":"Được rồi … hệ thống lạ thật.","ar":"حسناً… نظام غريب."},"Die Belegausgabepflicht gilt für jede Zahlungsart, auch bei Bargeld.":{"tr":"Belegausgabepflicht (fiş verme zorunluluğu) her ödeme türü için geçerlidir, nakit ödeme için de.","vi":"Nghĩa vụ xuất hóa đơn (Belegausgabepflicht) áp dụng cho mọi hình thức thanh toán, kể cả tiền mặt.","ar":"Belegausgabepflicht (واجب إصدار الإيصال) تسري على كل طرق الدفع، حتى الدفع نقداً."},"…weil seit 2020 jeder Kunde einen Beleg bekommt – mitnehmen muss er ihn aber nicht.":{"tr":"…çünkü 2020'den beri her müşteri bir fiş alır – ama götürmek zorunda değildir.","vi":"…vì từ năm 2020 mỗi khách hàng đều nhận hóa đơn – nhưng khách không bắt buộc phải mang theo.","ar":"…لأن كل عميل منذ 2020 يحصل على إيصال – لكن لا يجب أن يأخذه معه."},"…weil der Kunde den Bon immer mitnehmen muss.":{"tr":"…çünkü müşteri fişi her zaman yanında götürmek zorundadır.","vi":"…vì khách hàng lúc nào cũng phải mang hóa đơn theo.","ar":"…لأن على العميل أن يأخذ الإيصال دائماً."},"…weil auf dem Bon der Einkaufspreis des Geschäfts steht.":{"tr":"…çünkü fişin üzerinde mağazanın alış fiyatı yazar.","vi":"…vì trên hóa đơn có ghi giá nhập của cửa hàng.","ar":"…لأن سعر الشراء الخاص بالمحل مكتوب على الإيصال."},"eure Kollegin an Kasse 2":{"tr":"2 numaralı kasadaki iş arkadaşınız","vi":"đồng nghiệp của các bạn ở quầy thu ngân 2","ar":"زميلتكم عند الصندوق 2"},"Lina hat aus Versehen 3 Sonnencremes statt 1 eingescannt. Der Bon ist schon gedruckt. Sie flüstert: „Ich zerreiß den einfach.“":{"tr":"Lina yanlışlıkla 1 yerine 3 güneş kremi okuttu. Fiş zaten yazdırıldı. Fısıldar: „Ben bunu yırtıp atarım.“","vi":"Lina vô tình quét 3 tuýp kem chống nắng thay vì 1. Hóa đơn đã in rồi. Cô ấy thì thầm: „Mình xé nó đi thôi.“","ar":"Lina مسحت عن طريق الخطأ 3 واقيات شمس بدل 1. الإيصال طُبع بالفعل. تهمس: „سأمزّقه فقط.“"},"Was sagt ihr Lina?":{"tr":"Lina'ya ne söylersiniz?","vi":"Các bạn nói gì với Lina?","ar":"ماذا تقولون لـ Lina؟"},"Storno":{"tr":"Storno (iptal)","vi":"Hủy (Storno)","ar":"Storno (إلغاء)"},"Ein falsch erfasster Artikel wird in der Kasse rückgängig gemacht. Der falsche Bon wird aufbewahrt.":{"tr":"Yanlış girilen ürün kasada geri alınır. Yanlış fiş saklanır.","vi":"Mặt hàng nhập sai được hủy trong máy tính tiền. Hóa đơn sai được giữ lại.","ar":"المنتج المسجَّل خطأً يُلغى في الصندوق. ويُحتفظ بالإيصال الخاطئ."},"Ein Tippfehler wird storniert; der falsche Bon wird aufbewahrt, weil er für die Kassenabrechnung gebraucht wird.":{"tr":"Yazım hatası stornolanır (iptal edilir); yanlış fiş saklanır, çünkü kasa hesabı (Kassenabrechnung) için gereklidir.","vi":"Lỗi gõ được hủy (Storno); hóa đơn sai được giữ lại vì cần cho việc quyết toán quỹ (Kassenabrechnung).","ar":"خطأ الكتابة يُلغى (storniert)؛ ويُحتفظ بالإيصال الخاطئ لأنه مطلوب لتسوية الصندوق (Kassenabrechnung)."},"„Den Fehler stornieren und den falschen Bon aufbewahren.“":{"tr":"„Hatayı iptal et ve yanlış fişi sakla.“","vi":"„Hủy lỗi đó (Storno) và giữ lại hóa đơn sai.“","ar":"„ألغِ الخطأ (stornieren) واحتفظ بالإيصال الخاطئ.“"},"Okay, Storno … und der Bon kommt in die Kassenschublade. Danke!":{"tr":"Tamam, iptal … ve fiş kasa çekmecesine gidiyor. Teşekkürler!","vi":"Được rồi, hủy (Storno) … và hóa đơn bỏ vào ngăn kéo quỹ. Cảm ơn!","ar":"حسناً، Storno (إلغاء)… والإيصال يذهب إلى درج الصندوق. شكراً!"},"Ein Tippfehler wird storniert. Der falsche Bon wird aufbewahrt, weil er für die Kassenabrechnung gebraucht wird.":{"tr":"Yazım hatası iptal edilir. Yanlış fiş saklanır, çünkü kasa hesabı (Kassenabrechnung) için gereklidir.","vi":"Lỗi gõ được hủy (Storno). Hóa đơn sai được giữ lại vì cần cho việc quyết toán quỹ (Kassenabrechnung).","ar":"خطأ الكتابة يُلغى (storniert). ويُحتفظ بالإيصال الخاطئ لأنه مطلوب لتسوية الصندوق (Kassenabrechnung)."},"„Zerreiß ihn und tipp den Einkauf einfach neu.“":{"tr":"„Yırt at ve alışverişi baştan gir.“","vi":"„Xé nó đi rồi gõ lại đơn hàng thôi.“","ar":"„مزّقه وأعد إدخال المشتريات من جديد.“"},"Gut, weg damit.":{"tr":"İyi, atayım.","vi":"Tốt, bỏ đi.","ar":"جيد، لنتخلص منه."},"Ohne Storno stimmt die Kasse am Abend nicht. Die TSE hat den Vorgang gespeichert. Falsche Bons werden aufbewahrt.":{"tr":"İptal yapılmazsa akşam kasa tutmaz. TSE (kasa güvenlik modülü) işlemi kaydetti. Yanlış fişler saklanır.","vi":"Nếu không hủy (Storno) thì buổi tối quỹ sẽ không khớp. TSE đã lưu giao dịch này. Hóa đơn sai phải được giữ lại.","ar":"بدون Storno (إلغاء) لن يتطابق الصندوق في المساء. TSE (وحدة الأمان التقنية) خزّنت العملية. تُحفظ الإيصالات الخاطئة."},"„Lass es so. Am Abend fällt das schon auf.“":{"tr":"„Öyle kalsın. Akşam nasılsa fark edilir.“","vi":"„Cứ để vậy. Buổi tối rồi cũng sẽ bị phát hiện thôi.“","ar":"„اتركه هكذا. سيظهر الأمر في المساء على أي حال.“"},"Hm, dann zahlt die Kundin aber zu viel …":{"tr":"Hmm, ama o zaman müşteri fazla öder …","vi":"Hừm, vậy thì khách sẽ trả quá nhiều …","ar":"همم، لكن حينها ستدفع العميلة أكثر من اللازم…"},"Die Kundin würde zu viel bezahlen. Fehler werden sofort storniert.":{"tr":"Müşteri fazla ödemiş olurdu. Hatalar hemen iptal edilir.","vi":"Khách sẽ phải trả quá nhiều. Lỗi phải được hủy (Storno) ngay.","ar":"العميلة ستدفع أكثر من اللازم. تُلغى الأخطاء فوراً."},"…weil der falsche Bon für die Kassenabrechnung gebraucht wird.":{"tr":"…çünkü yanlış fiş kasa hesabı (Kassenabrechnung) için gereklidir.","vi":"…vì hóa đơn sai cần cho việc quyết toán quỹ (Kassenabrechnung).","ar":"…لأن الإيصال الخاطئ مطلوب لتسوية الصندوق (Kassenabrechnung)."},"…weil man Umsätze in der Kasse einfach löschen darf.":{"tr":"…çünkü kasadaki satışları öylece silmek serbesttir.","vi":"…vì có thể tự do xóa doanh thu trong máy tính tiền.","ar":"…لأنه يُسمح بحذف المبيعات من الصندوق ببساطة."},"…weil die Kundin den falschen Bon behalten muss.":{"tr":"…çünkü müşteri yanlış fişi saklamak zorundadır.","vi":"…vì khách hàng phải giữ hóa đơn sai.","ar":"…لأن على العميلة الاحتفاظ بالإيصال الخاطئ."},"Seit 2020 braucht jede elektronische Kasse eine TSE. Welches Problem will der Staat damit lösen?":{"tr":"2020'den beri her elektronik kasanın bir TSE (kasa güvenlik modülü) cihazına ihtiyacı var. Devlet bununla hangi sorunu çözmek istiyor?","vi":"Từ năm 2020 mỗi máy tính tiền điện tử cần có TSE (thiết bị bảo mật chống gian lận). Nhà nước muốn giải quyết vấn đề gì bằng cách đó?","ar":"منذ 2020 يحتاج كل صندوق دفع إلكتروني إلى TSE (وحدة الأمان التقنية). ما المشكلة التي تريد الدولة حلّها بذلك؟"},"Niemand soll Umsätze nachträglich löschen oder ändern können – das verhindert Steuerbetrug.":{"tr":"Hiç kimse satışları sonradan silememeli veya değiştirememeli – bu vergi sahtekârlığını önler.","vi":"Không ai được xóa hay sửa doanh thu về sau – điều này ngăn chặn gian lận thuế.","ar":"لا يجب أن يستطيع أحد حذف المبيعات أو تغييرها لاحقاً – هذا يمنع التهرّب الضريبي."},"Die Kasse soll schneller drucken.":{"tr":"Kasa daha hızlı yazdırmalı.","vi":"Máy tính tiền sẽ in nhanh hơn.","ar":"يجب أن يطبع الصندوق أسرع."},"Kunden sollen keinen Bon mehr brauchen.":{"tr":"Müşterilerin artık fişe ihtiyacı olmamalı.","vi":"Khách hàng sẽ không cần hóa đơn nữa.","ar":"لا يجب أن يحتاج العملاء إلى إيصال بعد الآن."},"Viele Gäste lassen den Bon liegen. Welche Lösung schont die Umwelt und hält die Pflicht ein?":{"tr":"Birçok misafir fişi bırakıp gidiyor. Hangi çözüm çevreyi korur ve zorunluluğa uyar?","vi":"Nhiều khách bỏ lại hóa đơn. Giải pháp nào bảo vệ môi trường và vẫn tuân thủ nghĩa vụ?","ar":"كثير من الضيوف يتركون الإيصال. أي حل يحمي البيئة ويلتزم بالواجب؟"},"Einen elektronischen Bon (E-Bon) per App oder QR-Code anbieten.":{"tr":"Uygulama veya QR kod ile elektronik fiş (E-Bon) sunmak.","vi":"Đề nghị hóa đơn điện tử (E-Bon) qua ứng dụng hoặc mã QR.","ar":"تقديم إيصال إلكتروني (E-Bon) عبر تطبيق أو رمز QR."},"Gar keine Bons mehr ausgeben.":{"tr":"Artık hiç fiş vermemek.","vi":"Không xuất hóa đơn nữa.","ar":"عدم إصدار أي إيصالات بعد الآن."},"Bons nur an Stammkunden ausgeben.":{"tr":"Fişleri sadece düzenli müşterilere vermek.","vi":"Chỉ xuất hóa đơn cho khách quen.","ar":"إصدار الإيصالات فقط للعملاء الدائمين."},"Die Tore gehen auf":{"tr":"Kapılar açılıyor","vi":"Cổng mở","ar":"تُفتح الأبواب"},"Kassieren Schritt für Schritt":{"tr":"Adım adım kasada ödeme almak","vi":"Thu tiền từng bước","ar":"التحصيل خطوة بخطوة"},"16 Uhr. Die Tore gehen auf. In fünf Minuten steht die erste Schlange vor eurem Stand. Ole Brodersen von der Festivalleitung schaut genau hin: Nur der beste Stand darf 2027 wiederkommen.":{"tr":"Saat 16. Kapılar açılıyor. Beş dakika sonra standınızın önünde ilk kuyruk olacak. Festival yönetiminden Ole Brodersen dikkatle izliyor: 2027'de sadece en iyi stand geri gelebilir.","vi":"16 giờ. Cổng mở. Năm phút nữa hàng người đầu tiên sẽ đứng trước quầy của các bạn. Ole Brodersen của ban tổ chức lễ hội quan sát rất kỹ: Chỉ quầy tốt nhất mới được quay lại năm 2027.","ar":"الساعة 16. تُفتح الأبواب. بعد خمس دقائق سيقف أول طابور أمام كشككم. Ole Brodersen من إدارة المهرجان يراقب عن كثب: فقط أفضل كشك يحق له العودة في 2027."},"die Kassieranweisung":{"tr":"kasa talimatı (Kassieranweisung)","vi":"hướng dẫn thu ngân","ar":"Kassieranweisung (تعليمات العمل على الصندوق)"},"das Wechselgeld":{"tr":"bozuk para (kasa başlangıç parası)","vi":"tiền lẻ để thối (tiền đầu ca)","ar":"Wechselgeld (الفكّة، مبلغ بداية الصندوق)"},"einzählen":{"tr":"sayarak teslim almak","vi":"đếm nhập vào quỹ","ar":"عدّ المبلغ عند الاستلام (einzählen)"},"die Bonrolle":{"tr":"fiş rulosu","vi":"cuộn giấy in hóa đơn","ar":"Bonrolle (لفة ورق الإيصالات)"},"der Geldscheinhalter":{"tr":"banknot tutucu","vi":"kẹp giữ tiền giấy","ar":"Geldscheinhalter (حامل الأوراق النقدية)"},"vorzählen":{"tr":"sesli saymak (müşterinin önünde)","vi":"đếm to trước mặt khách","ar":"العدّ أمام العميل (vorzählen)"},"das Rückgeld":{"tr":"para üstü","vi":"tiền thối lại","ar":"الباقي (المبلغ المردود)"},"der Blickkontakt":{"tr":"göz teması","vi":"giao tiếp bằng mắt","ar":"التواصل بالعينين (Blickkontakt)"},"kundenorientiert":{"tr":"müşteri odaklı","vi":"hướng đến khách hàng","ar":"موجّه نحو العميل (kundenorientiert)"},"die Kundenbindung":{"tr":"müşteri bağlılığı","vi":"giữ chân khách hàng","ar":"ولاء العملاء (Kundenbindung)"},"der Zusatzartikel":{"tr":"ek ürün","vi":"mặt hàng bán thêm","ar":"منتج إضافي (Zusatzartikel)"},"eure Kollegin":{"tr":"iş arkadaşınız","vi":"đồng nghiệp của các bạn","ar":"زميلتكم"},"Noch fünf Minuten bis zum ersten Gast. Lina fragt: „Was machen wir zuerst?“":{"tr":"İlk misafire beş dakika kaldı. Lina soruyor: „Önce ne yapıyoruz?“","vi":"Còn năm phút nữa là đến vị khách đầu tiên. Lina hỏi: „Chúng ta làm gì trước?“","ar":"بقيت خمس دقائق حتى أول ضيف. تسأل Lina: „ماذا نفعل أولاً؟“"},"Was erledigt ihr vor dem Kassieren?":{"tr":"Ödeme almadan önce neleri halledersiniz?","vi":"Các bạn làm gì trước khi thu tiền?","ar":"ماذا تفعلون قبل التحصيل؟"},"Vorbereitende Tätigkeiten":{"tr":"Hazırlık işleri","vi":"Công việc chuẩn bị","ar":"الأعمال التحضيرية"},"Kasse anmelden · Wechselgeld holen, einzählen und prüfen · Bonrollen prüfen · Geräte testen · Tüten bereitlegen · Ordnung.":{"tr":"Kasayı açmak · bozuk parayı (Wechselgeld) almak, saymak ve kontrol etmek · fiş rulolarını kontrol etmek · cihazları denemek · poşetleri hazırlamak · düzen.","vi":"Đăng nhập máy tính tiền · Lấy tiền lẻ để thối (Wechselgeld), đếm và kiểm tra · Kiểm tra cuộn giấy hóa đơn · Thử thiết bị · Chuẩn bị túi · Giữ gọn gàng.","ar":"تسجيل الدخول إلى الصندوق · إحضار Wechselgeld (الفكّة) وعدّها وفحصها · فحص لفات الإيصالات · اختبار الأجهزة · تجهيز الأكياس · ترتيب المكان."},"Vorbereitende Tätigkeiten: Kasse anmelden, Wechselgeld prüfen, Kassenbestand nachzählen, Ordnung und Sauberkeit prüfen, Ersatzkassenrollen bereitlegen.":{"tr":"Hazırlık işleri: kasayı açmak, bozuk parayı (Wechselgeld) kontrol etmek, kasadaki parayı yeniden saymak, düzen ve temizliği kontrol etmek, yedek fiş rulolarını hazırlamak.","vi":"Công việc chuẩn bị: Đăng nhập máy tính tiền, kiểm tra tiền lẻ để thối (Wechselgeld), đếm lại tiền trong quỹ, kiểm tra sự gọn gàng và sạch sẽ, chuẩn bị cuộn giấy in dự phòng.","ar":"الأعمال التحضيرية: تسجيل الدخول إلى الصندوق، فحص Wechselgeld (الفكّة)، إعادة عدّ محتوى الصندوق، فحص النظام والنظافة، تجهيز لفات إيصالات احتياطية."},"Kasse anmelden, Wechselgeld einzählen und prüfen, Ersatz-Bonrollen bereitlegen.":{"tr":"Kasayı açmak, bozuk parayı (Wechselgeld) saymak ve kontrol etmek, yedek fiş rulolarını hazırlamak.","vi":"Đăng nhập máy tính tiền, đếm và kiểm tra tiền lẻ để thối (Wechselgeld), chuẩn bị cuộn giấy hóa đơn dự phòng.","ar":"تسجيل الدخول إلى الصندوق، عدّ Wechselgeld (الفكّة) وفحصها، تجهيز لفات إيصالات احتياطية."},"Alles gezählt: 300 € Wechselgeld. Jetzt kann es losgehen!":{"tr":"Hepsi sayıldı: 300 € bozuk para. Şimdi başlayabiliriz!","vi":"Đã đếm xong: 300 € tiền lẻ để thối. Giờ có thể bắt đầu!","ar":"تم عدّ كل شيء: 300 € فكّة. الآن يمكننا البدء!"},"Das sind vorbereitende Tätigkeiten aus der Kassieranweisung. Nur mit eingezähltem Wechselgeld weiß man abends, ob die Kasse stimmt.":{"tr":"Bunlar Kassieranweisung (kasa talimatı) içindeki hazırlık işleridir. Bozuk para sayılmışsa akşam kasanın tutup tutmadığı anlaşılır.","vi":"Đây là các công việc chuẩn bị trong hướng dẫn thu ngân (Kassieranweisung). Chỉ khi đã đếm tiền lẻ để thối thì buổi tối mới biết quỹ có khớp hay không.","ar":"هذه أعمال تحضيرية من Kassieranweisung (تعليمات العمل على الصندوق). فقط مع Wechselgeld (الفكّة) المعدودة نعرف في المساء هل الصندوق صحيح."},"Nur die Kasse anmelden. Das Wechselgeld zählen wir heute Abend.":{"tr":"Sadece kasayı açmak. Bozuk parayı bu akşam sayarız.","vi":"Chỉ đăng nhập máy tính tiền thôi. Tiền lẻ để thối thì tối nay mới đếm.","ar":"فقط تسجيل الدخول إلى الصندوق. نعدّ الفكّة هذا المساء."},"Okay … aber wie viel war jetzt eigentlich drin?":{"tr":"Tamam … ama içinde tam olarak ne kadar vardı?","vi":"Được rồi … nhưng thực ra trong đó có bao nhiêu nhỉ?","ar":"حسناً… لكن كم كان فيه فعلاً؟"},"Wenn das Wechselgeld nicht eingezählt ist, kann man eine Kassendifferenz am Abend nicht erklären.":{"tr":"Bozuk para sayılmamışsa akşam bir Kassendifferenz (kasa farkı) açıklanamaz.","vi":"Nếu tiền lẻ để thối chưa được đếm thì buổi tối không thể giải thích được chênh lệch quỹ (Kassendifferenz).","ar":"إذا لم تُعدّ الفكّة (Wechselgeld)، لا يمكن تفسير Kassendifferenz (فرق الصندوق) في المساء."},"Erst mal ein Foto vom Stand für Instagram machen.":{"tr":"Önce standın Instagram için bir fotoğrafını çekmek.","vi":"Trước hết chụp một tấm ảnh quầy để đăng Instagram.","ar":"أولاً نلتقط صورة للكشك من أجل إنستغرام."},"Schönes Foto! Aber … wo ist die Bonrolle?":{"tr":"Güzel fotoğraf! Ama … fiş rulosu nerede?","vi":"Ảnh đẹp đấy! Nhưng … cuộn giấy hóa đơn đâu rồi?","ar":"صورة جميلة! لكن… أين لفة الإيصالات (Bonrolle)؟"},"Vor dem Kassieren wird der Kassenplatz vorbereitet: Kasse anmelden, Wechselgeld prüfen, Bonrollen, Ordnung.":{"tr":"Ödeme almadan önce kasa yeri hazırlanır: kasayı açmak, bozuk parayı kontrol etmek, fiş rulolarını ve düzeni kontrol etmek.","vi":"Trước khi thu tiền phải chuẩn bị chỗ thu ngân: đăng nhập máy tính tiền, kiểm tra tiền lẻ để thối, cuộn giấy hóa đơn, sự gọn gàng.","ar":"قبل التحصيل يُجهَّز مكان الصندوق: تسجيل الدخول إلى الصندوق، فحص الفكّة (Wechselgeld)، لفات الإيصالات، النظام."},"…weil man nur mit eingezähltem Wechselgeld abends prüfen kann, ob die Kasse stimmt.":{"tr":"…çünkü sadece sayılmış bozuk parayla akşam kasanın tutup tutmadığı kontrol edilebilir.","vi":"…vì chỉ khi đã đếm tiền lẻ để thối thì buổi tối mới kiểm tra được quỹ có khớp hay không.","ar":"…لأنه فقط مع Wechselgeld (الفكّة) المعدودة يمكن التحقق في المساء من أن الصندوق صحيح."},"…weil das Wechselgeld zum Umsatz des Tages zählt.":{"tr":"…çünkü bozuk para günlük cironun bir parçasıdır.","vi":"…vì tiền lẻ để thối được tính vào doanh thu trong ngày.","ar":"…لأن الفكّة (Wechselgeld) تُحسب ضمن مبيعات اليوم."},"…weil man ohne Bonrolle keine Kartenzahlung annehmen darf.":{"tr":"…çünkü fiş rulosu olmadan kartla ödeme kabul edilemez.","vi":"…vì không có cuộn giấy hóa đơn thì không được nhận thanh toán bằng thẻ.","ar":"…لأنه بدون لفة إيصالات لا يحق قبول الدفع بالبطاقة."},"Lina legt ihr Portemonnaie neben die Kasse. „Mein Bruder kommt nachher. Den kassiere ich selbst ab, dann muss er nicht warten.“":{"tr":"Lina cüzdanını kasanın yanına koyar. „Birazdan kardeşim gelecek. Onun ödemesini ben alırım, bekleyip durmasın.“","vi":"Lina đặt ví của cô ấy cạnh máy tính tiền. „Lát nữa anh trai mình sẽ đến. Mình tự thu tiền anh ấy, để anh ấy khỏi phải chờ.“","ar":"تضع Lina محفظتها بجانب الصندوق. „أخي سيأتي بعد قليل. سأحاسبه بنفسي، حتى لا يضطر إلى الانتظار.“"},"Kassieranweisung":{"tr":"Kassieranweisung (kasa talimatı)","vi":"Hướng dẫn thu ngân","ar":"Kassieranweisung (تعليمات العمل على الصندوق)"},"Regeln des Betriebs für die Kasse, z. B. Scheine prüfen, Rückgeld vorzählen, kein privates Geld, keine Familie abkassieren.":{"tr":"İşletmenin kasa kuralları, örneğin banknotları kontrol etmek, para üstünü sesli saymak, özel para olmaması, aileden birinin ödemesini almamak.","vi":"Quy định của cửa hàng về quầy thu ngân, ví dụ: kiểm tra tiền giấy, đếm to tiền thối lại, không để tiền riêng, không tự thu tiền người nhà.","ar":"قواعد المحل الخاصة بالصندوق، مثلاً فحص الأوراق النقدية، العدّ أمام العميل عند ردّ الباقي (Rückgeld)، لا مال خاص، لا تحصيل من الأقارب."},"Kassieranweisung: kein privates Geld im Kassenbereich · keine Familienangehörigen selbst abkassieren · Fehler stornieren und den falschen Bon aufbewahren.":{"tr":"Kassieranweisung (kasa talimatı): kasa alanında özel para yok · aile üyelerinin ödemesini kendin almıyorsun · hatayı iptal et ve yanlış fişi sakla.","vi":"Hướng dẫn thu ngân (Kassieranweisung): không để tiền riêng ở khu vực thu ngân · không tự thu tiền người thân trong gia đình · hủy lỗi (Storno) và giữ lại hóa đơn sai.","ar":"Kassieranweisung (تعليمات العمل على الصندوق): لا مال خاص في منطقة الصندوق · لا تحصيل بنفسك من أفراد العائلة · إلغاء الأخطاء (stornieren) والاحتفاظ بالإيصال الخاطئ."},"„Dein Portemonnaie muss weg vom Kassenplatz. Und deinen Bruder kassiert jemand anderes.“":{"tr":"„Cüzdanın kasa yerinden kalkmalı. Kardeşinin ödemesini de başka biri alır.“","vi":"„Ví của bạn phải để xa khỏi chỗ thu ngân. Và anh trai bạn sẽ do người khác thu tiền.“","ar":"„محفظتك يجب أن تبتعد عن مكان الصندوق. وأخوك يحاسبه شخص آخر.“"},"Stimmt, steht ja in der Kassieranweisung. Mach ich.":{"tr":"Doğru, kasa talimatında yazıyor. Yaparım.","vi":"Đúng rồi, có trong hướng dẫn thu ngân mà. Mình sẽ làm vậy.","ar":"صحيح، هذا مكتوب في Kassieranweisung (تعليمات العمل على الصندوق). سأفعل ذلك."},"Kein privates Geld im Kassenbereich, und Familienangehörige werden nicht selbst abkassiert. So gibt es keinen Streit bei Differenzen.":{"tr":"Kasa alanında özel para olmaz ve aile üyelerinin ödemesi kendin alınmaz. Böylece fark çıkarsa tartışma olmaz.","vi":"Không để tiền riêng ở khu vực thu ngân, và người thân trong gia đình không được tự thu tiền. Như vậy sẽ không có tranh cãi khi có chênh lệch.","ar":"لا مال خاص في منطقة الصندوق، ولا يحصّل الموظف بنفسه من أفراد عائلته. هكذا لا يحدث خلاف عند وجود فروق."},"„Portemonnaie weg, aber deinen Bruder kannst du ruhig selbst abkassieren.“":{"tr":"„Cüzdan kalksın ama kardeşinin ödemesini rahatça kendin alabilirsin.“","vi":"„Cất ví đi, nhưng anh trai bạn thì bạn cứ tự thu tiền được.“","ar":"„أبعدي المحفظة، لكن أخوك يمكنك محاسبته بنفسك بلا مشكلة.“"},"Okay, das Portemonnaie kommt in den Spind.":{"tr":"Tamam, cüzdan dolaba gidiyor.","vi":"Được rồi, ví sẽ cất vào tủ cá nhân.","ar":"حسناً، المحفظة ستذهب إلى الخزانة."},"Das Portemonnaie ist richtig. Familienangehörige dürfen aber nicht selbst abkassiert werden.":{"tr":"Cüzdan konusu doğru. Ama aile üyelerinin ödemesi kendin alınmamalıdır.","vi":"Việc cất ví là đúng. Nhưng không được tự thu tiền người thân trong gia đình.","ar":"المحفظة صحيحة. لكن لا يجوز تحصيل المبلغ بنفسك من أفراد العائلة."},"„Passt schon, ist doch Familie.“":{"tr":"„Önemli değil, nasılsa aile.“","vi":"„Không sao, là người nhà mà.“","ar":"„لا بأس، إنه من العائلة.“"},"Super, dann bleibt alles hier liegen.":{"tr":"Süper, o zaman her şey burada kalır.","vi":"Tuyệt, vậy mọi thứ cứ để nguyên ở đây.","ar":"ممتاز، إذن يبقى كل شيء هنا."},"Privates Geld an der Kasse führt zu Streit bei Kassendifferenzen. Familie kassiert eine andere Person ab.":{"tr":"Kasada özel para olması, Kassendifferenz (kasa farkı) durumunda tartışmaya yol açar. Aileden birinin ödemesini başka biri alır.","vi":"Tiền riêng ở quầy thu ngân gây tranh cãi khi có chênh lệch quỹ (Kassendifferenz). Người nhà do người khác thu tiền.","ar":"المال الخاص عند الصندوق يؤدي إلى خلاف عند Kassendifferenz (فرق الصندوق). العائلة يحاسبها شخص آخر."},"…weil die Kassieranweisung privates Geld an der Kasse und das Abkassieren der eigenen Familie verbietet.":{"tr":"…çünkü Kassieranweisung (kasa talimatı) kasada özel parayı ve kendi ailenin ödemesini almayı yasaklar.","vi":"…vì hướng dẫn thu ngân (Kassieranweisung) cấm để tiền riêng ở quầy thu ngân và cấm tự thu tiền người nhà.","ar":"…لأن Kassieranweisung (تعليمات العمل على الصندوق) تمنع المال الخاص عند الصندوق وتحصيل المبلغ من العائلة نفسها."},"…weil Familienangehörige keinen Rabatt bekommen dürfen.":{"tr":"…çünkü aile üyeleri indirim alamaz.","vi":"…vì người thân trong gia đình không được giảm giá.","ar":"…لأن أفراد العائلة لا يحق لهم الحصول على خصم."},"…weil privates Geld die TSE stört.":{"tr":"…çünkü özel para TSE'yi (kasa güvenlik modülü) bozar.","vi":"…vì tiền riêng làm nhiễu TSE.","ar":"…لأن المال الخاص يعطّل TSE (وحدة الأمان التقنية)."},"Gast mit 50-€-Schein":{"tr":"50 €'luk banknotla misafir","vi":"Khách đưa tờ 50 €","ar":"ضيف بورقة 50 €"},"Herr Demir kauft für 13,40 € ein und gibt dir einen 50-€-Schein. Hinter ihm warten zwölf Leute.":{"tr":"Bay Demir 13,40 € tutarında alışveriş yapıyor ve size 50 €'luk bir banknot veriyor. Arkasında on iki kişi bekliyor.","vi":"Ông Demir mua hàng 13,40 € và đưa bạn một tờ 50 €. Phía sau ông có mười hai người đang chờ.","ar":"السيد Demir يشتري بـ 13,40 € ويعطيك ورقة 50 €. خلفه ينتظر اثنا عشر شخصاً."},"Wie kassierst du?":{"tr":"Ödemeyi nasıl alırsınız?","vi":"Bạn thu tiền như thế nào?","ar":"كيف تحصّل المبلغ؟"},"Geldscheinhalter":{"tr":"Geldscheinhalter (banknot tutucu)","vi":"Kẹp giữ tiền giấy","ar":"Geldscheinhalter (حامل الأوراق النقدية)"},"Der Schein des Kunden wird sichtbar eingeklemmt und erst nach dem Rückgeld in die Kasse gelegt.":{"tr":"Müşterinin banknotu görünür şekilde sıkıştırılır ve ancak para üstü verildikten sonra kasaya konur.","vi":"Tờ tiền của khách được kẹp ở chỗ nhìn thấy và chỉ bỏ vào quỹ sau khi đã đưa tiền thối lại.","ar":"تُثبَّت ورقة العميل بشكل ظاهر، ولا توضع في الصندوق إلا بعد ردّ الباقي (Rückgeld)."},"Fehlende Schritte beim Barzahlen: Betrag nennen · Geld entgegennehmen, prüfen und den Wert nennen · Geld sichtbar ablegen · Rückgeld vorzählen.":{"tr":"Nakit ödemede eksik adımlar: tutarı söylemek · parayı almak, kontrol etmek ve değerini söylemek · parayı görünür şekilde koymak · para üstünü sesli saymak.","vi":"Các bước còn thiếu khi nhận tiền mặt: Nói số tiền phải trả · Nhận tiền, kiểm tra và nói to mệnh giá · Đặt tiền ở chỗ nhìn thấy · Đếm to tiền thối lại.","ar":"الخطوات الناقصة عند الدفع نقداً: ذكر المبلغ · استلام المال وفحصه وذكر قيمته · وضع المال بشكل ظاهر · العدّ أمام العميل عند ردّ الباقي."},"Betrag nennen, Schein prüfen und Wert laut nennen, Schein in den Geldscheinhalter klemmen, 36,60 € vorzählen, dann Schein in die Kasse.":{"tr":"Tutarı söylemek, banknotu kontrol edip değerini yüksek sesle söylemek, banknotu banknot tutucuya sıkıştırmak, 36,60 € sesli saymak, sonra banknotu kasaya koymak.","vi":"Nói số tiền phải trả, kiểm tra tờ tiền và nói to mệnh giá, kẹp tờ tiền vào kẹp giữ tiền giấy, đếm to 36,60 €, sau đó mới bỏ tờ tiền vào quỹ.","ar":"ذكر المبلغ، فحص الورقة وذكر قيمتها بصوت عالٍ، تثبيت الورقة في Geldscheinhalter (حامل الأوراق النقدية)، العدّ أمام العميل 36,60 €، ثم وضع الورقة في الصندوق."},"Perfekt, stimmt genau. Danke!":{"tr":"Mükemmel, tam doğru. Teşekkürler!","vi":"Hoàn hảo, đúng chính xác. Cảm ơn!","ar":"ممتاز، بالضبط. شكراً!"},"So läuft der Kassiervorgang. Der Schein bleibt sichtbar liegen, bis das Rückgeld gegeben ist. Dann gibt es keinen Streit.":{"tr":"Ödeme işlemi böyle yürür. Banknot, para üstü verilene kadar görünür şekilde durur. Böylece tartışma çıkmaz.","vi":"Quy trình thu tiền là như vậy. Tờ tiền được để ở chỗ nhìn thấy cho đến khi đưa xong tiền thối lại. Như vậy sẽ không có tranh cãi.","ar":"هكذا تجري عملية التحصيل. تبقى الورقة ظاهرة حتى يُردّ الباقي (Rückgeld). حينها لا يحدث خلاف."},"Schein prüfen und 36,60 € still in die Hand drücken.":{"tr":"Banknotu kontrol etmek ve 36,60 € sessizce eline vermek.","vi":"Kiểm tra tờ tiền và lẳng lặng nhét 36,60 € vào tay khách.","ar":"فحص الورقة ووضع 36,60 € في يده بصمت."},"Äh … stimmt das jetzt? Ich zähl lieber nach.":{"tr":"Şey … bu doğru mu şimdi? Ben yine de sayayım.","vi":"Ơ … có đúng không nhỉ? Tôi đếm lại cho chắc.","ar":"همم… هل هذا صحيح؟ الأفضل أن أعدّ بنفسي."},"Der Betrag stimmt, aber das Rückgeld wird laut vorgezählt. So sieht der Kunde, dass alles passt.":{"tr":"Tutar doğru, ama para üstü yüksek sesle sayılır. Böylece müşteri her şeyin doğru olduğunu görür.","vi":"Số tiền thì đúng, nhưng tiền thối lại phải đếm to trước mặt khách. Như vậy khách thấy mọi thứ đều khớp.","ar":"المبلغ صحيح، لكن الباقي (Rückgeld) يُعدّ بصوت عالٍ أمام العميل. هكذا يرى العميل أن كل شيء صحيح."},"Schein sofort in die Kasse legen und schnell 36,60 € rausgeben.":{"tr":"Banknotu hemen kasaya koymak ve çabucak 36,60 € vermek.","vi":"Bỏ tờ tiền vào quỹ ngay và nhanh chóng đưa ra 36,60 €.","ar":"وضع الورقة فوراً في الصندوق وإعطاء 36,60 € بسرعة."},"Moment! Ich hab Ihnen doch einen Hunderter gegeben!":{"tr":"Bir dakika! Ben size yüz euroluk verdim!","vi":"Khoan! Tôi đã đưa bạn tờ một trăm mà!","ar":"لحظة! لقد أعطيتك ورقة مئة!"},"Liegt der Schein schon in der Kasse, kann man nicht mehr zeigen, welcher Schein gegeben wurde.":{"tr":"Banknot kasaya girmişse hangi banknotun verildiği artık gösterilemez.","vi":"Nếu tờ tiền đã nằm trong quỹ thì không thể chứng minh được khách đã đưa tờ nào.","ar":"إذا كانت الورقة في الصندوق بالفعل، فلا يمكن إظهار أي ورقة أُعطيت."},"…weil man so jederzeit sieht, welcher Schein gegeben wurde – dann gibt es keinen Streit ums Rückgeld.":{"tr":"…çünkü böylece hangi banknotun verildiği her zaman görülür – o zaman para üstü konusunda tartışma çıkmaz.","vi":"…vì như vậy lúc nào cũng thấy được khách đã đưa tờ nào – nên sẽ không có tranh cãi về tiền thối lại.","ar":"…لأنه هكذا يمكن في أي وقت رؤية أي ورقة أُعطيت – وحينها لا يحدث خلاف حول الباقي (Rückgeld)."},"…weil Geldscheine im Halter nicht gefälscht sein können.":{"tr":"…çünkü tutucudaki banknotlar sahte olamaz.","vi":"…vì tiền giấy trong kẹp không thể là tiền giả.","ar":"…لأن الأوراق النقدية في الحامل لا يمكن أن تكون مزوّرة."},"…weil der Kunde den Schein bis zum Ende zurückverlangen darf.":{"tr":"…çünkü müşteri banknotu sonuna kadar geri isteyebilir.","vi":"…vì khách được phép đòi lại tờ tiền cho đến cuối cùng.","ar":"…لأن للعميل أن يطلب الورقة بعد انتهاء العملية."},"Mutter mit zwei Kindern":{"tr":"İki çocuklu anne","vi":"Người mẹ với hai đứa con","ar":"أم مع طفلين"},"Frau Albers kauft Sonnencreme und Wasser. Die Kinder quengeln, sie wirkt gestresst. Die Schlange ist lang.":{"tr":"Bayan Albers güneş kremi ve su alıyor. Çocuklar mızmızlanıyor, o stresli görünüyor. Kuyruk uzun.","vi":"Bà Albers mua kem chống nắng và nước. Hai đứa trẻ quấy khóc, bà trông căng thẳng. Hàng người rất dài.","ar":"السيدة Albers تشتري واقي شمس وماء. الطفلان يتذمّران وتبدو متوترة. الطابور طويل."},"Wie bedienst du sie?":{"tr":"Ona nasıl hizmet edersiniz?","vi":"Bạn phục vụ bà như thế nào?","ar":"كيف تخدمها؟"},"Kundenorientiertes Verhalten":{"tr":"Müşteri odaklı davranış","vi":"Cách cư xử hướng đến khách hàng","ar":"السلوك الموجّه نحو العميل (kundenorientiert)"},"Begrüßung, Blickkontakt, Kauf bestätigen, Ware sorgsam behandeln, Service anbieten, sich bedanken und verabschieden.":{"tr":"Selamlama, göz teması, alışverişi onaylama, ürüne özenle davranma, hizmet sunma, teşekkür etme ve vedalaşma.","vi":"Chào hỏi, giao tiếp bằng mắt, xác nhận việc mua, xử lý hàng cẩn thận, đề nghị dịch vụ, cảm ơn và chào tạm biệt.","ar":"التحية، التواصل بالعينين، تأكيد الشراء، التعامل مع البضاعة بعناية، عرض خدمة، الشكر والتوديع."},"Gründe für kundenorientiertes Verhalten: Kundenbindung, Kundenzufriedenheit, positives Image, erster und letzter Eindruck, Abheben von Mitbewerbern, Weiterempfehlung.":{"tr":"Müşteri odaklı davranışın nedenleri: müşteri bağlılığı (Kundenbindung), müşteri memnuniyeti, olumlu imaj, ilk ve son izlenim, rakiplerden ayrılma, tavsiye edilme.","vi":"Lý do cư xử hướng đến khách hàng: giữ chân khách hàng (Kundenbindung), khách hàng hài lòng, hình ảnh tích cực, ấn tượng đầu và cuối, khác biệt so với đối thủ, được giới thiệu cho người khác.","ar":"أسباب السلوك الموجّه نحو العميل: ولاء العملاء (Kundenbindung)، رضا العملاء، صورة إيجابية، الانطباع الأول والأخير، التميّز عن المنافسين، التوصية للآخرين."},"Blickkontakt, freundlich grüßen, Kauf bestätigen („Gute Wahl bei der Sonne heute!“), Tüte anbieten, verabschieden.":{"tr":"Göz teması, güler yüzle selam vermek, alışverişi onaylamak („Bugün güneş için iyi seçim!“), poşet önermek, vedalaşmak.","vi":"Giao tiếp bằng mắt, chào hỏi thân thiện, xác nhận việc mua („Hôm nay chọn kem chống nắng hay lắm!“), đề nghị túi, chào tạm biệt.","ar":"التواصل بالعينين، تحية ودودة، تأكيد الشراء („اختيار جيد لواقي الشمس اليوم!“)، عرض كيس، توديع."},"Danke, das ist lieb. Hier komm ich morgen wieder her!":{"tr":"Teşekkürler, ne güzel. Yarın da buraya gelirim!","vi":"Cảm ơn, bạn thật tốt. Ngày mai tôi sẽ quay lại đây!","ar":"شكراً، هذا لطيف. سأعود إلى هنا غداً!"},"Die Kasse ist der erste und letzte Eindruck. Zufriedene Kunden kommen wieder (Kundenbindung) und empfehlen den Stand weiter.":{"tr":"Kasa ilk ve son izlenimdir. Memnun müşteriler geri gelir (Kundenbindung, müşteri bağlılığı) ve standı tavsiye eder.","vi":"Quầy thu ngân là ấn tượng đầu tiên và cuối cùng. Khách hài lòng sẽ quay lại (giữ chân khách hàng, Kundenbindung) và giới thiệu quầy cho người khác.","ar":"الصندوق هو الانطباع الأول والأخير. العملاء الراضون يعودون (Kundenbindung – ولاء العملاء) ويوصون الآخرين بالكشك."},"Freundlich grüßen und ihr noch drei Zusatzartikel anbieten.":{"tr":"Güler yüzle selam verip ona üç ek ürün (Zusatzartikel) daha önermek.","vi":"Chào hỏi thân thiện và đề nghị thêm ba mặt hàng bán thêm (Zusatzartikel).","ar":"تحية ودودة وعرض ثلاثة منتجات إضافية (Zusatzartikel) عليها."},"Nein danke, ich will nur schnell weiter …":{"tr":"Hayır teşekkürler, ben sadece çabuk geçmek istiyorum …","vi":"Không, cảm ơn, tôi chỉ muốn đi nhanh thôi …","ar":"لا شكراً، أريد أن أكمل طريقي بسرعة…"},"Freundlich ist gut. Zusatzangebote stören aber bei langer Schlange und wenn sie aufdringlich sind.":{"tr":"Güler yüz iyi. Ama kuyruk uzunken ve ısrarcı olunduğunda ek teklifler rahatsız eder.","vi":"Thân thiện là tốt. Nhưng đề nghị mua thêm sẽ gây phiền khi hàng người dài và khi quá chèo kéo.","ar":"اللطف جيد. لكن العروض الإضافية تزعج عند طابور طويل وعندما تكون مُلحّة."},"Schnell scannen, Betrag sagen, nächster Kunde.":{"tr":"Hızlıca okutmak, tutarı söylemek, sıradaki müşteri.","vi":"Quét nhanh, nói số tiền, khách tiếp theo.","ar":"مسح سريع، ذكر المبلغ، العميل التالي."},"Na, gemütlich ist anders.":{"tr":"Hiç de rahat değil.","vi":"Thế thì không thoải mái chút nào.","ar":"هذا ليس مريحاً أبداً."},"Ohne Gruß und Blickkontakt fühlt sich die Kundin nicht wohl. Das schadet dem Image.":{"tr":"Selam ve göz teması olmadan müşteri kendini rahat hissetmez. Bu imaja zarar verir.","vi":"Không chào hỏi và không giao tiếp bằng mắt thì khách không cảm thấy dễ chịu. Điều đó làm hại hình ảnh cửa hàng.","ar":"بدون تحية وتواصل بالعينين لا تشعر العميلة بالراحة. وهذا يضرّ بالصورة العامة."},"…weil die Kasse der erste und letzte Eindruck ist und zufriedene Kunden wiederkommen.":{"tr":"…çünkü kasa ilk ve son izlenimdir ve memnun müşteriler geri gelir.","vi":"…vì quầy thu ngân là ấn tượng đầu tiên và cuối cùng, và khách hài lòng sẽ quay lại.","ar":"…لأن الصندوق هو الانطباع الأول والأخير، والعملاء الراضون يعودون."},"…weil freundliche Kassenkräfte mehr Lohn bekommen.":{"tr":"…çünkü güler yüzlü kasiyerler daha fazla maaş alır.","vi":"…vì nhân viên thu ngân thân thiện được trả lương cao hơn.","ar":"…لأن موظفي الصندوق الودودين يحصلون على أجر أعلى."},"…weil man ohne Begrüßung keinen Bon drucken darf.":{"tr":"…çünkü selamlama yapılmadan fiş yazdırılamaz.","vi":"…vì không chào hỏi thì không được in hóa đơn.","ar":"…لأنه بدون تحية لا يحق طباعة الإيصال."},"An vielen Kassen sollen Zusatzartikel angeboten werden. Wann stören solche Angebote?":{"tr":"Birçok kasada ek ürünler (Zusatzartikel) önerilmeli. Bu teklifler ne zaman rahatsız eder?","vi":"Ở nhiều quầy thu ngân, nhân viên phải đề nghị mua thêm hàng (Zusatzartikel). Khi nào những đề nghị đó gây phiền?","ar":"عند كثير من الصناديق يجب عرض منتجات إضافية (Zusatzartikel). متى تزعج هذه العروض؟"},"Bei langer Schlange, wenn sie aufdringlich sind oder nicht zum Einkauf passen.":{"tr":"Kuyruk uzunken, ısrarcı olduklarında veya alışverişe uymadıklarında.","vi":"Khi hàng người dài, khi quá chèo kéo hoặc khi không phù hợp với đơn hàng.","ar":"عند طابور طويل، وعندما تكون مُلحّة أو لا تناسب المشتريات."},"Nie – Zusatzangebote freuen jeden Kunden.":{"tr":"Asla – ek teklifler her müşteriyi sevindirir.","vi":"Không bao giờ – đề nghị mua thêm làm khách nào cũng vui.","ar":"أبداً – العروض الإضافية تُسعد كل عميل."},"Nur bei Kartenzahlung.":{"tr":"Sadece kartla ödemede.","vi":"Chỉ khi thanh toán bằng thẻ.","ar":"فقط عند الدفع بالبطاقة."},"Ein Gast kauft für 89,75 € und zahlt mit 100 €. Wie zählst du richtig vor?":{"tr":"Bir misafir 89,75 € tutarında alışveriş yapıyor ve 100 € ile ödüyor. Para üstünü doğru nasıl sayarsın?","vi":"Một khách mua hàng 89,75 € và trả bằng 100 €. Bạn đếm tiền thối lại đúng cách như thế nào?","ar":"ضيف يشتري بـ 89,75 € ويدفع 100 €. كيف تعدّ الباقي بشكل صحيح أمامه (vorzählen)؟"},"„89,75 … plus 25 Cent sind 90 Euro, plus 10 Euro sind 100 Euro. Bitte, 10,25 € zurück.“":{"tr":"„89,75 … artı 25 sent 90 euro, artı 10 euro 100 euro. Buyurun, 10,25 € para üstü.“","vi":"„89,75 … cộng 25 xu là 90 euro, cộng 10 euro là 100 euro. Xin gửi lại bạn 10,25 €.“","ar":"„89,75 … زائد 25 سنتاً تصبح 90 يورو، زائد 10 يورو تصبح 100 يورو. تفضّل، الباقي 10,25 €.“"},"„100 minus 89,75 macht 11,25 € zurück.“":{"tr":"„100 eksi 89,75 eder 11,25 € para üstü.“","vi":"„100 trừ 89,75 bằng 11,25 € tiền thối lại.“","ar":"„100 ناقص 89,75 يساوي 11,25 € باقي.“"},"„Hier sind 10,25 €.“ – ohne Vorzählen.":{"tr":"„Buyurun 10,25 €.“ – sesli saymadan.","vi":"„Đây là 10,25 €.“ – không đếm to.","ar":"„تفضّل 10,25 €.“ – بدون عدّ أمام العميل."},"Headliner-Nacht":{"tr":"Headliner gecesi","vi":"Đêm của ca sĩ chính","ar":"ليلة النجم الرئيسي"},"Bargeld und Falschgeld":{"tr":"Nakit para ve sahte para","vi":"Tiền mặt và tiền giả","ar":"النقد (Bargeld) والنقود المزيّفة (Falschgeld)"},"22 Uhr. Auf der Hauptbühne spielt der Headliner. Es ist dunkel und laut. Alle wollen schnell bezahlen – und genau jetzt kommen die schwierigen Fälle.":{"tr":"Saat 22. Ana sahnede başrol sanatçısı çalıyor. Hava karanlık ve gürültülü. Herkes çabuk ödemek istiyor – ve zor durumlar tam şimdi geliyor.","vi":"22 giờ. Trên sân khấu chính, ca sĩ chính đang biểu diễn. Trời tối và ồn. Ai cũng muốn thanh toán nhanh – và đúng lúc này những trường hợp khó xuất hiện.","ar":"الساعة 22. على المسرح الرئيسي يعزف النجم الرئيسي. المكان مظلم وصاخب. الجميع يريد الدفع بسرعة – وهنا بالضبط تأتي الحالات الصعبة."},"das Bargeld":{"tr":"nakit para","vi":"tiền mặt","ar":"النقد (Bargeld)"},"die Banknote":{"tr":"banknot","vi":"tờ tiền giấy","ar":"الورقة النقدية (Banknote)"},"das Sicherheitsmerkmal":{"tr":"güvenlik özelliği","vi":"dấu hiệu bảo an","ar":"ميزة الأمان (Sicherheitsmerkmal)"},"das Relief":{"tr":"kabartma","vi":"nét nổi (in nổi)","ar":"الملمس البارز (Relief)"},"das Wasserzeichen":{"tr":"filigran","vi":"hình mờ","ar":"العلامة المائية (Wasserzeichen)"},"der Sicherheitsfaden":{"tr":"güvenlik şeridi","vi":"dây bảo an","ar":"خيط الأمان (Sicherheitsfaden)"},"das Hologramm":{"tr":"hologram","vi":"hình ba chiều (hologram)","ar":"الهولوغرام (Hologramm)"},"die Smaragdzahl":{"tr":"zümrüt rakam (Smaragdzahl)","vi":"số màu ngọc lục bảo","ar":"الرقم الزمردي (Smaragdzahl)"},"der Prüfstift":{"tr":"kontrol kalemi","vi":"bút thử tiền","ar":"قلم الفحص (Prüfstift)"},"das Falschgeld":{"tr":"sahte para","vi":"tiền giả","ar":"نقود مزيّفة (Falschgeld)"},"der Verdacht":{"tr":"şüphe","vi":"sự nghi ngờ","ar":"الاشتباه (Verdacht)"},"zahlt ein Wasser mit 100 €":{"tr":"bir suyu 100 € ile ödüyor","vi":"trả một chai nước bằng 100 €","ar":"يدفع ثمن ماء بـ 100 €"},"Ein junger Mann zahlt ein Wasser mit einem 100-€-Schein. Der Schein fühlt sich glatt an, fast wie Kopierpapier.":{"tr":"Genç bir adam bir suyu 100 €'luk banknotla ödüyor. Banknot düz hissediliyor, neredeyse fotokopi kâğıdı gibi.","vi":"Một chàng trai trẻ trả một chai nước bằng tờ 100 €. Tờ tiền sờ vào thấy trơn, gần giống giấy photocopy.","ar":"شاب يدفع ثمن ماء بورقة 100 €. الورقة ملساء الملمس، تقريباً مثل ورق التصوير."},"Wie prüfst du den Schein?":{"tr":"Banknotu nasıl kontrol edersin?","vi":"Bạn kiểm tra tờ tiền như thế nào?","ar":"كيف تفحص الورقة؟"},"Fühlen – Sehen – Kippen":{"tr":"Dokun – Bak – Eğ","vi":"Sờ – Nhìn – Nghiêng","ar":"اللمس – النظر – الإمالة"},"Fühlen: Papier und Relief. Sehen (gegen das Licht): Wasserzeichen, Sicherheitsfaden, Porträtfenster. Kippen: Hologramm, Smaragdzahl.":{"tr":"Dokun: kâğıt ve kabartma. Bak (ışığa doğru): filigran, güvenlik şeridi, portre penceresi. Eğ: hologram, zümrüt rakam (Smaragdzahl).","vi":"Sờ: giấy và nét nổi. Nhìn (soi dưới ánh sáng): hình mờ, dây bảo an, ô chân dung. Nghiêng: hình ba chiều (hologram), số màu ngọc lục bảo.","ar":"اللمس: الورق والملمس البارز (Relief). النظر (ضد الضوء): العلامة المائية، خيط الأمان، نافذة الصورة. الإمالة: الهولوغرام، الرقم الزمردي."},"Sicherheitsmerkmale: Baumwollpapier, Relief, Sicherheitsfaden, Porträt-Wasserzeichen, Porträt-Hologramm, Porträtfenster, Smaragdzahl. Hilfsmittel: Prüfstift, UV-Lampe, Prüfgerät.":{"tr":"Sicherheitsmerkmale (güvenlik özellikleri): pamuk kâğıt, kabartma, güvenlik şeridi, portreli filigran, portreli hologram, portre penceresi, zümrüt rakam (Smaragdzahl). Yardımcı araçlar: kontrol kalemi, UV lambası, kontrol cihazı.","vi":"Các dấu hiệu bảo an (Sicherheitsmerkmale): giấy bông, nét nổi, dây bảo an, hình mờ chân dung, hình ba chiều chân dung, ô chân dung, số màu ngọc lục bảo. Dụng cụ hỗ trợ: bút thử tiền, đèn UV, máy kiểm tra.","ar":"ميزات الأمان (Sicherheitsmerkmale): ورق قطني، ملمس بارز، خيط أمان، علامة مائية بالصورة، هولوغرام بالصورة، نافذة الصورة، رقم زمردي. الوسائل المساعدة: قلم الفحص (Prüfstift)، مصباح UV، جهاز فحص."},"Fühlen, gegen das Licht halten und kippen: Relief, Wasserzeichen, Sicherheitsfaden, Hologramm, Smaragdzahl.":{"tr":"Dokunmak, ışığa doğru tutmak ve eğmek: kabartma, filigran, güvenlik şeridi, hologram, zümrüt rakam (Smaragdzahl).","vi":"Sờ, soi dưới ánh sáng và nghiêng: nét nổi, hình mờ, dây bảo an, hình ba chiều (hologram), số màu ngọc lục bảo.","ar":"اللمس، ورفعها ضد الضوء، وإمالتها: الملمس البارز، العلامة المائية، خيط الأمان، الهولوغرام، الرقم الزمردي."},"Ähm … ist irgendwas?":{"tr":"Şey … bir sorun mu var?","vi":"Ừm … có gì không ổn à?","ar":"ممم… هل هناك شيء غريب؟"},"Man prüft immer mehrere Merkmale mit Fühlen – Sehen – Kippen. Ein glattes Papier ist schon ein Warnzeichen.":{"tr":"Her zaman Dokun – Bak – Eğ ile birden fazla özellik kontrol edilir. Düz kâğıt zaten bir uyarı işaretidir.","vi":"Luôn kiểm tra nhiều dấu hiệu bằng cách Sờ – Nhìn – Nghiêng. Giấy trơn đã là dấu hiệu cảnh báo.","ar":"يُفحص دائماً أكثر من ميزة بطريقة اللمس – النظر – الإمالة. الورق الأملس علامة تحذير بحد ذاته."},"Nur mit dem Prüfstift drüber. Wenn der nichts zeigt, ist alles gut.":{"tr":"Sadece kontrol kalemini üzerinde gezdirmek. Bir şey göstermezse her şey yolundadır.","vi":"Chỉ quẹt bút thử tiền lên thôi. Nếu bút không báo gì thì ổn cả.","ar":"فقط تمرير قلم الفحص (Prüfstift) عليها. إذا لم يُظهر شيئاً، فكل شيء سليم."},"Na also, passt doch.":{"tr":"Gördün mü, uyuyor.","vi":"Thấy chưa, ổn mà.","ar":"إذن، لا مشكلة."},"Der Prüfstift prüft nur das Papier. Man muss immer mehrere Merkmale prüfen.":{"tr":"Kontrol kalemi sadece kâğıdı kontrol eder. Her zaman birden fazla özellik kontrol edilmelidir.","vi":"Bút thử tiền chỉ kiểm tra giấy. Luôn phải kiểm tra nhiều dấu hiệu.","ar":"قلم الفحص (Prüfstift) يفحص الورق فقط. يجب دائماً فحص أكثر من ميزة."},"Im Dunkeln sieht man eh nichts. Einfach annehmen.":{"tr":"Karanlıkta zaten bir şey görünmez. Öylece kabul etmek.","vi":"Trong bóng tối thì chẳng thấy gì. Cứ nhận thôi.","ar":"في الظلام لا يُرى شيء أصلاً. فقط اقبلها."},"Danke, schönen Abend noch!":{"tr":"Teşekkürler, iyi akşamlar!","vi":"Cảm ơn, chúc buổi tối vui vẻ!","ar":"شكراً، أمسية سعيدة!"},"Gerade bei Hektik und Dunkelheit wird Falschgeld ausgegeben. Falschgeld wird ohne Ersatz eingezogen.":{"tr":"Sahte para özellikle acelede ve karanlıkta verilir. Falschgeld (sahte para) karşılığı ödenmeden el konulur.","vi":"Chính lúc vội vàng và tối người ta mới đưa tiền giả. Tiền giả bị thu giữ mà không được đền bù.","ar":"في الازدحام والظلام تحديداً تُصرف النقود المزيّفة (Falschgeld). تُصادَر النقود المزيّفة بلا تعويض."},"…weil man immer mehrere Merkmale prüfen muss – der Prüfstift prüft nur das Papier.":{"tr":"…çünkü her zaman birden fazla özellik kontrol edilmelidir – kontrol kalemi sadece kâğıdı kontrol eder.","vi":"…vì luôn phải kiểm tra nhiều dấu hiệu – bút thử tiền chỉ kiểm tra giấy.","ar":"…لأنه يجب دائماً فحص أكثر من ميزة – قلم الفحص (Prüfstift) يفحص الورق فقط."},"…weil ein einziges Merkmal immer ausreicht.":{"tr":"…çünkü tek bir özellik her zaman yeterlidir.","vi":"…vì chỉ một dấu hiệu là luôn đủ.","ar":"…لأن ميزة واحدة تكفي دائماً."},"…weil die Bank Falschgeld sofort ersetzt.":{"tr":"…çünkü banka sahte parayı hemen yerine koyar.","vi":"…vì ngân hàng đền bù tiền giả ngay lập tức.","ar":"…لأن البنك يعوّض النقود المزيّفة فوراً."},"Kundin mit 50-€-Schein":{"tr":"50 €'luk banknotla müşteri","vi":"Khách nữ đưa tờ 50 €","ar":"عميلة بورقة 50 €"},"Du prüfst den 50-€-Schein von Frau Jansen. Sie sagt laut: „Das ist ja peinlich! Was sollen die Leute hinter mir denken? Vertrauen Sie mir etwa nicht?“":{"tr":"Bayan Jansen'in 50 €'luk banknotunu kontrol ediyorsun. Yüksek sesle söylüyor: „Bu çok utanç verici! Arkamdaki insanlar ne düşünecek? Bana güvenmiyor musunuz yoksa?“","vi":"Bạn kiểm tra tờ 50 € của bà Jansen. Bà nói to: „Xấu hổ quá! Những người phía sau sẽ nghĩ gì? Có phải bạn không tin tôi không?“","ar":"تفحص ورقة 50 € للسيدة Jansen. تقول بصوت عالٍ: „هذا محرج! ماذا سيظن الناس خلفي؟ هل لا تثق بي؟“"},"Was sagst du?":{"tr":"Ne söylersin?","vi":"Bạn nói gì?","ar":"ماذا تقول؟"},"Echtheitsprüfung erklären":{"tr":"Gerçeklik kontrolünü açıklamak","vi":"Giải thích việc kiểm tra tiền thật","ar":"شرح فحص الأصالة"},"Freundlich sagen, dass alle Scheine geprüft werden. So fühlt sich niemand beschuldigt.":{"tr":"Tüm banknotların kontrol edildiğini güler yüzle söylemek. Böylece kimse suçlanmış hissetmez.","vi":"Nói thân thiện rằng tất cả các tờ tiền đều được kiểm tra. Như vậy không ai cảm thấy bị nghi ngờ.","ar":"قل بلطف إن كل الأوراق تُفحص. هكذا لا يشعر أحد بأنه متَّهم."},"„Aufgrund unserer Kassieranweisung muss ich bei allen Kunden den Schein auf Echtheit überprüfen. Das hat nichts mit Ihrer Person zu tun. Es dauert nur einen Moment.“":{"tr":"„Kassieranweisung (kasa talimatı) gereği tüm müşterilerde banknotun gerçekliğini kontrol etmem gerekiyor. Bunun sizin şahsınızla ilgisi yok. Sadece bir an sürer.“","vi":"„Theo hướng dẫn thu ngân (Kassieranweisung) của chúng tôi, tôi phải kiểm tra tiền thật giả với tất cả khách hàng. Việc này không liên quan đến cá nhân bà. Chỉ mất một chút thôi ạ.“","ar":"„بحسب Kassieranweisung (تعليمات العمل على الصندوق) لدينا يجب أن أتحقق من أصالة الورقة عند كل العملاء. هذا لا علاقة له بشخصكم. يستغرق لحظة فقط.“"},"„Das machen wir laut Kassieranweisung bei allen Kunden so. Das hat nichts mit Ihnen zu tun. Es dauert nur einen Moment.“":{"tr":"„Kasa talimatına göre bunu tüm müşterilerde böyle yapıyoruz. Bunun sizinle ilgisi yok. Sadece bir an sürer.“","vi":"„Theo hướng dẫn thu ngân (Kassieranweisung), chúng tôi làm vậy với tất cả khách hàng. Việc này không liên quan đến bà. Chỉ mất một chút thôi ạ.“","ar":"„نفعل هذا مع كل العملاء بحسب Kassieranweisung (تعليمات العمل على الصندوق). هذا لا علاقة له بكم. يستغرق لحظة فقط.“"},"Ach so, bei allen. Na gut, dann ist ja alles okay.":{"tr":"Ha, herkeste. Peki, o zaman sorun yok.","vi":"À, với tất cả mọi người. Thôi được, vậy thì ổn.","ar":"آه، مع الجميع. حسناً، إذن لا بأس."},"Kunden empfinden die Prüfung manchmal als Misstrauen. Man erklärt freundlich, dass sie alle betrifft.":{"tr":"Müşteriler kontrolü bazen güvensizlik olarak hisseder. Kontrolün herkes için geçerli olduğu güler yüzle açıklanır.","vi":"Đôi khi khách hàng cảm thấy việc kiểm tra là không tin tưởng. Hãy giải thích thân thiện rằng việc này áp dụng cho tất cả.","ar":"أحياناً يشعر العملاء بأن الفحص عدم ثقة. يُشرح بلطف أنه يشمل الجميع."},"Nichts sagen und einfach weiter prüfen.":{"tr":"Hiçbir şey söylememek ve kontrole devam etmek.","vi":"Không nói gì và cứ tiếp tục kiểm tra.","ar":"عدم قول شيء ومتابعة الفحص فقط."},"Hallo? Ich rede mit Ihnen!":{"tr":"Alo? Sizinle konuşuyorum!","vi":"Alo? Tôi đang nói chuyện với bạn đấy!","ar":"مرحباً؟ أنا أكلّمك!"},"Die Prüfung ist richtig, aber die Kundin braucht eine freundliche Erklärung.":{"tr":"Kontrol doğru, ama müşterinin güler yüzlü bir açıklamaya ihtiyacı var.","vi":"Việc kiểm tra là đúng, nhưng khách cần một lời giải thích thân thiện.","ar":"الفحص صحيح، لكن العميلة تحتاج إلى شرح لطيف."},"„Bei Ihnen muss ich besonders aufpassen.“":{"tr":"„Sizde özellikle dikkat etmem gerekiyor.“","vi":"„Với bà thì tôi phải đặc biệt cẩn thận.“","ar":"„معكِ يجب أن أكون حذراً بشكل خاص.“"},"Wie bitte?! Das ist ja eine Frechheit!":{"tr":"Efendim?! Bu bir saygısızlık!","vi":"Cái gì?! Thật là vô lễ!","ar":"ماذا؟! هذه وقاحة!"},"Das beschuldigt die Kundin. Man bleibt höflich und erklärt, dass man alle Scheine prüft.":{"tr":"Bu müşteriyi suçlar. Kibar kalınır ve tüm banknotların kontrol edildiği açıklanır.","vi":"Như vậy là buộc tội khách hàng. Hãy giữ lịch sự và giải thích rằng tất cả các tờ tiền đều được kiểm tra.","ar":"هذا يتَّهم العميلة. يبقى الموظف مهذباً ويشرح أنه يفحص كل الأوراق."},"…weil Kunden die Prüfung als Misstrauen empfinden können – man erklärt, dass sie alle betrifft.":{"tr":"…çünkü müşteriler kontrolü güvensizlik olarak hissedebilir – kontrolün herkes için geçerli olduğu açıklanır.","vi":"…vì khách hàng có thể cảm thấy việc kiểm tra là không tin tưởng – hãy giải thích rằng việc này áp dụng cho tất cả.","ar":"…لأن العملاء قد يشعرون بأن الفحص عدم ثقة – لذلك يُشرح لهم أنه يشمل الجميع."},"…weil Kunden die Prüfung verweigern dürfen.":{"tr":"…çünkü müşteriler kontrolü reddedebilir.","vi":"…vì khách hàng được phép từ chối việc kiểm tra.","ar":"…لأن للعملاء أن يرفضوا الفحص."},"…weil man nur verdächtige Kunden prüfen soll.":{"tr":"…çünkü sadece şüpheli müşteriler kontrol edilmelidir.","vi":"…vì chỉ nên kiểm tra những khách đáng ngờ.","ar":"…لأنه يجب فحص العملاء المشتبه بهم فقط."},"wird nervös":{"tr":"gerginleşiyor","vi":"trở nên bồn chồn","ar":"يتوتر"},"Der Schein ist eindeutig falsch: kein Hologramm, kein Wasserzeichen. Der Mann wird nervös: „Gib her, ich zahl mit was anderem.“":{"tr":"Banknot açıkça sahte: hologram yok, filigran yok. Adam geriliyor: „Ver şunu, başka bir şeyle öderim.“","vi":"Tờ tiền rõ ràng là giả: không có hình ba chiều (hologram), không có hình mờ. Người đàn ông trở nên bồn chồn: „Đưa đây, tôi trả bằng cái khác.“","ar":"الورقة مزيّفة بوضوح: لا هولوغرام ولا علامة مائية. الرجل يتوتر: „أعطني إياها، سأدفع بشيء آخر.“"},"Was tust du?":{"tr":"Ne yaparsın?","vi":"Bạn làm gì?","ar":"ماذا تفعل؟"},"Verdacht auf Falschgeld":{"tr":"Sahte para şüphesi","vi":"Nghi ngờ tiền giả","ar":"الاشتباه بنقود مزيّفة (Falschgeld)"},"Ruhig bleiben · Schein einbehalten · Vorgesetzte rufen · Kunden bitten zu warten · sich den Kunden merken.":{"tr":"Sakin kalmak · banknota el koymak · amiri çağırmak · müşteriden beklemesini istemek · müşteriyi aklında tutmak.","vi":"Giữ bình tĩnh · Giữ lại tờ tiền · Gọi cấp trên · Nhờ khách chờ · Ghi nhớ đặc điểm của khách.","ar":"التزام الهدوء · الاحتفاظ بالورقة · استدعاء المسؤولة · طلب الانتظار من العميل · تذكّر شكل العميل."},"Maßnahmen bei Falschgeld-Verdacht: Vorgesetzten benachrichtigen · Geldschein einbehalten · Kunden bitten zu warten.":{"tr":"Sahte para şüphesinde önlemler: amire haber vermek · banknota el koymak · müşteriden beklemesini istemek.","vi":"Biện pháp khi nghi ngờ tiền giả (Falschgeld): thông báo cho cấp trên · giữ lại tờ tiền · nhờ khách chờ.","ar":"الإجراءات عند الاشتباه بنقود مزيّفة (Falschgeld): إبلاغ المسؤولة · الاحتفاظ بالورقة النقدية · طلب الانتظار من العميل."},"Ruhig bleiben, Schein nicht zurückgeben, Mann bitten zu warten, Jana anrufen.":{"tr":"Sakin kal, banknotu geri verme, adamdan beklemesini iste, Jana'yı ara.","vi":"Giữ bình tĩnh, không trả lại tờ tiền, nhờ người đàn ông chờ, gọi Jana.","ar":"التزام الهدوء، عدم إعادة الورقة، طلب الانتظار من الرجل، الاتصال بـ Jana."},"Ich … ähm … na gut, ich warte.":{"tr":"Ben … şey … tamam, bekliyorum.","vi":"Tôi … ừm … thôi được, tôi chờ.","ar":"أنا… ممم… حسناً، سأنتظر."},"Bei Verdacht: ruhig bleiben, Schein einbehalten, Vorgesetzte rufen, Kunden bitten zu warten. Die Polizei verständigt die Vorgesetzte.":{"tr":"Şüphe durumunda: sakin kal, banknota el koy, amiri çağır, müşteriden beklemesini iste. Amir polise haber verir.","vi":"Khi nghi ngờ: giữ bình tĩnh, giữ lại tờ tiền, gọi cấp trên, nhờ khách chờ. Cấp trên sẽ báo cho cảnh sát.","ar":"عند الاشتباه: التزام الهدوء، الاحتفاظ بالورقة، استدعاء المسؤولة، طلب الانتظار من العميل. المسؤولة هي التي تُبلغ الشرطة."},"Schein zurückgeben und einen anderen verlangen.":{"tr":"Banknotu geri vermek ve başka bir tane istemek.","vi":"Trả lại tờ tiền và yêu cầu khách đưa tờ khác.","ar":"إعادة الورقة وطلب ورقة أخرى."},"Danke, Kumpel! Tschüss!":{"tr":"Sağ ol, dostum! Hoşça kal!","vi":"Cảm ơn bạn! Tạm biệt!","ar":"شكراً يا صديقي! إلى اللقاء!"},"Dann gibt er den falschen Schein woanders aus. Falschgeld darf nicht zurück in Umlauf.":{"tr":"O zaman sahte banknotu başka yerde harcar. Sahte para tekrar dolaşıma girmemelidir.","vi":"Khi đó anh ta sẽ tiêu tờ tiền giả ở nơi khác. Tiền giả không được quay lại lưu thông.","ar":"حينها سيصرف الورقة المزيّفة في مكان آخر. لا يجوز إعادة النقود المزيّفة (Falschgeld) إلى التداول."},"Den Mann am Arm festhalten und laut „Betrüger!“ rufen.":{"tr":"Adamı kolundan tutmak ve yüksek sesle „Dolandırıcı!“ diye bağırmak.","vi":"Nắm tay người đàn ông giữ lại và hét to „Đồ lừa đảo!“","ar":"الإمساك بالرجل من ذراعه والصراخ بصوت عالٍ „نصّاب!“"},"Lass mich los! Ich hab gar nichts gemacht!":{"tr":"Bırak beni! Ben hiçbir şey yapmadım!","vi":"Buông tôi ra! Tôi có làm gì đâu!","ar":"اتركني! لم أفعل شيئاً!"},"Man beschuldigt den Kunden nicht und hält ihn nicht fest. Man bleibt ruhig und holt Hilfe.":{"tr":"Müşteri suçlanmaz ve tutulmaz. Sakin kalınır ve yardım çağrılır.","vi":"Không được buộc tội khách và không được giữ khách lại. Hãy giữ bình tĩnh và gọi người giúp.","ar":"لا يُتَّهم العميل ولا يُمسَك. يبقى الموظف هادئاً ويستدعي المساعدة."},"…weil Falschgeld nicht zurück in Umlauf darf – wer es wissentlich weitergibt, macht sich strafbar.":{"tr":"…çünkü sahte para tekrar dolaşıma girmemelidir – bilerek veren suç işlemiş olur.","vi":"…vì tiền giả không được quay lại lưu thông – ai cố ý đưa tiếp là phạm tội.","ar":"…لأن النقود المزيّفة (Falschgeld) لا يجوز إعادتها إلى التداول – ومن يمرّرها عن علم يعرّض نفسه للعقوبة."},"…weil die Kassenkraft den Kunden festhalten muss.":{"tr":"…çünkü kasiyer müşteriyi tutmak zorun
