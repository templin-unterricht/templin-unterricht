dadır.","vi":"…vì nhân viên thu ngân phải giữ khách lại.","ar":"…لأن على موظف الصندوق أن يمسك العميل."},"…weil die Bank den falschen Schein sofort ersetzt.":{"tr":"…çünkü banka sahte banknotu hemen yerine koyar.","vi":"…vì ngân hàng đền bù tờ tiền giả ngay lập tức.","ar":"…لأن البنك يعوّض الورقة المزيّفة فوراً."},"Gast mit einer Tüte voller Münzen":{"tr":"Bozuk para dolu bir torbayla misafir","vi":"Khách mang một túi đầy tiền xu","ar":"ضيف مع كيس مليء بالعملات المعدنية"},"Herr Kowalski kauft Snacks für 24,80 € und will mit einer Tüte Münzen zahlen – etwa 90 Stück. Hinter ihm wird es voll.":{"tr":"Bay Kowalski 24,80 € tutarında atıştırmalık alıyor ve yaklaşık 90 adet bozuk para dolu bir torbayla ödemek istiyor. Arkasında kalabalık oluyor.","vi":"Ông Kowalski mua đồ ăn vặt 24,80 € và muốn trả bằng một túi tiền xu – khoảng 90 đồng. Phía sau ông bắt đầu đông người.","ar":"السيد Kowalski يشتري وجبات خفيفة بـ 24,80 € ويريد الدفع بكيس عملات معدنية – نحو 90 قطعة. خلفه يزدحم الطابور."},"Münzannahme":{"tr":"Madeni para kabulü","vi":"Nhận tiền xu","ar":"قبول العملات المعدنية"},"Bei einer Zahlung muss niemand mehr als 50 Münzen annehmen.":{"tr":"Bir ödemede kimse 50'den fazla madeni parayı kabul etmek zorunda değildir.","vi":"Trong một lần thanh toán, không ai bắt buộc phải nhận nhiều hơn 50 đồng tiền xu.","ar":"في دفعة واحدة لا يجب على أحد قبول أكثر من 50 عملة معدنية."},"„Es tut mir leid, bei einer Zahlung darf ich höchstens 50 Münzen annehmen. Haben Sie vielleicht einen Schein oder eine Karte dabei?“":{"tr":"„Üzgünüm, bir ödemede en fazla 50 madeni para kabul edebilirim. Belki yanınızda bir banknot veya kart var mı?“","vi":"„Tôi rất tiếc, trong một lần thanh toán tôi chỉ được nhận tối đa 50 đồng xu. Bạn có tờ tiền giấy hoặc thẻ không ạ?“","ar":"„أنا آسف، في دفعة واحدة يحق لي قبول 50 عملة معدنية كحد أقصى. هل معكم ورقة نقدية أو بطاقة؟“"},"„Es tut mir leid, bei einer Zahlung muss ich höchstens 50 Münzen annehmen. Haben Sie einen Schein oder eine Karte?“":{"tr":"„Üzgünüm, bir ödemede en fazla 50 madeni para kabul etmek zorundayım. Banknotunuz veya kartınız var mı?“","vi":"„Tôi rất tiếc, trong một lần thanh toán tôi chỉ phải nhận tối đa 50 đồng xu. Bạn có tiền giấy hoặc thẻ không ạ?“","ar":"„أنا آسف، في دفعة واحدة يجب عليّ قبول 50 عملة معدنية كحد أقصى. هل معكم ورقة نقدية أو بطاقة؟“"},"Ach so, das wusste ich nicht. Dann nehm ich die Karte.":{"tr":"Ha, bunu bilmiyordum. O zaman kartı vereyim.","vi":"À, ra vậy, tôi không biết. Vậy tôi dùng thẻ.","ar":"آه، لم أكن أعرف ذلك. إذن سأستخدم البطاقة."},"Niemand muss bei einer Zahlung mehr als 50 Münzen annehmen. Freiwillig darf man mehr annehmen.":{"tr":"Bir ödemede kimse 50'den fazla madeni parayı kabul etmek zorunda değildir. Gönüllü olarak daha fazlası kabul edilebilir.","vi":"Trong một lần thanh toán, không ai bắt buộc phải nhận nhiều hơn 50 đồng xu. Nếu tự nguyện thì được phép nhận nhiều hơn.","ar":"لا أحد ملزم بقبول أكثر من 50 عملة معدنية في دفعة واحدة. ويحق قبول أكثر بشكل طوعي."},"Alles annehmen und zählen. Die Schlange muss eben warten.":{"tr":"Hepsini kabul edip saymak. Kuyruk biraz beklesin.","vi":"Nhận hết và đếm. Hàng người cứ chờ thôi.","ar":"قبول كل شيء وعدّه. على الطابور أن ينتظر."},"Danke, junger Mensch!":{"tr":"Sağ ol, genç!","vi":"Cảm ơn, bạn trẻ!","ar":"شكراً أيها الشاب!"},"Das darf man freiwillig. Bei langer Schlange ist es aber ungünstig – man muss es nicht.":{"tr":"Bunu gönüllü olarak yapabilirsin. Ama kuyruk uzunsa uygun değildir – yapmak zorunda değilsin.","vi":"Được phép làm vậy nếu tự nguyện. Nhưng khi hàng người dài thì không thuận lợi – và không bắt buộc phải làm.","ar":"يحق فعل ذلك طوعاً. لكن عند طابور طويل ليس مناسباً – وليس واجباً."},"„Münzen nehmen wir grundsätzlich nicht.“":{"tr":"„Biz kural olarak madeni para kabul etmiyoruz.“","vi":"„Chúng tôi về nguyên tắc không nhận tiền xu.“","ar":"„العملات المعدنية لا نقبلها من حيث المبدأ.“"},"Was? Das ist doch Geld!":{"tr":"Ne? Bu da para!","vi":"Gì cơ? Đó cũng là tiền mà!","ar":"ماذا؟ هذه نقود!"},"Münzen sind Bargeld. Ablehnen darf man nur, was über 50 Münzen hinausgeht.":{"tr":"Madeni paralar nakit paradır. Sadece 50'yi aşan kısım reddedilebilir.","vi":"Tiền xu là tiền mặt. Chỉ được từ chối phần vượt quá 50 đồng xu.","ar":"العملات المعدنية نقد (Bargeld). الرفض جائز فقط لما يزيد عن 50 عملة."},"…weil niemand bei einer Zahlung mehr als 50 Münzen annehmen muss.":{"tr":"…çünkü bir ödemede kimse 50'den fazla madeni parayı kabul etmek zorunda değildir.","vi":"…vì trong một lần thanh toán không ai bắt buộc phải nhận nhiều hơn 50 đồng xu.","ar":"…لأن لا أحد ملزم بقبول أكثر من 50 عملة معدنية في دفعة واحدة."},"…weil man Münzen nur bei einer Kartenstörung annehmen darf.":{"tr":"…çünkü madeni paralar sadece kart arızasında kabul edilebilir.","vi":"…vì chỉ được nhận tiền xu khi máy thẻ bị hỏng.","ar":"…لأنه يُسمح بقبول العملات المعدنية فقط عند عطل في البطاقات."},"…weil man höchstens 20 Münzen annehmen darf.":{"tr":"…çünkü en fazla 20 madeni para kabul edilebilir.","vi":"…vì chỉ được nhận tối đa 20 đồng xu.","ar":"…لأنه يُسمح بقبول 20 عملة معدنية كحد أقصى."},"Bargeld kostet den Händler auch Geld. Welche Kosten sind gemeint?":{"tr":"Nakit para satıcıya da para kaybettirir. Hangi maliyetlerden söz ediliyor?","vi":"Tiền mặt cũng tốn tiền của người bán. Đó là những chi phí nào?","ar":"النقد (Bargeld) يكلّف التاجر مالاً أيضاً. أي تكاليف المقصودة؟"},"Zählen und Abrechnen kostet Arbeitszeit, Transport zur Bank und Versicherung kosten Geld.":{"tr":"Saymak ve hesap yapmak çalışma süresi alır, bankaya taşıma ve sigorta para tutar.","vi":"Đếm và quyết toán tốn thời gian làm việc, vận chuyển đến ngân hàng và bảo hiểm tốn tiền.","ar":"العدّ والتسوية يكلّفان وقت عمل، ونقل المال إلى البنك والتأمين يكلّفان مالاً."},"Für jede Barzahlung zahlt der Händler eine Gebühr an das Kreditkartenunternehmen.":{"tr":"Her nakit ödeme için satıcı kredi kartı şirketine bir ücret öder.","vi":"Với mỗi lần thanh toán bằng tiền mặt, người bán phải trả một khoản phí cho công ty thẻ tín dụng.","ar":"عن كل دفعة نقدية يدفع التاجر رسوماً لشركة بطاقات الائتمان."},"Bargeld kostet nichts – nur Karten verursachen Kosten.":{"tr":"Nakit hiçbir şeye mal olmaz – sadece kartlar masraf yaratır.","vi":"Tiền mặt không tốn gì – chỉ thẻ mới gây chi phí.","ar":"النقد لا يكلّف شيئاً – فقط البطاقات تسبب تكاليف."},"Warum nennst du den Wert eines Scheins laut, sobald du ihn bekommst?":{"tr":"Bir banknotu alır almaz değerini neden yüksek sesle söylersin?","vi":"Tại sao bạn nói to mệnh giá của tờ tiền ngay khi nhận?","ar":"لماذا تذكر قيمة الورقة بصوت عالٍ فور استلامها؟"},"Kunde und Kassenkraft wissen beide, welcher Schein gegeben wurde – so gibt es keinen Streit ums Rückgeld.":{"tr":"Müşteri ve kasiyer ikisi de hangi banknotun verildiğini bilir – böylece para üstü konusunda tartışma çıkmaz.","vi":"Khách và nhân viên thu ngân đều biết đã đưa tờ nào – nên sẽ không có tranh cãi về tiền thối lại.","ar":"العميل وموظف الصندوق كلاهما يعرف أي ورقة أُعطيت – هكذا لا يحدث خلاف حول الباقي (Rückgeld)."},"Weil der Schein sonst nicht in die Kasse passt.":{"tr":"Çünkü banknot aksi halde kasaya sığmaz.","vi":"Vì nếu không tờ tiền sẽ không vừa vào quỹ.","ar":"لأن الورقة لا تدخل الصندوق بدون ذلك."},"Weil das die TSE verlangt.":{"tr":"Çünkü TSE (kasa güvenlik modülü) bunu şart koşar.","vi":"Vì TSE yêu cầu như vậy.","ar":"لأن TSE (وحدة الأمان التقنية) تطلب ذلك."},"40.000 Gäste und alle wollen zahlen":{"tr":"40.000 misafir ve hepsi ödemek istiyor","vi":"40.000 khách và ai cũng muốn thanh toán","ar":"40.000 ضيف والجميع يريد الدفع"},"Karte, Handy, Gutschein":{"tr":"Kart, telefon, hediye çeki","vi":"Thẻ, điện thoại, phiếu quà tặng","ar":"بطاقة، هاتف، قسيمة"},"Samstag, 12 Uhr. Die Sonne knallt, das Gelände ist voll. Fast alle wollen mit Karte oder Handy zahlen. Jana schickt eine Sprachnachricht: „Heute zählt jede Minute an der Schlange!“":{"tr":"Cumartesi, saat 12. Güneş kavuruyor, alan dolu. Neredeyse herkes kartla veya telefonla ödemek istiyor. Jana sesli mesaj gönderir: „Bugün kuyrukta her dakika önemli!“","vi":"Thứ Bảy, 12 giờ. Nắng gắt, khu vực đông nghịt. Gần như ai cũng muốn thanh toán bằng thẻ hoặc điện thoại. Jana gửi một tin nhắn thoại: „Hôm nay mỗi phút ở hàng người đều quan trọng!“","ar":"السبت، الساعة 12. الشمس حارقة والموقع مزدحم. تقريباً الجميع يريد الدفع بالبطاقة أو الهاتف. ترسل Jana رسالة صوتية: „اليوم كل دقيقة عند الطابور لها قيمة!“"},"die girocard":{"tr":"girocard (Alman banka kartı)","vi":"thẻ girocard","ar":"girocard (بطاقة جيروكارد)"},"die Debitkarte":{"tr":"banka kartı (Debitkarte)","vi":"thẻ ghi nợ","ar":"بطاقة الخصم المباشر (Debitkarte)"},"die Kreditkarte":{"tr":"kredi kartı","vi":"thẻ tín dụng","ar":"بطاقة الائتمان (Kreditkarte)"},"die PIN":{"tr":"PIN (kart şifresi)","vi":"mã PIN","ar":"الرقم السري (PIN)"},"kontaktlos":{"tr":"temassız","vi":"không tiếp xúc","ar":"بدون تلامس (kontaktlos)"},"die NFC-Funktion":{"tr":"NFC özelliği (yakın alan iletişimi)","vi":"chức năng NFC","ar":"خاصية NFC (الاتصال قريب المدى)"},"das Mobile Payment":{"tr":"Mobile Payment (telefonla ödeme)","vi":"thanh toán di động","ar":"الدفع عبر الهاتف (Mobile Payment)"},"die Gebühr":{"tr":"ücret","vi":"phí","ar":"الرسوم (Gebühr)"},"der Gutschein":{"tr":"hediye çeki","vi":"phiếu quà tặng","ar":"قسيمة هدية (Gutschein)"},"der Coupon":{"tr":"kupon","vi":"phiếu giảm giá","ar":"قسيمة خصم (Coupon)"},"die Kundenkarte":{"tr":"müşteri kartı","vi":"thẻ khách hàng","ar":"بطاقة العميل (Kundenkarte)"},"der Datenschutz":{"tr":"veri koruma","vi":"bảo vệ dữ liệu cá nhân","ar":"حماية البيانات (Datenschutz)"},"Ole Brodersen fragt: „Was hängt bei euch an der Kasse? Die Leute wollen sofort sehen, wie sie zahlen können.“ Euer Terminal kann kontaktlos (NFC) und nimmt zwei Kreditkarten an.":{"tr":"Ole Brodersen soruyor: „Kasanızda ne asılı? İnsanlar nasıl ödeyebileceklerini hemen görmek istiyor.“ Terminaliniz temassız (NFC) çalışıyor ve iki kredi kartını kabul ediyor.","vi":"Ole Brodersen hỏi: „Ở quầy thu ngân các bạn treo gì? Mọi người muốn thấy ngay mình có thể thanh toán bằng cách nào.“ Thiết bị thanh toán của các bạn có thể thanh toán không tiếp xúc (NFC) và nhận hai loại thẻ tín dụng.","ar":"يسأل Ole Brodersen: „ماذا يُعلَّق عندكم على الصندوق؟ الناس يريدون أن يروا فوراً كيف يمكنهم الدفع.“ جهازكم يدعم الدفع بدون تلامس (NFC) ويقبل بطاقتي ائتمان."},"Was hängt ihr an die Kasse?":{"tr":"Kasaya ne asarsınız?","vi":"Các bạn treo gì ở quầy thu ngân?","ar":"ماذا تعلّقون على الصندوق؟"},"Kreditkarten-Symbole":{"tr":"Kredi kartı simgeleri","vi":"Biểu tượng thẻ tín dụng","ar":"رموز بطاقات الائتمان"},"Die Symbole an der Kasse zeigen dem Kunden: Diese Kreditkarten werden hier angenommen.":{"tr":"Kasadaki simgeler müşteriye şunu gösterir: Bu kredi kartları burada kabul edilir.","vi":"Các biểu tượng ở quầy thu ngân cho khách biết: Ở đây nhận những thẻ tín dụng này.","ar":"الرموز عند الصندوق تُظهر للعميل: هذه بطاقات الائتمان مقبولة هنا."},"Bedeutung der Symbole: Das Geschäft akzeptiert die Zahlung mit diesen Kreditkarten. Vorteile: Spontankäufe, Umsatzsteigerung, Kundenservice, Zahlungssicherheit, kein Falschgeld. Nachteile: Technik, Gebühren, späterer Zahlungseingang.":{"tr":"Simgelerin anlamı: İşletme bu kredi kartlarıyla ödemeyi kabul eder. Avantajlar: ani alışverişler, ciro artışı, müşteri hizmeti, ödeme güvenliği, sahte para yok. Dezavantajlar: teknik, ücretler, paranın daha geç hesaba geçmesi.","vi":"Ý nghĩa của các biểu tượng: Cửa hàng chấp nhận thanh toán bằng những thẻ tín dụng này. Ưu điểm: mua hàng bốc đồng, tăng doanh thu, dịch vụ khách hàng, thanh toán an toàn, không có tiền giả. Nhược điểm: kỹ thuật, phí, tiền về chậm hơn.","ar":"معنى الرموز: المحل يقبل الدفع بهذه البطاقات. المزايا: مشتريات عفوية، زيادة المبيعات، خدمة العملاء، أمان الدفع، لا نقود مزيّفة. العيوب: التقنية، الرسوم، تأخر وصول المبلغ."},"Das Kontaktlos-Zeichen und die Symbole der beiden Kreditkarten, gut sichtbar.":{"tr":"Temassız işareti ve iki kredi kartının simgeleri, iyi görünür şekilde.","vi":"Biểu tượng không tiếp xúc và biểu tượng của hai loại thẻ tín dụng, dễ nhìn thấy.","ar":"علامة الدفع بدون تلامس ورمزا بطاقتي الائتمان، بشكل واضح للعين."},"Sehr gut. So weiß jeder sofort Bescheid.":{"tr":"Çok iyi. Böylece herkes hemen bilgi sahibi olur.","vi":"Rất tốt. Như vậy ai cũng biết ngay.","ar":"ممتاز. هكذا يعرف الجميع فوراً."},"Die Symbole zeigen: Diese Karten werden angenommen. Kartenzahlung bringt Spontankäufe, schnelle Abwicklung und kein Falschgeld.":{"tr":"Simgeler şunu gösterir: Bu kartlar kabul edilir. Kartla ödeme ani alışverişleri, hızlı işlemi ve sahte paranın olmamasını sağlar.","vi":"Các biểu tượng cho biết: Những thẻ này được chấp nhận. Thanh toán bằng thẻ mang lại việc mua hàng bốc đồng, xử lý nhanh và không có tiền giả.","ar":"الرموز تُظهر: هذه البطاقات مقبولة. الدفع بالبطاقة يجلب مشتريات عفوية، وإنجازاً سريعاً، ولا نقود مزيّفة."},"Ein Schild „Nur Bargeld“ – so spart ihr die Gebühren.":{"tr":"„Sadece nakit“ yazılı bir tabela – böylece ücretlerden tasarruf edersiniz.","vi":"Một tấm biển „Chỉ nhận tiền mặt“ – như vậy tiết kiệm được phí.","ar":"لافتة „نقداً فقط“ – هكذا توفّرون الرسوم."},"Nur Bargeld? Dann gehen die Leute zum Nachbarn.":{"tr":"Sadece nakit mi? O zaman insanlar komşuya gider.","vi":"Chỉ tiền mặt? Vậy mọi người sẽ sang quầy hàng xóm.","ar":"نقداً فقط؟ حينها سيذهب الناس إلى الجار."},"Gebühren sparen ist ein Grund. Aber ohne Karte gibt es weniger Spontankäufe und längere Schlangen.":{"tr":"Ücret tasarrufu bir nedendir. Ama kart olmazsa daha az ani alışveriş ve daha uzun kuyruklar olur.","vi":"Tiết kiệm phí là một lý do. Nhưng không có thẻ thì ít người mua bốc đồng hơn và hàng người dài hơn.","ar":"توفير الرسوم سبب وجيه. لكن بدون بطاقة تقلّ المشتريات العفوية ويطول الطابور."},"Gar nichts. Wer fragt, bekommt eine Antwort.":{"tr":"Hiçbir şey. Soran cevap alır.","vi":"Không treo gì cả. Ai hỏi sẽ được trả lời.","ar":"لا شيء. من يسأل يحصل على جواب."},"Bei der Schlange fragt doch keiner. Die gehen einfach.":{"tr":"Kuyrukta kimse sormaz. Gidip başka yere giderler.","vi":"Khi hàng người dài thì chẳng ai hỏi đâu. Họ bỏ đi luôn.","ar":"في الطابور لا أحد يسأل. يذهبون ببساطة."},"Kunden wollen vorher sehen, wie sie zahlen können. Die Symbole an der Kasse zeigen das.":{"tr":"Müşteriler nasıl ödeyebileceklerini önceden görmek ister. Kasadaki simgeler bunu gösterir.","vi":"Khách muốn thấy trước mình có thể thanh toán bằng cách nào. Các biểu tượng ở quầy thu ngân cho thấy điều đó.","ar":"العملاء يريدون أن يروا مسبقاً كيف يمكنهم الدفع. الرموز عند الصندوق تُظهر ذلك."},"…weil Kartenzahlung schnell geht, Spontankäufe bringt und es kein Falschgeld gibt – dafür zahlt der Betrieb Gebühren.":{"tr":"…çünkü kartla ödeme hızlıdır, ani alışverişler getirir ve sahte para yoktur – karşılığında işletme ücret öder.","vi":"…vì thanh toán bằng thẻ nhanh, mang lại việc mua hàng bốc đồng và không có tiền giả – đổi lại cửa hàng phải trả phí.","ar":"…لأن الدفع بالبطاقة سريع ويجلب مشتريات عفوية ولا توجد نقود مزيّفة – لكن المحل يدفع رسوماً."},"…weil Kartenzahlung für den Betrieb keine Kosten hat.":{"tr":"…çünkü kartla ödemenin işletmeye maliyeti yoktur.","vi":"…vì thanh toán bằng thẻ không tốn chi phí cho cửa hàng.","ar":"…لأن الدفع بالبطاقة لا يكلّف المحل شيئاً."},"…weil das Geld bei Kartenzahlung sofort in der Kasse liegt.":{"tr":"…çünkü kartla ödemede para hemen kasada olur.","vi":"…vì khi thanh toán bằng thẻ, tiền nằm ngay trong quỹ.","ar":"…لأن المال عند الدفع بالبطاقة يكون فوراً في الصندوق."},"Gast mit Smartphone":{"tr":"Akıllı telefonlu misafir","vi":"Khách với điện thoại thông minh","ar":"ضيف مع هاتف ذكي"},"Mara hält ihr Smartphone hoch: „Kann ich mit dem Handy zahlen?“ Euer Terminal kann NFC.":{"tr":"Mara akıllı telefonunu kaldırır: „Telefonla ödeyebilir miyim?“ Terminaliniz NFC destekliyor.","vi":"Mara giơ điện thoại lên: „Tôi thanh toán bằng điện thoại được không?“ Thiết bị thanh toán của các bạn có NFC.","ar":"تَرفع Mara هاتفها الذكي: „هل أستطيع الدفع بالهاتف؟“ جهازكم يدعم NFC."},"Mobile Payment":{"tr":"Mobile Payment (telefonla ödeme)","vi":"Thanh toán di động (Mobile Payment)","ar":"الدفع عبر الهاتف (Mobile Payment)"},"Zahlen mit Smartphone oder Smartwatch. Die Daten gehen per Funk (NFC) an das Lesegerät. Der Kunde bestätigt auf seinem Gerät.":{"tr":"Akıllı telefon veya akıllı saatle ödeme. Veriler radyo ile (NFC) okuyucuya gider. Müşteri kendi cihazında onaylar.","vi":"Thanh toán bằng điện thoại thông minh hoặc đồng hồ thông minh. Dữ liệu được gửi qua sóng không dây (NFC) đến máy đọc. Khách xác nhận trên thiết bị của mình.","ar":"الدفع بالهاتف الذكي أو الساعة الذكية. تنتقل البيانات لاسلكياً (NFC) إلى جهاز القراءة. يؤكد العميل على جهازه."},"Ablauf in 3 Schritten: In der Kasse Kartenzahlung wählen und Betrag nennen. Der Kunde hält das Smartphone an das Lesegerät und bestätigt. Beleg übergeben.":{"tr":"3 adımda akış: Kasada kartla ödemeyi seçmek ve tutarı söylemek. Müşteri akıllı telefonunu okuyucuya tutar ve onaylar. Fişi vermek.","vi":"Quy trình 3 bước: Trên máy tính tiền chọn thanh toán bằng thẻ và nói số tiền. Khách áp điện thoại vào máy đọc và xác nhận. Đưa hóa đơn.","ar":"الخطوات (3): اختيار الدفع بالبطاقة في الصندوق وذكر المبلغ. العميل يقرّب الهاتف من جهاز القراءة ويؤكد. تسليم الإيصال."},"„Klar! Ich gebe den Betrag ein, Sie halten das Handy an das Lesegerät und bestätigen auf dem Handy. Den Beleg bekommen Sie gleich.“":{"tr":"„Tabii! Tutarı giriyorum, siz telefonu okuyucuya tutun ve telefonda onaylayın. Fişinizi hemen alırsınız.“","vi":"„Được chứ! Tôi nhập số tiền, bạn áp điện thoại vào máy đọc và xác nhận trên điện thoại. Hóa đơn bạn sẽ nhận ngay.“","ar":"„طبعاً! أدخل المبلغ، وأنتم تقرّبون الهاتف من جهاز القراءة وتؤكدون على الهاتف. الإيصال تحصلون عليه حالاً.“"},"Piep – fertig! Das ging schnell.":{"tr":"Bip – bitti! Çabuk oldu.","vi":"Bíp – xong rồi! Nhanh thật.","ar":"بيب – انتهى! كان ذلك سريعاً."},"So läuft Mobile Payment in drei Schritten: Betrag nennen – Handy an das Lesegerät, auf dem Handy bestätigen – Beleg übergeben.":{"tr":"Mobile Payment (telefonla ödeme) üç adımda böyle işler: Tutarı söylemek – telefonu okuyucuya tutmak, telefonda onaylamak – fişi vermek.","vi":"Thanh toán di động (Mobile Payment) diễn ra trong ba bước: Nói số tiền – áp điện thoại vào máy đọc, xác nhận trên điện thoại – đưa hóa đơn.","ar":"هكذا يجري Mobile Payment (الدفع عبر الهاتف) في ثلاث خطوات: ذكر المبلغ – تقريب الهاتف من جهاز القراءة والتأكيد على الهاتف – تسليم الإيصال."},"„Geht, aber Sie müssen danach noch Ihre PIN hier eintippen.“":{"tr":"„Olur, ama sonra PIN'inizi buraya girmeniz gerekiyor.“","vi":"„Được, nhưng sau đó bạn còn phải gõ mã PIN ở đây.“","ar":"„ممكن، لكن عليكم بعد ذلك إدخال PIN (الرقم السري) هنا.“"},"PIN? Die weiß ich gar nicht …":{"tr":"PIN mi? Ben onu bilmiyorum bile …","vi":"PIN á? Tôi chẳng biết nữa …","ar":"PIN؟ لا أعرفه أصلاً…"},"Beim Handy bestätigt der Kunde meist auf seinem Gerät (Fingerabdruck, Gesicht, Code).":{"tr":"Telefonda müşteri genellikle kendi cihazında onaylar (parmak izi, yüz, kod).","vi":"Với điện thoại, khách thường xác nhận trên thiết bị của mình (vân tay, khuôn mặt, mã).","ar":"مع الهاتف يؤكد العميل غالباً على جهازه (بصمة الإصبع، الوجه، رمز)."},"„Nein, mit dem Handy geht das hier nicht.“":{"tr":"„Hayır, burada telefonla olmuyor.“","vi":"„Không, ở đây không thanh toán bằng điện thoại được.“","ar":"„لا، بالهاتف لا يمكن هنا.“"},"Schade. Dann kauf ich drüben.":{"tr":"Yazık. O zaman karşıdan alırım.","vi":"Tiếc quá. Vậy tôi mua bên kia.","ar":"للأسف. إذن سأشتري من الكشك المقابل."},"Euer Terminal kann NFC. Damit ist Zahlen mit Smartphone möglich.":{"tr":"Terminaliniz NFC destekliyor. Böylece akıllı telefonla ödeme mümkündür.","vi":"Thiết bị thanh toán của các bạn có NFC. Vì vậy có thể thanh toán bằng điện thoại thông minh.","ar":"جهازكم يدعم NFC. لذلك الدفع بالهاتف الذكي ممكن."},"…weil die Daten per Funk (NFC) übertragen werden und der Kunde auf seinem Handy bestätigt.":{"tr":"…çünkü veriler radyo ile (NFC) aktarılır ve müşteri telefonunda onaylar.","vi":"…vì dữ liệu được truyền qua sóng không dây (NFC) và khách xác nhận trên điện thoại của mình.","ar":"…لأن البيانات تُنقل لاسلكياً (NFC) والعميل يؤكد على هاتفه."},"…weil beim Mobile Payment immer eine Unterschrift nötig ist.":{"tr":"…çünkü Mobile Payment (telefonla ödeme) ile her zaman imza gerekir.","vi":"…vì thanh toán di động (Mobile Payment) luôn cần chữ ký.","ar":"…لأن Mobile Payment (الدفع عبر الهاتف) يتطلب دائماً توقيعاً."},"…weil das Geld vom Konto des Händlers abgebucht wird.":{"tr":"…çünkü para satıcının hesabından çekilir.","vi":"…vì tiền bị trừ từ tài khoản của người bán.","ar":"…لأن المال يُخصم من حساب التاجر."},"zahlt 64 € kontaktlos":{"tr":"64 € temassız ödüyor","vi":"thanh toán 64 € không tiếp xúc","ar":"تدفع 64 € بدون تلامس"},"Frau Okafor zahlt 64 € kontaktlos mit Karte. Das Terminal verlangt plötzlich die PIN. Sie ist sauer: „Sonst geht das doch immer ohne!“":{"tr":"Bayan Okafor 64 € tutarı kartla temassız ödüyor. Terminal birden PIN istiyor. Kızgın: „Normalde bu hep PIN'siz oluyor!“","vi":"Bà Okafor thanh toán 64 € không tiếp xúc bằng thẻ. Thiết bị thanh toán bỗng yêu cầu mã PIN. Bà bực: „Bình thường lúc nào cũng không cần mà!“","ar":"السيدة Okafor تدفع 64 € بدون تلامس بالبطاقة. فجأة يطلب الجهاز PIN (الرقم السري). تغضب: „عادةً يعمل هذا دائماً بدون رقم!“"},"PIN beim kontaktlosen Zahlen":{"tr":"Temassız ödemede PIN","vi":"PIN khi thanh toán không tiếp xúc","ar":"PIN (الرقم السري) عند الدفع بدون تلامس"},"Ohne PIN meist bis 50 €. Darüber, nach mehreren Zahlungen hintereinander oder per Zufall wird eine PIN verlangt.":{"tr":"PIN'siz genellikle 50 € a kadar. Bunun üzerinde, art arda birkaç ödemeden sonra veya rastgele PIN istenir.","vi":"Thường không cần PIN nếu dưới 50 €. Nếu số tiền cao hơn, thanh toán nhiều lần liên tiếp hoặc ngẫu nhiên thì sẽ bị yêu cầu nhập PIN.","ar":"بدون رمز PIN عادةً حتى 50 €. وإذا زاد المبلغ، أو بعد عدة عمليات دفع متتالية، أو بشكل عشوائي، يُطلب رمز PIN."},"Fall mit zusätzlicher PIN: Betrag über der festgelegten Höhe, mehrere Zahlungen mit derselben Karte, Zufallsabfrage.":{"tr":"Ek PIN gereken durum: belirlenen tutarın üzerindeki tutar, aynı kartla birkaç ödeme, rastgele sorgu.","vi":"Trường hợp cần thêm PIN: số tiền vượt mức quy định, nhiều lần thanh toán bằng cùng một thẻ, hoặc bị hỏi ngẫu nhiên.","ar":"حالة يُطلب فيها رمز PIN إضافي: المبلغ أعلى من الحد المحدد، أو عدة عمليات دفع بالبطاقة نفسها، أو طلب عشوائي."},"„Das ist normal: Über einem bestimmten Betrag fragt das Terminal zur Sicherheit nach der PIN.“":{"tr":"„Bu normal: Belirli bir tutarın üzerinde terminal güvenlik için PIN sorar.“","vi":"„Điều này bình thường: Khi vượt quá một số tiền nhất định, máy thanh toán sẽ hỏi PIN để đảm bảo an toàn.“","ar":"„هذا طبيعي: عندما يزيد المبلغ عن حد معيّن، يطلب الجهاز رمز PIN للأمان.“"},"Ach so. Na gut, dann tippe ich sie ein.":{"tr":"Anladım. Peki, o zaman giriyorum.","vi":"À ra vậy. Được rồi, vậy tôi sẽ nhập.","ar":"آه، فهمت. حسناً، سأدخله."},"Ohne PIN geht es meist bis 50 €. Eine PIN kann verlangt werden bei höheren Beträgen, nach mehreren Zahlungen oder per Zufall.":{"tr":"PIN'siz genellikle 50 € a kadar ödenir. Daha yüksek tutarlarda, birkaç ödemeden sonra veya rastgele PIN istenebilir.","vi":"Thường không cần PIN nếu dưới 50 €. Có thể bị yêu cầu nhập PIN khi số tiền cao hơn, sau nhiều lần thanh toán hoặc ngẫu nhiên.","ar":"بدون رمز PIN يمكن الدفع عادةً حتى 50 €. قد يُطلب رمز PIN عند المبالغ الأعلى، أو بعد عدة عمليات دفع، أو بشكل عشوائي."},"„Dann zahlen Sie bitte bar.“":{"tr":"„O zaman lütfen nakit ödeyin.“","vi":"„Vậy bạn vui lòng trả bằng tiền mặt.“","ar":"„إذن ادفعي نقداً من فضلك.“"},"Bar? Ich hab doch gar kein Bargeld dabei.":{"tr":"Nakit mi? Yanımda hiç nakit yok ki.","vi":"Tiền mặt ư? Tôi có mang tiền mặt đâu.","ar":"نقداً؟ ليس معي نقود أصلاً."},"Das hilft der Kundin nicht. Besser erklären, warum die PIN kommt.":{"tr":"Bu müşteriye yardımcı olmaz. PIN'in neden istendiğini açıklamak daha iyi.","vi":"Cách này không giúp được khách. Nên giải thích vì sao máy hỏi PIN.","ar":"هذا لا يساعد الزبونة. الأفضل أن تشرح لماذا يُطلب رمز PIN."},"„Da ist wohl Ihre Karte kaputt.“":{"tr":"„Kartınız herhalde bozuk.“","vi":"„Chắc thẻ của bạn bị hỏng rồi.“","ar":"„يبدو أن بطاقتك معطّلة.“"},"Meine Karte ist nicht kaputt!":{"tr":"Kartım bozuk değil!","vi":"Thẻ của tôi không hỏng!","ar":"بطاقتي ليست معطّلة!"},"Die Karte ist in Ordnung. Die PIN-Abfrage ist eine Sicherheitsfunktion.":{"tr":"Kart sorunsuz. PIN sorgusu bir güvenlik özelliğidir.","vi":"Thẻ vẫn tốt. Việc hỏi PIN là một chức năng bảo mật.","ar":"البطاقة سليمة. طلب رمز PIN هو ميزة أمان."},"…weil ohne PIN meist nur bis 50 € gezahlt werden kann – darüber oder per Zufall fragt das Terminal zur Sicherheit.":{"tr":"…çünkü PIN'siz genellikle sadece 50 € a kadar ödeme yapılabilir – bunun üzerinde veya rastgele terminal güvenlik için sorar.","vi":"…vì khi không có PIN thường chỉ thanh toán được đến 50 € – nếu cao hơn hoặc ngẫu nhiên, máy sẽ hỏi PIN để đảm bảo an toàn.","ar":"…لأنه بدون رمز PIN يمكن الدفع عادةً حتى 50 € فقط، وفوق ذلك أو بشكل عشوائي يطلب الجهاز الرمز للأمان."},"…weil kontaktlos nur mit Kreditkarte funktioniert.":{"tr":"…çünkü temassız ödeme sadece kredi kartıyla çalışır.","vi":"…vì thanh toán không tiếp xúc chỉ dùng được với thẻ tín dụng.","ar":"…لأن الدفع بدون تلامس يعمل فقط ببطاقة الائتمان."},"…weil die PIN immer bei der dritten Zahlung am Tag kommt.":{"tr":"…çünkü PIN her zaman günün üçüncü ödemesinde istenir.","vi":"…vì PIN luôn bị hỏi ở lần thanh toán thứ ba trong ngày.","ar":"…لأن رمز PIN يُطلب دائماً عند عملية الدفع الثالثة في اليوم."},"Chef der Snackbude Zack":{"tr":"Snackbude Zack'in patronu","vi":"Ông chủ quầy đồ ăn nhanh Zack","ar":"صاحب كشك Snackbude Zack"},"Ihr macht ein Gewinnspiel für die Nordlicht-Kundenkarte. 300 Gäste haben ihre E-Mail-Adresse angegeben. Kevin bietet euch 200 € für die Liste.":{"tr":"Nordlicht müşteri kartı için bir çekiliş yapıyorsunuz. 300 misafir e-posta adresini verdi. Kevin liste için size 200 € teklif ediyor.","vi":"Các bạn tổ chức một trò chơi trúng thưởng cho thẻ khách hàng Nordlicht. 300 khách đã để lại địa chỉ email. Kevin trả các bạn 200 € để mua danh sách này.","ar":"تقيمون مسابقة لبطاقة زبائن Nordlicht. أعطى 300 ضيف عنوان بريدهم الإلكتروني. يعرض عليكم Kevin مبلغ 200 € مقابل القائمة."},"Was macht ihr?":{"tr":"Ne yaparsınız?","vi":"Các bạn làm gì?","ar":"ماذا تفعلون؟"},"Datenschutz (DSGVO)":{"tr":"Veri koruma (DSGVO – Avrupa kişisel verileri koruma yasası)","vi":"Bảo vệ dữ liệu (DSGVO – quy định bảo vệ dữ liệu của châu Âu)","ar":"حماية البيانات (DSGVO)"},"Kundendaten nur mit Einwilligung speichern, vertraulich behandeln, nicht an Dritte weitergeben, nur so viele wie nötig.":{"tr":"Müşteri verilerini sadece izinle kaydet, gizli tut, üçüncü kişilere verme, sadece gerektiği kadar topla.","vi":"Chỉ lưu dữ liệu khách hàng khi có sự đồng ý, giữ bí mật, không chuyển cho bên thứ ba, chỉ lưu những gì cần thiết.","ar":"تخزين بيانات الزبائن فقط بموافقتهم، ومعاملتها بسرية، وعدم إعطائها لأطراف ثالثة، وبالقدر الضروري فقط."},"Gesetzlich korrekter Umgang: Kundendaten vertraulich behandeln und nicht (ohne Zustimmung) an Dritte weitergeben.":{"tr":"Yasaya uygun davranış: Müşteri verilerini gizli tutmak ve (izin olmadan) üçüncü kişilere vermemek.","vi":"Cách xử lý đúng luật: giữ bí mật dữ liệu khách hàng và không chuyển cho bên thứ ba (khi chưa được đồng ý).","ar":"التعامل الصحيح قانونياً: معاملة بيانات الزبائن بسرية وعدم إعطائها لأطراف ثالثة (دون موافقة)."},"Ablehnen: Die Daten werden vertraulich behandelt und nicht an Dritte weitergegeben.":{"tr":"Reddet: Veriler gizli tutulur ve üçüncü kişilere verilmez.","vi":"Từ chối: Dữ liệu được giữ bí mật và không chuyển cho bên thứ ba.","ar":"الرفض: تُعامل البيانات بسرية ولا تُعطى لأطراف ثالثة."},"Pff. Dann eben nicht.":{"tr":"Pff. Peki, o zaman olmasın.","vi":"Hứ. Thôi vậy.","ar":"تف. إذن لا بأس."},"Nach der DSGVO werden Kundendaten nur mit Einwilligung gespeichert, vertraulich behandelt und nicht ohne Zustimmung weitergegeben.":{"tr":"DSGVO'ya göre müşteri verileri sadece izinle kaydedilir, gizli tutulur ve izin olmadan başkasına verilmez.","vi":"Theo DSGVO, dữ liệu khách hàng chỉ được lưu khi có sự đồng ý, phải được giữ bí mật và không được chuyển đi khi chưa có sự đồng ý.","ar":"وفق DSGVO (قانون حماية البيانات الأوروبي) لا تُخزَّن بيانات الزبائن إلا بموافقتهم، وتُعامل بسرية، ولا تُعطى لأحد دون موافقة."},"Nur die Namen verkaufen, ohne E-Mail-Adressen.":{"tr":"Sadece isimleri sat, e-posta adresleri olmadan.","vi":"Chỉ bán tên, không bán địa chỉ email.","ar":"بيع الأسماء فقط، دون عناوين البريد الإلكتروني."},"Na, besser als nichts!":{"tr":"Hiç yoktan iyi!","vi":"Thôi, còn hơn không!","ar":"حسناً، أفضل من لا شيء!"},"Auch Namen sind Kundendaten. Sie dürfen nicht ohne Zustimmung an Dritte gehen.":{"tr":"İsimler de müşteri verisidir. İzin olmadan üçüncü kişilere verilemez.","vi":"Tên cũng là dữ liệu khách hàng. Không được chuyển cho bên thứ ba khi chưa có sự đồng ý.","ar":"الأسماء أيضاً بيانات زبائن. لا يجوز إعطاؤها لأطراف ثالثة دون موافقة."},"Die Liste geben, wenn Kevin verspricht, sie nicht weiterzugeben.":{"tr":"Kevin başkasına vermeyeceğine söz verirse listeyi ver.","vi":"Đưa danh sách nếu Kevin hứa không chuyển cho người khác.","ar":"إعطاء القائمة إذا وعد Kevin بعدم تمريرها لأحد."},"Versprochen! Ehrenwort!":{"tr":"Söz! Namus sözü!","vi":"Hứa! Tôi thề!","ar":"أعدك! أعطيك كلمة شرف!"},"Kevin ist ein Dritter. Ohne Zustimmung der Kunden darf er die Daten nicht bekommen.":{"tr":"Kevin üçüncü bir kişidir. Müşterilerin izni olmadan verileri alamaz.","vi":"Kevin là bên thứ ba. Khi khách hàng chưa đồng ý, anh ta không được nhận dữ liệu.","ar":"Kevin طرف ثالث. لا يجوز أن يحصل على البيانات دون موافقة الزبائن."},"…weil die DSGVO verlangt, Kundendaten vertraulich zu behandeln und nicht ohne Zustimmung an Dritte zu geben.":{"tr":"…çünkü DSGVO müşteri verilerinin gizli tutulmasını ve izin olmadan üçüncü kişilere verilmemesini ister.","vi":"…vì DSGVO yêu cầu giữ bí mật dữ liệu khách hàng và không chuyển cho bên thứ ba khi chưa có sự đồng ý.","ar":"…لأن DSGVO تطلب معاملة بيانات الزبائن بسرية وعدم إعطائها لأطراف ثالثة دون موافقة."},"…weil Kundendaten nur einen Tag gespeichert werden dürfen.":{"tr":"…çünkü müşteri verileri sadece bir gün saklanabilir.","vi":"…vì dữ liệu khách hàng chỉ được lưu một ngày.","ar":"…لأن بيانات الزبائن لا يجوز تخزينها إلا ليوم واحد."},"…weil man Daten nur verkaufen darf, wenn es mehr als 500 € bringt.":{"tr":"…çünkü veriler sadece 500 € dan fazla getiriyorsa satılabilir.","vi":"…vì chỉ được bán dữ liệu nếu thu về hơn 500 €.","ar":"…لأنه لا يجوز بيع البيانات إلا إذا كان الربح أكثر من 500 €."},"Ein kleines Café will nur noch Kartenzahlung annehmen. Was ist ein Nachteil für die Kunden?":{"tr":"Küçük bir kafe artık sadece kartla ödeme almak istiyor. Müşteriler için dezavantaj nedir?","vi":"Một quán cà phê nhỏ muốn chỉ nhận thanh toán bằng thẻ. Điều gì là bất lợi cho khách hàng?","ar":"مقهى صغير يريد قبول الدفع بالبطاقة فقط. ما العيب بالنسبة للزبائن؟"},"Menschen ohne Karte, Kinder und manche Ältere werden ausgeschlossen, und niemand kann anonym zahlen.":{"tr":"Kartı olmayanlar, çocuklar ve bazı yaşlılar dışarıda kalır ve kimse anonim ödeme yapamaz.","vi":"Người không có thẻ, trẻ em và một số người lớn tuổi bị loại ra, và không ai có thể thanh toán ẩn danh.","ar":"الأشخاص بدون بطاقة والأطفال وبعض كبار السن يُستبعدون، ولا أحد يستطيع الدفع دون الكشف عن هويته."},"Kunden müssen dann Gebühren an das Café zahlen.":{"tr":"Müşteriler o zaman kafeye ücret ödemek zorunda kalır.","vi":"Khi đó khách hàng phải trả phí cho quán cà phê.","ar":"على الزبائن حينئذٍ دفع رسوم للمقهى."},"Kartenzahlung dauert immer länger als Bargeld.":{"tr":"Kartla ödeme her zaman nakitten daha uzun sürer.","vi":"Thanh toán bằng thẻ luôn lâu hơn tiền mặt.","ar":"الدفع بالبطاقة يستغرق دائماً وقتاً أطول من النقد."},"Eure Kundenkarte gibt 1 % Rabatt. Warum lohnt sich das trotzdem für den Betrieb?":{"tr":"Müşteri kartınız 1 % indirim (Rabatt) veriyor. İşletme için bu yine de neden kârlıdır?","vi":"Thẻ khách hàng của các bạn giảm giá (Rabatt) 1 %. Vì sao việc này vẫn có lợi cho cửa hàng?","ar":"بطاقة الزبائن عندكم تعطي خصماً بنسبة 1 %. لماذا يفيد ذلك المحل مع ذلك؟"},"Kunden kommen öfter wieder, und der Betrieb erfährt, wer was kauft – Sortiment und Werbung lassen sich anpassen.":{"tr":"Müşteriler daha sık geri gelir ve işletme kimin ne aldığını öğrenir – ürün çeşidi ve reklam buna göre ayarlanabilir.","vi":"Khách hàng quay lại thường xuyên hơn, và cửa hàng biết ai mua gì – có thể điều chỉnh hàng hóa và quảng cáo.","ar":"الزبائن يعودون أكثر، والمحل يعرف من يشتري ماذا، فيمكن تعديل المنتجات والإعلانات."},"Weil der Staat den Rabatt bezahlt.":{"tr":"Çünkü indirimi devlet öder.","vi":"Vì nhà nước trả khoản giảm giá.","ar":"لأن الدولة تدفع الخصم."},"Weil Kunden mit Kundenkarte keinen Bon brauchen.":{"tr":"Çünkü müşteri kartı olanların fişe (Bon) ihtiyacı yoktur.","vi":"Vì khách có thẻ khách hàng không cần hóa đơn (Bon).","ar":"لأن الزبائن أصحاب بطاقة الزبائن لا يحتاجون إلى إيصال."},"Eine Kundin hat 1.384 Bonuspunkte (1 Punkt = 0,01 €). Sie kauft für 42,45 € ein und verrechnet die Punkte. Wie viel zahlt sie noch?":{"tr":"Bir müşterinin 1.384 bonus puanı var (1 puan = 0,01 €). 42,45 € lik alışveriş yapıyor ve puanları kullanıyor. Hâlâ ne kadar öder?","vi":"Một khách có 1.384 điểm thưởng (1 điểm = 0,01 €). Khách mua hàng 42,45 € và trừ điểm vào. Khách còn phải trả bao nhiêu?","ar":"لدى زبونة 1.384 نقطة مكافأة (1 نقطة = 0,01 €). تشتري بمبلغ 42,45 € وتستخدم النقاط. كم تبقى عليها لتدفع؟"},"Hitze, Schlange, Jugendliche":{"tr":"Sıcak, kuyruk, gençler","vi":"Nóng bức, hàng dài, thanh thiếu niên","ar":"حرارة، طابور، مراهقون"},"Besondere Situationen an der Kasse":{"tr":"Kasada özel durumlar","vi":"Những tình huống đặc biệt tại quầy thu ngân","ar":"مواقف خاصة عند صندوق الدفع (Kasse)"},"Samstag, 18 Uhr. Ihr steht seit sieben Stunden an der Kasse. Es ist heiß, viele Jugendliche sind unterwegs. Nebenan verkauft Kevin alles an jeden – das kann nicht gut gehen.":{"tr":"Cumartesi, saat 18. Yedi saattir kasadasınız. Hava sıcak, çok sayıda genç dolaşıyor. Yan tarafta Kevin her şeyi herkese satıyor – bu iyi bitmez.","vi":"Thứ Bảy, 18 giờ. Các bạn đã đứng ở quầy thu ngân bảy tiếng. Trời nóng, có nhiều thanh thiếu niên đi lại. Bên cạnh, Kevin bán mọi thứ cho bất kỳ ai – chuyện này sẽ không êm đâu.","ar":"السبت، الساعة 18. أنتم واقفون عند الصندوق منذ سبع ساعات. الجو حار وكثير من المراهقين في المكان. بجانبكم يبيع Kevin كل شيء لأي شخص – لن ينتهي هذا بخير."},"der Jugendschutz":{"tr":"gençlerin korunması","vi":"bảo vệ thanh thiếu niên","ar":"حماية الأحداث (Jugendschutz)"},"das Jugendschutzgesetz":{"tr":"gençlerin korunması kanunu","vi":"Luật bảo vệ thanh thiếu niên","ar":"قانون حماية الأحداث (Jugendschutzgesetz)"},"volljährig":{"tr":"reşit (ergin)","vi":"đã trưởng thành","ar":"بالغ (volljährig)"},"den Ausweis zeigen lassen":{"tr":"kimliği göstermesini istemek","vi":"yêu cầu xuất trình giấy tờ tùy thân","ar":"طلب إبراز بطاقة الهوية (den Ausweis zeigen lassen)"},"branntweinhaltig":{"tr":"yüksek alkollü (damıtılmış içki içeren)","vi":"có chứa rượu mạnh","ar":"يحتوي على مشروبات روحية قوية (branntweinhaltig)"},"die Diebstahlprävention":{"tr":"hırsızlığın önlenmesi","vi":"phòng chống trộm cắp","ar":"منع السرقة (Diebstahlprävention)"},"die Hilfestellung":{"tr":"yardım, destek","vi":"sự hỗ trợ, giúp đỡ","ar":"تقديم المساعدة (Hilfestellung)"},"zurücklegen":{"tr":"kenara ayırmak","vi":"để dành lại, giữ hàng lại","ar":"حجز الغرض جانباً (zurücklegen)"},"die Ergonomie":{"tr":"ergonomi","vi":"công thái học (làm việc đúng tư thế)","ar":"بيئة العمل المريحة (Ergonomie)"},"die Stehhilfe":{"tr":"ayakta durma desteği","vi":"giá tựa để đứng làm việc","ar":"مسند الوقوف (Stehhilfe)"},"die Pause":{"tr":"mola","vi":"giờ nghỉ","ar":"الاستراحة (Pause)"},"die wörtliche Rede":{"tr":"doğrudan konuşma","vi":"lời nói trực tiếp","ar":"الكلام المباشر (wörtliche Rede)"},"etwa 16 Jahre alt":{"tr":"yaklaşık 16 yaşında","vi":"khoảng 16 tuổi","ar":"عمرها نحو 16 سنة"},"Zwei Mädchen, etwa 16, wollen zwei Dosen Wodka-Mix. „Die sind für meinen Bruder, der ist 20!“":{"tr":"Yaklaşık 16 yaşında iki kız, iki kutu votka karışımı içecek istiyor. „Bunlar abim için, o 20 yaşında!“","vi":"Hai cô bé, khoảng 16 tuổi, muốn mua hai lon đồ uống pha vodka. „Mua cho anh em, anh ấy 20 tuổi rồi!“","ar":"فتاتان، عمرهما نحو 16 سنة، تريدان علبتين من Wodka-Mix. „هذه لأخي، عمره 20 سنة!“"},"Jugendschutz: Alkohol":{"tr":"Gençlerin korunması (Jugendschutz): Alkol","vi":"Bảo vệ thanh thiếu niên: Rượu","ar":"حماية الأحداث: الكحول"},"Bier, Wein, Sekt und Mischgetränke mit Bier oder Wein ab 16. Branntwein und Mischgetränke mit Branntwein ab 18.":{"tr":"Bira, şarap, köpüklü şarap ve bira veya şarap içeren karışık içecekler 16 yaşından itibaren. Branntwein (damıtılmış sert içki) ve Branntwein içeren karışık içecekler 18 yaşından itibaren.","vi":"Bia, rượu vang, rượu sâm banh và đồ uống pha với bia hoặc rượu vang: từ 16 tuổi. Rượu mạnh (Branntwein) và đồ uống pha với rượu mạnh: từ 18 tuổi.","ar":"البيرة والنبيذ والشمبانيا والمشروبات المخلوطة بالبيرة أو النبيذ من عمر 16. المشروبات الروحية القوية (Branntwein) والمشروبات المخلوطة بها من عمر 18."},"Aspekt: Jugendschutz (1 Punkt). Ansprache in wörtlicher Rede, freundlich mit Lösung (2 Punkte).":{"tr":"Konu: Gençlerin korunması (1 puan). Doğrudan konuşmayla, nazik ve çözümlü hitap (2 puan).","vi":"Khía cạnh: bảo vệ thanh thiếu niên (1 điểm). Lời nói trực tiếp, thân thiện và có giải pháp (2 điểm).","ar":"الجانب: حماية الأحداث (1 نقطة). مخاطبة الزبون بكلام مباشر، بلطف ومع حل (2 نقطتان)."},"Ausweis zeigen lassen. „Tut mir leid, Getränke mit Wodka darf ich erst ab 18 verkaufen – auch für deinen Bruder. Wie wär's mit unserer Limo?“":{"tr":"Kimliği göstermesini iste. „Üzgünüm, votkalı içecekleri ancak 18 yaşından itibaren satabilirim – abin için de. Limonatamıza ne dersin?“","vi":"Yêu cầu xuất trình giấy tờ tùy thân. „Xin lỗi, đồ uống có vodka tôi chỉ được bán từ 18 tuổi – kể cả cho anh của bạn. Bạn thử nước ngọt Limo của chúng tôi nhé?“","ar":"اطلب إبراز بطاقة الهوية. „آسف، لا يجوز لي بيع مشروبات فيها فودكا إلا من عمر 18 – حتى لأخيك. ما رأيك بالليموناضة عندنا؟“"},"Okay … dann halt zwei Limos.":{"tr":"Tamam … o zaman iki limonata.","vi":"Ok … vậy thì hai chai Limo vậy.","ar":"حسناً … إذن علبتا ليموناضة."},"Jugendschutz: Branntwein und Mischgetränke mit Branntwein erst ab 18. Dass sie für jemand anderen sind, ändert nichts. Freundlich ablehnen und eine Lösung anbieten.":{"tr":"Gençlerin korunması: Branntwein (damıtılmış sert içki) ve Branntwein içeren karışık içecekler ancak 18 yaşından itibaren. Başkası için olması bir şeyi değiştirmez. Nazikçe reddet ve bir çözüm sun.","vi":"Bảo vệ thanh thiếu niên: Rượu mạnh và đồ uống pha với rượu mạnh chỉ từ 18 tuổi. Việc mua cho người khác không thay đổi điều này. Từ chối thân thiện và đưa ra giải pháp.","ar":"حماية الأحداث: المشروبات الروحية القوية (Branntwein) والمشروبات المخلوطة بها من عمر 18 فقط. كونها لشخص آخر لا يغيّر شيئاً. ارفض بلطف وقدّم حلاً."},"„Ihr seht zu jung aus. Geht weg.“":{"tr":"„Çok genç görünüyorsunuz. Gidin.“","vi":"„Các cô trông quá nhỏ. Đi đi.“","ar":"„تبدين صغيرتين جداً. اذهبا من هنا.“"},"Boah, wie unfreundlich!":{"tr":"Off, ne kadar kaba!","vi":"Trời, sao thô lỗ vậy!","ar":"يا للوقاحة!"},"Die Ablehnung ist richtig. Aber man bleibt höflich, nennt den Grund und bietet eine Lösung an.":{"tr":"Reddetmek doğru. Ama kibar kalınır, sebep söylenir ve bir çözüm sunulur.","vi":"Từ chối là đúng. Nhưng vẫn phải lịch sự, nêu lý do và đưa ra giải pháp.","ar":"الرفض صحيح. لكن يجب أن تبقى مهذباً، وتذكر السبب، وتقدّم حلاً."},"Verkaufen – der Bruder ist ja 20.":{"tr":"Sat – abisi 20 yaşında nasılsa.","vi":"Bán – anh trai họ 20 tuổi mà.","ar":"البيع – فأخوهما عمره 20."},"Danke! Easy.":{"tr":"Sağ ol! Kolay.","vi":"Cảm ơn! Dễ ợt.","ar":"شكراً! سهل."},"Verstoß gegen das Jugendschutzgesetz. Mischgetränke mit Branntwein gibt es erst ab 18, egal für wen.":{"tr":"Gençlerin korunması kanununa aykırı. Branntwein içeren karışık içecekler kimin için olursa olsun ancak 18 yaşından itibaren verilir.","vi":"Vi phạm Luật bảo vệ thanh thiếu niên. Đồ uống pha với rượu mạnh chỉ bán từ 18 tuổi, bất kể mua cho ai.","ar":"مخالفة لقانون حماية الأحداث. المشروبات المخلوطة بالمشروبات الروحية القوية من عمر 18 فقط، مهما كان المشتري."},"…weil Mischgetränke mit Branntwein erst ab 18 verkauft werden dürfen – auch wenn sie für jemand anderen sind.":{"tr":"…çünkü Branntwein içeren karışık içecekler ancak 18 yaşından itibaren satılabilir – başkası için olsa bile.","vi":"…vì đồ uống pha với rượu mạnh chỉ được bán từ 18 tuổi – kể cả khi mua cho người khác.","ar":"…لأن المشروبات المخلوطة بالمشروبات الروحية القوية لا يجوز بيعها إلا من عمر 18 – حتى لو كانت لشخص آخر."},"…weil Mischgetränke mit Branntwein ab 16 erlaubt sind, wenn ein Erwachsener zustimmt.":{"tr":"…çünkü Branntwein içeren karışık içeceklere bir yetişkin izin verirse 16 yaşından itibaren izin vardır.","vi":"…vì đồ uống pha với rượu mạnh được phép từ 16 tuổi nếu người lớn đồng ý.","ar":"…لأن المشروبات المخلوطة بالمشروبات الروحية القوية مسموحة من عمر 16 إذا وافق شخص بالغ."},"…weil Jugendliche unter 18 gar keinen Alkohol kaufen dürfen.":{"tr":"…çünkü 18 yaşın altındaki gençler hiç alkol alamaz.","vi":"…vì thanh thiếu niên dưới 18 tuổi hoàn toàn không được mua rượu.","ar":"…لأن من هم دون 18 سنة لا يجوز لهم شراء أي كحول أبداً."},"etwa 15 Jahre alt":{"tr":"yaklaşık 15 yaşında","vi":"khoảng 15 tuổi","ar":"عمره نحو 15 سنة"},"Ein Junge, etwa 15, will eine E-Zigarette ohne Nikotin. „Da ist doch gar kein Nikotin drin!“":{"tr":"Yaklaşık 15 yaşında bir çocuk nikotinsiz elektronik sigara istiyor. „İçinde hiç nikotin yok ki!“","vi":"Một cậu bé, khoảng 15 tuổi, muốn mua thuốc lá điện tử không có nicotin. „Trong đó đâu có nicotin!“","ar":"ولد عمره نحو 15 سنة يريد سيجارة إلكترونية بدون نيكوتين. „ليس فيها نيكوتين أصلاً!“"},"Jugendschutz: Tabak":{"tr":"Gençlerin korunması (Jugendschutz): Tütün","vi":"Bảo vệ thanh thiếu niên: Thuốc lá","ar":"حماية الأحداث: التبغ"},"Tabakwaren, E-Zigaretten und Shishas – mit und ohne Nikotin – erst ab 18 Jahren.":{"tr":"Tütün ürünleri, elektronik sigaralar ve nargileler – nikotinli ve nikotinsiz – ancak 18 yaşından itibaren.","vi":"Sản phẩm thuốc lá, thuốc lá điện tử và shisha – có hoặc không có nicotin – chỉ từ 18 tuổi.","ar":"منتجات التبغ والسجائر الإلكترونية والشيشة – بنيكوتين أو بدونه – من عمر 18 سنة فقط."},"„Tut mir leid, Zigaretten darf ich erst an Personen ab 18 verkaufen – auch wenn sie für deinen Vater sind.“":{"tr":"„Üzgünüm, sigarayı ancak 18 yaşından itibaren kişilere satabilirim – babanız için olsa bile.“","vi":"„Xin lỗi, thuốc lá tôi chỉ được bán cho người từ 18 tuổi – kể cả khi mua cho bố bạn.“","ar":"„آسف، لا يجوز لي بيع السجائر إلا لمن هم من عمر 18 – حتى لو كانت لوالدك.“"},"„Tut mir leid, E-Zigaretten darf ich erst ab 18 verkaufen – auch ohne Nikotin. Darf ich dir ein kaltes Wasser anbieten?“":{"tr":"„Üzgünüm, elektronik sigarayı ancak 18 yaşından itibaren satabilirim – nikotinsiz olsa bile. Sana soğuk bir su ikram edebilir miyim?“","vi":"„Xin lỗi, thuốc lá điện tử tôi chỉ được bán từ 18 tuổi – kể cả không có nicotin. Tôi mời bạn một chai nước lạnh nhé?“","ar":"„آسف، لا يجوز لي بيع السجائر الإلكترونية إلا من عمر 18 – حتى بدون نيكوتين. هل أقدّم لك ماءً بارداً؟“"},"Echt? Auch ohne Nikotin? Okay, dann ein Wasser.":{"tr":"Gerçekten mi? Nikotinsiz de mi? Tamam, o zaman bir su.","vi":"Thật á? Không có nicotin cũng không được ạ? Ok, vậy cho cháu chai nước.","ar":"حقاً؟ حتى بدون نيكوتين؟ حسناً، إذن ماء."},"Tabakwaren und E-Zigaretten gibt es erst ab 18, auch ohne Nikotin. Freundlich erklären und eine Lösung anbieten.":{"tr":"Tütün ürünleri ve elektronik sigaralar nikotinsiz de olsa ancak 18 yaşından itibaren verilir. Nazikçe açıkla ve bir çözüm sun.","vi":"Sản phẩm thuốc lá và thuốc lá điện tử chỉ từ 18 tuổi, kể cả không có nicotin. Giải thích thân thiện và đưa ra giải pháp.","ar":"منتجات التبغ والسجائر الإلكترونية من عمر 18 فقط، حتى بدون نيكوتين. اشرح بلطف وقدّم حلاً."},"„Ausweis!“ – und ihn ohne Erklärung wegschicken.":{"tr":"„Kimlik!“ – ve açıklama yapmadan geri çevirmek.","vi":"„Giấy tờ!“ – rồi đuổi đi mà không giải thích.","ar":"„الهوية!“ – ثم صرفه دون شرح."},"Was ist denn dein Problem?":{"tr":"Senin sorunun ne?","vi":"Bạn bị làm sao vậy?","ar":"ما مشكلتك أنت؟"},"Die Ablehnung ist richtig, aber man erklärt höflich den Grund.":{"tr":"Reddetmek doğru, ama sebep kibarca açıklanır.","vi":"Từ chối là đúng, nhưng phải giải thích lý do một cách lịch sự.","ar":"الرفض صحيح، لكن يجب شرح السبب بأدب."},"Verkaufen – ohne Nikotin ist das erlaubt.":{"tr":"Sat – nikotinsiz olunca serbest.","vi":"Bán – không có nicotin thì được phép.","ar":"البيع – بدون نيكوتين هذا مسموح."},"Danke! Wusste ich doch.":{"tr":"Sağ ol! Biliyordum zaten.","vi":"Cảm ơn! Em biết mà.","ar":"شكراً! كنت أعرف ذلك."},"Falsch: E-Zigaretten sind mit und ohne Nikotin erst ab 18 erlaubt.":{"tr":"Yanlış: Elektronik sigaralar nikotinli ve nikotinsiz ancak 18 yaşından itibaren serbesttir.","vi":"Sai: Thuốc lá điện tử, có hoặc không có nicotin, chỉ được phép từ 18 tuổi.","ar":"خطأ: السجائر الإلكترونية مسموحة من عمر 18 فقط، بنيكوتين أو بدونه."},"…weil Tabakwaren und E-Zigaretten erst ab 18 verkauft werden dürfen – auch ohne Nikotin.":{"tr":"…çünkü tütün ürünleri ve elektronik sigaralar ancak 18 yaşından itibaren satılabilir – nikotinsiz de olsa.","vi":"…vì sản phẩm thuốc lá và thuốc lá điện tử chỉ được bán từ 18 tuổi – kể cả không có nicotin.","ar":"…لأن منتجات التبغ والسجائر الإلكترونية لا يجوز بيعها إلا من عمر 18 – حتى بدون نيكوتين."},"…weil E-Zigaretten ohne Nikotin ab 16 erlaubt sind.":{"tr":"…çünkü nikotinsiz elektronik sigaralar 16 yaşından itibaren serbesttir.","vi":"…vì thuốc lá điện tử không có nicotin được phép từ 16 tuổi.","ar":"…لأن السجائر الإلكترونية بدون نيكوتين مسموحة من عمر 16."},"…weil man E-Zigaretten nur an Raucher verkaufen darf.":{"tr":"…çünkü elektronik sigaralar sadece sigara içenlere satılabilir.","vi":"…vì thuốc lá điện tử chỉ được bán cho người hút thuốc.","ar":"…لأنه لا يجوز بيع السجائر الإلكترونية إلا للمدخّنين."},"Gast mit vollem Korb":{"tr":"Sepeti dolu müşteri","vi":"Khách với giỏ hàng đầy","ar":"ضيف بسلة مليئة"},"Das Kartenterminal hat plötzlich kein Netz. Herr Becker hat einen vollen Korb und will mit Karte zahlen.":{"tr":"Kart terminalinin bağlantısı aniden kesildi. Bay Becker'in sepeti dolu ve kartla ödemek istiyor.","vi":"Máy thanh toán thẻ đột nhiên mất mạng. Ông Becker có giỏ hàng đầy và muốn trả bằng thẻ.","ar":"جهاز البطاقات انقطعت عنه الشبكة فجأة. السيد Becker معه سلة مليئة ويريد الدفع بالبطاقة."},"Hilfestellung / Alternative anbieten":{"tr":"Yardım / alternatif sunmak","vi":"Hỗ trợ (Hilfestellung) / đưa ra phương án thay thế","ar":"تقديم المساعدة (Hilfestellung) / عرض بديل"},"Höflich sagen, was los ist (mit Grund), und eine Lösung anbieten: bar zahlen, zurücklegen, andere Kasse.":{"tr":"Kibarca ne olduğunu söyle (sebebiyle birlikte) ve bir çözüm sun: nakit ödeme, kenara ayırma, başka kasa.","vi":"Lịch sự nói rõ chuyện gì đang xảy ra (kèm lý do) và đưa ra giải pháp: trả tiền mặt, để hàng lại, dùng quầy khác.","ar":"قل بأدب ما الذي حدث (مع السبب)، وقدّم حلاً: الدفع نقداً، أو حجز المشتريات جانباً، أو صندوق آخر."},"„Es tut mir leid, unser Kartenterminal hat gerade eine Störung. Können Sie bar bezahlen? Sonst öffnet meine Kollegin gleich die Nachbarkasse.“":{"tr":"„Üzgünüm, kart terminalimizde şu an bir arıza var. Nakit ödeyebilir misiniz? Yoksa meslektaşım hemen yan kasayı açar.“","vi":"„Tôi xin lỗi, máy thanh toán thẻ của chúng tôi đang bị sự cố. Ông có thể trả bằng tiền mặt không? Nếu không, đồng nghiệp của tôi sẽ mở ngay quầy bên cạnh.“","ar":"„أنا آسف، جهاز البطاقات عندنا فيه عطل الآن. هل يمكنك الدفع نقداً؟ وإلا فستفتح زميلتي الصندوق المجاور حالاً.“"},"„Es tut mir leid, unser Terminal hat gerade eine Störung. Können Sie bar zahlen? Sonst lege ich Ihnen den Einkauf gern kurz zurück.“":{"tr":"„Üzgünüm, terminalimizde şu an bir arıza var. Nakit ödeyebilir misiniz? Yoksa alışverişinizi memnuniyetle kısa süre kenara ayırırım.“","vi":"„Tôi xin lỗi, máy thanh toán của chúng tôi đang bị sự cố. Ông có thể trả bằng tiền mặt không? Nếu không, tôi sẽ sẵn lòng giữ hàng lại giúp ông một lúc.“","ar":"„أنا آسف، جهازنا فيه عطل الآن. هل يمكنك الدفع نقداً؟ وإلا فسأحجز لك مشترياتك جانباً قليلاً بكل سرور.“"},"Ich hol schnell Geld vom Automaten. Danke fürs Zurücklegen!":{"tr":"Hemen bankamatikten para çekip geliyorum. Kenara ayırdığınız için teşekkürler!","vi":"Tôi đi rút tiền ở máy ATM một chút. Cảm ơn đã giữ hàng giúp!","ar":"سأحضر نقوداً بسرعة من الصراف الآلي. شكراً لأنكم حجزتم لي المشتريات!"},"In besonderen Situationen: höflich sagen, was los ist, und eine Lösung anbieten (Hilfestellung).":{"tr":"Özel durumlarda: kibarca ne olduğunu söyle ve bir çözüm sun (yardım).","vi":"Trong tình huống đặc biệt: lịch sự nói rõ chuyện gì đang xảy ra và đưa ra giải pháp (Hilfestellung, sự hỗ trợ).","ar":"في المواقف الخاصة: قل بأدب ما الذي حدث، وقدّم حلاً (تقديم المساعدة، Hilfestellung)."},"Wortlos auf ein Schild „Heute nur bar“ zeigen.":{"tr":"Sessizce „Bugün sadece nakit“ yazan tabelayı göstermek.","vi":"Không nói gì, chỉ chỉ vào tấm biển „Hôm nay chỉ nhận tiền mặt“.","ar":"الإشارة بصمت إلى لافتة „اليوم نقداً فقط“."},"Aha. Und jetzt?":{"tr":"Anladım. Peki şimdi ne olacak?","vi":"À. Rồi sao nữa?","ar":"آها. وماذا الآن؟"},"Die Information stimmt, aber es fehlt die freundliche Ansprache und eine Lösung.":{"tr":"Bilgi doğru, ama samimi bir hitap ve bir çözüm eksik.","vi":"Thông tin đúng, nhưng thiếu lời nói thân thiện và giải pháp.","ar":"المعلومة صحيحة، لكن تنقصها المخاطبة اللطيفة وتنقصها الحلول."},"„Pech gehabt, dann eben nicht.“":{"tr":"„Şansınız yokmuş, o zaman olmasın.“","vi":"„Xui rồi, vậy thì thôi.“","ar":"„سوء حظك، إذن لا بأس.“"},"Unfassbar. Hier kauf ich nie wieder.":{"tr":"İnanılmaz. Buradan bir daha asla alışveriş yapmam.","vi":"Không thể tin được. Tôi không bao giờ mua ở đây nữa.","ar":"لا يُصدَّق. لن أشتري من هنا أبداً."},"Unfreundlich und ohne Lösung. So verliert der Stand Kunden.":{"tr":"Kaba ve çözümsüz. Böyle yapınca stant müşteri kaybeder.","vi":"Thiếu thân thiện và không có giải pháp. Như vậy quầy sẽ mất khách.","ar":"غير لطيف وبدون حل. هكذا يخسر الكشك زبائنه."},"…weil man in besonderen Situationen höflich sagt, was los ist, und eine Lösung anbietet.":{"tr":"…çünkü özel durumlarda kibarca ne olduğu söylenir ve bir çözüm sunulur.","vi":"…vì trong tình huống đặc biệt, ta lịch sự nói rõ chuyện gì đang xảy ra và đưa ra giải pháp.","ar":"…لأنه في المواقف الخاصة يقول الإنسان بأدب ما الذي حدث ويقدّم حلاً."},"…weil man bei Technikausfall den Kauf sofort abbrechen muss.":{"tr":"…çünkü teknik arızada alışveriş hemen iptal edilmelidir.","vi":"…vì khi thiết bị hỏng, phải hủy việc mua ngay lập tức.","ar":"…لأنه عند تعطل التقنية يجب إلغاء الشراء فوراً."},"…weil der Kunde bei einer Störung nichts bezahlen muss.":{"tr":"…çünkü müşteri arıza durumunda hiçbir şey ödemek zorunda değildir.","vi":"…vì khi có sự cố, khách không phải trả tiền.","ar":"…لأن الزبون لا يدفع شيئاً عند حدوث عطل."},"seit 7 Stunden an der Kasse":{"tr":"7 saattir kasada","vi":"đã đứng quầy thu ngân 7 tiếng","ar":"منذ 7 ساعات عند الصندوق"},"Du stehst seit sieben Stunden an der Kasse. Dein Rücken tut weh, die Theke ist viel zu niedrig. Kisten mit Wasser hebst du jedes Mal aufs Band.":{"tr":"Yedi saattir kasadasın. Sırtın ağrıyor, tezgah çok alçak. Su kasalarını her seferinde banda kaldırıyorsun.","vi":"Bạn đã đứng ở quầy thu ngân bảy tiếng. Lưng bạn đau, quầy thấp quá. Mỗi lần bạn lại phải nhấc thùng nước lên băng chuyền.","ar":"أنت واقف عند الصندوق منذ سبع ساعات. ظهرك يؤلمك والطاولة منخفضة جداً. وفي كل مرة ترفع صناديق الماء إلى السير."},"Ergonomie am Kassenplatz":{"tr":"Kasa yerinde ergonomi","vi":"Công thái học (Ergonomie) tại vị trí thu ngân","ar":"بيئة العمل المريحة (Ergonomie) عند الصندوق"},"Stuhl und Theke auf die Körpergröße einstellen, Sitzen und Stehen wechseln, Stehhilfe, Handscanner für schwere Ware, Pausen.":{"tr":"Sandalye ve tezgahı boya göre ayarla, oturmayı ve ayakta durmayı değiştir, ayakta durma desteği, ağır mallar için el tarayıcısı, molalar.","vi":"Chỉnh ghế và quầy cho vừa chiều cao cơ thể, đổi giữa ngồi và đứng, dùng giá tựa để đứng, dùng máy quét cầm tay cho hàng nặng, nghỉ giải lao.","ar":"ضبط الكرسي والطاولة حسب طول الجسم، والتبديل بين الجلوس والوقوف، ومسند الوقوف (Stehhilfe)، وماسح يدوي للبضاعة الثقيلة، واستراحات."},"Ergonomische Maßnahmen: Stuhl und Kassentisch auf die Körpergröße einstellen, damit ich aufrecht sitze. Zwischen Sitzen und Stehen wechseln und eine Stehhilfe nutzen, damit der Rücken entlastet wird.":{"tr":"Ergonomik önlemler: Sandalye ve kasa masasını boya göre ayarla, böylece dik oturursun. Oturma ve ayakta durma arasında değiştir ve ayakta durma desteği kullan, böylece sırt rahatlar.","vi":"Biện pháp công thái học: chỉnh ghế và bàn thu ngân cho vừa chiều cao cơ thể để tôi ngồi thẳng lưng. Đổi giữa ngồi và đứng, dùng giá tựa để đứng, để lưng đỡ mỏi.","ar":"إجراءات مريحة للجسم: ضبط الكرسي وطاولة الصندوق حسب طول الجسم لأجلس بشكل مستقيم. التبديل بين الجلوس والوقوف واستخدام مسند الوقوف (Stehhilfe) لتخفيف الحمل عن الظهر."},"Pause machen. Danach Theke auf deine Größe einstellen, mit Stehhilfe abwechseln und schwere Kisten mit dem Handscanner erfassen.":{"tr":"Mola ver. Sonra tezgahı boyuna göre ayarla, ayakta durma desteğiyle sırayla kullan ve ağır kasaları el tarayıcısıyla okut.","vi":"Nghỉ giải lao. Sau đó chỉnh quầy cho vừa chiều cao của bạn, thay phiên dùng giá tựa để đứng và quét hàng nặng bằng máy quét cầm tay.","ar":"خذ استراحة. بعدها اضبط الطاولة حسب طولك، وبدّل مع مسند الوقوف، وسجّل الصناديق الثقيلة بالماسح اليدوي."},"Puh, viel besser. Und ich vertippe mich nicht mehr.":{"tr":"Oh, çok daha iyi. Ve artık yanlış tuşlamıyorum.","vi":"Phù, khá hơn nhiều. Và tôi cũng không bấm nhầm nữa.","ar":"أف، أفضل بكثير. ولم أعد أخطئ في الإدخال."},"Pausen helfen gegen Fehler. Ein passend eingestellter Arbeitsplatz, Wechsel von Stehen und Sitzen und der Handscanner schonen den Rücken.":{"tr":"Molalar hataya karşı yardımcı olur. Uygun ayarlanmış iş yeri, ayakta ve oturarak çalışma değişimi ve el tarayıcısı sırtı korur.","vi":"Nghỉ giải lao giúp giảm lỗi. Chỗ làm việc được chỉnh phù hợp, đổi giữa đứng và ngồi, và máy quét cầm tay giúp bảo vệ lưng.","ar":"الاستراحات تساعد على تجنب الأخطاء. مكان العمل المضبوط جيداً، والتبديل بين الوقوف والجلوس، والماسح اليدوي تحمي الظهر."},"Nur kurz strecken und weitermachen. Pausen kosten Umsatz.":{"tr":"Sadece kısaca gerin ve devam edin. Molalar ciroya mal olur.","vi":"Chỉ vươn vai chút rồi làm tiếp. Nghỉ giải lao làm mất doanh thu.","ar":"مجرد تمدد قصير ثم المتابعة. الاستراحات تكلّف مبيعات."},"Geht so … der Rücken zwickt immer noch.":{"tr":"Şöyle böyle … sırtım hâlâ sızlıyor.","vi":"Cũng tàm tạm … lưng vẫn còn nhói.","ar":"ليس تماماً … الظهر ما زال يؤلمني."},"Ausgleichsübungen sind gut, aber Pausen sind wichtig. Erwachsene haben bei mehr als 6 Stunden Arbeit mindestens 30 Minuten Pause, Jugendliche schon bei mehr als 4,5 Stunden.":{"tr":"Dengeleyici egzersizler iyidir, ama molalar önemlidir. Yetişkinlerin 6 saatten fazla çalışmada en az 30 dakika molası vardır, gençlerin ise 4,5 saatten fazla çalışmada.","vi":"Bài tập thư giãn là tốt, nhưng nghỉ giải lao mới quan trọng. Người lớn làm việc hơn 6 giờ được nghỉ ít nhất 30 phút, thanh thiếu niên chỉ cần làm hơn 4,5 giờ.","ar":"تمارين الإطالة جيدة، لكن الاستراحات مهمة. للبالغين استراحة لا تقل عن 30 دقيقة عند العمل أكثر من 6 ساعات، وللأحداث عند العمل أكثر من 4,5 ساعات."},"Durchziehen bis Mitternacht und die Kisten weiter heben.":{"tr":"Gece yarısına kadar dayanmak ve kasaları kaldırmaya devam etmek.","vi":"Cố làm đến nửa đêm và tiếp tục nhấc các thùng hàng.","ar":"الاستمرار حتى منتصف الليل ومتابعة رفع الصناديق."},"Au … ich hab mich schon zweimal vertippt.":{"tr":"Ay … iki kez yanlış tuşladım bile.","vi":"Úi … tôi đã bấm nhầm hai lần rồi.","ar":"آه … أخطأت مرتين في الإدخال."},"Ohne Pause steigen Fehler und Rückenschmerzen. Schwere Ware wird mit dem Handscanner erfasst.":{"tr":"Mola olmazsa hatalar ve sırt ağrıları artar. Ağır mallar el tarayıcısıyla okutulur.","vi":"Không nghỉ thì lỗi và đau lưng tăng lên. Hàng nặng được quét bằng máy quét cầm tay.","ar":"بدون استراحة تزداد الأخطاء وآلام الظهر. البضاعة الثقيلة تُسجَّل بالماسح اليدوي."},"…weil Pausen helfen, konzentriert zu bleiben, und ein eingestellter Arbeitsplatz den Rücken schont.":{"tr":"…çünkü molalar odaklanmış kalmaya yardımcı olur ve ayarlanmış bir iş yeri sırtı korur.","vi":"…vì nghỉ giải lao giúp giữ sự tập trung, và chỗ làm việc được chỉnh phù hợp giúp bảo vệ lưng.","ar":"…لأن الاستراحات تساعد على البقاء مركّزاً، ومكان العمل المضبوط يحمي الظهر."},"…weil Pausen nur Jugendlichen zustehen.":{"tr":"…çünkü molalar sadece gençlerin hakkıdır.","vi":"…vì chỉ thanh thiếu niên mới được nghỉ giải lao.","ar":"…لأن الاستراحات من حق الأحداث فقط."},"…weil man an der Kasse nur sitzen darf.":{"tr":"…çünkü kasada sadece oturmaya izin vardır.","vi":"…vì ở quầy thu ngân chỉ được phép ngồi.","ar":"…لأنه لا يجوز الجلوس عند الصندوق وأنت جالس."},"Gast mit Bollerwagen":{"tr":"Çekçekli müşteri","vi":"Khách với xe kéo","ar":"ضيفة مع عربة يد"},"Frau Lüders legt nur die Chips aufs Band. Unten in ihrem Bollerwagen liegt noch ein Karton Wasser.":{"tr":"Bayan Lüders banda sadece cipsi koyuyor. Aşağıda çekçeğinde bir koli su daha duruyor.","vi":"Bà Lüders chỉ đặt túi khoai tây chiên lên băng chuyền. Bên dưới xe kéo của bà còn một thùng nước.","ar":"السيدة Lüders تضع الشيبس فقط على السير. وفي الأسفل في عربتها كرتونة ماء."},"Diebstahlprävention":{"tr":"Hırsızlığın önlenmesi","vi":"Phòng chống trộm cắp (Diebstahlprävention)","ar":"منع السرقة (Diebstahlprävention)"},"Einkaufswagen und Umverpackungen kontrollieren, damit nichts vergessen oder versteckt wird. Freundlich ansprechen.":{"tr":"Alışveriş arabasını ve dış ambalajları kontrol et, böylece hiçbir şey unutulmaz veya saklanmaz. Samimi bir şekilde hitap et.","vi":"Kiểm tra xe đẩy và bao bì ngoài để không bị quên hoặc giấu hàng. Hỏi thân thiện.","ar":"فحص عربة التسوق والتغليف الخارجي حتى لا يُنسى شيء ولا يُخبَّأ. والتحدث مع الزبون بلطف."},"Aspekt: Diebstahlprävention. „Könnten Sie bitte Ihren Korb einmal kurz anheben, damit ich sehe, ob noch etwas darunter liegt?“":{"tr":"Konu: Hırsızlığın önlenmesi. „Sepetinizi bir an kaldırabilir misiniz, altında başka bir şey var mı göreyim?“","vi":"Khía cạnh: phòng chống trộm cắp. „Bạn vui lòng nhấc giỏ lên một chút để tôi xem phía dưới còn gì không ạ?“","ar":"الجانب: منع السرقة (Diebstahlprävention). „هل يمكنك رفع سلتك قليلاً من فضلك، لأرى إن كان تحتها شيء؟“"},"„Unten im Wagen liegt noch ein Karton Wasser. Den scanne ich gleich mit, dann müssen Sie ihn nicht heben.“":{"tr":"„Arabanın altında bir koli su daha var. Onu hemen okutayım, o zaman kaldırmak zorunda kalmazsınız.“","vi":"„Phía dưới xe còn một thùng nước. Tôi sẽ quét luôn, bà không cần phải nhấc lên.“","ar":"„في أسفل العربة كرتونة ماء. سأمسحها معكم الآن، فلا داعي لأن ترفعوها.“"},"Oh, den hätte ich glatt vergessen. Danke!":{"tr":"Ah, onu neredeyse unutuyordum. Teşekkürler!","vi":"Ôi, tôi quên mất thùng đó. Cảm ơn!","ar":"آه، كدت أنساها. شكراً!"},"Diebstahlprävention: Den Wagen kontrollieren, damit nichts vergessen oder versteckt wird – höflich und als Service.":{"tr":"Hırsızlığın önlenmesi: Arabayı kontrol et, böylece hiçbir şey unutulmaz veya saklanmaz – kibarca ve hizmet olarak.","vi":"Phòng chống trộm cắp: Kiểm tra xe để không bị quên hoặc giấu hàng – lịch sự và như một dịch vụ.","ar":"منع السرقة (Diebstahlprävention): فحص العربة حتى لا يُنسى شيء ولا يُخبَّأ – بأدب وكأنه خدمة."},"Nichts sagen und nur die Chips kassieren.":{"tr":"Hiçbir şey söylememek ve sadece cipsin parasını almak.","vi":"Không nói gì và chỉ tính tiền túi khoai tây chiên.","ar":"عدم قول شيء وتحصيل ثمن الشيبس فقط."},"Tschüss!":{"tr":"Hoşça kal!","vi":"Tạm biệt!","ar":"إلى اللقاء!"},"Der Karton wird nicht bezahlt. Der Wagen wird kontrolliert.":{"tr":"Koli ödenmiyor. Araba kontrol edilmeli.","vi":"Thùng nước không được thanh toán. Cần kiểm tra xe.","ar":"لا يُدفع ثمن الكرتونة. العربة تُفحص."},"„Sie wollen wohl das Wasser klauen?“":{"tr":"„Suyu çalmak istiyorsunuz herhalde?“","vi":"„Bà định lấy trộm nước đúng không?“","ar":"„هل تريدين أن تسرقي الماء؟“"},"Wie bitte?! Das ist ja unverschämt!":{"tr":"Efendim?! Bu çok terbiyesizlik!","vi":"Cái gì?! Thật là xấc xược!","ar":"ماذا؟! هذه وقاحة!"},"Man beschuldigt niemanden. Man spricht es freundlich als Service an.":{"tr":"Kimse suçlanmaz. Konu samimi bir şekilde hizmet olarak söylenir.","vi":"Không buộc tội ai. Hãy hỏi thân thiện như một dịch vụ.","ar":"لا يُتَّهم أحد. بل يُذكَر الأمر بلطف كخدمة."},"…weil man den Wagen kontrolliert, damit nichts vergessen oder versteckt wird – und es höflich anspricht.":{"tr":"…çünkü araba kontrol edilir, böylece hiçbir şey unutulmaz veya saklanmaz – ve bu kibarca söylenir.","vi":"…vì ta kiểm tra xe để không bị quên hoặc giấu hàng – và hỏi một cách lịch sự.","ar":"…لأن العربة تُفحص حتى لا يُنسى شيء ولا يُخبَّأ – ويُقال ذلك بأدب."},"…weil man Kunden mit Bollerwagen immer durchsuchen muss.":{"tr":"…çünkü çekçekli müşteriler her zaman aranmalıdır.","vi":"…vì khách có xe kéo thì lúc nào cũng phải khám xét.","ar":"…لأنه يجب تفتيش الزبائن أصحاب عربات اليد دائماً."},"…weil Getränke nicht gescannt werden müssen.":{"tr":"…çünkü içecekler okutulmak zorunda değildir.","vi":"…vì đồ uống không cần phải quét.","ar":"…لأن المشروبات لا يلزم مسحها."},"Ein 17-Jähriger möchte eine Flasche Wein und eine Flasche Wodka kaufen. Was darfst du verkaufen?":{"tr":"17 yaşında biri bir şişe şarap ve bir şişe votka almak istiyor. Ne satabilirsin?","vi":"Một thanh niên 17 tuổi muốn mua một chai rượu vang và một chai vodka. Bạn được phép bán gì?","ar":"شاب عمره 17 سنة يريد شراء زجاجة نبيذ وزجاجة فودكا. ماذا يجوز لك أن تبيع؟"},"Nur den Wein – Wodka ist Branntwein und erst ab 18.":{"tr":"Sadece şarabı – votka Branntwein (damıtılmış sert içki) ve ancak 18 yaşından itibaren.","vi":"Chỉ rượu vang – vodka là rượu mạnh (Branntwein) và chỉ từ 18 tuổi.","ar":"النبيذ فقط – الفودكا مشروب روحي قوي (Branntwein) وهي من عمر 18."},"Beides – er ist ja fast 18.":{"tr":"İkisini de – neredeyse 18 yaşında zaten.","vi":"Bán cả hai – cậu ấy gần 18 tuổi rồi.","ar":"الاثنين – فهو تقريباً 18."},"Nichts – Alkohol gibt es erst ab 18.":{"tr":"Hiçbirini – alkol ancak 18 yaşından itibaren verilir.","vi":"Không bán gì – rượu chỉ từ 18 tuổi.","ar":"لا شيء – الكحول من عمر 18 فقط."},"Ein Stand führt „Challenge 25“ ein: Ausweis von allen, die jünger als 25 aussehen. Was ist der Vorteil für die Kassenkraft?":{"tr":"Bir stant „Challenge 25“ uygulamasını getiriyor: 25 yaşından genç görünen herkesten kimlik istenir. Kasiyer için avantajı nedir?","vi":"Một quầy áp dụng „Challenge 25“: kiểm tra giấy tờ của tất cả những ai trông trẻ hơn 25 tuổi. Lợi ích cho nhân viên thu ngân là gì?","ar":"كشك يعتمد „Challenge 25“: طلب الهوية من كل من يبدو أصغر من 25 سنة. ما فائدة ذلك للموظفة عند الصندوق؟"},"Sie hat eine klare Regel, muss nicht schätzen und hat weniger Diskussionen.":{"tr":"Net bir kuralı olur, tahmin etmek zorunda kalmaz ve daha az tartışma yaşar.","vi":"Có quy tắc rõ ràng, không phải đoán tuổi và ít tranh cãi hơn.","ar":"لديها قاعدة واضحة، ولا تحتاج إلى التخمين، ونقاشات أقل."},"Sie darf dann auch an 17-Jährige Wodka verkaufen.":{"tr":"O zaman 17 yaşındakilere de votka satabilir.","vi":"Khi đó nhân viên cũng được bán vodka cho người 17 tuổi.","ar":"يجوز لها حينئذٍ بيع الفودكا لمن عمره 17 سنة أيضاً."},"Sie muss nie mehr einen Ausweis prüfen.":{"tr":"Artık hiçbir zaman kimlik kontrol etmek zorunda kalmaz.","vi":"Nhân viên không bao giờ phải kiểm tra giấy tờ nữa.","ar":"لن تحتاج أبداً إلى فحص الهوية بعد الآن."},"Kassenschluss":{"tr":"Kasa kapanışı","vi":"Kết thúc ca thu ngân","ar":"إغلاق الصندوق"},"Kassenabrechnung":{"tr":"Kasa hesabı","vi":"Quyết toán quỹ (Kassenabrechnung)","ar":"تسوية الصندوق (Kassenabrechnung)"},"Samstag, 23:30 Uhr. Die Bühne ist dunkel. Jana ist endlich da – mit dem Lieferwagen. „Zeigt mir eure Abrechnung!“ Bei Kevin nebenan ist es auffällig still. Dort war vorhin das Ordnungsamt.":{"tr":"Cumartesi, saat 23:30. Sahne karanlık. Jana nihayet geldi – teslimat aracıyla. „Hesabınızı gösterin bana!“ Yandaki Kevin'de çok sessiz. Az önce orada düzenleme denetim ofisi (Ordnungsamt) vardı.","vi":"Thứ Bảy, 23:30. Sân khấu tối đen. Jana cuối cùng cũng đến – bằng xe tải giao hàng. „Cho tôi xem bản quyết toán của các bạn!“ Bên Kevin cạnh đó yên ắng lạ thường. Lúc nãy cơ quan quản lý trật tự đã đến đó.","ar":"السبت، الساعة 23:30. المسرح مظلم. وصلت Jana أخيراً – بسيارة التوصيل. „أروني حساباتكم!“ عند Kevin بجانبكم الوضع هادئ بشكل لافت. كان عنده قبل قليل مكتب النظام (Ordnungsamt)."},"der Kassenanfangsbestand":{"tr":"kasa açılış bakiyesi","vi":"số tiền đầu ca trong quỹ","ar":"رصيد بداية الصندوق (Kassenanfangsbestand)"},"die Abschöpfung":{"tr":"kasadan ara para çekme","vi":"việc rút bớt tiền khỏi quỹ giữa ca","ar":"سحب جزء من النقد من الصندوق (Abschöpfung)"},"der Kassenschlussbestand":{"tr":"kasa kapanış bakiyesi","vi":"số tiền trong quỹ cuối ca","ar":"رصيد نهاية الصندوق (Kassenschlussbestand)"},"die Tageslosung":{"tr":"günlük nakit hasılat","vi":"doanh thu tiền mặt trong ngày","ar":"حصيلة اليوم النقدية (Tageslosung)"},"der Tagesumsatz":{"tr":"günlük ciro","vi":"doanh thu trong ngày","ar":"مبيعات اليوم (Tagesumsatz)"},"der Kassenbericht":{"tr":"kasa raporu","vi":"báo cáo quỹ","ar":"تقرير الصندوق (Kassenbericht)"},"der Soll-Bestand":{"tr":"olması gereken bakiye (Soll)","vi":"số tiền theo sổ sách (Soll)","ar":"الرصيد المطلوب (Soll-Bestand)"},"der Ist-Bestand":{"tr":"gerçek bakiye (Ist)","vi":"số tiền thực đếm (Ist)","ar":"الرصيد الفعلي (Ist-Bestand)"},"die Kassendifferenz":{"tr":"kasa farkı","vi":"chênh lệch quỹ","ar":"فرق الصندوق (Kassendifferenz)"},"der Überschuss":{"tr":"kasa fazlası","vi":"tiền thừa","ar":"فائض (Überschuss)"},"der Fehlbetrag":{"tr":"kasa açığı","vi":"tiền thiếu","ar":"عجز (Fehlbetrag)"},"der Kassensturz":{"tr":"kasa sayımı (sürpriz kasa kontrolü)","vi":"kiểm kê quỹ đột xuất","ar":"جرد الصندوق المفاجئ (Kassensturz)"},"hat den Kassenbericht geschrieben":{"tr":"kasa raporunu yazdı","vi":"đã viết báo cáo quỹ","ar":"كتب تقرير الصندوق"},"Lina zeigt ihren Kassenbericht. Sie hat die Abschöpfung von 2.000 € abgezogen und das Wechselgeld von 300 € addiert.":{"tr":"Lina kasa raporunu gösteriyor. 2.000 € lik kasadan ara para çekmeyi çıkarmış ve 300 € lik bozuk parayı toplamış.","vi":"Lina đưa báo cáo quỹ của mình. Cô ấy đã trừ khoản rút bớt tiền (Abschöpfung) 2.000 € và cộng tiền lẻ để thối (Wechselgeld) 300 €.","ar":"تعرض Lina تقرير الصندوق الخاص بها. لقد طرحت مبلغ الـ Abschöpfung (سحب النقد) وهو 2.000 € وأضافت الفكّة (Wechselgeld) وهي 300 €."},"Kassenbericht":{"tr":"Kasa raporu","vi":"Báo cáo quỹ (Kassenbericht)","ar":"تقرير الصندوق (Kassenbericht)"},"Kassenschlussbestand + Abschöpfungen − Wechselgeld = Tageslosung. Tageslosung + Kartenzahlungen = Tagesumsatz.":{"tr":"Kasa kapanış bakiyesi + kasadan ara para çekmeler − bozuk para = günlük nakit hasılat. Günlük nakit hasılat + kartlı ödemeler = günlük ciro.","vi":"Số tiền cuối ca + các khoản rút bớt − tiền lẻ để thối = doanh thu tiền mặt trong ngày (Tageslosung). Doanh thu tiền mặt trong ngày + thanh toán bằng thẻ = doanh thu trong ngày (Tagesumsatz).","ar":"رصيد نهاية الصندوق + المسحوبات − الفكّة = حصيلة اليوم النقدية. حصيلة اليوم النقدية + الدفع بالبطاقات = مبيعات اليوم."},"Merksatz: Alles, was aus der Kasse genommen wurde, wird addiert. Das Wechselgeld, das schon morgens drin war, wird abgezogen.":{"tr":"Hatırlatma cümlesi: Kasadan alınan her şey toplanır. Sabahtan beri içinde olan bozuk para çıkarılır.","vi":"Ghi nhớ: Tất cả tiền đã lấy ra khỏi quỹ thì được cộng vào. Tiền lẻ để thối đã có sẵn từ sáng thì bị trừ đi.","ar":"قاعدة للحفظ: كل ما أُخذ من الصندوق يُجمع. أما الفكّة التي كانت في الصندوق منذ الصباح فتُطرح."},"„Andersherum: Die Abschöpfung wird addiert, das Wechselgeld wird abgezogen.“":{"tr":"„Tersi: Kasadan ara para çekme toplanır, bozuk para çıkarılır.“","vi":"„Ngược lại: Khoản rút bớt phải cộng vào, tiền lẻ để thối phải trừ đi.“","ar":"„بالعكس: المبلغ المسحوب يُجمع، والفكّة تُطرح.“"},"Ach so! Die 2.000 € haben wir ja eingenommen. Ich rechne neu.":{"tr":"Anladım! O 2.000 € yi biz kazandık zaten. Yeniden hesaplıyorum.","vi":"À ra vậy! 2.000 € này chúng ta đã thu được mà. Tôi tính lại.","ar":"آه فهمت! لقد استلمنا الـ 2.000 € فعلاً. سأحسب من جديد."},"Alles, was aus der Kasse genommen wurde, wird addiert. Das Wechselgeld war schon morgens drin und ist kein Umsatz – es wird abgezogen.":{"tr":"Kasadan alınan her şey toplanır. Bozuk para sabahtan beri içindeydi ve ciro değildir – çıkarılır.","vi":"Tất cả tiền đã lấy ra khỏi quỹ thì được cộng vào. Tiền lẻ để thối đã có sẵn từ sáng và không phải doanh thu – nó bị trừ đi.","ar":"كل ما أُخذ من الصندوق يُجمع. الفكّة كانت في الصندوق منذ الصباح وليست مبيعات – لذلك تُطرح."},"„Nur das Wechselgeld musst du abziehen. Der Rest stimmt.“":{"tr":"„Sadece bozuk parayı çıkarman gerekiyor. Gerisi doğru.“","vi":"„Bạn chỉ cần trừ tiền lẻ để thối. Phần còn lại đúng rồi.“","ar":"„عليك أن تطرحي الفكّة فقط. الباقي صحيح.“"},"Okay … aber die Zahl ist immer noch so klein.":{"tr":"Tamam … ama sayı hâlâ çok küçük.","vi":"Ok … nhưng con số vẫn nhỏ quá.","ar":"حسناً … لكن الرقم ما زال صغيراً جداً."},"Das Wechselgeld ist richtig korrigiert. Die Abschöpfung ist aber auch Umsatz und wird addiert.":{"tr":"Bozuk para doğru düzeltildi. Ama kasadan ara para çekme de cirodur ve toplanır.","vi":"Tiền lẻ để thối đã sửa đúng. Nhưng khoản rút bớt cũng là doanh thu và phải được cộng vào.","ar":"الفكّة صُحّحت بشكل صحيح. لكن المبلغ المسحوب هو أيضاً من المبيعات ويُجمع."},"„Stimmt so. Was aus der Kasse genommen wurde, ist weg.“":{"tr":"„Böyle doğru. Kasadan alınan gitmiştir.“","vi":"„Đúng rồi. Tiền đã lấy ra khỏi quỹ là mất rồi.“","ar":"„هكذا صحيح. ما أُخذ من الصندوق ذهب.“"},"Dann haben wir heute ja kaum was verdient?!":{"tr":"O zaman bugün neredeyse hiç kazanmadık mı?!","vi":"Vậy hôm nay chúng ta hầu như không kiếm được gì sao?!","ar":"إذن لم نربح اليوم تقريباً شيئاً؟!"},"Die Abschöpfung ist eingenommenes Geld, das nur nicht mehr in der Kasse liegt. Sie wird addiert.":{"tr":"Kasadan ara para çekme, kazanılmış paradır, sadece artık kasada durmuyor. Toplanır.","vi":"Khoản rút bớt là tiền đã thu, chỉ là không còn nằm trong quỹ. Nó được cộng vào.","ar":"المبلغ المسحوب هو نقد مُستلَم، لكنه لم يعد موجوداً في الصندوق. لذلك يُجمع."},"…weil die Abschöpfung eingenommenes Geld ist und das Wechselgeld schon morgens in der Kasse war.":{"tr":"…çünkü kasadan ara para çekme kazanılmış paradır ve bozuk para sabahtan beri kasadaydı.","vi":"…vì khoản rút bớt là tiền đã thu và tiền lẻ để thối đã có trong quỹ từ sáng.","ar":"…لأن المبلغ المسحوب نقد مُستلَم، والفكّة كانت في الصندوق منذ الصباح."},"…weil das Wechselgeld zum Umsatz gehört.":{"tr":"…çünkü bozuk para cirodan sayılır.","vi":"…vì tiền lẻ để thối thuộc về doanh thu.","ar":"…لأن الفكّة جزء من المبيعات."},"…weil Kartenzahlungen von der Tageslosung abgezogen werden.":{"tr":"…çünkü kartlı ödemeler günlük nakit hasılattan çıkarılır.","vi":"…vì thanh toán bằng thẻ bị trừ khỏi doanh thu tiền mặt trong ngày.","ar":"…لأن الدفع بالبطاقات يُطرح من حصيلة اليوم النقدية."},"eure Chefin":{"tr":"patroniçeniz","vi":"bà chủ của các bạn","ar":"مديرتكم"},"Jana fragt: „Wie hoch war heute die Tageslosung?“ Lina will die Kartenzahlungen dazurechnen.":{"tr":"Jana soruyor: „Bugünkü günlük nakit hasılat ne kadardı?“ Lina kartlı ödemeleri de eklemek istiyor.","vi":"Jana hỏi: „Doanh thu tiền mặt trong ngày hôm nay là bao nhiêu?“ Lina muốn cộng thêm các khoản thanh toán bằng thẻ.","ar":"تسأل Jana: „كم كانت حصيلة اليوم النقدية (Tageslosung)؟“ تريد Lina أن تضيف الدفع بالبطاقات."},"Was ist richtig?":{"tr":"Hangisi doğru?","vi":"Điều nào đúng?","ar":"ما الصحيح؟"},"Tageslosung und Tagesumsatz":{"tr":"Günlük nakit hasılat ve günlük ciro","vi":"Doanh thu tiền mặt trong ngày (Tageslosung) và doanh thu trong ngày (Tagesumsatz)","ar":"حصيلة اليوم النقدية ومبيعات اليوم (Tageslosung und Tagesumsatz)"},"Tageslosung = alle Bareinnahmen. Tagesumsatz = bar + Karte.":{"tr":"Günlük nakit hasılat = tüm nakit gelirler. Günlük ciro = nakit + kart.","vi":"Tageslosung = toàn bộ tiền mặt thu được. Tagesumsatz = tiền mặt + thẻ.","ar":"حصيلة اليوم النقدية = كل الإيرادات النقدية. مبيعات اليوم = النقد + البطاقة."},"„Ermitteln Sie den Tagesumsatz! Geben Sie den Rechenweg an!“ – je 1 Punkt für das Addieren, das Subtrahieren und das Ergebnis.":{"tr":"„Günlük ciroyu hesaplayın! Hesap yolunu yazın!“ – toplama, çıkarma ve sonuç için 1 er puan.","vi":"„Hãy tính doanh thu trong ngày! Nêu cách tính!“ – mỗi bước 1 điểm: phép cộng, phép trừ và kết quả.","ar":"„احسب مبيعات اليوم! اذكر طريقة الحساب!“ – 1 نقطة لكل من الجمع والطرح والنتيجة."},"„Tageslosung sind nur die Bareinnahmen. Bar plus Karte ist der Tagesumsatz.“":{"tr":"„Günlük nakit hasılat sadece nakit gelirdir. Nakit artı kart günlük cirodur.“","vi":"„Tageslosung chỉ là tiền mặt thu được. Tiền mặt cộng thẻ là Tagesumsatz.“","ar":"„حصيلة اليوم النقدية هي الإيرادات النقدية فقط. النقد زائد البطاقة هو مبيعات اليوم.“"},"Genau. Und beides will ich sehen.":{"tr":"Aynen. Ve ikisini de görmek istiyorum.","vi":"Chính xác. Và tôi muốn xem cả hai.","ar":"بالضبط. وأريد أن أرى الاثنين."},"Tageslosung = alle Bareinnahmen eines Tages. Tagesumsatz = alle Einnahmen: bar + Karte.":{"tr":"Günlük nakit hasılat = bir günün tüm nakit gelirleri. Günlük ciro = tüm gelirler: nakit + kart.","vi":"Tageslosung = toàn bộ tiền mặt thu được trong một ngày. Tagesumsatz = toàn bộ khoản thu: tiền mặt + thẻ.","ar":"حصيلة اليوم النقدية = كل الإيرادات النقدية في يوم واحد. مبيعات اليوم = كل الإيرادات: النقد + البطاقة."},"„Tageslosung ist das Geld, das jetzt in der Kasse liegt.“":{"tr":"„Günlük nakit hasılat, şu an kasada duran paradır.“","vi":"„Tageslosung là số tiền hiện đang nằm trong quỹ.“","ar":"„حصيلة اليوم النقدية هي المال الموجود الآن في الصندوق.“"},"Nein, das ist der Kassenschlussbestand. Da fehlt was.":{"tr":"Hayır, o kasa kapanış bakiyesidir. Eksik var.","vi":"Không, đó là số tiền trong quỹ cuối ca. Thiếu mất một phần.","ar":"لا، هذا هو رصيد نهاية الصندوق. وينقصه شيء."},"In der Kasse liegt der Kassenschlussbestand. Für die Tageslosung kommt die Abschöpfung dazu, das Wechselgeld kommt weg.":{"tr":"Kasada kasa kapanış bakiyesi durur. Günlük nakit hasılat için kasadan ara para çekme eklenir, bozuk para çıkar.","vi":"Trong quỹ là số tiền cuối ca. Để có Tageslosung thì cộng thêm khoản rút bớt, và bỏ đi tiền lẻ để thối.","ar":"في الصندوق يوجد رصيد نهاية الصندوق (Kassenschlussbestand). ولحساب حصيلة اليوم النقدية يُضاف المبلغ المسحوب وتُطرح الفكّة."},"„Tageslosung ist alles zusammen: bar und Karte.“":{"tr":"„Günlük nakit hasılat hepsi birlikte: nakit ve kart.“","vi":"„Tageslosung là tất cả gộp lại: tiền mặt và thẻ.“","ar":"„حصيلة اليوم النقدية هي كل شيء معاً: النقد والبطاقة.“"},"Das ist der Tagesumsatz. Nicht verwechseln!":{"tr":"O günlük cirodur. Karıştırmayın!","vi":"Đó là Tagesumsatz. Đừng nhầm lẫn!","ar":"هذه هي مبيعات اليوم. لا تخلط بينهما!"},"Bar + Karte ist der Tagesumsatz. Die Tageslosung umfasst nur das Bargeld.":{"tr":"Nakit + kart günlük cirodur. Günlük nakit hasılat sadece nakit parayı kapsar.","vi":"Tiền mặt + thẻ là Tagesumsatz. Tageslosung chỉ gồm tiền mặt.","ar":"النقد + البطاقة هو مبيعات اليوم. أما حصيلة اليوم النقدية فتشمل النقود فقط."},"…weil die Tageslosung nur das Bargeld umfasst und erst mit den Kartenzahlungen der Tagesumsatz entsteht.":{"tr":"…çünkü günlük nakit hasılat sadece nakit parayı kapsar ve günlük ciro ancak kartlı ödemelerle oluşur.","vi":"…vì Tageslosung chỉ gồm tiền mặt và chỉ khi cộng thêm thanh toán bằng thẻ mới thành Tagesumsatz.","ar":"…لأن حصيلة اليوم النقدية تشمل النقود فقط، ومبيعات اليوم تنتج فقط بإضافة الدفع بالبطاقات."},"…weil Kartenzahlungen immer zur Tageslosung gehören.":{"tr":"…çünkü kartlı ödemeler her zaman günlük nakit hasılata dahildir.","vi":"…vì thanh toán bằng thẻ luôn thuộc về Tageslosung.","ar":"…لأن الدفع بالبطاقات يدخل دائماً في حصيلة اليوم النقدية."},"…weil die Tageslosung das Wechselgeld für morgen ist.":{"tr":"…çünkü günlük nakit hasılat yarın için bozuk paradır.","vi":"…vì Tageslosung là tiền lẻ để thối cho ngày mai.","ar":"…لأن حصيلة اليوم النقدية هي الفكّة لليوم التالي."},"Laut Kasse sollen 1.230,00 € in der Kasse sein (Soll). Ihr zählt 1.235,00 € (Ist). Lina jubelt: „5 € Trinkgeld für uns!“":{"tr":"Kasaya göre kasada 1.230,00 € olmalı (Soll). Siz 1.235,00 € sayıyorsunuz (Ist). Lina sevinçle bağırıyor: „Bize 5 € bahşiş!“","vi":"Theo sổ sách, trong quỹ phải có 1.230,00 € (Soll). Các bạn đếm được 1.235,00 € (Ist). Lina reo lên: „5 € tiền boa cho chúng ta!“","ar":"حسب الصندوق يجب أن يكون في الصندوق 1.230,00 € (المطلوب، Soll). أنتم تعدّون 1.235,00 € (الفعلي، Ist). تفرح Lina: „5 € بقشيش لنا!“"},"Was sagt ihr?":{"tr":"Ne dersiniz?","vi":"Các bạn nói gì?","ar":"ماذا تقولون؟"},"Kassendifferenz":{"tr":"Kasa farkı","vi":"Chênh lệch quỹ (Kassendifferenz)","ar":"فرق الصندوق (Kassendifferenz)"},"Ist − Soll. Plus = Überschuss (zu viel Geld). Minus = Fehlbetrag (zu wenig Geld).":{"tr":"Ist − Soll. Artı = kasa fazlası (fazla para). Eksi = kasa açığı (az para).","vi":"Ist − Soll. Dương = thừa tiền (Überschuss, nhiều tiền hơn). Âm = thiếu tiền (Fehlbetrag, ít tiền hơn).","ar":"الفعلي − المطلوب. زائد = فائض (مال زائد). ناقص = عجز (مال ناقص)."},"5 € zu viel in der Kasse – mögliche Gründe: zu wenig Wechselgeld herausgegeben, Wechselgeld stimmte schon beim Einzählen nicht, Eingabefehler.":{"tr":"Kasada 5 € fazla – olası nedenler: çok az para üstü verildi, bozuk para daha baştan yanlış sayıldı, giriş hatası.","vi":"Thừa 5 € trong quỹ – nguyên nhân có thể: thối lại quá ít, tiền lẻ để thối đã sai ngay khi đếm đầu ca, nhập sai.","ar":"5 € زيادة في الصندوق – أسباب ممكنة: إعطاء باقٍ أقل من اللازم، أو أن الفكّة لم تكن صحيحة عند العدّ الأول، أو خطأ في الإدخال."},"„Das ist ein Überschuss von 5 €. Den melden wir und suchen die Ursache, z. B. zu wenig Rückgeld gegeben.“":{"tr":"„Bu 5 € lik bir kasa fazlası. Bunu bildiriyoruz ve nedenini arıyoruz, örneğin çok az para üstü verildi.“","vi":"„Đây là khoản thừa 5 €. Chúng ta báo cáo và tìm nguyên nhân, ví dụ thối lại quá ít.“","ar":"„هذا فائض (Überschuss) قدره 5 €. سنبلّغ عنه ونبحث عن السبب، مثلاً إعطاء باقٍ أقل من اللازم.“"},"Richtig. Vielleicht hat ein Gast zu wenig zurückbekommen.":{"tr":"Doğru. Belki bir misafir az para üstü aldı.","vi":"Đúng. Có thể một khách đã nhận thối lại quá ít.","ar":"صحيح. ربما حصل ضيف على باقٍ أقل من اللازم."},"Ist − Soll = +5 € → Überschuss. Ursachen: zu wenig Rückgeld, Wechselgeld stimmte morgens nicht, Eingabefehler.":{"tr":"Ist − Soll = +5 € → kasa fazlası. Nedenler: az para üstü, sabah bozuk para yanlıştı, giriş hatası.","vi":"Ist − Soll = +5 € → thừa tiền (Überschuss). Nguyên nhân: thối lại quá ít, tiền lẻ để thối buổi sáng không khớp, nhập sai.","ar":"الفعلي − المطلوب = +5 € ← فائض. الأسباب: باقٍ أقل من اللازم، أو أن الفكّة لم تكن صحيحة صباحاً، أو خطأ في الإدخال."},"„Das ist ein Fehlbetrag. Wir legen 5 € aus eigener Tasche dazu.“":{"tr":"„Bu bir kasa açığı. 5 € yi kendi cebimizden ekliyoruz.“","vi":"„Đây là khoản thiếu tiền. Chúng ta bù 5 € từ tiền túi của mình.“","ar":"„هذا عجز (Fehlbetrag). سنضيف 5 € من جيبنا.“"},"Fehlbetrag? Es ist doch zu viel Geld da!":{"tr":"Kasa açığı mı? Para fazla ki!","vi":"Thiếu tiền ư? Rõ ràng đang thừa tiền mà!","ar":"عجز؟ المال هنا زائد!"},"Zu viel Geld ist ein Überschuss, kein Fehlbetrag. Ein Fehlbetrag heißt: zu wenig Geld.":{"tr":"Fazla para kasa fazlasıdır, kasa açığı değil. Kasa açığı: az para demektir.","vi":"Thừa tiền là Überschuss, không phải Fehlbetrag. Fehlbetrag nghĩa là thiếu tiền.","ar":"المال الزائد فائض وليس عجزاً. العجز يعني: مال ناقص."},"„Super, die 5 € teilen wir uns!“":{"tr":"„Süper, 5 € yi paylaşırız!“","vi":"„Tuyệt, 5 € này chúng ta chia nhau!“","ar":"„ممتاز، سنتقاسم الـ 5 €!“"},"Auf keinen Fall. Das Geld gehört dem Betrieb.":{"tr":"Asla. Para işletmeye aittir.","vi":"Tuyệt đối không. Số tiền này thuộc về cửa hàng.","ar":"إطلاقاً لا. المال يخص المحل."},"Eine Kassendifferenz wird gemeldet. Das Geld gehört dem Betrieb, vielleicht auch einem Kunden.":{"tr":"Kasa farkı bildirilir. Para işletmeye aittir, belki de bir müşteriye.","vi":"Chênh lệch quỹ phải được báo cáo. Số tiền thuộc về cửa hàng, có thể cũng là của một khách hàng.","ar":"فرق الصندوق يُبلَّغ عنه. المال يخص المحل، وربما يخص زبوناً أيضاً."},"…weil Ist minus Soll plus 5 € ergibt – zu viel Geld ist ein Überschuss, und der hat eine Ursache.":{"tr":"…çünkü Ist eks
