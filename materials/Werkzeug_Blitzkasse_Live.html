<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blitzkasse Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Atkinson+Hyperlegible:wght@400;700&family=Courier+Prime:wght@400;700&family=VT323&display=swap">
<style>
:root{
  --bg:#e4eaed;--surface:#fff;--surface2:#eef2f4;--ink:#16212a;--muted:#56656f;--line:#cbd5db;
  --brand:#0d7f70;--brand-ink:#fff;--ok:#1f7f45;--bad:#b93434;--warn:#a15c00;
  --lcd-bg:#0d191e;--lcd-fg:#56f0d3;--lcd-dim:#2b5d55;
  --receipt:#fff;--receipt-ink:#2a2e31;--receipt-mut:#7a8085;--promo:#b0283a;
  --m5:#a7b3ad;--m10:#e08a7c;--m20:#86a6e4;--m50:#eeb062;--gold:#d8b54e;--gold-2:#b8932f;--silver:#c9cfd3;--copper:#c98557;--copper-2:#a3633a;--money-ink:#1c1c1c;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --lcd:"VT323",ui-monospace,Menlo,monospace;
  --bon:"Courier Prime","Courier New",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1418;--surface:#172027;--surface2:#1e2931;--ink:#e3eaee;--muted:#95a5b0;--line:#2b3943;
  --brand:#3cc6ae;--brand-ink:#05201b;--ok:#5fd08d;--bad:#ff8c84;--warn:#f0b35a;
  --receipt:#ecece6;--receipt-ink:#23272a;--receipt-mut:#6d7377;--promo:#b0283a;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e1418;--surface:#172027;--surface2:#1e2931;--ink:#e3eaee;--muted:#95a5b0;--line:#2b3943;
  --brand:#3cc6ae;--brand-ink:#05201b;--ok:#5fd08d;--bad:#ff8c84;--warn:#f0b35a;
  --receipt:#ecece6;--receipt-ink:#23272a;--receipt-mut:#6d7377;--promo:#b0283a;color-scheme:dark;}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0 0 .4em;line-height:1.1;text-wrap:balance}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.6em 1em}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input{font:inherit;width:100%;padding:.6em .7em;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.merk{border-left:6px solid var(--brand);background:var(--surface);border-radius:10px;padding:12px 14px;margin:8px 0}
.merk ol{margin:6px 0 0;padding-left:22px}
.pro{font-size:.75rem;font-weight:700;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;font-family:var(--body)}
/* Kassenbon */
.receipt{background:var(--receipt);color:var(--receipt-ink);font-family:var(--bon);padding:14px 18px 8px;border-radius:4px;box-shadow:0 1px 0 var(--line);max-width:460px;width:100%}
.receipt .hd{text-align:center;color:var(--receipt-mut);border-bottom:1px dashed var(--receipt-mut);padding-bottom:6px;margin-bottom:6px;font-size:.85em}
.receipt .hd b{color:var(--receipt-ink);letter-spacing:.12em}
.rr{display:flex;justify-content:space-between;gap:12px;padding:2px 0;font-variant-numeric:tabular-nums}
.rr span:first-child{min-width:0;overflow-wrap:anywhere}
.rr span:last-child{white-space:nowrap}
.rr.b{font-weight:700;border-top:1px dashed var(--receipt-mut);margin-top:5px;padding-top:5px}
.rr.q span:last-child{background:var(--receipt-ink);color:var(--receipt);padding:0 6px;border-radius:3px}
.rr.promo{color:var(--promo)}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.bubble b{display:block;font-size:.85rem;color:var(--muted)}
.ask{font-weight:700;margin:10px 0 0}
.lcdv{background:var(--lcd-bg);color:var(--lcd-fg);font-family:var(--lcd);border-radius:12px;padding:6px 14px;text-align:right;font-size:3rem;line-height:1.1;font-variant-numeric:tabular-nums}
.lcdv small{display:block;text-align:left;font-size:1.1rem;color:var(--lcd-dim);text-transform:uppercase;letter-spacing:.06em}
.lcdv.empty .v{color:var(--lcd-dim)}
/* ---------- Tafel ---------- */
#tafel header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tafel header h1{font-family:var(--lcd);font-size:2.2rem;font-weight:400;margin:0;letter-spacing:.03em}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.steps button{padding:.35em .8em;font-size:.9rem}
.steps button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mini{display:flex;align-items:center;gap:10px;font-size:.9rem}
.mini canvas{width:64px;height:64px;border-radius:6px;background:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px}
.dot.on{background:var(--ok)}
#tMain{padding:20px 22px 40px;max-width:1400px;margin:0 auto}
#tMain .receipt{font-size:1.3rem}
#tMain .receipt.sm{font-size:1rem}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.ctrl button{font-size:1.05rem}
.big{font-size:clamp(1.6rem,3.2vw,2.6rem)}
.join{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:28px;align-items:start}
.join canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:14px}
.code{font-family:var(--display);font-size:3rem;font-weight:800;letter-spacing:.12em}
.nicks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nicks button{padding:.3em .7em;font-size:.95rem}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;align-items:start}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.timer{font-family:var(--display);font-size:3rem;font-weight:800;min-width:2.2em;text-align:center;border-radius:50%;background:var(--surface);border:4px solid var(--brand);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{border-radius:14px;padding:14px 16px;color:#fff;font-size:1.2rem;font-weight:700;position:relative}
.o0{background:#b3261e}.o1{background:#1f5fae}.o2{background:#8a5300}
.opt.wrong{opacity:.35}
.opt .cnt{position:absolute;right:14px;top:10px;font-family:var(--display);font-size:1.6rem}
.sol{font-family:var(--lcd);font-size:3.4rem;line-height:1;color:var(--brand)}
.hbar{display:grid;grid-template-columns:150px 1fr 50px;gap:10px;align-items:center;margin:8px 0;font-size:1.1rem}
.hbar .t{height:30px;border-radius:8px;background:var(--surface2);overflow:hidden}
.hbar .t i{display:block;height:100%}
.hbar b{font-family:var(--display);font-size:1.6rem;text-align:right}
.top{list-style:none;padding:0;margin:0}
.top li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--surface);margin-bottom:6px;font-size:1.15rem}
.top li b{font-family:var(--display)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:24px}
.podium div{background:var(--brand);color:var(--brand-ink);border-radius:14px 14px 0 0;width:200px;text-align:center;padding:12px;font-family:var(--display);font-weight:800}
.podium span{display:block;font-size:1.4rem}
#bVol{width:90px}
@media (max-width:900px){.two,.join,.opts{grid-template-columns:1fr}}
/* ---------- Handy ---------- */
#phone{max-width:560px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 40px max(16px,env(safe-area-inset-right,0px))}
#phone .ph-top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:10px;gap:8px}
.lvl{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.lvl button{text-align:left;border-width:3px;padding:12px}
.lvl button.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--surface))}
.lvl small{display:block;color:var(--muted);font-size:.85rem}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.key{height:56px;font-size:1.6rem;font-weight:700;box-shadow:0 3px 0 var(--line)}
.key.op{background:var(--surface2);font-size:1.15rem}
.key.ok{grid-column:span 2;background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px;margin-top:10px}
.money{border:0;background:none;padding:2px;display:grid;place-items:center;min-height:52px}
.bill{width:62px;height:36px;border-radius:5px;display:grid;place-items:center;font-weight:700;color:var(--money-ink);font-size:.9rem;box-shadow:0 2px 0 #00000030}
.coin{border-radius:50%;display:grid;place-items:center;font-weight:700;color:var(--money-ink);box-shadow:0 2px 0 #00000035;font-size:.75rem}
.lay{display:flex;flex-wrap:wrap;gap:4px;min-height:54px;align-items:center;border:2px dashed var(--line);border-radius:12px;padding:6px;margin-top:8px}
.lay .money{min-height:0}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.status.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.status.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.popt{display:block;width:100%;margin:10px 0;padding:16px 14px;border-radius:14px;color:#fff;border:none;font-size:1.05rem;font-weight:700;text-align:left}
.bigpts{font-family:var(--display);font-size:2.4rem;font-weight:800}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</div>
<div id="phone" hidden></div>

function genMC(q){const order=shuffle([0,1,2]);return{type:"mc",kind:"Profi-Frage",speech:"Kurze Frage an alle, bevor der nächste Kunde kommt.",q:q.q,opts:order.map(i=>q.o[i]),correct:order.indexOf(0),intro:"Begründung:",steps:[q.why],lab:"Profi-Frage",ask:"Wähle die richtige Antwort."};}
const SEQ=["change","sum","discount","coins","mc","change","sum","discount","coins","mc"];
const GENS={change:genChange,sum:genSum,discount:genDiscount,coins:genCoins};
function makeShift(){const names=shuffle(NAMES),qs=shuffle(MC);let m=0;
  return SEQ.map((t,i)=>{if(t==="mc"){const x=genMC(qs[m++]);x.name="Filialleiterin Frau Brandt";return{b:x,p:x};}
    const n=names[i];const b=GENS[t]("basis",n),p=GENS[t]("profi",n);b.name=p.name=n;return{b,p};});}
function ansTxt(t){return t.type==="mc"?t.opts[t.correct]:t.type==="coins"?fmt(t.answer)+" = "+t.best.map(dName).join(" + "):fmt(t.answer);}
const pubTask=t=>({type:t.type,kind:t.kind,speech:t.speech,name:t.name,lines:t.lines,ask:t.ask,lab:t.lab,q:t.q,opts:t.opts,amt:t.type==="coins"?t.answer:undefined});
const DUR={num:40,coins:55,mc:45};
const PHASES=["Start","Schicht","Sieger"];
function bonHTML(t,cls){if(!t||!t.lines)return "";return `<div class="receipt ${cls||""}"><div class="hd"><b>BLITZKASSE</b><br>Filiale Hafenstraße · Kasse 3</div>${t.lines.map(([a,b,c])=>`<div class="rr ${c||""}"><span>${h(a)}</span><span>${h(b)}</span></div>`).join("")}</div>`;}
function moneyEl(d,small){
  if(d>=500){const c={5000:"--m50",2000:"--m20",1000:"--m10",500:"--m5"}[d];return `<span class="bill" style="background:var(${c})${small?";width:46px;height:28px;font-size:.75rem":""}">${d/100} €</span>`;}
  const sz={200:44,100:41,50:40,20:36,10:32,5:34,2:30,1:26}[d]*(small?.75:1);
  let bg;if(d===200)bg="radial-gradient(circle,var(--gold) 52%,var(--silver) 54%)";else if(d===100)bg="radial-gradient(circle,var(--silver) 52%,var(--gold) 54%)";else if(d>=10)bg="radial-gradient(circle at 35% 30%,var(--gold),var(--gold-2))";else bg="radial-gradient(circle at 35% 30%,var(--copper),var(--copper-2))";
  return `<span class="coin" style="width:${sz}px;height:${sz}px;background:${bg};font-size:${small?.62:.75}rem">${d>=100?d/100+"€":d}</span>`;}
</script>
<script>
/* =========================================================
   TAFEL (Lehrkraft, Beamer)
   ========================================================= */
function tafelApp(){
  $("tafel").hidden=false;
  const KEY="blitzkasselive_tafel";
  const fresh=()=>({code:codeGen(),ph:0,pl:{},kick:[],shift:null,q:-1,qOpen:false,qStart:0,qAns:{},url:""});
  let T=store(KEY);if(!T||!T.code)T=fresh();
  let conn={up:0,all:2},pubT=null,subbed="";
  const net=new Net(onMsg,c=>{conn=c;if(c.up)pub();renderHead();});
  function sub(){if(subbed!==T.code){subbed=T.code;net.sub(T.code+"/in");}}
  sub();
  const save=()=>store(KEY,T);
  const players=()=>Object.keys(T.pl);
  const cur=()=>T.shift&&T.q>=0?T.shift[T.q]:null;
  const durNow=()=>{const c=cur();return c?DUR[c.b.type]:40;};
  function grade(t,p,pro,s){
    let ok=0;
    if(t.type==="num"){if(!Number.isInteger(p.v)||p.v<0||p.v>1000000)return null;ok=p.v===t.answer?1:0;}
    else if(t.type==="coins"){if(!Array.isArray(p.l)||p.l.length>60||!p.l.every(x=>DENOMS.includes(x)))return null;
      const sum=p.l.reduce((a,b)=>a+b,0);ok=sum===t.answer?(p.l.length===t.best.length?1:2):0;}
    else{if(!Number.isInteger(p.c)||p.c<0||p.c>2)return null;ok=p.c===t.correct?1:0;}
    const base=1000+500*Math.max(0,1-s/DUR[t.type]);
    const g=ok?Math.round(base*(ok===2?.6:1)*(pro&&t.type!=="mc"?1.5:1)):0;
    return{ok,g,pro:!!pro};
  }
  function onMsg(t,p){
    if(t!==NS+T.code+"/in"||!p||!p.p)return;
    const pid=clean(p.p,12);if(T.kick.includes(pid))return;
    if(p.k==="hi"){const n=clean(p.n,16)||"?";T.pl[pid]={n,pro:!!p.pro};}
    else if(!T.pl[pid])return;
    else if(p.k==="a"&&T.ph===1&&T.qOpen&&p.q===T.q){
      const A=(T.qAns[T.q]=T.qAns[T.q]||{});if(A[pid])return;
      const pro=T.pl[pid].pro,c=cur(),task=pro?c.p:c.b;
      const r=grade(task,p,pro,(Date.now()-T.qStart)/1000);if(!r)return;A[pid]=r;
      if(Object.keys(A).length>=players().length)T.qOpen=false;}
    else return;
    save();pub();render();
  }
  function points(pid){let s=0;for(const qi in T.qAns){if(+qi<T.q||(+qi===T.q&&!T.qOpen)){const a=T.qAns[qi][pid];if(a)s+=a.g;}}return s;}
  function ranking(){return players().map(id=>({id,n:T.pl[id].n,pro:T.pl[id].pro,s:points(id)})).sort((a,b)=>b.s-a.s);}
  function pub(){clearTimeout(pubT);pubT=setTimeout(()=>{
    const c=cur();
    const S={ph:T.ph,kick:T.kick,j:players(),q:T.q,n:T.shift?T.shift.length:SEQ.length,qOpen:T.qOpen,ans:[],cur:null,sol:null};
    if(c){S.cur={b:pubTask(c.b),p:pubTask(c.p)};S.ans=Object.keys(T.qAns[T.q]||{});
      S.rem=T.qOpen?Math.max(0,durNow()-(Date.now()-T.qStart)/1000):0;
      if(!T.qOpen){const sol=t=>({a:ansTxt(t),intro:t.intro,steps:t.steps});S.sol={b:sol(c.b),p:sol(c.p)};}}
    const r=ranking();S.sc={};let rank=0,last=-1;
    r.forEach((x,i)=>{if(x.s!==last){rank=i+1;last=x.s;}const a=(T.qAns[T.q]||{})[x.id];S.sc[x.id]=[x.s,rank,T.qOpen?0:(a?a.g:0),T.qOpen?-1:(a?a.ok:-1)];});S.np=r.length;
    net.pub(T.code+"/st",S,true);},120);}
  setInterval(pub,5000);
  function go(ph){if(ph===1&&!T.shift){T.shift=makeShift();T.q=-1;T.qAns={};}T.ph=ph;T.qOpen=false;save();pub();render();}
  function joinUrl(){
    const extra=(params.get("broker")?"&broker="+encodeURIComponent(params.get("broker")):"")+(LOCAL?"&bc=1":"");
    if(location.protocol.startsWith("http"))return location.origin+location.pathname+"?s="+T.code+extra;
    if(T.url){const u=T.url.trim();return u+(u.includes("?")?"&":"?")+"s="+T.code+extra;}
    if(LOCAL)return location.href.split("?")[0]+"?s="+T.code+extra;return "";}
  function drawQR(canvas,text){
    const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(!text||typeof QRLib==="undefined"){ctx.fillStyle="#999";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText("keine Adresse",canvas.width/2,canvas.height/2);return;}
    const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();
    const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
    ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}
  function renderHead(){
    $("steps").innerHTML=PHASES.map((p,i)=>`<button data-ph="${i}" class="${i===T.ph?"on":""}">${p}</button>`).join("");
    $("steps").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.ph));
    $("miniCode").textContent="Code "+T.code;$("miniN").textContent=players().length+" dabei";
    $("conn").innerHTML=`<span class="dot ${conn.up?"on":""}"></span>${conn.up?"verbunden":"keine Verbindung"}`;
    drawQR($("qrSmall"),joinUrl());}
  function render(){renderHead();const M=$("tMain");[rStart,rShift,rWin][T.ph](M);}

  function rStart(M){
    const pl=Object.entries(T.pl),np=pl.filter(([,x])=>x.pro).length;
    M.innerHTML=`<div class="join"><div><canvas id="qrBig" width="600" height="600"></canvas></div>
      <div><h2 class="big">Kasse 3 ist geöffnet!</h2>
      <p style="font-size:1.25rem">1. QR-Code mit dem Handy scannen.<br>2. Spitznamen eingeben.<br>3. Stufe wählen: <b>Azubi</b> oder <b>Kassenprofi</b> (schwerere Aufgaben, 1,5-fache Punkte).</p>
      <p style="font-size:1.1rem">10 Kunden kommen an die Kasse. Alle rechnen gleichzeitig im Kopf. Richtig gibt 1000 Punkte, schnell gibt bis zu 500 extra.</p>
      <p class="muted">Code: <span class="code">${T.code}</span><br><span id="jU" style="word-break:break-all"></span></p>
      ${location.protocol.startsWith("http")||LOCAL?"":`<label>Internetadresse dieser Seite (nur nötig, wenn die Datei lokal geöffnet ist)<input id="tUrl" value="${h(T.url)}" placeholder="https://…/blitzkasse-live.html"></label>`}
      <h3 style="margin-top:16px">${pl.length} dabei${np?` · davon ${np} Kassenprofi`:""} <span class="muted" style="font-size:.9rem;font-weight:400">· Antippen entfernt einen Namen</span></h3>
      <div class="nicks">${pl.map(([id,x])=>`<button data-id="${h(id)}">${h(x.n)}${x.pro?'<span class="pro">Profi</span>':""}</button>`).join("")}</div>
      <div class="ctrl"><button class="pri" id="bGo">Schicht starten →</button><button id="bNew">Neue Sitzung (alles löschen)</button></div></div></div>`;
    drawQR($("qrBig"),joinUrl());$("jU").textContent=joinUrl();
    if($("tUrl"))$("tUrl").onchange=e=>{T.url=e.target.value;save();render();};
    M.querySelectorAll(".nicks button").forEach(b=>b.onclick=()=>{const id=b.dataset.id;delete T.pl[id];T.kick.push(id);save();pub();render();});
    $("bGo").onclick=()=>go(1);
    $("bNew").onclick=()=>{if(window.confirm("Neue Sitzung starten? Alle Namen und Punkte werden gelöscht.")){const u=T.url;T=fresh();T.url=u;save();sub();pub();render();}};
  }
  function openQ(i){T.q=i;T.qOpen=true;T.qStart=Date.now();save();pub();render();}
  function top5(){const r=ranking();return `<ol class="top">${r.slice(0,5).map((x,i)=>`<li><span>${i+1}. ${h(x.n)}${x.pro?'<span class="pro">Profi</span>':""}</span><b>${x.s}</b></li>`).join("")}</ol>`;}
  function solBlock(t,title,big){return `<div class="box"><h3>${title}</h3><div class="sol" style="${big?"":"font-size:2.2rem"}">${h(ansTxt(t))}</div><div class="merk" style="font-size:${big?1.15:1}rem"><b>${h(t.intro)}</b><ol>${t.steps.map(s=>`<li>${h(s)}</li>`).join("")}</ol></div></div>`;}
  function rShift(M){
    if(!T.shift){go(1);return;}
    if(T.q<0){M.innerHTML=`<h2 class="big">Die Schicht beginnt</h2><p style="font-size:1.25rem">${T.shift.length} Kunden. Jeder Kunde erscheint hier und auf euren Handys. Tippt das Ergebnis ein oder legt das Geld hin. Ihr habt nur einen Versuch.</p>
      <p class="muted">Kassenprofis bekommen eine schwerere Aufgabe vom gleichen Typ und 1,5-fache Punkte. Die beiden Profi-Fragen sind für alle gleich.</p>
      <div class="ctrl"><button class="pri" id="bQ">Erster Kunde →</button></div>`;$("bQ").onclick=()=>openQ(0);return;}
    const c=cur(),b=c.b,A=T.qAns[T.q]||{},n=Object.keys(A).length,dur=durNow(),last=T.q>=T.shift.length-1;
    let body;
    if(b.type==="mc"){const cnt=b.opts.map((_,i)=>Object.values(A).filter(a=>(a.ok===1)===(i===b.correct)).length);
      body=`<div class="bubble"><b>${h(b.name)}</b>${h(b.speech)}</div><h2 class="big">${h(b.q)}</h2>
        <div class="opts" style="grid-template-columns:1fr">${b.opts.map((o,i)=>`<div class="opt o${i} ${!T.qOpen&&i!==b.correct?"wrong":""}">${"ABC"[i]}: ${h(o)}</div>`).join("")}</div>
        ${T.qOpen?"":solBlock(b,"Begründung",true)}`;}
    else{
      body=`<div class="two"><div><div class="bubble"><b>${h(b.name)}</b>${h(b.speech)}</div>${bonHTML(b)}<p class="ask big" style="font-size:1.5rem">${h(b.ask)}</p></div>
        <div>${T.qOpen?`<div class="box"><h3>Kassenprofi-Aufgabe <span class="pro">Profi</span></h3><p class="muted" style="margin:0 0 8px">${h(c.p.speech)}</p>${bonHTML(c.p,"sm")}<p class="ask">${h(c.p.ask)}</p></div>`
          :`${solBlock(b,"Lösung Azubi",true)}<div style="height:12px"></div>${solBlock(c.p,'Lösung Kassenprofi <span class="pro">Profi</span>',false)}`}</div></div>`;}
    let stats="";
    if(!T.qOpen){const v=Object.values(A),r=v.filter(a=>a.ok===1).length,pa=v.filter(a=>a.ok===2).length,f=v.filter(a=>a.ok===0).length,mx=Math.max(1,v.length);
      const bar=(l,x,col)=>`<div class="hbar"><span>${l}</span><div class="t"><i style="width:${x/mx*100}%;background:${col}"></i></div><b>${x}</b></div>`;
      stats=`<div class="two" style="margin-top:18px"><div class="box"><h3>So hat die Klasse kassiert</h3>${bar("richtig",r,"var(--ok)")}${b.type==="coins"?bar("Betrag stimmt, zu viele Teile",pa,"var(--warn)"):""}${bar("falsch",f,"var(--bad)")}${bar("keine Antwort",Math.max(0,players().length-v.length),"var(--line)")}</div>
        <div><h3>Rangliste</h3>${top5()}</div></div>`;}
    M.innerHTML=`<div class="qhead"><div><p class="muted">Kunde ${T.q+1} von ${T.shift.length} · ${n} von ${players().length} geantwortet</p><h2 class="big">${h(b.kind)}</h2></div>
      ${T.qOpen?`<div class="timer" id="tm">${dur}</div>`:""}</div>${body}${stats}
      <div class="ctrl">${T.qOpen?`<button class="pri" id="bR">Auflösen</button>`:!last?`<button class="pri" id="bN">Nächster Kunde →</button>`:`<button class="pri" id="bW">Zur Siegerehrung →</button>`}</div>`;
    if($("bR"))$("bR").onclick=()=>{T.qOpen=false;save();pub();render();};
    if($("bN"))$("bN").onclick=()=>openQ(T.q+1);
    if($("bW"))$("bW").onclick=()=>go(2);
    if(T.qOpen){clearInterval(window._qt);window._qt=setInterval(()=>{const s=Math.max(0,Math.ceil(dur-(Date.now()-T.qStart)/1000));if($("tm"))$("tm").textContent=s;
      if(s<=0&&T.qOpen){T.qOpen=false;save();pub();render();}if(!T.qOpen)clearInterval(window._qt);},250);}
  }
  function rWin(M){
    const r=ranking();
    M.innerHTML=`<h2 class="big">Siegerehrung: Die besten Kassenkräfte</h2>
      <div class="podium">${[1,0,2].filter(i=>r[i]).map(i=>`<div style="height:${[190,150,120][i]}px"><span>${i+1}.</span>${h(r[i].n)}<br>${r[i].s}</div>`).join("")}</div>
      <ol class="top" style="margin:18px auto 0;max-width:620px">${r.slice(3,12).map((x,i)=>`<li><span>${i+4}. ${h(x.n)}${x.pro?'<span class="pro">Profi</span>':""}</span><b>${x.s}</b></li>`).join("")}</ol>
      <div class="ctrl" style="justify-content:center"><button id="bAgain">Neue Schicht mit denselben Namen</button></div>`;
    $("bAgain").onclick=()=>{T.shift=null;T.q=-1;T.qAns={};go(1);};
  }
  render();
}
</script>
<script>
/* =========================================================
   HANDY (Schülerinnen und Schüler)
   ========================================================= */
function phoneApp(){
  $("phone").hidden=false;
  const KEY="blitzkasselive_p_"+roomCode+(params.get("t")||"");
  let me=store(KEY)||{};if(!me.pid){me.pid=rnd(8);store(KEY,me);}
  let S=null,lastKey="",pending=null,qEnd=0,given={},inp="",lay=[],conn={up:0};
  const net=new Net((t,p)=>{if(t===NS+roomCode+"/st"&&p&&typeof p==="object")onState(p);},c=>{conn=c;if(c.up)hello();});
  net.sub(roomCode+"/st");
  const send=o=>{o.p=me.pid;net.pub(roomCode+"/in",o,false);};
  function hello(){if(me.nick)send({k:"hi",n:me.nick,pro:!!me.pro});}
  setInterval(()=>{if(!S)return;
    if(me.nick&&!(S.j||[]).includes(me.pid))hello();
    else if(pending&&pending.done&&!pending.done())send(pending.msg);},2500);
  function onState(p){
    if(p.qOpen&&(!S||!S.qOpen||S.q!==p.q)){qEnd=Date.now()+p.rem*1000;inp="";lay=[];}
    S=p;
    if((S.kick||[]).includes(me.pid)&&me.nick){me={pid:rnd(8)};store(KEY,me);lastKey="";}
    render();
  }
  const answered=()=>(S.ans||[]).includes(me.pid);
  const myTask=()=>S.cur?(me.pro?S.cur.p:S.cur.b):null;
  function keyOf(){if(!me.nick)return "join:"+(me.pro?1:0);if(!S)return "wait";
    return JSON.stringify([S.ph,S.q,S.qOpen,answered(),given[S.q]!=null,S.sc?S.sc[me.pid]:0,!!S.cur,!!S.sol]);}
  function top(){const sc=S&&S.sc&&S.sc[me.pid];return `<div class="ph-top"><span>Blitzkasse · ${roomCode}</span><span>${h(me.nick||"")}${me.pro?'<span class="pro">Profi</span>':""}${sc?` · ${sc[0]} P.`:""}</span></div>`;}
  function render(){const k=keyOf();if(k===lastKey)return;lastKey=k;const P=$("phone");
    if(!me.nick){P.innerHTML=top()+`<h2>Willkommen an Kasse 3!</h2><p>Gib einen Spitznamen ein und wähle deine Stufe.</p>
      <input id="nk" maxlength="16" placeholder="Spitzname" autocomplete="off" value="${h(me.draft||"")}">
      <div class="lvl"><button data-l="0" class="${me.pro?"":"sel"}"><b>Azubi</b><small>Runde Beträge, Rabatte 10–50 %</small></button>
      <button data-l="1" class="${me.pro?"sel":""}"><b>Kassenprofi</b><small>Krumme Beträge, Skonto, Doppel-Rabatt · 1,5-fache Punkte</small></button></div>
      <button class="pri" id="bJ" style="width:100%">Mitmachen</button>`;
      $("nk").oninput=e=>{me.draft=e.target.value;};
      P.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{me.pro=b.dataset.l==="1";store(KEY,me);lastKey="";render();});
      $("bJ").onclick=()=>{const n=clean($("nk").value,16);if(!n)return;me.nick=n;store(KEY,me);hello();lastKey="";render();};return;}
    if(!S){P.innerHTML=top()+`<p>Verbinde mit der Tafel …</p>`;return;}
    if(S.ph===0||(S.ph===1&&S.q<0)){P.innerHTML=top()+`<h2>Du bist drin!</h2><p>Gleich kommt der erste Kunde. Schau dann auf dein Handy und auf die Tafel.</p>
      <div class="merk">Tipp: Beim Rückgeld vom Preis aus hochzählen, wie an der echten Kasse.</div>`;return;}
    if(S.ph===1)return rShift(P);
    const sc=(S.sc&&S.sc[me.pid])||[0,"–",0];
    P.innerHTML=top()+`<h2>Feierabend!</h2><div class="box"><div class="bigpts">Platz ${sc[1]}</div>${sc[0]} Punkte · ${S.np||"?"} haben mitgespielt</div><p>Danke fürs Mitmachen!</p>`;
  }
  function submit(msg,show){const q=S.q;given[q]=show;msg.k="a";msg.q=q;pending={msg,done:()=>S.q!==q||!S.qOpen||answered()};send(msg);lastKey="";render();}
  function rShift(P){
    const t=myTask();if(!t){P.innerHTML=top()+`<p>Warte auf den nächsten Kunden …</p>`;return;}
    const head=`<p class="muted" style="margin:0">Kunde ${S.q+1} von ${S.n} · ${h(t.kind)}${me.pro&&t.type!=="mc"?'<span class="pro">Profi</span>':""} <b id="ptm" style="float:right"></b></p>`;
    if(S.qOpen){
      if(answered()||given[S.q]!=null){P.innerHTML=top()+head+`<div class="status ${answered()?"ok":""}">${answered()?"Antwort gespeichert ✓":"Wird gesendet …"}<br>Deine Antwort: <b>${h(given[S.q]||"")}</b><br>Warte auf die Auflösung an der Tafel.</div>`;timer();return;}
      let ui="";
      if(t.type==="mc")ui=`<h2 style="margin-top:8px">${h(t.q)}</h2>${t.opts.map((o,i)=>`<button class="popt o${i}" data-i="${i}">${"ABC"[i]}: ${h(o)}</button>`).join("")}`;
      else{ui=`<div class="bubble" style="margin-top:8px"><b>${h(t.name)}</b>${h(t.speech)}</div>${bonHTML(t)}<p class="ask">${h(t.ask)}</p>`;
        if(t.type==="num")ui+=`<div class="lcdv" id="disp"><small>${h(t.lab)}</small><span class="v"></span> €</div>
          <div class="pad">${["7","8","9","4","5","6","1","2","3",",","0","back"].map(k=>`<button class="key${k==="back"?" op":""}" data-k="${k}">${k==="back"?"⌫":k}</button>`).join("")}<button class="key op" data-k="clear">C</button><button class="key ok" data-k="ok">Fertig</button></div>`;
        else ui+=`<div class="lcdv"><small>Rückgeld</small>${fmtN(t.amt)} €</div>
          <div class="tray">${DENOMS.map(d=>`<button class="money" data-d="${d}" aria-label="${dName(d)}">${moneyEl(d)}</button>`).join("")}</div>
          <div class="lay" id="lay"></div><div class="row" style="justify-content:space-between;margin-top:8px"><b id="csum"></b><span class="row"><button id="cClr">Alles zurück</button><button class="pri" id="cGo">Geld geben</button></span></div>`;}
      P.innerHTML=top()+head+ui;timer();
      if(t.type==="mc")P.querySelectorAll(".popt").forEach(b=>b.onclick=()=>submit({c:+b.dataset.i},"ABC"[+b.dataset.i]+": "+t.opts[+b.dataset.i]));
      if(t.type==="num"){const upd=()=>{$("disp").classList.toggle("empty",!inp);$("disp").querySelector(".v").textContent=inp||"0,00";};upd();
        P.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=b.dataset.k;
          if(k==="clear")inp="";else if(k==="back")inp=inp.slice(0,-1);
          else if(k===","){if(!inp.includes(","))inp=(inp||"0")+",";}
          else if(k==="ok"){if(!inp)return;const [e,c=""]=inp.split(",");const v=parseInt(e||"0",10)*100+parseInt((c+"00").slice(0,2),10);submit({v},fmt(v));return;}
          else{const ps=inp.split(",");if(ps.length===2&&ps[1].length>=2)return;if(ps.length===1&&ps[0].length>=4)return;inp=(inp==="0"?"":inp)+k;}
          upd();});}
      if(t.type==="coins"){const upd=()=>{const s=lay.reduce((a,b)=>a+b,0);
          $("lay").innerHTML=lay.length?lay.map((d,i)=>`<button class="money" data-r="${i}">${moneyEl(d,true)}</button>`).join(""):`<span class="muted">Tippe oben auf Scheine und Münzen.</span>`;
          $("csum").textContent=`${fmt(s)} · ${lay.length} ${lay.length===1?"Teil":"Teile"}`;
          $("lay").querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{lay.splice(+b.dataset.r,1);upd();});};upd();
        P.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(lay.length>=40)return;lay.push(+b.dataset.d);lay.sort((a,b)=>b-a);upd();});
        $("cClr").onclick=()=>{lay=[];upd();};
        $("cGo").onclick=()=>{if(!lay.length)return;const s=lay.reduce((a,b)=>a+b,0);submit({l:lay.slice()},`${fmt(s)} in ${lay.length} ${lay.length===1?"Teil":"Teilen"}`);};}
      return;}
    const sc=(S.sc&&S.sc[me.pid])||[0,"–",0,-1],ok=sc[3],sol=S.sol?(me.pro?S.sol.p:S.sol.b):null;
    P.innerHTML=top()+head+`<div class="status ${ok===1?"ok":ok===2?"":"bad"}">${ok===-1?"Keine Antwort abgegeben.":ok===1?`<b>Richtig!</b> +${sc[2]} Punkte`:ok===2?`<b>Betrag stimmt!</b> Aber es geht mit weniger Teilen. +${sc[2]} Punkte`:"<b>Leider falsch.</b>"}
      ${given[S.q]?`<br>Deine Antwort: ${h(given[S.q])}`:""}</div>
      ${sol?`<p><b>Richtig: ${h(sol.a)}</b></p><div class="merk"><b>${h(sol.intro)}</b><ol>${sol.steps.map(s=>`<li>${h(s)}</li>`).join("")}</ol></div>`:""}
      <div class="box"><div class="bigpts">${sc[0]} Punkte</div>Platz ${sc[1]} von ${S.np||"?"}</div>`;
  }
  function timer(){const t=()=>{const s=Math.max(0,Math.ceil((qEnd-Date.now())/1000));if($("ptm"))$("ptm").textContent=S.qOpen?s+" s":"";};t();clearInterval(window._pt);window._pt=setInterval(t,250);}
  render();
}
const roomCode=(params.get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
</script>

<script>
/* =========================================================
   QUIZ-MUSIK v2 (Skill live-klassen-app) – eigene Kompositionen, live per WebAudio erzeugt,
   keine Musikdatei, keine Rechte Dritter. Jede Abfrage bekommt ein ANDERES Stück aus dem Pool
   (gemischt, nie zweimal hintereinander). Läuft nur auf der Tafel.
   Ablauf: Loop während der Frage · letzte 10 s schneller · Ticks in den letzten 5 s · Jingle beim Auflösen · Fanfare beim Sieger
   ========================================================= */
const MUSIK_POOL=[
  {name:"Spannung",bpm:124,fast:156,bass:[45,45,41,40],ch:[[69,72,76],[69,72,76],[65,69,72],[64,68,71]],ap:[0,1,2,1,0,2,1,2],arp:"square",kick:[0,4,8,12],snare:[4,12],hat:"off"},
  {name:"Funk",bpm:104,fast:132,swing:.16,bass:[40,40,43,45],bp:[0,3,6,8,10,11,14],bt:"sawtooth",ch:[[64,67,71,74],[64,67,71,74],[67,71,74,77],[69,72,76,79]],ap:[0,2,1,3],as:[2,6,10,13],ad:.07,arp:"sawtooth",kick:[0,6,8],snare:[4,12],hat:"all"},
  {name:"Marimba",bpm:116,fast:144,bass:[48,45,41,43],ch:[[72,76,79],[69,72,76],[65,69,72],[67,71,74]],ap:[0,1,2,1,2,1,0,1],ad:.22,arp:"sine",oct:1,kick:[0,8],snare:[],hat:"none",cl:[3,11]},
  {name:"Chiptune",bpm:144,fast:176,bass:[43,43,40,38],bt:"square",ch:[[67,71,74],[67,71,74],[64,67,71],[62,66,69]],ap:[0,1,2,3,2,1],arp:"square",oct:1,ad:.06,kick:[0,8],snare:[4,12],hat:"none"},
  {name:"Latin",bpm:112,fast:140,bass:[38,38,43,45],bp:[0,3,8,11],ch:[[62,65,69],[62,65,69],[67,70,74],[69,73,76]],ap:[0,2,1,2],as:[0,2,3,6,8,10,11,14],arp:"triangle",kick:[0,6,8,14],snare:[],hat:"off",cl:[0,3,6,10,12]},
  {name:"Jazz",bpm:132,fast:164,swing:.3,walk:1,bass:[41,38,43,36],bp:[0,4,8,12],ch:[[65,69,72,76],[62,65,69,72],[67,70,74,77],[60,64,67,70]],ap:[0,2,1,3],as:[0,6,10],ad:.18,arp:"triangle",kick:[],snare:[],hat:"jazz"},
  {name:"Synthwave",bpm:100,fast:128,bass:[47,43,38,45],bp:[0,2,4,6,8,10,12,14],bt:"sawtooth",ch:[[71,74,78],[67,71,74],[62,66,69],[69,73,76]],ap:[0,1,2,1],arp:"sawtooth",ad:.14,kick:[0,4,8,12],snare:[4,12],hat:"all"},
  {name:"Detektiv",bpm:92,fast:120,bass:[37,37,42,44],bp:[0,3,8,10],ch:[[61,64,68],[61,64,68],[66,69,73],[68,72,75]],ap:[0,1,2,1,2,0],as:[0,2,4,7,8,10,12,15],ad:.12,arp:"triangle",kick:[0],snare:[8],hat:"off"}
];
const Music=(()=>{
  const ls=(k,v)=>{try{if(v===undefined){const x=localStorage.getItem(k);return x==null?null:JSON.parse(x);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}};
  let ctx=null,master=null,timer=null,next=0,step=0,fast=false,nbuf=null,on=ls("blitzkasse_musik")===true,vol=(()=>{const v=ls("blitzkasse_vol");return typeof v==="number"?v:.3;})();
  let order=[],last=-1,S=MUSIK_POOL[0];
  const mf=m=>440*Math.pow(2,(m-69)/12),AV={square:.04,sawtooth:.03,triangle:.08,sine:.1};
  function pick(){if(!order.length){order=MUSIK_POOL.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
      if(order[0]===last&&order.length>1)order.push(order.shift());}
    last=order.shift();S=MUSIK_POOL[last];return last;}
  function init(){try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();
      master=ctx.createGain();master.gain.value=vol*.8;master.connect(ctx.destination);}
    if(ctx.state==="suspended")ctx.resume();return true;}catch(e){return false;}}
  function tone(f,t,d,type,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
  function noise(t,d,v,hp){if(!nbuf){nbuf=ctx.createBuffer(1,ctx.sampleRate*.3,ctx.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nbuf;f.type="highpass";f.frequency.value=hp;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02);}
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.13);
    g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2);}
  function play(st,t){const bar=Math.floor(st/16)%S.bass.length,s=st%16,ch=S.ch[bar%S.ch.length];
    const bp=S.bp||[0,2,4,6,8,10,12,14];
    if(bp.includes(s)){const off=S.walk?[0,4,7,9][Math.floor(s/4)%4]:(s%4===0?0:12);tone(mf(S.bass[bar]+off),t,S.walk?.3:.16,S.bt||"triangle",S.bt==="sawtooth"?.12:S.bt==="square"?.1:.32);}
    if(!S.as||S.as.includes(s))tone(mf(ch[S.ap[s%S.ap.length]%ch.length]+12*(S.oct||0)+(fast?12:0)),t,S.ad||.09,S.arp,AV[S.arp]||.05);
    if(S.kick.includes(s))kick(t);
    if(S.snare.includes(s))noise(t,.12,.25,1800);
    if(S.cl&&S.cl.includes(s))tone(1250,t,.04,"sine",.18);
    const hat=S.hat;
    if(hat==="all"||fast||(hat==="off"&&s%2===1)||(hat==="jazz"&&(s%4===0||s%8===6)))noise(t,.03,.07,7000);}
  function sched(){const d=60/(fast?S.fast:S.bpm)/4;
    if(next<ctx.currentTime-.05)next=ctx.currentTime+.02;
    while(next<ctx.currentTime+.12){play(step,next+(step%2?d*(S.swing||0):0));next+=d;step++;}}
  const root=()=>S.ch[0][0]%12+60;
  return {
    pool:MUSIK_POOL,
    current(){return S.name;},
    unlock(){if(on)init();},
    isOn(){return on;},
    setVol(v){vol=v;ls("blitzkasse_vol",v);if(master)master.gain.value=v*.8;},vol(){return vol;},
    toggle(){on=!on;ls("blitzkasse_musik",on);if(!on)this.stop();return on;},
    start(){if(!on||timer||!init())return;pick();fast=false;step=0;next=ctx.currentTime+.06;timer=setInterval(sched,25);
      try{console.log("[Quiz-Musik] Stück",last,S.name);}catch(e){}},
    hurry(){fast=true;},
    tick(){if(!on||!init())return;tone(1760,ctx.currentTime,.06,"sine",.25);},
    stop(){clearInterval(timer);timer=null;fast=false;},
    reveal(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.03,r=root();
      [0,4,7].forEach((m,i)=>tone(mf(r+m),t+i*.09,.25,"square",.08));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+.3,.9,"triangle",.14));kick(t+.3);noise(t+.3,.25,.25,3000);},
    fanfare(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.05,r=60;
      [[-5,0],[0,.15],[4,.3],[7,.45],[4,.7],[7,.85]].forEach(([m,d])=>tone(mf(r+m),t+d,.22,"square",.09));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+1.05,1.6,"triangle",.15));[0,.45,1.05].forEach(d=>kick(t+d));noise(t+1.05,.5,.3,2500);}
  };})();
/* Quiz-Musik automatisch an die Tafel koppeln: Timer #tm sichtbar = Abfrage läuft (Quiz, Prüfungs-Check, Abstimmung) */
(function MusicAuto(){
  if(new URLSearchParams(location.search).get("s"))return;
  const tf=document.getElementById("tafel"),st=document.getElementById("steps");
  let was=false,lastS=-1,pod=false;
  function btn(){if(!st||document.getElementById("bMus"))return;const b=document.createElement("button");b.id="bMus";b.type="button";
    b.title="Quiz-Musik an oder aus";b.style.cssText="padding:.25em .7em;font-weight:700;border-radius:999px;white-space:nowrap";
    b.onclick=()=>{Music.toggle();if(Music.isOn()&&was)Music.start();lab();};st.after(b);
    const r=document.createElement("input");r.type="range";r.id="bVol";r.min="0";r.max="1";r.step="0.05";r.value=Music.vol();r.title="Lautstärke";r.setAttribute("aria-label","Lautstärke");r.oninput=()=>Music.setVol(+r.value);b.after(r);lab();}
  function lab(){const b=document.getElementById("bMus");if(b)b.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="vertical-align:-3px;margin-right:4px"><path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3z"/>'+(Music.isOn()?'<path fill="none" stroke="currentColor" stroke-width="2" d="M16 8a5 5 0 0 1 0 8M19 5a9 9 0 0 1 0 14"/>':'<path stroke="currentColor" stroke-width="2" d="M16 9l6 6M22 9l-6 6"/>')+'</svg>'+(Music.isOn()?"Musik: an":"Musik: aus");}
  document.addEventListener("pointerdown",()=>Music.unlock(),true);
  document.addEventListener("visibilitychange",()=>{if(document.hidden){Music.stop();was=false;}});
  btn();
  setInterval(()=>{if(!tf||tf.hidden)return;btn();
    const tm=document.getElementById("tm"),vis=!!(tm&&tm.offsetParent!==null);
    if(vis){if(!was){was=true;lastS=-1;Music.start();}
      const s=parseInt(tm.textContent,10);if(!isNaN(s)&&s!==lastS){lastS=s;if(s<=10&&s>0)Music.hurry();if(s<=5&&s>0)Music.tick();}}
    else if(was){was=false;Music.reveal();}
    const p=document.querySelector("#tMain .podium"),pv=!!(p&&p.offsetParent!==null);
    if(pv&&!pod){pod=true;Music.fanfare();}if(!pv)pod=false;
  },200);
})();
if(roomCode)phoneApp();else tafelApp();
</script>
