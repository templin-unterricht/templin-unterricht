<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lager-Chaos – Dreisatz-Einstieg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#f1efe9;--surface:#fff;--surface2:#f7f5f0;--ink:#1f1d18;--muted:#5f5a4f;--line:#d9d3c6;
  --brand:#7a3e00;--brand-ink:#fff;--ok:#1f7a3f;--bad:#b3261e;--warn:#a15c00;
  --kauf:#1f5fae;--kauf-soft:#dde8f7;--verk:#c2410c;--verk-soft:#fbe6dc;--beob:#5b4b8a;--beob-soft:#e9e3f5;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#f0a95a;--brand-ink:#1a1209;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --kauf:#7fb0ff;--kauf-soft:#1b2a40;--verk:#ff8a5c;--verk-soft:#3a2219;--beob:#b9a6f0;--beob-soft:#2a2340;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#f0a95a;--brand-ink:#1a1209;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --kauf:#7fb0ff;--kauf-soft:#1b2a40;--verk:#ff8a5c;--verk-soft:#3a2219;--beob:#b9a6f0;--beob-soft:#2a2340;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0 0 .4em;line-height:1.1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.6em 1em}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.45;cursor:default}
input,textarea{font:inherit;width:100%;padding:.6em .7em;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.merk{border-left:6px solid var(--brand);background:var(--surface);border-radius:10px;padding:12px 14px;margin:8px 0}
.merk b.k{color:var(--kauf)} .merk b.v{color:var(--verk)}
.term{font-weight:700;border-bottom:3px solid var(--brand)}
.alt{font-weight:400;color:var(--muted);font-size:.9em}
/* ---------- Tafel ---------- */
#tafel header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tafel header h1{font-size:1.35rem;margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.steps button{padding:.35em .8em;font-size:.9rem}
.steps button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mini{display:flex;align-items:center;gap:10px;font-size:.9rem}
.mini canvas{width:64px;height:64px;border-radius:6px;background:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px}
.dot.on{background:var(--ok)}
#tMain{padding:20px 22px 40px;max-width:1400px;margin:0 auto}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.ctrl button{font-size:1.05rem}
.big{font-size:clamp(1.6rem,3.2vw,2.6rem)}
.join{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:28px;align-items:start}
.join canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:14px}
.code{font-family:var(--display);font-size:3rem;font-weight:800;letter-spacing:.12em}
.nicks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nicks button{padding:.3em .7em;font-size:.95rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.clock{font-family:var(--display);font-size:3rem;font-weight:800}
.chip{display:inline-block;border-radius:999px;padding:.2em .7em;margin:3px;font-weight:700;font-family:var(--display)}
.chip.k{background:var(--kauf-soft);color:var(--kauf)} .chip.v{background:var(--verk-soft);color:var(--verk)}
.banner{border-radius:12px;padding:12px 16px;margin-top:14px;font-size:1.2rem}
.banner.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));border:2px solid var(--ok)}
.banner.nf{background:var(--kauf-soft);border:2px solid var(--kauf)}
.banner.af{background:var(--verk-soft);border:2px solid var(--verk)}
.banner.info{background:var(--surface);border:2px solid var(--brand)}
.satz{display:block;margin-top:6px;font-size:1rem;color:var(--muted)}
.hbar{display:grid;grid-template-columns:140px 1fr 60px;gap:10px;align-items:center;margin:10px 0;font-size:1.15rem}
.hbar .t{height:34px;border-radius:8px;background:var(--surface2);overflow:hidden}
.hbar .t i{display:block;height:100%;transition:width .4s}
.hbar b{font-family:var(--display);font-size:1.8rem;text-align:right}
table.mt{border-collapse:collapse;width:100%;background:var(--surface);border-radius:12px;overflow:hidden;font-size:1.05rem}
table.mt th,table.mt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
table.mt th{background:var(--surface2);font-size:.9rem}
table.mt tr.cur td{outline:3px solid var(--brand);outline-offset:-3px}
table.mt tr.eq td{background:color-mix(in srgb,var(--ok) 18%,var(--surface));font-weight:700}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{font-family:var(--display);font-weight:800;font-size:1.1rem;padding:.4em .8em}
.pchips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pchips button.done{border-color:var(--ok);border-width:2px}
.scen{text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line)}
.scen b{display:block;font-family:var(--display);font-size:1.3rem;margin-bottom:4px}
svg text{font-family:var(--body)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer{font-family:var(--display);font-size:3rem;font-weight:800;min-width:2.2em;text-align:center;border-radius:50%;background:var(--surface);border:4px solid var(--brand);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{border-radius:14px;padding:14px 16px;color:#fff;font-size:1.2rem;font-weight:700;position:relative}
.o0{background:#b3261e}.o1{background:#1f5fae}.o2{background:#8a5300}.o3{background:#3a7a1c}.o4{background:#8537a3}
.opt.wrong{opacity:.35}
.opt .cnt{position:absolute;right:14px;top:10px;font-family:var(--display);font-size:1.6rem}
.top{list-style:none;padding:0;margin:0}
.top li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--surface);margin-bottom:6px;font-size:1.15rem}
.top li b{font-family:var(--display)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:24px}
.podium div{background:var(--brand);color:var(--brand-ink);border-radius:14px 14px 0 0;width:200px;text-align:center;padding:12px;font-family:var(--display);font-weight:800}
.podium span{display:block;font-size:1.4rem}
.pro{font-size:.75rem;font-weight:700;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.qtab{border-collapse:collapse;margin:8px 0;background:var(--surface)}
.qtab td,.qtab th{border:1px solid var(--line);padding:4px 10px;text-align:center}
@media (max-width:900px){.two,.three,.join,.opts{grid-template-columns:1fr}}
/* ---------- Handy ---------- */
#phone{max-width:560px;margin:0 auto;padding:14px 16px 40px}
#phone .ph-top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.card{border-radius:18px;padding:16px 18px;border:3px solid;margin-bottom:12px}
.card.K{background:var(--kauf-soft);border-color:var(--kauf)} .card.V{background:var(--verk-soft);border-color:var(--verk)} .card.B{background:var(--beob-soft);border-color:var(--beob)}
.card .role{font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase}
.card.K .role{color:var(--kauf)} .card.V .role{color:var(--verk)} .card.B .role{color:var(--beob)}
.card .val{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1.05}
.card .cd{margin-top:8px;font-size:1rem}
.card .cd b{font-family:var(--display);font-size:1.8rem;letter-spacing:.1em}
.step{display:flex;align-items:center;gap:8px;margin:8px 0}
.step button{font-size:1.2rem;font-weight:800;padding:.5em .7em;min-width:3.2em}
.step .pv{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:2rem}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.status.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.status.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.yn button{padding:20px 10px;font-size:1.2rem;font-weight:700;border-radius:14px;border:3px solid var(--line)}
.yn button.sel{outline:4px solid var(--ink);outline-offset:1px}
.yn .y{background:color-mix(in srgb,var(--ok) 18%,var(--surface));border-color:var(--ok)}
.yn .n{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:var(--bad)}
.pbtn{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:14px;font-size:1.05rem}
.pbtn.sel{outline:4px solid var(--ink);outline-offset:-2px}
.popt{display:block;width:100%;margin:10px 0;padding:16px 14px;border-radius:14px;color:#fff;border:none;font-size:1.05rem;font-weight:700;text-align:left}
.bigpts{font-family:var(--display);font-size:2.4rem;font-weight:800}
.ansage{font-family:var(--display);font-weight:800;font-size:3rem;text-align:center;margin:6px 0}
/* ---------- Erklärung ---------- */
#help{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:14px 16px 40px}
#help>*{max-width:760px;margin-left:auto;margin-right:auto}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-14px;background:var(--bg);padding:8px 0}
.htabs{display:flex;gap:8px;margin:6px auto 12px}
.htabs button{flex:1;font-weight:700}
.htabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.hbody{font-size:1.1rem;line-height:1.5}
.hs{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.hs summary{font-family:var(--display);font-size:1.2rem}
.hs[open] summary{margin-bottom:6px}
.hw{background:var(--surface);border-left:6px solid var(--brand);border-radius:10px;padding:10px 14px;margin:8px 0}
.hw b{font-family:var(--display);font-size:1.15rem}
.hbtn{padding:.25em .7em;font-weight:700;border-radius:999px}

/* ---------- Dreisatz-Leiter ---------- */
.ladder{display:flex;flex-direction:column;gap:2px;margin:10px 0;max-width:520px}
.lrow{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-family:var(--display);font-weight:800;font-size:1.5rem}
.lrow small{display:block;font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--muted)}
.larr{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--brand);padding-left:26px}
.hid{visibility:hidden}
@media (max-width:600px){.lrow{font-size:1.25rem;padding:8px 12px}}
</style>
</head>

</div>
<div id="phone" hidden></div>

 {ph:2,t:"Begriffe",b:`<p>Die Lehrkraft zeigt Schritt für Schritt, wie der Dreisatz geht. Du siehst die Schritte auf der Tafel und auf deinem Handy.</p><p>Am Ende kommt eine kleine Frage. Du siehst sofort, ob es stimmt.</p>`},
 {ph:3,t:"Die Falle",b:`<p>Auch hier tippst du zuerst eine Vermutung. Dann sagt die Lehrkraft die Lösung.</p><p>Danach kommt der <b>Je-desto-Blitz</b>: Du bekommst 6 Situationen. Du hast 15 Sekunden pro Situation.</p><p>Frage dich: Je mehr …, desto mehr? Oder: Je mehr …, desto weniger? Oder: kein Zusammenhang?</p>`},
 {ph:4,t:"Merken",b:`<p>Hier stehen die wichtigsten Sätze. Lies sie in Ruhe. Du brauchst sie gleich für das Arbeitsblatt.</p>`},
 {ph:5,t:"Prüfungs-Check",b:`<p>Jetzt kommen 9 Fragen. Lies die Frage genau. Tippe <b>eine</b> Antwort an.</p><p><b>Richtig ist wichtiger als schnell.</b> Für richtige Antworten bekommst du Punkte.</p><p>Fragen mit <span class="pro">Profi</span> sind schwerer. Versuch es trotzdem!</p>`}];
const HILFE_WORT=[
 ["Dreisatz","Eine Rechnung mit drei Schritten. Du kennst eine Menge und den Preis oder das Gewicht dazu. Du rechnest für eine andere Menge.","3 Paletten kosten 60 €. 5 Paletten kosten 100 €."],
 ["Gegebenes Wertepaar","Die zwei Zahlen, die in der Aufgabe schon stehen. Anderes Wort: Ansatz.","3 Paletten → 60 €"],
 ["Schluss auf die 1","Du rechnest aus: Was kostet oder wiegt nur 1? Du teilst.","60 € : 3 = 20 €. 1 Palette kostet 20 €."],
 ["Schluss auf das Gesuchte","Jetzt rechnest du für die Menge, die gefragt ist. Du multiplizierst.","20 € · 5 = 100 €. 5 Paletten kosten 100 €."],
 ["Antwortsatz","Ein ganzer Satz mit Einheit. Er sagt, was herauskommt.","Antwort: 5 Paletten kosten 100 €."],
 ["Probe","Du prüfst: Passt das Ergebnis? Mehr Paletten müssen mehr Geld kosten.","5 Paletten sind mehr als 3. 100 € sind mehr als 60 €. Stimmt."],
 ["proportional","Je mehr, desto mehr. Doppelt so viele Paletten wiegen doppelt so viel.","Paletten → Gewicht der Ladung"],
 ["umgekehrt proportional","Je mehr, desto weniger. Doppelt so viele Mitarbeiter brauchen nur halb so lange.","Mitarbeiter → Zeit zum Entladen"],
 ["Je-desto-Test","Du fragst dich: Je mehr …, desto …? So findest du die richtige Art.","Je mehr Stapler, desto weniger Zeit."]];
function hilfeHTML(ph,tab){
  const spiel=HILFE_SPIEL.map(s=>`<details class="hs" ${s.ph===ph?"open":""} id="hs${s.ph}"><summary>${s.ph===ph?"Jetzt: ":""}${h(s.t)}</summary>${s.b}</details>`).join("");
  const wort=HILFE_WORT.map(w=>`<div class="hw"><b>${h(w[0])}</b><div>${w[1]}</div><div class="muted">Beispiel: ${h(w[2])}</div></div>`).join("")+`<h3 style="margin-top:16px">Die Bilder lesen</h3>${graphsSVG()}
   <ul><li><b>Links:</b> Je mehr Paletten, desto höher der Preis. Die Linie geht nach oben.</li><li><b>Rechts:</b> Je mehr Mitarbeiter, desto kürzer die Zeit. Die Kurve geht nach unten.</li></ul>`;
  return `<div class="hhead"><h2 style="margin:0">Erklärung</h2><button class="pri" id="hClose">Zurück</button></div>
   <div class="htabs"><button data-t="s" class="${tab==="s"?"on":""}">So geht es</button><button data-t="w" class="${tab==="w"?"on":""}">Wörter einfach erklärt</button></div>
   <div class="hbody">${tab==="s"?spiel:wort}</div>`;}
function openHilfe(ph,standalone){
  let box=$("help");if(!box){box=document.createElement("div");box.id="help";document.body.appendChild(box);}
  let tab="s";
  const draw=()=>{box.innerHTML=hilfeHTML(ph,tab);box.hidden=false;
    box.querySelectorAll(".htabs button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw();box.scrollTop=0;});
    const c=$("hClose");if(standalone)c.remove();else c.onclick=()=>{box.hidden=true;};};
  draw();box.scrollTop=0;}

</script>
<script>

/* =========================================================
   TAFEL (Lehrkraft, Beamer)
   ========================================================= */
function tafelApp(){
  $("tafel").hidden=false;
  const KEY="dreisatz_tafel";
  const fresh=()=>({code:codeGen(),ph:0,pl:{},kick:[],url:"",pi:-1,pOpen:false,pRes:false,pStart:0,pAns:{},b:0,rep:"",q:-1,qOpen:false,qStart:0,qAns:{}});
  let T=store(KEY);if(!T||!T.code)T=fresh();
  let conn={up:0,all:2},pubT=null,subbed="";
  const net=new Net(onMsg,c=>{conn=c;if(c.up)pub();renderHead();});
  function sub(){if(subbed!==T.code){subbed=T.code;net.sub(T.code+"/in");}}
  sub();
  const save=()=>store(KEY,T);
  const players=()=>Object.keys(T.pl);

  /* Eingehende Nachrichten – alles wird hier geprüft (Phase, Grenzen) */
  function onMsg(t,p){
    if(t!==NS+T.code+"/in"||!p||!p.p)return;
    const pid=clean(p.p,12);if(T.kick.includes(pid))return;
    if(p.k==="hi"){const n=clean(p.n,16)||"?";
      if(!T.pl[pid]){if(players().length>=60)return;T.pl[pid]={n};}else T.pl[pid].n=n;}
    else if(!T.pl[pid])return;
    else if(p.k==="v"&&(T.ph===1||T.ph===3)&&T.pOpen&&T.pi>=0&&POLL[T.pi].ph===T.ph&&p.key===POLL[T.pi].key&&Number.isInteger(p.c)&&p.c>=0&&p.c<POLL[T.pi].o.length){
      const A=(T.pAns[p.key]=T.pAns[p.key]||{});if(A[pid]!=null)return;A[pid]=p.c;
      if(Object.keys(A).length>=players().length)T.pOpen=false;}
    else if(p.k==="a"&&T.ph===5&&T.qOpen&&p.q===T.q){
      const A=(T.qAns[T.q]=T.qAns[T.q]||{});if(A[pid])return;
      const c=p.c;if(!Number.isInteger(c)||c<0||c>=QUIZ[T.q].o.length)return;
      const s=(Date.now()-T.qStart)/1000;
      A[pid]={c,g:c===QUIZ[T.q].k?1000+Math.round(500*Math.max(0,1-s/qDur(QUIZ[T.q]))):0};
      if(Object.keys(A).length>=players().length)T.qOpen=false;}
    else return;
    save();pub();render();
  }

  /* ---------- Quiz-Punkte ---------- */
  function points(pid){let s=0;for(const qi in T.qAns){if(+qi<T.q||(+qi===T.q&&!T.qOpen)){const a=T.qAns[qi][pid];if(a)s+=a.g;}}return s;}
  function ranking(){return players().map(id=>({id,n:T.pl[id].n,s:points(id)})).sort((a,b)=>b.s-a.s);}

  /* ---------- Zustand an alle Handys ---------- */
  function pub(){clearTimeout(pubT);pubT=setTimeout(()=>{
    const S={ph:T.ph,kick:T.kick,j:players(),b:T.b,rep:T.rep,pi:T.pi,pOpen:T.pOpen,pRes:T.pRes,rem:0,pa:[],pv:{},q:T.q,qOpen:T.qOpen,ans:[]};
    if(T.pi>=0&&POLL[T.pi]&&(T.ph===1||T.ph===3)){const A=T.pAns[POLL[T.pi].key]||{};S.pa=Object.keys(A);if(!T.pOpen)S.pv=A;
      S.rem=T.pOpen?Math.max(0,POLL[T.pi].d-(Date.now()-T.pStart)/1000):0;}
    if(T.ph===5&&T.q>=0){S.ans=Object.keys(T.qAns[T.q]||{});S.rem=T.qOpen?Math.max(0,qDur(QUIZ[T.q])-(Date.now()-T.qStart)/1000):0;}
    if(T.ph>=5){const r=ranking();S.sc={};let rank=0,last=-1;
      r.forEach((x,i)=>{if(x.s!==last){rank=i+1;last=x.s;}const a=(T.qAns[T.q]||{})[x.id];S.sc[x.id]=[x.s,rank,T.qOpen?0:(a?a.g:0)];});S.np=r.length;}
    net.pub(T.code+"/st",S,true);},120);}
  setInterval(pub,5000);

  function go(ph){T.ph=ph;if(ph===1||ph===3){T.pi=-1;T.pOpen=false;T.pRes=false;}if(ph===2)T.b=0;save();pub();render();}

  /* ---------- Kopfzeile ---------- */
  function joinUrl(){
    const extra=(params.get("broker")?"&broker="+encodeURIComponent(params.get("broker")):"")+(LOCAL?"&bc=1":"");
    if(location.protocol.startsWith("http"))return location.origin+location.pathname+"?s="+T.code+extra;
    if(T.url){const u=T.url.trim();return u+(u.includes("?")?"&":"?")+"s="+T.code+extra;}
    if(LOCAL)return location.href.split("?")[0]+"?s="+T.code+extra;return "";}
  function drawQR(canvas,text){
    const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(!text||typeof QRLib==="undefined"){ctx.fillStyle="#999";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText("keine Adresse",canvas.width/2,canvas.height/2);return;}
    const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();
    const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
    ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}
  function renderHead(){
    $("steps").innerHTML=PHASES.map((p,i)=>`<button data-ph="${i}" class="${i===T.ph?"on":""}">${i} ${p}</button>`).join("");
    $("steps").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.ph));
    $("miniCode").textContent="Code "+T.code;$("miniN").textContent=players().length+" dabei";
    $("conn").innerHTML=`<span class="dot ${conn.up?"on":""}"></span>${conn.up?"verbunden":"keine Verbindung"}`;
    if(!$("bHelpT")){const b=document.createElement("button");b.id="bHelpT";b.className="hbtn";b.textContent="Erklärung";b.title="Erklärung in einfacher Sprache";b.onclick=()=>openHilfe(T.ph);$("steps").after(b);}
    drawQR($("qrSmall"),joinUrl());}
  function render(){renderHead();const M=$("tMain");[rStart,rPoll,rBegriffe,rPoll,rMerk,rQuiz,rWin][T.ph](M);}

  /* ---------- 0 Start ---------- */
  function rStart(M){
    const pl=Object.entries(T.pl);
    M.innerHTML=`<div class="join"><div><canvas id="qrBig" width="600" height="600"></canvas></div>
      <div><h2 class="big">Willkommen im Lager-Chaos!</h2>
      <p style="font-size:1.25rem">1. QR-Code mit dem Handy scannen.<br>2. Einen Spitznamen eingeben.<br>3. Gleich stellt der Lagerleiter die erste Frage.</p>
      <p class="muted">Code: <span class="code">${T.code}</span><br><span id="jU" style="word-break:break-all"></span></p>
      <p class="muted">Die Erklärung in einfacher Sprache gibt es auf jedem Handy (Knopf „Hilfe“) und oben über „Erklärung“. Ohne Spiel, z. B. für itslearning: diese Adresse mit <b>?hilfe=1</b> am Ende.</p>
      ${location.protocol.startsWith("http")||LOCAL?"":`<label>Internetadresse dieser Seite (nur nötig, wenn die Datei lokal geöffnet ist)<input id="tUrl" value="${h(T.url)}" placeholder="https://…/dreisatz-einstieg/"></label>`}
      <h3 style="margin-top:16px">${pl.length} dabei <span class="muted" style="font-size:.9rem;font-weight:400">· Antippen entfernt einen Namen</span></h3>
      <div class="nicks">${pl.map(([id,x])=>`<button data-id="${h(id)}">${h(x.n)}</button>`).join("")}</div>
      <div class="ctrl"><button class="pri" id="bGo">Los: Paletten-Poker →</button><button id="bNew">Neue Sitzung (alles löschen)</button></div></div></div>`;
    drawQR($("qrBig"),joinUrl());$("jU").textContent=joinUrl();
    if($("tUrl"))$("tUrl").onchange=e=>{T.url=e.target.value;save();render();};
    M.querySelectorAll(".nicks button").forEach(b=>b.onclick=()=>{const id=b.dataset.id;delete T.pl[id];T.kick.push(id);if(T.rep===id)T.rep="";save();pub();render();});
    $("bGo").onclick=()=>go(1);
    $("bNew").onclick=()=>{if(window.confirm("Neue Sitzung starten? Alle Namen und Ergebnisse werden gelöscht.")){const u=T.url;T=fresh();T.url=u;save();sub();pub();render();}};
  }

  /* ---------- 1 und 3: Abstimmungen (Paletten-Poker, Falle, Je-desto-Blitz) ---------- */
  function openP(i){T.pi=i;T.pOpen=true;T.pRes=false;T.pStart=Date.now();delete T.pAns[POLL[i].key];save();pub();render();}
  function rPoll(M){
    const ids=idxOf(T.ph),isF=T.ph===3;
    if(T.pi<0||!ids.includes(T.pi)){
      M.innerHTML=`<h2 class="big">${isF?"Achtung, Falle!":"Paletten-Poker: erst schätzen, dann rechnen"}</h2>
        <p style="font-size:1.25rem">${isF?"Gleich kommt eine Frage, bei der viele danebenliegen. Danach der Je-desto-Blitz: 6 Situationen, 15 Sekunden pro Situation.":"Der Lagerleiter stellt zwei Fragen. Tippt am Handy eure Vermutung. Rechnen im Kopf ist erlaubt."}</p>
        <p>Reporter/in <span class="muted">(Profi-Rolle, optional: erklärt der Klasse, warum viele so getippt haben)</span>:
        <select id="selRep" style="width:auto;font:inherit;padding:.4em"><option value="">keine</option>${players().map(id=>`<option value="${h(id)}" ${T.rep===id?"selected":""}>${h(T.pl[id].n)}</option>`).join("")}</select></p>
        <div class="ctrl"><button class="pri" id="bQ1">Frage 1 →</button></div>`;
      $("selRep").onchange=e=>{T.rep=e.target.value;save();pub();};
      $("bQ1").onclick=()=>openP(ids[0]);return;}
    const P=POLL[T.pi],A=T.pAns[P.key]||{},cnt=P.o.map((_,i)=>Object.values(A).filter(c=>c===i).length),n=Object.keys(A).length,pos=ids.indexOf(T.pi),closed=!T.pOpen,res=T.pRes;
    const rep=T.rep&&T.pl[T.rep]?T.pl[T.rep].n:"";
    M.innerHTML=`<div class="qhead"><div><p class="muted">${h(P.t)} · ${pos+1} von ${ids.length} · ${n} von ${players().length} geantwortet</p><h2 class="big">${h(P.q)}</h2></div>
      ${T.pOpen?`<div class="timer" id="tm">${P.d}</div>`:""}</div>
      <div class="opts">${P.o.map((o,i)=>`<div class="opt o${i} ${res&&i!==P.k?"wrong":""}">${"ABCDE"[i]}: ${h(o)}${closed?`<span class="cnt">${cnt[i]}</span>`:""}</div>`).join("")}</div>
      ${closed&&P.fe!=null&&n?`<p style="font-size:1.15rem;margin-top:12px"><b>${cnt[P.fe]} von ${n}</b> ${P.fet}</p>`:""}
      ${closed&&!res&&P.hint?`<div class="banner info">${h(P.hint)}${rep?` Reporter/in: <b>${h(rep)}</b>.`:""}</div>`:""}
      ${res?`<div class="two" style="margin-top:14px"><div><div class="merk" style="font-size:1.2rem"><b>Richtig: ${h(P.o[P.k])}</b><br>${h(P.x)}</div>
        ${P.pz?`<div class="merk"><span class="pro">Profi</span> ${h(P.pz)}</div>`:""}
        ${rep&&!P.hint?`<p>Reporter/in <b>${h(rep)}</b>: Was habt ihr beobachtet?</p>`:""}</div>
        <div>${P.lad?ladderHTML(P.lad,3):""}${P.vis==="mann"?mannSVG():""}</div></div>`:""}
      <div class="ctrl">${T.pOpen?`<button class="pri" id="bC">Jetzt schließen</button>`:!res?`<button class="pri" id="bR">Auflösen</button>`:
        pos<ids.length-1?`<button class="pri" id="bN">Nächste Frage →</button>`:`<button class="pri" id="bW">Weiter: ${isF?"Merken":"Begriffe"} →</button>`}</div>`;
    if($("bC"))$("bC").onclick=()=>{T.pOpen=false;save();pub();render();};
    if($("bR"))$("bR").onclick=()=>{T.pRes=true;save();pub();render();};
    if($("bN"))$("bN").onclick=()=>openP(ids[pos+1]);
    if($("bW"))$("bW").onclick=()=>go(isF?4:2);
    if(T.pOpen){clearInterval(window._qt);window._qt=setInterval(()=>{const s=Math.max(0,Math.ceil(P.d-(Date.now()-T.pStart)/1000));if($("tm"))$("tm").textContent=s;
      if(s<=0&&T.pOpen){T.pOpen=false;save();pub();render();}if(!T.pOpen)clearInterval(window._qt);},250);}
  }

  /* ---------- 2 Begriffe: aus den eigenen Tipps ---------- */
  function rBegriffe(M){
    let N=0,F=0;for(const P of POLL){if(P.ph!==1||P.fe==null)continue;const A=T.pAns[P.key]||{};for(const id in A){N++;if(A[id]===P.fe)F++;}}
    const pct=N?Math.round(100*F/N):0;
    const stat=N?`<div class="box" style="margin-bottom:14px"><b style="font-size:1.25rem">Eure Tipps: ${F} von ${N} haben „plus“ gerechnet.</b>
      <div class="hbar" style="grid-template-columns:90px 1fr 70px"><span>plus</span><div class="t"><i style="width:${pct}%;background:var(--bad)"></i></div><b>${pct} %</b></div>
      <span class="satz" style="font-size:1.1rem">Das geht nicht: Der Preis wächst nicht um 2 €. Er wächst <b>mit</b> der Menge. Dafür brauchen wir den Dreisatz.</span></div>`:"";
    M.innerHTML=`<h2 class="big">Wie rechnet man das richtig? Der Dreisatz</h2>${stat}
      <div class="two"><div>${ladderHTML(POLL[0].lad,T.b)}</div>
      <div>${STEPS.map((s,i)=>T.b>=i+1?`<div class="merk" style="font-size:1.2rem"><b>${s[0]}. <span class="term">${s[1]}</span></b>${s[2]?` <span class="alt">(Buch: ${h(s[2])})</span>`:""}<span class="satz" style="font-size:1.1rem;color:var(--ink)">${s[3]}</span></div>`:"").join("")}
      ${T.b>=4?`<div class="merk" style="font-size:1.2rem">Dieser Dreisatz heißt <span class="term">proportional</span> <span class="alt">(je mehr, desto mehr)</span>.</div>`:""}</div></div>
      <div class="ctrl">${T.b<4?`<button class="pri" id="bS">Schritt ${T.b+1} zeigen →</button>`:`<button class="pri" id="bNext">Weiter: Die Falle →</button>`}${T.b>0?`<button id="bBack">← zurück</button>`:""}</div>`;
    if($("bS"))$("bS").onclick=()=>{T.b++;save();pub();render();};
    if($("bBack"))$("bBack").onclick=()=>{T.b--;save();pub();render();};
    if($("bNext"))$("bNext").onclick=()=>go(3);
  }

  /* ---------- 4 Merken ---------- */
  function rMerk(M){
    M.innerHTML=`<h2 class="big">Das merken wir uns</h2><div class="two"><div>${MERK}</div><div>${graphsSVG()}<div style="margin-top:10px">${ladderHTML(LAD_REV,3)}</div>
      <p class="muted">Weiter im Arbeitsblatt: Dreisatz im Lager – proportional, Teil A.</p></div></div>
      <div class="ctrl"><button class="pri" id="bNext">Weiter: Prüfungs-Check →</button></div>`;
    $("bNext").onclick=()=>go(5);
  }

  /* ---------- 5 Prüfungs-Check ---------- */
  function rQuiz(M){
    if(T.q<0){M.innerHTML=`<h2 class="big">Prüfungs-Check</h2><p style="font-size:1.25rem">${QUIZ.length} Fragen, die letzten beiden für Profis <span class="pro">Profi</span>. Richtig ist wichtiger als schnell. Frage 1 wiederholt ein altes Thema.</p>
      <div class="ctrl"><button class="pri" id="bQ">Erste Frage →</button></div>`;$("bQ").onclick=()=>openQ(0);return;}
    const Q=QUIZ[T.q],A=T.qAns[T.q]||{},cnt=Q.o.map((_,i)=>Object.values(A).filter(a=>a.c===i).length),n=Object.keys(A).length,dur=qDur(Q);
    M.innerHTML=`<div class="qhead"><div><p class="muted">Frage ${T.q+1} von ${QUIZ.length}${Q.pro?' <span class="pro">Profi</span>':""} · ${n} von ${players().length} geantwortet</p><h2 class="big">${h(Q.q)}</h2></div>
      ${T.qOpen?`<div class="timer" id="tm">${dur}</div>`:""}</div>
      <div class="opts">${Q.o.map((o,i)=>`<div class="opt o${i} ${!T.qOpen&&i!==Q.k?"wrong":""}">${"ABCDE"[i]}: ${h(o)}${T.qOpen?"":`<span class="cnt">${cnt[i]}</span>`}</div>`).join("")}</div>
      ${T.qOpen?"":`<div class="merk" style="font-size:1.15rem;margin-top:14px">${h(Q.x)}</div>${Q.pz?`<div class="merk"><span class="pro">Profi</span> ${h(Q.pz)}</div>`:""}`}
      <div class="ctrl">${T.qOpen?`<button class="pri" id="bR">Auflösen</button>`:T.q<QUIZ.length-1?`<button class="pri" id="bN">Nächste Frage →</button>`:""}<button id="bW">Zur Siegerehrung</button></div>`;
    if($("bR"))$("bR").onclick=()=>{T.qOpen=false;save();pub();render();};
    if($("bN"))$("bN").onclick=()=>openQ(T.q+1);
    $("bW").onclick=()=>{T.qOpen=false;go(6);};
    if(T.qOpen){clearInterval(window._qt);window._qt=setInterval(()=>{const s=Math.max(0,Math.ceil(dur-(Date.now()-T.qStart)/1000));if($("tm"))$("tm").textContent=s;
      if(s<=0&&T.qOpen){T.qOpen=false;save();pub();render();}if(!T.qOpen)clearInterval(window._qt);},250);}
  }
  function openQ(i){T.q=i;T.qOpen=true;T.qStart=Date.now();save();pub();render();}

  /* ---------- 6 Sieger ---------- */
  function rWin(M){
    const r=ranking();
    M.innerHTML=`<h2 class="big">Siegerehrung: Die besten Lagerprofis</h2>
      <div class="podium">${[1,0,2].filter(i=>r[i]).map(i=>`<div style="height:${[190,150,120][i]}px"><span>${i+1}.</span>${h(r[i].n)}<br>${r[i].s}</div>`).join("")}</div>
      <ol class="top" style="margin-top:18px;max-width:640px;margin-left:auto;margin-right:auto">${r.slice(3,10).map((x,i)=>`<li><span>${i+4}. ${h(x.n)}</span><b>${x.s}</b></li>`).join("")}</ol>
      <p class="muted" style="text-align:center">Weiter im Arbeitsblatt: Dreisatz im Lager – proportional.</p>`;
  }
  render();
}

<script>

/* =========================================================
   HANDY (Schülerinnen und Schüler)
   ========================================================= */
function phoneApp(){
  $("phone").hidden=false;
  const KEY="dreisatz_p_"+roomCode+(params.get("t")||"");
  let me=store(KEY)||{};if(!me.pid){me.pid=rnd(8);store(KEY,me);}
  let S=null,lastKey="",pending=null,qEnd=0,pEnd=0,qSel={},pSel={},hSel=null,conn={up:0};
  const net=new Net((t,p)=>{if(t===NS+roomCode+"/st"&&p&&typeof p==="object")onState(p);},c=>{conn=c;if(c.up)hello();});
  net.sub(roomCode+"/st");
  const send=o=>{o.p=me.pid;net.pub(roomCode+"/in",o,false);};
  function hello(){if(me.nick)send({k:"hi",n:me.nick});}
  setInterval(()=>{if(!S)return;
    if(me.nick&&!(S.j||[]).includes(me.pid))hello();
    else if(pending&&pending.done&&!pending.done())send(pending.msg);},2500);
  function onState(p){
    if(p.pOpen&&(!S||!S.pOpen||S.pi!==p.pi))pEnd=Date.now()+p.rem*1000;
    if(p.qOpen&&(!S||!S.qOpen||S.q!==p.q))qEnd=Date.now()+p.rem*1000;
    if(S&&p.ph!==S.ph&&p.ph===2)hSel=null;
    S=p;
    if((S.kick||[]).includes(me.pid)&&me.nick){me={pid:rnd(8)};store(KEY,me);lastKey="";}
    render();
  }
  const curKey=()=>S&&S.pi>=0&&POLL[S.pi]?POLL[S.pi].key:"";
  function keyOf(){if(!me.nick)return "join";if(!S)return "wait";
    return JSON.stringify([S.ph,S.b,S.pi,S.pOpen,S.pRes,(S.pa||[]).includes(me.pid),pSel[curKey()],S.pOpen?0:(S.pv||{})[me.pid],S.rep===me.pid,hSel,
      S.q,S.qOpen,(S.ans||[]).includes(me.pid),S.ph>=5&&S.sc?S.sc[me.pid]:0]);}
  function render(){const k=keyOf();if(k===lastKey)return;lastKey=k;const P=$("phone");
    const sc0=S&&S.ph>=5&&S.sc?S.sc[me.pid]:null;
    const top=`<div class="ph-top"><span>Lager-Chaos · ${roomCode}</span><span>${h(me.nick||"")}${sc0?` · ${sc0[0]} P.`:""} <button class="hbtn" data-help="1">Hilfe</button></span></div>`;
    if(!me.nick){P.innerHTML=top+`<h2>Willkommen im Lager-Chaos!</h2><p>Gib einen Spitznamen ein.</p>
      <input id="nk" maxlength="16" placeholder="Spitzname" autocomplete="off"><div style="height:10px"></div><button class="pri" id="bJ" style="width:100%">Mitmachen</button>`;
      $("bJ").onclick=()=>{const n=clean($("nk").value,16);if(!n)return;me.nick=n;store(KEY,me);hello();lastKey="";render();};return;}
    if(!S){P.innerHTML=top+`<p>Verbinde mit der Tafel …</p>`;return;}
    if(S.ph===0){P.innerHTML=top+`<h2>Du bist drin!</h2><p>Warte, bis es an der Tafel losgeht.</p>
      <div class="merk">Lies schon mal, wie es geht. Die Erklärung ist in einfacher Sprache.</div><button class="pri" data-help="1" style="width:100%">Wie geht das?</button>`;return;}
    if(S.ph===1||S.ph===3)return rPoll(P,top);
    if(S.ph===2)return rBeg(P,top);
    if(S.ph===4){P.innerHTML=top+`<h2>Das merken wir uns</h2>${MERK}${graphsSVG()}`;return;}
    if(S.ph===5)return rQuiz(P,top);
    const sc=(S.sc&&S.sc[me.pid])||[0,"–",0];
    P.innerHTML=top+`<h2>Geschafft!</h2><div class="box"><div class="bigpts">Platz ${sc[1]}</div>${sc[0]} Punkte im Prüfungs-Check · ${S.np||"?"} haben mitgespielt</div>
      <p>Weiter geht es im Arbeitsblatt <b>Dreisatz im Lager</b>. Danke fürs Mitmachen!</p>`;
  }

  /* ---------- 1 und 3: Abstimmungen ---------- */
  function rPoll(P,top){
    const rep=S.rep===me.pid?`<div class="card B"><div class="role">Reporter/in</div><div class="cd">Du tippst auch mit. Danach erklärst du der Klasse: Warum haben viele so getippt?</div></div>`:"";
    if(S.pi<0||!POLL[S.pi]||POLL[S.pi].ph!==S.ph){P.innerHTML=top+rep+(S.ph===3?`<h2>Achtung, Falle!</h2><p>Gleich kommt eine Frage. Schau an die Tafel.</p>`:`<h2>Paletten-Poker</h2><p>Gleich kommt die erste Frage. <b>Erst schätzen, dann rechnen.</b></p>`);return;}
    const Q=POLL[S.pi],key=Q.key,mine=pSel[key]!=null?pSel[key]:(S.pOpen?null:(S.pv||{})[me.pid]),answered=(S.pa||[]).includes(me.pid);
    if(S.pOpen){
      if(mine!=null||answered){P.innerHTML=top+rep+`<p class="muted">${h(Q.t)}</p><h2>${h(Q.q)}</h2><div class="status ${answered?"ok":""}">${answered?"Antwort gespeichert ✓":"Wird gesendet …"} Warte auf die Tafel.</div>`;return;}
      P.innerHTML=top+rep+`<div class="row" style="justify-content:space-between"><span class="muted">${h(Q.t)}</span><b id="ptm"></b></div><h2>${h(Q.q)}</h2>
        ${Q.o.map((o,i)=>`<button class="popt o${i}" data-i="${i}">${"ABCDE"[i]}: ${h(o)}</button>`).join("")}`;
      P.querySelectorAll(".popt").forEach(b=>b.onclick=()=>{const pi=S.pi,k=POLL[pi].key;pSel[k]=+b.dataset.i;pending={msg:{k:"v",key:k,c:+b.dataset.i},done:()=>S.pi!==pi||!S.pOpen||(S.pa||[]).includes(me.pid)};send(pending.msg);lastKey="";render();});
      const t=()=>{const s=Math.max(0,Math.ceil((pEnd-Date.now())/1000));if($("ptm"))$("ptm").textContent=s+" s";};t();clearInterval(window._pt);window._pt=setInterval(t,250);return;}
    if(!S.pRes){P.innerHTML=top+rep+`<p class="muted">${h(Q.t)}</p><h2>${h(Q.q)}</h2><div class="status">${mine!=null?"Deine Antwort: <b>"+h(Q.o[mine])+"</b>. ":"Keine Antwort. "}Warte auf die Auflösung.</div>`;return;}
    const ok=mine===Q.k;
    P.innerHTML=top+rep+`<p class="muted">${h(Q.t)}</p><h2>${h(Q.q)}</h2><div class="status ${mine==null?"":ok?"ok":"bad"}">${mine==null?"Keine Antwort.":ok?"<b>Richtig!</b>":"<b>Nicht ganz.</b> Du hattest: "+h(Q.o[mine])}</div>
      <p><b>Richtig: ${h(Q.o[Q.k])}</b><br>${h(Q.x)}</p>${Q.lad?ladderHTML(Q.lad,3):""}${Q.vis==="mann"?mannSVG():""}
      ${Q.pz?`<details class="merk"><summary><span class="pro">Profi</span> Zusatzfrage</summary><p>${h(Q.pz)}</p></details>`:""}`;
  }

  /* ---------- 2 Begriffe ---------- */
  function rBeg(P,top){
    const b=S.b||0;
    let html=top+`<h2>Der Dreisatz</h2>`;
    if(b===0)html+=`<div class="merk">Schau an die Tafel. Gleich zeigt die Lehrkraft die Schritte.</div>`;
    html+=ladderHTML(POLL[0].lad,b);
    html+=STEPS.map((s,i)=>b>=i+1?`<div class="merk"><b>${s[0]}. <span class="term">${s[1]}</span></b>${s[2]?` <span class="alt">(Buch: ${h(s[2])})</span>`:""}<span class="satz">${s[3]}</span></div>`:"").join("");
    if(b>=4){html+=`<div class="merk">Das ist ein <span class="term">proportionaler</span> Dreisatz <span class="alt">(je mehr, desto mehr)</span>.</div>
      <h3 style="margin-top:14px">Kleine Frage</h3><p>${h(HINGE.q)}</p>
      ${HINGE.o.map((o,i)=>`<button class="pbtn ${hSel===i?"sel":""}" data-i="${i}" ${hSel!=null?"disabled":""}>${h(o)}</button>`).join("")}
      ${hSel!=null?`<div class="status ${hSel===HINGE.k?"ok":"bad"}"><b>${hSel===HINGE.k?"Richtig!":"Nicht ganz."}</b> ${h(HINGE.x)}</div>`:""}`;}
    P.innerHTML=html;
    P.querySelectorAll(".pbtn").forEach(x=>x.onclick=()=>{hSel=+x.dataset.i;lastKey="";render();});
  }

  /* ---------- 5 Prüfungs-Check ---------- */
  function rQuiz(P,top){
    const sc=(S.sc&&S.sc[me.pid])||[0,"–",0];
    if(S.q<0){P.innerHTML=top+`<h2>Prüfungs-Check</h2><p>Gleich geht es los. Lies jede Frage genau. Richtig ist wichtiger als schnell!</p>`;return;}
    const Q=QUIZ[S.q],answered=(S.ans||[]).includes(me.pid);
    if(S.qOpen){
      if(answered||qSel[S.q]!=null){P.innerHTML=top+`<p class="muted">Frage ${S.q+1}</p><h2>${h(Q.q)}</h2><div class="status ${answered?"ok":""}">${answered?"Antwort gespeichert ✓":"Wird gesendet …"} Warte auf die Auflösung.</div>
        ${Q.pz?`<div class="merk"><span class="pro">Profi</span> ${h(Q.pz)}</div>`:""}`;return;}
      P.innerHTML=top+`<div class="row" style="justify-content:space-between"><span class="muted">Frage ${S.q+1} von ${QUIZ.length}${Q.pro?' <span class="pro">Profi</span>':""}</span><b id="ptm"></b></div><h2>${h(Q.q)}</h2>
        ${Q.o.map((o,i)=>`<button class="popt o${i}" data-i="${i}">${"ABCDE"[i]}: ${h(o)}</button>`).join("")}`;
      P.querySelectorAll(".popt").forEach(b=>b.onclick=()=>{const q=S.q;qSel[q]=+b.dataset.i;pending={msg:{k:"a",q,c:+b.dataset.i},done:()=>S.q!==q||!S.qOpen||(S.ans||[]).includes(me.pid)};send(pending.msg);lastKey="";render();});
      const t=()=>{const s=Math.max(0,Math.ceil((qEnd-Date.now())/1000));if($("ptm"))$("ptm").textContent=s+" s";};t();clearInterval(window._pt);window._pt=setInterval(t,250);return;}
    const my=qSel[S.q],ok=my===Q.k;
    P.innerHTML=top+`<p class="muted">Frage ${S.q+1} von ${QUIZ.length}</p>
      <div class="status ${my==null?"":ok?"ok":"bad"}">${my==null?"Keine Antwort.":ok?"<b>Richtig!</b> +"+sc[2]+" Punkte":"<b>Leider falsch.</b>"}</div>
      <p><b>Richtig: ${h(Q.o[Q.k])}</b><br>${h(Q.x)}</p>
      <div class="box"><div class="bigpts">${sc[0]} Punkte</div>Platz ${sc[1]} von ${S.np||"?"}</div>`;
  }
  $("phone").addEventListener("click",e=>{if(e.target.closest("[data-help]"))openHilfe(S?S.ph:0);});
  render();
}

</script>
<script>
/* =========================================================
   QUIZ-MUSIK v2 (Skill live-klassen-app) – eigene Kompositionen, live per WebAudio erzeugt,
   keine Musikdatei, keine Rechte Dritter. Jede Abfrage bekommt ein ANDERES Stück aus dem Pool
   (gemischt, nie zweimal hintereinander). Läuft nur auf der Tafel.
   Ablauf: Loop während der Frage · letzte 10 s schneller · Ticks in den letzten 5 s · Jingle beim Auflösen · Fanfare beim Sieger
   ========================================================= */
const MUSIK_POOL=[
  {name:"Spannung",bpm:124,fast:156,bass:[45,45,41,40],ch:[[69,72,76],[69,72,76],[65,69,72],[64,68,71]],ap:[0,1,2,1,0,2,1,2],arp:"square",kick:[0,4,8,12],snare:[4,12],hat:"off"},
  {name:"Funk",bpm:104,fast:132,swing:.16,bass:[40,40,43,45],bp:[0,3,6,8,10,11,14],bt:"sawtooth",ch:[[64,67,71,74],[64,67,71,74],[67,71,74,77],[69,72,76,79]],ap:[0,2,1,3],as:[2,6,10,13],ad:.07,arp:"sawtooth",kick:[0,6,8],snare:[4,12],hat:"all"},
  {name:"Marimba",bpm:116,fast:144,bass:[48,45,41,43],ch:[[72,76,79],[69,72,76],[65,69,72],[67,71,74]],ap:[0,1,2,1,2,1,0,1],ad:.22,arp:"sine",oct:1,kick:[0,8],snare:[],hat:"none",cl:[3,11]},
  {name:"Chiptune",bpm:144,fast:176,bass:[43,43,40,38],bt:"square",ch:[[67,71,74],[67,71,74],[64,67,71],[62,66,69]],ap:[0,1,2,3,2,1],arp:"square",oct:1,ad:.06,kick:[0,8],snare:[4,12],hat:"none"},
  {name:"Latin",bpm:112,fast:140,bass:[38,38,43,45],bp:[0,3,8,11],ch:[[62,65,69],[62,65,69],[67,70,74],[69,73,76]],ap:[0,2,1,2],as:[0,2,3,6,8,10,11,14],arp:"triangle",kick:[0,6,8,14],snare:[],hat:"off",cl:[0,3,6,10,12]},
  {name:"Jazz",bpm:132,fast:164,swing:.3,walk:1,bass:[41,38,43,36],bp:[0,4,8,12],ch:[[65,69,72,76],[62,65,69,72],[67,70,74,77],[60,64,67,70]],ap:[0,2,1,3],as:[0,6,10],ad:.18,arp:"triangle",kick:[],snare:[],hat:"jazz"},
  {name:"Synthwave",bpm:100,fast:128,bass:[47,43,38,45],bp:[0,2,4,6,8,10,12,14],bt:"sawtooth",ch:[[71,74,78],[67,71,74],[62,66,69],[69,73,76]],ap:[0,1,2,1],arp:"sawtooth",ad:.14,kick:[0,4,8,12],snare:[4,12],hat:"all"},
  {name:"Detektiv",bpm:92,fast:120,bass:[37,37,42,44],bp:[0,3,8,10],ch:[[61,64,68],[61,64,68],[66,69,73],[68,72,75]],ap:[0,1,2,1,2,0],as:[0,2,4,7,8,10,12,15],ad:.12,arp:"triangle",kick:[0],snare:[8],hat:"off"}
];
const Music=(()=>{
  const ls=(k,v)=>{try{if(v===undefined){const x=localStorage.getItem(k);return x==null?null:JSON.parse(x);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}};
  let ctx=null,master=null,timer=null,next=0,step=0,fast=false,nbuf=null,on=ls("quizmusik")===true,vol=(typeof ls("quizmusikvol")==="number"?ls("quizmusikvol"):.3);
  let order=[],last=-1,S=MUSIK_POOL[0];
  const mf=m=>440*Math.pow(2,(m-69)/12),AV={square:.04,sawtooth:.03,triangle:.08,sine:.1};
  function pick(){if(!order.length){order=MUSIK_POOL.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
      if(order[0]===last&&order.length>1)order.push(order.shift());}
    last=order.shift();S=MUSIK_POOL[last];return last;}
  function init(){try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();
      master=ctx.createGain();master.gain.value=vol*.8;master.connect(ctx.destination);}
    if(ctx.state==="suspended")ctx.resume();return true;}catch(e){return false;}}
  function tone(f,t,d,type,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
  function noise(t,d,v,hp){if(!nbuf){nbuf=ctx.createBuffer(1,ctx.sampleRate*.3,ctx.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nbuf;f.type="highpass";f.frequency.value=hp;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02);}
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.13);
    g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2);}
  function play(st,t){const bar=Math.floor(st/16)%S.bass.length,s=st%16,ch=S.ch[bar%S.ch.length];
    const bp=S.bp||[0,2,4,6,8,10,12,14];
    if(bp.includes(s)){const off=S.walk?[0,4,7,9][Math.floor(s/4)%4]:(s%4===0?0:12);tone(mf(S.bass[bar]+off),t,S.walk?.3:.16,S.bt||"triangle",S.bt==="sawtooth"?.12:S.bt==="square"?.1:.32);}
    if(!S.as||S.as.includes(s))tone(mf(ch[S.ap[s%S.ap.length]%ch.length]+12*(S.oct||0)+(fast?12:0)),t,S.ad||.09,S.arp,AV[S.arp]||.05);
    if(S.kick.includes(s))kick(t);
    if(S.snare.includes(s))noise(t,.12,.25,1800);
    if(S.cl&&S.cl.includes(s))tone(1250,t,.04,"sine",.18);
    const hat=S.hat;
    if(hat==="all"||fast||(hat==="off"&&s%2===1)||(hat==="jazz"&&(s%4===0||s%8===6)))noise(t,.03,.07,7000);}
  function sched(){const d=60/(fast?S.fast:S.bpm)/4;
    if(next<ctx.currentTime-.05)next=ctx.currentTime+.02;
    while(next<ctx.currentTime+.12){play(step,next+(step%2?d*(S.swing||0):0));next+=d;step++;}}
  const root=()=>S.ch[0][0]%12+60;
  return {
    pool:MUSIK_POOL,
    current(){return S.name;},
    unlock(){if(on)init();},
    isOn(){return on;},
    running(){return !!timer;},
    getVol(){return vol;},
    setVol(v){vol=Math.max(0,Math.min(1,v));ls("quizmusikvol",vol);if(master)master.gain.value=vol*.8;},
    toggle(){on=!on;ls("quizmusik",on);if(!on)this.stop();return on;},
    start(){if(!on||timer||!init())return;pick();fast=false;step=0;next=ctx.currentTime+.06;timer=setInterval(sched,25);
      try{console.log("[Quiz-Musik] Stück",last,S.name);}catch(e){}},
    hurry(){fast=true;},
    tick(){if(!on||!init())return;tone(1760,ctx.currentTime,.06,"sine",.25);},
    stop(){clearInterval(timer);timer=null;fast=false;},
    reveal(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.03,r=root();
      [0,4,7].forEach((m,i)=>tone(mf(r+m),t+i*.09,.25,"square",.08));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+.3,.9,"triangle",.14));kick(t+.3);noise(t+.3,.25,.25,3000);},
    fanfare(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.05,r=60;
      [[-5,0],[0,.15],[4,.3],[7,.45],[4,.7],[7,.85]].forEach(([m,d])=>tone(mf(r+m),t+d,.22,"square",.09));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+1.05,1.6,"triangle",.15));[0,.45,1.05].forEach(d=>kick(t+d));noise(t+1.05,.5,.3,2500);}
  };})();
/* Quiz-Musik automatisch an die Tafel koppeln: Timer #tm sichtbar = Abfrage läuft (Quiz, Prüfungs-Check, Abstimmung) */
(function MusicAuto(){
  if(new URLSearchParams(location.search).get("s"))return;
  const tf=document.getElementById("tafel"),st=document.getElementById("steps");
  let was=false,lastS=-1,pod=false;
  function btn(){if(!st||document.getElementById("bMus"))return;const b=document.createElement("button");b.id="bMus";b.type="button";
    b.title="Quiz-Musik an oder aus";b.style.cssText="padding:.25em .7em;font-weight:700;border-radius:999px;white-space:nowrap";
    b.onclick=()=>{Music.toggle();if(Music.isOn()&&was)Music.start();lab();};st.after(b);
    const r=document.createElement("input");r.type="range";r.id="vMus";r.min=0;r.max=100;r.value=Math.round(Music.getVol()*100);r.title="Lautstärke der Musik";r.setAttribute("aria-label","Lautstärke der Musik");r.style.cssText="width:90px;padding:0";r.oninput=()=>Music.setVol(r.value/100);b.after(r);lab();}
  function lab(){const b=document.getElementById("bMus");if(b)b.textContent=Music.isOn()?"Musik: an":"Musik: aus";}
  document.addEventListener("pointerdown",()=>Music.unlock(),true);
  document.addEventListener("visibilitychange",()=>{if(document.hidden)Music.stop();});
  btn();
  setInterval(()=>{if(!tf||tf.hidden)return;btn();
    const tm=document.getElementById("tm"),vis=!!(tm&&tm.offsetParent!==null);
    if(vis){if(!was){was=true;lastS=-1;Music.start();}else if(!document.hidden&&Music.isOn()&&!Music.running())Music.start();
      const s=parseInt(tm.textContent,10);if(!isNaN(s)&&s!==lastS){lastS=s;if(s<=10&&s>0)Music.hurry();if(s<=5&&s>0)Music.tick();}}
    else if(was){was=false;Music.reveal();}
    const p=document.querySelector("#tMain .podium"),pv=!!(p&&p.offsetParent!==null);
    if(pv&&!pod){pod=true;Music.fanfare();}if(!pv)pod=false;
  },200);
})();
const roomCode=(params.get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
if(params.get("hilfe")){document.title="Lager-Chaos – Erklärung";openHilfe(-1,true);}else if(roomCode)phoneApp();else tafelApp();
</script>
