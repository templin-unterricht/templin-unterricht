<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Das Phantom der Geeste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: eine schmale Spalte wie eine Fallakte; oben die Hafenszene, darunter Karten mit Entscheidungen. */
:root{
  --bg:#E6ECEE; --surface:#F8FAFA; --surface2:#EEF3F4; --ink:#10242F; --muted:#4D626D; --line:#C5D2D7;
  --accent:#C9501C; --accent-ink:#A33F12; --on-accent:#FFFFFF;
  --brass:#8C6A1C; --brass-bg:#F4ECD6; --ok:#2C7348; --ok-bg:#E1F1E6; --bad:#AE2B22; --bad-bg:#F8E3E0; --mid:#8A6410; --mid-bg:#F6EED8;
  --shadow:0 1px 2px rgba(16,36,47,.08),0 6px 18px rgba(16,36,47,.07);
  --f-display:'Big Shoulders Stencil Display','Arial Narrow','Roboto Condensed',sans-serif;
  --f-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A161D; --surface:#11232D; --surface2:#162C37; --ink:#E3ECEF; --muted:#9BB0B9; --line:#264451;
  --accent:#EE7A40; --accent-ink:#F59A68; --on-accent:#1A0C04;
  --brass:#D9B25C; --brass-bg:#2A2414; --ok:#62C38A; --ok-bg:#12301F; --bad:#F27A6E; --bad-bg:#3A1714; --mid:#E1B85A; --mid-bg:#2E2610;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A161D; --surface:#11232D; --surface2:#162C37; --ink:#E3ECEF; --muted:#9BB0B9; --line:#264451;
  --accent:#EE7A40; --accent-ink:#F59A68; --on-accent:#1A0C04;
  --brass:#D9B25C; --brass-bg:#2A2414; --ok:#62C38A; --ok-bg:#12301F; --bad:#F27A6E; --bad-bg:#3A1714; --mid:#E1B85A; --mid-bg:#2E2610;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;margin:0}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:2.6rem}
h2{font-size:1.9rem}
h3{font-size:1.35rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
/* Kopfleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .in{max-width:660px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px}
.bar .brand{font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:.02em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.85rem;white-space:nowrap}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:44px;min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;cursor:pointer;padding:0 10px;font-size:.85rem}
.iconbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent-ink)}
.iconbtn svg{width:20px;height:20px}
/* Szene */
.scene{border-radius:14px;overflow:hidden;margin-top:14px;box-shadow:var(--shadow);background:#0E2733}
.scene svg{display:block;width:100%;height:auto}
.fog{animation:drift 26s linear infinite alternate}
.fog2{animation:drift 34s linear infinite alternate-reverse}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(30px)}}
.beam{transform-origin:62px 40px;animation:sweep 5s ease-in-out infinite alternate}
@keyframes sweep{from{transform:rotate(-12deg)}to{transform:rotate(14deg)}}
@media (prefers-reduced-motion: reduce){.fog,.fog2,.beam{animation:none}.wheel{transition:none!important}}
/* Karten */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
.note{background:var(--brass-bg);border:1px solid color-mix(in srgb,var(--brass) 45%,transparent);border-radius:12px;padding:14px 16px}
.note .eyebrow{color:var(--brass)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:12px;border:2px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;font-size:1.05rem;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent-ink)}
.btn.small{min-height:42px;font-size:.95rem;padding:0 14px}
.btn.wide{width:100%}
.linkbtn{background:none;border:none;color:var(--accent-ink);text-decoration:underline;cursor:pointer;padding:6px 0;font-size:.95rem}
/* Startseite */
.hero-title{font-size:3rem;line-height:.95}
.hero-title small{display:block;font-size:1.2rem;color:var(--accent-ink);letter-spacing:.06em;margin-top:6px}
.claasen{font-family:var(--f-mono);font-size:.95rem;background:var(--brass-bg);border-left:4px solid var(--brass);padding:12px 14px;border-radius:0 10px 10px 0}
label.lbl{font-weight:700;display:block;margin-bottom:6px}
input.txt{width:100%;min-height:50px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;padding:0 14px}
input.txt:focus{border-color:var(--accent);outline:none}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.mode[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.mode b{font-family:var(--f-display);font-size:1.45rem;letter-spacing:.02em}
.mode span{font-size:.88rem;color:var(--muted);line-height:1.35}
.mode svg{width:34px;height:34px}
/* Akte */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--f-mono);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.route{list-style:none;margin:0;padding:0;position:relative}
.route:before{content:"";position:absolute;left:21px;top:20px;bottom:20px;border-left:3px dashed var(--line)}
.stop{position:relative;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;cursor:pointer;background:none;border:none;width:100%;text-align:left}
.stop .num{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-family:var(--f-mono);font-weight:600;z-index:1}
.stop.done .num{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.stop.fin .num{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stop .t{min-width:0}
.stop .t b{display:block;font-size:1.05rem}
.stop .t small{display:block;color:var(--muted);font-size:.82rem;line-height:1.3}
.stop .r{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:.78rem;color:var(--muted)}
.stars{color:var(--brass);letter-spacing:1px;font-size:.95rem}
.badge-new{font-size:.7rem;font-family:var(--f-mono);padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent-ink)}
.clue-ic{width:18px;height:18px;vertical-align:-3px}
/* Aufgaben */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lives{display:flex;gap:4px}
.lives svg{width:24px;height:24px}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)} .dots i.mid{background:var(--mid)}
.q{font-size:1.12rem;font-weight:700;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;cursor:pointer;min-height:52px;line-height:1.35}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem}
.opt[aria-pressed="true"]{border-color:var(--accent)}
.opt[aria-pressed="true"] .k{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.numin{display:flex;gap:10px;align-items:center}
.numin input{font-family:var(--f-mono);font-size:1.3rem;text-align:right;max-width:220px}
.numin .u{font-family:var(--f-mono);font-size:1.2rem}
.sortrow{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.sortrow .cats{display:flex;flex-wrap:wrap;gap:6px}
.cat{border:2px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 12px;min-height:38px;cursor:pointer;font-size:.88rem}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.sortrow.right{border-color:var(--ok);background:var(--ok-bg)} .sortrow.wrong{border-color:var(--bad);background:var(--bad-bg)}
.ordbtn{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;min-height:52px}
.ordbtn .k{flex:none;width:30px;height:30px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-mono)}
.ordbtn.set .k{border-style:solid;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ordbtn.right{border-color:var(--ok);background:var(--ok-bg)} .ordbtn.wrong{border-color:var(--bad);background:var(--bad-bg)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tipbox{background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:.95rem}
.ws{display:flex;flex-wrap:wrap;gap:6px}
.ws span{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:.88rem}
/* Rückmeldung */
.react{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.react svg{width:64px;height:64px}
.bubble{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-weight:700;position:relative}
.verdict{font-family:var(--f-display);font-size:1.4rem;letter-spacing:.02em}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)} .verdict.mid{color:var(--mid)}
.fach{border-left:4px solid var(--accent);background:var(--surface2);border-radius:0 12px 12px 0;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ihk{font-size:.95rem;border-top:1px dashed var(--line);padding-top:8px}
.ihk b{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);display:block}
.calc{font-family:var(--f-mono);font-size:.9rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto}
/* Verdächtige */
.sus{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.suscard{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
button.suscard{cursor:pointer}
.suscard[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.suscard svg{width:72px;height:72px}
.suscard b{font-size:1.05rem}
.suscard small{color:var(--muted);font-size:.8rem;line-height:1.3}
.attr{display:flex;flex-direction:column;gap:2px;font-size:.82rem;font-family:var(--f-mono)}
.attr span.x{text-decoration:line-through;color:var(--muted)}
.cluelist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cluelist li{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;font-size:.95rem}
.cluelist .n{font-family:var(--f-mono);font-size:.8rem;color:var(--brass);border:1px solid var(--brass);border-radius:6px;text-align:center;padding:1px 0}
.cluelist li.miss{color:var(--muted)}
/* Schloss */
.lock{display:flex;gap:6px;justify-content:center}
.wheel{width:40px;height:54px;border-radius:8px;background:#1B2E38;color:#E9D9A8;font-family:var(--f-mono);font-size:1.6rem;display:grid;place-items:center;border:2px solid #3B5563;transition:transform .4s}
.wheel.on{background:#2C4A2F;border-color:#7FC495;color:#DFF5E6;transform:rotateX(360deg)}
.timer{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent);width:100%}
/* Punktekarte */
.score{border:2px solid var(--brass);border-radius:16px;padding:18px;background:linear-gradient(180deg,var(--brass-bg),var(--surface));display:flex;flex-direction:column;gap:10px;text-align:center}
.score .big{font-family:var(--f-display);font-size:3rem;line-height:1}
.confirm{border:2px solid var(--bad);background:var(--bad-bg);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.notice{font-size:.9rem;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.opt.gone{opacity:.35;text-decoration:line-through}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.roles span{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:0}
.roles small{display:block;font-size:.72rem;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.roles b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.saidrow{display:flex;gap:10px;align-items:flex-start;background:var(--brass-bg);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:.95rem}
.saidrow input{width:22px;height:22px;flex:none;margin-top:2px}
details summary{cursor:pointer;list-style-position:inside}
.foot{margin-top:28px;font-size:.8rem;color:var(--muted);text-align:center}
@media (max-width:420px){h1{font-size:2.2rem}.hero-title{font-size:2.5rem}h2{font-size:1.6rem}.stat b{font-size:1.1rem}.suscard svg{width:56px;height:56px}}
</style>
</head>
<body>
<header class="bar" id="bar"></header>
<main class="wrap" id="view"></main>
<p class="foot wrap">LF 6 „Waren beschaffen“ · Kapitel 1–13 passen zu Modul 1–13, das Finale zu Modul 14 · Alle Personen und Firmen sind erfunden.</p>
<script>
/* ===== Daten: Verdächtige, Indizien, Kapitel 1–7 ===== */
const SUSPECTS = [
  {id:'brandt', name:'Jens Brandt', rolle:'Vertreter beim Hansa-Großhandel', tinte:'grün', hand:'links', weg:'Boot',
   info:'Kommt jede Woche mit neuen Katalogen. Kennt alle Preise der Stadt.'},
  {id:'thode', name:'Merle Thode', rolle:'Aushilfe im Lager', tinte:'blau', hand:'links', weg:'Rad',
   info:'Arbeitet seit dem Sommer bei euch. Hat einen Schlüssel zum Gewölbelager.'},
  {id:'sievers', name:'Henrik Sievers', rolle:'Konkurrent, Souvenirladen „Kajüte“', tinte:'blau', hand:'rechts', weg:'Boot',
   info:'Will seit Jahren den Laden am Alten Hafen kaufen.'},
  {id:'wendt', name:'Ilka Wendt', rolle:'Beraterin beim Hafen-Gewerbeverein', tinte:'grün', hand:'rechts', weg:'Rad',
   info:'Entscheidet mit, wer im Hafen eine Händlerlizenz bekommt.'}
];
const DIMS = {
  tinte:{label:'Tinte', grün:'grüne Tinte', blau:'blaue Tinte'},
  hand:{label:'Schreibhand', links:'Linkshänder/in', rechts:'Rechtshänder/in'},
  weg:{label:'Unterwegs mit', Boot:'Motorboot', Rad:'Fahrrad'}
};

const CHAPTERS = [
{n:1, ort:'Laden am Alten Hafen', titel:'Die Notiz', modul:'Modul 1 · Bedarf und Menge', prop:'notiz', dim:'tinte',
 intro:'Es ist kurz nach sieben. Nebel liegt über dem Alten Hafen, neben dem Laden ragt der Turm des U-Boots „Wilhelm Bauer“ aus dem Wasser. Kapitän Claasen ist verschwunden. Auf seinem Tisch liegt die Notiz – und eine Absatzstatistik, in der jemand Zahlen verändert hat. Plant den Wintereinkauf. Prüft jede Zahl.',
 clue:{grün:'In der gefälschten Absatzstatistik sind Zahlen mit grüner Tinte überschrieben.', blau:'In der gefälschten Absatzstatistik sind Zahlen mit blauer Tinte überschrieben.'},
 cliff:'Unter der Statistik klebt ein Zettel: „Das Lager. Heute Nacht.“',
 tip:'Vier Fragen vor jeder Bestellung: Was? Wie viel? Wann? Wo und zu welchem Preis? · Bedarf ermitteln mit Marktberichten UND eigenen Verkaufsdaten. · Reichweite mit Dreisatz: erst auf 1 rechnen, dann auf die gesuchte Menge.',
 ws:['die Beschaffung','der Bedarf','die Absatzstatistik','der Absatz (Stück)','der Umsatz (€)','die Bestellmenge','die Bestellkosten','die Lagerkosten','die Kapitalbindung','das Lagerrisiko','die Reichweite'],
 pool:[
 {id:'k1a',t:'mc',l:'ap',q:'Vor jeder Bestellung klärt ihr vier Fragen. Welche Frage gehört NICHT dazu?',
  o:['Wer bekommt die Provision?','Was kaufen wir ein?','Wie viel kaufen wir ein?','Wann bestellen wir?','Wo und zu welchem Preis kaufen wir?'],
  e:'Die Beschaffungsplanung fragt: Was? Wie viel? Wann? Wo und zu welchem Preis? Die Provision hat mit dem Einkauf nichts zu tun.',

 {id:'k1b',t:'mc',l:'ap',q:'Ihr wollt den Bedarf an Island-Pullovern für den Winter ermitteln. Was tut ihr?',
  o:['Wir werten Marktberichte und betriebliche Verkaufsdaten aus.','Wir holen Informationen ausschließlich auf Messen und aus Fachzeitschriften.','Wir werten die Zahlungsbedingungen aller Angebote aus.','Wir überwachen die Außenstände.','Wir planen die Gliederung des Lagers.'],

 {id:'k1c',t:'mc',l:'ap',q:'Absatz von Wollmützen (Stück, 4. Quartal): unter 10 € fällt von 150 auf 95, 10–20 € bleibt bei 135 → 138, über 20 € steigt von 30 auf 70. Die Summe bleibt fast gleich. Welche Entscheidung ist richtig?',

 {id:'k2k',t:'sort',l:'ap',q:'Zwei Wege zum Bestellzeitpunkt. Ordnet zu.',c:['Bestellrhythmusverfahren','Bestellpunktverfahren'],

 {id:'k3g',t:'mc',l:'ap',q:'Ein neuer Lieferer für Sanddorn-Gelee schickt ein Angebot. Was ist im WWS zu tun?',

 {id:'k3i',t:'mc',l:'ap',q:'Euer WWS schickt Bestellungen jetzt elektronisch direkt an den Lieferer. Wie heißt so ein System?',

 {id:'k3j',t:'num',l:'p',q:'Berechnet die Prüfziffer der GTIN 400638133393_. Regel: die 12 Ziffern abwechselnd mit 1 und 3 multiplizieren (erste × 1), alles addieren. Prüfziffer = Abstand bis zum nächsten Zehner.',

 {id:'k5e',t:'mc',l:'ap',q:'Ein Lieferer schickt am 2. November per Brief ein Angebot ohne Einschränkung. Ihr bestellt am 28. November. Kommt ein Kaufvertrag zustande?',

 {id:'k5h',t:'mc',l:'ap',q:'Ihr bestellt auf ein Angebot der Kramer GmbH 500 Sektgläser – rechtzeitig und zu den angebotenen Bedingungen. Kommt ein Kaufvertrag zustande?',

 {id:'k5j',t:'mc',l:'ap',q:'Die Sport KG bietet euch 20 Schlitten an: 29,00 € netto, 2 % Skonto in 20 Tagen, Lieferung unter Eigentumsvorbehalt, „solange der Vorrat reicht“. Welche rechtliche Bedeutung hat das Angebot?',

  w:['… weil die Änderung ein neuer Antrag ist und unter Anwesenden sofort angenommen wurde.','… weil nur schriftliche Bestätigungen zählen.','… weil die Anzeige schon das Angebot war.']},
 {id:'k11l',t:'mc',l:'p',q:'Die Schlitten stehen in eurem Lager, bezahlt ist noch nicht. Lieferung unter Eigentumsvorbehalt. Was stimmt?',
  o:['Ihr seid Besitzer, aber noch nicht Eigentümer.','Ihr seid Eigentümer, aber noch nicht Besitzer.','Ihr seid Besitzer und Eigentümer.','Ihr seid weder Besitzer noch Eigentümer.'],
  e:'Besitz = tatsächliche Herrschaft (die Ware steht bei uns). Eigentum = rechtliche Herrschaft (wir dürfen darüber verfügen).',
  s:'Die Käuferin ist Besitzerin; Eigentümerin wird sie wegen des Eigentumsvorbehalts erst mit vollständiger Zahlung.',
  w:['… weil der Eigentumsvorbehalt das Eigentum bis zur Zahlung beim Lieferer lässt.','… weil Eigentum mit der Bestellung übergeht.','… weil Besitz erst mit der Zahlung entsteht.']}
 ]},

{n:12, ort:'Neuer Hafen', titel:'Zweihundert Kisten', modul:'Modul 12 · Kaufarten und Sonderfälle', prop:'kisten', dim:'weg',
 intro:'Vor dem Laden am Neuen Hafen stehen 200 Kisten mit Wetterstationen. Niemand hat sie bestellt. Gleichzeitig muss die Ware für den Weihnachtsmarkt pünktlich kommen. Welche Regeln gelten?',
 clue:{Boot:'Die Kisten kamen über das Wasser: Am Steg liegen Spuren von einem Motorboot.', Rad:'Die Kisten wurden mit einem Lastenrad gebracht – die Reifenspuren führen zum Deich.'},
 cliff:'Nachts flackert im Laden der Bildschirm des Warenwirtschaftssystems.',
 tip:'„fix“ → Fixkauf. „abrufen“ → Kauf auf Abruf. „später bestimmen“ → Spezifikationskauf. „ausprobieren und zurückgeben“ → Kauf auf Probe. · Unbestellte Ware: mitteilen, aufbewahren, zur Abholung bereitstellen.',
 ws:['der Terminkauf','der Fixkauf','der Kauf auf Abruf','der Spezifikationskauf','der Kauf auf Probe','der Kauf nach Probe','der Kauf zur Probe','der Verbrauchsgüterkauf','der Handelskauf','der Eigentumsvorbehalt','unbestellt'],
 pool:[
 {id:'k12a',t:'sort',l:'ap',q:'Welche Kaufart ist das? Ordnet zu.',c:['Fixkauf','Kauf auf Abruf','Spezifikationskauf','Kauf auf Probe'],
  it:[['Die Adventskränze müssen „am 20.11. fix“ da sein.',0],['Die Osterhasen sollen „am 15. März fix“ geliefert werden.',0],['1.000 Geschenkkartons, der Lieferer lagert sie, ihr ruft je 100 ab.',1],['Großer Warenposten beim Lieferer gelagert, Zustellung nach Bedarf.',1],['200 Pullover bestellt – die Farben sagt ihr bis Ende August.',2],['50 Pullover, die Farben werden später mitgeteilt.',2],['Die Kaffeemaschine zwei Wochen testen und dann zurückgeben dürfen.',3],['Ein Kunde darf eine Stereoanlage zwei Wochen ausprobieren.',3]],
  e:'Signalwörter suchen: fix, abrufen, später bestimmen, ausprobieren.',s:'Es handelt sich um einen Kauf auf Abruf.'},
 {id:'k12b',t:'mc',l:'ap',q:'Ein Großhändler schickt euch 200 Wetterstationen, die niemand bestellt hat. Wie verhaltet ihr euch richtig?',
  o:['Mitteilen, dass ihr die Ware nicht braucht, und sie zur Abholung bereitstellen.','Annehmen, weil es eine langjährige Geschäftsbeziehung gibt.','Vom Fahrer eine Bestätigung verlangen, dass nicht bestellt wurde.','Behalten und nicht bezahlen, weil nicht bestellt wurde.','Eine Vertragsstrafe androhen.'],
  e:'Schweigen ist keine Annahme – es entsteht kein Kaufvertrag. Unter Kaufleuten wird die Ware aber sorgfältig aufbewahrt.',
  s:'Sie teilen mit, dass Sie die Ware nicht benötigen, und stellen sie zur Abholung bereit.',
  w:['… weil Schweigen keine Annahme ist und die Ware sorgfältig aufbewahrt werden muss.','… weil unbestellte Ware sofort euch gehört.','… weil der Fahrer für die Ware haftet.']},
 {id:'k12c',t:'mc',l:'ap',q:'Ein Lieferer liefert unter Eigentumsvorbehalt. Welche Absicht verfolgt er damit?',
  o:['Er will seine Kaufpreisforderung absichern.','Er bleibt damit Besitzer der Ware.','Er darf jederzeit vom Vertrag zurücktreten.','Er will einen Weiterverkauf verhindern.','Er sichert dem Käufer die Eigentumsrechte zu.'],
  e:'Zahlt der Käufer nicht, kann der Lieferer die Ware zurückverlangen.',s:'Mit dem Eigentumsvorbehalt sichert der Verkäufer seine Kaufpreisforderung.',
  w:['… weil er die Ware zurückverlangen kann, wenn nicht gezahlt wird.','… weil der Käufer die Ware sonst nicht benutzen darf.','… weil Eigentumsvorbehalt immer Pflicht ist.']},
 {id:'k12d',t:'mc',l:'ap',q:'Im Vertrag über Kaffee-Vollautomaten steht „Kauf auf Abruf“. Was bedeutet das?',
  o:['Die gekauften Geräte werden je nach Bedarf in Teilmengen abgerufen.','Der Vertrag wird erst wirksam, wenn die Geräte geliefert sind.','Nur die Warenart steht fest, das Modell wird später bestimmt.','Der Lieferer muss sofort nach Vertragsschluss liefern.','Nicht verkaufte Geräte können zurückgegeben werden.'],
  e:'Kauf auf Abruf senkt Lagerkosten und Kapitalbindung.',s:'Beim Kauf auf Abruf werden Teilmengen nach Bedarf abgerufen.'},
 {id:'k12e',t:'mc',l:'ap',q:'Was trifft für den Kauf auf Probe zu?',
  o:['Der Käufer kann die Ware innerhalb einer vereinbarten Frist zurückgeben.','Der Käufer legt fest, wann Teilmengen geliefert werden.','Der Verkäufer muss genau nach Muster liefern.','Der Käufer kauft eine kleine Menge zum Testen.','Kauf auf Probe ist ein Fernabsatzvertrag.'],
  e:'Auf Probe = zurückgeben dürfen. Nach Probe = wie das Muster. Zur Probe = kleine Testmenge.',s:'Beim Kauf auf Probe darf der Käufer die Ware innerhalb einer Frist zurückgeben.'},
 {id:'k12f',t:'mc',l:'ap',q:'Ihr bestellt Ringelshirts für den Sommer als Spezifikationskauf. Warum begrenzt ihr damit euer Lagerrisiko?',
  o:['Weil eine kurzfristige Anpassung an die Wünsche der Kunden möglich ist.','Weil der Lieferer die Preise nicht mehr ändern kann.','Weil die Preise erst bei Lieferung festgelegt werden.','Weil bei der Anlieferung keine Kontrolle nötig ist.','Weil dadurch das Risiko einer mangelhaften Lieferung sinkt.'],
  e:'Farben und Größen bestimmt ihr später – passend zu den Trends.',s:'Beim Spezifikationskauf ist eine kurzfristige Anpassung an die Kundenwünsche möglich.'},
 {id:'k12g',t:'sort',l:'ap',q:'Wer kauft bei wem? Ordnet die Kaufart nach den Vertragspartnern zu.',c:['Verbrauchsgüterkauf','zweiseitiger Handelskauf','bürgerlicher Kauf'],
  it:[['Der Laden verkauft einer Touristin einen Pullover.',0],['Eine Kauffrau kauft privat einen Fernseher im Warenhaus.',0],['Der Laden kauft beim Großhändler 200 Mützen.',1],['Der Laden kauft Vitrinen bei der Loft KG.',1],['Eine Privatperson verkauft ihr altes Fahrrad an den Nachbarn.',2],['Ein Rentner verkauft privat sein Sofa an eine Bekannte.',2]],
  e:'Es zählt die Rolle beim Kauf: Wer privat kauft, ist Verbraucher – auch als Kauffrau.',s:'Ein Verbrauchsgüterkauf liegt vor, weil eine Privatperson bei einem Unternehmer kauft.'},
 {id:'k12h',t:'mc',l:'ap',q:'Warum überwacht ihr beim Fixkauf den Liefertermin besonders genau?',
  o:['Kommt die Ware zu spät, ist sie wertlos – ihr könnt ohne Nachfrist vom Vertrag zurücktreten.','Weil beim Fixkauf kein Skonto möglich ist.','Weil der Fixkauf erst mit der Lieferung entsteht.','Weil der Lieferer dann den Preis ändern darf.'],
  e:'Adventskränze am 27. Dezember will niemand.',s:'Es wird ein Fixkauf vereinbart; bei Überschreiten des Termins kann sofort vom Vertrag zurückgetreten werden.'},
 {id:'k12i',t:'mc',l:'ap',q:'„Die gelieferten Wollmützen müssen genau dem Muster entsprechen, das wir auf der Messe gesehen haben.“ Welche Kaufart ist das?',
  o:['Kauf nach Probe','Kauf zur Probe','Kauf auf Probe','Kauf auf Abruf'],
  e:'Nach Probe = wie das Muster.',s:'Beim Kauf nach Probe muss die Ware dem Muster entsprechen.'},
 {id:'k12j',t:'mc',l:'p',q:'Die Adventskränze (Fixkauf zum 20.11.) kommen am 23.11. Welche Rechte habt ihr?',
  o:['Rücktritt ohne Nachfrist (§ 376 HGB); bei Verschulden auch Schadensersatz – wer doch liefern lassen will, muss das sofort sagen.','Erst eine Nachfrist von zwei Wochen setzen, dann zurücktreten.','Die Ware muss angenommen werden, der Preis sinkt um 10 %.','Keine – eine Verspätung von drei Tagen ist normal.'],
  e:'Beim Fixhandelskauf braucht es keine Nachfrist.',s:'Beim Fixkauf kann der Käufer ohne Nachfrist vom Vertrag zurücktreten.'},
 {id:'k12k',t:'mc',l:'p',q:'Worin unterscheidet sich unbestellte Ware an eine Privatperson von unbestellter Ware an einen Kaufmann?',
  o:['Die Privatperson muss sie weder bezahlen noch zurückschicken noch aufbewahren (§ 241a BGB); der Kaufmann muss sie aufbewahren und zur Abholung bereitstellen.','Beide müssen bezahlen.','Beide dürfen die Ware sofort wegwerfen.','Nur die Privatperson muss die Ware zurückschicken.'],
  e:'Unter Kaufleuten gilt Schweigen grundsätzlich auch nicht als Annahme – aber die Ware muss sorgfältig aufbewahrt werden.',s:'Unbestellte Ware: Schweigen ist keine Annahme.'},
 {id:'k12l',t:'mc',l:'p',q:'Ihr kauft das ausgestellte Vorführsofa aus dem Möbelhaus. Welche Kaufart nach der Bestimmung der Ware ist das?',
  o:['Stückkauf – eine bestimmte, einmalige Sache','Gattungskauf – austauschbare Ware nach Merkmalen','Spezifikationskauf','Kauf auf Probe'],
  e:'Kür: Gattungsware (50 Packungen Tee Sorte X) kann ersetzt werden, eine bestimmte Sache nicht.',s:'Beim Stückkauf wird eine bestimmte, einmalige Sache gekauft.'}
 ]},

{n:13, ort:'Nachts im Laden', titel:'Nachtschicht im System', modul:'Modul 13 · WWS II', prop:'monitor', dim:'tinte',
 intro:'Mitternacht. Im dunklen Laden leuchtet nur der Bildschirm des Warenwirtschaftssystems. Jemand hat Daten verändert: falsche Mengen, falsche Artikel. Findet die Fehler, bevor die Regale leer sind.',
 clue:{grün:'Am Bildschirm klebt ein Zettel mit dem WWS-Passwort – geschrieben in grüner Tinte.', blau:'Am Bildschirm klebt ein Zettel mit dem WWS-Passwort – geschrieben in blauer Tinte.'},
 cliff:'Auf dem Bildschirm erscheint: „Leuchtturm. Ebbe. Kommt allein.“',
 tip:'Soll-Bestand = laut WWS. Ist-Bestand = gezählt. · Zu viel erfasst → zu spät bestellt → leeres Regal. Zu wenig erfasst → zu früh bestellt → zu viel Ware. · Das WWS korrigiert Fehler NICHT selbst.',
 ws:['der Soll-Bestand','der Ist-Bestand','der Bestellvorschlag','die Präsenzlücke','die Verkaufsstockung','die Renner-Penner-Liste','die Auswertung','die Schweigepflicht','der Datenschutz'],
 pool:[
 {id:'k13a',t:'mc',l:'ap',q:'Ihr habt 30 Wetterstationen ordnungsgemäß angenommen. Im WWS steht aber 70 als Liefermenge. Welche Auswirkung hat das?',
  o:['Bei automatischem Bestellsystem kann es zu Verkaufsstockungen kommen.','Das WWS meldet zum richtigen Zeitpunkt die richtige Bestellmenge.','Das WWS korrigiert den Fehler automatisch.','Das WWS zeigt zum errechneten Zeitpunkt den richtigen Ist-Bestand.','Es kommt nicht zu Verkaufsstockungen, weil rechtzeitig bestellt wird.'],
  e:'Der Soll-Bestand ist 40 Stück zu hoch. Der Meldebestand wird im WWS zu spät erreicht – das Regal ist leer, bevor bestellt wird.',
  s:'Zu viel erfasst: Der Meldebestand wird zu spät erreicht; es drohen Präsenzlücken.',
  w:['… weil der Soll-Bestand zu hoch ist und der Meldebestand im WWS zu spät erreicht wird.','… weil das WWS nachts selbst nachzählt.','… weil dann viel zu viel Ware bestellt wird.']},
 {id:'k13b',t:'mc',l:'ap',q:'Statt 25 gelieferter Kinderhosen wurden nur 10 als Zugang erfasst. Welche Folge hat der Fehler?',
  o:['Es kann zu Problemen mit der Lagerkapazität kommen, da beim Erreichen des Meldebestands bestellt wird.','Nichts, da das Regal voll ist.','Nichts, da beim Meldebestand neu bestellt wird.','Nichts, das WWS korrigiert die Eingabe automatisch.','Die Hosen müssen zurückgeschickt werden.'],
  e:'Soll-Bestand zu niedrig → Meldebestand zu früh erreicht → es wird zu früh nachbestellt → zu viel Ware.',
  s:'Zu wenig erfasst: Es wird zu früh bestellt; die Lagerkapazität kann knapp werden.',
  w:['… weil das WWS zu früh eine Bestellung auslöst.','… weil zu wenig Ware bestellt wird.','… weil das WWS die Hosen löscht.']},
 {id:'k13c',t:'mc',l:'ap',q:'Ein Wareneingang von 80 Wollmützen wurde irrtümlich bei Wollschals erfasst. Welche Auswirkung hat der Fehler?',
  o:['Der Soll-Bestand beider Artikel stimmt nicht mit dem Ist-Bestand überein.','Der Verkaufspreis der Wollschals muss geändert werden.','Der Mindestbestand der Mützen muss gesenkt werden.','Der Bezugspreis der Wollschals sinkt.','Der Soll-Bestand der Wollschals ist zu niedrig.'],
  e:'Bei den Schals stehen 80 zu viel, bei den Mützen 80 zu wenig.',s:'Der Soll-Bestand beider Artikel stimmt nicht mit dem Ist-Bestand überein.'},
 {id:'k13d',t:'mc',l:'ap',q:'Ihr lasst eine Renner-Penner-Liste erstellen. Wozu dient sie?',
  o:['Sie gibt einen Überblick über gut und weniger gut verkaufte Artikel.','Sie zeigt, welche Artikel wegen des Mindesthaltbarkeitsdatums schnell verkauft werden müssen.','Sie zeigt, welche Artikel lange geführt werden müssen.','Sie gibt Auskunft über den Zustand der Ware.','Sie bietet Bestellvorschläge an.'],
  e:'Renner = verkauft sich gut. Penner = verkauft sich schlecht. Daraus folgen Entscheidungen für Sortiment und Einkauf.',s:'Die Renner-Penner-Liste gibt einen Überblick über gut und weniger gut verkaufte Artikel.'},
 {id:'k13e',t:'mc',l:'ap',q:'In letzter Zeit gibt es öfter leere Regale (Präsenzlücken). Welche Maßnahme ist sinnvoll?',
  o:['die Verkaufszahlen genau analysieren und als Grundlage für Bestellungen nutzen','den Meldebestand einfach erhöhen','verstärkt Werbung für schwer verkäufliche Ware machen','Kundenbefragungen zum Kaufverhalten durchführen','mehr Herstellermarken ins Sortiment nehmen'],
  e:'Erst die Ursache in den Daten suchen. „Meldebestand erhöhen“ klingt gut, ist aber der Ablenker.',s:'Die Verkaufszahlen werden genau analysiert und als Grundlage für Bestellungen genutzt.',
  w:['… weil erst die Daten zeigen, wo und warum die Lücken entstehen.','… weil ein höherer Meldebestand nie schadet.','… weil Kunden die Ursache kennen.']},
 {id:'k13f',t:'sort',l:'ap',q:'Muss der Soll-Bestand von Hand im WWS geändert werden? Ordnet zu.',c:['ja, von Hand ändern','nein, läuft automatisch'],
  it:[['Eine Leuchtturm-Tasse fällt herunter und zerbricht.',0],['Mangelhafte Pullover gehen an den Lieferer zurück.',0],['Ein Diebstahl wird entdeckt.',0],['Ware wird in eine andere Filiale umgelagert.',0],['Eine Kundin kauft eine Mütze an der Kasse.',1],['Der Wareneingang wird mit dem MDE-Gerät erfasst.',1]],
  e:'Jede Warenbewegung, die nicht über Kasse oder Wareneingang läuft, muss von Hand erfasst werden.',s:'Die unverkäufliche Ware wird als Abgang erfasst; der Soll-Bestand wird geändert.'},
 {id:'k13g',t:'mc',l:'ap',q:'Euer WWS arbeitet nach dem Bestellpunktverfahren. Welchen Vorteil bringt das?',
  o:['Bei Erreichen des Meldebestands wird die Bestellung automatisch ausgelöst.','Es sichert einen dauerhaften Umsatzzuwachs.','Es gibt keine Präsenzlücken mehr.','Die Bestellabteilung wird überflüssig.','Der günstigste Lieferer wird automatisch gewählt.'],
  e:'Das WWS schlägt Bestellungen vor oder löst sie aus. Ein Mensch prüft den Vorschlag.',s:'Bei Erreichen des Meldebestands wird die Bestellung automatisch ausgelöst.'},
 {id:'k13h',t:'sort',l:'ap',q:'Soll-Bestand oder Ist-Bestand? Ordnet zu.',c:['Soll-Bestand','Ist-Bestand'],
  it:[['Bestand laut WWS',0],['Anfangsbestand + Zugänge − Abgänge',0],['was da sein müsste',0],['tatsächlich gezählter Bestand',1],['Ergebnis der Inventur',1],['was wirklich im Regal liegt',1]],
  e:'Weichen beide voneinander ab, wird die Ursache gesucht und der Bestand korrigiert.',s:'Der Soll-Bestand weicht vom Ist-Bestand ab; die Ursache wird geprüft.'},
 {id:'k13i',t:'mc',l:'ap',q:'Ein Kunde fragt: „Zu welchem Preis kauft ihr die Pullover ein, und wie viel Provision bekommen Sie?“ Was antwortet ihr?',
  o:['„Das sind interne Zahlen, die darf ich nicht weitergeben. Aber ich erkläre Ihnen gern, was den Pullover besonders macht.“','„Wir zahlen 42 € pro Stück, ich bekomme 3 %.“','„Fragen Sie doch den Lieferer.“','„Keine Ahnung.“'],
  e:'Einkaufspreise, Konditionen und Provisionen unterliegen der Schweigepflicht.',s:'Interne Daten wie Einkaufspreise und Provisionen gehören zur Schweigepflicht.'},
 {id:'k13j',t:'mc',l:'ap',q:'Kettenrechnung: 70 statt 30 erfasst. Welche Kette stimmt?',
  o:['zu viel erfasst → Soll-Bestand zu hoch → zu spät bestellt → leeres Regal','zu viel erfasst → zu früh bestellt → zu viel Ware','zu viel erfasst → keine Folge','zu viel erfasst → der Verkaufspreis steigt'],
  e:'Immer die Kette denken: falscher Bestand → falscher Bestellzeitpunkt → falsches Regal.',s:'Zu viel erfasst = zu spät bestellt. Zu wenig erfasst = zu früh bestellt.'},
 {id:'k13k',t:'mc',l:'p',q:'Das WWS schlägt 40 Kartons Ostfriesentee vor (Meldebestand erreicht). Welcher Grund rechtfertigt es NICHT, den Vorschlag zu ändern?',
  o:['Der Lieferer gewährt 2 % Skonto.','Eine Kältewelle ist angekündigt.','Die Hafenwoche mit vielen Touristen steht bevor.','Im Lager ist kaum noch Platz.','Ein Erfassungsfehler beim Tee ist bekannt.'],
  e:'Wetter, Saison, Feste, Lagerplatz und bekannte Fehler ändern den Bedarf. Skonto ändert ihn nicht.',s:'Ein Mensch prüft den Bestellvorschlag des WWS.',
  w:['… weil Skonto nichts über die benötigte Menge sagt.','… weil Skonto nur für kleine Mengen gilt.','… weil das WWS Skonto schon eingerechnet hat.']},
 {id:'k13l',t:'mc',l:'p',q:'Wie schützt ihr das Warenwirtschaftssystem am besten gegen Computerviren?',
  o:['Die Antivirensoftware laufend aktualisieren.','Den Rechner nachts ausschalten.','Nur noch Barzahlung annehmen.','Das Passwort gut sichtbar an den Bildschirm kleben.'],
  e:'Laufende Updates schützen. Ein Passwort am Bildschirm – genau so kam das Phantom ins System.',s:'Gegen Computerviren helfen laufende Updates der Antivirensoftware.'}
 ]}
);

class MqttLink{
  constructor(url,cid,onMsg,onStatus){this.url=url;this.cid=cid;this.onMsg=onMsg;this.onStatus=onStatus;this.subs=new Set();this.up=false;this.buf=new Uint8Array(0);this.pid=1;this.tries=0;this.connect();}
  connect(){

    this.ws=ws;ws.binaryType="arraybuffer";
    const guard=setTimeout(()=>{if(!this.up){try{ws.close();}catch(e){}}},9000);
    ws.onopen=()=>{ws.send(mqPacket(0x10,[...mqStr("MQTT"),4,0x02,0,30,...mqStr(this.cid+"-"+Math.random().toString(36).slice(2,6))]));};

    ws.onclose=()=>{clearTimeout(guard);this.up=false;clearInterval(this.ping);this.onStatus();this.retry();};
    ws.onerror=()=>{};
  }
  retry(){this.tries++;this.rt=setTimeout(()=>this.connect(),Math.min(15000,800*Math.pow(1.6,this.tries)));}
  parse(){
    while(this.buf.length>=2){

      do{if(i>=this.buf.length)return;b=this.buf[i++];len+=(b&127)*mult;mult*=128;}while(b&128);
      if(this.buf.length<i+len)return;
      const type=this.buf[0]>>4,flags=this.buf[0]&15,body=this.buf.subarray(i,i+len);this.buf=this.buf.slice(i+len);

      else if(type===3){const tl=(body[0]<<8)|body[1];const topic=TD.decode(body.subarray(2,2+tl));let p=2+tl;const qos=(flags>>1)&3;
        if(qos>0){const id=(body[p]<<8)|body[p+1];p+=2;if(qos===1){try{this.ws.send(new Uint8Array([0x40,2,id>>8,id&255]));}catch(e){}}}

        if(payload!==null)this.onMsg(topic,payload,(flags&1)===1);}
    }
  }
  sendSub(t){const id=this.pid=(this.pid%60000)+1;try{this.ws.send(mqPacket(0x82,[id>>8,id&255,...mqStr(t),0]));}catch(e){}}
  subscribe(t){this.subs.add(t);if(this.up)this.sendSub(t);}
  publish(t,obj,retain){if(!this.up)return false;const body=[...mqStr(t),...TE.encode(obj===null?"":JSON.stringify(obj))];

class Net{
  constructor(onMsg,onStatus){
    this.cid="p"+rnd(10);this.seen=new Map();this.onMsg=onMsg;
    const st=()=>onStatus(this.count());
    this.links=LOCAL?[new LocalLink(this.cid,(t,p,r)=>this.recv(t,p,r),st)]:BROKERS.map(u=>new MqttLink(u,this.cid,(t,p,r)=>this.recv(t,p,r),st));
  }
  count(){return {up:this.links.filter(l=>l.up).length,all:this.links.length};}
  recv(t,p,r){
    if(p&&typeof p==="object"&&p.mid){const now=Date.now();if(this.seen.has(p.mid))return;this.seen.set(p.mid,now);
      if(this.seen.size>3000){for(const [k,v] of this.seen){if(now-v>600000)this.seen.delete(k);}}}
    this.onMsg(t,p,r);
  }
  sub(t){this.links.forEach(l=>l.subscribe(NS+t));}
  pub(t,obj,retain){obj.mid=rnd(12);let ok=false;this.links.forEach(l=>{if(l.publish(NS+t,obj,retain))ok=true;});return ok;}
}
function rnd(n){const a="abcdefghijkmnpqrstuvwxyz23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s;}

function fmt(n,u){
  if(u==='€')return n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
  const s=n.toLocaleString('de-DE',{maximumFractionDigits:2});
  return u?s+' '+u:s;
}
function parseNum(str){
  let s=String(str).replace(/[€%\s]/g,'').replace(/[A-Za-zäöüÄÖÜ]/g,'');
  if(!s)return NaN;
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  return parseFloat(s);
}
function poolFor(ch,mode){return ch.pool.filter(t=>t.l.includes(mode))}
function newCount(mode){
  let tot=0,neu=0;
  CHAPTERS.forEach(c=>poolFor(c,mode).forEach(t=>{tot++;if(!S.seen[mode][t.id])neu++}));
  return {tot,neu};
}
function chNew(c,mode){return poolFor(c,mode).filter(t=>!S.seen[mode][t.id]).length}
function draw(ch,n,mode){
  const pool=poolFor(ch,mode);
  const unseen=shuffle(pool.filter(t=>!S.seen[mode][t.id]));
  let notice='';
  let pick=unseen.slice(0,n);
  if(pick.length<n){
    const rest=shuffle(pool.filter(t=>!pick.includes(t)));
    pick=pick.concat(rest.slice(0,n-pick.length));
    pool.forEach(t=>{delete S.seen[mode][t.id]});
    notice='Alle Aufgaben dieses Kapitels geschafft – jetzt geht es von vorn los, gemischt.';
  }
  // Reihenfolge: Rechen- und Zuordnungsaufgaben nicht alle am Stück
  return {tasks:shuffle(pick),notice};
}

  const src=CHAPTERS[S.debt.from-1];const t=src&&src.pool.find(x=>x.id===S.debt.id&&x.l.includes(S.mode));
  return t?{t,src}:null;
}

/* ---------- Klassenranking (MQTT wie Popcorn-Börse; im Artifact blockiert) ---------- */
let NET=null,RANK_UP=false,RANK_PENDING=null,RANK_HELLO=false;
function rankStateText(){return RANK_UP?`Verbunden mit ${S.room}. Eure Punkte erscheinen an der Tafel.`:`Code ${S.room} gespeichert. Verbindung wird aufgebaut … (klappt nur mit Internet, nicht in der Vorschau)`}
function rankTry(){if(NET&&RANK_PENDING&&S.room){if(NET.pub('r/'+S.room+'/in',RANK_PENDING))RANK_PENDING=null}}
function rankPub(ev){
  if(!S.room)return;
  try{if(!NET){NET=new Net(()=>{},st=>{RANK_UP=st.up>0;const el=$('#rankState');if(el&&S.room)el.textContent=rankStateText();rankTry()})}}catch(e){NET=null;return}
  const stars=CHAPTERS.reduce((s,c)=>s+((S.ch[c.n]&&S.ch[c.n][S.mode])||0),0);
  const done=CHAPTERS.filter(c=>S.ch[c.n]&&S.ch[c.n][S.mode]).length;
  RANK_PENDING={tid:S.tid+S.mode,team:S.team,mode:S.mode,pts:S.points[S.mode]||0,stars,done,clues:Object.keys(S.clues).length,solved:!!S.solved,ev,at:Date.now()};
  rankTry();
}
setInterval(rankTry,3000);
/* ---------- Musik (Web Audio, nur Finale) ---------- */
const Music=(()=>{
  let ctx=null,gain=null,timer=null,step=0,level=0,next=0;
  function unlock(){try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();gain=ctx.createGain();gain.gain.value=0.3;gain.connect(ctx.destination)}if(ctx.state==='suspended')ctx.resume()}catch(e){}}
  function tone(f,t,d,type,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(gain);o.start(t);o.stop(t+d+0.02)}
  function tick(t,v){const len=0.04,b=ctx.createBuffer(1,Math.floor(ctx.sampleRate*len),ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type='highpass';f.frequency.value=6000;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(gain);s.start(t)}
  const BASS=[55,55,65.4,55,49,49,58.3,49];
  function sched(){const bpm=104+level*6,sp=60/bpm/2;while(next<ctx.currentTime+0.15){const i=step%16;if(i%2===0)tone(BASS[(step>>1)%8],next,sp*1.6,'triangle',0.35);tick(next,i%4===2?0.12:0.05);if(level>=3&&i%4===3)tone(220*Math.pow(2,(level%4)/12),next,sp*0.8,'square',0.04);if(i===0&&level>=1)tone(110,next,sp*3,'sawtooth',0.05);next+=sp;step++}}
  function start(lv){if(!S.music)return;unlock();if(!ctx)return;level=lv||0;if(timer)return;next=ctx.currentTime+0.05;timer=setInterval(sched,40)}
  function pause(){if(timer){clearInterval(timer);timer=null}}
  function stop(){pause()}
  function fanfare(){unlock();if(!ctx)return;const t=ctx.currentTime+0.05;[261.6,329.6,392,523.3].forEach((f,i)=>tone(f,t+i*0.12,0.5,'triangle',0.25));tone(523.3,t+0.5,0.9,'triangle',0.2);tone(659.3,t+0.5,0.9,'triangle',0.15)}
  document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
  return {unlock,start,pause,stop,fanfare};
})();
/* ---------- Start ---------- */
bar();
if(S.team)akte();else startScreen();
