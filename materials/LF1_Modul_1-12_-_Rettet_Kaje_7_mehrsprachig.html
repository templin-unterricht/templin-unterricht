er!“":["ኣብ ኩሉ ዞባ ወረቐት ምልክት Kroll ተሰቒሉ፦ „ኣብ ቤት Kaje § ኩሉ ኣዝዩ ክቡር እዩ!“","По всему району висят листовки Kroll: «В доме Kaje § всё слишком дорого!»","Por todo el barrio cuelgan folletos de Kroll: «¡En la casa Kaje § todo es demasiado caro!»","Por todo o bairro há folhetos de Kroll: «Na casa Kaje § está tudo demasiado caro!»"],"Die Kunden wissen es besser: Eure Preise passen.":["እቶም ዓማዊል ዝበለጸ ይፈልጡ፦ ዋጋታትኩም ይሰማምዑ።","Клиенты знают лучше: ваши цены подходят.","Los clientes lo saben mejor: vuestros precios encajan.","Os clientes sabem melhor: os vossos preços estão certos."],"Das ist ein soziales Ziel: Wohl der Mitarbeiter. Zielkonflikt: Es kostet Geld und senkt den Gewinn.":["እዚ ማሕበራዊ ዕላማ (soziales Ziel) እዩ፦ ጽቡቕ ህላወ ሰራሕተኛታት። Zielkonflikt፦ ገንዘብ ይወጽእ ትርፊ ድማ ይንኣስ።","Это социальная цель (soziales Ziel): благополучие сотрудников. Zielkonflikt: Это стоит денег и снижает прибыль.","Esto es un objetivo social (soziales Ziel): el bienestar de los empleados. Zielkonflikt: Cuesta dinero y reduce el beneficio.","Isto é um objetivo social (soziales Ziel): o bem-estar dos trabalhadores. Zielkonflikt: Custa dinheiro e reduz o lucro."],"Pfandgläser, Mehrwegkisten, Kartons ins Recycling, Batterie-Sammelbox an der Kasse":["ብርጭቆ ብዕቐባ፣ ሳጹናት ዳግም ጥቕሚ፣ ካርቶናት ናብ Recycling፣ መእከቢ ባትሪ ኣብ ሳጹን","Стеклянная тара под залог, многоразовые ящики, картон — на переработку, контейнер для батареек у кассы","Vasos con depósito, cajas reutilizables, cartón al reciclaje, caja de recogida de pilas en la caja","Copos com depósito, caixas reutilizáveis, cartão para reciclagem, caixa de recolha de pilhas na caixa"],"Mehrweg vermeidet Abfall. Kartons werden recycelt. Wer Batterien verkauft, muss alte Batterien zurücknehmen.":["Mehrweg ቆሻሻ ይክልክል። ካርቶናት ዳግም ይጥቀሙ (recycelt)። ባትሪ ዝሸጥ ዝወዓለ ባትሪ ክምልስ ኣለዎ።","Mehrweg предотвращает отходы. Картон перерабатывается (recycelt). Кто продаёт батарейки, обязан принимать обратно старые.","Mehrweg evita residuos. Los cartones se reciclan (recycelt). Quien vende pilas tiene que aceptar de vuelta las usadas.","Mehrweg evita resíduos. Os cartões são reciclados (recycelt). Quem vende pilhas tem de aceitar de volta as usadas."],"· Kaje § (Lebensmittel) · Zielgruppe: Mia":["· Kaje § (መግቢ) · ዒላማ ዓማዊል፦ Mia","· Kaje § (продукты) · Целевая группа: Mia","· Kaje § (alimentos) · Grupo objetivo: Mia","· Kaje § (alimentos) · Grupo-alvo: Mia"],"Richtig: Sehr gute Erreichbarkeit für die Kunden":["ቅኑዕ፦ ኣዝዩ ጽቡቕ ምብጻሕ ንዓማዊል","Правильно: Очень хорошая доступность для клиентов","Correcto: Muy buena accesibilidad para los clientes","Certo: Muito boa acessibilidade para os clientes"],"Richtig: Gehälter fließen als Geldstrom von den Unternehmen zu den Haushalten.":["ቅኑዕ፦ ደሞዝ ከም ዋሕዚ ገንዘብ ካብ ትካላት ናብ ስድራቤታት ይውሕዝ።","Правильно: Зарплаты текут как денежный поток от предприятий к домохозяйствам.","Correcto: Los sueldos fluyen como flujo de dinero de las empresas a los hogares.","Certo: Os salários fluem como fluxo de dinheiro das empresas para os agregados familiares."],"Ihr: Ablehnen, weil ein Einzelhändler an Verbraucher verkauft. Sonst verlieren wir unsere Kunden.":["ንስኻትኩም፦ ኣይፋል በሉ፣ ምኽንያቱ ሓደ ንእሽተይ ነጋዳይ (Einzelhändler) ንተጠቀምቲ ይሸጥ። ካልእ ዓማዊልና ንስእን።","Вы: Отказаться, потому что розничный торговец (Einzelhändler) продаёт потребителям. Иначе мы потеряем наших клиентов.","Vosotros: Rechazar, porque un minorista (Einzelhändler) vende a los consumidores. Si no, perdemos a nuestros clientes.","Vocês: Recusar, porque um retalhista (Einzelhändler) vende aos consumidores. Senão perdemos os nossos clientes."],"Ihr: Ablehnen, weil wir Waren vorrätig halten müssen, bis die Kunden sie brauchen.":["ንስኻትኩም፦ ኣይፋል በሉ፣ ምኽንያቱ ኣቕሑት ክሳብ ዓማዊል ዝደልይዋ ከነዕቅብ ኣለና።","Вы: Отказаться, потому что мы должны держать товары в наличии, пока клиентам они нужны.","Vosotros: Rechazar, porque tenemos que tener la mercancía en stock hasta que los clientes la necesiten.","Vocês: Recusar, porque temos de ter a mercadoria em stock até os clientes precisarem dela."],"Sitzbank vor dem Laden · Blumenkübel am Eingang · Lastenrad für Lieferungen · Leuchtschild „Offen“ · Fahrradständer":["ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · ዕትሪ ኣበባ ኣብ ኣፍ ደገ · ብሽክለታ ጸዓት ንኣቕራቦት · ብርሃናዊ ምልክት „Offen“ (ክፉት) · መቐመጢ ብሽክለታ","Скамейка перед магазином · Кадки с цветами у входа · Грузовой велосипед для доставки · Светящаяся вывеска «Offen» (открыто) · Велопарковка","Banco delante de la tienda · Macetas de flores en la entrada · Bici de carga para repartos · Letrero luminoso «Offen» (abierto) · Aparcabicicletas","Banco à frente da loja · Vasos de flores à entrada · Bicicleta de carga para entregas · Letreiro luminoso «Offen» (aberto) · Suporte para bicicletas"],"Krolls Flyer:":["ወረቐት ምልክት Kroll፦","Листовки Kroll:","Folletos de Kroll:","Folhetos de Kroll:"],"falsch – Private Haushalte fragen Konsumgüter nach und bieten ihre Arbeitskraft an. Herstellen und anbieten tun die Unternehmen.":["ጌጋ – ውልቃዊ ስድራቤታት ንብረት ፍጆታ ይጠልቡ ሓይሊ ስራሖም ድማ የቕርቡ። ምፍራይን ምቕራብን ትካላት ይገብሩ።","неверно – Частные домохозяйства спрашивают потребительские блага и предлагают свою рабочую силу. Производят и предлагают предприятия.","incorrecto – Los hogares privados demandan bienes de consumo y ofrecen su fuerza de trabajo. Fabricar y ofrecer lo hacen las empresas.","errado – Os agregados familiares privados procuram bens de consumo e oferecem a sua força de trabalho. Fabricar e oferecer fazem-no as empresas."],"richtig – Entscheidend ist die Hauptleistung: Aus Mehl wird Brot. Das ist Weiterverarbeitung. Der Verkauf im eigenen Laden ändert daran nichts.":["ቅኑዕ – እቲ ወሳኒ ቀዳማይ ዕዮ እዩ፦ ካብ ሕርሲ እንጀራ ይኸውን። እዚ ምስራሕ (Weiterverarbeitung) እዩ። እቲ ሽያጥ ኣብ ናታ ድኳን እዚ ዋላ ሓንቲ ኣይቅይርን።","верно – Решающим является основная деятельность: из муки получается хлеб. Это переработка (Weiterverarbeitung). Продажа в собственном магазине этого не меняет.","correcto – Lo decisivo es la actividad principal: de la harina se hace pan. Esto es transformación (Weiterverarbeitung). La venta en la propia tienda no cambia nada.","certo – O decisivo é a atividade principal: da farinha faz-se pão. Isto é transformação (Weiterverarbeitung). A venda na própria loja não muda nada."],"Kassenbons zeigen die Nachfrage: den Teil des Bedarfs, der wirklich gekauft wurde. Neue Kundengruppen fehlen darin.":["ወረቐት ክፍሊት ጥላብ (Nachfrage) ከርእዩ፦ እቲ ብሓቂ ዝተገዝአ ክፋል ናይ Bedarf። ሓደስቲ ጉጅለታት ዓማዊል ኣብኡ ይጎድሉ።","Кассовые чеки показывают спрос (Nachfrage): ту часть Bedarf, которая реально была куплена. Новые группы клиентов в этом не представлены.","Los tiques de caja muestran la demanda (Nachfrage): la parte del Bedarf que de verdad se compró. Los grupos de clientes nuevos no aparecen ahí.","Os talões de caixa mostram a procura (Nachfrage): a parte do Bedarf que realmente foi comprada. Os novos grupos de clientes não aparecem aí."],"falsch – Existenzbedürfnisse sind lebensnotwendig: Hunger, Durst, Schutz vor Kälte.":["ጌጋ – ድሌታት ህላወ ንህይወት ኣገደስቲ እዮም፦ ጥሜት፣ ጽሜ፣ ሓለዋ ካብ ቁሪ።","неверно – Жизненные потребности необходимы для жизни: голод, жажда, защита от холода.","incorrecto – Las necesidades básicas son vitales: hambre, sed, protección contra el frío.","errado – As necessidades básicas são vitais: fome, sede, proteção contra o frio."],"Die Mittel stehen fest (zwei Aushilfen). Der Nutzen soll möglichst groß sein. Das ist das Maximalprinzip.":["እቲ መሳርሒ ጸኒዑ (ክልተ ግዝያዊ ሰራሕተኛታት)። እቲ ረብሓ ክሳብ ዝከኣል ዓቢ ክኸውን ኣለዎ። እዚ Maximalprinzip እዩ።","Средства заданы (два помощника). Польза должна быть как можно больше. Это принцип максимума (Maximalprinzip).","Los medios son fijos (dos ayudantes). El beneficio debe ser lo mayor posible. Este es el principio de máximo (Maximalprinzip).","Os meios são fixos (dois ajudantes). O benefício deve ser o maior possível. Este é o princípio do máximo (Maximalprinzip)."],"richtig – Man kann nicht gleichzeitig die Mittel gegen null senken und den Nutzen unendlich steigern. Eine Größe muss festliegen.":["ቅኑዕ – ብሓደ እዋን መሳርሒ ናብ ዋላ ሓንቲ ምቕናስን ረብሓ ናብ ዘይውዳእ ምዕባይን ኣይከኣልን። ሓደ መጠን ክጸንሕ ኣለዎ።","верно – Нельзя одновременно снижать средства до нуля и повышать пользу до бесконечности. Одна величина должна быть задана.","correcto – No se puede reducir los medios a cero y aumentar el beneficio hasta el infinito a la vez. Una magnitud tiene que ser fija.","certo – Não se pode ao mesmo tempo reduzir os meios a zero e aumentar o benefício até ao infinito. Uma grandeza tem de estar fixa."],"falsch – Weniger Angebot bei gleicher Nachfrage: Nachfrageüberschuss. Der Gleichgewichtspreis steigt, die gehandelte Menge sinkt.":["ጌጋ – ውሑድ ኣቕራቦት ምስ ማዕረ ጥላብ፦ Nachfrageüberschuss። እቲ Gleichgewichtspreis ይለዓል፣ እቲ ዝዕደግ መጠን ይንኣስ።","неверно – Меньше предложения при том же спросе: избыток спроса (Nachfrageüberschuss). Равновесная цена растёт, объём торговли падает.","incorrecto – Menos oferta con la misma demanda: exceso de demanda (Nachfrageüberschuss). El precio de equilibrio sube y la cantidad comerciada baja.","errado – Menos oferta com a mesma procura: excesso de procura (Nachfrageüberschuss). O preço de equilíbrio sobe e a quantidade transacionada diminui."],"Nachhaltige Händler wählen Lieferer mit Sozialstandards. Kinderarbeit verletzt die soziale Dimension.":["ዘላቒ ነጋዶ ኣቕራቢ ምስ ማሕበራዊ ደረጃታት ይመርጹ። ስራሕ ህጻናት ንማሕበራዊ መዳይ ይጥሕስ።","Устойчивые торговцы выбирают поставщиков с социальными стандартами. Детский труд нарушает социальное измерение.","Los comerciantes sostenibles eligen proveedores con estándares sociales. El trabajo infantil vulnera la dimensión social.","Os comerciantes sustentáveis escolhem fornecedores com padrões sociais. O trabalho infantil viola a dimensão social."],"Faire Bezahlung und familienfreundliche Arbeitszeiten für euer Team – Leistungsgerechte Bezahlung und familienfreundliche Arbeitszeiten gehören zur sozialen Dimension der Nachhaltigkeit.":["ፍትሓዊ ክፍሊትን ንስድራቤት ምቹእ ሰዓታት ስራሕን ንጉጅለኹም – ብዓቕሚ ዝተመጣጠነ ክፍሊትን ንስድራቤት ምቹእ ሰዓታት ስራሕን ናብ ማሕበራዊ መዳይ (soziale Dimension) ናይ ዘላቒ ምኽታል ይኣምር።","Справедливая оплата и семейно-дружественный график для вашей команды – Оплата по труду и семейно-дружественный график относятся к социальному измерению (soziale Dimension) устойчивости.","Pago justo y horarios de trabajo compatibles con la familia para vuestro equipo – El pago acorde al rendimiento y los horarios compatibles con la familia forman parte de la dimensión social (soziale Dimension) de la sostenibilidad.","Pagamento justo e horários compatíveis com a família para a vossa equipa – O pagamento justo pelo desempenho e os horários compatíveis com a família fazem parte da dimensão social (soziale Dimension) da sustentabilidade."],"falsch – Recycling heißt: Das Material wird wiederverwertet. Leihverpackungen sind Mehrweg – das vermeidet Abfall.":["ጌጋ – Recycling ማለት፦ እቲ ነገር ዳግም ይጥቀም። Leihverpackungen Mehrweg እዮም — እዚ ቆሻሻ ይክልክል።","неверно – Recycling означает: Материал используется повторно. Возвратная тара (Leihverpackungen) — это Mehrweg: это предотвращает отходы.","incorrecto – Recycling significa: El material se reutiliza. Los envases retornables (Leihverpackungen) son Mehrweg: evitan residuos.","errado – Recycling significa: O material é reaproveitado. As embalagens retornáveis (Leihverpackungen) são Mehrweg — evitam resíduos."],"falsch – Die Ware kommt von weit her dorthin, wo die Kunden wohnen: Raumüberbrückung.":["ጌጋ – እቲ ኣቕሓ ካብ ርሑቕ ናብ ዝነብሩ ዓማዊል ይመጽእ፦ Raumüberbrückung።","неверно – Товар приходит издалека туда, где живут клиенты: Raumüberbrückung (преодоление пространства).","incorrecto – La mercancía llega de lejos adonde viven los clientes: Raumüberbrückung (salvar el espacio).","errado – A mercadoria vem de longe para onde vivem os clientes: Raumüberbrückung (vencer o espaço)."],"Markenartikel versprechen gleichbleibende Qualität. Eine günstige Alternative sind sie aber nicht.":["Markenartikel ጽኑዕ ጥራት የተስፋ ይህቡ። ግን ርካሽ ኣማራጺ ኣይኮኑን።","Markenartikel обещают постоянное качество. Но дешёвой альтернативой они не являются.","Los Markenartikel prometen calidad constante. Pero no son una alternativa barata.","Os Markenartikel prometem qualidade constante. Mas não são uma alternativa barata."],"Eine eigene Handelsmarke: „Kaje-Klassiker“ – nur bei euch erhältlich – Eine Handelsmarke ist meist günstiger, bindet Kunden und grenzt euch von Mitbewerbern ab.":["ናትኩም ባዕላዊ Handelsmarke፦ „Kaje-Klassiker“ — ኣባኹም ጥራይ ዝርከብ – Handelsmarke ብዙሕ ግዜ ርካሽ እያ፣ ዓማዊል ትኣስር ካብ ተወዳደርቲ ድማ ትፈላለየኩም።","Своя собственная Handelsmarke: «Kaje-Klassiker» — только у вас – Handelsmarke чаще всего дешевле, привязывает клиентов и отличает вас от конкурентов.","Una Handelsmarke propia: «Kaje-Klassiker», solo en vuestra tienda – Una Handelsmarke suele ser más barata, fideliza clientes y os diferencia de la competencia.","Uma Handelsmarke própria: «Kaje-Klassiker», só na vossa loja – Uma Handelsmarke costuma ser mais barata, fideliza clientes e distingue-vos da concorrência."],"falsch – Das Randsortiment rundet das Angebot ab, auch mit branchenfremden Waren. Weihnachtsartikel sind Saison-, Sonderpreise Aktionssortiment.":["ጌጋ – እቲ Randsortiment ነቲ ኣቕራቦት ይመልእ፣ ምስ ካብ ካልእ ዓይነት ዕዮ ዝመጹ ኣቕሑት እውን። ኣቕሑት ገና ወቕታዊ ኣቕሑት (Saisonware)፣ ፍሉይ ዋጋን ፍሉይ ዕድልን (Aktionssortiment) እዮም።","неверно – Randsortiment дополняет предложение, в том числе товарами из других отраслей. Рождественские товары — сезонные, по специальным ценам, акционный ассортимент (Aktionssortiment).","incorrecto – El Randsortiment completa la oferta, también con mercancías de otros sectores. Los artículos de Navidad son de temporada, a precio especial y de surtido de promoción (Aktionssortiment).","errado – O Randsortiment completa a oferta, também com mercadorias de outros ramos. Os artigos de Natal são sazonais, a preço especial e de sortimento promocional (Aktionssortiment)."],"Die Miete ist billig, aber die Kunden kommen nicht hin. Erreichbarkeit für Kunden ist entscheidend.":["እቲ ክራይ ርካሽ እዩ፣ ግን ዓማዊል ኣይበጽሑን። ምብጻሕ ንዓማዊል ወሳኒ እዩ።","Аренда дешёвая, но клиенты не добираются. Доступность для клиентов — решающий фактор.","El alquiler es barato, pero los clientes no llegan. La accesibilidad para los clientes es decisiva.","A renda é barata, mas os clientes não chegam lá. A acessibilidade para os clientes é decisiva."],"falsch – Neue Betriebsformen entstehen, weil Kunden ihre Erwartungen und ihr Kaufverhalten ändern.":["ጌጋ – ሓደስቲ Betriebsformen (ዓይነታት ድኳን) ይፍጠሩ፣ ምኽንያቱ ዓማዊል ትጽቢቶምን ኣገዛዝኣኦምን ይቅይሩ።","неверно – Новые Betriebsformen (формы предприятий) возникают, потому что клиенты меняют свои ожидания и покупательское поведение.","incorrecto – Surgen nuevas Betriebsformen (formas comerciales) porque los clientes cambian sus expectativas y su comportamiento de compra.","errado – Surgem novas Betriebsformen (formas de comércio) porque os clientes mudam as suas expectativas e o seu comportamento de compra."],"Offener Fisch und Käse brauchen Hygiene. Dafür passt Bedienung an der Theke.":["ክፉት ዓሳን ኬዝን ጽሬት የድልዮም። ንዚ Bedienung ኣብ ጠረጴዛ ይሰማማዕ።","Рыбе и сыру на развес нужна гигиена. Для этого подходит Bedienung у прилавка.","El pescado y el queso sueltos necesitan higiene. Para esto encaja la Bedienung en el mostrador.","O peixe e o queijo a granel precisam de higiene. Para isto serve a Bedienung ao balcão."],"falsch – Bei der Vorwahl orientiert sich der Kunde zuerst selbst. Beratung gibt es nur bei Bedarf. Sofort ansprechen passt nicht.":["ጌጋ – ኣብ Vorwahl እቲ ዓሚል መጀመርታ ባዕሉ ይርኢ። ምኽሪ ብድሌት ጥራይ ይርከብ። ብቕጽበት ምዝርራብ ኣይሰማማዕን።","неверно – При Vorwahl клиент сначала ориентируется сам. Консультация — только при необходимости. Сразу обращаться не подходит.","incorrecto – En la Vorwahl el cliente primero se orienta por sí mismo. El asesoramiento solo se da si hace falta. Abordar de inmediato no encaja.","errado – Na Vorwahl o cliente orienta-se primeiro por si. O aconselhamento só existe se for preciso. Abordar logo não serve."],"Mehrwegkisten für die Anlieferung: weniger Müll und weniger Kosten für Kartons – Ein ökologisches Ziel (weniger Abfall) hilft dem ökonomischen Ziel (weniger Kosten): Zielharmonie.":["ሳጹናት ዳግም ጥቕሚ ንምብጻሕ ኣቕሓ፦ ውሑድ ቆሻሻ ከምኡ ድማ ውሑድ ወጻኢ ንካርቶን – ሓደ ኢኮሎጂያዊ ዕላማ (ውሑድ ቆሻሻ) ንኢኮኖሚያዊ ዕላማ (ውሑድ ወጻኢ) ይሕግዝ፦ Zielharmonie።","Многоразовые ящики для поставок: меньше мусора и меньше расходов на картон – Экологическая цель (меньше отходов) помогает экономической цели (меньше расходов): Zielharmonie.","Cajas reutilizables para los suministros: menos basura y menos gasto en cartón – Un objetivo ecológico (menos residuos) ayuda al objetivo económico (menos costes): Zielharmonie.","Caixas reutilizáveis para as entregas: menos lixo e menos custos com cartão – Um objetivo ecológico (menos resíduos) ajuda o objetivo económico (menos custos): Zielharmonie."],"falsch – Soziale Ziele betreffen das Wohl der Mitarbeiter – zum Beispiel einen Fahrtkostenzuschuss.":["ጌጋ – ማሕበራዊ ዕላማታት ንጽቡቕ ህላወ ሰራሕተኛታት ይምልከቱ — ንኣብነት ሓገዝ ወጻኢ መገዲ።","неверно – Социальные цели касаются благополучия сотрудников — например, дотации на проезд.","incorrecto – Los objetivos sociales afectan al bienestar de los empleados, por ejemplo una subvención de desplazamiento.","errado – Os objetivos sociais dizem respeito ao bem-estar dos trabalhadores — por exemplo, um subsídio de deslocação."],"Ohne Regeln für den Ablauf gibt es Fehler. Der Betrieb braucht Aufbau- und Ablauforganisation.":["ብዘይ ሕጊ ንዝርዝር ስራሕ ጌጋታት ይህሉ። እቲ ትካል Aufbau- ከምኡ ድማ Ablauforganisation የድልዮ።","Без правил для процессов возникают ошибки. Предприятию нужны Aufbau- и Ablauforganisation.","Sin reglas para el procedimiento se cometen errores. La empresa necesita Aufbau- y Ablauforganisation.","Sem regras para o procedimento há erros. A empresa precisa de Aufbau- e Ablauforganisation."],"richtig – Es geht um Zuständigkeit und Leitung, also um die Aufbauorganisation. Frau Kayas Stelle ist eine Instanz.":["ቅኑዕ – ብዛዕባ ሓላፍነትን መሪሕነትን እዩ፣ ማለት ብዛዕባ Aufbauorganisation። እቲ ቦታ ናይ Frau Kaya ሓንቲ Instanz እዩ።","верно – Речь о ответственности и руководстве, то есть об Aufbauorganisation. Должность Frau Kaya — инстанция (Instanz).","correcto – Se trata de responsabilidad y dirección, es decir, de la Aufbauorganisation. El puesto de Frau Kaya es una Instanz.","certo – Trata-se de responsabilidade e chefia, ou seja, da Aufbauorganisation. O posto de Frau Kaya é uma Instanz."],"Modul § · Der Wirtschaftskreislauf":["ሞዱል § · ዑደት ቁጠባ","Модуль § · Экономический кругооборот","Módulo § · El circuito económico","Módulo § · O circuito económico"],"die privaten Haushalte":["ውልቃዊ ስድራቤታት (private Haushalte)","частные домохозяйства (private Haushalte)","los hogares privados (private Haushalte)","os agregados familiares privados (private Haushalte)"],"die Unternehmen":["ትካላት (Unternehmen)","предприятия (Unternehmen)","las empresas (Unternehmen)","as empresas (Unternehmen)"],"der Güterstrom":["ዋሕዚ ኣቕሑት (Güterstrom)","поток товаров (Güterstrom)","el flujo de bienes (Güterstrom)","o fluxo de bens (Güterstrom)"],"der Geldstrom":["ዋሕዚ ገንዘብ (Geldstrom)","поток денег (Geldstrom)","el flujo de dinero (Geldstrom)","o fluxo de dinheiro (Geldstrom)"],"die Arbeit":["ስራሕ (Arbeit)","труд (Arbeit)","el trabajo (Arbeit)","o trabalho (Arbeit)"],"der Boden":["መሬት (Boden)","земля (Boden)","el suelo/la tierra (Boden)","o solo/a terra (Boden)"],"das Kapital":["ካፒታል (Kapital)","капитал (Kapital)","el capital (Kapital)","o capital (Kapital)"],"das Einkommen":["ኣታዊ (Einkommen)","доход (Einkommen)","los ingresos (Einkommen)","o rendimento (Einkommen)"],"die Konsumausgaben":["ወፃኢ ፍጆታ (Konsumausgaben)","расходы на потребление (Konsumausgaben)","los gastos de consumo (Konsumausgaben)","as despesas de consumo (Konsumausgaben)"],"Die Werft in Bremerhaven entlässt § Leute. Was passiert im einfachen Wirtschaftskreislauf?":["እቲ Werft ኣብ Bremerhaven § ሰባት የባርር። ኣብ ቀሊል ዑደት ቁጠባ እንታይ ይኸውን?","Верфь в Бремерхафене увольняет § человек. Что происходит в простом экономическом кругообороте?","El astillero de Bremerhaven despide a § personas. ¿Qué pasa en el circuito económico simple?","O estaleiro de Bremerhaven despede § pessoas. O que acontece no circuito económico simples?"],"Die Unternehmen zahlen mehr Lohn, damit die Haushalte weiter kaufen.":["ትካላት ዝያዳ ደሞዝ ይኸፍሉ፣ ስድራቤታት ክቕጽሉ ክገዝኡ።","Предприятия платят больше, чтобы домохозяйства продолжали покупать.","Las empresas pagan más sueldo para que los hogares sigan comprando.","As empresas pagam mais salário para os agregados familiares continuarem a comprar."],"Nichts – der Staat gleicht im einfachen Kreislauf alles aus.":["ዋላ ሓንቲ – እቲ መንግስቲ ኣብ ቀሊል ዑደት ኩሉ የመዛዝን።","Ничего – государство в простом кругообороте всё уравновешивает.","Nada – el Estado lo equilibra todo en el circuito simple.","Nada – o Estado compensa tudo no circuito simples."],"Die Haushalte haben weniger Einkommen. Sie kaufen weniger. Die Unternehmen verkaufen weniger – der Kreislauf wird kleiner.":["ስድራቤታት ውሑድ ኣታዊ ኣለዎም። ውሑድ ይገዝኡ። ትካላት ውሑድ ይሸጡ — እቲ ዑደት ይንኣስ።","У домохозяйств меньше дохода. Они покупают меньше. Предприятия продают меньше — кругооборот уменьшается.","Los hogares tienen menos ingresos. Compran menos. Las empresas venden menos: el circuito se encoge.","Os agregados familiares têm menos rendimento. Compram menos. As empresas vendem menos — o circuito diminui."],"Die Haushalte kaufen mehr, weil sie mehr Zeit haben.":["ስድራቤታት ዝያዳ ይገዝኡ፣ ምኽንያቱ ዝያዳ ግዜ ኣለዎም።","Домохозяйства покупают больше, потому что у них больше времени.","Los hogares compran más porque tienen más tiempo.","Os agregados familiares compram mais porque têm mais tempo."],"Weniger Einkommen (Geldstrom) heißt weniger Konsumausgaben. Den Unternehmen fehlt Geld, sie brauchen weniger Arbeitskräfte. Den Staat gibt es im einfachen Kreislauf nicht.":["ውሑድ ኣታዊ (Geldstrom) ማለት ውሑድ Konsumausgaben እዩ። ትካላት ገንዘብ ይጎድሎም፣ ውሑድ ሰራሕተኛታት የድልዮም። እቲ መንግስቲ ኣብ ቀሊል ዑደት የለን።","Меньше дохода (Geldstrom) — значит меньше расходов на потребление (Konsumausgaben). Предприятиям не хватает денег, им нужно меньше работников. Государства в простом кругообороте нет.","Menos ingresos (Geldstrom) significa menos gastos de consumo (Konsumausgaben). A las empresas les falta dinero y necesitan menos trabajadores. El Estado no existe en el circuito simple.","Menos rendimento (Geldstrom) significa menos despesas de consumo (Konsumausgaben). Às empresas falta dinheiro e precisam de menos trabalhadores. O Estado não existe no circuito simples."],"Zubehör-Großhandel":["Zubehör-Großhandel (ዓቢ ዕዳጋ መሳርሒታት)","Zubehör-Großhandel (оптовик аксессуаров)","Zubehör-Großhandel (mayorista de accesorios)","Zubehör-Großhandel (grossista de acessórios)"],"Ölförderung":["Ölförderung (ምውሳድ ዘይቲ)","Ölförderung (добыча нефти)","Ölförderung (extracción de petróleo)","Ölförderung (extração de petróleo)"],"fördert Erdöl":["ዘይቲ ከቢድ ይወስድ","добывает нефть","extrae petróleo","extrai petróleo"],"hängt die Hüllen ins Regal":["ሽፋናት ኣብ መደርደሪ ይሰቕል","вешает чехлы на полку","cuelga las fundas en el estante","pendura as capas na prateleira"],"kauft eine Handyhülle":["ሽፋን ተሌፎን ይገዝእ","покупает чехол для телефона","compra una funda de móvil","compra uma capa de telemóvel"],"Kunststofffabrik":["Kunststofffabrik (ፋብሪካ ፕላስቲክ)","Kunststofffabrik (фабрика пластмасс)","Kunststofffabrik (fábrica de plásticos)","Kunststofffabrik (fábrica de plásticos)"],"stellt Handyhüllen her":["ሽፋናት ተሌፎን ይሰርሕ","изготавливает чехлы для телефонов","fabrica fundas de móvil","fabrica capas de telemóvel"],"Urproduktion · richtig: Ölförderung":["ቀዳማይ ምፍራይ · ቅኑዕ፦ Ölförderung (ምውሳድ ዘይቲ)","Добыча сырья · верно: Ölförderung (добыча нефти)","Producción primaria · correcto: Ölförderung (extracción de petróleo)","Produção primária · certo: Ölförderung (extração de petróleo)"],"Weiterverarbeitung · richtig: Kunststofffabrik":["ምስራሕ · ቅኑዕ፦ Kunststofffabrik (ፋብሪካ ፕላስቲክ)","Переработка · верно: Kunststofffabrik (фабрика пластмасс)","Transformación · correcto: Kunststofffabrik (fábrica de plásticos)","Transformação · certo: Kunststofffabrik (fábrica de plásticos)"],"Großhandel · richtig: Zubehör-Großhandel":["ዓቢ ዕዳጋ · ቅኑዕ፦ Zubehör-Großhandel (ዓቢ ዕዳጋ መሳርሒታት)","Оптовая торговля · верно: Zubehör-Großhandel (оптовик аксессуаров)","Comercio mayorista · correcto: Zubehör-Großhandel (mayorista de accesorios)","Comércio grossista · certo: Zubehör-Großhandel (grossista de acessórios)"],"Welches Unternehmen gehört zum tertiären Sektor?":["ኣየናይ ትካል ናብ ሳልሳይ ክፍሊ (tertiärer Sektor) ይኣቱ?","Какое предприятие относится к третичному сектору (tertiärer Sektor)?","¿Qué empresa pertenece al sector terciario (tertiärer Sektor)?","Que empresa pertence ao setor terciário (tertiärer Sektor)?"],"Der Schnäppchenmarkt ist ein Handelsbetrieb – Verteilung, also tertiärer Sektor. Fischerei und Bergwerk sind primär, die Schreinerei ist sekundär.":["እቲ Schnäppchenmarkt ዕዳጋዊ ትካል (Handelsbetrieb) እዩ – ምክፋል (Verteilung)፣ ማለት tertiärer Sektor። Fischerei (ዓሳ ምጽዳዕ) ከምኡ ድማ Bergwerk (ማዕደን) ቀዳማይ እዮም፣ Schreinerei (ሰራሒ ዕንጨይቲ) ካልኣይ እዩ።","Schnäppchenmarkt — торговое предприятие (Handelsbetrieb) – распределение (Verteilung), то есть третичный сектор (tertiärer Sektor). Рыболовство (Fischerei) и рудник (Bergwerk) — первичный сектор, столярная мастерская (Schreinerei) — вторичный.","El Schnäppchenmarkt es una empresa comercial (Handelsbetrieb) – distribución (Verteilung), es decir, sector terciario (tertiärer Sektor). La pesca (Fischerei) y la mina (Bergwerk) son primarias; la carpintería (Schreinerei) es secundaria.","O Schnäppchenmarkt é uma empresa comercial (Handelsbetrieb) – distribuição (Verteilung), ou seja, setor terciário (tertiärer Sektor). A pesca (Fischerei) e a mina (Bergwerk) são primárias; a carpintaria (Schreinerei) é secundária."],"Alle staunen. Aber kaum jemand kommt herein.":["ኩሎም ይደነቑ። ግን ዳርጋ ሓደ እኳ ኣይኣትውን።","Все удивляются. Но почти никто не заходит.","Todos se asombran. Pero casi nadie entra.","Todos se admiram. Mas quase ninguém entra."],"Welches Gut ist ein freies Gut?":["ኣየናይ ንብረት ናጻ ንብረት (freies Gut) እዩ?","Какое благо является свободным (freies Gut)?","¿Qué bien es un bien libre (freies Gut)?","Que bem é um bem livre (freies Gut)?"],"Strom":["ኤለክትሪክ","Электричество","La electricidad","A eletricidade"],"Sonnenlicht am Strand":["ብርሃን ጸሓይ ኣብ ወሰን ባሕሪ","Солнечный свет на пляже","La luz del sol en la playa","A luz do sol na praia"],"Leitungswasser":["ማይ ቧንቧ","Водопроводная вода","El agua del grifo","A água da torneira"],"ein Parkplatz in der Innenstadt":["ሓደ መዕቆቢ መኪና ኣብ ማእከል ከተማ","Парковочное место в центре города","Una plaza de aparcamiento en el centro","Um lugar de estacionamento no centro da cidade"],"Freie Güter gibt es unbegrenzt, sie kosten nichts. Leitungswasser, Strom und Parkplätze sind knapp und haben einen Preis.":["ናጻ ንብረት ብዘይ ገደብ ኣለዉ፣ ዋላ ሓንቲ ኣይኸፍሉን። ማይ ቧንቧ፣ ኤለክትሪክን መዕቆቢ መካይንን ውሑዳት እዮም ዋጋ ድማ ኣለዎም።","Свободных благ неограниченно много, они ничего не стоят. Водопроводная вода, электричество и парковки ограничены и имеют цену.","Los bienes libres existen sin límite y no cuestan nada. El agua del grifo, la electricidad y los aparcamientos son escasos y tienen precio.","Os bens livres existem sem limite e não custam nada. A água da torneira, a eletricidade e os estacionamentos são escassos e têm preço."],"Kein Händler kann das anbieten. Eine Woche vergeht. Die Ware liegt weiter in Kartons.":["ሓደ ነጋዳይ ከቕርቦ ኣይክእልን። ሓንቲ ሰሙን ትሓልፍ። እቲ ኣቕሓ ገና ኣብ ካርቶናት ይጸንሕ።","Ни один торговец не может этого предложить. Проходит неделя. Товар всё ещё лежит в коробках.","Ningún comerciante puede ofrecer eso. Pasa una semana. La mercancía sigue en cajas.","Nenhum comerciante pode oferecer isso. Passa uma semana. A mercadoria continua em caixas."],"Die Begründung: „Das Ziel steht fest (§ Meter).“ Der Fachbegriff: Minimalprinzip.":["እቲ ምኽንያት፦ „እቲ ዕላማ ጸኒዑ (§ ሜትሮ)።“ እቲ ቴክኒካዊ ቃል፦ Minimalprinzip።","Обоснование: «Цель задана (§ метров).» Термин: Minimalprinzip.","La justificación: «El objetivo es fijo (§ metros).» El término técnico: Minimalprinzip.","A justificação: «O objetivo é fixo (§ metros).» O termo técnico: Minimalprinzip."],"In welchem Fall handelt euer Laden nach dem Maximalprinzip?":["ኣብ ኣየናይ ኩነት ድኳንኩም ብMaximalprinzip ይሰርሕ?","В каком случае ваш магазин действует по принципу максимума (Maximalprinzip)?","¿En qué caso actúa vuestra tienda según el principio de máximo (Maximalprinzip)?","Em que caso a vossa loja age segundo o princípio do máximo (Maximalprinzip)?"],"Der Umbau soll möglichst wenig kosten.":["እቲ ምሕዳስ  Auriculares y lectores de libros electrónicos","Necessidade cultural (Kulturbedürfnis): Auscultadores e leitores de e-books"],"Kaje § bleibt euer Laden. Aber direkt daneben baut Kroll sein Parkhaus.":["Kaje § ድኳንኩም ይጸንሕ። ግን ጎኒ ጎኑ Kroll ማዕቀቢ መካይን ይሰርሕ።","Kaje § остаётся вашим магазином. Но прямо рядом Kroll строит свою парковку.","Kaje § sigue siendo vuestra tienda. Pero justo al lado Kroll construye su aparcamiento.","Kaje § continua a ser a vossa loja. Mas mesmo ao lado Kroll constrói o seu parque de estacionamento."],"Kroll kauft das Nachbarhaus":["Kroll ነቲ ጎረባብቲ ቤት ይገዝእ","Kroll покупает соседний дом","Kroll compra la casa de al lado","Kroll compra a casa do lado"],"· Kaje § (Technik) · Zielgruppe: Frau Lindqvist":["· Kaje § (ቴክኒክ) · ዒላማ ዓማዊል፦ Frau Lindqvist","· Kaje § (техника) · Целевая группа: Frau Lindqvist","· Kaje § (tecnología) · Grupo objetivo: Frau Lindqvist","· Kaje § (tecnologia) · Grupo-alvo: Frau Lindqvist"],"Kroll kauft das Nachbarhaus (euer Ende)":["Kroll ነቲ ጎረባብቲ ቤት ይገዝእ (መወዳእታኹም)","Kroll покупает соседний дом (ваш финал)","Kroll compra la casa de al lado (vuestro final)","Kroll compra a casa do lado (o vosso final)"],"Richtig: Er kauft gewerbsmäßig Waren ein und verkauft sie meist unverändert an private Endverbraucher.":["ቅኑዕ፦ ብሞያ ኣቕሑት ይገዝእ ብዙሕ ግዜ ከይቀየረ ድማ ንውልቃዊ መወዳእታ ተጠቀምቲ ይሸጥ።","Правильно: Оно профессионально закупает товары и продаёт их, как правило без изменений, частным конечным потребителям.","Correcto: Compra mercancía de forma profesional y la vende, casi siempre sin transformarla, a consumidores finales privados.","Certo: Compra mercadoria de forma profissional e vende-a, em regra sem a transformar, a consumidores finais privados."],"Richtig: Die Nachfrage geht stärker zurück als das Angebot.":["ቅኑዕ፦ እቲ ጥላብ ካብ ኣቕራቦት ብዝበዝሐ ይንኣስ።","Правильно: Спрос падает сильнее, чем предложение.","Correcto: La demanda cae más que la oferta.","Certo: A procura diminui mais do que a oferta."],"Ihr: Annehmen. § € sind § €.":["ንስኻትኩም፦ ተቐበሉ። § € § € እዩ።","Вы: Принять. § € есть § €.","Vosotros: Aceptar. § € son § €.","Vocês: Aceitar. § € são § €."],"§ % Vertrauen – Gelbe Karte, Rettungsfrage falsch":["§ % እምነት – ቢጫ ካርድ፣ ሕቶ ምድሓን ጌጋ","§ % доверия – жёлтая карточка, спасательный вопрос неверно","§ % de confianza – tarjeta amarilla, pregunta de rescate incorrecta","§ % de confiança – cartão amarelo, pergunta de salvamento errada"],"Sitzbank vor dem Laden · Leuchtschild „Offen“ · Blumenkübel am Eingang · Lastenrad für Lieferungen · Fahrradständer":["ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · ብርሃናዊ ምልክት „Offen“ (ክፉት) · ዕትሪ ኣበባ ኣብ ኣፍ ደገ · ብሽክለታ ጸዓት ንኣቕራቦት · መቐመጢ ብሽክለታ","Скамейка перед магазином · Светящаяся вывеска «Offen» (открыто) · Кадки с цветами у входа · Грузовой велосипед для доставки · Велопарковка","Banco delante de la tienda · Letrero luminoso «Offen» (abierto) · Macetas de flores en la entrada · Bici de carga para repartos · Aparcabicicletas","Banco à frente da loja · Letreiro luminoso «Offen» (aberto) · Vasos de flores à entrada · Bicicleta de carga para entregas · Suporte para bicicletas"],"falsch – Weniger Einkommen (Geldstrom) heißt weniger Konsumausgaben. Den Unternehmen fehlt Geld, sie brauchen weniger Arbeitskräfte. Den Staat gibt es im einfachen Kreislauf nicht.":["ጌጋ – ውሑድ ኣታዊ (Geldstrom) ማለት ውሑድ Konsumausgaben እዩ። ትካላት ገንዘብ ይጎድሎም፣ ውሑድ ሰራሕተኛታት የድልዮም። እቲ መንግስቲ ኣብ ቀሊል ዑደት የለን።","неверно – Меньше дохода (Geldstrom) — значит меньше расходов на потребление (Konsumausgaben). Предприятиям не хватает денег, им нужно меньше работников. Государства в простом кругообороте нет.","incorrecto – Menos ingresos (Geldstrom) significa menos gastos de consumo (Konsumausgaben). A las empresas les falta dinero y necesitan menos trabajadores. El Estado no existe en el circuito simple.","errado – Menos rendimento (Geldstrom) significa menos despesas de consumo (Konsumausgaben). Às empresas falta dinheiro e precisam de menos trabalhadores. O Estado não existe no circuito simples."],"richtig – Der Schnäppchenmarkt ist ein Handelsbetrieb – Verteilung, also tertiärer Sektor. Fischerei und Bergwerk sind primär, die Schreinerei ist sekundär.":["ቅኑዕ – እቲ Schnäppchenmarkt ዕዳጋዊ ትካል (Handelsbetrieb) እዩ – ምክፋል (Verteilung)፣ ማለት tertiärer Sektor። Fischerei (ዓሳ ምጽዳዕ) ከምኡ ድማ Bergwerk (ማዕደን) ቀዳማይ እዮም፣ Schreinerei (ሰራሒ ዕንጨይቲ) ካልኣይ እዩ።","верно – Schnäppchenmarkt — торговое предприятие (Handelsbetrieb) – распределение (Verteilung), то есть третичный сектор (tertiärer Sektor). Рыболовство (Fischerei) и рудник (Bergwerk) — первичный сектор, столярная мастерская (Schreinerei) — вторичный.","correcto – El Schnäppchenmarkt es una empresa comercial (Handelsbetrieb) – distribución (Verteilung), es decir, sector terciario (tertiärer Sektor). La pesca (Fischerei) y la mina (Bergwerk) son primarias; la carpintería (Schreinerei) es secundaria.","certo – O Schnäppchenmarkt é uma empresa comercial (Handelsbetrieb) – distribuição (Verteilung), ou seja, setor terciário (tertiärer Sektor). A pesca (Fischerei) e a mina (Bergwerk) são primárias; a carpintaria (Schreinerei) é secundária."],"Viele haben das Bedürfnis, aber keinen Bedarf: Das Geld fehlt. Ohne Bedarf gibt es keine Nachfrage.":["ብዙሓት ድሌት ኣለዎም፣ ግን ዝደለየ (Bedarf) የብሎምን፦ ገንዘብ ይጎድል። ብዘይ Bedarf ጥላብ (Nachfrage) የለን።","У многих есть потребность, но нет Bedarf: не хватает денег. Без Bedarf нет спроса (Nachfrage).","Muchos tienen la necesidad, pero no el Bedarf: falta dinero. Sin Bedarf no hay demanda (Nachfrage).","Muitos têm a necessidade, mas não o Bedarf: falta dinheiro. Sem Bedarf não há procura (Nachfrage)."],"Kulturbedürfnis: Bluetooth-Boxen und Spielkonsolen – Kulturbedürfnisse wachsen, wenn die Existenzbedürfnisse erfüllt sind. Mit kleinen Preisen haben viele dafür auch Bedarf.":["ድሌት ባህሊ (Kulturbedürfnis)፦ ድምጺ ብሉቱዝ ከምኡ ድማ ኮንሶል ጸወታ – ድሌታት ባህሊ (Kulturbedürfnisse) ይዓብዩ፣ ድሌታት ህላወ ምስ ዝምልኡ። ብትሑት ዋጋ ብዙሓት ንዚ እውን ዝደለየ (Bedarf) ኣለዎም።","Культурная потребность (Kulturbedürfnis): Bluetooth-колонки и игровые консоли – Культурные потребности (Kulturbedürfnisse) растут, когда удовлетворены жизненные. При небольших ценах у многих есть на это тоже Bedarf.","Necesidad cultural (Kulturbedürfnis): Altavoces Bluetooth y consolas de juegos – Las necesidades culturales (Kulturbedürfnisse) crecen cuando están cubiertas las básicas. A precios bajos, mucha gente también tiene Bedarf para ello.","Necessidade cultural (Kulturbedürfnis): Colunas Bluetooth e consolas de jogos – As necessidades culturais (Kulturbedürfnisse) crescem quando as básicas estão satisfeitas. A preços baixos, muita gente também tem Bedarf para isso."],"falsch – Freie Güter gibt es unbegrenzt, sie kosten nichts. Leitungswasser, Strom und Parkplätze sind knapp und haben einen Preis.":["ጌጋ – ናጻ ንብረት ብዘይ ገደብ ኣለዉ፣ ዋላ ሓንቲ ኣይኸፍሉን። ማይ ቧንቧ፣ ኤለክትሪክን መዕቆቢ መካይንን ውሑዳት እዮም ዋጋ ድማ ኣለዎም።","неверно – Свободных благ неограниченно много, они ничего не стоят. Водопроводная вода, электричество и парковки ограничены и имеют цену.","incorrecto – Los bienes libres existen sin límite y no cuestan nada. El agua del grifo, la electricidad y los aparcamientos son escasos y tienen precio.","errado – Os bens livres existem sem limite e não custam nada. A água da torneira, a eletricidade e os estacionamentos são escassos e têm preço."],"Hier steht gar nichts fest. Mit § € bekommt man nichts. Diese Formulierung widerspricht dem ökonomischen Prinzip.":["ኣብዚ ዋላ ሓንቲ ኣይጸንዐን። ብ§ € ዋላ ሓንቲ ኣይትረኽቡን። እዚ ኣዘራርባ ንቁጠባዊ መምርሒ (ökonomisches Prinzip) ይጻረር።","Здесь вообще ничего не задано. На § € ничего не получишь. Эта формулировка противоречит экономическому принципу (ökonomisches Prinzip).","Aquí no hay nada fijo. Con § € no se consigue nada. Esta formulación contradice el principio económico (ökonomisches Prinzip).","Aqui não há nada fixo. Com § € não se consegue nada. Esta formulação contraria o princípio económico (ökonomisches Prinzip)."],"Ihr braucht genau § Meter Regal. Ihr holt drei Angebote und nehmt das günstigste. – Das Ziel steht fest (§ Meter). Die Mittel sollen möglichst gering sein. Das ist das Minimalprinzip.":["ብትክክል § ሜትሮ መደርደሪ የድልየኩም። ሰለስተ ጠቕላሊታት ትወስዱ እቲ ዝተሓተ ዋጋ ድማ ትመርጹ። – እቲ ዕላማ ጸኒዑ (§ ሜትሮ)። እቲ መሳርሒ ክሳብ ዝከኣል ውሑድ ክኸውን ኣለዎ። እዚ Minimalprinzip እዩ።","Вам нужно ровно § метров стеллажей. Вы берёте три предложения и выбираете самое дешёвое. – Цель задана (§ метров). Средства должны быть как можно меньше. Это принцип минимума (Minimalprinzip).","Necesitáis exactamente § metros de estantería. Pedís tres ofertas y cogéis la más barata. – El objetivo es fijo (§ metros). Los medios deben ser lo menores posible. Este es el principio de mínimo (Minimalprinzip).","Precisam exatamente de § metros de prateleira. Pedem três propostas e escolhem a mais barata. – O objetivo é fixo (§ metros). Os meios devem ser os menores possíveis. Este é o princípio do mínimo (Minimalprinzip)."],"falsch – Beim Maximalprinzip stehen die Mittel fest (das Werbebudget). Der Nutzen (Umsatz) soll möglichst groß sein.":["ጌጋ – ኣብ Maximalprinzip እቲ መሳርሒ ጸኒዑ (በጀት ማስታወቂያ)። እቲ ረብሓ (ሽያጥ) ክሳብ ዝከኣል ዓቢ ክኸውን ኣለዎ።","неверно – При принципе максимума средства заданы (рекламный бюджет). Польза (оборот) должна быть как можно больше.","incorrecto – En el principio de máximo los medios son fijos (el presupuesto de publicidad). El beneficio (ventas) debe ser lo mayor posible.","errado – No princípio do máximo os meios são fixos (o orçamento de publicidade). O benefício (vendas) deve ser o maior possível."],"falsch – Sinkt die Nachfrage stärker als das Angebot, entsteht ein Angebotsüberschuss – die Preise fallen.":["ጌጋ – እቲ ጥላብ ካብ ኣቕራቦት ብዝበዝሐ እንተነኣሰ Angebotsüberschuss ይፍጠር — ዋጋታት ይወርዱ።","неверно – Если спрос падает сильнее предложения, возникает избыток предложения (Angebotsüberschuss) — цены падают.","incorrecto – Si la demanda baja más que la oferta, surge un exceso de oferta (Angebotsüberschuss): los precios bajan.","errado – Se a procura desce mais do que a oferta, surge um excesso de oferta (Angebotsüberschuss) — os preços descem."],"falsch – LED spart Energie und schont die Umwelt. Gehälter und Arbeitsverträge gehören zur sozialen Dimension.":["ጌጋ – LED ሓይሊ የቐንስ ንከባቢ ድማ ይሕሉ። ደሞዝን ውዕል ስራሕን ናብ ማሕበራዊ መዳይ ይኣምሩ።","неверно – LED экономит энергию и бережёт окружающую среду. Зарплаты и трудовые договоры относятся к социальному измерению.","incorrecto – El LED ahorra energía y cuida el medio ambiente. Los sueldos y los contratos de trabajo pertenecen a la dimensión social.","errado – O LED poupa energia e protege o ambiente. Os salários e os contratos de trabalho pertencem à dimensão social."],"Ihr haltet Waren vorrätig, bis die Kunden sie brauchen. Das ist Zeitüberbrückung durch Lagerhaltung.":["ኣቕሑት ክሳብ ዓማዊል ዝደልይዋ ትዕቅቡ። እዚ Zeitüberbrückung ብLagerhaltung እዩ።","Вы держите товары в наличии, пока клиенты их не потребуют. Это Zeitüberbrückung (преодоление времени) через хранение на складе (Lagerhaltung).","Tenéis la mercancía en stock hasta que los clientes la necesitan. Esto es Zeitüberbrückung (salvar el tiempo) mediante Lagerhaltung (mantener existencias).","Têm a mercadoria em stock até os clientes precisarem dela. Isto é Zeitüberbrückung (vencer o tempo) através da Lagerhaltung (manter stock)."],"falsch – Die Ware ist vorrätig und steht bereit, wenn der Kunde sie braucht: Zeitüberbrückung. Beratung ist es nicht – Jonas erklärt nichts.":["ጌጋ – እቲ ኣቕሓ ኣሎ ድሉው ድማ ዓሚል ክደልዮ ምስ ዝደሊ፦ Zeitüberbrückung። Beratung ኣይኮነን – Jonas ዋላ ሓንቲ ኣይገልጽን።","неверно – Товар есть в наличии и готов, когда клиент его требует: Zeitüberbrückung (преодоление времени). Это не Beratung – Jonas ничего не объясняет.","incorrecto – La mercancía está disponible cuando el cliente la necesita: Zeitüberbrückung (salvar el tiempo). No es Beratung – Jonas no explica nada.","errado – A mercadoria está disponível quando o cliente precisa dela: Zeitüberbrückung (vencer o tempo). Não é Beratung – O Jonas não explica nada."],"Viele Warengruppen (breit), wenig Auswahl in jeder Gruppe (flach). Gut für den schnellen Einkauf, aber wenig Auswahl.":["ብዙሓት Warengruppen (breit)፣ ውሑድ ምርጫ ኣብ ነፍሲ ወከፍ ጉጅለ (flach)። ጽቡቕ ንቀልጢፉ ዕዳጋ፣ ግን ውሑድ ምርጫ።","Много товарных групп (breit), мало выбора в каждой группе (flach). Хорошо для быстрой покупки, но мало выбора.","Muchos grupos de mercancías (breit), poca selección en cada grupo (flach). Bueno para la compra rápida, pero poca selección.","Muitos grupos de mercadorias (breit), pouca escolha em cada grupo (flach). Bom para a compra rápida, mas pouca escolha."],"Schmal und tief: nur Handys und Zubehör – aber alle Marken – Wenige Warengruppen (schmal), große Auswahl in jeder Gruppe (tief). Typisch für ein Fachgeschäft mit Beratung.":["ጸቢብን ዕሙቕን፦ ተሌፎናትን መሳርሒታትን ጥራይ — ግን ኩሉ ማርካታት – ውሑዳት Warengruppen (schmal)፣ ዓቢ ምርጫ ኣብ ነፍሲ ወከፍ ጉጅለ (tief)። ልሙድ ንFachgeschäft ምስ ምኽሪ።","Узкий и глубокий: только телефоны и аксессуары — но все марки – Мало товарных групп (schmal), большой выбор в каждой группе (tief). Типично для специализированного магазина (Fachgeschäft) с консультацией.","Estrecho y profundo: solo móviles y accesorios, pero todas las marcas – Pocos grupos de mercancías (schmal), gran selección en cada grupo (tief). Típico de un Fachgeschäft con asesoramiento.","Estreito e profundo: só telemóveis e acessórios — mas todas as marcas – Poucos grupos de mercadorias (schmal), grande escolha em cada grupo (tief). Típico de um Fachgeschäft com aconselhamento."],"richtig – Eine Handelsmarke trägt den Namen des Händlers und ist nur dort erhältlich. Das bindet Kunden und grenzt euch von Mitbewerbern ab.":["ቅኑዕ – Handelsmarke ስም ናይ ነጋዳይ ትትሕዝ ኣብኡ ጥራይ ትርከብ። እዚ ዓማዊል ይኣስር ካብ ተወዳደርቲ ድማ ይፈልየኩም።","верно – Handelsmarke носит имя торговца и продаётся только у него. Это привязывает клиентов и отличает вас от конкурентов.","correcto – Una Handelsmarke lleva el nombre del comerciante y solo se vende allí. Esto fideliza a los clientes y os diferencia de la competencia.","certo – Uma Handelsmarke tem o nome do comerciante e só se vende lá. Isto fideliza os clientes e distingue-vos da concorrência."],"Neue Betriebsformen entstehen, weil Kunden ihre Erwartungen und ihr Kaufverhalten ändern. Wer das übersieht, verliert Kunden.":["ሓደስቲ Betriebsformen (ዓይነታት ድኳን) ይፍጠሩ፣ ምኽንያቱ ዓማዊል ትጽቢቶምን ኣገዛዝኣኦምን ይቅይሩ። እዚ ዝረስዕ ዓማዊል ይስእን።","Новые Betriebsformen (формы предприятий) возникают, потому что клиенты меняют свои ожидания и покупательское поведение. Кто это упускает, теряет клиентов.","Surgen nuevas Betriebsformen (formas comerciales) porque los clientes cambian sus expectativas y su comportamiento de compra. Quien lo pasa por alto pierde clientes.","Surgem novas Betriebsformen (formas de comércio) porque os clientes mudam as suas expectativas e o seu comportamento de compra. Quem ignora isto perde clientes."],"Click & Collect: online oder telefonisch bestellen, im Laden abholen – Click & Collect: Der Kunde bestellt online oder telefonisch und holt die Ware im Geschäft ab.":["Click & Collect፦ ብኦንላይን ወይ ብተሌፎን ኣዝዙ፣ ኣብ ድኳን ተቐበሉ – Click & Collect፦ እቲ ዓሚል ኦንላይን ወይ ብተሌፎን የዝዝም ኣቕሓ ድማ ኣብ ድኳን ይወስድ።","Click & Collect: заказать онлайн или по телефону, забрать в магазине – Click & Collect: Клиент заказывает онлайн или по телефону и забирает товар в магазине.","Click & Collect: pedir online o por teléfono y recoger en la tienda – Click & Collect: El cliente pide online o por teléfono y recoge la mercancía en la tienda.","Click & Collect: encomendar online ou por telefone e levantar na loja – Click & Collect: O cliente encomenda online ou por telefone e levanta a mercadoria na loja."],"falsch – Der Discounter setzt auf sehr niedrige Preise und einfache Ausstattung – Ware auf Paletten, kaum Deko.":["ጌጋ – Discounter ኣብ ኣዝዩ ትሑት ዋጋን ቀሊል መሳርሒን ይትክል – ኣቕሓ ኣብ ፓሌት፣ ዳርጋ ጌጥ የለን።","неверно – Discounter делает ставку на очень низкие цены и простое оснащение – Товар на паллетах, почти нет декора.","incorrecto – El Discounter apuesta por precios muy bajos y equipamiento sencillo – Mercancía en palés, casi sin decoración.","errado – O Discounter aposta em preços muito baixos e equipamento simples – Mercadoria em paletes, quase sem decoração."],"Bei der Vorwahl orientiert sich der Kunde zuerst selbst. Sofort ansprechen widerspricht diesem Gedanken.":["ኣብ Vorwahl እቲ ዓሚል መጀመርታ ባዕሉ ይርኢ። ብቕጽበት ምዝርራብ ነዚ ሓሳብ ይጻረር።","При Vorwahl клиент сначала ориентируется сам. Сразу обращаться к клиенту противоречит этой идее.","En la Vorwahl el cliente primero se orienta por sí mismo. Abordar de inmediato contradice esta idea.","Na Vorwahl o cliente orienta-se primeiro por si. Abordar logo vai contra esta ideia."],"falsch – Vorwahl heißt: Der Kunde informiert sich zuerst selbst. Dafür braucht er einen übersichtlichen Warenaufbau mit Produktbeschreibung.":["ጌጋ – Vorwahl ማለት፦ እቲ ዓሚል መጀመርታ ባዕሉ ይሕብር። ንዚ ንጹር ኣደላልዋ ኣቕሓ ምስ መግለጺ ምህርቲ የድልዮ።","неверно – Vorwahl означает: Клиент сначала информируется сам. Для этого ему нужна наглядная выкладка товара с описанием продукта.","incorrecto – Vorwahl significa: El cliente primero se informa por sí mismo. Para ello necesita una colocación clara de la mercancía con descripción del producto.","errado – Vorwahl significa: O cliente informa-se primeiro por si. Para isso precisa de uma disposição clara da mercadoria com descrição do produto."],"falsch – Eine Instanz hat Leitungs- und Weisungsbefugnis, z. B. Geschäftsführung oder Abteilungsleitung.":["ጌጋ – Instanz መሰል መምርሒን ትእዛዝን ኣለዋ፣ ንኣብነት Geschäftsführung ወይ Abteilungsleitung (መሪሕ ክፍሊ)። ","неверно – У инстанции (Instanz) есть право руководства и указаний, например у руководства (Geschäftsführung) или руководителя отдела (Abteilungsleitung). ","incorrecto – Una Instanz tiene facultad de dirección y de dar instrucciones, por ejemplo la dirección (Geschäftsführung) o la jefatura de departamento (Abteilungsleitung). ","errado – Uma Instanz tem poder de direção e de dar instruções, por exemplo a direção (Geschäftsführung) ou a chefia de departamento (Abteilungsleitung). "],"Der Bäcker zahlt Herrn Petersen Miete für die Garage.":["እቲ ባኒ (Bäcker) ንHerr Petersen ንጋራጅ ክራይ ይኸፍል።","Пекарь (Bäcker) платит Herr Petersen арендную плату за гараж.","El panadero (Bäcker) paga a Herr Petersen el alquiler del garaje.","O padeiro (Bäcker) paga a Herr Petersen a renda da garagem."],"Miete ist Einkommen. Geldstrom vom Unternehmen zum Haushalt.":["ክራይ ኣታዊ እዩ። ዋሕዚ ገንዘብ ካብ ትካል ናብ ስድራቤት።","Аренда — это доход. Денежный поток от предприятия к домохозяйству.","El alquiler es un ingreso. Flujo de dinero de la empresa al hogar.","A renda é um rendimento. Fluxo de dinheiro da empresa para o agregado familiar."],"Der Bäcker gibt Familie Yilmaz die Brötchen.":["እቲ ባኒ ንFamilie Yilmaz ሕብስቲ ይህብ።","Пекарь даёт Familie Yilmaz булочки.","El panadero da los panecillos a Familie Yilmaz.","O padeiro dá os pãezinhos a Familie Yilmaz."],"Eine Ware geht zum Haushalt. Güterstrom vom Unternehmen zum Haushalt.":["ሓደ ዕቃ ናብ ስድራቤት ይኸይድ። ዋሕዚ ኣቕሑት ካብ ትካል ናብ ስድራቤት።","Товар уходит к домохозяйству. Поток товаров от предприятия к домохозяйству.","Una mercancía va al hogar. Flujo de bienes de la empresa al hogar.","Uma mercadoria vai para o agregado familiar. Fluxo de bens da empresa para o agregado familiar."],"Kautschuk-Plantage":["Kautschuk-Plantage (ዕርሻ ጎማ)","Kautschuk-Plantage (плантация каучука)","Kautschuk-Plantage (plantación de caucho)","Kautschuk-Plantage (plantação de borracha)"],"gewinnt Naturkautschuk":["ተፈጥሮኣዊ ጎማ ይወስድ","добывает натуральный каучук","obtiene caucho natural","obtém borracha natural"],"Stiefelfabrik":["Stiefelfabrik (ፋብሪካ ጫማ)","Stiefelfabrik (фабрика сапог)","Stiefelfabrik (fábrica de botas)","Stiefelfabrik (fábrica de botas)"],"stellt Gummistiefel her":["ጎማ ጫማ ይሰርሕ","изготавливает резиновые сапоги","fabrica botas de goma","fabrica galochas"],"Schuh-Großhandel":["Schuh-Großhandel (ዓቢ ዕዳጋ ጫማ)","Schuh-Großhandel (оптовик обуви)","Schuh-Großhandel (mayorista de calzado)","Schuh-Großhandel (grossista de calçado)"],"stellt die Stiefel ins Regal":["ጫማ ኣብ መደርደሪ የቐምጥ","ставит сапоги на полку","coloca las botas en el estante","coloca as botas na prateleira"],"kauft Gummistiefel":["ጎማ ጫማ ይገዝእ","покупает резиновые сапоги","compra botas de goma","compra galochas"],"Urproduktion · richtig: Kautschuk-Plantage":["ቀዳማይ ምፍራይ · ቅኑዕ፦ Kautschuk-P ጋ – ደሞዝ ካብ ትካላት ናብ ስድራቤታት ኣብ ዋሕዚ ገንዘብ (Geldstrom) ኣካል እዩ።","неверно – Зарплаты — часть денежного потока (Geldstrom) от предприятий к домохозяйствам.","incorrecto – Los sueldos son parte del flujo de dinero (Geldstrom) de las empresas a los hogares.","errado – Os salários fazem parte do fluxo de dinheiro (Geldstrom) das empresas para os agregados familiares."],"falsch – Entscheidend ist die Hauptleistung: Aus Mehl wird Brot. Das ist Weiterverarbeitung. Der Verkauf im eigenen Laden ändert daran nichts.":["ጌጋ – እቲ ወሳኒ ቀዳማይ ዕዮ እዩ፦ ካብ ሕርሲ እንጀራ ይኸውን። እዚ ምስራሕ (Weiterverarbeitung) እዩ። እቲ ሽያጥ ኣብ ናታ ድኳን እዚ ዋላ ሓንቲ ኣይቅይርን።","неверно – Решающим является основная деятельность: из муки получается хлеб. Это переработка (Weiterverarbeitung). Продажа в собственном магазине этого не меняет.","incorrecto – Lo decisivo es la actividad principal: de la harina se hace pan. Esto es transformación (Weiterverarbeitung). La venta en la propia tienda no cambia nada.","errado – O decisivo é a atividade principal: da farinha faz-se pão. Isto é transformação (Weiterverarbeitung). A venda na própria loja não muda nada."],"Das Ziel steht fest (§ Meter). Die Mittel sollen möglichst gering sein. Das ist das Minimalprinzip.":["እቲ ዕላማ ጸኒዑ (§ ሜትሮ)። እቲ መሳርሒ ክሳብ ዝከኣል ውሑድ ክኸውን ኣለዎ። እዚ Minimalprinzip እዩ።","Цель задана (§ метров). Средства должны быть как можно меньше. Это принцип минимума (Minimalprinzip).","El objetivo es fijo (§ metros). Los medios deben ser lo menores posible. Este es el principio de mínimo (Minimalprinzip).","O objetivo é fixo (§ metros). Os meios devem ser os menores possíveis. Este é o princípio do mínimo (Minimalprinzip)."],"Hier wird Energie verschwendet. Das belastet die Umwelt und kostet viel Geld.":["ኣብዚ ሓይሊ ይባኽን። እዚ ንከባቢ ይጎድእ ብዙሕ ገንዘብ ድማ የውጽእ።","Здесь расходуется энергия впустую. Это вредит окружающей среде и стоит много денег.","Aquí se desperdicia energía. Esto perjudica el medio ambiente y cuesta mucho dinero.","Aqui desperdiça-se energia. Isto prejudica o ambiente e custa muito dinheiro."],"LED-Lampen statt Halogen und Glasdeckel für die Kühltruhen – Energie sparen schont die Umwelt (Ökologie) und senkt die Kosten. Genau so steht es im Buch: LED statt Halogen.":["LED መብራህቲ ብክንዲ Halogen ከምኡ ድማ ብርጭቆ ክዳን ንቀዛሕቲ – ሓይሊ ምቕናስ ንከባቢ (Ökologie) ይሕሉ ወጻኢ ድማ የንኣስ። ከምዚ ኣብ መጽሓፍ ተጻሒፉ ኣሎ፦ LED ብክንዲ Halogen።","LED-лампы вместо галогеновых и стеклянные крышки для морозильных ларей – Экономия энергии бережёт окружающую среду (Ökologie) и снижает расходы. Именно так написано в книге: LED вместо галогена.","Lámparas LED en vez de halógenas y tapas de cristal para los congeladores – Ahorrar energía cuida el medio ambiente (Ökologie) y reduce los costes. Así lo dice el libro: LED en lugar de halógeno.","Lâmpadas LED em vez de halogéneo e tampas de vidro para as arcas congeladoras – Poupar energia protege o ambiente (Ökologie) e reduz os custos. É exatamente o que diz o livro: LED em vez de halogéneo."],"Die Druckerei lacht: „So ein Angebot gibt es nicht.“ Es kommen keine Flyer.":["እቲ ማተሚያ ይስሕቕ፦ „ከምዚ ዝበለ ጠቕላሊ የለን።“ ወረቐት ምልክት ኣይመጽእን።","Типография смеётся: «Такого предложения не бывает.» Листовки не приходят.","La imprenta se ríe: «Una oferta así no existe.» No llegan folletos.","A tipografia ri-se: «Uma proposta assim não existe.» Os folhetos não chegam."],"Familie Yilmaz geht – und kommt nicht wieder.":["Familie Yilmaz ትኸይድ – ዳግም ድማ ኣይትመጽእን።","Familie Yilmaz уходит – и больше не возвращается.","Familie Yilmaz se va – y no vuelve.","Familie Yilmaz vai-se embora – e não volta."],"Am Samstag ist Hafenfest. Ihr habt einen Stand auf dem Markt. Viele Händler verkaufen dort Handyhüllen. Die Tabelle zeigt, wie viel alle zusammen bei jedem Preis anbieten und wie viel die Besucher kaufen wollen.":["ቀዳም ፌስቲቫል ወደብ (Hafenfest) እዩ። ኣብ ዕዳጋ ደሞ ኣለኩም። ብዙሓት ነጋዶ ኣብኡ ሽፋናት ተሌፎን ይሸጡ። እቲ ሰንጠረዥ ኩሎም ብሓባር ብኽሊ ዋጋ ክንደይ ከም ዘቕርቡ ጎብኛትን ክንደይ ክገዝኡ ከም ዝደልዩ የርኢ።","В субботу праздник порта (Hafenfest). У вас есть стенд на рынке. Многие торговцы продают там чехлы для телефонов. Таблица показывает, сколько все вместе предлагают при каждой цене и сколько посетители хотят купить.","El sábado es la fiesta del puerto (Hafenfest). Tenéis un puesto en el mercado. Muchos comerciantes venden allí fundas de móvil. La tabla muestra cuánto ofrecen todos juntos a cada precio y cuánto quieren comprar los visitantes.","No sábado é a festa do porto (Hafenfest). Têm uma banca no mercado. Muitos comerciantes vendem lá capas de telemóvel. A tabela mostra quanto todos oferecem em conjunto a cada preço e quanto os visitantes querem comprar."],"Handyhüllen auf dem Hafenfest-Markt":["ሽፋናት ተሌፎን ኣብ ዕዳጋ ፌስቲቫል ወደብ","Чехлы для телефонов на рынке праздника порта","Fundas de móvil en el mercado de la fiesta del puerto","Capas de telemóvel no mercado da festa do porto"],"Diesmal hat Kroll gewonnen. Spielt noch einmal und rettet Kaje §!":["እዚ ግዜ Kroll ዓዊቱ። ዳግም ጻወቱ Kaje § ድማ ኣድሕኑ!","На этот раз Kroll выиграл. Сыграйте ещё раз и спасите Kaje §!","Esta vez ha ganado Kroll. ¡Jugad otra vez y salvad Kaje §!","Desta vez Kroll ganhou. Joguem outra vez e salvem Kaje §!"],"Kroll bekommt das Haus":["Kroll እቲ ቤት ይረክብ","Kroll получает дом","Kroll se queda con la casa","Kroll fica com a casa"],"· Kaje § (Technik) · Zielgruppe: Mia":["· Kaje § (ቴክኒክ) · ዒላማ ዓማዊል፦ Mia","· Kaje § (техника) · Целевая группа: Mia","· Kaje § (tecnología) · Grupo objetivo: Mia","· Kaje § (tecnologia) · Grupo-alvo: Mia"],"Kroll bekommt das Haus (euer Ende)":["Kroll እቲ ቤት ይረክብ (መወዳእታኹም)","Kroll получает дом (ваш финал)","Kroll se queda con la casa (vuestro final)","Kroll fica com a casa (o vosso final)"],"Lastenrad für Lieferungen · Leuchtschild „Offen“ · Sitzbank vor dem Laden · Fahrradständer · Blumenkübel am Eingang":["ብሽክለታ ጸዓት ንኣቕራቦት · ብርሃናዊ ምልክት „Offen“ (ክፉት) · ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · መቐመጢ ብሽክለታ · ዕትሪ ኣበባ ኣብ ኣፍ ደገ","Грузовой велосипед для доставки · Светящаяся вывеска «Offen» (открыто) · Скамейка перед магазином · Велопарковка · Кадки с цветами у входа","Bici de carga para repartos · Letrero luminoso «Offen» (abierto) · Banco delante de la tienda · Aparcabicicletas · Macetas de flores en la entrada","Bicicleta de carga para entregas · Letreiro luminoso «Offen» (aberto) · Banco à frente da loja · Suporte para bicicletas · Vasos de flores à entrada"],"Hier steht nichts fest. Mit § € bekommt man keinen einzigen Flyer. Eine Größe muss immer feststehen.":["ኣብዚ ዝጸንዐ ነገር የለን። ብ§ € ሓደ እኳ ወረቐት ምልክት ኣይትረኽቡን። ሓደ መጠን ኩሉ ግዜ ክጸንሕ ኣለዎ።","Здесь ничего не задано. На § € не получишь ни одной листовки. Одна величина всегда должна быть задана.","Aquí no hay nada fijo. Con § € no se consigue ni un folleto. Una magnitud siempre tiene que estar fija.","Aqui não há nada fixo. Com § € não se consegue nem um folheto. Uma grandeza tem de estar sempre fixa."],"Ihr habt § € für Flyer. Damit wollt ihr möglichst viele Haushalte erreichen. – Die Mittel stehen fest (§ €). Der Nutzen soll möglichst groß sein. Das ist das Maximalprinzip.":["§ € ንወረቐት ምልክት ኣለኩም። ብእኡ ክሳብ ዝከኣል ብዙሓት ስድራቤታት ክትበጽሑ ትደልዩ። – እቲ መሳርሒ ጸኒዑ (§ €)። እቲ ረብሓ ክሳብ ዝከኣል ዓቢ ክኸውን ኣለዎ። እዚ Maximalprinzip እዩ።","У вас есть § € на листовки. На них вы хотите охватить как можно больше домохозяйств. – Средства заданы (§ €). Польза должна быть как можно больше. Это принцип максимума (Maximalprinzip).","Tenéis § € para folletos. Con eso queréis llegar a tantos hogares como sea posible. – Los medios son fijos (§ €). El beneficio debe ser lo mayor posible. Este es el principio de máximo (Maximalprinzip).","Têm § € para folhetos. Com isso querem chegar ao maior número possível de agregados familiares. – Os meios são fixos (§ €). O benefício deve ser o maior possível. Este é o princípio do máximo (Maximalprinzip)."],"falsch – Man kann nicht gleichzeitig die Mittel gegen null senken und den Nutzen unendlich steigern. Eine Größe muss festliegen.":["ጌጋ – ብሓደ እዋን መሳርሒ ናብ ዋላ ሓንቲ ምቕናስን ረብሓ ናብ ዘይውዳእ ምዕባይን ኣይከኣልን። ሓደ መጠን ክጸንሕ ኣለዎ።","неверно – Нельзя одновременно снижать средства до нуля и повышать пользу до бесконечности. Одна величина должна быть задана.","incorrecto – No se puede reducir los medios a cero y aumentar el beneficio hasta el infinito a la vez. Una magnitud tiene que ser fija.","errado – Não se pode ao mesmo tempo reduzir os meios a zero e aumentar o benefício até ao infinito. Uma grandeza tem de estar fixa."],"Ihr gebt eure Aufgaben ab. Der Einzelhandel versorgt die Verbraucher bedarfsgerecht – das ist seine Hauptaufgabe.":["ዕዮታትኩም ትገድፉ። ንእሽተይ ዕዳጋ ንተጠቀምቲ ከም ድሌቶም የቕርብ — እዚ ቀዳማይ ዕዮኡ እዩ።","Вы отказываетесь от своих задач. Розничная торговля снабжает потребителей в соответствии с их потребностями — это её главная задача.","Renunciáis a vuestras tareas. El comercio minorista abastece a los consumidores según sus necesidades: esa es su tarea principal.","Abdicam das vossas tarefas. O comércio a retalho abastece os consumidores de acordo com as suas necessidades — essa é a sua tarefa principal."],"Super! Da kaufen wir jetzt jede Woche.":["ብሉጽ! ሕጂ ነፍሲ ወከፍ ሰሙን ኣብዚ ንገዝእ።","Супер! Теперь мы будем покупать здесь каждую неделю.","¡Genial! Ahora compraremos aquí cada semana.","Ótimo! Agora vamos comprar aqui todas as semanas."],"Die Stammkunden finden noch mehr Auswahl. Der Umsatz steigt.":["እቶም ቀዋሚ ዓማዊል ዝያዳ ምርጫ ይረኽቡ። እቲ ሽያጥ ይለዓል።","Постоянные клиенты находят ещё больше выбора. Оборот растёт.","Los clientes habituales encuentran aún más selección. Las ventas suben.","Os clientes habituais encontram ainda mais escolha. As vendas aumentam."],"Die Begründung: „Das Kernsortiment bringt den Hauptumsatz und ist ständig verkaufsbereit.“ Der Fachbegriff: Kernsortiment.":["እቲ ምኽንያት፦ „እቲ Kernsortiment ቀዳማይ ሽያጥ የምጽእ ኩሉ ግዜ ድማ ንሽያጥ ድሉው እዩ።“ እቲ ቴክኒካዊ ቃል፦ Kernsortiment።","Обоснование: «Kernsortiment приносит основной оборот и всегда готов к продаже.» Термин: Kernsortiment.","La justificación: «El Kernsortiment aporta la mayor parte de las ventas y está siempre disponible para la venta.» El término técnico: Kernsortiment.","A justificação: «O Kernsortiment traz o grosso das vendas e está sempre disponível para venda.» O termo técnico: Kernsortiment."],"Nie iales y ecológicos. Así todos tienen una orientación.","O Leitbild une objetivos económicos, sociais e ecológicos. Assim todos têm orientação."],"Ein Discounter hat ein schmales und flaches Sortiment. Begründet, warum er damit günstige Preise anbieten kann.":["Discounter ጸቢብን ጥሩ ዘይኮነ Sortiment ኣለዎ። ኣብርሁ ስለምንታይ ብእዚ ርካሽ ዋጋ ከቕርብ ይኽእል።","У дискаунтера (Discounter) узкий и неглубокий ассортимент. Объясните, почему благодаря этому он может предлагать низкие цены.","Un Discounter tiene un surtido estrecho y poco profundo. Explicad por qué así puede ofrecer precios baratos.","Um Discounter tem um sortimento estreito e pouco profundo. Expliquem porque é que assim consegue oferecer preços baixos."],"Wenige Artikel bedeuten niedrige Lagerkosten und kaum Verderb. Von jedem Artikel kauft er sehr große Mengen und bekommt günstige Einkaufspreise.":["ውሑዳት ኣርቲክል ማለት ትሑት ወጻኢ መኽዘንን ዳርጋ ምብላሽን። ካብ ነፍሲ ወከፍ ኣርቲክል ኣዝዩ ዓበይቲ መጠን ይገዝእ ርካሽ ዋጋ ግዢ ድማ ይረክብ።","Мало артикулов означает низкие складские расходы и почти нет порчи. От каждого артикула он закупает очень большие партии и получает низкие закупочные цены.","Pocos artículos significan bajos costes de almacén y casi nada de merma. De cada artículo compra cantidades muy grandes y obtiene precios de compra bajos.","Poucos artigos significam custos de armazém baixos e quase nenhuma deterioração. De cada artigo compra quantidades muito grandes e obtém preços de compra baixos."],"Artikelgruppe · richtig: Eistee":["Artikelgruppe (ጉጅለ ኣርቲክል) · ቅኑዕ፦ Eistee (በረድ ሻሂ)","Artikelgruppe (группа артикулов) · верно: Eistee (холодный чай)","Artikelgruppe (grupo de artículos) · correcto: Eistee (té helado)","Artikelgruppe (grupo de artigos) · certo: Eistee (chá gelado)"],"Die ersten Pakete gehen raus. Viel Arbeit – aber neue Kunden.":["እተን ቀዳሞት ፓኬታት ይወጻ። ብዙሕ ስራሕ – ግን ሓደስቲ ዓማዊል።","Уходят первые посылки. Много работы – но новые клиенты.","Salen los primeros paquetes. Mucho trabajo – pero clientes nuevos.","Saem os primeiros pacotes. Muito trabalho – mas clientes novos."],"Die Begründung: „Der Onlinehandel ist eine Form des Versandhandels.“ Der Fachbegriff: Versandhandel (Onlinehandel).":["እቲ ምኽንያት፦ „ኦንላይን ዕዳጋ ሓደ ዓይነት Versandhandel እዩ።“ እቲ ቴክኒካዊ ቃል፦ Versandhandel (ኦንላይን ዕዳጋ)።","Обоснование: «Онлайн-торговля — одна из форм посылочной торговли (Versandhandel).» Термин: Versandhandel (онлайн-торговля).","La justificación: «El comercio online es una forma de venta por envío (Versandhandel).» El término técnico: Versandhandel (comercio online).","A justificação: «O comércio online é uma forma de venda por envio (Versandhandel).» O termo técnico: Versandhandel (comércio online)."],"„Ich habe Schokolade mit dem Logo einer berühmten Marke. Nachgemacht natürlich. Spottbillig!“":["„ቸኮላት ምስ ምልክት ሓደ ፍሉጥ ማርካ ኣለኒ። ሓሰውቲ ምዕባይ ከም ዝኾነ ርግጽ። ኣዝዩ ርካሽ!“","„У меня есть шоколад с логотипом известной марки. Подделка, конечно. Дёшево до смешного!“","„Tengo chocolate con el logotipo de una marca famosa. Imitados, claro. ¡Tirados de precio!“","„Tenho chocolate com o logótipo de uma marca famosa. Imitação, claro. Baratíssimo!“"],"„Ich zahle euch § €, wenn ihr eure Aushilfen entlasst. Mehr Gewinn für euch!“":["„§ € ክኸፍለኩም እየ፣ ግዝያዊ ሰራሕተኛታትኩም እንተኣባሪርኩም። ዝያዳ ትርፊ ንዓኻትኩም!“","„Я заплачу вам § €, если вы уволите своих помощников. Больше прибыли для вас!“","„Os pago § € si despedís a vuestros ayudantes. ¡Más beneficio para vosotros!“","„Pago-vos § € se despedirem os vossos ajudantes. Mais lucro para vocês!“"],"Annehmen. Gewinn ist das Wichtigste.":["ተቐበሉ። ትርፊ እቲ ዝዓበየ ኣገዳሲ እዩ።","Принять. Прибыль — самое важное.","Aceptar. El beneficio es lo más importante.","Aceitar. O lucro é o mais importante."],"Ablehnen, weil soziale Ziele wie sichere Arbeitsplätze auch zählen – und ohne Team die Beratung fehlt.":["ኣይፋል በሉ፣ ምኽንያቱ ማሕበራዊ ዕላማታት ከም ውሑስ ስራሕ እውን ይቆጸሩ — ብዘይ ጉጅለ ድማ ምኽሪ ይጎድል።","Отказаться, потому что социальные цели, например надёжные рабочие места, тоже важны — а без команды нет консультации.","Rechazar, porque los objetivos sociales, como los puestos de trabajo se doria envelhece antes de alguém a comprar."],"Die Begründung: „Für § m² ist das Sortiment zu groß: hohe Lagerkosten, Ware kann verderben oder unmodern werden.“ Der Fachbegriff: zu großes Sortiment.":["እቲ ምኽንያት፦ „ንእዚ § m² እቲ Sortiment ኣዝዩ ዓቢ እዩ፦ ልዑል ወጻኢ መኽዘን፣ ኣቕሓ ክበላሸው ወይ ክሓርር ይኽእል።“ እቲ ቴክኒካዊ ቃል፦ zu großes Sortiment (ኣዝዩ ዓቢ ምርጫ)።","Обоснование: «Для § м² ассортимент слишком велик: высокие расходы на склад, товар может испортиться или выйти из моды.» Термин: zu großes Sortiment (слишком большой ассортимент).","La justificación: «Para § m² el surtido es demasiado grande: altos costes de almacén, la mercancía puede estropearse o pasar de moda.» El término técnico: zu großes Sortiment (surtido demasiado grande).","A justificação: «Para § m² o sortimento é demasiado grande: custos de armazém altos, a mercadoria pode estragar-se ou ficar fora de moda.» O termo técnico: zu großes Sortiment (sortimento demasiado grande)."],"Artikelgruppe · richtig: Schnittkäse":["Artikelgruppe (ጉጅለ ኣርቲክል) · ቅኑዕ፦ Schnittkäse (ኬዝ ዝቑረጽ)","Artikelgruppe (группа артикулов) · верно: Schnittkäse (полутвёрдый сыр)","Artikelgruppe (grupo de artículos) · correcto: Schnittkäse (queso semicurado)","Artikelgruppe (grupo de artigos) · certo: Schnittkäse (queijo de corte)"],"Ihr führt den Laden nach dem erwerbswirtschaftlichen Prinzip. Welches Ziel ist das?":["ድኳን ብerwerbswirtschaftliches Prinzip ትመርሑ። እዚ ኣየናይ ዕላማ እዩ?","Вы ведёте магазин по принципу получения дохода (erwerbswirtschaftliches Prinzip). Какая это цель?","Lleváis la tienda según el principio de lucro (erwerbswirtschaftliches Prinzip). ¿Qué objetivo es ese?","Gerem a loja segundo o princípio do lucro (erwerbswirtschaftliches Prinzip). Que objetivo é esse?"],"Die Kosten sollen durch einen höchstmöglichen Umsatz gedeckt werden.":["እቲ ወጻኢ ብዝዓበየ ሽያጥ ክሽፈን ኣለዎ።","Расходы должны покрываться максимально возможным оборотом.","Los costes deben cubrirse con las mayores ventas posibles.","Os custos devem ser cobertos com o maior volume de vendas possível." ት ህላወ (Existenzbedürfnis)፦ ባትሪታት፣ ባትሪ መብራህቲ፣ ብዙሕ መእተዊ ኤለክትሪክ – ድሌታት ህላወ (Existenzbedürfnisse) ንህይወት ኣገደስቲ እዮም። ንዚ ሰባት ገንዘብ ተሪፉዎም — Bedarf ኣለዎም።","Жизненная потребность (Existenzbedürfnis): Батарейки, фонарики, сетевые фильтры – Жизненные потребности (Existenzbedürfnisse) необходимы для жизни. На это у людей остаются деньги — у них есть Bedarf.","Necesidad básica (Existenzbedürfnis): Pilas, linternas, regletas – Las necesidades básicas (Existenzbedürfnisse) son vitales. Para esto a la gente le sobra dinero: tiene Bedarf.","Necessidade básica (Existenzbedürfnis): Pilhas, lanternas, extensões – As necessidades básicas (Existenzbedürfnisse) são vitais. Para isto as pessoas têm dinheiro de sobra — têm Bedarf."],"Weiterverarbeitung · richtig: Jeansfabrik":["ምስራሕ · ቅኑዕ፦ ፋብሪካ ጅንስ","Переработка · верно: Джинсовая фабрика","Transformación · correcto: Fábrica de vaqueros","Transformação · certo: Fábrica de calças de ganga"],"Jetzt wisst ihr, was die Leute wollen und auch bezahlen können.":["ሕጂ ትፈልጡ እንታይ ሰባት ይደልዩን ክኸፍሉን ከም ዝኽእሉ።","Теперь вы знаете, чего хотят люди и что они могут оплатить.","Ahora sabéis qué quiere la gente y qué puede pagar.","Agora sabem o que as pessoas querem e o que podem pagar."],"Die Begründung: „Ihr fragt nach dem Bedarf: dem Teil der Bedürfnisse, den die Leute mit ihrem Geld erfüllen können.“ Der Fachbegriff: Bedarf.":["እቲ ምኽንያት፦ „ንBedarf ትሓቱ፦ እቲ ሰባት ብገንዘቦም ክምልእዎ ዝኽእሉ ክፋል ናይ ምድላያት።“ እቲ ቴክኒካዊ ቃል፦ Bedarf።","Обоснование: «Вы спрашиваете про Bedarf: ту часть потребностей, которую люди могут удовлетворить на свои деньги.» Термин: Bedarf.","La justificación: «Preguntáis por el Bedarf: la parte de las necesidades que la gente puede cubrir con su dinero.» El término técnico: Bedarf.","A justificação: «Perguntam pelo Bedarf: a parte das necessidades que as pessoas podem satisfazer com o seu dinheiro.» O termo técnico: Bedarf."],"Plastiktüten gratis, alles in den Restmüll":["ነጻ ፕላስቲክ ኮኮሮ፣ ኩሉ ኣብ Restmüll","Бесплатные пластиковые пакеты, всё в остаточный мусор (Re dimento ao balcão)."],"Leuchtschild „Offen“ · Blumenkübel am Eingang · Sitzbank vor dem Laden · Lastenrad für Lieferungen · Fahrradständer":["ብርሃናዊ ምልክት „Offen“ (ክፉት) · ዕትሪ ኣበባ ኣብ ኣፍ ደገ · ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · ብሽክለታ ጸዓት ንኣቕራቦት · መቐመጢ ብሽክለታ","Светящаяся вывеска «Offen» (открыто) · Кадки с цветами у входа · Скамейка перед магазином · Грузовой велосипед для доставки · Велопарковка","Letrero luminoso «Offen» (abierto) · Macetas de flores en la entrada · Banco delante de la tienda · Bici de carga para repartos · Aparcabicicletas","Letreiro luminoso «Offen» (aberto) · Vasos de flores à entrada · Banco à frente da loja · Bicicleta de carga para entregas · Suporte para bicicletas"],"falsch – Der Schnäppchenmarkt ist ein Handelsbetrieb – Verteilung, also tertiärer Sektor. Fischerei und Bergwerk sind primär, die Schreinerei ist sekundär.":["ጌጋ – እቲ Schnäppchenmarkt ዕዳጋዊ ትካል (Handelsbetrieb) እዩ – ምክፋል (Verteilung)፣ ማለት tertiärer Sektor። Fischerei (ዓሳ ምጽዳዕ) ከምኡ ድማ Bergwerk (ማዕደን) ቀዳማይ እዮም፣ Schreinerei (ሰራሒ ዕንጨይቲ) ካልኣይ እዩ።","неверно – Schnäppchenmarkt — торговое предприятие (Handelsbetrieb) – распределение (Verteilung), то есть третичный сектор (tertiärer Sektor). Рыболовство (Fischerei) и рудник (Bergwerk) — первичный сектор, столярная мастерская (Schreinerei) — вторичный.","incorrecto – El Schnäppchenmarkt es una empresa comercial (Handelsbetrieb) – distribución (Verteilung), es decir, sector terciario (tertiärer Sektor). La pesca (Fischerei) y la mina (Bergwerk) son primarias; la carpintería (Schreinerei) es secundaria.","errado – O Schnäppchenmarkt é uma empresa comercial (Handelsbetrieb) – distribuição (Verteilung), ou seja, setor terciário (tertiärer Sektor). A pesca (Fischerei) e a mina (Bergwerk) são primárias; a carpintaria (Schreinerei) é secundária."],"richtig – Existenzbedürfnisse sind lebensnotwendig: Hunger, Durst, Schutz vor Kälte.":["ቅኑዕ – ድሌታት ህላወ ንህይወት ኣገደስቲ እዮም፦ ጥሜት፣ ጽሜ፣ ሓለዋ ካብ ቁሪ።","верно – Жизненные потребности необходимы для жизни: голод, жажда, защита от холода.","correcto – Las necesidades básicas son vitales: hambre, sed, protección contra el frío.","certo – As necessidades básicas são vitais: fome, sede, proteção contra o frio."],"richtig – Beim Maximalprinzip stehen die Mittel fest (das Werbebudget). Der Nutzen (Umsatz) soll möglichst groß sein.":["ቅኑዕ – ኣብ Maximalprinzip እቲ መሳርሒ ጸኒዑ (በጀት ማስታወቂያ)። እቲ ረብሓ (ሽያጥ) ክሳብ ዝከኣል ዓቢ ክኸውን ኣለዎ።","верно – При принципе максимума средства заданы (рекламный бюджет). Польза (оборот) должна быть как можно больше.","correcto – En el principio de máximo los medios son fijos (el presupuesto de publicidad). El beneficio (ventas) debe ser lo mayor posible.","certo – No princípio do máximo os meios são fixos (o orçamento de publicidade). O benefício (vendas) deve ser o maior possível."],"Stoffbeutel zum Ausleihen, Mehrweg-Transportkisten, Kartons ins Recycling – Mehrweg vermeidet Abfall. Kartons werden recycelt. Wer Batterien verkauft, muss alte Batterien zurücknehmen.":["ሻንጣ ጨርቂ ንኽትወስድዎ፣ ሳጹናት ዳግም ጥቕሚ ንምጽዋዕ፣ ካርቶናት ናብ Recycling – Mehrweg ቆሻሻ ይክልክል። ካርቶናት ዳግም ይጥቀሙ (recycelt)። ባትሪ ዝሸጥ ዝወዓለ ባትሪ ክምልስ ኣለዎ።","Тканевые сумки напрокат, многоразовые транспортные ящики, картон — на переработку – Mehrweg предотвращает отходы. Картон перерабатывается (recycelt). Кто продаёт батарейки, обязан принимать обратно старые.","Bolsas de tela para prestar, cajas de transporte reutilizables, cartón al reciclaje – Mehrweg evita residuos. Los cartones se reciclan (recycelt). Quien vende pilas tiene que aceptar de vuelta las usadas.","Sacos de pano para emprestar, caixas de transporte reutilizáveis, cartão para reciclagem – Mehrweg evita resíduos. Os cartões são reciclados (recycelt). Quem vende pilhas tem de aceitar de volta as usadas."],"falsch – Eine Handelsmarke trägt den Namen des Händlers und ist nur dort erhältlich. Das bindet Kunden und grenzt euch von Mitbewerbern ab.":["ጌጋ – Handelsmarke ስም ናይ ነጋዳይ ትትሕዝ ኣብኡ ጥራይ ትርከብ። እዚ ዓማዊል ይኣስር ካብ ተወዳደርቲ ድማ ይፈልየኩም።","неверно – Handelsmarke носит имя торговца и продаё imária · certo: Lithium-Bergwerk (mina de lítio)"],"Gut für die Umwelt. Aber viele Stammkunden können sich nichts mehr leisten.":["ጽቡቕ ንከባቢ። ግን ብዙሓት ቀዋሚ ዓማዊል ዋላ ሓንቲ ክገዝኡ ኣይክእሉን።","Хорошо для окружающей среды. Но многие постоянные клиенты больше ничего не могут себе позволить.","Bueno para el medio ambiente. Pero muchos clientes habituales ya no pueden permitirse nada.","Bom para o ambiente. Mas muitos clientes habituais já não podem pagar nada."],"Die Begründung: „Ökologisch gut, ökonomisch schwierig: Preise müssen auch zu kleinen Einkommen passen.“ Der Fachbegriff: Zielkonflikt der Dimensionen.":["እቲ ምኽንያት፦ „ኣብ ኢኮሎጂ ጽቡቕ፣ ኣብ ኢኮኖሚ ጽንኩር፦ ዋጋታት ንንእሽቶ ኣታዊ እውን ክሰማምዑ ኣለዎም።“ እቲ ቴክኒካዊ ቃል፦ Zielkonflikt der Dimensionen (ግጭት ዕላማታት መዳያት)።","Обоснование: «Экологично хорошо, экономически трудно: цены должны подходить и для небольших доходов.» Термин: Zielkonflikt der Dimensionen (конфликт целей между измерениями).","La justificación: «Bueno ecológicamente, difícil económicamente: los precios también tienen que ser asequibles para ingresos bajos.» El término técnico: Zielkonflikt der Dimensionen (conflicto de objetivos entre dimensiones).","A justificação: «Bom ecologicamente, difícil economicamente: os preços também têm de servir para rendimentos baixos.» O termo técnico: Zielkonflikt der Dimensionen (conflito de objetivos entre dimensões)."],"Sitzbank vor dem Laden · Fahrradständer · Blumenkübel am Eingang · Lastenrad für Lieferungen · Leuchtschild „Offen“":["ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · መቐመጢ ብሽክለታ · ዕትሪ ኣበባ ኣብ ኣፍ ደገ · ብሽክለታ ጸዓት ንኣቕራቦት · ብርሃናዊ ምልክት „Offen“ (ክፉት)","Скамейка перед магазином · Велопарковка · Кадки с цветами у входа · Грузовой велосипед для доставки · Светящаяся вывеска «Offen» (открыто)","Banco delante de la tienda · Aparcabicicletas · Macetas de flores en la entrada · Bici de carga para repartos · Letrero luminoso «Offen» (abierto)","Banco à frente da loja · Suporte para bicicletas · Vasos de flores à entrada · Bicicleta de carga para entregas · Letreiro luminoso «Offen» (aberto)"],"Ökologisch gut, ökonomisch schwierig: Preise müssen auch zu kleinen Einkommen passen. Alle drei Dimensionen gehören zusammen.":["ኣብ ኢኮሎጂ ጽቡቕ፣ ኣብ ኢኮኖሚ ጽንኩር፦ ዋጋታት ንንእሽቶ ኣታዊ እውን ክሰማምዑ ኣለዎም። ኩሎም ሰለስተ መዳያት ሓቢሩ እዮም።","Экологично хорошо, экономически трудно: цены должны подходить и для небольших доходов. Все три измерения принадлежат друг другу.","Bueno ecológicamente, difícil económicamente: los precios también tienen que ser asequibles para ingresos bajos. Las tres dimensiones van juntas.","Bom ecologicamente, difícil economicamente: os preços também têm de servir para rendimentos baixos. As três dimensões andam juntas."],"Mia teilt ein Foto: „Kaje § macht’s richtig!“":["Mia ሓንቲ ስእሊ ትካፈል፦ „Kaje § ቅኑዕ ይገብር!“","Mia делится фото: «Kaje § всё делает правильно!»","Mia comparte una foto: «¡Kaje § lo hace bien!»","Mia partilha uma foto: «Kaje § está a fazer bem!»"],"Leuchtschild „Offen“ · Fahrradständer · Sitzbank vor dem Laden · Lastenrad für Lieferungen · Blumenkübel am Eingang":["ብርሃናዊ ምልክት „Offen“ (ክፉት) · መቐመጢ ብሽክለታ · ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · ብሽክለታ ጸዓት ንኣቕራቦት · ዕትሪ ኣበባ ኣብ ኣፍ ደገ","Светящаяся вывеска «Offen» (открыто) · Велопарковка · Скамейка перед магазином · Грузовой велосипед для доставки · Кадки с цветами у входа","Letrero luminoso «Offen» (abierto) · Aparcabicicletas · Banco delante de la tienda · Bici de carga para repartos · Macetas de flores en la entrada","Letreiro luminoso «Offen» (aberto) · Suporte para bicicletas · Banco à frente da loja · Bicicleta de carga para entregas · Vasos de flores à entrada"],"richtig – Private Haushalte fragen Konsumgüter nach und bieten ihre Arbeitskraft an. Herstellen und anbieten tun die Unternehmen.":["ቅኑዕ – ውልቃዊ ስድራቤታት ንብረት ፍጆታ ይጠልቡ ሓይሊ ስራሖም ድማ የቕርቡ። ምፍራይን ምቕራብን ትካላት ይገብሩ።","верно – Частные домохозяйства спрашивают потребительские блага и предлагают свою рабочую силу. Производят и предлагают предприятия.","correcto – Los hogares privados demandan bienes de consumo y ofrecen su fuerza de trabajo. Fabricar y ofrecer lo hacen las empresas.","certo – Os agregados familiares privados procuram bens de consumo e oferecem a sua força de trabalho. Fabricar e oferecer fazem-no as empresas."],"richtig – Genau so steht es in der Prüfung: gewerbsmäßig einkaufen und meist unverändert an Verbraucher verkaufen.":["ቅኑዕ – ከምዚ ኣብ ፈተና ይጽሓፍ፦ ብሞያ ምግዛእ ብዙሕ ግዜ ከይቀየሩ ድማ ንተጠቀምቲ ምሻጥ።","верно – Именно так в экзамене: профессионально закупать и продавать потребителям, как правило без изменений.","correcto – Así aparece en el examen: comprar de forma profesional y vender casi siempre sin transformar a los consumidores.","certo – Assim aparece no exame: comprar de forma profissional e vender em regra sem transformar aos consumidores."],"Zeitüberbrückung: Die wichtigsten Waren sind immer vorrätig – sofort zum Mitnehmen – Ihr haltet Waren vorrätig, bis die Kunden sie brauchen. Das ist Zeitüberbrückung durch Lagerhaltung.":["Zeitüberbrückung (ግዜ ምሕላፍ)፦ እቶም ኣገደስቲ ኣቕሑት ኩሉ ግዜ ኣለዉ — ብቕጽበት ንምውሳድ – ኣቕሑት ክሳብ ዓማዊል ዝደልይዋ ትዕቅቡ። እዚ Zeitüberbrückung ብLagerhaltung እዩ።","Zeitüberbrückung (преодоление времени): Самые важные товары всегда в наличии — сразу с собой – Вы держите товары в наличии, пока клиенты их не потребуют. Это Zeitüberbrückung (преодоление времени) через хранение на складе (Lagerhaltung).","Zeitüberbrückung (salvar el tiempo): Los productos más importantes siempre están en stock, para llevar al momento – Tenéis la mercancía en stock hasta que los clientes la necesitan. Esto es Zeitüberbrückung (salvar el tiempo) mediante Lagerhaltung (mantener existencias).","Zeitüberbrückung (vencer o tempo): As mercadorias mais importantes estão sempre em stock — para levar de imediato – Têm a mercadoria em stock até os clientes precisarem dela. Isto é Zeitüberbrückung (vencer o tempo) através da Lagerhaltung (manter stock)."],"Das Umweltamt findet den Müll – mit euren Kartons und eurem Namen darauf.":["እቲ ጽሬት ከባቢ ቤት ጽሕፈት ነቲ ቆሻሻ ይረክብ — ምስ ካርቶናትኩምን ስምኩምን።","Экологическое ведомство находит мусор — с вашими картонами и вашим именем.","La oficina de medio ambiente encuentra la basura, con vuestras cajas y vuestro nombre.","O serviço do ambiente encontra o lixo — com as vossas caixas e o vosso nome."],"Ihr: Annehmen. Das spart Geld.":["ንስኻትኩም፦ ተቐበሉ። ገንዘብ ይቆጥብ።","Вы: Принять. Это экономит деньги.","Vosotros: Aceptar. Esto ahorra dinero.","Vocês: Aceitar. Isto poupa dinheiro."],"Fahrradständer · Leuchtschild „Offen“ · Sitzbank vor dem Laden · Blumenkübel am Eingang · Lastenrad für Lieferungen":["መቐመጢ ብሽክለታ · ብርሃናዊ ምልክት „Offen“ (ክፉት) · ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · ዕትሪ ኣበባ ኣብ ኣፍ ደገ · ብሽክለታ ጸዓት ንኣቕራቦት","Велопарковка · Светящаяся вывеска «Offen» (открыто) · Скамейка перед магазином · Кадки с цветами у входа · Грузовой велосипед для доставки","Aparcabicicletas · Letrero luminoso «Offen» (abierto) · Banco delante de la tienda · Macetas de flores en la entrada · Bici de carga para repartos","Suporte para bicicletas · Letreiro luminoso «Offen» (aberto) · Banco à frente da loja · Vasos de flores à entrada · Bicicleta de carga para entregas"],"richtig – Recycling heißt: Das Material wird wiederverwertet. Leihverpackungen sind Mehrweg – das vermeidet Abfall.":["ቅኑዕ – Recycling ማለት፦ እቲ ነገር ዳግም ይጥቀም። Leihverpackungen Mehrweg እዮም — እዚ ቆሻሻ ይክልክል።","верно – Recycling означает: Материал используется повторно. Возвратная тара (Leihverpackungen) — это Mehrweg: это предотвращает отходы.","correcto – Recycling significa: El material se reutiliza. Los envases retornables (Leihverpackungen) son Mehrweg: evitan residuos.","certo – Recycling significa: O material é reaproveitado. As embalagens retornáveis (Leihverpackungen) são Mehrweg — evitam resíduos."],"Sitzbank vor dem Laden · Fahrradständer · Leuchtschild „Offen“ · Lastenrad für Lieferungen · Blumenkübel am Eingang":["ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · መቐመጢ ብሽክለታ · ብርሃናዊ ምልክት „Offen“ (ክፉት) · ብሽክለታ ጸዓት ንኣቕራቦት · ዕትሪ ኣበባ ኣብ ኣፍ ደገ","Скамейка перед магазином · Велопарковка · Светящаяся вывеска «Offen» (открыто) · Грузовой велосипед для доставки · Кадки с цветами у входа","Banco delante
