/* Layout: eine Spalte wie ein Logbuch am Hafen – Szene oben, HUD als Schiffsanzeige, darunter die Karte der Woche */
:root{

  --navy:#173B57; --on-navy:#FFFFFF; --signal:#C8372D; --brass:#C98E17; --sea:#1B7A82;
  --ok:#2C8049; --okbg:#E0F0E5; --mid:#9A6510; --midbg:#FAEFD6; --bad:#B8322A; --badbg:#F7E1DE;
  --shadow:0 1px 2px rgba(19,34,45,.06),0 8px 22px rgba(19,34,45,.09);
  --f-disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D161D; --surface:#15222C; --surface2:#1B2B37; --ink:#E3EBF0; --ink2:#9DB1C0; --line:#2A3C4A;
  --navy:#86B9DE; --on-navy:#0D161D; --signal:#F07A6F; --brass:#E8B84A; --sea:#53BFC6;
  --ok:#62C987; --okbg:#173224; --mid:#E8B84A; --midbg:#382D12; --bad:#F07A6F; --badbg:#3B1C19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D161D; --surface:#15222C; --surface2:#1B2B37; --ink:#E3EBF0; --ink2:#9DB1C0; --line:#2A3C4A;
  --navy:#86B9DE; --on-navy:#0D161D; --signal:#F07A6F; --brass:#E8B84A; --sea:#53BFC6;
  --ok:#62C987; --okbg:#173224; --mid:#E8B84A; --midbg:#382D12; --bad:#F07A6F; --badbg:#3B1C19;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;margin:0}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-disp);font-weight:800;letter-spacing:.01em;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:clamp(44px,12vw,72px)} h2{font-size:30px} h3{font-size:22px}
p{margin:0}
.lbl{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.quiet{background:var(--surface2);border-radius:var(--r);padding:14px 16px}
.muted{color:var(--ink2)}
.small{font-size:15px}
button{font:inherit;color:inherit}
.btn{appearance:none;border:0;border-radius:10px;background:var(--navy);color:var(--on-navy);font-weight:700;font-size:18px;padding:14px 20px;min-height:52px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--navy);border:2px solid var(--navy)}
.btn.signal{background:var(--signal);color:#fff}
.btn.wide{width:100%}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.tile:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
input[type=text]{font:inherit;font-size:18px;width:100%;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--navy)}
/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--on-navy)}
.hud-in{max-width:660px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-weight:800;font-size:22px;letter-spacing:.04em;max-width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (max-width:480px){.hud-in{gap:6px 10px}.brand{order:0;flex:1 1 55%;max-width:none;font-size:20px}.iconbtn{order:1}.iconbtn .t{display:none}.hud .stat{order:2;flex:1 1 28%;flex-direction:row;align-items:baseline;gap:5px}.hud .sp{display:none}.trust{order:3}}
.hud .stat{display:flex;flex-direction:column;line-height:1.1;font-variant-numeric:tabular-nums}
.hud .stat b{font-size:17px}
.hud .stat span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hud .sp{flex:1}
.iconbtn{background:transparent;border:1.5px solid currentColor;border-radius:9px;color:inherit;min-width:44px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;cursor:pointer;font-size:14px;font-weight:700}
.iconbtn svg{width:20px;height:20px}
.iconbtn[aria-pressed="true"]{background:var(--on-navy);color:var(--navy)}
.trust{width:100%;height:6px;background:rgba(255,255,255,.22);border-radius:3px;overflow:hidden}
.trust i{display:block;height:100%;background:var(--brass);width:0;transition:width .6s}
/* Szene */
.scene{margin-top:14px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#9CC6DB}
.scene svg{display:block;width:100%;height:auto}
.fade{transition:opacity .6s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes gull{0%{transform:translateX(-40px)}100%{transform:translateX(440px)}}
.gull{animation:gull 18s linear infinite}
.boat{animation:bob 3s ease-in-out infinite}
@keyframes walk{0%{transform:translateX(-30px);opacity:0}10%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--to,230px));opacity:0}}
.walker{animation:walk 3.2s linear infinite}
@media (prefers-reduced-motion:reduce){.gull,.boat,.walker{animation:none}.trust i{transition:none}}
/* Optionen */
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;min-height:64px}
.opt .tag{flex:none;width:34px;height:34px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-family:var(--f-disp);font-size:20px}
.opt .body{flex:1;min-width:0}
.opt .cost{flex:none;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:15px;white-space:nowrap}
.opt[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
.opt[aria-pressed="true"] .tag{background:var(--navy);color:var(--on-navy)}
.opt:disabled{opacity:.42;cursor:not-allowed}
.opt.locked{cursor:default}
.opt.r-ok{border-color:var(--ok);background:var(--okbg)}
.opt.r-mid{border-color:var(--mid);background:var(--midbg)}
.opt.r-bad{border-color:var(--bad);background:var(--badbg)}
.why{font-size:15px;margin-top:6px}
/* Personen */
.persona{display:flex;gap:14px;align-items:center}
.persona svg{flex:none;width:76px;height:76px}
.bubble{position:relative;background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:17px;min-width:0}
.bubble:before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-left:0;border-right-color:var(--surface2)}
.term{border-left:6px solid var(--brass);background:var(--surface);border-radius:0 var(--r) var(--r) 0;padding:14px 16px;box-shadow:var(--shadow)}
.term h3{color:var(--navy)}
.ihk{border:1.5px dashed var(--ink2);border-radius:10px;padding:10px 12px;font-size:15px}
.ihk b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin-bottom:2px}
/* Auswahlkarten */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-height:120px;justify-content:center}
.tile svg{width:54px;height:54px}
.tile b{font-size:16px}
.tile small{font-size:13px;color:var(--ink2)}
.tile[aria-pressed="true"]{border-color:var(--navy);box-shadow:0 0 0 2px var(--navy) inset}
@media (max-width:420px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.tile{padding:10px 4px}.tile b{font-size:14px}}
/* Kartenziehen */
.flip{perspective:900px;max-width:340px;margin:0 auto;width:100%}
.flip-in{position:relative;transition:transform .8s;transform-style:preserve-3d;min-height:300px}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.face.back{background:var(--navy);color:var(--on-navy)}
.face.front{background:var(--surface);border:2px solid var(--line);transform:rotateY(180deg)}
.face.front svg{width:110px;height:110px}
@media (prefers-reduced-motion:reduce){.flip-in{transition:none}}
/* Minispiele */
.chip{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer;min-height:48px;font-size:16px;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--navy);background:var(--surface2)}

.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.cats.five{grid-template-columns:repeat(2,minmax(0,1fr))}
.slot{display:flex;gap:10px;align-items:center;border:2px dashed var(--line);border-radius:10px;padding:8px 10px;min-height:50px;background:var(--surface)}
.slot .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:15px}
.slot .s{font-size:13px;color:var(--ink2);display:block}
.slot.filled{border-style:solid;border-color:var(--navy)}
.slot.ok{border-color:var(--ok);background:var(--okbg)} .slot.no{border-color:var(--bad);background:var(--badbg)}
.pyr .slot{margin-inline:auto}
.timer{font-family:var(--f-disp);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--signal)}
.fb{border-radius:10px;padding:10px 12px;font-size:15px}
.fb.ok{background:var(--okbg);color:var(--ink)} .fb.no{background:var(--badbg);color:var(--ink)}
/* Tabelle */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:right}

th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
/* Auswertung */
.scorecard{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:8px}
.stars{display:flex;gap:6px}
.stars svg{width:40px;height:40px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-variant-numeric:tabular-nums}
.kpi b{display:block;font-size:24px;font-family:var(--f-disp)}
.kpi span{font-size:12px;color:var(--ink2);letter-spacing:.06em;text-transform:uppercase}
.bar{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sea)}
.res{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.mark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:800;flex:none}
.mark.ok{background:var(--okbg);color:var(--ok)} .mark.mid{background:var(--midbg);color:var(--mid)} .mark.no{background:var(--badbg);color:var(--bad)}
.better{font-size:15px;background:var(--surface2);border-radius:8px;padding:8px 10px}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(10,20,28,.55);display:flex;align-items:flex-end;justify-content:center}
.drawer .sheet{background:var(--surface);color:var(--ink);width:100%;max-width:660px;border-radius:16px 16px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));max-height:80vh;overflow:auto}
.words{display:flex;flex-wrap:wrap;gap:8px}
.words span{background:var(--surface2);border-radius:20px;padding:6px 12px;font-size:16px}
.event{border:2px solid var(--signal);border-radius:12px;background:var(--surface);padding:16px}
.event .lbl{color:var(--signal)}
.count{font-family:var(--f-disp);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.hint{font-size:14px;color:var(--ink2)}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--sea)} .progress i.now{background:var(--brass)}
</style>

  opts:[

     fit:{mia:2,fam:2,pet:2,lin:2},res:'Die Regale stehen. Und ihr habt Geld gespart.',term:'Minimalprinzip',
     why:'Das Ziel steht fest (40 Meter). Die Mittel sollen möglichst gering sein. Das ist das Minimalprinzip.'},

     fit:{mia:2,fam:3,pet:2,lin:2},res:'Viel Platz für Ware. Aber die Kasse ist leerer.',term:'Maximalprinzip',
     why:'Die Mittel stehen fest (1 600 €). Der Nutzen soll möglichst groß sein. Das ist das Maximalprinzip.'},
    {t:'Ihr wollt mit möglichst wenig Geld möglichst viele Regale kaufen.',cost:0,q:0,st:'N',
     fit:{mia:0,fam:0,pet:0,lin:0},res:'Kein Händler kann das anbieten. Eine Woche vergeht. Die Ware liegt weiter in Kartons.',term:'unsinnige Formulierung',
     why:'Hier steht gar nichts fest. Mit 0 € bekommt man nichts. Diese Formulierung widerspricht dem ökonomischen Prinzip.'}

  term:{n:'Das ökonomische Prinzip', d:'Maximalprinzip: Die Mittel stehen fest, der Nutzen soll möglichst groß sein. Minimalprinzip: Das Ziel steht fest, die Mittel sollen möglichst gering sein.'},
  ihk:'Die Nordstadt-Kauf GmbH bestellt 200 Stehleuchten beim preisgünstigsten Anbieter, den sie durch Angebotsvergleich ermittelt. → Minimalprinzip',
  words:['die Knappheit','die Mittel','der Nutzen','das Ziel','das ökonomische Prinzip','das Maximalprinzip','das Minimalprinzip','möglichst','gegeben'],
  pro:{q:'In welchem Fall handelt euer Laden nach dem Minimalprinzip?',
    o:['Mit zwei zusätzlichen Aushilfen wollt ihr einen möglichst hohen Umsatz erzielen.','Eine Werbeaktion soll 10 000 € Umsatz bringen – mit möglichst niedrigen Kosten.','Mit 500 € Werbegeld wollt ihr möglichst viele Kunden erreichen.','Ihr schöpft euer Einkaufsgeld voll aus und kauft nur die beste Qualität.'],a:1,

const BASE = {};
for (const id in CH){ BASE[id] = Object.assign({}, CH[id]); }
function pickFresh(key, n){
  const seen = store.get('kaje7_seen') || {};
  let list = (seen[key] || []).filter(x => x < n);
  let pool = []; for (let i=0;i<n;i++) if (!list.includes(i)) pool.push(i);
  if (!pool.length){ const last = list[list.length-1]; list = []; pool = []; for (let i=0;i<n;i++) if (i!==last || n===1) pool.push(i); }
  const v = pool[Math.floor(Math.random()*pool.length)];
  list.push(v); seen[key] = list; store.set('kaje7_seen', seen); return v;
}
function chooseVariants(){
  S.var = S.var || {}; S.pv = S.pv || {};
  for (const id of chapters()){
    const nv = 1 + ((BASE[id].alt||[]).length);
    if (S.var[id] === undefined) S.var[id] = pickFresh('v_'+id, nv);
    const np = (BASE[id].pros||[BASE[id].pro]).length;
    if (S.pv[id] === undefined) S.pv[id] = pickFresh('p_'+id, np);
  }
  if (S.kv === undefined) S.kv = pickFresh('k_'+S.branch, KETTE_ALL[S.branch].length);
  if (S.pk === undefined) S.pk = pickFresh('y_'+S.branch, PYR_ALL[S.branch].length);
}
function applyVariants(){
  if (!S || !S.branch) return;
  for (const id in BASE){
    const b = BASE[id], v = (S.var && S.var[id]) || 0;
    const alt = v>0 && b.alt ? b.alt[v-1] : {};
    CH[id] = Object.assign({}, b, alt);
    if (id==='m5'){ if (!alt.opts) CH[id].opts = marktOpts(); if (!('extra' in alt)) CH[id].extra = 'markt'; if (!alt.story) CH[id].story = b.story; }
    const pros = b.pros || [b.pro]; CH[id].pro = pros[(S.pv && S.pv[id]) || 0] || pros[0];
  }
  MK = CH.m5.mk || 'fest';
  KETTE[S.branch] = KETTE_ALL[S.branch][S.kv || 0];
  PYR[S.branch] = PYR_ALL[S.branch][S.pk || 0];
}
function has(t){ return chapters().some(id => S.ch[id]!==undefined && CH[id].opts && (CH[id].opts[S.ch[id]].tg||[]).includes(t)); }

const RECH_IDS = ['m4','m5','m11','m12'];
const rnd = a => a[Math.floor(Math.random()*a.length)];
const fmt = (v,d=2) => v.toLocaleString('de-DE',{minimumFractionDigits:d, maximumFractionDigits:d});
function rechGen(id){
  if (id==='m4'){
    for (let k=0;k<20;k++){
      const m = rnd([30,40,50]), pa = rnd([18,20,22,24]), pb = Math.round(m*pa*rnd([0.9,0.95,1.05])/10)*10, pc = rnd([16,17,18,19]), L = rnd([60,90,120]);
      const A = m*pa, B = pb, C = m*pc+L, mn = Math.min(A,B,C);
      if ([A,B,C].filter(x=>x===mn).length===1) return {q:`Ihr braucht ${m} Meter Regal und vergleicht drei Angebote (Minimalprinzip): A: ${pa} € je Meter. B: ${eur(pb)} pauschal. C: ${pc} € je Meter plus ${L} € Lieferung. Wie viel kostet das günstigste Angebot?`, ans:mn, unit:'€', steps:`A: ${m} · ${pa} € = ${eur(A)} · B: ${eur(B)} · C: ${m} · ${pc} € + ${L} € = ${eur(C)} → günstigstes Angebot: ${eur(mn)}`};
    }
  }
  if (id==='m5'){
    const t = MARKTS[MK==='imbiss'?'imbiss':'fest'], b = t.b[S.branch];
    const tbl = b.p.map((p,i)=>`${fmt(p)} €: Nachfrage ${t.N[i]}, Angebot ${t.A[i]}`).join(' · ');
    if (Math.random()<0.5) return {q:`Markt für ${b.ware}: ${tbl}. Wie groß ist der Nachfrageüberschuss bei ${fmt(b.p[0])} €? (in ${b.unit})`, ans:t.N[0]-t.A[0], unit:b.unit, steps:`Nachfrage ${t.N[0]} − Angebot ${t.A[0]} = ${t.N[0]-t.A[0]} ${b.unit} Nachfrageüberschuss`};
    return {q:`Markt für ${b.ware}: ${tbl}. Wie viel Umsatz machen alle Händler zusammen beim Gleichgewichtspreis?`, ans:b.p[2]*t.N[2], unit:'€', steps:`Gleichgewichtspreis ${fmt(b.p[2])} €, Menge ${t.N[2]} → ${fmt(b.p[2])} € · ${t.N[2]} = ${eur(b.p[2]*t.N[2])}`};
  }
  if (id==='m11'){
    if (Math.random()<0.6){ const K = rnd([40000,50000,60000,80000,100000]), r = rnd([4,5,6,7.5,8,10,12.5]), G = K*r/100;
      return {q:`Euer Laden hat ${eur(K)} Kapital eingesetzt und ${eur(G)} Gewinn gemacht. Wie hoch ist die Rentabilität in %?`, ans:r, unit:'%', steps:`Rentabilität = Gewinn · 100 : Kapital = ${eur(G)} · 100 : ${eur(K)} = ${fmt(r,1).replace(',0','')} %`}; }
    const Ko = rnd([100000,120000,150000,200000]), f = rnd([1.1,1.2,1.25,0.9]), L = Math.round(Ko*f);
    return {q:`Leistungen ${eur(L)}, Kosten ${eur(Ko)}. Berechnet die Wirtschaftlichkeit (Leistungen : Kosten).`, ans:f, unit:'', steps:`${eur(L)} : ${eur(Ko)} = ${fmt(f)} → ${f>1?'größer als 1: der Laden arbeitet wirtschaftlich':'kleiner als 1: der Laden arbeitet nicht wirtschaftlich'}`};
  }
  if (id==='m12'){
    const AB = rnd([100,150,200]), E = Math.round((800+Math.random()*800)*100)/100, A = rnd([12,35,48.5]), soll = Math.round((AB+E-A)*100)/100;
    return {q:`Kassenabschluss nach Arbeitsanweisung: Anfangsbestand ${eur(AB)}, Bareinnahmen ${fmt(E)} €, Auszahlung für Porto ${fmt(A)} €. Wie viel Geld muss in der Kasse sein?`, ans:soll, unit:'€', steps:`${fmt(AB)} € + ${fmt(E)} € − ${fmt(A)} € = ${fmt(soll)} €`};
  }
  return null;
}

function calcExtra(){
  let got=0, max=0, tr=0, k=0;
  for (const id in (S.satz||{})){ max += 4; got += 2*S.satz[id].ok; }
  for (const b of (S.boss||[])){ if (!b) continue; max += 2; if (b.ok) got += 2; }
  for (const id in (S.rech||{})){ max += 3; if (S.rech[id].ok) got += 3; }
  for (const x of (S.kroll||[])){ tr += x.tr; k += x.k; }
  for (const c of (S.cp||[])){ if (c.ok) tr += 6; }
  for (const r of (S.retry||[])){ if (r && r.q===2) tr += 2; }
  for (const e of (S.extras||[])){ tr += EX(e).t; k += EX(e).k; }
  return {got, max, tr, k};
}

const music = {
  ctx:null, master:null, want:false, active:false, intensity:0, timer:null, step:0, next:0,
  ensure(){ if (!this.ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return false; this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value = 0.3; this.master.connect(this.ctx.destination);} return true; },
  setWant(v){ this.want = v; store.set('kaje7_music', v); this.update(); },
  phase(on, inten){ this.active = on; if (inten!==undefined) this.intensity = inten; this.update(); },
  update(){ const play = this.want && this.active && !document.hidden; if (play) this.start(); else this.stop(); },
  start(){ if (this.timer || !this.ensure()) return; if (this.ctx.state==='suspended') this.ctx.resume(); this.next = this.ctx.currentTime + 0.05; this.step = 0; this.timer = setInterval(()=>this.tick(), 50); },
  stop(){ if (this.timer){ clearInterval(this.timer); this.timer = null; } },
  tick(){ const ctx = this.ctx; const bpm = 116 + this.intensity*28; const st = 60/bpm/4;
    while (this.next < ctx.currentTime + 0.15){ this.note(this.step, this.next); this.next += st; this.step = (this.step+1) % 64; } },
  osc(type, f, t, dur, vol, filt){ const ctx=this.ctx, o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    if (filt){ const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=filt; o.connect(lp); lp.connect(g);} else o.connect(g);
    g.connect(this.master); o.start(t); o.stop(t+dur+0.02); return o; },
  note(s, t){ const ctx=this.ctx; const m = n => 440*Math.pow(2,(n-69)/12);
    const bar = Math.floor(s/16), q = s%16; const roots=[45,45,48,43];
    if (q%4===0){ const o=this.osc('sine',120,t,0.25,0.9); o.frequency.exponentialRampToValueAtTime(45,t+0.18); }
    if (q%2===1){ const len=0.04, buf=ctx.createBuffer(1,ctx.sampleRate*len,ctx.sampleRate), d=buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      const src=ctx.createBufferSource(); src.buffer=buf; const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7000; const g=ctx.createGain(); g.gain.value=0.12; src.connect(hp); hp.connect(g); g.connect(this.master); src.start(t); }
    if (q%2===0) this.osc('sawtooth', m(roots[bar]+(q%8===6?7:0)), t, 0.16, 0.18, 600+this.intensity*500);
    if (this.intensity>0.4 && q%2===0){ const arp=[0,3,7,12,7,3,0,7]; this.osc('square', m(roots[bar]+24+arp[(q/2)%8]), t, 0.09, 0.035, 2400); } },
  fanfare(){ if (!this.want || !this.ensure()) return; if (this.ctx.state==='suspended') this.ctx.resume(); const t=this.ctx.currentTime+0.05; [72,76,79,84].forEach((n,i)=>this.osc('triangle',440*Math.pow(2,(n-69)/12),t+i*0.14,i===3?0.8:0.2,0.25)); }
};

function fitOf(id, i, pid){ const o = CH[id].opts[i]; let f = o.fit[pid]; if (S.conf[id]) f = Math.max(0, f-1); return f; }
function calc(){
  if (!S || !S.persona) return {trust:50, fach:0, fachMax:0, zufr:0, kunden:0, cash:S?S.cash:0};
  let got=0, max=0, fsum=0, fn=0;
  const per = {mia:[0,0],fam:[0,0],pet:[0,0],lin:[0,0]};
  for (const id of chapters()){
    const c = CH[id];
    if (c.type==='dec' && S.ch[id]!==undefined){ got += optQ(id,S.ch[id])*5; max += 10; fsum += fitOf(id,S.ch[id],S.persona); fn++;
      for (const p in per){ per[p][0]+=fitOf(id,S.ch[id],p); per[p][1]++; } }
    const mi = S.mini[id]; if (mi && mi.done){ got += 10*mi.got/mi.max; max += 10; }
    if (S.pro[id]){ max += 5; if (S.pro[id].ok) got += 5; }
  }
  const ex = calcExtra(); got += ex.got; max += ex.max;
  const fach = max ? got/max : 0.5, zufr = fn ? fsum/(fn*3) : 0.5;
  let ev = 0, evK = 0; for (const e of S.events){ ev += e.r.t; evK += e.r.k; }
  const cashPart = S.cash < 0 ? 0 : Math.min(1, S.cash/(S.start*0.25));
  let trust = Math.round(100*(0.5*fach + 0.35*zufr + 0.15*cashPart)) + ev + ex.tr;
  trust = Math.max(0, Math.min(100, trust));
  const kunden = Math.max(0, Math.round(80 + 120*zufr + evK + ex.k));
  const perc = {}; for (const p in per) perc[p] = per[p][1] ? per[p][0]/(per[p][1]*3) : 0;
  return {trust, fach, got:Math.round(got), fachMax:max, zufr, kunden, cash:S.cash, per:perc};
}
function hud(){
  const on = S && S.persona && S.phase!=='intro';
  $('#hud').hidden = !on; if (!on) return;
  const sc = calc();
  $('#hudShop').textContent = shopName().toUpperCase();
  $('#hudWeek').textContent = S.phase==='result'||S.phase==='finale' ? 'Ende' : `${S.idx+1}/${chapters().length}`;
  $('#hudCash').textContent = eur(S.cash);
  $('#hudTrust').textContent = sc.trust+' %';
  $('#hudTrustBar').style.width = sc.trust+'%';
}

  if (kind==='abt'){ ui.mi.items = shuffle(ABT).slice(0, pro?8:6); }

}

}
function miniFinished(){ const m=ui.mi; if (!m) return true; if (ui.mk==='strom'||ui.mk==='abt') return m.i>=m.items.length; if (ui.mk==='kette') return m.checked && (S.mode!=='pro'||m.secChecked); return m.checked; }
function checkOrder(){ const m=ui.mi; m.checked=true; const n=(ui.mk==='kette'?KETTE[S.branch]:PYR[S.branch]).length; let g=0; for(let j=0;j<n;j++) if (m.slots[j]===j) g++; m.got += g; m.max=(m.max||0)+n; }

// ---------- Auswertung ----------
function modStatus(id){
  const c = CH[id]; let lvl = 2;
  if (c.type==='dec' && S.ch[id]!==undefined) lvl = optQ(id,S.ch[id]);
  const mi = S.mini[id]; if (mi && mi.done){ const r = mi.got/mi.max; const l = r>=0.8?2:r>=0.5?1:0; lvl = c.type==='dec' ? Math.min(lvl,l) : l; }
  if (S.pro[id] && !S.pro[id].ok && lvl===2) lvl = 1;
  return lvl;
}
function betterFor(id){
  const c = CH[id], ch = S.ch[id], p = S.persona;
  const sc = i => optQ(id,i)*2 + (i===ch ? fitOf(id,i,p) : c.opts[i].fit[p]);
  let best = null, bs = sc(ch);
  c.opts.forEach((o,i)=>{ if (i===ch || optQ(id,i)<1) return; if (o.cost > S.start) return; const s = sc(i); if (s>bs){ bs=s; best=i; } });
  return best;
}

   ${S.events.length?`<div class="card stack"><h3>Zufallsereignis</h3>${S.events.map(e=>`<p><b>${esc(EVENTS.find(x=>x.id===e.id).title)}:</b> ${esc(e.r.txt)}</p>`).join('')}</div>`:''}

function newFin(){ return {stage:'boss', boss:pickBoss(), bi:0, step:0, ev:pickEvents(), retry:[], ri:0, counted:false}; }
function startFinale(){
  S.phase='finale'; S.cashPre = S.cash; S.boss=[]; S.retry=[]; S.events=[];
  clearInterval(ui.tm); ui = {fin:newFin()}; bossTimer(); save(); render(); window.scrollTo(0,0);
}
function nextChapter(){
  awardCard(curId());
  const q = [], more = S.idx+1 < chapters().length;
  if (more && (CP_AT[S.block]||[]).includes(S.idx)) q.push({type:'cp', at:S.idx, rq:rescueQuestion()});
  if (more && (KROLL_AT[S.block]||[]).includes(S.idx)){ const k = pickKroll(); if (k) q.push({type:'kroll', id:k}); }
  S.idx++;
  if (S.idx >= chapters().length){ S.idx = chapters().length-1; startFinale(); return; }
  if (q.length){ S.phase='inter'; clearInterval(ui.tm); ui = {inter:{queue:q, i:0}}; music.phase(false); save(); render(); window.scrollTo(0,0); return; }
  enterChapter(); window.scrollTo(0,0);
}
function newGame(keep){
  const old = S;
  S = fresh();
  if (keep){ S.team=old.team; S.shop=old.shop; S.branch=old.branch; S.mode=old.mode; S.block=old.block; S.round=(old.round||0)+1; }
  return S;
}
function startRun(){
  S.start = START_CASH[S.mode][S.block]; S.cash = S.start; S.idx = 0; S.ch={}; S.conf={}; S.mini={}; S.pro={}; S.profile=null; S.events=[]; S.flags={}; S.done=false;
  S.var={}; S.pv={}; delete S.kv; delete S.pk; chooseVariants(); applyVariants();
  S.satz={}; S.rech={}; S.kroll=[]; S.cp=[]; S.extras=[]; S.cards=[]; S.boss=[]; S.retry=[]; S.newCard=null;
  enterChapter();
}

app.addEventListener('input', e=>{
  if (e.target.id==='inTeam'){ S.team = e.target.value; const b = app.querySelector('[data-act="toDraw"]'); if (b) b.disabled = !(S.team.trim() && S.branch); }
  if (e.target.id==='inShop'){ S.shop = e.target.value; drawScene(); }
});
app.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act; if (!a) return;
  const id = S.phase==='chapter' ? curId() : null;
  switch(a){
    case 'new': S = fresh(); S.phase='setup'; render(); break;
    case 'resume': { const sv = store.get('kaje7_save'); if (sv){ S = sv; chooseVariants(); applyVariants(); ['satz','rech'].forEach(k=>{ if (!S[k]) S[k]={}; }); ['kroll','cp','extras','cards','boss','retry'].forEach(k=>{ if (!S[k]) S[k]=[]; });
      if (S.phase==='chapter' || S.phase==='inter') enterChapter(); else if (S.phase==='finale'){ if (S.cashPre!==undefined) S.cash = S.cashPre; startFinale(); } else render(); } break; }
    case 'branch': case 'mode': case 'block': S[a] = b.dataset.v; render(); break;
    case 'toDraw': S.phase='draw'; S.persona=null; render(); break;
    case 'draw': { const ps = Object.keys(PERSONAS).filter(p=>p!==S.lastPersona); S.persona = ps[Math.floor(Math.random()*ps.length)]; render(); break; }
    case 'startGame': startRun(); break;
    case 'goDecide': S.newCard=null; ui.step='decide'; ui.order = shuffle([0,1,2]); render(); break;
    case 'goMini': S.newCard=null; startMini(CH[id].mini); render(); break;
    case 'pick': ui.sel = +b.dataset.i; render(); break;
    case 'lock': {
      const c = CH[id], i = ui.sel, o = c.opts[i];
      S.ch[id] = i; S.cash -= o.cost;
      if (c.setsProfile && !S.profile) S.profile = o.st;
      else if (S.profile && S.profile!=='N' && o.st!=='N' && o.st!==S.profile) S.conf[id] = true;
      ui.step='react'; save(); render(); break; }
    case 'afterDecide': if (CH[id].after){ startMini(CH[id].after); render(); window.scrollTo(0,0); } else nextAfter(id); break;
    case 'afterMini': nextAfter(id); break;
    case 'proPick': ui.proSel = +b.dataset.i; render(); break;
    case 'proLock': { const p = CH[id].pro; S.pro[id] = {pick:ui.proSel, ok:ui.proSel===p.a}; save(); render(); break; }
    case 'nextCh': nextChapter(); break;
    case 'mAns': {
      const m = ui.mi, it = m.items[m.i]; let ok;
      if (ui.mk==='strom'){ if (S.mode==='pro'){ const [k,d] = b.dataset.v.split('|'); ok = k===it.k && d===it.d; } else ok = b.dataset.v===it.k; }
      else ok = +b.dataset.v===it.c;
      const w = ui.mk==='strom' ? it.w : `Das gehört zu: ${ABT_CATS[it.c]}.`;
      m.fb = {ok, w}; m.log.push({t:it.t, ok, w}); render(); break; }
    case 'mNext': ui.mi.i++; ui.mi.fb=null; render(); break;
    case 'slot': { const m=ui.mi; const n=(ui.mk==='kette'?KETTE[S.branch]:PYR[S.branch]).length; for(let j=0;j<n;j++){ if (m.slots[j]===undefined){ m.slots[j]=+b.dataset.k; break; } } render(); break; }
    case 'unslot': { const m=ui.mi; m.slots[+b.dataset.j]=undefined; render(); break; }
    case 'checkOrder': checkOrder(); if (!(ui.mk==='kette' && S.mode==='pro')) clearInterval(ui.tm); render(); break;
    case 'sec': ui.mi.sec[+b.dataset.j] = +b.dataset.s; render(); break;
    case 'checkSec': checkSec(); clearInterval(ui.tm); render(); break;
    case 'evRun': { const e = EVENTS.find(x=>x.id===ui.fin.ev[ui.fin.step]); const r = e.eval(S); S.events.push({id:e.id, r}); S.cash += r.c; if (e.id==='schiff') S.flags.schiff = true; save(); render(); break; }
    case 'evNext': ui.fin.step++; if (ui.fin.step >= ui.fin.ev.length){ ui.fin.stage='retry'; ui.fin.retry = retryList(); ui.fin.ri=0; } render(); window.scrollTo(0,0); break;
    case 'count': b.disabled = true; countUp(); break;
    case 'toResult': {
      S.phase='result'; S.done=true; store.del('kaje7_save');
      const sc = calc(); const rec = store.get('kaje7_rekord') || {}; const key = S.mode+'_'+S.block;
      render(); if (!rec[key] || sc.trust > rec[key]){ rec[key] = sc.trust; store.set('kaje7_rekord', rec); }
      window.scrollTo(0,0); break; }
    case 'buyEx': { const x = EX(b.dataset.v); if (x && x.cost<=S.cash-RESERVE && !S.extras.includes(x.id)){ S.cash -= x.cost; S.extras.push(x.id); save(); render(); } break; }
    case 'satz': ui.satz[b.dataset.k] = +b.dataset.i; render(); break;
    case 'satzCheck': { const subj = satzSubject(id); const ok = (ui.satz.r===subj?1:0) + (CH[id].opts[ui.satz.f].term===CH[id].opts[subj].term?1:0); S.satz[id] = {ok}; save(); render(); break; }
    case 'afterPro': nextAfter(id); break;
    case 'rechCheck': { const v = parseNum($('#inRech').value); if (v===null){ $('#inRech').focus(); break; } S.rech[id] = {val:$('#inRech').value, ok: Math.abs(v-ui.rech.ans) < 0.011, ans:ui.rech.ans}; save(); render(); break; }
    case 'krPick': ui.krSel = +b.dataset.i; render(); break;
    case 'krLock': { const it = ui.inter.queue[ui.inter.i], k = KROLL.find(x=>x.id===it.id), o = k.o[ui.krSel]; S.kroll.push({id:k.id, pick:ui.krSel, q:o.q, tr:o.tr, k:o.k, c:o.c}); S.cash += o.c; save(); render(); break; }
    case 'cpPick': ui.cpSel = +b.dataset.i; render(); break;
    case 'cpLock': { const it = ui.inter.queue[ui.inter.i], p = (BASE[it.rq.id].pros||[BASE[it.rq.id].pro])[it.rq.i]; S.cp.push({at:it.at, trust:calc().trust, yellow:true, pick:ui.cpSel, ok:ui.cpSel===p.a, q:p.q}); save(); render(); break; }
    case 'interNext': { const it = ui.inter.queue[ui.inter.i]; if (it.type==='cp' && !S.cp.find(x=>x.at===it.at)) S.cp.push({at:it.at, trust:calc().trust, yellow:false, ok:false});
      ui.inter.i++; ui.krOrder=null; ui.krSel=null; ui.cpOrder=null; ui.cpSel=null;
      if (ui.inter.i >= ui.inter.queue.length) enterChapter(); else { save(); render(); } window.scrollTo(0,0); break; }
    case 'bossPick': ui.bossSel = +b.dataset.i; render(); break;
    case 'bossLock': lockBoss(ui.bossSel); break;
    case 'bossNext': ui.fin.bi++; ui.bossSel=null; if (ui.fin.bi < ui.fin.boss.length) bossTimer(); render(); window.scrollTo(0,0); break;
    case 'bossDone': ui.fin.stage='events'; ui.fin.step=0; if (!ui.fin.ev.length){ ui.fin.stage='retry'; ui.fin.retry=retryList(); } render(); window.scrollTo(0,0); break;
    case 'rPick': ui.rSel = +b.dataset.i; render(); break;
    case 'rLock': { const it = ui.fin.retry[ui.fin.ri], o = varObj(it.id, it.v); S.retry[ui.fin.ri] = {id:it.id, v:it.v, pick:ui.rSel, q:T(o.opts[ui.rSel].q)}; save(); render(); break; }
    case 'rNext': ui.fin.ri++; ui.rSel=null; ui.rOrder=null; render(); window.scrollTo(0,0); break;
    case 'retryDone': ui.fin.stage='decide'; render(); window.scrollTo(0,0); break;
    case 'againNew': { const lp = S.persona; newGame(true); S.lastPersona = lp; S.phase='draw'; render(); window.scrollTo(0,0); break; }
    case 'againSame': { const p = S.persona; newGame(true); S.persona = p; startRun(); window.scrollTo(0,0); break; }
    case 'againBranch': newGame(true); S.phase='setup'; render(); window.scrollTo(0,0); break;
  }
});

app.addEventListener('click', e=>{ if (S.phase==='draw' && !S.persona && e.target.closest('#flip')){ const btn = app.querySelector('[data-act="draw"]'); if (btn) btn.click(); } });

// Wortspeicher
$('#btnWords').addEventListener('click', ()=>{
  const d = $('#drawer');
  const ids = S && S.phase==='chapter' ? [curId()] : chapters();
  const words = [...new Set(ids.flatMap(id=>CH[id].words))];
  d.innerHTML = `<div class="sheet stack" role="dialog" aria-label="Wortspeicher"><div class="row" style="justify-content:space-between"><h3>Wortspeicher</h3><button class="btn ghost" data-close style="min-height:44px;padding:8px 14px">Schließen</button></div>
    ${S && S.phase==='chapter' ? `<p class="muted small">Modul ${CH[curId()].mod} · ${esc(CH[curId()].topic)}</p>`:''}<div class="words">${words.map(w=>`<span>${esc(w)}</span>`).join('')}</div></div>`;
  d.hidden = false;
});
$('#drawer').addEventListener('click', e=>{ if (e.target.id==='drawer' || e.target.closest('[data-close]')) $('#drawer').hidden = true; });
$('#btnMusic').addEventListener('click', ()=>{
  music.setWant(!music.want); syncMusicBtn();
  if (music.want){ music.ensure(); if (music.ctx && music.ctx.state==='suspended') music.ctx.resume();
    const t = document.createElement('div'); t.className='fb ok'; t.style.cssText='position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:60;max-width:620px;margin:0 auto';
    t.textContent='Musik an – sie spielt bei den Minispielen und im Finale. Bitte Kopfhörer nutzen oder leise stellen.'; document.body.appendChild(t); setTimeout(()=>t.remove(), 3500); }
});

// Start
function start(data){
  music.want = !!store.get('kaje7_music'); syncMusicBtn();
  if (data && data.S && data.S.phase){ S = data.S; ui = data.ui || {}; if (S.phase==='chapter' && !ui.step) enterChapter(); else render(); }
  else { S = fresh(); render(); }
}
window.claude?.hot?.snapshot?.(()=>({S, ui:Object.assign({}, ui, {tm:null})}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

isse, Bedarf und Güter":["ሰሙን § · ሞዱል § · ድሌትን ዝደለየ ድሌትን ኣቕሑትን","Неделя § · Модуль § · Потребности, спрос по потребности и блага","Semana § · Módulo § · Necesidades, demanda potencial y bienes","Semana § · Módulo § · Necessidades, procura potencial e bens"],"Was wollen die Leute wirklich?":["ሰባት ብሓቂ እንታይ ይደልዩ?","Чего люди на самом деле хотят?","¿Qué quiere la gente de verdad?","O que quer realmente a população?"],"Bevor ihr Ware bestellt, wollt ihr wissen: Was kaufen die Leute im Viertel wirklich? Opa Hinrichs brummt: „Wünschen ist noch nicht kaufen.“":["ቅድሚ ኣቕሑት ምዝዛም፦ እንታይ ብሓቂ ሰባት ኣብ ዞባ ይገዝኡ ክትፈልጡ ትደልዩ። Opa Hinrichs ይጉረምርም፦ „ምድላይ ገና ምግዛእ ኣይኮነን።“","Прежде чем заказывать товар, вы хотите знать: что люди в районе на самом деле покупают? Opa Hinrichs ворчит: «Желать — ещё не значит покупать.»","Antes de pedir mercancía queréis saber: ¿qué compra de verdad la gente del barrio? Opa Hinrichs gruñe: «Desear aún no es comprar.»","Antes de encomendar mercadoria, querem saber: o que compra realmente a gente do bairro? Opa Hinrichs resmunga: «Desejar ainda não é comprar.»"],"„Im harten Winter § wollten alle nur Kerzen und Decken. Nach Luxus hat keiner gefragt.“":["„ኣብ ጽኑዕ ክረምቲ § ኩሎም ሽምዓን ብርድንን ጥራይ ይደልዩ ነበሩ። ሓደ እኳ ንቅንዕ ኣይሓተተን።“","„В суровую зиму § все хотели только свечи и одеяла. Никто не спрашивал о роскоши.“","„En el duro invierno de § todos solo querían velas y mantas. Nadie preguntó por el lujo.“","„No duro inverno de § todos só queriam velas e cobertores. Ninguém perguntou por luxo.“"],"Zur Entscheidung":["ናብ ውሳነ","К решению","A la decisión","Para a decisão"],"Wie findet ihr heraus, was ihr bestellen sollt?":["ከመይ ትረኽቡ እንታይ ክትዝንግዑ ከም ዘለኩም?","Как вы узнаете, что нужно заказывать?","¿Cómo averiguáis qué tenéis que pedir?","Como descobrem o que devem encomendar?"],"Tipp von Opa Hinrichs":["ምኽሪ ካብ Opa Hinrichs","Совет от Opa Hinrichs","Consejo de Opa Hinrichs","Dica de Opa Hinrichs"],"Bedürfnis = Wunsch. Bedarf = der Teil der Wünsche, den man bezahlen kann. Nachfrage = was wi "],"Bedürfnis: ein Mangelgefühl. Bedarf: der Teil der Bedürfnisse, den man mit seinem Geld erfüllen kann. Nachfrage: der Teil des Bedarfs, der am Markt wirklich gekauft wird.":["ድሌት (Bedürfnis)፦ ስምዒት ጉድለት። ዝደለየ (Bedarf)፦ እቲ ብገንዘብኩም ክትምልእዎ እትኽእሉ ክፋል ድሌታት። ጥላብ (Nachfrage)፦ እቲ ኣብ ዕዳጋ ብሓቂ ዝግዛእ ክፋል ናይ ዝደለየ።","Bedürfnis (потребность): чувство нехватки. Bedarf (спрос по потребности): та часть потребностей, которую вы можете удовлетворить своими деньгами. Nachfrage (спрос): та часть Bedarf, которая реально покупается на рынке.","Bedürfnis (necesidad): una sensación de carencia. Bedarf (demanda potencial): la parte de las necesidades que podéis cubrir con vuestro dinero. Nachfrage (demanda): la parte del Bedarf que de verdad se compra en el mercado.","Bedürfnis (necessidade): uma sensação de falta. Bedarf (procura potencial): a parte das necessidades que podem satisfazer com o vosso dinheiro. Nachfrage (procura): a parte do Bedarf que realmente se compra no mercado."],"Bedarf ist der Teil der Bedürfnisse, der mit den vorhandenen finanziellen Mitteln erfüllt werden kann. (im Prüfungsformat nachgebaut)":["ዝደለየ (Bedarf) እቲ ብዘሎ ገንዘባዊ ዓቕሚ ክምለእ ዝኽእል ክፋል ድሌታት እዩ። (ከም ኣብ ፈተና ዝተሃንጸ)","Bedarf — это часть потребностей, которую можно удовлетворить имеющимися финансовыми средствами. (в формате экзамена)","El Bedarf es la parte de las necesidades que se puede cubrir con los medios económicos disponibles. (en formato de examen)","O Bedarf é a parte das necessidades que pode ser satisfeita com os meios financeiros disponíveis. (em formato de exame)"],"Die Begründung: „Ihr erfahrt nur Bedürfnisse.“ Der Fachbegriff: Bedürfnis.":["እቲ ምኽንያት፦ „ድሌታት ጥራይ ትፈልጡ።“ እቲ ቴክኒካዊ ቃል፦ Bedürfnis።","Обоснование: «Вы узнаёте только желания.» Термин: Bedürfnis.","La justificación: «Solo os enteráis de los deseos.» El término técnico: Bedürfnis.","A justificação: «Só ficam a saber os desejos.» O termo técnico: Bedürfnis."],"Halb richtig – § Fachpunkte.":["ፍርቂ ቅኑዕ – § ነጥቢ ሞያ።","Наполовину верно – § баллов по предмету.","Medio correcto – § puntos de materia.","Meio certo – § pontos de matéria."],"Zwischen den Wochen":["መንጎ ሰሙናት","Между неделями","Entre semanas","Entre semanas"],"Kroll macht ein Angebot":["Kroll ጠቕላሊ ይህብ","Kroll делает предложение","Kroll hace una oferta","Kroll faz uma oferta"],"„Ich habe Restposten für euch: § Pelzmäntel. Nur § € – ein Schnäppchen!“":["„ተረፍ ኣቕሑት ንዓኻትኩም ኣለኒ፦ § ካፖታት ጸጉሪ። § € ጥራይ – ዕድል ዋጋ!“","„У меня для вас остатки товара: § шуб. Всего § € – выгодная сделка!“","„Tengo existencias sobrantes para vosotros: § abrigos de piel. Solo § € – ¡una ganga!“","„Tenho um lote de saldos para vocês: § casacos de pele. Só § € – uma pechincha!“"],"Baltus Kroll:":["Baltus Kroll፦","Baltus Kroll:","Baltus Kroll:","Baltus Kroll:"],"Was antwortet ihr – und warum?":["እንታይ ትመልሱ – ስለምንታይ ድማ?","Что вы ответите – и почему?","¿Qué respondéis – y por qué?","O que respondem – e porquê?"],"Ablehnen, weil die Leute im Viertel dafür keinen Bedarf haben – ihnen fehlt das Geld.":["ኣይፋል በሉ፣ ምኽንያቱ ሰባት ኣብ ዞባ ንዚ ዝደለየ (Bedarf) የብሎምን — ገንዘብ ይጎድሎም።","Отказаться, потому что у людей в районе нет Bedarf на это — им не хватает денег.","Rechazar, porque la gente del barrio no tiene Bedarf para esto: les falta dinero.","Recusar, porque as pessoas do bairro não têm Bedarf para isto — falta-lhes dinheiro."],"Annehmen. So billig bekommen wir das nie wieder.":["ተቐበሉ። ብእዚ ዋጋ ዳግም ኣይንረክብን።","Принять. Так дёшево мы этого больше никогда не получим.","Aceptar. Tan barato no lo volveremos a conseguir.","Aceitar. Tão barato nunca mais vamos conseguir."],"Ablehnen, weil Luxuswaren verboten sind.":["ኣይፋል በሉ፣ ምኽንያቱ ክቡር ኣቕሑት ክልኩል እዩ።","Отказаться, потому что предметы роскоши запрещены.","Rechazar, porque los artículos de lujo están prohibidos.","Recusar, porque os artigos de luxo são proibidos."],"Antwort festlegen":["መልሲ ኣጽንዑ","Подтвердить ответ","Confirmar la respuesta","Confirmar a resposta"],"Richtig abgelehnt – aber falsch begründet. Luxus ist nicht verboten.":["ቅኑዕ ኣይፋል በሉ – ግን ምኽንያት ጌጋ። ቅንዕ ክልኩል ኣይኮነን።","Верно отказались – но обоснование неверное. Роскошь не запрещена.","Rechazado correctamente – pero la justificación es incorrecta. El lujo no está prohibido.","Recusado corretamente – mas a justificação está errada. O luxo não é proibido."],"Halb richtig.":["ፍርቂ ቅኑዕ።","Наполовину верно.","Medio correcto.","Meio certo."],"Viele haben das Bedürfnis, aber keinen Bedarf. Ohne Bedarf gibt es keine Nachfrage – die Ware bleibt liegen.":["ብዙሓት ድሌት ኣለዎም፣ ግን ዝደለየ (Bedarf) የብሎምን። ብዘይ Bedarf ጥላብ (Nachfrage) የለን — እቲ ኣቕሓ ይተርፍ።","У многих есть потребность, но нет Bedarf. Без Bedarf нет спроса (Nachfrage) — товар остаётся лежать.","Muchos tienen la necesidad, pero no el Bedarf. Sin Bedarf no hay demanda (Nachfrage): la mercancía se queda sin vender.","Muitos têm a necessidade, mas não o Bedarf. Sem Bedarf não há procura (Nachfrage) — a mercadoria fica por vender."],"Vertrauen +§ % · Kasse +§ €":["እምነት +§ % · ሳጹን ገንዘብ +§ €","Доверие +§ % · Касса +§ €","Confianza +§ % · Caja +§ €","Confiança +§ % · Caixa +§ €"],"Woche § · Modul § · Das ökonomische Prinzip":["ሰሙን § · ሞዱል § · ቁጠባዊ መምርሒ (Das ökonomische Prinzip)","Неделя § · Модуль § · Экономический принцип","Semana § · Módulo § · El principio económico","Semana § · Módulo § · O princípio económico"],"Flyer fürs Viertel":["ወረቐት ምልክት ንዞባ","Листовки для района","Folletos para el barrio","Folhetos para o bairro"],"Niemand im Viertel weiß, dass ihr da seid. Ihr wollt Flyer verteilen. Opa Hinrichs fragt: „Was steht bei euch fest – das Geld oder das Ziel?“":["ኣብ ዞባ ሓደ እኳ ከም ዘለኹም ኣይፈልጥን። ወረቐት ምልክት ክትዘርግሑ ትደልዩ። Opa Hinrichs ይሓትት፦ „ኣብ ክንዲ ምንታይ ጸኒዑ — ገንዘብ ወይስ ዕላማ?“","Никто в районе не знает, что вы есть. Вы хотите раздавать листовки. Opa Hinrichs спрашивает: «Что у вас задано — деньги или цель?»","Nadie en el barrio sabe que estáis ahí. Queréis repartir folletos. Opa Hinrichs pregunta: «¿Qué es lo fijo para vosotros: el dinero o el objetivo?»","Ninguém no bairro sabe que vocês estão aqui. Querem distribuir folhetos. Opa Hinrichs pergunta: «O que é fixo para vocês: o dinheiro ou o objetivo?»"],"„Ich habe immer drei Angebote eingeholt. Meine Frau sagt, ich vergleiche sogar Briefmarken.“":["„ኩሉ ግዜ ሰለስተ ጠቕላሊታት ይሓትት ነበርኩ። ሰበይተይ ክሳብ ቴምብር እውን የነጻጽር ኣለኹ ትብል።“","„Я всегда запрашивал три предложения. Жена говорит, что я сравниваю даже почтовые марки.“","„Yo siempre pedía tres ofertas. Mi mujer dice que comparo hasta los sellos.“","„Eu pedia sempre três propostas. A minha mulher diz que até comparo selos.“"],"Wie plant ihr die Flyer?":["ወረቐት ምልክት ከመይ ትመድቡ?","Как вы планируете листовки?","¿Cómo planificáis los folletos?","Como planeiam os folhetos?"],"Frag immer: Was steht fest? Steht das Ziel fest (eine bestimmte Menge) → Minimalprinzip. Steht das Geld fest → Maximalprinzip.":["ኩሉ ግዜ ሕተቱ፦ እንታይ ጸኒዑ? ዕላማ ጸኒዑ (ሓደ ሙዃን ብዝሒ) → ዝተሓተ ሕጊ (Minimalprinzip)። ገንዘብ ጸኒዑ → ዝዓበየ ሕጊ (Maximalprinzip)።","Всегда спрашивайте: Что задано? Цель задана (определённое количество) → принцип минимума (Minimalprinzip). Задан бюджет → принцип максимума (Maximalprinzip).","Preguntad siempre: ¿Qué es lo fijo? El objetivo es fijo (una cantidad determinada) → principio de mínimo (Minimalprinzip). El dinero es fijo → principio de máximo (Maximalprinzip).","Perguntem sempre: O que é fixo? O objetivo é fixo (uma quantidade determinada) → princípio do mínimo (Minimalprinzip). O dinheiro é fixo → princípio do máximo (Maximalprinzip)."],"Ihr habt § € für Flyer. Damit wollt ihr möglichst viele Haushalte erreichen.":["§ € ንወረቐት ምልክት ኣለኩም። ብእኡ ክሳብ ዝከኣል ብዙሓት ስድራቤታት ክትበጽሑ ትደልዩ።","У вас есть § € на листовки. На них вы хотите охватить как можно больше домохозяйств.","Tenéis § € para folletos. Con eso queréis llegar a tantos hogares como sea posible.","Têm § € para folhetos. Com isso querem chegar ao maior número possível de agregados familiares."],"Ihr wollt genau § Haushalte erreichen. Ihr vergleicht drei Druckereien und nehmt die günstigste.":["ብትክክል § ስድራቤታት ክትበጽሑ ትደልዩ። ሰለስተ ማተሚያታት የነጻጽሩ ዝተሓተ ዋጋ ዘለዎ ድማ ትወስዱ።","Вы хотите охватить ровно § домохозяйств. Вы сравниваете три типографии и берёте самую дешёвую.","Queréis llegar exactamente a § hogares. Comparáis tres imprentas y cogéis la más barata.","Querem chegar exatamente a § agregados familiares. Comparam três tipografias e escolhem a mais barata."],"Ihr wollt mit möglichst wenig Geld möglichst viele Haushalte erreichen.":["ብዝተሓተ ገንዘብ ክሳብ ዝከኣል ብዙሓት ስድራቤታት ክትበጽሑ ትደልዩ።","Вы хотите охватить как можно больше домохозяйств как можно меньшими деньгами.","Queréis llegar a tantos hogares como sea posible con el menor dinero posible.","Querem chegar ao maior número possível de agregados familiares com o menor dinheiro possível."],"Okay, das passt für mich.":["ጽቡቕ፣ እዚ ይሰማማዓኒ።","Хорошо, мне подходит.","Vale, me encaja.","Está bem, serve-me."],"§ Flyer für wenig Geld. Die Kasse freut sich.":["§ ወረቐት ምልክት ብውሑድ ገንዘብ። እቲ ሳጹን ገንዘብ ይሕጐስ።","§ листовок за небольшие деньги. Касса радуется.","§ folletos por poco dinero. La caja se alegra.","§ folhetos por pouco dinheiro. A caixa fica contente."],"Das Ziel steht fest (§ Haushalte).":["እቲ ዕላማ ጸኒዑ (§ ስድራቤታት)።","Цель задана (§ домохозяйств).","El objetivo es fijo (§ hogares).","O objetivo é fixo (§ agregados familiares)."],"Die Mittel stehen fest (§ €).":["እቲ ዘለዎ ገንዘብ ጸኒዑ (§ €)።","Средства заданы (§ €).","Los medios son fijos (§ €).","Os meios são fixos (§ €)."],"Hier steht nichts fest.":["ኣብዚ ዝጸንዐ ነገር የለን።","Здесь ничего не задано.","Aquí no hay nada fijo.","Aqui não há nada fixo."],"unsinnige Formulierung":["ዘይምልኩዕ ኣዘራርባ","бессмысленная формулировка","formulación sin sentido","formulação sem sentido"],"Minimalprinzip":["Minimalprinzip (ዝተሓተ ሕጊ)","Minimalprinzip (принцип минимума)","Minimalprinzip (principio de mínimo)","Minimalprinzip (princípio do mínimo)"],"Maximalprinzip":["Maximalprinzip (ዝዓበየ ሕጊ)","Maximalprinzip (принцип максимума)","Maximalprinzip (principio de máximo)","Maximalprinzip (princípio do máximo)"],"Maximalprinzip: Die Mittel stehen fest, der Nutzen soll möglichst groß sein. Minimalprinzip: Das Ziel steht fest, die Mittel sollen möglichst gering sein.":["Maximalprinzip፦ እቲ መሳርሒ ጸኒዑ፣ እቲ ረብሓ ክሳብ ዝከኣል ዓቢ ክኸውን ኣለዎ። Minimalprinzip፦ እቲ ዕላማ ጸኒዑ፣ እቲ መሳርሒ ክሳብ ዝከኣል ውሑድ ክኸውን ኣለዎ።","Maximalprinzip: Средства заданы, польза должна быть как можно больше. Minimalprinzip: Цель задана, средства должны быть как можно меньше.","Maximalprinzip: Los medios son fijos; el beneficio debe ser lo mayor posible. Minimalprinzip: El objetivo es fijo; los medios deben ser lo menores posible.","Maximalprinzip: Os meios são fixos; o benefício deve ser o maior possível. Minimalprinzip: O objetivo é fixo; os meios devem ser os menores possíveis."],"Die Nordstadt-Kauf GmbH bestellt § Stehleuchten beim preisgünstigsten Anbieter, den sie durch Angebotsvergleich ermittelt. → Minimalprinzip":["Nordstadt-Kauf GmbH § መብራህቲ ደው ዝብል ካብ እቲ ዝተሓተ ዋጋ ዘለዎ ኣቕራቢ ብምንጽጻር ጠቕላሊታት ተዘንግዕ። → Minimalprinzip","Nordstadt-Kauf GmbH заказывает § торшеров у самого выгодного поставщика, которого определяет сравнением предложений. → Minimalprinzip","La Nordstadt-Kauf GmbH pide § lámparas de pie al proveedor más barato, que determina comparando ofertas. → Minimalprinzip","A Nordstadt-Kauf GmbH encomenda § candeeiros de pé ao fornecedor mais barato, que determina comparando propostas. → Minimalprinzip"],"Die Begründung: „Das Ziel steht fest (§ Haushalte).“ Der Fachbegriff: Minimalprinzip.":["እቲ ምኽንያት፦ „እቲ ዕላማ ጸኒዑ (§ ስድራቤታት)።“ እቲ ቴክኒካዊ ቃል፦ Minimalprinzip።","Обоснование: «Цель задана (§ домохозяйств).» Термин: Minimalprinzip.","La justificación: «El objetivo es fijo (§ hogares).» El término técnico: Minimalprinzip.","A justificação: «O objetivo é fixo (§ agregados familiares).» O termo técnico: Minimalprinzip."],"Etappenziel nach Woche §":["ዕላማ ደረጃ ድሕሪ ሰሙን §","Этап после недели §","Meta intermedia tras la semana §","Meta intermédia após a semana §"],"Frau Ahlers prüft zwischendurch":["Frau Ahlers ኣብ መንጎ ትፈትሽ","Frau Ahlers проверяет по ходу дела","Frau Ahlers revisa entretanto","Frau Ahlers verifica pelo meio"],"„Ich schaue mir an, wie es läuft.“":["„ከመይ do. Muitos comerciantes vendem lá bonés do porto. A tabela mostra quanto todos oferecem em conjunto a cada preço e quanto os visitantes querem comprar."],"„War der Hering knapp, stieg der Preis. War der Fang gut, fiel er. So einfach ist das.“":["„ሄሪንግ እንተኣሕተ ዋጋ ይለዓል ነበረ። ጽቡቕ ጥረ እንተነበረ ይወርድ ነበረ። ከምኡ ቀሊል እዩ።“","„Если сельди было мало, цена росла. Если улов был хорошим, она падала. Всё так просто.“","„Cuando escaseaba el arenque, subía el precio. Cuando la pesca era buena, bajaba. Así de simple es.“","„Quando o arenque escasseava, o preço subia. Quando a pesca era boa, descia. É assim tão simples.“"],"Wortspeicher":["መዝገብ ቃላት","Словарик","Banco de palabras","Banco de palavras"],"Schließen":["ዕጸው","Закрыть","Cerrar","Fechar"],"Modul § · Preisbildung auf dem Markt":["ሞዱል § · ምውሳን ዋጋ ኣብ ዕዳጋ","Модуль § · Формирование цен на рынке","Módulo § · Formación de precios en el mercado","Módulo § · Formação de preços no mercado"],"der Markt":["ዕዳጋ (Markt)","рынок (Markt)","el mercado (Markt)","o mercado (Markt)"],"das Angebot":["ኣቕራቦት (Angebot)","предложение (Angebot)","la oferta (Angebot)","a oferta (Angebot)"],"die Nachfrage":["ጥላብ (Nachfrage)","спрос (Nachfrage)","la demanda (Nachfrage)","a procura (Nachfrage)"],"der Gleichgewichtspreis":["ዋጋ ማዕረ (Gleichgewichtspreis)","равновесная цена (Gleichgewichtspreis)","el precio de equilibrio (Gleichgewichtspreis)","o preço de equilíbrio (Gleichgewichtspreis)"],"die Gleichgewichtsmenge":["መጠን ማዕረ (Gleichgewichtsmenge)","равновесное количество (Gleichgewichtsmenge)","la cantidad de equilibrio (Gleichgewichtsmenge)","a quantidade de equilíbrio (Gleichgewichtsmenge)"],"der Angebotsüberschuss":["ትርፊ ኣቕራቦት (Angebotsüberschuss)","избыток предложения (Angebotsüberschuss)","el exceso de oferta (Angebotsüberschuss)","o excesso de oferta (Angebotsüberschuss)"],"der Nachfrageüberschuss":["ትርፊ ጥላብ (Nachfrageüberschuss)","избыток спроса (Nachfrageüberschuss)","el exceso de demanda (Nachfrageüberschuss)","o excesso de procura (Nachfrageüberschuss)"],"der Käufermarkt":["ዕዳጋ ገዛኢ (Käufermarkt)","рынок покупателя (Käufermarkt)","el mercado del comprador (Käufermarkt)","o mercado do comprador (Käufermarkt)"],"der Verkäufermarkt":["ዕዳጋ ሻጣይ (Verkäufermarkt)","рынок продавца (Verkäufermarkt)","el mercado del vendedor (Verkäufermarkt)","o mercado do vendedor (Verkäufermarkt)"],"Hafen-Mützen auf dem Hafenfest-Markt":["ቆብዕ ወደብ ኣብ ዕዳጋ ፌስቲቫል ወደብ","Портовые шапки на рынке праздника порта","Gorras del puerto en el mercado de la fiesta del puerto","Bonés do porto no mercado da festa do porto"],"Preis (€ je Stück)":["ዋጋ (€ ንሓደ)","Цена (€ за штуку)","Precio (€ por unidad)","Preço (€ por unidade)"],"Angebot":["Angebot (ኣቕራቦት)","Angebot (предложение)","Angebot (oferta)","Angebot (oferta)"],"Mit welchem Preis rechnet ihr am Ende des Tages?":["ብኣየናይ ዋጋ ኣብ መወዳእታ መዓልቲ ትጽበዩ?","По какой цене вы рассчитываете в конце дня?","¿Con qué precio contáis al final del día?","Com que preço contam no fim do dia?"],"Sucht die Zeile, in der Angebot und Nachfrage gleich groß sind. Dort wird am meisten verkauft.":["እታ ኣቕራቦትን ጥላብን ማዕረ ዝኾነላ መስመር ድለዩ። ኣብኡ እቲ ዝበዝሐ ይሸጥ።","Найдите строку, где предложение и спрос равны. Там продаётся больше всего.","Buscad la fila en la que oferta y demanda son iguales. Ahí se vende más.","Procurem a linha em que a oferta e a procura são iguais. Aí vende-se mais."],"§ € je Stück":["§ € ንሓደ","§ € за штуку","§ € por unidad","§ € por unidade"],"Nee, da gehe ich lieber woanders hin.":["ኣይፋል፣ ኣነ ናብ ካልእ ቦታ ክኸይድ እየ።","Нет, я лучше пойду в другое место.","No, prefiero ir a otro sitio.","Não, prefiro ir a outro sítio."],"Fast niemand kauft. Am Abend bleibt viel Ware liegen.":["ዳርጋ ሓደ እኳ ኣይገዝእን። ኣብ ምሸት ብዙሕ ኣቕሓ ይተርፍ።","Почти никто не покупает. К вечеру много товара остаётся.","Casi nadie compra. Por la noche queda mucha mercancía.","Quase ninguém compra. À noite sobra muita mercadoria."],"Kräääh! Das war wohl nix.":["ክራህ! እዚ ጽቡቕ ኣይነበረን።","Кра-а-а! Это было не очень.","¡Cuaaá! Eso no fue gran cosa.","Craaá! Isso não correu bem."],"Möwe Kalle:":["Möwe Kalle፦","Чайка Kalle:","La gaviota Kalle:","A gaivota Kalle:"],"Eure Wahl war nicht die beste. Baut den Satz für die bessere Wahl.":["ምርጫኹም እቲ ዝበለጸ ኣይነበረን። ንእቲ ዝሓሸ ምርጫ እቲ ሓሳብ ሃንጹ።","Ваш выбор был не лучшим. Составьте предложение для лучшего выбора.","Vuestra elección no fue la mejor. Construid la frase para la mejor elección.","A vossa escolha não foi a melhor. Construam a frase para a melhor escolha."],"Der Preis liegt weit über dem Gleichgewichtspreis.":["እቲ ዋጋ ርሑቕ ልዕሊ Gleichgewichtspreis እዩ።","Цена намного выше равновесной цены (Gleichgewichtspreis).","El precio está muy por encima del precio de equilibrio (Gleichgewichtspreis).","O preço está muito acima do preço de equilíbrio (Gleichgewichtspreis)."],"Angebot und Nachfrage sind gleich groß (§).":["ኣቕራቦትን ጥላብን ማዕረ እዮም (§)።","Предложение и спрос равны (§).","La oferta y la demanda son iguales (§).","A oferta e a procura são iguais (§)."],"Der Preis liegt unter dem Gleichgewichtspreis.":["እቲ ዋጋ ትሕቲ Gleichgewichtspreis እዩ።","Цена ниже равновесной цены (Gleichgewichtspreis).","El precio está por debajo del precio de equilibrio (Gleichgewichtspreis).","O preço está abaixo do preço de equilíbrio (Gleichgewichtspreis)."],"Nachfrageüberschuss":["Nachfrageüberschuss (ትርፊ ጥላብ)","Nachfrageüberschuss (избыток спроса)","Nachfrageüberschuss (exceso de demanda)","Nachfrageüberschuss (excesso de procura)"],"Angebotsüberschuss":["Angebotsüberschuss (ትርፊ ኣቕራቦት)","Angebotsüberschuss (избыток предложения)","Angebotsüberschuss (exceso de oferta)","Angebotsüberschuss (excesso de oferta)"],"Gleichgewichtspreis":["Gleichgewichtspreis (ዋጋ ማዕረ)","Gleichgewichtspreis (равновесная цена)","Gleichgewichtspreis (precio de equilibrio)","Gleichgewichtspreis (preço de equilíbrio)"],"Bei diesem Preis sind Angebot und Nachfrage gleich groß. Er „räumt den Markt“. Im Schaubild ist er der Schnittpunkt der beiden Kurven.":["ብእዚ ዋጋ ኣቕራቦትን ጥላብን ማዕረ እዮም። „ዕዳጋ የጽሪ“ (räumt den Markt)። ኣብ ስእሊ እቲ ነጥቢ ኣብ ዝተኸፍለሉ ክልተ ጠምዝዝ እዩ።","При этой цене предложение и спрос равны. Он «очищает рынок» (räumt den Markt). На графике это точка пересечения двух кривых.","A este precio, la oferta y la demanda son iguales. «Vacía el mercado» (räumt den Markt). En el gráfico es el punto de corte de las dos curvas.","A este preço, a oferta e a procura são iguais. «Esvazia o mercado» (räumt den Markt). No gráfico é o ponto de cruzamento das duas curvas."],"Im Schnittpunkt von Angebots- und Nachfragekurve liegt der Gleichgewichtspreis. Fallende Preise gibt es, wenn die Nachfrage stärker sinkt als das Angebot.":["ኣብ ነጥቢ ምትእኽኻብ ጠምዝዝ ኣቕራቦትን ጥላብን እቲ ዋጋ ማዕረ (Gleichgewichtspreis) ኣሎ። ዋጋታት ይወርዱ እንተ ጥላብ ካብ ኣቕራቦት ብዝበዝሐ ይውሕድ።","В точке пересечения кривых предложения и спроса лежит равновесная цена (Gleichgewichtspreis). Цены падают, когда спрос снижается сильнее, чем предложение.","En el punto de corte de las curvas de oferta y demanda está el precio de equilibrio (Gleichgewichtspreis). Los precios bajan cuando la demanda cae más que la oferta.","No ponto de cruzamento das curvas da oferta e da procura está o preço de equilíbrio (Gleichgewichtspreis). Os preços descem quando a procura diminui mais do que a oferta."],"Ich bin nur eine Möwe. Aber DAS war daneben.":["ኣነ ሓንቲ ጋይላ ጥራይ እየ። ግን እዚ ኣብ ወጻኢ እዩ ነይሩ።","Я всего лишь чайка. Но ЭТО было мимо.","Yo solo soy una gaviota. Pero ESO no estuvo bien.","Eu sou só uma gaivota. Mas ISTO foi fora de questão."],"Uff. Frau Ahlers schreibt mit …":["ኡፍ። Frau Ahlers ትጽሕፍ …","Уф. Frau Ahlers делает пометки …","Uf. Frau Ahlers toma notas …","Uf. Frau Ahlers vai tomando notas …"],"Die Begründung: „Angebot und Nachfrage sind gleich groß (§).“ Der Fachbegriff: Gleichgewichtspreis.":["እቲ ምኽንያት፦ „ኣቕራቦትን ጥላብን ማዕረ እዮም (§)።“ እቲ ቴክኒካዊ ቃል፦ Gleichgewichtspreis።","Обоснование: «Предложение и спрос равны (§).» Термин: Gleichgewichtspreis.","La justificación: «La oferta y la demanda son iguales (§).» El término técnico: Gleichgewichtspreis.","A justificação: «A oferta e a procura são iguais (§).» O termo técnico: Gleichgewichtspreis."],"Leider falsch.":["ጌጋ።","К сожалению, неверно.","Lamentablemente, incorrecto.","Infelizmente, errado."],"Woche § · Modul § · Umweltschutz und Nachhaltigkeit":["ሰሙን § · ሞዱል § · ሓለዋ ከባቢ ከምኡ ድማ ንዘላቒ ምኽታል","Неделя § · Модуль § · Защита окружающей среды и устойчивость","Semana § · Módulo § · Protección del medio ambiente y sostenibilidad","Semana § · Módulo § · Proteção do ambiente e sustentabilidade"],"Drei Dimensionen":["ሰለስተ መዳይ","Три измерения","Tres dimensiones","Três dimensões"],"Frau Ahlers sagt: „Nachhaltig ist nur, wer alle drei Dimensionen beachtet: Ökologie, Ökonomie und Soziales.“ Ihr habt Geld für eine Maßnahme.":["Frau Ahlers ትብል፦ „ዘላቒ ዝኸውን ኩሉ ሰለስተ መዳይ ዝሕሉ ጥራይ እዩ፦ ኢኮሎጂ (Ökologie)፣ ኢኮኖሚ (Ökonomie) ከምኡ ድማ ማሕበራዊ (Soziales)።“ ንሓንቲ ስጉምቲ ገንዘብ ኣለኩም።","Frau Ahlers говорит: «Устойчив только тот, кто учитывает все три измерения: экологию (Ökologie), экономику (Ökonomie) и социальную сферу (Soziales).» У вас есть деньги на одну меру.","Frau Ahlers dice: «Solo es sostenible quien tiene en cuenta las tres dimensiones: ecología (Ökologie), economía (Ökonomie) y lo social (Soziales).» Tenéis dinero para una medida.","Frau Ahlers diz: «Só é sustentável quem tem em conta as três dimensões: ecologia (Ökologie), economia (Ökonomie) e o social (Soziales).» Têm dinheiro para uma medida."],"„Pfandflaschen hatten wir schon, da hieß das noch gar nicht Nachhaltigkeit.“":["„ጠርሙሳት ምምላስ (Pfandflaschen) ኣቐዲምና ነበረና፣ ሽዑ ገና ዘላቒ ምኽታል ኣይተባህለን።“","«Бутылки под залог у нас были давно, тогда это ещё не называлось устойчивостью.»","«Botellas con depósito ya teníamos, entonces aún no se llamaba sostenibilidad.»","«Garrafas com depósito já tínhamos, nessa altura ainda nem se chamava sustentabilidade.»"],"Welche Maßnahme wählt ihr?":["ኣየናይ ስጉምቲ ትመርጹ?","Какую меру вы выберете?","¿Qué medida elegís?","Que medida escolhem?"],"Ökologie: Umwelt schonen. Ökonomie: wirtschaftlich erfolgreich bleiben. Soziales: fair mit Menschen umgehen.":["ኢኮሎጂ (Ökologie)፦ ንከባቢ ምሕላው። ኢኮኖሚ (Ökonomie)፦ ብምጥባቕ ዓወት ኮይኑ ምጽናሕ። ማሕበራዊ (Soziales)፦ ምስ ሰባት ብፍትሒ ምትሕሓዝ።","Ökologie (экология): беречь окружающую среду. Ökonomie (экономика): оставаться экономически успешным. Soziales (социальное): справедливо обращаться с людьми.","Ökologie (ecología): cuidar el medio ambiente. Ökonomie (economía): seguir siendo económicamente exitoso. Soziales (lo social): tratar a las personas con justicia.","Ökologie (ecologia): proteger o ambiente. Ökonomie (economia): manter o sucesso económico. Soziales (o social): tratar as pessoas com justiça."],"Faire Bezahlung und familienfreundliche Arbeitszeiten für euer Team":["ፍትሓዊ ክፍሊትን ንስድራቤት ምቹእ ሰዓታት ስራሕን ንጉጅለኹም","Справедливая оплата и семейно-дружественный график для вашей команды","Pago justo y horarios de trabajo compatibles con la familia para vuestro equipo","Pagamento justo e horários compatíveis com a família para a vossa equipa"],"Ihr kauft beim billigsten Lieferer – auch wenn er Kinderarbeit nicht ausschließt":["ካብ እቲ ዝሓተ ዋጋ ዘለዎ ኣቕራቢ ትገዝኡ — እኳ ድኣ ስራሕ ህጻናት ዘይተገድፈ እንተኾነ","Вы покупаете у самого дешёвого поставщика — даже если он не исключает детский труд","Compráis al proveedor más barato, aunque no excluya el trabajo infantil","Compram ao fornecedor mais barato, mesmo que ele não exclua o trabalho infantil"],"Ihr verkauft nur noch die teuersten Bio-Waren – egal, ob die Leute im Viertel sie bezahlen können":["ዝተኸብሩ ባዮ ኣቕሑት ጥራይ ትሸጡ — ሰባት ኣብ ዞባ ክኸፍሉ ይኽእሉ ወይ ኣይኽእሉ ዘይግድስ","Вы продаёте только самые дорогие биотовары — неважно, могут ли люди в районе их оплатить","Vendéis solo los productos ecológicos más caros, sin importar si la gente del barrio puede pagarlos","Vendem só os produtos biológicos mais caros, tanto faz se as pessoas do bairro os podem pagar"],"Das Team bleibt gern. Die Kunden merken die gute Stimmung.":["እቲ ጉጅለ ብፍቕሪ ይጸንሕ። እቶም ዓማዊል ጽቡቕ መንፈስ የስተውዕሉ።","Команда охотно остаётся. Клиенты замечают хорошее настроение.","El equipo se queda con gusto. Los clientes notan el buen ambiente.","A equipa fica com gosto. Os clientes notam o bom ambiente."],"Leistungsgerechte Bezahlung und familienfreundliche Arbeitszeiten gehören zur sozialen Dimension der Nachhaltigkeit.":["ብዓቕሚ ዝተመጣጠነ ክፍሊትን ንስድራቤት ምቹእ ሰዓታት ስራሕን ናብ ማሕበራዊ መዳይ (soziale Dimension) ናይ ዘላቒ ምኽታል ይኣምር።","Оплата по труду и семейно-дружественный график относятся к социальному измерению (soziale Dimension) устойчивости.","El pago acorde al rendimiento y los horarios compatibles con la familia forman parte de la dimensión social (soziale Dimension) de la sostenibilidad.","O pagamento justo pelo desempenho e os horários compatíveis com a família fazem parte da dimensão social (soziale Dimension) da sustentabilidade."],"Ökologisch gut, ökonomisch schwierig: Preise müssen auch zu kleinen Einkommen passen.":["ኣብ ኢኮሎጂ ጽቡቕ፣ ኣብ ኢኮኖሚ ጽንኩር፦ ዋጋታት ንንእሽቶ ኣታዊ እውን ክሰማምዑ ኣለዎም።","Экологично хорошо, экономически трудно: цены должны подходить и для небольших доходов.","Bueno ecológicamente, difícil económicamente: los precios también tienen que ser asequibles para ingresos bajos.","Bom ecologicamente, difícil economicamente: os preços também têm de servir para rendimentos baixos."],"Nachhaltige Händler wählen Lieferer mit Sozialstandards.":["ዘላቒ ነጋዶ ኣቕራቢ ምስ ማሕበራዊ ደረጃታት ይመርጹ።","Устойчивые торговцы выбирают поставщиков с социальными стандартами.","Los comerciantes sostenibles eligen proveedores con estándares sociales.","Os comerciantes sustentáveis escolhem fornecedores com padrões sociais."],"Verstoß gegen die soziale Dimension":["ጥሒሰ ማሕበራዊ መዳይ","нарушение социального измерения","infracción de la dimensión social","violação da dimensão social"],"Zielkonflikt der Dimensionen":["ግጭት ዕላማታት መዳያት (Zielkonflikt)","конфликт целей между измерениями (Zielkonflikt)","conflicto de objetivos entre dimensiones (Zielkonflikt)","conflito de objetivos entre dimensões (Zielkonflikt)"],"soziale Dimension":["ማሕበራዊ መዳይ (soziale Dimension)","социальное измерение (soziale Dimension)","dimensión social (soziale Dimension)","dimensão social (soziale Dimension)"],"Abfallvermeidung: Abfall entsteht gar nicht (Mehrweg). Abfallverminderung: weniger Abfall (Nachfüllpack). Recycling: das Material wird wiederverwertet.":["Abfallvermeidung (ቆሻሻ ምክልካል)፦ ቆሻሻ ጥራይ ኣይፍጠርን (Mehrweg)። Abfallverminderung (ቆሻሻ ምጉዳል)፦ ውሑድ ቆሻሻ (Nachfüllpack)። Recycling (ዳግም ምጥቃም)፦ እቲ ነገር ዳግም ይጥቀም።","Abfallvermeidung (предотвращение отходов): Отходы вообще не возникают (Mehrweg — многоразовое). Abfallverminderung (сокращение отходов): меньше отходов (Nachfüllpack — упаковка для пополнения). Recycling (переработка): материал используется повторно.","Abfallvermeidung (evitar residuos): Los residuos ni siquiera se producen (Mehrweg: reutilizable). Abfallverminderung (reducir residuos): menos residuos (Nachfüllpack: recambio). Recycling (reciclaje): el material se reutiliza.","Abfallvermeidung (evitar resíduos): Os resíduos nem sequer surgem (Mehrweg: reutilizável). Abfallverminderung (reduzir resíduos): menos resíduos (Nachfüllpack: recarga). Recycling (reciclagem): o material é reaproveitado."],"Laut Gesetz muss der Kunde die Möglichkeit haben, am Ort des Verkaufs von Batterien diese in einem Sammelbehälter zu entsorgen.":["ብሕጊ ዓማዊል ኣብ ቦታ ሽያጥ ባትሪታት ንዝወዓለ ባትሪታት ኣብ መእከቢ መኽዘን ከጥፍኡ መኽኣል ክህልዎም ኣለዎ።","По закону клиент должен иметь возможность сдать использованные батарейки в сборный контейнер там, где их продают.","Por ley, el cliente debe poder tirar las pilas usadas en un contenedor de recogida en el lugar donde se venden.","Por lei, o cliente tem de poder deitar as pilhas usadas num recipiente de recolha no local onde são vendidas."],"Die Begründung: „Leistungsgerechte Bezahlung und familienfreundliche Arbeitszeiten gehören zur sozialen Dimension der Nachhaltigkeit.“ Der Fachbegriff: soziale Dimension.":["እቲ ምኽንያት፦ „ብዓቕሚ ዝተመጣጠነ ክፍሊትን ንስድራቤት ምቹእ ሰዓታት ስራሕን ናብ ማሕበራዊ መዳይ ናይ ዘላቒ ምኽታል ይኣምር።“ እቲ ቴክኒካዊ ቃል፦ ማሕበራዊ መዳይ (soziale Dimension)።","Обоснование: «Оплата по труду и семейно-дружественный график относятся к социальному измерению устойчивости.» Термин: социальное измерение (soziale Dimension).","La justificación: «El pago acorde al rendimiento y los horarios compatibles con la familia forman parte de la dimensión social de la sostenibilidad.» El término técnico: dimensión social (soziale Dimension).","A justificação: «O pagamento justo pelo desempenho e os horários compatíveis com a família fazem parte da dimensão social da sustentabilidade.» O termo técnico: dimensão social (soziale Dimension)."],"Perfekt – § Fachpunkte.":["ፍጹም – § ነጥቢ ሞያ።","Отлично – § баллов по предмету.","Perfecto – § puntos de materia.","Perfeito – § pontos de matéria."],"„Ich nehme euren Müll mit. Kostet fast nichts. Ich kippe ihn einfach hinter der Hafenhalle ab.“":["„ጎረና ቆሻሻኩም ክወስድ እየ። ዳርጋ ዋላ ሓንቲ ኣይከፍልን። ኣነ ድማ ብቐሊሉ ጎኒ ኣዳራሽ ወደብ እደርብዮ።“","„Я заберу ваш мусор. Почти ничего не стоит. Я просто сваливаю его за портовым ангаром.“","„Me llevo vuestra basura. Casi no cuesta nada. Yo lo tiro sin más detrás del almacén del puerto.“","„Levo o vosso lixo. Quase não custa nada. Eu despejo-o simplesmente atrás do armazém do porto.“"],"Annehmen. Das spart Geld.":["ተቐበሉ። ገንዘብ ይቆጥብ።","Принять. Это экономит деньги.","Aceptar. Esto ahorra dinero.","Aceitar. Isto poupa dinheiro."],"Ablehnen, weil Abfall vermieden, vermindert oder recycelt werden muss. Wir sind dafür verantwortlich.":["ኣይፋል በሉ፣ ምኽንያቱ ቆሻሻ ክትከላኸል፣ ክትንኣስ ወይ ዳግም ክትጥቀም ኣለዋ። ንሕና ሓላፍቲ ኢና።","Отказаться, потому что отходы нужно избегать, сокращать или перерабатывать. Мы за это отвечаем.","Rechazar, porque los residuos hay que evitarlos, reducirlos o reciclarlos. Somos responsables de ello.","Recusar, porque os resíduos têm de ser evitados, reduzidos ou reciclados. Somos responsáveis por isso."],"Ablehnen, weil Müll nur nachts abgeholt werden darf.":["ኣይፋል በሉ፣ ምኽንያቱ ቆሻሻ ብለይቲ ጥራይ ክውሰድ ይኽእል።","Отказаться, потому что мусор можно вывозить только ночью.","Rechazar, porque la basura solo se puede recoger de noche.","Recusar, porque o lixo só pode ser recolhido de noite."],"Ihr bleibt sauber. Mia postet: „Kaje § lässt sich nicht kaufen!“":["ንጹህ ትጸንሑ። Mia ትሰቕል፦ „Kaje § ኣይግዝእን!“","Вы остаётесь чистыми. Mia публикует: «Kaje § не купишь!»","Seguís limpios. Mia publica: «¡Kaje § no se deja comprar!»","Mantêm-se limpos. Mia publica: «Kaje § não se deixa comprar!»"],"Stark!":["ብሉጽ!","Сильно!","¡Fuerte!","Forte!"],"Umweltschutz: Wer die Umwelt belastet, soll die Kosten tragen (Verursacherprinzip). Abfall wird vermieden, vermindert oder recycelt.":["ሓለዋ ከባቢ (Umweltschutz)፦ ንከባቢ ዘጥፍእ ክፍሊት ይሰከም (Verursacherprinzip)። ቆሻሻ ይክለከል፣ ይንኣስ ወይ ዳግም ይጥቀም።","Umweltschutz (охрана окружающей среды): Кто загрязняет среду, тот и несёт расходы (Verursacherprinzip). Отходы избегают, сокращают или перерабатывают.","Umweltschutz (protección del medio ambiente): Quien contamina el medio ambiente debe pagar los costes (Verursacherprinzip). Los residuos se evitan, se reducen o se reciclan.","Umweltschutz (proteção do ambiente): Quem polui o ambiente deve suportar os custos (Verursacherprinzip). Os resíduos são evitados, reduzidos ou reciclados."],"Woche § · Modul § · Die Aufgaben des Einzelhandels":["ሰሙን § · ሞዱል § · ዕዮታት ናይ ንእሽተይ ዕዳጋ","Неделя § · Модуль § · Задачи розничной торговли","Semana § · Módulo § · Las tareas del comercio minorista","Semana § · Módulo § · As tarefas do comércio a retalho"],"Palettenweise?":["ብፓሌት?","Целыми паллетами?","¿Por palés?","Por paletes?"],"Vermeiden – Vermindern – Recycling":["ምክልኻል – ምንኣስ – Recycling (ዳግም ምጥቃም)","Избегать – Сокращать – Переработка (Recycling)","Evitar – Reducir – Reciclaje (Recycling)","Evitar – Reduzir – Reciclagem (Recycling)"],"Familie Yilmaz stöhnt: „Beim Großhandel gibt es alles nur palettenweise. Und wie bekommen wir das Zeug ins Auto?“":["Familie Yilmaz ትሓዝን፦ „ኣብ ዓቢ ዕዳጋ ኩሉ ብፓሌት ጥራይ እዩ። ከመይ ኢና ነዚ ኣቕሑት ኣብ መኪና ንእቱ?“","Familie Yilmaz стонет: „У оптовика всё бывает только на паллетах. И как нам запихнуть это всё в машину?“","Familie Yilmaz se queja: „En el mayorista todo es solo por palés. ¿Y cómo metemos todo esto en el coche?“","Familie Yilmaz queixa-se: „No grossista tudo é só por paletes. E como vamos pôr isto tudo no carro?“"],"„Herr Petersen kauft seit § Jahren bei uns. Wegen der Beratung, sagt er. Und wegen des Kaffees.“":["„Herr Petersen § ዓመት ኣብዚ ይገዝእ። ብሰንኪ ምኽሪ፣ ይብል። ከምኡ ድማ ብሰንኪ ቡን።“","„Herr Petersen покупает у нас уже § лет. Из-за консультации, говорит он. И из-за кофе.“","„Herr Petersen compra con nosotros desde hace § años. Por el asesoramiento, dice. Y por el café.“","„Herr Petersen compra aqui há § anos. Por causa do aconselhamento, diz ele. E por causa do café.“"],"Wie helft ihr Familie Yilmaz?":["ከመይ ትሕግዝዋ ንFamilie Yilmaz?","Как вы поможете Familie Yilmaz?","¿Cómo ayudáis a Familie Yilmaz?","Como ajudam a Familie Yilmaz?"],"Der Einzelhandel übernimmt Aufgaben für die Kunden: Sortiment bilden, Raum und Zeit überbrücken, Mengen ausgleichen, beraten, Service bieten.":["ንእሽተይ ዕዳጋ ንዓማዊል ዕዮታት ይወስድ፦ ሓደ ምርጫ (Sortiment) ምዕዳል፣ ቦታን ግዜን ምሕላፍ፣ ብዝሒ ምምዛን፣ ምኽሪ ምሃብ፣ ኣገልግሎት (Service) ምሃብ።","Розничная торговля берёт на себя задачи для клиентов: формировать ассортимент (Sortiment), преодолевать расстояние и время, выравнивать количества, консультировать, предлагать сервис (Service).","El comercio minorista asume tareas para los clientes: formar el surtido (Sortiment), salvar el espacio y el tiempo, ajustar cantidades, asesorar y ofrecer servicio (Service).","O comércio a retalho assume tarefas para os clientes: formar o sortimento (Sortiment), vencer o espaço e o tempo, ajustar quantidades, aconselhar e oferecer serviço (Service)."],"Ihr kauft große Mengen beim Großhandel und verkauft in haushaltsüblichen Mengen":["ዓበይቲ መጠን ኣብ ዓቢ ዕዳጋ ትገዝኡ ብመጠን ስድራቤት ድማ ትሸጡ","Вы закупаете большие объёмы у оптовика и продаёте в привычных для домохозяйства количествах","Compráis grandes cantidades al mayorista y vendéis en cantidades habituales para un hogar","Compram grandes quantidades ao grossista e vendem em quantidades habituais para um agregado familiar"],"Ihr sagt: „Kauft doch direkt beim Hersteller.“":["ትብሉ፦ „ብቐጥታ ካብ ኣምራቲ ግዝኡ።“","Вы говорите: «Покупайте прямо у производителя.»","Decís: «Comprad directamente al fabricante.»","Dizem: «Comprem diretamente ao fabricante.»"],"Ihr bietet Parkplätze vor der Tür und tragt schwere Einkäufe zum Auto":["ኣብ ቅድሚ ማዕጾ መዕቆቢ መካይን ትህቡ ከቢድ ዕዳጋ ድማ ናብ መኪና ትጽውዑ","Вы предлагаете парковку у двери и несёте тяжёлые покупки к машине","Ofrecéis aparcamiento a la puerta y lleváis las compras pesadas al coche","Oferecem estacionamento à porta e levam as compras pesadas até ao carro"],"Familie Yilmaz ist begeistert. Herr Petersen auch.":["Familie Yilmaz ትሕጐስ። Herr Petersen እውን።","Familie Yilmaz в восторге. Herr Petersen тоже.","Familie Yilmaz está encantada. Herr Petersen también.","Familie Yilmaz está encantada. Herr Petersen também."],"Parkplätze und Hilfe beim Tragen sind Service – zusätzliche Leistungen rund um den Kauf.":["መዕቆቢ መካይንን ሓገዝ ኣብ ምጽዋዕን ኣገልግሎት (Service) እዩ — ተወሳኺ ዕዮታት ብዛዕባ ግዢ።","Парковка и помощь с переноской — это сервис (Service): дополнительные услуги вокруг покупки.","El aparcamiento y la ayuda para cargar son servicio (Service): prestaciones adicionales en torno a la compra.","O estacionamento e a ajuda a carregar são serviço (Service): prestações adicionais à volta da compra."],"Ihr gebt eure Aufgaben ab.":["ዕዮታትኩም ትገድፉ።","Вы отказываетесь от своих задач.","Renunciáis a vuestras tareas.","Abdicam das vossas tarefas."],"Groß einkaufen und in haushaltsüblichen Mengen verkaufen: Das ist der Mengenausgleich.":["ብዓቢ ምግዛእን ብመጠን ስድራቤት ምሻጥን፦ እዚ Mengenausgleich እዩ።","Закупать много и продавать в привычных для домохозяйства количествах — это Mengenausgleich (выравнивание количеств).","Comprar en grande y vender en cantidades habituales para un hogar: eso es el Mengenausgleich (ajuste de cantidades).","Comprar em grande e vender em quantidades habituais para um agregado familiar: isso é o Mengenausgleich (ajuste de quantidades)."],"Aufgaben nicht erfüllt":["ዕዮታት ኣይተፈጸሙን","Задачи не выполнены","Tareas no cumplidas","Tarefas não cumpridas"],"Service (Kundendienst)":["Service (ኣገልግሎት ዓሚል)","Service (сервис для клиентов)","Service (servicio al cliente)","Service (serviço ao cliente)"],"Sortimentsbildung, Raumüberbrückung, Zeitüberbrückung (Lagerhaltung), Mengenausgleich, Information und Beratung, Service. Die Hauptaufgabe: ein Sortiment zusammenstellen und an die Verbraucher verkaufen.":["Sortimentsbildung (ምርጫ ምዕዳል)፣ Raumüberbrückung (ቦታ ምሕላፍ)፣ Zeitüberbrückung (ግዜ ምሕላፍ — Lagerhaltung)፣ Mengenausgleich፣ ሓበሬታን ምኽርን፣ Service። እቲ ቀዳማይ ዕዮ፦ ሓደ Sortiment ምእካብን ንተጠቀምቲ ምሻጥን።","Sortimentsbildung (формирование ассортимента), Raumüberbrückung (преодоление пространства), Zeitüberbrückung (преодоление времени — Lagerhaltung), Mengenausgleich, информация и консультация, Service. Главная задача: составить ассортимент (Sortiment) и продавать его потребителям.","Sortimentsbildung (formar el surtido), Raumüberbrückung (salvar el espacio), Zeitüberbrückung (salvar el tiempo — Lagerhaltung), Mengenausgleich, información y asesoramiento, Service. La tarea principal: reunir un surtido (Sortiment) y venderlo a los consumidores.","Sortimentsbildung (formar o sortimento), Raumüberbrückung (vencer o espaço), Zeitüberbrückung (vencer o tempo — Lagerhaltung), Mengenausgleich, informação e aconselhamento, Service. A tarefa principal: reunir um sortimento (Sortiment) e vendê-lo aos consumidores."],"Aufgaben, die der Einzelhandel immer erfüllen muss: Auswahl eines Warensortimentes und Warenverkauf an die Verbraucher.":["ንእሽተይ ዕዳጋ ኩሉ ግዜ ክፈጽሞም ዘለዎ ዕዮታት፦ ምርጫ ናይ ሓደ Warensortiment ከምኡ ድማ ሽያጥ ኣቕሑት ንተጠቀምቲ።","Задачи, которые розничная торговля выполняет всегда: подбор ассортимента товаров (Warensortiment) и продажа товаров потребителям.","Tareas que el comercio minorista siempre tiene que cumplir: elegir un surtido de mercancías (Warensortiment) y vender las mercancías a los consumidores.","Tarefas que o comércio a retalho tem sempre de cumprir: escolher um sortimento de mercadorias (Warensortiment) e vender as mercadorias aos consumidores."],"Die Begründung: „Parkplätze und Hilfe beim Tragen sind Service – zusätzliche Leistungen rund um den Kauf.“ Der Fachbegriff: Service (Kundendienst).":["እቲ ምኽንያት፦ „መዕቆቢ መካይንን ሓገዝ ኣብ ምጽዋዕን ኣገልግሎት (Service) እዩ — ተወሳኺ ዕዮታት ብዛዕባ ግዢ።“ እቲ ቴክኒካዊ ቃል፦ Service (ኣገልግሎት ዓሚል)።","Обоснование: «Парковка и помощь с переноской — это сервис (Service): дополнительные услуги вокруг покупки.» Термин: Service (сервис для клиентов).","La justificación: «El aparcamiento y la ayuda para cargar son servicio (Service): prestaciones adicionales en torno a la compra.» El término técnico: Service (servicio al cliente).","A justificação: «O estacionamento e a ajuda a carregar são serviço (Service): prestações adicionais à volta da compra.» O termo técnico: Service (serviço ao cliente)."],"Woche § · Modul § · Das Sortiment":["ሰሙን § · ሞዱል § · እቲ ምርጫ ኣቕሑት (Sortiment)","Неделя § · Модуль § · Ассортимент (Sortiment)","Semana § · Módulo § · El surtido (Sortiment)","Semana § · Módulo § · O sortimento (Sortiment)"],"Die neue Regalreihe":["እቲ ሓዲሽ መደርደሪ","Новый ряд стеллажей","La nueva fila de estanterías","A nova fila de prateleiras"],"Die Aufgaben des Einzelhandels":["ዕዮታት ናይ ንእሽተይ ዕዳጋ","Задачи розничной торговли","Las tareas del comercio minorista","As tarefas do comércio a retalho"],"Es ist Oktober. Ihr habt Platz für eine neue Regalreihe. Frau Ahlers fragt: „Womit verdient ihr euer Geld – und was braucht ihr für die Saison?“":["ኦክቶበር እዩ። ቦታ ንሓድሽ መደርደሪ ኣሎኩም። Frau Ahlers ትሓትት፦ „ብምንታይ ገንዘብኩም ትረኽቡ — ንወቕቲ ድማ እንታይ ትደልዩ?“","Сейчас октябрь. У вас есть место для нового ряда стеллажей. Frau Ahlers спрашивает: «На чём вы зарабатываете деньги — и что вам нужно к сезону?»","Es octubre. Tenéis sitio para una nueva fila de estanterías. Frau Ahlers pregunta: «¿Con qué ganáis vuestro dinero y qué necesitáis para la temporada?»","É outubro. Têm espaço para uma nova fila de prateleiras. Frau Ahlers pergunta: «Com que ganham o vosso dinheiro — e o que precisam para a época?»"],"„Einmal hatte ich § Sorten Senf. Verkauft haben wir drei.“":["„ሓንሳብ § ዓይነት ሰናፍጭ ነይሩኒ። ሰለስተ ጥራይ ሸጥና።“","„Однажды у мен s jetzt. Die Ware steht bis zum Sommer im Lager.":["ሕጂ ሓደ እኳ ኣየድልዮን። እቲ ኣቕሓ ክሳብ ክረምቲ ኣብ መኽዘን ይጸንሕ።","Сейчас это никому не нужно. Товар лежит на складе до лета.","Ahora nadie lo necesita. La mercancía se queda en el almacén hasta el verano.","Agora ninguém precisa disso. A mercadoria fica no armazém até ao verão."],"Merkt euch das für die Prüfung, ihr Landratten!":["ንፈተና ከምዚ ኣይትረስዑ፣ እዮም ሰባት ብየብሰት!","Запомните это для экзамена, сухопутные крысы!","¡Acordaos de esto para el examen, marineros de agua dulce!","Lembrem-se disto para o exame, marinheiros de água doce!"],"Das Kernsortiment bringt den Hauptumsatz und ist ständig verkaufsbereit.":["እቲ Kernsortiment ቀዳማይ ሽያጥ የምጽእ ኩሉ ግዜ ድማ ንሽያጥ ድሉው እዩ።","Kernsortiment приносит основной оборот и всегда готов к продаже.","El Kernsortiment aporta la mayor parte de las ventas y está siempre disponible para la venta.","O Kernsortiment traz o grosso das vendas e está sempre disponível para venda."],"Saisonware gibt es nur zu bestimmten Zeiten.":["Saisonware ኣብ ሓደ ሓደ እዋን ጥራይ ይርከብ።","Сезонный товар (Saisonware) бывает только в определённое время.","La Saisonware (mercancía de temporada) solo hay en ciertas épocas.","A Saisonware (mercadoria sazonal) só existe em certas épocas."],"Saisonsortiment muss zur Jahreszeit passen.":["Saisonsortiment ምስ ወቕቲ ክሰማማዕ ኣለዎ።","Saisonsortiment (сезонный ассортимент) должен подходить к времени года.","El Saisonsortiment (surtido de temporada) tiene que encajar con la estación.","O Saisonsortiment (sortimento sazonal) tem de combinar com a estação."],"Saisonsortiment zur falschen Zeit":["Saisonsortiment ኣብ ጌጋ እዋን","Saisonsortiment в неподходящее время","Saisonsortiment en la época equivocada","Saisonsortiment na época errada"],"Breite = Anzahl der Warengruppen. Tiefe = Auswahl innerhalb einer Warengruppe. Kernsortiment = Hauptumsatz, ständig verkaufsbereit.":["Breite (ሰፊሕ) = ብዝሒ Warengruppen። Tiefe (ዕምቆት) = ምርጫ ኣብ ውሽጢ ሓንቲ Warengruppe። Kernsortiment (ማእከላይ ምርጫ) = እቲ ቀዳማይ ሽያጥ፣ ኩሉ ግዜ ዝርከብ።","Breite (ширина)
