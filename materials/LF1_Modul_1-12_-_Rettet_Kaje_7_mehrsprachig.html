orwahl здесь не подходит.","Los alimentos sueltos necesitan higiene. La Vorwahl aquí no encaja.","Os alimentos a granel precisam de higiene. A Vorwahl aqui não serve."],"Bedienung: Die Ware liegt hinter der Theke oder in der Vitrine. Ihr legt sie vor und beratet. – Offener Fisch und Käse brauchen Hygiene. Dafür passt Bedienung an der Theke.":["Bedienung (ኣገልግሎት ብሰራሕተኛ)፦ እቲ ኣቕሓ ድሕሪ ጠረጴዛ ወይ ኣብ ቪትሪን እዩ። ኣቕርቡዎም ትመኽሩ። – ክፉት ዓሳን ኬዝን ጽሬት የድልዮም። ንዚ Bedienung ኣብ ጠረጴዛ ይሰማማዕ።","Bedienung (обслуживание продавцом): Товар лежит за прилавком или в витрине. Вы подаёте его и консультируете. – Рыбе и сыру на развес нужна гигиена. Для этого подходит Bedienung у прилавка.","Bedienung (atención personalizada): La mercancía está detrás del mostrador o en la vitrina. Los mostráis y asesoráis. – El pescado y el queso sueltos necesitan higiene. Para esto encaja la Bedienung en el mostrador.","Bedienung (atendimento ao balcão): A mercadoria está atrás do balcão ou na vitrina. Apresentam e aconselham. – O peixe e o queijo a granel precisam de higiene. Para isto serve a Bedienung ao balcão."],"Sitzbank vor dem Laden · Leuchtschild „Offen“ · Fahrradständer":["ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · ብርሃናዊ ምልክት „Offen“ (ክፉት) · መቐመጢ ብሽክለታ","Скамейка перед магазином · Светящаяся вывеска «Offen» (открыто) · Велопарковка","Banco delante de la tienda · Letrero luminoso «Offen» (abierto) · Aparcabicicletas","Banco à frente da loja · Letreiro luminoso «Offen» (aberto) · Suporte para bicicletas"],"Discounter: wenige Artikel, Ware auf Paletten, sehr niedrige Preise – Der Discounter hat ein enges, flaches Sortiment und sehr niedrige Preise. Er liegt meist am Stadtrand oder im Wohngebiet.":["Discounter፦ ውሑዳት ኣርቲክል፣ ኣቕሓ ኣብ ፓሌት፣ ኣዝዩ ትሑት ዋጋ – Discounter ጸቢብን ጥሩ ዘይኮነ Sortiment ኣዝዩ ትሑት ዋጋ ኣለዎ። ብዙሕ ግዜ ኣብ ወጻኢ ከተማ ወይ ዞባ መንበሪ እዩ።","Discounter: мало артикулов, товар на паллетах, очень низкие цены – Discounter имеет узкий, неглубокий ассортимент и очень низкие цены. Обычно он находится на окраине или в жилом районе.","Discounter: pocos artículos, mercancía en palés, precios muy bajos – El Discounter tiene un surtido estrecho y poco profundo y precios muy bajos. Suele estar en las afueras o en una zona residencial.","Discounter: poucos artigos, mercadoria em paletes, preços muito baixos – O Discounter tem um sortimento estreito e pouco profundo e preços muito baixos. Costuma ficar nos arredores ou numa zona residencial."],"Hier laufen jeden Tag tausende Leute vorbei.":["ኣብዚ ነፍሲ ወከፍ መዓልቲ ኣሽሓት ሰባት ይሓልፉ።","Здесь каждый день проходят тысячи людей.","Aquí pasan miles de personas cada día.","Aqui passam milhares de pessoas todos os dias."],"Die Kunden fragen – und ihr müsst sagen: „Kommt nächste Woche wieder.“":["እቶም ዓማዊል ይሓቱ – ንስኻትኩም ድማ „ኣብ ዝመጽእ ሰሙን ተመለሱ“ ክትብሉ ኣለኩም።","Клиенты спрашивают – и вам приходится говорить: «Приходите на следующей неделе».","Los clientes preguntan – y tenéis que decir: «Volved la semana que viene».","Os clientes perguntam – e têm de dizer: «Voltem na próxima semana»."],"Niemand weiß, wohin es geht. Frau Ahlers runzelt die Stirn.":["ወይ ኣበይ ከም ዝኸይድ ሓደ እኳ ኣይፈልጥን። Frau Ahlers ግንባራ ትኾርምዕ።","Никто не знает, куда это ведёт. Frau Ahlers хмурится.","Nadie sabe adónde va esto. Frau Ahlers frunce el ceño.","Ninguém sabe para onde vai isto. Frau Ahlers franze o sobrolho."],"Ihr: Annehmen. Ein leeres Lager kostet nichts.":["ንስኻትኩም፦ ተቐበሉ። ባዶ መኽዘን ዋላ ሓንቲ ኣይከፍልን።","Вы: Принять. Пустой склад ничего не стоит.","Vosotros: Aceptar. Un almacén vacío no cuesta nada.","Vocês: Aceitar. Um armazém vazio não custa nada."],"Besser: Ablehnen, weil wir Waren vorrätig halten müssen, bis die Kunden sie brauchen.":["ዝሓሸ፦ ኣይፋል በሉ፣ ምኽንያቱ ኣቕሑት ክሳብ ዓማዊል ዝደልይዋ ከነዕቅብ ኣለና።","Лучше: Отказаться, потому что мы должны держать товары в наличии, пока клиентам они нужны.","Mejor: Rechazar, porque tenemos que tener la mercancía en stock hasta que los clientes la necesiten.","Melhor: Recusar, porque temos de ter a mercadoria em stock até os clientes precisarem dela."],"Blumenkübel am Eingang · Sitzbank vor dem Laden · Lastenrad für Lieferungen · Leuchtschild „Offen“ · Fahrradständer":["ዕትሪ ኣበባ ኣብ ኣፍ ደገ · ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · ብሽክለታ ጸዓት ንኣቕራቦት · ብርሃናዊ ምልክት „Offen“ (ክፉት) · መቐመጢ ብሽክለታ","Кадки с цветами у входа · Скамейка перед магазином · Грузовой велосипед для доставки · Светящаяся вывеска «Offen» (открыто) · Велопарковка","Macetas de flores en la entrada · Banco delante de la tienda · Bici de carga para repartos · Letrero luminoso «Offen» (abierto) · Aparcabicicletas","Vasos de flores à entrada · Banco à frente da loja · Bicicleta de carga para entregas · Letreiro luminoso «Offen» (aberto) · Suporte para bicicletas"],"In der Innenstadt ist die hervorragende Erreichbarkeit für Kunden der wichtigste Standortfaktor. Nachteil: hohe Miete, wenig Parkplätze.":["ኣብ ማእከል ከተማ እቲ ጽቡቕ ምብጻሕ ንዓማዊል እቲ ዝዓበየ Standortfaktor እዩ። ጉድለት፦ ልዑል ክራይ፣ ውሑድ መዕቆቢ መካይን።","В центре города отличная доступность для клиентов — самый важный фактор местоположения (Standortfaktor). Недостаток: высокая аренда, мало парковок.","En el centro, la excelente accesibilidad para los clientes es el factor de ubicación (Standortfaktor) más importante. Desventaja: alquiler alto, pocos aparcamientos.","No centro da cidade, a excelente acessibilidade para os clientes é o fator de localização (Standortfaktor) mais importante. Desvantagem: renda alta, poucos estacionamentos."],"Stadtrand neben dem Baumarkt: große Fläche, viele kostenlose Parkplätze, niedrige Miete – Am Stadtrand gibt es große Flächen, niedrige Mieten und Parkplätze. Ohne Auto kommt man aber schlecht hin.":["ወጻኢ ከተማ ጥቓ ድኳን ሕንጻ፦ ዓቢ ቦታ፣ ብዙሕ ነጻ መዕቆቢ መካይን፣ ትሑት ክራይ – ኣብ ወጻኢ ከተማ ዓበይቲ ቦታታት፣ ትሑት ክራይን መዕቆቢ መካይንን ኣለዉ። ብዘይ መኪና ግን ክበጽሕ ኣጸጋሚ እዩ።","Окраина рядом со строительным магазином: большая площадь, много бесплатных парковок, низкая аренда – На окраине есть большие площади, низкая аренда и парковки. Но без машины добраться трудно.","Afueras junto al almacén de bricolaje: gran superficie, muchos aparcamientos gratuitos, alquiler bajo – En las afueras hay grandes superficies, alquileres bajos y aparcamientos. Pero sin coche es difícil llegar.","Arredores junto à loja de bricolage: grande área, muitos estacionamentos gratuitos, renda baixa – Nos arredores há grandes áreas, rendas baixas e estacionamentos. Mas sem carro é difícil chegar lá."],"Unternehmensziele geben allen Mitarbeitern Orientierung. Ohne Ziele kann der Betrieb nicht planen.":["Unternehmensziele (ዕላማታት ትካል) ንኹሎም ሰራሕተኛታት ኣቕጣጫ ይህቡ። ብዘይ ዕላማታት እቲ ትካል ክመድብ ኣይክእልን።","Цели предприятия (Unternehmensziele) дают всем сотрудникам ориентир. Без целей предприятие не может планировать.","Los objetivos de la empresa (Unternehmensziele) dan orientación a todos los empleados. Sin objetivos, la empresa no puede planificar.","Os objetivos da empresa (Unternehmensziele) dão orientação a todos os trabalhadores. Sem objetivos, a empresa não pode planear."],"Lastenrad für Lieferungen · Sitzbank vor dem Laden · Blumenkübel am Eingang · Leuchtschild „Offen“ · Fahrradständer":["ብሽክለታ ጸዓት ንኣቕራቦት · ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · ዕትሪ ኣበባ ኣብ ኣፍ ደገ · ብርሃናዊ ምልክት „Offen“ (ክፉት) · መቐመጢ ብሽክለታ","Грузовой велосипед для доставки · Скамейка перед магазином · Кадки с цветами у входа · Светящаяся вывеска «Offen» (открыто) · Велопарковка","Bici de carga para repartos · Banco delante de la tienda · Macetas de flores en la entrada · Letrero luminoso «Offen» (abierto) · Aparcabicicletas","Bicicleta de carga para entregas · Banco à frente da loja · Vasos de flores à entrada · Letreiro luminoso «Offen» (aberto) · Suporte para bicicletas"],"Lena räumt jetzt richtig ein. Wer ihre Chefin ist, weiß sie immer noch nicht.":["Lena ሕጂ ቅኑዕ ትደልድል። መን ሓላፍቲ ከም ዝኾነት ገና ኣይትፈልጥን።","Теперь Lena раскладывает правильно. Но кто её начальница, она всё ещё не знает.","Ahora Lena coloca bien la mercancía. Pero todavía no sabe quién es su jefa.","Agora a Lena arruma bem. Mas ainda não sabe quem é a sua chefe."],"Die Begründung: „Die Arbeitsanweisung regelt den Ablauf.“ Der Fachbegriff: Arbeitsanweisung (Ablauforganisation).":["እቲ ምኽንያት፦ „Arbeitsanweisung ንሰሪሕ ትገዝእ።“ እቲ ቴክኒካዊ ቃል፦ Arbeitsanweisung (Ablauforganisation)።","Обоснование: «Рабочая инструкция регулирует порядок действий.» Термин: Arbeitsanweisung (Ablauforganisation).","La justificación: «La instrucción de trabajo regula el procedimiento.» El término técnico: Arbeitsanweisung (Ablauforganisation).","A justificação: «A instrução de trabalho regula o procedimento.» O termo técnico: Arbeitsanweisung (Ablauforganisation)."],"Fahrradständer · Lastenrad für Lieferungen · Leuchtschild „Offen“ · Blumenkübel am Eingang · Sitzbank vor dem Laden":["መቐመጢ ብሽክለታ · ብሽክለታ ጸዓት ንኣቕራቦት · ብርሃናዊ ምልክት „Offen“ (ክፉት) · ዕትሪ ኣበባ ኣብ ኣፍ ደገ · ናይ ምቕማጥ ወንበር ቅድሚ ድኳን","Велопарковка · Грузовой велосипед для доставки · Светящаяся вывеска «Offen» (открыто) · Кадки с цветами у входа · Скамейка перед магазином","Aparcabicicletas · Bici de carga para repartos · Letrero luminoso «Offen» (abierto) · Macetas de flores en la entrada · Banco delante de la tienda","Suporte para bicicletas · Bicicleta de carga para entregas · Letreiro luminoso «Offen» (aberto) · Vasos de flores à entrada · Banco à frente da loja"],"Die Arbeitsanweisung regelt den Ablauf. Lenas Frage nach der Zuständigkeit beantwortet sie nicht.":["Arbeitsanweisung ንሰሪሕ ትገዝእ። ንሕቶ Lena ብዛዕባ ሓላፍነት ኣይትምልስን።","Рабочая инструкция (Arbeitsanweisung) регулирует порядок действий. На вопрос Lena об ответственности она не отвечает.","La instrucción de trabajo (Arbeitsanweisung) regula el procedimiento. No responde a la pregunta de Lena sobre quién es responsable.","A instrução de trabalho (Arbeitsanweisung) regula o procedimento. Não responde à pergunta da Lena sobre a responsabilidade."],"Das Team ist motiviert. Man merkt es an der Beratung.":["እቲ ጉጅለ ተበግሶ ኣለዎ። ኣብ ምኽሪ ይስምዕ።","Команда мотивирована. Это чувствуется в консультации.","El equipo está motivado. Se nota en el asesoramiento.","A equipa está motivada. Nota-se no aconselhamento."],"Die Begründung: „Das ist ein soziales Ziel: Wohl der Mitarbeiter.“ Der Fachbegriff: soziales Ziel.":["እቲ ምኽንያት፦ „እዚ ማሕበራዊ ዕላማ እዩ፦ ጽቡቕ ህላወ ሰራሕተኛታት።“ እቲ ቴክኒካዊ ቃል፦ soziales Ziel (ማሕበራዊ ዕላማ)።","Обоснование: «Это социальная цель: благополучие сотрудников.» Термин: soziales Ziel (социальная цель).","La justificación: «Esto es un objetivo social: el bienestar de los empleados.» El término técnico: soziales Ziel (objetivo social).","A justificação: «Isto é um objetivo social: o bem-estar dos trabalhadores.» O termo técnico: soziales Ziel (objetivo social)."],"Euer besonderes Angebot zieht die Gäste an. Die Kasse klingelt.":["ፍሉይ ኣቕርቦትኩም ንእንግዶት ይስሕብ። እቲ ሳጹን ይደውል።","Ваше особое предложение привлекает гостей. Касса звенит.","Vuestra oferta especial atrae a los huéspedes. La caja suena.","A vossa oferta especial atrai os hóspedes. A caixa tilinta."],"Sitzbank vor dem Laden · Leuchtschild „Offen“ · Lastenrad für Lieferungen · Fahrradständer · Blumenkübel am Eingang":["ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · ብርሃናዊ ምልክት „Offen“ (ክፉት) · ብሽክለታ ጸዓት ንኣቕራቦት · መቐመጢ ብሽክለታ · ዕትሪ ኣበባ ኣብ ኣፍ ደገ","Скамейка перед магазином · Светящаяся вывеска «Offen» (открыто) · Грузовой велосипед для доставки · Велопарковка · Кадки с цветами у входа","Banco delante de la tienda · Letrero luminoso «Offen» (abierto) · Bici de carga para repartos · Aparcabicicletas · Macetas de flores en la entrada","Banco à frente da loja · Letreiro luminoso «Offen» (aberto) · Bicicleta de carga para entregas · Suporte para bicicletas · Vasos de flores à entrada"],"Ihr wollt § Kunden bedienen – mit möglichst wenigen Arbeitsstunden. Ihr plant die Schichten genau. – Das Ziel steht fest (§ Kunden). Die Mittel (Arbeitsstunden) sollen möglichst gering sein. Das ist das Minimalprinzip.":["§ ዓማዊል ክተገልግሉ ትደልዩ — ብዝተሓተ ሰዓታት ስራሕ። ሺፍትታት ብትክክል ትመድቡ። – እቲ ዕላማ ጸኒዑ (§ ዓማዊል)። እቲ መሳርሒ (ሰዓታት ስራሕ) ክሳብ ዝከኣል ውሑድ ክኸውን ኣለዎ። እዚ Minimalprinzip እዩ።","Вы хотите обслужить § клиентов — за как можно меньшее число рабочих часов. Вы точно планируете смены. – Цель задана (§ клиентов). Средства (рабочие часы) должны быть как можно меньше. Это принцип минимума (Minimalprinzip).","Queréis atender a § clientes con el menor número de horas de trabajo posible. Planificáis los turnos con exactitud. – El objetivo es fijo (§ clientes). Los medios (horas de trabajo) deben ser lo menores posible. Este es el principio de mínimo (Minimalprinzip).","Querem atender § clientes — com o menor número de horas de trabalho possível. Planeiam os turnos com exatidão. – O objetivo é fixo (§ clientes). Os meios (horas de trabalho) devem ser os menores possíveis. Este é o princípio do mínimo (Minimalprinzip)."],"LED-Lampen statt Halogen und nachts die Heizung herunterdrehen – Energie sparen schont die Umwelt (Ökologie) und senkt die Kosten. Genau so steht es im Buch: LED statt Halogen.":["LED መብራህቲ ብክንዲ Halogen ከምኡ ድማ ብለይቲ ሙቐት ምንካይ – ሓይሊ ምቕናስ ንከባቢ (Ökologie) ይሕሉ ወጻኢ ድማ የንኣስ። ከምዚ ኣብ መጽሓፍ ተጻሒፉ ኣሎ፦ LED ብክንዲ Halogen።","LED-лампы вместо галогеновых и ночью убавлять отопление – Экономия энергии бережёт окружающую среду (Ökologie) и снижает расходы. Именно так написано в книге: LED вместо галогена.","Lámparas LED en vez de halógenas y bajar la calefacción de noche – Ahorrar energía cuida el medio ambiente (Ökologie) y reduce los costes. Así lo dice el libro: LED en lugar de halógeno.","Lâmpadas LED em vez de halogéneo e baixar o aquecimento à noite – Poupar energia protege o ambiente (Ökologie) e reduz os custos. É exatamente o que diz o livro: LED em vez de halogéneo."],"richtig – Die Ware ist vorrätig und steht bereit, wenn der Kunde sie braucht: Zeitüberbrückung. Beratung ist es nicht – Jonas erklärt nichts.":["ቅኑዕ – እቲ ኣቕሓ ኣሎ ድሉው ድማ ዓሚል ክደልዮ ምስ ዝደሊ፦ Zeitüberbrückung። Beratung ኣይኮነን – Jonas ዋላ ሓንቲ ኣይገልጽን።","верно – Товар есть в наличии и готов, когда клиент его требует: Zeitüberbrückung (преодоление времени). Это не Beratung – Jonas ничего не объясняет.","correcto – La mercancía está disponible cuando el cliente la necesita: Zeitüberbrückung (salvar el tiempo). No es Beratung – Jonas no explica nada.","certo – A mercadoria está disponível quando o cliente precisa dela: Zeitüberbrückung (vencer o tempo). Não é Beratung – O Jonas não explica nada."],"Breit und flach: Kleidung, Schuhe, Taschen, Deko – je nur wenige Teile – Viele Warengruppen (breit), wenig Auswahl in jeder Gruppe (flach). Gut für den schnellen Einkauf, aber wenig Auswahl.":["ሰፊሕን ጥሩን ዘይኮነ፦ ክዳን፣ ጫማ፣ ሻንጣ፣ ጌጥ — ነፍሲ ወከፍ ውሑድ – ብዙሓት Warengruppen (breit)፣ ውሑድ ምርጫ ኣብ ነፍሲ ወከፍ ጉጅለ (flach)። ጽቡቕ ንቀልጢፉ ዕዳጋ፣ ግን ውሑድ ምርጫ።","Широкий и неглубокий: одежда, обувь, сумки, декор — всего по чуть-чуть – Много товарных групп (breit), мало выбора в каждой группе (flach). Хорошо для быстрой покупки, но мало выбора.","Amplio y poco profundo: ropa, zapatos, bolsos, decoración: de cada uno solo unas pocas piezas – Muchos grupos de mercancías (breit), poca selección en cada grupo (flach). Bueno para la compra rápida, pero poca selección.","Amplo e pouco profundo: roupa, sapatos, malas, decoração — só poucas peças de cada – Muitos grupos de mercadorias (breit), pouca escolha em cada grupo (flach). Bom para a compra rápida, mas pouca escolha."],"Weiterverarbeitung · richtig: Mühle Hansen":["ምስራሕ · ቅኑዕ፦ Mühle Hansen (ወፍሪ)","Переработка · верно: Mühle Hansen (мельница)","Transformación · correcto: Mühle Hansen (molino)","Transformação · certo: Mühle Hansen (moinho)"],"Markt für Fischbrötchen: § €: Nachfrage §, Angebot § · § €: Nachfrage §, Angebot § · § €: Nachfrage §, Angebot § · § €: Nachfrage §, Angebot § · § €: Nachfrage §, Angebot §. Wie viel Umsatz machen alle Händler zusammen beim Gleichgewichtspreis?":["ዕዳጋ ሳንድዊች ዓሳ፦ § €፦ ጥላብ §፣ ኣቕራቦት § · § €: ጥላብ §፣ ኣቕራቦት § · § €: ጥላብ §፣ ኣቕራቦት § · § €: ጥላብ §፣ ኣቕራቦት § · § €: ጥላብ §፣ ኣቕራቦት §። ክንደይ ሽያጥ ኩሎም ነጋዶ ብሓባር ኣብ Gleichgewichtspreis ይገብሩ?","Рынок булочек с рыбой: § €: спрос §, предложение § · § €: спрос §, предложение § · § €: спрос §, предложение § · § €: спрос §, предложение § · § €: спрос §, предложение §. Какой оборот делают все торговцы вместе при равновесной цене (Gleichgewichtspreis)?","Mercado de bocadillos de pescado: § €: demanda §, oferta § · § €: d dürfnis: Brot, Milch, Obst – für jeden Tag – Existenzbedürfnisse müssen befriedigt werden. Dafür haben die Leute auch Bedarf – also Geld. Daraus wird Nachfrage.":["ድሌት ህላወ (Existenzbedürfnis)፦ እንጀራ፣ ጸባ፣ ፍረ — ንነፍሲ ወከፍ መዓልቲ – ድሌታት ህላወ (Existenzbedürfnisse) ክምልኡ ኣለዎም። ንዚ እውን ሰባት ዝደለየ (Bedarf) ኣለዎም — ማለት ገንዘብ። ካብኡ ጥላብ (Nachfrage) ይኸውን።","Жизненная потребность (Existenzbedürfnis): Хлеб, молоко, фрукты — на каждый день – Жизненные потребности (Existenzbedürfnisse) нужно удовлетворять. На это у людей тоже есть Bedarf — то есть деньги. Из этого получается спрос (Nachfrage).","Necesidad básica (Existenzbedürfnis): Pan, leche, fruta: para todos los días – Las necesidades básicas (Existenzbedürfnisse) hay que cubrirlas. Para esto la gente también tiene Bedarf, es decir, dinero. De ahí surge la demanda (Nachfrage).","Necessidade básica (Existenzbedürfnis): Pão, leite, fruta — para todos os dias – As necessidades básicas (Existenzbedürfnisse) têm de ser satisfeitas. Para isto as pessoas também têm Bedarf — ou seja, dinheiro. Daí nasce a procura (Nachfrage)."],"§ € je kg – Angebot und Nachfrage sind gleich groß (§). Das ist der Gleichgewichtspreis. Hier wird die größte Menge gehandelt.":["§ € ንኪሎ – ኣቕራቦትን ጥላብን ማዕረ እዮም (§)። እዚ Gleichgewichtspreis (ዋጋ ማዕረ) እዩ። ኣብዚ እቲ ዝዓበየ መጠን ይዕደግ።","§ € за кг – Предложение и спрос равны (§). Это равновесная цена (Gleichgewichtspreis). Здесь продаётся наибольшее количество.","§ € por kg – La oferta y la demanda son iguales (§). Este es el precio de equilibrio (Gleichgewichtspreis). Aquí se comercia la mayor cantidad.","§ € por kg – A oferta e a procura são iguais (§). Este é o preço de equilíbrio (Gleichgewichtspreis). Aqui negocia-se a maior quantidade."],"die Knappheit":["ጉድለት (Knappheit)","дефицит (Knappheit)","la escasez (Knappheit)","a escassez (Knappheit)"],"die Mittel":["መሳርሒ (Mittel)","средства (Mittel)","los medios (Mittel)","os meios (Mittel)"],"der Nutzen":["ረብሓ (Nutzen)","польза (Nutzen)","el beneficio (Nutzen)","o benefício (Nutzen)"], erto) · Banco à frente da loja"],"Richtig abgelehnt – aber falsch begründet. Gewinn ist ein wichtiges ökonomisches Ziel.":["ቅኑዕ ኣይፋል በሉ – ግን ምኽንያት ጌጋ። ትርፊ ኣገዳሲ ኢኮኖሚያዊ ዕላማ እዩ።","Верно отказались – но обоснование неверное. Прибыль — важная экономическая цель.","Rechazado correctamente – pero la justificación es incorrecta. El beneficio es un objetivo económico importante.","Recusado corretamente – mas a justificação está errada. O lucro é um objetivo económico importante."],"Ihr: Ablehnen, weil Gewinn verboten ist.":["ንስኻትኩም፦ ኣይፋል በሉ፣ ምኽንያቱ ትርፊ ክልኩል እዩ።","Вы: Отказаться, потому что прибыль запрещена.","Vosotros: Rechazar, porque el beneficio está prohibido.","Vocês: Recusar, porque o lucro é proibido."],"Sitzbank vor dem Laden · Leuchtschild „Offen“ · Lastenrad für Lieferungen · Fahrradständer":["ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · ብርሃናዊ ምልክት „Offen“ (ክፉት) · ብሽክለታ ጸዓት ንኣቕራቦት · መቐመጢ ብሽክለታ","Скамейка перед магазином · Светящаяся вывеска «Offen» (открыто) · Грузовой велосипед для доставки · Велопарковка","Banco delante de la tienda · Letrero luminoso «Offen» (abierto) · Bici de carga para repartos · Aparcabicicletas","Banco à frente da loja · Letreiro luminoso «Offen» (aberto) · Bicicleta de carga para entregas · Suporte para bicicletas"],"Schmal und tief: nur Jeans und Jacken – aber alle Größen, Farben und viele Marken – Wenige Warengruppen (schmal), große Auswahl in jeder Gruppe (tief). Typisch für ein Fachgeschäft mit Beratung.":["ጸቢብን ዕሙቕን፦ ጅንስን ጃኬታትን ጥራይ — ግን ኩሉ ዓቕምታት፣ ሕብርታትን ብዙሓት ማርካታትን – ውሑዳት Warengruppen (schmal)፣ ዓቢ ምርጫ ኣብ ነፍሲ ወከፍ ጉጅለ (tief)። ልሙድ ንFachgeschäft ምስ ምኽሪ።","Узкий и глубокий: только джинсы и куртки — но все размеры, цвета и много марок – Мало товарных групп (schmal), большой выбор в каждой группе (tief). Типично для специализированного магазина (Fachgeschäft) с консультацией.","Estrecho y profundo: solo vaqueros y chaquetas, pero todas las tallas, colores y muchas marcas – Pocos grupos de mercancías (schmal), gran selección en cada grupo (tief). Típico de un Fach ись – но обоснование неверное. Слишком полный склад тоже стоит денег.","Rechazado correctamente – pero la justificación es incorrecta. Un almacén demasiado lleno también cuesta dinero.","Recusado corretamente – mas a justificação está errada. Um armazém demasiado cheio também custa dinheiro."],"Ihr: Ablehnen, weil ein Lager immer randvoll sein muss.":["ንስኻትኩም፦ ኣይፋል በሉ፣ ምኽንያቱ መኽዘን ኩሉ ግዜ መሊኡ ክህሉ ኣለዎ።","Вы: Отказаться, потому что склад всегда должен быть забит до краёв.","Vosotros: Rechazar, porque un almacén siempre tiene que estar lleno hasta arriba.","Vocês: Recusar, porque um armazém tem de estar sempre a abarrotar."],"Kulturbedürfnis: Festival-Mode und Hafen-Hoodies – Kulturbedürfnisse wachsen, wenn die Existenzbedürfnisse erfüllt sind. Mit kleinen Preisen haben viele dafür auch Bedarf.":["ድሌት ባህሊ (Kulturbedürfnis)፦ ክዳን ፌስቲቫልን ሁዲታት ወደብን – ድሌታት ባህሊ (Kulturbedürfnisse) ይዓብዩ፣ ድሌታት ህላወ ምስ ዝምልኡ። ብትሑት ዋጋ ብዙሓት ንዚ እውን ዝደለየ (Bedarf) ኣለዎም።","Культурная потребность (Kulturbedürfnis): фестивальная мода и худи из порта – Культурные потребности (Kulturbedürfnisse) растут, когда удовлетворены жизненные. При небольших ценах у многих есть на это тоже Bedarf.","Necesidad cultural (Kulturbedürfnis): moda de festival y sudaderas del puerto – Las necesidades culturales (Kulturbedürfnisse) crecen cuando están cubiertas las básicas. A precios bajos, mucha gente también tiene Bedarf para ello.","Necessidade cultural (Kulturbedürfnis): moda de festival e hoodies do porto – As necessidades culturais (Kulturbedürfnisse) crescem quando as básicas estão satisfeitas. A preços baixos, muita gente também tem Bedarf para isso."],"Blumenkübel am Eingang · Lastenrad für Lieferungen · Leuchtschild „Offen“ · Sitzbank vor dem Laden · Fahrradständer":["ዕትሪ ኣበባ ኣብ ኣፍ ደገ · ብሽክለታ ጸዓት ንኣቕራቦት · ብርሃናዊ ምልክት „Offen“ (ክፉት) · ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · መቐመጢ ብሽክለታ","Кадки с цветами у входа · Грузовой велосипед для доставки · Светящаяся вывеска «Offen» (открыто) · Скамейка перед магазином · Велопарковка","Macetas de f es — por exemplo, um subsídio de deslocação."],"Leuchtschild „Offen“ · Sitzbank vor dem Laden · Fahrradständer · Blumenkübel am Eingang · Lastenrad für Lieferungen":["ብርሃናዊ ምልክት „Offen“ (ክፉት) · ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · መቐመጢ ብሽክለታ · ዕትሪ ኣበባ ኣብ ኣፍ ደገ · ብሽክለታ ጸዓት ንኣቕራቦት","Светящаяся вывеска «Offen» (открыто) · Скамейка перед магазином · Велопарковка · Кадки с цветами у входа · Грузовой велосипед для доставки","Letrero luminoso «Offen» (abierto) · Banco delante de la tienda · Aparcabicicletas · Macetas de flores en la entrada · Bici de carga para repartos","Letreiro luminoso «Offen» (aberto) · Banco à frente da loja · Suporte para bicicletas · Vasos de flores à entrada · Bicicleta de carga para entregas"],"Die Kunden probieren in Ruhe. Aber ein Handy fehlt am Abend.":["እቶም ዓማዊል ብሰላም ይፈትኑ። ግን ኣብ ምሸት ሓደ ተሌፎን ይጎድል።","Клиенты спокойно примеряют. Но к вечеру пропадает один телефон.","Los clientes prueban con calma. Pero por la noche falta un móvil.","Os clientes experimentam com calma. Mas à noite falta um telemóvel."],"Die Begründung: „Vorwahl passt zu Zubehör.“ Der Fachbegriff: Vorwahl.":["እቲ ምኽንያት፦ „Vorwahl ንመሳርሒታት ይሰማማዕ።“ እቲ ቴክኒካዊ ቃል፦ Vorwahl።","Обоснование: «Vorwahl подходит для аксессуаров.» Термин: Vorwahl.","La justificación: «La Vorwahl encaja con los accesorios.» El término técnico: Vorwahl.","A justificação: «A Vorwahl serve para acessórios.» O termo técnico: Vorwahl."],"Vorwahl passt zu Zubehör. Teure Smartphones sind dafür zu erklärungsbedürftig und diebstahlgefährdet.":["Vorwahl ንመሳርሒታት ይሰማማዕ። ክቡራት ስማርትፎናት ንዚ ኣዝዮም ምግላጽ ዘድልዮምን ብስርቂ ዝተጋለጹን እዮም።","Vorwahl подходит для аксессуаров. Дорогие смартфоны слишком требуют объяснений и подвержены кражам для этого.","La Vorwahl encaja con los accesorios. Los smartphones caros necesitan demasiada explicación y tienen demasiado riesgo de robo para esto.","A Vorwahl serve para acessórios. Os smartphones caros precisam de demasiada explicação e têm demasiado risco de furto para isto."],"Lastenrad für Lieferungen · Fahrradständer
