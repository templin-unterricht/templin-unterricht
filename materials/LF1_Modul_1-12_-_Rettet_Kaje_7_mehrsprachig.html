fgabenheft an.":["እዚ ገና ንልምዶ። ኣብ ዕዮታት ልምምድ ኣብ መጽሓፍ ዕዮ ርኣዩ።","Это мы ещё потренируем. Посмотрите упражнения в рабочей тетради.","Esto todavía lo practicamos. Mirad los ejercicios del cuaderno de tareas.","Isto ainda vamos treinar. Vejam os exercícios no caderno de tarefas."],"Sturmflut-Warnung":["መጠንቀቕታ ማዕበል (Sturmflut)","Предупреждение о штормовом нагоне","Aviso de marea de tormenta","Aviso de maré de tempestade"],"Die Hafenstraße ist drei Tage gesperrt. Kaum jemand kommt zu Fuß zum Laden.":["እታ Hafenstraße ሰለስተ መዓልቲ ዕጽውቲ እያ። ዳርጋ ሓደ እኳ ብእግሩ ናብ ድኳን ኣይመጽእን።","Hafenstraße закрыта на три дня. Почти никто не приходит в магазин пешком.","La Hafenstraße está cerrada tres días. Casi nadie llega a pie a la tienda.","A Hafenstraße está fechada três dias. Quase ninguém vem a pé à loja."],"Ihr liefert nach Hause. Die Kunden bestellen per Telefon oder online – das zahlt sich aus.":["ናብ ገዛ ትወስዱ። እቶም ዓማዊል ብተሌፎን ወይ ብኦንላይን የዝዝሙ — እዚ ይጠቅም።","Вы доставляете на дом. Клиенты заказывают по телефону или онлайн — это окупается.","Entregáis a domicilio. Los clientes piden por teléfono u online: merece la pena.","Entregam em casa. Os clientes encomendam por telefone ou online — compensa."],"Eure Abteilung für Wein und Feinkost im Glas läuft noch in Bedienung. Die Kunden warten lange. Ihr wollt umstellen.":["ክፍሊ ወይንን ዝተዳለወ መግቢ ኣብ ብርጭቆን ገና ብBedienung ይሰርሕ። እቶም ዓማዊል ነዊሕ ይጽበዩ። ክትቅይሩ ትደልዩ።","Ваш отдел вина и деликатесов в банках всё ещё работает по системе Bedienung. Клиенты долго ждут. Вы хотите перестроить.","Vuestra sección de vino y delicatessen en frasco sigue funcionando con Bedienung. Los clientes esperan mucho. Queréis cambiar el sistema.","A vossa secção de vinho e delicatessen em frasco ainda funciona com Bedienung. Os clientes esperam muito. Querem mudar."],"Beim Hafen-Festival habt ihr wieder einen Stand. Diesmal verkaufen viele Händler Fischbrötchen. Die Tabelle zeigt Angebot und Nachfrage auf dem ganzen Festival.":["ኣብ ፌስቲቫል ወደብ ዳግም ደሞ ኣለኩም። እዚ ግዜ ብዙሓት ነጋዶ ሳንድዊች ዓሳ ይሸጡ። እቲ ሰንጠረዥ ኣቕራቦትን ጥላብን ኣብ ምሉእ ፌስቲቫል የርኢ።","На фестивале порта у вас снова есть стенд. На этот раз многие торговцы продают булочки с рыбой. Таблица показывает предложение и спрос на всём фестивале.","En el festival del puerto tenéis otra vez un puesto. Esta vez muchos comerciantes venden bocadillos de pescado. La tabla muestra la oferta y la demanda en todo el festival.","No festival do porto voltam a ter uma banca. Desta vez muitos comerciantes vendem sandes de peixe. A tabela mostra a oferta e a procura em todo o festival."],"Fischbrötchen auf dem Hafenfest-Markt":["ሳንድዊች ዓሳ ኣብ ዕዳጋ ፌስቲቫል ወደብ","Булочки с рыбой на рынке праздника порта","Bocadillos de pescado en el mercado de la fiesta del puerto","Sandes de peixe no mercado da festa do porto"],"Angebot und Nachfrage sind gleich groß (§). Das ist der Gleichgewichtspreis. Hier wird die größte Menge gehandelt.":["ኣቕራቦትን ጥላብን ማዕረ እዮም (§)። እዚ Gleichgewichtspreis (ዋጋ ማዕረ) እዩ። ኣብዚ እቲ ዝዓበየ መጠን ይዕደግ።","Предложение и спрос равны (§). Это равновесная цена (Gleichgewichtspreis). Здесь продаётся наибольшее количество.","La oferta y la demanda son iguales (§). Este es el precio de equilibrio (Gleichgewichtspreis). Aquí se comercia la mayor cantidad.","A oferta e a procura são iguais (§). Este é o preço de equilíbrio (Gleichgewichtspreis). Aqui negocia-se a maior quantidade."],"· Kaje § (Lebensmittel) · Zielgruppe: Frau Lindqvist":["· Kaje § (መግቢ) · ዒላማ ዓማዊል፦ Frau Lindqvist","· Kaje § (продукты) · Целевая группа: Frau Lindqvist","· Kaje § (alimentos) · Grupo objetivo: Frau Lindqvist","· Kaje § (alimentos) · Grupo-alvo: Frau Lindqvist"],"Fachpunkte: § von § · Rekord: § %":["ነጥቢ ሞያ፦ § ካብ § · ሪኮርድ፦ § %","Баллы по предмету: § из § · Рекорд: § %","Puntos de materia: § de § · Récord: § %","Pontos de matéria: § de § · Recorde: § %"],"Frau Lindqvist (eure Zielgruppe)":["Frau Lindqvist (ዒላማ ዓማዊልኩም)","Frau Lindqvist (ваша целевая группа)","Frau Lindqvist (vuestro grupo objetivo)","Frau Lindqvist (o vosso grupo-alvo)"],"Richtig: Kerzen und Dekokissen sollen neu ins Sortiment aufgenommen werden.":["ቅኑዕ፦ ሽምዓን ከሸኖ መንበሪን ሓድሽ ናብ Sortiment ክኣትዉ።","Правильно: Свечи и декоративные подушки нужно включить в ассортимент.","Correcto: Hay que incorporar al surtido velas y cojines decorativos.","Certo: É preciso incluir no sortimento velas e almofadas decorativas."],"Richtig: Sie will mit einem festen Budget für Anzeigen möglichst viele Kunden erreichen.":["ቅኑዕ፦ ብዝጸንዐ በጀት ንማስታወቂያ ክሳብ ዝከኣል ብዙሓት ዓማዊል ክትበጽሕ ትደሊ።","Правильно: Она хочет с фиксированным бюджетом на рекламу охватить как можно больше клиентов.","Correcto: Quiere llegar al mayor número posible de clientes con un presupuesto fijo para anuncios.","Certo: Quer chegar ao maior número possível de clientes com um orçamento fixo para anúncios."],"Ihr: Ablehnen, weil Großhändler keine Steuern zahlen.":["ንስኻትኩም፦ ኣይፋል በሉ፣ ምኽንያቱ ዓበይቲ ነጋዶ ቀረጽ ኣይኸፍሉን።","Вы: Отказаться, потому что оптовики не платят налоги.","Vosotros: Rechazar, porque los mayoristas no pagan impuestos.","Vocês: Recusar, porque os grossistas não pagam impostos."],"Besser: Ablehnen, weil ein Einzelhändler an Verbraucher verkauft. Sonst verlieren wir unsere Kunden.":["ዝሓሸ፦ ኣይፋል በሉ፣ ምኽንያቱ ሓደ ንእሽተይ ነጋዳይ (Einzelhändler) ንተጠቀምቲ ይሸጥ። ካልእ ዓማዊልና ንስእን።","Лучше: Отказаться, потому что розничный торговец (Einzelhändler) продаёт потребителям. Иначе мы потеряем наших клиентов.","Mejor: Rechazar, porque un minorista (Einzelhändler) vende a los consumidores. Si no, perdemos a nuestros clientes.","Melhor: Recusar, porque um retalhista (Einzelhändler) vende aos consumidores. Senão perdemos os nossos clientes."],"Ihr: Ablehnen, weil der Staat die Preise festlegt.":["ንስኻትኩም፦ ኣይፋል በሉ፣ ምኽንያቱ መንግስቲ ዋጋ ይውስን።","Вы: Отказаться, потому что цены устанавливает государство.","Vosotros: Rechazar, porque el Estado fija los precios.","Vocês: Recusar, porque o Estado fixa os preços."],"Besser: Ablehnen, weil sich der Marktpreis aus Angebot und Nachfrage bildet. Absprachen sind verboten.":["ዝሓሸ፦ ኣይፋል በሉ፣ ምኽንያቱ እቲ ዋጋ ዕዳጋ (Marktpreis) ካብ ኣቕራቦትን ጥላብን ይፈጠር። ስምምዕ ዋጋ ክልኩል እዩ።","Лучше: Отказаться, потому что рыночная цена (Marktpreis) формируется из предложения и спроса. Договорённости о ценах запрещены.","Mejor: Rechazar, porque el precio de mercado (Marktpreis) se forma con la oferta y la demanda. Los acuerdos de precios están prohibidos.","Melhor: Recusar, porque o preço de mercado (Marktpreis) se forma com a oferta e a procura. Os acordos de preços são proibidos."],"Ihr: Ablehnen, weil uns die Kunden dort schlecht erreichen. Erreichbarkeit ist wichtiger als die Miete.":["ንስኻትኩም፦ ኣይፋል በሉ፣ ምኽንያቱ ዓማዊልና ኣብኡ ብጽቡቕ ኣይበጽሑን። ምብጻሕ ካብ ክራይ ዝያዳ ኣገዳሲ እዩ።","Вы: Отказаться, потому что клиентам там трудно до нас добраться. Доступность важнее аренды.","Vosotros: Rechazar, porque a los clientes les resulta difícil llegar allí. La accesibilidad es más importante que el alquiler.","Vocês: Recusar, porque os clientes têm dificuldade em chegar lá. A acessibilidade é mais importante do que a renda."],"Fahrradständer · Lastenrad für Lieferungen · Blumenkübel am Eingang · Sitzbank vor dem Laden · Leuchtschild „Offen“":["መቐመጢ ብሽክለታ · ብሽክለታ ጸዓት ንኣቕራቦት · ዕትሪ ኣበባ ኣብ ኣፍ ደገ · ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · ብርሃናዊ ምልክት „Offen“ (ክፉት)","Велопарковка · Грузовой велосипед для доставки · Кадки с цветами у входа · Скамейка перед магазином · Светящаяся вывеска «Offen» (открыто)","Aparcabicicletas · Bici de carga para repartos · Macetas de flores en la entrada · Banco delante de la tienda · Letrero luminoso «Offen» (abierto)","Suporte para bicicletas · Bicicleta de carga para entregas · Vasos de flores à entrada · Banco à frente da loja · Letreiro luminoso «Offen» (aberto)"],"Sturmflut-Warnung:":["መጠንቀቕታ ማዕበል፦","Предупреждение о штормовом нагоне:","Aviso de marea de tormenta:","Aviso de maré de tempestade:"],"Kulturbedürfnis: Kuchen, Eis und Kaffee zum Mitnehmen – Kulturbedürfnisse entstehen, wenn die Existenzbedürfnisse erfüllt sind. Bei kleinen Preisen haben viele dafür Bedarf.":["ድሌት ባህሊ (Kulturbedürfnis)፦ ኬክ፣ ኣይስክሪም ከምኡ ድማ ቡን ንምውሳድ – ድሌታት ባህሊ (Kulturbedürfnisse) ይፍጠሩ ድሌታት ህላወ ምስ ዝምልኡ። ብትሑት ዋጋ ብዙሓት ንዚ ዝደለየ (Bedarf) ኣለዎም።","Культурная потребность (Kulturbedürfnis): Пирожные, мороженое и кофе с собой – Культурные потребности (Kulturbedürfnisse) возникают, когда удовлетворены жизненные. При небольших ценах у многих есть на это Bedarf.","Necesidad cultural (Kulturbedürfnis): Pasteles, helado y café para llevar – Las necesidades culturales (Kulturbedürfnisse) surgen cuando están cubiertas las básicas. A precios bajos, mucha gente tiene Bedarf para ello.","Necessidade cultural (Kulturbedürfnis): Bolos, gelado e café para levar – As necessidades culturais (Kulturbedürfnisse) surgem quando as básicas estão satisfeitas. A preços baixos, muita gente tem Bedarf para isso."],"Besser für Frau Lindqvist:":["ዝሓሸ ንFrau Lindqvist፦","Лучше для Frau Lindqvist:","Mejor para Frau Lindqvist:","Melhor para Frau Lindqvist:"],"Die Mittel stehen fest (§ €). Der Nutzen soll möglichst groß sein. Das ist das Maximalprinzip.":["እቲ ዘለዎ ገንዘብ ጸኒዑ (§ €)። እቲ ረብሓ ክሳብ ዝከኣል ዓቢ ክኸውን ኣለዎ። እዚ Maximalprinzip እዩ።","Средства заданы (§ €). Польза должна быть как можно больше. Это принцип максимума (Maximalprinzip).","Los medios son fijos (§ €). El beneficio debe ser lo mayor posible. Este es el principio de máximo (Maximalprinzip).","Os meios são fixos (§ €). O benefício deve ser o maior possível. Este é o princípio do máximo (Maximalprinzip)."],"Der Preis steigt. Die Nachfrage ist größer als das Angebot. Ihr bestellt trotzdem rechtzeitig. – Die Nachfrage ist größer als das Angebot: ein Verkäufermarkt. Der Verkäufer ist in der starken Position, die Preise steigen.":["እቲ ዋጋ ይለዓል። እቲ ጥላብ (Nachfrage) ካብ ኣቕራቦት (Angebot) ይበዝሕ። ብዘይ ምድንጓይ ግን ትዝንግዑ። – ጥላብ ካብ ኣቕራቦት ይበዝሕ፦ Verkäufermarkt። እቲ ሻጣይ ኣብ ሓያል ኩነታት ኣሎ፣ ዋጋታት ይለዓሉ።","Цена растёт. Спрос (Nachfrage) больше предложения (Angebot). Вы всё равно заказываете вовремя. – Спрос больше предложения: Verkäufermarkt (рынок продавца). Продавец в сильной позиции, цены растут.","El precio sube. La demanda (Nachfrage) es mayor que la oferta (Angebot). Aun así, pedís a tiempo. – La demanda es mayor que la oferta: Verkäufermarkt (mercado del vendedor). El vendedor está en posición fuerte, los precios suben.","O preço sobe. A procura (Nachfrage) é maior do que a oferta (Angebot). Mesmo assim, encomendam a tempo. – A procura é maior do que a oferta: Verkäufermarkt (mercado do vendedor). O vendedor está em posição forte, os preços sobem."],"Die Wahl passte nicht zu eurem Profil. Zufriedenheit −§.":["እቲ ምርጫ ምስ ፕሮፋይልኩም ኣይሰማማዐን። ዕግበት −§።","Выбор не подошёл вашему профилю. Удовлетворённость −§.","La elección no encajó con vuestro perfil. Satisfacción −§.","A escolha não combinou com o vosso perfil. Satisfação −§."],"Profil-Konflikt:":["ግጭት ፕሮፋይል፦","Конфликт профиля:","Conflicto de perfil:","Conflito de perfil:"],"Lieferung und Umtausch sind Service – zusätzliche Leistungen rund um den Kauf. Das Outlet bietet das kaum.":["ምብጻሕን ምልውጥን ኣገልግሎት (Service) እዩ — ብዛዕባ ግዢ ተወሳኺ ዕዮታት። እቲ Outlet እዚ ዳርጋ ኣይህብን።","Доставка и обмен — это сервис (Service): дополнительные услуги вокруг покупки. Аутлет почти этого не предлагает.","La entrega y el cambio son servicio (Service): prestaciones adicionales en torno a la compra. El outlet apenas ofrece esto.","A entrega e a troca são serviço (Service): prestações adicionais à volta da compra. O outlet quase não oferece isto."],"Große Auswahl von vielen Herstellern an einem Ort und ehrliche Beratung – Das Outlet hat nur eine Marke und keine Beratung. Ihr bietet Sortimentsbildung und Beratung – zwei Aufgaben des Einzelhandels.":["ዓቢ ምርጫ ካብ ብዙሓት ኣምራትን ኣብ ሓደ ቦታን ሓቀኛ ምኽርን – እቲ Outlet ሓንቲ ማርክ ጥራይ ኣለዎ ምኽሪ ድማ የብሉን። Sortimentsbildung ከምኡ ድማ Beratung ትህቡ — ክልተ ዕዮታት ንእሽተይ ዕዳጋ።","Большой выбор от многих производителей в одном месте и честная консультация – В аутлете только одна марка и нет консультации. Вы предлагаете формирование ассортимента (Sortimentsbildung) и консультацию (Beratung) — две задачи розничной торговли.","Gran selección de muchos fabricantes en un solo lugar y asesoramiento honesto – El outlet solo tiene una marca y no ofrece asesoramiento. Ofrecéis formación del surtido (Sortimentsbildung) y asesoramiento (Beratung): dos tareas del comercio minorista.","Grande escolha de muitos fabricantes num só lugar e aconselhamento honesto – O outlet só tem uma marca e não aconselha. Oferecem formação do sortimento (Sortimentsbildung) e aconselhamento (Beratung) — duas tarefas do comércio a retalho."],"Wenige Warengruppen (schmal), große Auswahl in jeder Gruppe (tief). Typisch für ein Fachgeschäft mit Beratung.":["ውሑዳት Warengruppen (schmal)፣ ዓቢ ምርጫ ኣብ ነፍሲ ወከፍ ጉጅለ (tief)። ልሙድ ንFachgeschäft ምስ ምኽሪ።","Мало товарных групп (schmal), большой выбор в каждой группе (tief). Типично для специализированного магазина (Fachgeschäft) с консультацией.","Pocos grupos de mercancías (schmal), gran selección en cada grupo (tief). Típico de un Fachgeschäft con asesoramiento.","Poucos grupos de mercadorias (schmal), grande escolha em cada grupo (tief). Típico de um Fachgeschäft com aconselhamento."],"Das Fachgeschäft hat eine Branche mit schmalem, tiefem Sortiment, mittlere bis hohe Preise und Beratung. Es passt auf kleine Fläche in zentraler Lage.":["Fachgeschäft ሓደ ዓይነት ዕዮ ጸቢብን ዕሙቕን Sortiment፣ ማእከላይ ክሳብ ልዑል ዋጋን ምኽርን ኣለዎ። ኣብ ንእሽተይ ቦታ ኣብ ማእከላይ ቦታ ይሰማማዕ።","Fachgeschäft — это одна отрасль с узким и глубоким ассортиментом, средние и высокие цены и консультация. Подходит для небольшой площади в центральном месте.","El Fachgeschäft tiene un sector con surtido estrecho y profundo, precios medios a altos y asesoramiento. Encaja en una superficie pequeña en una zona céntrica.","O Fachgeschäft tem um ramo com sortimento estreito e profundo, preços médios a altos e aconselhamento. Cabe numa área pequena em local central."],"Vorwahl geht, ist hier aber nicht nötig. Sie passt besser zu Ware zum Anprobieren und Ausprobieren.":["Vorwahl ይከኣል፣ ግን ኣብዚ ኣየድልን። ንኣቕሑት ንምፍታንን ምፍታሽን ዝያዳ ትሰማማዕ።","Vorwahl возможна, но здесь не нужна. Она лучше подходит для товара, который нужно примерять и пробовать.","La Vorwahl es posible, pero aquí no hace falta. Encaja mejor con mercancía para probarse y probar.","A Vorwahl é possível, mas aqui não é necessária. Serve melhor para mercadoria para provar e experimentar."],"Selbstbedienung: Die Kunden nehmen die Ware selbst und zahlen an der Kasse. – Einfache Ware für jeden Tag braucht keine Beratung. Dafür passt Selbstbedienung.":["Selbstbedienung (ባዕል ኣገልግሎት)፦ እቶም ዓማዊል ባዕሎም ኣቕሓ ይወስዱ ኣብ ሳጹን ድማ ይኸፍሉ። – ቀሊል ኣቕሓ ንነፍሲ ወከፍ መዓልቲ ምኽሪ ኣየድልዮን። ንዚ Selbstbedienung (ባዕል ኣገልግሎት) ይሰማማዕ።","Selbstbedienung (самообслуживание): Клиенты сами берут товар и платят на кассе. – Простому товару на каждый день консультация не нужна. Для этого подходит самообслуживание (Selbstbedienung).","Selbstbedienung (autoservicio): Los clientes cogen la mercancía ellos mismos y pagan en la caja. – La mercancía sencilla de todos los días no necesita asesoramiento. Para esto encaja el autoservicio (Selbstbedienung).","Selbstbedienung (self-service): Os clientes pegam a mercadoria e pagam na caixa. – A mercadoria simples do dia a dia não precisa de aconselhamento. Para isto serve o self-service (Selbstbedienung)."],"Möglichst viel Gewinn ist das erwerbswirtschaftliche Prinzip – ein ökonomisches Ziel. Soziale und ökologische Ziele kommen dabei zu kurz.":["ዝተኻእለ ብዙሕ ትርፊ ናይ erwerbswirtschaftliches Prinzip እዩ — ኢኮኖሚያዊ ዕላማ። ማሕበራዊን ኢኮሎጂያዊን ዕላማታት ኣብዚ ይሰኣኑ።","Как можно больше прибыли — это эквивалент erwerbswirtschaftliches Prinzip (принципа получения дохода) — экономическая цель. Социальные и экологические цели при этом страдают.","El mayor beneficio posible es el erwerbswirtschaftliches Prinzip (principio de lucro), un objetivo económico. Los objetivos sociales y ecológicos salen perdiendo.","O maior lucro possível é o erwerbswirtschaftliches Prinzip (princípio do lucro) — um objetivo económico. Os objetivos sociais e ecológicos ficam para trás."],"Jobticket und Urlaubsgeld für das Team – Das ist ein soziales Ziel: Wohl der Mitarbeiter. Zielkonflikt: Es kostet Geld r número possível de clientes."],"Ihr wollt § Kunden bedienen – mit möglichst wenigen Arbeitsstunden. Ihr plant die Schichten genau.":["§ ዓማዊል ክተገልግሉ ትደልዩ — ብዝተሓተ ሰዓታት ስራሕ። ሺፍትታት ብትክክል ትመድቡ።","Вы хотите обслужить § клиентов — за как можно меньшее число рабочих часов. Вы точно планируете смены.","Queréis atender a § clientes con el menor número de horas de trabajo posible. Planificáis los turnos con exactitud.","Querem atender § clientes — com o menor número de horas de trabalho possível. Planeiam os turnos com exatidão."],"Möglichst wenige Leute sollen möglichst viele Kunden bedienen.":["ክሳብ ዝከኣል ውሑዳት ሰባት ክሳብ ዝከኣል ብዙሓት ዓማዊል ከገልግሉ ይደልዩ።","Как можно меньше людей должны обслужить как можно больше клиентов.","Cuanta menos gente posible debe atender a cuantos más clientes posible.","O menor número possível de pessoas deve atender o maior número possível de clientes."],"Junge Leute, so wird das nichts.":["ዝንእሱ ሰባት፣ ከምዚ ኣይኸውንን።","Молодёжь, так дело не пойдёт.","Jóvenes, así no va a funcionar.","Jovens, assim não vai dar."],"Ohne Plan steht nur eine Person im Laden. Die Schlange reicht bis zur Tür.":["ብዘይ መደብ ሓደ ሰብ ጥራይ ኣብ ድኳን ይቐውም። እቲ ተርቲብ ክሳብ ማዕጾ ይበጽሕ።","Без плана в магазине стоит только один человек. Очередь тянется до двери.","Sin plan solo hay una persona en la tienda. La cola llega hasta la puerta.","Sem plano só há uma pessoa na loja. A fila chega à porta."],"Hier steht weder die Zahl der Leute noch die Zahl der Kunden fest.":["ኣብዚ ቁጽሪ ሰባት ዋላ ቁጽሪ ዓማዊል ኣይጸንዐን።","Здесь не заданы ни число людей, ни число клиентов.","Aquí no son fijos ni el número de personas ni el de clientes.","Aqui não são fixos nem o número de pessoas nem o de clientes."],"Die Mittel stehen fest (zwei Aushilfen).":["እቲ መሳርሒ ጸኒዑ (ክልተ ግዝያዊ ሰራሕተኛታት)።","Средства заданы (два помощника).","Los medios son fijos (dos ayudantes).","Os meios são fixos (dois ajudantes)."],"Das Ziel steht fest (§ Kunden).":["እቲ ዕላማ ጸኒዑ (§ ዓማዊል)።","Цель задана (§ клиентов).","El objetivo es fijo (§ clientes).","O objetivo é fixo ( s. Ahora tenéis que decidir cómo venderlos.","Receberam uma mercadoria especial: os smartphones mais recentes. Agora têm de decidir como os vender."],"Smartphones sind teuer, erklärungsbedürftig und diebstahlgefährdet. Dafür passt Bedienung.":["ስማርትፎናት ክቡራት፣ ምግላጽ ዘድልዮምን ብስርቂ ዝተጋለጹን እዮም። ንዚ Bedienung ይሰማማዕ።","Смартфоны дорогие, требуют объяснений и подвержены кражам. Для этого подходит Bedienung (обслуживание).","Los smartphones son caros, necesitan explicación y tienen riesgo de robo. Para esto encaja la Bedienung (atención personalizada).","Os smartphones são caros, precisam de explicação e têm risco de furto. Para isto serve a Bedienung (atendimento ao balcão)."],"· Kaje § (Technik) · Zielgruppe: Herr Petersen":["· Kaje § (ቴክኒክ) · ዒላማ ዓማዊል፦ Herr Petersen","· Kaje § (техника) · Целевая группа: Herr Petersen","· Kaje § (tecnología) · Grupo objetivo: Herr Petersen","· Kaje § (tecnologia) · Grupo-alvo: Herr Petersen"],"Herr Petersen (eure Zielgruppe)":["Herr Petersen (ዒላማ ዓማዊልኩም)","Herr Petersen (ваша целевая группа)","Herr Petersen (vuestro grupo objetivo)","Herr Petersen (o vosso grupo-alvo)"],"Richtig: das Kassenpapier":["ቅኑዕ፦ እቲ ወረቐት ሳጹን (Kassenpapier)","Правильно: кассовая бумага (Kassenpapier)","Correcto: el papel de caja (Kassenpapier)","Certo: o papel de caixa (Kassenpapier)"],"Richtig: Sie bestellt § Tischlampen beim preisgünstigsten Anbieter, den sie per Angebotsvergleich ermittelt hat.":["ቅኑዕ፦ § መብራህቲ ጠረጴዛ ካብ እቲ ዝተሓተ ዋጋ ዘለዎ ኣቕራቢ፣ ብምንጽጻር ጠቕላሊታት ዝወሰኖ ትዘንግዕ።","Правильно: Она заказывает § настольных ламп у самого выгодного поставщика, которого определила сравнением предложений.","Correcto: Pide § lámparas de mesa al proveedor más barato, que ha determinado comparando ofertas.","Certo: Encomenda § candeeiros de mesa ao fornecedor mais barato, que determinou comparando propostas."],"Richtig: Verzicht auf ständige Fachberatung in dieser Abteilung":["ቅኑዕ፦ ምዕቃብ ቀዋሚ ፍሉይ ምኽሪ ኣብዚ ክፍሊ","Правильно: отказ от постоянной профессиональной консультации в этом отделе","Correcto: renunciar al asesoramiento especializado permanente en esta sección","Certo: dispensar o aconselhamento especializado permanente nesta secção"],"Richtig: Umstellung der Beleuchtung auf LED":["ቅኑዕ፦ ምቕያር መብራህቲ ናብ LED","Правильно: Переход освещения на LED","Correcto: Cambio de la iluminación a LED","Certo: Mudança da iluminação para LED"],"Ihr: Ablehnen, weil die Leute im Viertel dafür keinen Bedarf haben – ihnen fehlt das Geld.":["ንስኻትኩም፦ ኣይፋል በሉ፣ ምኽንያቱ ሰባት ኣብ ዞባ ንዚ ዝደለየ (Bedarf) የብሎምን — ገንዘብ ይጎድሎም።","Вы: Отказаться, потому что у людей в районе нет Bedarf на это — им не хватает денег.","Vosotros: Rechazar, porque la gente del barrio no tiene Bedarf para esto: les falta dinero.","Vocês: Recusar, porque as pessoas do bairro não têm Bedarf para isto — falta-lhes dinheiro."],"Ihr: Ablehnen, weil Markenartikel sowieso schlecht sind.":["ንስኻትኩም፦ ኣይፋል በሉ፣ ምኽንያቱ Markenartikel ብሓቂ ሕማቕ እዮም።","Вы: Отказаться, потому что брендовые товары всё равно плохие.","Vosotros: Rechazar, porque los artículos de marca son malos de todos modos.","Vocês: Recusar, porque os artigos de marca são maus de qualquer maneira."],"Besser: Ablehnen, weil Fälschungen verboten sind. Für günstige Ware machen wir lieber eine eigene Handelsmarke.":["ዝሓሸ፦ ኣይፋል በሉ፣ ምኽንያቱ ሓሰውቲ ምዕባይ ክልኩል እዩ። ንርካሽ ኣቕሓ ባዕልና Handelsmarke ንሰርሕ።","Лучше: Отказаться, потому что подделки запрещены. Для дешёвого товара мы лучше сделаем собственную Handelsmarke.","Mejor: Rechazar, porque las falsificaciones están prohibidas. Para mercancía barata preferimos hacer una Handelsmarke propia.","Melhor: Recusar, porque as falsificações são proibidas. Para mercadoria barata preferimos fazer uma Handelsmarke própria."],"Sitzbank vor dem Laden · Fahrradständer · Leuchtschild „Offen“ · Blumenkübel am Eingang · Lastenrad für Lieferungen":["ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · መቐመጢ ብሽክለታ · ብርሃናዊ ምልክት „Offen“ (ክፉት) · ዕትሪ ኣበባ ኣብ ኣፍ ደገ · ብሽክለታ ጸዓት ንኣቕራቦት","Скамейка перед магазином · Велопарковка · Светящаяся вывеска «Offen» (открыто) · Кадки с цветами у входа · Грузовой велосипед для доставки","Banco delante de la tienda · Aparcabicicletas · Letrero luminoso «Offen» (abierto) · Macetas de flores en la entrada · Bici de carga para repartos","Banco à frente da loja · Suporte para bicicletas · Letreiro luminoso «Offen» (aberto) · Vasos de flores à entrada · Bicicleta de carga para entregas"],"Modul § · Das ökonomische Prinzip → nachlesen: Buch S. §":["ሞዱል § · እቲ ቁጠባዊ መምርሒ → ኣንብቡ፦ መጽሓፍ ገጽ §","Модуль § · Экономический принцип → прочитать: книга, с. §","Módulo § · El principio económico → leer: libro, p. §","Módulo § · O princípio económico → ler: livro, p. §"],"Modul § · Umweltschutz und Nachhaltigkeit → nachlesen: Buch S. §–§":["ሞዱል § · ሓለዋ ከባቢን ዘላቒ ምኽታልን → ኣንብቡ፦ መጽሓፍ ገጽ §–§","Модуль § · Защита окружающей среды и устойчивость → прочитать: книга, с. §–§","Módulo § · Protección del medio ambiente y sostenibilidad → leer: libro, p. §–§","Módulo § · Proteção do ambiente e sustentabilidade → ler: livro, p. §–§"],"Modul § · Die Aufgaben des Einzelhandels → nachlesen: Buch S. §":["ሞዱል § · ዕዮታት ንእሽተይ ዕዳጋ → ኣንብቡ፦ መጽሓፍ ገጽ §","Модуль § · Задачи розничной торговли → прочитать: книга, с. §","Módulo § · Las tareas del comercio minorista → leer: libro, p. §","Módulo § · As tarefas do comércio a retalho → ler: livro, p. §"],"Kulturbedürfnisse wachsen, wenn die Existenzbedürfnisse erfüllt sind. Mit kleinen Preisen haben viele dafür auch Bedarf.":["ድሌታት ባህሊ (Kulturbedürfnisse) ይዓብዩ፣ ድሌታት ህላወ ምስ ዝምልኡ። ብትሑት ዋጋ ብዙሓት ንዚ እውን ዝደለየ (Bedarf) ኣለዎም።","Культурные потребности (Kulturbedürfnisse) растут, когда удовлетворены жизненные. При небольших ценах у многих есть на это тоже Bedarf.","Las necesidades culturales (Kulturbedürfnisse) crecen cuando están cubiertas las básicas. A precios bajos, mucha gente también tiene Bedarf para ello.","As necessidades culturais (Kulturbedürfnisse) crescem quando as básicas estão satisfeitas. A preços baixos, muita gente também tem Bedarf para isso."],"Existenzbedürfnis: Ladekabel, Akkus, Glühbirnen – Existenzbedürfnisse müssen befriedigt werden. Dafür haben die Leute auch Bedarf – also Geld. Daraus wird Nachfrage.":["ድሌት ህላወ (Existenzbedürfnis)፦ ኬብል ጭሕን፣ ኣኩሙሌተራት፣ መብራህቲ – ድሌታት ህላወ (Existenzbedürfnisse) ክምልኡ ኣለዎም። ንዚ እውን ሰባት ዝደለየ (Bedarf) ኣለዎም — ማለት ገንዘብ። ካብኡ ጥላብ (Nachfrage) ይኸውን።","Жизненная потребность (Existenzbedürfnis): Зарядные кабели, аккумуляторы, лампочки – Жизненные потребности (Existenzbedürfnisse) нужно удовлетворять. На это у людей тоже есть Bedarf — то есть деньги. Из этого получается спрос (Nachfrage).","Necesidad básica (Existenzbedürfnis): Cables de carga, acumuladores, bombillas – Las necesidades básicas (Existenzbedürfnisse) hay que cubrirlas. Para esto la gente también tiene Bedarf, es decir, dinero. De ahí surge la demanda (Nachfrage).","Necessidade básica (Existenzbedürfnis): Cabos de carregamento, acumuladores, lâmpadas – As necessidades básicas (Existenzbedürfnisse) têm de ser satisfeitas. Para isto as pessoas também têm Bedarf — ou seja, dinheiro. Daí nasce a procura (Nachfrage)."],"Besser für Herr Petersen:":["ዝሓሸ ንHerr Petersen፦","Лучше для Herr Petersen:","Mejor para Herr Petersen:","Melhor para Herr Petersen:"],"Hier steht weder die Zahl der Leute noch die Zahl der Kunden fest. Das widerspricht dem ökonomischen Prinzip.":["ኣብዚ ቁጽሪ ሰባት ዋላ ቁጽሪ ዓማዊል ኣይጸንዐን። እዚ ንቁጠባዊ መምርሒ (ökonomisches Prinzip) ይጻረር።","Здесь не заданы ни число людей, ни число клиентов. Это противоречит экономическому принципу (ökonomisches Prinzip).","Aquí no son fijos ni el número de personas ni el de clientes. Esto contradice el principio económico (ökonomisches Prinzip).","Aqui não são fixos nem o número de pessoas nem o de clientes. Isto contraria o princípio económico (ökonomisches Prinzip)."],"Mit den zwei Aushilfen, die ihr habt, wollt ihr möglichst viele Kunden bedienen. – Die Mittel stehen fest (zwei Aushilfen). Der Nutzen soll möglichst groß sein. Das ist das Maximalprinzip.":["ምስ ክልተ ግዝያዊ ሰራሕተኛታት ዘለኩም ክሳብ ዝከኣል ብዙሓት ዓማዊል ክተገልግሉ ትደልዩ። – እቲ መሳርሒ ጸኒዑ (ክልተ ግዝያዊ ሰራሕተኛታት)። እቲ ረብሓ ክሳብ ዝከኣል ዓቢ ክኸውን ኣለዎ። እዚ Maximalprinzip እዩ።","С двумя помощниками, которые у вас есть, вы хотите обслужить как можно больше клиентов. – Средства заданы (два помощника). Польза должна быть как можно больше. Это принцип максимума (Maximalprinzip).","Con los dos ayudantes que tenéis, queréis atender a tantos clientes como sea posible. – Los medios son fijos (dos ayudantes). El beneficio debe ser lo mayor posible. Este es el principio de máximo (Maximalprinzip).","Com os dois ajudantes que têm, querem atender o maior número possível de clientes. – Os meios são fixos (dois ajudantes). O benefício deve ser o maior possível. Este é o princípio do máximo (Maximalprinzip)."],"Der Preis liegt unter dem Gleichgewichtspreis. Die Nachfrage (§) ist größer als das Angebot (§). Es entsteht ein Nachfrageüberschuss – der Preis steigt.":["እቲ ዋጋ ትሕቲ Gleichgewichtspreis እዩ። እቲ ጥላብ (§) ካብ ኣቕራቦት (§) ይዓቢ። Nachfrageüberschuss ይፍጠር — እቲ ዋጋ ይለዓል።","Цена ниже равновесной цены (Gleichgewichtspreis). Спрос (§) больше предложения (§). Возникает избыток спроса (Nachfrageüberschuss) — цена растёт.","El precio está por debajo del precio de equilibrio (Gleichgewichtspreis). La demanda (§) es mayor que la oferta (§). Surge un exceso de demanda (Nachfrageüberschuss): el precio sube.","O preço está abaixo do preço de equilíbrio (Gleichgewichtspreis). A procura (§) é maior do que a oferta (§). Surge um excesso de procura (Nachfrageüberschuss) — o preço sobe."],"Kostenlose Tüten laden zum Wegwerfen ein. Besser: Tüten kosten Geld, der Mehrweg-Beutel ist günstig.":["ነጻ ኮኮሮ ንደርባይ ይዕድሙ። ዝሓሸ፦ ኮኮሮ ገንዘብ ይኽፈል፣ ዳግም ዝጥቀም ሻንጣ ርካሽ እዩ።","Бесплатные пакеты побуждают выбрасывать. Лучше: Пакеты стоят денег, многоразовая сумка дёшева.","Las bolsas gratuitas invitan a tirar. Mejor: Las bolsas cuestan dinero, la bolsa reutilizable es barata.","Os sacos gratuitos convidam a deitar fora. Melhor: Os sacos custam dinheiro, o saco reutilizável é barato."],"Mehrweg-Transportkisten, Kartons ins Recycling, Batterie-Sammelbox an der Kasse – Mehrweg vermeidet Abfall. Kartons werden recycelt. Wer Batterien verkauft, muss alte Batterien zurücknehmen.":["ሳጹናት ዳግም ጥቕሚ ንምጽዋዕ፣ ካርቶናት ናብ Recycling፣ መእከቢ ባትሪ ኣብ ሳጹን – Mehrweg ቆሻሻ ይክልክል። ካርቶናት ዳግም ይጥቀሙ (recycelt)። ባትሪ ዝሸጥ ዝወዓለ ባትሪ ክምልስ ኣለዎ።","Многоразовые транспортные ящики, картон — на переработку, контейнер для батареек у кассы – Mehrweg предотвращает отходы. Картон перерабатывается (recycelt). Кто продаёт батарейки, обязан принимать обратно старые.","Cajas de transporte reutilizables, cartón al reciclaje, caja de recogida de pilas en la caja – Mehrweg evita residuos. Los cartones se reciclan (recycelt). Quien vende pilas tiene que aceptar de vuelta las usadas.","Caixas de transporte reutilizáveis, cartão para reciclagem, caixa de recolha de pilhas na caixa – Mehrweg evita resíduos. Os cartões são reciclados (recycelt). Quem vende pilhas tem de aceitar de volta as usadas."],"Der Einzelhandel stellt nichts her. Er verkauft Waren – meist unverändert – an die Verbraucher.":["ንእሽተይ ዕዳጋ ዋላ ሓንቲ ኣይፈርይን። ኣቕሑት ይሸጥ – ብዙሕ ግዜ ከይቀየሩ – ንተጠቀምቲ።","Розничная торговля ничего не производит. Он продаёт товары – как правило без изменений – потребителям.","El comercio minorista no fabrica nada. Vende mercancías – casi siempre sin transformarlas – a los consumidores.","O comércio a retalho não fabrica nada. Vende mercadorias – em regra sem as transformar – aos consumidores."],"Beratung: Ihr erklärt jede Ware und lasst die Kunden ausprobieren – Beratung kann der Online-Riese kaum bieten. Information und Beratung ist eine Aufgabe des Einzelhandels.":["Beratung (ምኽሪ)፦ ነፍሲ ወከፍ ኣቕሓ የረድኡ ዓማዊል ድማ ክፈትኑ የፍቅዱ – እቲ ዓቢ ኦንላይን ወኪል ምኽሪ ዳርጋ ክህብ ኣይኽእልን። Information und Beratung ዕዮ ንእሽተይ ዕዳጋ እዩ።","Beratung (консультация): Вы объясняете каждый товар и даёте клиентам попробовать – Онлайн-гигант вряд ли сможет предложить консультацию. Информация и консультация (Information und Beratung) — задача розничной торговли.","Beratung (asesoramiento): Explicáis cada producto y dejáis que los clientes lo prueben – El gigante online apenas puede ofrecer asesoramiento. La información y el asesoramiento (Information und Beratung) son una tarea del comercio minorista.","Beratung (aconselhamento): Explicam cada mercadoria e deixam os clientes experimentar – O gigante online dificilmente pode oferecer aconselhamento. A informação e o aconselhamento (Information und Beratung) são uma tarefa do comércio a retalho."],"Am Stadtrand gibt es große Flächen, niedrige Mieten und Parkplätze. Ohne Auto kommt man aber schlecht hin.":["ኣብ ወጻኢ ከተማ ዓበይቲ ቦታታት፣ ትሑት ክራይን መዕቆቢ መካይንን ኣለዉ። ብዘይ መኪና ግን ክበጽሕ ኣጸጋሚ እዩ።","На окраине есть большие площади, низкая аренда и парковки. Но без машины добраться трудно.","En las afueras hay grandes superficies, alquileres bajos y aparcamientos. Pero sin coche es difícil llegar.","Nos arredores há grandes áreas, rendas baixas e estacionamentos. Mas sem carro é difícil chegar lá."],"Fußgängerzone in der Innenstadt: viele Passanten, Bus und Bahn vor der Tür, hohe Miete – In der Innenstadt ist die hervorragende Erreichbarkeit für Kunden der wichtigste Standortfaktor. Nachteil: hohe Miete, wenig Parkplätze.":["ዞባ ጽጉዕ እግሪ ኣብ ማእከል ከተማ፦ ብዙሓት ሓላፍቲ፣ ባስን ባቡርን ኣብ ማዕጾ፣ ልዑል ክራይ – ኣብ ማእከል ከተማ እቲ ጽቡቕ ምብጻሕ ንዓማዊል እቲ ዝዓበየ Standortfaktor እዩ። ጉድለት፦ ልዑል ክራይ፣ ውሑድ መዕቆቢ መካይን።","Пешеходная зона в центре: много прохожих, автобус и поезд у двери, высокая аренда – В центре города отличная доступность для клиентов — самый важный фактор местоположения (Standortfaktor). Недостаток: высокая аренда, мало парковок.","Zona peatonal en el centro: muchos transeúntes, autobús y tren a la puerta, alquiler alto – En el centro, la excelente accesibilidad para los clientes es el factor de ubicación (Standortfaktor) más importante. Desventaja: alquiler alto, pocos aparcamientos.","Zona pedonal no centro: muitos transeuntes, autocarro e comboio à porta, renda alta – No centro da cidade, a excelente acessibilidade para os clientes é o fator de localização (Standortfaktor) mais importante. Desvantagem: renda alta, poucos estacionamentos."],"Möglich, aber teuer. Die Umstellung auf Vorwahl würde Personalkosten sparen.":["ይከኣል፣ ግን ክቡር እዩ። ምቕያር ናብ Vorwahl ወጻኢ ሰራሕተኛታት ይቆጥብ።","Возможно, но дорого. Переход на Vorwahl сэкономил бы расходы на персонал.","Posible, pero caro. El cambio a Vorwahl ahorraría costes de personal.","Possível, mas caro. A mudança para Vorwahl pouparia custos de pessoal."],"Vorwahl: Ware übersichtlich aufbauen, mit Produktbeschreibung. Beratung gibt es auf Wunsch. – Vorwahl braucht einen übersichtlichen Warenaufbau mit Produktbeschreibung. Vorteile: weniger Personalkosten, Kunden fühlen sich nicht bedrängt.":["Vorwahl (ቅድሚ ምምራጽ)፦ ኣቕሓ ብንጹር ኣዳልዉ፣ ምስ መግለጺ ምህርቲ። ምኽሪ ብድሌት ይርከብ። – Vorwahl ንጹር ኣደላልዋ ኣቕሓ ምስ መግለጺ ምህርቲ ይደሊ። ረብሓታት፦ ውሑድ ወጻኢ ሰራሕተኛታት፣ ዓማዊል ኣይጭነቑን።","Vorwahl (предварительный выбор): Выставьте товар наглядно, с описанием продукта. Консультация — по желанию. – Vorwahl требует наглядной выкладки товара с описанием продукта. Преимущества: меньше расходов на персонал, клиенты не чувствуют давления.","Vorwahl (preselección): Colocad la mercancía de forma clara, con descripción del producto. El asesoramiento se da si se pide. – La Vorwahl necesita una colocación clara de la mercancía con descripción del producto. Ventajas: menos costes de personal, los clientes no se sienten agobiados.","Vorwahl (pré-seleção): Organizem a mercadoria de forma clara, com descrição do produto. O aconselhamento existe se for pedido. – A Vorwahl precisa de uma disposição clara da mercadoria com descrição do produto. Vantagens: menos custos de pessoal, os clientes não se sentem pressionados."],"Das Organigramm zeigt, wer zuständig ist (Aufbauorganisation). Wie der Kassenabschluss gemacht wird, regelt es nicht.":["እቲ Organigramm ሓላፊ መን ከም ዝኾነ የርኢ (Aufbauorganisation)። ከመይ Kassenabschluss ከም ዝግበር ኣይቆጻጸርን።","Организационная схема (Organigramm) показывает, кто за что отвечает (Aufbauorganisation). Как делается закрытие кассы, он не регулирует.","El organigrama (Organigramm) muestra quién es responsable de qué (Aufbauorganisation). No regula cómo se hace el cierre de caja.","O organigrama (Organigramm) mostra quem é responsável por quê (Aufbauorganisation). Não regula como se faz o fecho de caixa."],"Ihr schreibt eine Arbeitsanweisung für den Kassenabschluss: fünf Schritte, immer gleich – Die Arbeitsanweisung legt fest, dass eine Arbeit immer gleich und mit gleichem Ergebnis gemacht wird – egal, wer sie macht. Das ist Ablauforganisation.":["ንምዕጻው ሳጹን Arbeitsanweisung ትጽሕፉ፦ ሓሙሽተ ስጉምትታት፣ ኩሉ ግዜ ማዕረ – እቲ Arbeitsanweisung ሓደ ስራሕ ኩሉ ግዜ ማዕረን ብማዕረ ውጽኢትን ክግበር ይውስን — መን ዝገብሮ ይኹን። እዚ Ablauforganisation እዩ።","Вы пишете рабочую инструкцию для закрытия кассы: пять шагов, всегда одинаково – Рабочая инструкция определяет, что работа всегда выполняется одинаково и с одинаковым результатом — независимо от того, кто её делает. Это Ablauforganisation (организация процессов).","Escribís una instrucción de trabajo para el cierre de caja: cinco pasos, siempre iguales – La instrucción de trabajo establece que un trabajo se haga siempre igual y con el mismo resultado, sin importar quién lo haga. Esto es Ablauforganisation (organización de los procesos).","Escrevem uma instrução de trabalho para o fecho de caixa: cinco passos, sempre iguais – A instrução de trabalho estabelece que um trabalho é sempre feito da mesma forma e com o mesmo resultado, seja quem for que o faça. Isto é Ablauforganisation (organização dos processos)."],"Zeitdruck":["ጭንቀት ግዜ","Нехватка времени","Presión de tiempo","Pressão de tempo"],"Haushalt → Unternehmen":["ስድራቤት → ትካል (Haushalt → Unternehmen)","Домохозяйство → предприятие (Haushalt → Unternehmen)","Hogar → empresa (Haushalt → Unternehmen)","Agregado familiar → empresa (Haushalt → Unternehmen)"],"Unternehmen → Haushalt":["ትካል → ስድራቤት (Unternehmen → Haushalt)","Предприятие → домохозяйство (Unternehmen → Haushalt)","Empresa → hogar (Unternehmen → Haushalt)","Empresa → agregado familiar (Unternehmen → Haushalt)"],"Ein Möbelhaus liefert Herrn Petersen ein neues Sofa.":["ሓደ ድኳን ሜብልስ ንHerr Petersen ሓድሽ ሶፋ የብጽሕ።","Мебельный магазин доставляет Herr Petersen новый диван.","Una tienda de muebles entrega un sofá nuevo a Herr Petersen.","Uma loja de móveis entrega um sofá novo a Herr Petersen."],"Eine Ware geht zum Kunden. Güterstrom vom Unternehmen zum Haushalt.":["ሓደ ዕቃ ናብ ዓሚል ይኸይድ። ዋሕዚ ኣቕሑት ካብ ትካል ናብ ስድራቤት።","Товар уходит к клиенту. Поток товаров от предприятия к домохозяйству.","Una mercancía va al cliente. Flujo de bienes de la empresa al hogar.","Uma mercadoria vai para o cliente. Fluxo de bens da empresa para o agregado familiar."],"Weiter zur Profi-Frage":["ቀጽሉ ናብ ሕቶ ክኢላ","Дальше к профи-вопросу","Seguir a la pregunta de profesional","Continuar para a pergunta de profissional"],"Welches Beispiel stellt im einfachen Wirtschaftskreislauf einen Geldstrom dar?":["ኣየናይ ኣብነት ኣብ ቀሊል ዑደት ቁጠባ ዋሕዚ ገንዘብ (Geldstrom) የርኢ?","Какой пример в простом экономическом кругообороте показывает денежный поток (Geldstrom)?","¿Qué ejemplo representa un flujo de dinero (Geldstrom) en el circuito económico simple?","Que exemplo representa um fluxo de dinheiro (Geldstrom) no circuito económico simples?"],"Frau Ahlers prüft euch:":["Frau Ahlers ትፈትነኩም፦","Frau Ahlers проверяет вас:","Frau Ahlers os examina:","Frau Ahlers examina-vos:"],"Profi-Frage · § Fachpunkte":["ሕቶ ክኢላ · § ነጥቢ ሞያ","Профи-вопрос · § баллов по предмету","Pregunta de profesional · § puntos de materia","Pergunta de profissional · § pontos de matéria"],"Euer Laden installiert eine neue Kasse.":["ድኳንኩም ሓድሽ ሳጹን ይጥቀም።","Ваш магазин устанавливает новую кассу.","Vuestra tienda instala una caja nueva.","A vossa loja instala uma caixa nova."],"Euer Laden liefert Waren an Kunden aus.":["ድኳንኩም ኣቕሑት ንዓማዊል የብጽሕ።","Ваш магазин доставляет товары клиентам.","Vuestra tienda reparte mercancía a los clientes.","A vossa loja entrega mercadoria aos clientes."],"Euer Laden zahlt Löhne an die Aushilfen.":["ድኳንኩም ንግዝያዊ ሰራሕተኛታት ደሞዝ ይኸፍል።","Ваш магазин платит зарплату помощникам.","Vuestra tienda paga s ana · Caixa -§ € · Confiança -§ %"],"Ohne Lieferung bleiben die Kunden weg.":["ብዘይ ኣቕራቦት ዓማዊል ይርሕቁ።","Без поставки клиенты не приходят.","Sin suministro, los clientes no vienen.","Sem entrega, os clientes não vêm."],"Kulturbedürfnis: Festival-Mode und Hafen-Hoodies":["ድሌት ባህሊ (Kulturbedürfnis)፦ ክዳን ፌስቲቫልን ሁዲታት ወደብን","Культурная потребность (Kulturbedürfnis): фестивальная мода и худи из порта","Necesidad cultural (Kulturbedürfnis): moda de festival y sudaderas del puerto","Necessidade cultural (Kulturbedürfnis): moda de festival e hoodies do porto"],"Existenzbedürfnis: warme Winterjacken und Regenkleidung":["ድሌት ህላወ (Existenzbedürfnis)፦ ሙቕ ዝበለ ጃኬታትን ክዳን ዝናብን","Жизненная потребность (Existenzbedürfnis): тёплые зимние куртки и дождевики","Necesidad básica (Existenzbedürfnis): chaquetas de invierno calientes y ropa de lluvia","Necessidade básica (Existenzbedürfnis): casacos quentes de inverno e roupa de chuva"],"Luxusbedürfnis: Designermäntel ab § €":["ድሌት ቅንዕ (Luxusbedürfnis)፦ ዲዛይነር ካፖታት ካብ § €","Потребность в роскоши (Luxusbedürfnis): дизайнерские пальто от § €","Necesidad de lujo (Luxusbedürfnis): abrigos de diseñador desde § €","Necessidade de luxo (Luxusbedürfnis): casacos de designer a partir de § €"],"Existenzbedürfnisse müssen befriedigt werden. Dafür haben die Leute auch Bedarf – also Geld. Daraus wird Nachfrage.":["ድሌታት ህላወ (Existenzbedürfnisse) ክምልኡ ኣለዎም። ንዚ እውን ሰባት ዝደለየ (Bedarf) ኣለዎም — ማለት ገንዘብ። ካብኡ ጥላብ (Nachfrage) ይኸውን።","Жизненные потребности (Existenzbedürfnisse) нужно удовлетворять. На это у людей тоже есть Bedarf — то есть деньги. Из этого получается спрос (Nachfrage).","Las necesidades básicas (Existenzbedürfnisse) hay que cubrirlas. Para esto la gente también tiene Bedarf, es decir, dinero. De ahí surge la demanda (Nachfrage).","As necessidades básicas (Existenzbedürfnisse) têm de ser satisfeitas. Para isto as pessoas também têm Bedarf — ou seja, dinheiro. Daí nasce a procura (Nachfrage)."],"Organisation im Betrieb":["ኣወዳድባ ኣብ ትካል (Organisation im Betrieb)","Организация на предприятии (Organisation im Betrieb)","Organización en la empresa (Organisation im Betrieb)","Organização na empresa (Organisation im Betrieb)"],"Die Arbeitsanweisung legt fest, dass eine Arbeit immer gleich und mit gleichem Ergebnis gemacht wird – egal, wer sie macht. Das ist Ablauforganisation.":["እቲ Arbeitsanweisung ሓደ ስራሕ ኩሉ ግዜ ማዕረን ብማዕረ ውጽኢትን ክግበር ይውስን — መን ዝገብሮ ይኹን። እዚ Ablauforganisation እዩ።","Рабочая инструкция определяет, что работа всегда выполняется одинаково и с одинаковым результатом — независимо от того, кто её делает. Это Ablauforganisation (организация процессов).","La instrucción de trabajo establece que un trabajo se haga siempre igual y con el mismo resultado, sin importar quién lo haga. Esto es Ablauforganisation (organización de los procesos).","A instrução de trabalho estabelece que um trabalho é sempre feito da mesma forma e com o mesmo resultado, seja quem for que o faça. Isto é Ablauforganisation (organização dos processos)."],"Standort und Betriebsformen":["ቦታን ዓይነታት ድኳንን (Standort und Betriebsformen)","Местоположение и формы предприятий (Standort und Betriebsformen)","Ubicación y formas comerciales (Standort und Betriebsformen)","Localização e formas de comércio (Standort und Betriebsformen)"],"LED schont die Umwelt (ökologisch) und senkt die Stromkosten (ökonomisch). Ein Ziel hilft dem anderen: Zielharmonie.":["LED ንከባቢ ይሕሉ (ኢኮሎጂያዊ) ክፍሊት ኤለክትሪክ ድማ የንኣስ (ኢኮኖሚያዊ)። ሓደ ዕላማ ንካልእ ይሕግዝ፦ Zielharmonie።","LED бережёт окружающую среду (экологически) и снижает расходы на электричество (экономически). Одна цель помогает другой: Zielharmonie.","LED cuida el medio ambiente (ecológico) y reduce el gasto eléctrico (económico). Un objetivo ayuda al otro: Zielharmonie.","O LED poupa o ambiente (ecológico) e reduz os custos de eletricidade (económico). Um objetivo ajuda o outro: Zielharmonie."],"Opa nimmt den Schlüssel zurück: „Ich zeig euch noch einmal, wie es geht. Dann probiert ihr es wieder.“":["Opa መፍትሕ ይመልስ፦ „ሓንሳብ ዳግም ከርእየኩም እየ ከመይ ከም ዝኸውን። ሽዑ ዳግም ትፈትኑ።““","Opa забирает ключ обратно: «Я ещё раз покажу вам, как это делается. Потом попробуете снова.»“","Opa recupera la llave: «Os enseño otra vez cómo se hace. Luego lo intentáis de nuevo.»“","Opa recebe a chave de volta: «Mostro-vos outra vez como se faz. Depois tentam de novo.»“"],"Opa Hinrichs übernimmt wieder":["Opa Hinrichs ዳግም ይወስድ","Opa Hinrichs снова берёт дело в свои руки","Opa Hinrichs vuelve a hacerse cargo","Opa Hinrichs volta a assumir"],"Punktekarte · Profi · Ganze Saison":["ካርድ ነጥቢ · ክኢላ · ምሉእ ወቕቲ","Карта баллов · Профи · Весь сезон","Tarjeta de puntos · Profesional · Toda la temporada","Cartão de pontos · Profissional · Toda a época"],"· Kaje § (Mode) · Zielgruppe: Herr Petersen":["· Kaje § (ሞዳ) · ዒላማ ዓማዊል፦ Herr Petersen","· Kaje § (мода) · Целевая группа: Herr Petersen","· Kaje § (moda) · Grupo objetivo: Herr Petersen","· Kaje § (moda) · Grupo-alvo: Herr Petersen"],"Opa Hinrichs übernimmt wieder (euer Ende)":["Opa Hinrichs ዳግም ይወስድ (መወዳእታኹም)","Opa Hinrichs снова берёт дело в свои руки (ваш финал)","Opa Hinrichs vuelve a hacerse cargo (vuestro final)","Opa Hinrichs volta a assumir (o vosso final)"],"Richtig: Die Kunden achten stärker auf den Preis.":["ቅኑዕ፦ እቶም ዓማዊል ንዋጋ ዝያዳ ይጥንቀቑ።","Правильно: Клиенты больше обращают внимание на цену.","Correcto: Los clientes se fijan más en el precio.","Certo: Os clientes prestam mais atenção ao preço."],"Richtig: Waren auswählen (Sortiment) und an Verbraucher verkaufen":["ቅኑዕ፦ ኣቕሑት ምምራጽ (Sortiment) ንተጠቀምቲ ምሻጥ","Правильно: выбирать товары (Sortiment) и продавать потребителям","Correcto: elegir mercancías (Sortiment) y venderlas a los consumidores","Certo: escolher mercadorias (Sortiment) e vendê-las aos consumidores"],"Richtig: Sie will einen möglichst hohen Gewinn erzielen.":["ቅኑዕ፦ ክሳብ ዝከኣል ልዑል ትርፊ ክትረክብ ትደሊ።","Правильно: Она хочет получить как можно большую прибыль.","Correcto: Quiere obtener el mayor beneficio posible.","Certo: Quer obter o maior lucro possível."],"Ihr: Annehmen. Keine Miete – super!":["ንስኻትኩም፦ ተቐበሉ። ክራይ የለን – ብሉጽ!","Вы: Принять. Без аренды – супер!","Vosotros: Aceptar. Sin alquiler – ¡genial!","Vocês: Aceitar. Sem renda – ótimo!"],"Besser: Ablehnen, weil uns die Kunden dort schlecht erreichen. Erreichbarkeit ist wichtiger als die Miete.":["ዝሓሸ፦ ኣይፋል በሉ፣ ምኽንያቱ ዓማዊልና ኣብኡ ብጽቡቕ ኣይበጽሑን። ምብጻሕ ካብ ክራይ ዝያዳ ኣገዳሲ እዩ።","Лучше: Отказаться, потому что клиентам там трудно до нас добраться. Доступность важнее аренды.","Mejor: Rechazar, porque a los clientes les resulta difícil llegar allí. La accesibilidad es más importante que el alquiler.","Melhor: Recusar, porque os clientes têm dificuldade em chegar lá. A acessibilidade é mais importante do que a renda."],"Modul § · Organisation im Betrieb":["ሞዱል § · ኣወዳድባ ኣብ ትካል (Organisation im Betrieb)","Модуль § · Организация на предприятии (Organisation im Betrieb)","Módulo § · Organización en la empresa (Organisation im Betrieb)","Módulo § · Organização na empresa (Organisation im Betrieb)"],"Sitzbank vor dem Laden · Leuchtschild „Offen“ · Fahrradständer · Blumenkübel am Eingang · Lastenrad für Lieferungen":["ናይ ምቕማጥ ወንበር ቅድሚ ድኳን · ብርሃናዊ ምልክት „Offen“ (ክፉት) · መቐመጢ ብሽክለታ · ዕትሪ ኣበባ ኣብ ኣፍ ደገ · ብሽክለታ ጸዓት ንኣቕራቦት","Скамейка перед магазином · Светящаяся вывеска «Offen» (открыто) · Велопарковка · Кадки с цветами у входа · Грузовой велосипед для доставки","Banco delante de la tienda · Letrero luminoso «Offen» (abierto) · Aparcabicicletas · Macetas de flores en la entrada · Bici de carga para repartos","Banco à frente da loja · Letreiro luminoso «Offen» (aberto) · Suporte para bicicletas · Vasos de flores à entrada · Bicicleta de carga para entregas"],"Modul § · Standort und Betriebsformen → nachlesen: Buch S. §–§":["ሞዱል § · ቦታን ዓይነታት ድኳንን → ኣንብቡ፦ መጽሓፍ ገጽ §–§","Модуль § · Местоположение и формы предприятий → прочитать: книга, с. §–§","Módulo § · Ubicación y formas comerciales → leer: libro, p. §–§","Módulo § · Localização e formas de comércio → ler: livro, p. §–§"],"Grippewelle im Team:":["ግሪፕ ኣብ ጉጅለ፦","Грипп в команде:","Gripe en el equipo:","Gripe na equipa:"],"richtig – Löhne und Gehälter sind Teil des Geldstromes von den Unternehmen zu den Haushalten.":["ቅኑዕ – ደሞዝ ካብ ትካላት ናብ ስድራቤታት ኣብ ዋሕዚ ገንዘብ (Geldstrom) ኣካል እዩ።","верно – Зарплаты — часть денежного потока (Geldstrom) от предприятий к домохозяйствам.","correcto – Los sueldos son parte del flujo de dinero (Geldstrom) de las empresas a los hogares.","certo – Os salários fazem parte do fluxo de dinheiro (Geldstrom) das empresas para os agregados familiares."],"Profi-Frage:":["ሕቶ ክኢላ፦","Профи-вопрос:","Pregunta de profesional:","Pergunta de profissional:"],"falsch – Genau so steht es in der Prüfung: gewerbsmäßig einkaufen und meist unverändert an Verbraucher verkaufen.":["ጌጋ – ከምዚ ኣብ ፈተና ይጽሓፍ፦ ብሞያ ምግዛእ ብዙሕ ግዜ ከይቀየሩ ድማ ንተጠቀምቲ ምሻጥ።","неверно – Именно так в экзамене: профессионально закупать и продавать потребителям, как правило без изменений.","incorrecto – Así aparece en el examen: comprar de forma profesional y vender casi siempre sin transformar a los consumidores.","errado – Assim aparece no exame: comprar de forma profissional e vender em regra sem transformar aos consumidores."],"Viele wünschen sich das. Aber im Viertel fehlt das Geld – kein Bedarf, also keine Nachfrage.":["ብዙሓት ንዚ ይደልዩ። ግን ኣብ ዞባ ገንዘብ ይጎድል — Bedarf የለን፣ ስለዚ ጥላብ የለን።","Многие этого хотят. Но в районе нет денег — нет Bedarf, значит нет и спроса.","Mucha gente lo desea. Pero en el barrio falta dinero: sin Bedarf no hay demanda.","Muita gente o deseja. Mas no bairro falta dinheiro — sem Bedarf não há procura."],"Existenzbedürfnis: warme Socken, Mützen und Unterwäsche – Existenzbedürfnisse sind lebensnotwendig. Dafür haben die Leute auch Geld übrig – sie haben Bedarf.":["ድሌት ህላወ (Existenzbedürfnis)፦ ድሑር ሶክስ፣ ቆብዕን ዓርጌ ክዳንን – ድሌታት ህላወ (Existenzbedürfnisse) ንህይወት ኣገደስቲ እዮም። ንዚ ሰባት ገንዘብ ተሪፉዎም — Bedarf ኣለዎም።","Жизненная потребность (Existenzbedürfnis): тёплые носки, шапки и нижнее бельё – Жизненные потребности (Existenzbedürfnisse) необходимы для жизни. На это у людей остаются деньги — у них есть Bedarf.","Necesidad básica (Existenzbedürfnis): calcetines calientes, gorros y ropa interior – Las necesidades básicas (Existenzbedürfnisse) son vitales. Para esto a la gente le sobra dinero: tiene Bedarf.","Necessidade básica (Existenzbedürfnis): meias quentes, gorros e roupa interior – As necessidades básicas (Existenzbedürfnisse) são vitais. Para isto as pessoas têm dinheiro de sobra — têm Bedarf."],"richtig – Der Betrieb nutzt das Papier für seine Arbeit → Produktionsgut. Es wird nur einmal genutzt → Verbrauchsgut. Die Kasse selbst wäre ein Produktions- und Gebrauchsgut.":["ቅኑዕ – እቲ ትካል ወረቐት ንስራሑ ይጥቀም → Produktionsgut። ሓደ ግዜ ጥራይ ይጥቀም → Verbrauchsgut። እቲ ሳጹን ባዕሉ Produktionsgut ከምኡ ድማ Gebrauchsgut ምኾነ።","верно – Предприятие использует бумагу для своей работы → Produktionsgut (производственное благо). Используется только один раз → Verbrauchsgut (расходное благо). Сама касса была бы Produktionsgut и Gebrauchsgut.","correcto – La empresa usa el papel para su trabajo → Produktionsgut (bien de producción). Se usa solo una vez → Verbrauchsgut (bien de consumo inmediato). La caja en sí sería un Produktionsgut y un Gebrauchsgut.","certo – A empresa usa o papel para o seu trabalho → Produktionsgut (bem de produção). Usa-se só uma vez → Verbrauchsgut (bem consumível). A caixa em si seria um Produktionsgut e um Gebrauchsgut."],"richtig (Lösung: §).":["ቅኑዕ (መልሲ፦ §).","верно (ответ: §).","correcto (solución: §).","certo (solução: §)."],"Rechenaufgabe:":["ዕዮ ሕሳብ፦","Расчётная задача:","Ejercicio de cálculo:","Exercício de cálculo:"],"falsch – Das Ziel steht fest (§ € Umsatz), die Kosten sollen möglichst niedrig sein. Bei den anderen steht das Mittel fest → Maximalprinzip.":["ጌጋ – እቲ ዕላማ ጸኒዑ (§ € ሽያጥ)፣ እቲ ወጻኢ ክሳብ ዝከኣል ትሑት ክኸውን ኣለዎ። ኣብ ካልኦት እቲ መሳርሒ ጸኒዑ → Maximalprinzip።","неверно – Цель задана (§ € оборота), расходы должны быть как можно ниже. В остальных случаях задано средство → принцип максимума (Maximalprinzip).","incorrecto – El objetivo es fijo (§ € de ventas), los costes deben ser lo más bajos posible. En los demás es fijo el medio → principio de máximo (Maximalprinzip).","errado – O objetivo é fixo (§ € de vendas), os custos devem ser os mais baixos possíveis. Nos outros é fixo o meio → princípio do máximo (Maximalprinzip)."],"falsch (Lösung: §).":["ጌጋ (መልሲ፦ §).","неверно (ответ: §).","incorrecto (solución: §).","errado (solução: §)."],"falsch – Käufermarkt: Das Angebot ist größer als die Nachfrage. Der Käufer ist in der starken Position, die Preise fallen.":["ጌጋ – Käufermarkt (ዕዳጋ ገዛኢ)፦ እቲ ኣቕራቦት ካብ ጥላብ ይዓቢ። እቲ ገዛኢ ኣብ ሓያል ኩነታት ኣሎ፣ ዋጋታት ይወርዱ።","неверно – Käufermarkt (рынок покупателя): Предложение больше спроса. Покупатель в сильной позиции, цены падают.","incorrecto – Käufermarkt (mercado del comprador): La oferta es mayor que la demanda. El comprador está en posición fuerte, los precios bajan.","errado – Käufermarkt (mercado do comprador): A oferta é maior do que a procura. O comprador está em posição forte, os preços descem."],"falsch – Wer Batterien verkauft, muss gebrauchte Batterien zurücknehmen – auch wenn der Kunde sie woanders gekauft hat.":["ጌጋ – ባትሪታት ዝሸጥ ዝተጠቀመ ባትሪታት ክቅበል ኣለዎ — ዓሚል ኣብ ካልእ ቦታ እኳ እንተ ገዝኦም።","неверно – Кто продаёт батарейки, обязан принимать использованные — даже если клиент купил их в другом месте.","incorrecto – Quien vende pilas debe aceptar las usadas, aunque el cliente las haya comprado en otro sitio.","errado – Quem vende pilhas tem de aceitar as usadas — mesmo que o cliente as tenha comprado noutro lado."],"Das Outlet hat nur eine Marke und keine Beratung. Ihr bietet Sortimentsbildung und Beratung – zwei Aufgaben des Einzelhandels.":["እቲ Outlet ሓንቲ ማርክ ጥራይ ኣለዎ ምኽሪ ድማ የብሉን። Sortimentsbildung ከምኡ ድማ Beratung ትህቡ — ክልተ ዕዮታት ንእሽተይ ዕዳጋ።","В аутлете только одна марка и нет консультации. Вы предлагаете формирование ассортимента (Sortimentsbildung) и консультацию (Beratung) — две задачи розничной торговли.","El outlet solo tiene una marca y no ofrece asesoramiento. Ofrecéis formación del surtido (Sortimentsbildung) y asesoramiento (Beratung): dos tareas del comercio minorista.","O outlet só tem uma marca e não aconselha. Oferecem formação do sortimento (Sortimentsbildung) e aconselhamento (Beratung) — duas tarefas do comércio a retalho."],"falsch – Beratung heißt: Die Verkäuferin informiert und erklärt. Ware aus dem Lager holen ist Zeitüberbrückung.":["ጌጋ – Beratung ማለት፦ እታ ሻጣይቲ ትሕብር ትገልጽ ድማ። ኣቕሓ ካብ መኽዘን ምምጻእ Zeitüberbrückung እዩ።","неверно – Beratung означает: Продавщица информирует и объясняет. Принести товар со склада — это Zeitüberbrückung (преодоление времени).","incorrecto – Beratung significa: La vendedora informa y explica. Traer mercancía del almacén es Zeitüberbrückung (salvar el tiempo).","errado – Beratung significa: A vendedora informa e explica. Trazer mercadoria do armazém é Zeitüberbrückung (vencer o tempo)."],"Saisonware gibt es nur zu bestimmten Zeiten. Im Herbst passt sie genau.":["Saisonware ኣብ ሓደ ሓደ እዋን ጥራይ ይርከብ። ኣብ ክረምቲ ብትክክል ይሰማማዕ።","Сезонный товар (Saisonware) бывает только в определённое время. Осенью он подходит идеально.","La Saisonware (mercancía de temporada) solo hay en ciertas épocas. En otoño encaja justo.","A Saisonware (mercadoria sazonal) só existe em certas épocas. No outono encaixa na perfeição."],"Mehr Auswahl im Kernsortiment: Jeans, Pullover, Jacken – Das Kernsortiment bringt den Hauptumsatz und ist ständig verkaufsbereit. Mehr Auswahl dort lohnt sich.":["ዝያዳ ምርጫ ኣብ Kernsortiment፦ ጅንስ፣ ሸሚዝ ሱፍ፣ ጃኬታት – እቲ Kernsortiment ቀዳማይ ሽያጥ የምጽእ ኩሉ ግዜ ድማ ንሽያጥ ድሉው እዩ። ዝያዳ ምርጫ ኣብኡ ይጠቅም።","Больше выбора в Kernsortiment: джинсы, свитеры, куртки – Kernsortiment приносит основной оборот и всегда готов к продаже. Больший выбор там окупается.","Más selección en el Kernsortiment: vaqueros, jerséis, chaquetas – El Kernsortiment aporta la mayor parte de las ventas y está siempre disponible para la venta. Más selección ahí merece la pena.","Mais escolha no Kernsortiment: calças de ganga, camisolas, casacos – O Kernsortiment traz o grosso das vendas e está sempre disponível para venda. Mais escolha ali compensa."],"richtig – Das Kernsortiment ist ständig vorrätig und bringt den Hauptumsatz.":["ቅኑዕ – Kernsortiment ኩሉ ግዜ ኣሎ ቀዳማይ ሽያጥ ድማ የምጽእ።","верно – Kernsortiment всегда в наличии и приносит основной оборот.","correcto – El Kernsortiment siempre está disponible y aporta la mayor parte de las ventas.","certo – O Kernsortiment está sempre disponível e traz o grosso das vendas."],"Der Discounter hat ein enges, flaches Sortiment und sehr niedrige Preise. Er liegt meist am Stadtrand oder im Wohngebiet.":["Discounter ጸቢብን ጥሩ ዘይኮነ Sortiment ኣዝዩ ትሑት ዋጋ ኣለዎ። ብዙሕ ግዜ ኣብ ወጻኢ ከተማ ወይ ዞባ መንበሪ እዩ።","Discounter имеет узкий, неглубокий ассортимент и очень низкие цены. Обычно он находится на окраине или в жилом районе.","El Discounter tiene un surtido estrecho y poco profundo y precios muy bajos. Suele estar en las afueras o en una zona residencial.","O Discounter tem um sortimento estreito e pouco profundo e preços muito baixos. Costuma ficar nos arredores ou numa zona residencial."],"Fachgeschäft: eine Branche, große Auswahl und Beratung – Das Fachgeschäft hat eine Branche mit schmalem, tiefem Sortiment, mittlere bis hohe Preise und Beratung. Es passt auf kleine Fläche in zentraler Lage.":["Fachgeschäft፦ ሓደ ዓይነት ዕዮ፣ ዓቢ ምርጫ ከምኡ ድማ ምኽሪ – Fachgeschäft ሓደ ዓይነት ዕዮ ጸቢብን ዕሙቕን Sortiment፣ ማእከላይ ክሳብ ልዑል ዋጋን ምኽርን ኣለዎ። ኣብ ንእሽተይ ቦታ ኣብ ማእከላይ ቦታ ይሰማማዕ።","Fachgeschäft: одна отрасль, большой выбор и консультация – Fachgeschäft — это одна отрасль с узким и глубоким ассортиментом, средние и высокие цены и консультация. Подходит для небольшой площади в центральном месте.","Fachgeschäft: un sector, gran selección y asesoramiento – El Fachgeschäft tiene un sector con surtido estrecho y profundo, precios medios a altos y asesoramiento. Encaja en una superficie pequeña en una zona céntrica.","Fachgeschäft: um ramo, grande escolha e aconselhamento – O Fachgeschäft tem um ramo com sortimento estreito e profundo, preços médios a altos e aconselhamento. Cabe numa área pequena em local central."],"falsch – Am Hafen und in der Innenstadt ist Platz teuer und knapp. Viele kostenlose Parkplätze sind der typische Vorteil am Stadtrand.":["ጌጋ – ኣብ ወደብን ማእከል ከተማን ቦታ ክቡርን ውሑድን እዩ። ብዙሓት ነጻ መዕቆቢ መካይን እቲ ልሙድ ረብሓ ወጻኢ ከተማ እዩ።","неверно – В порту и в центре города место дорогое и ограниченное. Много бесплатных парковок — типичное преимущество окраины.","incorrecto – En el puerto y en el centro el espacio es caro y escaso. Muchos aparcamientos gratuitos son la ventaja típica de las afueras.","errado – No porto e no centro da cidade o espaço é caro e escasso. Muitos estacionamentos gratuitos são a vantagem típica dos arredores."],"Einfache Ware für jeden Tag braucht keine Beratung. Dafür passt Selbstbedienung.":["ቀሊል ኣቕሓ ንነፍሲ ወከፍ መዓልቲ ምኽሪ ኣየድልዮን። ንዚ Selbstbedienung (ባዕል ኣገልግሎት) ይሰማማዕ።","Простому товару на каждый день консультация не нужна. Для этого подходит самообслуживание (Selbstbedienung).","La mercancía sencilla de todos los días no necesita asesoramiento. Para esto encaja el autoservicio (Selbstbedienung).","A mercadoria simples do dia a dia não precisa de aconselhamento. Para isto serve o self-service (Selbstbedienung)."],"falsch – Bei Selbstbedienung wählt der Kunde selbst. Eine regelmäßige Fachberatung gibt es nicht.":["ጌጋ – ኣብ Selbstbedienung እቲ ዓሚል ባዕሉ ይመርጽ። ስሩዕ ፍሉይ ምኽሪ የለን።","неверно – При самообслуживании клиент выбирает сам. Регулярной профессиональной консультации нет.","incorrecto – En el autoservicio el cliente elige por sí mismo. No hay asesoramiento especializado regular.","errado – No self-service o cliente escolhe por si. Não há aconselhamento especializado regular."],"falsch – Rentabilität = Gewinn · § : Kapital = § · § : § = § %.":["ጌጋ – Rentabilität = Gewinn · § : Kapital = § · § : § = § %.","неверно – Rentabilität = Gewinn (прибыль) · § : Kapital (капитал) = § · § : § = § %.","incorrecto – Rentabilität = Gewinn (beneficio) · § : Kapital (capital) = § · § : § = § %.","errado – Rentabilität = Gewinn (lucro) · § : Kapital (capital) = § · § : § = § %."],"Eine Instanz hat Weisungsbefugnis. Wenn alle Anweisungen geben, weiß niemand, was gilt.":["Instanz መሰል መምርሒ ኣለዋ። ኩሉ ሰብ መምርሒ እንተሃበ ሓደ እኳ ኣይፈልጥን እንታይ ከም ዝሰርሕ።","У инстанции (Instanz) есть право давать указания. Если указания даёт каждый, никто не знает, что действует.","Una Instanz tiene facultad de dar instrucciones. Si todos dan instrucciones, nadie sabe qué vale.","Uma Instanz tem poder de dar instruções. Se todos dão instruções, ninguém sabe o que vale."],"Nach Funktionen: Einkauf, Lager, Verkauf, Verwaltung – Kleinere Betriebe gliedern ihre Aufgaben meist nach Funktionen: Einkauf – Lager – Verkauf – Verwaltung.":["ብFunktionen፦ Einkauf፣ Lager፣ Verkauf፣ Verwaltung – ንእሽተይ ትካላት ዕዮታቶም ብዙሕ ግዜ ብFunktionen ይከፋፍሉ፦ Einkauf – Lager (መኽዘን) – Verkauf (ሽያጥ) – Verwaltung።","По функциям: Einkauf, Lager, Verkauf, Verwaltung – Небольшие предприятия чаще всего делят задачи по функциям: Einkauf – Lager (склад) – Verkauf (продажи) – Verwaltung.","Por funciones: Einkauf, Lager, Verkauf, Verwaltung – Las empresas pequeñas suelen repartir sus tareas por funciones: Einkauf – Lager (almacén) – Verkauf (ventas) – Verwaltung.","Por funções: Einkauf, Lager, Verkauf, Verwaltung – As empresas pequenas costumam dividir as tarefas por funções: Einkauf – Lager (armazém) – Verkauf (vendas) – Verwaltung."],"richtig – Das Organigramm zeigt den Aufbau des Betriebs mit Stellen und Abteilungen.":["ቅኑዕ – Organigramm ኣወዳድባ ትካል ምስ ቦታታትን ክፍልታትን የርኢ።","верно – Организационная схема показывает структуру предприятия с должностями и отделами.","correcto – El organigrama muestra la estructura de la empresa con puestos y departamentos.","certo – O organigrama mostra a estrutura da empresa com postos e departamentos."],"Herr Petersen vermietet seine Garage an den Bäcker.":["Herr Petersen ጋራጁ ንእቲ ባኒ (Bäcker) ከራይ ይህብ።","Herr Petersen сдаёт свой гараж пекарю (Bäcker).","Herr Petersen alquila su garaje al panadero (Bäcker).","Herr Petersen aluga a sua garagem ao padeiro (Bäcker)."],"Herr Petersen stellt Boden zur Verfügung. Güterstrom vom Haushalt zum Unternehmen.":["Herr Petersen መሬት የቕርብ። ዋሕዚ ኣቕሑት ካብ ስድራቤት ናብ ትካል።","Herr Petersen предоставляет землю (Boden). Поток товаров от домохозяйства к предприятию.","Herr Petersen pone terreno (Boden) a disposición. Flujo de bienes del hogar a la empresa.","Herr Petersen disponibiliza terreno (Boden). Fluxo de bens do agregado familiar para a empresa."],"Frau Lindqvist zahlt ihr Geschenk mit Karte.":["Frau Lindqvist ሃብታ ብካርድ ትኸፍል።","Frau Lindqvist платит за подарок картой.","Frau Lindqvist paga su regalo con tarjeta.","Frau Lindqvist paga a sua prenda com cartão."],"Welche Tätigkeit kennzeichnet private Haushalte im einfachen Wirtschaftskreislauf?":["ኣየናይ ተግባር ንውልቃዊ ስድራቤታት ኣብ ቀሊል ዑደት ቁጠባ የለልዮም?","Какая деятельность характеризует частные домохозяйства в простом экономическом кругообороте?","¿Qué actividad caracteriza a los hogares privados en el circuito económico simple?","Que atividade caracteriza os agregados familiares privados no circuito económico simples?"],"Konsumgüter für den Markt herstellen":["ንብረት ፍጆታ ንዕዳጋ ምፍራይ","производить потребительские блага для рынка","fabricar bienes de consumo para el mercado","fabricar bens de consumo para o mercado"],"Konsumgüter am Markt nachfragen":["ንብረት ፍጆታ ኣብ ዕዳጋ ምጥላብ","спрашивать потребительские блага на рынке","demandar bienes de consumo en el mercado","procurar bens de consumo no mercado"],"Investitionsgüter am Markt anbieten":["ንብረት ወፃኢ ሃብቲ (Investitionsgüter) ኣብ ዕዳጋ ምቕራብ","предлагать инвестиционные блага (Investitionsgüter) на рынке","ofrecer bienes de inversión (Investitionsgüter) en el mercado","oferecer bens de investimento (Investitionsgüter) no mercado"],"Produktionsfaktoren am Markt nachfragen":["ዓቕምታት ፍርያት (Produktionsfaktoren) ኣብ ዕዳጋ ምጥላብ","спрашивать факторы производства (Produktionsfaktoren) на рынке","demandar factores de producción (Produktionsfaktoren) en el mercado","procurar fatores de produção (Produktionsfaktoren) no mercado"],"Private Haushalte fragen Konsumgüter nach und bieten ihre Arbeitskraft an. Herstellen und anbieten tun die Unternehmen.":["ውልቃዊ ስድራቤታት ንብረት ፍጆታ ይጠልቡ ሓይሊ ስራሖም ድማ የቕርቡ። ምፍራይን ምቕራብን ትካላት ይገብሩ።","Частные домохозяйства спрашивают потребительские блага и предлагают свою рабочую силу. Производят и предлагают предприятия.","Los hogares privados demandan bienes de consumo y ofrecen su fuerza de trabajo. Fabricar y ofrecer lo hacen las empresas.","Os agregados familiares privados procuram bens de consumo e oferecem a sua força de trabalho. Fabricar e oferecer fazem-no as empresas."],"Großhandel Nordfisch":["Großhandel Nordfisch (ዓቢ ዕዳጋ ዓሳ)","Großhandel Nordfisch (оптовик рыбы)","Großhandel Nordfisch (mayorista de pescado)","Großhandel Nordfisch (grossista de peixe)"],"kauft eine Dose":["ሓንቲ ቆርቆሮ ይገዝእ","покупает банку","compra una lata","compra uma lata"],"Fischkutter „Möwe“":["Fischkutter „Möwe“ (መርከብ ዓሳ)","Fischkutter «Möwe» (рыболовный катер)","Fischkutter «Möwe» (barco pesquero)","Fischkutter «Möwe» (barco de pesca)"],"fängt Heringe in der Nordsee":["ሄሪንግ ኣብ ባሕሪ ሰሜን የጽዕድ","ловит сельдь в Северном море","pesca arenques en el Mar del Norte","pesca arenques no Mar do Norte"],"Fischfabrik in Bremerhaven":["Fischfabrik ኣብ Bremerhaven (ፋብሪካ ዓሳ)","Fischfabrik в Бремерхафене (рыбная фабрика)","Fischfabrik en Bremerhaven (fábrica de pescado)","Fischfabrik em Bremerhaven (fábrica de peixe)"],"macht Heringsdosen":["ቆርቆሮ ሄሪንግ ይሰርሕ","делает консервы из сельди","hace conservas de arenque","faz conservas de arenque"],"stellt die Dosen ins Regal":["ቆርቆሮታት ኣብ መደርደሪ የቐምጥ","ставит банки на полку","pone las latas en el estante","coloca as latas na prateleira"],"Urproduktion · richtig: Fischkutter „Möwe“":["ቀዳማይ ምፍራይ · ቅኑዕ፦ Fischkutter „Möwe“ (መርከብ ዓሳ)","Добыча сырья · верно: Fischkutter «Möwe» (рыболовный катер)","Producción primaria · correcto: Fischkutter «Möwe» (barco pesquero)","Produção primária · certo: Fischkutter «Möwe» (barco de pesca)"],"Weiterverarbeitung · richtig: Fischfabrik in Bremerhaven":["ምስራሕ · ቅኑዕ፦ Fischfabrik ኣብ Bremerhaven (ፋብሪካ ዓሳ)","Переработка · верно: Fischfabrik в Бремерхафене (рыбная фабрика)","Transformación · correcto: Fischfabrik en Bremerhaven (fábrica de pescado)","Transformação · certo: Fischfabrik em Bremerhaven (fábrica de peixe)"],"Großhandel · richtig: Großhandel Nordfisch":["ዓቢ ዕዳጋ · ቅኑዕ፦ Großhandel Nordfisch (ዓቢ ዕዳጋ ዓሳ)","Оптовая торговля · верно: Großhandel Nordfisch (оптовик рыбы)","Comercio mayorista · correcto: Großhandel Nordfisch (mayorista de pescado)","Comércio grossista · certo: Großhandel Nordfisch (grossista de peixe)"],"Endverbraucher · richtig: Familie Yilmaz":["መወዳእታ ተጠቃሚ · ቅኑዕ፦ Familie Yilmaz","Конечный потребитель · верно: Familie Yilmaz","Consumidor final · correcto: Familie Yilmaz","Consumidor final · certo: Familie Yilmaz"],"Die Bäckerei Kruse backt jeden Morgen Brot und verkauft es im eigenen Laden. Zu welchem Sektor gehört sie?":["Bäckerei Kruse ነፍሲ ወከፍ ንግሆ እንጀራ ትጠብስ ኣብ ናታ ድኳን ድማ ትሸጦ። ናብ ኣየናይ ክፍሊ ትኣቱ?","Bäckerei Kruse каждое утро печёт хлеб и продаёт его в собственном магазине. К какому сектору она относится?","La Bäckerei Kruse hornea pan cada mañana y lo vende en su propia tienda. ¿A qué sector pertenece?","A Bäckerei Kruse coze pão todas as manhãs e vende-o na sua própria loja. A que setor pertence?"],"Zum tertiären Sektor – sie verkauft im eigenen Laden.":["ናብ ሳልሳይ ክፍሊ (tertiärer Sektor) – ኣብ ናታ ድኳን ትሸጥ።","К третичному сектору (tertiärer Sektor) – она продаёт в собственном магазине.","Al sector terciario (tertiärer Sektor) – vende en su propia tienda.","Ao setor terciário (tertiärer Sektor) – vende na sua própria loja."],"Zum primären Sektor – sie verwendet Mehl.":["ናብ ቀዳማይ ክፍሊ (primärer Sektor) – ሕርሲ ትጥቀም።","К первичному сектору (primärer Sektor) – она использует муку.","Al sector primario (primärer Sektor) – usa harina.","Ao setor primário (primärer Sektor) – usa farinha."],"Zum sekundären Sektor – aus Mehl wird Brot. Das ist Weiterverarbeitung.":["ናብ ካልኣይ ክፍሊ (sekundärer Sektor) – ካብ ሕርሲ እንጀራ ይኸውን። እዚ ምስራሕ (Weiterverarbeitung) እዩ።","К вторичному сектору (sekundärer Sektor) – из муки получается хлеб. Это переработка (Weiterverarbeitung).","Al sector secundario (sekundärer Sektor) – de la harina se hace pan. Esto es transformación (Weiterverarbeitung).","Ao setor secundário (sekundärer Sektor) – da farinha faz-se pão. Isto é transformação (Weiterverarbeitung)."],"Zu keinem Sektor.":["ናብ ዋላ ሓደ ክፍሊ ኣይኣቱን።","Ни к какому сектору.","A ningún sector.","A nenhum setor."],"Entscheidend ist die Hauptleistung: Aus Mehl wird Brot. Das ist Weiterverarbeitung. Der Verkauf im eigenen Laden ändert daran nichts.":["እቲ ወሳኒ ቀዳማይ ዕዮ እዩ፦ ካብ ሕርሲ እንጀራ ይኸውን። እዚ ምስራሕ (Weiterverarbeitung) እዩ። እቲ ሽያጥ ኣብ ናታ ድኳን እዚ ዋላ ሓንቲ ኣይቅይርን።","Решающим является основная деятельность: из муки получается хлеб. Это переработка (Weiterverarbeitung). Продажа в собственном магазине этого не меняет.","Lo decisivo es la actividad principal: de la harina se hace pan. Esto es transformación (Weiterverarbeitung). La venta en la propia tienda no cambia nada.","O decisivo é a atividade principal: da farinha faz-se pão. Isto é transformação (Weiterverarbeitung). A venda na própria loja não muda nada."],"Ihr seht, was die Stammkunden kaufen. Neue Kunden und neue Wünsche seht ihr nicht.":["እቶም ቀዋሚ ዓማዊል እንታይ ከም ዝገዝኡ ትርእዩ። ሓደስቲ ዓማዊልን ሓደስቲ ምድላያትን ኣይትርእዩን።","Вы видите, что покупают постоянные клиенты. Новых клиентов и новые желания вы не видите.","Veis lo que compran los clientes habituales. No veis a los clientes nuevos ni los deseos nuevos.","Veem o que compram os clientes habituais. Não veem os clientes novos nem os desejos novos."],"Die Begründung: „Kassenbons zeigen die Nachfrage: den Teil des Bedarfs, der wirklich gekauft wurde.“ Der Fachbegriff: Nachfrage.":["እቲ ምኽንያት፦ „ወረቐት ክፍሊት ጥላብ (Nachfrage) ከርእዩ፦ እቲ ብሓቂ ዝተገዝአ ክፋል ናይ Bedarf።“ እቲ ቴክኒካዊ ቃል፦ Nachfrage።","Обоснование: «Кассовые чеки показывают спрос (Nachfrage): ту часть Bedarf, которая реально была куплена.» Термин: Nachfrage.","La justificación: «Los tiques de caja muestran la demanda (Nachfrage): la parte del Bedarf que de verdad se compró.» El término técnico: Nachfrage.","A justificação: «Os talões de caixa mostram a procura (Nachfrage): a parte do Bedarf que realmente foi comprada.» O termo técnico: Nachfrage."],"Welches Beispiel beschreibt ein Existenzbedürfnis?":["ኣየናይ ኣብነት ድሌት ህላወ (Existenzbedürfnis) የርኢ?","Какой пример описывает жизненную потребность (Existenzbedürfnis)?","¿Qué ejemplo describe una necesidad básica (Existenzbedürfnis)?","Que exemplo descreve uma necessidade básica (Existenzbedürfnis)?"],"Ein Azubi möchte ein neues Smartphone.":["ሓደ ተማሃራይ ሙያ ሓድሽ ስማርትፎን ይደሊ።","Стажёр хочет новый смартфон.","Un aprendiz quiere un smartphone nuevo.","Um aprendiz quer um smartphone novo."],"Ein Obdachloser sucht im Winter einen warmen Schlafplatz.":["ሓደ ዘይብሉ ሰብ ኣብ ክረምቲ ሙቕ ዝበለ ቦታ መድቃሲ ይደሊ።","Бездомный зимой ищет тёплое место для ночлега.","Un indigente busca en invierno un lugar cálido donde dormir.","Um sem-abrigo procura no inverno um lugar quente para dormir."],"Eine Familie plant eine Ferienreise.":["ሓንቲ ስድራቤት ጉዕዞ ዕረፍቲ ትመድብ።","Семья планирует отпускную поездку.","Una familia planea un viaje de vacaciones.","Uma família planeia uma viagem de férias."],"Eine Kundin wünscht sich eine Designerhandtasche.":["ሓንቲ ዓሚላይ ዲዛይነር ሻንጣ ትደሊ።","Покупательница мечтает о дизайнерской сумке.","Una clienta desea un bolso de diseñador.","Uma cliente deseja uma mala de designer."],"Existenzbedürfnisse sind lebensnotwendig: Hunger, Durst, Schutz vor Kälte.":["ድሌታት ህላወ ንህይወት ኣገደስቲ እዮም፦ ጥሜት፣ ጽሜ፣ ሓለዋ ካብ ቁሪ።","Жизненные потребности необходимы для жизни: голод, жажда, защита от холода.","Las necesidades básicas son vitales: hambre, sed, protección contra el frío.","As necessidades básicas são vitais: fome, sede, proteção contra o frio."],"Kroll schnaubt. Herr Petersen kauft weiter bei euch.":["Kroll ይጸሕቅ። Herr Petersen ከምቲ ዝነበረ ኣባኹም ይገዝእ።","Kroll фыркает. Herr Petersen продолжает покупать у вас.","Kroll resopla. Herr Petersen sigue comprando con vosotros.","Kroll bufa. Herr Petersen continua a comprar convosco."],"Alle geben Gas. Am Abend habt ihr viele Kunden bedient.":["ኩሎም ይፍትኑ። ኣብ ምሸት ብዙሓት ዓማዊል ኣገልጊልኩም።","Все выкладываются. К вечеру вы обслужили много клиентов.","Todos dan lo máximo. Por la noche habéis atendido a muchos clientes.","Todos dão o máximo. À noite atenderam muitos clientes."],"Warum ist „mit möglichst wenig Mitteln einen möglichst großen Nutzen erzielen“ unsinnig?":["ስለምንታይ „ብዝተሓተ መሳርሒ ዝዓበየ ረብሓ ምርካብ“ ዘይምልኩዕ እዩ?","Почему «достичь наибольшей пользы при наименьших средствах» бессмысленно?","¿Por qué carece de sentido «conseguir el mayor beneficio con los menores medios»?","Porque é que «obter o maior benefício com os menores meios» não faz sentido?"],"Weil man Nutzen nicht messen kann.":["ምኽንያቱ ረብሓ ክስፈር ኣይክእልን።","Потому что пользу нельзя измерить.","Porque el beneficio no se puede medir.","Porque o benefício não se pode medir."],"Es ist nicht unsinnig – das ist das Maximalprinzip.":["ዘይምልኩዕ ኣይኮነን — እዚ Maximalprinzip እዩ።","Это не бессмысленно — это принцип максимума (Maximalprinzip).","No carece de sentido: es el principio de máximo (Maximalprinzip).","Faz sentido — é o princípio do máximo (Maximalprinzip)."],"Weil nichts feststeht – eine Größe muss immer feststehen.":["ምኽንያቱ ዋላ ሓንቲ ኣይጸንዐን – ሓደ መጠን ኩሉ ግዜ ክጸንሕ ኣለዎ።","Потому что ничего не задано – одна величина всегда должна быть задана.","Porque no hay nada fijo – una magnitud siempre tiene que estar fija.","Porque nada está fixo – uma grandeza tem de estar sempre fixa."],"Weil nur der Staat so handeln darf.":["ምኽንያቱ እቲ መንግስቲ ጥራይ ከምኡ ክሰርሕ ይኽእል።","Потому что так вправе действовать только государство.","Porque solo el Estado puede actuar así.","Porque só o Estado pode agir assim."],"Man kann nicht gleichzeitig die Mittel gegen null senken und den Nutzen unendlich steigern. Eine Größe muss festliegen.":["ብሓደ እዋን መሳርሒ ናብ ዋላ ሓንቲ ምቕናስን ረብሓ ናብ ዘይውዳእ ምዕባይን ኣይከኣልን። ሓደ መጠን ክጸንሕ ኣለዎ።","Нельзя одновременно снижать средства до нуля и повышать пользу до бесконечности. Одна величина должна быть задана.","No se puede reducir los medios a cero y aumentar el beneficio hasta el infinito a la vez. Una magnitud tiene que ser fija.","Não se pode ao mesmo tempo reduzir os meios a zero e aumentar o benefício até ao infinito. Uma grandeza tem de estar fixa."],"Am Samstag ist Hafenfest. Ihr habt einen Stand auf dem Markt. Viele Händler verkaufen dort Erdbeeren. Die Tabelle zeigt, wie viel alle zusammen bei jedem Preis anbieten und wie viel die Besucher kaufen wollen.":["ቀዳም ፌስቲቫል ወደብ (Hafenfest) እዩ። ኣብ ዕዳጋ ደሞ ኣለኩም። ብዙሓት ነጋዶ ኣብኡ እንጆይ ይሸጡ። እቲ ሰንጠረዥ ኩሎም ብሓባር ብኽሊ ዋጋ ክንደይ ከም ዘቕርቡ ጎብኛትን ክንደይ ክገዝኡ ከም ዝደልዩ የርኢ።","В субботу праздник порта (Hafenfest). У вас есть стенд на рынке. Многие торговцы продают там клубнику. Таблица показывает, сколько все вместе предлагают при каждой цене и сколько посетители хотят купить.","El sábado es la fiesta del puerto (Hafenfest). Tenéis un puesto en el mercado. Muchos comerciantes venden allí fresas. La tabla muestra cuánto ofrecen todos juntos a cada precio y cuánto quieren comprar los visitantes.","No sábado é a festa do porto (Hafenfest). Têm uma banca no mercado. Muitos comerciantes vendem lá morangos. A tabela mostra quanto todos oferecem em conjunto a cada preço e quanto os visitantes querem comprar."],"Erdbeeren auf dem Hafenfest-Markt":["እንጆይ ኣብ ዕዳጋ ፌስቲቫል ወደብ","Клубника на рынке праздника порта","Fresas en el mercado de la fiesta del puerto","Morangos no mercado da festa do porto"],"Preis (€ je kg)":["ዋጋ (€ ንኪሎ)","Цена (€ за кг)","Precio (€ por kg)","Preço (€ por kg)"],"§ € je kg":["§ € ንኪሎ","§ € за кг","§ € por kg","§ € por kg"],"Am Abend ist alles verkauft. Niemand geht leer aus.":["ኣብ ምሸት ኩሉ ተሸይጡ። ዋላ ሓደ ባዶ ኢዱ ኣይኸይድን።","К вечеру всё продано. Никто не уходит с пустыми руками.","Por la noche todo está vendido. Nadie se va con las manos vacías.","À noite está tudo vendido. Ninguém vai de mãos vazias."],"Ein Unwetter zerstört einen Teil der Erdbeerernte. Was passiert?":[" что-то новое.","Los comerciantes simplemente quieren probar algo nuevo.","Os comerciantes simplesmente querem experimentar algo novo."],"Die Kunden wollen nicht immer die gleiche Ware sehen.":["እቶም ዓማዊል ኩሉ ግዜ ማዕረ ኣቕሓ ክርእዩ ኣይደልዩን።","Клиенты не хотят всё время видеть один и тот же товар.","Los clientes no quieren ver siempre la misma mercancía.","Os clientes não querem ver sempre a mesma mercadoria."],"Die Händler wollen Steuern sparen.":["እቶም ነጋዶ ቀረጽ ክቕንሱ ይደልዩ።","Торговцы хотят экономить налоги.","Los comerciantes quieren ahorrar impuestos.","Os comerciantes querem poupar impostos."],"„Ich kaufe euer Lager leer. Dann habt ihr Platz und Geld. Bestellt einfach erst, wenn ein Kunde fragt.“":["„ኣነ መኽዘንኩም ባዶ ክገብር እየ። ሽዑ ቦታን ገንዘብን ይህልወኩም። ኣዝዙ ዓሚል ምስ ሓተተ ጥራይ።“","„Я скуплю весь ваш склад. Тогда у вас будут и место, и деньги. Просто заказывайте, только когда клиент спросит.“","„Os dejo el almacén vacío comprándolo todo. Así tendréis sitio y dinero. Pedid solo cuando un cliente pregunte.“","„Vou comprar o vosso armazém todo. Assim ficam com espaço e dinheiro. Encomendem só quando um cliente perguntar.“"],"Ablehnen, weil ein Lager immer randvoll sein muss.":["ኣይፋል በሉ፣ ምኽንያቱ መኽዘን ኩሉ ግዜ መሊኡ ክህሉ ኣለዎ።","Отказаться, потому что склад всегда должен быть забит до краёв.","Rechazar, porque un almacén siempre tiene que estar lleno hasta arriba.","Recusar, porque um armazém tem de estar sempre a abarrotar."],"Annehmen. Ein leeres Lager kostet nichts.":["ተቐበሉ። ባዶ መኽዘን ዋላ ሓንቲ ኣይከፍልን።","Принять. Пустой склад ничего не стоит.","Aceptar. Un almacén vacío no cuesta nada.","Aceitar. Um armazém vazio não custa nada."],"Ablehnen, weil wir Waren vorrätig halten müssen, bis die Kunden sie brauchen.":["ኣይፋል በሉ፣ ምኽንያቱ ኣቕሑት ክሳብ ዓማዊል ዝደልይዋ ከነዕቅብ ኣለና።","Отказаться, потому что мы должны держать товары в наличии, пока клиентам они нужны.","Rechazar, porque tenemos que tener la mercancía en stock hasta que los clientes la necesiten.","Recusar, porque temos de ter a mercadoria em stock até os clientes precisarem dela."],"Eure Regale bleiben voll. Die Kunden finden, was sie suchen.":["መደርደሪኩም ምሉእ ይጸንሕ። እቶም ዓማዊል እቲ ዝደልይዎ ይረኽቡ።","Ваши стеллажи остаются полными. Клиенты находят то, что ищут.","Vuestras estanterías siguen llenas. Los clientes encuentran lo que buscan.","As vossas prateleiras continuam cheias. Os clientes encontram o que procuram."],"Zeitüberbrückung (Lagerhaltung) ist eine Aufgabe des Einzelhandels: Waren vorrätig halten, bis die Kunden sie brauchen.":["Zeitüberbrückung (Lagerhaltung) ዕዮ ንእሽተይ ዕዳጋ እዩ፦ ኣቕሑት ክሳብ ዓማዊል ዝደልይዋ ምዕቃብ።","Zeitüberbrückung (Lagerhaltung) — задача розничной торговли: держать товары в наличии, пока они нужны клиентам.","La Zeitüberbrückung (Lagerhaltung) es una tarea del comercio minorista: tener la mercancía en stock hasta que los clientes la necesitan.","A Zeitüberbrückung (Lagerhaltung) é uma tarefa do comércio a retalho: ter a mercadoria em stock até os clientes precisarem dela."],"Ihr habt eine besondere Ware bekommen: frischen Fisch und offenen Käse von der Küste. Jetzt müsst ihr entscheiden, wie ihr sie verkauft.":["ፍሉይ ኣቕሓ ረኺብኩም፦ ሓድሽ ዓሳን ክፉት ኬዝን ካብ ገምገም ባሕሪ። ሕጂ ከመይ ክትሽጡ ከም ዘለኩም ክትውስኑ ኣለኩም።","Вы получили особый товар: свежую рыбу и сыр на развес с побережья. Теперь вы должны решить, как их продавать.","Habéis recibido una mercancía especial: pescado fresco y queso suelto de la costa. Ahora tenéis que decidir cómo venderlos.","Receberam uma mercadoria especial: peixe fresco e queijo a granel da costa. Agora têm de decidir como os vender."],"Die Kunden lassen sich beraten. Nichts verschwindet.":["እቶም ዓማዊል ምኽሪ ይቕበሉ። ዋላ ሓንቲ ኣይጠፍእን።","Клиенты получают консультацию. Ничего не пропадает.","Los clientes se dejan asesorar. No desaparece nada.","Os clientes deixam-se aconselhar. Nada desaparece."],"Offene Lebensmittel brauchen Hygiene.":["ክፉት መግቢ ጽሬት የድልዮ።","Открытым продуктам нужна гигиена.","Los alimentos sueltos necesitan higiene.","Os alimentos a granel precisam de higiene."],"Offener Fisch und Käse brauchen Hygiene.":["ክፉት ዓሳን ኬዝን ጽሬት
