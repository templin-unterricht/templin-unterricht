jacke (gabardina)"],"Sorte · richtig: Marke Y, Gr. M, gelb":["Sorte (ዓይነት) · ቅኑዕ፦ Marke Y, Gr. M፣ ቢጫ","Sorte (сорт) · верно: Марка Y, разм. M, жёлтый","Sorte (variedad) · correcto: Marca Y, talla M, amarillo","Sorte (variedade) · certo: Marca Y, tam. M, amarelo"],"Die Sortimentspyramide":["Sortimentspyramide (ፒራሚድ ምርጫ ኣቕሑት)","Пирамида ассортимента (Sortimentspyramide)","La pirámide del surtido (Sortimentspyramide)","A pirâmide do sortimento (Sortimentspyramide)"],"Von oben nach unten: Warensortiment – Warenbereich – Warenart – Warengruppe – Artikelgruppe – Artikel – Sorte. Die Sorte ist genau dieses eine Produkt (Marke, Größe, Verpackung).":["ካብ ላዕሊ ናብ ታሕቲ፦ Warensortiment – Warenbereich (ቦታ ኣቕሑት) – Warenart (ዓይነት ኣቕሓ) – Warengruppe (ጉጅለ ኣቕሑት) – Artikelgruppe (ጉጅለ ኣርቲክል) – Artikel (ኣርቲክል) – Sorte። እቲ Sorte ብትክክል እዚ ሓደ ምህርቲ እዩ (ማርካ፣ ዓቕሚ፣ ኣቕሓ ማዕጾ)።","Сверху вниз: Warensortiment – Warenbereich (товарная область) – Warenart (вид товара) – Warengruppe (товарная группа) – Artikelgruppe (группа артикулов) – Artikel (артикул) – Sorte. Sorte — это именно один этот продукт (марка, размер, упаковка).","De arriba abajo: Warensortiment – Warenbereich (área de mercancías) – Warenart (tipo de mercancía) – Warengruppe (grupo de mercancías) – Artikelgruppe (grupo de artículos) – Artikel (artículo) – Sorte. La Sorte es exactamente este único producto (marca, tamaño, envase).","De cima para baixo: Warensortiment – Warenbereich (área de mercadorias) – Warenart (tipo de mercadoria) – Warengruppe (grupo de mercadorias) – Artikelgruppe (grupo de artigos) – Artikel (artigo) – Sorte. A Sorte é exatamente este único produto (marca, tamanho, embalagem)."],"Kernsortiment: Sortiment mit ständiger Verkaufsbereitschaft zur Sicherung des Hauptumsatzes.":["Kernsortiment፦ ምርጫ ኣቕሑት ዘለዎ ኩሉ ግዜ ንሽያጥ ድሉው፣ ንቀዳማይ ሽያጥ ምሕላው።","Kernsortiment: Ассортимент с постоянной готовностью к продаже для обеспечения основного оборота.","Kernsortiment: Surtido con disponibilidad permanente para la venta que asegura la mayor parte de las ventas.","Kernsortiment: Sortimento sempre disponível para venda, que garante a maior parte do volume de vendas."],"Woche § · Modul § · Standort und Betriebsformen":["ሰሙን § · ሞዱል § · ቦታን ዓይነታት ድኳንን (Standort und Betriebsformen)","Неделя § · Модуль § · Местоположение и формы предприятий (Standort und Betriebsformen)","Semana § · Módulo § · Ubicación y formas comerciales (Standort und Betriebsformen)","Semana § · Módulo § · Localização e formas de comércio (Standort und Betriebsformen)"],"Online bestellen?":["ብኦንላይን ምዝዛም?","Заказывать онлайн?","¿Pedir online?","Encomendar online?"],"Immer mehr Kunden kaufen online. Mia fragt: „Kann ich bei euch auch im Internet bestellen?“":["ዝያዳ ዓማዊል ብኦንላይን ይገዝኡ። Mia ትሓትት፦ „ኣብ ኢንተርነት እውን ኣብ ድኳንኩም ክዝዝም ይኽእል ድየ?“","Всё больше клиентов покупают онлайн. Mia спрашивает: «Можно ли у вас заказывать и через интернет?»","Cada vez más clientes compran online. Mia pregunta: «¿Se puede pedir también por internet en vuestra tienda?»","Cada vez mais clientes compram online. Mia pergunta: «Posso encomendar também pela internet na vossa loja?»"],"„Ich hatte mal einen Laden im Gewerbegebiet. Da kamen nur die Möwen.“":["„ሓንሳብ ኣብ ዞባ ኢንዱስትሪ ድኳን ነይሩኒ። ኣብኡ ጋይላታት ጥራይ መጽኡ።“","„Когда-то у меня был магазин в промышленной зоне. Туда приходили только чайки.“","„Una vez tuve una tienda en el polígono industrial. Allí solo venían las gaviotas.“","„Uma vez tive uma loja na zona industrial. Lá só vinham as gaivotas.“"],"Was bietet ihr an?":["እንታይ ትህቡ?","Что вы предлагаете?","¿Qué ofrecéis?","O que oferecem?"],"Click & Collect: online bestellen, im Geschäft abholen. Versandhandel: Die Ware wird geliefert. Neue Formen entstehen, weil Kunden ihr Kaufverhalten ändern.":["Click & Collect፦ ኦንላይን ኣዝዙ፣ ኣብ ድኳን ተቐበሉ። Versandhandel (ዕዳጋ ብፖስታ)፦ እቲ ኣቕሓ ይምጻእ። ሓደስቲ ቅርጽታት ይፍጠሩ፣ ምኽንያቱ ዓማዊል ኣገዛዝኣኦም ይቅይሩ።","Click & Collect: заказать онлайн, забрать в магазине. Versandhandel (посылочная торговля): Товар доставляют. Возникают новые формы, потому что клиенты меняют своё покупательское поведение.","Click & Collect: pedir online y recoger en la tienda. Versandhandel (venta por envío): La mercancía se entrega. Surgen formas nuevas porque los clientes cambian su comportamiento de compra.","Click & Collect: encomendar online e levantar na loja. Versandhandel (venda por envio): A mercadoria é entregue. Surgem formas novas porque os clientes mudam o seu comportamento de compra."],"Click & Collect: online oder telefonisch bestellen, im Laden abholen":["Click & Collect፦ ብኦንላይን ወይ ብተሌፎን ኣዝዙ፣ ኣብ ድኳን ተቐበሉ","Click & Collect: заказать онлайн или по телефону, забрать в магазине","Click & Collect: pedir online o por teléfono y recoger en la tienda","Click & Collect: encomendar online ou por telefone e levantar na loja"],"Ihr lasst alles, wie es ist. Online ist nur eine Mode.":["ኩሉ ከምቲ ዘሎ ትገድፉ። ኦንላይን ሞዳ ጥራይ እዩ።","Вы оставляете всё как есть. Онлайн — это просто мода.","Dejáis todo como está. Lo online es solo una moda.","Deixam tudo como está. O online é só uma moda."],"Einen eigenen Onlineshop mit Versand nach Hause":["ናትኩም ባዕላዊ ኦንላይን ሾፕ ምስ ምልኣኽ ናብ ገዛ","Собственный интернет-магазин с доставкой на дом","Una tienda online propia con envío a casa","Uma loja online própria com envio para casa"],"Mega! Da komme ich gern mit dem Rad vorbei.":["ብሉጽ! ብፍቕሪ ብብሽክለታ ክሓልፍ እየ።","Супер! Я охотно загляну на велосипеде.","¡Genial! Pasaré encantada en bici.","Ótimo! Passo de bom grado de bicicleta."],"Mia bestellt in der Pause und holt am Abend ab.":["Mia ኣብ ዕረፍቲ ተዘንግዕ ድሕሪ ቀትሪ ድማ ትወስድ።","Mia заказывает в перерыве и забирает вечером.","Mia pide en el descanso y recoge por la tarde.","Mia encomenda no intervalo e levanta ao fim do dia."],"Click & Collect: Der Kunde bestellt online oder telefonisch und holt die Ware im Geschäft ab.":["Click & Collect፦ እቲ ዓሚል ኦንላይን ወይ ብተሌፎን የዝዝም ኣቕሓ ድማ ኣብ ድኳን ይወስድ።","Click & Collect: Клиент заказывает онлайн или по телефону и забирает товар в магазине.","Click & Collect: El cliente pide online o por teléfono y recoge la mercancía en la tienda.","Click & Collect: O cliente encomenda online ou por telefone e levanta a mercadoria na loja."],"Neue Betriebsformen entstehen, weil Kunden ihre Erwartungen und ihr Kaufverhalten ändern.":["ሓደስቲ Betriebsformen (ዓይነታት ድኳን) ይፍጠሩ፣ ምኽንያቱ ዓማዊል ትጽቢቶምን ኣገዛዝኣኦምን ይቅይሩ።","Новые Betriebsformen (формы предприятий) возникают, потому что клиенты меняют свои ожидания и покупательское поведение.","Surgen nuevas Betriebsformen (formas comerciales) porque los clientes cambian sus expectativas y su comportamiento de compra.","Surgem novas Betriebsformen (formas de comércio) porque os clientes mudam as suas expectativas e o seu comportamento de compra."],"Der Onlinehandel ist eine Form des Versandhandels.":["ኦንላይን ዕዳጋ ሓደ ዓይነት Versandhandel እዩ።","Онлайн-торговля — одна из форм посылочной торговли (Versandhandel).","El comercio online es una forma de venta por envío (Versandhandel).","O comércio online é uma forma de venda por envio (Versandhandel)."],"Kaufverhalten nicht beachtet":["ኣገዛዝኣ ዓማዊል ኣይተገብረን","Покупательское поведение не учтено","No se tuvo en cuenta el comportamiento de compra","Comportamento de compra não considerado"],"Versandhandel (Onlinehandel)":["Versandhandel (ኦንላይን ዕዳጋ)","Versandhandel (онлайн-торговля)","Versandhandel (comercio online)","Versandhandel (comércio online)"],"Nähe zu Kunden, Verkehrsanbindung, Parkplätze, Kosten (Miete), Konkurrenz. Innenstadt: Fachgeschäft, Warenhaus. Stadtrand: Fachmarkt, Verbrauchermarkt.":["ቅሩብነት ናብ ዓማዊል፣ መገዲ፣ መዕቆቢ መካይን፣ ወጻኢ (ክራይ)፣ ተወዳዳሪ። ማእከል ከተማ፦ Fachgeschäft፣ Warenhaus። ወጻኢ ከተማ፦ Fachmarkt፣ Verbrauchermarkt።","Близость к клиентам, транспортная доступность, парковки, расходы (аренда), конкуренция. Центр города: Fachgeschäft, Warenhaus. Окраина города: Fachmarkt, Verbrauchermarkt.","Cercanía a los clientes, acceso por carretera, aparcamientos, costes (alquiler), competencia. Centro de la ciudad: Fachgeschäft, Warenhaus. Afueras: Fachmarkt, Verbrauchermarkt.","Proximidade dos clientes, ligação rodoviária, estacionamento, custos (renda), concorrência. Centro da cidade: Fachgeschäft, Warenhaus. Arredores: Fachmarkt, Verbrauchermarkt."],"Für ein Warenhaus in der Innenstadt spielt die hervorragende Erreichbarkeit für Kunden die wichtigste Rolle.":["ንሓደ Warenhaus ኣብ ማእከል ከተማ እቲ ጽቡቕ ምብጻሕ ንዓማዊል እቲ ዝዓበየ ግደ ይጻወት።","Для универмага (Warenhaus) в центре города самую важную роль играет отличная доступность для клиентов.","Para un Warenhaus (grandes almacenes) en el centro, lo más importante es la excelente accesibilidad para los clientes.","Para um Warenhaus (armazém) no centro da cidade, o mais importante é a excelente acessibilidade para os clientes."],"Die Begründung: „Click & Collect: Der Kunde bestellt online oder telefonisch und holt die Ware im Geschäft ab.“ Der Fachbegriff: Click & Collect.":["እቲ ምኽንያት፦ „Click & Collect፦ እቲ ዓሚል ኦንላይን ወይ ብተሌፎን የዝዝም ኣቕሓ ድማ ኣብ ድኳን ይወስድ።“ እቲ ቴክኒካዊ ቃል፦ Click & Collect።","Обоснование: «Click & Collect: клиент заказывает онлайн или по телефону и забирает товар в магазине.» Термин: Click & Collect.","La justificación: «Click & Collect: el cliente pide online o por teléfono y recoge la mercancía en la tienda.» El término técnico: Click & Collect.","A justificação: «Click & Collect: o cliente encomenda online ou por telefone e levanta a mercadoria na loja.» O termo técnico: Click & Collect."],"„Ich habe Jeans mit dem Logo einer berühmten Marke. Nachgemacht natürlich. Spottbillig!“":["„ጅንስ ምስ ምልክት ሓደ ፍሉጥ ማርካ ኣለኒ። ሓሰውቲ ምዕባይ ከም ዝኾነ ርግጽ። ኣዝዩ ርካሽ!“","„У меня есть джинсы с логотипом известной марки. Подделка, конечно. Дёшево до смешного!“","„Tengo vaqueros con el logotipo de una marca famosa. Imitados, claro. ¡Tirados de precio!“","„Tenho calças de ganga com o logótipo de uma marca famosa. Imitação, claro. Baratíssimo!“"],"Annehmen. Die Kunden merken das nicht.":["ተቐበሉ። እቶም ዓማዊል ኣይየስተውዕልዎን።","Принять. Клиенты этого не заметят.","Aceptar. Los clientes no lo notan.","Aceitar. Os clientes não notam."],"Ablehnen, weil Fälschungen verboten sind. Für günstige Ware machen wir lieber eine eigene Handelsmarke.":["ኣይፋል በሉ፣ ምኽንያቱ ሓሰውቲ ምዕባይ ክልኩል እዩ። ንርካሽ ኣቕሓ ባዕልና Handelsmarke ንሰርሕ።","Отказаться, потому что подделки запрещены. Для дешёвого товара мы лучше сделаем собственную Handelsmarke.","Rechazar, porque las falsificaciones están prohibidas. Para mercancía barata preferimos hacer una Handelsmarke propia.","Recusar, porque as falsificações são proibidas. Para mercadoria barata preferimos fazer uma Handelsmarke própria."],"Ablehnen, weil Markenartikel sowieso schlecht sind.":["ኣይፋል በሉ፣ ምኽንያቱ Markenartikel ብሓቂ ሕማቕ እዮም።","Отказаться, потому что брендовые товары всё равно плохие.","Rechazar, porque los artículos de marca son malos de todos modos.","Recusar, porque os artigos de marca são maus de qualquer maneira."],"Kroll zieht ab. Eure Handelsmarke-Idee gefällt Frau Ahlers.":["Kroll ይኸይድ። እቲ ሓሳብ ናይ ባዕላዊ Handelsmarke ንFrau Ahlers ይሰማማዓ።","Kroll уходит. Идея собственной Handelsmarke нравится Frau Ahlers.","Kroll se marcha. La idea de una Handelsmarke propia le gusta a Frau Ahlers.","Kroll vai-se embora. A ideia de uma Handelsmarke própria agrada a Frau Ahlers."],"Fälschungen sind verboten. Eine Handelsmarke trägt den Namen des Händlers und ist meist günstiger.":["ሓሰውቲ ምዕባይ ኣቕሑት ክልኩል እዩ። Handelsmarke ስም ናይ ነጋዳይ ትትሕዝ ብዙሕ ግዜ ድማ ርካሽ እያ።","Подделки запрещены. Handelsmarke носит имя торговца и чаще всего дешевле.","Las falsificaciones están prohibidas. Una Handelsmarke lleva el nombre del comerciante y suele ser más barata.","As falsificações são proibidas. Uma Handelsmarke tem o nome do comerciante e costuma ser mais barata."],"Woche § · Modul § · Verkaufsformen":["ሰሙን § · ሞዱል § · ኣገባባት ሽያጥ (Verkaufsformen)","Неделя § · Модуль § · Формы продажи (Verkaufsformen)","Semana § · Módulo § · Formas de venta (Verkaufsformen)","Semana § · Módulo § · Formas de venda (Verkaufsformen)"],"Das Highlight-Regal":["እቲ መደርደሪ ፍሉይ (Highlight)","Стеллаж-хит (Highlight-Regal)","La estantería estrella (Highlight-Regal)","A prateleira de destaque (Highlight-Regal)"],"Standortfaktoren":["Standortfaktoren (ኩነታት ቦታ)","Факторы местоположения (Standortfaktoren)","Factores de ubicación (Standortfaktoren)","Fatores de localização (Standortfaktoren)"],"Ihr habt eine besondere Ware bekommen: Silberschmuck mit Anker-Motiv, ab § €. Jetzt müsst ihr entscheiden, wie ihr sie verkauft.":["ፍሉይ ኣቕሓ ረኺብኩም፦ ጌጥ ብሩር ምስ ስእሊ መልሕቕ፣ ካብ § €። ሕጂ ከመይ ክትሽጡ ከም ዘለኩም ክትውስኑ ኣለኩም።","Вы получили особый товар: серебряные украшения с мотивом якоря, от § €. Теперь вы должны решить, как их продавать.","Habéis recibido una mercancía especial: joyas de plata con motivo de ancla, desde § €. Ahora tenéis que decidir cómo venderlos.","Receberam uma mercadoria especial: joias de prata com motivo de âncora, a partir de § €. Agora têm de decidir como os vender."],"„Die teuren Uhren lagen bei mir immer in der Vitrine. Nicht mal Kalle kam da ran.“":["„እተን ክቡራት ሰዓታት ኩሉ ግዜ ኣብ ቪትሪን ነይረን። Kalle እውን ኣብኡ ኣይበጽሐን።“","„Дорогие часы у меня всегда лежали в витрине. Даже Kalle туда не добирался.“","„Los relojes caros siempre estaban en la vitrina. Ni Kalle llegaba hasta allí.“","„Os relógios caros estavam sempre na vitrina. Nem o Kalle lá chegava.“"],"Welche Verkaufsform wählt ihr für diese Ware?":["ኣየናይ ኣገባብ ሽያጥ ንዚ ኣቕሓ ትመርጹ?","Какую форму продажи вы выберете для этого товара?","¿Qué forma de venta elegís para esta mercancía?","Que forma de venda escolhem para esta mercadoria?"],"Bedienung: teure, erklärungsbedürftige oder diebstahlgefährdete Ware, Hygiene. Vorwahl: Kunde schaut selbst, Beratung bei Bedarf. Selbstbedienung: einfache Ware für jeden Tag.":["Bedienung (ኣገልግሎት ብሰራሕተኛ)፦ ክቡር፣ ምግላጽ ዘድልዮ ወይ ብስርቂ ዝተጋልጸ ኣቕሓ፣ ጽሬት። Vorwahl (ቅድሚ ምምራጽ)፦ እቲ ዓሚል ባዕሉ ይርኢ፣ ምኽሪ ኣብ እዋን ድሌት። Selbstbedienung (ባዕል ኣገልግሎት)፦ ቀሊል ኣቕሓ ንዕለታዊ።","Bedienung (обслуживание продавцом): дорогие товары, требующие объяснений, или товары с риском кражи, гигиена. Vorwahl (предварительный выбор): Клиент смотрит сам, консультация при необходимости. Selbstbedienung (самообслуживание): простые товары на каждый день.","Bedienung (atención personalizada): mercancía cara, que necesita explicación o con riesgo de robo; higiene. Vorwahl (preselección): El cliente mira por sí mismo, asesoramiento si hace falta. Selbstbedienung (autoservicio): mercancía sencilla de todos los días.","Bedienung (atendimento ao balcão): mercadoria cara, que precisa de explicação ou com risco de furto; higiene. Vorwahl (pré-seleção): O cliente vê por si, aconselhamento quando necessário. Selbstbedienung (self-service): mercadoria simples do dia a dia."],"Bedienung: Die Ware liegt hinter der Theke oder in der Vitrine. Ihr legt sie vor und beratet.":["Bedienung (ኣገልግሎት ብሰራሕተኛ)፦ እቲ ኣቕሓ ድሕሪ ጠረጴዛ ወይ ኣብ ቪትሪን እዩ። ኣቕርቡዎም ትመኽሩ።","Bedienung (обслуживание продавцом): Товар лежит за прилавком или в витрине. Вы подаёте его и консультируете.","Bedienung (atención personalizada): La mercancía está detrás del mostrador o en la vitrina. Los mostráis y asesoráis.","Bedienung (atendimento ao balcão): A mercadoria está atrás do balcão ou na vitrina. Apresentam e aconselham."],"Vorwahl: Die Ware liegt offen im Regal. Die Kunden schauen selbst, ihr beratet auf Wunsch.":["Vorwahl (ቅድሚ ምምራጽ)፦ እቲ ኣቕሓ ክፉት ኣብ መደርደሪ ይርከብ። እቶም ዓማዊል ባዕሎም ይርኢ፣ ንስኻትኩም ብድሌት ትመኽሩ።","Vorwahl (предварительный выбор): Товар лежит открыто на полке. Клиенты смотрят сами, вы консультируете по желанию.","Vorwahl (preselección): La mercancía está a la vista en la estantería. Los clientes miran por sí mismos, vosotros asesoráis si se pide.","Vorwahl (pré-seleção): A mercadoria está à vista na prateleira. Os clientes veem por si, vocês aconselham se for pedido."],"Selbstbedienung: Die Kunden nehmen die Ware selbst und zahlen an der Kasse.":["Selbstbedienung (ባዕል ኣገልግሎት)፦ እቶም ዓማዊል ባዕሎም ኣቕሓ ይወስዱ ኣብ ሳጹን ድማ ይኸፍሉ።","Selbstbedienung (самообслуживание): Клиенты сами берут товар и платят на кассе.","Selbstbedienung (autoservicio): Los clientes cogen la mercancía ellos mismos y pagan en la caja.","Selbstbedienung (self-service): Os clientes pegam a mercadoria e pagam na caixa."],"Die Kunden schauen in Ruhe. Aber zwei Ketten sind am Abend weg.":["እቶም ዓማዊል ብሰላም ይርእዩ። ግን ክልተ ሰንሰለት ኣብ ምሸት ይጠፍኡ።","Клиенты спокойно смотрят. Но две цепочки к вечеру пропадают.","Los clientes miran con calma. Pero dos cadenas desaparecen por la noche.","Os clientes veem com calma. Mas duas correntes desaparecem à noite."],"Schmuck ist hochwertig und diebstahlgefährdet.":["ጌጥ ልዑል ዋጋ ዘለዎን ብስርቂ ዝተጋለጸን እዩ።","Украшения высокого качества и подвержены кражам.","Las joyas son valiosas y tienen riesgo de robo.","As joias são valiosas e têm risco de furto."],"Bei Selbstbedienung verzichtet der Betrieb auf Fachberatung.":["ኣብ Selbstbedienung እቲ ትካል ፍሉይ ምኽሪ ይትሕዝ።","При самообслуживании предприятие отказывается от профессиональной консультации.","En el autoservicio la empresa renuncia al asesoramiento especializado.","No self-service a empresa dispensa o aconselhamento especializado."],"Vorwahl passt zu Kleidung zum Anprobieren.":["Vorwahl ንክዳን ንምፍታን ትሰማማዕ።","Vorwahl подходит для одежды, которую нужно примерять.","La Vorwahl encaja con ropa para probarse.","A Vorwahl serve para roupa para provar."],"Bedienung (Vollbedienung)":["Bedienung (Vollbedienung — ምሉእ ኣገልግሎት)","Bedienung (Vollbedienung — полное обслуживание)","Bedienung (Vollbedienung — atención completa)","Bedienung (Vollbedienung — atendimento completo)"],"Selbstbedienung (passt hier nicht)":["Selbstbedienung (ኣብዚ ኣይሰማማዕን)","Selbstbedienung (здесь не подходит)","Selbstbedienung (aquí no encaja)","Selbstbedienung (aqui não serve)"],"Bedienung: kein direkter Zugang, Verkäufer legt vor und berät. Vorwahl: freier Zugang, Beratung bei Bedarf. Selbstbedienung: Kunde wählt, nimmt und zahlt selbst.":["Bedienung (ኣገልግሎት ብሰራሕተኛ)፦ ቀጥታዊ መእተዊ የለን፣ ሻጣይ የቕርብ ይመኽር። Vorwahl (ቅድሚ ምምራጽ)፦ ነጻ መእተዊ፣ ምኽሪ ኣብ እዋን ድሌት። Selbstbedienung (ባዕል ኣገልግሎት)፦ እቲ ዓሚል ባዕሉ ይመርጽ፣ ይወስድ ይኸፍል ድማ።","Bedienung (обслуживание продавцом): нет прямого доступа, продавец подаёт товар и консультирует. Vorwahl (предварительный выбор): свободный доступ, консультация при необходимости. Selbstbedienung (самообслуживание): Клиент сам выбирает, берёт и платит.","Bedienung (atención personalizada): sin acceso directo; el vendedor ofrece la mercancía y aconseja. Vorwahl (preselección): acceso libre, asesoramiento si hace falta. Selbstbedienung (autoservicio): El cliente elige, coge y paga por sí mismo.","Bedienung (atendimento ao balcão): sem acesso direto; o vendedor apresenta a mercadoria e aconselha. Vorwahl (pré-seleção): acesso livre, aconselhamento quando necessário. Selbstbedienung (self-service): O cliente escolhe, pega e paga por si."],"Bei Selbstbedienung verzichtet der Betrieb auf regelmäßige Fachberatung. Vorwahl braucht einen übersichtlichen Warenaufbau mit Produktbeschreibung.":["ኣብ Selbstbedienung እቲ ትካል ብስሩዕ ፍሉይ ምኽሪ ይትሕዝ። Vorwahl ንጹር ኣደላልዋ ኣቕሓ ምስ መግለጺ ምህርቲ ይደሊ።","При самообслуживании (Selbstbedienung) предприятие отказывается от регулярной профессиональной консультации. Vorwahl требует наглядной выкладки товара с описанием продукта.","En el autoservicio (Selbstbedienung) la empresa renuncia al asesoramiento especializado regular. La Vorwahl necesita una colocación clara de la mercancía con descripción del producto.","No self-service (Selbstbedienung) a empresa dispensa o aconselhamento especializado regular. A Vorwahl precisa de uma disposição clara da mercadoria com descrição do produto."],"Die Begründung: „Vorwahl passt zu Kleidung zum Anprobieren.“ Der Fachbegriff: Vorwahl.":["እቲ ምኽንያት፦ „Vorwahl ንክዳን ንምፍታን ትሰማማዕ።“ እቲ ቴክኒካዊ ቃል፦ Vorwahl።","Обоснование: «Vorwahl подходит для одежды, которую нужно примерять.» Термин: Vorwahl.","La justificación: «La Vorwahl encaja con ropa para probarse.» El término técnico: Vorwahl.","A justificação: «A Vorwahl serve para roupa para provar.» O termo técnico: Vorwahl."],"Woche § · Modul § · Unternehmensziele":["ሰሙን § · ሞዱል § · ዕላማታት ትካል (Unternehmensziele)","Неделя § · Модуль § · Цели предприятия (Unternehmensziele)","Semana § · Módulo § · Objetivos de la empresa (Unternehmensziele)","Semana § · Módulo § · Objetivos da empresa (Unternehmensziele)"],"Das Leitbild":["እቲ Leitbild (ራእይ)","Leitbild (миссия)","El Leitbild (lema de la empresa)","O Leitbild (missão da empresa)"],"Ihr schreibt ein Leitbild für die Ladentür. Es soll zeigen, was euch wichtig ist.":["ንማዕጾ ድኳን Leitbild (ራእይ) ትጽሕፉ። እቲ እንታይ ከም ዘገድሰኩም ክርኢ ኣለዎ።","Вы пишете для двери магазина Leitbild (миссию). Оно должно показать, что для вас важно.","Escribís un Leitbild (lema de la empresa) para la puerta de la tienda. Debe mostrar lo que os importa.","Escrevem um Leitbild (missão da empresa) para a porta da loja. Deve mostrar o que é importante para vocês."],"„Gewinn ist wichtig. Aber ein Laden ohne gutes Team ist wie ein Schiff ohne Mannschaft.“":["„ትርፊ (Gewinn) ኣገዳሲ እዩ። ግን ድኳን ብዘይ ጽቡቕ ጉጅለ ከም መርከብ ብዘይ ሰራሕተኛ እዩ።“","„Прибыль (Gewinn) важна. Но магазин без хорошей команды — как корабль без экипажа.“","„El beneficio (Gewinn) es importante. Pero una tienda sin buen equipo es como un barco sin tripulación.“","„O lucro (Gewinn) é importante. Mas uma loja sem boa equipa é como um barco sem tripulação.“"],"Welches Leitbild hängt ihr auf?":["ኣየናይ Leitbild ትሰቕሉ?","Какой Leitbild вы повесите?","¿Qué Leitbild colgáis?","Que Leitbild penduram?"],"Ökonomische Ziele: Gewinn, Umsatz, Kosten. Soziale Ziele: Wohl der Mitarbeiter. Ökologische Ziele: Umwelt schonen. Manchmal hilft ein Ziel dem anderen.":["ኢኮኖሚያዊ ዕላማታት (ökonomische Ziele)፦ ትርፊ፣ ሽያጥ፣ ወጻኢ። ማሕበራዊ ዕላማታት (soziale Ziele)፦ ጽቡቕ ህላወ ሰራሕተኛታት። ኢኮሎጂያዊ ዕላማታት (ökologische Ziele)፦ ንከባቢ ምሕላው። ሓደ ሓደ ግዜ ሓደ ዕላማ ንካልእ ይሕግዝ።","Экономические цели (ökonomische Ziele): прибыль, оборот, расходы. Социальные цели (soziale Ziele): благополучие сотрудников. Экологические цели (ökologische Ziele): беречь окружающую среду. Иногда одна цель помогает другой.","Objetivos económicos (ökonomische Ziele): beneficio, ventas, costes. Objetivos sociales (soziale Ziele): el bienestar de los empleados. Objetivos ecológicos (ökologische Ziele): cuidar el medio ambiente. A veces un objetivo ayuda al otro.","Objetivos económicos (ökonomische Ziele): lucro, volume de vendas, custos. Objetivos sociais (soziale Ziele): o bem-estar dos trabalhadores. Objetivos ecológicos (ökologische Ziele): proteger o ambiente. Às vezes um objetivo ajuda o outro."],"„Wir retten nur die Umwelt. Gewinn ist uns egal.“":["„ንሕና ንከባቢ ጥራይ ነድሕን። ትርፊ ንዓና ዋላ ሓንቲ ኣየገድሰናን።“","„Мы спасаем только окружающую среду. Прибыль нам безразлична.“","„Solo salvamos el medio ambiente. El beneficio nos da igual.“","„Só salvamos o ambiente. O lucro é-nos indiferente.“"],"„Wir sind fair zu Kunden, Team und Umwelt – und wirtschaften mit Gewinn.“":["„ንሕና ንዓማዊል፣ ንጉጅለን ንከባቢን ፍትሓውያን ኢና — ከምኡ ድማ ብትርፊ ንሰርሕ።“","«Мы справедливы к клиентам, команде и окружающей среде — и ведём дела с прибылью.»","«Somos justos con los clientes, el equipo y el medio ambiente, y gestionamos con beneficio.»","«Somos justos com os clientes, a equipa e o ambiente — e geridos com lucro.»"],"„Wir wollen möglichst viel Gewinn. Sonst nichts.“":["„ክሳብ ዝከኣል ብዙሕ ትርፊ ንደሊ። ካልእ ዋላ ሓንቲ።“","„Мы хотим как можно больше прибыли. Больше ничего.“","„Queremos el mayor beneficio posible. Nada más.“","„Queremos o maior lucro possível. Nada mais.“"],"Schön gesagt. Aber ohne Gewinn ist der Laden bald pleite.":["ጽቡቕ ተባሂሉ። ግን ብዘይ ትርፊ እቲ ድኳን ቀልጢፉ ይክስር።","Красиво сказано. Но без прибыли магазин скоро обанкротится.","Bien dicho. Pero sin beneficio la tienda pronto quebrará.","Bem dito. Mas sem lucro a loja em breve vai à falência."],"Das Leitbild verbindet ökonomische, soziale und ökologische Ziele.":["እቲ Leitbild ኢኮኖሚያዊ፣ ማሕበራዊን ኢኮሎጂያዊን ዕላማታት የጣምር።","Leitbild объединяет экономические, социальные и экологические цели.","El Leitbild une objetivos económicos, sociales y ecológicos.","O Leitbild une objetivos económicos, sociais e ecológicos."],"Ohne Gewinn kann ein Laden nicht überleben.":["ብዘይ ትርፊ ሓደ ድኳን ክነብር ኣይክእልን።","Без прибыли магазин не выживет.","Sin beneficio una tienda no puede sobrevivir.","Sem lucro uma loja não pode sobreviver."],"Möglichst viel Gewinn ist das erwerbswirtschaftliche Prinzip.":["ዝተኻእለ ብዙሕ ትርፊ erwerbswirtschaftliches Prinzip እዩ።","Как можно больше прибыли — это erwerbswirtschaftliches Prinzip (принцип получения дохода).","El mayor beneficio posible es el erwerbswirtschaftliches Prinzip (principio de lucro).","O maior lucro possível é o erwerbswirtschaftliches Prinzip (princípio do lucro)."],"ökonomische, soziale und ökologische Ziele":["ኢኮኖሚያዊ፣ ማሕበራዊን ኢኮሎጂያዊን ዕላማታት","экономические, социальные и экологические цели","objetivos económicos, sociales y ecológicos","objetivos económicos, sociais e ecológicos"],"ökonomische Ziele vergessen":["ኢኮኖሚያዊ ዕላማታት ምርሳዕ","забыть об экономических целях","olvidar los objetivos económicos","esquecer os objetivos económicos"],"erwerbswirtschaftliches Prinzip":["erwerbswirtschaftliches Prinzip (ትርፊ ዘማልእ መምርሒ)","erwerbswirtschaftliches Prinzip (принцип получения дохода)","erwerbswirtschaftliches Prinzip (principio de lucro)","erwerbswirtschaftliches Prinzip (princípio do lucro)"],"Zielharmonie: Ein Ziel hilft dem anderen (LED: Umwelt und Kosten). Zielkonflikt: Ein Ziel behindert das andere (Urlaubsgeld: Mitarbeiter froh, Kosten höher).":["Zielharmonie፦ ሓደ ዕላማ ንካልእ ይሕግዝ (LED፦ ከባቢን ወጻኢን)። Zielkonflikt፦ ሓደ ዕላማ ንካልእ ይዕንቅፍ (ደሞዝ ዕረፍቲ፦ ሰራሕተኛታት ሕጉሳት፣ ወጻኢ ልዑል)።","Zielharmonie: Одна цель помогает другой (LED: окружающая среда и расходы). Zielkonflikt: Одна цель мешает другой (отпускные: сотрудники довольны, расходы выше).","Zielharmonie: Un objetivo ayuda al otro (LED: medio ambiente y costes). Zielkonflikt: Un objetivo estorba al otro (paga de vacaciones: empleados contentos, costes más altos).","Zielharmonie: Um objetivo ajuda o outro (LED: ambiente e custos). Zielkonflikt: Um objetivo atrapalha o outro (subsídio de férias: trabalhadores contentes, custos mais altos)."],"Ersatz bisheriger Leuchtmittel durch Energie sparendere Leuchtmittel: sowohl ökonomische als auch ökologische Zielsetzung.":["ምትካእ ናይ ዘለዉ መብራህቲ ብዝተቐነሰ ሓይሊ ዝጥቀሙ መብራህቲ፦ ኢኮኖሚያዊን ኢኮሎጂያዊን ዕላማ።","Замена прежних ламп на более энергосберегающие: одновременно экономическая и экологическая цель.","Sustituir las lámparas actuales por otras que ahorran energía: objetivo a la vez económico y ecológico.","Substituição das lâmpadas atuais por outras que poupam energia: objetivo ao mesmo tempo económico e ecológico."],"Selbst ich als Möwe hätte das besser gemacht.":["ኣነ ጋይላ እውን ኣብዚ ዝሓሸ ምገበርኩ።","Даже я, чайка, сделала бы это лучше.","Hasta yo, siendo gaviota, lo habría hecho mejor.","Até eu, sendo gaivota, teria feito melhor."],"Die Begründung: „Das Leitbild verbindet ökonomische, soziale und ökologische Ziele.“ Der Fachbegriff: ökonomische, soziale und ökologische Ziele.":["እቲ ምኽንያት፦ „እቲ Leitbild ኢኮኖሚያዊ፣ ማሕበራዊን ኢኮሎጂያዊን ዕላማታት የጣምር።“ እቲ ቴክኒካዊ ቃል፦ ኢኮኖሚያዊ፣ ማሕበራዊን ኢኮሎጂያዊን ዕላማታት።","Обоснование: «Leitbild объединяет экономические, социальные и экологические цели.» Термин: экономические, социальные и экологические цели.","La justificación: «El Leitbild une objetivos económicos, sociales y ecológicos.» El término técnico: objetivos económicos, sociales y ecológicos.","A justificação: «O Leitbild une objetivos económicos, sociais e ecológicos.» O termo técnico: objetivos económicos, sociais e ecológicos."],"Woche § · Modul § · Organisation im Betrieb":["ሰሙን § · ሞዱል § · ኣወዳድባ ኣብ ትካል (Organisation im Betrieb)","Неделя § · Модуль § · Организация на предприятии (Organisation im Betrieb)","Semana § · Módulo § · Organización en la empresa (Organisation im Betrieb)","Semana § · Módulo § · Organização na empresa (Organisation im Betrieb)"],"Die Arbeit aufteilen":["ዕዮ ምክፋል","Распределение работы","Repartir el trabajo","Repartir o trabalho"],"Der Laden wächst. Ihr seid jetzt sechs Leute. Opa Hinrichs fragt: „Wie teilt ihr die Arbeit auf?“":["እቲ ድኳን ይዓቢ። ሕጂ ሽዱሽተ ሰባት ኢኹም። Opa Hinrichs ይሓትት፦ „ከመይ ዕዮ ትካፈሉ?“","Магазин растёт. Теперь вас шестеро. Opa Hinrichs спрашивает: «Как вы распределяете работу?»","La tienda crece. Ahora sois seis personas. Opa Hinrichs pregunta: «¿Cómo repartís el trabajo?»","A loja cresce. Agora são seis pessoas. idade de luxo (Luxusbedürfnis): Casacos de cabedal por § €"],"Existenzbedürfnis: warme Socken, Mützen und Unterwäsche":["ድሌት ህላወ (Existenzbedürfnis)፦ ድሑር ሶክስ፣ ቆብዕን ዓርጌ ክዳንን","Жизненная потребность (Existenzbedürfnis): тёплые носки, шапки и нижнее бельё","Necesidad básica (Existenzbedürfnis): calcetines calientes, gorros y ropa interior","Necessidade básica (Existenzbedürfnis): meias quentes, gorros e roupa interior"],"Kulturbedürfnis: Trikots vom Fußballverein und Fan-Schals":["ድሌት ባህሊ (Kulturbedürfnis)፦ ማልያ ክለብ ኩዕሶ ከምኡ ድማ ሻርፕ ደገፍቲ","Культурная потребность (Kulturbedürfnis): Футболки футбольного клуба и шарфы болельщиков","Necesidad cultural (Kulturbedürfnis): Camisetas del club de fútbol y bufandas de aficionados","Necessidade cultural (Kulturbedürfnis): Camisolas do clube de futebol e cachecóis de adeptos"],"Existenzbedürfnisse sind lebensnotwendig. Dafür haben die Leute auch Geld übrig – sie haben Bedarf.":["ድሌታት ህላወ (Existenzbedürfnisse) ንህይወት ኣገደስቲ እዮም። ንዚ ሰባት ገንዘብ ተሪፉዎም — Bedarf ኣለዎም።","Жизненные потребности (Existenzbedürfnisse) необходимы для жизни. На это у людей остаются деньги — у них есть Bedarf.","Las necesidades básicas (Existenzbedürfnisse) son vitales. Para esto a la gente le sobra dinero: tiene Bedarf.","As necessidades básicas (Existenzbedürfnisse) são vitais. Para isto as pessoas têm dinheiro de sobra — têm Bedarf."],"Jetzt sitzt es! +§ % Vertrauen.":["ሕጂ ተረዲኡ! +§ % እምነት።","Теперь получилось! +§ % доверия.","¡Ahora sí! +§ % de confianza.","Agora sim! +§ % de confiança."],"Preisbildung auf dem Markt":["ምውሳን ዋጋ ኣብ ዕዳጋ","Формирование цен на рынке","Formación de precios en el mercado","Formação de preços no mercado"],"Ein Hoodie mit Hafen-Motiv ist plötzlich überall im Internet. Alle wollen ihn. Der Großhändler sagt: „Ich habe kaum Ware.“ Ihr müsst nachbestellen.":["ሓደ ሁዲ ምስ ስእሊ ወደብ ድንቅ ኣብ ኢንተርነት ኩሉ ቦታ ኣሎ። ኩሉ ይደልዮ። እቲ ዓቢ ነጋዳይ ይብል፦ „ኣቕሓ ዳርጋ የለን።“ ዳግም ክትዝንግዑ ኣለኩም።","Худи с портовым принтом вдруг появилось по всему интернету. Все хотят его. Оптовик говорит: «У меня почти нет товара.» Вам нужно дозаказать.","Una sudadera con motivo del puerto aparece de golpe por todo internet. Todos lo quieren. El mayorista dice: «Casi no tengo mercancía.» Tenéis que volver a pedir.","Um hoodie com motivo do porto aparece de repente por toda a internet. Todos o querem. O grossista diz: «Quase não tenho mercadoria.» Têm de voltar a encomendar."],"Was passiert jetzt mit dem Preis auf dem Markt?":["ሕጂ ምስ ዋጋ ኣብ ዕዳጋ እንታይ ይኸውን?","Что теперь будет с ценой на рынке?","¿Qué pasa ahora con el precio en el mercado?","O que acontece agora com o preço no mercado?"],"Ihr wartet ab, bis wieder mehr Ware da ist. Dann wird der Preis sinken.":["ተጸቢኹም ክሳብ ዝመጽእ ዝያዳ ኣቕሓ ትጽበዩ። ድሕሪኡ እቲ ዋጋ ይቅንስ።","Вы ждёте, пока снова не будет больше товара. Потом цена упадёт.","Esperáis hasta que haya más mercancía. Después el precio bajará.","Esperam até haver mais mercadoria. Depois o preço vai descer."],"Der Preis steigt. Die Nachfrage ist größer als das Angebot. Ihr bestellt trotzdem rechtzeitig.":["እቲ ዋጋ ይለዓል። እቲ ጥላብ (Nachfrage) ካብ ኣቕራቦት (Angebot) ይበዝሕ። ብዘይ ምድንጓይ ግን ትዝንግዑ።","Цена растёт. Спрос (Nachfrage) больше предложения (Angebot). Вы всё равно заказываете вовремя.","El precio sube. La demanda (Nachfrage) es mayor que la oferta (Angebot). Aun así, pedís a tiempo.","O preço sobe. A procura (Nachfrage) é maior do que a oferta (Angebot). Mesmo assim, encomendam a tempo."],"Der Preis fällt, weil so viele den Artikel kaufen wollen. Ihr bestellt ganz billig.":["እቲ ዋጋ ይወርድ፣ ምኽንያቱ ብዙሓት እቲ ኣቕሓ ክገዝኡ ይደልዩ። ብዙሕ ሓጺር ዋጋ ትዝንግዑ።","Цена падает, потому что так много людей хотят купить товар. Вы заказываете совсем дёшево.","El precio baja porque tanta gente quiere comprar el artículo. Pedís muy barato.","O preço desce porque tanta gente quer comprar o artigo. Encomendam muito barato."],"Die Nachfrage ist größer als das Angebot: ein Verkäufermarkt. Der Verkäufer ist in der starken Position, die Preise steigen.":["ጥላብ ካብ ኣቕራቦት ይበዝሕ፦ ዕዳጋ ሻጣይ (Verkäufermarkt)። እቲ ሻጣይ ኣብ ሓያል ኩነታት ኣሎ፣ ዋጋ могут оплатить — это ещё не Bedarf.","Solo os enteráis de los deseos. Muchos deseos la gente no puede pagarlos: eso aún no es Bedarf.","Só ficam a saber os desejos. Muitos desejos as pessoas não os podem pagar — isso ainda não é Bedarf."],"Ihr fragt: „Was wünscht ihr euch – und wie viel Geld wollt ihr dafür ausgeben?“ – Ihr fragt nach dem Bedarf: dem Teil der Bedürfnisse, den die Leute mit ihrem Geld erfüllen können.":["ትሓቱ፦ „እንታይ ትደልዩ — ክንደይ ገንዘብ ድማ ንዚ ክትጥቀሙ ትደልዩ?“ – ንBedarf ትሓቱ፦ እቲ ሰባት ብገንዘቦም ክምልእዎ ዝኽእሉ ክፋል ናይ ምድላያት።","Вы спрашиваете: «Чего вы хотите — и сколько денег готовы на это потратить?» – Вы спрашиваете про Bedarf: ту часть потребностей, которую люди могут удовлетворить на свои деньги.","Preguntáis: «¿Qué deseáis y cuánto dinero queréis gastar en ello?» – Preguntáis por el Bedarf: la parte de las necesidades que la gente puede cubrir con su dinero.","Perguntam: «O que desejam — e quanto dinheiro querem gastar nisso?» – Perguntam pelo Bedarf: a parte das necessidades que as pessoas podem satisfazer com o seu dinheiro."],"Besser für Mia:":["ዝሓሸ ንMia፦","Лучше для Mia:","Mejor para Mia:","Melhor para Mia:"],"§ von § Bausteinen richtig.":["§ ካብ § ክፍልታት ቅኑዕ።","§ из § элементов правильно.","§ de § piezas correctas.","§ de § blocos certos."],"Weil-Satz:":["Weil-Satz (ሓሳብ ብ„ምኽንያቱ“)፦","Weil-Satz (предложение с «потому что»):","Weil-Satz (frase con «porque»):","Weil-Satz (frase com «porque»):"],"Das Ziel steht fest (§ Haushalte). Die Kosten sollen möglichst gering sein. Das ist das Minimalprinzip.":["እቲ ዕላማ ጸኒዑ (§ ስድራቤታት)። እቲ ወጻኢ ክሳብ ዝከኣል ትሑት ክኸውን ኣለዎ። እዚ Minimalprinzip እዩ።","Цель задана (§ домохозяйств). Расходы должны быть как можно ниже. Это принцип минимума (Minimalprinzip).","El objetivo es fijo (§ hogares). Los costes deben ser lo más bajos posible. Este es el principio de mínimo (Minimalprinzip).","O objetivo é fixo (§ agregados familiares). Os custos devem ser os mais baixos possíveis. Este é o princípio do mínimo (Minimalprinzip)."],"Der Preis liegt weit über dem Gleichgewichtspreis. Das Angebot (§) ist viel größer als die Nachfrage (§). Es entsteht ein Angebotsüberschuss – der Preis sinkt.":["እቲ ዋጋ ርሑቕ ልዕሊ Gleichgewichtspreis እዩ። እቲ ኣቕራቦት (§) ካብ ጥላብ (§) ብዙሕ ይዓቢ። Angebotsüberschuss ይፍጠር — እቲ ዋጋ ይወርድ።","Цена намного выше равновесной цены (Gleichgewichtspreis). Предложение (§) намного больше спроса (§). Возникает избыток предложения (Angebotsüberschuss) — цена падает.","El precio está muy por encima del precio de equilibrio (Gleichgewichtspreis). La oferta (§) es mucho mayor que la demanda (§). Surge un exceso de oferta (Angebotsüberschuss): el precio baja.","O preço está muito acima do preço de equilíbrio (Gleichgewichtspreis). A oferta (§) é muito maior do que a procura (§). Surge um excesso de oferta (Angebotsüberschuss) — o preço desce."],"§ € je Stück – Angebot und Nachfrage sind gleich groß (§). Das ist der Gleichgewichtspreis. Hier wird die größte Menge gehandelt.":["§ € ንሓደ – ኣቕራቦትን ጥላብን ማዕረ እዮም (§)። እዚ Gleichgewichtspreis (ዋጋ ማዕረ) እዩ። ኣብዚ እቲ ዝዓበየ መጠን ይዕደግ።","§ € за штуку – Предложение и спрос равны (§). Это равновесная цена (Gleichgewichtspreis). Здесь продаётся наибольшее количество.","§ € por unidad – La oferta y la demanda son iguales (§). Este es el precio de equilibrio (Gleichgewichtspreis). Aquí se comercia la mayor cantidad.","§ € por unidade – A oferta e a procura são iguais (§). Este é o preço de equilíbrio (Gleichgewichtspreis). Aqui negocia-se a maior quantidade."],"Ihr kauft große Mengen beim Großhandel und verkauft in haushaltsüblichen Mengen – Groß einkaufen und in haushaltsüblichen Mengen verkaufen: Das ist der Mengenausgleich.":["ዓበይቲ መጠን ኣብ ዓቢ ዕዳጋ ትገዝኡ ብመጠን ስድራቤት ድማ ትሸጡ – ብዓቢ ምግዛእን ብመጠን ስድራቤት ምሻጥን፦ እዚ Mengenausgleich እዩ።","Вы закупаете большие объёмы у оптовика и продаёте в привычных для домохозяйства количествах – Закупать много и продавать в привычных для домохозяйства количествах — это Mengenausgleich (выравнивание количеств).","Compráis grandes cantidades al mayorista y vendéis en cantidades habituales para un hogar – Comprar en grande y vender en cantidades habituales para un hogar: eso es el Mengenausgleich (ajuste de cantidades).","Compram grandes quantidades ao grossista e vendem em quantidades habituais para um agregado familiar – Comprar em grande e vender em quantidades habituais para um agregado familiar: isso é o Mengenausgleich (ajuste de quantidades)."],"Saisonsortiment muss zur Jahreszeit passen. Sonst entstehen Lagerkosten und die Ware veraltet.":["Saisonsortiment ምስ ወቕቲ ክሰማማዕ ኣለዎ። ካልእ ወጻኢ መኽዘን ይፍጠር ኣቕሓ ድማ ይቆዩ።","Saisonsortiment (сезонный ассортимент) должен подходить к времени года. Иначе возникают расходы на склад, и товар устаревает.","El Saisonsortiment (surtido de temporada) tiene que encajar con la estación. Si no, se generan costes de almacén y la mercancía se queda anticuada.","O Saisonsortiment (sortimento sazonal) tem de combinar com a estação. Senão surgem custos de armazém e a mercadoria fica ultrapassada."],"Saisonsortiment: Regenjacken, Schals und Gummistiefel – Saisonware gibt es nur zu bestimmten Zeiten. Im Herbst passt sie genau.":["Saisonsortiment (ወቕታዊ ምርጫ)፦ ጃኬታት ዝናብ፣ ሻርፕን ጎማ ጫማን – Saisonware ኣብ ሓደ ሓደ እዋን ጥራይ ይርከብ። ኣብ ክረምቲ ብትክክል ይሰማማዕ።","Saisonsortiment (сезонный ассортимент): дождевики, шарфы и резиновые сапоги – Сезонный товар (Saisonware) бывает только в определённое время. Осенью он подходит идеально.","Saisonsortiment (surtido de temporada): chubasqueros, bufandas y botas de goma – La Saisonware (mercancía de temporada) solo hay en ciertas épocas. En otoño encaja justo.","Saisonsortiment (sortimento sazonal): gabardinas, cachecóis e galochas – A Saisonware (mercadoria sazonal) só existe em certas épocas. No outono encaixa na perfeição."],"Vorwahl passt zu Kleidung zum Anprobieren. Teurer Schmuck ist dafür zu diebstahlgefährdet.":["Vorwahl ንክዳን ንምፍታን ትሰማማዕ። ክቡር ጌጥ ንዚ ብስርቂ ኣዝዩ ይተጋለጽ።","Vorwahl подходит для одежды, которую нужно примерять. Дорогие украшения слишком подвержены кражам для этого.","La Vorwahl encaja con ropa para probarse. Las joyas caras tienen demasiado riesgo de robo para esto.","A Vorwahl serve para roupa para provar. As joias caras têm demasiado risco de furto para isto."],"Bedienung: Die Ware liegt hinter der Theke oder in der Vitrine. Ihr legt sie vor und beratet. – Schmuck ist hochwertig und diebstahlgefährdet. Dafür passt Bedienung.":["Bedienung (ኣገልግሎት ብሰራሕተኛ)፦ እቲ ኣቕሓ ድሕሪ ጠረጴዛ ወይ ኣብ ቪትሪን እዩ። ኣቕርቡዎም ትመኽሩ። – ጌጥ ልዑል ዋጋ ዘለዎን ብስርቂ ዝተጋለጸን እዩ። ንዚ Bedienung ይሰማማዕ።","Bedienung (обслуживание продавцом): Товар лежит за прилавком или в витрине. Вы подаёте его и консультируете. – Украшения высокого качества и подвержены кражам. Для этого подходит Bedienung (обслуживание).","Bedienung (atención personalizada): La mercancía está detrás del mostrador o en la vitrina. Los mostráis y asesoráis. – Las joyas son valiosas y tienen riesgo de robo. Para esto encaja la Bedienung (atención personalizada).","Bedienung (atendimento ao balcão): A mercadoria está atrás do balcão ou na vitrina. Apresentam e aconselham. – As joias são valiosas e têm risco de furto. Para isto serve a Bedienung (atendimento ao balcão)."],"Ohne Gewinn kann ein Laden nicht überleben. Ökonomische Ziele sichern Einkommen und Existenz.":["ብዘይ ትርፊ ሓደ ድኳን ክነብር ኣይክእልን። ኢኮኖሚያዊ ዕላማታት ኣታዊን ህላወን የረጋግጹ።","Без прибыли магазин не выживет. Экономические цели обеспечивают доход и существование.","Sin beneficio una tienda no puede sobrevivir. Los objetivos económicos aseguran ingresos y existencia.","Sem lucro uma loja não pode sobreviver. Os objetivos económicos garantem rendimento e existência."],"„Wir sind fair zu Kunden, Team und Umwelt – und wirtschaften mit Gewinn.“ – Das Leitbild verbindet ökonomische, soziale und ökologische Ziele. So haben alle Orientierung.":["„ንሕና ንዓማዊል፣ ንጉጅለን ንከባቢን ፍትሓውያን ኢና — ከምኡ ድማ ብትርፊ ንሰርሕ።“ – እቲ Leitbild ኢኮኖሚያዊ፣ ማሕበራዊን ኢኮሎጂያዊን ዕላማታት የጣምር። ከምዚ ኩሉ ኣቕጣጫ ይርከብ።","«Мы справедливы к клиентам, команде и окружающей среде — и ведём дела с прибылью.» – Leitbild объединяет экономические, социальные и экологические цели. Так у всех есть ориентир.","«Somos justos con los clientes, el equipo y el medio ambiente, y gestionamos con beneficio.» – El Leitbild une objetivos económicos, sociales y ecológicos. Así todos tienen una orientación.","«Somos justos com os clientes, a equipa e o ambiente — e geridos com lucro.» – O Leitbild une objetivos económicos, sociais e ecológicos. Assim todos têm orientação."],"Prüfungskasten":["Prüfungskasten (ሳጹን ፈተና)","Prüfungskasten (экзаменационный блок)","Prüfungskasten (caja de examen)","Prüfungskasten (caixa de exame)"],"Diese Sätze solltet ihr noch üben:":["እዞም ሓሳባት ገና ክትልምድዎም ኣለኩም፦","Эти предложения вам стоит ещё потренировать:","Estas frases todavía deberíais practicarlas:","Estas frases ainda devem treinar:"],"Modul §:":["ሞዱል §፦","Модуль §:","Módulo §:","Módulo §:"],"Für Profis":["ንክኢላታት","Для профи","Para profesionales","Para profissionais"],"Das Modell heißt „einfacher“ Wirtschaftskreislauf. Nennt zwei Beteiligte, die in der Wirklichkeit fehlen, und erklärt an einem Beispiel, welche Ströme sie auslösen.":["እቲ ሞዴል „ቀሊል“ ዑደት ቁጠባ (Wirtschaftskreislauf) ይብሃል። ክልተ ተሳተፍቲ ኣብ ሓቂ ዘይርከቡ ጥቀሱ ኣብ ኣብነት ድማ ኣየናይ ዋሕዚ ከም ዘምጽኡ ኣብርሁ።","Модель называется «простым» экономическим кругооборотом (Wirtschaftskreislauf). Назовите двух участников, которых нет в реальности, и объясните на примере, какие потоки они вызывают.","El modelo se llama circuito económico «simple» (Wirtschaftskreislauf). Nombrad dos participantes que faltan en la realidad y explicad con un ejemplo qué flujos provocan.","O modelo chama-se circuito económico «simples» (Wirtschaftskreislauf). Indiquem dois participantes que faltam na realidade e expliquem com um exemplo que fluxos provocam."],"Musterantwort zeigen":["መልሲ ኣብነት ኣርእዩ","Показать образец ответа","Mostrar respuesta modelo","Mostrar resposta-modelo"],"z. B. der Staat (Haushalte zahlen Steuern, der Staat baut Straßen) und die Banken (Haushalte sparen, die Bank gibt Unternehmen einen Kredit); auch das Ausland (Export und Import).":["z. ንኣብነት እቲ መንግስቲ (ስድራቤታት ቀረጽ ይኸፍሉ፣ መንግስቲ ጎደናታት ይሰርሕ) ከምኡ ድማ ባንክታት (ስድራቤታት ይቆጥቡ፣ እቲ ባንኪ ንትካላት ብድሪ ይህብ)፤ እውን ወጻኢ ሃገር (ኤክስፖርትን ኢምፖርትን)።","z. Например, государство (домохозяйства платят налоги, государство строит дороги) и банки (домохозяйства сберегают, банк даёт предприятиям кредит); также заграница (экспорт и импорт).","z. Por ejemplo, el Estado (los hogares pagan impuestos, el Estado construye carreteras) y los bancos (los hogares ahorran, el banco da un crédito a las empresas); también el extranjero (exportación e importación).","z. Por exemplo, o Estado (os agregados familiares pagam impostos, o Estado constrói estradas) e os bancos (os agregados familiares poupam, o banco concede crédito às empresas); também o estrangeiro (exportação e importação)."],"Neue Zielgruppe ziehen":["ሓድሽ ዒላማ ዓማዊል ሰሓቡ","Вытянуть новую целевую группу","Sacar un nuevo grupo objetivo","Tirar um novo grupo-alvo"],"Gleiche Zielgruppe – besser machen":["ተመሳሳሊ ዒላማ ዓማዊል – ዝሓሸ ግበሩ","Та же целевая группа – сделать лучше","El mismo grupo objetivo – hacerlo mejor","O mesmo grupo-alvo – fazer melhor"],"Andere Branche oder anderer Modus":["ካልእ ዓይነት ዕዮ ወይ ካልእ ኣገባብ","Другая отрасль или другой режим","Otro sector u otro modo","Outro ramo ou outro modo"],"Kreuzfahrt-Gast aus Schweden":["ተጓዓዚት መርከብ ካብ ስዊደን","Гостья круиза из Швеции","Huésped de crucero de Suecia","Passageira de cruzeiro da Suécia"],"Hat § Stunden Landgang. Sucht etwas Besonderes vom Hafen. Zahlt gern mehr.":["§ ሰዓታት ኣብ ምድሪ ኣለዋ። ፍሉይ ነገር ካብ ወደብ ትደሊ። ብፍቕሪ ዝያዳ ትኸፍል።","У неё § часа на берегу. Ищет что-то особенное из порта. Охотно платит больше.","Tiene § horas en tierra. Busca algo especial del puerto. Paga gustosa más.","Tem § horas em terra. Procura algo especial do porto. Paga de bom grado mais."],"Ihr zahlt Opa Hinrichs jeden Monat die Miete.":["ንOpa Hinrichs ነፍሲ ወከፍ ወርሒ ክራይ ትኸፍሉ።","Вы платите Opa Hinrichs арендную плату каждый месяц.","Pagáis a Opa Hinrichs el alquiler cada mes.","Pagam a Opa Hinrichs a renda todos os meses."]," wendig.“ Der Fachbegriff: Existenzbedürfnis.":["እቲ ምኽንያት፦ „ድሌታት ህላወ ንህይወት ኣገደስቲ እዮም።“ እቲ ቴክኒካዊ ቃል፦ Existenzbedürfnis።","Обоснование: «Жизненные потребности необходимы для жизни.» Термин: Existenzbedürfnis.","La justificación: «Las necesidades básicas son vitales.» El término técnico: Existenzbedürfnis.","A justificação: «As necessidades básicas são vitais.» O termo técnico: Existenzbedürfnis."],"„Ich zahle euch § €, wenn ihr ab jetzt nur noch an andere Händler verkauft – nicht mehr an Leute wie Herrn Petersen.“":["„§ € ክኸፍለኩም እየ፣ ካብ ሕጂ ንካልኦት ነጋዶ ጥራይ እንተሸጥኩም — ከም Herr Petersen ዝበሉ ሰባት ኣይፋል።“","«Я заплачу вам § €, если с этого момента вы будете продавать только другим торговцам — а не таким людям, как Herr Petersen.»","«Os pago § € si a partir de ahora solo vendéis a otros comerciantes, no a gente como Herr Petersen.»","«Pago-vos § € se a partir de agora só venderem a outros comerciantes, e não a pessoas como Herr Petersen.»"],"Annehmen. § € sind § €.":["ተቐበሉ። § € § € እዩ።","Принять. § € есть § €.","Aceptar. § € son § €.","Aceitar. § € são § €."],"Ablehnen, weil Großhändler keine Steuern zahlen.":["ኣይፋል በሉ፣ ምኽንያቱ ዓበይቲ ነጋዶ ቀረጽ ኣይኸፍሉን።","Отказаться, потому что оптовики не платят налоги.","Rechazar, porque los mayoristas no pagan impuestos.","Recusar, porque os grossistas não pagam impostos."],"Ablehnen, weil ein Einzelhändler an Verbraucher verkauft. Sonst verlieren wir unsere Kunden.":["ኣይፋል በሉ፣ ምኽንያቱ ሓደ ንእሽተይ ነጋዳይ (Einzelhändler) ንተጠቀምቲ ይሸጥ። ካልእ ዓማዊልና ንስእን።","Отказаться, потому что розничный торговец (Einzelhändler) продаёт потребителям. Иначе мы потеряем наших клиентов.","Rechazar, porque un minorista (Einzelhändler) vende a los consumidores. Si no, perdemos a nuestros clientes.","Recusar, porque um retalhista (Einzelhändler) vende aos consumidores. Senão perdemos os nossos clientes."],"Richtig abgelehnt – aber falsch begründet. Großhändler zahlen auch Steuern.":["ቅኑዕ ኣይፋል በሉ – ግን ምኽንያት ጌጋ። ዓበይቲ ነጋዶ እውን ቀረጽ ይኸፍሉ።","Верно отказались – но обоснование неверное. Оптовики тоже платят налоги.","Rechazado correctamente – pero la justificación es incorrecta. Los mayoristas también pagan impuestos.","Recusado corretamente – mas a justificação está errada. Os grossistas também pagam impostos."],"Einzelhandelsbetriebe kaufen Waren ein und verkaufen sie meist unverändert an Verbraucher. Wer nur an Händler verkauft, ist Großhandel.":["ንእሽተይ ዕዳጋ ትካላት ኣቕሑት ይገዝኡ ብዙሕ ግዜ ከይቀየሩ ድማ ንተጠቀምቲ ይሸጡ። ንነጋዶ ጥራይ ዝሸጥ ዓቢ ዕዳጋ (Großhandel) እዩ።","Предприятия розничной торговли закупают товары и продают их, как правило без изменений, потребителям. Кто продаёт только торговцам, тот оптовик (Großhandel).","Los comercios minoristas compran mercancía y la venden casi siempre sin transformarla a los consumidores. Quien vende solo a comerciantes es mayorista (Großhandel).","As empresas do comércio a retalho compram mercadoria e vendem-na, em regra sem a transformar, aos consumidores. Quem vende só a comerciantes é grossista (Großhandel)."],"Regale für den Laden":["መደርደሪ ንድኳን","Стеллажи для магазина","Estanterías para la tienda","Prateleiras para a loja"],"Bedürfnis – Bedarf – Nachfrage":["ድሌት – ዝደለየ – ጥላብ","Потребность – Спрос по потребности – Спрос","Necesidad – Demanda potencial – Demanda","Necessidade – Procura potencial – Procura"],"Die Ware steht noch in Kartons. Ihr braucht Regale. Opa Hinrichs sagt: „Wer wirtschaftet, muss wissen, was feststeht.“":["እቲ ኣቕሓ ገና ኣብ ካርቶናት እዩ። መደርደሪ የድልየኩም። Opa Hinrichs ይብል፦ „እቲ ዝሰርሕ ክፈልጥ ኣለዎ እንታይ ጸኒዑ።“","Товар всё ещё лежит в коробках. Вам нужны стеллажи. Opa Hinrichs говорит: «Кто ведёт хозяйство, должен знать, что задано.»","La mercancía sigue en cajas. Necesitáis estanterías. Opa Hinrichs dice: «Quien administra tiene que saber qué es lo fijo.»","A mercadoria ainda está em caixas. Precisam de prateleiras. Opa Hinrichs diz: «Quem gere tem de saber o que é fixo.»"],"Wie kauft ihr die Regale?":["ከመይ ትገዝኡ ነቲ መደርደሪ?","Как вы покупаете стеллажи?","¿Cómo compráis las estanterías?","Como compram as prateleiras?"],"Ihr habt § € für Regale. Dafür kauft ihr möglichst viel Regalfläche.":["§ € ንመደርደሪ ኣለኩም። ብእኡ ክሳብ ዝከኣል ብዙሕ ቦታ መደርደሪ ትገዝኡ።","У вас есть § € на стеллажи. На них вы покупаете как можно больше площади стеллажей.","Tenéis § € para estanterías. Con eso compráis tanta superficie de estantería como sea posible.","Têm § € para prateleiras. Com isso compram a maior área de prateleira possível."],"Ihr braucht genau § Meter Regal. Ihr holt drei Angebote und nehmt das günstigste.":["ብትክክል § ሜትሮ መደርደሪ የድልየኩም። ሰለስተ ጠቕላሊታት ትወስዱ እቲ ዝተሓተ ዋጋ ድማ ትመርጹ።","Вам нужно ровно § метров стеллажей. Вы берёте три предложения и выбираете самое дешёвое.","Necesitáis exactamente § metros de estantería. Pedís tres ofertas y cogéis la más barata.","Precisam exatamente de § metros de prateleira. Pedem três propostas e escolhem a mais barata."],"Ihr wollt mit möglichst wenig Geld möglichst viele Regale kaufen.":["ብዝተሓተ ገንዘብ ክሳብ ዝከኣል ብዙሓት መደርደሪ ክትገዝኡ ትደልዩ።","Вы хотите купить как можно больше стеллажей за как можно меньшие деньги.","Queréis comprar tantas estanterías como sea posible con el menor dinero posible.","Querem comprar o maior número possível de prateleiras com o menor dinheiro possível."],"Nett! Das schaue ich mir an.":["ጽቡቕ! እዚ ክርእዮ እየ።","Мило! Это я посмотрю.","¡Qué bien! Esto lo voy a ver.","Que simpático! Isto vou ver."],"Viel Platz für Ware. Aber die Kasse ist leerer.":["ብዙሕ ቦታ ንኣቕሓ። ግን እቲ ሳጹን ዝያዳ ባዶ እዩ።","Много места для товара. Но касса пустеет.","Mucho sitio para la mercancía. Pero la caja está más vacía.","Muito espaço para a mercadoria. Mas a caixa está mais vazia."],"Das Ziel steht fest (§ Meter).":["እቲ ዕላማ ጸኒዑ (§ ሜትሮ)።","Цель задана (§ метров).","El objetivo es fijo (§ metros).","O objetivo é fixo (§ metros)."],"Hier steht gar nichts fest.":["ኣብዚ ዋላ ሓንቲ ኣይጸንዐን።","Здесь вообще ничего не задано.","Aquí no hay nada fijo.","Aqui não há nada fixo."],"Die Begründung: „Die Mittel stehen fest (§ €).“ Der Fachbegriff: Maximalprinzip.":["እቲ ምኽንያት፦ „እቲ መሳርሒ ጸኒዑ (§ €)።“ እቲ ቴክኒካዊ ቃል፦ Maximalprinzip።","Обоснование: «Средства заданы (§ €).» Термин: Maximalprinzip.","La justificación: «Los medios son fijos (§ €).» El término técnico: Maximalprinzip.","A justificação: «Os meios são fixos (§ €).» O termo técnico: Maximalprinzip."],"Der Trendartikel":["እቲ ዘመናዊ ኣቕሓ","Модный товар","El artículo de moda","O artigo da moda"],"Ein Eistee aus Bremen ist plötzlich überall im Internet. Alle wollen ihn. Der Großhändler sagt: „Ich habe kaum Ware.“ Ihr müsst nachbestellen.":["ሓደ Eistee ካብ Bremen ድንቅ ኣብ ኢንተርነት ኩሉ ቦታ ኣሎ። ኩሉ ይደልዮ። እቲ ዓቢ ነጋዳይ ይብል፦ „ኣቕሓ ዳርጋ የለን።“ ዳግም ክትዝንግዑ ኣለኩም።","Холодный чай (Eistee) из Бремена вдруг появился по всему интернету. Все хотят его. Оптовик говорит: «У меня почти нет товара.» Вам нужно дозаказать.","Un Eistee (té helado) de Bremen aparece de golpe por todo internet. Todos lo quieren. El mayorista dice: «Casi no tengo mercancía.» Tenéis que volver a pedir.","Um Eistee (chá gelado) de Bremen aparece de repente por toda a internet. Todos o querem. O grossista diz: «Quase não tenho mercadoria.» Têm de voltar a encomendar."],"Ist die Nachfrage größer als das Angebot, hat der Verkäufer die starke Position (Verkäufermarkt). Die Preise steigen.":["ጠለብ ካብ ኣቕራቦት እንተበዝሐ እቲ ሻጣይ ሓያል ኩነታት ኣለዎ (Verkäufermarkt)። ዋጋታት ይለዓሉ።","Если спрос больше предложения, у продавца сильная позиция (Verkäufermarkt). Цены растут.","Si la demanda es mayor que la oferta, el vendedor está en posición fuerte (Verkäufermarkt). Los precios suben.","Se a procura for maior do que a oferta, o vendedor tem posição forte (Verkäufermarkt). Os preços sobem."],"Schade. Dafür bin ich nicht an Land gegangen.":["ሕሰም። ንዚ ኣይኮንኩን ናብ ምድሪ ዝወረድኩ።","Жаль. Не ради этого я сошла на берег.","Qué pena. No bajé a tierra para esto.","Que pena. Não foi para isto que desci a terra."],"Der Großhändler liefert an andere Händler, die mehr zahlen. Euer Regal bleibt leer.":["እቲ ዓቢ ነጋዳይ ንካልኦት ዝያዳ ዝኸፍሉ ነጋዶ የብጽሕ። መደርደሪኩም ባዶ ይጸንሕ።","Оптовик поставляет другим торговцам, которые платят больше. Ваш стеллаж остаётся пустым.","El mayorista suministra a otros comerciantes que pagan más. Vuestra estantería se queda vacía.","O grossista fornece a outros comerciantes que pagam mais. A vossa prateleira fica vazia."],"Die Nachfrage ist größer als das Angebot: ein Verkäufermarkt.":["ጥላብ ካብ ኣቕራቦት ይበዝሕ፦ ዕዳጋ ሻጣይ (Verkäufermarkt)።","Спрос больше предложения: рынок продавца (Verkäufermarkt).","La demanda es mayor que la oferta: mercado del vendedor (Verkäufermarkt).","A procura é maior do que a oferta: mercado do vendedor (Verkäufermarkt)."],"Steigt die Nachfrage bei knappem Angebot, steigt der Preis – er fällt nicht.":["ጥላብ እንተበዝሐ ኣቕራቦት እንተውሓደ፣ እቲ ዋጋ ይለዓል — ኣይወርድን።","Если спрос растёт при малом предложении, цена растёт — она не падает.","Si sube la demanda y la oferta es escasa, el precio sube; no baja.","Se a procura aumenta e a oferta é escassa, o preço sobe — não desce."],"Richtig gedacht: Steigt später das Angebot, sinkt der Preis.":["ቅኑዕ ሓሳብ፦ ድሕሪ ግዜ ኣቕራቦት እንተበዝሐ እቲ ዋጋ ይወርድ።","Правильно подумано: Если позже предложение вырастет, цена упадёт.","Bien pensado: Si más tarde sube la oferta, el precio baja.","Bem pensado: Se mais tarde a oferta aumentar, o preço desce."],"falsche Erwartung":["ጌጋ ትጽቢት","неверное ожидание","expectativa errónea","expectativa errada"],"Verkäufermarkt":["Verkäufermarkt (ዕዳጋ ሻጣይ)","Verkäufermarkt (рынок продавца)","Verkäufermarkt (mercado del vendedor)","Verkäufermarkt (mercado do vendedor)"],"Angebot steigt – Preis sinkt":["ኣቕራቦት ይለዓል – ዋጋ ይወርድ","Предложение растёт – Цена падает","La oferta sube – El precio baja","A oferta aumenta – O preço desce"],"Die Begründung: „Die Nachfrage ist größer als das Angebot: ein Verkäufermarkt.“ Der Fachbegriff: Verkäufermarkt.":["እቲ ምኽንያት፦ „እቲ ጥላብ ካብ ኣቕራቦት ይበዝሕ፦ Verkäufermarkt።“ እቲ ቴክኒካዊ ቃል፦ Verkäufermarkt።","Обоснование: «Спрос больше предложения: Verkäufermarkt (рынок продавца).» Термин: Verkäufermarkt.","La justificación: «La demanda es mayor que la oferta: Verkäufermarkt (mercado del vendedor).» El término técnico: Verkäufermarkt.","A justificação: «A procura é maior do que a oferta: Verkäufermarkt (mercado do vendedor).» O termo técnico: Verkäufermarkt."],"Die Stromrechnung":["ሕሳብ ኤለክትሪክ","Счёт за электричество","La factura de la luz","A conta da eletricidade"],"Die Stromrechnung kommt: § € im Monat! Mia schreibt: „Wie grün ist euer Laden eigentlich?“":["ሕሳብ ኤለክትሪክ ይመጽእ፦ § € ኣብ ወርሒ! Mia ትጽሕፍ፦ „ድኳንኩም ብሓቂ ክንደይ ኣረንጓዴ እዩ?“","Приходит счёт за электричество: § € в месяц! Mia пишет: «Насколько ваш магазин на самом деле зелёный?»","Llega la factura de la luz: ¡§ € al mes! Mia escribe: «¿Cuán verde es en realidad vuestra tienda?»","Chega a conta da eletricidade: § € por mês! Mia escreve: «Quão verde é realmente a vossa loja?»"],"Welche Maßnahme startet ihr zuerst?":["ኣየናይ ስጉምቲ መጀመርታ ትጅምሩ?","Какую меру вы начнёте первой?","¿Qué medida empezáis primero?","Que medida começam primeiro?"],"Mehrweg heißt: Die Verpackung wird wieder befüllt – Abfall entsteht gar nicht. Recycling heißt: Das Material wird wiederverwertet.":["Mehrweg ማለት፦ እቲ ማሸጊያ ዳግም ይመልእ – ቆሻሻ ጥራይ ኣይፍጠርን። Recycling ማለት፦ እቲ ነገር ዳግም ይጥቀም።","Mehrweg означает: Упаковку наполняют снова – Отходы вообще не возникают. Recycling означает: Материал используется повторно.","Mehrweg significa: El envase se vuelve a llenar – Los residuos ni siquiera se producen. Recycling significa: El material se reutiliza.","Mehrweg significa: A embalagem volta a ser enchida – Os resíduos nem sequer surgem. Recycling significa: O material é reaproveitado."],"LED-Lampen statt Halogen und Glasdeckel für die Kühltruhen":["LED መብራህቲ ብክንዲ Halogen ከምኡ ድማ ብርጭቆ ክዳን ንቀዛሕቲ","LED-лампы вместо галогеновых и стеклянные крышки для морозильных ларей","Lámparas LED en vez de halógenas y tapas de cristal para los congeladores","Lâmpadas LED em vez de halogéneo e tampas de vidro para as arcas congeladoras"],"Regionale Waren aus dem Bremer Umland mit kurzen Transportwegen":["ክልል ኣቕሑት ካብ ከባቢ Bremen ምስ ሓጺር መገዲ ምጽዋዕ","Региональные товары из окрестностей Бремена с короткими путями доставки","Productos regionales de los ስ።","Экономия энергии бережёт окружающую среду (Ökologie) и снижает расходы.","Ahorrar energía cuida el medio ambiente (Ökologie) y reduce los costes.","Poupar energia protege o ambiente (Ökologie) e reduz os custos."],"ökologische Nachhaltigkeit":["ኢኮሎጂያዊ ዘላቒነት (ökologische Nachhaltigkeit)","экологическая устойчивость (ökologische Nachhaltigkeit)","sostenibilidad ecológica (ökologische Nachhaltigkeit)","sustentabilidade ecológica (ökologische Nachhaltigkeit)"],"Energieverschwendung":["ምባኽናን ሓይሊ (Energieverschwendung)","расточительство энергии (Energieverschwendung)","derroche de energía (Energieverschwendung)","desperdício de energia (Energieverschwendung)"],"umweltfreundliches Sortiment":["ምርጫ ዘይጎድእ ከባቢ (umweltfreundliches Sortiment)","экологичный ассортимент (umweltfreundliches Sortiment)","surtido respetuoso con el medio ambiente (umweltfreundliches Sortiment)","sortimento amigo do ambiente (umweltfreundliches Sortiment)"],"Die Begründung: „Umweltfreundliche, langlebige und reparierbare Waren in den Mittelpunkt stellen – eine Maßnahme im Sortiment.“ Der Fachbegriff: umweltfreundliches Sortiment.":["እቲ ምኽንያት፦ „ኣቕሑት ዘይጎድኡ ከባቢ፣ ነዊሕ ዝጸንሑን ዝጽገኑን ኣብ ማእከል ምቕማጥ — ስጉምቲ ኣብ Sortiment።“ እቲ ቴክኒካዊ ቃል፦ umweltfreundliches Sortiment (ምርጫ ዘይጎድእ ከባቢ)።","Обоснование: «Ставить в центр экологичные, долговечные и ремонтопригодные товары — мера в ассортименте.» Термин: umweltfreundliches Sortiment (экологичный ассортимент).","La justificación: «Poner en el centro productos ecológicos, duraderos y reparables: una medida en el surtido.» El término técnico: umweltfreundliches Sortiment (surtido respetuoso con el medio ambiente).","A justificação: «Pôr no centro produtos ecológicos, duradouros e reparáveis — uma medida no sortimento.» O termo técnico: umweltfreundliches Sortiment (sortimento amigo do ambiente)."],"„Lasst uns die Preise absprechen. Wir verlangen beide das Doppelte. Dann verdienen wir beide mehr!“":["„ዋጋታት ንሰማማዕ። ክልትና ዕጽፊ ንሓትት። ሽዑ ክልትና ዝያዳ ንረክብ!“","„Давайте договоримся о ценах. Мы оба просим вдвое больше. Тогда мы оба заработаем больше!“","„Pongámonos de acuerdo en los precios. Los dos pedimos el doble. ¡Así los dos ganamos más!“","„Vamos combinar os preços. Ambos pedimos o dobro. Assim os dois ganhamos mais!“"],"Ablehnen, weil der Staat die Preise festlegt.":["ኣይፋል በሉ፣ ምኽንያቱ መንግስቲ ዋጋ ይውስን።","Отказаться, потому что цены устанавливает государство.","Rechazar, porque el Estado fija los precios.","Recusar, porque o Estado fixa os preços."],"Ablehnen, weil sich der Marktpreis aus Angebot und Nachfrage bildet. Absprachen sind verboten.":["ኣይፋል በሉ፣ ምኽንያቱ እቲ ዋጋ ዕዳጋ (Marktpreis) ካብ ኣቕራቦትን ጥላብን ይፈጠር። ስምምዕ ዋጋ ክልኩል እዩ።","Отказаться, потому что рыночная цена (Marktpreis) формируется из предложения и спроса. Договорённости о ценах запрещены.","Rechazar, porque el precio de mercado (Marktpreis) se forma con la oferta y la demanda. Los acuerdos de precios están prohibidos.","Recusar, porque o preço de mercado (Marktpreis) se forma com a oferta e a procura. Os acordos de preços são proibidos."],"Annehmen. Mehr Geld für alle.":["ተቐበሉ። ዝያዳ ገንዘብ ንኹሉ።","Принять. Больше денег для всех.","Aceptar. Más dinero para todos.","Aceitar. Mais dinheiro para todos."],"Richtig abgelehnt – aber falsch begründet. Der Staat legt Marktpreise nicht fest.":["ቅኑዕ ኣይፋል በሉ – ግን ምኽንያት ጌጋ። እቲ መንግስቲ ዋጋ ዕዳጋ ኣይውስንን።","Верно отказались – но обоснование неверное. Государство не устанавливает рыночные цены.","Rechazado correctamente – pero la justificación es incorrecta. El Estado no fija los precios de mercado.","Recusado corretamente – mas a justificação está errada. O Estado não fixa os preços de mercado."],"Der Marktpreis bildet sich auf dem freien Markt im Zusammenspiel von Angebot und Nachfrage. Wettbewerber dürfen Preise nicht absprechen.":["እቲ Marktpreis ኣብ ናጻ ዕዳጋ ብምትሕብባር ኣቕራቦትን ጥላብን ይፍጠር። ተወዳደርቲ ዋጋ ክሰማምዑ ኣይፍቀዶምን።","Рыночная цена (Marktpreis) формируется на свободном рынке во взаимодействии предложения и спроса. Конкуренты не имеют права договариваться о ценах.","El Marktpreis (precio de mercado) se forma en el mercado libre por la interacción de oferta y demanda. Los competidores no pueden pactar los precios.","O Marktpreis (preço de mercado) forma-se no mercado livre pela interação entre oferta e procura. Os concorrentes não podem combinar os preços."],"Krolls Outlet":["Outlet ናይ Kroll","Аутлет Kroll","El outlet de Kroll","O outlet de Kroll"],"Schock am Montag: Baltus Kroll eröffnet in der alten Hafenhalle ein Fabrik-Outlet. Ein einziger Hersteller verkauft dort direkt. Kroll grinst: „Wozu braucht man noch Läden wie euren?“":["ሃንደበት ስቕታ ሰኑይ፦ Baltus Kroll ኣብ ሓዲሽ ኣዳራሽ ወደብ Fabrik-Outlet ይኸፍት። ሓደ ጥራይ ኣምራቲ ኣብኡ ብቐጥታ ይሸጥ። Kroll ይምጭጭ፦ „ንምንታይ እንታይ ድኳናት ከምኡ ዝበሉ ይድልዩ ኮይኑ?“","Шок в понедельник: Baltus Kroll открывает в старом портовом ангаре фабричный аутлет (Fabrik-Outlet). Там продаёт напрямую всего один производитель. Kroll ухмыляется: «Зачем вообще ещё нужны такие магазины, как ваш?»","Sorpresa el lunes: Baltus Kroll abre un outlet de fábrica (Fabrik-Outlet) en el viejo almacén del puerto. Allí vende directamente un único fabricante. Kroll sonríe con sorna: «¿Para qué hacen falta todavía tiendas como la vuestra?»","Choque na segunda-feira: Baltus Kroll abre um outlet de fábrica (Fabrik-Outlet) no velho armazém do porto. Lá vende diretamente um único fabricante. Kroll sorri com malícia: «Para que servem ainda lojas como a vossa?»"],"Womit zeigt ihr, was ein Einzelhändler mehr kann?":["ብምንታይ ትርእዩ እቲ ንእሽተይ ነጋዳይ (Einzelhändler) ዝያዳ ክገብር ከም ዝኽእል?","Чем вы покажете, что розничный торговец (Einzelhändler) умеет больше?","¿Con qué mostráis que un minorista (Einzelhändler) puede más?","Com que mostram que um retalhista (Einzelhändler) consegue mais?"],"Ihr verkauft nur noch Großpackungen und ganze Kartons":["ሕጂ ዓበይቲ ፓኬታትን ምሉእ ካርቶናትን ጥራይ ትሸጡ","Вы продаёте теперь только большие упаковки и целые коробки","Ahora vendéis solo envases grandes y cajas enteras","Agora só vendem embalagens grandes e caixas inteiras"],"Große Auswahl von vielen Herstellern an ei  compra."],"Mengenausgleich (falsch verstanden)":["Mengenausgleich (ጌጋ ተረዲኡ)","Mengenausgleich (неправильно понято)","Mengenausgleich (mal entendido)","Mengenausgleich (mal entendido)"],"Sortimentsbildung und Beratung":["ምዕዳል ምርጫን ምኽርን (Sortimentsbildung und Beratung)","Формирование ассортимента и консультация (Sortimentsbildung und Beratung)","Formación del surtido y asesoramiento (Sortimentsbildung und Beratung)","Formação do sortimento e aconselhamento (Sortimentsbildung und Beratung)"],"Die Begründung: „Lieferung und Umtausch sind Service – zusätzliche Leistungen rund um den Kauf.“ Der Fachbegriff: Service (Kundendienst).":["እቲ ምኽንያት፦ „ምብጻሕን ምልውጥን ኣገልግሎት (Service) እዩ — ብዛዕባ ግዢ ተወሳኺ ዕዮታት።“ እቲ ቴክኒካዊ ቃል፦ Service (ኣገልግሎት ዓሚል)።","Обоснование: «Доставка и обмен — это сервис (Service): дополнительные услуги вокруг покупки.» Термин: Service (сервис для клиентов).","La justificación: «La entrega y el cambio son servicio (Service): prestaciones adicionales en torno a la compra.» El término técnico: Service (servicio al cliente).","A justificação: «A entrega e a troca são serviço (Service): prestações adicionais à volta da compra.» O termo técnico: Service (serviço ao cliente)."],"Das Sortiment":["እቲ ምርጫ ኣቕሑት (Sortiment)","Ассортимент (Sortiment)","El surtido (Sortiment)","O sortimento (Sortiment)"],"Frau Ahlers will einen Sortimentsplan sehen. „Euer Laden hat nur § Quadratmeter“, sagt sie. „Was wollt ihr dort anbieten?“":["Frau Ahlers መደብ ምርጫ ኣቕሑት (Sortimentsplan) ክትርኢ ትደሊ። „ድኳንኩም § ካሬ ሜትሮ ጥራይ ኣለዎ“ ትብል። „እንታይ ኣብኡ ክትህቡ ትደልዩ?“","Frau Ahlers хочет увидеть план ассортимента (Sortimentsplan). «В вашем магазине всего § квадратных метров», — говорит она. «Что вы там хотите предложить?»","Frau Ahlers quiere ver un plan de surtido (Sortimentsplan). «Vuestra tienda solo tiene § metros cuadrados», dice. «¿Qué queréis ofrecer ahí?»","Frau Ahlers quer ver um plano de sortimento (Sortimentsplan). «A vossa loja tem só § metros quadrados», diz ela. «O que querem oferecer lá?»"],"Welches "],"Ablehnen, weil im Gewerbegebiet nur Fabriken erlaubt sind.":["ኣይፋል በሉ፣ ምኽንያቱ ኣብ ዞባ ኢንዱስትሪ ፋብሪካታት ጥራይ ይፍቀዱ።","Отказаться, потому что в промзоне разрешены только фабрики.","Rechazar, porque en el polígono industrial solo se permiten fábricas.","Recusar, porque na zona industrial só são permitidas fábricas."],"Ablehnen, weil uns die Kunden dort schlecht erreichen. Erreichbarkeit ist wichtiger als die Miete.":["ኣይፋል በሉ፣ ምኽንያቱ ዓማዊልና ኣብኡ ብጽቡቕ ኣይበጽሑን። ምብጻሕ ካብ ክራይ ዝያዳ ኣገዳሲ እዩ።","Отказаться, потому что клиентам там трудно до нас добраться. Доступность важнее аренды.","Rechazar, porque a los clientes les resulta difícil llegar allí. La accesibilidad es más importante que el alquiler.","Recusar, porque os clientes têm dificuldade em chegar lá. A acessibilidade é mais importante do que a renda."],"Annehmen. Keine Miete – super!":["ተቐበሉ። ክራይ የለን – ብሉጽ!","Принять. Без аренды – супер!","Aceptar. Sin alquiler – ¡genial!","Aceitar. Sem renda – ótimo!"],"Ihr bleibt am Hafen. Kroll tobt.":["ኣብ ወደብ ትጸንሑ። Kroll ይሓርቕ።","Вы остаётесь в порту. Kroll бушует.","Os quedáis en el puerto. Kroll se enfurece.","Ficam no porto. Kroll enfurece-se."],"Für einen Laden ist die Erreichbarkeit für Kunden der wichtigste Standortfaktor. Eine niedrige Miete hilft nichts ohne Kunden.":["ንሓደ ድኳን ምብጻሕ ንዓማዊል እቲ ዝዓበየ Standortfaktor እዩ። ትሑት ክራይ ብዘይ ዓማዊል ዋላ ሓንቲ ኣይሕግዝን።","Для магазина доступность для клиентов — самый важный фактор местоположения (Standortfaktor). Низкая аренда без клиентов ничем не поможет.","Para una tienda, la accesibilidad para los clientes es el factor de ubicación (Standortfaktor) más importante. Un alquiler bajo no sirve de nada sin clientes.","Para uma loja, a acessibilidade para os clientes é o fator de localização (Standortfaktor) mais importante. Uma renda baixa não adianta nada sem clientes."],"Ware für jeden Tag":["ኣቕሓ ንነፍሲ ወከፍ መዓልቲ","Товар на каждый день","Mercancía de todos los días","Mercadoria do dia a dia"],"Ihr räumt die Ware für jeden Tag ein: Nudeln, Milch und Konserven.":["ኣቕሑት ንነፍሲ ወከፍ መዓልቲ ተደልድሉ፦ ፓስታ፣ ጸባን ቆርቆሮ ምግብን።","Вы раскладываете товар на каждый день: макароны, молоко и консервы.","Colocáis la mercancía de todos los días: pasta, leche y conservas.","Arrumam a mercadoria do dia a dia: massa, leite e conservas."],"Vorwahl: Die Ware liegt offen, ihr beratet auf Wunsch.":["Vorwahl (ቅድሚ ምምራጽ)፦ እቲ ኣቕሓ ክፉት እዩ፣ ብድሌት ትመኽሩ።","Vorwahl (предварительный выбор): Товар лежит открыто, вы консультируете по желанию.","Vorwahl (preselección): La mercancía está a la vista y asesoráis si se pide.","Vorwahl (pré-seleção): A mercadoria está à vista e aconselham se for pedido."],"Bedienung: Jede Packung holt ihr hinter der Theke hervor.":["Bedienung (ኣገልግሎት ብሰራሕተኛ)፦ ነፍሲ ወከፍ ፓኬት ካብ ድሕሪ ጠረጴዛ ትኣቱ።","Bedienung (обслуживание продавцом): Каждую упаковку вы достаёте из-за прилавка.","Bedienung (atención personalizada): Sacáis cada paquete de detrás del mostrador.","Bedienung (atendimento ao balcão): Tiram cada embalagem de trás do balcão."],"Klappt – aber kaum jemand braucht hier Beratung.":["ይሰርሕ – ግን ኣብዚ ሓደ እኳ ምኽሪ ኣየድልዮን።","Получается – но здесь консультация почти никому не нужна.","Funciona – pero aquí casi nadie necesita asesoramiento.","Funciona – mas aqui quase ninguém precisa de aconselhamento."],"Vorwahl geht, ist hier aber nicht nötig.":["Vorwahl ይከኣል፣ ግን ኣብዚ ኣየድልን።","Vorwahl возможна, но здесь не нужна.","La Vorwahl es posible, pero aquí no hace falta.","A Vorwahl é possível, mas aqui não é necessária."],"Bedienung passt zu teurer, erklärungsbedürftiger oder diebstahlgefährdeter Ware.":["Bedienung ንክቡር፣ ምግላጽ ዘድልዮ ወይ ብስርቂ ዝተጋልጸ ኣቕሓ ይሰማማዕ።","Bedienung подходит для дорогого товара, требующего объяснений, или товара с риском кражи.","La Bedienung encaja con mercancía cara, que necesita explicación o con riesgo de robo.","A Bedienung serve para mercadoria cara, que precisa de explicação ou com risco de furto."],"Einfache Ware für jeden Tag braucht keine Beratung.":["ቀሊል ኣቕሓ ንነፍሲ ወከፍ መዓልቲ ምኽሪ ኣየድልዮን።","Простому товару на каждый день консультация не нужна.","La mercancía sencilla de todos los días no necesita asesoramiento.","A mercadoria simples do dia a dia não precisa de aconselhamento."],"Bedienung (passt hier nicht)":["Bedienung (ኣብዚ ኣይሰማማዕን)","Bedienung (здесь не подходит)","Bedienung (aquí no encaja)","Bedienung (aqui não serve)"],"Die Begründung: „Vorwahl geht, ist hier aber nicht nötig.“ Der Fachbegriff: Vorwahl.":["እቲ ምኽንያት፦ „Vorwahl ይከኣል፣ ግን ኣብዚ ኣየድልን።“ እቲ ቴክኒካዊ ቃል፦ Vorwahl።","Обоснование: «Vorwahl возможна, но здесь не нужна.» Термин: Vorwahl.","La justificación: «La Vorwahl es posible, pero aquí no hace falta.» El término técnico: Vorwahl.","A justificação: «A Vorwahl é possível, mas aqui não é necessária.» O termo técnico: Vorwahl."],"Was wollt ihr erreichen?":["እንታይ ክትበጽሑ ትደልዩ?","Чего вы хотите достичь?","¿Qué queréis conseguir?","O que querem alcançar?"],"Der Monat lief gut. Ihr habt etwas Geld übrig. Jonas fragt: „Bekommen wir jetzt ein Jobticket?“ Frau Ahlers fragt: „Und was ist mit dem Gewinn?“":["እቲ ወርሒ ጽቡቕ ነይሩ። ገለ ገንዘብ ተሪፉኩም። Jonas ይሓትት፦ „ሕጂ Jobticket ንረክብ ዶ?“ Frau Ahlers ትሓትት፦ „ኣብ ትርፊ እንታይ ኣሎ?“","Месяц прошёл хорошо. У вас остались деньги. Jonas спрашивает: «Мы теперь получим Jobticket (проездной от работодателя)?» Frau Ahlers спрашивает: «А как насчёт прибыли?»","El mes fue bien. Os ha sobrado algo de dinero. Jonas pregunta: «¿Ahora nos dan un Jobticket (abono de transporte)?» Frau Ahlers pregunta: «¿Y qué pasa con el beneficio?»","O mês correu bem. Sobrou-vos algum dinheiro. Jonas pergunta: «Agora vamos ter um Jobticket (passe de transporte)?» Frau Ahlers pergunta: «E o lucro?»"],"Wofür setzt ihr das Geld ein?":["ንምንታይ ገንዘብ ትጥቀሙ?","На что вы потратите деньги?","¿En qué usáis el dinero?","Para que usam o dinheiro?"],"LED-Lampen statt Halogen im ganzen Laden":["ኣብ ዘሎ ድኳን LED መብራህቲ ብክንዲ Halogen","Светодиодные (LED) лампы вместо галогеновых во всём магазине","Lámparas LED en lugar de halógenas en toda la tienda","Lâmpadas LED em vez de halogéneo em toda a loja"],"Nichts ausgeben – alles bleibt a
