  --bg:#0c1615; --panel:#13211f; --panel2:#192b28; --ink:#e4ecea; --muted:#9db1ad; --line:#28403b;

  --f-mono:"Courier Prime", "Courier New", ui-monospace, monospace;
  color-scheme:dark;
}

:root[data-theme="light"]{
  --bg:#e3ebe8; --panel:#f6f9f7; --panel2:#eaf1ee; --ink:#132320; --muted:#4a605b; --line:#c3d2cd;
  --lamp:#a35a06; --lamp-ink:#fff7ea; --brick:#9e3f22; --ok:#1b7450; --bad:#b03a28; --paper:#f3ead2; --paper-ink:#2a2216; --tide1:#2a6b75; --tide2:#5aaab1; color-scheme:light }
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:12px 40px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:.02em;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:2.1rem} h2{font-size:1.6rem} h3{font-size:1.2rem}
p{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.scene{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#0a1318;position:relative}
.scene svg{display:block;width:100%;height:auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.story{font-size:1.02rem}
.story em{font-style:italic;color:var(--lamp)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:14px 18px;min-height:52px;font-weight:700;background:var(--lamp);color:var(--lamp-ink);font-size:1.05rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{min-height:40px;padding:8px 12px;font-size:.92rem}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.mode:focus-visible,input:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.grow{flex:1 1 auto}
label.lab{font-weight:700;font-size:.95rem}
input[type=text],input[type=number],input.num{width:100%;font:inherit;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);min-height:50px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.mode svg{width:42px;height:42px}
.mode b{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:.03em}
.mode small{color:var(--muted);font-size:.88rem;line-height:1.35}
.mode[aria-pressed="true"]{border-color:var(--lamp);box-shadow:0 0 0 3px color-mix(in srgb,var(--lamp) 25%,transparent)}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lamp)}
.chips{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.secs{display:flex;flex-wrap:wrap;gap:6px}
.sec{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;min-height:38px;font-size:.88rem}
.sec[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp)}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:10px;min-height:46px;font-weight:700;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--lamp);color:var(--lamp-ink);border-color:var(--lamp)}
.hud{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:.9rem}
.fog{height:10px;border-radius:6px;background:var(--line);overflow:hidden;position:relative}
.fog i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--tide1),var(--tide2));transition:width .6s}
.letters{display:flex;gap:3px;font-family:var(--f-mono);font-weight:700;font-size:1.05rem;flex-wrap:wrap}
.letters span{width:19px;height:27px;font-size:.95rem;display:grid;place-items:center;border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.letters span.clear{background:var(--paper);color:var(--paper-ink);border-color:var(--lamp)}
.letters span.misty{color:var(--muted);font-style:italic;opacity:.75}
.who{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start}
.who svg{width:92px;height:auto}
.bubble{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;position:relative;min-width:0}
.bubble:before{content:"";position:absolute;left:-8px;top:22px;border:8px solid transparent;border-left:0;border-right-color:var(--line)}
.bubble .name{font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.q{font-weight:700;font-size:1.08rem}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:12px;min-height:52px}
.opt .k{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:700;font-size:.9rem}
.opt[aria-pressed="true"]{border-color:var(--lamp)}
.opt[aria-pressed="true"] .k{background:var(--lamp);color:var(--lamp-ink)}
.opt.right{border-color:var(--ok)} .opt.right .k{background:var(--ok);color:#06150f}
.opt.wrong{border-color:var(--bad)} .opt.wrong .k{background:var(--bad);color:#1d0703}
.opt.gone{opacity:.25;text-decoration:line-through}
.opt:disabled{cursor:default}
.feedback{border-radius:14px;padding:14px;border:2px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.feedback.good{border-color:var(--ok)} .feedback.badf{border-color:var(--bad)}
.verdict{font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:.03em}
.verdict.good{color:var(--ok)} .verdict.badf{color:var(--bad)}
.react{font-style:italic;color:var(--muted)}
.term{background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:12px;font-size:.95rem;display:flex;flex-direction:column;gap:4px}
.term .t{font-family:var(--f-mono);font-weight:700;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase}
.ledger{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:18px 16px;font-family:var(--f-book);font-size:1.15rem;position:relative;box-shadow:inset 0 0 40px rgba(120,90,40,.25)}
.ledger .big{font-family:var(--f-mono);font-size:3rem;font-weight:700;line-height:1;color:#7a2e1c}
.ledger .date{font-family:var(--f-mono);font-size:.8rem;opacity:.7}
.word{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.word span{width:24px;height:36px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:1.4rem;border-bottom:3px solid var(--lamp)}
.word span.misty{opacity:.4}
.card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:2px solid var(--lamp);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:center}
.stars{display:flex;justify-content:center;gap:6px}
.stars svg{width:34px;height:34px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-variant-numeric:tabular-nums}
.kpis div{background:var(--panel2);border-radius:10px;padding:8px}
.kpis b{display:block;font-size:1.3rem}
.review{display:flex;flex-direction:column;gap:10px}
.rv{border-left:4px solid var(--line);padding:6px 0 6px 12px;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.rv.ok{border-color:var(--ok)} .rv.half{border-color:var(--lamp)} .rv.no{border-color:var(--bad)}
.rv .mk{font-weight:700}
.rv .ihk{font-size:.9rem;background:var(--panel2);border-radius:8px;padding:8px}
details{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
summary{cursor:pointer;font-weight:700}
.notice{font-size:.9rem;background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px}
.topbtns{display:flex;justify-content:space-between;gap:8px;align-items:center}
.icon-btn{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 10px;min-height:40px;font-size:.88rem}
.icon-btn svg{width:18px;height:18px}
.rechen{font-family:var(--f-mono);font-size:.95rem}
.roles{display:flex;gap:8px;flex-wrap:wrap;font-size:.9rem}
.roles span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--panel2)}
.roles span.on{border-color:var(--lamp);color:var(--lamp);font-weight:700}
.boat{font-size:.9rem;color:var(--brick)}
.pic{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#1b2523;max-width:600px;width:100%;margin:0 auto}
.pic svg{display:block;width:100%;height:auto}
.pic .hs{cursor:pointer}
.pic .hs:focus-visible{outline:none}
.pic .hs:focus-visible circle.ring{stroke:var(--lamp);stroke-width:4;stroke-dasharray:none;opacity:1}
.found{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.found div{border-left:4px solid var(--ok);padding:4px 0 4px 10px}
.found div.no{border-color:var(--bad)}
.timer{font-family:var(--f-display);font-weight:800;font-size:2.4rem;letter-spacing:.04em;font-variant-numeric:tabular-nums;line-height:1}
.duelq{font-family:var(--f-mono);font-size:1.05rem;background:var(--panel2);border-radius:10px;padding:12px}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.toggle input{width:22px;height:22px;flex:none;margin-top:2px}
@keyframes drift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
@keyframes beam{0%{opacity:.0}10%{opacity:.9}40%{opacity:.0}100%{opacity:0}}
@keyframes flick{0%,100%{opacity:1}45%{opacity:1}47%{opacity:.35}49%{opacity:1}72%{opacity:.6}74%{opacity:1}}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.fogl{animation:drift 14s ease-in-out infinite alternate}
.fogl.b{animation-duration:19s;animation-direction:alternate-reverse}
.beam{animation:beam 6s linear infinite}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(2.5px)}}
.bob{animation:bob 2.6s ease-in-out infinite alternate}
.wave{animation:drift 9s ease-in-out infinite alternate}
.flick{animation:flick 6s infinite}
.appear{animation:rise .45s ease-out}
@media (prefers-reduced-motion: reduce){.fogl,.beam,.flick,.appear,.bob,.wave{animation:none}}
@media (max-width:420px){ .word{gap:3px} .word span{width:20px;font-size:1.05rem} h1{font-size:1.8rem} .who{grid-template-columns:70px 1fr} .who svg{width:70px} .chips{grid-template-columns:repeat(7,1fr);gap:5px} .chip{min-height:42px;font-size:.92rem} }
</style>

 term:"Zugang beim falschen Artikel",ihk:"Wird ein Zugang beim falschen Artikel erfasst, sind die Sollbestände beider Artikel falsch."},
{id:"p2-3",ch:2,m:"p",k:"mc",s:"IHK-Stil: Welches Verhalten bei der Wareneingangskontrolle ist richtig?",q:"Wähle.",
 o:[["Bei der Feinkontrolle prüfe ich, ob Menge, Art und Beschaffenheit der Bestellung entsprechen.",1],["Abweichungen zwischen Bestellung und Lieferung werden erfasst, aber nicht gerügt.",0],["Die gelieferte Ware wird als Mindestbestand im WWS erfasst.",0],["Nicht bestellte Ware wird ohne Rücksprache sofort zurückgeschickt.",0]],
 why:"Feinkontrolle = innere Prüfung von Menge, Art und Beschaffenheit. Abweichungen werden gerügt.",
 term:"Feinkontrolle",ihk:"Ich kontrolliere bei der Feinkontrolle, ob Menge, Art und Beschaffenheit der Ware der Bestellung entsprechen (IHK S 2017 Aufg. 10)."},
{id:"p2-4",ch:2,m:"p",k:"mcb",s:"Die Seefunkgeräte sind in Ordnung. Du nimmst sie an.",q:"Was erklärst du damit rechtlich?",
 o:[["Die vertragsgemäße Erfüllung des Kaufvertrags",1],["Den Rücktritt vom Vertrag",0],["Den Abschluss eines neuen Kaufvertrags",0]],
 b:{q:"Welche Pflicht des Käufers ist das?",o:[["Die Abnahmepflicht: Der Käufer nimmt die mangelfreie Ware ab.",1],["Die Rügepflicht.",0],["Die Lieferpflicht.",0]]},
 why:"Wer mangelfreie Ware annimmt, erfüllt seine Abnahmepflicht und bestätigt die vertragsgemäße Lieferung.",
 term:"Erfüllung des Kaufvertrags",ihk:"Mit der Annahme mangelfreier Ware erklärt der Käufer die vertragsgemäße Erfüllung des Kaufvertrags."},
{id:"p2-5",ch:2,m:"p",k:"mcb",s:"Auf der Rechnung steht ein Stückpreis von 89 €. Vereinbart waren 79 €.",q:"Welche Prüfung deckt das auf?",
 o:[["Die sachliche Rechnungsprüfung",1],["Die rechnerische Rechnungsprüfung",0],["Die äußere Prüfung",0]],
 b:{q:"Was wird bei der sachlichen Prüfung kontrolliert?",o:[["Ob Ware, Menge und Preise mit Bestellung und Lieferschein übereinstimmen.",1],["Ob Summen und Umsatzsteuer richtig gerechnet sind.",0],["Ob der Karton beschädigt ist.",0]]},
 why:"Sachlich: Stimmen Ware, Menge, Preis und Bedingungen? Rechnerisch: Stimmt die Rechnung mathematisch?",
 term:"sachliche Rechnungsprüfung",ihk:"Bei der sachlichen Prüfung vergleiche ich die Rechnung mit Bestellung und Lieferschein (Ware, Menge, Preis)."},

// ===== Kapitel 3 – Mängel und Rügepflicht =====
{id:"a3-1",ch:3,m:"a",k:"mc",s:"Kröger: „Ihr müsst unverzüglich prüfen. Was heißt das überhaupt?“",q:"Was bedeutet „unverzüglich“?",
 o:[["ohne schuldhaftes Zögern",1],["innerhalb von 2 Tagen",0],["spätestens bei der Auszeichnung",0]],
 why:"Unverzüglich heißt: so schnell, wie es im normalen Betrieb möglich ist – ohne schuldhaftes Zögern. Es gibt keine feste Zahl von Tagen.",
 term:"unverzüglich",ihk:"Die Ware muss ohne schuldhaftes Verzögern überprüft werden."},
{id:"a3-2",ch:3,m:"a",k:"mc",s:"Statt 50 Seenotfackeln sind nur 45 in der Kiste.",q:"Welcher Mangel ist das?",
 o:[["Mangel in der Menge",1],["Mangel in der Art",0],["Mangel in der Güte",0]],
 why:"Es fehlt etwas: zu wenig geliefert. Das ist ein Mangel in der Menge.",
 term:"Mangel in der Menge",ihk:"Statt 50 Flaschen wurden 45 geliefert: Mangel in der Menge."},
{id:"a3-3",ch:3,m:"a",k:"mc",s:"Statt Schiffslampen sind Fahrradlampen in der Kiste.",q:"Welcher Mangel ist das?",
 o:[["Mangel in der Art (Falschlieferung)",1],["Mangel in der Menge",0],["kein Mangel",0]],
 why:"Es kam eine andere Ware als bestellt: Mangel in der Art, auch Falschlieferung genannt.",
 term:"Mangel in der Art",ihk:"Wird eine andere Ware geliefert, liegt ein Mangel in der Art (Falschlieferung) vor."},
{id:"a3-4",ch:3,m:"a",k:"mc",s:"Welcher Mangel ist versteckt?",q:"Wähle.",
 o:[["Dosenproviant ist innen verdorben.",1],["Ein Spiegel hat einen Sprung.",0],["Es fehlen 5 Flaschen.",0]],
 why:"Versteckt ist ein Mangel, den man beim Prüfen nicht sehen kann. Einen Sprung oder fehlende Flaschen sieht man sofort.",
 term:"versteckter Mangel",ihk:"Ein versteckter Mangel ist bei der Prüfung nicht erkennbar (z. B. Konserven innen verdorben)."},
{id:"a3-5",ch:3,m:"a",k:"mc",s:"Was passiert, wenn ihr die Rügefrist verpasst?",q:"Wähle.",
 o:[["Ihr verliert eure Rechte aus der mangelhaften Lieferung.",1],["Die Frist verlängert sich automatisch.",0],["Der Lieferer muss Strafe zahlen.",0]],
 why:"Beim Handelskauf gilt: Wer zu spät rügt, verliert seine Rechte gegenüber dem Lieferer.",
 term:"Folgen der verspäteten Rüge",ihk:"Wird die Rügefrist versäumt, verliert der Käufer seine Rechte aus der mangelhaften Lieferung."},
{id:"a3-6",ch:3,m:"a",k:"rede",s:"Du rufst Kröger an, um die gerissenen Lampengläser zu rügen.",q:"Was sagst du?",
 o:[["„Guten Tag, Herr Kröger. In Ihrer Lieferung vom Montag haben zwei Schiffslampen Risse im Glas. Wir rügen diesen Mangel und bitten um Ersatz.“",1],["„Ihre Lampen sind Schrott. Holen Sie den Müll ab!“",0],["„Ach, zwei Lampen sind kaputt. Ist nicht so schlimm.“",0]],
 why:"Eine Rüge ist sachlich und genau: Welche Lieferung? Welcher Mangel? Was wollt ihr? Freundlich bleiben.",
 term:"Mängelrüge",ihk:"Den Mangel teile ich dem Lieferer unverzüglich und genau beschrieben mit (Mängelrüge)."},
{id:"p3-1",ch:3,m:"p",k:"mcb",s:"4 Wochen nach der Lieferung merkt ihr: Einige Rucksäcke für die Seenotretter haben einen versteckten Mangel. Ihr rügt sofort.",q:"Habt ihr die Rügefrist eingehalten?",
 o:[["Ja.",1],["Nein.",0],["Nur, wenn der Lieferer zustimmt.",0]],
 b:{q:"Warum?",o:[["Versteckte Mängel müssen unverzüglich nach Entdeckung, spätestens innerhalb von 2 Jahren gerügt werden.",1],["Versteckte Mängel müssen innerhalb von 2 Wochen nach Lieferung gerügt werden.",0],["Beim Handelskauf gilt keine Rügefrist.",0]]},
 why:"Kommt in 6 von 19 Prüfungen fast wortgleich vor. Entscheidend: unverzüglich nach Entdeckung.",
 term:"Rügefrist versteckter Mangel",ihk:"Ja, weil versteckte Mängel unverzüglich nach Entdeckung, spätestens innerhalb von 2 Jahren gerügt werden müssen."},
{id:"p3-2",ch:3,m:"p",k:"mcb",s:"Eine Privatkundin bringt nach 3 Wochen eine Tasse mit Sprung zurück.",q:"Gilt für sie die unverzügliche Rügepflicht?",
 o:[["Nein.",1],["Ja, auch Kunden müssen unverzüglich rügen.",0],["Ja, nach 2 Wochen ist es zu spät.",0]],
 b:{q:"Warum nicht?",o:[["Die unverzügliche Rügepflicht (§ 377 HGB) gilt nur beim zweiseitigen Handelskauf, also zwischen zwei Kaufleuten.",1],["Weil Tassen keine Gewährleistung haben.",0],["Weil die Kundin den Bon vergessen hat.",0]]},
 why:"Privatkundin + Händler = Verbrauchsgüterkauf. Dort gelten 2 Jahre Gewährleistung (LF 10). Der WiSo-Teil nutzt das gern als Ablenker.",
 term:"§ 377 HGB nur Handelskauf",ihk:"Die unverzügliche Rügepflicht gilt nur beim zweiseitigen Handelskauf."},
{id:"p3-3",ch:3,m:"p",k:"mc",s:"Der Keramik-Großhandel schickt euch 200 Vasen als „Sonderangebot“. Ihr habt nichts bestellt und braucht sie nicht.",q:"Wie verhaltet ihr euch richtig?",
 o:[["Mitteilen, dass ihr die Vasen nicht benötigt, und sie zur Abholung bereitstellen.",1],["Annehmen, weil langjährige Geschäftsbeziehungen bestehen.",0],["Behalten, aber nicht bezahlen.",0],["Eine Vertragsstrafe androhen.",0]],
 why:"Unbestellte Ware muss man nicht bezahlen. Man darf sie aber auch nicht einfach behalten oder wegwerfen: mitteilen und zur Abholung bereitstellen.",
 term:"unbestellte Ware",ihk:"Ich teile dem Lieferer mit, dass ich die Ware nicht benötige, und stelle sie zur Abholung bereit (IHK S 2021, S 2025)."},
{id:"p3-4",ch:3,m:"p",k:"mcb",s:"Der Lieferer wusste, dass die Rettungsringe einen Materialfehler haben, und hat es verschwiegen.",q:"Welche Mängelart ist das?",
 o:[["arglistig verschwiegener Mangel",1],["offener Mangel",0],["Mangel in der Menge",0]],
 b:{q:"Was ist das Besondere daran?",o:[["Der Lieferer kannte den Fehler und hat ihn absichtlich verschwiegen.",1],["Man sieht ihn sofort beim Auspacken.",0],["Es fehlen Teile in der Lieferung.",0]]},
 why:"Mängel nach Erkennbarkeit: offen, versteckt, arglistig verschwiegen. Arglist = Absicht des Lieferers.",
 term:"arglistig verschwiegener Mangel",ihk:"Ein arglistig verschwiegener Mangel ist dem Lieferer bekannt und wird absichtlich verschwiegen."},
{id:"p3-5",ch:3,m:"p",k:"mc",s:"Prüfe, in welchem Fall ein Mangel in der Güte vorliegt.",q:"Wähle.",
 o:[["Eine Segeljacke hat eine offene Naht.",1],["Statt Rotwein wurde Weißwein geliefert.",0],["Statt 60 Stück kamen 48.",0],["Die Lieferung kam an die falsche Filiale.",0]],
 why:"Güte = Qualität. Falsche Ware ist Art, zu wenig ist Menge. Die falsche Filiale betrifft die Annahme.",
 term:"Mangel in der Güte",ihk:"Eine offene Naht ist ein Mangel in der Güte (Beschaffenheit)."},
{id:"p3-6",ch:3,m:"p",k:"rede",s:"Kröger: „Risse? Das hättet ihr vor vier Wochen sagen müssen!“ Ihr habt die Kiste heute geöffnet, die Lieferung kam gestern.",q:"Welche Antwort ist fachlich richtig?",
 o:[["„Die Lieferung kam gestern. Wir haben heute geprüft und rügen den Mangel damit unverzüglich. Bitte schicken Sie uns zwei neue Lampen.“",1],["„Sie haben recht, dann behalten wir sie eben.“",0],["„Wir haben zwei Jahre Zeit, das wissen Sie doch.“",0],["„Das ist uns egal, wir wollen das Geld zurück.“",0]],
 why:"Prüfen und rügen am Tag nach der Lieferung ist unverzüglich. Die 2 Jahre sind nur die Höchstfrist für versteckte Mängel, nicht die Rügefrist.",
 term:"unverzüglich rügen",ihk:"Offene Mängel rüge ich beim zweiseitigen Handelskauf unverzüglich nach der Prüfung."},

// ===== Kapitel 4 – Rechte des Käufers =====
{id:"a4-1",ch:4,m:"a",k:"mc",s:"Wübben: „Die Lampen sind gerügt. Was verlangen wir jetzt zuerst?“",q:"Welches Recht kommt zuerst?",
 o:[["Nacherfüllung",1],["Rücktritt",0],["Preisminderung",0]],
 why:"Zuerst muss der Lieferer die Chance bekommen, den Fehler zu beheben: Nacherfüllung. Die anderen Rechte sind nachrangig.",
 term:"Nacherfüllung (vorrangig)",ihk:"Vorrangig verlangt der Käufer Nacherfüllung (Mangelbeseitigung oder Ersatzlieferung)."},
{id:"a4-2",ch:4,m:"a",k:"mc",s:"Wübben: „Und wer entscheidet, ob repariert oder neu geliefert wird?“",q:"Wer wählt?",
 o:[["der Käufer",1],["der Verkäufer",0],["der Spediteur",0]],
 why:"Der Käufer hat das Wahlrecht zwischen Mangelbeseitigung und Ersatzlieferung.",
 term:"Wahlrecht des Käufers",ihk:"Der Käufer kann zwischen Mangelbeseitigung und Ersatzlieferung wählen."},
{id:"a4-3",ch:4,m:"a",k:"mc",s:"Das Nordsee-Marine-Depot kauft beim Großhändler Kröger.",q:"Welche Art von Kaufvertrag ist das?",
 o:[["zweiseitiger Handelskauf",1],["Verbrauchsgüterkauf",0],["bürgerlicher Kauf",0]],
 why:"Beide sind Kaufleute: zweiseitiger Handelskauf.",
 term:"zweiseitiger Handelskauf",ihk:"Kaufen zwei Kaufleute voneinander, liegt ein zweiseitiger Handelskauf vor."},
{id:"a4-4",ch:4,m:"a",k:"mc",s:"Wübben: „Wir behalten die Lampen, zahlen aber weniger.“",q:"Wie heißt dieses Recht?",
 o:[["Preisminderung",1],["Ersatzlieferung",0],["Rücktritt",0]],
 why:"Ware behalten und weniger zahlen = Minderung.",
 term:"Minderung",ihk:"Bei der Minderung behält der Käufer die Ware und zahlt einen geringeren Preis."},
{id:"a4-5",ch:4,m:"a",k:"mc",s:"Eine Privatperson kauft im Museumsshop eine Schiffsglocke.",q:"Welche Art von Kaufvertrag ist das?",
 o:[["Verbrauchsgüterkauf",1],["zweiseitiger Handelskauf",0],["bürgerlicher Kauf",0]],
 why:"Privatperson kauft bei einem Unternehmer: Verbrauchsgüterkauf.",
 term:"Verbrauchsgüterkauf",ihk:"Verbrauchsgüterkauf, weil eine Privatperson bei einem Händler kauft."},
{id:"a4-6",ch:4,m:"a",k:"num",s:"Kaufpreis der Lampen 1.320 €. Ihr einigt euch auf 15 % Minderung.",q:"Wie hoch ist die Minderung in Euro?",unit:"€",ans:198,rw:"1.320 € × 15 : 100 = 198,00 €",
 why:"Prozentwert = Grundwert × Prozentsatz : 100. Gefragt ist die Minderung, nicht der neue Preis (1.122 €).",
 term:"Minderung berechnen",ihk:"Minderung = Kaufpreis × Minderungssatz : 100."},
{id:"p4-1",ch:4,m:"p",k:"mcb",s:"Ihr wollt sofort vom Kaufvertrag zurücktreten. Der Mangel: Bei einer Lampe fehlt eine kleine Schraube an der Halterung.",q:"Ist der Rücktritt möglich?",
 o:[["Nein.",1],["Ja, sofort.",0],["Ja, aber nur mit Zustimmung des Lieferers.",0]],
 b:{q:"Warum nicht?",o:[["Bei einem unerheblichen Mangel ist der Rücktritt ausgeschlossen (§ 323 Abs. 5 BGB). Außerdem ist zuerst Nacherfüllung zu verlangen.",1],["Weil Rücktritt beim Handelskauf nie erlaubt ist.",0],["Weil versteckte Mängel nicht zum Rücktritt berechtigen.",0]]},
 why:"Rücktritt ist nachrangig und bei unerheblichen Mängeln ausgeschlossen.",
 term:"Rücktritt ausgeschlossen",ihk:"Bei einem unerheblichen Mangel ist der Rücktritt ausgeschlossen."},
{id:"p4-2",ch:4,m:"p",k:"mcb",s:"Kröger hat zweimal versucht, die Lampen zu reparieren. Beide Male ohne Erfolg.",q:"Was gilt jetzt?",
 o:[["Die Nacherfüllung ist fehlgeschlagen. Nachrangige Rechte sind möglich.",1],["Kröger darf noch beliebig oft reparieren.",0],["Ihr müsst jetzt 14 Tage warten.",0]],
 b:{q:"Welche Rechte sind nun möglich?",o:[["Rücktritt, Minderung oder Schadensersatz",1],["Nur noch eine weitere Nachbesserung",0],["Nur ein Gutschein",0]]},
 why:"Nach dem zweiten erfolglosen Nachbesserungsversuch gilt die Nacherfüllung als fehlgeschlagen (§ 440 BGB).",
 term:"fehlgeschlagene Nacherfüllung",ihk:"Die Nacherfüllung gilt nach dem zweiten erfolglosen Versuch als fehlgeschlagen; dann sind Rücktritt, Minderung oder Schadensersatz möglich."},
{id:"p4-3",ch:4,m:"p",k:"mcb",s:"Die Nacherfüllung schlägt fehl. Ihr kauft die Lampen woanders teurer ein (Deckungskauf).",q:"Welches Recht deckt die Mehrkosten?",
 o:[["Schadensersatz statt der Leistung",1],["Preisminderung",0],["Mangelbeseitigung",0]],
 b:{q:"Was bedeutet das für die ursprüngliche Lieferung?",o:[["Ihr verlangt keine Lieferung mehr vom alten Lieferer, sondern Ersatz des Schadens.",1],["Ihr bekommt die alten Lampen zusätzlich.",0],["Der alte Vertrag läuft weiter wie bisher.",0]]},
 why:"Schadensersatz statt der Leistung: Der Käufer will keine Leistung mehr, sondern den Schaden (z. B. Mehrkosten des Deckungskaufs) ersetzt.",
 term:"Schadensersatz statt der Leistung",ihk:"Die Mehrkosten eines Deckungskaufs verlangt der Käufer als Schadensersatz statt der Leistung."},
{id:"p4-4",ch:4,m:"p",k:"mcb",s:"Für wen gilt die Beweislastumkehr von 12 Monaten?",q:"Wähle.",
 o:[["für den Verbraucher beim Verbrauchsgüterkauf",1],["für das Nordsee-Marine-Depot gegenüber Großhändler Kröger",0],["für beide Kaufleute",0]],
 b:{q:"Was bedeutet sie?",o:[["Zeigt sich ein Mangel innerhalb von 12 Monaten, wird vermutet, dass er schon beim Kauf da war (§ 477 BGB).",1],["Der Käufer muss beweisen, dass der Mangel schon da war.",0],["Die Gewährleistung dauert nur 12 Monate.",0]]},
 why:"Die Beweislastumkehr schützt Verbraucher. Beim Handelskauf gibt es sie nicht.",
 term:"Beweislastumkehr (§ 477 BGB)",ihk:"Die Beweislastumkehr von 12 Monaten gilt nur beim Verbrauchsgüterkauf."},
{id:"p4-5",ch:4,m:"p",k:"mc",s:"Bei mehreren Seefunkgeräten fehlt die Ladeschale. Ihr bemerkt es bei der Wareneingangskontrolle.",q:"Wie verhaltet ihr euch nach den gesetzlichen Bestimmungen?",
 o:[["Mangel unverzüglich beim Lieferer rügen und Nacherfüllung verlangen",1],["Geräte annehmen und ohne Ladeschale verkaufen",0],["Den Mangel innerhalb von 2 Jahren rügen",0],["Ohne Fristsetzung vom Vertrag zurücktreten",0]],
 why:"Erst rügen (unverzüglich), dann zuerst Nacherfüllung verlangen.",
 term:"Rüge + Nacherfüllung",ihk:"Ich rüge den Mangel unverzüglich beim Lieferer und verlange Nacherfüllung (IHK W 2025/26 Aufg. 10)."},
{id:"p4-6",ch:4,m:"p",k:"mc",s:"Ein Nachbar verkauft privat sein altes Fernglas an einen anderen Privatmann.",q:"Welche Kaufart liegt vor?",
 o:[["bürgerlicher Kauf",1],["Verbrauchsgüterkauf",0],["zweiseitiger Handelskauf",0],["Fixkauf",0]],
 why:"Zwei Privatleute: bürgerlicher Kauf. Verbrauchsgüterkauf nur, wenn ein Unternehmer an einen Verbraucher verkauft.",
 term:"bürgerlicher Kauf",ihk:"Verkaufen zwei Privatpersonen untereinander, liegt ein bürgerlicher Kauf vor."}
);

POOL.push(
// ===== Kapitel 5 – Lieferungsverzug =====
{id:"a5-1",ch:5,m:"a",k:"mc",s:"Ole: „Wann ist ein Lieferer eigentlich in Verzug?“",q:"Welche drei Voraussetzungen gehören dazu?",
 o:[["Fälligkeit, Mahnung (falls nötig), Verschulden",1],["Mangel, Rüge, Frist",0],["Bestellung, Lieferschein, Rechnung",0]],
 why:"Alle drei müssen erfüllt sein: Die Lieferung ist fällig, es wurde gemahnt (wenn nötig), und der Lieferer ist schuld.",
 term:"Voraussetzungen des Lieferungsverzugs",ihk:"Lieferungsverzug liegt vor bei Fälligkeit, Mahnung (falls erforderlich) und Verschulden des Lieferers."},
{id:"a5-2",ch:5,m:"a",k:"mc",s:"Vereinbart war: „Lieferung am 24. April“. Der Lieferer hat es einfach vergessen.",q:"Ab wann ist er in Verzug?",
 o:[["ab 25. April, ohne Mahnung",1],["erst nach einer Mahnung",0],["erst nach 14 Tagen",0]],
 why:"Der Termin steht genau im Kalender. Dann braucht man keine Mahnung. Verzug beginnt am Tag danach.",
 term:"kalendermäßig bestimmter Termin",ihk:"Ist der Liefertermin kalendermäßig bestimmt, tritt der Verzug ohne Mahnung ein."},
{id:"a5-3",ch:5,m:"a",k:"mc",s:"Vereinbart war: „Lieferung sobald wie möglich“.",q:"Braucht ihr eine Mahnung?",
 o:[["Ja, der Termin ist nicht genau bestimmt.",1],["Nein, nie.",0],["Nur beim Fixkauf.",0]],
 why:"„Sobald wie möglich“ ist kein Datum. Dann muss man den Lieferer erst mahnen.",
 term:"Mahnung",ihk:"Ist der Liefertermin nicht kalendermäßig bestimmt, muss der Käufer den Lieferer mahnen."},
{id:"a5-4",ch:5,m:"a",k:"mc",s:"Eine Sturmflut überschwemmt das Lager des Lieferers. Er kann nicht liefern.",q:"Ist er in Verzug?",
 o:[["Nein. Das ist höhere Gewalt, er ist nicht schuld.",1],["Ja. Termin ist Termin.",0],["Ja, wenn ihr gemahnt habt.",0]],
 why:"Ohne Verschulden kein Verzug. Eine Sturmflut kann der Lieferer nicht verhindern.",
 term:"höhere Gewalt",ihk:"Bei höherer Gewalt fehlt das Verschulden; es liegt kein Lieferungsverzug vor."},
{id:"a5-5",ch:5,m:"a",k:"mc",s:"Ole: „Die Teile sind bestellt mit ‚fix am 14. Oktober‘. Nach dem Wartungsfenster brauchen wir sie nicht mehr.“",q:"Was ist beim Fixkauf anders?",
 o:[["Rücktritt ohne Nachfrist ist möglich.",1],["Eine Mahnung ist immer nötig.",0],["Der Lieferer haftet nie.",0]],
 why:"Beim Fixkauf ist der Termin so wichtig, dass eine spätere Lieferung sinnlos ist. Darum kann man sofort zurücktreten.",
 term:"Fixkauf",ihk:"Beim Fixkauf kann der Käufer nach Überschreiten des Termins ohne Nachfrist vom Vertrag zurücktreten."},
{id:"a5-6",ch:5,m:"a",k:"rede",s:"Die Rettungswesten (Lieferung „Anfang Mai“, also ohne genaues Datum) sind noch nicht da. Du rufst den Lieferer an.",q:"Was sagst du?",
 o:[["„Guten Tag, unsere Rettungswesten sind noch nicht da. Bitte liefern Sie bis spätestens 20. Mai. Sonst treten wir vom Vertrag zurück.“",1],["„Wo bleibt das Zeug? Ihr seid echt unzuverlässig!“",0],["„Ach, kein Stress. Liefern Sie einfach irgendwann.“",0]],
 why:"Sachlich mahnen und eine angemessene Nachfrist setzen. Danach ist der Rücktritt möglich.",
 term:"Mahnung mit Nachfrist",ihk:"Wir mahnen den Lieferer und setzen eine angemessene Nachfrist."},
{id:"a5-7",ch:5,m:"a",k:"mc",s:"Warum überwacht ihr, ob die bestellte Ware pünktlich ankommt?",q:"Wähle.",
 o:[["Um die Verkaufsbereitschaft sicherzustellen",1],["Um Skonto zu bekommen",0],["Um den Lagerbestand zu senken",0]],
 why:"Kommt Ware zu spät, kann man nicht verkaufen. Das Überwachen sichert die Verkaufsbereitschaft.",
 term:"Liefertermin überwachen",ihk:"Ich überwache den Liefertermin, um die Verkaufsbereitschaft sicherzustellen."},
{id:"p5-1",ch:5,m:"p",k:"mcb",s:"Bestellt am 30. Oktober, Liefertermin „Ende März“. Der Lieferer hat die Verzögerung zu vertreten.",q:"Ab welchem Tag ist er in Verzug?",
 o:[["01.04.",1],["31.03.",0],["erst nach einer Mahnung",0],["15.04.",0]],
 b:{q:"Warum?",o:[["„Ende März“ ist kalendermäßig bestimmt. Eine Mahnung ist nicht nötig (§ 286 Abs. 2 BGB).",1],["Weil man immer 14 Tage warten muss.",0],["Weil jeder Termin eine Mahnung braucht.",0]]},
 why:"Spätestens am 31.03. muss geliefert sein. Ab dem 01.04. ist der Lieferer in Verzug (IHK WiSo S 2020, W 2023/24).",
 term:"Beginn des Verzugs",ihk:"Der Lieferer ist ab dem 01.04. in Verzug, da der Termin kalendermäßig bestimmt ist."},
{id:"p5-2",ch:5,m:"p",k:"mcb",s:"Trotz Mahnung und Nachfrist kam nichts. Das Depot besteht trotzdem auf Lieferung und nimmt die verspätete Ware an.",q:"Was kann es zusätzlich verlangen?",
 o:[["Ersatz des Verzugsschadens",1],["Rücktritt vom Kaufvertrag",0],["Schadensersatz statt der Leistung",0],["Preisminderung",0]],
 b:{q:"Was ist ein Verzugsschaden?",o:[["Der Schaden durch die Verspätung, z. B. Mehraufwendungen oder entgangener Gewinn.",1],["Der Schaden durch einen Mangel der Ware.",0],["Die Kosten der Mahnung allein.",0]]},
 why:"Wer auf Lieferung besteht, bekommt die Ware und dazu den Schaden durch die Verspätung (IHK WiSo S 2020, W 2023/24).",
 term:"Verzugsschaden",ihk:"Besteht der Käufer auf Lieferung, kann er zusätzlich Ersatz des Verzugsschadens verlangen."},
{id:"p5-3",ch:5,m:"p",k:"mcb",s:"Werbeartikel für das Jubiläum am 19.04. wurden „fix“ bestellt.",q:"Warum wählt man einen Fixkauf?",
 o:[["Die Ware wird an einem bestimmten Tag gebraucht. Eine spätere Lieferung ist sinnlos.",1],["Damit die Lieferung sofort erfolgt.",0],["Um den Kaufpreis später zu zahlen.",0],["Um die Ware zuerst zu testen.",0]],
 b:{q:"Welche Folge hat das bei Verspätung?",o:[["Rücktritt ohne Nachfrist (§ 323 Abs. 2 BGB).",1],["Der Käufer muss erst zweimal mahnen.",0],["Der Vertrag verlängert sich automatisch.",0]]},
 why:"Fixkauf = Termin ist wesentlich. Die Nachfrist entfällt.",
 term:"Fixkauf",ihk:"Die Ware wird an einem bestimmten Tag benötigt, eine spätere Lieferung ist sinnlos (IHK WiSo S 2024 Aufg. 13)."},
{id:"p5-4",ch:5,m:"p",k:"mcb",s:"Vereinbart: „Lieferung sobald wie möglich“. Eure Mahnung geht am 9. März zu. Der Lieferer ist schuld.",q:"Ab wann ist er in Verzug?",
 o:[["ab 9. März (mit Zugang der Mahnung)",1],["ab dem Tag der Bestellung",0],["erst 14 Tage nach der Mahnung",0]],
 b:{q:"Warum war hier eine Mahnung nötig?",o:[["Der Termin war nicht kalendermäßig bestimmt.",1],["Weil eine Mahnung immer nötig ist.",0],["Weil es ein Fixkauf war.",0]]},
 why:"Unbestimmter Termin → Verzug erst mit der Mahnung (§ 286 Abs. 1 BGB).",
 term:"Verzug durch Mahnung",ihk:"Bei nicht kalendermäßig bestimmtem Termin kommt der Lieferer erst durch die Mahnung in Verzug."},
{id:"p5-5",ch:5,m:"p",k:"mcb",s:"Nach Ablauf der Nachfrist kauft das Depot 40 Schlitten woanders. Bestellt waren sie zu 52,00 €. Der neue Lieferer verlangt 59,50 € je Stück plus 35,00 € Fracht.",q:"Wie hoch ist der Schadensersatz statt der Leistung?",
 o:[["335,00 €",1],["300,00 €",0],["2.415,00 €",0],["7,50 €",0]],
 b:{q:"Wie wird gerechnet?",o:[["40 × (59,50 € − 52,00 €) + 35,00 € = 300 € + 35 € = 335 €",1],["40 × 59,50 € + 35,00 €",0],["59,50 € − 52,00 €",0]]},
 why:"Ersetzt werden die Mehrkosten des Deckungskaufs: Preisunterschied mal Menge plus zusätzliche Fracht.",
 term:"Deckungskauf",ihk:"Die Mehrkosten des Deckungskaufs werden als Schadensersatz statt der Leistung verlangt."},
{id:"p5-6",ch:5,m:"p",k:"mc",s:"Christbaumschmuck für den Weihnachtsmarkt wurde „sobald wie möglich“ bestellt. Der Lieferer hat getrödelt und will erst am 28. Dezember liefern.",q:"Welche Aussage stimmt?",
 o:[["Eine Mahnung ist hier nicht nötig, weil eine spätere Lieferung sinnlos ist.",1],["Eine Mahnung ist immer nötig.",0],["Der Lieferer ist nie in Verzug, weil kein genaues Datum genannt wurde.",0],["Das ist eine mangelhafte Lieferung.",0]],
 why:"Keine Mahnung nötig, wenn die Lieferung nach dem Termin keinen Sinn mehr hat (wie Christbäume nach Weihnachten).",
 term:"Mahnung entbehrlich",ihk:"Eine Mahnung ist entbehrlich, wenn eine spätere Lieferung sinnlos ist."},

// ===== Kapitel 6 – Lager und Lagergrundsätze =====
{id:"a6-1",ch:6,m:"a",k:"mc",s:"Harms: „Was zuerst ins Magazin kam, geht zuerst hinaus.“",q:"Wie heißt dieser Grundsatz heute?",
 o:[["fifo (first in – first out)",1],["Festplatzsystem",0],["Just-in-time",0]],
 why:"fifo: Was zuerst eingelagert wurde, wird zuerst verkauft. So wird nichts alt.",
 term:"fifo",ihk:"Nach dem fifo-Prinzip wird die zuerst eingelagerte Ware zuerst verkauft."},
{id:"a6-2",ch:6,m:"a",k:"mc",s:"Welche Ware ist richtig gelagert?",q:"Wähle.",
 o:[["Kopierpapier in der Bückzone im Regal",1],["Lederstiefel im feuchten Bunkerkeller",0],["Tiefgefrorenes Fischfilet bei +12 °C",0]],
 why:"Leder verträgt keine Feuchtigkeit, Tiefkühlware braucht −18 °C. Papier in der Bückzone ist in Ordnung.",
 term:"warengerecht lagern",ihk:"Kartons mit Kopierpapier werden in der Bückzone im Regal einsortiert (IHK W 2024/25 Aufg. 7)."},
{id:"a6-3",ch:6,m:"a",k:"mc",s:"Smutje-Proviant: Käse, Räucherfisch und Kaffee sollen ins Magazin.",q:"Warum lagert man sie getrennt?",
 o:[["wegen Geruchs- und Geschmacksübertragung",1],["damit mehr Platz bleibt",0],["wegen der Preisauszeichnung",0]],
 why:"Kaffee nimmt Gerüche an. Käse und Fisch geben Geruch ab. Deshalb getrennt lagern.",
 term:"Geruchsübertragung",ihk:"Geruchsempfindliche Waren werden getrennt gelagert, damit sich Geruch und Geschmack nicht übertragen."},
{id:"a6-4",ch:6,m:"a",k:"mc",s:"Harms: „Wozu braucht ihr überhaupt ein Magazin?“",q:"Welche Aufgabe hat das Lager?",
 o:[["Die Verkaufsbereitschaft sichern",1],["Kunden beraten",0],["Werbung planen",0]],
 why:"Das Lager sorgt dafür, dass Ware da ist, wenn Kunden sie wollen.",
 term:"Verkaufsbereitschaft",ihk:"Das Lager sichert die Verkaufsbereitschaft."},
{id:"a6-5",ch:6,m:"a",k:"mc",s:"Im Gang zwischen den Regalen stehen drei Paletten. Harms runzelt die Stirn.",q:"Welcher Lagergrundsatz ist verletzt?",
 o:[["Das Lager soll geräumig und übersichtlich sein.",1],["fifo",0],["Die Ware soll gekühlt sein.",0]],
 why:"Gänge müssen frei sein: Man muss sich bewegen und alles finden können.",
 term:"geräumig, übersichtlich",ihk:"Das Lager muss geräumig und übersichtlich sein; Gänge sind freizuhalten."},
{id:"a6-6",ch:6,m:"a",k:"mc",s:"Schädlingsbekämpfungsmittel gegen Ratten im Bunker sollen gelagert werden.",q:"Wohin damit?",
 o:[["in einen abschließbaren Schrank",1],["neben den Proviant",0],["frei zugänglich in Griffhöhe",0]],
 why:"Gefährliche Stoffe gehören weggeschlossen und nicht neben Lebensmittel.",
 term:"Gefahrstoffe sicher lagern",ihk:"Gefährliche Schädlingsbekämpfungsmittel werden in abschließbaren Vitrinen gelagert (IHK S 2025 Aufg. 24)."},
{id:"p6-1",ch:6,m:"p",k:"mc",s:"IHK-Stil: In welchem Fall wird Ware ordnungsgemäß gelagert?",q:"Wähle.",
 o:[["Gefährliche Schädlingsbekämpfungsmittel werden in abschließbaren Vitrinen gelagert.",1],["Frische Erdbeeren werden dauerhaft bei mindestens 22 Grad gelagert.",0],["Milchprodukte werden generell bei 15 Grad gelagert.",0],["Versandkartons liegen ohne Schutz im Freien.",0]],
 why:"Erdbeeren und Milch brauchen Kühlung, Kartons Schutz vor Nässe.",
 term:"ordnungsgemäße Lagerung",ihk:"Gefährliche Schädlingsbekämpfungsmittel werden in abschließbaren Vitrinen gelagert (IHK S 2025 Aufg. 24)."},
{id:"p6-2",ch:6,m:"p",k:"mcb",s:"Harms fragt nach drei Aufgaben der Lagerhaltung.",q:"Welche Antwort ist vollständig richtig?",
 o:[["Verkaufsbereitschaft sichern · Zeit zwischen Einkauf und Verkauf überbrücken · Preisvorteile nutzen",1],["Kunden beraten · Werbung planen · Kasse abrechnen",0],["Ware auszeichnen · Inventur machen · Preise senken",0]],
 b:{q:"Welches Beispiel passt zu „Preisvorteile nutzen“?",o:[["Große Mengen mit Mengenrabatt einkaufen und lagern.",1],["Die Ware im Schaufenster präsentieren.",0],["Ladenhüter aus dem Sortiment nehmen.",0]]},
 why:"Aufgaben des Lagers: sichern, überbrücken, Preisvorteile nutzen, Ware verkaufsfähig machen.",
 term:"Aufgaben der Lagerhaltung",ihk:"Das Lager sichert die Verkaufsbereitschaft, überbrückt die Zeit zwischen Einkauf und Verkauf und ermöglicht Preisvorteile."},
{id:"p6-3",ch:6,m:"p",k:"mcb",s:"Joghurt für die Kantine: Ihr räumt die neue Lieferung ein.",q:"Wohin stellt ihr die neue Ware?",
 o:[["Nach hinten – die ältere Ware bleibt vorn.",1],["Nach vorn, damit sie frisch aussieht.",0],["Egal, Hauptsache gekühlt.",0]],
 b:{q:"Warum?",o:[["fifo: Die älteste Ware wird zuerst verkauft, so läuft kein MHD ab.",1],["Weil hinten mehr Platz ist.",0],["Weil Kunden lieber hinten greifen.",0]]},
 why:"Nachräumen nach fifo verhindert, dass alte Ware das MHD überschreitet.",
 term:"fifo beim Einräumen",ihk:"Nach dem fifo-Prinzip wird neue Ware hinter die ältere geräumt."},
{id:"p6-4",ch:6,m:"p",k:"mc",s:"Wie heißt das Lager direkt neben dem Verkaufsraum, aus dem nachgefüllt wird?",q:"Wähle.",
 o:[["Reservelager",1],["Zentrallager",0],["Außenlager",0],["Verkaufslager",0]],
 why:"Achtung: In der Prüfung kommen Lagerarten fast nur als falsche Antwort vor. Reservelager = Handlager zum Auffüllen.",
 term:"Reservelager",ihk:"Das Reservelager liegt in der Nähe des Verkaufsraums und dient dem Auffüllen."},
{id:"p6-5",ch:6,m:"p",k:"mcb",s:"Getränkekisten für die Lütje Möwe sollen ins Regal.",q:"Wohin?",
 o:[["unten",1],["oben",0],["in den Gang davor",0]],
 b:{q:"Warum?",o:[["Schweres gehört nach unten: Das Regal bleibt stabil, und Heben über Kopf ist gefährlich.",1],["Weil Getränke unten kühler sind.",0],["Weil Kunden lieber unten greifen.",0]]},
 why:"Warengerecht und sicher lagern: Schweres unten, Leichtes oben.",
 term:"Schweres unten",ihk:"Schwere Waren werden unten gelagert."},

// ===== Kapitel 7 – Warenpflege =====
{id:"a7-1",ch:7,m:"a",k:"mc",s:"Hein: „Warum macht ihr euch so viel Mühe mit der Ware?“",q:"Welche Bedeutung hat die Warenpflege?",
 o:[["Sie erhält die Verkaufsfähigkeit der Ware.",1],["Sie garantiert höhere Umsätze.",0],["Sie steigert automatisch den Gewinn.",0]],
 why:"Achtung bei „garantiert“ und „automatisch“ – das ist zu stark. Warenpflege erhält die Verkaufsfähigkeit.",
 term:"Bedeutung der Warenpflege",ihk:"Durch die Warenpflege wird die Verkaufsfähigkeit der Ware erhalten."},
{id:"a7-2",ch:7,m:"a",k:"mc",s:"Rote Segeljacken sind rosa geworden – sie hingen monatelang im Licht am Bunkerfenster.",q:"Was ist wirtschaftlich sinnvoll?",
 o:[["Reduziert auf einem eigenen Warenträger anbieten",1],["Beim Lieferer reklamieren",0],["Vernichten",0]],
 why:"Der Fehler liegt bei euch (falsche Lagerung). Also nicht reklamieren. Die Jacken sind noch brauchbar: reduziert verkaufen.",
 term:"Farbabweichung",ihk:"Ich biete die Shirts zum reduzierten Preis auf einem gesonderten Warenträger an."},
{id:"a7-3",ch:7,m:"a",k:"mc",s:"Welche Tätigkeit gehört zur Warenpflege?",q:"Wähle.",
 o:[["Kühlkette bei Tiefkühlkost einhalten",1],["Preisschilder anbringen",0],["Fußboden reinigen",0]],
 why:"Warenpflege betrifft die Ware selbst: Kühlkette, MHD prüfen, reifen lassen …",
 term:"Warenpflege",ihk:"Das Einhalten der Kühlkette bei Tiefkühlkost gehört zur Warenpflege."},
{id:"a7-4",ch:7,m:"a",k:"mc",s:"Dir fällt ein Fernglas herunter. Es ist kaputt und nicht mehr verkaufsfähig.",q:"Was änderst du im WWS?",
 o:[["den Sollbestand",1],["den Meldebestand",0],["den Mindestbestand",0]],
 why:"Das Fernglas ist weg. Der Bestand im WWS muss stimmen. Also korrigierst du den Sollbestand.",
 term:"Sollbestand korrigieren",ihk:"Bei beschädigter Ware ändere ich im WWS den Sollbestand."},
{id:"a7-5",ch:7,m:"a",k:"mc",s:"Hein: „Diesen Käse lassen wir noch zwei Wochen reifen.“",q:"Wie heißt das?",
 o:[["Warenmanipulation",1],["Warensicherung",0],["Inventur",0]],
 why:"Warenmanipulation heißt: Ware verbessern und verkaufsfähig machen, z. B. Käse reifen lassen. Es hat nichts mit Betrug zu tun.",
 term:"Warenmanipulation",ihk:"Warenmanipulation bedeutet, die Ware zu verbessern und verkaufsfähig zu machen."},
{id:"a7-6",ch:7,m:"a",k:"mc",s:"Leere Kartons stapeln sich. Hein: „Und wohin damit?“",q:"Was ist Umweltschutz im Lager?",
 o:[["Kartons sammeln und zum Recycling geben",1],["Kartons im Watt verbrennen",0],["Kartons in den Gang stellen",0]],
 why:"Abfall vermeiden, trennen, wiederverwerten.",
 term:"Umweltschutz im Lager",ihk:"Verpackungen werden gesammelt, getrennt und der Wiederverwertung zugeführt."},
{id:"p7-1",ch:7,m:"p",k:"mcb",s:"Die Segeljacken sind durch eure eigene falsche Lagerung verblichen.",q:"Welche Maßnahme ist wirtschaftlich sinnvoll?",
 o:[["Reduziert gesondert anbieten",1],["Beim Lieferer reklamieren",0],["Als Tombola-Preis verschenken",0],["Nichts tun",0]],
 b:{q:"Warum nicht reklamieren?",o:[["Der Mangel ist durch eigene falsche Lagerung entstanden, nicht beim Lieferer.",1],["Weil die Rügefrist abgelaufen ist.",0],["Weil Jacken keine Gewährleistung haben.",0]]},
 why:"Diese Aufgabe kam in 5 Prüfungen fast wortgleich. Der Lieferer ist nicht schuld. Wer nichts tut, riskiert Reklamationen der Kunden.",
 term:"Farbabweichung durch eigene Lagerung",ihk:"Ich biete die Shirts zum reduzierten Preis auf einem gesonderten Warenträger an (IHK W 2025/26 Aufg. 16 u. a.)."},
{id:"p7-2",ch:7,m:"p",k:"mcb",s:"Eine elektrische Massagerolle fällt bei der Regalpflege auf den Boden und ist nicht mehr verkaufsfähig.",q:"Welche Position ändert ihr im WWS?",
 o:[["Sollbestand",1],["Meldebestand",0],["Höchstbestand",0],["Bestellte Menge",0]],
 b:{q:"Was passiert, wenn ihr es vergesst?",o:[["Das WWS zeigt mehr Ware an, als da ist. Bei der Inventur entsteht eine Differenz.",1],["Nichts, das WWS merkt es selbst.",0],["Der Meldebestand sinkt automatisch.",0]]},
 why:"Kam 3-mal in der Prüfung. Sollbestand = Bestand laut WWS.",
 term:"Sollbestand",ihk:"Ich ändere den Sollbestand im Warenwirtschaftssystem (IHK S 2026 Aufg. 25)."},
{id:"p7-3",ch:7,m:"p",k:"mc",s:"Welche Maßnahme ist technischer Umweltschutz im Lager?",q:"Wähle.",
 o:[["Auffangbecken unter Kanistern mit Bootsdiesel",1],["Verpackungen wiederverwenden",0],["Mitarbeiter schulen",0],["Abfall vermeiden",0]],
 why:"Technisch = eine Einrichtung oder ein Gerät. Wiederverwenden, schulen und vermeiden sind organisatorische Maßnahmen.",
 term:"technischer Umweltschutz",ihk:"Ein Auffangbecken unter Kanistern ist eine technische Umweltschutzmaßnahme."},
{id:"p7-4",ch:7,m:"p",k:"mcb",s:"Beim Rundgang: Ein Fach mit Rettungsdecken ist leer.",q:"Was tust du?",
 o:[["Leeres Fach melden und auffüllen",1],["Warten, bis ein Kunde fragt",0],["Das Fach mit anderer Ware füllen",0]],
 b:{q:"Zu welchem Bereich der Warenpflege gehört das?",o:[["Vorratslücken vermeiden",1],["Warenmanipulation",0],["Warensicherung",0]]},
 why:"Leere Fächer kosten Umsatz. Vorratslücken vermeiden gehört zur Warenpflege.",
 term:"Vorratslücken vermeiden",ihk:"Zur Warenpflege gehört, Vorratslücken zu vermeiden."},
{id:"p7-5",ch:7,m:"p",k:"mc",s:"Ordne zu: „MHD des Proviants kontrollieren“ gehört zu …",q:"Wähle.",
 o:[["Qualitätskontrolle",1],["Warensicherung",0],["Warenmanipulation",0],["Umweltschutz",0]],
 why:"Bereiche: Qualitätskontrolle (MHD), Warenmanipulation (reifen lassen), Warensicherung (Alarm-Etikett), Vorratslücken vermeiden, Umweltschutz.",
 term:"Qualitätskontrolle",ihk:"Die Kontrolle des Mindesthaltbarkeitsdatums gehört zur Qualitätskontrolle."},

// ===== Kapitel 8 – Sicherheit im Lager =====
{id:"a8-1",ch:8,m:"a",k:"mc",s:"Defne: „Wer erlässt eigentlich die Unfallverhütungsvorschriften?“",q:"Wähle.",
 o:[["die Berufsgenossenschaft",1],["die IHK",0],["das Ordnungsamt",0]],
 why:"Die Berufsgenossenschaft (BG) ist Träger der gesetzlichen Unfallversicherung und erlässt die UVV.",
 term:"Berufsgenossenschaft",ihk:"Die zuständige Berufsgenossenschaft erlässt die Unfallverhütungsvorschriften."},
{id:"a8-2",ch:8,m:"a",k:"mc",s:"Es riecht nach Rauch. Hinten im Gang flackert ein Feuer.",q:"Was tust du zuerst?",
 o:[["Brand melden",1],["sofort löschen",0],["die Ware retten",0]],
 why:"Reihenfolge: 1. Brand melden (112) – 2. Menschen in Sicherheit bringen – 3. Löschversuch, nur ohne Eigengefährdung.",
 term:"Verhalten im Brandfall",ihk:"Brand melden – in Sicherheit bringen – Löschversuch unternehmen."},
{id:"a8-3",ch:8,m:"a",k:"mc",s:"Ein rundes, blaues Schild mit einem Schuh.",q:"Was für ein Zeichen ist das?",
 o:[["Gebotszeichen",1],["Verbotszeichen",0],["Warnzeichen",0]],
 why:"Rund und blau = Gebot (du musst …). Rund mit rotem Rand = Verbot. Dreieck gelb = Warnung.",
 term:"Gebotszeichen",ihk:"Gebotszeichen sind rund und blau."},
{id:"a8-4",ch:8,m:"a",k:"mc",s:"Ein eckiges, grünes Schild mit einem laufenden Männchen.",q:"Was für ein Zeichen ist das?",
 o:[["Rettungszeichen",1],["Brandschutzzeichen",0],["Gebotszeichen",0]],
 why:"Eckig und grün = Rettung (Notausgang, Erste Hilfe). Eckig und rot = Brandschutz (Feuerlöscher).",
 term:"Rettungszeichen",ihk:"Rettungszeichen sind eckig und grün."},
{id:"a8-5",ch:8,m:"a",k:"mc",s:"Ein Regal im Munitionsgang wackelt stark.",q:"Was tust du?",
 o:[["Unverzüglich dem Vorgesetzten melden",1],["Bis zur nächsten Inventur warten",0],["Nichts, es hält schon",0]],
 why:"Sicherheitsmängel meldet man sofort.",
 term:"Mängel melden",ihk:"Sicherheitsmängel werden unverzüglich dem Vorgesetzten gemeldet."},
{id:"a8-6",ch:8,m:"a",k:"mc",s:"Kartons stehen vor dem Notausgang.",q:"Was gilt?",
 o:[["Fluchtwege und Notausgänge müssen immer frei sein.",1],["Das ist okay, wenn es nur kurz ist.",0],["Das ist okay, wenn die Tür abgeschlossen ist.",0]],
 why:"Im Notfall muss jeder sofort raus können.",
 term:"Fluchtwege freihalten",ihk:"Rettungswege und Notausgänge sind jederzeit freizuhalten."},
{id:"a8-7",ch:8,m:"a",k:"rede",s:"Ein Kollege trägt im Lager Turnschuhe. „Die Sicherheitsschuhe sind mir zu warm.“",q:"Was sagst du?",
 o:[["„Ich verstehe das. Aber hier fallen schwere Kisten. Bitte zieh die Sicherheitsschuhe an, die sind Pflicht.“",1],["„Ist doch egal, mach wie du willst.“",0],["„Du bist echt dumm.“",0]],
 why:"Freundlich, aber klar: Persönliche Schutzausrüstung trägt man immer, auch im Sommer.",
 term:"persönliche Schutzausrüstung",ihk:"Die persönliche Schutzausrüstung ist unabhängig von der Temperatur zu tragen."},
{id:"p8-1",ch:8,m:"p",k:"mc",s:"IHK-Stil: In welchem Fall werden die Unfallverhütungsvorschriften im Lager eingehalten?",q:"Wähle.",
 o:[["Die Mitarbeiter erhalten Kartonmesser mit automatischem Klingeneinzug.",1],["Paletten werden platzsparend stehend gelagert.",0],["Die schmalen Gänge vor den Regalen werden zur Lagerung genutzt.",0],["Langjährige Mitarbeiter brauchen keine Schulungen.",0]],
 why:"Stehende Paletten kippen, Gänge müssen frei sein, Unterweisung gilt für alle.",
 term:"UVV im Lager",ihk:"Die Mitarbeiter erhalten Kartonmesser mit automatischem Klingeneinzug, um das Verletzungsrisiko zu senken (IHK W 2024/25 Aufg. 25)."},
{id:"p8-2",ch:8,m:"p",k:"mc",s:"Welche Erläuterung zum Arbeitsschutz ist richtig?",q:"Wähle.",
 o:[["Türen im Rettungsweg müssen sich jederzeit von innen öffnen lassen.",1],["Eine Unterweisung muss alle 6 Wochen erfolgen.",0],["Sicherheitsmängel müssen innerhalb eines Monats beseitigt werden.",0],["Die Verantwortung liegt bei der Gewerbeaufsicht.",0]],
 why:"Die anderen Fristen sind erfunden. Die Verantwortung für den Arbeitsschutz im Betrieb trägt der Unternehmer.",
 term:"Rettungswege",ihk:"Türen, die als Rettungsweg genutzt werden, müssen sich jederzeit von innen öffnen lassen (IHK W 2023/24 Aufg. 22)."},
{id:"p8-3",ch:8,m:"p",k:"mcb",s:"Defne: „Welche Vorschriften müssen bei euch aushängen?“",q:"Wähle.",
 o:[["die Unfallverhütungsvorschriften",1],["die Preisangabenverordnung",0],["das Produkthaftungsgesetz",0]],
 b:{q:"Wer muss dafür sorgen?",o:[["Der Unternehmer: Er macht die UVV zugänglich und unterweist regelmäßig.",1],["Jeder Mitarbeiter selbst.",0],["Die IHK.",0]]},
 why:"Der Unternehmer muss die UVV zugänglich machen (aushängen), unterweisen, Schutzausrüstung stellen.",
 term:"Aushangpflicht",ihk:"Die Unfallverhütungsvorschriften sind aushangpflichtig (IHK WiSo W 2021/22, S 2026)."},
{id:"p8-4",ch:8,m:"p",k:"mcb",s:"Ein Azubi stürzt auf dem direkten Weg zur Arbeit mit dem Fahrrad.",q:"Wer zahlt die Behandlung?",
 o:[["die Berufsgenossenschaft",1],["der Azubi selbst",0],["die IHK",0]],
 b:{q:"Warum?",o:[["Wegeunfälle sind über die gesetzliche Unfallversicherung (BG) versichert. Der Unfall muss gemeldet werden.",1],["Weil der Arbeitgeber immer alles privat zahlt.",0],["Weil Fahrradunfälle nicht versichert sind.",0]]},
 why:"Die BG ist Träger der gesetzlichen Unfallversicherung: Arbeitsunfälle, Wegeunfälle, Berufskrankheiten.",

 term:"Ladenhüter auslisten",ihk:"Ich nehme Artikel mit einer niedrigen Umschlagshäufigkeit aus dem Sortiment (IHK S 2023 Aufg. 19)."},
{id:"p12-2",ch:12,m:"p",k:"mc",s:"Die Lagerkosten in der Haushaltswarenabteilung sind gestiegen.",q:"Welchen Grund könnte es geben?",
 o:[["Bei einigen Artikeln wurde der Mindestbestand erhöht.",1],["Die Ø Lagerdauer ist geringer geworden.",0],["Die Umschlagshäufigkeit hat sich erhöht.",0],["Der Ø Lagerbestand ist gesunken.",0]],
 why:"Höherer Mindestbestand → mehr Ware im Lager → höhere Kosten.",
 term:"Mindestbestand ↑ → Lagerkosten ↑",ihk:"Bei einigen Artikeln wurde der Mindestbestand erhöht (IHK W 2022/23 Aufg. 10)."},
{id:"p12-3",ch:12,m:"p",k:"mc",s:"Die Umschlagshäufigkeit der Sportabteilung stieg von 30 auf 33.",q:"Welcher Sachverhalt ist dafür verantwortlich?",
 o:[["Der Ø Lagerbestand wurde verringert.",1],["Der Umsatz ist bei gleichem Ø Lagerbestand gesunken.",0],["Absatz und Umsatz sind zurückgegangen.",0],["Die Lagerdauer hat sich erhöht.",0]],
 why:"Umschlag = Absatz : Ø Lagerbestand. Wird der Nenner kleiner, steigt das Ergebnis.",
 term:"Ursache für höheren Umschlag",ihk:"Der durchschnittliche Lagerbestand ist verringert worden."},
{id:"p12-4",ch:12,m:"p",k:"num",s:"Für Profis: Marktzinssatz 2 %, Ø Lagerdauer 72 Tage.",q:"Lagerzinssatz in %?",unit:"%",ans:0.4,rw:"2 × 72 : 360 = 0,4 %",
 why:"Lagerzinssatz = Marktzinssatz × Ø Lagerdauer : 360. In der Prüfung nur als Begriff – hier zum Vertiefen.",
 term:"Lagerzinssatz",ihk:"Lagerzinssatz = Marktzinssatz × Ø Lagerdauer : 360."},
{id:"p12-5",ch:12,m:"p",k:"num",s:"Für Profis: Ø Lagerbestand 35.000 €, Lagerzinssatz 0,4 %.",q:"Lagerzinsen in Euro?",unit:"€",ans:140,rw:"35.000 × 0,4 : 100 = 140,00 €",
 why:"Lagerzinsen = Ø Lagerbestand × Lagerzinssatz : 100.",
 term:"Lagerzinsen",ihk:"Lagerzinsen = Ø Lagerbestand × Lagerzinssatz : 100."},
{id:"p12-6",ch:12,m:"p",k:"mcb",s:"Wübben: „Wenn wir doppelt so schnell umschlagen – was heißt das fürs Geld?“",q:"Was stimmt?",
 o:[["Der Kapitalbedarf halbiert sich ungefähr.",1],["Der Kapitalbedarf verdoppelt sich.",0],["Am Kapitalbedarf ändert sich nichts.",0]],
 b:{q:"Warum?",o:[["Bei gleichem Absatz liegt im Durchschnitt nur halb so viel Ware im Lager.",1],["Weil die Ware dann teurer wird.",0],["Weil man doppelt so viel bestellen muss.",0]]},
 why:"Doppelter Umschlag = halber Ø Lagerbestand = halbes gebundenes Kapital.",
 term:"gebundenes Kapital",ihk:"Eine höhere Umschlagshäufigkeit senkt den Kapitalbedarf und die Lagerzinsen."},

// ===== Kapitel 13 – Inventur =====
{id:"a13-1",ch:13,m:"a",k:"mc",s:"Laut WWS: 55 Seekarten-Tablets. Gezählt: 50.",q:"Wie heißen die 55 Stück?",
 o:[["Sollbestand",1],["Istbestand",0],["Meldebestand",0]],
 why:"Soll = was laut WWS da sein soll. Ist = was wirklich gezählt wird.",
 term:"Sollbestand",ihk:"Die 55 Stück laut WWS sind der Sollbestand."},
{id:"a13-2",ch:13,m:"a",k:"num",s:"Soll 55, Ist 50 Seekarten-Tablets.",q:"Inventurdifferenz in Stück (mit Vorzeichen)?",unit:"Stück",ans:-5,rw:"Ist − Soll = 50 − 55 = −5 Stück (Fehlbestand)",
 why:"Inventurdifferenz = Ist − Soll. Minus heißt: Es fehlt etwas.",
 term:"Inventurdifferenz",ihk:"Inventurdifferenz = Istbestand − Sollbestand."},
{id:"a13-3",ch:13,m:"a",k:"mc",s:"Ist liegt deutlich unter Soll. Und draußen lag ein Boot ohne Licht …",q:"Was ist eine typische Ursache für einen Fehlbestand?",
 o:[["Ladendiebstahl bzw. Diebstahl",1],["Eine Kundenretoure wurde nicht gebucht.",0],["Der Meldebestand wurde gesenkt.",0]],
 why:"Diebstahl führt zu Fehlbestand. Eine nicht gebuchte Retoure führt dagegen zu einem Mehrbestand.",
 term:"Fehlbestand",ihk:"Eine typische Ursache für einen Fehlbestand ist Ladendiebstahl."},
{id:"a13-4",ch:13,m:"a",k:"mc",s:"Woher kommt der Sollbestand?",q:"Wähle.",
 o:[["aus dem WWS (Anfangsbestand + Eingänge − Verkäufe)",1],["vom Zählen bei der Inventur",0],["vom Lieferschein",0]],
 why:"Das WWS rechnet den Sollbestand aus. Gezählt wird der Istbestand.",
 term:"Sollbestand",ihk:"Der Sollbestand stammt aus dem Warenwirtschaftssystem."},
{id:"a13-5",ch:13,m:"a",k:"mc",s:"Alle Waren werden am 31.12. gezählt.",q:"Wie heißt dieses Verfahren?",
 o:[["Stichtagsinventur",1],["permanente Inventur",0],["Stichprobeninventur",0]],
 why:"Ein fester Tag (31.12., ± 10 Tage) = Stichtagsinventur.",
 term:"Stichtagsinventur",ihk:"Bei der Stichtagsinventur erfolgt die körperliche Bestandsaufnahme am 31.12."},
{id:"a13-6",ch:13,m:"a",k:"num",s:"Soll 40, Ist 36 Taucheruhren. Einstandspreis 12,50 €.",q:"Inventurdifferenz in Euro (mit Vorzeichen)?",unit:"€",ans:-50,rw:"(36 − 40) × 12,50 € = −4 × 12,50 € = −50,00 €",
 why:"Erst die Differenz in Stück, dann mal Einstandspreis. Minus = Fehlbestand.",
 term:"Inventurdifferenz in €",ihk:"Inventurdifferenz (€) = (Ist − Soll) × Einstandspreis."},
{id:"p13-1",ch:13,m:"p",k:"mc",s:"Ordne zu: Gezählt wird am 15.10.; der Bestand wird auf den 31.12. fortgeschrieben.",q:"Welches Verfahren?",
 o:[["verlegte Inventur",1],["Stichtagsinventur",0],["permanente Inventur",0],["Stichprobeninventur",0]],
 why:"Verlegt = 3 Monate vor bis 2 Monate nach dem Stichtag zählen, dann fortschreiben.",
 term:"verlegte Inventur",ihk:"Verlegte Inventur: Zählung bis 3 Monate vor oder 2 Monate nach dem Stichtag, Fortschreibung auf den Stichtag (IHK W 2021/22 Aufg. 23)."},
{id:"p13-2",ch:13,m:"p",k:"mcb",s:"Das WWS schreibt alle Bestände laufend fort. Jeder Artikel wird einmal im Jahr gezählt – zu einem beliebigen Zeitpunkt.",q:"Welches Verfahren?",
 o:[["permanente Inventur",1],["verlegte Inventur",0],["Stichtagsinventur",0]],
 b:{q:"Welcher Vorteil hat die artikelgenaue Erfassung im WWS?",o:[["Der Sollbestand ist ständig verfügbar.",1],["Man muss nie mehr zählen.",0],["Diebstahl ist dann unmöglich.",0]]},
 why:"Permanente Inventur braucht ein WWS mit laufender Fortschreibung. Gezählt wird trotzdem einmal im Jahr.",
 term:"permanente Inventur",ihk:"Die Bestände werden laufend im WWS fortgeschrieben; jeder Artikel wird einmal im Geschäftsjahr gezählt."},
{id:"p13-3",ch:13,m:"p",k:"num",s:"Sollwert einer Warengruppe 509,15 €, Inventurdifferenz 43,74 €. Eine Nachkommastelle.",q:"Inventurdifferenz in % vom Sollwert?",unit:"%",ans:8.6,rw:"43,74 × 100 : 509,15 = 8,59… ≈ 8,6 %",
 why:"Bezugsgröße ist der Sollwert (ohne andere Angabe).",
 term:"Inventurdifferenz in %",ihk:"Inventurdifferenz in % = Differenz × 100 : Sollwert (IHK W 2022/23 Aufg. 8)."},
{id:"p13-4",ch:13,m:"p",k:"num",s:"Die Filiale erzielte 2.400.000 € Umsatz. Die Inventurdifferenz beträgt 14.400 €.",q:"Inventurdifferenz in % vom Umsatz?",unit:"%",ans:0.6,rw:"14.400 × 100 : 2.400.000 = 0,6 %",
 why:"Hier ist ausdrücklich der Umsatz die Bezugsgröße.",
 term:"Inventurdifferenz vom Umsatz",ihk:"Inventurdifferenz in % = Differenz × 100 : Umsatz (IHK W 2019/20 Aufg. 22)."},
{id:"p13-5",ch:13,m:"p",k:"mcb",s:"Das WWS meldet 70 Seefunkgeräte. Gezählt werden 30. Im Wareneingangsbuch steht: geliefert 30 – erfasst 70.",q:"Was ist die wahrscheinlichste Ursache der Differenz?",
 o:[["Ein Erfassungsfehler beim Wareneingang (Zahlendreher)",1],["Diebstahl von 40 Geräten",0],["Eine nicht gebuchte Kundenretoure",0]],
 b:{q:"Was tut ihr?",o:[["Den Sollbestand im WWS korrigieren und die Erfassung künftig genauer prüfen.",1],["Die Polizei rufen.",0],["Die 40 Geräte nachbestellen und nichts korrigieren.",0]]},
 why:"Nicht jede Differenz ist Diebstahl. Erfassungsfehler beim Wareneingang (Modul 2) verfälschen den Sollbestand.",
 term:"Erfassungsfehler als Ursache",ihk:"Inventurdifferenzen entstehen auch durch Erfassungsfehler, z. B. falsch erfasste Wareneingänge."},
{id:"p13-6",ch:13,m:"p",k:"num",s:"Soll 55, Ist 50 Tablets, Einstandspreis 24,00 €.",q:"Inventurdifferenz in Euro (mit Vorzeichen)?",unit:"€",ans:-120,rw:"(50 − 55) × 24,00 € = −120,00 €",
 why:"Ohne Vorzeichen (120) wäre nicht klar, ob etwas fehlt oder zu viel da ist.",
 term:"Inventurdifferenz in €",ihk:"Inventurdifferenz (€) = (Ist − Soll) × Einstandspreis."},

// ===== Kapitel 14 – Gemischtes Training =====
{id:"a14-1",ch:14,m:"a",k:"mc",s:"Harms: „Ein Paketdienst bringt 14 Kartons und drängelt. Was prüft ihr?“",q:"Wähle.",
 o:[["Anschrift, Anzahl der Packstücke und Verpackung auf äußere Schäden",1],["den Inhalt jedes Kartons",0],["die Rechnung mit der Bestellung",0]],
 why:"Modul 1: äußere Prüfung vor dem Fahrer.",
 term:"äußere Prüfung",ihk:"In Anwesenheit des Fahrers prüfe ich Anschrift, Anzahl der Packstücke und die Verpackung auf äußere Beschädigungen."},
{id:"a14-2",ch:14,m:"a",k:"mc",s:"Harms: „Versteckter Mangel, beide sind Kaufleute. Wann rügt ihr?“",q:"Wähle.",
 o:[["unverzüglich nach der Entdeckung",1],["innerhalb von 14 Tagen",0],["gar nicht",0]],
 why:"Modul 3: § 377 HGB.",
 term:"Rügefrist",ihk:"Versteckte Mängel werden unverzüglich nach Entdeckung gerügt."},
{id:"a14-3",ch:14,m:"a",k:"mc",s:"Harms: „Joghurt räumt man nach …“",q:"Wähle.",
 o:[["fifo",1],["Zufall",0],["Farbe",0]],
 why:"Modul 6: Die älteste Ware zuerst verkaufen.",
 term:"fifo",ihk:"Nach dem fifo-Prinzip wird die zuerst eingelagerte Ware zuerst verkauft."},
{id:"a14-4",ch:14,m:"a",k:"num",s:"Harms: „Tagesabsatz 15, Lieferzeit 6 Tage, Mindestbestand 40.“",q:"Meldebestand?",unit:"Stück",ans:130,rw:"(15 × 6) + 40 = 130 Stück",
 why:"Modul 9: Tagesabsatz × Lieferzeit + Mindestbestand.",
 term:"Meldebestand",ihk:"Meldebestand = (Tagesabsatz × Lieferzeit) + Mindestbestand."},
{id:"a14-5",ch:14,m:"a",k:"mc",s:"Harms: „Ist weniger da als im WWS. Wie heißt das?“",q:"Wähle.",
 o:[["Fehlbestand",1],["Mehrbestand",0],["Höchstbestand",0]],
 why:"Modul 13: Ist < Soll = Fehlbestand.",
 term:"Fehlbestand",ihk:"Liegt der Istbestand unter dem Sollbestand, besteht ein Fehlbestand."},
{id:"a14-6",ch:14,m:"a",k:"mc",s:"Harms: „Eine Lieferung kommt zu spät. Der Termin war ‚am 3. Mai‘.“",q:"Ab wann ist der Lieferer in Verzug, wenn er schuld ist?",
 o:[["ab 4. Mai, ohne Mahnung",1],["erst nach einer Mahnung",0],["ab 3. Mai früh",0]],
 why:"Modul 5: kalendermäßig bestimmt → keine Mahnung nötig.",
 term:"Lieferungsverzug",ihk:"Bei kalendermäßig bestimmtem Termin tritt der Verzug ohne Mahnung ein."},
{id:"p14-1",ch:14,m:"p",k:"num",s:"Harms: „Absatz Bio-Kartoffeln 4.400 kg, Ø Lagerbestand 275 kg. Lagerdauer, aufgerundet auf ganze Tage?“",q:"Ø Lagerdauer in Tagen?",unit:"Tage",ans:23,rw:"4.400 : 275 = 16 → 360 : 16 = 22,5 → 23 Tage",
 why:"Zwei Schritte: erst die Umschlagshäufigkeit, dann die Lagerdauer.",
 term:"Umschlag → Lagerdauer",ihk:"Umschlagshäufigkeit = Absatz : Ø Lagerbestand; Lagerdauer = 360 : Umschlagshäufigkeit."},
{id:"p14-2",ch:14,m:"p",k:"num",s:"Harms: „Umsatz 2.000.000 €, Inventurdifferenz 10.000 €.“",q:"Inventurdifferenz in % vom Umsatz?",unit:"%",ans:0.5,rw:"10.000 × 100 : 2.000.000 = 0,5 %",
 why:"Modul 13: Differenz × 100 : Bezugsgröße.",
 term:"Inventurdifferenz in %",ihk:"Inventurdifferenz in % = Differenz × 100 : Umsatz (IHK S 2025 Aufg. 9)."},
{id:"p14-3",ch:14,m:"p",k:"mcb",s:"Harms: „Der Abverkauf der Laufschuhe läuft trotz aller Bemühungen sehr schleppend.“",q:"Wie wirkt sich die Lagerdauer auf andere Kennzahlen aus?",
 o:[["Durch eine hohe Lagerdauer erhöhen sich die Lagerkosten.",1],["Durch eine niedrige Lagerdauer erhöhen sich die Lagerkosten.",0],["Durch eine hohe Lagerdauer erhöht sich die Umschlagshäufigkeit.",0],["Die hohe Lagerdauer erhöht automatisch den Warenumsatz.",0]],
 b:{q:"Welche Denkreihe stimmt?",o:[["schleppend → lange Lagerdauer → niedriger Umschlag → Kosten, Zinsen und Risiko steigen",1],["schleppend → kurze Lagerdauer → Kosten sinken",0],["schleppend → hoher Umschlag → Umsatz steigt",0]]},
 why:"Modul 12. Bei jeder Antwort die Richtung prüfen (steigt/sinkt).",
 term:"Lagerdauer ↑ → Lagerkosten ↑",ihk:"Durch eine hohe Lagerdauer erhöhen sich die Lagerkosten (IHK S 2026 Aufg. 11)."},
{id:"p14-4",ch:14,m:"p",k:"mcb",s:"Harms: „Ein Großhändler liefert 80 Dosen Karottensaft statt Energydrinks. Ihr merkt es beim Auspacken.“",q:"Was tut ihr?",
 o:[["Mangel in der Art unverzüglich rügen und Ersatzlieferung verlangen",1],["Den Saft behalten und nichts sagen",0],["Sofort vom Vertrag zurücktreten",0],["Innerhalb von 2 Jahren rügen",0]],
 b:{q:"Welche Rechtsgrundlage gilt?",o:[["Zweiseitiger Handelskauf: unverzügliche Rüge nach § 377 HGB, dann Nacherfüllung vorrangig.",1],["Verbrauchsgüterkauf: 2 Jahre Zeit.",0],["Fixkauf: Rücktritt sofort.",0]]},
 why:"Module 3 und 4 zusammen: erst rügen, dann Nacherfüllung (hier Ersatzlieferung).",
 term:"Rüge + Nacherfüllung",ihk:"Offene Mängel rüge ich unverzüglich und verlange vorrangig Nacherfüllung."},
{id:"p14-5",ch:14,m:"p",k:"mc",s:"Harms: „Welche Formel ist falsch?“",q:"Wähle die falsche Formel.",
 o:[["Bestellmenge = Höchstbestand − Meldebestand",1],["Meldebestand = Tagesabsatz × Lieferzeit + Mindestbestand",0],["Lagerdauer = 360 : Umschlagshäufigkeit",0],["Inventurdifferenz = Istbestand − Sollbestand",0]],
 why:"Richtig: Bestellmenge = Höchstbestand − Mindestbestand. Beim Eintreffen ist nur noch der Mindestbestand da.",
 term:"Formeln im Überblick",ihk:"Bestellmenge = Höchstbestand − Mindestbestand."},
{id:"p14-6",ch:14,m:"p",k:"mcb",s:"Harms: „Im Lager steht ein Kanister Bootsdiesel neben dem Proviant, ohne Auffangwanne, direkt vor dem Notausgang.“",q:"Was ist zuerst zu tun?",
 o:[["Den Notausgang sofort freiräumen und den Kanister sicher lagern",1],["Erst bei der nächsten Inventur melden",0],["Den Kanister in den Gang daneben stellen",0]],
 b:{q:"Welche Grundsätze sind verletzt?",o:[["Sicherheit (Fluchtweg frei), warengerechte Lagerung (getrennt von Lebensmitteln) und Umweltschutz (Auffangwanne).",1],["Nur fifo.",0],["Nur der Meldebestand.",0]]},
 why:"Module 6, 7 und 8 zusammen: Sicherheit geht vor, dann Lagergrundsätze und Umweltschutz.",
 term:"Sicherheit + Lagergrundsätze",ihk:"Rettungswege und Notausgänge sind jederzeit freizuhalten."}
);

// ---------- Pool ----------
function poolFor(m){return POOL.filter(q=>q.m===m)}
function newCount(m){const seen=new Set(DB.seen[m]);return poolFor(m).filter(q=>!seen.has(q.id)).length}
function draw(m,chs,code){
  const notes=[]; const seen=new Set(code?[]:DB.seen[m]); const out=[];
  chs.forEach(c=>{
    const items=POOL.filter(q=>q.m===m&&q.ch===c); const n=Math.min(PER[m],items.length);
    let fresh=shuffle(items.filter(q=>!seen.has(q.id)));
    if(!code&&fresh.length<n){
      notes.push(c);
      const rest=shuffle(items.filter(q=>seen.has(q.id)));
      DB.seen[m]=DB.seen[m].filter(id=>!items.some(q=>q.id===id));
      fresh=fresh.concat(rest);
    }
    fresh.slice(0,n).forEach(q=>out.push(prep(q)));
  });
  save();
  return {qs:out,notes};
}
function prep(q){
  const o=shuffle(q.o?q.o.map((x,i)=>({t:x[0],ok:!!x[1],i})):[]);
  const b=q.b?{q:q.b.q,o:shuffle(q.b.o.map((x,i)=>({t:x[0],ok:!!x[1],i})))}:null;
  return {q,o,b,sel:null,bsel:null,wsel:null,w:null,num:"",phase:q.k==="rede"?"write":"choose",gone:[],res:null,own:"",chk:[]};
}
function drawWrong(m){
  const ids=new Set(DB.wrong[m]);
  const items=POOL.filter(q=>q.m===m&&ids.has(q.id));
  const sel=shuffle(items).slice(0,20).sort((a,b)=>a.ch-b.ch);
  return sel.map(prep);
}

// ---------- Ablauf ----------
function startGame(kind){
  kind=kind||"normal";
  const m=S.mode; let chs=S.chs.slice().sort((a,b)=>a-b);
  const code=kind==="normal"?S.code.trim().toUpperCase():"";
  RNG=code?mulberry32(hashStr(code+"|"+m+"|"+chs.join(","))):Math.random;
  let d;
  if(kind==="fehler"){const qs=drawWrong(m); if(!qs.length)return; chs=[...new Set(qs.map(x=>x.q.ch))]; d={qs,notes:[]};}
  else { if(!chs.length)return; d=draw(m,chs,code); }
  G={mode:m,kind,code,team:S.team.trim()||"Team Watt",chs,qs:d.qs,notes:d.notes,i:0,step:"prolog",lanterns:m==="a"?3:0,used:0,fog:15,score:0,max:0,chRes:{},second:{},fixedNow:0,
     roles:DB.roles,thief:0,fogAdj:0,search:{},duel:null,duelCh:null,thiefWarned:false};
  if(kind!=="fehler"){
    const dc=[11,10,9].find(c=>chs.includes(c)); if(dc)G.duelCh=dc;
    Object.keys(SEARCH).forEach(k=>{if(chs.includes(+k))G.search[k]={found:[],wrong:0,taps:[],done:false,last:null}});
  }
  G.max=G.qs.reduce((s,x)=>s+maxPts(x),0)+Object.keys(G.search).length*15;
  DB.lastMode=m;DB.lastTeam=S.team;save();
  render(); window.scrollTo(0,0);
}
function hasWeil(q){return q.k!=="mcb"&&q.k!=="num"&&!/^Kennziffer/.test(q.ihk)}
function maxPts(x){return (x.q.k==="mcb"?15:10)+(G&&G.roles&&hasWeil(x.q)?3:0)}
function cleanIhk(t){return t.replace(/\s*\((IHK|nach)[^)]*\)\.?$/,"").replace(/\s+$/,"")}
function buildWeil(q){
  const others=shuffle(POOL.filter(o=>o.ch!==q.ch&&hasWeil(o)&&o.ihk!==q.ihk)).slice(0,2);
  return shuffle([{t:cleanIhk(q.ihk),ok:true}].concat(others.map(o=>({t:cleanIhk(o.ihk),ok:false}))));
}
function cur(){return G.qs[G.i]}
function chOf(n){return CHAPTERS[n-1]}
function wrongCount(){return G.qs.filter(x=>x.res&&x.res!=="ok").length}
function updFog(){const total=G.qs.length;const w=G.qs.reduce((s,x)=>s+(x.res==="no"?1:x.res==="half"?0.5:0),0);G.fog=Math.max(5,Math.min(100,Math.round(15+w*(85/(total*0.5))+G.fogAdj)))}

  if(!G){renderStart();return}

}

function parseNum(s){s=String(s).replace(/€|\s/g,"");if(/,/.test(s)){s=s.replace(/\./g,"").replace(",",".")}const v=parseFloat(s);return isNaN(v)?null:v}
function lockMain(){
  const x=cur();
  if(x.q.k==="mcb"){x.phase="reason";render();return}
  if(G.roles&&x.w){x.phase="weil";render();return}
  x.phase="done";finish(x);
}
function finish(x){
  const q=x.q; let pts=0;
  if(q.k==="num"){const v=parseNum(x.num);x.res=(v!==null&&Math.abs(v-q.ans)<0.011)?"ok":"no";pts=x.res==="ok"?10:0}
  else if(q.k==="mcb"){const a=x.o[x.sel].ok,b=x.b.o[x.bsel].ok;x.res=a&&b?"ok":a?"half":"no";pts=a&&b?15:a?5:0}
  else{x.res=x.o[x.sel].ok?"ok":"no";pts=x.res==="ok"?10:0}
  if(x.gone.length)pts=Math.max(0,pts-3);
  if(x.w&&x.wsel!=null&&x.w[x.wsel].ok)pts+=3;
  if([1,2,6].includes(q.ch)&&x.res!=="ok"&&G.kind!=="fehler"){G.thief++;x.boat=true}
  x.pts=pts;G.score+=pts;
  if(!G.code&&!DB.seen[G.mode].includes(q.id))DB.seen[G.mode].push(q.id);
  const wl=DB.wrong[G.mode];
  if(x.res==="ok"){ if(wl.includes(q.id)){DB.wrong[G.mode]=wl.filter(id=>id!==q.id);DB.fixed++;G.fixedNow++;} }
  else if(!wl.includes(q.id)) wl.push(q.id);
  if(x.follow&&x.res==="ok")G.chRes[q.ch]="clear";
  save();
  updFog(); chime(x.res==="ok"); render();
}
function next(){
  G.confirmQuit=false;
  const x=cur(); const c=x.q.ch; const nextQ=G.qs[G.i+1];
  if(x.follow){advance();return}
  if(!nextQ||nextQ.q.ch!==c){
    const items=G.qs.filter(y=>y.q.ch===c&&!y.follow); G.chRes[c]=items.every(y=>y.res==="ok")?"clear":"misty";
    G.step="page"; render(); window.scrollTo(0,0); return;
  }
  G.i++; render(); window.scrollTo(0,0);
}

function advance(){

      ${miss?`<path d="M${p.x-12} ${p.y-12} L${p.x+12} ${p.y+12} M${p.x+12} ${p.y-12} L${p.x-12} ${p.y+12}" stroke="#ef7b66" stroke-width="5" stroke-linecap="round"/>`:""}

   <p class="muted" style="font-variant-numeric:tabular-nums">Gefunden: ${st.found.length} von ${errs} · Fehlklicks: ${st.wrong}</p>
   ${st.last?`<p class="appear" style="font-weight:700;color:${st.last.ok?"var(--ok)":"var(--bad)"}">${esc(st.last.t)}</p>`:""}
   ${list?`<div class="found">${list}</div>`:""}
   ${show?`<div class="term"><span class="t">Fachbegriff · ${esc(S0.term)}</span><span><b>So steht es in der Prüfung:</b> ${esc(S0.ihk)}</span></div>`:""}

  bindTop();
  const tap=k=>{if(show)return;const p=S0.spots[k];if(st.taps.includes(k)&&!p.err)return;if(st.found.includes(k))return;

  app.querySelectorAll(".hs").forEach(g=>{g.onclick=()=>tap(+g.dataset.k);g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tap(+g.dataset.k)}}});

function rint(a,b){return a+Math.floor(RNG()*(b-a+1))}
function duelTask(){
  const A=G.mode==="a"; const types=[]; if(G.chs.includes(9))types.push("mb"); if(G.chs.includes(10))types.push("avg"); if(G.chs.includes(11))types.push("ld","uh");
  const t=types[Math.floor(RNG()*types.length)];
  if(t==="mb"){const a=A?rint(4,15):rint(8,45),l=A?rint(2,6):rint(3,14),m=10*(A?rint(1,5):rint(2,15));
    return {t:"Meldebestand",q:`Tagesabsatz ${a} Stück · Lieferzeit ${l} Tage · Mindestbestand ${m} Stück`,ans:a*l+m,rw:`(${a} × ${l}) + ${m} = ${a*l+m}`,typ:[[a*l,"Mindestbestand vergessen"],[a+l+m,"addiert statt multipliziert"]]};}
  if(t==="avg"){const v=[0,0,0,0].map(()=>A?rint(10,60):rint(20,140));let last=A?rint(10,60):rint(20,140);const s=v.reduce((p,c)=>p+c,0);last+=(5-(s+last)%5)%5;v.push(last);const sum=s+last;
    return {t:"Ø Lagerbestand",q:`Anfangsbestand ${v[0]} · Quartalsendbestände ${v.slice(1).join(", ")} Stück`,ans:sum/5,rw:`(${v.join(" + ")}) : 5 = ${sum/5}`,typ:[[sum/4,"durch 4 statt durch 5 geteilt"],[(sum-v[0])/4,"Anfangsbestand vergessen"]]};}
  if(t==="ld"){const u=[2,3,4,5,6,8,9,10,12,15,18,20,24,30][rint(0,13)];
    return {t:"Lagerdauer",q:`Umschlagshäufigkeit ${u} · Lagerdauer in Tagen?`,ans:360/u,rw:`360 : ${u} = ${360/u} Tage`,typ:[[Math.round(365/u*10)/10,"mit 365 statt 360 Tagen gerechnet"],[360*u,"multipliziert statt geteilt"]]};}
  const u=A?rint(2,10):rint(3,24),avg=A?rint(10,60):rint(15,250);
  return {t:"Umschlagshäufigkeit",q:`Absatz ${(u*avg).toLocaleString("de-DE")} Stück · Ø Lagerbestand ${avg} Stück`,ans:u,rw:`${(u*avg).toLocaleString("de-DE")} : ${avg} = ${u}`,typ:[[Math.round(avg/(u*avg)*1000)/1000,"Kehrwert gerechnet"]]};
}
