     <label class="lab" for="dn">Ergebnis</label><input id="dn" class="num" inputmode="decimal" autocomplete="off" value="">
     <div class="row"><span class="muted grow" style="font-variant-numeric:tabular-nums">Richtig: ${D.right} · Falsch: ${D.wrong}</span><button class="btn" id="chk">Prüfen</button></div>
     ${last?`<p style="color:${last.ok?"var(--ok)":"var(--bad)"};font-weight:700">Letzte Aufgabe: ${last.ok?"richtig!":"falsch – "+esc(last.hint)}</p><p class="rechen">${esc(last.rw)}</p>`:""}</div>`;
    bindTop(); const inp=$("#dn"); inp.focus();
    const check=()=>{const v=parseNum(inp.value);if(v===null)return;const c=D.cur;const ok=Math.abs(v-c.ans)<0.011;
      let hint="Rechenweg prüfen"; c.typ.forEach(([w,h])=>{if(Math.abs(v-w)<0.051)hint=h});
      D.log.push({ok,rw:c.rw,t:c.t,q:c.q,your:inp.value,hint}); if(ok)D.right++; else D.wrong++; chime(ok); D.cur=duelTask(); render()};
    $("#chk").onclick=check; inp.onkeydown=e=>{if(e.key==="Enter")check()};
    return;
  }
  const fails=D.log.filter(l=>!l.ok);
  app.innerHTML=`${topBar()}<div class="scene">${scene(G.fog)}</div>${hud()}
  <div class="panel appear"><span class="eyebrow">Rampen-Duell · Zeit ist um</span><h2>${D.right} richtig, ${D.wrong} falsch</h2>
   <p class="story">${D.right>D.wrong?"Die Lütje Möwe ist beladen. Die Flut weicht ein Stück zurück.":"Die Ladeliste hat Fehler. Das Wasser steigt weiter."}</p>
   ${fails.length?`<div class="found">${fails.map(l=>`<div class="no"><b>${esc(l.t)}:</b> ${esc(l.q)} · eure Antwort ${esc(l.your)} – ${esc(l.hint)}<br><span class="rechen">${esc(l.rw)}</span></div>`).join("")}</div>`:`<p>Keine Fehler – stark!</p>`}
   <p class="muted" style="font-size:.9rem">${G.code?"":"Bestes Duell auf diesem Gerät: "+(DB.duelBest[G.mode]||0)+" richtig"}</p>
   <button class="btn" id="nx">Weiter</button></div>`;
  bindTop(); $("#nx").onclick=()=>{D.phase="done";advance()};
}

function renderFollow(){
  const x=cur(); const ch=chOf(x.q.ch);
  app.innerHTML=`${topBar()}<div class="scene">${scene(G.fog)}</div>${hud()}
  <div class="panel appear"><span class="eyebrow" style="color:var(--brick)">Folge eurer Entscheidung</span>
  <h2>${esc(ch.who)} kommt zurück</h2>
  <div class="who">${persona(ch.fig,"bad")}<p class="story">${esc(FOLLOW[ch.n])} Wenn ihr jetzt richtig entscheidet, wird der Buchstabe <b>${LETTERS[ch.n-1]}</b> klar.</p></div>
  <button class="btn" id="nx">Zweite Chance</button></div>`;
  bindTop(); $("#nx").onclick=()=>{G.step="q";render();window.scrollTo(0,0)};
}

function renderEnd(){
  const pct=Math.round(G.score/G.max*100);
  const ok=G.qs.filter(x=>x.res==="ok").length, tot=G.qs.length;
  const sf=Object.values(G.search),sErr=Object.keys(G.search).reduce((a,k)=>a+SEARCH[k].spots.filter(p=>p.err).length,0);
  const ratio=(ok+sf.reduce((a,s)=>a+s.found.length,0))/(tot+sErr); const full=G.chs.length===CHAPTERS.length;
  const stars=pct>=85?3:pct>=60?2:pct>=35?1:0;
  const clears=G.chs.filter(c=>G.chRes[c]==="clear").length;
  let title,story,dawn=false,fogEnd=G.fog,thief=null;
  if(ratio>=0.8){dawn=true;fogEnd=5;thief=0;title="Ebbe – die Fracht ist gerettet";
    story=full?`Die Flut zieht sich zurück. Ihr legt die vierzehn Seiten nebeneinander und lest: <b>MAGAZINORDNUNG</b>. Hinter einem losen Ziegel im Kommandantenraum liegt ein Bündel in Wachstuch: Harms’ Magazinordnung von 1890. Kein Gold, keine Juwelen – nur Regeln. Zählen vor dem Fahrer. Rügen ohne Zögern. Das Ältere zuerst hinaus. Und jede Zahl ehrlich ins Buch. Genau diese Ordnung hat heute Nacht gezeigt, was wirklich los war: Ein Teil der „gestohlenen“ Ware war nur falsch gebucht. Der Rest fehlte wirklich – und die Inventurdifferenz hat die Plünderer verraten. ${G.thief<=3?"Bei Niedrigwasser holt die Wasserschutzpolizei das Boot ohne Licht aus dem Priel.":"Das Boot ohne Licht ist längst über alle Berge – aber dank der Inventurdifferenz weiß die Polizei genau, was fehlt."} Harms steht in der Tür des Pulvermagazins. „Ordnung war mein Schatz. Jetzt ist sie eurer.“ Dann ist er fort. Kapitänin Ahlers tippt an ihre Mütze: „Willkommen im Team.“`
    :`Das Wasser fällt. Harms nickt euch zu. „Gut gemacht. Aber mein Magazinbuch hat vierzehn Seiten. Kommt wieder, wenn ihr die anderen Kapitel gelernt habt.“`;}
  else if(ratio>=0.5){title="Gerade noch vor der Flut";fogEnd=Math.min(G.fog,50);
    story=`Das Wasser steht an der Bunkertür – und bleibt dort stehen. Ein paar Seiten des Magazinbuchs sind lesbar, andere sind nass und verschwommen. Draußen gleitet das Boot ohne Licht ins Watt davon. Harms schüttelt den Kopf. „Fast. Ihr seid auf dem richtigen Kurs. Aber Ordnung duldet keine halben Sachen. Bei der nächsten Tide bin ich wieder da.“`;}
  else {title="Land unter im Bunker";
    story=`Das Wasser läuft in die Kasematten. Kartons schwimmen durch den Gang, und im Dunkeln legt ein Boot ohne Licht ab – voll beladen. Aus dem Pulvermagazin hallt eine Stimme: „Zählen. Prüfen. Rügen. Ordnen …“ Kapitänin Ahlers funkt: „Nächste Ebbe hole ich euch wieder ab. Traut ihr euch noch einmal?“`;}
  const word=CHAPTERS.map(c=>{const r=G.chRes[c.n];return `<span class="${r==="clear"?"":"misty"}">${G.chs.includes(c.n)?LETTERS[c.n-1]:"_"}</span>`}).join("");
  const rv1=x=>{const q=x.q;const mk=x.res==="ok"?"✓":x.res==="half"?"~":"✗";
    const your=q.k==="num"?(x.num+" "+q.unit):x.o[x.sel].t;
    const right=q.k==="num"?q.rw:x.o.find(o=>o.ok).t;
    return `<div class="rv ${x.res==="ok"?"ok":x.res==="half"?"half":"no"}"><span class="mk">${mk} Kapitel ${q.ch}${x.follow?" · zweite Chance":""} · ${esc(q.q)}</span>
      <span class="muted">${esc(q.s)}</span>
      <span><b>Eure Antwort:</b> ${esc(your)}${q.k==="mcb"?` – <i>${esc(x.b.o[x.bsel].t)}</i>`:""}</span>
      ${x.res!=="ok"?`<span><b>Besser:</b> ${esc(right)}${q.k==="mcb"?` – <i>${esc(x.b.o.find(o=>o.ok).t)}</i>`:""}</span>`:""}
      ${x.own.trim()?`<span><b>Selbst formuliert:</b> ${esc(x.own)}</span>`:""}
      <span><b>Warum:</b> ${esc(q.why)}</span>
      <span class="ihk"><b>So steht es in der Prüfung:</b> ${esc(q.ihk)}</span></div>`};
  const wrongL=G.qs.filter(x=>x.res!=="ok"), rightL=G.qs.filter(x=>x.res==="ok");
  const review=(wrongL.length?`<p class="muted" style="font-size:.95rem">Zuerst das, was noch nicht saß (${wrongL.length}):</p>`+wrongL.map(rv1).join(""):`<p>Alles richtig – stark!</p>`)
    +(rightL.length?`<details${wrongL.length?"":" open"}><summary>Richtig gelöst (${rightL.length}) ansehen</summary><div class="review" style="margin-top:10px">${rightL.map(rv1).join("")}</div></details>`:"");
  app.innerHTML=`${topBar()}<div class="scene">${scene(fogEnd,{dawn,ghost:dawn?0.2:.6,thief:thief})}</div>
  <div class="panel appear"><span class="eyebrow">Ende des Einsatzes</span><h2>${title}</h2><p class="story">${story}</p>
   <div class="word" aria-label="Lösungswort">${word}</div></div>
  <div class="card"><span class="eyebrow">Punktekarte · zum Vorzeigen</span>
   <h3>${esc(G.team)}</h3><span class="muted">${G.mode==="a"?"Anfänger":"Profi"}${G.kind==="fehler"?" · Fehler-Flut":""}${G.code?" · Code "+esc(G.code):""} · Kapitel ${G.chs.join(", ")}</span>
   <div class="stars">${[0,1,2].map(i=>ICON.star(i<stars)).join("")}</div>
   <div class="kpis"><div><b>${G.score}/${G.max}</b>Punkte</div><div><b>${ok}/${tot}</b>ganz richtig</div><div><b>${clears}/${G.chs.length}</b>klare Buchstaben</div></div>
   ${G.used?`<span class="muted" style="font-size:.9rem">Funksprüche benutzt: ${G.used}</span>`:""}
   ${G.kind!=="fehler"&&G.chs.some(c=>[1,2,6].includes(c))?`<span style="font-size:.95rem">Plünderer: <b>${thiefEnd()}</b></span>`:""}
   ${Object.keys(G.search).map(k=>`<span style="font-size:.95rem">${esc(SEARCH[k].title)}: ${G.search[k].found.length}/${SEARCH[k].spots.filter(p=>p.err).length} gefunden</span>`).join("")}
   ${G.duel?`<span style="font-size:.95rem">Rampen-Duell: ${G.duel.right} richtig</span>`:""}
   ${G.fixedNow?`<span style="font-size:.95rem"><b>${G.fixedNow}</b> alte Fehler ausgebügelt. Auf der Fehlerliste stehen noch ${DB.wrong[G.mode].length}.</span>`:""}
   <span class="muted" style="font-size:.9rem">${pct} %${G.kind==="normal"&&!G.code?" · Rekord auf diesem Gerät: "+DB.best[G.mode]+" %":""}</span></div>
  <div class="panel"><h3>Eure Entscheidungen</h3><div class="review">${review}</div></div>
  <div class="panel"><h3>Noch eine Tide?</h3>
   <p class="muted" style="font-size:.95rem">${G.code?"Mit demselben Code kommen dieselben Fragen. ":"Beim nächsten Mal kommen zuerst Fragen, die ihr noch nicht hattet. "}Falsche Antworten landen auf eurer Fehlerliste – dafür gibt es auf der Startseite die Fehler-Flut.</p>
   <div class="row"><button class="btn" id="again">Noch eine Tide (${G.mode==="a"?"Anfänger":"Profi"})</button><button class="btn ghost" id="other">${G.mode==="a"?"Jetzt als Profi":"Jetzt als Anfänger"}</button><button class="btn ghost" id="home">Startseite</button></div></div>`;
  bindTop();
  $("#again").onclick=()=>{S.mode=G.mode;if(G.kind==="normal")S.chs=G.chs;startGame(G.kind==="fehler"&&DB.wrong[G.mode].length?"fehler":"normal")};
  $("#other").onclick=()=>{S.mode=G.mode==="a"?"p":"a";if(G.kind==="normal")S.chs=G.chs;startGame("normal")};
  $("#home").onclick=()=>{G=null;render();window.scrollTo(0,0)};
}

// Test-Hilfe (nur für automatische Prüfung)
window.__fort={get G(){return G},get DB(){return DB},POOL,CHAPTERS,SEARCH};
render();
})();
</script>

</body>
