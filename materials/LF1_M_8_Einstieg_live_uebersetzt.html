<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sortiments-Detektive (mehrsprachig)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#f1efe9;--surface:#fff;--surface2:#f7f5f0;--ink:#1f1d18;--muted:#5f5a4f;--line:#d9d3c6;
  --brand:#7a3e00;--brand-ink:#fff;--ok:#1f7a3f;--bad:#b3261e;--warn:#a15c00;
  --kauf:#1f5fae;--kauf-soft:#dde8f7;--verk:#c2410c;--verk-soft:#fbe6dc;--beob:#5b4b8a;--beob-soft:#e9e3f5;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#f0a95a;--brand-ink:#1a1209;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --kauf:#7fb0ff;--kauf-soft:#1b2a40;--verk:#ff8a5c;--verk-soft:#3a2219;--beob:#b9a6f0;--beob-soft:#2a2340;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#f0a95a;--brand-ink:#1a1209;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --kauf:#7fb0ff;--kauf-soft:#1b2a40;--verk:#ff8a5c;--verk-soft:#3a2219;--beob:#b9a6f0;--beob-soft:#2a2340;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0 0 .4em;line-height:1.1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.6em 1em}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.45;cursor:default}
input,textarea{font:inherit;width:100%;padding:.6em .7em;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.merk{border-left:6px solid var(--brand);background:var(--surface);border-radius:10px;padding:12px 14px;margin:8px 0}
.merk b.k{color:var(--kauf)} .merk b.v{color:var(--verk)}
.term{font-weight:700;border-bottom:3px solid var(--brand)}
.alt{font-weight:400;color:var(--muted);font-size:.9em}
/* ---------- Tafel ---------- */
#tafel header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tafel header h1{font-size:1.35rem;margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.steps button{padding:.35em .8em;font-size:.9rem}
.steps button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mini{display:flex;align-items:center;gap:10px;font-size:.9rem}
.mini canvas{width:64px;height:64px;border-radius:6px;background:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px}
.dot.on{background:var(--ok)}
#tMain{padding:20px 22px 40px;max-width:1400px;margin:0 auto}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.ctrl button{font-size:1.05rem}
.big{font-size:clamp(1.6rem,3.2vw,2.6rem)}
.join{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:28px;align-items:start}
.join canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:14px}
.code{font-family:var(--display);font-size:3rem;font-weight:800;letter-spacing:.12em}
.nicks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nicks button{padding:.3em .7em;font-size:.95rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.clock{font-family:var(--display);font-size:3rem;font-weight:800}
.chip{display:inline-block;border-radius:999px;padding:.2em .7em;margin:3px;font-weight:700;font-family:var(--display)}
.chip.k{background:var(--kauf-soft);color:var(--kauf)} .chip.v{background:var(--verk-soft);color:var(--verk)}
.banner{border-radius:12px;padding:12px 16px;margin-top:14px;font-size:1.2rem}
.banner.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));border:2px solid var(--ok)}
.banner.nf{background:var(--kauf-soft);border:2px solid var(--kauf)}
.banner.af{background:var(--verk-soft);border:2px solid var(--verk)}
.banner.info{background:var(--surface);border:2px solid var(--brand)}
.satz{display:block;margin-top:6px;font-size:1rem;color:var(--muted)}
.hbar{display:grid;grid-template-columns:140px 1fr 60px;gap:10px;align-items:center;margin:10px 0;font-size:1.15rem}
.hbar .t{height:34px;border-radius:8px;background:var(--surface2);overflow:hidden}
.hbar .t i{display:block;height:100%;transition:width .4s}
.hbar b{font-family:var(--display);font-size:1.8rem;text-align:right}
table.mt{border-collapse:collapse;width:100%;background:var(--surface);border-radius:12px;overflow:hidden;font-size:1.05rem}
table.mt th,table.mt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
table.mt th{background:var(--surface2);font-size:.9rem}
table.mt tr.cur td{outline:3px solid var(--brand);outline-offset:-3px}
table.mt tr.eq td{background:color-mix(in srgb,var(--ok) 18%,var(--surface));font-weight:700}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{font-family:var(--display);font-weight:800;font-size:1.1rem;padding:.4em .8em}
.pchips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pchips button.done{border-color:var(--ok);border-width:2px}
.scen{text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line)}
.scen b{display:block;font-family:var(--display);font-size:1.3rem;margin-bottom:4px}
svg text{font-family:var(--body)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer{font-family:var(--display);font-size:3rem;font-weight:800;min-width:2.2em;text-align:center;border-radius:50%;background:var(--surface);border:4px solid var(--brand);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{border-radius:14px;padding:14px 16px;color:#fff;font-size:1.2rem;font-weight:700;position:relative}
.o0{background:#b3261e}.o1{background:#1f5fae}.o2{background:#8a5300}.o3{background:#3a7a1c}.o4{background:#8537a3}
.opt.wrong{opacity:.35}
.opt .cnt{position:absolute;right:14px;top:10px;font-family:var(--display);font-size:1.6rem}
.top{list-style:none;padding:0;margin:0}
.top li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--surface);margin-bottom:6px;font-size:1.15rem}
.top li b{font-family:var(--display)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:24px}
.podium div{background:var(--brand);color:var(--brand-ink);border-radius:14px 14px 0 0;width:200px;text-align:center;padding:12px;font-family:var(--display);font-weight:800}
.podium span{display:block;font-size:1.4rem}
.pro{font-size:.75rem;font-weight:700;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.qtab{border-collapse:collapse;margin:8px 0;background:var(--surface)}
.qtab td,.qtab th{border:1px solid var(--line);padding:4px 10px;text-align:center}
@media (max-width:900px){.two,.three,.join,.opts{grid-template-columns:1fr}}
/* ---------- Handy ---------- */
#phone{max-width:560px;margin:0 auto;padding:14px 16px 40px}
#phone .ph-top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.card{border-radius:18px;padding:16px 18px;border:3px solid;margin-bottom:12px}
.card.K{background:var(--kauf-soft);border-color:var(--kauf)} .card.V{background:var(--verk-soft);border-color:var(--verk)} .card.B{background:var(--beob-soft);border-color:var(--beob)}
.card .role{font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase}
.card.K .role{color:var(--kauf)} .card.V .role{color:var(--verk)} .card.B .role{color:var(--beob)}
.card .val{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1.05}
.card .cd{margin-top:8px;font-size:1rem}
.card .cd b{font-family:var(--display);font-size:1.8rem;letter-spacing:.1em}
.step{display:flex;align-items:center;gap:8px;margin:8px 0}
.step button{font-size:1.2rem;font-weight:800;padding:.5em .7em;min-width:3.2em}
.step .pv{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:2rem}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.status.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.status.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.yn button{padding:20px 10px;font-size:1.2rem;font-weight:700;border-radius:14px;border:3px solid var(--line)}
.yn button.sel{outline:4px solid var(--ink);outline-offset:1px}
.yn .y{background:color-mix(in srgb,var(--ok) 18%,var(--surface));border-color:var(--ok)}
.yn .n{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:var(--bad)}
.pbtn{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:14px;font-size:1.05rem}
.pbtn.sel{outline:4px solid var(--ink);outline-offset:-2px}
.popt{display:block;width:100%;margin:10px 0;padding:16px 14px;border-radius:14px;color:#fff;border:none;font-size:1.05rem;font-weight:700;text-align:left}
.bigpts{font-family:var(--display);font-size:2.4rem;font-weight:800}
.ansage{font-family:var(--display);font-weight:800;font-size:3rem;text-align:center;margin:6px 0}
:root{--t0:#1f5fae;--t1:#c2410c;--t2:#3a7a1c;--t3:#8537a3;--t4:#8a5300}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--t0:#7fb0ff;--t1:#ff8a5c;--t2:#8fd46a;--t3:#d39bf0;--t4:#f0b35a}}
:root[data-theme="dark"]{--t0:#7fb0ff;--t1:#ff8a5c;--t2:#8fd46a;--t3:#d39bf0;--t4:#f0b35a}
.tc{display:inline-block;white-space:nowrap;border-radius:999px;padding:.2em .75em;margin:3px;font-weight:700;font-family:var(--display);border:2px solid currentColor}
.tc0{color:var(--t0);background:color-mix(in srgb,var(--t0) 14%,var(--surface))}
.tc1{color:var(--t1);background:color-mix(in srgb,var(--t1) 14%,var(--surface))}
.tc2{color:var(--t2);background:color-mix(in srgb,var(--t2) 14%,var(--surface))}
.tc3{color:var(--t3);background:color-mix(in srgb,var(--t3) 14%,var(--surface))}
.tc4{color:var(--t4);background:color-mix(in srgb,var(--t4) 14%,var(--surface))}
.tc.dash{border-style:dashed;color:var(--muted);background:var(--surface2)}
.tc.big{font-size:1.15rem;padding:.35em .9em}
.kreuz{display:grid;grid-template-columns:2.4em 1fr 1fr;grid-template-rows:auto auto 2.4em;gap:8px}
.kz{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px;min-height:150px}
.kz .ql{font-family:var(--display);font-weight:800;font-size:1rem;margin-bottom:6px}
.kz .qd{font-size:.85rem;color:var(--muted);margin-bottom:6px}
.ax-y{grid-row:1/3;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:.95rem;color:var(--muted);display:flex;align-items:center;justify-content:center}
.ax-x{grid-column:2/4;text-align:center;font-size:.95rem;color:var(--muted);align-self:center}
.ax-x b,.ax-y b{color:var(--ink);font-family:var(--display);font-size:1.1rem}
.kz button.tc{cursor:pointer}
.icard{border:2px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface);margin:8px 0}
.icard b{display:block;font-family:var(--display);font-size:1.25rem}
.icard small{color:var(--muted)}
.cards8{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.cards8 .icard{margin:0;padding:8px 10px}
.cards8 .icard b{font-size:1.05rem}
.stair{display:flex;flex-direction:column-reverse;gap:6px;margin:8px 0;padding:10px;border-radius:14px;background:var(--surface2);min-height:60px}
.sbtn{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:12px;border-radius:12px;font-size:1.02rem}
.sbtn .lv{font-family:var(--display);font-weight:800;min-width:1.6em;text-align:center;border-radius:8px;background:var(--brand);color:var(--brand-ink);padding:2px 6px}
.sbtn.on{border:2px solid var(--brand)}
.sbtn.ok{border:2px solid var(--ok)} .sbtn.bad{border:2px solid var(--bad)}
.shelf{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.shelf .icard{margin:0}
.shelf .lt{font-family:var(--display);font-weight:800;font-size:2rem;color:var(--brand)}
.shelf .pr{font-family:var(--display);font-weight:800;font-size:1.6rem}
.vb{display:grid;grid-template-columns:1fr 3em;gap:6px;align-items:center;font-size:.9rem;margin:3px 0;padding:2px 6px;border-radius:6px}
.vb.ok{background:color-mix(in srgb,var(--ok) 18%,var(--surface));font-weight:700}
.vb i{display:block;height:10px;border-radius:5px;background:var(--brand);margin-top:2px}
table.mt td.ok{background:color-mix(in srgb,var(--ok) 22%,var(--surface));font-weight:700}
.res{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:8px 0}
.okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}
@media (max-width:900px){.shelf{grid-template-columns:1fr 1fr}}
.hbar{grid-template-columns:150px 1fr 90px}
</style>
</head>

  <main id="tMain"></main>
</div>
<div id="phone" hidden></div>

 {q:"Welcher Vorteil hat eine Handelsmarke (z. B. „Maxi-Jeans“) für den Händler?",o:["Der Hersteller bezahlt die ganze Werbung.","Kunden bekommen sie nur bei ihm – das bindet die Kunden.","Sie ist in jedem Geschäft erhältlich.","Sie hat immer die höchste Qualität.","Sie wird überall zum gleichen Preis verkauft."],k:1,x:"Handelsmarke: Kundenbindung, Abgrenzung von der Konkurrenz, unabhängiger vom Hersteller, freiere Kalkulation."},
 {q:"Eine Kaffeemaschine aus dem Sortiment hat sich zum Trendartikel entwickelt. Wodurch wird ein Trendartikel gekennzeichnet?",o:["Er kann mit geringerem Handlungskostenzuschlag kalkuliert werden.","Er kann jederzeit ohne Beschaffungsprobleme nachgekauft werden.","Er muss in verkaufsstarken Zonen platziert werden.","Er wird über eine bestimmte Zeit verstärkt von Kunden nachgefragt.","Er muss durch Werbemaßnahmen besonders beworben werden."],k:3,x:"Trendartikel = eine bestimmte Zeit lang verstärkt nachgefragt („alle wollen ihn gerade“)."},
 {pro:1,q:"Ein Discounter hat ein schmales und flaches Sortiment. Warum kann er damit günstige Preise anbieten?",o:["Er führt nur teure Markenartikel.","Er bietet besonders viel Beratung.","Wenige Artikel in großen Mengen: niedrige Lagerkosten und günstiger Einkauf.","Er hat ein besonders großes Randsortiment.","Ein flaches Sortiment ist immer steuerfrei."],k:2,x:"Kleines Sortiment → geringe Lagerkosten, wenig Personal, große Einkaufsmengen je Artikel → niedrige Preise.",pz:"Begründe in zwei Sätzen, wo der Discounter im Sortiments-Kreuz steht."},
 {pro:1,q:"Was droht einem Händler, dessen Sortiment zu groß ist?",o:["Kunden wandern zur Konkurrenz ab, weil sie nichts finden.","Hohe Lagerkosten; Ware kann verderben oder unmodern werden.","Der Umsatz sinkt, weil die Auswahl fehlt.","Er darf keine Handelsmarken mehr führen.","Er verliert automatisch sein Kernsortiment."],k:1,x:"Zu groß: hohe Lagerkosten, Verderb, Ware wird unmodern. Zu klein: Kunden gehen zur Konkurrenz, der Umsatz sinkt.",pz:"Ein Elektronikfachmarkt will Kaffeebohnen aufnehmen. Beurteile das mit Kundenerwartung, Konkurrenz und Sortimentsumfang."}];
const DUR=30,DURPRO=45;
const PHASES=["Start","Eistee-Treppe","Tütenrätsel","Mein Betrieb","Schuhgeschäft","Regal-Blitz","Merken","Prüfungs-Check","Sieger"];

function pyramidSVG(mark){
  const top=16,H=58,n=7,cx=150,hw=y=>14+(y-top)/(n*H)*136;
  let s=`<svg viewBox="0 0 760 ${top+n*H+10}" style="width:100%;background:var(--surface);border-radius:12px" role="img" aria-label="Sortimentspyramide mit sieben Stufen">`;
  for(let j=0;j<n;j++){const i=6-j,y0=top+j*H,y1=y0+H-4,ok=mark?mark[i]:null;
    s+=`<polygon points="${cx-hw(y0)},${y0} ${cx+hw(y0)},${y0} ${cx+hw(y1)},${y1} ${cx-hw(y1)},${y1}" fill="color-mix(in srgb,var(--brand) ${18+j*9}%,var(--surface))" stroke="var(--brand)"/>
    <text x="${cx}" y="${y0+H/2+6}" font-size="20" font-weight="700" text-anchor="middle" fill="currentColor">${i+1}</text>
    <text x="320" y="${y0+24}" font-size="20" font-weight="700" fill="currentColor">${h(TREPPE[i].f)}</text>
    <text x="320" y="${y0+46}" font-size="17" fill="var(--muted)">${h(TREPPE[i].t)}${ok===true?"  ✓":ok===false?"  ✗":""}</text>`;}
  return s+`</svg>`;}
/* cells: [schmal+tief, breit+tief, schmal+flach, breit+flach] */
function kreuzHTML(cells,rev){
  const cell=i=>`<div class="kz"><div class="ql">${rev?QNAME[i]:""}</div><div class="qd">${QDESC[i]}</div>${cells[i]||""}</div>`;
  return `<div class="kreuz"><div class="ax-y">${rev?"<b>flach</b>&nbsp; wenig Auswahl ⟶ viel Auswahl in einer Gruppe &nbsp;<b>tief</b>":"wenig Auswahl ⟶ viel Auswahl in einer Gruppe"}</div>
    ${cell(0)}${cell(1)}${cell(2)}${cell(3)}
    <div class="ax-x">${rev?"<b>schmal</b>&nbsp; wenige Warengruppen ⟶ viele Warengruppen &nbsp;<b>breit</b>":"wenige Warengruppen ⟶ viele Warengruppen"}</div></div>`;}
const tc=(i,txt,cls)=>`<span class="tc tc${i} ${cls||""}">${txt}</span>`;

const MERK=`
<div class="merk"><b>Sortiment</b> = alle Waren und Dienstleistungen, die ein Geschäft seinen Kunden anbietet. Die <span class="term">Sortimentspyramide</span> hat 7 Stufen: unten die <b>Sorte</b> (genau diese eine Flasche), oben <b>alle Einzelhandelswaren</b>.</div>
<div class="merk"><span class="term">Breite</span> = Anzahl der Warengruppen (breit ↔ schmal).<br><span class="term">Tiefe</span> = Auswahl innerhalb einer Warengruppe (tief ↔ flach).<span class="satz">Prüfungsregel: Tiefe = große Auswahl innerhalb einer Warengruppe.</span></div>
<div class="merk"><span class="term">Kernsortiment</span>: ständig vorrätig, Hauptumsatz · <span class="term">Zusatzsortiment</span>: passt dazu · <span class="term">Randsortiment</span>: rundet ab, auch branchenfremd (Bettwäsche in der Möbelabteilung) · <span class="term">Saisonsortiment</span>: nur zu bestimmten Zeiten.</div>
<div class="merk"><span class="term">Markenartikel</span>: Hersteller wirbt, überall gleich gute Qualität · <span class="term">Handelsmarke</span> <span class="alt">(Eigenmarke)</span>: Name des Händlers, nur bei ihm → Kundenbindung · <span class="term">Me-too-Artikel</span>: Nachahmer · <span class="term">No-Name-Artikel</span>: gar kein Name.</div>
<div class="merk">Sortiment <b>zu groß</b>: hohe Lagerkosten, Ware verdirbt oder wird unmodern. <b>Zu klein</b>: Kunden gehen zur Konkurrenz.</div>`;

</script>
<script>

/* =========================================================
   TAFEL (Lehrkraft, Beamer)
   ========================================================= */
function tafelApp(){
  $("tafel").hidden=false;
  const KEY="sortiment8_tafel";
  const fresh=()=>({code:codeGen(),ph:0,pl:{},kick:[],url:"",dealt:false,rev:{tr:0,tu:0,sc:0,rg:0},
    tr:{},tu:{},dc:{},mb:{},mbHide:[],sc:{},sp:{},rg:{},q:-1,qOpen:false,qStart:0,qAns:{}});
  let T=store(KEY);if(!T||!T.code)T=fresh();
  let conn={up:0,all:2},pubT=null,subbed="";
  const net=new Net(onMsg,c=>{conn=c;if(c.up)pub();renderHead();});
  function sub(){if(subbed!==T.code){subbed=T.code;net.sub(T.code+"/in");}}
  sub();
  const save=()=>store(KEY,T);
  const players=()=>Object.keys(T.pl);
  const isInt=(x,lo,hi)=>Number.isInteger(x)&&x>=lo&&x<=hi;
  const intArr=(a,n,lo,hi)=>Array.isArray(a)&&a.length===n&&a.every(x=>isInt(x,lo,hi));

  /* ---------- Tüten verteilen (bis 17 Personen ohne Tüte B, wie in der Handreichung) ---------- */
  const tList=()=>players().length<=17?[0,2,3,4]:[0,2,3,1,4];
  function deal(){const L=tList();shuffle(players()).forEach((id,i)=>{T.pl[id].t=L[i%L.length];});T.dealt=true;}
  function dealLate(id){const L=tList(),cnt=L.map(t=>players().filter(p=>T.pl[p].t===t).length);T.pl[id].t=L[cnt.indexOf(Math.min(...cnt))];}

  function onMsg(t,p){
    if(t!==NS+T.code+"/in"||!p||!p.p)return;
    const pid=clean(p.p,12);if(T.kick.includes(pid))return;
    const ph=T.ph;
    if(p.k==="hi"){const n=clean(p.n,16)||"?";
      if(!T.pl[pid]){T.pl[pid]={n,t:null};if(T.dealt)dealLate(pid);}else T.pl[pid].n=n;}
    else if(!T.pl[pid])return;
    else if(p.k==="tr"&&ph===1&&!T.rev.tr&&intArr(p.o,7,0,6)&&new Set(p.o).size===7)T.tr[pid]=p.o;
    else if(p.k==="tu"&&ph===2&&!T.rev.tu&&T.pl[pid].t!=null&&isInt(p.g,0,7)&&isInt(p.w,0,1)&&isInt(p.a,0,1))T.tu[pid]={t:T.pl[pid].t,g:p.g,w:p.w,a:p.a};
    else if(p.k==="dc"&&ph===2&&isInt(p.c,0,3))T.dc[pid]=p.c;
    else if(p.k==="mb"&&ph===3&&isInt(p.w,0,1)&&isInt(p.a,0,1)&&clean(p.n,28))T.mb[pid]={n:clean(p.n,28),w:p.w,a:p.a};
    else if(p.k==="sc"&&ph===4&&!T.rev.sc&&intArr(p.a,8,0,2))T.sc[pid]=p.a;
    else if(p.k==="sp"&&ph===4&&!T.rev.sc&&isInt(p.c,0,3))T.sp[pid]=p.c;
    else if(p.k==="rg"&&ph===5&&!T.rev.rg&&intArr(p.a,4,0,3))T.rg[pid]=p.a;
    else if(p.k==="a"&&ph===7&&T.qOpen&&p.q===T.q){
      const A=(T.qAns[T.q]=T.qAns[T.q]||{});if(A[pid])return;
      const c=p.c;if(!isInt(c,0,QUIZ[T.q].o.length-1))return;
      const dur=QUIZ[T.q].pro?DURPRO:DUR,s=(Date.now()-T.qStart)/1000;
      A[pid]={c,g:c===QUIZ[T.q].k?1000+Math.round(500*Math.max(0,1-s/dur)):0};
      if(Object.keys(A).length>=players().length)T.qOpen=false;}
    else return;
    save();pub();render();
  }

  /* ---------- Detektiv-Punkte (zählen erst nach der Auflösung) ---------- */
  function det(pid){let s=0;
    if(T.rev.tr&&T.tr[pid])T.tr[pid].forEach((c,i)=>{if(c===i)s+=50;});
    if(T.rev.tu&&T.tu[pid]){const U=T.tu[pid],X=TUETEN[U.t];if(U.g===X.s)s+=100;if(U.w===X.w)s+=100;if(U.a===X.a)s+=100;}
    if(T.rev.sc&&T.sc[pid]){T.sc[pid].forEach((c,i)=>{if(c===SCHUH[i].k)s+=50;});if(T.sp[pid]===SAISON.k)s+=100;}
    if(T.rev.rg&&T.rg[pid])T.rg[pid].forEach((c,i)=>{if(c===REGAL[i].k)s+=100;});
    return s;}
  function points(pid){let s=0;for(const qi in T.qAns){if(+qi<T.q||(+qi===T.q&&!T.qOpen)){const a=T.qAns[qi][pid];if(a)s+=a.g;}}return s;}
  function ranking(){return players().map(id=>({id,n:T.pl[id].n,s:points(id)})).sort((a,b)=>b.s-a.s);}

  /* ---------- Zustand an alle Handys ---------- */
  function pub(){clearTimeout(pubT);pubT=setTimeout(()=>{
    const pp={};
    for(const id of players()){pp[id]={t:T.pl[id].t,tr:!!T.tr[id],tu:!!T.tu[id],dc:T.dc[id]!=null,mb:!!T.mb[id],sc:!!T.sc[id],sp:T.sp[id]!=null,rg:!!T.rg[id],d:det(id)};}
    const S={ph:T.ph,j:players(),kick:T.kick,rev:T.rev,pp,q:T.q,qOpen:T.qOpen,ans:[]};
    if(T.ph===7&&T.q>=0){S.ans=Object.keys(T.qAns[T.q]||{});S.rem=T.qOpen?Math.max(0,(QUIZ[T.q].pro?DURPRO:DUR)-(Date.now()-T.qStart)/1000):0;}
    if(T.ph>=7){const r=ranking();S.sc={};let rank=0,last=-1;
      r.forEach((x,i)=>{if(x.s!==last){rank=i+1;last=x.s;}const a=(T.qAns[T.q]||{})[x.id];S.sc[x.id]=[x.s,rank,T.qOpen?0:(a?a.g:0)];});S.np=r.length;}
    net.pub(T.code+"/st",S,true);},120);}
  setInterval(pub,5000);

  function go(ph){T.ph=ph;if(ph===2&&!T.dealt)deal();save();pub();render();}
  function reveal(k){T.rev[k]=1;save();pub();render();}

  /* ---------- Kopfzeile ---------- */
  function joinUrl(){
    const extra=(params.get("broker")?"&broker="+encodeURIComponent(params.get("broker")):"")+(LOCAL?"&bc=1":"");
    if(location.protocol.startsWith("http"))return location.origin+location.pathname+"?s="+T.code+extra;
    if(T.url){const u=T.url.trim();return u+(u.includes("?")?"&":"?")+"s="+T.code+extra;}
    if(LOCAL)return location.href.split("?")[0]+"?s="+T.code+extra;return "";}
  function drawQR(canvas,text){
    const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(!text||typeof QRLib==="undefined"){ctx.fillStyle="#999";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText("keine Adresse",canvas.width/2,canvas.height/2);return;}
    const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();
    const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
    ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}
  function renderHead(){
    $("steps").innerHTML=PHASES.map((p,i)=>`<button data-ph="${i}" class="${i===T.ph?"on":""}">${i} ${p}</button>`).join("");
    $("steps").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.ph));
    $("miniCode").textContent="Code "+T.code;$("miniN").textContent=players().length+" dabei";
    $("conn").innerHTML=`<span class="dot ${conn.up?"on":""}"></span>${conn.up?"verbunden":"keine Verbindung"}`;
    drawQR($("qrSmall"),joinUrl());}
  function render(){renderHead();const M=$("tMain");[rStart,rTreppe,rTueten,rBetrieb,rSchuh,rRegal,rMerk,rQuiz,rWin][T.ph](M);}
  const nextBtn=(ph,label)=>`<button id="bNext">${label} →</button>`;
  const bindNext=ph=>{if($("bNext"))$("bNext").onclick=()=>go(ph);};
  const done=(obj)=>Object.keys(obj).filter(id=>T.pl[id]).length;

  /* ---------- 0 Start ---------- */
  function rStart(M){
    const pl=Object.entries(T.pl);
    M.innerHTML=`<div class="join"><div><canvas id="qrBig" width="600" height="600"></canvas></div>
      <div><h2 class="big">Willkommen, Sortiments-Detektive!</h2>
      <p style="font-size:1.25rem">1. QR-Code mit dem Handy scannen.<br>2. Einen Spitznamen eingeben.<br>3. Gleich ermittelt ihr: Wie ist ein Sortiment aufgebaut?</p>
      <p class="muted">Code: <span class="code">${T.code}</span><br><span id="jU" style="word-break:break-all"></span></p>
      ${location.protocol.startsWith("http")||LOCAL?"":`<label>Internetadresse dieser Seite (nur nötig, wenn die Datei lokal geöffnet ist)<input id="tUrl" value="${h(T.url)}" placeholder="https://…/sortiments-detektive/"></label>`}
      <h3 style="margin-top:16px">${pl.length} dabei <span class="muted" style="font-size:.9rem;font-weight:400">· Antippen entfernt einen Namen</span></h3>
      <div class="nicks">${pl.map(([id,x])=>`<button data-id="${h(id)}">${h(x.n)}</button>`).join("")}</div>
      <div class="ctrl"><button class="pri" id="bGo">Los: Eistee-Treppe →</button><button id="bNew">Neue Sitzung (alles löschen)</button></div></div></div>`;
    drawQR($("qrBig"),joinUrl());$("jU").textContent=joinUrl();
    if($("tUrl"))$("tUrl").onchange=e=>{T.url=e.target.value;save();render();};
    M.querySelectorAll(".nicks button").forEach(b=>b.onclick=()=>{const id=b.dataset.id;delete T.pl[id];T.kick.push(id);save();pub();render();});
    $("bGo").onclick=()=>go(1);
    $("bNew").onclick=()=>{if(window.confirm("Neue Sitzung starten? Alle Namen und Ergebnisse werden gelöscht.")){const u=T.url;T=fresh();T.url=u;save();sub();pub();render();}};
  }

  /* ---------- 1 Eistee-Treppe ---------- */
  function rTreppe(M){
    const ids=Object.keys(T.tr).filter(id=>T.pl[id]),n=ids.length;
    const pct=i=>n?Math.round(100*ids.filter(id=>T.tr[id][i]===i).length/n):0;
    M.innerHTML=`<div class="two"><div><h2 class="big">Die Eistee-Treppe</h2>
      <p style="font-size:1.25rem">Legt die 7 Karten auf dem Handy wie eine Treppe.<br><b>Unten:</b> das Kleinste – eine einzelne Flasche.<br><b>Oben:</b> alles zusammen.</p>
      <p class="muted">${n} von ${players().length} abgegeben · Balken = Anteil mit der richtigen Karte auf dieser Stufe</p>
      ${[6,5,4,3,2,1,0].map(i=>`<div class="hbar"><span>Stufe ${i+1}${i===0?" (unten)":i===6?" (oben)":""}</span><div class="t"><i style="width:${pct(i)}%;background:var(--ok)"></i></div><b>${pct(i)} %</b></div>`).join("")}</div>
      <div>${T.rev.tr?`<h3>Die Sortimentspyramide <span class="muted" style="font-weight:400">(Lehrbuch S. 64)</span></h3>${pyramidSVG()}
        <div class="merk">Die <span class="term">Sorte</span> ist genau diese eine Flasche, die du in die Hand nimmst.<span class="satz">Satzbaustein: Mehrere Sorten ergeben einen Artikel, mehrere Artikel eine Artikelgruppe.</span></div>`
        :`<div class="box" style="text-align:center;padding:60px 16px"><div class="code">?</div><p>Die Auflösung kommt, wenn alle abgegeben haben.</p><p class="muted">Vergleicht vorher mit dem Nachbarn: Wo seid ihr euch nicht einig?</p></div>`}</div></div>
      <div class="ctrl">${T.rev.tr?"":`<button class="pri" id="bRev">Auflösen</button>`}${nextBtn(2,"Weiter: Tütenrätsel")}</div>`;
    if($("bRev"))$("bRev").onclick=()=>reveal("tr");bindNext(2);
  }

  /* ---------- 2 Tütenrätsel + Sortiments-Kreuz ---------- */
  function rTueten(M){
    const L=tList().filter(t=>players().some(id=>T.pl[id].t===t)),rev=T.rev.tu;
    const ans=t=>Object.entries(T.tu).filter(([id,U])=>T.pl[id]&&U.t===t).map(([,U])=>U);
    const rows=L.map(t=>{const X=TUETEN[t],A=ans(t),nA=players().filter(id=>T.pl[id].t===t).length;
      const sv=SHOPS.map((_,g)=>A.filter(U=>U.g===g).length),top=sv.indexOf(Math.max(...sv));
      const w1=A.filter(U=>U.w===1).length,a1=A.filter(U=>U.a===1).length;
      return `<tr><td>${tc(t,"Tüte "+X.id)}</td><td>${A.length}/${nA}</td>
        <td class="${rev&&top===X.s&&A.length?"ok":""}">${A.length?h(SHOPS[top])+" ("+sv[top]+")":"–"}${rev?`<br><b>${SHOPS[X.s]}</b>`:""}</td>
        <td class="${rev&&A.length&&(w1*2>A.length)===(X.w===1)?"ok":""}">${w1} viele · ${A.length-w1} wenige${rev?`<br><b>${W_F[X.w]}</b>`:""}</td>
        <td class="${rev&&A.length&&(a1*2>A.length)===(X.a===1)?"ok":""}">${a1} viel · ${A.length-a1} wenig${rev?`<br><b>${A_F[X.a]}</b>`:""}</td></tr>`;}).join("");
    const cells=["","","",""];
    if(!rev){for(const t of L){const A=ans(t),c=[0,0,0,0];A.forEach(U=>c[quad(U.w,U.a)]++);c.forEach((k,q)=>{if(k)cells[q]+=tc(t,TUETEN[t].id+" ×"+k);});}}
    else{for(const t of L){const X=TUETEN[t];cells[quad(X.w,X.a)]+=tc(t,`Tüte ${X.id} · ${SHOPS[X.s]}`,"big");}
      const dv=Object.keys(T.dc).filter(id=>T.pl[id]),dOk=dv.filter(id=>T.dc[id]===2).length;
      cells[2]+=tc(0,`Discounter${dv.length?` (Profi-Tipps: ${dOk} von ${dv.length} richtig)`:""}`,"dash big");
      cells[1]+=tc(0,"echtes großes Warenhaus","dash big");}
    M.innerHTML=`<h2 class="big">Tütenrätsel: Aus welchem Geschäft kommt die Tüte?</h2>
      <div class="two"><div>
        <table class="mt"><tr><th>Tüte</th><th>fertig</th><th>Geschäft</th><th>Warengruppen</th><th>Auswahl in einer Gruppe</th></tr>${rows}</table>
        ${rev?`<div class="merk">Viele Warengruppen = <span class="term">breites</span> Sortiment, wenige = <span class="term">schmales</span>.<br>Viel Auswahl in einer Gruppe = <span class="term">tiefes</span> Sortiment, wenig = <span class="term">flaches</span>.
          <span class="satz">Merkhilfe: Breite = Arme seitlich ausbreiten · Tiefe = Hand nach vorn schieben.</span>
          <span class="satz">Satzbaustein: „Das Geschäft hat ein schmales und tiefes Sortiment, weil …“</span></div>`
        :`<div class="merk">Reihenfolge der Vorstellung: A → C → D → B → E (je 1 Minute).<span class="satz">„Wir glauben, das ist ein …, weil …“ · „Das Geschäft hat viele / wenige Warengruppen. In einer Warengruppe gibt es viel / wenig Auswahl.“</span></div>`}
      </div><div>${kreuzHTML(cells,rev)}</div></div>
      <div class="ctrl">${rev?"":`<button class="pri" id="bRev">Auflösen: Fachbegriffe</button><button id="bDeal">Tüten neu verteilen</button>`}${nextBtn(3,"Weiter: Mein Betrieb")}</div>`;
    if($("bRev"))$("bRev").onclick=()=>reveal("tu");
    if($("bDeal"))$("bDeal").onclick=()=>{if(window.confirm("Tüten neu verteilen? Bisherige Antworten werden gelöscht.")){T.tu={};deal();save();pub();render();}};
    bindNext(3);
  }

  /* ---------- 3 Mein Betrieb ---------- */
  function rBetrieb(M){
    const cells=["","","",""],grp={};
    for(const id in T.mb){if(!T.pl[id])continue;const B=T.mb[id],key=B.n.toLowerCase()+"|"+quad(B.w,B.a);if(T.mbHide.includes(key))continue;
      (grp[key]=grp[key]||{n:B.n,q:quad(B.w,B.a),c:0}).c++;}
    Object.entries(grp).forEach(([k,g])=>{cells[g.q]+=`<button class="tc tc${g.q} big" data-k="${h(k)}">${h(g.n)}${g.c>1?" ×"+g.c:""}</button>`;});
    M.innerHTML=`<div class="two"><div><h2 class="big">Und mein Ausbildungsbetrieb?</h2>
      <p style="font-size:1.25rem">Trag deinen Betrieb auf dem Handy ein und ordne ihn ins Kreuz.</p>
      <p class="muted">${done(T.mb)} von ${players().length} eingetragen · Antippen blendet einen Namen aus</p>
      <div class="merk">Satzbaustein: „Mein Betrieb hat ein … Sortiment, weil …“<span class="satz">Wo sind sich Kolleginnen und Kollegen aus derselben Firma nicht einig? Warum?</span></div></div>
      <div>${kreuzHTML(cells,true)}</div></div>
      <div class="ctrl">${nextBtn(4,"Weiter: Schuhgeschäft")}</div>`;
    M.querySelectorAll(".kz button").forEach(b=>b.onclick=()=>{T.mbHide.push(b.dataset.k);save();render();});
    bindNext(4);
  }

  /* ---------- 4 Schuhgeschäft ---------- */
  function rSchuh(M){
    const ids=Object.keys(T.sc).filter(id=>T.pl[id]),rev=T.rev.sc;
    const cnt=(i,c)=>ids.filter(id=>T.sc[id][i]===c).length;
    const sv=Object.keys(T.sp).filter(id=>T.pl[id]),sc4=SAISON.o.map((_,c)=>sv.filter(id=>T.sp[id]===c).length);
    M.innerHTML=`<h2 class="big">Im Schuhgeschäft: Was ist wichtig, was ist Beiwerk?</h2>
      <div class="two"><div><table class="mt"><tr><th>Karte</th>${[0,1,2].map(c=>`<th>${rev?`<b>${SCHUH_F[c]}</b><br>`:""}${SCHUH_L[c]}</th>`).join("")}</tr>
        ${SCHUH.map((S,i)=>`<tr><td style="text-align:left"><b>${h(S.t)}</b><br><small class="muted">${h(S.d)}</small></td>${[0,1,2].map(c=>`<td class="${rev&&S.k===c?"ok":""}">${cnt(i,c)}</td>`).join("")}</tr>`).join("")}</table>
        <p class="muted">${ids.length} von ${players().length} fertig</p></div>
      <div>${rev?`<div class="merk"><span class="term">Kernsortiment</span>: Hauptteil, ständig vorrätig, bringt den Hauptumsatz.<span class="satz">Herren-, Damen-, Kinderschuhe</span></div>
          <div class="merk"><span class="term">Zusatzsortiment</span>: ergänzt das Kernsortiment – der Kunde bekommt alles für seinen Wunsch („One-Stop-Shopping“).<span class="satz">Ledertasche, Schuhcreme, Socken</span></div>
          <div class="merk"><span class="term">Randsortiment</span>: selten verlangt, rundet das Angebot ab, bringt Zusatzumsatz.<span class="satz">Stiefel Größe 48</span></div>
          <div class="merk"><span class="pro">Profi</span> Gummistiefel nur im Herbst = <span class="term">Saisonsortiment</span>. ${sv.length?`Profi-Tipps: ${sc4[3]} von ${sv.length} richtig.`:""}<span class="satz">Außerdem: Aktionssortiment (kurz und billig), Auslauf- und Probesortiment.</span></div>`
        :`<div class="box"><p style="font-size:1.2rem">Jede Karte kommt aus <b>Tüte E</b>. Sortiert sie auf dem Handy in drei Gruppen.</p><p class="muted">Die Fachbegriffe kommen bei der Auflösung.</p></div>`}</div></div>
      <div class="ctrl">${rev?"":`<button class="pri" id="bRev">Auflösen</button>`}${nextBtn(5,"Weiter: Regal-Blitz")}</div>`;
    if($("bRev"))$("bRev").onclick=()=>reveal("sc");bindNext(5);
  }

  /* ---------- 5 Regal-Blitz ---------- */
  function rRegal(M){
    const ids=Object.keys(T.rg).filter(id=>T.pl[id]),rev=T.rev.rg;
    M.innerHTML=`<h2 class="big">Regal-Blitz: Viermal Nuss-Nougat-Creme – worin unterscheiden sie sich?</h2>
      <div class="shelf">${REGAL.map((R,i)=>{const c=ART.map((_,a)=>ids.filter(id=>T.rg[id][i]===a).length),mx=Math.max(1,...c);
        return `<div class="icard"><div class="lt">${R.id}</div><b>${h(R.n)}</b><small>${h(R.d)}</small><div class="pr">${eur(R.p)}</div>
          ${ART.map((a,k)=>`<div class="vb ${rev&&k===R.k?"ok":""}"><div>${h(a)}<i style="width:${Math.round(100*c[k]/mx)}%"></i></div><b>${c[k]}</b></div>`).join("")}
          ${rev?`<p style="margin:.5em 0 0"><b>${ART[R.k]}</b>${ART_X[R.k]}</p>`:""}</div>`;}).join("")}</div>
      <p class="muted">${ids.length} von ${players().length} fertig · Außer Nutella und Nusspli sind alle Namen erfunden.</p>
      ${rev?`<div class="two"><div class="merk"><b>Stolperstein:</b> Die Handelsmarke hat einen Namen – den des Händlers. Der No-Name-Artikel hat gar keinen.</div>
        <div class="merk"><span class="pro">Profi</span> Warum führt Frischmarkt eine Handelsmarke?<span class="satz">Kundenbindung (gibt es nur dort) · Abgrenzung von der Konkurrenz · unabhängiger vom Hersteller · freiere Kalkulation</span></div></div>`:""}
      <div class="ctrl">${rev?"":`<button class="pri" id="bRev">Auflösen</button>`}${nextBtn(6,"Weiter: Merken")}</div>`;
    if($("bRev"))$("bRev").onclick=()=>reveal("rg");bindNext(6);
  }

  /* ---------- 6 Merken ---------- */
  function rMerk(M){
    M.innerHTML=`<h2 class="big">Das merken wir uns</h2><div class="two"><div>${MERK}</div><div>${pyramidSVG()}
      <p class="muted">Weiter im Modul: Nachlesen (Lehrbuch S. 64–68), Aufgabe 3 (Vorgemacht) und Aufgabe 4 (Warenhaus).</p></div></div>
      <div class="ctrl"><button class="pri" id="bNext">Weiter: Prüfungs-Check →</button></div>`;
    bindNext(7);
  }

  /* ---------- 7 Prüfungs-Check ---------- */
  function rQuiz(M){
    if(T.q<0){M.innerHTML=`<h2 class="big">Prüfungs-Check</h2><p style="font-size:1.25rem">${QUIZ.length} Fragen im Stil der IHK-Prüfung, die letzten beiden für Profis <span class="pro">Profi</span>. Richtig ist wichtiger als schnell.</p>
      <div class="ctrl"><button class="pri" id="bQ">Erste Frage →</button></div>`;$("bQ").onclick=()=>openQ(0);return;}
    const Q=QUIZ[T.q],A=T.qAns[T.q]||{},cnt=Q.o.map((_,i)=>Object.values(A).filter(a=>a.c===i).length),n=Object.keys(A).length,dur=Q.pro?DURPRO:DUR;
    M.innerHTML=`<div class="qhead"><div><p class="muted">Frage ${T.q+1} von ${QUIZ.length}${Q.pro?' <span class="pro">Profi</span>':""} · ${n} von ${players().length} geantwortet</p><h2 class="big">${h(Q.q)}</h2></div>
      ${T.qOpen?`<div class="timer" id="tm">${dur}</div>`:""}</div>
      <div class="opts">${Q.o.map((o,i)=>`<div class="opt o${i} ${!T.qOpen&&i!==Q.k?"wrong":""}">${"ABCDE"[i]}: ${h(o)}${T.qOpen?"":`<span class="cnt">${cnt[i]}</span>`}</div>`).join("")}</div>
      ${T.qOpen?"":`<div class="merk" style="font-size:1.15rem;margin-top:14px">${h(Q.x)}</div>`}
      <div class="ctrl">${T.qOpen?`<button class="pri" id="bR">Auflösen</button>`:T.q<QUIZ.length-1?`<button class="pri" id="bN">Nächste Frage →</button>`:""}<button id="bW">Zur Siegerehrung</button></div>`;
    if($("bR"))$("bR").onclick=()=>{T.qOpen=false;save();pub();render();};
    if($("bN"))$("bN").onclick=()=>openQ(T.q+1);
    $("bW").onclick=()=>{T.qOpen=false;go(8);};
    if(T.qOpen){clearInterval(window._qt);window._qt=setInterval(()=>{const s=Math.max(0,Math.ceil(dur-(Date.now()-T.qStart)/1000));if($("tm"))$("tm").textContent=s;
      if(s<=0&&T.qOpen){T.qOpen=false;save();pub();render();}if(!T.qOpen)clearInterval(window._qt);},250);}
  }
  function openQ(i){T.q=i;T.qOpen=true;T.qStart=Date.now();save();pub();render();}

  /* ---------- 8 Sieger ---------- */
  function rWin(M){
    const r=ranking(),dt=players().map(id=>({n:T.pl[id].n,s:det(id)})).sort((a,b)=>b.s-a.s);
    M.innerHTML=`<h2 class="big">Siegerehrung</h2><div class="two"><div><h3>Prüfungs-Check</h3>
      <div class="podium">${[1,0,2].filter(i=>r[i]).map(i=>`<div style="height:${[190,150,120][i]}px"><span>${i+1}.</span>${h(r[i].n)}<br>${r[i].s}</div>`).join("")}</div>
      <ol class="top" style="margin-top:14px">${r.slice(3,10).map((x,i)=>`<li><span>${i+4}. ${h(x.n)}</span><b>${x.s}</b></li>`).join("")}</ol></div>
      <div><h3>Beste Sortiments-Detektive</h3><ol class="top">${dt.slice(0,5).map((x,i)=>`<li><span>${i+1}. ${h(x.n)}</span><b>${x.s}</b></li>`).join("")}</ol>
      <p class="muted">Detektiv-Punkte aus Treppe, Tütenrätsel, Schuhgeschäft und Regal-Blitz (jeweils nach der Auflösung).</p></div></div>`;
  }
  render();
}

</script>
<script>

/* =========================================================
   HANDY (Schülerinnen und Schüler)
   ========================================================= */
function phoneApp(){
  $("phone").hidden=false;
  const KEY="sortiment8_p_"+roomCode+(params.get("t")||"");
  let me=store(KEY)||{};if(!me.pid){me.pid=rnd(8);}me.sel=me.sel||{};store(KEY,me);
  let S=null,lastKey="",pending=null,qEnd=0,qSel={};
  let dTr=[],dTu={s:0},dMb={n:"",w:null,a:null},dSc=[],dRg=[],mbEdit=false;
  const net=new Net((t,p)=>{if(t===NS+roomCode+"/st"&&p&&typeof p==="object")onState(p);},c=>{if(c.up)hello();});
  net.sub(roomCode+"/st");
  const send=o=>{o.p=me.pid;net.pub(roomCode+"/in",o,false);};
  const save=()=>store(KEY,me);
  function hello(){if(me.nick)send({k:"hi",n:me.nick});}
  setInterval(()=>{if(!S)return;
    if(me.nick&&!(S.j||[]).includes(me.pid))hello();
    else if(pending&&pending.done&&!pending.done())send(pending.msg);},2500);
  function onState(p){
    if(p.qOpen&&(!S||!S.qOpen||S.q!==p.q))qEnd=Date.now()+p.rem*1000;
    S=p;
    if((S.kick||[]).includes(me.pid)&&me.nick){me={pid:rnd(8),sel:{}};save();lastKey="";}
    render();
  }
  const mine=()=>(S&&S.pp&&S.pp[me.pid])||null;
  const order=(k,n)=>{if(!Array.isArray(me[k])||me[k].length!==n){me[k]=shuffle([...Array(n).keys()]);save();}return me[k];};
  function sendP(msg,doneFn){pending={msg,done:doneFn};send(msg);}
  const redraw=()=>{lastKey="";render();};
  function keyOf(){if(!me.nick)return "join";if(!S)return "wait";const m=mine();
    return JSON.stringify([S.ph,S.rev,m,S.q,S.qOpen,(S.ans||[]).includes(me.pid),S.ph>=7&&S.sc?S.sc[me.pid]:0]);}
  function render(){const k=keyOf();if(k===lastKey)return;lastKey=k;const P=$("phone");
    const m=mine();
    const top=`<div class="ph-top"><span>Sortiments-Detektive · ${roomCode}</span><span>${h(me.nick||"")}${m?` · ${m.d} Detektiv-Punkte`:""}</span></div>`;
    if(!me.nick){P.innerHTML=top+`<h2>Willkommen, Sortiments-Detektiv!</h2><p>Gib einen Spitznamen ein.</p>
      <input id="nk" maxlength="16" placeholder="Spitzname" autocomplete="off"><div style="height:10px"></div><button class="pri" id="bJ" style="width:100%">Mitmachen</button>`;
      $("bJ").onclick=()=>{const n=clean($("nk").value,16);if(!n)return;me.nick=n;save();hello();redraw();};return;}
    if(!S){P.innerHTML=top+`<p>Verbinde mit der Tafel …</p>`;return;}
    if(!m&&S.ph>0){P.innerHTML=top+`<p>Du wirst angemeldet …</p>`;return;}
    if(S.ph===0){P.innerHTML=top+`<h2>Du bist drin!</h2><p>Warte, bis es an der Tafel losgeht.</p>`;return;}
    [null,pTreppe,pTuete,pBetrieb,pSchuh,pRegal,pMerk,pQuiz,pWin][S.ph](P,top,m);
  }
  const wait=(txt)=>`<div class="status ok">${txt||"Abgegeben ✓"} Schau an die Tafel.</div>`;

  /* ---------- 1 Eistee-Treppe ---------- */
  function pTreppe(P,top,m){
    const sel=me.sel.tr;
    if(S.rev.tr){
      if(!sel){P.innerHTML=top+`<h2>Die Sortimentspyramide</h2>${pyramidSVG()}`;return;}
      const ok=sel.filter((c,i)=>c===i).length;
      P.innerHTML=top+`<h2>Deine Treppe: ${ok} von 7 richtig</h2>
        <div class="stair">${sel.map((c,i)=>`<div class="sbtn ${c===i?"ok":"bad"}"><span class="lv">${i+1}</span><span>${h(TREPPE[c].t)}<br><small>${c===i?"<span class='okc'>richtig</span>":"<span class='badc'>gehört auf Stufe "+(c+1)+"</span>"}</small></span></div>`).join("")}</div>
        ${pyramidSVG()}<div class="merk">Die <span class="term">Sorte</span> ist genau diese eine Flasche, die du in die Hand nimmst.</div>`;return;}
    if(m.tr){P.innerHTML=top+`<h2>Eistee-Treppe</h2>`+wait()+`<p class="muted">Vergleiche mit deinem Nachbarn: Wo seid ihr euch nicht einig?</p>`;return;}
    const ord=order("oTr",7),rest=ord.filter(c=>!dTr.includes(c));
    P.innerHTML=top+`<h2>Eistee-Treppe</h2><p>Tippe die Karten <b>von unten nach oben</b> an. Zuerst das Kleinste: eine einzelne Flasche.</p>
      <p class="muted" style="margin:0">Deine Treppe (antippen = zurücklegen)</p>
      <div class="stair">${dTr.length?dTr.map((c,i)=>`<button class="sbtn on" data-r="${i}"><span class="lv">${i+1}</span>${h(TREPPE[c].t)}</button>`).join(""):`<span class="muted">noch leer</span>`}</div>
      ${rest.length?`<p class="muted" style="margin:0">Noch übrig</p>${rest.map(c=>`<button class="sbtn" data-c="${c}">${h(TREPPE[c].t)}</button>`).join("")}`
        :`<button class="pri" id="bS" style="width:100%;margin-top:8px">Treppe abgeben</button>`}`;
    P.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{dTr.splice(+b.dataset.r,1);redraw();});
    P.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{dTr.push(+b.dataset.c);redraw();});
    if($("bS"))$("bS").onclick=()=>{me.sel.tr=dTr.slice();save();sendP({k:"tr",o:me.sel.tr},()=>S.ph!==1||S.rev.tr||(mine()||{}).tr);$("bS").textContent="Gesendet …";};
  }

  /* ---------- 2 Tütenrätsel ---------- */
  const tCards=(X,small)=>`<div class="cards8">${X.c.map(([a,b])=>`<div class="icard"><b>${h(a)}</b><small>${h(b)}</small></div>`).join("")}</div>`;
  function pTuete(P,top,m){
    if(m.t==null){P.innerHTML=top+`<h2>Tütenrätsel</h2><p>Gleich bekommst du eine Tüte …</p>`;return;}
    const X=TUETEN[m.t],sel=me.sel.tu&&me.sel.tu.t===m.t?me.sel.tu:null,badge=tc(m.t,"Tüte "+X.id,"big");
    if(S.rev.tu){
      if(!sel){P.innerHTML=top+`<h2>${badge}</h2><p><b>${SHOPS[X.s]}</b>: ${W_F[X.w]} und ${A_F[X.a]}.</p><p>${h(X.x)}</p>`;return;}
      const r=(ok,mine,right)=>`<span class="${ok?"okc":"badc"}">${h(mine)}</span>${ok?"":` → <b>${h(right)}</b>`}`;
      P.innerHTML=top+`<h2>${badge} Auflösung</h2><div class="box res">
        <span>Geschäft</span><span>${r(sel.g===X.s,SHOPS[sel.g],SHOPS[X.s])}</span>
        <span>Warengruppen</span><span>${r(sel.w===X.w,W_L[sel.w],W_L[X.w])} = <b>${W_F[X.w]}</b></span>
        <span>Auswahl</span><span>${r(sel.a===X.a,A_L[sel.a],A_L[X.a])} = <b>${A_F[X.a]}</b></span></div>
        <p>${h(X.x)}</p><div class="merk">Sag es in einem Satz: „Das Geschäft hat ein ${W_F[X.w]}es und ${A_F[X.a]}es Sortiment, weil …“</div>`;return;}
    if(m.tu){const dc=me.sel.dc;
      P.innerHTML=top+`<h2>${badge}</h2>`+wait("Abgegeben ✓")+`<p class="muted">Wer hat auch Tüte ${X.id}? Vergleicht eure Antworten.</p>
        <div class="box"><span class="pro">Profi</span> <b>Wo gehört ein Discounter ins Kreuz?</b>
        ${[0,1,2,3].map(q=>`<button class="pbtn ${dc===q?"sel":""}" data-q="${q}">${QDESC[q]}</button>`).join("")}
        ${m.dc?`<div class="status ok">Gespeichert ✓</div>`:""}
        <details><summary>Profi-Frage zum Nachlesen (Buch S. 68)</summary><p>Was kann passieren, wenn ein Sortiment zu groß ist? Was, wenn es zu klein ist? Begründe damit, wo der Discounter steht.</p></details></div>`;
      P.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{me.sel.dc=+b.dataset.q;save();sendP({k:"dc",c:me.sel.dc},()=>S.ph!==2||(mine()||{}).dc);redraw();});return;}
    const head=top+`<h2>Deine Tüte: ${badge}</h2>`;
    if(dTu.s===0){P.innerHTML=head+`<p>Das ist in deiner Tüte:</p>${tCards(X)}<p><b>Aus welchem Geschäft kommt die Tüte?</b></p>
        ${SHOPS.map((s,g)=>`<button class="pbtn" data-g="${g}">${s}</button>`).join("")}`;
      P.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{dTu.g=+b.dataset.g;dTu.s=1;redraw();});return;}
    const back=`<button id="bB" style="margin-top:8px">← zurück</button>`;
    if(dTu.s===1){P.innerHTML=head+tCards(X)+`<p><b>Das Geschäft hat …</b></p>
        <div class="yn"><button class="y" data-w="1">viele verschiedene Warengruppen</button><button class="n" data-w="0">wenige Warengruppen</button></div>${back}`;
      P.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{dTu.w=+b.dataset.w;dTu.s=2;redraw();});}
    else{P.innerHTML=head+tCards(X)+`<p><b>In einer Warengruppe gibt es …</b></p>
        <div class="yn"><button class="y" data-a="1">viel Auswahl</button><button class="n" data-a="0">wenig Auswahl</button></div>${back}`;
      P.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{dTu.a=+b.dataset.a;me.sel.tu={t:m.t,g:dTu.g,w:dTu.w,a:dTu.a};save();
        const t=m.t;sendP({k:"tu",g:dTu.g,w:dTu.w,a:dTu.a},()=>S.ph!==2||S.rev.tu||(mine()||{}).tu||(mine()||{}).t!==t);dTu={s:0};P.querySelector(".yn").innerHTML="<p>Gesendet …</p>";});}
    $("bB").onclick=()=>{dTu.s--;redraw();};
  }

  /* ---------- 3 Mein Betrieb ---------- */
  function pBetrieb(P,top,m){
    const B=me.sel.mb;
    if(B&&!mbEdit){
      if(!m.mb){P.innerHTML=top+`<h2>Mein Betrieb</h2><p>Wird gesendet …</p>`;return;}
      P.innerHTML=top+`<h2>Mein Betrieb</h2>`+wait("Dein Betrieb steht im Kreuz ✓")+
        `<div class="merk">Sag es in einem Satz: „${h(B.n)} hat ein ${W_F[B.w]}es und ${A_F[B.a]}es Sortiment, weil …“</div><button id="bE" style="margin-top:8px">ändern</button>`;
      $("bE").onclick=()=>{mbEdit=true;dMb=Object.assign({},B);drawForm();};return;}
    drawForm();
    function drawForm(){
      P.innerHTML=top+`<h2>Mein Ausbildungsbetrieb</h2>
        <label>Name des Betriebs<input id="mbn" maxlength="28" value="${h(dMb.n)}" placeholder="Name der Firma" autocomplete="off"></label>
        <p><b>Breit oder schmal?</b></p><div class="yn"><button class="y ${dMb.w===1?"sel":""}" data-w="1"><b>breit</b><br><small>viele Warengruppen</small></button><button class="n ${dMb.w===0?"sel":""}" data-w="0"><b>schmal</b><br><small>wenige Warengruppen</small></button></div>
        <p><b>Tief oder flach?</b></p><div class="yn"><button class="y ${dMb.a===1?"sel":""}" data-a="1"><b>tief</b><br><small>viel Auswahl in einer Gruppe</small></button><button class="n ${dMb.a===0?"sel":""}" data-a="0"><b>flach</b><br><small>wenig Auswahl</small></button></div>
        <button class="pri" id="bS" style="width:100%;margin-top:12px">Ins Kreuz setzen</button><div id="err"></div>`;
      $("mbn").oninput=e=>{dMb.n=e.target.value;};
      P.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{dMb.w=+b.dataset.w;drawForm();});
      P.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{dMb.a=+b.dataset.a;drawForm();});
      $("bS").onclick=()=>{const n=clean(dMb.n,28);if(!n||dMb.w==null||dMb.a==null){$("err").innerHTML=`<div class="status bad">Bitte Name eintragen und beide Fragen beantworten.</div>`;return;}
        me.sel.mb={n,w:dMb.w,a:dMb.a};mbEdit=false;save();sendP({k:"mb",n,w:dMb.w,a:dMb.a},()=>S.ph!==3||(mine()||{}).mb);redraw();};
    }
  }

  /* ---------- 4 Schuhgeschäft ---------- */
  function pSchuh(P,top,m){
    const sel=me.sel.sc;
    if(S.rev.sc){

    const i=dRg.length;if(i>=4){P.innerHTML=top+`<p>Gesendet …</p>`;return;}

    if($("bB"))$("bB").onclick=()=>{dRg.pop();redraw();};
  }

  /* ---------- 7 Prüfungs-Check ---------- */
  function pQuiz(P,top){
    const sc=(S.sc&&S.sc[me.pid])||[0,"–",0];
    if(S.q<0){P.innerHTML=top+`<h2>Prüfungs-Check</h2><p>Gleich geht es los. Lies jede Frage genau. Richtig ist wichtiger als schnell!</p>`;return;}

      P.querySelectorAll(".popt").forEach(b=>b.onclick=()=>{const q=S.q;qSel[q]=+b.dataset.i;sendP({k:"a",q,c:+b.dataset.i},()=>S.q!==q||!S.qOpen||(S.ans||[]).includes(me.pid));redraw();});
      const t=()=>{const s=Math.max(0,Math.ceil((qEnd-Date.now())/1000));if($("ptm"))$("ptm").textContent=s+" s";};t();clearInterval(window._pt);window._pt=setInterval(t,250);return;}
    const my=qSel[S.q],ok=my===Q.k;
    P.innerHTML=top+`<p class="muted">Frage ${S.q+1} von ${QUIZ.length}</p>
      <div class="status ${my==null?"":ok?"ok":"bad"}">${my==null?"Keine Antwort.":ok?"<b>Richtig!</b> +"+sc[2]+" Punkte":"<b>Leider falsch.</b>"}</div>
      <p><b>Richtig: ${h(Q.o[Q.k])}</b><br>${h(Q.x)}</p>
      <div class="box"><div class="bigpts">${sc[0]} Punkte</div>Platz ${sc[1]} von ${S.np||"?"}</div>`;
  }

  /* ---------- 8 Sieger ---------- */

    const sc=(S.sc&&S.sc[me.pid])||[0,"–",0];
    P.innerHTML=top+`<h2>Geschafft!</h2><div class="box"><div class="bigpts">Platz ${sc[1]}</div>${sc[0]} Punkte im Prüfungs-Check · ${S.np||"?"} haben mitgespielt</div>
      <p>Als Sortiments-Detektiv hast du <b>${m?m.d:0} Detektiv-Punkte</b> gesammelt.</p><p>Danke fürs Mitmachen!</p>`;

  render();
}

<script>
/* =========================================================
   QUIZ-MUSIK v2 (Skill live-klassen-app) – eigene Kompositionen, live per WebAudio erzeugt,

   Ablauf: Loop während der Frage · letzte 10 s schneller · Ticks in den letzten 5 s · Jingle beim Auflösen · Fanfare beim Sieger

const MUSIK_POOL=[
  {name:"Spannung",bpm:124,fast:156,bass:[45,45,41,40],ch:[[69,72,76],[69,72,76],[65,69,72],[64,68,71]],ap:[0,1,2,1,0,2,1,2],arp:"square",kick:[0,4,8,12],snare:[4,12],hat:"off"},
  {name:"Funk",bpm:104,fast:132,swing:.16,bass:[40,40,43,45],bp:[0,3,6,8,10,11,14],bt:"sawtooth",ch:[[64,67,71,74],[64,67,71,74],[67,71,74,77],[69,72,76,79]],ap:[0,2,1,3],as:[2,6,10,13],ad:.07,arp:"sawtooth",kick:[0,6,8],snare:[4,12],hat:"all"},
  {name:"Marimba",bpm:116,fast:144,bass:[48,45,41,43],ch:[[72,76,79],[69,72,76],[65,69,72],[67,71,74]],ap:[0,1,2,1,2,1,0,1],ad:.22,arp:"sine",oct:1,kick:[0,8],snare:[],hat:"none",cl:[3,11]},
  {name:"Chiptune",bpm:144,fast:176,bass:[43,43,40,38],bt:"square",ch:[[67,71,74],[67,71,74],[64,67,71],[62,66,69]],ap:[0,1,2,3,2,1],arp:"square",oct:1,ad:.06,kick:[0,8],snare:[4,12],hat:"none"},
  {name:"Latin",bpm:112,fast:140,bass:[38,38,43,45],bp:[0,3,8,11],ch:[[62,65,69],[62,65,69],[67,70,74],[69,73,76]],ap:[0,2,1,2],as:[0,2,3,6,8,10,11,14],arp:"triangle",kick:[0,6,8,14],snare:[],hat:"off",cl:[0,3,6,10,12]},
  {name:"Jazz",bpm:132,fast:164,swing:.3,walk:1,bass:[41,38,43,36],bp:[0,4,8,12],ch:[[65,69,72,76],[62,65,69,72],[67,70,74,77],[60,64,67,70]],ap:[0,2,1,3],as:[0,6,10],ad:.18,arp:"triangle",kick:[],snare:[],hat:"jazz"},
  {name:"Synthwave",bpm:100,fast:128,bass:[47,43,38,45],bp:[0,2,4,6,8,10,12,14],bt:"sawtooth",ch:[[71,74,78],[67,71,74],[62,66,69],[69,73,76]],ap:[0,1,2,1],arp:"sawtooth",ad:.14,kick:[0,4,8,12],snare:[4,12],hat:"all"},
  {name:"Detektiv",bpm:92,fast:120,bass:[37,37,42,44],bp:[0,3,8,10],ch:[[61,64,68],[61,64,68],[66,69,73],[68,72,75]],ap:[0,1,2,1,2,0],as:[0,2,4,7,8,10,12,15],ad:.12,arp:"triangle",kick:[0],snare:[8],hat:"off"}
];
const Music=(()=>{
  const ls=(k,v)=>{try{if(v===undefined){const x=localStorage.getItem(k);return x==null?null:JSON.parse(x);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}};
  let ctx=null,master=null,timer=null,next=0,step=0,fast=false,nbuf=null,on=ls("quizmusik")!==false;
  let order=[],last=-1,S=MUSIK_POOL[0];
  const mf=m=>440*Math.pow(2,(m-69)/12),AV={square:.04,sawtooth:.03,triangle:.08,sine:.1};
  function pick(){if(!order.length){order=MUSIK_POOL.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
      if(order[0]===last&&order.length>1)order.push(order.shift());}
    last=order.shift();S=MUSIK_POOL[last];return last;}
  function init(){try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();
      master=ctx.createGain();master.gain.value=.24;master.connect(ctx.destination);}
    if(ctx.state==="suspended")ctx.resume();return true;}catch(e){return false;}}

    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);

  function noise(t,d,v,hp){if(!nbuf){nbuf=ctx.createBuffer(1,ctx.sampleRate*.3,ctx.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nbuf;f.type="highpass";f.frequency.value=hp;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02);}
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.13);
    g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2);}

  const root=()=>S.ch[0][0]%12+60;
  return {
    pool:MUSIK_POOL,
    current(){return S.name;},
    unlock(){if(on)init();},
    isOn(){return on;},
    toggle(){on=!on;ls("quizmusik",on);if(!on)this.stop();return on;},

    hurry(){fast=true;},
    tick(){if(!on||!init())return;tone(1760,ctx.currentTime,.06,"sine",.25);},
    stop(){clearInterval(timer);timer=null;fast=false;},
    reveal(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.03,r=root();

      [0,4,7,12].forEach(m=>tone(mf(r+m),t+.3,.9,"triangle",.14));kick(t+.3);noise(t+.3,.25,.25,3000);},
    fanfare(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.05,r=60;
      [[-5,0],[0,.15],[4,.3],[7,.45],[4,.7],[7,.85]].forEach(([m,d])=>tone(mf(r+m),t+d,.22,"square",.09));

  };})();
/* Quiz-Musik automatisch an die Tafel koppeln: Timer #tm sichtbar = Abfrage läuft (Quiz, Prüfungs-Check, Abstimmung) */
(function MusicAuto(){
  if(new URLSearchParams(location.search).get("s"))return;
  const tf=document.getElementById("tafel"),st=document.getElementById("steps");
  let was=false,lastS=-1,pod=false;
  function btn(){if(!st||document.getElementById("bMus"))return;const b=document.createElement("button");b.id="bMus";b.type="button";
    b.title="Quiz-Musik an oder aus";b.style.cssText="padding:.25em .7em;font-weight:700;border-radius:999px;white-space:nowrap";
    b.onclick=()=>{Music.toggle();if(Music.isOn()&&was)Music.start();lab();};st.after(b);lab();}
  function lab(){const b=document.getElementById("bMus");if(b)b.textContent=Music.isOn()?"Musik: an":"Musik: aus";}
  document.addEventListener("pointerdown",()=>Music.unlock(),true);
  btn();
  setInterval(()=>{if(!tf||tf.hidden)return;btn();
    const tm=document.getElementById("tm"),vis=!!(tm&&tm.offsetParent!==null);
    if(vis){if(!was){was=true;lastS=-1;Music.start();}
      const s=parseInt(tm.textContent,10);if(!isNaN(s)&&s!==lastS){lastS=s;if(s<=10&&s>0)Music.hurry();if(s<=5&&s>0)Music.tick();}}
    else if(was){was=false;Music.reveal();}
    const p=document.querySelector("#tMain .podium"),pv=!!(p&&p.offsetParent!==null);
    if(pv&&!pod){pod=true;Music.fanfare();}if(!pv)pod=false;
  },200);
})();

  function walk(el){
    if(el.nodeType!==1) return;
