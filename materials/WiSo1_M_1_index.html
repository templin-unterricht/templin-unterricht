<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wer bestimmt, was ich lerne?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* WiSo Modul 1 – Live-Einstieg. Tafel: Haus der Ausbildung, Quizrunden, Klärpunkte, Tischwertung. Handy: Tisch wählen, Begriffe schicken, antippen. */
:root{
  --bg:#edf0ee; --surface:#ffffff; --surface2:#f6f8f7; --ink:#18221f; --muted:#56655f; --line:#cfd8d4;
  --brand:#0f5c4c; --brand-ink:#ffffff; --ok:#1f7a3f; --ok-soft:#dcf0e2; --warn:#a15c00; --warn-soft:#fbeed6; --bad:#b3261e; --bad-soft:#f9e0de;
  --c1:#c2410c; --c2:#1f5fae; --c3:#6a3d9a;
  --c1-soft:#fbe6dc; --c2-soft:#dde8f7; --c3-soft:#ece2f6;
  --roof:#f3ead2; --roof-line:#cdb67a;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111816; --surface:#1a2320; --surface2:#151d1a; --ink:#e8efec; --muted:#9fb0a9; --line:#2f3d38;
  --brand:#5cc2a6; --brand-ink:#0b1512; --ok:#6fcf8e; --ok-soft:#1b3324; --warn:#f0b35a; --warn-soft:#3a2c14; --bad:#ff8a80; --bad-soft:#3d1f1d;
  --c1:#ff8a5c; --c2:#7fb0ff; --c3:#c39af0; --c1-soft:#3a2219; --c2-soft:#1b2a40; --c3-soft:#2e2140;
  --roof:#2e2a17; --roof-line:#6e6331; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111816; --surface:#1a2320; --surface2:#151d1a; --ink:#e8efec; --muted:#9fb0a9; --line:#2f3d38;
  --brand:#5cc2a6; --brand-ink:#0b1512; --ok:#6fcf8e; --ok-soft:#1b3324; --warn:#f0b35a; --warn-soft:#3a2c14; --bad:#ff8a80; --bad-soft:#3d1f1d;
  --c1:#ff8a5c; --c2:#7fb0ff; --c3:#c39af0; --c1-soft:#3a2219; --c2-soft:#1b2a40; --c3-soft:#2e2140;
  --roof:#2e2a17; --roof-line:#6e6331; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0;text-wrap:balance;line-height:1.1}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:.5em .95em;font-weight:700;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.4;cursor:default}
.dot{width:.7em;height:.7em;border-radius:50%;background:var(--muted);display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.k1{--c:var(--c1);--cs:var(--c1-soft)} .k2{--c:var(--c2);--cs:var(--c2-soft)} .k3{--c:var(--c3);--cs:var(--c3-soft)}
.kY{--c:var(--ok);--cs:var(--ok-soft)} .kN{--c:var(--bad);--cs:var(--bad-soft)}
.pill{display:inline-flex;align-items:center;gap:.5em;padding:.3em .8em;border-radius:999px;background:var(--surface);border:1.5px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Tafel ---------- */
#board{display:flex;flex-direction:column;min-height:100%;padding:12px clamp(16px,2vw,36px) 14px;gap:12px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.topbar h1{font-size:clamp(18px,1.6vw,26px);margin-right:auto}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:.35em .9em;font-weight:700;min-height:40px}
.tab.cur{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.stage{flex:1;display:flex;flex-direction:column;gap:12px;min-height:0}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl .sp{flex:1}

/* Start */
.intro{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:clamp(16px,3vw,48px);align-items:center;flex:1}
.qrwrap{background:#fff;border-radius:18px;padding:14px;border:1.5px solid var(--line)}
.qrwrap canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
.intro h2{font-size:clamp(28px,3.4vw,54px)}
.code{font-family:var(--display);font-weight:800;font-size:clamp(28px,3vw,48px);letter-spacing:.12em}
.url{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.tables{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px;max-width:640px}
.tables div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:.5em .7em;font-weight:700;display:flex;justify-content:space-between}
.tables b{font-variant-numeric:tabular-nums}
.filewarn{background:var(--warn-soft);border:1.5px solid var(--warn);border-radius:10px;padding:.6em .9em;margin-top:12px}

/* Runde 1: Haus */
.house{display:grid;grid-template-columns:1fr 70px 1fr;grid-template-rows:auto 1fr;gap:0 0;min-height:0}
.zone{position:relative;border:2px dashed transparent;border-radius:14px;transition:border-color .12s,background .12s}
.zone.over{border-color:var(--brand)!important;background:color-mix(in srgb,var(--brand) 10%,transparent)}
.zone h3{font-size:clamp(16px,1.4vw,22px);display:flex;gap:.4em;align-items:baseline;flex-wrap:wrap}
.zone h3 small{font-family:var(--body);font-weight:400;font-size:.7em;color:var(--muted)}
.roof{grid-column:1/4;background:var(--roof);border:2px solid var(--roof-line);clip-path:polygon(7% 0,93% 0,100% 100%,0 100%);padding:12px 9% 14px;border-radius:0;text-align:center}
.roof .cards{justify-content:center}
.pillar{background:var(--cs);border:2px solid var(--c);border-top:none;border-radius:0 0 14px 14px;padding:12px;min-height:180px}
.pillar h3{color:var(--c)}
.gap{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;font-weight:700;color:var(--muted);letter-spacing:.06em;font-size:14px}
.cards{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:40px;align-content:flex-start}
.lower{display:grid;grid-template-columns:2fr 1fr;gap:12px}
.pool,.park{background:var(--surface);border:1.5px solid var(--line);padding:10px 12px;min-height:110px}
.park{background:var(--warn-soft);border-color:var(--warn)}
.wcard{display:inline-flex;align-items:center;gap:.4em;background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:.3em .65em;font-weight:700;font-size:clamp(14px,1.15vw,19px);touch-action:none;user-select:none;cursor:grab;box-shadow:0 1px 0 var(--line)}
.wcard .wn{font-size:.75em;background:var(--ink);color:var(--bg);border-radius:999px;padding:0 .45em}
.wcard.new{animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.wcard.ref{border-style:dashed;background:transparent;font-weight:400;cursor:default}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) rotate(-2deg);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.menu{position:fixed;z-index:60;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.2);min-width:200px}
.menu button{border:none;background:none;text-align:left;padding:.5em .7em;border-radius:8px;font-weight:700}
.menu button:hover{background:var(--surface2)}

/* Runden 2 + 3 */
.qcard{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px 22px}
.qcard .nr{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.qcard .st{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:clamp(26px,3.1vw,52px);line-height:1.12;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:12px}
.opt{background:var(--cs);border:2px solid var(--c);border-radius:16px;padding:12px 16px;display:flex;flex-direction:column;gap:8px;position:relative;transition:opacity .2s}
.opt .lab{font-family:var(--display);font-weight:800;font-size:clamp(20px,2vw,32px);color:var(--c)}
.opt .num{font-family:var(--display);font-weight:800;font-size:clamp(34px,4vw,64px);font-variant-numeric:tabular-nums;line-height:1}
.opt .bar{height:12px;border-radius:6px;background:var(--c);width:0;transition:width .5s}
.opt .sure{font-size:15px;color:var(--muted)}
.opt.right{box-shadow:0 0 0 5px var(--ok)}
.opt.right::after{content:"✓ richtig";position:absolute;top:10px;right:14px;font-weight:800;color:#fff;background:var(--ok);border-radius:999px;padding:.15em .7em;font-size:18px}
.opt.dim{opacity:.45}
.expl{background:var(--ok-soft);border:2px solid var(--ok);border-radius:14px;padding:12px 18px;font-size:clamp(17px,1.5vw,24px)}
.expl b{color:var(--ok)}
.alarm{background:var(--bad-soft);border:2px solid var(--bad);border-radius:14px;padding:10px 18px;font-weight:700;font-size:clamp(16px,1.3vw,21px)}
.answered{font-weight:700;font-size:18px}
.reasons{display:grid;gap:6px}
.reason{background:var(--surface);border-left:6px solid var(--c);border-radius:8px;padding:.4em .8em;display:flex;gap:.6em;align-items:center}
.reason span{flex:1}
.reason button{border:none;background:none;color:var(--muted)}

/* Klärpunkte */
.klist{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start}
.kp{background:var(--surface);border:2px solid var(--warn);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.kp.done{border-color:var(--line);opacity:.55}
.kp .src{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.kp .t{font-weight:800;font-family:var(--display);font-size:20px}
.kp .stats{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;border-radius:999px;padding:.1em .6em;font-weight:700;font-size:14px;background:var(--surface2);border:1px solid var(--line)}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.chip.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.kp .wo{font-size:14px;color:var(--muted)}
.kp label{display:flex;gap:.5em;align-items:center;font-weight:700;margin-top:auto}
.kp input{width:22px;height:22px}

/* Tischwertung */
.score{display:grid;gap:10px;max-width:1100px}
.srow{display:grid;grid-template-columns:120px 1fr 190px;gap:14px;align-items:center;font-size:clamp(18px,1.6vw,26px);font-weight:700}
.srow .track{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;height:44px;overflow:hidden}
.srow .fill{height:100%;background:var(--brand);width:0;transition:width .8s}
.srow.first .fill{background:var(--ok)}
.srow .v{font-variant-numeric:tabular-nums}

/* ---------- Handy ---------- */
#phone{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 16px 24px;gap:14px}
.phead{display:flex;align-items:center;gap:10px;font-size:14px}
.phead .t{font-weight:700;margin-right:auto}
.phead button{border:none;background:none;text-decoration:underline;color:var(--muted);padding:6px}
.pcard{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px}
.pcard h2{font-size:24px}
.pq{font-family:var(--display);font-stretch:112%;font-weight:800;font-size:24px;line-height:1.15}
.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tgrid button{min-height:64px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-family:var(--display);font-weight:800;font-size:26px}
.tgrid button.sel{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:12px;min-height:64px;border-radius:14px;border:2px solid var(--c);background:var(--cs);padding:10px 14px;text-align:left;font-weight:700;font-size:19px}
.choice .ic{font-size:26px}
.choice.sel{background:var(--c);color:#fff}
.choice:disabled{opacity:.55}
.surerow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.surerow button{min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.surerow button.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{font-weight:700;font-size:15px}
.status.ok{color:var(--ok)} .status.warn{color:var(--warn)}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;min-height:52px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:0 .8em;font-size:18px}
.mine{display:flex;flex-wrap:wrap;gap:6px}
.fb{border-radius:14px;padding:12px 14px;font-weight:700}
.fb.ok{background:var(--ok-soft);border:2px solid var(--ok)}
.fb.no{background:var(--bad-soft);border:2px solid var(--bad)}
.fb p{margin:.3em 0 0;font-weight:400}
.profi{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
#phone>*,#pBody>*{min-width:0}
.pcard,.profi,.fb{overflow-wrap:anywhere}
#pBody{display:flex;flex-direction:column;gap:12px}
.profi .h{font-weight:700;font-size:15px}
.big{font-family:var(--display);font-weight:800;font-size:44px;line-height:1}

@media (max-width:820px){
  .intro{grid-template-columns:1fr}
  .lower{grid-template-columns:1fr}
  .srow{grid-template-columns:80px 1fr 110px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ===================== TAFEL ===================== -->
<div id="board" hidden>
  <div class="topbar">
    <h1>WiSo · Modul 1 – Wer bestimmt, was ich lerne?</h1>
    <span class="pill"><span class="dot" id="bDot"></span><span id="bConn">verbinde …</span></span>
    <span class="pill" title="Handys im Raum"><span id="bPeople">0</span>&nbsp;Handys</span>
    <button class="pill" id="bCodeBtn" title="QR-Code zeigen">Raum <span id="bMiniCode"></span></button>
  </div>
  <nav class="tabs" id="bTabs" aria-label="Runden"></nav>
  <main class="stage" id="bStage"></main>
</div>

<!-- ===================== HANDY ===================== -->
<div id="phone" hidden>
  <div class="phead"><span class="dot" id="pDot"></span><span class="t" id="pHead">Raum</span><button id="pTableBtn" hidden>Tisch ändern</button></div>
  <div id="pBody"></div>
</div>

    ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);
  }

  /* ---------- Auswertung ---------- */
  function stats(r,i){
    const R=ROUNDS[r],A=S.ans[r][i]||{},cnt=R.cats.map(()=>0),sure=R.cats.map(()=>0);let n=0,right=0,sureWrong=0;
    for(const k in A){const a=A[k];cnt[a.c]++;n++;if(a.s===1)sure[a.c]++;if(a.c===R.items[i].exp)right++;else if(a.s===1)sureWrong++;}
    return {cnt,sure,n,right,sureWrong,p:n?right/n:0};
  }
  function klaerpunkte(){
    const out=[];

    for(const r of ["r2","r3"])ROUNDS[r].items.forEach((it,i)=>{
      const s=stats(r,i);if(s.n<2)return;
      const flag=s.p<0.75||s.sureWrong>=2;if(!flag)return;
      const chips=[[s.p<0.5?"bad":"warn",Math.round(s.p*100)+" % richtig"]];
      if(s.sureWrong)chips.push(["bad",s.sureWrong+" sicher – aber falsch"]);
      out.push({id:r+":"+i,src:(r==="r2"?"Wo passiert das?":"Stimmt’s?")+" · "+ROUNDS[r].noun+" "+(i+1),t:it.t,
        why:"Richtig: "+ROUNDS[r].cats[it.exp].lab+". "+it.why,wo:it.wo,chips,score:s.p-s.sureWrong*0.05});
    });
    out.sort((a,b)=>a.score-b.score);return out;
  }
  function tableScores(){

    for(const r of ["r2","r3"])for(const i in S.ans[r])for(const cid in S.ans[r][i]){answered.add(cid);
      if(S.rev[r].includes(+i)&&S.ans[r][i][cid].c===ROUNDS[r].items[i].exp)pts[cid]=(pts[cid]||0)+1;}
    const tab={};for(let t=1;t<=TABLES;t++)tab[t]={sum:0,n:0};
    answered.forEach(cid=>{const t=S.tisch[cid];if(!t)return;tab[t].n++;tab[t].sum+=pts[cid]||0;});
    return Object.entries(tab).filter(([t,v])=>v.n).map(([t,v])=>({t:+t,n:v.n,avg:v.sum/v.n})).sort((a,b)=>b.avg-a.avg);
  }

function startPhone(code){
  $("phone").hidden=false;
  code=code.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
  const KEY="m1live_ph_"+code;
  let st=null,mine=store(KEY)||{rid:"",tisch:0,r2:{},r3:{},words:[]};
  if(!mine.r2)mine={rid:"",tisch:0,r2:{},r3:{},words:[]};
  const saveMine=()=>store(KEY,mine);
  const net=new Net(onMsg,s=>{$("pDot").className="dot "+(s.up>0?"ok":"bad");if(s.up>0){hello();resend();}render();});
  const idKey="m1live_cid";const sc=store(idKey);if(typeof sc==="string"&&/^k[a-z0-9]{10}$/.test(sc))net.cid=sc;else store(idKey,net.cid);
  net.sub(code+"/state");
  function hello(){net.pub(code+"/hi",{cid:net.cid,tisch:mine.tisch,need:!st},false);}
  setInterval(hello,20000);
  function resend(){if(!st||mine.rid!==st.rid)return;
    for(const r of ["r2","r3"])for(const i in mine[r]){const a=mine[r][i];net.pub(code+"/a",{cid:net.cid,rid:st.rid,tisch:mine.tisch,r,i:+i,c:a.c,s:a.s,why:a.why||"",ts:a.ts},false);}
    mine.words.forEach(w=>net.pub(code+"/w",{cid:net.cid,rid:st.rid,tisch:mine.tisch,text:w.text,wid:w.wid},false));}
  function onMsg(t,p){
    if(t!==NS+code+"/state"||!p)return;
    if(p.t==="end"){st=null;render();return;}
    if(p.t!=="state")return;
    if(st&&st.ts>p.ts)return;
    const ph=PHASES.some(x=>x[0]===p.phase)?p.phase:"intro";
    const rev={r2:Array.isArray(p.rev&&p.rev.r2)?p.rev.r2:[],r3:Array.isArray(p.rev&&p.rev.r3)?p.rev.r3:[]};
    const cur={r2:Math.max(0,Math.min(ROUNDS.r2.items.length-1,(p.cur&&p.cur.r2)|0)),r3:Math.max(0,Math.min(ROUNDS.r3.items.length-1,(p.cur&&p.cur.r3)|0))};
    const key=st?st.phase+"/"+st.cur.r2+"/"+st.cur.r3:"";
    st={rid:String(p.rid),phase:ph,cur,open:!!p.open,collect:!!p.collect,rev,ts:+p.ts||0};
    if(mine.rid!==st.rid){const t=mine.tisch;mine={rid:st.rid,tisch:t,r2:{},r3:{},words:[]};saveMine();}
    if(key!==ph+"/"+cur.r2+"/"+cur.r3)drawn="";
    render();
  }
  function status(ok,txt){const s=$("pStatus");if(!s)return;s.className="status "+(ok?"ok":"warn");s.textContent=ok?txt:"Keine Verbindung – wird gesendet, sobald du wieder online bist.";}
  function answer(r,c,s){
    if(!st||st.phase!==r||!st.open)return;const i=st.cur[r];
    const old=mine[r][i];const why=old&&old.c===c?old.why||"":"";
    mine[r][i]={c,s:s===undefined?(old&&old.c===c?old.s:null):s,why,ts:Date.now()};saveMine();
    const a=mine[r][i];
    const ok=net.pub(code+"/a",{cid:net.cid,rid:st.rid,tisch:mine.tisch,r,i,c,s:a.s,why:a.why,ts:a.ts},false);
    if(navigator.vibrate)try{navigator.vibrate(15);}catch(e){}
    drawn="";render();status(ok,"✓ Angekommen. Du kannst noch wechseln.");
  }
  function sendWord(inp){
    if(!st||st.phase!=="r1"||!st.collect)return;
    const text=clean(inp.value,40);if(!text)return;if(mine.words.length>=MAXWORDS)return;
    const w={text,wid:rnd(12)};mine.words.push(w);saveMine();inp.value="";
    const ok=net.pub(code+"/w",{cid:net.cid,rid:st.rid,tisch:mine.tisch,text:w.text,wid:w.wid},false);
    drawn="";render();status(ok,"✓ Ist an der Tafel.");inp.focus();
  }
  let drawn="";
  function render(){
    const B=$("pBody");
    $("pHead").textContent="Raum "+code+(mine.tisch?" · Tisch "+mine.tisch:"");
    $("pTableBtn").hidden=!mine.tisch;$("pTableBtn").onclick=()=>{mine.tisch=0;saveMine();drawn="";render();};
    if(!mine.tisch){
      if(drawn==="tisch")return;drawn="tisch";B.innerHTML="";
      const c=el("div","pcard");c.append(el("h2","","An welchem Tisch sitzt du?"),el("p","muted","Dein Name wird nirgends angezeigt. Es zählt nur dein Tisch."));
      const g=el("div","tgrid");for(let t=1;t<=TABLES;t++){const b=el("button","",String(t));b.onclick=()=>{mine.tisch=t;saveMine();hello();resend();drawn="";render();};g.append(b);}
      c.append(g);B.append(c);return;
    }
    if(!st){if(drawn==="wait0")return;drawn="wait0";B.innerHTML="";const c=el("div","pcard");
      c.append(el("h2","",net.count().up?"Du bist dabei.":"Verbinde …"),el("p","muted",net.count().up?"Gleich geht es los. Schau zur Tafel.":"Falls es nicht klappt: WLAN aus, mobile Daten an."));B.append(c);return;}
    const ph=st.phase;
    if(ph==="intro"){if(drawn==="intro")return;drawn="intro";B.innerHTML="";const c=el("div","pcard");c.append(el("h2","","Du bist dabei – Tisch "+mine.tisch+"."),el("p","muted","Gleich geht es los. Schau zur Tafel."));B.append(c);return;}
    if(ph==="r1"){
      const key="r1/"+st.collect+"/"+mine.words.length;if(drawn===key)return;drawn=key;B.innerHTML="";
      const c=el("div","pcard");c.append(el("div","muted","Runde 1"),el("div","pq",R1Q));
      if(st.collect&&mine.words.length<MAXWORDS){
        c.append(el("p","muted","Ein Begriff oder ein kurzer Satz. Du kannst bis zu "+MAXWORDS+" Antworten schicken – noch "+(MAXWORDS-mine.words.length)+"."));
        const row=el("div","row");const inp=document.createElement("input");inp.maxLength=40;inp.placeholder="z. B. mein Chef";inp.setAttribute("aria-label","Deine Antwort");inp.enterKeyHint="send";
        const b=el("button","btn primary","Senden");b.onclick=()=>sendWord(inp);inp.onkeydown=e=>{if(e.key==="Enter")sendWord(inp);};
        row.append(inp,b);c.append(row);
      }else c.append(el("p","",st.collect?"Danke! Du hast alle "+MAXWORDS+" Antworten geschickt.":"Sammeln ist beendet. Schau zur Tafel."));
      {const ps=el("div","status","");ps.id="pStatus";c.append(ps);}
      if(mine.words.length){const m=el("div","mine");mine.words.forEach(w=>m.append(el("span","wcard",w.text)));c.append(el("div","muted","Deine Antworten:"),m);}
      B.append(c);return;
    }
    if(ph==="r2"||ph==="r3"){
      const R=ROUNDS[ph],i=st.cur[ph],it=R.items[i],my=mine[ph][i],rev=st.rev[ph].includes(i);
      const key=ph+"/"+i+"/"+st.open+"/"+rev+"/"+(my?my.c+"."+my.s:"-")+"/"+mine.tisch;if(drawn===key)return;drawn=key;
      const keepWhy=$("pWhy")?$("pWhy").value:"";
      B.innerHTML="";const c=el("div","pcard");
      c.append(el("div","muted",R.noun+" "+(i+1)+" von "+R.items.length),el("div","pq",it.t));B.append(c);
      if(rev){
        const right=my&&my.c===it.exp;
        const f=el("div","fb "+(my?(right?"ok":"no"):"no"));
        f.append(document.createTextNode(!my?"Du hast nicht geantwortet.":right?"✓ Richtig! Ein Punkt für Tisch "+mine.tisch+".":"✗ Leider nicht."+(my.s===1?" Du warst dir sicher – merk dir das hier gut:":"")));
        const p=el("p","");p.textContent="Lösung: "+R.cats[it.exp].lab+". "+it.why;f.append(p);B.append(f);return;
      }
      const ch=el("div","choices");
      R.cats.forEach((cat,k)=>{const b=el("button","choice "+cat.k+(my&&my.c===k?" sel":""));b.type="button";b.disabled=!st.open;b.setAttribute("aria-pressed",!!my&&my.c===k);
        b.append(el("span","ic",cat.ic),el("span","",cat.lab));
        b.onclick=()=>answer(ph,k);ch.append(b);});
      B.append(el("div","muted",st.open?R.q:"Abstimmung geschlossen – schau zur Tafel."),ch);
      if(R.sure&&my&&st.open){
        const box=el("div","pcard");box.append(el("div","","Wie sicher bist du?"));
        const sr=el("div","surerow");[[1,"Ganz sicher"],[0,"Eher geraten"]].forEach(([v,l])=>{const b=el("button",my.s===v?"sel":"",l);b.onclick=()=>answer(ph,my.c,v);sr.append(b);});
        box.append(sr);B.append(box);
      }
      const s=el("div","status","");s.id="pStatus";B.append(s);
      if(my&&st.open){
        const pr=el("div","profi");pr.append(el("div","h","Für Profis: "+(it.profi||"Begründe deine Wahl in einem Satz.")));
        const row=el("div","row");const inp=document.createElement("input");inp.id="pWhy";inp.maxLength=140;inp.placeholder="Weil …";inp.value=keepWhy||my.why||"";inp.setAttribute("aria-label","Begründung");
        const b=el("button","btn","Senden");b.onclick=()=>{my.why=clean(inp.value,140);my.ts=Date.now();saveMine();const ok=net.pub(code+"/a",{cid:net.cid,rid:st.rid,tisch:mine.tisch,r:ph,i,c:my.c,s:my.s,why:my.why,ts:my.ts},false);status(ok,"✓ Begründung gesendet.");};
        inp.onkeydown=e=>{if(e.key==="Enter")b.click();};row.append(inp,b);pr.append(row);B.append(pr);
      }
      return;
    }
    // Klärpunkte / Tischwertung: eigenes Ergebnis
    const key="end/"+ph+"/"+st.rev.r2.length+"/"+st.rev.r3.length;if(drawn===key)return;drawn=key;
    let pts=0,max=0;for(const r of ["r2","r3"])st.rev[r].forEach(i=>{max++;const a=mine[r][i];if(a&&a.c===ROUNDS[r].items[i].exp)pts++;});
    B.innerHTML="";const c=el("div","pcard");
    c.append(el("div","muted","Dein Ergebnis"),el("div","big",pts+" von "+max),el("p","","Damit hilfst du Tisch "+mine.tisch+". Schau jetzt zur Tafel – dort klären wir die schwierigen Punkte."));
    B.append(c);
  }
  render();
}

const sParam=params.get("s");
if(sParam)startPhone(sParam);else startBoard();
</script>
