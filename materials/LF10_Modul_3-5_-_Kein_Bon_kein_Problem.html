<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kein Bon, kein Problem?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: eine schmale Handy-Spalte; Kunde oben als Sprechblase, Antworten als Kassenbon-Zettel darunter */
:root{
  --bg:#E9EEF2; --paper:#FFFFFF; --paper2:#F6F8FA; --ink:#1B2631; --muted:#5A6977;
  --line:#CBD5DD; --accent:#0E7C6B; --accent-ink:#FFFFFF; --accent-soft:#D5EFEA;
  --bad:#B4321F; --bad-soft:#F8DDD8; --mid:#B7791F; --mid-soft:#F6EBD3; --good:#1F7A3A; --good-soft:#D8F0DF;
  --shadow:0 1px 2px rgba(27,38,49,.08),0 6px 18px rgba(27,38,49,.07);
  --display:"Bricolage Grotesque",ui-rounded,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181F; --paper:#1A232C; --paper2:#212C36; --ink:#E6EDF2; --muted:#9AAAB7;
  --line:#33424F; --accent:#3CC2AA; --accent-ink:#06211C; --accent-soft:#163C36;
  --bad:#F08A78; --bad-soft:#3E211C; --mid:#E5B45E; --mid-soft:#3A2E17; --good:#6FD08E; --good-soft:#18361F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181F; --paper:#1A232C; --paper2:#212C36; --ink:#E6EDF2; --muted:#9AAAB7;
  --line:#33424F; --accent:#3CC2AA; --accent-ink:#06211C; --accent-soft:#163C36;
  --bad:#F08A78; --bad-soft:#3E211C; --mid:#E5B45E; --mid-soft:#3A2E17; --good:#6FD08E; --good-soft:#18361F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:2.1rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.4rem;font-weight:800}
h3{font-size:1.08rem;font-weight:600}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > .btn{flex:1 1 200px}

/* Kassenbon-Optik */
.bon{background:var(--paper);box-shadow:var(--shadow);padding:20px 20px 26px;position:relative;
  --zz:radial-gradient(circle at 8px 0,transparent 7px,var(--paper) 7.5px);}
.bon::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:var(--zz);background-size:16px 8px;background-repeat:repeat-x}
.bon .mono{font-family:var(--mono);font-size:.86rem}
.dash{border:0;border-top:2px dashed var(--line);margin:12px 0}
.bonline{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:.9rem}
.stamp{display:inline-block;font-family:var(--mono);font-weight:600;font-size:.8rem;letter-spacing:.08em;border:2px solid var(--bad);color:var(--bad);padding:2px 8px;border-radius:4px;transform:rotate(-4deg)}

.card{background:var(--paper);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.modes{display:grid;gap:12px}
.mode{display:flex;flex-direction:column;gap:8px;text-align:left;border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:16px}
.mode:hover:not(:disabled){border-color:var(--accent)}
.mode:disabled{opacity:.6;cursor:default}
.mode .tag{font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.mode .t{font-family:var(--display);font-size:1.25rem;font-weight:800}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.case{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.case:hover{border-color:var(--accent)}
.case[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.case .num{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;color:var(--accent)}
.case .ct{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1.2}
.case .cw{font-size:.86rem;color:var(--muted)}
.case.dice{border-style:dashed}
.chip{border:2px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--paper);font-size:.92rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}

/* Kunde + Laune */
.hud{display:flex;align-items:center;gap:14px}
.face{width:64px;height:64px;flex:0 0 64px}
.meter{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.meter .bar{height:12px;border-radius:999px;background:var(--paper2);border:1px solid var(--line);overflow:hidden}
.meter .fill{height:100%;width:20%;border-radius:999px;transition:width .5s ease,background-color .5s}
.meter .lbl{display:flex;justify-content:space-between;font-size:.86rem;color:var(--muted)}
.meter .lbl b{color:var(--ink)}
.progress{font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.bubble{background:var(--paper);border-radius:18px 18px 18px 4px;box-shadow:var(--shadow);padding:16px 18px;font-size:1.12rem;font-weight:700}
.bubble .who{display:block;font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400;margin-bottom:4px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-size:1rem;display:flex;gap:12px;align-items:flex-start}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--mono);font-weight:600;color:var(--accent);flex:0 0 auto}
.opt.picked.good{border-color:var(--good);background:var(--good-soft)}
.opt.picked.mid{border-color:var(--mid);background:var(--mid-soft)}
.opt.picked.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled:not(.picked){opacity:.45}
.fb{border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-left:6px solid}
.fb.good{background:var(--good-soft);border-color:var(--good)}
.fb.mid{background:var(--mid-soft);border-color:var(--mid)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb .head{font-family:var(--display);font-weight:800;font-size:1.1rem}
.fb .re{font-style:italic}

/* Ergebnis */
.score{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.score .n{font-family:var(--display);font-size:3.2rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.check{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.check li{display:flex;gap:10px;align-items:flex-start}
.check .ic{flex:0 0 26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.check .ok{background:var(--good-soft);color:var(--good)}
.check .no{background:var(--bad-soft);color:var(--bad)}
.facts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.facts li{background:var(--paper2);border-radius:12px;padding:12px 14px}
.facts b{font-family:var(--display)}
.pair{display:grid;gap:4px;background:var(--paper2);border-radius:12px;padding:12px 14px}
.pair .du{color:var(--bad)}
.pair .bs{color:var(--good);font-weight:700}

/* Chat */
.chat{display:flex;flex-direction:column;gap:10px;min-height:120px}
.msg{max-width:86%;padding:12px 14px;border-radius:16px;box-shadow:var(--shadow);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.k{background:var(--paper);align-self:flex-start;border-bottom-left-radius:4px;font-weight:700}
.msg.a{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg.sys{align-self:center;background:transparent;box-shadow:none;color:var(--muted);font-size:.9rem;text-align:center}
.compose{display:flex;flex-direction:column;gap:8px;position:sticky;bottom:0;background:var(--bg);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
textarea{width:100%;min-height:80px;resize:vertical;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:var(--paper);color:var(--ink)}
.hint{font-size:.9rem;color:var(--muted)}
.starter{display:flex;gap:8px;flex-wrap:wrap}
.starter button{border:1px dashed var(--line);background:var(--paper2);border-radius:10px;padding:6px 10px;font-size:.88rem;text-align:left}
.dots::after{content:"…";animation:dots 1.2s steps(3) infinite}
@keyframes dots{0%{content:"."}33%{content:".."}66%{content:"..."}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script>
(() => {
"use strict";
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = v => Math.max(0, Math.min(100, v));

/* ---------- Fälle ---------- */
const O = (t, m, p, fb, re, c) => ({ t, m, p, fb, re, c });
const CASES = [
/* ===== Fall 1: Smartphone ohne Bon ===== */
{ id:"bon", title:"Kein Bon", who:"Herr Brandt", acc:"Herrn Brandt", role:"Kunde", product:"Smartphone Novaphone X5", price:"349,00 €", bought:"„im Sommer“", problem:"Akku, Neustarts", stamp:"KEIN KASSENBON",
  short:"Smartphone vor 3 Monaten gekauft, Akku schwach, Kassenbon weggeworfen.",
  open:"Guten Tag, ich will das Ding hier zurückgeben, das ist Schrott!",
  leave:"Wissen Sie was? Ich gehe! Und ich erzähle allen, wie Sie hier mit Kunden umgehen!",
  check:{
    gefuehl:"Ärger ernst genommen und freundlich geblieben",
    fehler:"Nach dem Fehler gefragt",
    datum:"Nach dem Kaufdatum gefragt",
    ursache:"Nach Sturz oder Wasser gefragt, ohne etwas zu unterstellen",
    nachweis:"Erkannt: Ohne Kassenbon geht es trotzdem",
    beleg:"Anderen Kaufnachweis genannt (Kontoauszug, Banking-App, Seriennummer)",
    reihenfolge:"Richtige Reihenfolge: erst Reparatur oder neues Gerät, dann Geld",
    loesung:"Schnelle Lösung angeboten, die zum Kunden passt" },
  rounds:[
   { say:"Guten Tag, ich will das Ding hier zurückgeben, das ist Schrott!", opts:[
     O("Guten Tag! Das klingt ärgerlich. Erzählen Sie mir bitte, was mit dem Handy los ist?", +20, 2, "Sehr gut. Du nimmst den Ärger ernst und lädst den Kunden ein, zu erzählen.", "Na endlich hört mal jemand zu.", "gefuehl"),
     O("Schrott verkaufen wir hier nicht. Was ist denn kaputt?", -15, 0, "Du verteidigst den Laden. Der Kunde fühlt sich angegriffen und wird lauter.", "Ach so? Dann gucken Sie sich das mal an!"),
     O("Moment bitte, ich räume gerade das Regal ein. Da müssen Sie kurz warten.", -25, 0, "Ein wütender Kunde geht immer vor. Wer warten muss, wird noch wütender.", "Wie bitte? Ich steh doch schon hier!") ]},
   { say:"Der Akku ist nach zwei Stunden leer, und dauernd startet das Ding neu. Für 349 Euro! Ich will mein Geld zurück, und zwar sofort!", opts:[
     O("Das darf bei einem neuen Gerät nicht passieren. Ich schaue mir das mit Ihnen an. Seit wann haben Sie das Problem?", +15, 2, "Gut. Du zeigst Verständnis und fragst gezielt nach dem Fehler.", "Hm. Okay.", "fehler"),
     O("Geld zurück gibt es bei uns grundsätzlich nicht.", -20, 0, "Das stimmt so nicht. Bei einem Mangel kann der Kunde am Ende auch Geld zurückbekommen. Außerdem provoziert der Satz.", "Das werden wir ja sehen!"),
     O("Okay, kein Problem, dann bekommen Sie sofort Ihr Geld.", +10, 0, "Der Kunde freut sich. Aber du hast noch nichts geprüft und etwas versprochen, das du als Azubi nicht entscheiden solltest. Laut Gesetz kommt zuerst Reparatur oder ein neues Gerät.", "Na also, geht doch.") ]},
   { say:"Seit letzter Woche. Ist doch egal, es ist kaputt!", opts:[
     O("Ich frage, weil es wichtig ist: Wann haben Sie das Handy denn gekauft?", +5, 2, "Richtig. Das Kaufdatum entscheidet: Die Gewährleistung gilt 2 Jahre. Im 1. Jahr muss das Geschäft beweisen, dass der Fehler nicht schon beim Kauf da war.", "Hmpf. Warten Sie …", "datum"),
     O("Na ja, Akkus halten halt nicht ewig.", -15, 0, "Nach wenigen Monaten darf ein Akku nicht so schwach sein. Du nimmst den Kunden nicht ernst.", "Nach ein paar Monaten? Wollen Sie mich veräppeln?"),
     O("Haben Sie es vielleicht falsch aufgeladen?", -10, 0, "Das klingt wie ein Vorwurf. Frag lieber neutral nach Daten und Fakten.", "Ich bin doch nicht blöd!") ]},
   { say:"Im Sommer irgendwann. Hier bei Ihnen!", opts:[
     O("Danke. Eine Frage stelle ich bei jeder Reklamation: Ist das Handy einmal heruntergefallen oder nass geworden?", +5, 2, "Gut. Die Frage muss sein, denn bei einem Sturzschaden gibt es keine Gewährleistung. Mit „bei jeder Reklamation“ klingt sie nicht wie ein Vorwurf.", "Nein! Wollen Sie mir jetzt was unterstellen?", "ursache"),
     O("Sie haben das bestimmt mal fallen lassen, oder?", -25, 0, "Das ist eine Unterstellung. Der Kunde fühlt sich beschuldigt.", "Unverschämt! Ich lass doch nichts fallen!"),
     O("Im Sommer? Dann ist das ein Fall für die Garantie. Da müssen Sie sich an den Hersteller wenden.", -10, 0, "Falsch. Die Gewährleistung ist Sache des Geschäfts. Du darfst den Kunden nicht einfach zum Hersteller schicken.", "Ich hab's doch bei Ihnen gekauft, nicht beim Hersteller!") ]},
   { say:"Nein! Wollen Sie mir jetzt was unterstellen?", opts:[
     O("Nein, gar nicht. Das frage ich jeden Kunden, damit ich die Reklamation richtig aufnehmen kann.", +10, 2, "Sehr gut. Du bleibst ruhig und erklärst, warum du fragst.", "Na gut. Nein, ist nie runtergefallen."),
     O("Ich muss das halt fragen. Regen Sie sich doch nicht so auf.", -15, 0, "„Regen Sie sich nicht auf“ macht Kunden fast immer wütender.", "Ich reg mich auf, so viel ich will!"),
     O("Haben Sie den Kassenbon dabei?", -5, 1, "Die Frage ist wichtig, aber du gehst über den Ärger hinweg. Erst kurz beruhigen, dann weiterfragen.", "Sie hören mir gar nicht zu, oder?") ]},
   { say:"Und den Kassenbon hab ich übrigens nicht mehr. Wer hebt so was auf? Heißt das jetzt, Sie machen gar nichts?", opts:[
     O("Doch. Der Kassenbon ist nur ein möglicher Nachweis. Wie haben Sie denn bezahlt?", +20, 2, "Genau richtig. Für die Gewährleistung braucht man keinen Kassenbon. Jeder andere Kaufnachweis zählt auch.", "Ach so? Mit Karte, glaube ich.", "nachweis"),
     O("Ohne Kassenbon kann ich leider gar nichts für Sie tun.", -30, 0, "Falsch! Das ist eine häufige Prüfungsfalle. Der Bon ist keine Bedingung. Der Kunde kann den Kauf auch anders nachweisen.", "Das ist ja wohl das Letzte!"),
     O("Kein Problem, dann tauschen wir es einfach so um.", +10, 0, "Nett, aber du weißt noch gar nicht, ob das Handy bei euch gekauft wurde. Erst den Kauf nachweisen lassen.", "Na, das ist ja mal was.") ]},
   { say:"Mit Karte, glaub ich. Und jetzt?", opts:[
     O("Dann reicht die Abbuchung in Ihrer Banking-App oder ein Kontoauszug. Ich kann außerdem die Seriennummer in unserem System prüfen.", +15, 2, "Perfekt. Du nennst gleich zwei Wege. Mit der Seriennummer findest du den Verkauf oft auch ohne Beleg.", "Moment, ich guck mal in die App …", "beleg"),
     O("Dann bringen Sie bitte einen Kontoauszug vorbei, dann sehen wir weiter.", 0, 1, "Richtig, aber umständlich. Der Kunde muss wiederkommen. Die Banking-App oder die Seriennummer geht sofort.", "Ich soll extra noch mal herkommen?"),
     O("Eine Kartenzahlung zählt leider nicht. Wir brauchen den Bon.", -25, 0, "Falsch. Eine Kartenzahlung ist ein guter Kaufnachweis.", "So ein Quatsch!") ]},
   { say:"Hier, die Abbuchung, 349 Euro, Juli. Krieg ich jetzt mein Geld?", opts:[
     O("Bei einem Mangel wird zuerst repariert oder Sie bekommen ein neues Gerät. Sie dürfen wählen. Klappt das nicht, gibt es Geld zurück oder einen Preisnachlass.", +15, 2, "Fachlich genau richtig: Erst Nacherfüllung (Reparatur oder neue Ware), der Kunde wählt. Rücktritt oder Minderung kommen erst danach.", "Hm. Reparatur dauert doch ewig.", "reihenfolge"),
     O("Ja klar, hier sind Ihre 349 Euro.", +10, 0, "Das kann der Chef als Kulanz entscheiden. Laut Gesetz kommt aber zuerst die Nacherfüllung. Als Azubi versprichst du das nicht einfach.", "Na bitte."),
     O("Nein. Wir schicken es zum Hersteller, das dauert vier bis sechs Wochen.", -20, 0, "Der Kunde darf zwischen Reparatur und neuem Gerät wählen. Wer einfach bestimmt, macht Ärger.", "Sechs Wochen ohne Handy? Niemals!") ]},
   { say:"Reparatur dauert doch ewig. Ich brauch mein Handy für die Arbeit!", opts:[
     O("Dann nehmen wir den Austausch. Ich schaue kurz nach, ob das Gerät auf Lager ist, dann haben Sie es heute noch.", +20, 2, "Super. Du nutzt das Wahlrecht des Kunden und bietest eine schnelle Lösung an.", "Heute noch? Okay …", "loesung"),
     O("Da kann ich nichts machen, so ist nun mal das Gesetz.", -20, 0, "Du versteckst dich hinter dem Gesetz. Dabei erlaubt es gerade den Austausch.", "Toll. Ganz toll."),
     O("Na gut, dann schicken wir es trotzdem zur Reparatur ein.", -15, 0, "Der Kunde will keine Reparatur. Er darf wählen, also nimm seinen Wunsch auf.", "Haben Sie mir überhaupt zugehört?") ]},
   { say:"… Na gut. Hätten Sie ja gleich sagen können.", opts:[
     O("Danke für Ihre Geduld. Ich nehme die Reklamation jetzt auf, gleich haben Sie Ihr neues Gerät.", +10, 2, "Ein freundlicher Abschluss. Der Kunde geht zufrieden und kommt wieder.", "Danke. War dann doch nett hier."),
     O("Hab ich doch.", -10, 0, "Recht haben ist hier unwichtig. Der letzte Eindruck bleibt hängen.", "Ja, ja."),
     O("So. Unterschreiben Sie hier.", 0, 1, "Korrekt, aber kühl. Ein Dank zum Schluss kostet nichts.", "Mhm.") ]}
  ],
  facts:[
    ["Gewährleistung: 2 Jahre", "Das Geschäft haftet 2 Jahre lang für Mängel, die beim Kauf schon da waren (§ 437 BGB)."],
    ["Kein Bon? Kein Problem!", "Der Kassenbon ist keine Bedingung. Kontoauszug, Kartenbeleg, Banking-App, Seriennummer oder Zeugen gehen auch."],
    ["Beweislastumkehr: 1. Jahr", "Zeigt sich der Mangel im 1. Jahr, gilt: Er war schon beim Kauf da. Das Geschäft müsste das Gegenteil beweisen (§ 477 BGB)."],
    ["Erst reparieren oder neu liefern", "Zuerst kommt die Nacherfüllung, der Kunde wählt (§ 439 BGB). Erst wenn das scheitert: Geld zurück (Rücktritt) oder Preisnachlass (Minderung)."] ],
  ai:{
    facts:`Du bist Herr Brandt, etwa 45 Jahre alt. Vor ungefähr drei Monaten (im Juli) hast du in diesem Elektronikmarkt das Smartphone "Novaphone X5" für 349 Euro gekauft. Seit letzter Woche ist der Akku nach etwa zwei Stunden leer und das Handy startet manchmal von selbst neu. Es ist nie heruntergefallen und nie nass geworden. Den Kassenbon hast du weggeworfen. Bezahlt hast du mit EC-Karte; die Abbuchung siehst du in deiner Banking-App, das sagst du aber nur, wenn man nach der Zahlungsart oder einem anderen Nachweis fragt. Am Anfang willst du sofort dein Geld zurück. Wenn man dir freundlich erklärt, dass zuerst repariert oder ein neues Gerät geliefert wird und du wählen darfst, nimmst du am liebsten ein neues Gerät, weil du das Handy für die Arbeit brauchst.`,
    checks:["Ärger ernst genommen und freundlich geblieben","Nach Fehler und Kaufdatum gefragt","Nach Sturz oder Wasser gefragt, ohne etwas zu unterstellen","Erkannt, dass es ohne Kassenbon geht, und einen anderen Kaufnachweis genannt","Richtige Reihenfolge erklärt: erst Reparatur oder neues Gerät (Kunde wählt), dann Geld oder Preisnachlass","Passende Lösung angeboten und freundlich abgeschlossen"],

function startGame(id){

function pick(i){
  if (S.picked !== null) return;
  const o = S.order[i];
  S.picked = i; S.mood = clamp(S.mood + o.m); S.pts += o.p; if (o.c && o.p === 2) S.got.add(o.c);
  if (S.mood <= 0) { if (S.r >= 2) S.left = true; else S.mood = 5; }

}
function next(){
  const c = cur();
  if (S.left || S.r + 1 >= c.rounds.length){ played.add(c.id); S.screen = "end"; render(); window.scrollTo(0,0); return; }
  S.r++; S.picked = null; S.order = shuffle(c.rounds[S.r].opts); render(); window.scrollTo(0,0);
}
function nextCaseId(){
  const game = CASES.filter(c => !c.aiOnly);
  const rest = game.filter(c => !played.has(c.id) && c.id !== S.cid);
  const pool = rest.length ? rest : game.filter(c => c.id !== S.cid);
  return pool[Math.floor(Math.random() * pool.length)].id;
}

function moodColor(m){ return m < 35 ? "var(--bad)" : m < 65 ? "var(--mid)" : "var(--good)"; }

    <circle cx="23" cy="29" r="3" fill="var(--ink)"/><circle cx="41" cy="29" r="3" fill="var(--ink)"/>
    <path d="M20 ${44 - curve / 2} Q32 ${44 + curve} 44 ${44 - curve / 2}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>

/* ---------- KI-Kunde ---------- */
function customerRules(c){
  return `Du spielst in einem Rollenspiel für Auszubildende im Einzelhandel (Berufsschule, Deutschland) eine Kundin oder einen Kunden an der Info-Theke eines Elektromarkts. Die Person, die dir schreibt, ist ein Azubi und spielt die Verkäuferin oder den Verkäufer.

DEINE ROLLE:
${c.ai.facts}

SO SPIELST DU:
- Bleib immer in der Rolle. Gib nie Tipps, erkläre nie die Rechtslage und sag nie, was der Azubi besser machen soll.
- Du bist ungeduldig und leicht unhöflich, aber nie beleidigend, nie vulgär, nie diskriminierend.
- Antworte kurz: 1 bis 3 Sätze, gesprochene Alltagssprache, einfaches Deutsch (Niveau B1). Keine Emojis, keine Regieanweisungen in Sternchen.
- Du bist am Anfang verärgert. Deine Laune (0 = kocht vor Wut, 100 = zufrieden) startet bei 15. Freundlichkeit, Verständnis, gute Fragen und richtige, klare Lösungen heben sie. Unterstellungen, Ausreden, falsche Aussagen ("ohne Bon geht nichts"), Unterbrechen oder Belehren senken sie deutlich.
- Verrate Informationen nur, wenn danach gefragt wird.
- Sinkt die Laune auf 5 oder weniger, gehst du verärgert weg. Ist das Problem gelöst und du bist zufrieden, verabschiedest du dich.
- Schreibt der Azubi etwas, das nicht zum Verkaufsgespräch passt, reagierst du verwirrt als Kunde ("Hä? Was soll das jetzt?").

ANTWORTFORMAT: Antworte nur mit einem JSON-Objekt, ohne weiteren Text:
{"antwort": "was du als Kundin oder Kunde sagst", "laune": Zahl von 0 bis 100, "ende": true oder false}
"ende" ist true, wenn du weggehst oder dich zufrieden verabschiedest.

Das Gespräch beginnt. Du hast als Erstes gesagt: "${c.open}"`;
}
function startChat(){
  S = { ...S, screen:"chat", mood:15, turns:[], busy:false, ended:false, err:"", fb:null, fbBusy:false };
  S.turns.push({ role:"assistant", content:cur().open });
  render();
}
let ctl = null;
async function send(text){
  text = text.trim(); if (!text || S.busy || S.ended) return;
  S.turns.push({ role:"user", content:text }); S.busy = true; S.err = ""; render(); scrollChat();
  const c = cur();
  const input = [{ role:"user", content: customerRules(c) + "\n\nVerstanden? Dann warte auf den Azubi." },
                 { role:"assistant", content: JSON.stringify({antwort:c.open, laune:15, ende:false}) },
                 ...S.turns.slice(1).map(t => t.role === "assistant" ? { role:"assistant", content: JSON.stringify({antwort:t.content, laune:t.mood ?? S.mood, ende:false}) } : t)];
  ctl = new AbortController();
  try {
    const r = await sample.json(input, { modelTier:"quick", cache:false, signal:ctl.signal });
    const ans = String(r && r.antwort || "").trim() || "…";
    const m = clamp(Number(r && r.laune)); S.mood = Number.isFinite(m) ? m : S.mood;
    S.turns.push({ role:"assistant", content:ans, mood:S.mood });
    if (r && r.ende === true) S.ended = true;
    const asked = S.turns.filter(t => t.role === "user").length;
    if (!S.ended && asked >= MAXTURNS) { S.ended = true; S.limit = true; }
  } catch (e) {
    S.turns.pop();
    S.err = errText(e);
    if (e && (e.code === "not_granted" || e.code === "sampling_disabled")) sample = null;
  } finally { S.busy = false; render(); scrollChat(); if (!S.err) { const ta = document.getElementById("say"); if (ta && !S.ended) ta.focus(); } else { const ta = document.getElementById("say"); if (ta) ta.value = text; } }
}
function errText(e){
  const c = e && e.code;
  if (c === "cancelled") return "";
  if (c === "not_granted") return "Die KI wurde für diese App nicht erlaubt. Spiel 1 funktioniert trotzdem.";
  if (c === "sampling_disabled") return "Die KI ist für dieses Konto nicht verfügbar.";
  if (c === "rate_limited") return "Zu viele Nachrichten auf einmal. Warte kurz und schick deine Antwort noch einmal.";
  if (c === "session_expired") return "Bitte melde dich bei claude.ai neu an.";
  if (c === "invalid_json") return "Die Antwort kam durcheinander an. Schick deine Antwort bitte noch einmal.";
  return "Verbindung hat nicht geklappt. Schick deine Antwort bitte noch einmal.";
}

  S.fbBusy = true; S.err = ""; render(); window.scrollTo(0, document.body.scrollHeight);
  const prompt = `Du bist eine freundliche, ehrliche Berufsschul-Lehrkraft für Verkäufer-Azubis. Bewerte das folgende Reklamations-Rollenspiel. Der Azubi spielt den Verkäufer, der Kunde ist eine KI-Figur.

${c.ai.checks.map((x, i) => (i + 1) + ". " + x).join("\n")}

GESPRÄCH:
${tr}

Schreibe in einfachem Deutsch (Niveau B1), in der Du-Form, kurze Sätze. Sei ermutigend, aber ehrlich. Bewerte nur, was der AZUBI geschrieben hat.
Antworte nur mit JSON in genau dieser Form:
{"punkte": Zahl 0 bis 12 (2 Punkte je Checklistenpunkt, 1 Punkt wenn teilweise), "urteil": "ein Satz Gesamturteil", "checkliste": [{"punkt": "Text aus der Checkliste", "erfuellt": "ja" oder "teilweise" oder "nein", "hinweis": "ein kurzer Satz dazu"}], "gut": ["bis zu 2 Dinge, die gut waren, mit kurzem Zitat"], "besser": [{"du": "wörtliches Zitat des Azubis", "besser": "bessere Formulierung in wörtlicher Rede"}] (höchstens 3; leer, wenn alles gut war)}`;
  try {
    const r = await sample.json(prompt, { modelTier:"default", cache:false });
    S.fb = r;
  } catch (e) { S.err = errText(e) || "Abgebrochen."; }
  finally { S.fbBusy = false; render(); const f = document.getElementById("fbbox"); if (f) f.scrollIntoView({behavior:"smooth", block:"start"}); }
}
function scrollChat(){ requestAnimationFrame(() => window.scrollTo(0, document.body.scrollHeight)); }

function vChat(){
  const c = cur();
  const asked = S.turns.filter(t => t.role === "user").length;
  const starters = asked === 0 ? ["Guten Tag! Das klingt ärgerlich. Was ist denn los?", "Oh, das tut mir leid. Erzählen Sie mal."] : [];
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
    <button class="chip" data-act="home">← Start</button>
    <span class="progress">${esc(c.who)} · ${asked}/${MAXTURNS} Antworten</span>
  </div>
  ${hud(S.mood)}
  <div class="chat" aria-live="polite">
    ${S.turns.map(t => `<div class="msg ${t.role === "user" ? "a" : "k"}">${esc(t.content)}</div>`).join("")}
    ${S.busy ? `<div class="msg k"><span class="dots">${esc(c.who)} überlegt</span></div>` : ""}
    ${S.ended ? `<div class="msg sys">${S.limit ? "Die Zeit ist um." : S.mood <= 10 ? esc(c.who) + " ist gegangen." : "Das Gespräch ist zu Ende."} Hol dir jetzt deine Rückmeldung.</div>` : ""}
  </div>
  ${S.err ? `<div class="fb bad" role="alert"><p>${esc(S.err)}</p></div>` : ""}
  ${S.fb ? vFeedback() : S.fbBusy ? `<div class="card"><p class="dots">Deine Rückmeldung wird geschrieben. Das dauert bis zu einer Minute</p></div>` : ""}
  ${!S.ended && !S.fb ? `<div class="compose">
      ${starters.length ? `<div class="starter">${starters.map(s => `<button data-start="${esc(s)}">${esc(s)}</button>`).join("")}</div>` : ""}
      <label for="say" class="eyebrow">Deine Antwort als Verkäufer/in</label>
      <textarea id="say" placeholder="Schreib, was du sagst …" ${S.busy ? "disabled" : ""}></textarea>
      <div class="row">
        <button class="btn" data-act="send" ${S.busy ? "disabled" : ""}>Sagen</button>
        <button class="btn ghost" data-act="finish" ${S.busy || asked === 0 ? "disabled" : ""}>Gespräch beenden</button>
      </div>
    </div>` : ""}
  ${S.ended && !S.fb && !S.fbBusy ? `<button class="btn" data-act="feedback">Rückmeldung holen</button>` : ""}
  ${S.fb ? `<div class="row"><button class="btn" data-act="chat">Neues Gespräch</button><button class="btn ghost" data-act="home">Zum Start</button></div>` : ""}`;
}
function vFeedback(){
  const f = S.fb || {}; const list = Array.isArray(f.checkliste) ? f.checkliste : [];
  const n = Math.max(0, Math.min(12, Math.round(Number(f.punkte) || 0)));
  const ic = v => v === "ja" ? ["ok", "✓"] : v === "teilweise" ? ["", "~"] : ["no", "✗"];
  return `<section class="card" id="fbbox" style="display:flex;flex-direction:column;gap:14px">
    <span class="eyebrow">Rückmeldung · zeig das deiner Lehrkraft</span>
    <div class="score"><span class="n">${n}</span><span class="muted">von 12 Punkten · ${esc(cur().title)}</span></div>
    ${f.urteil ? `<p><b>${esc(f.urteil)}</b></p>` : ""}
    <ul class="check">${list.map(x => { const [k, s] = ic(String(x.erfuellt)); return `<li><span class="ic ${k}" style="${k ? "" : "background:var(--mid-soft);color:var(--mid)"}" aria-hidden="true">${s}</span><span><b>${esc(x.punkt || "")}</b><br><span class="muted">${esc(x.hinweis || "")}</span></span></li>`; }).join("")}</ul>
    ${Array.isArray(f.gut) && f.gut.length ? `<h3>Das war gut</h3><ul class="facts">${f.gut.map(g => `<li>${esc(g)}</li>`).join("")}</ul>` : ""}
    ${Array.isArray(f.besser) && f.besser.length ? `<h3>So klingt es noch besser</h3>${f.besser.map(b => `<div class="pair"><span class="du">Du: „${esc(b.du || "")}“</span><span class="bs">Besser: „${esc(b.besser || "")}“</span></div>`).join("")}` : ""}
    <p class="hint">Die Rückmeldung schreibt eine KI. Sie kann sich irren. Sprich mit deiner Lehrkraft darüber.</p>
  </section>`;
}

/* ---------- Render + Events ---------- */
function render(){
  const draft = document.getElementById("say")?.value || "";
  $app.innerHTML = S.screen === "game" ? vGame() : S.screen === "end" ? vEnd() : S.screen === "chat" ? vChat() : vStart();
  const ta = document.getElementById("say"); if (ta && draft) ta.value = draft;
}
$app.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.dataset.pick !== undefined) return pick(+b.dataset.pick);
  if (b.dataset.case) { S.cid = b.dataset.case; return render(); }
  if (b.dataset.start) { const ta = document.getElementById("say"); if (ta) { ta.value = b.dataset.start; ta.focus(); } return; }
  const a = b.dataset.act;
  if (a === "game") startGame();
  else if (a === "random") startGame(nextCaseId());
  else if (a === "nextcase") startGame(nextCaseId());
  else if (a === "again") startGame();
  else if (a === "next") next();
  else if (a === "home") { ctl?.abort(); S = { screen:"start", cid:S.cid }; render(); window.scrollTo(0,0); }
  else if (a === "chat") { if (sample) startChat(); }
  else if (a === "send") { const ta = document.getElementById("say"); const v = ta ? ta.value : ""; if (ta) ta.value = ""; send(v); }
  else if (a === "finish") { S.ended = true; render(); }
  else if (a === "feedback") getFeedback();
});
$app.addEventListener("keydown", e => {
  if (e.target.id === "say" && e.key === "Enter" && !e.shiftKey) { e.preventDefault(); const v = e.target.value; e.target.value = ""; send(v); }
});

render();
(async () => {
  try { sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch { sample = null; }
  sampleChecked = true; if (S.screen === "start") render();
})();
})();
</script>

</body>
</html>
