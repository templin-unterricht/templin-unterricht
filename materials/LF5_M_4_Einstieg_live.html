<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF5 · Modul 4 · Live-Einstieg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&family=Nunito:wght@500;700;800&display=swap">
<style>
/* LF5 Live: Werbeagentur-Design (Pop-Art-Plakat). Eine helle Variante, die auf Beamer und Handy gut lesbar ist. */
@font-face{font-family:"Noto Sans Ethiopic";src:url("../i18n/fonts/noto-sans-ethiopic-ethiopic-400-normal.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Noto Sans Ethiopic";src:url("../i18n/fonts/noto-sans-ethiopic-ethiopic-700-normal.woff2") format("woff2");font-weight:700 900;font-display:swap}
@font-face{font-family:"Noto Sans Arabic";src:url("../i18n/fonts/noto-sans-arabic-arabic-400-normal.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Noto Sans Arabic";src:url("../i18n/fonts/noto-sans-arabic-arabic-700-normal.woff2") format("woff2");font-weight:700 900;font-display:swap}
:root{
  --ink:#1B1340; --ink2:#3A2F6B; --paper:#FFFDF6; --cream:#FFF3D1;
  --pink:#FF3D81; --yellow:#FFD23F; --cyan:#27C3F2; --mint:#2FD493; --violet:#7B4DFF; --orange:#FF8A3D;
  --ok:#14804A; --okbg:#D8F7E6; --bad:#C0243E; --badbg:#FFE0E5;
  --muted:#5B5280; --line:#1B1340;
  --f-head:"Montserrat","Noto Sans Ethiopic","Noto Sans Arabic","Arial Black",Arial,sans-serif;
  --f-body:"Nunito","Noto Sans Ethiopic","Noto Sans Arabic",Arial,Helvetica,sans-serif;
  --sh:5px 5px 0 var(--ink);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--f-body);font-size:18px;line-height:1.4;color:var(--ink);min-height:100vh;
  background-color:var(--violet);
  background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.22) 1.6px,transparent 2.2px),linear-gradient(160deg,#6A3DF0 0%,#8B4DFF 45%,#C03DDB 100%);
  background-size:18px 18px,100% 100%;background-attachment:fixed}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
h1,h2,h3{font-family:var(--f-head);font-weight:800;line-height:1.15;margin:0}
.tab{font-variant-numeric:tabular-nums}
.de{display:block;font-size:.78em;font-weight:600;color:var(--muted);margin-top:2px;line-height:1.25}
.on-dark .de,.btn .de,.opt.sel .de{color:inherit;opacity:.75}
[dir=rtl]{text-align:right}
.de{direction:ltr;text-align:left}

/* ---------- Markenleiste ---------- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 18px;background:var(--ink);color:#fff;border-bottom:5px solid var(--yellow);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:900;letter-spacing:.02em}
.logo svg{width:38px;height:38px;flex:none}
.logo b{font-size:20px;text-transform:uppercase}
.chip{display:inline-block;background:var(--yellow);color:var(--ink);font-family:var(--f-head);font-weight:800;font-size:13px;padding:3px 10px;border-radius:99px;letter-spacing:.04em}
.top .spacer{flex:1}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:14px;height:14px;border-radius:50%;background:transparent;border:3px solid #fff;display:block}
.dots i.done{background:var(--mint);border-color:var(--mint)}
.dots i.now{background:var(--pink);border-color:var(--pink);box-shadow:0 0 0 4px rgba(255,61,129,.35)}
.net{width:12px;height:12px;border-radius:50%;background:#888;display:inline-block}
.net.up{background:var(--mint)}
.net.half{background:var(--yellow)}
.tbtn{border:3px solid #fff;background:transparent;color:#fff;border-radius:10px;padding:6px 12px;font-weight:800;font-family:var(--f-head);font-size:14px}
.tbtn:hover{background:rgba(255,255,255,.15)}
.ticker{height:14px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,var(--ink) 14px 28px);background-size:40px 40px;animation:tick 2.2s linear infinite}
@keyframes tick{to{background-position:40px 0}}
@media (prefers-reduced-motion:reduce){.ticker{animation:none}*{transition:none!important;animation:none!important}}

/* ---------- Karten / Plakate ---------- */
.poster{background:var(--paper);border:4px solid var(--ink);border-radius:18px;box-shadow:var(--sh);padding:22px 26px;position:relative}
.poster.yellow{background:var(--yellow)}
.poster.pink{background:var(--pink);color:#fff}
.poster.cyan{background:var(--cyan)}
.poster.mint{background:var(--mint)}
.burst{position:absolute;top:-26px;left:-18px;width:84px;height:84px;display:grid;place-items:center;transform:rotate(-10deg)}
.burst svg{position:absolute;inset:0;width:100%;height:100%}
.burst span{position:relative;font-family:var(--f-head);font-weight:900;font-size:24px;color:var(--ink)}
[dir=rtl] .burst{left:auto;right:-18px}
.kicker{font-family:var(--f-head);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--pink)}
.q{font-family:var(--f-head);font-weight:800;font-size:clamp(24px,3.2vw,40px);line-height:1.2}
.q.sm{font-size:clamp(20px,2.2vw,28px)}

/* ---------- Tafel ---------- */
.stage{max-width:1180px;margin:0 auto;padding:44px 22px 120px}
.stage .poster{padding:30px 34px 28px 54px}
.brief{font-size:clamp(20px,2.4vw,30px);font-weight:600;margin-top:12px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;z-index:10;border-top:4px solid var(--yellow)}
.foot .cnt{font-family:var(--f-head);font-weight:800;font-size:18px}
.meter{flex:1;min-width:120px;height:14px;border:3px solid #fff;border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint);width:0;transition:width .4s}
.btn{border:4px solid var(--ink);background:var(--yellow);color:var(--ink);border-radius:14px;padding:12px 22px;font-family:var(--f-head);font-weight:900;font-size:17px;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pink{background:var(--pink);color:#fff}
.btn.mint{background:var(--mint)}
.btn.ghost{background:var(--paper)}
.btn:disabled{opacity:.45;box-shadow:none}
.foot .btn{border-color:#fff;box-shadow:none}
.bars{display:grid;gap:12px;margin-top:20px}
.bar{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) 56px;gap:14px;align-items:center}
.bar .lab{font-weight:800;font-size:clamp(17px,1.9vw,24px);line-height:1.2}
.bar .track{height:36px;background:#fff;border:3px solid var(--ink);border-radius:12px;overflow:hidden}
.bar .fill{height:100%;background:var(--cyan);width:0;transition:width .5s}
.bar:nth-child(3n+2) .fill{background:var(--pink)}
.bar:nth-child(3n+3) .fill{background:var(--orange)}
.bar .num{font-family:var(--f-head);font-weight:900;font-size:26px;text-align:right}
.bar.ok .fill{background:var(--mint)}
.bar.ok .lab::before{content:"✔ ";color:var(--ok)}
.bar.no{opacity:.55}
.bar.no .fill{background:#aaa}
/* Wortwolke */
.cloud{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;justify-content:center;min-height:260px;padding:22px 10px}
.cloud span{font-family:var(--f-head);font-weight:900;line-height:1.05;cursor:pointer;transition:font-size .4s}
.cloud span:nth-child(5n+1){color:var(--pink)}.cloud span:nth-child(5n+2){color:var(--violet)}.cloud span:nth-child(5n+3){color:#0E9BC9}.cloud span:nth-child(5n+4){color:var(--orange)}.cloud span:nth-child(5n){color:var(--ok)}
.empty{color:var(--muted);text-align:center;padding:30px;font-weight:700}
/* Zettelwand */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;margin-top:22px}
.note{background:var(--yellow);border:3px solid var(--ink);padding:14px 14px 10px;font-weight:700;font-size:20px;box-shadow:4px 4px 0 var(--ink);position:relative;cursor:pointer;min-height:96px;overflow-wrap:anywhere}
.note:nth-child(4n+1){transform:rotate(-1.6deg)}.note:nth-child(4n+2){transform:rotate(1.2deg);background:#9BE7FF}.note:nth-child(4n+3){transform:rotate(-.6deg);background:#FFB3CF}.note:nth-child(4n){transform:rotate(1.8deg);background:#B7F2D3}
.note small{display:block;margin-top:8px;font-size:13px;color:var(--ink2);font-weight:800}
.note.star{outline:6px solid var(--pink);z-index:2;transform:scale(1.06) rotate(0)}
/* Zuordnung Tafel */
.mtab{width:100%;border-collapse:separate;border-spacing:0 8px;margin-top:14px}
.mtab th{font-family:var(--f-head);font-weight:800;font-size:16px;padding:6px 8px;text-align:center}
.mtab td{background:#fff;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:8px 10px;font-size:19px;font-weight:700}
.mtab td:first-child{border-left:3px solid var(--ink);border-radius:12px 0 0 12px}
.mtab td:last-child{border-right:3px solid var(--ink);border-radius:0 12px 12px 0}
.mtab td.c{text-align:center;font-family:var(--f-head);font-weight:900;font-size:24px;background:color-mix(in srgb,var(--cyan) calc(var(--p)*80%),#fff)}
.mtab td.c.ok{outline:5px solid var(--ok);outline-offset:-5px;background:color-mix(in srgb,var(--mint) calc(30% + var(--p)*60%),#fff)}
/* Reihenfolge Tafel */
.steps{display:grid;gap:10px;margin-top:16px;counter-reset:s}
.step{display:grid;grid-template-columns:54px 1fr 120px;gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-weight:800;font-size:clamp(17px,1.9vw,24px)}
.step .n{width:44px;height:44px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-family:var(--f-head);font-weight:900;font-size:22px}
.step .mini{height:16px;border:2px solid var(--ink);border-radius:9px;overflow:hidden;background:#eee}.step .mini i{display:block;height:100%;background:var(--mint)}
.step.hidden .n{background:var(--ink2)}
/* Schätzen */
.strip{position:relative;height:120px;margin:80px 20px 10px;border-bottom:6px solid var(--ink)}
.strip .dot{position:absolute;bottom:0;width:22px;height:22px;border-radius:50%;background:var(--pink);border:3px solid var(--ink);transform:translateX(-50%)}
.strip .truth{position:absolute;bottom:0;top:-10px;width:6px;background:var(--ok);transform:translateX(-50%)}
.strip .truth b{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-family:var(--f-head);font-weight:900;background:var(--mint);border:3px solid var(--ink);border-radius:10px;padding:2px 10px;white-space:nowrap}
.scale{display:flex;justify-content:space-between;margin:0 14px;font-weight:800;color:var(--muted)}
/* Lobby */
.lobby{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:28px;align-items:start}
.qrbox{background:#fff;border:4px solid var(--ink);border-radius:18px;box-shadow:var(--sh);padding:18px;text-align:center}
.qrbox canvas{width:100%;max-width:380px;height:auto;display:block;margin:0 auto}
.code{font-family:var(--f-head);font-weight:900;font-size:clamp(40px,6vw,76px);letter-spacing:.14em;color:var(--pink);line-height:1}
.url{font-size:13px;color:var(--muted);word-break:break-all;margin-top:6px}
.people{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.person{border:3px solid var(--ink);background:#fff;border-radius:99px;padding:4px 14px;font-weight:800;cursor:pointer}
.person small{font-family:var(--f-head);font-size:11px;background:var(--ink);color:#fff;border-radius:99px;padding:1px 7px;margin-inline-start:6px}
.langs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.langs .chip{background:var(--cyan)}
/* Podium */
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:20px 0 6px;min-height:290px}
.pod{width:min(30%,200px);text-align:center}
.pod .nm{font-family:var(--f-head);font-weight:900;font-size:clamp(17px,2vw,26px);overflow-wrap:anywhere}
.pod .pt{font-weight:800}
.pod .blk{margin-top:6px;border:4px solid var(--ink);border-radius:14px 14px 0 0;display:grid;place-items:center;font-family:var(--f-head);font-weight:900;font-size:44px;color:var(--ink)}
.pod.p1 .blk{height:190px;background:var(--yellow)}.pod.p2 .blk{height:140px;background:#E5E3F2}.pod.p3 .blk{height:100px;background:#FFB27A}
.ranks{display:grid;gap:6px;max-width:520px;margin:12px auto 0}
.rk{display:flex;justify-content:space-between;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:5px 14px;font-weight:800}
.merklist{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.merklist li{display:flex;gap:14px;align-items:flex-start;font-size:clamp(19px,2.3vw,30px);font-weight:700;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px 16px}
.merklist li::before{content:"★";color:var(--pink);font-size:1.2em;line-height:1.1}
canvas.confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

/* ---------- Handy ---------- */
.phone{max-width:560px;margin:0 auto;padding:16px 16px 60px}
.phone .top{position:sticky}
.phone .poster{padding:18px 18px 16px;margin-top:22px}
.phone .poster.has-burst{padding-top:26px}
.phone .burst{width:62px;height:62px;top:-22px;left:-10px}
.phone .burst span{font-size:18px}
[dir=rtl].phone .burst,[dir=rtl] .phone .burst{left:auto;right:-10px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:start;padding:14px 14px;border:4px solid var(--ink);border-radius:14px;background:#fff;font-weight:800;font-size:18px;line-height:1.25;box-shadow:3px 3px 0 var(--ink)}
.opt .k{flex:none;width:34px;height:34px;border-radius:50%;background:var(--cyan);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--f-head);font-weight:900;font-size:16px}
.opt.sel{background:var(--pink);color:#fff}
.opt.sel .k{background:var(--yellow);color:var(--ink)}
.opt.right{background:var(--okbg);border-color:var(--ok)}.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{opacity:1}
.send{margin-top:16px;width:100%;padding:16px;font-size:20px}
.msg{margin-top:14px;padding:14px 16px;border:4px solid var(--ink);border-radius:14px;font-weight:800;background:var(--cream)}
.msg.good{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.msg.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad)}
.msg .big{font-family:var(--f-head);font-size:24px;font-weight:900;display:block}
.wait{text-align:center;padding:36px 10px;font-weight:800}
.wait .pulse{width:70px;height:70px;margin:0 auto 14px;border-radius:50%;background:var(--yellow);border:4px solid var(--ink);display:grid;place-items:center;animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{transform:scale(1.12)}}
.score{display:inline-flex;gap:6px;align-items:center;background:var(--yellow);color:var(--ink);border-radius:99px;padding:3px 12px;font-family:var(--f-head);font-weight:900;font-size:14px}
input[type=text],textarea{font:inherit;font-size:20px;font-weight:700;padding:13px;border:4px solid var(--ink);border-radius:14px;width:100%;background:#fff;color:var(--ink)}
textarea{min-height:110px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chipbtn{border:3px solid var(--ink);background:#fff;border-radius:99px;padding:8px 14px;font-weight:800;font-size:16px}
.chipbtn.sel{background:var(--cyan)}
.mine{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mine span{background:var(--mint);border:3px solid var(--ink);border-radius:99px;padding:3px 12px;font-weight:800}
.langgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.langgrid button{border:4px solid var(--ink);border-radius:14px;background:#fff;padding:14px 8px;font-weight:900;font-size:20px;box-shadow:3px 3px 0 var(--ink);font-family:var(--f-head)}
.langgrid button.sel{background:var(--yellow)}
.langgrid button small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:700}
.cards{position:relative}
.dotrow{display:flex;gap:6px;justify-content:center;margin:10px 0}
.dotrow i{width:12px;height:12px;border-radius:50%;border:3px solid var(--ink);background:#fff;display:block}.dotrow i.d{background:var(--mint)}.dotrow i.n{background:var(--pink)}
.tfcard{min-height:130px;display:grid;align-content:center;font-size:22px;font-weight:800;text-align:center;padding:18px;background:#fff;border:4px solid var(--ink);border-radius:16px}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tfbtns .btn{padding:18px 8px;font-size:18px}
.slider{width:100%;height:46px;margin:14px 0 4px;accent-color:var(--pink)}
.bigval{font-family:var(--f-head);font-weight:900;font-size:46px;text-align:center;color:var(--pink)}
.mrow{border:3px solid var(--ink);border-radius:14px;padding:10px;background:#fff;margin-top:12px}
.mrow .st{font-weight:800;margin-bottom:8px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button{border:3px solid var(--ink);border-radius:10px;background:var(--cream);padding:9px 3px;font-weight:800;font-size:14px;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.seg button.sel{background:var(--pink);color:#fff}
.seg button.right{background:var(--ok);color:#fff}.seg button.wrong{background:var(--bad);color:#fff}
.ord{display:grid;gap:10px;margin-top:14px}
.ord button{display:flex;gap:12px;align-items:center;text-align:start;border:4px solid var(--ink);border-radius:14px;background:#fff;padding:12px;font-weight:800;font-size:17px;box-shadow:3px 3px 0 var(--ink)}
.ord button b{flex:none;width:38px;height:38px;border-radius:50%;border:3px dashed var(--ink);display:grid;place-items:center;font-family:var(--f-head);font-weight:900}
.ord button.sel{background:var(--cyan)}.ord button.sel b{background:var(--pink);color:#fff;border-style:solid}
.hint{font-size:14px;color:var(--muted);font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(27,19,64,.88);display:grid;place-items:center;z-index:40;padding:20px}
@media (max-width:820px){.lobby{grid-template-columns:1fr}.bar{grid-template-columns:1fr 50px}.bar .lab{grid-column:1/-1}.stage .poster{padding:26px 18px 22px 22px}}
.phone .poster.has-burst{padding-top:42px}
.seg.four{grid-template-columns:1fr 1fr;grid-auto-flow:row}

</style>
</head>

var QRLib=(function(){var M={};function R(n){n=n.replace("./","");return M[n]();}
M["QR8bitByte"]=(function(){var c;return function(){if(c)return c.exports;c={exports:{}};(function(module,exports){var QRMode = R("./QRMode");

}

		var bufIndex = Math.floor(index / 8);
		return ( (this.buffer[bufIndex] >>> (7 - index % 8) ) & 1) == 1;
	},
	
	put : function(num, length) {
		for (var i = 0; i < length; i++) {
			this.putBit( ( (num >>> (length - i - 1) ) & 1) == 1);
		}
	},
	
	getLengthInBits : function() {
		return this.length;
	},
	
	putBit : function(bit) {
	
		var bufIndex = Math.floor(this.length / 8);
		if (this.buffer.length <= bufIndex) {
			this.buffer.push(0);
		}
	
		if (bit) {
			this.buffer[bufIndex] |= (0x80 >>> (this.length % 8) );

		this.length++;
	}
};

module.exports = QRBitBuffer;

function rnd(n){const a="abcdefghijkmnpqrstuvwxyz23456789";let s="";const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s;}

function drawQR(canvas,text){const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!text){ctx.fillStyle="#555";ctx.font="bold 20px sans-serif";ctx.textAlign="center";ctx.fillText("Seite erst online stellen (GitHub Pages)",canvas.width/2,canvas.height/2,canvas.width-20);return;}
  const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();const n=q.getModuleCount(),quiet=2,cell=Math.floor(canvas.width/(n+quiet*2)),off=Math.floor((canvas.width-cell*n)/2);
  ctx.fillStyle="#1B1340";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}

const TE=new TextEncoder(),TD=new TextDecoder();
function mqStr(s){const b=TE.encode(s);return [b.length>>8,b.length&255,...b];}
function mqLen(n){const o=[];do{let d=n%128;n=Math.floor(n/128);if(n>0)d|=128;o.push(d);}while(n>0);return o;}
function mqPacket(hd,body){return new Uint8Array([hd,...mqLen(body.length),...body]);}
class MqttLink{
  constructor(url,cid,onMsg,onStatus){this.url=url;this.cid=cid;this.onMsg=onMsg;this.onStatus=onStatus;this.subs=new Set();this.up=false;this.buf=new Uint8Array(0);this.pid=1;this.tries=0;this.connect();}
  connect(){clearTimeout(this.rt);clearInterval(this.ping);let ws;
    try{ws=new WebSocket(this.url,["mqtt"]);}catch(e){this.retry();return;}
    this.ws=ws;ws.binaryType="arraybuffer";
    const guard=setTimeout(()=>{if(!this.up){try{ws.close();}catch(e){}}},9000);

function phoneApp(){

    if(ME.joined&&p.known&&!p.known.includes(ME.id))sendHi();

    const sc=ST&&ST.sc&&ST.sc[ME.id]?ST.sc[ME.id][0]:0;
    top.replaceChildren(h("div",{class:"top"},h("div",{class:"logo",html:LOGO}),h("span",{class:"chip"},"M"+CFG.modul),h("span",{class:"spacer"}),ME.joined?h("span",{class:"score tab"},"★ "+sc):null,nt,h("button",{class:"tbtn",onclick:()=>{ME.picking=true;render();},"aria-label":"language"},LANG.toUpperCase())),tickerEl());}

    root.dir=LANG==="ar"?"rtl":"ltr";
    paintTop();
    const sig=[LANG,SHOWDE,ME.joined,ME.picking,ST?ST.ri+":"+ST.rev:"x",ST&&ST.sc&&ST.sc[ME.id]?ST.sc[ME.id].join():"",ME.ans[ST?ST.ri:-9]!=null].join("|");

    inp.addEventListener("keydown",e=>{if(e.key==="Enter")go();});

      h("label",{style:"display:flex;gap:8px;align-items:center;margin-top:16px;font-weight:700"},h("input",{type:"checkbox",checked:SHOWDE?"":null,onchange:(e)=>{SHOWDE=e.target.checked;store("lf5.showde"+TS,SHOWDE);lastSig="";render();}}),uis("de")),
