<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fragen-Sortierer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#f1efe9;--surface:#fff;--surface2:#f7f5f0;--ink:#1f1d18;--muted:#5f5a4f;--line:#d9d3c6;
  --brand:#7a3e00;--brand-ink:#fff;--ok:#1f7a3f;--bad:#b3261e;--warn:#a15c00;
  --kauf:#1f5fae;--kauf-soft:#dde8f7;--verk:#c2410c;--verk-soft:#fbe6dc;--beob:#5b4b8a;--beob-soft:#e9e3f5;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#f0a95a;--brand-ink:#1a1209;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --kauf:#7fb0ff;--kauf-soft:#1b2a40;--verk:#ff8a5c;--verk-soft:#3a2219;--beob:#b9a6f0;--beob-soft:#2a2340;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#f0a95a;--brand-ink:#1a1209;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --kauf:#7fb0ff;--kauf-soft:#1b2a40;--verk:#ff8a5c;--verk-soft:#3a2219;--beob:#b9a6f0;--beob-soft:#2a2340;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0 0 .4em;line-height:1.1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.6em 1em}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.45;cursor:default}
input,textarea{font:inherit;width:100%;padding:.6em .7em;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.merk{border-left:6px solid var(--brand);background:var(--surface);border-radius:10px;padding:12px 14px;margin:8px 0}
.merk b.k{color:var(--kauf)} .merk b.v{color:var(--verk)}
.term{font-weight:700;border-bottom:3px solid var(--brand)}
.alt{font-weight:400;color:var(--muted);font-size:.9em}
/* ---------- Tafel ---------- */
#tafel header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tafel header h1{font-size:1.35rem;margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.steps button{padding:.35em .8em;font-size:.9rem}
.steps button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mini{display:flex;align-items:center;gap:10px;font-size:.9rem}
.mini canvas{width:64px;height:64px;border-radius:6px;background:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px}
.dot.on{background:var(--ok)}
#tMain{padding:20px 22px 40px;max-width:1400px;margin:0 auto}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.ctrl button{font-size:1.05rem}
.big{font-size:clamp(1.6rem,3.2vw,2.6rem)}
.join{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:28px;align-items:start}
.join canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:14px}
.code{font-family:var(--display);font-size:3rem;font-weight:800;letter-spacing:.12em}
.nicks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nicks button{padding:.3em .7em;font-size:.95rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.clock{font-family:var(--display);font-size:3rem;font-weight:800}
.chip{display:inline-block;border-radius:999px;padding:.2em .7em;margin:3px;font-weight:700;font-family:var(--display)}
.chip.k{background:var(--kauf-soft);color:var(--kauf)} .chip.v{background:var(--verk-soft);color:var(--verk)}
.banner{border-radius:12px;padding:12px 16px;margin-top:14px;font-size:1.2rem}
.banner.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));border:2px solid var(--ok)}
.banner.nf{background:var(--kauf-soft);border:2px solid var(--kauf)}
.banner.af{background:var(--verk-soft);border:2px solid var(--verk)}
.banner.info{background:var(--surface);border:2px solid var(--brand)}
.satz{display:block;margin-top:6px;font-size:1rem;color:var(--muted)}
.hbar{display:grid;grid-template-columns:140px 1fr 60px;gap:10px;align-items:center;margin:10px 0;font-size:1.15rem}
.hbar .t{height:34px;border-radius:8px;background:var(--surface2);overflow:hidden}
.hbar .t i{display:block;height:100%;transition:width .4s}
.hbar b{font-family:var(--display);font-size:1.8rem;text-align:right}
table.mt{border-collapse:collapse;width:100%;background:var(--surface);border-radius:12px;overflow:hidden;font-size:1.05rem}
table.mt th,table.mt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
table.mt th{background:var(--surface2);font-size:.9rem}
table.mt tr.cur td{outline:3px solid var(--brand);outline-offset:-3px}
table.mt tr.eq td{background:color-mix(in srgb,var(--ok) 18%,var(--surface));font-weight:700}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{font-family:var(--display);font-weight:800;font-size:1.1rem;padding:.4em .8em}
.pchips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pchips button.done{border-color:var(--ok);border-width:2px}
.scen{text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line)}
.scen b{display:block;font-family:var(--display);font-size:1.3rem;margin-bottom:4px}
svg text{font-family:var(--body)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer{font-family:var(--display);font-size:3rem;font-weight:800;min-width:2.2em;text-align:center;border-radius:50%;background:var(--surface);border:4px solid var(--brand);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{border-radius:14px;padding:14px 16px;color:#fff;font-size:1.2rem;font-weight:700;position:relative}
.o0{background:#b3261e}.o1{background:#1f5fae}.o2{background:#8a5300}.o3{background:#3a7a1c}.o4{background:#8537a3}
.opt.wrong{opacity:.35}
.opt .cnt{position:absolute;right:14px;top:10px;font-family:var(--display);font-size:1.6rem}
.top{list-style:none;padding:0;margin:0}
.top li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--surface);margin-bottom:6px;font-size:1.15rem}
.top li b{font-family:var(--display)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:24px}
.podium div{background:var(--brand);color:var(--brand-ink);border-radius:14px 14px 0 0;width:200px;text-align:center;padding:12px;font-family:var(--display);font-weight:800}
.podium span{display:block;font-size:1.4rem}
.pro{font-size:.75rem;font-weight:700;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.qtab{border-collapse:collapse;margin:8px 0;background:var(--surface)}
.qtab td,.qtab th{border:1px solid var(--line);padding:4px 10px;text-align:center}
@media (max-width:900px){.two,.three,.join,.opts{grid-template-columns:1fr}}
/* ---------- Handy ---------- */
#phone{max-width:560px;margin:0 auto;padding:14px 16px 40px}
#phone .ph-top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.card{border-radius:18px;padding:16px 18px;border:3px solid;margin-bottom:12px}
.card.K{background:var(--kauf-soft);border-color:var(--kauf)} .card.V{background:var(--verk-soft);border-color:var(--verk)} .card.B{background:var(--beob-soft);border-color:var(--beob)}
.card .role{font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase}
.card.K .role{color:var(--kauf)} .card.V .role{color:var(--verk)} .card.B .role{color:var(--beob)}
.card .val{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1.05}
.card .cd{margin-top:8px;font-size:1rem}
.card .cd b{font-family:var(--display);font-size:1.8rem;letter-spacing:.1em}
.step{display:flex;align-items:center;gap:8px;margin:8px 0}
.step button{font-size:1.2rem;font-weight:800;padding:.5em .7em;min-width:3.2em}
.step .pv{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:2rem}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.status.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.status.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.yn button{padding:20px 10px;font-size:1.2rem;font-weight:700;border-radius:14px;border:3px solid var(--line)}
.yn button.sel{outline:4px solid var(--ink);outline-offset:1px}
.yn .y{background:color-mix(in srgb,var(--ok) 18%,var(--surface));border-color:var(--ok)}
.yn .n{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:var(--bad)}
.pbtn{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:14px;font-size:1.05rem}
.pbtn.sel{outline:4px solid var(--ink);outline-offset:-2px}
.popt{display:block;width:100%;margin:10px 0;padding:16px 14px;border-radius:14px;color:#fff;border:none;font-size:1.05rem;font-weight:700;text-align:left}
.bigpts{font-family:var(--display);font-size:2.4rem;font-weight:800}
.ansage{font-family:var(--display);font-weight:800;font-size:3rem;text-align:center;margin:6px 0}
/* ---------- Erklärung ---------- */
#help{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:14px 16px 40px}
#help>*{max-width:760px;margin-left:auto;margin-right:auto}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-14px;background:var(--bg);padding:8px 0}
.htabs{display:flex;gap:8px;margin:6px auto 12px}
.htabs button{flex:1;font-weight:700}
.htabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.hbody{font-size:1.1rem;line-height:1.5}
.hs{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.hs summary{font-family:var(--display);font-size:1.2rem}
.hs[open] summary{margin-bottom:6px}
.hw{background:var(--surface);border-left:6px solid var(--brand);border-radius:10px;padding:10px 14px;margin:8px 0}
.hw b{font-family:var(--display);font-size:1.15rem}
.hbtn{padding:.25em .7em;font-weight:700;border-radius:999px}
/* ---------- Fragen-Sortierer ---------- */
:root{--c0:#1f7a3f;--c1:#1f5fae;--c2:#8a5300;--c3:#8537a3;--c4:#b3261e;
  --x0:#1f7a3f;--x1:#1f5fae;--x2:#8a5300;--x3:#8537a3;--x4:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--x0:#6fcf8e;--x1:#7fb0ff;--x2:#f0b35a;--x3:#d3a0f0;--x4:#ff8a80}}
:root[data-theme="dark"]{--x0:#6fcf8e;--x1:#7fb0ff;--x2:#f0b35a;--x3:#d3a0f0;--x4:#ff8a80}
.t0{--c:var(--c0);--x:var(--x0)}.t1{--c:var(--c1);--x:var(--x1)}.t2{--c:var(--c2);--x:var(--x2)}.t3{--c:var(--c3);--x:var(--x3)}.t4{--c:var(--c4);--x:var(--x4)}
.tr{display:block;font-weight:400;font-size:.88em;opacity:.85;margin-top:2px}
.tr[dir=rtl]{text-align:right;font-size:1em}
.badge{display:inline-block;background:var(--c);color:#fff;font-family:var(--display);font-weight:800;border-radius:8px;padding:.15em .55em;white-space:nowrap}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:stretch}
.col{background:color-mix(in srgb,var(--c) 10%,var(--surface));border:2px solid var(--c);border-top-width:10px;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:1.35rem;margin:0;color:var(--x);overflow-wrap:anywhere}
.col .q{background:var(--surface);border-radius:10px;padding:8px 10px;font-size:1.02rem}
.col .lbl{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.col .hid{border:2px dashed var(--c);border-radius:10px;padding:14px 8px;text-align:center;color:var(--x);font-weight:700;background:transparent;width:100%}
.col .mk{font-size:1.1rem;font-weight:700}
.use.ok{color:var(--ok);font-weight:700}.use.no{color:var(--bad);font-weight:700}
.qbig{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,3.6vw,3rem);line-height:1.15;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 26px;margin:10px 0}
.dist{display:grid;grid-template-columns:minmax(200px,290px) 1fr 54px;gap:10px;align-items:center;margin:8px 0;font-size:1.1rem;background:none;border:none;width:100%;text-align:left;padding:2px 0;color:var(--ink)}
.dist .t{height:30px;border-radius:8px;background:var(--surface2);overflow:hidden}
.dist .t i{display:block;height:100%;background:var(--c);transition:width .4s}
.dist b.n{font-family:var(--display);font-size:1.5rem;text-align:right}
.dist.sol{outline:3px solid var(--ok);outline-offset:4px;border-radius:8px}
.hard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0}
.hard .hq{font-family:var(--display);font-weight:800;font-size:1.45rem}
.qlist{list-style:none;padding:0;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qlist li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:1.1rem;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.qlist li button{padding:.1em .5em;font-size:.85rem}
.prog{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.prog span{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.2em .7em;font-size:.95rem}
.prog span.fin{border-color:var(--ok);border-width:2px}
.stt{border-collapse:collapse;width:100%;background:var(--surface);border-radius:12px;overflow:hidden}
.stt td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:1.02rem}
.vol{width:90px;padding:0;border:none;background:none}
@media (max-width:1000px){.five{grid-template-columns:1fr 1fr}.qlist{grid-template-columns:1fr}}
/* Handy */
#phone select{width:auto;padding:.25em .4em;font-size:.9rem}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin:10px 0}
.pq{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1.2}
.pq .tr{font-family:var(--body);font-size:1.02rem;margin-top:8px}
.tbtn{display:block;width:100%;margin:8px 0;padding:13px 14px;border-radius:14px;background:var(--c);color:#fff;border:none;font-size:1.08rem;text-align:left;min-height:52px}
.tbtn .tr{opacity:.95}
.tbtn.sel{outline:4px solid var(--ink);outline-offset:2px}
.pov{border-left:8px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface));border-radius:12px;padding:10px 12px;margin:10px 0}
.pov h3{color:var(--x);font-size:1.2rem;margin:0 0 4px}
.pov .lbl{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:8px}
.lang4{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 14px}
.lang4 button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.fb{border-radius:14px;padding:14px;margin:10px 0;border:3px solid}
.fb.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.fb.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.rowb{display:flex;gap:8px;margin-top:10px}.rowb button{flex:1}
.lad{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.lad .n{font-family:var(--display);font-weight:800;font-size:1.4rem;color:var(--muted)}
.lad>div{flex:1}
#qrOver{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;padding:16px}
#qrOver canvas{width:min(78vh,90vw);height:auto;aspect-ratio:1;background:#fff;border-radius:14px}
#qrOver p{margin:0}
</style>
</head>
<body>

  </header>
  <main id="tMain"></main>
</div>
<div id="phone" hidden></div>

  function play(st,t){const bar=Math.floor(st/16)%S.bass.length,s=st%16,ch=S.ch[bar%S.ch.length];
    const bp=S.bp||[0,2,4,6,8,10,12,14];
    if(bp.includes(s)){const off=S.walk?[0,4,7,9][Math.floor(s/4)%4]:(s%4===0?0:12);tone(mf(S.bass[bar]+off),t,S.walk?.3:.16,S.bt||"triangle",S.bt==="sawtooth"?.12:S.bt==="square"?.1:.32);}
    if(!S.as||S.as.includes(s))tone(mf(ch[S.ap[s%S.ap.length]%ch.length]+12*(S.oct||0)+(fast?12:0)),t,S.ad||.09,S.arp,AV[S.arp]||.05);
    if(S.kick.includes(s))kick(t);
    if(S.snare.includes(s))noise(t,.12,.25,1800);
    if(S.cl&&S.cl.includes(s))tone(1250,t,.04,"sine",.18);
    const hat=S.hat;
    if(hat==="all"||fast||(hat==="off"&&s%2===1)||(hat==="jazz"&&(s%4===0||s%8===6)))noise(t,.03,.07,7000);}
  function sched(){const d=60/(fast?S.fast:S.bpm)/4;
    if(next<ctx.currentTime-.05)next=ctx.currentTime+.02;
    while(next<ctx.currentTime+.12){play(step,next+(step%2?d*(S.swing||0):0));next+=d;step++;}}
  const root=()=>S.ch[0][0]%12+60;
  return {
    pool:MUSIK_POOL,
    vol(v){if(v===undefined)return vol;vol=Math.max(0,Math.min(1,v));ls("fsortvol",vol);if(master)master.gain.value=vol;},
    current(){return S.name;},
    unlock(){if(on)init();},
    isOn(){return on;},
    toggle(){on=!on;ls("fsortmusik",on);if(!on)this.stop();return on;},
    start(){if(!on||timer||!init())return;pick();fast=false;step=0;next=ctx.currentTime+.06;timer=setInterval(sched,25);
      try{console.log("[Quiz-Musik] Stück",last,S.name);}catch(e){}},
    hurry(){fast=true;},
    tick(){if(!on||!init())return;tone(1760,ctx.currentTime,.06,"sine",.25);},
    stop(){clearInterval(timer);timer=null;fast=false;},
    reveal(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.03,r=root();
      [0,4,7].forEach((m,i)=>tone(mf(r+m),t+i*.09,.25,"square",.08));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+.3,.9,"triangle",.14));kick(t+.3);noise(t+.3,.25,.25,3000);},
    fanfare(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.05,r=60;
      [[-5,0],[0,.15],[4,.3],[7,.45],[4,.7],[7,.85]].forEach(([m,d])=>tone(mf(r+m),t+d,.22,"square",.09));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+1.05,1.6,"triangle",.15));[0,.45,1.05].forEach(d=>kick(t+d));noise(t+1.05,.5,.3,2500);}
  };})();
/* Quiz-Musik automatisch an die Tafel koppeln: Timer #tm sichtbar = Abfrage läuft (Quiz, Prüfungs-Check, Abstimmung) */
(function MusicAuto(){
  if(new URLSearchParams(location.search).get("s"))return;
  const tf=document.getElementById("tafel"),st=document.getElementById("steps");
  let was=false,lastS=-1,pod=false;
  function btn(){if(!st||document.getElementById("bMus"))return;const b=document.createElement("button");b.id="bMus";b.type="button";
    b.title="Quiz-Musik an oder aus";b.style.cssText="padding:.25em .7em;font-weight:700;border-radius:999px;white-space:nowrap";
    b.onclick=()=>{Music.toggle();if(Music.isOn()){Music.unlock();if(was)Music.start();}lab();};st.after(b);
    const r=document.createElement("input");r.type="range";r.min=0;r.max=100;r.value=Math.round(Music.vol()*100);r.className="vol";r.id="rVol";r.title="Lautstärke der Musik";r.setAttribute("aria-label","Lautstärke der Musik");r.oninput=()=>Music.vol(r.value/100);b.after(r);lab();}
  function lab(){const b=document.getElementById("bMus");if(b)b.textContent=Music.isOn()?"Musik: an":"Musik: aus";}
  document.addEventListener("pointerdown",()=>Music.unlock(),true);
  btn();
  setInterval(()=>{if(!tf||tf.hidden)return;btn();
    const tm=document.getElementById("tm"),vis=!!(tm&&tm.offsetParent!==null);
    if(vis){if(!was){was=true;lastS=-1;Music.start();}
      const s=parseInt(tm.textContent,10);if(!isNaN(s)&&s!==lastS){lastS=s;if(s<=10&&s>0)Music.hurry();if(s<=5&&s>0)Music.tick();}}
    else if(was){was=false;Music.reveal();}
    const p=document.querySelector("#tMain .podium"),pv=!!(p&&p.offsetParent!==null);
    if(pv&&!pod){pod=true;Music.fanfare();}if(!pv)pod=false;
  },200);
})();

<script>
const roomCode=(params.get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
const cnt=s=>{let n=0;for(const ch of s)if(ch!=="-")n++;return n;};

/* =========================================================
   TAFEL (Lehrkraft, Beamer)
   ========================================================= */
function tafelApp(){
  $("tafel").hidden=false;
  const KEY="fsort1-tafel";
  const fresh=()=>({code:codeGen(),ph:0,pl:{},ban:[],rev:[],so:0,sEver:0,wo:0,qs:[],v:null,vi:0,resAdded:0});
  let T=store(KEY);if(!T||!T.code||!T.pl)T=fresh();
  let conn={up:0},pubT=null,renT=null,shown={},sure=0;
  const save=()=>store(KEY,T);
  const net=new Net(onMsg,c=>{conn=c;renderHead();pub();});
  net.sub(T.code+"/in");
  const players=()=>Object.entries(T.pl);
  const joinUrl=()=>location.origin+location.pathname+"?s="+T.code+(LOCAL?"&bc=1":"");
  const ranking=()=>players().sort((a,b)=>b[1].pts-a[1].pts||a[1].n.localeCompare(b[1].n));

  function state(){
    const P={};for(const [id,p] of players())P[id]=[p.pts,cnt(p.s),p.ty,p.wa,p.w];
    const v=T.v?{i:T.v.i,x:T.v.x,au:T.v.au,o:T.v.o,an:Object.keys(T.v.ans),sol:T.v.o?-1:T.v.sol}:null;
    const S={c:T.code,ph:T.ph,P,rev:T.rev,so:T.so,wo:T.wo,v};
    if(T.ph===5)S.rk=ranking().map(e=>e[0]);
    return S;}
  function pub(){clearTimeout(pubT);pubT=setTimeout(()=>{save();net.pub(T.code+"/st",state(),true);},120);}
  setInterval(pub,5000);
  function later(){clearTimeout(renT);renT=setTimeout(render,250);}

  function assign(pid){const p=T.pl[pid];if(!p||p.ty>=0)return;
    const c=[0,0,0,0,0];for(const [,q] of players())if(q.ty>=0)c[q.ty]++;
    const min=Math.min(...c),cand=c.map((x,i)=>x===min?i:-1).filter(i=>i>=0);
    p.ty=cand[Math.floor(Math.random()*cand.length)];p.wa=Math.floor(Math.random()*WAREN.length);}

  function onMsg(topic,m){
    if(!m||typeof m!=="object"||typeof m.pid!=="string"||!/^[a-z0-9]{6}$/.test(m.pid))return;
    const pid=m.pid;let p=T.pl[pid];
    if(m.k==="hi"){
      if(p||T.ban.includes(pid)){pub();return;}
      let n=clean(m.n,16);if(!n||players().length>=45)return;
      const names=players().map(e=>e[1].n);let base=n,i=2;while(names.includes(n))n=base.slice(0,13)+" "+(i++);
      T.pl[pid]={n,pts:0,s:"-".repeat(NC),ty:-1,wa:-1,w:0};if(T.ph>=3)assign(pid);
      pub();renderHead();later();return;}
    if(!p)return;
    if(m.k==="s"){
      if(T.ph!==2||!T.so||typeof m.a!=="string"||!/^[0-4-]+$/.test(m.a)||m.a.length!==NC)return;
      let s=p.s.split(""),ch=false;
      for(let i=0;i<NC;i++){if(s[i]==="-"&&m.a[i]!=="-"){s[i]=m.a[i];ch=true;if(+m.a[i]===CARDS[i].k)p.pts+=100;}}
      if(ch){p.s=s.join("");later();}pub();return;}
    if(m.k==="w"){
      if(T.ph!==3||!T.wo||typeof m.id!=="string"||T.qs.some(q=>q.id===pid+m.id)){pub();return;}
      let x=clean(m.x,140).replace(/^[„“"”»«]+|[„“"”»«]+$/g,"").trim();if(x.length<8||p.w>=3)return;
      let ty=p.w===0?p.ty:Math.floor(+m.ty);if(!(ty>=0&&ty<=4))return;
      T.qs.push({id:pid+m.id,pid,ty,x,used:0});p.w++;if(p.w===1)p.pts+=100;
      pub();later();return;}
    if(m.k==="v"){
      const v=T.v;if(T.ph!==4||!v||!v.o||m.q!==v.i||pid===v.au||v.ans[pid])return;
      const c=Math.floor(+m.c);if(!(c>=0&&c<=4))return;
      v.ans[pid]={c,t:Date.now()};
      const elig=players().filter(e=>e[0]!==v.au).length;
      if(Object.keys(v.ans).length>=elig)reveal();else{pub();const el=$("vcount");if(el)el.textContent=Object.keys(v.ans).length;}
      return;}
  }

  /* ---------- Klasse prüft ---------- */
  function settle(){const v=T.v;if(!v||v.o||v.settled)return;v.settled=1;
    let n=0,k=0;for(const [pid,a] of Object.entries(v.ans)){n++;if(a.c===v.sol){k++;const p=T.pl[pid];
      if(p)p.pts+=100+Math.round(50*Math.max(0,1-(a.t-v.st)/(VDUR*1000)));}}
    if(v.au&&T.pl[v.au]&&n>=2&&k/n>=.5)T.pl[v.au].pts+=150;}
  function reveal(){if(!T.v||!T.v.o)return;T.v.o=0;pub();render();}
  function nextQ(){
    if(T.v&&T.v.o)T.v.o=0;settle();
    if(!T.resAdded){T.resAdded=1;const have=new Set(T.qs.map(q=>q.ty));
      for(const [ty,x] of RESERVE){if(T.qs.length>=5&&have.has(ty))continue;T.qs.push({id:"res"+ty,pid:null,ty,x,used:0});have.add(ty);}}
    const pool=T.qs.filter(q=>!q.used);if(!pool.length){T.v=null;pub();render();return;}
    const usedC=[0,0,0,0,0];T.qs.forEach(q=>{if(q.used)usedC[q.ty]++;});
    const min=Math.min(...pool.map(q=>usedC[q.ty])),cand=pool.filter(q=>usedC[q.ty]===min);
    const q=cand[Math.floor(Math.random()*cand.length)];q.used=1;
    T.v={i:T.vi++,x:q.x,au:q.pid,sol:q.ty,o:1,st:Date.now(),ans:{},settled:0};pub();render();}
  setInterval(()=>{const v=T.v;if(T.ph!==4||!v||!v.o)return;
    const left=Math.ceil(VDUR-(Date.now()-v.st)/1000);const el=$("tm");if(el)el.textContent=Math.max(0,left);
    if(left<=0)reveal();},250);

  function go(ph){
    if(T.ph===4&&ph!==4&&T.v){if(T.v.o)T.v.o=0;settle();T.v=null;}
    T.ph=ph;if(ph!==2)T.so=0;if(ph!==3)T.wo=0;
    if(ph===3)for(const [id] of players())assign(id);
    pub();renderHead();render();window.scrollTo(0,0);}

  function drawQR(canvas,text){
    const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(!text||typeof QRLib==="undefined")return;
    const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();
    const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
    ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}
  function renderHead(){
    $("steps").innerHTML=PHASES.map((p,i)=>`<button data-ph="${i}" class="${i===T.ph?"on":""}">${i+1} ${p}</button>`).join("");
    $("steps").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.ph));
    $("miniCode").textContent="Code "+T.code;$("miniN").textContent=players().length+" dabei";
    $("conn").innerHTML=`<span class="dot ${conn.up?"on":""}"></span>${conn.up?"verbunden":"keine Verbindung"}`;
    drawQR($("qrSmall"),joinUrl());}

  const colHTML=(i,open)=>{const t=TY[i];return `<div class="col t${i}"><span class="badge">${h(t.b)}</span><h3>${h(t.n)}</h3><div class="alt">${h(t.a)}</div>
    <div class="lbl">Beispiel</div><div class="q">${h(quo(t.x))}</div>
    ${open?`<div class="lbl">Woran erkenne ich sie?</div><div class="mk">${h(t.m)}</div>
      <div class="lbl">Einsatz im Verkauf</div><div class="use ${t.ok?"ok":"no"}">${t.ok?"✔":"✘"} ${h(t.e)}</div><div class="muted">${h(t.l)}</div>`
     :`<button class="hid" data-rev="${i}">Woran erkennt ihr sie?<br>Erst vermuten – dann aufdecken</button>`}</div>`;};
  const distHTML=(d,sol,click)=>{const mx=Math.max(1,...d);return d.map((n,i)=>`<${click?"button":"div"} class="dist t${i} ${i===sol?"sol":""}" ${click?`data-sol="${i}"`:""}><span><span class="badge">${h(TY[i].b)}</span> ${h(TY[i].n)}</span><span class="t"><i style="width:${100*n/mx}%"></i></span><b class="n">${n}</b></${click?"button":"div"}>`).join("");};
  const topHTML=n=>`<ol class="top">${ranking().slice(0,n).map(([,p],i)=>`<li><span>${i+1}. ${h(p.n)}</span><b>${p.pts}</b></li>`).join("")}</ol>`;

  function render(){
    const M=$("tMain"),pl=players();let s="";
    if(T.ph===0){
      s=`<div class="join"><div><canvas id="qrBig" width="840" height="840"></canvas></div><div>
        <h2 class="big">Wer fragt, führt.</h2><p class="big" style="margin:.2em 0">Scanne den QR-Code mit dem Handy oder iPad.</p>
        <p>Dann: Spitzname eingeben und Sprache wählen (Deutsch · Türkçe · Tiếng Việt · العربية).</p>
        <div class="code">${T.code}</div><p class="muted" style="overflow-wrap:anywhere">${h(joinUrl())}</p>
        <h3>${pl.length} dabei</h3><div class="nicks">${pl.map(([id,p])=>`<button data-kick="${id}" title="Antippen = entfernen">${h(p.n)}</button>`).join("")}</div>
        <div class="ctrl"><button class="pri" id="bNext">Weiter zur Übersicht</button><button id="bNew">${sure?"Wirklich? Alle Daten weg – nochmal klicken":"Neue Sitzung"}</button></div>
        <p class="muted">Spitzname antippen = aus dem Spiel entfernen. Nachzügler können jederzeit dazukommen.</p></div></div>`;
    }else if(T.ph===1){
      s=`<h2 class="big">Die fünf Fragearten</h2><p class="muted">Lest das Beispiel laut. Woran erkennt ihr die Frageart? Spalte antippen = aufdecken. Auf den Handys steht alles auch in der gewählten Sprache.</p>
        <div class="five">${TY.map((t,i)=>colHTML(i,T.rev.includes(i))).join("")}</div>
        <div class="ctrl"><button id="bAll">Alle aufdecken</button><button class="pri" id="bNext">Weiter zum Sortieren</button></div>
        <div class="banner info">Satzbaustein: „Das ist eine … Frage, weil …“<span class="satz">Beispiel: „Das ist eine offene Frage, weil am Anfang ein Fragewort steht.“</span></div>`;
    }else if(T.ph===2){
      const st=CARDS.map(()=>({a:0,c:0,d:[0,0,0,0,0]})),ty=TY.map(()=>({a:0,c:0}));let fin=0;
      for(const [,p] of pl){if(cnt(p.s)===NC)fin++;for(let i=0;i<NC;i++){const ch=p.s[i];if(ch==="-")continue;const k=CARDS[i].k;st[i].a++;st[i].d[+ch]++;ty[k].a++;if(+ch===k){st[i].c++;ty[k].c++;}}}
      const began=pl.some(([,p])=>cnt(p.s)>0);
      s=`<h2 class="big">Sortieren: Welche Frageart ist das?</h2>
        <p class="muted">Jede Person sortiert 20 Fragen am Handy – im eigenen Tempo, mit Tipp-Knopf und Übersicht. 100 Punkte je richtiger Karte.</p>
        <div class="ctrl">${T.so?`<button class="pri" id="bStop">Sortieren beenden und auswerten</button>`:`<button class="pri" id="bStart">${began?"Sortieren wieder öffnen":"Sortieren starten"}</button>`}
          <b class="big">${fin} von ${pl.length} fertig</b>${!T.so&&began?`<button id="bNext">Weiter: Selbst fragen</button>`:""}</div>
        <div class="prog">${pl.map(([,p])=>`<span class="${cnt(p.s)===NC?"fin":""}">${h(p.n)} ${cnt(p.s)}/${NC}</span>`).join("")}</div>`;
      if(began){
        s+=`<div class="two" style="margin-top:18px"><div><h3>So sicher ist die Klasse</h3>${ty.map((t,i)=>`<div class="dist t${i}"><span><span class="badge">${h(TY[i].b)}</span> ${h(TY[i].n)}</span><span class="t"><i style="width:${t.a?100*t.c/t.a:0}%"></i></span><b class="n">${t.a?Math.round(100*t.c/t.a):0}%</b></div>`).join("")}<p class="muted">Anteil richtiger Zuordnungen je Frageart.</p></div><div>`;
        if(!T.so){
          const hard=st.map((x,i)=>({i,r:x.a?x.c/x.a:1,x})).filter(o=>o.x.a>0&&o.r<1).sort((a,b)=>a.r-b.r).slice(0,5);
          s+=`<h3>Die schwersten Karten</h3>${hard.length?"":`<p>Alle Karten wurden richtig sortiert.</p>`}${hard.map(o=>{const c=CARDS[o.i],op=shown[o.i];
            return `<div class="hard"><div class="hq">${h(quo(c.q))}</div><div class="muted">${Math.round(100*o.r)} % richtig</div>
              ${op?`${distHTML(o.x.d,c.k,false)}<div class="banner ok t${c.k}"><b>${h(TY[c.k].n)}</b> – ${h(TY[c.k].m)}<span class="satz">Signal: ${h(c.s)}</span></div>`
                  :`<button data-show="${o.i}">Erst vermuten – dann Lösung zeigen</button>`}</div>`;}).join("")}`;
        }else s+=`<h3>Auswertung</h3><p class="muted">Die schwersten Karten erscheinen hier, sobald Sie das Sortieren beenden.</p>`;
        s+=`</div></div>`;}
    }else if(T.ph===3){
      const done=pl.filter(([,p])=>p.w>0).length;
      s=`<h2 class="big">Selbst fragen: Schreibe eine eigene Frage</h2>
        <p class="muted">Jedes Handy zeigt eine Frageart und eine Ware. Die Fragen erscheinen hier ohne Namen. Antippen von „×“ entfernt eine Frage.</p>
        <div class="ctrl">${T.wo?`<button class="pri" id="bWStop">Schreiben beenden</button>`:`<button class="pri" id="bWStart">${T.qs.length?"Schreiben wieder öffnen":"Schreiben starten"}</button>`}
          <b class="big">${done} von ${pl.length} haben geschrieben · ${T.qs.filter(q=>q.pid).length} Fragen</b>${!T.wo&&T.qs.length?`<button id="bNext">Weiter: Klasse prüft</button>`:""}</div>
        <div class="two" style="margin-top:16px"><div><h3>Eure Fragen</h3><ul class="qlist" style="grid-template-columns:1fr">${T.qs.filter(q=>q.pid).map(q=>`<li><span>${h(quo(q.x))}</span><button data-del="${h(q.id)}" title="Frage entfernen">×</button></li>`).join("")||`<li class="muted">Noch keine Frage.</li>`}</ul></div>
        <div><h3>Hilfe: Satzanfänge</h3><table class="stt">${TY.map((t,i)=>`<tr class="t${i}"><td><span class="badge">${h(t.b)}</span><br><b>${h(t.n)}</b></td><td>${t.st.map(x=>h(quo(x))).join("<br>")}</td></tr>`).join("")}</table>
        <div class="banner info"><b>Für Profis:</b> Mache aus der Suggestivfrage „Sonst brauchen Sie nichts?“ eine offene Frage. Schreibe sie als weitere Frage ins Handy.<span class="satz">In der Prüfung: Fragen immer in wörtlicher Rede mit Anführungszeichen schreiben.</span></div></div></div>`;
    }else if(T.ph===4){
      const v=T.v,rest=T.qs.filter(q=>!q.used).length,own=T.qs.filter(q=>q.pid).length;
      if(!v){s=`<h2 class="big">Klasse prüft: Welche Frageart ist das?</h2>
          <p>${T.vi?`Alle Fragen sind gespielt.`:`Jetzt sortiert die Klasse eure eigenen Fragen. ${own} Fragen sind da${own<5?" – die App ergänzt Reserve-Fragen":""}. Wer die Frage geschrieben hat, setzt aus.`}</p>
          <p class="muted">Punkte: richtig zuordnen 100 + Zeitbonus. Ist eine eigene Frage für mindestens die Hälfte gut erkennbar: 150 Punkte für die Autorin oder den Autor.</p>
          <div class="ctrl">${T.vi&&!rest?"":`<button class="pri" id="bQ">${T.vi?"Nächste Frage":"Erste Frage zeigen"}</button>`}<button class="${T.vi&&!rest?"pri":""}" id="bNext">Weiter zur Siegerehrung</button></div>`;
      }else{
        const d=[0,0,0,0,0];Object.values(v.ans).forEach(a=>d[a.c]++);
        s=`<div class="qhead"><h2>Frage ${v.i+1}${v.au?"":" (Reserve)"} · Welche Frageart ist das?</h2>${v.o?`<div class="timer" id="tm">${VDUR}</div>`:""}</div>
          <div class="qbig">${h(quo(v.x))}</div>`;
        if(v.o)s+=`<p class="big"><span id="vcount">${Object.keys(v.ans).length}</span> Antworten</p><div class="ctrl"><button class="pri" id="bRev">Auflösen</button></div>`;
        else s+=`<div class="two"><div>${distHTML(d,v.sol,true)}<p class="muted">Stimmt die Frageart nicht? Balken antippen = Lösung ändern (vor „Nächste Frage“).</p>
            <div class="banner ok t${v.sol}"><b>${h(TY[v.sol].n)}</b> – ${h(TY[v.sol].m)}<span class="satz">Satzbaustein: „Das ist eine ${h(TY[v.sol].n)}, weil …“ · Einsatz: ${h(TY[v.sol].e)}</span></div>
            <div class="ctrl">${rest?`<button class="pri" id="bQ">Nächste Frage (noch ${rest})</button>`:""}<button class="${rest?"":"pri"}" id="bNext">Weiter zur Siegerehrung</button></div></div>
            <div><h3>Zwischenstand</h3>${topHTML(5)}</div></div>`;}
    }else{
      const r=ranking();
      s=`<h2 class="big">Siegerehrung</h2><div class="podium">${[1,0,2].filter(i=>r[i]).map(i=>`<div style="height:${[230,180,140][i]}px"><span>${i+1}. Platz</span>${h(r[i][1].n)}<span>${r[i][1].pts}</span></div>`).join("")}</div>
        <div class="two" style="margin-top:20px"><div><h3>Alle Punkte</h3>${topHTML(50)}</div><div>
        <div class="banner info"><b class="big">Wer fragt, führt.</b><span class="satz">Am Anfang offen (W-Fragen): Der Kunde erzählt. · In der Mitte Alternativfrage: Die Auswahl wird kleiner. · Am Ende geschlossen: Der Kunde entscheidet. · Suggestiv- und rhetorische Fragen vermeiden.</span></div>
        <div class="banner info"><b>In der Prüfung:</b> Fragen immer in wörtlicher Rede mit Anführungszeichen schreiben.</div>
        <div class="banner info"><b>Für Profis – zum Schluss im Plenum:</b><span class="satz">1. Warum ist „Kann ich Ihnen helfen?“ für die Bedarfsermittlung eine schlechte Frage?<br>2. Wann ist eine geschlossene Frage im Verkaufsgespräch sinnvoll?</span></div></div></div>`;}
    M.innerHTML=s;
    const on=(id,f)=>{const e=$(id);if(e)e.onclick=f;};
    if($("qrBig"))drawQR($("qrBig"),joinUrl());
    on("bNext",()=>go(Math.min(5,T.ph+1)));
    on("bNew",()=>{if(!sure){sure=1;render();setTimeout(()=>{sure=0;if(T.ph===0)render();},4000);return;}
      net.pub(T.code+"/st",{c:T.code,ph:-1,P:{},rev:[]},true);try{localStorage.removeItem(KEY);}catch(e){}location.href=location.pathname+(LOCAL?"?bc=1":"");});
    M.querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>{const id=b.dataset.kick;delete T.pl[id];T.ban.push(id);pub();renderHead();render();});
    M.querySelectorAll("[data-rev]").forEach(b=>b.onclick=()=>{T.rev.push(+b.dataset.rev);pub();render();});
    on("bAll",()=>{T.rev=[0,1,2,3,4];pub();render();});
    on("bStart",()=>{T.so=1;T.sEver=1;pub();render();});
    on("bStop",()=>{T.so=0;pub();render();});
    M.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{shown[b.dataset.show]=1;render();});
    on("bWStart",()=>{T.wo=1;pub();render();});
    on("bWStop",()=>{T.wo=0;pub();render();});
    M.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{T.qs=T.qs.filter(q=>q.id!==b.dataset.del);pub();render();});
    on("bQ",nextQ);on("bRev",reveal);
    M.querySelectorAll("[data-sol]").forEach(b=>b.onclick=()=>{if(T.v&&!T.v.o&&!T.v.settled){T.v.sol=+b.dataset.sol;pub();render();}});
  }
  /* QR-Code antippen = groß zeigen (Einstieg mitten im Spiel), nochmal antippen = wieder klein */
  const qs=$("qrSmall");qs.style.cursor="pointer";qs.title="Antippen: QR-Code groß zeigen";qs.tabIndex=0;qs.setAttribute("role","button");
  function toggleQR(){let o=$("qrOver");if(o){o.remove();return;}
    o=document.createElement("div");o.id="qrOver";o.title="Antippen: wieder klein";
    o.innerHTML=`<canvas id="qrOverC" width="900" height="900"></canvas><div class="code">${T.code}</div><p class="muted">Antippen = wieder klein</p>`;
    o.onclick=toggleQR;document.body.appendChild(o);drawQR($("qrOverC"),joinUrl());}
  qs.onclick=toggleQR;qs.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleQR();}};
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("qrOver"))toggleQR();});
  renderHead();render();pub();
}

/* =========================================================
   HANDY (Schülerinnen und Schüler)
   ========================================================= */
function phoneApp(){
  const P=$("phone");P.hidden=false;
  const code=roomCode,MK="fsort1-me-"+code+(params.get("t")||"");
  let me=store(MK);
  if(!me||!me.pid)me={pid:rnd(6),n:"",lang:"de",ord:shuffle(CARDS.map((_,i)=>i)),a:"-".repeat(NC),subs:[]};
  lang=me.lang||"de";
  let S=null,lastKey="",pending=null,conn={up:0},view=null,fb=null,draft="",wType=-1,warn="",warnFor="",form=true,vSel={};
  const saveMe=()=>store(MK,me);
  const net=new Net((t,m)=>{if(t===NS+code+"/st"&&m&&m.c===code){S=m;render();}},c=>{conn=c;const d=$("pdot");if(d)d.className="dot "+(c.up?"on":"");});
  net.sub(code+"/st");
  function send(m){m.pid=me.pid;net.pub(code+"/in",m);}
  setInterval(()=>{if(!me.n)return;
    if(!S||!S.P||!S.P[me.pid]){if(!S||S.ph!==-1)send({k:"hi",n:me.n});}
    else if(pending&&!pending.done())send(pending.msg);},2500);
  const my=()=>S&&S.P&&S.P[me.pid];
  const nextCard=()=>me.ord.find(i=>me.a[i]==="-");
  const corrN=()=>{let n=0;for(let i=0;i<NC;i++)if(me.a[i]!=="-"&&+me.a[i]===CARDS[i].k)n++;return n;};
  function keyOf(){const m=my();return JSON.stringify([me.n,lang,view,S&&[S.ph,(S.rev||[]).join(""),S.so,S.wo,m&&m.join(","),S.v&&[S.v.i,S.v.o,S.v.sol,S.v.au===me.pid],S.rk&&S.rk.indexOf(me.pid)],fb,me.a,me.subs.length,warn,wType,form,S&&S.v&&vSel[S.v.i]]);}

  const typeBtns=(sel)=>TY.map((t,i)=>`<button class="tbtn t${i} ${sel===i?"sel":""}" data-ty="${i}"><b>${h(t.n)}</b> <span style="opacity:.85">(${h(t.a)})</span>${tl(t.tr)}</button>`).join("");
  const ovCard=(i,full)=>{const t=TY[i];return `<div class="pov t${i}"><span class="badge">${h(t.b)}</span><h3 style="margin-top:6px">${h(t.n)} <span class="alt">(${h(t.a)})</span></h3>${tl(t.tr)}
     <div class="lbl">${u("ex")}</div><div><b>${h(quo(t.x))}</b>${tl(t.xt)}</div>
     ${full?`<div class="lbl">${u("how")}</div><div><b>${h(t.m)}</b>${tl(t.mt)}</div><div class="lbl">${u("use")}</div><div class="use ${t.ok?"ok":"no"}">${t.ok?"✔":"✘"} ${h(t.e)}${tl(t.et)}</div>`:""}</div>`;};
  const topBar=()=>{const m=my();return `<div class="ph-top"><span><span id="pdot" class="dot ${conn.up?"on":""}"></span>${h(me.n)}${m?` · <b>${m[0]}</b> ${h(U.pts[0])}`:""}</span>
     <select id="selLang" aria-label="Sprache">${LANGS.map(([c,n])=>`<option value="${c}" ${c===lang?"selected":""}>${n}</option>`).join("")}</select></div>`;};

  function render(force){
    const k=keyOf();if(!force&&k===lastKey)return;lastKey=k;
    let s="";const m=my();
    if(!me.n){
      s=`<h1>Fragen-Sortierer</h1><div class="pcard"><div class="lbl"><b>${u("langq")}</b></div>
        <div class="lang4">${LANGS.map(([c,n])=>`<button data-lang="${c}" class="${c===lang?"on":""}">${n}</button>`).join("")}</div>
        <label for="nick"><b>${u("nick")}</b></label><input id="nick" maxlength="16" autocomplete="off" style="margin:6px 0 12px">
        <button class="pri" id="bGo" style="width:100%">${u("go")}</button></div>`;
    }else if(S&&S.ph===-1){s=topBar()+`<div class="pcard">Diese Sitzung ist beendet.</div>`;
    }else if(!m){s=topBar()+`<div class="pcard">${u("conn")}</div>`;
    }else if(view==="ov"){
      s=topBar()+`<button class="pri" id="bBack" style="width:100%">${u("back")}</button><h2 style="margin-top:12px">${u("ov")}</h2>${TY.map((_,i)=>ovCard(i,true)).join("")}`;
    }else if(view==="tip"){
      s=topBar()+`<button class="pri" id="bBack" style="width:100%">${u("back")}</button><h2 style="margin-top:12px">${u("tip")}</h2><p>${u("tipt")}</p>
        ${LEITER.map((r,j)=>`<div class="lad t${r[0]}"><span class="n">${j+1}</span><div>${h(r[1])}${tl(r.slice(2))}</div><span class="badge">${h(TY[r[0]].n)}</span></div>`).join("")}`;
    }else if(S.ph===0){s=topBar()+`<div class="pcard"><h2>${u("wait")}</h2></div>`;
    }else if(S.ph===1){
      s=topBar()+`<h2>${u("ov")}</h2>${TY.map((_,i)=>ovCard(i,S.rev.includes(i))).join("")}`;
    }else if(S.ph===2){
      const i=nextCard(),n=cnt(me.a);
      if(fb){const c=CARDS[fb.i],ok=fb.c===c.k;
        s=topBar()+`<div class="pcard"><div class="pq">${h(quo(c.q))}${tl(c.t)}</div></div>
          <div class="fb ${ok?"ok":"bad"}"><b>${u(ok?"right":"wrong")}</b><div class="pov t${c.k}" style="margin:8px 0 0">${tname(c.k)}<div style="margin-top:6px">${h(TY[c.k].m)}${tl(TY[c.k].mt)}</div><div class="muted" style="margin-top:6px">Signal: ${h(c.s)}</div></div></div>
          <button class="pri" id="bFbNext" style="width:100%;padding:14px">${u("next")}</button>`;
      }else if(S.so&&i!==undefined){const c=CARDS[i];
        s=topBar()+`<div class="muted">${h(U.card[0])} ${n+1} / ${NC}</div><div class="pcard"><div class="pq">${h(quo(c.q))}${tl(c.t)}</div></div>
          <p><b>${u("which")}</b></p>${typeBtns(-1)}
          <div class="rowb"><button id="bTip">${u("tip")}</button><button id="bOv">${u("ovb")}</button></div>`;
      }else if(n===0){s=topBar()+`<div class="pcard"><h2>${u("soon")}</h2>${u("look")}</div><button id="bOv" style="width:100%">${u("ovb")}</button>`;
      }else{const wr=CARDS.map((c,j)=>({c,j})).filter(o=>me.a[o.j]!=="-"&&+me.a[o.j]!==o.c.k);
        s=topBar()+`<div class="pcard"><h2>${u(i===undefined?"done":"look")}</h2><div class="bigpts">${corrN()} / ${n} ${h(U.corr[0])}</div></div>
          ${wr.length?`<p><b>${u("again")}</b></p>${wr.map(o=>`<div class="pov t${o.c.k}"><b>${h(quo(o.c.q))}</b>${tl(o.c.t)}<div style="margin-top:4px">→ ${tname(o.c.k)}</div></div>`).join("")}`:""}
          <button id="bOv" style="width:100%">${u("ovb")}</button>`;}
    }else if(S.ph===3){
      const ty=m[2],wa=m[3],first=me.subs.length===0;
      const mineList=me.subs.length?`<p><b>${u("mine")}</b></p>${me.subs.map(q=>`<div class="pov t${q.ty}"><b>${h(quo(q.x))}</b><div class="muted">${h(TY[q.ty].n)}</div></div>`).join("")}`:"";
      if(ty<0||(!S.wo&&first)){s=topBar()+`<div class="pcard"><h2>${u("soon")}</h2>${u("look")}</div>`;
      }else if(!S.wo){s=topBar()+`<div class="pcard"><h2>${u("sent")}</h2>${u("look")}</div>${mineList}`;
      }else if(!form||me.subs.length>=3){
        s=topBar()+`<div class="fb ok"><b>${u("sent")}</b></div>${mineList}
          ${me.subs.length<3?`<button class="pri" id="bMore" style="width:100%;padding:14px">${u("more")}</button><div class="pcard">${u("pro")}</div>`:`<div class="pcard">${u("look")}</div>`}`;
      }else{const t=first?ty:wType;
        s=topBar()+`<h2>${u("wtitle")}</h2>`+(first?`<div class="pov t${ty}"><div class="lbl" style="margin-top:0">${u("wtype")}</div>${tname(ty)}<div style="margin-top:4px">${h(TY[ty].m)}${tl(TY[ty].mt)}</div></div>`
            :`<p><b>${u("choose")}</b></p>${typeBtns(wType)}`)
          +`<div class="pcard"><div class="lbl"><b>${u("wware")}</b></div><div class="pq" style="font-size:1.25rem">${h(WAREN[wa][0])}${tl(WAREN[wa].slice(1))}</div></div>`
          +(t>=0?`<details class="pcard"><summary><b>${u("whelp")}</b></summary><div style="margin-top:8px">${TY[t].st.map(x=>`<div>${h(quo(x))}</div>`).join("")}<div class="muted" style="margin-top:6px">${h(quo(TY[t].x))}${tl(TY[t].xt)}</div></div></details>`:"")
          +`<p>${u("wde")}</p><textarea id="txt" rows="3" maxlength="140" placeholder="…?"></textarea>
          ${warn?`<div class="fb bad">${u(warn)}${warn==="fits"&&t>=0?`<div style="margin-top:4px"><b>${h(TY[t].m)}</b>${tl(TY[t].mt)}</div>`:""}</div>`:""}
          <button class="pri" id="bSend" style="width:100%;padding:14px;margin-top:10px">${u(warn&&warn!=="short"?"send2":"send")}</button>
          <button id="bOv" style="width:100%;margin-top:8px">${u("ovb")}</button>${mineList}`;}
    }else if(S.ph===4){
      const v=S.v;
      if(!v)s=topBar()+`<div class="pcard"><h2>${u("look")}</h2></div>`;
      else{const q=`<div class="pcard"><div class="pq">${h(quo(v.x))}</div></div>`,sel=vSel[v.i];
        if(v.o){
          if(v.au===me.pid)s=topBar()+q+`<div class="fb ok">${u("own")}</div>`;
          else if(sel!==undefined)s=topBar()+q+`<div class="fb ok"><b>${u("asent")}</b><div style="margin-top:6px">${tname(sel)}</div></div>`;
          else s=topBar()+q+`<p><b>${u("which")}</b></p>${typeBtns(-1)}`;
        }else{const mineQ=v.au===me.pid,ok=sel===v.sol;
          s=topBar()+q+`<div class="fb ${mineQ||ok?"ok":"bad"}">${mineQ?"":`<b>${u(ok?"right":"wrong")}</b>`}<div class="pov t${v.sol}" style="margin:8px 0 0"><div class="lbl" style="margin-top:0">${u("sol")}</div>${tname(v.sol)}<div style="margin-top:6px">${h(TY[v.sol].m)}${tl(TY[v.sol].mt)}</div></div></div><p>${u("look")}</p>`;}}
    }else{
      const pos=S.rk?S.rk.indexOf(me.pid)+1:0;
      s=topBar()+`<div class="pcard" style="text-align:center"><h2>${u("res")}</h2><div class="bigpts">${m[0]} ${h(U.pts[0])}</div>${pos?`<div class="pq">${h(U.place[0])} ${pos}</div>`:""}</div>
        <div class="pcard" style="text-align:center"><div class="pq">${u("merk")}</div></div><button id="bOv" style="width:100%">${u("ovb")}</button>`;}
    P.innerHTML=s;
    const on=(id,f)=>{const e=$(id);if(e)e.onclick=f;};
    P.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{const keep=$("nick")?$("nick").value:"";lang=me.lang=b.dataset.lang;saveMe();render(true);if($("nick"))$("nick").value=keep;});
    const sl=$("selLang");if(sl)sl.onchange=()=>{const tx=$("txt");if(tx)draft=tx.value;lang=me.lang=sl.value;saveMe();render(true);};
    const join=()=>{const n=clean($("nick").value,16);if(!n){$("nick").focus();return;}me.n=n;saveMe();send({k:"hi",n});render(true);};
    on("bGo",join);if($("nick"))$("nick").onkeydown=e=>{if(e.key==="Enter")join();};
    on("bBack",()=>{view=null;render(true);window.scrollTo(0,0);});
    on("bOv",()=>{const tx=$("txt");if(tx)draft=tx.value;view="ov";render(true);window.scrollTo(0,0);});
    on("bTip",()=>{view="tip";render(true);window.scrollTo(0,0);});
    on("bFbNext",()=>{fb=null;render(true);window.scrollTo(0,0);});
    on("bMore",()=>{form=true;wType=-1;warn="";draft="";render(true);});
    const tx=$("txt");if(tx){tx.value=draft;tx.oninput=()=>{draft=tx.value;};}
    P.querySelectorAll("[data-ty]").forEach(b=>b.onclick=()=>{const c=+b.dataset.ty;
      if(S.ph===2&&S.so&&!fb){const i=nextCard();if(i===undefined)return;
        const a=me.a.split("");a[i]=String(c);me.a=a.join("");saveMe();fb={i,c};const need=cnt(me.a);
        pending={msg:{k:"s",a:me.a},done:()=>!S||!S.so||!my()||my()[1]>=need};send(pending.msg);render(true);window.scrollTo(0,0);}
      else if(S.ph===3){if(tx)draft=tx.value;wType=c;warn="";render(true);}
      else if(S.ph===4&&S.v&&S.v.o&&S.v.au!==me.pid&&vSel[S.v.i]===undefined){const q=S.v.i;vSel[q]=c;
        pending={msg:{k:"v",q,c},done:()=>!S||!S.v||S.v.i!==q||!S.v.o||(S.v.an||[]).includes(me.pid)};send(pending.msg);render(true);}});
    on("bSend",()=>{const first=me.subs.length===0,ty=first?my()[2]:wType;
      let x=clean(tx.value,140).replace(/^[„“"”»«]+|[„“"”»«]+$/g,"").trim();draft=tx.value;
      if(ty<0){warn="";wType=-1;const el=P.querySelector(".tbtn");if(el)el.scrollIntoView({block:"center"});return;}
      if(x.length<8){warn="short";render(true);return;}
      const w=softCheck(ty,x);
      if(w&&warnFor!==ty+x){warn=w;warnFor=ty+x;render(true);return;}
      const id=rnd(6),need=me.subs.length+1;me.subs.push({id,ty,x});saveMe();warn="";warnFor="";draft="";form=false;
      pending={msg:{k:"w",id,ty,x},done:()=>!S||!S.wo||!my()||my()[4]>=need};send(pending.msg);render(true);window.scrollTo(0,0);});
  }
  render(true);
}
if(roomCode)phoneApp();else tafelApp();
</script>
