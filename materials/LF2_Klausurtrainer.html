<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klausurtrainer LF 2 – Verkaufsgespräche kundenorientiert führen</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#1c2433;--mut:#5d6b82;--line:#dce2ee;--pri:#2457c5;--priink:#fff;--g:#14894c;--gbg:#e0f4e9;--y:#9a6a00;--ybg:#fff1cc;--r:#c9302c;--rbg:#fde4e3;--free:#eceff5}
@media(prefers-color-scheme:dark){:root{--bg:#0f131b;--card:#192030;--ink:#e8ecf5;--mut:#9aa7bf;--line:#2b3548;--pri:#6c97f0;--priink:#0b1020;--g:#4cd08a;--gbg:#113423;--y:#f0b93a;--ybg:#3a2f0e;--r:#ff7b78;--rbg:#451a1b;--free:#222a3a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
.hwrap,main{max-width:760px;margin:auto}
h1{font-size:19px;margin:0}.sub{color:var(--mut);font-size:13px}
.back{font-size:13px;color:var(--pri);text-decoration:none}
main{padding:12px 16px 110px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
button,.btn{font:inherit;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:hover,.btn:hover{border-color:var(--pri)}
button.pri{background:var(--pri);color:var(--priink);border-color:var(--pri)}
button:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.chips button.on{background:var(--pri);color:var(--priink);border-color:var(--pri)}
.prog{position:sticky;top:0;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.prog .row{display:flex;justify-content:space-between;gap:8px;align-items:baseline;font-weight:700}
.bar{height:16px;border-radius:99px;background:var(--free);overflow:hidden;margin:8px 0 4px;position:relative}
.bar i{position:absolute;inset-block:0;inset-inline-start:0;display:block;border-radius:99px;transition:width .5s}
.bar .att{background:var(--ybg);border:1px solid #e0a400}.bar .ok{background:var(--g)}
.lvl{font-size:13px;color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.tabs button{flex:0 0 auto;flex-direction:column;gap:0;min-width:74px;padding:6px 8px;font-size:13px}
.tabs button .ic{font-size:22px;line-height:1.2}
.tabs button.on{background:var(--pri);color:var(--priink);border-color:var(--pri)}
.tabs small{opacity:.85}
.ph{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.ph .big{font-size:38px;line-height:1.1;text-align:center}
.ph h3{margin:0;font-size:17px}.ph .nm{color:var(--mut);font-size:14px}
.ph ul{margin:6px 0;padding:0;list-style:none}.ph li{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.bubble{background:var(--free);border-radius:12px;padding:8px 12px;margin-top:6px;font-style:italic}
.nr{display:inline-block;background:var(--pri);color:var(--priink);border-radius:99px;min-width:22px;padding:0 7px;font-size:13px;font-weight:700;text-align:center}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--free);color:var(--mut);margin-inline-start:6px}
.term{border-bottom:2px dotted var(--pri);position:relative;cursor:help}
.tip{display:none;position:absolute;z-index:30;top:calc(100% + 4px);left:0;width:min(250px,80vw);background:#1c2433;color:#fff;border-radius:10px;padding:8px 10px;font-size:14px;font-style:normal;font-weight:400;line-height:1.35;box-shadow:0 4px 18px #0006}
.term:hover>.tip,.term:focus>.tip,.term.open>.tip{display:block}
.tip div+div{margin-top:4px;border-top:1px solid #fff3;padding-top:4px}
.de{unicode-bidi:isolate}
.alt{color:var(--mut);font-size:14px}
.qh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tl{display:inline-flex;gap:4px}.tl button{min-height:36px;padding:3px 9px;font-size:14px}.tl button.on{background:var(--pri);color:var(--priink);border-color:var(--pri)}
.q{font-size:18px;font-weight:700;margin:4px 0 10px}
.opt{display:block;width:100%;text-align:start;margin:8px 0;justify-content:flex-start;padding:10px 12px;line-height:1.35}
.opt.ok{background:var(--gbg);border-color:var(--g)}.opt.bad{background:var(--rbg);border-color:var(--r)}
.fb{border-radius:10px;padding:8px 12px;margin-top:8px}.fb.ok{background:var(--gbg)}.fb.bad{background:var(--rbg)}
.fc{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;cursor:pointer;padding:18px}
.fc .e{font-size:56px;line-height:1.1}.fc .t{font-size:22px;font-weight:700}
.gap{display:inline-block;min-width:90px;border-bottom:3px solid var(--pri);text-align:center;font-weight:700}
.gap.ok{color:var(--g)}.gap.bad{color:var(--r)}
.ordgrid{display:flex;flex-wrap:wrap;gap:8px}
.ordgrid button{flex-direction:column;min-width:96px;padding:8px}
.ordgrid .e{font-size:28px}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.slot{border:2px dashed var(--line);border-radius:10px;min-width:44px;min-height:44px;padding:2px 8px;display:flex;align-items:center;gap:4px;font-size:14px}
.slot.f{border-style:solid;border-color:var(--g);background:var(--gbg)}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fab{position:fixed;inset-block-end:16px;inset-inline-end:16px;z-index:40}
.fab>button{border-radius:99px;box-shadow:0 3px 14px #0005;background:var(--pri);color:var(--priink);border-color:var(--pri);min-height:52px;padding:8px 16px;font-weight:700}
.fab .menu{position:absolute;inset-block-end:60px;inset-inline-end:0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 6px 24px #0005;display:none;min-width:190px}
.fab .menu.on{display:block}
.fab .menu button{width:100%;justify-content:flex-start;margin:2px 0}
.fab .menu button.on{background:var(--pri);color:var(--priink)}
.center{text-align:center}
.hint{font-size:13px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="hwrap">
<a class="back" href="../index.html" id="back">⬅ 🗓️</a>
<h1 id="ttl"></h1><div class="sub" id="sub"></div>
</div></header>
<main id="app"></main>
<div class="fab" id="fab"></div>
<script src="LF2_Klausurtrainer_Daten.js" charset="utf-8"></script>
<script>
'use strict';
const T=(de,vi,ar)=>({de,vi,ar});
if(!window.KV_DATA){document.getElementById('app').innerHTML='<div class="card">⚠️ LF2_Klausurtrainer_Daten.js fehlt (muss im selben Ordner liegen wie diese Datei).</div>';throw new Error('KV_DATA fehlt');}
let {PH,TERMS,HV,MC,LK}=window.KV_DATA;
/* Übungen, die die Lehrkraft im Dashboard ausgeblendet hat (?x=mc3,lk2,fc7) */
const OFF=new Set((new URLSearchParams(location.search).get('x')||'').split(',').filter(Boolean));
TERMS=TERMS.filter(x=>!OFF.has('fc'+x.i));MC=MC.filter(x=>!OFF.has('mc'+x.i));LK=LK.filter(x=>!OFF.has('lk'+x.i));

/* ===== OBERFLÄCHE in drei Sprachen ===== */
const UI={
 title:T('Klausurtrainer LF 2','Luyện thi LF 2','التدريب على امتحان LF 2'),
 sub:T('Verkaufsgespräche kundenorientiert führen','Thực hiện cuộc trò chuyện bán hàng theo hướng khách hàng','إجراء حوارات البيع بما يلائم الزبون'),
 back:T('Zum Stundenplan','Về thời khóa biểu','إلى الجدول الدراسي'),
 sAll:T('Alles','Tất cả','الكل'),s1:T('Klausur 1','Bài kiểm tra 1','الامتحان 1'),s2:T('Klausur 2','Bài kiểm tra 2','الامتحان 2'),
 tphasen:T('Phasen','Các giai đoạn','المراحل'),tkarten:T('Lernkarten','Thẻ học','بطاقات'),tquiz:T('Quiz','Trắc nghiệm','اختبار'),tluecke:T('Lücken','Điền chỗ trống','الفراغات'),treihe:T('Reihenfolge','Thứ tự','الترتيب'),
 prog:T('Klausurtraining zu {p} % gelernt','Đã học {p} % bài luyện thi','تم تعلّم {p}% من التدريب'),
 progquiz:T('Quiz zu {p} % gelernt','Đã học {p} % phần trắc nghiệm','تم تعلّم {p}% من الاختبار'),
 progkarten:T('Lernkarten zu {p} % gewusst','Biết {p} % số thẻ học','تم إتقان {p}% من البطاقات'),
 progluecke:T('Lücken zu {p} % gelernt','Đã học {p} % phần điền chỗ trống','تم تعلّم {p}% من الفراغات'),
 progreihe:T('Reihenfolge: {p} %','Thứ tự: {p} %','الترتيب: {p}%'),
 barnote:T('bearbeitet {a} % · richtig {p} %','đã làm {a} % · đúng {p} %','تمت المعالجة {a}% · صحيح {p}%'),
 hover:T('Tipp: Tippe auf unterstrichene Wörter (am PC: Maus darüberfahren) – dann siehst du die Übersetzung.','Mẹo: Chạm vào từ có gạch chân (trên máy tính: rê chuột lên) để xem bản dịch.','نصيحة: المس الكلمات المسطّرة (على الحاسوب: مرّر الفأرة فوقها) لترى الترجمة.'),
 flip:T('Tippe auf die Karte zum Umdrehen','Chạm vào thẻ để lật','المس البطاقة لقلبها'),
 know:T('Gewusst','Đã biết','عرفتها'),again:T('Nochmal','Học lại','مرة أخرى'),next:T('Weiter','Tiếp theo','التالي'),
 ok:T('Richtig!','Đúng rồi!','صحيح!'),bad:T('Leider falsch.','Rất tiếc, sai rồi.','للأسف، خطأ.'),right:T('Richtig ist:','Đáp án đúng:','الجواب الصحيح:'),
 qof:T('Frage {i} von {n}','Câu {i}/{n}','السؤال {i} من {n}'),cof:T('Karte {i} von {n}','Thẻ {i}/{n}','البطاقة {i} من {n}'),
 done:T('Geschafft!','Hoàn thành!','أحسنت!'),result:T('Du hast {o} von {n} richtig.','Bạn đúng {o}/{n} câu.','لديك {o} إجابات صحيحة من {n}.'),
 restart:T('Nochmal von vorn','Làm lại từ đầu','من البداية'),reset:T('Fortschritt löschen','Xóa tiến độ','مسح التقدم'),
 resetq:T('Fortschritt auf diesem Gerät wirklich löschen?','Bạn có chắc muốn xóa tiến độ trên thiết bị này?','هل تريد حقًّا مسح التقدم على هذا الجهاز؟'),
 ohint:T('Tippe die Phasen in der richtigen Reihenfolge an: 1, 2, 3 …','Chạm vào các giai đoạn theo đúng thứ tự: 1, 2, 3 …','المس المراحل بالترتيب الصحيح: 1، 2، 3 …'),
 oerr:T('Noch nicht – versuch es weiter!','Chưa đúng – thử tiếp nhé!','ليس بعد – حاول مرة أخرى!'),
 odone:T('Alle Phasen in der richtigen Reihenfolge!','Tất cả các giai đoạn đúng thứ tự!','كل المراحل بالترتيب الصحيح!'),
 errs:T('Fehlversuche: {n}','Số lần thử sai: {n}','محاولات خاطئة: {n}'),
 example:T('Beispielsatz','Câu ví dụ','جملة مثال'),langl:T('Sprache','Ngôn ngữ','اللغة'),
 alldone:T('🎉 Alles geschafft – viel Erfolg bei der Klausur!','🎉 Hoàn thành tất cả – chúc bạn làm bài tốt!','🎉 أنجزت كل شيء – بالتوفيق في الامتحان!'),
 fill:T('Wähle das passende Wort:','Chọn từ phù hợp:','اختر الكلمة المناسبة:'),
 lv0:T('Startklar','Bắt đầu','البداية'),lv1:T('Auf dem Weg','Đang tiến bộ','في الطريق'),lv2:T('Fast Profi','Gần thành thạo','شبه محترف'),lv3:T('Experte','Chuyên gia','خبير'),lv4:T('Klausur-Profi','Cao thủ làm bài','محترف الامتحان'),
 none:T('Keine Aufgaben in dieser Auswahl.','Không có bài tập trong phần này.','لا توجد مهام في هذا الاختيار.')
};
const LV=['🌱','⭐','🚀','🏆','🎉'];
const LANGS=['de','vi','ar'];
const FLAG={de:'🇩🇪',vi:'🇻🇳',ar:'🌐'};
const LNAME={de:'Deutsch',vi:'Tiếng Việt',ar:'العربية'};
const SHORT={de:'DE',vi:'VI',ar:'ع'};

/* ===== Speicher (LocalStorage, mit Rückfall auf Arbeitsspeicher) ===== */
const KEY='lf2_trainer_v1',LKEY='ds_lang',mem={};
const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return mem[k]||null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){mem[k]=v;}};
let P={done:{}};
try{const j=JSON.parse(lsGet(KEY)||'{}');if(j&&typeof j==='object'&&j.done)P=j;}catch(e){}

/* ===== Aufruf-Parameter: ?k=1|2  &lang=vi|ar  &f=karten,quiz,luecke,reihe ===== */
const Q=new URLSearchParams(location.search);
let lang=LANGS.includes(Q.get('lang'))?Q.get('lang'):(lsGet(LKEY)||'de');if(!LANGS.includes(lang))lang='de';
const FALL=['karten','quiz','luecke','reihe'];
let F=(Q.get('f')||'').split(',').filter(x=>FALL.includes(x));if(!F.length)F=FALL.slice();
const K0=['1','2'].includes(Q.get('k'))?+Q.get('k'):0;

/* ===== Hilfen ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=(k,v)=>{let s=UI[k][lang]||UI[k].de;if(v)Object.keys(v).forEach(x=>{s=s.replace('{'+x+'}',v[x]);});return s;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const RE=new RegExp('('+HV.map(x=>x[0]).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[-]/g,'\\-')).join('|')+')[A-Za-zÄÖÜäöüß]*','g');
function mark(s){return esc(s).replace(RE,(m,stem)=>{const h=HV.find(x=>x[0]===stem);return `<span class="term" tabindex="0">${m}<span class="tip" role="tooltip"><div dir="ltr" lang="vi">🇻🇳 ${esc(h[1])}</div><div dir="rtl" lang="ar">ع ${esc(h[2])}</div></span></span>`;});}
const D=(s,m)=>`<span class="de" dir="ltr" lang="de">${m?mark(s):esc(s)}</span>`;
const X=(tx,l,m)=>l==='de'?D(tx.de,m):`<span lang="${l}" dir="${l==='ar'?'rtl':'ltr'}">${esc(tx[l])}</span>`;
/* Text in der gewählten Sprache; bei vi/ar steht der deutsche Originaltext (mit Hover-Übersetzung) darunter */
const two=(tx,l,m)=>l==='de'?D(tx.de,m):`${X(tx,l)}<div class="alt">${D(tx.de,m)}</div>`;

/* ===== Zustand ===== */
const S={tab:'phasen',scope:K0,fc:{i:null,flip:false},qz:{i:null,pick:null},lk:{i:null,pick:null},or:null,menu:false,ql:{},perm:{}};
const inScope=(it,sc)=>{sc=sc==null?S.scope:sc;return sc===0||it.k===0||it.k===sc;};
function idsFor(sc,fm){const o=[];
 if(fm.includes('karten'))TERMS.filter(x=>inScope(x,sc)).forEach(x=>o.push('fc'+x.i));
 if(fm.includes('quiz'))MC.filter(x=>inScope(x,sc)).forEach(x=>o.push('mc'+x.i));
 if(fm.includes('luecke'))LK.filter(x=>inScope(x,sc)).forEach(x=>o.push('lk'+x.i));
 if(fm.includes('reihe'))o.push('or');return o;}
function statOf(ids){let a=0,o=0;ids.forEach(k=>{const d=P.done[k];if(d){a++;if(d.ok)o++;}});const n=ids.length||1;return {n:ids.length,a,o,pa:Math.round(a/n*100),po:Math.round(o/n*100)};}
function saveP(){P.sum={};[0,1,2].forEach(sc=>{P.sum[sc]=statOf(idsFor(sc,FALL));});P.t=Date.now();lsSet(KEY,JSON.stringify(P));}
function mark1(key,ok){const d=P.done[key]||{a:1,ok:0};d.a=1;if(ok)d.ok=1;P.done[key]=d;saveP();}
const permOf=(key,n)=>S.perm[key]||(S.perm[key]=shuffle([...Array(n).keys()]));
const qlOf=key=>S.ql[key]||lang;
const firstOpen=(arr,pre)=>{const i=arr.findIndex(x=>!P.done[pre+x.i]);return i<0?arr.length:i;};

/* ===== Bausteine ===== */
function tlBtns(key){const cur=qlOf(key);return `<div class="tl" role="group" aria-label="${esc(t('langl'))}">${LANGS.map(l=>`<button data-a="ql" data-key="${key}" data-l="${l}" class="${cur===l?'on':''}" title="${LNAME[l]}">${FLAG[l]==='🌐'?'':FLAG[l]+' '}${SHORT[l]}</button>`).join('')}</div>`;}
function bars(st,label){return `<div class="bar" role="progressbar" aria-valuenow="${st.po}" aria-valuemin="0" aria-valuemax="100"><i class="att" style="width:${st.pa}%"></i><i class="ok" style="width:${st.po}%"></i></div>`;}
function miniBar(fmt,ids){const st=statOf(ids);return `<div class="card"><div class="row" style="font-weight:700">${esc(t('prog'+fmt,{p:st.po}))}</div>${bars(st)}<div class="hint">${esc(t('barnote',{a:st.pa,p:st.po}))}</div></div>`;}
function levelOf(po){return po>=100?4:po>=75?3:po>=50?2:po>=25?1:0;}

/* ===== Ansichten ===== */
function viewPhasen(){
 const L=PH.filter(p=>inScope(p));
 return `<div class="hint" style="margin-bottom:8px">💬 ${esc(t('hover'))}</div>`+L.map(p=>`<div class="card"><div class="ph"><div class="big">${p.ic}</div><div>
 <h3><span class="nr">${p.id}</span> ${D(p.n.de,true)}<span class="tag">${p.k===1?esc(UI.s1[lang]):esc(UI.s2[lang])}</span></h3>
 ${lang==='de'?'':`<div class="nm">${X(p.n,lang)}</div>`}
 <ul>${p.pts.map(x=>`<li><span>${x[0]}</span><span>${two(x[1],lang,true)}</span></li>`).join('')}</ul>
 <div class="hint">${esc(t('example'))}</div><div class="bubble">💬 ${two(p.ex,lang,true)}</div></div></div></div>`).join('');
}
function viewKarten(){
 const L=TERMS.filter(x=>inScope(x));if(!L.length)return `<div class="card">${esc(t('none'))}</div>`;
 const mb=miniBar('karten',L.map(x=>'fc'+x.i));
 if(S.fc.i==null)S.fc.i=firstOpen(L,'fc');
 if(S.fc.i>=L.length){const st=statOf(L.map(x=>'fc'+x.i));return mb+`<div class="card center"><div style="font-size:48px">🎉</div><h2>${esc(t('done'))}</h2><p>${esc(t('result',{o:st.o,n:st.n}))}</p><button class="pri" data-a="fcrestart">${esc(t('restart'))}</button></div>`;}
 const it=L[S.fc.i],key='fc'+it.i,l=qlOf(key);
 const front=`<div class="e">${it.ic}</div><div class="t">${two(it.t,l,false)}</div><div class="hint">${esc(t('flip'))}</div>`;
 const back=`<div class="e">${it.ic}</div><div class="t">${D(it.t.de)}</div><div style="font-size:17px">${two(it.d,l,true)}</div>`;
 return mb+`<div class="qh"><span class="hint">${esc(t('cof',{i:S.fc.i+1,n:L.length}))}</span>${tlBtns(key)}</div>
 <div class="card fc" data-a="flip" tabindex="0" role="button">${S.fc.flip?back:front}</div>
 ${S.fc.flip?`<div class="chips" style="justify-content:center"><button class="pri" data-a="fcknow">✅ ${esc(t('know'))}</button><button data-a="fcagain">🔁 ${esc(t('again'))}</button></div>`:''}`;
}
function viewQuiz(){
 const L=MC.filter(x=>inScope(x));if(!L.length)return `<div class="card">${esc(t('none'))}</div>`;
 const mb=miniBar('quiz',L.map(x=>'mc'+x.i));
 if(S.qz.i==null)S.qz.i=firstOpen(L,'mc');
 if(S.qz.i>=L.length){const st=statOf(L.map(x=>'mc'+x.i));return mb+`<div class="card center"><div style="font-size:48px">${st.po>=70?'🎉':'💪'}</div><h2>${esc(t('done'))}</h2><p>${esc(t('result',{o:st.o,n:st.n}))}</p><button class="pri" data-a="qzrestart">${esc(t('restart'))}</button></div>`;}
 const it=L[S.qz.i],key='mc'+it.i,l=qlOf(key),pm=permOf(key,it.o.length),pk=S.qz.pick;
 const opts=pm.map((ri,n)=>{let c='opt';if(pk!=null){if(ri===it.r)c+=' ok';else if(n===pk)c+=' bad';}
  return `<button class="${c}" data-a="qpick" data-n="${n}" ${pk!=null?'disabled':''}>${two(it.o[ri],l,true)}</button>`;}).join('');
 let fb='';if(pk!=null){const good=pm[pk]===it.r;fb=`<div class="fb ${good?'ok':'bad'}"><b>${good?'✅ '+esc(t('ok')):'❌ '+esc(t('bad'))}</b>${good?'':`<div>${esc(t('right'))} ${D(it.o[it.r].de,true)}</div>`}<div style="margin-top:4px">${two(it.e,l,true)}</div></div><div class="chips"><button class="pri" data-a="qnext">${esc(t('next'))} ▶</button></div>`;}
 return mb+`<div class="card"><div class="qh"><span class="hint">${it.ic} ${esc(t('qof',{i:S.qz.i+1,n:L.length}))}</span>${tlBtns(key)}</div><div class="q">${two(it.q,l,true)}</div>${opts}${fb}</div>`;
}
function viewLuecke(){
 const L=LK.filter(x=>inScope(x));if(!L.length)return `<div class="card">${esc(t('none'))}</div>`;
 const mb=miniBar('luecke',L.map(x=>'lk'+x.i));
 if(S.lk.i==null)S.lk.i=firstOpen(L,'lk');
 if(S.lk.i>=L.length){const st=statOf(L.map(x=>'lk'+x.i));return mb+`<div class="card center"><div style="font-size:48px">${st.po>=70?'🎉':'💪'}</div><h2>${esc(t('done'))}</h2><p>${esc(t('result',{o:st.o,n:st.n}))}</p><button class="pri" data-a="lkrestart">${esc(t('restart'))}</button></div>`;}
 const it=L[S.lk.i],key='lk'+it.i,l=qlOf(key),pm=permOf(key,it.w.length),pk=S.lk.pick;
 const good=pk!=null&&pm[pk]===it.r;
 const parts=it.s.de.split('___');
 const filled=pk!=null?`<span class="gap ${good?'ok':'bad'}">${esc(it.w[pm[pk]].de)}</span>`:`<span class="gap">&nbsp;&nbsp;?&nbsp;&nbsp;</span>`;
 const sent=`<span class="de" dir="ltr" lang="de">${mark(parts[0])}${filled}${mark(parts[1]||'')}</span>`;
 const trans=l==='de'?'':`<div class="alt" style="margin-bottom:6px">${X(it.s,l)}</div>`;
 const chips=pm.map((ri,n)=>{let c='opt';if(pk!=null){if(ri===it.r)c+=' ok';else if(n===pk)c+=' bad';}
  return `<button class="${c}" data-a="lkpick" data-n="${n}" ${pk!=null?'disabled':''}><b>${D(it.w[ri].de)}</b>${l==='de'?'':`<span class="alt"> · ${X(it.w[ri],l)}</span>`}</button>`;}).join('');
 let fb='';if(pk!=null)fb=`<div class="fb ${good?'ok':'bad'}"><b>${good?'✅ '+esc(t('ok')):'❌ '+esc(t('bad'))}</b>${good?'':`<div>${esc(t('right'))} ${D(it.w[it.r].de)}</div>`}</div><div class="chips"><button class="pri" data-a="lknext">${esc(t('next'))} ▶</button></div>`;
 return mb+`<div class="card"><div class="qh"><span class="hint">${it.ic} ${esc(t('qof',{i:S.lk.i+1,n:L.length}))}</span>${tlBtns(key)}</div>${trans}<div class="q">${sent}</div><div class="hint">${esc(t('fill'))}</div>${chips}${fb}</div>`;
}
function viewReihe(){
 if(!S.or)S.or={pool:shuffle(PH.map(p=>p.id)),placed:[],err:0,fin:false,shake:false};
 const o=S.or,mb=miniBar('reihe',['or']);
 const slots=PH.map((p,i)=>{const f=i<o.placed.length;return `<div class="slot ${f?'f':''}"><span class="nr">${i+1}</span>${f?`<span>${p.ic}</span><span class="de" dir="ltr">${esc(p.n.de)}</span>`:''}</div>`;}).join('');
 const pool=o.pool.filter(id=>!o.placed.includes(id)).map(id=>{const p=PH.find(x=>x.id===id);return `<button data-a="opick" data-id="${id}"><span class="e">${p.ic}</span><b>${D(p.n.de,true)}</b>${lang==='de'?'':`<span class="alt">${X(p.n,lang)}</span>`}</button>`;}).join('');
 let msg='';if(o.fin)msg=`<div class="fb ok"><b>🎉 ${esc(t('odone'))}</b><div>${esc(t('errs',{n:o.err}))}</div></div><div class="chips"><button class="pri" data-a="orestart">${esc(t('restart'))}</button></div>`;
 else if(o.shake)msg=`<div class="fb bad">${esc(t('oerr'))}</div>`;
 return mb+`<div class="card ${o.shake?'shake':''}"><div class="hint" style="margin-bottom:8px">${esc(t('ohint'))}</div><div class="slots">${slots}</div><div class="ordgrid">${pool}</div>${msg}</div>`;
}

/* ===== Gesamtansicht ===== */
function render(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.title='📝 '+UI.title.de+' – '+UI.sub.de;
 $('ttl').textContent='📝 '+t('title');$('sub').textContent=t('sub');$('back').textContent='⬅ 🗓️ '+t('back');
 const ids=idsFor(S.scope,F),st=statOf(ids),lv=levelOf(st.po);
 const scopes=[[0,'sAll'],[1,'s1'],[2,'s2']];
 const TABS=[['phasen','🗺️'],['karten','🃏'],['quiz','❓'],['luecke','✏️'],['reihe','🔢']].filter(x=>x[0]==='phasen'||F.includes(x[0]));
 if(!TABS.some(x=>x[0]===S.tab))S.tab=TABS[0][0];
 const body=S.tab==='phasen'?viewPhasen():S.tab==='karten'?viewKarten():S.tab==='quiz'?viewQuiz():S.tab==='luecke'?viewLuecke():viewReihe();
 $('app').innerHTML=`<div class="chips" style="margin-top:0">${scopes.map(s=>`<button data-a="scope" data-v="${s[0]}" class="${S.scope===s[0]?'on':''}">${esc(UI[s[1]][lang])}</button>`).join('')}</div>
 <div class="prog"><div class="row"><span>${LV[lv]} ${esc(t('prog',{p:st.po}))}</span><span class="lvl">${esc(UI['lv'+lv][lang])}</span></div>${bars(st)}<div class="hint">${esc(t('barnote',{a:st.pa,p:st.po}))}</div>${st.po>=100?`<div class="fb ok" style="margin-top:6px">${esc(t('alldone'))}</div>`:''}</div>
 <div class="tabs">${TABS.map(x=>`<button data-a="tab" data-v="${x[0]}" class="${S.tab===x[0]?'on':''}"><span class="ic">${x[1]}</span><small>${esc(UI['t'+x[0]][lang])}</small></button>`).join('')}</div>
 ${body}
 <div class="center" style="margin-top:20px"><button data-a="reset">🗑️ ${esc(t('reset'))}</button></div>`;
 $('fab').innerHTML=`<div class="menu ${S.menu?'on':''}" role="menu">${LANGS.map(l=>`<button role="menuitem" data-a="lang" data-v="${l}" class="${lang===l?'on':''}"><span style="font-size:20px">${FLAG[l]}</span> ${LNAME[l]}</button>`).join('')}</div>
 <button data-a="menu" aria-haspopup="true" aria-expanded="${S.menu}" aria-label="${esc(t('langl'))}">${FLAG[lang]} ${SHORT[lang]} ▾</button>`;
}

/* ===== Ereignisse ===== */
document.addEventListener('click',e=>{
 const term=e.target.closest('.term');
 document.querySelectorAll('.term.open').forEach(x=>{if(x!==term)x.classList.remove('open');});
 if(term){term.classList.toggle('open');placeTip(term);}
 if(!e.target.closest('#fab')&&S.menu){S.menu=false;render();}
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a;
 const LQ=MC.filter(x=>inScope(x)),LL=LK.filter(x=>inScope(x)),LT=TERMS.filter(x=>inScope(x));
 switch(a){
  case 'menu':S.menu=!S.menu;render();break;
  case 'lang':lang=b.dataset.v;lsSet(LKEY,lang);S.ql={};S.menu=false;render();break;
  case 'ql':S.ql[b.dataset.key]=b.dataset.l;render();break;
  case 'scope':S.scope=+b.dataset.v;S.fc.i=S.qz.i=S.lk.i=null;S.fc.flip=false;S.qz.pick=S.lk.pick=null;render();break;
  case 'tab':S.tab=b.dataset.v;render();break;
  case 'flip':S.fc.flip=!S.fc.flip;render();break;
  case 'fcknow':{const it=LT[S.fc.i];if(it){mark1('fc'+it.i,true);}S.fc.i++;S.fc.flip=false;render();break;}
  case 'fcagain':{const it=LT[S.fc.i];if(it)mark1('fc'+it.i,false);S.fc.i++;S.fc.flip=false;render();break;}
  case 'fcrestart':S.fc.i=0;S.fc.flip=false;render();break;
  case 'qpick':{const it=LQ[S.qz.i];if(!it||S.qz.pick!=null)break;const n=+b.dataset.n;S.qz.pick=n;mark1('mc'+it.i,permOf('mc'+it.i,it.o.length)[n]===it.r);render();break;}
  case 'qnext':S.qz.i++;S.qz.pick=null;render();window.scrollTo({top:0});break;
  case 'qzrestart':S.qz.i=0;S.qz.pick=null;render();break;
  case 'lkpick':{const it=LL[S.lk.i];if(!it||S.lk.pick!=null)break;const n=+b.dataset.n;S.lk.pick=n;mark1('lk'+it.i,permOf('lk'+it.i,it.w.length)[n]===it.r);render();break;}
  case 'lknext':S.lk.i++;S.lk.pick=null;render();window.scrollTo({top:0});break;
  case 'lkrestart':S.lk.i=0;S.lk.pick=null;render();break;
  case 'opick':{const o=S.or,id=+b.dataset.id;if(o.fin)break;if(id===o.placed.length+1){o.placed.push(id);o.shake=false;if(o.placed.length===PH.length){o.fin=true;mark1('or',o.err===0);}}else{o.err++;o.shake=true;}render();break;}
  case 'orestart':S.or=null;render();break;
  case 'reset':if(confirm(t('resetq'))){P={done:{}};saveP();S.fc.i=S.qz.i=S.lk.i=null;S.qz.pick=S.lk.pick=null;S.or=null;render();}break;
 }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.a==='flip'){e.preventDefault();e.target.click();}});
function placeTip(term){const tip=term.querySelector('.tip');if(!tip)return;tip.style.left='0';tip.style.right='auto';
 requestAnimationFrame(()=>{const r=tip.getBoundingClientRect(),w=document.documentElement.clientWidth;
  if(r.right>w-8)tip.style.left=(-(r.right-w+8))+'px';
  const r2=tip.getBoundingClientRect();if(r2.left<8)tip.style.left=(parseFloat(tip.style.left||0)+(8-r2.left))+'px';});}
document.addEventListener('mouseover',e=>{const term=e.target.closest&&e.target.closest('.term');if(term)placeTip(term);});
document.addEventListener('focusin',e=>{const term=e.target.closest&&e.target.closest('.term');if(term)placeTip(term);});

if(!P.sum)saveP();
render();
</script>
</body>
</html>
