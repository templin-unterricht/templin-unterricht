ታት ቦታኡ ከጽብብ ይኽእል።", "Специализированный магазин в пешеходной зоне теряет клиентов из-за онлайн-торговли и торгового центра на окраине. Придумайте две идеи, как компенсировать недостатки местоположения.", "Una tienda especializada en la zona peatonal pierde clientes frente al comercio online y un centro comercial de las afueras. Desarrollad dos ideas para compensar las desventajas de su ubicación.", "Uma loja especializada na zona pedonal perde clientes para o comércio online e para um centro comercial nos arredores. Desenvolvam duas ideias para compensar as desvantagens da localização."], "Zum Beispiel: Click & Collect und einen Lieferservice anbieten; Parkgebühren erstatten oder Parkchips ausgeben; Beratung, Service und Events als Stärke betonen, die es online nicht gibt; gemeinsame Aktionen mit anderen Händlern der Innenstadt (z. B. verkaufsoffener Sonntag, gemeinsame Werbung).": ["ንኣብነት፦ Click & Collect (ኦንላይን ኣዘዝ፣ ኣብ ድኳን ተቐበል) ከምኡ ድማ ኣገልግሎት ኣቕርቦት ምሃብ፤ ክፍሊት መዕቆቢ መኪና ምምላስ ወይ ቶከን መዕቆቢ ምሃብ፤ ምኽሪ፣ ኣገልግሎትን ፍጻሜታትን ከም ሓይሊ ምጉላሕ ኣብ ኦንላይን ዘየለ፤ ሓባራዊ ፕሮሞሽን ምስ ካልኦት ነጋዶ ከተማ (ንኣብነት ዓርቢ ዝኽፈት ሰንበት፣ ሓባራዊ ወጀ)።", "Например: предлагать Click & Collect и службу доставки; возмещать плату за парковку или выдавать парковочные жетоны; подчёркивать консультации, сервис и события как сильную сторону, которой нет онлайн; совместные акции с другими торговцами центра (напр. торговое воскресенье, общая реклама).", "Por ejemplo: ofrecer Click & Collect y servicio de reparto; reembolsar el aparcamiento o dar fichas de parking; destacar asesoramiento, servicio y eventos como punto fuerte que no existe online; acciones conjuntas con otros comerciantes del centro (p. ej. domingo comercial, publicidad común).", "Por exemplo: oferecer Click & Collect e serviço de entrega; reembolsar o estacionamento ou dar fichas de parque; destacar aconselhamento, serviço e eventos como ponto forte que não existe online; ações conjuntas com outros comerciantes do centro (p. ex. domingo de lojas abertas, publicidade comum)."], "Innenstadt: viele Menschen zu Fuß, Bus und Bahn, andere Geschäfte nebenan – aber teuer und eng. Stadtrand: viel Platz, billig, Parkplätze – aber man braucht ein Auto.": ["ማእከል ከተማ፦ ብዙሓት ብእግሪ፣ ባስን ባቡርን፣ ጥቓ ካልኦት ድኳናት — ግን ክቡርን ጸቢብን። ወጻኢ ከተማ፦ ብዙሕ ቦታ፣ ርካሽ፣ መዕቆቢ መካይን — ግን መኪና የድሊ።", "Центр города: много пешеходов, автобусы и поезда, рядом другие магазины — но дорого и тесно. Окраина: много места, дёшево, парковки — но нужна машина.", "Centro: mucha gente a pie, bus y tren, otras tiendas al lado, pero caro y estrecho. Afueras: mucho espacio, barato, aparcamiento, pero se necesita coche.", "Centro: muita gente a pé, autocarro e comboio, outras lojas ao lado, mas caro e apertado. Arredores: muito espaço, barato, estacionamento, mas é preciso carro."], "Ein Juwelier braucht wenig Fläche, aber viele Passanten und ein hochwertiges Umfeld.": ["ሓደ ሰራሒ ወርቂ ንእሽተይ ቦታ ይደሊ፣ ግን ብዙሓት ሓላፍቲን ክቡር ከባቢን።", "Ювелиру нужна небольшая площадь, но много прохожих и престижное окружение.", "Un joyero necesita poco espacio, pero muchos transeúntes y un entorno de calidad.", "Um joalheiro precisa de pouca área, mas de muitos transeuntes e de um ambiente de qualidade."], "Die Konkurrenz-Liste": ["ዝርዝር ተወዳደርቲ", "Список конкурентов", "La lista de la competencia", "A lista da concorrência"], "Im Container der Bauleitung hängt eine Pinnwand: Frau Okafor hat alle Mitbewerber in der Nähe aufgeschrieben. Neben jedem Namen fehlt die Betriebsform.": ["ኣብ ኮንቴነር ናይ ሕንጻ ኣመሓዳሪ ሰሌዳ ኣሎ፦ ወይዘሮ ኦካፎር ኩሎም ጥቓ ዝርከቡ ተወዳደርቲ ጽሒፈን። ጥቓ ነፍሲ ወከፍ ሽም ዓይነት ድኳን ይጎድል።", "В контейнере стройуправления висит доска: госпожа Окафор записала всех конкурентов поблизости. Рядом с каждым названием не указана форма предприятия (Betriebsform).", "En el contenedor de la obra hay un tablón: la Sra. Okafor ha anotado a todos los competidores cercanos. Junto a cada nombre falta la Betriebsform (forma comercial).", "No contentor da obra há um quadro: a Sra. Okafor anotou todos os concorrentes próximos. Junto a cada nome falta a Betriebsform (forma comercial)."], "Welche Betriebsform ist das?": ["እዚ ኣየናይ Betriebsform (ዓይነት ድኳን) እዩ?", "Какая это Betriebsform (форма предприятия)?", "¿Qué Betriebsform (forma comercial) es?", "Que Betriebsform (forma comercial) é?"], "Achtet auf Sortiment, Preis, Verkaufsform und Standort.": ["ንዓይነት ፍርያት፣ ዋጋ፣ ኣገባብ ሽያጥን ቦታን ኣስተውዕሉ።", "Обратите внимание на ассортимент, цену, форму продажи и местоположение.", "Fijaos en el surtido, el precio, la forma de venta y la ubicación.", "Reparem no sortimento, no preço, na forma de venda e na localização."], "„Käse-Kontor“ in der Fußgängerzone verkauft nur Käse – 250 Sorten, mit Probierstücken und Beratung.": ["«ኬዘ-ኮንቶር» ኣብ ዞባ ጽጉዕ እግሪ ኬዝ ጥራይ ይሸጥ — 250 ዓይነት፣ ምስ ናሙና ጥዕምን ምኽርን።", "«Кезе-Контор» в пешеходной зоне продаёт только сыр — 250 сортов, с дегустацией и консультацией.", "«Käse-Kontor» en la zona peatonal vende solo queso: 250 variedades, con degustación y asesoramiento.", "«Käse-Kontor» na zona pedonal vende só queijo: 250 variedades, com provas e aconselhamento."], "Fachgeschäft": ["Fachgeschäft (ፍሉይ ድኳን)", "Fachgeschäft (профильный магазин)", "Fachgeschäft (tienda especializada)", "Fachgeschäft (loja especializada)"], "Spezialgeschäft": ["Spezialgeschäft (ፍሉይ ዝኾነ ድኳን)", "Spezialgeschäft (узкоспециализированный)", "Spezialgeschäft (tienda muy especializada)", "Spezialgeschäft (loja muito especializada)"], "Supermarkt": ["Supermarkt (ሱፐርማርኬት)", "Supermarkt (супермаркет)", "Supermarkt (supermercado)", "Supermarkt (supermercado)"], "„Preisfuchs“ am Stadtrand: 1.500 Artikel auf Paletten, kaum Dekoration, sehr niedrige Preise.": ["«ፕራይስፉክስ» ኣብ ወጻኢ ከተማ፦ 1.500 ኣርቲክል ኣብ ፓሌት፣ ዳርጋ ጌጥ የለን፣ ኣዝዩ ትሑት ዋጋ።", "«Прайсфукс» на окраине: 1.500 артикулов на паллетах, почти никакого оформления, очень низкие цены.", "«Preisfuchs» en las afueras: 1.500 artículos en palés, casi sin decoración, precios muy bajos.", "«Preisfuchs» nos arredores: 1.500 artigos em paletes, quase sem decoração, preços muito baixos."], "Discounter": ["Discounter (ዲስካውንተር)", "Discounter (дискаунтер)", "Discounter (discount)", "Discounter (discount)"], "Verbrauchermarkt": ["Verbrauchermarkt (ዓቢ ሱፐርማርኬት)", "Verbrauchermarkt (гипермаркет)", "Verbrauchermarkt (hipermercado)", "Verbrauchermarkt (hipermercado)"], "„Mega-Markt“ an der Autobahnabfahrt: 60.000 Artikel, Lebensmittel und Gebrauchsgüter, Selbstbedienung.": ["«መጋ-ማርክት» ኣብ መውጽኢ ኣውቶባን፦ 60.000 ኣርቲክል፣ መግብን ናይ ዕለታዊ ጥቕሚ ኣቕሑትን፣ ርእስ ኣገልግሎት።", "«Мега-Маркт» у съезда с автобана: 60.000 артикулов, продукты и товары длительного пользования, самообслуживание.", "«Mega-Markt» en la salida de la autopista: 60.000 artículos, alimentos y bienes duraderos, autoservicio.", "«Mega-Markt» na saída da autoestrada: 60.000 artigos, alimentos e bens duradouros, self-service."], "Warenhaus": ["Warenhaus (ሓባራዊ ድኳን)", "Warenhaus (универмаг)", "Warenhaus (grandes almacenes)", "Warenhaus (armazém)"], "Fachmarkt": ["Fachmarkt (ፍሉይ ዓቢ ድኳን)", "Fachmarkt (специализированный гипермаркет)", "Fachmarkt (gran superficie especializada)", "Fachmarkt (grande superfície especializada)"], "„Technik-Welt“ am Stadtrand: nur Elektrogeräte, 4.000 m², große Auswahl, niedrige Preise.": ["«ቴክኒክ-ቨልት» ኣብ ወጻኢ ከተማ፦ ኤለክትሪክ ኣቕሑት ጥራይ፣ 4.000 m²፣ ዓቢ ምርጫ፣ ትሑት ዋጋ።", "«Техник-Вельт» на окраине: только электроприборы, 4.000 м², большой выбор, низкие цены.", "«Technik-Welt» en las afueras: solo electrodomésticos, 4.000 m², gran selección, precios bajos.", "«Technik-Welt» nos arredores: só eletrodomésticos, 4.000 m², grande escolha, preços baixos."], "„Kaufhaus Hafenlicht“ in der Innenstadt: Mode, Kosmetik, Spielwaren und Haushalt auf vier Etagen.": ["«ካውፍሃውስ ሃፈንሊሕት» ኣብ ማእከል ከተማ፦ ኣልባስ፣ ሽቱ፣ መጻወቲን ናይ ገዛ ኣቕሑትን ኣብ ኣርባዕተ ደርብ።", "«Кауфхаус Хафенлихт» в центре города: одежда, косметика, игрушки и товары для дома на четырёх этажах.", "«Kaufhaus Hafenlicht» en el centro: moda, cosmética, juguetes y hogar en cuatro plantas.", "«Kaufhaus Hafenlicht» no centro: moda, cosmética, brinquedos e casa em quatro andares."], "Familie Lüders verkauft mittwochs und samstags Gemüse an ihrem Stand auf dem Wochenmarkt.": ["ስድራቤት ሊደርስ ሮቡዕን ቀዳምን ኣታክልቲ ኣብ ደሞ ሳምንታዊ ዕዳጋ ይሸጡ።", "Семья Людерс по средам и субботам продаёт овощи на своём прилавке на еженедельном рынке.", "La familia Lüders vende verdura los miércoles y sábados en su puesto del mercado semanal.", "A família Lüders vende legumes às quartas e aos sábados na sua banca do mercado semanal."], "Versandhandel": ["Versandhandel (ዕዳጋ ብፖስታ)", "Versandhandel (посылочная торговля)", "Versandhandel (venta por correo)", "Versandhandel (venda por correspondência)"], "ambulanter Handel": ["ambulanter Handel (ተንቀሳቓሲ ዕዳጋ)", "ambulanter Handel (разносная торговля)", "ambulanter Handel (comercio ambulante)", "ambulanter Handel (comércio ambulante)"], "Ayla bestellt Grillfleisch in der App vom Frischmarkt und holt es um 17 Uhr an der Theke ab.": ["ኣይላ ኣብ ኣፕ ናይ ፍሪሽማርክት ስጋ ቀልቀል የዝዝ ከምኡ ድማ ሰዓት 17 ኣብ ቆጸራ ትወስዶ።", "Айла заказывает мясо для гриля в приложении «Фришмаркт» и забирает его в 17 часов у прилавка.", "Ayla pide carne para la parrilla en la app del Frischmarkt y la recoge a las 17 h en el mostrador.", "A Ayla encomenda carne para grelhar na app do Frischmarkt e levanta-a às 17 h ao balcão."], "Click & Collect": ["Click & Collect (ኦንላይን ኣዘዝ፣ ኣብ ድኳን ተቐበል)", "Click & Collect (заказать онлайн, забрать в магазине)", "Click & Collect (pedir online, recoger en tienda)", "Click & Collect (encomendar online, levantar na loja)"], "Tele-Shopping": ["Tele-Shopping (ዕዳጋ ብቴለቪዥን)", "Tele-Shopping (телемагазин)", "Tele-Shopping (televenta)", "Tele-Shopping (televenda)"], "In den letzten Jahren sind viele neue Betriebsformen entstanden (z. B. Click & Collect). Erklärt, warum das so ist, und nennt ein Beispiel.": ["ኣብ እዞም ዝሓለፉ ዓመታት ብዙሓት ሓደስቲ ዓይነታት ድኳን ተፈጢሮም (ንኣብነት Click & Collect)። ስለምንታይ ከም ዝኾነ ኣብራሩ፣ ሓደ ኣብነት ድማ ጥቀሱ።", "В последние годы возникло много новых Betriebsformen (форм предприятий), напр. Click & Collect. Объясните, почему так, и приведите пример.", "En los últimos años han surgido muchas Betriebsformen nuevas (p. ej. Click & Collect). Explicad por qué y nombrad un ejemplo.", "Nos últimos anos surgiram muitas Betriebsformen novas (p. ex. Click & Collect). Expliquem porquê e deem um exemplo."], "Neue Betriebsformen entstehen, weil die Kunden ihre Erwartungen und ihr Kaufverhalten verändern. Beispiel 1: Viele Kunden kaufen preisbewusster ein – davon profitieren die Discounter. Beispiel 2: Viele Kunden bestellen gern online, wollen aber keine Versandkosten zahlen oder die Ware schnell haben – deshalb bieten Geschäfte Click & Collect an.": ["ሓደስቲ ዓይነታት ድኳን የምጽኡ ምኽንያቱ ዓማዊል ትጽቢቶምን ኣገዛዝኣኦምን ስለዝቕይሩ እዩ። ኣብነት 1፦ ብዙሓት ዓማዊል ብዋጋ ተጠንቂቆም ይሸይጡ — ዲስካውንተር ይጥቀሙ። ኣብነት 2፦ ብዙሓት ዓማዊል ኦንላይን ምዝዛም ይፈትዉ፣ ግን ክፍሊት ምልኣኽ ኣይደልዩን ወይ ፍርያት ቅልጡፍ ይደልዩ — ስለዚ ድኳናት Click & Collect የቕርቡ።", "Новые Betriebsformen возникают, потому что клиенты меняют ожидания и покупательское поведение. Пример 1: многие покупают с оглядкой на цену — это выгодно дискаунтерам. Пример 2: многие любят заказывать онлайн, но не хотят платить за доставку или хотят получить товар быстро — поэтому магазины предлагают Click & Collect.", "Surgen nuevas Betriebsformen porque los clientes cambian sus expectativas y su comportamiento de compra. Ejemplo 1: muchos compran más atentos al precio, lo que beneficia a los discounters. Ejemplo 2: a muchos les gusta pedir online pero no quieren pagar envío o quieren la mercancía rápido; por eso las tiendas ofrecen Click & Collect.", "Surgem novas Betriebsformen porque os clientes mudam as expectativas e o comportamento de compra. Exemplo 1: muitos compram mais atentos ao preço, o que beneficia os discounters. Exemplo 2: muitos gostam de encomendar online mas não querem pagar portes ou querem a mercadoria depressa; por isso as lojas oferecem Click & Collect."], "Fachgeschäft = eine Branche. Spezialgeschäft = nur ein kleiner Ausschnitt einer Branche, sehr tief. Fachmarkt = eine Branche, aber riesige Fläche am Stadtrand und günstig. Warenhaus = sehr breit, viele Abteilungen, Innenstadt.": ["Fachgeschäft = ሓደ ዓውዲ ንግዲ። Spezialgeschäft = ሓደ ንእሽተይ ክፋል ናይ ሓደ ዓውዲ፣ ኣዝዩ ዓሚቝ። Fachmarkt = ሓደ ዓውዲ፣ ግን ዓቢ ቦታ ኣብ ወጻኢ ከተማ ከምኡ ድማ ርካሽ። Warenhaus = ኣዝዩ ሰፊሕ፣ ብዙሕ ክፍልታት፣ ማእከል ከተማ።", "Fachgeschäft = одна отрасль. Spezialgeschäft = лишь небольшой фрагмент отрасли, очень глубокий. Fachmarkt = одна отрасль, но огромная площадь на окраине и дёшево. Warenhaus = очень широкий, много отделов, центр города.", "Fachgeschäft = un sector. Spezialgeschäft = solo un pequeño fragmento de un sector, muy profundo. Fachmarkt = un sector, pero superficie enorme en las afueras y barato. Warenhaus = muy amplio, muchas secciones, centro de la ciudad.", "Fachgeschäft = um setor. Spezialgeschäft = só uma pequena parte de um setor, muito profundo. Fachmarkt = um setor, mas área enorme nos arredores e barato. Warenhaus = muito largo, muitas secções, centro da cidade."], "Discounter: eng und flach, 600–2.500 Artikel, sehr billig. Verbrauchermarkt: breit und tief, Lebensmittel und Gebrauchsgüter, Stadtrand. Ambulanter Handel = ohne festes Geschäft (Markt, Straße).": ["Discounter፦ ጸቢብን ኣዋህሕን፣ 600–2.500 ኣርቲክል፣ ኣዝዩ ርካሽ። Verbrauchermarkt፦ ሰፊሕን ዓሚቝን፣ መግብን ናይ ዕለታዊ ጥቕሚ ኣቕሑትን፣ ወጻኢ ከተማ። ambulanter Handel = ብዘይ ቀዋሚ ድኳን (ዕዳጋ፣ ጎደና)።", "Discounter: узкий и мелкий, 600–2.500 артикулов, очень дёшево. Verbrauchermarkt: широкий и глубокий, продукты и товары длительного пользования, окраина. Ambulanter Handel = без постоянного магазина (рынок, улица).", "Discounter: estrecho y superficial, 600–2.500 artículos, muy barato. Verbrauchermarkt: amplio y profundo, alimentos y bienes duraderos, afueras. Ambulanter Handel = sin tienda fija (mercado, calle).", "Discounter: estreito e superficial, 600–2.500 artigos, muito barato. Verbrauchermarkt: largo e profundo, alimentos e bens duradouros, arredores. Ambulanter Handel = sem loja fixa (mercado, rua)."], "Die Abteilungsschilder": ["ሰሌዳታት ክፍልታት", "Таблички отделов", "Los carteles de las secciones", "As placas das secções"], "Auf der Verkaufsfläche hängen schon die Abteilungsschilder, aber auf keinem steht, wie dort verkauft wird. Der Ladenbauer braucht die Angabe, sonst baut er die falschen Theken und Regale.": ["ኣብ ቦታ ሽያጥ ሰሌዳታት ክፍልታት ተሰቒሎም ኣለዉ፣ ግን ኣብ ዝዀነ ኣይተጻሕፈን ከመይ ጌሩ ከም ዝሸጡ። እቲ ሰራሒ ድኳን እቲ ሓበሬታ የድልዮ፣ ካብዚ ወጻኢ ጌጋ ባንካታትን መደርደሪታትን ይሰርሕ።", "В торговом зале уже висят таблички отделов, но ни на одной не написано, как здесь продают. Строителю магазина нужна эта информация, иначе он построит не те прилавки и стеллажи.", "En la sala de ventas ya cuelgan los carteles de las secciones, pero en ninguno pone cómo se vende allí. El constructor necesita el dato; si no, montará mostradores y estanterías equivocados.", "Na área de vendas já estão pendurados os cartazes das secções, mas em nenhum diz como se vende ali. O construtor precisa dessa indicação, senão monta os balcões e as prateleiras errados."], "Teil A: Welche Verkaufsform passt?": ["ክፋል A፦ ኣየናይ Verkaufsform (ኣገባብ ሽያጥ) ይሰማማዕ?", "Часть A: какая Verkaufsform (форма продажи) подходит?", "Parte A: ¿qué Verkaufsform (forma de venta) encaja?", "Parte A: que Verkaufsform (forma de venda) combina?"], "Bedienung = die Verkäuferin gibt die Ware · Vorwahl = selbst umschauen, Beratung auf Wunsch · Selbstbedienung = selbst nehmen, zur Kasse": ["Bedienung = እቲ ሸያጢ ፍርያት ይህብ · Vorwahl = ባዕሉ ይርኢ፣ ብሕቶ ምኽሪ · Selbstbedienung = ባዕሉ ይወስድ፣ ናብ ካሳ", "Bedienung = продавец подаёт товар · Vorwahl = сам осматривается, консультация по желанию · Selbstbedienung = сам берёт, идёт на кассу", "Bedienung = la vendedora entrega la mercancía · Vorwahl = uno mira por sí mismo, asesoramiento si se pide · Selbstbedienung = uno toma y va a caja", "Bedienung = a vendedora entrega a mercadoria · Vorwahl = olha-se por si, aconselhamento a pedido · Selbstbedienung = tira-se e vai-se à caixa"], "Die Frischfisch-Theke": ["ቆጸራ ሓድሽ ዓሳ", "Прилавок со свежей рыбой", "El mostrador de pescado fresco", "O balcão do peixe fresco"], "Bedienung": ["Bedienung (ኣገልግሎት)", "Bedienung (обслуживание)", "Bedienung (atención en mostrador)", "Bedienung (atendimento ao balcão)"], "Vorwahl": ["Vorwahl (ቅድም ምርጫ)", "Vorwahl (предварительный выбор)", "Vorwahl (preselección)", "Vorwahl (pré-seleção)"], "Selbstbedienung": ["Selbstbedienung (ርእስ ኣገልግሎት)", "Selbstbedienung (самообслуживание)", "Selbstbedienung (autoservicio)", "Selbstbedienung (self-service)"], "Mehl, Nudeln und Reis im Regal": ["ሓርጭ፣ ፓስታን ሩዝን ኣብ መደርደሪ", "Мука, макароны и рис на полке", "Harina, pasta y arroz en la estantería", "Farinha, massa e arroz na prateleira"], "Die Kaffeevollautomaten: Kunden probieren selbst aus, ein Mitarbeiter erklärt nur, wenn sie fragen.": ["ሙሉእ ኣውቶማቲክ ቡን መሳርሒታት፦ ዓማዊል ባዕሎም የፍትኑ፣ ሓደ ሰራሕተኛ እንተሓተቱ ጥራይ የብርህ።", "Кофемашины: клиенты пробуют сами, сотрудник объясняет, только если спросят.", "Cafeteras automáticas: los clientes prueban por sí mismos; un empleado solo explica si le preguntan.", "Máquinas de café automáticas: os clientes experimentam sozinhos; um colaborador só explica se perguntarem."], "Teure Parfüms im abgeschlossenen Glasschrank": ["ክቡር ሽቱ ኣብ ዝተዓጽወ ዓይኒ ጣዕሳ ሳጹን", "Дорогие духи в запертой стеклянной витрине", "Perfumes caros en una vitrina cerrada con llave", "Perfumes caros numa vitrine fechada à chave"], "Zahnpasta und Duschgel": ["ጥርሲ ሳሙናን ሳሙና ሻወርን", "Зубная паста и гель для душа", "Pasta de dientes y gel de ducha", "Pasta de dentes e gel de banho"], "Pflanzenschutzmittel in der kleinen Gartenabteilung": ["መድሃኒት ጸረ-ተባዕ ኣብ ንእሽተይ ክፍሊ ጀርዲን", "Средства защиты растений в небольшом садовом отделе", "Productos fitosanitarios en la pequeña sección de jardín", "Produtos fitossanitários na pequena secção de jardim"], "Teil B: Die Weinabteilung": ["ክፋል B፦ ክፍሊ ወይኒ", "Часть B: винный отдел", "Parte B: la sección de vinos", "Parte B: a secção de vinhos"], "In der alten Filiale wurde Wein in Bedienung verkauft. In der neuen Filiale soll es Vorwahl werden.": ["ኣብ ዘመናዊ ጨናፍር ወይኒ ብ Bedienung ይሸጥ ነበረ። ኣብ ሓዱሽ ጨናፍር Vorwahl ክኸውን እዩ።", "В старом филиале вино продавали с Bedienung. В новом филиале должна быть Vorwahl.", "En la sucursal antigua el vino se vendía con Bedienung. En la nueva debe ser Vorwahl.", "Na filial antiga o vinho vendia-se com Bedienung. Na nova deve ser Vorwahl."], "Was braucht die Weinabteilung für die Vorwahl vor allem?": ["ክፍሊ ወይኒ ንVorwahl እንታይ ይድልዮ?", "Что прежде всего нужно винному отделу для Vorwahl?", "¿Qué necesita sobre todo la sección de vinos para la Vorwahl?", "O que precisa sobretudo a secção de vinhos para a Vorwahl?"], "einen übersichtlichen Warenaufbau mit Produktbeschreibungen": ["ጽሩይ ምድላው ፍርያት ምስ መግለጺ ፍርያት", "понятную выкладку товара с описаниями продуктов", "una presentación clara de la mercancía con descripciones de los productos", "uma apresentação clara da mercadoria com descrições dos produtos"], "eine Verkäuferin, die jeden Kunden sofort beim Betreten anspricht": ["ሓንቲ ሸያጢት ነፍሲ ወከፍ ዓሚል ኣብ ምእታዉ ብቕጽበት ትዛረብ", "продавщицу, которая сразу заговаривает с каждым клиентом при входе", "una vendedora que habla enseguida a cada cliente al entrar", "uma vendedora que fala de imediato com cada cliente à entrada"], "eine Theke, hinter der alle Flaschen stehen": ["ቆጸራ ኩሉ ጠርሙሳት ኣብ ድሕሪኡ ዝስርዑ", "прилавок, за которым стоят все бутылки", "un mostrador detrás del cual están todas las botellas", "um balcão atrás do qual estão todas as garrafas"], "Die neue Filiale bekommt vier Self-Checkout-Kassen. Beurteilt diese Entscheidung aus Sicht des Betriebs und aus Sicht der Kunden.": ["ሓዳስ ጨናፍር ኣርባዕተ Self-Checkout ካሳታት ይረክብ። እዚ ውሳኔ ካብ ኣተሓሳስባ ናይ ንግዲ ከምኡ ድማ ካብ ኣተሓሳስባ ዓማዊል ገምግሙ።", "Новый филиал получает четыре кассы самообслуживания (Self-Checkout). Оцените это решение с точки зрения предприятия и с точки зрения клиентов.", "La nueva sucursal tendrá cuatro cajas de autoservicio (Self-Checkout). Valorad esta decisión desde el punto de vista de la empresa y de los clientes.", "A nova filial vai ter quatro caixas de self-service (Self-Checkout). Avaliem esta decisão do ponto de vista da empresa e dos clientes."], "Betrieb: spart Personal an der Kasse, die Mitarbeiter haben mehr Zeit für Beratung und Warenpflege – aber die Technik kostet Geld und es kann mehr gestohlen werden. Kunden: schneller bei wenigen Artikeln, kürzere Schlangen – aber weniger persönlicher Kontakt und Hilfe; ältere Kunden kommen oft schlechter zurecht. Fazit: sinnvoll als Ergänzung, wenn daneben noch normale Kassen offen sind.": ["ንግዲ፦ ኣብ ካሳ ሰራሕተኛ ይቀንስ፣ ሰራሕተኛታት ንምኽርን ንክንክን ፍርያትን ዝያዳ ግዜ ኣለዎም — ግን ቴክኒክ ወጻኢ ኣለዎ ከምኡ ድማ ዝያዳ ስርቂ ክኸውን ይኽእል። ዓማዊል፦ ብውሑድ ኣርቲክል ዝያዳ ቅልጡፍ፣ ሓጺር ሰልፊ — ግን ውሑድ ውልቃዊ ርክብን ሓገዝን፤ ኣረጋውያን ዓማዊል ብዙሕ ግዜ ይሽገሩ። ብሓጺሩ፦ ምስ ልሙድ ካሳታት እንተ ኣለዉ ተወሳኺ ኮይኑ ትርጉም ኣለዎ።", "Предприятие: экономит персонал на кассе, у сотрудников больше времени на консультации и уход за товаром — но техника стоит денег и может быть больше краж. Клиенты: быстрее при малом числе товаров, короче очереди — но меньше личного контакта и помощи; пожилым клиентам часто сложнее. Вывод: разумно как дополнение, если рядом открыты обычные кассы.", "Empresa: ahorra personal en caja, los empleados tienen más tiempo para asesorar y cuidar la mercancía, pero la tecnología cuesta dinero y puede haber más robos. Clientes: más rápido con pocos artículos, colas más cortas, pero menos contacto personal y ayuda; a los clientes mayores les cuesta más. Conclusión: tiene sentido como complemento si además hay cajas normales abiertas.", "Empresa: poupa pessoal na caixa, os colaboradores têm mais tempo para aconselhar e cuidar da mercadoria, mas a tecnologia custa dinheiro e pode haver mais furtos. Clientes: mais rápido com poucos artigos, filas mais curtas, mas menos contacto pessoal e ajuda; os clientes mais velhos têm mais dificuldade. Conclusão: faz sentido como complemento, se também houver caixas normais abertas."], "Bedienung bei Waren, die teuer, diebstahlgefährdet oder erklärungsbedürftig sind – oder wenn Hygiene oder ein Gesetz es verlangen.": ["Bedienung ኣብ ክቡር፣ ዝስረቕ ወይ መግለጺ ዝሓትት ፍርያት — ወይ ጽሬት ወይ ሕጊ እንተ ሓቲቱ።", "Bedienung — для дорогих товаров, которые легко украсть или которые требуют объяснений, а также если этого требуют гигиена или закон.", "Bedienung para mercancía cara, fácil de robar o que necesita explicación, o si lo exigen la higiene o una ley.", "Bedienung para mercadoria cara, fácil de furtar ou que precisa de explicação, ou quando a higiene ou a lei o exigem."], "Bei der Vorwahl orientieren sich die Kunden zuerst selbst. Sie sofort anzusprechen widerspricht der Vorwahl.": ["ኣብ Vorwahl ዓማዊል ኣብ መጀመርታ ባዕሎም ይኣምሩ። ብቕጽበት ምዝራብ ንVorwahl ይቃረን።", "При Vorwahl клиенты сначала ориентируются сами. Сразу заговаривать с ними противоречит Vorwahl.", "En la Vorwahl los clientes se orientan primero por sí mismos. Hablarles de inmediato contradice la Vorwahl.", "Na Vorwahl os clientes orientam-se primeiro sozinhos. Falar-lhes de imediato contraria a Vorwahl."], "Das Leitbild an der Wand": ["ራእይ ኣብ መንደቕ (Leitbild)", "Миссия на стене (Leitbild)", "El lema en la pared (Leitbild)", "A missão na parede (Leitbild)"], "In der Eingangshalle wird gerade das Leitbild an die Wand geklebt. Die Folie mit den Überschriften fehlt noch: Welche Ziele sind ökonomisch, welche sozial, welche ökologisch?": ["ኣብ ሓላ መእተዊ Leitbild (ራእይ ናይ ንግዲ) ኣብ መንደቕ ይተለጥፍ ኣሎ። እቲ ፎሊዮ ምስ ኣርእስቲ ገና የለን፦ ኣየነይቲ ዕላማታት ቁጠባዊ (ökonomisch)፣ ኣየናይ ማሕበራዊ (sozial)፣ ኣየናይ ኣካባብያዊ (ökologisch)?", "В входном холле на стену как раз клеят Leitbild (миссию предприятия). Плёнки с заголовками ещё нет: какие цели экономические, какие социальные, какие экологические?", "En el vestíbulo están pegando en la pared el Leitbild (lema de la empresa). Falta la lámina con los títulos: ¿qué objetivos son económicos, cuáles sociales y cuáles ecológicos?", "No átrio estão a colar na parede o Leitbild (missão da empresa). Falta a folha com os títulos: que objetivos são económicos, quais sociais e quais ecológicos?"], "Teil A: Welches Unternehmensziel?": ["ክፋል A፦ እቲ ኣየናይ ዕላማ ንግዲ (Unternehmensziel)?", "Часть A: какая цель предприятия (Unternehmensziel)?", "Parte A: ¿qué objetivo empresarial (Unternehmensziel)?", "Parte A: que objetivo empresarial (Unternehmensziel)?"], "Achtung: Eine Maßnahme kann zwei Ziele zugleich erfüllen.": ["ጥንቃቐ፦ ሓደ ስጉምቲ ክልተ ዕላማታት ብሓደ ግዜ ክፈጽም ይኽእል።", "Внимание: одна мера может достигать сразу двух целей.", "Atención: una medida puede cumplir dos objetivos a la vez.", "Atenção: uma medida pode cumprir dois objetivos ao mesmo tempo."], "Die neue Filiale soll im ersten Jahr 4 Millionen € Umsatz machen.": ["እቲ ሓዱሽ ጨናፍር ኣብ ቀዳማይ ዓመት 4 ሚልዮን € ሽያጥ ክገብር እዩ።", "Новый филиал должен в первый год сделать 4 миллиона € выручки.", "La nueva sucursal debe facturar 4 millones de € en el primer año.", "A nova filial deve faturar 4 milhões de € no primeiro ano."], "ökonomisch": ["ökonomisch (ቁጠባዊ)", "ökonomisch (экономическая)", "ökonomisch (económico)", "ökonomisch (económico)"], "sozial": ["sozial (ማሕበራዊ)", "sozial (социальная)", "sozial (social)", "sozial (social)"], "ökologisch": ["ökologisch (ኣካባብያዊ)", "ökologisch (экологическая)", "ökologisch (ecológico)", "ökologisch (ecológico)"], "Alle Mitarbeitenden bekommen einen Zuschuss zu den Fahrtkosten.": ["ኩሎም ሰራሕተኛታት ሓገዝ ናይ ክፍሊት መጓዓዝያ ይረኽቡ።", "Все сотрудники получают дотацию на проезд.", "Todos los empleados reciben una ayuda para los gastos de transporte.", "Todos os colaboradores recebem um subsídio de transporte."], "Alle Tiefkühltruhen bekommen Glasdeckel, um Strom zu sparen.": ["ኩሉ ናይ ቁሪ ሳጹናት ብብርጭቆ ክዳን ኤለክትሪክ ንምድሓን ይተኸልዎም።", "Все морозильные ларе получают стеклянные крышки для экономии электричества.", "Todas las arcas congeladoras reciben tapas de cristal para ahorrar electricidad.", "Todas as arcas congeladoras recebem tampas de vidro para poupar eletricidade."], "Obst und Gemüse gibt es ohne Plastikverpackung.": ["ፍሬን ኣታክልትን ብዘይ ፕላስቲክ መጠቃለሊ ይርከብ።", "Фрукты и овощи продаются без пластиковой упаковки.", "La fruta y la verdura se venden sin envase de plástico.", "A fruta e os legumes vendem-se sem embalagem de plástico."], "Ständige Absatzsteigerung zur Sicherung der Arbeitsplätze": ["ቀጻሊ ምውሳኽ ሽያጥ ንምድሓን ስራሕ", "Постоянный рост сбыта для сохранения рабочих мест", "Aumento constante de las ventas para asegurar los puestos de trabajo", "Aumento constante das vendas para garantir os postos de trabalho"], "Für die Kinder der Beschäftigten gibt es Plätze im Betriebskindergarten.": ["ንደቂ ሰራሕተኛታት ቦታታት ኣብ ናይ ንግዲ ኪንደርጋርተን ኣሎ።", "Для детей сотрудников есть места в детском саду предприятия.", "Hay plazas en la guardería de la empresa para los hijos de los empleados.", "Há vagas no infantário da empresa para os filhos dos colaboradores."], "Teil B: Zielharmonie oder Zielkonflikt?": ["ክፋል B፦ Zielharmonie ወይ Zielkonflikt?", "Часть B: Zielharmonie или Zielkonflikt?", "Parte B: ¿Zielharmonie o Zielkonflikt?", "Parte B: Zielharmonie ou Zielkonflikt?"], "LED-Lampen schonen die Umwelt und senken die Stromkosten.": ["LED መብራህቲ ኣካባቢ የድሕኑ ከምኡ ድማ ወጻኢ ኤለክትሪክ የቀንሱ።", "Светодиодные лампы берегут природу и снижают расходы на электричество.", "Las lámparas LED protegen el medio ambiente y reducen el gasto de electricidad.", "As lâmpadas LED protegem o ambiente e reduzem os custos de eletricidade."], "Zielharmonie": ["Zielharmonie (ዕላማታት ይሰማምዑ)", "Zielharmonie (гармония целей)", "Zielharmonie (armonía de objetivos)", "Zielharmonie (harmonia de objetivos)"], "Zielkonflikt": ["Zielkonflikt (ዕላማታት ይቃረኑ)", "Zielkonflikt (конфликт целей)", "Zielkonflikt (conflicto de objetivos)", "Zielkonflikt (conflito de objetivos)"], "Mehr Urlaubsgeld für alle – dadurch steigen die Kosten und der Gewinn sinkt.": ["ዝያዳ ናይ ዕረፍቲ ገንዘብ ንኹሉ — ስለዚ ወጻኢ ይውስኽ ትርፊ ድማ ይንቀጽ።", "Больше отпускных для всех — поэтому растут расходы и падает прибыль.", "Más paga de vacaciones para todos: por eso suben los costes y baja el beneficio.", "Mais subsídio de férias para todos: por isso os custos sobem e o lucro desce."], "Der Frischmarkt hat 400.000 € Kapital eingesetzt und 30.000 € Gewinn gemacht. Berechnet die Rentabilität. Erklärt dann, was das Ergebnis aussagt.": ["ፍሪሽማርክት 400.000 € ካፒታል ተጠቒሙ 30.000 € ትርፊ ረኺቡ። Rentabilität (ትርፋማነት) ሓስቡ። ደሓር እቲ ውጽኢት እንታይ ከም ዝብል ኣብራሩ።", "«Фришмаркт» вложил 400.000 € капитала и получил 30.000 € прибыли. Рассчитайте Rentabilität (рентабельность). Затем объясните, что говорит результат.", "El Frischmarkt invirtió 400.000 € de capital y ganó 30.000 €. Calculad la Rentabilität (rentabilidad). Luego explicad qué dice el resultado.", "O Frischmarkt investiu 400.000 € de capital e teve 30.000 € de lucro. Calculem a Rentabilität (rentabilidade). Depois expliquem o que diz o resultado."], "Rentabilität = Gewinn · 100 : Kapital = 30.000 · 100 : 400.000 = 7,5 %. Das eingesetzte Kapital hat sich mit 7,5 % verzinst. Je höher die Rentabilität, desto besser lohnt sich das Geschäft für den Inhaber – zum Vergleich: Auf dem Sparbuch bekäme er deutlich weniger.": ["Rentabilität = ትርፊ · 100 : ካፒታል = 30.000 · 100 : 400.000 = 7,5 %። እቲ ዝተጠቀመ ካፒታል ብ 7,5 % ወለድ ኣምጺኡ። Rentabilität ዝለዓለ ዝበለ ንዋናኡ ንግዲ ዝበለጸ ዝህብ — ንምንጽጽር፦ ኣብ ቆጠባ ሕሳብ ብዙሕ ውሑድ ይረኽብ።", "Rentabilität = прибыль · 100 : капитал = 30.000 · 100 : 400.000 = 7,5 %. Вложенный капитал принёс 7,5 %. Чем выше Rentabilität, тем выгоднее бизнес для владельца — для сравнения: на сберегательной книжке он получил бы заметно меньше.", "Rentabilität = beneficio · 100 : capital = 30.000 · 100 : 400.000 = 7,5 %. El capital invertido ha rendido un 7,5 %. Cuanto mayor es la Rentabilität, más compensa el negocio al propietario; en comparación, en una libreta de ahorro obtendría bastante menos.", "Rentabilität = lucro · 100 : capital = 30.000 · 100 : 400.000 = 7,5 %. O capital investido rendeu 7,5 %. Quanto maior a Rentabilität, mais compensa o negócio ao proprietário; em comparação, numa caderneta de poupança receberia claramente menos."], "Ökonomisch = Geld: Umsatz, Gewinn, Kosten, Marktanteil. Sozial = gut für die Mitarbeiter. Ökologisch = gut für die Umwelt.": ["Ökonomisch = ገንዘብ፦ ሽያጥ፣ ትርፊ፣ ወጻኢ፣ ክፋል ዕዳጋ። Sozial = ንሰራሕተኛታት ጽቡቕ። Ökologisch = ንኣካባቢ ጽቡቕ።", "Ökonomisch = деньги: выручка, прибыль, расходы, доля рынка. Sozial = хорошо для сотрудников. Ökologisch = хорошо для окружающей среды.", "Ökonomisch = dinero: ventas, beneficio, costes, cuota de mercado. Sozial = bueno para los empleados. Ökologisch = bueno para el medio ambiente.", "Ökonomisch = dinheiro: vendas, lucro, custos, quota de mercado. Sozial = bom para os colaboradores. Ökologisch = bom para o ambiente."], "Prüfungsfalle: Bei „Absatzsteigerung zur Sicherung der Arbeitsplätze“ zählt die Maßnahme selbst (Absatz steigern), nicht die Folge. Zielharmonie = beide Ziele gewinnen, Zielkonflikt = ein Ziel schadet dem anderen.": ["ወጥመድ ኣብ ፈተና፦ ኣብ «ሽያጥ ምውሳኽ ንምድሓን ስራሕ» እቲ ስጉምቲ ባዕሉ (ሽያጥ ምውሳኽ) ይቑጸር፣ ውጽኢቱ ኣይኮነን። Zielharmonie = ክልቲኦም ዕላማታት ይረብሑ፣ Zielkonflikt = ሓደ ዕላማ ንኻልእ ይጎድእ።", "Ловушка на экзамене: у «роста сбыта для сохранения рабочих мест» учитывается сама мера (рост сбыта), а не следствие. Zielharmonie = обе цели выигрывают, Zielkonflikt = одна цель вредит другой.", "Trampa de examen: en «aumento de ventas para asegurar puestos de trabajo» cuenta la medida en sí (aumentar ventas), no la consecuencia. Zielharmonie = ganan ambos objetivos; Zielkonflikt = un objetivo perjudica al otro.", "Armadilha de teste: em «aumento das vendas para garantir postos de trabalho» conta a medida em si (aumentar as vendas), não a consequência. Zielharmonie = ganham os dois objetivos; Zielkonflikt = um objetivo prejudica o outro."], "Das Organigramm": ["Organigramm (ስእላዊ ኣወዳድባ)", "Organigramm (организационная схема)", "El Organigramm (organigrama)", "O Organigramm (organigrama)"], "Letzter Raum vor dem Büro: der Personalraum. Am Schwarzen Brett hängen das neue Organigramm und ein paar Notizzettel. Frau Okafor hat darunter geschrieben: „Wer den Aufbau versteht, findet den Weg ins Büro.“": ["እቲ መወዳእታ ክፍሊ ቅድሚ ቤት ጽሕፈት፦ ክፍሊ ሰራሕተኛታት። ኣብ ጸሊም ሰሌዳ እቲ ሓዱሽ Organigramm ከምኡ ድማ ገለ ጥቅሊል ወረቓቕቲ ተሰቒሎም ኣለዉ። ወይዘሮ ኦካፎር ኣብ ትሕቲኡ ጽሒፈን፦ «እቲ ኣወዳድባ ዝርዳእ መገዲ ናብ ቤት ጽሕፈት ይረኽብ።»", "Последняя комната перед офисом: комната персонала. На доске висят новая Organigramm и несколько записок. Госпожа Окафор написала под ней: «Кто понимает структуру, найдёт дорогу в офис.»", "Última sala antes de la oficina: la sala del personal. En el tablón cuelgan el nuevo Organigramm y algunas notas. La Sra. Okafor ha escrito debajo: «Quien entienda la estructura encuentra el camino a la oficina.»", "Última sala antes do escritório: a sala do pessoal. No quadro estão o novo Organigramm e alguns bilhetes. A Sra. Okafor escreveu por baixo: «Quem entende a estrutura encontra o caminho para o escritório.»"], "Teil A: Stelle, Instanz, Abteilung oder Organigramm?": ["ክፋል A፦ Stelle (ቦታ ስራሕ)፣ Instanz (መሪሕ ቦታ)፣ Abteilung (ክፍሊ) ወይ Organigramm?", "Часть A: Stelle (должность), Instanz (инстанция), Abteilung (отдел) или Organigramm?", "Parte A: ¿Stelle (puesto), Instanz (instancia), Abteilung (departamento) u Organigramm?", "Parte A: Stelle (posto), Instanz (instância), Abteilung (departamento) ou Organigramm?"], "Schaut euch das Organigramm an.": ["ነቲ Organigramm ርኢዎ።", "Посмотрите на Organigramm.", "Mirad el Organigramm.", "Olhem para o Organigramm."], "Herr Brandt leitet den Verkauf Food und gibt Lena und Jonas Anweisungen.": ["ሚስተር ብራንት ንVerkauf Food ይመርሕ ከምኡ ድማ ንሌናን ዮናስን መምርሒ ይህብ።", "Господин Брандт руководит отделом Verkauf Food и даёт указания Лене и Йонасу.", "El Sr. Brandt dirige Verkauf Food y da instrucciones a Lena y Jonas.", "O Sr. Brandt dirige o Verkauf Food e dá instruções à Lena e ao Jonas."], "Stelle": ["Stelle (ቦታ ስራሕ)", "Stelle (должность)", "Stelle (puesto)", "Stelle (posto)"], "Instanz": ["Instanz (መሪሕ ቦታ)", "Instanz (инстанция)", "Instanz (instancia)", "Instanz (instância)"], "Abteilung": ["Abteilung (ክፍሊ)", "Abteilung (отдел)", "Abteilung (departamento)", "Abteilung (departamento)"], "Organigramm": ["Organigramm (ስእላዊ ኣወዳድባ)", "Organigramm (схема)", "Organigramm (organigrama)", "Organigramm (organigrama)"], "Lena sitzt an der Kasse. Sie führt Aufgaben aus, gibt aber keine Anweisungen.": ["ሌና ኣብ ካሳ ተቐሚጣ። ስራሕ ትፍጽም፣ ግን መምርሒ ኣይትህብን።", "Лена сидит на кассе. Она выполняет задачи, но указаний не даёт.", "Lena está en la caja. Ejecuta tareas, pero no da instrucciones.", "A Lena está na caixa. Executa tarefas, mas não dá instruções."], "Kasse und Frischetheke arbeiten zusammen unter der Leitung von Herrn Brandt.": ["ካሳን ቆጸራ ትኩስ ምግቢን ብመሪሕነት ሚስተር ብራንት ሓቢሮም ይሰርሑ።", "Касса и свежий прилавок работают вместе под руководством господина Брандта.", "La caja y el mostrador de fresco trabajan juntos bajo la dirección del Sr. Brandt.", "A caixa e o balcão de frescos trabalham juntos sob a direção do Sr. Brandt."], "Die ganze Grafik am Schwarzen Brett, die die Abteilungsgliederung zeigt": ["እቲ ኩሉ ስእሊ ኣብ ጸሊም ሰሌዳ ዝህሉ ክፍልታት ዘርኢ", "Вся графика на доске, показывающая деление на отделы", "Todo el gráfico del tablón que muestra la división en departamentos", "Todo o gráfico no quadro que mostra a divisão em departamentos"], "Teil B: Aufbau- oder Ablauforganisation?": ["ክፋል B፦ Aufbau- ወይ Ablauforganisation?", "Часть B: Aufbau- или Ablauforganisation?", "Parte B: ¿Aufbau- o Ablauforganisation?", "Parte B: Aufbau- ou Ablauforganisation?"], "Aufbau = Wer ist zuständig? · Ablauf = Wie wird gearbeitet?": ["Aufbau = መን ሓላፊ? · Ablauf = ከመይ ይሰርሑ?", "Aufbau = кто отвечает? · Ablauf = как работают?", "Aufbau = ¿quién es responsable? · Ablauf = ¿cómo se trabaja?", "Aufbau = quem é responsável? · Ablauf = como se trabalha?"], "Emre ist ab Montag Leiter des Lagers, ihm unterstehen zwei Mitarbeiter.": ["ኤምሬ ካብ ሰኑይ ኣትሒዙ መራሒ መኽዘን እዩ፣ ክልተ ሰራሕተኛታት ትሕቲኡ ኣለዉ።", "Эмре с понедельника руководит складом, ему подчиняются два сотрудника.", "Emre es jefe del almacén desde el lunes; tiene dos empleados a su cargo.", "O Emre é chefe do armazém desde segunda-feira; tem dois colaboradores sob a sua chefia."], "Aufbauorganisation": ["Aufbauorganisation (ኣወዳድባ ቅርጺ)", "Aufbauorganisation (структурная организация)", "Aufbauorganisation (organización estructural)", "Aufbauorganisation (organização estrutural)"], "Ablauforganisation": ["Ablauforganisation (ኣወዳድባ ኣካይዳ)", "Ablauforganisation (организация процессов)", "Ablauforganisation (organización de procesos)", "Ablauforganisation (organização de processos)"], "Eine Checkliste legt fest, in welcher Reihenfolge die Kasse abends abgerechnet wird.": ["ሓንቲ ዝርዝር (Checkliste) ብኸመይ ተኸታታሊ ካሳ ምሸት ይሕለፍ ትወስን።", "Контрольный список определяет порядок, в котором вечером сдаётся касса.", "Una lista de control fija en qué orden se hace el cierre de caja por la tarde.", "Uma lista de verificação define em que ordem se faz o fecho de caixa à noite."], "Morgens gilt immer: Licht an, Kassen hochfahren, Türen öffnen – in genau dieser Reihenfolge.": ["ንግሆ ሓደ ግዜ ኩሉ ግዜ፦ መብራህቲ ኣብራህ፣ ካሳታት ኣንቀሳቕስ፣ ማዕጾታት ክፈት — በዚ ተኸታታሊ።", "Утром всегда: свет включить, кассы запустить, двери открыть — именно в таком порядке.", "Por la mañana siempre: encender la luz, arrancar las cajas, abrir las puertas, exactamente en este orden.", "De manhã é sempre: acender a luz, ligar as caixas, abrir as portas, exatamente por esta ordem."], "Die Abteilung Verwaltung steht im Organigramm direkt unter der Filialleitung.": ["ክፍሊ Verwaltung ኣብ Organigramm ብቐጥታ ትሕቲ Filialleitung ይርከብ።", "Отдел Verwaltung стоит в Organigramm прямо под Filialleitung.", "El departamento Verwaltung aparece en el Organigramm justo debajo de la Filialleitung.", "O departamento Verwaltung aparece no Organigramm logo abaixo da Filialleitung."], "Die neue Filiale ist teils nach Funktionen (Lager, Verwaltung), teils nach Objekten (Food, Non-Food) gegliedert. Erläutert, warum größere Betriebe eher nach Objekten und kleinere eher nach Funktionen gegliedert sind.": ["እቲ ሓዱሽ ጨናፍር ገለ ብ ስርሓት (መኽዘን፣ Verwaltung) ገለ ድማ ብ ኣቕሑት (Food፣ Non-Food) ተመዲቡ። ስለምንታይ ዓበይቲ ንግዲታት ብኣቕሑት ንእሽቶታት ድማ ብስርሓት ይምደቡ ኣብራሩ።", "Новый филиал частично разделён по функциям (склад, Verwaltung), частично по объектам (Food, Non-Food). Объясните, почему крупные предприятия чаще делятся по объектам, а мелкие — по функциям.", "La nueva sucursal se divide en parte por funciones (almacén, Verwaltung) y en parte por objetos (Food, Non-Food). Explicad por qué las empresas grandes se dividen más por objetos y las pequeñas más por funciones.", "A nova filial divide-se em parte por funções (armazém, Verwaltung) e em parte por objetos (Food, Non-Food). Expliquem por que razão as empresas grandes se dividem mais por objetos e as pequenas mais por funções."], "Ein großer Betrieb hat viele Warengruppen. Fachleute für eine Warengruppe kennen ihre Ware und ihre Kunden am besten – deshalb gliedert man nach Objekten (Warengruppen). In einem kleinen Betrieb erledigen wenige Personen die Arbeit für alle Warengruppen. Dort teilt man die Arbeit besser nach Aufgaben (Funktionen) auf: Einkauf, Lager, Verkauf, Verwaltung.": ["ዓቢ ንግዲ ብዙሕ ጉጅለ ኣቕሑት ኣለዎ። ሞያውያን ኣብ ሓደ ጉጅለ ኣቕሑትን ዓማዊሎምን ዝበለጸ ይፈልጡ — ስለዚ ብObjekt (ጉጅለ ኣቕሑት) ይምደብ። ኣብ ንእሽቶ ንግዲ ውሑዳት ሰባት ንኹሉ ጉጅለ ኣቕሑት ይሰርሑ። ኣብኡ ስራሕ ብስርሓት (Funktionen) ምምቕራሕ ይሓይሽ፦ ግዥ፣ መኽዘን፣ ሽያጥ፣ Verwaltung።", "У крупного предприятия много товарных групп. Специалисты по товарной группе лучше всего знают свой товар и клиентов — поэтому делят по объектам (товарным группам). В малом предприятии несколько человек делают работу для всех групп. Там лучше делить работу по задачам (функциям): закупки, склад, продажи, Verwaltung.", "Una empresa grande tiene muchos grupos de mercancías. Los especialistas de un grupo conocen mejor su mercancía y a sus clientes; por eso se divide por objetos (grupos de mercancías). En una empresa pequeña pocas personas hacen el trabajo para todos los grupos. Allí conviene repartir el trabajo por tareas (funciones): compras, almacén, ventas, Verwaltung.", "Uma empresa grande tem muitos grupos de mercadorias. Os especialistas de um grupo conhecem melhor a sua mercadoria e os clientes; por isso divide-se por objetos (grupos de mercadorias). Numa empresa pequena, poucas pessoas fazem o trabalho para todos os grupos. Aí é melhor repartir o trabalho por tarefas (funções): compras, armazém, vendas, Verwaltung."], "Stelle = kleinste Einheit, Aufgaben für eine Person. Instanz = Stelle mit Leitungs- und Weisungsbefugnis. Abteilung = mehrere Stellen unter einer Leitung. Organigramm = die Grafik.": ["Stelle = ዝንኣሰ ኣሃዱ፣ ስራሕ ንሓደ ሰብ። Instanz = Stelle ምስ መሪሕነትን ሓይሊ መምርሒን። Abteilung = ብዙሓት Stelle ትሕቲ ሓደ መራሒ። Organigramm = እቲ ስእላዊ ስእሊ።", "Stelle = наименьшая единица, задачи для одного человека. Instanz = Stelle с правом руководить и давать указания. Abteilung = несколько Stellen под одним руководителем. Organigramm = сама схема.", "Stelle = unidad más pequeña, tareas para una persona. Instanz = Stelle con facultad de dirigir y dar instrucciones. Abteilung = varias Stellen bajo una dirección. Organigramm = el gráfico.", "Stelle = unidade mais pequena, tarefas para uma pessoa. Instanz = Stelle com poder de chefia e de dar instruções. Abteilung = várias Stellen sob uma chefia. Organigramm = o gráfico."], "Geht es um Zuständigkeit und Leitung, ist es Aufbau. Geht es um Reihenfolge und Arbeitsschritte (Arbeitsanweisung, Checkliste), ist es Ablauf.": ["እንተ ብዛዕባ ሓላፍነትን መሪሕነትን ኮይኑ Aufbau እዩ። እንተ ብዛዕባ ተኸታታልን ስጉምትታት ስራሕን (መምርሒ ስራሕ፣ Checkliste) ኮይኑ Ablauf እዩ።", "Если речь об ответственности и руководстве — это Aufbau. Если о порядке и шагах работы (рабочая инструкция, Checkliste) — это Ablauf.", "Si se trata de responsabilidad y dirección, es Aufbau. Si se trata de orden y pasos de trabajo (instrucción de trabajo, Checkliste), es Ablauf.", "Se se trata de responsabilidade e chefia, é Aufbau. Se se trata de ordem e passos de trabalho (instrução de trabalho, Checkliste), é Ablauf."], "Code eingeben": ["ኮድ ኣእቱ", "Введите код", "Introducir el código", "Introduzir o código"], "Schloss offen!": ["መንከል ተኸፊቱ!", "Замок открыт!", "¡Candado abierto!", "Cadeado aberto!"], "Hinter dem letzten Schild klebt ein gelber Notizzettel mit dem Buchstaben": ["ድሕሪ እቲ መወዳእታ ምልክት ሓደ ብጫ ጥቕሊል ወረቐት ምስ ፊደል ተጣቢቑ ኣሎ", "За последней табличкой приклеена жёлтая записка с буквой", "Detrás del último cartel hay pegada una nota amarilla con la letra", "Atrás da última placa está colada uma nota amarela com a letra"], ". Merkt ihn euch – er steht jetzt auch auf dem Marktplan.": ["። ሓሲብኩሞ ሓዙዎ — ሕጂ ኣብ መደብ     if(el.nodeType!==1) return;
    if(SKIP[el.tagName]||SKIP[el.nodeName]) return;

    obs.observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  function enqueue(n){pend.add(n); if(!queued){queued=true;requestAnimationFrame(flush);}}
  var obs=new MutationObserver(function(ms){
    if(idx<0) return;
    for(var i=0;i<ms.length;i++){
      var m=ms[i];
      if(m.type==="characterData"){ var p=m.target.parentElement; if(p&&!p.hasAttribute("data-trl")) enqueue(p.closest("[data-trd]")||p); continue; }
      var t=m.target; if(t.nodeType!==1) continue;
      if(t.id==="trpanel"||t.id==="trbtn"||(t.closest&&t.closest("#trpanel"))) continue;
      var real=false;
      for(var j=0;j<m.addedNodes.length;j++){var a=m.addedNodes[j]; if(a.nodeType===1&&(a.className==="trl"||a.id==="trbtn"||a.id==="trpanel")) continue; real=true;}
      if(real) enqueue(t.hasAttribute("data-trd")?t.parentElement||t:t);
    }
  });
  var css=document.createElement("style");
  css.textContent=".trl{display:block;font-family:system-ui,'Noto Sans','Noto Sans Ethiopic','Nyala',sans-serif;font-size:clamp(11px,.78em,16px);font-weight:400;font-style:normal;line-height:1.35;color:#7a3d00;background:#FFF4E5;border-left:3px solid #E9A659;border-radius:2px;padding:1px 6px;margin:2px 0 2px;text-align:left;text-transform:none;letter-spacing:0;white-space:normal}"+
   "body.tr-hide .trl{display:none!important}"+
   "#trbtn{position:fixed;left:10px;bottom:10px;z-index:99998;width:46px;height:46px;border-radius:50%;border:2px solid #1F4E79;background:#fff;color:#1F4E79;font-size:22px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3);padding:0}"+
   "#trbtn.on{background:#1F4E79;color:#fff}"+
   "#trpanel{position:fixed;left:10px;bottom:64px;z-index:99999;background:#fff;color:#1a2430;border:1px solid #9DC3E6;border-radius:12px;padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;font-family:system-ui,'Noto Sans Ethiopic',sans-serif;min-width:220px}"+
   "#trpanel b{display:block;font-size:13px;margin-bottom:6px}"+
   "#trpanel button{display:block;width:100%;text-align:left;font:inherit;font-size:16px;border:1px solid #1F4E79;background:#fff;color:#1F4E79;border-radius:8px;padding:9px 12px;margin:4px 0;cursor:pointer;min-height:42px}"+
   "#trpanel button.sel{background:#1F4E79;color:#fff}"+
   "@media print{#trbtn,#trpanel{display:none}}";
  document.head.appendChild(css);
  var btn=document.createElement("button"); btn.id="trbtn"; btn.type="button"; btn.textContent="🌐"; if(HARVEST) idx=0; btn.setAttribute("aria-label","Übersetzung / Translation");
  var panel=document.createElement("div"); panel.id="trpanel";
  function lab(a){ return a[idx>=0?idx:0]; }
  function drawPanel(){
    var h="<b>🌐 Übersetzung · "+UIX.title.join(" · ")+"</b>";
    LG.forEach(function(L,i){h+='<button type="button" data-i="'+i+'" class="'+(idx===i?"sel":"")+'">'+L[2]+" "+L[1]+"</button>";});
    h+='<button type="button" data-i="-1" class="'+(idx<0?"sel":"")+'">✕ '+UIX.off[0]+" / "+UIX.off[1]+"</button>";
    panel.innerHTML=h;
    btn.className=idx>=0?"on":"";
  }
  panel.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    idx=+b.getAttribute("data-i");
    try{localStorage.setItem("er2_lang",String(idx));}catch(x){}
    obs.disconnect(); clearAll(); drawPanel(); panel.style.display="none";
    if(idx>=0) walk(document.body);
    obs.observe(document.body,{childList:true,subtree:true,characterData:true});
    document.body.classList.remove("tr-hide");
  });
  btn.addEventListener("click",function(e){e.stopPropagation(); panel.style.display=panel.style.display==="block"?"none":"block";});
  document.addEventListener("click",function(e){ if(!e.target.closest("#trpanel")&&e.target.id!=="trbtn") panel.style.display="none"; });
  function init(){
    document.body.appendChild(btn); document.body.appendChild(panel); drawPanel();
    if(idx>=0) walk(document.body);
    obs.observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",function(){setTimeout(init,50);}); else setTimeout(init,50);
  window.LF1_TR={walkAll:function(){walk(document.body);},setLang:function(i){idx=i;},get lang(){return idx;}};
})();
