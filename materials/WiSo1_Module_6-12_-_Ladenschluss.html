 term:'Mitbestimmung',def:'Ohne Zustimmung des Betriebsrats ist die Maßnahme unwirksam. Bei Streit: Einigungsstelle.',
 ihk:'Bei Beginn und Ende der täglichen Arbeitszeit hat der Betriebsrat ein Mitbestimmungsrecht. Ohne seine Zustimmung ist die Maßnahme unwirksam.',
 weil:'… weil eine Änderung der Arbeitszeit ohne Zustimmung des Betriebsrats nicht gilt.'},
{id:'f6',after:['j1'],area:'m11',from:'lueders',title:'Folgefall: Der Urlaubsplan hängt',
 msg:p=>`Der Urlaubsplan hängt aus. Du stehst im November drin. Im Juli sind aber Berufsschulferien. Ist das jetzt fest?`,
 opts:[
  {t:p=>p.b.br?'Nein. Beim Urlaubsplan bestimmt der Betriebsrat mit. Ich bitte '+(p.b.jav?'die JAV und ':'')+'den Betriebsrat um Hilfe. Mein Urlaub soll in den Berufsschulferien liegen.':'Ich bitte Sie: Mein Urlaub soll in den Berufsschulferien liegen (§ 19 JArbSchG). Sonst frage ich die Ausbildungsberatung der Handelskammer.',law:2,tone:'s',why:'Richtig. Der Urlaub soll Berufsschülern in den Berufsschulferien gegeben werden. Es lohnt sich, nachzufragen.'},
  {t:'Ja. Jetzt ist es zu spät.',law:0,tone:'n',why:'Falsch. Du kannst dich weiter auf § 19 JArbSchG berufen und Hilfe holen.'},
  {t:'Egal. Wenn im November Schule ist, zählt der Schultag eben als Urlaub.',law:0,tone:'s',why:'Falsch. Für jeden Berufsschultag im Urlaub gibt es einen weiteren Urlaubstag (§ 19 Abs. 3 JArbSchG).'}
 ],
 term:'Urlaub in den Ferien',def:'Der Urlaub soll in den Berufsschulferien liegen. Schultag im Urlaub = ein Urlaubstag mehr.',
 ihk:'Der Urlaub soll Berufsschülern in der Zeit der Berufsschulferien gegeben werden. Soweit er nicht in den Berufsschulferien gegeben wird, ist für jeden Berufsschultag, an dem die Berufsschule während des Urlaubs besucht wird, ein weiterer Urlaubstag zu gewähren (§ 19 Abs. 3 JArbSchG).',
 weil:'… weil der Urlaub für Berufsschüler in den Berufsschulferien liegen soll.'}
];

const SRCNAMES=['dem Jugendarbeitsschutzgesetz','dem Arbeitszeitgesetz','dem Bundesurlaubsgesetz','dem Mutterschutzgesetz','dem Elterngeldgesetz (BEEG)','dem Tarifvertragsgesetz','dem Streikrecht (Art. 9 GG)','dem Betriebsverfassungsgesetz','dem Grundgesetz (Art. 9)'];
function srcOf(sc){const id=sc.id;
  if(/^[db]\d|^j[12]$|^f[126]$/.test(id))return 0;if(id==='s1')return 1;if(id==='s4'||id==='s5')return 2;if(id==='s2')return 3;if(id==='s3')return 4;
  if(id==='t1'||id==='t2'||id==='t3'||id==='f3')return 5;if(id==='t4')return null;if(id==='t5')return 8;if(/^k\d|^f4$/.test(id))return 6;return 7}

/* ===== Spanisch (Sprachhilfe) ===== */
const ES_AGE=p=>p.a.age+' años';
const ES={
 d1:{m:'¡Hola Alex! Último empujón antes de Navidad. El sábado haces el turno de tarde hasta las 20:30. Y el domingo abrimos la tienda. Te necesito de 13 a 18 h. ¿Vale?',o:['¡Claro! En el comercio hay que ser flexible.',p=>`El sábado sí, pero solo hasta las 20 h. Y con ${ES_AGE(p)} no puedo trabajar en domingo, tampoco en un domingo con tiendas abiertas.`,'El sábado hasta las 20:30 está bien. Por el domingo solo quiero un día de descanso a cambio.'],t:'Descanso nocturno: los menores solo pueden trabajar entre las 6 y las 20 h.'},
 d2:{m:'Esta semana trabajas de lunes a viernes. Añadimos el sábado de 9 a 15 h. Es época de Navidad.',o:['Vale, seis días. Es solo una vez.','El sábado sí. Pero entonces necesito otro día libre en la misma semana.','¡Los aprendices menores de 18 no pueden trabajar los sábados!'],t:'Semana de cinco días: los menores trabajan como máximo cinco días por semana.'},
 d3:{m:'El 24 de diciembre abrimos hasta las 16 h. Te quedas hasta el cierre, ¿vale?',o:['Claro, me quedo hasta las 16 h.','Hasta las 14 h vengo con gusto. Después tengo que tener libre.','El 24 no trabajo nada. ¡Es festivo!'],t:'El 24 y el 31 de diciembre los menores tienen libre desde las 14 h.'},
 b1:{m:'¡Alex, aquí hay muchísimo trabajo! Terminas la escuela (KLA) a las 13:05. Ven a la caja de 14:30 a 18:30.',n:'Hoy Alex tuvo 6 horas de clase (07:55–13:05). Es el único día largo de escuela de la semana.',o:['Vale, voy ahora mismo.','Hoy tuve 6 horas de clase. El día cuenta como un día completo de trabajo. Hoy ya no puedo trabajar.','Después de la escuela nunca trabajo. ¡La escuela es la escuela!'],t:'Día de escuela: más de 5 horas de clase (1 vez por semana) = día completo de trabajo (8 horas).'},
 b2:{m:'El jueves solo tienes 4 horas de clase, hasta las 11:30. ¿Vienes después de 12:30 a 16:30?',o:['Sí, está permitido. Con 5 horas de clase como máximo puedo trabajar después. El tiempo de escuela cuenta como tiempo de trabajo.','¡No! Trabajar después de la escuela siempre está prohibido.','Claro. La escuela no cuenta como tiempo de trabajo. Puedo trabajar 8 horas más.'],t:'El tiempo de clase con pausas cuenta como tiempo de trabajo.'},
 b3:{m:'Hoy trabajas de 9:00 a 17:30. Haces la pausa cuando haya poco trabajo. ¿Quizás a las 15 h, 30 minutos?',o:['30 minutos a las 15 h está bien.','Necesito 60 minutos de pausa. La pausa tiene que empezar a las 13:30 como muy tarde.','Necesito una hora de pausa. Da igual cuándo.'],t:'Pausa: más de 4,5 a 6 h de trabajo: 30 min · más de 6 h: 60 min · nunca más de 4,5 h seguidas.'},
 s1:{m:'¡Feliz cumpleaños número 18! Ahora puedes quedarte hasta el cierre a las 21 h. Y mañana empiezas a las 6 h.',o:['Hasta las 21 h ahora sí. Pero después necesito 11 horas de descanso. Mañana puedo empezar a las 8 h como muy pronto.','No. Para los aprendices trabajar hasta las 21 h siempre está prohibido.','¡Genial! Entonces a partir de ahora hago turnos de 12 horas.'],t:'Ley de jornada laboral (desde los 18): máximo 8 h (hasta 10), 11 h de descanso.'},
 s2:{m:p=>`Svenja está embarazada de 6 meses. ${p.b.chef} dice que hoy tiene que apilar cajas de bebidas en el almacén. ¿Puede hacer eso?`,o:['No. Las embarazadas no pueden levantar cosas pesadas. Más de 5 kg de forma regular está prohibido.','Si se siente bien, es su problema.','No. Las embarazadas ya no pueden trabajar nada.'],t:'Protección de la maternidad: nada de trabajo pesado; 6 semanas antes y 8 semanas después del parto.'},
 s3:{m:p=>`Nuestro compañero Tom (30) va a ser padre. Quiere un año de permiso parental. ${p.b.chef} dice: «No lo autorizo». ¿Puede hacer eso?`,o:['No. El permiso parental no necesita autorización. Tom solo tiene que avisar a tiempo. Y está protegido contra el despido.','Sí. Sin el permiso del jefe no hay permiso parental.','No. Y el jefe tiene que pagarle la ayuda parental (Elterngeld).'],t:'Permiso parental: hasta 3 años por cada padre o madre, sin sueldo, con protección contra el despido.'},
 s4:{m:'Jana (19), de la caja, dice: «¡Según la ley tengo 30 días de vacaciones!». ¿Es verdad?',o:['No. La ley de vacaciones da como mínimo 24 días laborables. Muchas veces el convenio colectivo da más.','Sí, 30 días están en la ley.','No, tiene 24 días de trabajo.'],t:'Días laborables: de lunes a sábado. 24 días laborables = 20 días de trabajo con semana de 5 días.'},
 s5:{m:'Murat estuvo enfermo tres días en sus vacaciones, con certificado médico. Dice: «Esos tres días se han perdido». ¿Es verdad?',o:['No. Con certificado médico los días de enfermedad no cuentan como vacaciones.','Sí. Mala suerte, vacaciones son vacaciones.','No. Recupera los días también sin certificado.'],t:'Enfermo en vacaciones: con certificado médico los días no cuentan como vacaciones.'},
 t1:{m:p=>`¿Tú cobras ${p.b.vg} al mes? ¡Yo en el quiosco solo 724 €! Los dos estamos en el primer año. ¿Por qué?`,o:['Mi empresa está en la asociación de comercio. Allí vale el convenio colectivo. Tu quiosco no está en ninguna asociación. Allí solo vale la ley.','Quien está en el sindicato cobra automáticamente según el convenio. ¡Hazte socio!','Es que mi jefe me quiere más.'],t:'Vinculado al convenio: la empresa está en la asociación de empresarios. Entonces vale el convenio colectivo.'},
 t2:{m:p=>`Yo cobro 1.150 € en la tienda de moda. Tú en ${p.b.short} solo 724 €. ¡Hazte socio de ver.di, entonces tu jefe tiene que pagar según el convenio!`,o:['Eso no basta. Mi empresa no está en la asociación de comercio. Entonces solo vale la ley. Sería distinto si el convenio fuera de aplicación general.','¡Es verdad! Mañana me hago socio y cobro más.','El jefe tiene que pagarme el convenio de todas formas, está en la ley.'],t:'De aplicación general: el Ministerio de Trabajo declara un convenio obligatorio para todo el sector.'},
 t3:{m:'En tu contrato pone 30 días laborables de vacaciones. No hay más. ¿El convenio marco? Da igual, el contrato es el contrato.',o:['El convenio marco da 36 días laborables. Mi contrato no puede ser peor. Entonces valen 36.','Vale, el contrato es el contrato.','¡Entonces vale la ley y me tomo 40 días!'],t:'Principio de favorabilidad: solo se puede cambiar el convenio a favor de los trabajadores.'},
 t4:{m:'En la sala de descanso hay un papel: «Por trabajar después de las 20 h hay un 20 % de plus». ¿En qué contrato está algo así?',o:['En el convenio marco (Manteltarifvertrag). Regula jornada, vacaciones y pluses.','En el convenio salarial. Ahí se trata de dinero.','En la ley de protección de menores en el trabajo.'],t:'Convenio marco: regula jornada, vacaciones, plazos de despido, pluses y grupos salariales.'},
 t5:{m:'En las noticias: «Nueva ronda de negociación en el comercio». ¿Quién negocia ahí? ¿El Estado?',o:['No. El sindicato ver.di y la asociación de comercio negocian solos, sin el Estado. Eso se llama autonomía colectiva.','Sí, el gobierno fija los sueldos.','Eso lo hace el comité de empresa con el jefe.'],t:'Autonomía colectiva: las partes negocian solas, sin el Estado.'},
 k1:{m:'Merve y los demás van a parar dos horas. Huelga de advertencia, dice ver.di. Tú eres aprendiz: ¡te quedas en la caja!',n:'Las negociaciones siguen. El deber de paz ha terminado. Ver.di convoca. Aquí cuenta la razón: participar y seguir trabajando están permitidos.',o:['Participo. Ver.di convoca y se trata de mi convenio. Antes aviso a la señora Lüders.','Hoy trabajo, lo decido yo. Pero usted no me puede prohibir la huelga.','Vale. Los aprendices no pueden hacer huelga.'],t:'Huelga de advertencia: huelga corta durante las negociaciones, sin votación.'},
 k2:{m:'¡El jueves hay gran día de huelga con manifestación en Bremerhaven! Ven en lugar de ir a la escuela profesional.',o:['No. La escuela no es día de huelga. Tengo que ir a clase.','Claro, la huelga es más importante que la escuela.','No, de todas formas no puedo hacer huelga. No estoy en el sindicato.'],t:'Huelga: dejar de trabajar juntos para conseguir un objetivo. Después se sigue trabajando.'},
 k3:{m:'Participaste dos horas en la huelga y no eres socio de ver.di. ¿Ahora falta dinero en tu nómina? ¡Eso no puede hacerlo!',o:['Sí puede. Por el tiempo de huelga no hay sueldo. El dinero de huelga solo lo cobran los socios del sindicato.','Es verdad, voy a quejarme. El jefe tiene que pagar.','No pasa nada, ver.di me paga dinero de huelga.'],t:'Dinero de huelga: dinero de la caja de huelga, solo para socios del sindicato.'},
 k4:{m:'El nuevo convenio vale desde mayo. Aun así, las vacaciones me parecen pocas. ¡Hagamos huelga la semana que viene!',o:['No se puede. Mientras vale el convenio, hay deber de paz. Entonces no hay huelga.','¡Sí! Siempre se puede hacer huelga.','Se puede si el 75 % está de acuerdo.'],t:'Deber de paz: mientras vale el convenio, no hay huelga ni cierre patronal.'},
 k5:{m:'En el Frischemarkt de mi amigo mañana hay huelga de advertencia. Quédate tú también en casa, ¡es huelga!',o:['Una huelga necesita que el sindicato convoque en mi empresa. Aquí no hay convocatoria. Si no voy, falto sin justificación.','Claro, huelga es huelga.','Nunca puedo hacer huelga porque soy aprendiz.'],t:'Convocatoria de huelga: solo hay huelga si el sindicato la convoca.'},
 k6:{m:'En la radio: «La mediación en el comercio ha fracasado». ¿Qué pasa ahora?',o:['Ahora viene la votación (Urabstimmung). Si al menos el 75 % de los socios convocados está de acuerdo, empieza la huelga.','Ahora el Estado fija los sueldos.','Ahora empieza la huelga enseguida, sin votación.'],t:'Votación: los socios votan sobre una huelga. Hace falta al menos el 75 %.'},
 r1:{m:'A partir del lunes todos empiezan a las 7:30 en lugar de a las 8. Lo he decidido yo.',o:['El inicio y el fin de la jornada son cogestión. Sin el acuerdo del comité de empresa no vale.','Vale, entonces vengo antes.','Solo tiene que informar al comité de empresa. Entonces está bien.'],t:'Derecho de cogestión: el empleador solo puede actuar con el acuerdo del comité de empresa.'},
 r2:{m:'Hoy han despedido a Paul. El comité de empresa no sabía nada. ¿Puede ser válido?',o:['No. El comité de empresa tiene que ser escuchado antes de cada despido. Sin eso, el despido no es válido.','Sí. Los despidos los decide solo el jefe.','No. El comité de empresa puede prohibir cualquier despido.'],t:'Audiencia: antes de cada despido hay que escuchar al comité de empresa.'},
 r3:{m:p=>p.a.turns18?'En abril elegimos de nuevo el comité de empresa. Estás aquí desde agosto y tienes 18 años desde marzo. ¿Qué puedes hacer?':`En abril elegimos de nuevo el comité de empresa. Tienes ${ES_AGE(p)} y estás aquí desde agosto. ¿Qué puedes hacer?`,o:['Puedo votar, pero todavía no puedo ser elegido.','Puedo votar y ser elegido.','Como aprendiz no puedo participar.'],t:'Votar desde los 16. Ser elegido desde los 18 y después de 6 meses en la empresa.'},
 r4:{m:'El comité de empresa no está de acuerdo con la nueva cajera. Da igual, la contrato de todas formas.',o:['Para contratar necesita el acuerdo. Sin él tiene que ir al tribunal laboral.','Claro, usted es el jefe.','Entonces decide la comisión de conciliación.'],t:'Derecho de veto (nivel 3): contratar, trasladar, cambiar de grupo – sin acuerdo el jefe va al tribunal.'},
 r5:{m:'He oído que queréis elegir un comité de empresa. Somos demasiado pequeños. Y sin mi permiso aquí no pasa nada.',o:['Desde 5 trabajadores fijos con derecho a voto se puede elegir un comité. Somos 12. Usted no tiene que dar permiso.','Es verdad. Sin su permiso no se puede.','Votamos igual, y entonces el comité tiene 3 personas.'],t:'Comité de empresa: representa a los trabajadores ante el empleador. Posible desde 5 trabajadores con derecho a voto.'},
 r6:{m:'La señora Schulte, del comité de empresa, se ha enterado por el periódico de que en verano reforman la tienda. ¿Puede el jefe hacerlo así?',o:['No. En una reforma hay que informar a tiempo al comité de empresa. No se respetó el derecho a la información.','No. En una reforma el comité de empresa tiene que estar de acuerdo.','Sí. Eso no le importa al comité de empresa.'],t:'Derecho a la información (nivel 1): el empleador tiene que informar a tiempo y por completo.'},
 j1:{m:'Plan de vacaciones de verano: en julio tienen prioridad los empleados fijos con hijos. Tú tienes vacaciones en noviembre.',n:'Alex sabe: en julio hay vacaciones en la escuela profesional.',o:[p=>p.b.jav?'Voy a la JAV (representación de jóvenes y aprendices). Ella lo lleva al comité de empresa. Mis vacaciones deben estar en las vacaciones escolares (§ 19).':p.b.br?'Voy al comité de empresa. No tenemos JAV. Mis vacaciones deben estar en las vacaciones escolares (§ 19).':'Hablo con la señora Lüders: mis vacaciones deben estar en las vacaciones escolares (§ 19). Si no sirve, pregunto en la asesoría de formación de la Cámara de Comercio.','Noviembre también está bien. Lo importante es tener vacaciones.',p=>p.b.jav?'¡Que la JAV lo negocie directamente con usted!':'¡Entonces en julio me tomo libre y ya está!'],t:p=>p.b.jav?'JAV: representa a jóvenes y aprendices y trabaja con el comité de empresa.':'Las vacaciones deben darse en las vacaciones de la escuela profesional.'},
 j2:{m:'Alex, según la ley este año tienes 24 días laborables de vacaciones, como todos. ¿De acuerdo?',o:[p=>`No. Para mí vale la ley de protección de menores. El 1 de enero tenía ${p.a.age1} años. Entonces como mínimo ${p.a.urlaub} días laborables.`,p=>p.a.turns18?'Sí. Desde marzo tengo 18, entonces 24 días.':'Sí, 24 días está bien.','No. Los aprendices siempre tienen 30 días laborables.'],t:'Vacaciones de menores: edad el 1 de enero: menos de 16 → 30, menos de 17 → 27, menos de 18 → 25 días laborables.'},
 j3:{m:'Desde la JAV queremos proponer con el comité de empresa un acuerdo de empresa. ¿Qué puede ir dentro?',o:['Una hora de estudio por semana para todos los aprendices.','Un 5 % más de salario de formación que en el convenio.','La JAV lo firma sola con el jefe.'],t:'Acuerdo de empresa: contrato escrito entre empleador y comité de empresa. Vale para todos en la empresa.'},
 j4:{m:'El comité de empresa quiere una asamblea de empresa. Bien, pero después del trabajo y sin pagar.',o:['La asamblea de empresa es durante el horario de trabajo. El tiempo se paga.','Vale, entonces nos quedamos más tiempo.','¡Entonces invitamos también a clientes y a la prensa!'],t:'Asamblea de empresa: todos los trabajadores y el comité, una vez por trimestre, en horario de trabajo, no pública.'},
 j5:{m:'Aquí somos 5 aprendices. ¡Elijamos simplemente una JAV!',o:['Solo hay JAV si hay comité de empresa. Primero hay que elegir un comité de empresa.','Buena idea. Con 5 aprendices siempre se puede.','No se puede. Los aprendices no pueden tener representantes.'],t:'JAV: representación de jóvenes y aprendices – solo en empresas con comité de empresa.'},
 j6:{m:'En otoño elegimos otra vez la JAV. Sakowski tiene 26 años y todavía es aprendiz. ¿Puede votar?',o:['Votar no: solo votan los aprendices menores de 25. Pero sí puede ser elegido, porque está en formación.','Sí, todos los aprendices votan a la JAV.','No, y tampoco puede ser elegido.'],t:'Elección de la JAV: votan los menores de 18 y los aprendices menores de 25 · cada 2 años.'},
 e1:{m:'Tu evaluación está en tu expediente personal. Es confidencial. No puedes verla.',o:[p=>'Puedo ver mi expediente personal y añadir una declaración propia.'+(p.b.br?' Llevo a un miembro del comité de empresa.':''),'Vale, entonces no.','¡Entonces lo saco a escondidas de la oficina!'],t:'Ver el expediente: puedo leer mi expediente y añadir una declaración (§ 83).'},
 e2:{m:'Mañana trabajas en el almacén con la transpaleta. Seguro que ya sabes usarla.',n:'Nadie le ha explicado a Alex cómo funciona la transpaleta.',o:['Antes de empezar, alguien tiene que explicarme la transpaleta. Tengo derecho a ser informado.','Claro, lo pruebo y ya.','No trabajo en el almacén. Mi lugar es la venta.'],t:'Derecho a ser informado: el empleador me explica tareas, responsabilidad y peligros (§ 81).'},
 e3:{m:'Alex, desde hace semanas siempre te ponen en los turnos menos queridos. ¿No quieres decir nada?',o:['Sí. Me quejo a la dirección de la tienda. Eso no me puede traer desventajas.','Mejor no. Si no, habrá problemas.','Lo publico en Instagram, así lo ven todos.'],t:'Derecho de queja: puedo quejarme en la empresa sin desventajas (§ 84).'},
 e4:{m:'¿Entiendes tu nómina? Yo no entiendo nada de los descuentos.',o:['Puedo pedir que me expliquen la nómina. Es mi derecho a ser escuchado.','Eso solo lo puede preguntar el comité de empresa.','Da igual, lo importante es que llega el dinero.'],t:'Derecho a ser escuchado: puedo hacer propuestas y pedir que me expliquen mi sueldo (§ 82).'},
 f1:{m:'Alex, la inspección de trabajo ha revisado tu plan de turnos. Tú estabas de acuerdo. Entonces todo está bien, ¿no?',o:['No. La ley de protección de menores vale también si yo estoy de acuerdo. La próxima vez aviso enseguida.','Sí. Yo estaba de acuerdo, entonces estaba permitido.','¿Entonces ahora la culpa es mía? ¡Me voy!'],t:'Inspección de trabajo: controla si se cumple la ley de protección de menores.'},
 f2:{m:'Hoy en clase estabas muy cansado/a. Y tu jefe te vuelve a poner mal los turnos. ¿Quién te puede ayudar?',o:[p=>'Mi formadora, '+(p.b.br?(p.b.jav?'el comité de empresa o la JAV, ':'el comité de empresa, '):'')+'la asesoría de formación de la Cámara de Comercio o la inspección de trabajo.','Nadie. Tengo que aguantar.','El sindicato me escribe simplemente un plan de turnos nuevo.'],t:'Ayuda: formadora, comité de empresa o JAV, asesoría de la Cámara, sindicato, inspección de trabajo.'},
 f3:{m:'Aceptaste los 30 días del contrato. ¿Puedes pedir todavía los 36 días del convenio?',o:['Sí. La regla peor del contrato no es válida. Valen los 36 días laborables del convenio.','No. Quien acepta, mala suerte.','Solo si el jefe está de buen humor.'],t:'Principio de favorabilidad: solo se puede cambiar el convenio a favor de los trabajadores.'},
 f4:{m:p=>`La semana que viene hay otra huelga de advertencia. ${p.b.chef} dice: «Quien participe, a la calle». ¿Puede hacer eso?`,o:['No. Por participar en una huelga nadie puede recibir una amonestación ni ser despedido.','Sí. Entonces mejor nos quedamos todos dentro.','Sí. Para aprendices la huelga es motivo de despido.'],t:'Protección en la huelga: no hay amonestación ni despido por hacer huelga, pero tampoco sueldo por ese tiempo.'},
 f5:{m:'El jefe te ha puesto a las 7:30 desde el lunes, sin preguntar al comité de empresa. ¿Qué haces?',o:['Se lo digo a ustedes, el comité de empresa. Sin su acuerdo el cambio no vale. Mientras tanto vengo a las 8.','Vengo a las 7:30. Ya está decidido.','A partir de ahora no vengo nunca más.'],t:'Cogestión: sin el acuerdo del comité de empresa la medida no es válida.'},
 f6:{m:'El plan de vacaciones está colgado. Estás en noviembre. Pero en julio hay vacaciones escolares. ¿Ya es definitivo?',o:[p=>p.b.br?'No. En el plan de vacaciones decide también el comité de empresa. Pido ayuda '+(p.b.jav?'a la JAV y ':'')+'al comité. Mis vacaciones deben estar en las vacaciones escolares.':'Le pido: mis vacaciones deben estar en las vacaciones escolares (§ 19). Si no, pregunto en la asesoría de formación de la Cámara de Comercio.','Sí. Ahora es demasiado tarde.','Da igual. Si en noviembre hay escuela, el día de escuela cuenta como vacaciones.'],t:'Vacaciones en las vacaciones escolares. Día de escuela en vacaciones = un día más de vacaciones.'},
 c01:{m:'Hoy hay inventario. Todos se quedan hasta las 22 h, ¡tú también!',o:['A las 20 h me tengo que ir. Los menores solo pueden trabajar hasta las 20 h.','Vale, me quedo.','¡Me voy a casa ahora mismo!'],w:'Menores: solo de 6 a 20 h (§ 14).'},
 c02:{m:'Faltan dos personas. Hoy trabaja de 10 a 16 h sin pausa.',o:['Sin pausa no se puede. Después de 4,5 horas como máximo necesito una pausa.','Por esta vez está bien.','Entonces hoy no trabajo.'],w:'Nunca más de 4,5 horas sin pausa (§ 11).'},

/* Ziehen ohne Wiederholung pro Modus */
function draw(pool,n,key,r,challenge){
  if(challenge)return shuffle(pool,r).slice(0,n);
  const seen=new Set(ST.seen[key]||[]);
  let fresh=pool.filter(x=>!seen.has(x.id));
  let out=shuffle(fresh,r).slice(0,n);
  if(out.length<n){
    // Pool aufgebraucht: zurücksetzen
    const ids=new Set(pool.map(x=>x.id));
    ST.seen[key]=(ST.seen[key]||[]).filter(id=>!ids.has(id));
    ST.resetNote[key.split(':')[0]]=true;
    const rest=shuffle(pool.filter(x=>!out.includes(x)),r);
    out=out.concat(rest.slice(0,n-out.length));
  }
  return out;
}

function drawPersona(r,ch){
  let a,b;
  if(ch){a=ALEXES[Math.floor(r()*3)];b=BETRIEBE[Math.floor(r()*3)]}
  else{const fa=ALEXES.filter(x=>!ST.played.a.includes(x.id)),fb=BETRIEBE.filter(x=>!ST.played.b.includes(x.id));a=shuffle(fa.length?fa:ALEXES,r)[0];b=shuffle(fb.length?fb:BETRIEBE,r)[0]}
  return{a,b};

function buildClassic(mode,code,fixedP){
  const ch=mode==='challenge';let mods=MODSEL();
  if(ch){const m=/-(\d{1,2})$/.exec(code);if(m){const u=+m[1];if(u>=6&&u<=12)mods=Array.from({length:u-5},(_,i)=>6+i)}}
  const r=ch?mulberry(hashStr(code+'|'+mods.join(','))):Math.random;
  const p=fixedP||drawPersona(r,ch);
  const key=(mode==='challenge'?'klassik':mode)+':s';
  const areas=Object.keys(AREAS).filter(a=>mods.includes(AREAS[a].mod)).sort((x,y)=>AREAS[x].ord-AREAS[y].ord);
  let steps=[],used=new Set();
  const want=Math.max(6,areas.length);
  let round=0;
  while(steps.length<want&&round<4){
    for(const a of areas){
      if(steps.length>=want&&round>0)break;
      const cand=SCENES.filter(s=>s.area===a&&avail(s,p)&&!used.has(s.id));
      if(!cand.length)continue;
      const s=draw(cand,1,key,r,ch)[0];used.add(s.id);
      steps.push({t:'scene',sc:s,ord:AREAS[a].ord+round*.01});
    }
    round++;
  }
  // Mini-Spiele
  const nMini=mode==='krise'?1:2;
  let mk=Object.keys(MINIS).filter(k=>mods.includes(MINIS[k].mod)||(k==='urlaub'&&mods.includes(11))||(k==='wahl'&&mods.includes(11)));
  const mPool=mk.map(k=>({id:k}));
  draw(mPool,Math.min(nMini,mPool.length),mode==='challenge'?'klassik:mini':mode+':mini',r,ch).forEach(m=>{
    let o=MINIS[m.id].ord;if(m.id==='urlaub'&&!mods.includes(6))o=6.5;if(m.id==='wahl'&&!mods.includes(10))o=6.6;
    steps.push({t:'mini',k:m.id,ord:o,data:makeMini(m.id,r,p,mods,ch,mode)});
  });
  // Ereignisse
  const played=new Set(steps.filter(s=>s.t==='scene').map(s=>s.sc.area));
  const evc=EVENTS.filter(e=>mods.includes(e.mod)&&avail(e,p)&&(!e.need||played.has(e.need)));
  const nEv=mode==='krise'?1:2;
  draw(evc,Math.min(nEv,evc.length),(ch?'klassik':mode)+':ev',r,ch).forEach(e=>{
    const pl=[...played];const ar=e.at?AREAS[e.at].ord:e.need?AREAS[e.need].ord:AREAS[pl[Math.floor(r()*pl.length)]].ord;
    steps.push({t:'event',ev:e,ord:ar+.8});
  });
  if(mode==='krise'){
    const cc=CRISES.filter(c=>mods.includes(c.mod)&&avail(c,p));
    draw(cc,Math.min(3,cc.length),'krise:c',r,false).forEach(c=>{const ar=(Object.values(AREAS).find(a=>a.mod===c.mod)||{ord:3}).ord;steps.push({t:'crisis',cr:c,ord:ar+.7})});
  }
  steps.sort((x,y)=>x.ord-y.ord);
  const pq=PROFIS.filter(q=>mods.includes(q.mod));
  return{mode,challenge:ch,code:ch?code:null,r,p,mods,steps,i:0,wis:0,max:0,en:70,chef:60,jokers:mode==='profi'?1:3,log:[],choices:{},
    profiQ:draw(pq.length?pq:PROFIS,1,'profi:p',r,ch)[0],profi:mode==='profi'};
}
function buildQuiz(mode){

  if(mode==='blitz')qs=draw(pool,Math.min(10,pool.length),'blitz:q',r);
  else{const ih=pool.filter(q=>q.ihk),st=pool.filter(q=>!q.ihk);qs=draw(ih,Math.min(5,ih.length),'pruef:q',r).concat(draw(st,Math.min(8-Math.min(5,ih.length),st.length),'pruef:q',r))}

function buildHunt(){

function buildWdh(){
  const r=Math.random;let steps=[];

}

const hm=m=>{const h=Math.floor(m/60),mi=m%60;return`${h}:${String(mi).padStart(2,'0')}`};
function makeMini(k,r,p,mods,ch,mode){
  const key=(ch?'klassik':mode)+':mi';
  if(k==='treppe'){const c=draw(TREPPE,6,key,r,ch);return{items:c.map(x=>({id:x.id,t:x.t,a:x.k}))}}
  if(k==='dienst'){
    const slots=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag','24. Dezember'];
    let pick=[];const order=shuffle(slots,r);
    for(const d of order){if(pick.length>=6)break;const c=PLAN.filter(e=>e.day===d);pick.push(draw(c,1,key,r,ch)[0])}
    // Konflikt: Ausgleichstag Mittwoch
    if(pick.some(e=>e.id==='dp15'))pick=pick.filter(e=>e.day!=='Mittwoch');
    let wrong=pick.filter(e=>!e.ok).length;
    if(wrong<2){pick=pick.map(e=>{if(wrong>=2||!e.ok)return e;const alt=PLAN.find(x=>x.day===e.day&&!x.ok);if(alt){wrong++;return alt}return e})}
    pick.sort((x,y)=>slots.indexOf(x.day)-slots.indexOf(y.day));
    return{items:pick.map(e=>{const others=shuffle(Object.keys(PLANR).filter(x=>x!==e.r),r).slice(0,2);return{id:e.id,day:e.day,t:e.t,ok:e.ok,r:e.r,why:e.why,ropts:e.ok?shuffle(Object.keys(PLANR),r).slice(0,3):shuffle([e.r,...others],r)}})};
  }
  if(k==='pause'){
    const items=[];const Ws=shuffle([300,330,390,420,450],r).slice(0,2);const fh=x=>String(x).replace('.',',');
    Ws.forEach((W,i)=>{const S=420+Math.floor(r()*6)*30;const P=W>360?60:30;const E=S+W+P;
      items.push({id:'pa'+i,txt:`Alex (${p.a.age}) ist von ${hm(S)} bis ${hm(E)} Uhr im Laden. Davon sind ${fh(W/60)} Stunden reine Arbeitszeit.`,
        q1:{q:'Wie viel Pause braucht Alex?',o:['30 Minuten','60 Minuten','keine'],a:P===60?'60 Minuten':'30 Minuten',why:`${fh(W/60)} Stunden Arbeit: ${P===60?'mehr als 6 Stunden → 60 Minuten':'mehr als 4,5 bis 6 Stunden → 30 Minuten'} (§ 11).`},
        q2:{q:'Wann muss die erste Pause spätestens beginnen?',o:[hm(S+270)+' Uhr',hm(S+240)+' Uhr',hm(S+360)+' Uhr'],a:hm(S+270)+' Uhr',why:`${hm(S)} Uhr plus 4,5 Stunden = ${hm(S+270)} Uhr (§ 11).`}})});
    return{items};
  }
  if(k==='urlaub'){
    const items=[];const names=shuffle(['Emma','Ben','Leyla','Jonas','Mia','Noah','Sara','Elias'],r);
    const ages=shuffle([15,16,17,18,19],r).slice(0,4);
    ages.forEach((a1,i)=>{const near=r()<.35;const mon=near?1:2+Math.floor(r()*11),day=near?2+Math.floor(r()*3):1+Math.floor(r()*28);
      const by=2026-a1;const u=a1<16?30:a1<17?27:a1<18?25:24;
      items.push({id:'ur'+i,n:names[i],geb:`${String(day).padStart(2,'0')}.${String(mon).padStart(2,'0')}.${by}`,a1,u,why:a1>=18?`Am 1.1.2027 ist ${names[i]} ${a1}: Bundesurlaubsgesetz, 24 Werktage.`:`Am 1.1.2027 ist ${names[i]} ${a1}: ${u} Werktage (§ 19 JArbSchG).`+(near?` Der Geburtstag kurz nach Neujahr zählt erst nächstes Jahr.`:'')})});
    return{items};
  }
  if(k==='urab'){
    const N=600+Math.floor(r()*14)*100;const ratio=[.71,.73,.76,.78,.81][Math.floor(r()*5)];const J=Math.round(N*ratio);
    const R2=[.22,.24,.27,.31][Math.floor(r()*4)];const J2=Math.round(N*R2);

      {id:'ua1',q:`${N.toLocaleString('de-DE')} Mitglieder sind aufgerufen. ${J.toLocaleString('de-DE')} stimmen für den Streik. Wird gestreikt?`,o:['ja','nein'],a:ratio>=.75?'ja':'nein',why:`${J.toLocaleString('de-DE')} : ${N.toLocaleString('de-DE')} × 100 = ${(ratio*100).toFixed(1).replace('.',',')} %. Nötig sind mindestens 75 %.`},
      {id:'ua2',q:`Wie viele Ja-Stimmen braucht man bei ${N.toLocaleString('de-DE')} Aufgerufenen mindestens?`,o:shuffle([Math.ceil(N*.75),Math.ceil(N*.5),Math.ceil(N*.25)].map(x=>x.toLocaleString('de-DE')),r),a:Math.ceil(N*.75).toLocaleString('de-DE'),why:`${N.toLocaleString('de-DE')} × 0,75 = ${Math.ceil(N*.75).toLocaleString('de-DE')}.`},
      {id:'ua3',q:`Später gibt es ein Ergebnis. In der 2. Urabstimmung stimmen ${J2.toLocaleString('de-DE')} von ${N.toLocaleString('de-DE')} zu. Ist das Ergebnis angenommen?`,o:['ja','nein'],a:R2>=.25?'ja':'nein',why:`${(R2*100).toFixed(1).replace('.',',')} %. Für die Annahme reichen mindestens 25 %.`}
    ]};

  }

function react(sc,o,law,r){
  const role=(sc.from==='chef'||sc.from==='lueders')?'chef':'other';
  if(o.re)return o.re;
  let arr;if(role==='chef'){const L=REACT.chef[law];arr=L[o.tone]||L.s||L.n}else arr=REACT.other[law];
  return arr[Math.floor(r()*arr.length)];
}
function chefDelta(sc,o,law){if(o.chef!==undefined)return o.chef;if(sc.from!=='chef'&&sc.from!=='lueders')return 0;if(o.tone==='p')return -10;if(o.tone==='n')return 4;return law===2?-1:0}
function moodFrom(g){return g.en<30?'sad':g.chef<30?'angry':g.en>65&&g.chef>55?'happy':'ok'}
function stars(g){const q=g.max?g.wis/g.max:0;return q>=.85?3:q>=.6?2:q>=.35?1:0}
const noteIHK=pc=>pc>=92?'1 (sehr gut)':pc>=81?'2 (gut)':pc>=67?'3 (befriedigend)':pc>=50?'4 (ausreichend)':pc>=30?'5 (mangelhaft)':'6 (ungenügend)';

function fixWrongScene(sc,p){const n=ST.wrong.s.length;ST.wrong.s=ST.wrong.s.filter(w=>!(w.id===sc.id&&w.a===p.a.id&&w.b===p.b.id));if(ST.wrong.s.length<n)ST.fixed++}

function modeProgress(k){
  const mods=MODSEL();let pool=[],key='';
  if(k==='klassik'||k==='challenge'){pool=SCENES.filter(s=>mods.includes(AREAS[s.area].mod));key='klassik:s'}
  if(k==='profi'){pool=SCENES.filter(s=>mods.includes(AREAS[s.area].mod));key='profi:s'}
  if(k==='krise'){pool=CRISES.filter(c=>mods.includes(c.mod));key='krise:c'}
  if(k==='blitz'){pool=QS.filter(q=>mods.includes(q.mod));key='blitz:q'}
  if(k==='pruef'){pool=QS.filter(q=>mods.includes(q.mod));key='pruef:q'}
  if(k==='fehler'){pool=SCENES.filter(s=>mods.includes(AREAS[s.area].mod));key='fehler:s'}
  if(k==='wdh'){return{n:ST.wrong.s.length+ST.wrong.q.length,of:0}}
  const seen=new Set(ST.seen[key]||[]);return{n:pool.filter(x=>!seen.has(x.id)).length,of:pool.length};
}

function esT(id,f,p,i){if(!ST.es)return'';const e=ES[id];if(!e)return'';let v=e[f];if(v===undefined)return'';if(i!==undefined)v=v[i];v=V(v,p);return v?`<span class="es" lang="es">${esc(v)}</span>`:''}
function personFor(from,p){const P=PEOPLE[from]||PEOPLE.chef;return{n:P.n(p),role:P.role(p),face:V(P.face,p)}}

  if(S.phase==='typing')html+=`<div class="typing" aria-label="schreibt"><i></i><i></i><i></i></div>`;

    if(!isCr)html+=`<div class="term pop"><span class="eyebrow">Fachbegriff</span><b>${esc(V(sc.term,p))}</b><span>${esc(V(sc.def,p))}</span>${esT(sc.id,'t',p)}</div>`;
    else html+=`<div class="term pop"><span class="eyebrow">Die Regel</span><span>${esc(sc.why)}</span>${esT(sc.id,'w',p)}</div>`}
  html+=`</div>`;
  if(S.phase==='choose'){
    html+=`<div class="answers"><span class="hint">Eure Antwort:</span>${S.order.map(i=>{const o=sc.opts[i];const g=S.gone.includes(i);return`<button class="opt${g?' gone':''}" data-act="pick" data-v="${i}" aria-pressed="${S.sel===i}" ${g?'disabled':''}><span class="dot"></span><span>${esc(V(o.t,p))}${esT(sc.id,'o',p,i)}</span></button>`}).join('')}

function doSend(){
  const st=G.steps[G.i],sc=st.sc||st.cr,p=st.p||G.p,S=st.s;if(S.sel===null)return;
  const o=sc.opts[S.sel],law=V(o.law,p);S.law=law;S.tone=o.tone;
  if(G.profi&&law===2&&!st.cr){
    const others=shuffle(SCENES.filter(x=>x.area!==sc.area&&x.weil),G.r).slice(0,2).map(x=>x.weil);
    S.wcorrect=0;const all=[sc.weil,...others];const ord=shuffle([0,1,2],G.r);S.wopts=ord.map(i=>all[i]);S.wright=ord.indexOf(0);S.phase='weil';render();return}
  finishScene();
}
function finishScene(){
  const st=G.steps[G.i],sc=st.sc||st.cr,p=st.p||G.p,S=st.s;const o=sc.opts[S.sel],law=S.law;
  let pts=PTS[law];if(G.profi&&law===2&&!st.cr){pts=S.weil===S.wright?10:6}
  const dc=chefDelta(sc,o,law),de=(o.en||0)+(law===2?2:0);
  G.chef=clamp(G.chef+dc,0,100);G.en=clamp(G.en+de,0,100);G.wis+=pts;G.max+=10;
  G.lastD={chef:dc,en:de,wis:pts};
  if(sc.area)G.choices[sc.area]=law;
  st.res=law===2?'ok':'no';
  if(law<2){if(!st.cr)addWrongScene(sc,p)}else if(G.mode==='wdh'&&!st.cr)fixWrongScene(sc,p);
  G.log.push({type:st.cr?'crisis':'scene',sc,p,sel:S.sel,law,pts,weilOk:S.weil===undefined?null:S.weil===S.wright});
  markSeen((G.challenge?'klassik':G.mode)+(st.cr?':c':':s'),sc.id);if(st.cr)markSeen('krise:c',sc.id);
  if(law===0&&['klassik','krise','profi','challenge'].includes(G.mode)&&!st.cr){
    const F=FOLLOW.find(f=>f.after.includes(sc.id)&&avail(f,p)&&!(G.fuDone||[]).includes(f.id));
    if(F){G.fuDone=(G.fuDone||[]).concat(F.id);let j=-1;for(let k=G.i+1;k<G.steps.length;k++){if(G.steps[k].t==='scene'){j=k;break}}
      const at=j>=0?j+1:G.i+1;G.steps.splice(at,0,{t:'scene',sc:F,fu:true,ord:(G.steps[at-1]||st).ord+.001});}
  }
  S.re=react(sc,o,law,G.r);S.phase='typing';save();render();
  setTimeout(()=>{if(G&&G.steps[G.i]===st){S.phase='done';render()}},matchMedia('(prefers-reduced-motion: reduce)').matches?50:900);
}

  const s=stars(G),B=ST.badges,add=id=>{if(!B.includes(id)){B.push(id);G.newBadges=(G.newBadges||[]).concat(id)}};
  add('b1');if(ST.played.b.length>=3)add('b2');if(ST.played.a.length>=3)add('b3');

}

      ${law<2&&best?`<p class="better"><b>Besser:</b> „${esc(V(best.t,p))}“</p>`:''}
      ${o.tone==='p'&&law===2?'<p class="small mid-t">Inhaltlich richtig, aber pampig. Sachlich wirkt besser.</p>':''}
      ${sc.ihk?`<p class="ihk"><b>So steht es in der Prüfung:</b> ${esc(sc.ihk)}</p>`:''}</div>`}
    if(l.type==='q'&&!l.ok)return`<div class="rv"><div class="hd"><span class="mark no">✗</span><b>${esc(l.q.q)}</b></div><p class="better"><b>Richtig:</b> ${esc(l.q.o[l.q.a])}</p><p class="small">${esc(l.q.why)}</p>${l.q.ihk?`<p class="ihk">Aufgabe im Prüfungsstil</p>`:''}</div>`;
    if(l.type==='hunt'){const o=l.sc.opts[l.k];const best=l.sc.opts.find(x=>V(x.law,l.p)===2);return`<div class="rv"><div class="hd"><span class="mark ${l.pts>=10?'ok':'no'}">${l.pts>=10?'✓':'✗'}</span><b>${esc(l.sc.title)}</b></div><p class="small muted">Kim: „${esc(V(o.t,l.p))}“ – ${l.law===2?'stimmt':'stimmt nicht'}.</p>${l.law<2&&best?`<p class="better"><b>Richtig:</b> „${esc(V(best.t,l.p))}“</p>`:''}<p class="ihk">${esc(l.sc.ihk)}</p></div>`}
    if(l.type==='event')return`<div class="rv"><div class="hd"><span class="mark mid">!</span><b>Zufall: ${esc(l.ev.title)}</b></div><p class="small">${esc(l.txt||'')}</p></div>`;
    return'';
  }).join('');
  return items||'<p class="muted">Alles richtig – nichts nachzulesen.</p>';
}
function resultView(){
  finishGame();const quiz=G.mode==='blitz'||G.mode==='pruef';const pq=G.profiQ||PROFIS[Math.floor(Math.random()*PROFIS.length)];
  const nb=(G.newBadges||[]).map(id=>BADGES.find(b=>b.id===id)).filter(Boolean);
  return`<section class="stack"><div class="eyebrow">Auswertung</div><h2>${G.mode==='pruef'?'Euer Prüfungsergebnis':G.mode==='blitz'?'Blitzrunde geschafft':'Euer Azubi-Jahr'}</h2>${bonView()}
  ${nb.length?`<div class="card stack"><div class="eyebrow">Neues Abzeichen</div><div class="badges">${nb.map(b=>`<div class="badge">${badgeSvg(BADGES.indexOf(b))}<b>${esc(b.n)}</b><span class="muted">${esc(b.d)}</span></div>`).join('')}</div></div>`:''}
  ${roomStatus()}

  ${(G.mode==='pruef')?`<p class="note">Geschätzt nach dem IHK-Notenschlüssel: ${G.pc} % → Note ${esc(noteIHK(G.pc))}. In der echten Prüfung zählen alle Aufgaben zusammen.</p>`:''}
  <div class="eyebrow">Alle Entscheidungen</div><div class="rev">${reviewView()}</div>
  <div class="card stack"><div class="eyebrow">Prüfungskasten · so antwortet ihr in der IHK-Prüfung</div><p class="small">In der Prüfung werdet ihr mit „Sie“ angesprochen. Lest den Gesetzesauszug genau. Rechnet bei Zeiten immer: Beginn plus 4,5 Stunden. Beim Urlaub zählt das Alter am 1. Januar. Prüft bei Betriebsrat und JAV zuerst: Wie alt? Wie lange im Betrieb? Gibt es einen Betriebsrat?</p></div>
  <details class="wb"><summary>Für Profis: ${esc(pq.q)}</summary><p style="margin-top:8px">Überlegt erst zu zweit. Dann aufklappen:</p><details class="wb" style="margin-top:8px"><summary>Lösung zeigen</summary><p style="margin-top:6px">${esc(pq.a)}</p></details></details>
  <div class="stack">${quiz||G.mode==='fehler'||G.mode==='wdh'?`<button class="btn wide" data-act="again">Nochmal (neue Fragen)</button>`:`<button class="btn wide" data-act="again">Neuer Alex, neuer Betrieb</button><button class="btn ghost wide" data-act="same">Gleicher Alex – diesmal besser</button>`}<button class="btn ghost wide" data-act="home">Anderer Modus</button></div>
  <p class="small muted">Gespeichert nur auf diesem Gerät.</p></section>`;
}

/* ===== Rendern ===== */
function render(){
  renderBar();const m=$('#main');let h='';
  if(VIEW==='home')h=homeView();
  else if(VIEW==='persona')h=personaView();
  else if(VIEW==='result')h=resultView();
  else if(VIEW==='tafel')h=tafelView();
  else if(VIEW==='play'){const st=G.steps[G.i];
    if(!st){VIEW='result';return render()}
    if(st.t==='scene'||st.t==='crisis')h=sceneView(st,st.p||G.p);
    else if(st.t==='mini')h=miniView(st);
    else if(st.t==='event')h=eventView(st);
    else if(st.t==='q')h=qView(st);
    else if(st.t==='hunt')h=huntView(st);}
  m.innerHTML=h;const wr=document.querySelector('.wrap');if(wr)wr.style.maxWidth=VIEW==='tafel'?'1200px':'';if(VIEW==='tafel')renderTafelBody();
  if(VIEW==='play'){const st=G.steps[G.i];if(st&&st.t==='q'&&G.mode==='blitz'&&st.s&&st.s.ans===null&&!TIMER)startTimer();
    if(st&&st.t==='q'&&G.mode==='blitz'&&st.s&&st.s.ans!==null)musStop();
    if(st&&st.t!=='q')musStop();}
  G&&(G.lastD=G.lastD);
}
function go(v){VIEW=v;render();window.scrollTo({top:0,behavior:'instant'in window?'instant':'auto'})}
function startMode(k,code){
  ST.team=($('#team')?.value||ST.team||'').trim();save();
  if(k==='profi'&&!ST.profi)return;
  if(k==='wdh'&&!(ST.wrong.s.length+ST.wrong.q.length))return;
  if(k==='klassik'||k==='krise'||k==='profi'||k==='challenge'){G=buildClassic(k,code||'');ST8={};go('persona');return}
  if(k==='blitz'||k==='pruef')G=buildQuiz(k);
  if(k==='fehler')G=buildHunt();
  if(k==='wdh')G=buildWdh();
  if(!G.steps.length){G=null;return}
  go('play');
}
const ACT={
 rsrc(v){const R=G.steps[G.i].s.rr;if(R.done)return;R.a=+v;render()},
 rrule(v){const R=G.steps[G.i].s.rr;if(R.done)return;R.b=v;render()},
 rcheck(){const st=G.steps[G.i],R=st.s.rr;R.done=true;const ok=(R.src===null||R.a===R.src)&&R.b===R.right;G.max+=2;if(ok)G.wis+=2;G.lastD={wis:ok?2:0};G.log.push({type:'role',ok,sc:st.sc});save();render()},
 es(){ST.es=!ST.es;save();render()},
 roles(_,el){G.roles=!!el.checked;render()},
 tafel(){go('tafel')},
 music(){ST.music=!ST.music;save();if(ST.music){musCtx();if(MUS.ctx&&MUS.ctx.state==='suspended')MUS.ctx.resume();if(VIEW==='play'&&G&&G.mode==='blitz')musStart(1);else musTusch()}else musStop();renderBar()},
 home(){stopTimer();musStop();G=null;HOMEX={};go('home')},
 upto(v){ST.upto=+v;save();render()},
 only(_,el){ST.only=!!el.checked;save();render()},
 mode(v){startMode(v)},
 daycode(v){const c=$('#code');if(c)c.value=v},
 challenge(){const c=($('#code')?.value||'').trim().toUpperCase();const tag=$('[data-act=daycode]')?.dataset.v;startMode('challenge',c||tag)},
 tcode(){const c=($('#tcode')?.value||'').trim().toUpperCase();if(c==='JAV'){ST.profi=true;save();render()}else{const t=$('#tcode');if(t){t.value='';t.placeholder='Code stimmt nicht'}}},
 reset(){HOMEX.reset=true;render()},resetno(){HOMEX.reset=false;render()},
 resetyes(){const m=ST.music;ST=JSON.parse(JSON.stringify(DEF));ST.music=m;save();HOMEX={};render()},
 flip(){ST8.flip=true;render()},
 startplay(){go('play')},
 pick(v){const S=G.steps[G.i].s;if(S.phase!=='choose'||S.gone.includes(+v))return;S.sel=+v;render()},
 joker(){const st=G.steps[G.i],S=st.s,p=st.p||G.p;if(G.jokers<=0)return;const sc=st.sc;const bad=S.order.filter(i=>V(sc.opts[i].law,p)===0&&!S.gone.includes(i)&&i!==S.sel);if(!bad.length)return;S.gone.push(bad[0]);G.jokers--;S.jokerTxt=`Eine falsche Antwort ist weg. Nachlesen: ${AREAS[sc.area].book}.`;render()},
 send(){doSend()},
 weil(v){const S=G.steps[G.i].s;S.weil=+v;finishScene()},
 next(){G.lastD=null;stopTimer();G.i++;if(G.i>=G.steps.length){go('result');return}render();const ph=document.querySelector('#main');ph&&ph.scrollIntoView({block:'start'})},
 mans(v){const st=G.steps[G.i],S=st.s;if(S.checked)return;const [id,a]=v.split('|');S.ans[id]=a;if(st.k==='dienst'&&a==='ok')delete S.rs[id];render()},
 mres(v){const st=G.steps[G.i],S=st.s;if(S.checked)return;const [id,a]=v.split('|');S.rs[id]=a;render()},
 mcheck(){miniCheck()},
 qans(v){qAnswer(+v)},
 hj(v){const S=G.steps[G.i].s;if(S.done)return;S.j=v;if(v==='ok')S.fix=null;render()},
 hf(v){const S=G.steps[G.i].s;if(S.done)return;S.fix=+v;render()},
 hcheck(){huntCheck()},
 again(){const k=G.mode,c=G.code;if(k==='challenge'){startMode('klassik');return}startMode(k,c)},
 same(){const k=G.mode==='challenge'?'klassik':G.mode,p=G.p;G=buildClassic(k,'',p);ST8={flip:true};go('persona')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.getAttribute('aria-disabled')==='true')return;if(b.disabled)return;const a=b.dataset.act;if(ACT[a]){if(b.tagName==='INPUT'&&b.type==='checkbox'){ACT[a](b.dataset.v,b);return}e.preventDefault();ACT[a](b.dataset.v,b)}});
document.addEventListener('input',e=>{if(e.target.id==='team'){ST.team=e.target.value;save()}if(e.target.id==='nA'||e.target.id==='nB'){ST.names=[$('#nA')?.value||'',$('#nB')?.value||''];save()}});
function boot(){load();try{localStorage.setItem(KEY+'_t','1');localStorage.removeItem(KEY+'_t')}catch(e){STORE_OK=false}
  if(!ST.upto)ST.upto=12;initRoom();if(PRM.get('tafel')==='1')VIEW='tafel';render()}

/* ===== Klassen-Ranking am Beamer (MQTT wie Popcorn-Börse) ===== */
const PRM=new URLSearchParams(location.search);
const LOCAL=PRM.get('bc')==='1';
const BROKERS=PRM.get('broker')?[PRM.get('broker')]:['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt'];
const NS='ladenschluss1/';
function rnd(n){const a='abcdefghijkmnpqrstuvwxyz23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s}
function codeGen(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(5));for(const x of r)s+=a[x%a.length];return s}
const cleanS=(s,m)=>String(s==null?'':s).replace(/[\u0000-\u001f\u007f​-‏‪-‮]/g,' ').trim().slice(0,m);
class Net{
  constructor(onMsg,onStatus){this.cid='l'+rnd(10);this.seen=new Map();this.onMsg=onMsg;const st=()=>onStatus(this.count());
    try{this.links=LOCAL?[new LocalLink(this.cid,(t,p,r)=>this.recv(t,p,r),st)]:BROKERS.map(u=>new MqttLink(u,this.cid,(t,p,r)=>this.recv(t,p,r),st))}catch(e){this.links=[]}}
  count(){return{up:this.links.filter(l=>l.up).length,all:this.links.length}}
  recv(t,p,r){if(p&&typeof p==='object'&&p.mid){if(this.seen.has(p.mid))return;this.seen.set(p.mid,Date.now());if(this.seen.size>3000)this.seen.clear()}this.onMsg(t,p,r)}
  sub(t){this.links.forEach(l=>l.subscribe(NS+t))}
  pub(t,obj,retain){obj.mid=rnd(12);let ok=false;this.links.forEach(l=>{if(l.publish(NS+t,obj,retain))ok=true});return ok}
}
/* --- Handy: Ergebnis an die Tafel senden --- */
let ROOM=null,NET=null,NETUP=false,GOT=new Set(),RESEND=null;
function initRoom(){
  const s=cleanS(PRM.get('s'),8).toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(s){ROOM=s;ST.room=s;const c=cleanS(PRM.get('c'),16).toUpperCase();if(c)ST.preCode=c;const m=+PRM.get('m');if(m>=6&&m<=12){ST.upto=m;ST.only=false}save()}
  else if(ST.room&&LOCAL)ROOM=ST.room;
  if(!ROOM)return;
  NET=new Net((t,p)=>{if(t===NS+ROOM+'/st'&&p&&Array.isArray(p.got)){p.got.forEach(g=>GOT.add(g));if((ST.pend||[]).some(x=>GOT.has(x.gid))){ST.pend=(ST.pend||[]).filter(x=>!GOT.has(x.gid));save();if(VIEW==='result'||VIEW==='home')render()}}},c=>{NETUP=c.up>0;if(VIEW==='home')renderRoomNote()});
  NET.sub(ROOM+'/st');
  RESEND=setInterval(sendPending,2500);
}
function queueResult(){
  if(!ROOM||!G)return;const gid=rnd(10);G.gid=gid;
  ST.pend=(ST.pend||[]).concat({gid,team:cleanS(ST.team||'Team ohne Namen',24),mode:G.mode,pc:G.pc||0,chef:Math.round(G.chef),en:Math.round(G.en),stars:stars(G),code:G.code||''});save();sendPending();
}
function sendPending(){if(!NET)return;(ST.pend||[]).forEach(r=>NET.pub(ROOM+'/in',Object.assign({k:'res'},r)))}
function roomStatus(){if(!ROOM||!G||!G.gid)return'';const done=GOT.has(G.gid);return`<p class="note">${done?'An die Klassen-Tafel gesendet.':'Wird an die Klassen-Tafel gesendet …'+(NETUP?'':' (noch keine Verbindung)')}</p>`}
function renderRoomNote(){const el=document.getElementById('roomnote');if(el)el.innerHTML=roomNoteHtml()}
function roomNoteHtml(){return ROOM?`<span class="dotc${NETUP?' on':''}"></span>Verbunden mit der Klassen-Tafel <b class="mono">${esc(ROOM)}</b>${NETUP?'':' – verbindet …'}. Eure Ergebnisse erscheinen am Beamer.`:''}

/* --- Tafel (Lehrkraft, Beamer) --- */
const TKEY=KEY+'_tafel';let T=null,TNET=null,TUP=0,TPUB=null;
function tLoad(){try{T=JSON.parse(localStorage.getItem(TKEY))}catch(e){T=null}if(!T||!T.code)T={code:codeGen(),url:'',res:{},sort:'pc',mod:ST.upto||12,cc:''};}
function tSave(){try{localStorage.setItem(TKEY,JSON.stringify(T))}catch(e){}}
function tStart(){
  tLoad();if(TNET)return;
  TNET=new Net((t,p)=>{if(t!==NS+T.code+'/in'||!p||p.k!=='res')return;const gid=cleanS(p.gid,12);if(!gid)return;
    const modes=MODES.map(m=>m.k);const r={team:cleanS(p.team,24)||'Team',mode:modes.includes(p.mode)?p.mode:'klassik',pc:clamp(+p.pc||0,0,100),chef:clamp(+p.chef||0,0,100),en:clamp(+p.en||0,0,100),stars:clamp(+p.stars||0,0,3),code:cleanS(p.code,16),t:Date.now()};
    const isNew=!T.res[gid];T.res[gid]=r;tSave();tPub();if(isNew&&VIEW==='tafel')renderTafelBody()},c=>{TUP=c.up;if(VIEW==='tafel')renderTafelBody()});
  TNET.sub(T.code+'/in');tPub();TPUB=setInterval(tPub,5000);
}
function tPub(){if(!TNET)return;TNET.pub(T.code+'/st',{got:Object.keys(T.res).slice(-300)},true)}
function joinUrl(){
  const q='?s='+T.code+(T.cc?'&c='+encodeURIComponent(T.cc):'')+'&m='+T.mod+(LOCAL?'&bc=1':'')+(PRM.get('broker')?'&broker='+encodeURIComponent(PRM.get('broker')):'');
  if(location.protocol.startsWith('http')&&!/claude\.ai|claudeusercontent/.test(location.host))return location.origin+location.pathname+q;
  if(T.url){const u=T.url.trim();return u.split('?')[0]+q}
  return'';
}
function drawQR(canvas,text){const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!text||typeof QRLib==='undefined'){ctx.fillStyle='#777';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText('Adresse fehlt',canvas.width/2,canvas.height/2);return}
  const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
  ctx.fillStyle='#000';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell)}
function tafelView(){
  tStart();const tag=TAGWORDS[(new Date().getDate()+new Date().getMonth()*31)%TAGWORDS.length]+'-'+T.mod;
  return`<section class="tafel"><div class="card stack"><div class="eyebrow">Klassen-Ranking · Tafel</div><h2>Scannt den Code</h2><canvas id="qr" width="600" height="600" aria-label="QR-Code zum Spiel"></canvas>
   <div><span class="small muted">Tafel-Code</span><div class="bigcode">${esc(T.code)}</div></div><p class="small" id="tconn"></p>
   ${!joinUrl()?`<label class="small" for="turl">Adresse der Spieldatei im Netz (z. B. GitHub Pages)</label><input type="text" id="turl" value="${esc(T.url||'')}" placeholder="https://…/WiSo-Module-6-12-Ladenschluss.html"><button class="btn ghost" data-act="turl">Adresse übernehmen</button>`:`<p class="small muted mono" style="overflow-wrap:anywhere">${esc(joinUrl())}</p>`}
   <label class="small" for="tmod">Die Handys starten mit „bis Modul …“</label><select id="tmod" style="min-height:44px;border-radius:10px;padding:6px">${[6,7,8,9,10,11,12].map(m=>`<option value="${m}" ${m===T.mod?'selected':''}>Modul ${m}</option>`).join('')}</select>
   <label class="check"><input type="checkbox" id="tcc" data-act="tcc" ${T.cc?'checked':''}> Klassen-Challenge-Code mitschicken${T.cc?`: <b class="mono">${esc(T.cc)}</b>`:` (${esc(tag)})`}</label>
   <p class="small muted">Das Ranking braucht Internet und die Datei aus dem Ordner (z. B. über GitHub Pages). Im privaten Claude-Link sind Verbindungen gesperrt.</p></div>
   <div class="card stack" id="tbody"></div></section>`;
}
function renderTafelBody(){
  const b=document.getElementById('tbody');if(!b)return;const c=document.getElementById('tconn');if(c)c.innerHTML=`<span class="dotc${TUP?' on':''}"></span>${TUP?'verbunden':'keine Verbindung'}`;
  const best={};Object.values(T.res).forEach(r=>{const k=r.team.toLowerCase();const o=best[k];if(!o){best[k]=Object.assign({n:1},r);return}o.n++;if(r.pc>o.pc||(r.pc===o.pc&&r.chef>o.chef))Object.assign(o,r,{n:o.n})});
  const rows=Object.values(best).sort((a,b)=>T.sort==='chef'?(b.chef-a.chef||b.pc-a.pc):(b.pc-a.pc||b.chef-a.chef));
  b.innerHTML=`<div class="row"><h2>Ranking</h2><span class="sp"></span><div class="seg"><button data-act="tsort" data-v="pc" aria-pressed="${T.sort==='pc'}">nach Wissen</button><button data-act="tsort" data-v="chef" aria-pressed="${T.sort==='chef'}">nach Chef</button></div></div>
  ${rows.length?`<div style="overflow-x:auto"><table class="rank"><thead><tr><th>#</th><th>Team</th><th>Modus</th><th class="n">Wissen</th><th class="n">Chef</th><th class="n">Energie</th><th>Sterne</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i<3?'top':''}"><td>${i+1}</td><td><b>${esc(r.team)}</b>${r.n>1?` <span class="small muted">(${r.n} Spiele)</span>`:''}</td><td>${esc(MODES.find(m=>m.k===r.mode)?.n||r.mode)}</td><td class="n">${r.pc} %</td><td class="n">${r.mode==='blitz'||r.mode==='pruef'||r.mode==='fehler'?'–':r.chef+' %'}</td><td class="n">${r.mode==='blitz'||r.mode==='pruef'||r.mode==='fehler'?'–':r.en+' %'}</td><td>${'★'.repeat(r.stars)}${'☆'.repeat(3-r.stars)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Noch keine Ergebnisse. Sobald ein Team fertig ist, erscheint es hier.</p>'}
  <p class="small muted">Pro Team zählt das beste Ergebnis. Fragt beim Vergleich: Wer hatte viel Wissen und trotzdem einen zufriedenen Chef?</p>
  ${HOMEX.tnew?`<div class="confirm"><b>Neue Sitzung starten?</b><span class="small">Neuer Code, Ranking wird geleert.</span><div class="row"><button class="btn ghost" data-act="tnewno">Abbrechen</button><button class="btn" style="background:var(--bad);color:#fff" data-act="tnewyes">Ja, neu</button></div></div>`:`<button class="btn ghost" data-act="tnew">Neue Sitzung</button>`}`;
  const q=document.getElementById('qr');if(q)drawQR(q,joinUrl());
}
Object.assign(ACT,{
 turl(){T.url=cleanS($('#turl')?.value,300);tSave();render()},
 tmod(_,el){},
 tcc(_,el){T.cc=el.checked?TAGWORDS[(new Date().getDate()+new Date().getMonth()*31)%TAGWORDS.length]+'-'+T.mod:'';tSave();render()},
 tsort(v){T.sort=v==='chef'?'chef':'pc';tSave();renderTafelBody()},
 tnew(){HOMEX.tnew=true;renderTafelBody()},tnewno(){HOMEX.tnew=false;renderTafelBody()},
 tnewyes(){HOMEX.tnew=false;if(TNET){clearInterval(TPUB);TNET.links.forEach(l=>{try{l.ws&&l.ws.close()}catch(e){}});TNET=null}T={code:codeGen(),url:T.url,res:{},sort:'pc',mod:T.mod,cc:''};tSave();render()}
});
document.addEventListener('change',e=>{if(e.target.id==='tmod'){T.mod=+e.target.value;if(T.cc)T.cc=T.cc.replace(/-\d+$/,'-'+T.mod);tSave();render()}});

boot();
