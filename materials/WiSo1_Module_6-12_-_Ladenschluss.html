<style>
body{margin:0}
/* Layout: eine Spalte wie ein Azubi-Handy – oben Statusleiste mit drei Balken, darunter Laden-Szene, darunter Chat-Verlauf; Auswertung als Kassenbon */
:root{
  --bg:#e6edeb; --surface:#ffffff; --surface2:#f1f5f4; --ink:#11282b; --muted:#4c6164; --line:#c5d3d1;
  --teal:#0d6a64; --on-teal:#ffffff; --tag:#ffd23f; --on-tag:#2b2100;
  --bin:#ffffff; --bout:#d6f0ea; --sys:#eef3f2;
  --good:#1d7a46; --bad:#c0392b; --mid:#9a6400; --good-bg:#dcf1e4; --bad-bg:#fbe3e0; --mid-bg:#f8edd3;
  --paper:#fbfaf5; --on-paper:#1f2222; --phone:#13262a; --on-phone:#e8f2f0;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1719; --surface:#142326; --surface2:#1a2d31; --ink:#e2eeec; --muted:#9fb5b3; --line:#2c4246;
  --teal:#4fc2b6; --on-teal:#04201d; --tag:#f0c43a; --on-tag:#241b00;
  --bin:#1b3034; --bout:#164640; --sys:#17292c;
  --good:#5fd08f; --bad:#f08a7c; --mid:#e8c15c; --good-bg:#153527; --bad-bg:#3f211d; --mid-bg:#3a3018;
  --paper:#f2efe6; --on-paper:#1f2222; --phone:#050c0d; --on-phone:#e8f2f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1719; --surface:#142326; --surface2:#1a2d31; --ink:#e2eeec; --muted:#9fb5b3; --line:#2c4246;
  --teal:#4fc2b6; --on-teal:#04201d; --tag:#f0c43a; --on-tag:#241b00;
  --bin:#1b3034; --bout:#164640; --sys:#17292c;
  --good:#5fd08f; --bad:#f08a7c; --mid:#e8c15c; --good-bg:#153527; --bad-bg:#3f211d; --mid-bg:#3a3018;
  --paper:#f2efe6; --on-paper:#1f2222; --phone:#050c0d; --on-phone:#e8f2f0; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--phone)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.08;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,8.5vw,3.4rem)}
h2{font-size:clamp(1.35rem,5vw,1.8rem)}
h3{font-size:1.15rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)} .small{font-size:.9rem} .mono{font-family:var(--mono)}
.stack{display:grid;gap:12px} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}

/* Statusleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--phone);color:var(--on-phone)}
.bar .in{max-width:720px;margin:0 auto;display:grid;gap:6px}
.bar .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:6px;white-space:nowrap}
.brand svg{width:24px;height:24px}
.clock{font-family:var(--mono);font-size:.85rem;opacity:.85;white-space:nowrap}
.ib{display:inline-flex;align-items:center;gap:5px;border:1.5px solid rgba(255,255,255,.28);background:transparent;color:var(--on-phone);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.82rem;cursor:pointer;min-height:32px}
.ib svg{width:16px;height:16px}
.ib[aria-pressed="true"]{background:var(--tag);color:var(--on-tag);border-color:transparent}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meter{display:grid;gap:2px;min-width:0}
.meter .lab{display:flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter .lab svg{width:13px;height:13px;flex:none}
.meter .lab b{margin-left:auto;font-family:var(--mono);font-weight:600}
.meter .tr{height:7px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden}
.meter .fi{height:100%;border-radius:4px;transition:width .6s ease}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}
.steps i.ok{background:#5fd08f}.steps i.no{background:#f08a7c}.steps i.mi{background:#9fd8d0}.steps i.now{background:var(--tag)}
.delta{display:inline-block;font-family:var(--mono);font-weight:600;font-size:.8rem;padding:0 6px;border-radius:6px;margin-left:4px}
.delta.up{background:var(--good-bg);color:var(--good)}.delta.dn{background:var(--bad-bg);color:var(--bad)}

main{padding-top:16px;display:grid;gap:16px;overflow-x:clip}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.eyebrow{font-family:var(--mono);font-weight:600;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.lead{color:var(--muted)}
.btn{border:none;background:var(--teal);color:var(--on-teal);font-weight:700;font-size:1.05rem;padding:13px 20px;border-radius:14px;cursor:pointer;min-height:50px;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.tag{background:var(--tag);color:var(--on-tag)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);font-weight:700;font-size:.85rem}
.chip.tag{background:var(--tag);color:var(--on-tag);border-color:transparent}
input[type=text]{width:100%;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 12px;min-height:48px}

/* Hero */
.hero{display:grid;gap:14px;padding-top:6px}
.hero .kicker{font-family:var(--mono);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1 .q{color:var(--teal)}
.heroart{border-radius:var(--r);overflow:hidden;border:1.5px solid var(--line)}
.heroart>svg,.scene>svg{display:block;width:100%;height:auto}
.scene{border-radius:var(--r);overflow:hidden;border:1.5px solid var(--line);background:#16353a}

/* Module */
.mods{display:flex;gap:6px;flex-wrap:wrap}
.mods button{min-width:48px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-weight:700;cursor:pointer;display:grid;place-items:center;line-height:1.1;padding:4px 8px}
.mods button small{font-weight:400;font-size:.68rem;color:var(--muted)}
.mods button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal);border-color:transparent}
.mods button[aria-pressed="true"] small{color:inherit;opacity:.85}
.check{display:flex;gap:8px;align-items:center;font-size:.95rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--teal)}

/* Modus-Karten */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;cursor:pointer;display:grid;gap:4px;align-content:start;min-height:128px}
.mode:hover{border-color:var(--teal)}
.mode svg{width:30px;height:30px;color:var(--teal)}
.mode b{font-family:var(--display);font-size:1.08rem}
.mode span{font-size:.86rem;color:var(--muted);line-height:1.35}
.mode .pg{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:4px}
.mode .pg i{display:block;height:100%;background:var(--teal)}
.mode .nw{position:absolute;top:10px;right:10px;font-size:.7rem;font-weight:700;background:var(--tag);color:var(--on-tag);border-radius:999px;padding:1px 7px}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.mode.lock::after{content:"gesperrt";position:absolute;top:10px;right:10px;font-size:.7rem;font-weight:700;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
@media (min-width:640px){.modes{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* Persona-Karte */
.turn{animation:turn .6s ease both}
@keyframes turn{from{transform:perspective(900px) rotateY(80deg);opacity:.2}to{transform:none;opacity:1}}
.flip{perspective:1000px}
.flip .inner{position:relative;transition:transform .7s;transform-style:preserve-3d;min-height:360px}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);padding:18px;display:grid;gap:10px;align-content:start}
.flip .back{transform:rotateY(180deg)}
.flip .front{place-items:center;align-content:center;background:var(--teal);color:var(--on-teal);text-align:center}
.pcard{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.pcard svg{width:96px;height:96px}
.facts{display:grid;gap:4px;padding:0;margin:0;list-style:none}
.facts li{display:flex;gap:8px;align-items:baseline}
.facts li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--teal);flex:none;transform:translateY(-1px)}
.sign{display:inline-block;font-family:var(--display);font-weight:800;color:#fff;padding:4px 10px;border-radius:8px}

/* Chat */
.phone{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;min-width:0}
.ph-head{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--surface2);border-bottom:1.5px solid var(--line)}
.ph-head svg{width:42px;height:42px;flex:none}
.ph-head b{display:block;line-height:1.2}
.ph-head small{color:var(--muted)}
.thread{padding:14px;display:grid;gap:10px;background:
  radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1.5px) 0 0/18px 18px,var(--surface)}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.bub.in{background:var(--bin);border:1.5px solid var(--line);border-bottom-left-radius:4px;justify-self:start}
.bub.out{background:var(--bout);border-bottom-right-radius:4px;justify-self:end}
.bub.sys{justify-self:center;max-width:94%;background:var(--sys);border:1.5px dashed var(--line);font-size:.92rem;color:var(--muted);text-align:center;border-radius:12px}
.bub .tm{display:block;font-family:var(--mono);font-size:.7rem;color:var(--muted);text-align:right;margin-top:2px}
.typing{justify-self:start;background:var(--bin);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.answers{display:grid;gap:8px;padding:12px 14px 14px;border-top:1.5px solid var(--line);background:var(--surface2)}
.answers .hint{font-size:.85rem;color:var(--muted);font-weight:700}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 13px;cursor:pointer;min-height:50px;display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--bout)}
.opt[aria-pressed="true"] .dot{border-color:var(--teal);background:radial-gradient(circle,var(--teal) 45%,transparent 50%)}
.opt.gone{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.opt[disabled]{cursor:default}
.term{border-radius:14px;background:var(--tag);color:var(--on-tag);padding:12px 14px;display:grid;gap:2px}
.term .eyebrow{color:var(--on-tag);opacity:.8}
.term b{font-family:var(--display);font-size:1.15rem}

/* Mini-Spiele */
.mini-item{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.mini-item .lbl{font-family:var(--mono);font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:44px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface2);font-weight:700;cursor:pointer;padding:6px 10px;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal);border-color:transparent}
.seg button.right{outline:3px solid var(--good)}
.mini-item.ok{border-color:var(--good);background:var(--good-bg)}
.mini-item.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{font-size:.92rem}

.ok-t{color:var(--good)}.no-t{color:var(--bad)}.mid-t{color:var(--mid)}
.bon{background:var(--paper);color:var(--on-paper);font-family:var(--mono);font-size:.88rem;line-height:1.5;padding:22px 18px 16px;max-width:420px;width:100%;justify-self:center;position:relative;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) bottom/16px 10px repeat-x;
          mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) bottom/16px 10px repeat-x;
  box-shadow:0 10px 30px rgba(0,0,0,.18)}
.bon .c{text-align:center}
.bon .big{font-size:1.15rem;font-weight:600;letter-spacing:.04em}
.bon hr{border:none;border-top:1.5px dashed #9a9a92;margin:8px 0}
.bon .ln{display:flex;gap:6px}
.bon .ln span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bon .stars{font-size:1.5rem;letter-spacing:.2em;text-align:center}
.bon svg{display:block;margin:8px auto 0;width:80%;height:46px}
.rev{display:grid;gap:10px}
.rv{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;background:var(--surface)}
.rv .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:700;flex:none}
.mark.ok{background:var(--good-bg);color:var(--good)}.mark.mid{background:var(--mid-bg);color:var(--mid)}.mark.no{background:var(--bad-bg);color:var(--bad)}
.ihk{border-left:4px solid var(--teal);background:var(--surface2);padding:8px 10px;border-radius:0 10px 10px 0;font-size:.92rem}
.better{font-size:.93rem}
details.wb{border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface)}
details.wb summary{cursor:pointer;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{display:grid;justify-items:center;text-align:center;gap:4px;padding:8px;border-radius:12px;border:1.5px solid var(--line);font-size:.78rem;background:var(--surface)}
.badge svg{width:44px;height:44px}
.badge.off{opacity:.38;filter:grayscale(1)}
.timer{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--tag);transition:width .25s linear}
.note{font-size:.9rem;padding:10px 12px;border-radius:12px;background:var(--mid-bg);color:var(--ink)}
.confirm{border:1.5px solid var(--bad);background:var(--bad-bg);border-radius:12px;padding:12px;display:grid;gap:8px}
.walk{animation:walk 2.4s ease-in-out both}
@keyframes walk{from{transform:translateX(-60px)}to{transform:none}}
.pop{animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.es{display:block;margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);font-style:italic;font-size:.9em;color:var(--muted)}
.term .es{color:var(--on-tag);opacity:.85;border-color:rgba(0,0,0,.2)}
.roles{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 14px;font-size:.85rem;background:var(--sys);border-bottom:1.5px solid var(--line)}
.frame{background:var(--surface);border:1.5px dashed var(--teal);border-radius:12px;padding:10px 12px;line-height:1.6}
.gap{background:var(--tag);color:var(--on-tag);border-radius:6px;padding:0 6px;font-weight:700}
/* Tafel (Beamer) */
.tafel{max-width:1200px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.tafel{grid-template-columns:340px minmax(0,1fr)}}
.tafel canvas{width:100%;max-width:300px;height:auto;border-radius:12px;background:#fff;display:block}
.rank{width:100%;border-collapse:collapse;font-size:1.05rem}
.rank th,.rank td{padding:8px 10px;border-bottom:1.5px solid var(--line);text-align:left}
.rank td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.rank tr.top td{background:var(--mid-bg)}
.bigcode{font-family:var(--mono);font-size:2.2rem;font-weight:600;letter-spacing:.12em}
.dotc{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px}.dotc.on{background:var(--good)}
.tafel .card{align-content:start}.tafel .card>.btn{justify-self:start}

</style>

  {t:'Heute hatte ich 6 Stunden Schule. Der Tag zählt wie ein voller Arbeitstag. Ich darf heute nicht mehr arbeiten.',law:2,tone:'s',why:'Richtig. Einmal pro Woche zählt ein Schultag mit mehr als 5 Unterrichtsstunden als voller Arbeitstag (§ 9).'},
  {t:'Nach der Schule arbeite ich nie. Schule ist Schule!',law:1,tone:'p',why:'Teilweise. Heute stimmt es. Aber nach einem kurzen Schultag (bis 5 Stunden) darfst du danach arbeiten (§ 9).'}
 ],
 term:'Berufsschultag',def:'Mehr als 5 Stunden Schule (1-mal pro Woche) = voller Arbeitstag mit 8 Stunden.',
 ihk:'Jugendliche dürfen an einem Berufsschultag mit mehr als fünf Unterrichtsstunden von mindestens je 45 Minuten einmal in der Woche nicht beschäftigt werden. Dieser Tag wird mit acht Stunden angerechnet (§ 9 JArbSchG).',
 weil:'… weil ein Schultag mit mehr als 5 Unterrichtsstunden einmal pro Woche als voller Arbeitstag zählt.'},
{id:'b2',area:'m6b',from:'chef',title:'Kurzer Schultag',
 msg:p=>`Donnerstag hast du nur 4 Stunden Schule, bis 11:30 Uhr. Kommst du danach von 12:30 bis 16:30 Uhr?`,
 opts:[
  {t:'Ja, das ist erlaubt. Bei höchstens 5 Stunden Schule darf ich danach arbeiten. Die Schulzeit zählt als Arbeitszeit mit.',law:2,tone:'s',why:'Richtig. Nach einem kurzen Schultag darfst du arbeiten. Die Unterrichtszeit mit Pausen wird auf die Arbeitszeit angerechnet (§ 9).'},
  {t:'Nein! Nach der Schule ist Arbeiten immer verboten.',law:0,tone:'p',why:'Falsch. Nur nach einem Schultag mit mehr als 5 Stunden (einmal pro Woche) darfst du nicht mehr arbeiten (§ 9).'},
  {t:'Klar. Schule zählt ja nicht als Arbeitszeit. Ich kann danach noch 8 Stunden machen.',law:0,tone:'n',en:-10,why:'Falsch. Die Unterrichtszeit mit Pausen wird auf die Arbeitszeit angerechnet (§ 9). Mehr als 8 Stunden am Tag sind verboten (§ 8).'}
 ],
 term:'Anrechnung',def:'Die Unterrichtszeit mit Pausen zählt als Arbeitszeit.',
 ihk:'Die Unterrichtszeit einschließlich der Pausen wird auf die Arbeitszeit angerechnet (§ 9 JArbSchG).',
 weil:'… weil die Unterrichtszeit mit Pausen auf die Arbeitszeit angerechnet wird.'},
{id:'b3',area:'m6b',from:'chef',title:'Pause, wenn es ruhig ist',
 msg:p=>`Du arbeitest heute von 9:00 bis 17:30 Uhr. Pause machst du, wenn es ruhig ist. Vielleicht um 15 Uhr, 30 Minuten?`,
 opts:[
  {t:'30 Minuten um 15 Uhr sind okay.',law:0,tone:'n',en:-12,why:'Falsch. Bei mehr als 6 Stunden Arbeit brauchst du 60 Minuten Pause. Und du darfst höchstens 4,5 Stunden am Stück arbeiten (§ 11).'},
  {t:'Ich brauche 60 Minuten Pause. Die Pause muss spätestens um 13:30 Uhr anfangen.',law:2,tone:'s',why:'Richtig. Mehr als 6 Stunden Arbeit: 60 Minuten Pause. 9:00 Uhr plus 4,5 Stunden = spätestens 13:30 Uhr (§ 11).'},
  {t:'Ich brauche eine Stunde Pause. Wann, ist egal.',law:1,tone:'s',why:'Teilweise. 60 Minuten stimmen. Aber du darfst nie länger als 4,5 Stunden ohne Pause arbeiten. Die Pause muss also spätestens um 13:30 Uhr anfangen (§ 11).'}
 ],
 term:'Ruhepause',def:'Mehr als 4,5 bis 6 Std. Arbeit: 30 Min. · mehr als 6 Std.: 60 Min. · nie mehr als 4,5 Std. am Stück.',
 ihk:'Länger als viereinhalb Stunden hintereinander dürfen Jugendliche nicht ohne Ruhepause beschäftigt werden (§ 11 JArbSchG). Bei mehr als sechs Stunden Arbeitszeit beträgt die Pause 60 Minuten.',
 weil:'… weil Jugendliche bei mehr als 6 Stunden Arbeit 60 Minuten Pause brauchen und nie länger als 4,5 Stunden am Stück arbeiten.'},
/* ---------- Modul 7: Sozialer Arbeitsschutz ---------- */
{id:'s1',area:'m7',from:'chef',title:'Endlich 18',cond:p=>p.a.turns18,
 msg:p=>`Alles Gute zum 18.! Ab jetzt kannst du ja bis Ladenschluss um 21 Uhr bleiben. Morgen fängst du dann um 6 Uhr an.`,
 opts:[
  {t:'Bis 21 Uhr geht jetzt. Aber danach brauche ich 11 Stunden Ruhezeit. Morgen kann ich frühestens um 8 Uhr anfangen.',law:2,tone:'s',why:'Richtig. Ab 18 gilt das Arbeitszeitgesetz. Die 20-Uhr-Grenze fällt weg. Zwischen Feierabend und Arbeitsbeginn liegen aber mindestens 11 Stunden Ruhezeit (ArbZG § 5).'},
  {t:'Nein. Für Azubis ist Arbeit bis 21 Uhr immer verboten.',law:0,tone:'p',why:'Falsch. Mit 18 gilt nicht mehr das JArbSchG, sondern das Arbeitszeitgesetz. Eine Grenze um 20 Uhr gibt es dann nicht mehr.'},
  {t:'Super! Dann mache ich ab jetzt auch 12-Stunden-Schichten.',law:0,tone:'n',en:-15,why:'Falsch. Auch Erwachsene dürfen höchstens 10 Stunden am Tag arbeiten (ArbZG § 3). Und morgen um 6 Uhr wären nur 9 Stunden Ruhezeit.'}
 ],
 term:'Arbeitszeitgesetz',def:'Gilt ab 18: höchstens 8 Std. (bis 10), 11 Std. Ruhezeit.',
 ihk:'Für Beschäftigte ab 18 Jahren gilt das Arbeitszeitgesetz: Die werktägliche Arbeitszeit darf 8 Stunden nicht überschreiten (bis 10 Stunden mit Ausgleich). Nach Beendigung der täglichen Arbeitszeit ist eine ununterbrochene Ruhezeit von mindestens 11 Stunden einzuhalten.',
 weil:'… weil ab 18 das Arbeitszeitgesetz gilt: keine 20-Uhr-Grenze mehr, aber 11 Stunden Ruhezeit.'},
{id:'s2',area:'m7',from:'merve',title:'Kisten für Svenja',
 msg:p=>`Svenja ist im 6. Monat schwanger. ${p.b.chef} sagt, sie soll heute im Lager Getränkekisten stapeln. Darf der das?`,
 opts:[
  {t:'Nein. Schwangere dürfen keine schweren Sachen heben – regelmäßig mehr als 5 kg ist verboten.',law:2,tone:'s',why:'Richtig. Das Mutterschutzgesetz verbietet schwere körperliche Arbeit.'},
  {t:'Wenn sie sich fit fühlt, ist das ihre Sache.',law:0,tone:'n',why:'Falsch. Schwere körperliche Arbeit ist für Schwangere verboten, auch wenn sie sich fit fühlen (MuSchG).'},
  {t:'Nein. Schwangere dürfen überhaupt nicht mehr arbeiten.',law:1,tone:'s',why:'Teilweise. Die Kisten sind verboten. Aber Schwangere dürfen arbeiten. Die Schutzfrist beginnt erst 6 Wochen vor der Geburt.'}
 ],
 term:'Mutterschutz',def:'Keine schweren Arbeiten, Schutzfrist 6 Wochen vor und 8 Wochen nach der Geburt.',
 ihk:'Werdende Mütter dürfen nicht mit schweren körperlichen Arbeiten beschäftigt werden, z. B. regelmäßig Lasten von mehr als 5 kg heben (MuSchG).',
 weil:'… weil das Mutterschutzgesetz schwere körperliche Arbeit für Schwangere verbietet.'},
{id:'s3',area:'m7',from:'merve',title:'Elternzeit für Tom',
 msg:p=>`Unser Kollege Tom (30) wird Vater. Er will ein Jahr Elternzeit. ${p.b.chef} sagt: „Das genehmige ich nicht.“ Kann der das?`,
 opts:[
  {t:'Nein. Elternzeit braucht keine Zustimmung. Tom muss sie nur rechtzeitig anmelden. Und er hat Kündigungsschutz.',law:2,tone:'s',why:'Richtig. Der Arbeitgeber muss nicht zustimmen, er muss nur rechtzeitig informiert werden (BEEG).'},
  {t:'Ja. Ohne Zustimmung vom Chef gibt es keine Elternzeit.',law:0,tone:'n',why:'Falsch. Elternzeit muss nicht genehmigt werden. Sie wird rechtzeitig angemeldet (BEEG).'},
  {t:'Nein. Und der Chef muss Tom dann das Elterngeld zahlen.',law:1,tone:'s',why:'Teilweise. Die Elternzeit stimmt. Aber das Elterngeld beantragt man bei der Elterngeldstelle, nicht beim Arbeitgeber.'}
 ],
 term:'Elternzeit',def:'Bis zu 3 Jahre je Elternteil, unbezahlt, mit Kündigungsschutz.',
 ihk:'Arbeitnehmer haben Anspruch auf Elternzeit bis zur Vollendung des dritten Lebensjahres des Kindes. Während der Elternzeit besteht besonderer Kündigungsschutz (§ 18 BEEG).',
 weil:'… weil Elternzeit nur angemeldet und nicht genehmigt werden muss.'},
{id:'s4',area:'m7',from:'merve',title:'Urlaub für Jana',
 msg:p=>`Jana (19) aus der Kasse sagt: „Laut Gesetz habe ich 30 Tage Urlaub!“ Stimmt das?`,
 opts:[
  {t:'Nein. Das Bundesurlaubsgesetz gibt mindestens 24 Werktage. Mehr steht oft im Tarifvertrag.',law:2,tone:'s',why:'Richtig. 24 Werktage sind das Minimum (BUrlG § 3). Tarifverträge geben oft mehr.'},
  {t:'Ja, 30 Tage stehen im Gesetz.',law:0,tone:'n',why:'Falsch. Das Gesetz gibt Erwachsenen mindestens 24 Werktage. 30 Werktage haben nur Jugendliche unter 16.'},
  {t:'Nein, sie hat 24 Arbeitstage.',law:1,tone:'s',why:'Teilweise. Die Zahl 24 stimmt, aber es sind Werktage (Montag bis Samstag). Bei einer 5-Tage-Woche sind das 20 Arbeitstage.'}
 ],
 term:'Werktage',def:'Montag bis Samstag. 24 Werktage = 20 Arbeitstage bei 5-Tage-Woche.',
 ihk:'Der Urlaub beträgt jährlich mindestens 24 Werktage. Als Werktage gelten alle Kalendertage, die nicht Sonn- oder gesetzliche Feiertage sind (§ 3 BUrlG).',
 weil:'… weil das Bundesurlaubsgesetz Erwachsenen mindestens 24 Werktage gibt.'},
{id:'s5',area:'m7',from:'merve',title:'Krank im Urlaub',
 msg:p=>`Murat war im Urlaub drei Tage krank, mit Attest vom Arzt. Er sagt: „Die drei Tage sind halt weg.“ Stimmt das?`,
 opts:[
  {t:'Nein. Mit Attest werden die Krankheitstage nicht auf den Urlaub angerechnet.',law:2,tone:'s',why:'Richtig. Wer im Urlaub krank wird und ein Attest vorlegt, behält die Urlaubstage (BUrlG § 9).'},
  {t:'Ja. Pech gehabt, Urlaub ist Urlaub.',law:0,tone:'n',why:'Falsch. Mit ärztlichem Attest zählen die Krankheitstage nicht als Urlaub (BUrlG § 9).'},
  {t:'Nein. Er bekommt die Tage auch ohne Attest zurück.',law:1,tone:'s',why:'Teilweise. Er bekommt die Tage zurück, aber nur mit ärztlichem Attest (BUrlG § 9).'}
 ],
 term:'Krankheit im Urlaub',def:'Mit Attest zählen die Krankheitstage nicht als Urlaub.',
 ihk:'Erkrankt ein Arbeitnehmer während des Urlaubs, so werden die durch ärztliches Zeugnis nachgewiesenen Tage der Arbeitsunfähigkeit auf den Jahresurlaub nicht angerechnet (§ 9 BUrlG).',
 weil:'… weil Krankheitstage mit ärztlichem Attest nicht auf den Urlaub angerechnet werden.'},
/* ---------- Modul 8: Tarifvertrag ---------- */
{id:'t1',area:'m8',from:'tom',title:'Warum verdienst du mehr?',cond:p=>p.b.tarif,
 msg:p=>`Du bekommst ${p.b.vg} im Monat? Ich im Kiosk nur 724 €! Wir sind doch beide im 1. Jahr. Warum?`,
 opts:[
  {t:'Mein Betrieb ist im Handelsverband. Da gilt der Tarifvertrag. Dein Kiosk ist in keinem Verband. Da gilt nur das Gesetz.',law:2,tone:'s',why:'Richtig. Tarifgebundene Betriebe zahlen den Tarif. Ohne Tarifvertrag gilt nur die gesetzliche Mindestvergütung.'},
  {t:'Wer in der Gewerkschaft ist, bekommt automatisch Tarif. Tritt einfach ein!',law:0,tone:'s',why:'Falsch. Auch der Arbeitgeber muss tarifgebunden sein. Die Mitgliedschaft allein reicht nicht.'},
  {t:'Mein Chef mag mich halt mehr.',law:0,tone:'p',why:'Falsch. Der Unterschied kommt vom Tarifvertrag. Der gilt, weil dein Betrieb im Arbeitgeberverband ist.'}
 ],
 term:'tarifgebunden',def:'Der Betrieb ist im Arbeitgeberverband. Dann gilt der Tarifvertrag.',
 ihk:'Die Rechtsnormen des Tarifvertrags gelten unmittelbar und zwingend zwischen den beiderseits Tarifgebundenen (§ 4 Abs. 1 TVG). Ohne Tarifvertrag gelten nur die gesetzlichen Mindestregeln.',
 weil:'… weil der Tarifvertrag nur gilt, wenn der Betrieb im Arbeitgeberverband ist.'},
{id:'t2',area:'m8',from:'lina',title:'Ich will auch Tarif',cond:p=>!p.b.tarif,
 msg:p=>`Ich bekomme im Modehaus 1.150 €. Du bei ${p.b.short} nur 724 €. Tritt doch in ver.di ein, dann muss dein Chef Tarif zahlen!`,
 opts:[
  {t:'Das reicht nicht. Mein Betrieb ist nicht im Handelsverband. Dann gilt nur das Gesetz. Anders wäre es, wenn der Tarifvertrag allgemeinverbindlich wäre.',law:2,tone:'s',why:'Richtig. Beide Seiten müssen tarifgebunden sein – oder der Tarifvertrag wird für allgemeinverbindlich erklärt.'},
  {t:'Stimmt! Morgen trete ich ein, dann bekomme ich mehr.',law:0,tone:'n',why:'Falsch. Ist der Arbeitgeber nicht tarifgebunden, reicht die Mitgliedschaft allein nicht.'},
  {t:'Der Chef muss mir sowieso Tarif zahlen, das steht im Gesetz.',law:0,tone:'p',why:'Falsch. Das Gesetz gibt nur Mindestregeln, z. B. die Mindestausbildungsvergütung.'}
 ],
 term:'allgemeinverbindlich',def:'Das Arbeitsministerium erklärt einen Tarifvertrag für die ganze Branche verbindlich.',
 ihk:'Ein Tarifvertrag gilt zwingend, wenn Arbeitgeber und Arbeitnehmer tarifgebunden sind. Das Bundesministerium für Arbeit und Soziales kann einen Tarifvertrag auf Antrag für allgemeinverbindlich erklären.',
 weil:'… weil ein Tarifvertrag nur gilt, wenn beide Seiten tarifgebunden sind oder er allgemeinverbindlich ist.'},
{id:'t3',area:'m8',from:'chef',title:'30 Tage – mehr gibt es nicht',cond:p=>p.b.tarif,
 msg:p=>`In deinem Arbeitsvertrag stehen 30 Werktage Urlaub. Mehr gibt es nicht. Der Manteltarifvertrag? Egal, Vertrag ist Vertrag.`,
 opts:[
  {t:'Der Manteltarifvertrag gibt 36 Werktage. Mein Vertrag darf nicht schlechter sein. Also gelten 36.',law:2,tone:'s',why:'Richtig. Günstigkeitsprinzip: Der Arbeitsvertrag darf vom Tarif nur zugunsten der Beschäftigten abweichen.'},
  {t:'Okay, Vertrag ist Vertrag.',law:0,tone:'n',why:'Falsch. Ein Arbeitsvertrag, der schlechter ist als der Tarif, ist an dieser Stelle unwirksam (Günstigkeitsprinzip).'},
  {t:'Dann gilt eben das Gesetz, und ich nehme 40 Tage!',law:0,tone:'p',why:'Falsch. Das Gesetz gibt weniger. Hier gilt der Tarifvertrag mit 36 Werktagen.'}
 ],
 term:'Günstigkeitsprinzip',def:'Abweichen vom Tarif ist nur zugunsten der Beschäftigten erlaubt.',
 ihk:'Abweichende Abmachungen sind nur zulässig, soweit sie durch den Tarifvertrag gestattet sind oder eine Änderung der Regelungen zugunsten des Arbeitnehmers enthalten (§ 4 Abs. 3 TVG).',
 weil:'… weil der Arbeitsvertrag nicht schlechter sein darf als der Tarifvertrag.'},
{id:'t4',area:'m8',from:'merve',title:'Der Zettel im Pausenraum',
 msg:p=>`Im Pausenraum hängt ein Zettel: „Für Arbeit nach 20 Uhr gibt es 20 % Zuschlag.“ In welchem Vertrag steht so etwas?`,
 opts:[
  {t:'Im Manteltarifvertrag. Der regelt Arbeitszeit, Urlaub und Zuschläge.',law:2,tone:'s',why:'Richtig. Zuschläge für Nacht-, Sonn- und Feiertagsarbeit stehen im Manteltarifvertrag.'},
  {t:'Im Entgelttarifvertrag. Da geht es um Geld.',law:0,tone:'s',why:'Falsch. Der Entgelttarifvertrag regelt die Höhe der Löhne je Gehaltsgruppe. Zuschläge stehen im Manteltarifvertrag.'},
  {t:'Im Jugendarbeitsschutzgesetz.',law:0,tone:'s',why:'Falsch. Das Gesetz regelt Schutzvorschriften, keine Zuschläge.'}
 ],
 term:'Manteltarifvertrag',def:'Regelt Arbeitszeit, Urlaub, Kündigungsfristen, Zuschläge, Gehaltsgruppen. Läuft mehrere Jahre.',
 ihk:'Der Manteltarifvertrag beinhaltet Angaben zur wöchentlichen Arbeitszeit und zum Urlaubsanspruch. Die Höhe der Vergütungen legt der Lohn- und Gehaltstarifvertrag fest.',
 weil:'… weil Arbeitszeit, Urlaub und Zuschläge im Manteltarifvertrag stehen.'},
{id:'t5',area:'m8',from:'tom',title:'Wer verhandelt das?',
 msg:p=>`In den Nachrichten: „Neue Tarifrunde im Einzelhandel.“ Wer verhandelt da eigentlich? Der Staat?`,
 opts:[
  {t:'Nein. Die Gewerkschaft ver.di und der Handelsverband verhandeln allein, ohne den Staat. Das heißt Tarifautonomie.',law:2,tone:'s',why:'Richtig. Tarifautonomie: Die Tarifpartner handeln Tarifverträge ohne staatlichen Einfluss aus.'},
  {t:'Ja, die Regierung legt die Löhne fest.',law:0,tone:'s',why:'Falsch. Der Staat legt nur den Mindestlohn fest. Tarife handeln die Tarifpartner aus.'},
  {t:'Das macht der Betriebsrat mit dem Chef.',law:0,tone:'s',why:'Falsch. Der Betriebsrat schließt Betriebsvereinbarungen. Tarifverträge schließen Gewerkschaft und Arbeitgeberverband.'}
 ],
 term:'Tarifautonomie',def:'Die Tarifpartner verhandeln selbstständig, ohne den Staat.',
 ihk:'Tarifautonomie bedeutet, dass die Tarifvertragsparteien ohne staatlichen Einfluss Tarifverträge abschließen können (Art. 9 Abs. 3 GG).',
 weil:'… weil Gewerkschaft und Arbeitgeberverband die Tarifverträge ohne den Staat aushandeln.'},
/* ---------- Modul 9: Streik ---------- */
{id:'k1',area:'m9',from:'chef',title:'Warnstreik vor der Tür',cond:p=>p.b.tarif,
 msg:p=>`Merve und die anderen legen gleich zwei Stunden die Arbeit nieder. Warnstreik, sagt ver.di. Du bist Azubi – du bleibst schön an der Kasse!`,
 note:'Die Tarifverhandlungen laufen. Die Friedenspflicht ist vorbei. Ver.di ruft auf. Hier zählt die Begründung – mitmachen und weiterarbeiten sind beide erlaubt.',
 opts:[
  {t:'Ich mache mit. Ver.di ruft auf und es geht um meinen Tarifvertrag. Ich melde mich vorher bei Frau Lüders ab.',law:2,tone:'s',chef:-3,why:'Richtig. Azubis dürfen sich an einem Warnstreik beteiligen, wenn es um ihren Tarifvertrag geht – auch ohne Mitgliedschaft. Für die Streikzeit gibt es keine Vergütung.'},
  {t:'Ich arbeite heute – das entscheide ich selbst. Verbieten können Sie mir den Streik aber nicht.',law:2,tone:'s',chef:0,why:'Richtig. Weiterarbeiten ist erlaubt. Wichtig: Der Chef kann dir die Teilnahme nicht verbieten.'},
  {t:'Okay. Azubis dürfen ja sowieso nicht streiken.',law:0,tone:'n',why:'Falsch begründet. Azubis dürfen streiken, wenn die Gewerkschaft aufruft und es um ihren Tarifvertrag geht.'}
 ],
 term:'Warnstreik',def:'Kurzer Streik während der Verhandlungen, ohne Urabstimmung.',
 ihk:'Während der Tarifverhandlungen kann die Gewerkschaft nach Ende der Friedenspflicht zu Warnstreiks aufrufen. Auch Auszubildende dürfen sich beteiligen, wenn es um ihre Ausbildungsvergütung geht.',
 weil:'… weil Azubis streiken dürfen, wenn die Gewerkschaft aufruft und es um ihren Tarifvertrag geht.'},
{id:'k2',area:'m9',from:'merve',title:'Demo statt Schule?',cond:p=>p.b.tarif,
 msg:p=>`Donnerstag ist großer Streiktag mit Demo in Bremerhaven! Komm doch mit, statt in die Berufsschule zu gehen.`,
 opts:[
  {t:'Nein. Berufsschule ist kein Streiktag. Ich muss zur Schule.',law:2,tone:'s',why:'Richtig. Der Unterricht gehört nicht zum Arbeitskampf. Die Schulpflicht bleibt.'},
  {t:'Klar, Streik geht vor Schule.',law:0,tone:'n',why:'Falsch. Berufsschule ist kein Streiktag. Wer fehlt, fehlt unentschuldigt.'},
  {t:'Nein, ich darf eh nicht streiken. Ich bin ja nicht in der Gewerkschaft.',law:1,tone:'s',why:'Teilweise. Zur Schule gehen ist richtig. Aber für einen Streik musst du kein Mitglied sein.'}
 ],
 term:'Streik',def:'Gemeinsame Arbeitsniederlegung, um ein Ziel durchzusetzen. Danach geht die Arbeit weiter.',
 ihk:'Der Besuch der Berufsschule ist kein Teil des Arbeitskampfes. Auszubildende müssen am Berufsschulunterricht teilnehmen.',
 weil:'… weil der Berufsschulunterricht nicht zum Arbeitskampf gehört.'},
{id:'k3',area:'m9',from:'tom',title:'Weniger Geld?',cond:p=>p.b.tarif,
 msg:p=>`Du hast beim Warnstreik zwei Stunden mitgemacht und bist nicht in ver.di. Jetzt fehlt Geld auf der Abrechnung? Das darf der nicht!`,
 opts:[
  {t:'Doch. Für die Streikzeit gibt es keine Vergütung. Streikgeld bekommen nur Gewerkschaftsmitglieder.',law:2,tone:'s',why:'Richtig. Wer streikt, bekommt für diese Zeit keinen Lohn. Streikgeld gibt es nur für Mitglieder.'},
  {t:'Stimmt, ich beschwere mich. Der Chef muss zahlen.',law:0,tone:'p',why:'Falsch. Für die Streikzeit muss der Betrieb nicht zahlen.'},
  {t:'Kein Problem, ver.di zahlt mir Streikgeld.',law:0,tone:'s',why:'Falsch. Streikgeld bekommen nur Gewerkschaftsmitglieder.'}
 ],
 term:'Streikgeld',def:'Geld aus der Streikkasse – nur für Gewerkschaftsmitglieder.',
 ihk:'Für die Dauer des Streiks entfällt der Lohnanspruch. Gewerkschaftsmitglieder erhalten Streikgeld von ihrer Gewerkschaft.',
 weil:'… weil es für die Streikzeit keine Vergütung gibt und Streikgeld nur Mitglieder bekommen.'},
{id:'k4',area:'m9',from:'merve',title:'Gleich nochmal streiken?',cond:p=>p.b.tarif,
 msg:p=>`Der neue Tarifvertrag gilt seit Mai. Ich finde den Urlaub trotzdem zu wenig. Lass uns nächste Woche streiken!`,
 opts:[
  {t:'Geht nicht. Solange der Tarifvertrag läuft, gilt Friedenspflicht. Dann gibt es keinen Streik.',law:2,tone:'s',why:'Richtig. Während der Laufzeit eines Tarifvertrags sind Streik und Aussperrung verboten.'},
  {t:'Ja! Streiken geht immer.',law:0,tone:'n',why:'Falsch. Während der Laufzeit gilt Friedenspflicht.'},
  {t:'Geht, wenn 75 % zustimmen.',law:0,tone:'s',why:'Falsch. Die Urabstimmung gibt es erst nach gescheiterten Verhandlungen. Während der Laufzeit gilt Friedenspflicht.'}
 ],
 term:'Friedenspflicht',def:'Während der Laufzeit eines Tarifvertrags: kein Streik, keine Aussperrung.',
 ihk:'Friedenspflicht bedeutet: Streik und Aussperrung sind den Tarifpartnern als Kampfmaßnahmen vor Ablauf der vereinbarten Geltungsdauer des Tarifvertrages untersagt.',
 weil:'… weil während der Laufzeit eines Tarifvertrags Friedenspflicht gilt.'},
{id:'k5',area:'m9',from:'tom',title:'Einfach zu Hause bleiben?',cond:p=>!p.b.tarif,
 msg:p=>`Bei meinem Kumpel im Frischemarkt ist morgen Warnstreik. Bleib doch auch zu Hause, ist ja Streik!`,
 opts:[
  {t:'Ein Streik braucht einen Aufruf der Gewerkschaft für meinen Betrieb. Den gibt es bei uns nicht. Wenn ich wegbleibe, fehle ich unentschuldigt.',law:2,tone:'s',why:'Richtig. Gestreikt wird nur nach einem Aufruf der Gewerkschaft. Allein wegbleiben ist kein Streik.'},
  {t:'Klar, Streik ist Streik.',law:0,tone:'n',why:'Falsch. Bei dir gibt es keinen Streikaufruf. Fehlen ohne Grund kann eine Abmahnung bringen.'},
  {t:'Ich darf nie streiken, weil ich Azubi bin.',law:0,tone:'s',why:'Falsch begründet. Azubis dürfen streiken – aber nur, wenn die Gewerkschaft aufruft und es um ihren Tarifvertrag geht.'}
 ],
 term:'Streikaufruf',def:'Gestreikt wird nur, wenn die Gewerkschaft dazu aufruft.',
 ihk:'Ein Streik wird von der Gewerkschaft ausgerufen. Auszubildende dürfen sich beteiligen, wenn die Gewerkschaft aufruft und es um ihren Tarifvertrag geht.',
 weil:'… weil nur die Gewerkschaft zum Streik aufrufen kann.'},
{id:'k6',area:'m9',from:'tom',title:'Urabstimmung',
 msg:p=>`Im Radio: „Die Schlichtung im Einzelhandel ist gescheitert.“ Was passiert jetzt?`,
 opts:[
  {t:'Jetzt kommt die Urabstimmung. Stimmen mindestens 75 % der aufgerufenen Mitglieder zu, beginnt der Streik.',law:2,tone:'s',why:'Richtig. Nach gescheiterter Schlichtung folgt die Urabstimmung. Nötig sind mindestens 75 %.'},
  {t:'Jetzt legt der Staat die Löhne fest.',law:0,tone:'s',why:'Falsch. Wegen der Tarifautonomie bestimmt der Staat die Löhne nicht.'},
  {t:'Jetzt beginnt sofort der Streik, ohne Abstimmung.',law:1,tone:'s',why:'Teilweise. Es kann zum Streik kommen. Vorher stimmen die Mitglieder aber in der Urabstimmung ab (mindestens 75 %).'}
 ],
 term:'Urabstimmung',def:'Die Mitglieder stimmen über einen Streik ab. Nötig: mindestens 75 %.',
 ihk:'Sind Verhandlungen und Schlichtung gescheitert, führt die Gewerkschaft eine Urabstimmung durch. Stimmen mindestens 75 % der aufgerufenen Mitglieder zu, beginnt der Streik.',
 weil:'… weil nach gescheiterter Schlichtung die Urabstimmung mit 75 % kommt.'},
/* ---------- Modul 10: Betriebsrat ---------- */
{id:'r1',area:'m10',from:'chef',title:'Alle um 7:30 Uhr',cond:p=>p.b.br,
 msg:p=>`Ab Montag fangen alle um 7:30 statt um 8 Uhr an. Habe ich so entschieden.`,
 opts:[
  {t:'Beginn und Ende der Arbeitszeit sind Mitbestimmung. Ohne Zustimmung vom Betriebsrat gilt das nicht.',law:2,tone:'s',why:'Richtig. Bei der Arbeitszeit hat der Betriebsrat Mitbestimmung (Stufe 4). Ohne Zustimmung ist die Anordnung unwirksam.'},
  {t:'Okay, dann komme ich eben früher.',law:0,tone:'n',why:'Falsch. Ohne Zustimmung des Betriebsrats müssen die Beschäftigten nicht früher kommen.'},
  {t:'Sie müssen den Betriebsrat nur informieren. Dann ist es okay.',law:0,tone:'s',why:'Falsch. Information reicht nicht. Bei der Arbeitszeit braucht der Chef die Zustimmung (Mitbestimmung).'}
 ],
 term:'Mitbestimmungsrecht',def:'Stufe 4: Der Arbeitgeber darf nur mit Zustimmung des Betriebsrats handeln.',
 ihk:'Bei Beginn und Ende der täglichen Arbeitszeit hat der Betriebsrat ein Mitbestimmungsrecht. Einigen sich Arbeitgeber und Betriebsrat nicht, entscheidet die Einigungsstelle.',
 weil:'… weil der Betriebsrat bei Beginn und Ende der Arbeitszeit mitbestimmt.'},
{id:'r2',area:'m10',from:'merve',title:'Kündigung ohne Anhörung',cond:p=>p.b.br,
 msg:p=>`Paul hat heute die Kündigung bekommen. Der Betriebsrat wusste nichts davon. Kann das wirksam sein?`,
 opts:[
  {t:'Nein. Der Betriebsrat muss vor jeder Kündigung angehört werden. Ohne Anhörung ist die Kündigung unwirksam.',law:2,tone:'s',why:'Richtig. Vor jeder Kündigung muss der Betriebsrat angehört werden (Stufe 3).'},
  {t:'Ja. Kündigungen entscheidet nur der Chef.',law:0,tone:'n',why:'Falsch. Eine Kündigung ohne Anhörung des Betriebsrats ist unwirksam.'},
  {t:'Nein. Der Betriebsrat kann jede Kündigung einfach verbieten.',law:1,tone:'s',why:'Teilweise. Die Kündigung ist unwirksam, weil die Anhörung fehlt. Verbieten kann der Betriebsrat eine Kündigung aber nicht einfach.'}
 ],
 term:'Anhörung',def:'Vor jeder Kündigung muss der Betriebsrat gehört werden.',
 ihk:'Der Betriebsrat ist vor jeder Kündigung zu hören. Eine ohne Anhörung des Betriebsrats ausgesprochene Kündigung ist unwirksam.',
 weil:'… weil der Betriebsrat vor jeder Kündigung angehört werden muss.'},
{id:'r3',area:'m10',from:'schulte',title:'Betriebsratswahl',cond:p=>p.b.br,
 msg:p=>p.a.turns18?`Im April wählen wir den Betriebsrat neu. Du bist seit August hier und seit März 18. Was darfst du?`:`Im April wählen wir den Betriebsrat neu. Du bist ${Y(p)} und seit August hier. Was darfst du?`,
 opts:[
  {t:'Ich darf wählen, aber noch nicht gewählt werden.',law:p=>p.a.turns18?0:2,tone:'s',why:p=>p.a.turns18?'Falsch. Du bist 18 und schon mehr als 6 Monate im Betrieb. Du darfst also auch gewählt werden.':'Richtig. Wählen darf man ab 16. Gewählt werden erst ab 18 und nach 6 Monaten im Betrieb.'},
  {t:'Ich darf wählen und gewählt werden.',law:p=>p.a.turns18?2:0,tone:'s',why:p=>p.a.turns18?'Richtig. Du bist 18 und mehr als 6 Monate im Betrieb. Also darfst du wählen und gewählt werden.':'Falsch. Gewählt werden darf man erst ab 18.'},
  {t:'Als Azubi darf ich gar nicht mitmachen.',law:0,tone:'s',why:'Falsch. Azubis sind Arbeitnehmer im Sinne des Betriebsverfassungsgesetzes. Ab 16 dürfen sie wählen.'}
 ],
 term:'wahlberechtigt / wählbar',def:'Wählen ab 16. Gewählt werden ab 18 und nach 6 Monaten im Betrieb.',
 ihk:'Wahlberechtigt sind alle Arbeitnehmer des Betriebs, die das 16. Lebensjahr vollendet haben (§ 7 BetrVG). Wählbar sind alle Wahlberechtigten, die das 18. Lebensjahr vollendet haben und sechs Monate dem Betrieb angehören (§ 8 BetrVG).',
 weil:'… weil man ab 16 wählen und erst ab 18 mit 6 Monaten im Betrieb gewählt werden darf.'},
{id:'r4',area:'m10',from:'chef',title:'Neue Kassiererin',cond:p=>p.b.br,
 msg:p=>`Der Betriebsrat verweigert die Zustimmung zur neuen Kassiererin. Egal, die stelle ich trotzdem ein.`,
 opts:[
  {t:'Bei einer Einstellung brauchen Sie die Zustimmung. Ohne sie müssen Sie zum Arbeitsgericht.',law:2,tone:'s',why:'Richtig. Bei Einstellungen hat der Betriebsrat ein Zustimmungsverweigerungsrecht (Stufe 3). Der Arbeitgeber muss das Arbeitsgericht anrufen.'},
  {t:'Klar, Sie sind der Chef.',law:0,tone:'n',why:'Falsch. Verweigert der Betriebsrat die Zustimmung, kann der Arbeitgeber nicht einfach einstellen.'},
  {t:'Dann entscheidet die Einigungsstelle.',law:1,tone:'s',why:'Teilweise. Die Einigungsstelle gibt es bei Mitbestimmung (Stufe 4). Bei Einstellungen entscheidet das Arbeitsgericht.'}
 ],
 term:'Zustimmungsverweigerung',def:'Stufe 3: Einstellung, Versetzung, Umgruppierung – ohne Zustimmung muss der Chef vor Gericht.',
 ihk:'Bei Einstellung, Versetzung, Ein- und Umgruppierung braucht der Arbeitgeber die Zustimmung des Betriebsrats. Verweigert der Betriebsrat sie, kann der Arbeitgeber beim Arbeitsgericht beantragen, die Zustimmung zu ersetzen.',
 weil:'… weil der Betriebsrat bei Einstellungen die Zustimmung verweigern kann und dann das Arbeitsgericht entscheidet.'},
{id:'r5',area:'m10',from:'chef',title:'Betriebsrat? Nicht bei uns!',cond:p=>!p.b.br,
 msg:p=>`Ich höre, ihr wollt einen Betriebsrat wählen. Dafür sind wir zu klein. Und ohne meine Erlaubnis läuft hier gar nichts.`,
 opts:[
  {t:'Ab 5 ständigen wahlberechtigten Beschäftigten darf ein Betriebsrat gewählt werden. Wir sind 12. Sie müssen nicht zustimmen.',law:2,tone:'s',why:'Richtig. Ab 5 Wahlberechtigten (davon 3 wählbar) darf gewählt werden. Der Betrieb muss nicht zustimmen. Bei 12 Beschäftigten hat der Betriebsrat 1 Mitglied.'},
  {t:'Stimmt. Ohne Ihre Erlaubnis geht es nicht.',law:0,tone:'n',why:'Falsch. Die Beschäftigten entscheiden, ob sie einen Betriebsrat wählen. Der Chef muss nicht zustimmen.'},
  {t:'Wir wählen trotzdem – dann sitzen 3 Leute im Betriebsrat.',law:1,tone:'p',why:'Teilweise. Wählen dürft ihr. Aber bei 5 bis 20 Wahlberechtigten hat der Betriebsrat nur 1 Mitglied.'}
 ],
 term:'Betriebsrat',def:'Vertretung der Arbeitnehmer gegenüber dem Arbeitgeber. Möglich ab 5 Wahlberechtigten.',
 ihk:'In Betrieben mit in der Regel mindestens fünf ständigen wahlberechtigten Arbeitnehmern, von denen drei wählbar sind, werden Betriebsräte gewählt (§ 1 BetrVG).',
 weil:'… weil ab 5 ständigen Wahlberechtigten ein Betriebsrat gewählt werden darf.'},
{id:'r6',area:'m10',from:'merve',title:'Umbau aus der Zeitung',cond:p=>p.b.br,
 msg:p=>`Frau Schulte vom Betriebsrat hat aus der Zeitung erfahren, dass unser Laden im Sommer umgebaut wird. Darf der Chef das so machen?`,
 opts:[
  {t:'Nein. Bei einem Umbau muss der Betriebsrat rechtzeitig informiert werden. Das Informationsrecht wurde verletzt.',law:2,tone:'s',why:'Richtig. Beim Umbau hat der Betriebsrat ein Informationsrecht (Stufe 1).'},
  {t:'Nein. Beim Umbau muss der Betriebsrat zustimmen.',law:1,tone:'s',why:'Teilweise. Der Chef hat falsch gehandelt. Aber beim Umbau muss er nur informieren, nicht um Zustimmung fragen.'},
  {t:'Ja. Das geht den Betriebsrat nichts an.',law:0,tone:'n',why:'Falsch. Der Arbeitgeber muss den Betriebsrat rechtzeitig und umfassend informieren.'}
 ],
 term:'Informationsrecht',def:'Stufe 1: Der Arbeitgeber muss rechtzeitig und umfassend informieren.',
 ihk:'Der Arbeitgeber hat den Betriebsrat über die Planung von Neu-, Um- und Erweiterungsbauten rechtzeitig unter Vorlage der erforderlichen Unterlagen zu unterrichten.',
 weil:'… weil der Betriebsrat beim Umbau ein Informationsrecht hat.'},
/* ---------- Modul 11: JAV, Urlaubsplan, Betriebsvereinbarung ---------- */
{id:'j1',area:'m11',from:'chef',title:'Urlaub im November',
 msg:p=>`Urlaubsplan für den Sommer: Im Juli haben die Festangestellten mit Kindern Vorrang. Du kriegst deinen Urlaub im November.`,
 note:'Alex weiß: Im Juli sind Berufsschulferien.',
 opts:[
  {t:p=>p.b.jav?'Ich gehe zur JAV. Die bringt das in den Betriebsrat. Mein Urlaub soll in den Berufsschulferien liegen (§ 19 JArbSchG).':p.b.br?'Ich gehe zum Betriebsrat. Eine JAV haben wir nicht. Mein Urlaub soll in den Berufsschulferien liegen (§ 19 JArbSchG).':'Ich spreche mit Frau Lüders: Mein Urlaub soll in den Berufsschulferien liegen (§ 19 JArbSchG). Hilft das nicht, frage ich die Ausbildungsberatung der Handelskammer.',law:2,tone:'s',why:p=>p.b.br?'Richtig. Der Urlaub soll Berufsschülern in den Berufsschulferien gegeben werden. Beim Urlaubsplan hat der Betriebsrat Mitbestimmung.':'Richtig. Der Urlaub soll in den Berufsschulferien liegen. Ohne Betriebsrat helfen Ausbilderin und Ausbildungsberatung.'},
  {t:'November ist auch okay. Hauptsache Urlaub.',law:0,tone:'n',why:'Falsch. Für Berufsschüler soll der Urlaub in den Berufsschulferien liegen (§ 19 JArbSchG).'},
  {t:p=>p.b.jav?'Die JAV soll das direkt mit Ihnen aushandeln!':'Dann nehme ich im Juli einfach frei!',law:p=>p.b.jav?1:0,tone:'p',why:p=>p.b.jav?'Teilweise. Zur JAV gehen ist gut. Aber die JAV verhandelt nicht selbst mit dem Chef. Sie bringt das Anliegen in den Betriebsrat.':'Falsch. Urlaub nimmt man nicht einfach. Er muss gewährt werden. Richtig ist: auf § 19 JArbSchG hinweisen und Hilfe holen.'}
 ],
 term:p=>p.b.jav?'JAV':'Urlaub in den Ferien',def:p=>p.b.jav?'Jugend- und Auszubildendenvertretung: vertritt Jugendliche und Azubis, arbeitet mit dem Betriebsrat.':'Der Urlaub soll Berufsschülern in den Berufsschulferien gegeben werden.',
 ihk:'Der Urlaub soll Berufsschülern in der Zeit der Berufsschulferien gegeben werden (§ 19 Abs. 3 JArbSchG). Beim Urlaubsplan hat der Betriebsrat ein Mitbestimmungsrecht.',
 weil:'… weil der Urlaub für Berufsschüler in den Berufsschulferien liegen soll.'},
{id:'j2',area:'m11',from:'lueders',title:'Wie viel Urlaub?',
 msg:p=>`Alex, nach dem Gesetz hast du dieses Jahr 24 Werktage Urlaub, wie alle. Einverstanden?`,
 opts:[
  {t:p=>`Nein. Für mich gilt das Jugendarbeitsschutzgesetz. Am 1. Januar war ich ${p.a.age1}. Also mindestens ${p.a.urlaub} Werktage.`,law:2,tone:'s',why:p=>`Richtig. Es zählt das Alter am 1. Januar: unter ${p.a.age1+1} → ${p.a.urlaub} Werktage (§ 19 JArbSchG).`+(p.b.tarif?' Der Tarifvertrag kann noch mehr geben.':'')},
  {t:p=>p.a.turns18?'Ja. Seit März bin ich 18, also 24 Werktage.':'Ja, 24 Werktage stimmen.',law:0,tone:'n',why:p=>p.a.turns18?'Falsch. Es zählt das Alter am 1. Januar. Da warst du 17. Also 25 Werktage für dieses Jahr.':'Falsch. 24 Werktage gibt das Bundesurlaubsgesetz Erwachsenen. Jugendliche bekommen mehr.'},
  {t:'Nein. Azubis haben immer 30 Werktage.',law:0,tone:'p',why:p=>`Falsch. 30 Werktage gibt es nur für Jugendliche unter 16 am 1. Januar. Du hast ${p.a.urlaub} Werktage.`}
 ],
 term:'Urlaub für Jugendliche',def:'Alter am 1. Januar: unter 16 → 30, unter 17 → 27, unter 18 → 25 Werktage.',
 ihk:'Der Urlaub beträgt jährlich mindestens 30 Werktage, wenn der Jugendliche zu Beginn des Kalenderjahres noch nicht 16 Jahre alt ist, 27 Werktage bei unter 17 und 25 Werktage bei unter 18 Jahren (§ 19 JArbSchG).',
 weil:'… weil beim Urlaub das Alter am 1. Januar zählt.'},
{id:'j3',area:'m11',from:'jonas',title:'Unsere Betriebsvereinbarung',cond:p=>p.b.jav,
 msg:p=>`Wir von der JAV wollen mit dem Betriebsrat eine Betriebsvereinbarung vorschlagen. Was darf da rein?`,
 opts:[
  {t:'Eine Stunde Lernzeit pro Woche für alle Azubis.',law:2,tone:'s',why:'Richtig. Berufsbildung im Betrieb darf in einer Betriebsvereinbarung geregelt werden.'},
  {t:'5 % mehr Ausbildungsvergütung als im Tarif.',law:0,tone:'s',why:'Falsch. Löhne und Vergütungen regelt der Tarifvertrag. Eine Betriebsvereinbarung darf das nicht (Tarifvorrang).'},
  {t:'Die JAV unterschreibt das allein mit dem Chef.',law:0,tone:'s',why:'Falsch. Eine Betriebsvereinbarung schließen Arbeitgeber und Betriebsrat ab, nicht die JAV.'}
 ],
 term:'Betriebsvereinbarung',def:'Schriftlicher Vertrag zwischen Arbeitgeber und Betriebsrat. Gilt für alle im Betrieb.',
 ihk:'Die Betriebsvereinbarung wird zwischen Arbeitgeber und Betriebsrat schriftlich abgeschlossen. Arbeitsentgelte, die durch Tarifvertrag geregelt sind, können nicht Gegenstand einer Betriebsvereinbarung sein (§ 77 BetrVG).',
 weil:'… weil eine Betriebsvereinbarung betriebliche Fragen regelt, aber keine Löhne (Tarifvorrang).'},
{id:'j4',area:'m11',from:'chef',title:'Versammlung nach Feierabend',cond:p=>p.b.br,
 msg:p=>`Der Betriebsrat will eine Betriebsversammlung. Gern – aber nach Feierabend und ohne Bezahlung.`,
 opts:[
  {t:'Die Betriebsversammlung findet während der Arbeitszeit statt. Die Zeit wird bezahlt.',law:2,tone:'s',why:'Richtig. Die Betriebsversammlung ist während der Arbeitszeit, die Zeit wird bezahlt.'},
  {t:'Okay, dann bleiben wir eben länger.',law:0,tone:'n',why:'Falsch. Die Versammlung findet während der Arbeitszeit statt und wird bezahlt.'},
  {t:'Dann laden wir auch Kunden und Presse ein!',law:0,tone:'p',why:'Falsch. Die Betriebsversammlung ist nicht öffentlich.'}
 ],
 term:'Betriebsversammlung',def:'Alle Beschäftigten und der Betriebsrat, einmal im Vierteljahr, während der Arbeitszeit, nicht öffentlich.',
 ihk:'Der Betriebsrat hat einmal in jedem Kalendervierteljahr eine Betriebsversammlung einzuberufen und in ihr einen Tätigkeitsbericht zu erstatten (§ 43 BetrVG). Sie findet während der Arbeitszeit statt.',
 weil:'… weil die Betriebsversammlung während der Arbeitszeit stattfindet und bezahlt wird.'},
{id:'j5',area:'m11',from:'merve',title:'Wir wählen eine JAV!',cond:p=>!p.b.br,
 msg:p=>`Wir sind hier 5 Azubis. Lass uns einfach eine JAV wählen!`,
 opts:[
  {t:'Eine JAV gibt es nur, wenn es einen Betriebsrat gibt. Erst muss ein Betriebsrat gewählt werden.',law:2,tone:'s',why:'Richtig. Ohne Betriebsrat keine JAV (§ 60 BetrVG).'},
  {t:'Gute Idee. Ab 5 Azubis geht das immer.',law:0,tone:'s',why:'Falsch. 5 Jugendliche oder Azubis reichen nur, wenn es auch einen Betriebsrat gibt.'},
  {t:'Geht nicht. Azubis dürfen sich nicht vertreten lassen.',law:0,tone:'n',why:'Falsch. Azubis dürfen sich vertreten lassen. Es fehlt nur der Betriebsrat.'}
 ],
 term:'JAV',def:'Jugend- und Auszubildendenvertretung – nur in Betrieben mit Betriebsrat.',
 ihk:'In Betrieben mit in der Regel mindestens fünf Arbeitnehmern unter 18 oder Auszubildenden unter 25 werden Jugend- und Auszubildendenvertretungen gewählt (§ 60 BetrVG). Voraussetzung ist ein Betriebsrat.',
 weil:'… weil es eine JAV nur in Betrieben mit Betriebsrat gibt.'},
{id:'j6',area:'m11',from:'jonas',title:'Wer wählt die JAV?',cond:p=>p.b.jav,
 msg:p=>`Im Herbst wählen wir die JAV neu. Sakowski ist 26 und noch Azubi. Darf er wählen?`,
 opts:[
  {t:'Wählen nicht – nur Azubis unter 25 wählen. Gewählt werden darf er aber, weil er in der Ausbildung ist.',law:2,tone:'s',why:'Richtig. Wählen: unter 18 oder Azubi unter 25. Wählbar: alle unter 25 und alle Azubis.'},
  {t:'Ja, alle Azubis wählen die JAV.',law:0,tone:'s',why:'Falsch. Wählen dürfen nur Azubis unter 25.'},
  {t:'Nein, und gewählt werden darf er auch nicht.',law:1,tone:'s',why:'Teilweise. Wählen darf er nicht. Aber Azubis sind wählbar, auch wenn sie älter sind.'}
 ],
 term:'JAV-Wahl',def:'Wählen: unter 18 und Azubis unter 25 · alle 2 Jahre.',
 ihk:'Wählbar zur JAV sind alle Arbeitnehmer, die das 25. Lebensjahr noch nicht vollendet haben oder die zu ihrer Berufsausbildung beschäftigt sind. Mitglieder des Betriebsrats können nicht gewählt werden (§ 61 BetrVG).',
 weil:'… weil nur Azubis unter 25 wählen, aber alle Azubis gewählt werden dürfen.'},
/* ---------- Modul 12: Rechte des Einzelnen ---------- */
{id:'e1',area:'m12',from:'chef',title:'Die Personalakte',
 msg:p=>`Deine Beurteilung liegt in der Personalakte. Die ist vertraulich. Die darfst du nicht sehen.`,
 opts:[
  {t:p=>'Ich darf meine Personalakte einsehen und eine eigene Erklärung dazu abgeben.'+(p.b.br?' Ich nehme ein Betriebsratsmitglied mit.':''),law:2,tone:'s',why:'Richtig. Jeder Arbeitnehmer darf seine Personalakte einsehen – auch ohne Betriebsrat (§ 83 BetrVG).'},
  {t:'Okay, dann eben nicht.',law:0,tone:'n',why:'Falsch. „Vertraulich“ heißt: Fremde dürfen sie nicht lesen. Du selbst darfst sie einsehen (§ 83).'},
  {t:'Dann hole ich sie mir heimlich aus dem Büro!',law:0,tone:'p',why:'Falsch. Du hast ein Recht auf Einsicht. Verlange es offen – heimlich nehmen ist nicht erlaubt.'}
 ],
 term:'Einsicht in die Personalakte',def:'Ich darf meine Akte lesen und eine Erklärung dazu abgeben (§ 83).',
 ihk:'Der Arbeitnehmer hat das Recht, in die über ihn geführten Personalakten Einsicht zu nehmen. Er kann hierzu ein Mitglied des Betriebsrats hinzuziehen (§ 83 Abs. 1 BetrVG).',
 weil:'… weil jeder Arbeitnehmer seine Personalakte einsehen darf.'},
{id:'e2',area:'m12',from:'chef',title:'Ab ins Lager',
 msg:p=>`Morgen arbeitest du im Lager mit dem Hubwagen. Den kennst du ja sicher.`,
 note:'Niemand hat Alex den Hubwagen erklärt.',
 opts:[
  {t:'Bevor ich anfange, muss mir jemand den Hubwagen erklären. Ich habe ein Recht auf Unterrichtung.',law:2,tone:'s',why:'Richtig. Der Arbeitgeber muss über Aufgaben und Unfallgefahren informieren (§ 81 BetrVG).'},
  {t:'Klar, ich probiere es einfach aus.',law:0,tone:'n',en:-5,why:'Falsch. Ohne Einweisung ist das gefährlich. Du hast ein Recht auf Unterrichtung (§ 81).'},
  {t:'Lager mache ich nicht. Ich gehöre in den Verkauf.',law:0,tone:'p',why:'Falsch. Warenannahme und Lager gehören zur Ausbildung. Du darfst aber eine Einweisung verlangen (§ 81).'}
 ],
 term:'Recht auf Unterrichtung',def:'Der Arbeitgeber erklärt mir Aufgaben, Verantwortung und Gefahren (§ 81).',
 ihk:'Der Arbeitgeber hat den Arbeitnehmer über dessen Aufgabe und Verantwortung sowie über die Art seiner Tätigkeit zu unterrichten, auch über Unfall- und Gesundheitsgefahren (§ 81 BetrVG).',
 weil:'… weil der Arbeitgeber mich über Aufgaben und Gefahren unterrichten muss.'},
{id:'e3',area:'m12',from:'merve',title:'Immer die blöden Schichten',
 msg:p=>`Alex, du wirst seit Wochen immer für die unbeliebtesten Schichten eingeteilt. Willst du nichts sagen?`,
 opts:[
  {t:'Doch. Ich beschwere mich bei der Filialleitung. Das darf mir keine Nachteile bringen.',law:2,tone:'s',why:'Richtig. Wer sich benachteiligt fühlt, darf sich beschweren. Die Beschwerde darf keine Nachteile bringen (§ 84 BetrVG).'},
  {t:'Lieber nicht. Sonst gibt es Ärger.',law:0,tone:'n',en:-8,why:'Falsch. Du hast ein Beschwerderecht. Eine Beschwerde darf dir keine Nachteile bringen (§ 84).'},
  {t:'Ich poste das auf Instagram, dann sehen es alle.',law:0,tone:'p',why:'Falsch. Der richtige Weg ist die Beschwerde im Betrieb (§ 84). Ein öffentlicher Post kann dir schaden.'}
 ],
 term:'Beschwerderecht',def:'Ich darf mich im Betrieb beschweren, ohne Nachteile (§ 84).',
 ihk:'Jeder Arbeitnehmer hat das Recht, sich bei den zuständigen Stellen des Betriebs zu beschweren, wenn er sich benachteiligt oder ungerecht behandelt fühlt. Wegen der Beschwerde dürfen ihm keine Nachteile entstehen (§ 84 BetrVG).',
 weil:'… weil ich mich beschweren darf, ohne dass es mir schadet.'},
{id:'e4',area:'m12',from:'tom',title:'Die Abrechnung',
 msg:p=>`Verstehst du deine Abrechnung? Ich blicke bei den Abzügen gar nicht durch.`,
 opts:[
  {t:'Ich darf verlangen, dass mir die Abrechnung erklärt wird. Das ist mein Recht auf Anhörung.',law:2,tone:'s',why:'Richtig. Man kann verlangen, dass einem das Gehalt erklärt wird (§ 82 BetrVG).'},
  {t:'Das darf nur der Betriebsrat nachfragen.',law:0,tone:'s',why:'Falsch. Dieses Recht hat jeder Einzelne, auch ohne Betriebsrat (§ 82).'},
  {t:'Egal, Hauptsache Geld ist da.',law:0,tone:'n',why:'Falsch. Du hast das Recht, dir die Abrechnung erklären zu lassen (§ 82).'}
 ],
 term:'Recht auf Anhörung',def:'Ich darf gehört werden, Vorschläge machen und mir mein Gehalt erklären lassen (§ 82).',
 ihk:'Der Arbeitnehmer kann verlangen, dass ihm die Berechnung und Zusammensetzung seines Arbeitsentgelts erläutert und seine Leistungen mit ihm erörtert werden (§ 82 BetrVG).',
 weil:'… weil ich verlangen darf, dass mir mein Gehalt erklärt wird.'}
];

/* ===== Prüfungsfragen (a = Index der richtigen Antwort im Original; wird gemischt) ===== */
const QS=[
// Modul 6
{id:'q01',mod:6,ihk:'Im Stil der Prüfung',q:'Frau Keller (17) arbeitet an einem Dienstag von 8:00 bis 17:00 Uhr. Wann muss sie spätestens eine Pause bekommen? (§ 11: nicht länger als 4,5 Stunden ohne Pause)',o:['12:30 Uhr','12:00 Uhr','14:00 Uhr','11:00 Uhr'],a:0,why:'8:00 Uhr plus 4,5 Stunden = 12:30 Uhr.'},
{id:'q02',mod:6,ihk:'Im Stil der Prüfung',q:'Mia (16) beginnt eine Ausbildung. Welche Bescheinigung muss sie vorher vorlegen?',o:['Bescheinigung über die ärztliche Erstuntersuchung','Mitgliedsausweis der Gewerkschaft','Geburtsurkunde','Beglaubigte Kopie des Personalausweises'],a:0,why:'Ohne Erstuntersuchung dürfen Jugendliche nicht beschäftigt werden (§ 32 JArbSchG).'},
{id:'q03',mod:6,q:'Bis wie viel Uhr dürfen Jugendliche im Einzelhandel arbeiten?',o:['bis 20 Uhr','bis 21 Uhr','bis 22 Uhr'],a:0,why:'Jugendliche nur zwischen 6 und 20 Uhr (§ 14).'},
{id:'q04',mod:6,q:'Ein Jugendlicher arbeitet 7 Stunden. Wie viel Pause braucht er?',o:['60 Minuten','30 Minuten','45 Minuten'],a:0,why:'Mehr als 6 Stunden Arbeit: 60 Minuten (§ 11).'},
{id:'q05',mod:6,q:'Wie lange darf die Schichtzeit (Arbeitszeit plus Pausen) bei Jugendlichen höchstens sein?',o:['10 Stunden','8 Stunden','12 Stunden'],a:0,why:'Schichtzeit höchstens 10 Stunden (§ 12).'},
{id:'q06',mod:6,q:'Wie viel Freizeit brauchen Jugendliche nach Feierabend mindestens?',o:['12 Stunden','11 Stunden','10 Stunden'],a:0,why:'Mindestens 12 Stunden (§ 13). 11 Stunden gelten für Erwachsene.'},
{id:'q07',mod:6,tf:true,q:'Wahr oder falsch? Jugendliche dürfen am verkaufsoffenen Sonntag arbeiten, wenn sie dafür einen anderen Tag frei bekommen.',o:['falsch','wahr'],a:0,why:'Sonntagsarbeit ist für Jugendliche im Einzelhandel verboten (§ 17).'},
{id:'q08',mod:6,q:'Sophie ist am 1. Januar 15 Jahre alt. Wie viel Urlaub hat sie in diesem Jahr mindestens?',o:['30 Werktage','27 Werktage','25 Werktage','24 Werktage'],a:0,why:'Unter 16 am 1. Januar → 30 Werktage (§ 19).'},
{id:'q09',mod:6,q:'Ab welchem Alter gilt das Jugendarbeitsschutzgesetz nicht mehr?',o:['ab 18 Jahren','ab 16 Jahren','ab 21 Jahren'],a:0,why:'Ab 18 gilt das Arbeitszeitgesetz.'},
{id:'q10',mod:6,tf:true,q:'Wahr oder falsch? Hat die Berufsschule vor 9 Uhr Unterricht, darf der Jugendliche vorher nicht arbeiten.',o:['wahr','falsch'],a:0,why:'Nicht vor einem Unterricht, der vor 9 Uhr beginnt (§ 9).'},
// Modul 7
{id:'q11',mod:7,ihk:'Im Stil der Prüfung',q:'Frau Falk bringt ihren Sohn am errechneten Termin zur Welt (keine Früh- oder Mehrlingsgeburt). Ab wann darf sie frühestens wieder arbeiten?',o:['acht Wochen nach der Entbindung','sechs Wochen nach der Entbindung','zwölf Wochen nach der Entbindung','sofort, wenn der Arbeitgeber es erlaubt'],a:0,why:'Schutzfrist 8 Wochen nach der Geburt, bei Früh- und Mehrlingsgeburten 12.'},
{id:'q12',mod:7,ihk:'Im Stil der Prüfung',q:'Wer hat einen besonderen gesetzlichen Kündigungsschutz?',o:['Herr Baum (17, Azubi im 2. Jahr) und Herr Decker (40, in Elternzeit)','Frau Ahlers (16, Azubi in der Probezeit) und Frau Ebert (37, Abteilungsleiterin)','Frau Claas (32, befristet) und Frau Fink (30, Ausbildungsleiterin)'],a:0,why:'Azubis nach der Probezeit und Beschäftigte in Elternzeit. In der Probezeit gibt es keinen besonderen Schutz.'},
{id:'q13',mod:7,ihk:'Im Stil der Prüfung',q:'Welche Vorschrift muss im Betrieb ausgehängt werden, in dem Jugendliche arbeiten?',o:['das Jugendarbeitsschutzgesetz','das Bundesurlaubsgesetz','die Preisangabenverordnung','das Produkthaftungsgesetz'],a:0,why:'Aushängen muss der Betrieb u. a. Unfallverhütungsvorschriften, ArbZG, JArbSchG, MuSchG, AGG – nicht das BUrlG.'},
{id:'q14',mod:7,q:'Wie lange dürfen Erwachsene höchstens am Tag arbeiten?',o:['10 Stunden (im Schnitt 8)','8 Stunden, nie mehr','12 Stunden'],a:0,why:'Höchstens 8 Stunden, bis 10, wenn der Durchschnitt über 6 Monate bei 8 bleibt (ArbZG).'},
{id:'q15',mod:7,q:'Tom hat um 21:30 Uhr Feierabend. Wann darf er am nächsten Tag frühestens anfangen?',o:['8:30 Uhr','7:30 Uhr','9:30 Uhr'],a:0,why:'11 Stunden Ruhezeit: 21:30 + 11 Std. = 8:30 Uhr.'},
{id:'q16',mod:7,q:'Murat (25) arbeitet von 8:00 bis 17:00 Uhr. Wie viel Pause braucht er?',o:['30 Minuten','60 Minuten','45 Minuten'],a:0,why:'Erwachsene: mehr als 6 Stunden → 30 Minuten. 9 Std. Anwesenheit − 0,5 = 8,5 Std. Arbeit.'},
{id:'q17',mod:7,q:'Jana arbeitet 5 Tage pro Woche. Wie vielen Arbeitstagen entsprechen 24 Werktage Urlaub?',o:['20 Arbeitstagen','24 Arbeitstagen','18 Arbeitstagen'],a:0,why:'24 × 5 : 6 = 20.'},
{id:'q18',mod:7,q:'Wo beantragt man das Elterngeld?',o:['bei der Elterngeldstelle','beim Arbeitgeber','beim Betriebsrat'],a:0,why:'Das Elterngeld kommt von der Elterngeldstelle, nicht vom Arbeitgeber.'},
{id:'q19',mod:7,tf:true,q:'Wahr oder falsch? Für Elternzeit braucht man die Zustimmung des Arbeitgebers.',o:['falsch','wahr'],a:0,why:'Elternzeit wird rechtzeitig angemeldet. Eine Zustimmung ist nicht nötig.'},
// Modul 8
{id:'q20',mod:8,ihk:'Im Stil der Prüfung',q:'Der Tarifvertrag für den Einzelhandel wird neu verhandelt. Welche zwei Sozialpartner schließen ihn ab?',o:['Gewerkschaft und Arbeitgeberverband','Betriebsrat und Arbeitgeber','IHK und Bundesagentur für Arbeit','Bundesministerium und Berufsgenossenschaft'],a:0,why:'Tarifpartner sind Gewerkschaft und Arbeitgeberverband.'},
{id:'q21',mod:8,ihk:'Im Stil der Prüfung',q:'Was versteht man unter Tarifautonomie?',o:['Die Tarifparteien dürfen Tarifverträge ohne staatlichen Einfluss abschließen.','Ein Tarifvertrag gilt für alle Betriebe einer Branche.','Der Staat muss jeden Tarifvertrag genehmigen.','Bei jedem Streit vermittelt ein Schlichter.'],a:0,why:'Die zweite Antwort beschreibt die Allgemeinverbindlichkeit.'},
{id:'q22',mod:8,ihk:'Im Stil der Prüfung',q:'Was trifft auf den Manteltarifvertrag zu?',o:['Er regelt die wöchentliche Arbeitszeit und den Urlaubsanspruch.','Er legt die Höhe der Gehälter fest.','Er wird zwischen Firma und Betriebsrat vereinbart.','Er bestimmt, wann ein einzelnes Arbeitsverhältnis beginnt.'],a:0,why:'Vergütung: Entgelttarifvertrag · Firma und Betriebsrat: Betriebsvereinbarung · Beginn: Arbeitsvertrag.'},
{id:'q23',mod:8,ihk:'Im Stil der Prüfung',q:'Was bedeutet die Tarifbindung für die Kaufhaus Hansa GmbH? (§ 4 TVG)',o:['Abweichungen vom Tarif sind nur erlaubt, wenn sie für die Arbeitnehmer günstiger sind.','Es sind gar keine abweichenden Regelungen erlaubt.','Die Kaufhaus Hansa GmbH ist nicht an den Tarif gebunden.','Gewerkschaftsmitglieder dürfen freiwillig zu schlechteren Bedingungen arbeiten.'],a:0,why:'Günstigkeitsprinzip.'},
{id:'q24',mod:8,q:'Was regelt der Entgelttarifvertrag?',o:['die Höhe der Löhne, Gehälter und Ausbildungsvergütungen','den Urlaub und die Arbeitszeit','die Pausen im Betrieb'],a:0,why:'Urlaub und Arbeitszeit stehen im Manteltarifvertrag.'},
{id:'q25',mod:8,q:'Wer kann einen Tarifvertrag für allgemeinverbindlich erklären?',o:['das Bundesministerium für Arbeit und Soziales','die Gewerkschaft allein','die Handelskammer'],a:0,why:'Auf Antrag das Bundesarbeitsministerium.'},
{id:'q26',mod:8,tf:true,q:'Wahr oder falsch? Marc ist in ver.di. Seine Tankstelle ist in keinem Verband. Also gilt für ihn der Tarifvertrag.',o:['falsch','wahr'],a:0,why:'Der Arbeitgeber ist nicht tarifgebunden. Die Mitgliedschaft allein reicht nicht.'},
// Modul 9
{id:'q27',mod:9,ihk:'Im Stil der Prüfung',q:'Während der Laufzeit eines Tarifvertrags gilt die Friedenspflicht. Was bedeutet das?',o:['Streik und Aussperrung sind bis zum Ablauf des Tarifvertrags verboten.','Niemand darf den Tarifvertrag vor Ablauf kündigen.','Der Tarifvertrag muss für allgemeinverbindlich erklärt werden.','Die Verhandlungen müssen zügig enden.'],a:0,why:'Friedenspflicht: keine Kampfmaßnahmen während der Laufzeit.'},
{id:'q28',mod:9,ihk:'Im Stil der Prüfung',q:'Welche Aufgabe gehört zu den Gewerkschaften?',o:['Sie setzen sich in Tarifverhandlungen für höhere Einkommen ihrer Mitglieder ein.','Sie bestimmen, wie stark die Preise steigen dürfen.','Sie führen die Betriebsratswahlen durch.','Sie bieten Arbeitgebern Rechtsschutz.'],a:0,why:'Gewerkschaften vertreten die Interessen der Arbeitnehmer in Tarifverhandlungen.'},
{id:'q29',mod:9,ihk:'Im Stil der Prüfung',q:'Verhandlungen und Schlichtung sind gescheitert. Was folgt als Nächstes?',o:['Die Gewerkschaft führt eine Urabstimmung durch.','Der Staat legt die Löhne fest.','Der Betriebsrat schließt einen Tarifvertrag ab.','Ein Streik ist jetzt verboten.'],a:0,why:'Nach gescheiterter Schlichtung kommt die Urabstimmung.'},
{id:'q30',mod:9,q:'1.240 Mitglieder sind aufgerufen. Wie viele Ja-Stimmen braucht die Gewerkschaft mindestens für einen Streik?',o:['930','620','1.000'],a:0,why:'1.240 × 0,75 = 930.'},
{id:'q31',mod:9,q:'Was ist eine Aussperrung?',o:['Arbeitgeber lassen Beschäftigte nicht arbeiten und zahlen keinen Lohn.','Die Gewerkschaft schließt Nichtmitglieder aus.','Streikende werden gekündigt.'],a:0,why:'Kampfmittel der Arbeitgeber – auch Arbeitswillige bekommen keinen Lohn.'},
{id:'q32',mod:9,q:'Ein Ergebnis liegt vor. Wie viele Mitglieder müssen in der zweiten Urabstimmung mindestens zustimmen?',o:['25 %','50 %','75 %'],a:0,why:'Mindestens 25 % – dann ist das Ergebnis angenommen.'},
{id:'q33',mod:9,tf:true,q:'Wahr oder falsch? Für einen Warnstreik braucht man eine Urabstimmung.',o:['falsch','wahr'],a:0,why:'Warnstreiks gibt es während der Verhandlungen ohne Urabstimmung.'},
// Modul 10
{id:'q34',mod:10,ihk:'Im Stil der Prüfung',q:'Aus welchem Grund befürworten Mitarbeiter einen Betriebsrat?',o:['Er vertritt die Interessen der Mitarbeiter gegenüber der Geschäftsleitung.','Er bestimmt bei jeder Entscheidung mit.','Er schließt Betriebsvereinbarungen mit dem Arbeitgeberverband ab.','Er muss der Ernennung des Geschäftsführers zustimmen.'],a:0,why:'Mitbestimmung gibt es nur in bestimmten Angelegenheiten, nicht bei allen.'},
{id:'q35',mod:10,ihk:'Im Stil der Prüfung',q:'Tim (19) arbeitet seit 1. Februar im Betrieb. Im Mai wird ein Betriebsrat gewählt. Darf er sich wählen lassen?',o:['Nein, er ist noch nicht lange genug im Betrieb.','Ja, weil er volljährig ist.','Nein, weil er in der Probezeit ist.','Ja, wenn er im Mai noch da ist.'],a:0,why:'Im Mai erst 3 bis 4 Monate im Betrieb. Nötig sind 6 Monate.'},
{id:'q36',mod:10,ihk:'Im Stil der Prüfung',q:'In welchem Gesetz stehen die Regeln zur Wahl des Betriebsrats?',o:['Betriebsverfassungsgesetz','Berufsbildungsgesetz','Tarifvertragsgesetz','Handelsgesetzbuch'],a:0,why:'Betriebsverfassungsgesetz (BetrVG).'},
{id:'q37',mod:10,q:'Eine Filiale hat 26 wahlberechtigte Beschäftigte. Wie viele Mitglieder hat der Betriebsrat?',o:['3','1','5'],a:0,why:'21 bis 50 Wahlberechtigte → 3 Mitglieder.'},
{id:'q38',mod:10,q:'Wie lange ist ein Betriebsrat im Amt?',o:['4 Jahre','2 Jahre','5 Jahre'],a:0,why:'Vier Jahre. Die JAV wird alle zwei Jahre gewählt.'},
{id:'q39',mod:10,q:'Arbeitgeber und Betriebsrat streiten über den Urlaubsplan. Wer entscheidet?',o:['die Einigungsstelle','das Arbeitsgericht','die Gewerkschaft'],a:0,why:'Bei Mitbestimmung entscheidet die Einigungsstelle. Ihr Spruch ersetzt die Einigung.'},
{id:'q40',mod:10,q:'Eine Kassiererin soll in eine andere Gehaltsgruppe. Welche Stufe der Beteiligung?',o:['Widerspruch/Zustimmungsverweigerung','Information','Beratung'],a:0,why:'Ein- und Umgruppierung: Stufe 3.'},
// Modul 11
{id:'q41',mod:11,ihk:'Im Stil der Prüfung',q:'Im Betrieb soll erstmals eine JAV gewählt werden. Welchen Vorteil haben die Azubis?',o:['Sie haben Ansprechpartner in ihrem Alter, die Anliegen über den Betriebsrat vertreten.','Die JAV verhandelt allein mit der Geschäftsleitung.','Die JAV stimmt im Betriebsrat immer mit ab.','Die Azubis wählen ihren Ausbilder selbst.'],a:0,why:'Die JAV bringt Anliegen in den Betriebsrat. Verhandeln tut der Betriebsrat.'},
{id:'q42',mod:11,ihk:'Im Stil der Prüfung',q:'Wer darf sich in die JAV wählen lassen? Demir (17, Azubi), Roth (20, ausgelernt), Lang (27, angelernt), Kunz (26, Azubi)',o:['Demir, Roth und Kunz','nur Demir','Demir und Kunz','alle vier'],a:0,why:'Wählbar: unter 25 oder in der Ausbildung. Frau Lang ist 27 und nicht in Ausbildung.'},
{id:'q43',mod:11,ihk:'Im Stil der Prüfung',q:'Welche Information ist Inhalt einer Betriebsvereinbarung und keine gesetzliche Regel?',o:['Alle Azubis besuchen jedes Jahr ein 2-tägiges Seminar.','Der Urlaub soll Berufsschülern in den Ferien gegeben werden.','Azubis werden für die Berufsschule freigestellt.','In der Probezeit ist Kündigung ohne Frist möglich.'],a:0,why:'Die anderen stehen im JArbSchG bzw. BBiG.'},
{id:'q44',mod:11,ihk:'Im Stil der Prüfung',q:'Die Mitarbeiter wollen eine Betriebsversammlung durchführen. Was ist zu beachten?',o:['Sie findet viermal im Jahr statt.','Sie darf nur außerhalb der Öffnungszeiten stattfinden.','Alle Mitarbeiter müssen zustimmen.','10 Mitarbeiter müssen sie beantragen.'],a:0,why:'Einmal in jedem Kalendervierteljahr (§ 43 BetrVG).'},
{id:'q45',mod:11,q:'Wer schließt eine Betriebsvereinbarung ab?',o:['Arbeitgeber und Betriebsrat','Gewerkschaft und Arbeitgeberverband','JAV und Arbeitgeber'],a:0,why:'Der Tarifvertrag kommt von Gewerkschaft und Arbeitgeberverband.'},
{id:'q46',mod:11,q:'Was ist ein Sozialplan?',o:['Er mildert Nachteile bei großen Änderungen, z. B. Abfindungen bei Entlassungen.','Er ist der Dienstplan für die Wochenenden.','Er regelt den Urlaub der Azubis.'],a:0,why:'Sonderfall der Betriebsvereinbarung.'},
{id:'q47',mod:11,tf:true,q:'Wahr oder falsch? Zur Betriebsversammlung dürfen Kunden und Presse kommen.',o:['falsch','wahr'],a:0,why:'Die Betriebsversammlung ist nicht öffentlich.'},
// Modul 12
{id:'q48',mod:12,ihk:'Im Stil der Prüfung',q:'Was spricht aus Sicht der Beschäftigten für einen Betriebsrat?',o:['Er vertritt die Interessen der Beschäftigten gegenüber der Geschäftsleitung.','Er muss vor jeder Entscheidung angehört werden.','Er kann alle fristlosen Kündigungen aufheben.','Er schließt Betriebsvereinbarungen mit dem Handelsverband ab.'],a:0,why:'Interessenvertretung ist die Hauptaufgabe.'},
{id:'q49',mod:12,ihk:'Im Stil der Prüfung',q:'Welches Recht hat eine Arbeitnehmerin auch ohne Betriebsrat?',o:['Sie darf ihre Personalakte einsehen und eine Erklärung dazu abgeben.','Sie kann bei jeder Einstellung mitbestimmen.','Sie kann den Urlaubsplan für alle festlegen.','Sie kann eine Einigungsstelle anrufen.'],a:0,why:'§ 83 BetrVG – Rechte des Einzelnen gelten auch ohne Betriebsrat.'},
{id:'q50',mod:12,q:'Kemal soll mit dem Hubwagen arbeiten. Niemand hat ihn eingewiesen. Welches Recht hilft?',o:['Recht auf Unterrichtung','Beschwerderecht','Einsicht in die Personalakte'],a:0,why:'§ 81: Aufgaben und Gefahren müssen erklärt werden.'},
{id:'q51',mod:12,q:'Was ist ein Nachteil der betrieblichen Mitbestimmung?',o:['Entscheidungen werden verzögert.','Die Motivation der Belegschaft steigt.','Konflikte werden geregelt gelöst.'],a:0,why:'Weitere Nachteile: viel Bürokratie, evtl. fehlende Sachkenntnis.'},
{id:'q52',mod:12,tf:true,q:'Wahr oder falsch? Wer sich im Betrieb beschwert, darf dafür keine Nachteile bekommen.',o:['wahr','falsch'],a:0,why:'§ 84 BetrVG.'}
];

/* ===== Für Profis (Freitext, Musterlösung aus den Lösungsblättern) ===== */
const PROFIS=[
{id:'p01',mod:6,q:'Lara wird am 14.03. siebzehn. Ändert sich dadurch ihr Urlaub in diesem Jahr?',a:'Nein. Es zählt das Alter zu Beginn des Kalenderjahres. Am 1. Januar war Lara 16, also 27 Werktage. Erst im nächsten Jahr hat sie 25 Werktage.'},
{id:'p02',mod:6,q:'Begründe, warum es für Jugendliche strengere Regeln gibt als für Erwachsene. Nenne zwei Gründe.',a:'Jugendliche sind noch in der Entwicklung und brauchen mehr Erholung und Schlaf. Sie sollen Zeit für Berufsschule und Lernen haben. Sie können Gefahren schlechter einschätzen und lassen sich leichter unter Druck setzen.'},
{id:'p03',mod:7,q:'Lea arbeitet in Teilzeit an vier Tagen pro Woche. Berechne ihren Mindesturlaub in Arbeitstagen.',a:'24 Werktage × 4 : 6 = 16 Arbeitstage.'},
{id:'p04',mod:7,q:'Manche möchten freiwillig 12 Stunden am Tag arbeiten. Beurteile, warum das Arbeitszeitgesetz das trotzdem verbietet.',a:'Lange Arbeitstage erhöhen die Unfall- und Fehlergefahr und schaden der Gesundheit. Das Gesetz schützt auch vor Druck: Was freiwillig beginnt, wird schnell erwartet.'},
{id:'p05',mod:8,q:'„Warum soll ich Gewerkschaftsbeitrag zahlen? Ich bekomme den Tarif doch sowieso.“ Beurteile diese Trittbrettfahrer-Haltung.',a:'Für den Einzelnen kurzfristig günstig. Für alle schädlich: Je weniger Mitglieder, desto schwächer ist die Gewerkschaft in Verhandlungen und beim Streik. Dann sinken auf Dauer auch die Tarife, von denen der Trittbrettfahrer profitiert.'},
{id:'p06',mod:8,q:'Viele Einzelhandelsbetriebe sind nicht tarifgebunden. Nenne zwei Gründe und zwei Folgen für die Beschäftigten.',a:'Gründe: Kosten sparen, mehr Freiheit bei Arbeitszeiten, Konkurrenz durch Discounter und Onlinehandel. Folgen: geringere Löhne, weniger Urlaub, keine Zuschläge, nur gesetzliche Mindeststandards.'},
{id:'p07',mod:9,q:'Die Urabstimmung verlangt 75 % für den Streik, aber nur 25 % für die Annahme eines Ergebnisses. Begründe.',a:'Ein Streik ist ein großer Schritt mit Risiken (kein Lohn, Konflikt) – dafür braucht es breite Unterstützung. Ein Ergebnis beendet den Streik; es soll leicht angenommen werden können, damit ein Streik nicht endlos läuft.'},
{id:'p08',mod:9,q:'Im Streik setzen manche Betriebe Aushilfen ein. Beurteile, wie das die Macht der Gewerkschaft beeinflusst.',a:'Wenn der Laden trotz Streik normal öffnet, fehlt der wirtschaftliche Druck – die Gewerkschaft wird schwächer. Leiharbeiter dürfen seit 2017 nicht als Streikbrecher eingesetzt werden.'},
{id:'p09',mod:10,q:'Betriebsräte haben besonderen Kündigungsschutz. Ist das ein unfaires Privileg?',a:'Nein. Wer die Belegschaft gegen den Arbeitgeber vertritt, gerät in Konflikte. Ohne Schutz könnte der Arbeitgeber unbequeme Betriebsräte kündigen – dann würde sich niemand mehr trauen.'},
{id:'p10',mod:10,q:'Stelle Betriebsrat und Gewerkschaft gegenüber: Wer wählt? Mit wem verhandeln sie? Was schließen sie ab? Dürfen sie streiken?',a:'Betriebsrat: von allen Beschäftigten gewählt, verhandelt mit dem Arbeitgeber, schließt Betriebsvereinbarungen, darf nicht streiken. Gewerkschaft: freiwillige Mitglieder, verhandelt mit dem Arbeitgeberverband, schließt Tarifverträge, darf zum Streik aufrufen.'},
{id:'p11',mod:11,q:'In deinem Betrieb gibt es acht Azubis, aber keinen Betriebsrat. Warum gibt es keine JAV – und was könnt ihr tun?',a:'Die JAV setzt einen Betriebsrat voraus (§ 60 BetrVG). Die Azubis können eine Betriebsratswahl anstoßen, sich an Gewerkschaft, Ausbildungsberatung oder Berufsschule wenden und ihre eigenen Rechte nutzen.'},
{id:'p12',mod:11,q:'Vergleiche Tarifvertrag und Betriebsvereinbarung: Wer schließt sie ab, für wen gelten sie, was regeln sie?',a:'Tarifvertrag: Gewerkschaft und Arbeitgeberverband, gilt für die Branche, regelt Löhne, Arbeitszeit, Urlaub. Betriebsvereinbarung: Arbeitgeber und Betriebsrat, gilt für alle im Betrieb, regelt betriebliche Fragen wie Lage der Arbeitszeit, Pausen, Ordnung.'},
{id:'p13',mod:12,q:'Viele nutzen ihre Rechte aus §§ 81–84 BetrVG nie. Nenne zwei Gründe und einen Vorschlag.',a:'Gründe: Unkenntnis der Rechte, Angst vor Nachteilen. Vorschlag: Rechte beim Start erklären, feste Feedbackgespräche einmal im Jahr, eine anonyme Beschwerdestelle.'}
];
