<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Projekt Eiszeit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: eine Spalte wie ein Expeditions-Logbuch – Hafenszene oben, darunter Statusleiste und die jeweilige Entscheidung. */
:root{
  --bg:#EAF1F5; --surface:#FFFFFF; --surface2:#F3F7FA; --ink:#0E2233; --muted:#4D6273; --line:#C9D6DF;
  --accent:#C8331F; --accent-ink:#FFFFFF; --ice:#2B7CA6; --ice-soft:#DCEEF7;
  --ok:#23704A; --ok-soft:#DDF1E5; --bad:#B3261E; --bad-soft:#FBE3E0; --warn:#9A6212; --warn-soft:#FBEFD9;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08141D; --surface:#102230; --surface2:#0C1B27; --ink:#E4EDF2; --muted:#9BB0BF; --line:#24394A;
  --accent:#FF6A4D; --accent-ink:#1A0A06; --ice:#72C4EA; --ice-soft:#123246;
  --ok:#5CC48C; --ok-soft:#123224; --bad:#FF8076; --bad-soft:#3A1715; --warn:#F2B35A; --warn-soft:#33240E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08141D; --surface:#102230; --surface2:#0C1B27; --ink:#E4EDF2; --muted:#9BB0BF; --line:#24394A;
  --accent:#FF6A4D; --accent-ink:#1A0A06; --ice:#72C4EA; --ice-soft:#123246;
  --ok:#5CC48C; --ok-soft:#123224; --bad:#FF8076; --bad-soft:#3A1715; --warn:#F2B35A; --warn-soft:#33240E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
.wrap{max-width:660px;margin:0 auto;padding-inline:16px;padding-block:12px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:2.6rem;text-transform:uppercase}
h2{font-size:1.9rem;text-transform:uppercase}
h3{font-size:1.3rem;text-transform:uppercase}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.scene{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0b2236;line-height:0}
.scene svg{width:100%;height:auto;display:block}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-family:var(--f-mono);font-size:.85rem;font-variant-numeric:tabular-nums}
.meter{display:inline-flex;gap:3px}
.meter i{width:12px;height:14px;border-radius:3px;background:var(--line);display:block}
.meter i.on{background:var(--ice)}
.core{display:inline-flex;gap:2px}
.core i{width:16px;height:12px;border-radius:2px;background:var(--line);display:block}
.core i.ok{background:var(--accent)}
.core i.dmg{background:repeating-linear-gradient(45deg,var(--line) 0 3px,var(--muted) 3px 5px)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel.flat{background:transparent;border:none;padding:0}
.talk{display:flex;gap:12px;align-items:flex-start}
.talk .face{flex:0 0 72px;width:72px}
.talk .face svg{width:72px;height:72px;display:block}
.bubble{position:relative;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0;flex:1}
.bubble .who{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.bubble b{font-weight:700}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;color:var(--ink);text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:56px;cursor:pointer;display:flex;gap:10px;align-items:center;width:100%}
.opt:hover:not(:disabled){border-color:var(--ice)}
.opt:focus-visible,.btn:focus-visible,.card:focus-visible,.cell:focus-visible{outline:3px solid var(--ice);outline-offset:2px}
.opt .k{font-family:var(--f-mono);font-weight:600;flex:0 0 28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-size:.85rem}
.opt.sel{border-color:var(--accent)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.gone{opacity:.35;text-decoration:line-through}
.opt:disabled{cursor:default}
.opt>span:not(.k):not(.cost){min-width:0;overflow-wrap:anywhere}
.opt .cost{margin-left:auto;font-family:var(--f-mono);font-size:.9rem;white-space:nowrap;padding-left:8px}
.btn{font:inherit;font-weight:700;border-radius:12px;padding:12px 18px;min-height:52px;cursor:pointer;border:2px solid var(--ink);background:var(--ink);color:var(--bg)}
.btn.alt{background:transparent;color:var(--ink)}
.btn.red{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{min-height:40px;padding:6px 12px;font-size:.92rem}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>.btn{flex:1 1 180px}
.term{border:2px dashed var(--ice);border-radius:12px;padding:12px 14px;background:var(--ice-soft);display:flex;flex-direction:column;gap:4px}
.term .eyebrow{color:var(--ice)}
.term.bad{border-color:var(--bad);background:var(--bad-soft)}
.term.bad .eyebrow{color:var(--bad)}
.term.ok{border-color:var(--ok);background:var(--ok-soft)}
.term.ok .eyebrow{color:var(--ok)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.92rem;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-family:var(--f-mono);font-weight:600;font-size:.74rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:var(--surface2)}
tr:last-child td{border-bottom:none}
td.sum{font-weight:700;border-top:2px solid var(--ink)}
.tk{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:6px;overflow:hidden;font-size:.9rem;font-variant-numeric:tabular-nums}
.tk>div{min-width:0}
.tk .hd{display:flex;justify-content:space-between;font-family:var(--f-mono);font-weight:600;padding:4px 8px;border-bottom:2px solid var(--ink);font-size:.8rem}
.tk .l{border-right:2px solid var(--ink)}
.tk .ln{display:flex;justify-content:space-between;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line)}
.tk .ln,.cell{flex-wrap:wrap}
.tk .ln span:last-child,.cell span:last-child{white-space:nowrap;margin-left:auto}
@media (max-width:480px){.tk{font-size:.82rem}}
.cell{font:inherit;color:inherit;background:transparent;border:none;border-bottom:1px solid var(--line);width:100%;text-align:left;display:flex;justify-content:space-between;gap:6px;padding:8px;cursor:pointer;min-height:44px;align-items:center}
.cell.mark{background:var(--warn-soft);outline:2px solid var(--warn);outline-offset:-2px}
.cell.hit{background:var(--ok-soft)}
.cell.miss{background:var(--bad-soft)}
.cell.lost{background:var(--warn-soft)}
.scaf{font-family:var(--f-mono);font-size:.92rem;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;overflow-x:auto}
.numin{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numin input{font:inherit;font-family:var(--f-mono);font-size:1.15rem;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:12ch;max-width:100%}
.numin input:focus{border-color:var(--ice);outline:none}
.words{font-size:.92rem;color:var(--muted);border-left:4px solid var(--ice);padding:6px 10px;background:var(--surface2);border-radius:0 8px 8px 0}
.words b{color:var(--ink)}
details summary{cursor:pointer;font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2.stack{grid-template-columns:1fr}}
.card{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.card svg{width:56px;height:56px}
.blist{display:grid;grid-template-columns:1fr;gap:10px}
.blist .card{flex-direction:row;align-items:center;gap:14px}
.blist .card>span{display:block}
.blist .card .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
@media (min-width:600px){.blist{grid-template-columns:repeat(3,1fr)}.blist .card{flex-direction:column;align-items:flex-start}}
.card .t{font-family:var(--f-display);font-size:1.3rem;overflow-wrap:anywhere;text-transform:uppercase;line-height:1}
.card .s{font-size:.9rem;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 6px;align-self:flex-start}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ice)}
.bigcard{border:2px solid var(--ink);border-radius:14px;padding:18px;text-align:center;font-size:1.15rem;font-weight:700;background:var(--surface2)}
.cats{display:grid;grid-template-columns:1fr;gap:8px}
.res{display:flex;flex-direction:column;gap:10px}
.ri{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.ri .mk{font-family:var(--f-mono);font-weight:600}
.ri .mk.ok{color:var(--ok)} .ri .mk.mid{color:var(--warn)} .ri .mk.no{color:var(--bad)}
.ri .ihk{font-size:.9rem;border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.ri .ihk b{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ice);display:block}
.score{border:3px solid var(--ink);border-radius:16px;padding:18px;background:var(--surface);display:flex;flex-direction:column;gap:8px;text-align:center;align-items:center}
.score .big{font-family:var(--f-display);font-size:3.6rem;line-height:1}
.stars{display:flex;gap:6px;justify-content:center}
.stars svg{width:38px;height:38px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.85rem;background:var(--surface)}
.badge svg{width:44px;height:44px}
.badge.off{opacity:.38}
.note{font-size:.88rem;color:var(--muted)}
.inp{font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);width:100%}
.inp:focus{border-color:var(--ice);outline:none}
label{font-weight:700;display:block;margin-bottom:4px}
textarea.inp{min-height:90px;resize:vertical}
.flip{animation:flip .5s ease}
@keyframes flip{from{transform:rotateY(90deg);opacity:.3}to{transform:none;opacity:1}}
.pop{animation:pop .35s ease}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flip,.pop{animation:none}.scene *{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
<div class="wrap" id="app"></div>
<script>
/* ===== Inhalte: alle Fakten aus LF8 Modul 1–4 (Lösungen) und „Antworten wie in der Prüfung“ ===== */
const PERS = {
  jannes:{name:'Jannes Bruns',role:'Lagermeister',skin:'#E3B08A',hair:'#6B4A2F',hat:'beanie',hatC:'#2E6F8E',beard:true,beardC:'#6B4A2F',coat:'#3A4A5A',
    ok:['Moin! Genau so machen wir das.','Sauber. Das hätte ich nicht besser gekonnt.','Jo, passt. Weiter geht’s.'],
    bad:['Hm. Da bin ich anders unterwegs.','Nee, so kriegen wir das nicht hin.','Das fällt uns spätestens beim Zoll auf die Füße.']},
  ilka:{name:'Dr. Ilka Svensson',role:'Chef-Glaziologin',skin:'#F0CBAE',hair:'#D7B068',hat:'none',glasses:true,braid:true,coat:'#C8331F',
    ok:['Präzise. So arbeiten wir auch im Eislabor.','Die Daten stimmen. Sehr gut.','Genau. Das passt zu meinen Fragmenten.'],
    bad:['Das passt nicht zu den Daten aus dem Eiskern.','Messfehler! Bitte noch einmal genau hinsehen.','Damit würde jede Probe im Labor durchfallen.']},
  okafor:{name:'Merle Okafor',role:'Zollinspektorin',skin:'#7A4E32',hair:'#1E1410',hat:'cap',hatC:'#1F3A5F',coat:'#1F3A5F',
    ok:['Korrekt. Das nehme ich so ins Protokoll.','In Ordnung. Das Budget bleibt offen.','Einwandfrei.'],
    bad:['Das kann ich so nicht abnehmen.','Falsch. Ich mache mir eine Notiz.','So friere ich das Budget lieber ein.']},
  hansen:{name:'Brede Hansen',role:'Kapitän der Polarstern',skin:'#E8BE9C',hair:'#E4E4E4',hat:'captain',hatC:'#14243A',beard:true,beardC:'#EDEDED',coat:'#14243A',
    ok:['Volle Kraft voraus!','Gut gerechnet. So halten wir Kurs.','Das gefällt dem alten Kapitän.'],
    bad:['Mit diesem Kurs laufen wir auf Grund.','Hm. Das Eis wird dicker.','So kommen wir nicht aus dem Hafen.']},
  ahrens:{name:'Wiebke Ahrens',role:'Inhaberin Polarproviant',skin:'#E6AE84',hair:'#7A2E1E',hat:'none',coat:'#2F7A6B',
    ok:['Super, das spart uns Ärger.','Genau richtig entschieden.','Klasse. So läuft der Laden.'],
    bad:['Oh nein, das kostet uns Geld.','Das war keine gute Idee.','Da müssen wir noch einmal ran.']},
  funk:{name:'Hafenfunk',role:'Eilmeldung',radio:true,ok:['Lage im Griff. Das Eis taut ein Stück.'],bad:['Falsche Reaktion. Das Eis wächst.']}
};

const VERF = ['Stichtagsinventur','verlegte Inventur','permanente Inventur','Stichprobeninventur'];
const VERF_IHK = {
  'Stichtagsinventur':'Bestandsaufnahme am Bilanzstichtag oder innerhalb von 10 Tagen davor oder danach.',
  'verlegte Inventur':'Bestandsaufnahme innerhalb von 3 Monaten vor oder 2 Monaten nach dem Bilanzstichtag; das Ergebnis wird auf den Stichtag vor- oder zurückgerechnet.',
  'permanente Inventur':'Zählung zu beliebigen Zeitpunkten im Jahr; das WWS schreibt den Bestand laufend fort.',
  'Stichprobeninventur':'Bestandsaufnahme eines Teils der Ware nach dem Zufallsverfahren; mathematische Hochrechnung auf den ganzen Bestand.'
};
const VERF_WEIL = {
  'Stichtagsinventur':'… weil bis 10 Tage vor oder nach dem Stichtag gezählt wird.',
  'verlegte Inventur':'… weil mehr als 10 Tage, aber höchstens 3 Monate vor oder 2 Monate nach dem Stichtag gezählt und auf den 31.12. gerechnet wird.',
  'permanente Inventur':'… weil zu beliebigen Zeitpunkten gezählt und der Bestand im WWS laufend fortgeschrieben wird.',
  'Stichprobeninventur':'… weil nur ein Teil nach dem Zufallsverfahren gezählt und hochgerechnet wird.'
};
function verfQ(id,situation,correct,why){
  const w = VERF.filter(v=>v!==correct).concat(['Keine Inventur nötig – das WWS kennt den Bestand.']);
  const wrongWeil = VERF.filter(v=>v!==correct).map(v=>VERF_WEIL[v]);
  return {id,lvl:'ap',who:'jannes',q:'Lagermeister Jannes schlägt vor: „'+situation+'“ Welches Inventurverfahren ist das?',c:correct,w,
    term:correct,ihk:VERF_IHK[correct],why,weil:[VERF_WEIL[correct],wrongWeil[0],wrongWeil[1]]};
}
const POOL = {};
POOL.k1a = [
  verfQ('k1a1','Wir zählen am 2. Januar alles, also zwei Tage nach dem 31.12.','Stichtagsinventur','2 Tage nach dem Stichtag liegen innerhalb von 10 Tagen.'),
  verfQ('k1a2','Wir zählen am 20. Januar alles und rechnen auf den 31.12. zurück.','verlegte Inventur','20 Tage nach dem Stichtag sind mehr als 10 Tage, aber weniger als 2 Monate.'),
  verfQ('k1a3','Wir zählen jede Woche ein anderes Regal. Das WWS schreibt den Bestand fort.','permanente Inventur','Gezählt wird verteilt über das Jahr, das WWS schreibt laufend fort.'),
  verfQ('k1a4','Wir zählen nur zufällig ausgewählte Regalplätze und rechnen dann hoch.','Stichprobeninventur','Nur ein Teil wird nach dem Zufallsverfahren gezählt, dann wird hochgerechnet.'),
  verfQ('k1a5','Im Dezember ist im Shop viel los. Wir zählen Mitte Oktober und rechnen auf den 31.12. hoch.','verlegte Inventur','Mitte Oktober ist etwa 2,5 Monate vor dem Stichtag – erlaubt sind bis 3 Monate vorher.'),
  verfQ('k1a6','Wir zählen am 15. Februar und rechnen auf den 31.12. zurück.','verlegte Inventur','15. Februar ist 1,5 Monate nach dem Stichtag – erlaubt sind bis 2 Monate danach.')
];
POOL.k1b = [
  {id:'k1b1',lvl:'ap',who:'jannes',q:'Ein Kollege mault: „Unser WWS zeigt doch jeden Bestand an. Wozu sollen wir noch zählen?“ Was antwortet ihr?',
   c:'Das WWS zeigt den Sollbestand. Nur die körperliche Inventur zeigt den Istbestand.',
   w:['Das WWS zeigt den Istbestand, deshalb ist die Inventur freiwillig.','Mit MDE-Geräten gibt es keine Inventurdifferenzen mehr.','Die Inventur ist nur bei Lebensmitteln Pflicht.','Das WWS korrigiert Zählfehler automatisch.'],
   term:'Sollbestand und Istbestand',ihk:'Das WWS zeigt den Sollbestand; nur die körperliche Inventur zeigt den Istbestand.',
   why:'Diebstahl, Bruch und Zählfehler sieht kein Computer. Die Inventur ist nach HGB Pflicht.',
   weil:['… weil Diebstahl, Bruch und Zählfehler kein Computer sieht.','… weil das WWS den Istbestand jede Nacht selbst zählt.','… weil das HGB nur eine Buchinventur verlangt.']},
  {id:'k1b2',lvl:'ap',who:'jannes',q:'Die Zählnacht beginnt. Wie organisiert ihr das Zählen?',
   c:'Immer zu zweit: Eine Person zählt und sagt an, die andere schreibt.',
   w:['Jeder zählt allein, dann geht es schneller.','Wir schreiben die Zahlen aus dem WWS ab.','Wir zählen nur die teuren Artikel.','Wir schätzen die Kartons nach Gefühl.'],
   term:'Zählen zu zweit',ihk:'Beim Zählen immer zu zweit: Eine Person zählt und sagt an, die andere schreibt; Liste unterschreiben.',
   why:'Zu zweit passieren weniger Zählfehler. Abschreiben aus dem WWS wäre gar keine Inventur.',
   weil:['… weil so weniger Zählfehler passieren.','… weil das WWS dann nicht mehr gebraucht wird.','… weil nur so der Sollbestand gezählt werden kann.']},
  {id:'k1b3',lvl:'ap',who:'jannes',q:'Das WWS zeigt 40 Kartons Thermobecher. Ihr zählt 37 Kartons. Welche Zahl ist der Istbestand?',
   c:'37 Kartons – das ist wirklich da.',w:['40 Kartons – das sagt der Computer.','3 Kartons – das ist die Differenz.','77 Kartons – beides zusammen.','43 Kartons – Soll plus Differenz.'],
   term:'Istbestand',ihk:'Sollbestand = Bestand laut WWS. Istbestand = Bestand, der wirklich da ist (gezählt).',
   why:'Ist = ist wirklich da (sagt, wer zählt). Soll = sollte da sein (sagt der Computer).',
   weil:['… weil der Istbestand gezählt wird.','… weil der Istbestand immer der größere Wert ist.','… weil der Istbestand im WWS steht.']},
  {id:'k1b4',lvl:'ap',who:'jannes',q:'Welche Bestandsgröße zeigt das WWS für einen Artikel an, ohne dass jemand gezählt hat?',
   c:'Sollbestand',w:['Istbestand','Mindestbestand','Meldebestand','Höchstbestand'],
   term:'Sollbestand (Buchbestand)',ihk:'Das WWS rechnet: Anfangsbestand + Zugänge − Verkäufe = Sollbestand.',
   why:'Mindest-, Melde- und Höchstbestand sind festgelegte Grenzwerte, kein aktueller Bestand.',
   weil:['… weil das WWS rechnet: Anfangsbestand + Zugänge − Verkäufe.','… weil das WWS jede Nacht die Regale scannt.','… weil der Meldebestand immer angezeigt wird.']},
  {id:'k1b5',lvl:'ap',who:'ahrens',q:'Wiebke Ahrens überlegt, im nächsten Jahr die permanente Inventur einzuführen. Welchen Vorteil hat sie gegenüber der Stichtagsinventur?',

function draw(pool){
  const m=G.mode,seen=S.seen[m];const all=POOL[pool].filter(x=>inMode(x,m));

  if(!fresh.length){all.forEach(x=>delete seen[x.id]);fresh=all;G.resetHint=true;}

/* --- Entscheidung / Rechnung --- */
function curSub(st){const c=G.cur;if(c.k==null){c.k=0;c.s={};}return st.subs[c.k];}
function prepOpts(sub){
  const s=G.cur.s;if(s.opts)return s.opts;
  if(sub.kind==='mc'){const w=G.mode==='a'?shuffle(sub.w).slice(0,2):sub.w.slice();s.opts=shuffle([{t:sub.c,ok:true}].concat(w.map(t=>({t,ok:false}))));}
  else{const seen=new Set([fmtV(sub.fmt,sub.ans)]);const alts=[];for(const a of sub.alts){const f=fmtV(sub.fmt,a.v);if(!seen.has(f)&&a.v>0){seen.add(f);alts.push({t:f,ok:false,msg:a.msg});}if(alts.length===2)break;}
    let bump=1.1;while(alts.length<2){const v=sub.ans*bump;const f=fmtV(sub.fmt,v);if(!seen.has(f)){seen.add(f);alts.push({t:f,ok:false,msg:'Rechne noch einmal Schritt für Schritt.'});}bump+=0.13;}
    s.opts=shuffle([{t:fmtV(sub.fmt,sub.ans),ok:true}].concat(alts));}
  return s.opts;
}
function rCalc(st){
  const sub=curSub(st),s=G.cur.s,A=G.mode==='a';
  const asNum=sub.kind==='num'&&!A;
  let h=`<div class="panel">`;
  if(st.subs.length>1)h+=`<p class="eyebrow">Schritt ${G.cur.k+1} von ${st.subs.length}</p>`;
  const fin=s.done&&!(s.weilPhase&&!s.wdone);
  const mood=fin?(s.score>=10?'ok':'bad'):(s.weilPhase?'ok':'neutral');
  const line=fin?(s.score>=10?pickLine(st.who,'ok'):pickLine(st.who,'bad')):'';
  h+=talk(st.who,`<p>${esc(sub.q)}</p>`+(line?`<p><b>${esc(line)}</b></p>`:''),mood);
  if(st.ctx)h+=st.ctx;
  if(sub.scaf&&(A||sub.kind==='num'))h+=`<div class="scaf">${esc(sub.scaf)}</div>`;
  if(asNum){
    h+=`<div class="numin"><input id="numIn" inputmode="decimal" autocomplete="off" aria-label="Ergebnis" placeholder="Ergebnis" ${s.done?'disabled':''} value="${esc(s.val||'')}"><span>${sub.fmt==='pct'?'%':'€'}</span></div>`;
    if(!s.done)h+=`<button class="btn red" id="lock">Ergebnis festlegen</button>`;
  }else{
    const opts=prepOpts(sub);
    h+=`<div class="opts" role="group">`+opts.map((o,i)=>{let cl='opt';if(s.sel===i)cl+=' sel';if(s.done){if(o.ok)cl+=' right';else if(s.sel===i)cl+=' wrong';}if(s.gone&&s.gone.includes(i))cl+=' gone';
      return `<button class="${cl}" data-i="${i}" ${s.done||(s.gone&&s.gone.includes(i))?'disabled':''}><span class="k">${LETTERS[i]}</span><span>${esc(o.t)}</span></button>`;}).join('')+`</div>`;
    if(!s.done){h+=`<div class="row"><button class="btn red" id="lock" ${s.sel==null?'disabled':''}>Entscheidung festlegen</button>${A&&!s.gone?'<button class="btn alt" id="tip">Tipp: eine falsche Antwort streichen (−3)</button>':''}</div>`;}
  }
  // Profi: Begründung
  if(s.weilPhase){
    h+=`<div class="term"><span class="eyebrow">Profi · Begründung</span><p>Richtig entschieden! Jetzt die Begründung: Welcher „weil“-Satz passt?</p></div><div class="opts">`+
      s.weilOpts.map((o,i)=>{let cl='opt';if(s.wsel===i)cl+=' sel';if(s.wdone){if(o.ok)cl+=' right';else if(s.wsel===i)cl+=' wrong';}return `<button class="${cl}" data-w="${i}" ${s.wdone?'disabled':''}><span class="k">${i+1}</span><span>${esc(o.t)}</span></button>`;}).join('')+`</div>`;
    if(!s.wdone)h+=`<button class="btn red" id="wlock" ${s.wsel==null?'disabled':''}>Begründung festlegen</button>`;
  }
  if(s.done&&!(s.weilPhase&&!s.wdone)){
    const ok=s.score>=10;
    h+=`<div class="term ${ok?'ok':'bad'} pop"><span class="eyebrow">Fachbegriff · ${esc(sub.term)}</span>`;
    if(s.msg)h+=`<p><b>${esc(s.msg)}</b></p>`;
    if(!s.right)h+=`<p>Richtig ist: <b>${esc(sub.kind==='mc'?sub.c:fmtV(sub.fmt,sub.ans))}</b></p>`;
    if(s.right&&s.weilWrong)h+=`<p>Entscheidung richtig, Begründung nicht. Richtig wäre: <b>${esc(sub.weil[0])}</b> Ohne passende Begründung gibt es keine Punkte.</p>`;
    if(sub.kind==='num')h+=`<p class="note">Rechenweg: ${esc(sub.why)}</p>`;
    h+=`<p class="note">+${s.score} Punkte</p></div><button class="btn red" id="nx">Weiter</button>`;
  }
  return h+'</div>';
}
function pickLine(who,k){const a=PERS[who][k];return a[(G.i+(G.cur.k||0))%a.length];}
bind.calc=(st)=>{
  const sub=st.subs[G.cur.k],s=G.cur.s;
  app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{s.sel=+b.dataset.i;render();});
  const tip=document.getElementById('tip');
  if(tip)tip.onclick=()=>{const opts=prepOpts(sub);const wrong=opts.map((o,i)=>o.ok?-1:i).filter(i=>i>=0&&i!==s.sel);s.gone=[wrong[0]];s.tip=true;render();};
  const lock=document.getElementById('lock');
  if(lock)lock.onclick=()=>{
    if(sub.kind==='num'&&G.mode==='p'){
      const inp=document.getElementById('numIn');const v=parseNum(inp.value);s.val=inp.value;
      if(isNaN(v)){inp.focus();inp.placeholder='Bitte eine Zahl eingeben';inp.value='';return;}
      const tol=sub.fmt==='pct'?0.001:0.006;
      const right=Math.abs(v-sub.ans)<tol||(sub.exact!=null&&Math.abs(v-sub.exact)<0.01);
      s.right=right;if(!right){const hit=sub.alts.find(a=>Math.abs(a.v-v)<(sub.fmt==='pct'?0.06:0.01));s.msg=hit?hit.msg:(sub.fmt==='pct'&&Math.abs(v-sub.exact)<0.2?'Fast! Achte auf das Runden: eine Stelle nach dem Komma.':'');}
      finishSub(st,sub,right?10:0);return;}
    const o=prepOpts(sub)[s.sel];s.right=o.ok;s.msg=o.ok?'':(o.msg||'');
    if(o.ok&&G.mode==='p'&&sub.kind==='mc'&&sub.weil){s.weilPhase=true;s.weilOpts=shuffle([{t:sub.weil[0],ok:true},{t:sub.weil[1],ok:false},{t:sub.weil[2],ok:false}]);s.done=true;s.score=0;render();return;}
    finishSub(st,sub,o.ok?(s.tip?7:10):0);
  };
  app.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{s.wsel=+b.dataset.w;render();});
  const wl=document.getElementById('wlock');
  if(wl)wl.onclick=()=>{s.wdone=true;const ok=s.weilOpts[s.wsel].ok;s.weilWrong=!ok;s.done=false;finishSub(st,sub,ok?10:0,true);};
  const nx=document.getElementById('nx');
  if(nx)nx.onclick=()=>{if(G.cur.k<st.subs.length-1){G.cur.k++;G.cur.s={};render();}else next();};
  const inp=document.getElementById('numIn');if(inp&&!s.done){inp.addEventListener('keydown',e=>{if(e.key==='Enter')lock.click();});}
};
function finishSub(st,sub,score){
  const s=G.cur.s;s.done=true;s.score=score;G.pts+=score;G.max+=10;
  if(score>=10)G.cargo++;else if(!s.right)G.ice=Math.min(6,G.ice+1);
  const chosen=sub.kind==='num'&&G.mode==='p'?(s.val||'')+(sub.fmt==='pct'?' %':' €'):(prepOpts(sub)[s.sel]||{}).t;
  G.res.push({ch:st.ch,q:sub.q,mk:score>=10?'ok':(s.right?'mid':'no'),chosen,correct:sub.kind==='mc'?sub.c:fmtV(sub.fmt,sub.ans),
    why:sub.kind==='num'?('Rechenweg: '+sub.why):sub.why,ihk:sub.ihk,score,max:10,extra:s.weilWrong?'Begründung passte nicht.':(s.tip?'Mit Tipp.':'')});
  render();
}

function rChend(st){

  return `<div class="panel pop"><p class="eyebrow">Kapitel ${st.ch} geschafft · ${p} von ${m} Punkten</p><h2>${ok?'Datenfragment geborgen':'Fragment beschädigt'}</h2>${core}
  <p>${ok?'Die Glaziologin liest das Fragment aus. Ein Stück der Sicherung ist zurück.'+(G.cur.melt?' Das Eis taut ein Stück.':''):'Das Fragment ist nur halb lesbar. Nicht schlimm – im nächsten Kapitel holt ihr Punkte zurück.'}</p>
  ${st.ch===5?'':'<p class="note">Eis um das Schiff: '+G.ice+' von 6</p>'}<button class="btn red" id="nx">${st.ch===5?'Zur Auswertung':'Weiter'}</button></div>`;
}

   c.opts.map((o,i)=>{let cl='opt';if(c.sel===i)cl+=' sel';if(c.done){if(o.ok)cl+=' right';else if(c.sel===i)cl+=' wrong';}return `<button class="${cl}" data-i="${i}" ${c.done?'disabled':''}><span class="k">${LETTERS[i]}</span><span>${esc(o.t)}</span></button>`;}).join('')+'</div>';
  if(!c.done)h+=`<button class="btn red" id="lock" ${c.sel==null?'disabled':''}>Entscheidung festlegen</button>`;
  else h+=`<div class="term ${c.right?'ok':'bad'}"><span class="eyebrow">${c.right?'Das Eis taut ein Stück':'Das Eis wächst'} · ${esc(q.term)}</span><p>${esc(q.ihk)}</p><p class="note">+${c.right?5:0} Punkte</p></div><button class="btn red" id="nx">Weiter</button>`;
  return h+'</div>';
}
bind.event=(st)=>{const c=G.cur;
  app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{c.sel=+b.dataset.i;render();});
  const l=document.getElementById('lock');if(l)l.onclick=()=>{c.done=true;c.right=c.opts[c.sel].ok;G.max+=5;
    if(c.right){G.pts+=5;G.ice=Math.max(0,G.ice-1);G.cargo++;}else G.ice=Math.min(6,G.ice+1);
    G.res.push({ch:st.ch,q:st.q.title+': '+st.q.q,mk:c.right?'ok':'no',chosen:c.opts[c.sel].t,correct:st.q.c,why:'',ihk:st.q.ihk,score:c.right?5:0,max:5,ev:true});render();};

/* --- Budget: Maßnahmen gegen Diebstahl --- */
const BUDGET=1500;
function rBudget(st){
  const c=G.cur;if(!c.list){c.list=shuffle(MASS);c.sel=[];}
  const cost=c.sel.reduce((a,i)=>a+c.list[i].cost,0);
  let h=`<div class="panel">${talk('ahrens',`<p>„Im Shop verschwinden Sachen. Ihr habt <b>${fmtE(BUDGET)}</b>. Wählt bis zu <b>drei</b> Maßnahmen gegen Ladendiebstahl.“</p>`+(c.done?`<p><b>${esc(c.good===c.sel.length&&c.good>0?pickLine('ahrens','ok'):pickLine('ahrens','bad'))}</b></p>`:''),c.done?(c.bad?'bad':'ok'):'neutral')}
  <div class="prog" aria-label="Budget"><i style="width:${Math.min(100,cost/BUDGET*100)}%"></i></div><p class="note">Ausgegeben: ${fmtE(cost)} von ${fmtE(BUDGET)} · gewählt: ${c.sel.length} von 3</p><div class="opts">`;
  h+=c.list.map((m,i)=>{const on=c.sel.includes(i);const dis=c.done||(!on&&(c.sel.length>=3||cost+m.cost>BUDGET));let cl='opt'+(on?' sel':'');if(c.done&&on)cl+=m.good?' right':' wrong';
    return `<button class="${cl}" data-i="${i}" ${dis?'disabled':''} aria-pressed="${on}"><span class="k">${on?'✓':''}</span><span>${esc(m.t)}</span><span class="cost">${fmtI(m.cost)} €</span></button>`;}).join('')+'</div>';
  if(!c.done)h+=`<button class="btn red" id="lock" ${c.sel.length?'':'disabled'}>Entscheidung festlegen</button>`;
  else{h+=`<div class="term ${c.bad?'bad':'ok'}"><span class="eyebrow">Fachbegriff · Maßnahmen gegen Diebstahl</span>`+
    c.sel.filter(i=>!c.list[i].good).map(i=>`<p><b>${esc(c.list[i].t)}:</b> ${esc(c.list[i].why)}</p>`).join('')+
    `<p>Wirksam sind: Kameras, Spiegel, Warensicherungsetiketten, Ladendetektiv, geschultes Personal, abgeschlossene Vitrinen, übersichtliche Platzierung.</p><p class="note">+${c.score} Punkte</p></div><button class="btn red" id="nx">Weiter</button>`;}
  return h+'</div>';
}
bind.budget=(st)=>{const c=G.cur;
  app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;c.sel=c.sel.includes(i)?c.sel.filter(x=>x!==i):c.sel.concat(i);render();});
  const l=document.getElementById('lock');if(l)l.onclick=()=>{c.done=true;c.good=c.sel.filter(i=>c.list[i].good).length;c.bad=c.sel.length-c.good;
    c.score=Math.max(0,Math.round(c.good*10/3)-c.bad*3);G.pts+=c.score;G.max+=10;if(c.score>=7)G.cargo++;else G.ice=Math.min(6,G.ice+1);
    G.res.push({ch:st.ch,q:'Drei Maßnahmen gegen Ladendiebstahl wählen',mk:c.score>=10?'ok':c.score>=5?'mid':'no',chosen:c.sel.map(i=>c.list[i].t).join(' · '),
      correct:'drei echte Maßnahmen, z. B. Spiegel, Etiketten, Personal schulen',why:'Ein WWS oder MDE-Gerät verhindert keine Differenzen – das sind die typischen Ablenker.',ihk:'Nenne vier Maßnahmen gegen Ladendiebstahl: Kameras, Spiegel/übersichtliche Platzierung, Warensicherungsetiketten/Vitrinen, Ladendetektiv/geschultes Personal.',score:c.score,max:10});render();};
  const n=document.getElementById('nx');if(n)n.onclick=next;};

/* --- Mini-Spiele: Ursachen-Radar und Bilanz-Waage --- */
function rSort(st){
  const c=G.cur;if(c.idx==null){c.idx=0;c.ans=[];}
  const radar=st.kind==='radar';const cats=radar?RADAR_CATS:WAAGE_CATS;const who=radar?'ilka':'okafor';
  const title=radar?'Mini-Spiel: Ursachen-Radar':'Mini-Spiel: Die Bilanz-Waage';
  const ask=radar?'Was passiert bei diesem Fehler? Ordnet zu.':'Wohin gehört dieser Posten in der Bilanz?';
  let h=`<div class="panel"><p class="eyebrow">${title} · Karte ${Math.min(c.idx+1,st.cards.length)} von ${st.cards.length}</p>`;
  if(c.idx<st.cards.length){
    const card=st.cards[c.idx];const a=c.ans[c.idx];
    h+=talk(who,'<p>'+ask+'</p>',a?(a.ok?'ok':'bad'):'neutral')+`<div class="bigcard pop">${esc(card.t)}</div><div class="cats">`+
      cats.map(k=>{let cl='opt';if(a){if(k.k===card.k)cl+=' right';else if(a.pick===k.k)cl+=' wrong';}return `<button class="${cl}" data-c="${k.k}" ${a?'disabled':''}><span><b>${esc(k.t)}</b><br><span class="note">${esc(k.s)}</span></span></button>`;}).join('')+'</div>';
    if(a)h+=`<div class="term ${a.ok?'ok':'bad'}"><span class="eyebrow">${a.ok?'Richtig':'Nicht ganz'}</span><p>${esc(card.t)} → <b>${esc(cats.find(k=>k.k===card.k).t)}</b></p>${radar?'<p class="note">Eselsbrücke: Ein Fehler im Computer verschiebt das Soll. Ein Fehler im Regal verschiebt das Ist.</p>':'<p class="note">Anlagevermögen bleibt auf Dauer. Umlaufvermögen ist unterwegs. Eigenkapital = eigenes Geld. Fremdkapital = fremdes Geld.</p>'}</div><button class="btn red" id="nc">${c.idx<st.cards.length-1?'Nächste Karte':'Auswertung'}</button>`;
  }else{
    const ok=c.ans.filter(a=>a.ok).length;
    h+=talk(who,`<p>${ok} von ${st.cards.length} richtig zugeordnet.</p>`,ok*2>=st.cards.length?'ok':'bad')+`<p class="note">+${c.score} Punkte</p><button class="btn red" id="nx">Weiter</button>`;
  }
  return h+'</div>';
}
bind.sort=(st)=>{const c=G.cur;
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const card=st.cards[c.idx];c.ans[c.idx]={pick:b.dataset.c,ok:b.dataset.c===card.k};render();});
  const nc=document.getElementById('nc');if(nc)nc.onclick=()=>{c.idx++;if(c.idx>=st.cards.length){const ok=c.ans.filter(a=>a.ok).length;c.score=Math.round(10*ok/st.cards.length);G.pts+=c.score;G.max+=10;
      if(c.score>=7)G.cargo++;else if(c.score<5)G.ice=Math.min(6,G.ice+1);
      const cats=st.kind==='radar'?RADAR_CATS:WAAGE_CATS;const wrong=st.cards.filter((x,i)=>!c.ans[i].ok);
      G.res.push({ch:st.ch,q:st.kind==='radar'?'Ursachen-Radar: Fehler zuordnen':'Bilanz-Waage: Posten zuordnen',mk:c.score>=10?'ok':c.score>=5?'mid':'no',chosen:ok+' von '+st.cards.length+' richtig',
        correct:wrong.length?wrong.map(x=>x.t+' → '+cats.find(k=>k.k===x.k).t).join(' · '):'alles richtig',
        why:st.kind==='radar'?'Ein Fehler im Computer verschiebt das Soll. Ein Fehler im Regal (Diebstahl) verschiebt das Ist.':'Aktiva: Anlagevermögen (bleibt lange) und Umlaufvermögen (ändert sich ständig). Passiva: Eigenkapital und Fremdkapital.',
        ihk:st.kind==='radar'?'Bruch/Verderb nicht ausgebucht, Rücksendung nicht erfasst, Lieferung doppelt erfasst → Soll zu hoch → Ist < Soll. Lieferung nicht erfasst, Verkauf doppelt gescannt → Soll zu niedrig → Ist > Soll.':'Anlagevermögen: Vermögensteile, die dem Betrieb lange dienen. Umlaufvermögen: Vermögensteile, die sich ständig verändern. Fremdkapital: Schulden des Betriebs.',score:c.score,max:10});}
    render();};
  const n=document.getElementById('nx');if(n)n.onclick=next;};

/* --- Finale: Fehlerjagd --- */
function rHunt(st){
  const f=st.fj,c=G.cur,P=G.mode==='p';if(!c.marks){c.marks={};c.reasons={};}
  const errs=f.l.concat(f.r).filter(x=>x[2]).length;
  const cell=(x,side,i)=>{const id=side+i;const isErr=!!x[2];let cl='cell';
    if(c.checked){if(isErr&&c.marks[id])cl+=' hit';else if(isErr)cl+=' lost';else if(c.marks[id])cl+=' miss';}else if(c.marks[id])cl+=' mark';
    return `<button class="${cl}" data-id="${id}" ${c.checked?'disabled':''}><span>${esc(x[0])}</span><span>${fmtE(x[1])}</span></button>`;};
  let h=`<div class="panel">${talk('ilka',`<p>„Das ist die ${f.kind} aus dem gehackten System. <b>${errs} Posten</b> stehen an der falschen Stelle. Tippt sie an.“</p>`,c.checked?(c.score>=7?'ok':'bad'):'neutral')}
  <div class="tk"><div class="l"><div class="hd"><span>${f.L}</span><span>€</span></div>${f.l.map((x,i)=>cell(x,'l',i)).join('')}</div><div><div class="hd"><span>${f.R}</span><span>€</span></div>${f.r.map((x,i)=>cell(x,'r',i)).join('')}</div></div>`;
  const nm=Object.values(c.marks).filter(Boolean).length;
  if(!c.checked)h+=`<p class="note">Markiert: ${nm} von ${errs}</p><button class="btn red" id="chk" ${nm?'':'disabled'}>Prüfen</button>`;
  else{
    const items=[];f.l.forEach((x,i)=>x[2]&&items.push(['l'+i,x]));f.r.forEach((x,i)=>x[2]&&items.push(['r'+i,x]));
    if(P&&!c.rdone){
      const found=items.filter(([id])=>c.marks[id]);
      h+=`<div class="term"><span class="eyebrow">Profi · Begründung</span><p>Warum ist der Posten falsch?</p></div>`;
      found.forEach(([id,x])=>{h+=`<p><b>${esc(x[0])}</b></p><div class="opts">`+f.reasons.map((r,ri)=>{let cl='opt'+(c.reasons[id]===ri?' sel':'');return `<button class="${cl}" data-r="${id}|${ri}"><span class="k">${ri+1}</span><span>${esc(r)}</span></button>`;}).join('')+'</div>';});
      const all=found.every(([id])=>c.reasons[id]!=null);
      h+=`<button class="btn red" id="rlock" ${all?'':'disabled'}>Begründungen festlegen</button>`;
    }else{
      h+=`<div class="term ${c.score>=7?'ok':'bad'}"><span class="eyebrow">Auflösung</span>`+items.map(([id,x])=>{const r=P&&c.marks[id]?(f.reasons[c.reasons[id]]===x[2]?' ✓ Begründung richtig':' ✗ Begründung falsch'):'';return `<p><b>${esc(x[0])}</b>${c.marks[id]?' (gefunden)':' (übersehen)'}: ${esc(x[2])}${r}</p>`;}).join('')+
        (c.falseMarks?`<p>${c.falseMarks} Posten stand richtig, wurde aber markiert (−3 je Fehlklick).</p>`:'')+`<p class="note">+${c.score} Punkte</p></div><button class="btn red" id="nx">Weiter</button>`;
    }
  }
  return h+'</div>';
}
function scoreHunt(st){const f=st.fj,c=G.cur,P=G.mode==='p';
  const items=[];f.l.forEach((x,i)=>x[2]&&items.push(['l'+i,x]));f.r.forEach((x,i)=>x[2]&&items.push(['r'+i,x]));
  const hits=items.filter(([id])=>c.marks[id]);const good=P?hits.filter(([id,x])=>f.reasons[c.reasons[id]]===x[2]).length:hits.length;
  const fm=Object.keys(c.marks).filter(id=>c.marks[id]&&!items.find(([i])=>i===id)).length;c.falseMarks=fm;
  c.score=Math.max(0,Math.round(10*good/items.length)-3*fm);G.pts+=c.score;G.max+=10;
  G.huntClean=hits.length===items.length&&fm===0;
  if(c.score>=7)G.cargo++;else G.ice=Math.min(6,G.ice+1);
  G.res.push({ch:st.ch,q:'Fehlerjagd: falsche Posten in der '+f.kind,mk:c.score>=10?'ok':c.score>=5?'mid':'no',chosen:hits.length+' von '+items.length+' gefunden'+(fm?', '+fm+' Fehlklick(s)':''),
    correct:items.map(([,x])=>x[0]).join(' · '),why:items.map(([,x])=>x[0]+': '+x[2]).join(' '),ihk:f.kind==='GuV'?'Links (Soll) stehen die Aufwendungen, rechts (Haben) die Erträge. Forderungen, Kasse oder Darlehen gehören nicht in die GuV, sondern in die Bilanz.':'Aktiva = Vermögen (Anlage- und Umlaufvermögen). Passiva = Kapital (Eigen- und Fremdkapital).',score:c.score,max:10});
}
bind.hunt=(st)=>{const c=G.cur;
  app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{c.marks[b.dataset.id]=!c.marks[b.dataset.id];render();});
  const k=document.getElementById('chk');if(k)k.onclick=()=>{c.checked=true;if(G.mode==='a'){c.rdone=true;scoreHunt(st);}else{      const items=[];st.fj.l.forEach((x,i)=>x[2]&&items.push('l'+i));st.fj.r.forEach((x,i)=>x[2]&&items.push('r'+i));if(!items.some(id=>c.marks[id])){c.rdone=true;scoreHunt(st);}}render();};
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const [id,ri]=b.dataset.r.split('|');c.reasons[id]=+ri;render();});
  const rl=document.getElementById('rlock');if(rl)rl.onclick=()=>{c.rdone=true;scoreHunt(st);render();};
  const n=document.getElementById('nx');if(n)n.onclick=next;};

/* --- Auswertung --- */
function rEnd(st){
  const c=G.cur;const pct=G.max?Math.round(100*G.pts/G.max):0;const stars=pct>=85?3:pct>=65?2:pct>=40?1:0;
  const win=G.ice<=3;
  if(!c.saved){c.saved=true;const m=G.mode;S.plays[m]=(S.plays[m]||0)+1;c.newRec=pct>S.rec[m];if(c.newRec)S.rec[m]=pct;S.ber[G.ber]=1;
    const nb=[];const give=k=>{if(!S.badges[k]){S.badges[k]=1;nb.push(k);}};
    give('first');if(G.ice===0)give('icefree');if(S.ber.proviant&&S.ber.kleidung&&S.ber.souvenir)give('allber');if(m==='p'&&stars===3)give('pro3');if(G.huntClean)give('hunter');if(G.frags.filter(f=>f==='ok').length===5)give('frags');
    c.nb=nb;saveS();}
  const story=G.ice<=1?'Die Polarstern legt pünktlich ab. Über dem Eis leuchtet ein Polarlicht.':win?'Die Polarstern legt ab – mit ein paar Stunden Verspätung, aber das Budget ist frei.':'Das Budget bleibt eingefroren. Die Polarstern liegt im Eis fest. Versucht es noch einmal!';
  const nfr=G.frags.filter(f=>f==='ok').length;
  let h=`<div class="score pop"><p class="eyebrow">Expeditionsbericht · ${esc(G.team)}</p><div class="stars">${[0,1,2].map(i=>starSVG(i<stars)).join('')}</div>
  <div class="big">${G.pts} / ${G.max}</div><p><b>${pct} %</b> · ${G.mode==='a'?'Anfänger':'Profi'} · ${esc(BEREICHE[G.ber].t)}</p>
  <p>Eis: ${G.ice} von 6 · Datenfragmente: ${nfr} von 5${c.newRec?' · <b>Neuer Rekord!</b>':''}</p></div>
  <div class="panel">${talk(win?'hansen':'okafor','<p>'+esc(story)+'</p>',win?'ok':'bad')}
  ${win?'<p>Und die geheimen Konten? Das „geheime Projekt“ war kein Betrug: ein Messgerät für Schulklassen, bezahlt aus Spenden. Die Hacker hatten es aus den Listen gelöscht und Posten verschoben, damit alles verdächtig aussieht. Ihr habt die Zahlen gerettet.</p>':'<p>Die Fragmente reichen noch nicht, um die geheimen Konten aufzuklären. Lest unten nach, wo es gehakt hat.</p>'}</div>`;
  if(c.nb&&c.nb.length)h+=`<div class="panel"><h3>Neues Abzeichen</h3><div class="badges">${c.nb.map(k=>{const i=BADGES.findIndex(b=>b.k===k);return `<div class="badge">${badgeSVG(i)}<b>${BADGES[i].t}</b><span class="note">${BADGES[i].s}</span></div>`;}).join('')}</div></div>`;
  h+=`<div class="panel"><h3>Eure Entscheidungen</h3><div class="res">`+G.res.map(r=>`<div class="ri"><span class="mk ${r.mk}">${r.mk==='ok'?'✓ richtig':r.mk==='mid'?'~ teilweise':'✗ falsch'} · Kapitel ${r.ch} · ${r.score}/${r.max}</span><b>${esc(r.q)}</b>
    <span>Eure Wahl: ${esc(r.chosen||'–')}</span>${r.mk!=='ok'?`<span>Besser: <b>${esc(r.correct)}</b></span>`:''}${r.extra?`<span class="note">${esc(r.extra)}</span>`:''}${r.why?`<span class="note">${esc(r.why)}</span>`:''}
    <div class="ihk"><b>So steht es in der Prüfung</b>${esc(r.ihk)}</div></div>`).join('')+`</div></div>`;
  h+=`<div class="panel"><h3>Prüfungskasten: die Formeln</h3><div class="scaf">Prozentsatz = Prozentwert × 100 : Grundwert<br>Inventurdifferenz % = Differenz € × 100 : Soll €<br>Eigenkapitalanteil = EK × 100 : Bilanzsumme<br>Gewinn = Erträge − alle Aufwendungen<br>Rohgewinn = Umsatzerlöse − Wareneinsatz<br>Veränderung % = (neu − alt) × 100 : alt</div><p class="note">Typische Ablenker: „WWS verhindert Differenzen“, „vom Ist gerechnet“, „Bilanz zeigt Aufwand und Ertrag“, „Forderungen in der GuV“.</p></div>`;
  const pf=st.pf;
  h+=`<div class="panel"><h3>Für Profis${G.mode==='a'?' (freiwillig)':''}</h3><p><b>${esc(pf.q)}</b></p><label for="pfIn" class="sr">Eure Antwort</label><textarea class="inp" id="pfIn" placeholder="Eure Antwort – erst schreiben, dann vergleichen">${esc(c.pfText||'')}</textarea>
   ${c.pfShow?`<div class="term"><span class="eyebrow">Musterlösung</span><p>${esc(pf.a)}</p></div>`:'<button class="btn alt" id="pfBtn">Musterlösung zeigen</button>'}</div>`;
  h+=`<div class="row"><button class="btn red" id="again">Noch einmal (gleicher Modus)</button><button class="btn alt" id="ober">Anderes Lager</button><button class="btn alt" id="omode">Anderer Modus</button></div>`;
  return h;
}
bind.end=()=>{const c=G.cur;
  const pb=document.getElementById('pfBtn');if(pb)pb.onclick=()=>{c.pfText=document.getElementById('pfIn').value;c.pfShow=true;render();};
  const m=G.mode,b=G.ber,t=G.team;
  document.getElementById('again').onclick=()=>{buildGame(m,b,t);render();window.scrollTo(0,0);};
  document.getElementById('ober').onclick=()=>{startSel={ber:null,mode:m,confirmReset:false};renderStart();window.scrollTo(0,0);};
  document.getElementById('omode').onclick=()=>{startSel={ber:b,mode:m==='a'?'p':'a',confirmReset:false};renderStart();window.scrollTo(0,0);};
};
renderStart();
</script></body></html>
