// ---------- Musik (Web Audio, eigene Bausteine, Standard aus) ----------
const MUS = { on:false, ac:null, master:null, timer:null, step:0, next:0, fanfare:false }; MUS.on = !!STORE.music;
function audioInit(){ if(MUS.ac) { if(MUS.ac.state==="suspended") MUS.ac.resume(); return; }
  try{ const AC = window.AudioContext || window.webkitAudioContext; MUS.ac = new AC(); MUS.master = MUS.ac.createGain(); MUS.master.gain.value = 0.3; MUS.master.connect(MUS.ac.destination); }catch(e){ MUS.ac = null; } }
function tone(f, t, d, type, vol){ const ac = MUS.ac, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+d); o.connect(g); g.connect(MUS.master); o.start(t); o.stop(t+d+0.02); }
function kick(t){ const ac = MUS.ac, o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(45, t+0.12); g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.18); o.connect(g); g.connect(MUS.master); o.start(t); o.stop(t+0.2); }
function noise(t, d, vol, hp){ const ac = MUS.ac, b = ac.createBuffer(1, Math.floor(ac.sampleRate*d), ac.sampleRate), x = b.getChannelData(0); for(let i=0;i<x.length;i++) x[i] = Math.random()*2-1;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; f.type = "highpass"; f.frequency.value = hp; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+d); s.connect(f); f.connect(g); g.connect(MUS.master); s.start(t); }
const midi = n => 440*Math.pow(2,(n-69)/12);
const BASS = [45,0,45,57,0,45,0,52, 48,0,48,55,0,47,0,43];
function tick(){ const ac = MUS.ac; if(!ac) return; const sp = 60/124/4;
  const hot = ui.m && ui.m.n && ui.m.i >= ui.m.n-1;
  while(MUS.next < ac.currentTime + 0.15){ const st = MUS.step % 16, t = MUS.next;
    if(st%4===0) kick(t);
    if(st===4 || st===12) noise(t, 0.12, 0.35, 1200);
    if(st%2===1 || hot) noise(t, 0.04, hot?0.16:0.12, 7000);
    if(BASS[st]) tone(midi(BASS[st] + (hot?12:0)), t, sp*1.6, "sawtooth", 0.12);
    if(hot && st%4===2) tone(midi(69 + [0,3,7,10][(MUS.step>>2)%4]), t, sp, "square", 0.05);
    MUS.next += sp; MUS.step++; } }
function musicStart(){ if(MUS.timer || !MUS.ac) return; MUS.next = MUS.ac.currentTime + 0.05; MUS.step = 0; MUS.timer = setInterval(tick, 40); }
function musicStop(){ if(MUS.timer){ clearInterval(MUS.timer); MUS.timer = null; } }
function fanfare(){ if(!MUS.ac) return; const t = MUS.ac.currentTime + 0.05; [57,61,64,69].forEach((n,i)=> tone(midi(n), t+i*0.13, 0.25, "square", 0.12)); [57,61,64,69].forEach(n => tone(midi(n), t+0.6, 1.1, "triangle", 0.12)); kick(t+0.6); }
function musicSync(){ const want = MUS.on && !document.hidden && S && S.step==="mini" && ui.m && !ui.m.done && !ui.fb;
  if(want){ audioInit(); musicStart(); } else musicStop();
  if(MUS.on && S && S.step==="final" && !MUS.fanfare){ MUS.fanfare = true; audioInit(); fanfare(); }
  if(S && S.step!=="final") MUS.fanfare = false; }
document.addEventListener("visibilitychange", musicSync);

const MINI_TITLE = {bon:"Bon-Detektive", ablauf:"Kassieren in der richtigen Reihenfolge", fsk:"Echt oder falsch? Fühlen – Sehen – Kippen", zahlart:"Welche Zahlungsart ist das?", jugend:"Jugendschutz-Check", bericht:"Der Kassenbericht", ampel:"Die Geschäftsfähigkeits-Ampel", gna:"Gültig, nichtig oder anfechtbar?", zeit:"Wann ist der Kaufvertrag da?", besitz:"Besitzer oder Eigentümer?"};
function drawMini(t, mode){ const pro = mode==="pro"; const m = {};
  if(t==="bon"){ const easy = ["anschrift","datum","artikel","summe","zahl","rueck","bon"], hard = ["stnr","gtin","ust","tse","ep","gp"];
    const e = shuffle(easy), hd = shuffle(hard); m.items = pro ? shuffle([hd[0],hd[1],hd[2],e[0]]) : shuffle([e[0],e[1],e[2],hd[0]]); m.n = 4; }
  if(t==="ablauf"){ m.items = shuffle(ABLAUF.map((x,i)=>i)); m.placed = pro ? [] : [0]; m.n = 1; }
  if(t==="fsk"){ m.items = pick(FSK, pro?5:4, "m-fsk"); m.n = m.items.length; }
  if(t==="zahlart"){ m.items = pick(ZAHL, 5, "m-zahl"); m.n = 5; m.zo = m.items.map(it => shuffle([it.a].concat(shuffle(ZAHL.filter(z=>z.a!==it.a).map(z=>z.a)).slice(0,3)))); }
  if(t==="jugend"){ let it = pick(JUG, 5, "m-jug"); if(it.filter(x=>x.ok).length<2){ const ok = shuffle(JUG.filter(x=>x.ok && !it.includes(x))); it[it.findIndex(x=>!x.ok)] = ok[0]; } m.items = shuffle(it); m.n = 5; }
  if(t==="bericht"){ const r = (a,b,st)=> Math.round((a + Math.floor(RNG()*((b-a)/st+1))*st)*100)/100;
    m.v = { end:r(1200,3600,0.1), absch:[1000,1500,2000][Math.floor(RNG()*3)], wg:[200,250,300,400][Math.floor(RNG()*4)], card:r(1800,4800,0.1) }; m.n = 1; }
  if(t==="ampel"){ m.items = pick(AMPEL, 5, "m-ampel"); m.n = 5; }
  if(t==="gna"){ m.items = pick(GNA, 5, "m-gna"); m.n = 5; }
  if(t==="zeit"){ m.items = pick(ZEIT, 2, "m-zeit"); m.n = 2; }
  if(t==="besitz"){ m.items = pick(BESITZ, 4, "m-besitz"); m.n = 4; }
  return m;
}

const parseNum = s => { s = String(s||"").replace(/\s|€/g,""); if(s.includes(",")) s = s.replace(/\./g,"").replace(",","."); else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,""); const n = parseFloat(s); return isNaN(n)?null:n; };

  sign(b){ ui.m.sign[b.dataset.g] = b.dataset.v; render(); },
  signchk(){ const m = ui.m; m.signOk = m.sign.absch==="+" && m.sign.wg==="-"; m.got += (m.sign.absch==="+"?2:0) + (m.sign.wg==="-"?2:0); m.stage = 1; render(); },
  calc(b){ const m = ui.m, st = +b.dataset.v; const val = parseNum($("#in"+st) && $("#in"+st).value); if(val==null){ toast("Bitte eine Zahl eingeben, z. B. 2.345,60"); return; }
    if(st===1){ m.losOk = Math.abs(val-m.los)<0.005; if(m.losOk) m.got += 3; m.stage = 2; } else { m.umsOk = Math.abs(val-m.ums)<0.005; if(m.umsOk) m.got += 3; m.stage = 3; } render(); },
  bdone(){ ACT.minidone(); },
  bes(b){ const m = ui.m; if(b.dataset.g==="b") m.pickB = +b.dataset.v; else m.pickE = +b.dataset.v; render(); },
  beschk(){ const m = ui.m, it = m.items[m.i]; const okB = m.pickB===it.b, okE = m.pickE===it.e; m.got += (okB?0.5:0) + (okE?0.5:0); markSeen("m-besitz", it.id);
    ui.fb = {ok: okB&&okE, html: `Besitzer: <b>${esc(it.p[it.b])}</b> (hat die Sache) · Eigentümer: <b>${esc(it.p[it.e])}</b> (ihm gehört sie).`}; render(); },
  minidone(){ finishMini(); afterMini(); render(); toTop(); },
  tasp(b){ ui.ta = b.dataset.v; render(); },
  tsl(b){ ui.ts = ui.ts || [null,null,null]; ui.ts[+b.dataset.g] = +b.dataset.v; render(); },
  tchk(){ checkTalk(); render(); },
  tnext(){ afterTalk(); render(); toTop(); },
  pans(b){ ui.pa = +b.dataset.v; const ok = ui.pa===0; markSeen("p-"+chap().id, ui.pq.id); S.prof.push({ch:chap().id, q:ui.pq, ok}); S.max += 5; if(ok){ S.pts += 5; addRuf(2); } render(); },
  pnext(){ advanceChapter(); render(); toTop(); },
  evnext(){ ui.evDone = true; advanceChapter(); render(); toTop(); },
  again(){ pre = {team:S.team, route:S.route, mode:S.mode, code:S.code||""}; newGame(); },
  menu(){ pre = {team:S.team, route:S.route, mode:S.mode, code:S.code||""}; S = null; ui = {}; render(); toTop(); }
};
function keepTeam(){ const t = $("#team"); if(t) pre.team = t.value; const c = $("#code"); if(c) pre.code = c.value; }
function toTop(){ window.scrollTo({top:0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"}); }
document.addEventListener("click", e => { const b = e.target.closest("[data-act]"); if(!b || b.disabled) return; const f = ACT[b.dataset.act]; if(f) f(b); });
document.addEventListener("input", e => { if(e.target.id==="team") pre.team = e.target.value; if(e.target.id==="code") pre.code = e.target.value; });
document.addEventListener("keydown", e => { if(e.key==="Enter" && e.target.id && /^in[12]$/.test(e.target.id)){ const b = e.target.parentElement.querySelector('[data-act="calc"]'); if(b) b.click(); } });
render();
</script>
</body>
</html>
