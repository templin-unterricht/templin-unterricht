erhangi birini alın işte.“", "ar": "„خذي أيّة واحدة وخلاص.“"}, "Gibt die Beratung auf.": {"vi": "Bỏ cuộc tư vấn.", "tr": "Danışmanlığı bırakır.", "ar": "يتخلّى عن الاستشارة."}, "„Dann kommen Sie morgen wieder.“": {"vi": "„Vậy mai bạn quay lại nhé.“", "tr": "„O zaman yarın tekrar gelin.“", "ar": "„إذن عودي غداً.“"}, "Die Entscheidung wird nicht erleichtert.": {"vi": "Việc quyết định không được dễ hơn.", "tr": "Karar kolaylaştırılmıyor.", "ar": "لا يُسهَّل القرار."}, "Auswahl einengen.": {"vi": "Thu hẹp lựa chọn.", "tr": "Seçimi daraltmak.", "ar": "تضييق الخيارات."}, "Buchhandlung": {"vi": "Hiệu sách", "tr": "Kitabevi", "ar": "مكتبة"}, "(stöbert, meidet den Blickkontakt)": {"vi": "(lướt xem, tránh giao tiếp bằng mắt)", "tr": "(göz gezdirir, göz temasından kaçınır)", "ar": "(تتصفّح وتتجنّب التواصل البصري)"}, "(läuft hinterher und erklärt jedes Buch, das die Kundin ansieht)": {"vi": "(đi theo sau và giải thích từng cuốn sách khách nhìn)", "tr": "(peşinden gider ve müşterinin baktığı her kitabı açıklar)", "ar": "(تتبعها وتشرح كل كتاب تنظر إليه الزبونة)"}, "„Schauen Sie sich in Ruhe um – wenn Sie Hilfe brauchen, bin ich für Sie da.“": {"vi": "„Bạn cứ thong thả xem nhé – cần giúp thì tôi ở đây.“", "tr": "„Rahatça bakın – yardıma ihtiyacınız olursa buradayım.“", "ar": "„تفضّلي بالنظر على مهلك – إن احتجتِ مساعدة فأنا هنا.“"}, "„Darf ich Ihnen alle Neuheiten zeigen?“": {"vi": "„Tôi giới thiệu tất cả sách mới cho bạn nhé?“", "tr": "„Tüm yeni çıkanları size göstereyim mi?“", "ar": "„هل أُريك جميع الإصدارات الجديدة؟“"}, "Bedrängt die Kundin weiter.": {"vi": "Tiếp tục làm phiền khách.", "tr": "Müşteriyi sıkıştırmaya devam eder.", "ar": "يواصل إزعاج الزبونة."}, "(gar nichts sagen und wegsehen)": {"vi": "(không nói gì và nhìn đi chỗ khác)", "tr": "(hiçbir şey söylemez ve başka yöne bakar)", "ar": "(لا تقول شيئاً وتنظر بعيداً)"}, "Die Kundin soll merken, dass sie wahrgenommen wurde.": {"vi": "Khách cần cảm thấy mình được chú ý.", "tr": "Müşteri fark edildiğini hissetmeli.", "ar": "يجب أن تشعر الزبونة بأنّها قد لوحظت."}, "Wer sich nur umsehen möchte: wahrnehmen, Bereitschaft zeigen, Freiraum lassen (Modul 4).": {"vi": "Khách chỉ muốn xem: chú ý đến khách, thể hiện sự sẵn sàng, để khách thoải mái (Mô-đun 4).", "tr": "Sadece göz gezdirmek isteyen: fark etmek, hazır olduğunu göstermek, serbest alan bırakmak (Modül 4).", "ar": "من يريد التجوّل فقط: لاحظه، أظهر الاستعداد، واترك له مساحة (الوحدة 4)."}, "Gartencenter": {"vi": "Trung tâm làm vườn", "tr": "Bahçe merkezi", "ar": "مركز البستنة"}, "Gut, ich nehme die Orchidee.": {"vi": "Được, tôi lấy cây lan này.", "tr": "Tamam, orkideyi alıyorum.", "ar": "حسناً، آخذ هذه الأوركيد."}, "Okay.": {"vi": "Vâng.", "tr": "Tamam.", "ar": "حسناً."}, "„Da haben Sie eine gute Wahl getroffen – diese Orchidee blüht viele Wochen und ist sehr pflegeleicht.“": {"vi": "„Bạn đã chọn rất tốt – cây lan này nở hoa nhiều tuần và rất dễ chăm.“", "tr": "„Çok iyi bir seçim yaptınız – bu orkide haftalarca çiçek açar ve bakımı çok kolaydır.“", "ar": "„لقد أحسنتِ الاختيار – هذه الأوركيد تزهر لأسابيع عديدة وسهلة العناية جداً.“"}, "„Na endlich.“": {"vi": "„Cuối cùng cũng quyết.“", "tr": "„Sonunda.“", "ar": "„أخيراً.“"}, "Ungeduldig.": {"vi": "Sốt ruột.", "tr": "Sabırsız.", "ar": "نافد الصبر."}, "„Hoffentlich geht sie nicht ein.“": {"vi": "„Hy vọng nó không chết.“", "tr": "„Umarım ölmez.“", "ar": "„آمل ألا تموت.“"}, "Sät Zweifel.": {"vi": "Gieo nghi ngờ.", "tr": "Şüphe tohumu eker.", "ar": "يزرع الشك."}, "Kaufbestätigung: Entscheidung bestärken, Nutzen nennen.": {"vi": "Xác nhận mua hàng: củng cố quyết định, nêu lợi ích.", "tr": "Satın alma onayı: kararı pekiştirmek, yararı belirtmek.", "ar": "تأكيد الشراء: تعزيز القرار وذكر الفائدة."}, "Baumarkt": {"vi": "Cửa hàng vật liệu xây dựng", "tr": "Yapı market", "ar": "متجر مواد البناء"}, "Guten Tag. Wofür brauchen Sie die Bohrmaschine?": {"vi": "Chào bạn. Bạn cần máy khoan để làm gì?", "tr": "İyi günler. Matkabı ne için istiyorsunuz?", "ar": "مرحباً. لأيّ غرض تحتاج المثقاب؟"}, "Hauptsächlich für Löcher in Beton.": {"vi": "Chủ yếu để khoan lỗ vào bê tông.", "tr": "Esas olarak betona delik açmak için.", "ar": "أساساً لعمل ثقوب في الخرسانة."}, "Dann nehmen Sie die teuerste, das ist die beste.": {"vi": "Vậy thì lấy cái đắt nhất, đó là cái tốt nhất.", "tr": "O zaman en pahalısını alın, o en iyisi.", "ar": "إذن خذ الأغلى، فهو الأفضل."}, "„Für Beton eignet sich ein Bohrhammer. Ich zeige Ihnen drei Modelle in der mittleren Preislage.“": {"vi": "„Với bê tông thì phù hợp là búa khoan. Tôi cho bạn xem ba mẫu ở tầm giá trung bình.“", "tr": "„Beton için kırıcı delici matkap uygundur. Size orta fiyat aralığından üç model göstereyim.“", "ar": "„للخرسانة يناسب مثقاب المطرقة. سأريك ثلاثة طرازات من فئة السعر المتوسطة.“"}, "„Dann nehmen Sie die billigste.“": {"vi": "„Vậy thì lấy cái rẻ nhất.“", "tr": "„O zaman en ucuzunu alın.“", "ar": "„إذن خذ الأرخص.“"}, "Falsche Preislage und abwertend.": {"vi": "Sai tầm giá và hạ thấp.", "tr": "Yanlış fiyat aralığı ve küçümseyici.", "ar": "فئة سعرية خاطئة وبلهجة منتقِصة."}, "„Alle sind gleich gut.“": {"vi": "„Cái nào cũng tốt như nhau.“", "tr": "„Hepsi aynı derecede iyi.“", "ar": "„كلها جيدة بنفس القدر.“"}, "Keine Beratung, kein Bezug zum Bedarf.": {"vi": "Không tư vấn, không liên quan đến nhu cầu.", "tr": "Danışmanlık yok, ihtiyaçla ilgisi yok.", "ar": "لا استشارة ولا علاقة بالحاجة."}, "Passende Artikel in der mittleren Preislage vorlegen.": {"vi": "Đưa các mặt hàng phù hợp ở tầm giá trung bình.", "tr": "Orta fiyat aralığından uygun ürünler sunmak.", "ar": "عرض سلع مناسبة من فئة السعر المتوسطة."}, "Eine Kundin steht ratlos vor dem Regal und schaut sich suchend um.": {"vi": "Một khách nữ đứng bối rối trước kệ hàng và nhìn quanh tìm kiếm.", "tr": "Bir müşteri rafın önünde çaresizce duruyor ve etrafına bakınıyor.", "ar": "تقف زبونة حائرة أمام الرف وتنظر حولها باحثة."}, "„Guten Tag, wobei darf ich Ihnen helfen?“": {"vi": "„Chào bạn, tôi có thể giúp gì cho bạn?“", "tr": "„İyi günler, size nasıl yardımcı olabilirim?“", "ar": "„مرحباً، بماذا يمكنني مساعدتك؟“"}, "„Suchen Sie was Bestimmtes?“": {"vi": "„Bạn đang tìm gì đặc biệt không?“", "tr": "„Belirli bir şey mi arıyorsunuz?“", "ar": "„هل تبحثين عن شيء معيّن؟“"}, "(weiter einräumen)": {"vi": "(tiếp tục xếp hàng)", "tr": "(yerleştirmeye devam eder)", "ar": "(تواصل الترتيب)"}, "Kundensignal erkannt: hingehen und offen ansprechen.": {"vi": "Nhận ra tín hiệu của khách: đến gần và chủ động hỏi.", "tr": "Müşteri sinyali fark edildi: yanına gidip açıkça konuşmak.", "ar": "التقاط إشارة الزبونة: الاقتراب ومخاطبتها بشكل مباشر."}, "Ein Kunde stöbert, dreht dir bewusst den Rücken zu.": {"vi": "Một khách nam đang lướt xem, cố tình quay lưng lại với bạn.", "tr": "Bir müşteri göz geziyor, bilerek sana sırtını dönüyor.", "ar": "زبون يتصفّح ويدير ظهره لك عن قصد."}, "Kurz lächeln: „Wenn Sie Hilfe brauchen, bin ich für Sie da.“": {"vi": "Mỉm cười nhanh: „Cần giúp thì tôi ở đây.“", "tr": "Kısaca gülümsemek: „Yardıma ihtiyacınız olursa buradayım.“", "ar": "ابتسامة قصيرة: „إن احتجت مساعدة فأنا هنا.“"}, "Ihn von hinten antippen und ansprechen": {"vi": "Vỗ nhẹ vào lưng và nói chuyện với anh ấy", "tr": "Arkadan omzuna dokunup konuşmak", "ar": "لمسه من الخلف ومخاطبته"}, "Ihn gar nicht beachten": {"vi": "Hoàn toàn không để ý đến anh ấy", "tr": "Hiç ilgilenmemek", "ar": "تجاهله تماماً"}, "Wahrnehmen, Bereitschaft zeigen, Freiraum lassen. Nie von hinten ansprechen.": {"vi": "Chú ý, thể hiện sự sẵn sàng, để khách thoải mái. Không bao giờ bắt chuyện từ phía sau.", "tr": "Fark etmek, hazır olduğunu göstermek, serbest alan bırakmak. Asla arkadan konuşmamak.", "ar": "لاحظه، أظهر الاستعداد، واترك له مساحة. لا تخاطبه من الخلف أبداً."}, "Stammkundin Frau Kaya kommt herein.": {"vi": "Khách quen, bà Kaya, bước vào.", "tr": "Düzenli müşteri Bayan Kaya içeri giriyor.", "ar": "تدخل الزبونة الدائمة السيدة Kaya."}, "„Guten Tag, Frau Kaya! Schön, dass Sie wieder da sind.“": {"vi": "„Chào bà Kaya! Rất vui là bà lại ghé.“", "tr": "„İyi günler Bayan Kaya! Tekrar gelmeniz çok güzel.“", "ar": "„مرحباً سيدة Kaya! من الرائع أنّك عدتِ.“"}, "„Hallo, na?“": {"vi": "„Chào, thế nào?“", "tr": "„Selam, n'aber?“", "ar": "„أهلاً، كيف الحال؟“"}, "„Guten Tag.“": {"vi": "„Chào bạn.“", "tr": "„İyi günler.“", "ar": "„مرحباً.“"}, "Stammkundschaft mit Namen begrüßen.": {"vi": "Chào khách quen bằng tên.", "tr": "Düzenli müşteriyi isimle karşılamak.", "ar": "تحية الزبائن الدائمين بالاسم."}, "Ein Kunde hält einen Artikel in der Hand und sieht sich hilfesuchend um.": {"vi": "Một khách cầm một món hàng trên tay và nhìn quanh tìm người giúp.", "tr": "Bir müşteri elinde bir ürün tutuyor ve yardım arayarak etrafına bakıyor.", "ar": "يحمل زبون سلعة بيده وينظر حوله طالباً المساعدة."}, "„Guten Tag, probieren Sie ihn gerne an – die Kabinen sind gleich hier.“": {"vi": "„Chào bạn, bạn cứ thử nhé – phòng thử đồ ở ngay đây.“", "tr": "„İyi günler, rahatça deneyin – kabinler hemen burada.“", "ar": "„مرحباً، جرّب بكل سرور – غرف القياس هنا مباشرة.“"}, "„Brauchen Sie Hilfe?“": {"vi": "„Bạn cần giúp không?“", "tr": "„Yardıma ihtiyacınız var mı?“", "ar": "„هل تحتاج مساعدة؟“"}, "„Den gibt’s nur in der Größe.“": {"vi": "„Cái này chỉ có cỡ này thôi.“", "tr": "„Bundan sadece bu bedende var.“", "ar": "„هذا موجود بهذا المقاس فقط.“"}, "Warenbezogene Ansprache.": {"vi": "Bắt chuyện liên quan đến hàng hóa.", "tr": "Ürünle ilgili hitap.", "ar": "مخاطبة تتعلّق بالسلعة."}, "„Ich brauche einen Koffer.“": {"vi": "„Tôi cần một chiếc vali.“", "tr": "„Bir bavula ihtiyacım var.“", "ar": "„أحتاج حقيبة سفر.“"}, "„Wohin geht denn die Reise?“": {"vi": "„Chuyến đi của bạn đến đâu ạ?“", "tr": "„Yolculuk nereye?“", "ar": "„إلى أين ستكون الرحلة؟“"}, "„Wollen Sie einen großen?“": {"vi": "„Bạn muốn loại lớn à?“", "tr": "„Büyük bir tane mi istiyorsunuz?“", "ar": "„هل تريدين واحدة كبيرة؟“"}, "„Wie viel wollen Sie ausgeben?“": {"vi": "„Bạn muốn chi bao nhiêu?“", "tr": "„Ne kadar harcamak istiyorsunuz?“", "ar": "„كم تريدين أن تنفقي؟“"}, "Offene Frage zur Bedarfsermittlung – nicht zuerst nach dem Preis fragen.": {"vi": "Câu hỏi mở để tìm hiểu nhu cầu – đừng hỏi giá trước tiên.", "tr": "İhtiyaç belirleme için açık soru – önce fiyatı sorma.", "ar": "سؤال مفتوح لتحديد الحاجة – لا تسأل عن السعر أولاً."}, "„Ich suche ein Geschenk für meine Enkelin.“": {"vi": "„Tôi đang tìm quà cho cháu gái.“", "tr": "„Torunum için bir hediye arıyorum.“", "ar": "„أبحث عن هدية لحفيدتي.“"}, "„Wie alt ist Ihre Enkelin?“": {"vi": "„Cháu gái bạn bao nhiêu tuổi?“", "tr": "„Torununuz kaç yaşında?“", "ar": "„كم عمر حفيدتك؟“"}, "„Nehmen Sie das hier, das kaufen alle.“": {"vi": "„Lấy cái này đi, ai cũng mua.“", "tr": "„Şunu alın, herkes alıyor.“", "ar": "„خذي هذا، الجميع يشتريه.“"}, "Offene Frage.": {"vi": "Câu hỏi mở.", "tr": "Açık soru.", "ar": "سؤال مفتوح."}, "„Ich brauche Laufschuhe.“": {"vi": "„Tôi cần giày chạy bộ.“", "tr": "„Koşu ayakkabısına ihtiyacım var.“", "ar": "„أحتاج حذاء للجري.“"}, "„Laufen Sie eher auf Asphalt oder im Wald?“": {"vi": "„Bạn chạy trên đường nhựa hay trong rừng nhiều hơn?“", "tr": "„Daha çok asfaltta mı yoksa ormanda mı koşuyorsunuz?“", "ar": "„هل تجري غالباً على الأسفلت أم في الغابة؟“"}, "„Laufen Sie?“": {"vi": "„Bạn có chạy bộ không?“", "tr": "„Koşuyor musunuz?“", "ar": "„هل تجري؟“"}, "„Laufschuhe sind da hinten.“": {"vi": "„Giày chạy bộ ở phía sau kia.“", "tr": "„Koşu ayakkabıları arkada.“", "ar": "„أحذية الجري هناك في الخلف.“"}, "Alternativfrage mit zwei positiven Möglichkeiten.": {"vi": "Câu hỏi lựa chọn với hai khả năng tích cực.", "tr": "İki olumlu seçenekli seçmeli soru.", "ar": "سؤال اختيار بخيارين إيجابيين."}, "Ein Kunde zeigt auf Kopfhörer: „So etwas in der Art suche ich.“": {"vi": "Một khách chỉ vào tai nghe: „Tôi tìm thứ gì đó kiểu như vậy.“", "tr": "Bir müşteri kulaklıkları gösterir: „Buna benzer bir şey arıyorum.“", "ar": "يشير زبون إلى سماعات الرأس: „أبحث عن شيء من هذا النوع.“"}, "„Ich zeige Ihnen einmal drei Modelle – wie gefällt Ihnen dieses hier?“": {"vi": "„Tôi sẽ cho bạn xem ba mẫu – bạn thấy mẫu này thế nào?“", "tr": "„Size üç model göstereyim – bu modeli nasıl buldunuz?“", "ar": "„سأريك ثلاثة طرازات – كيف ترى هذا؟“"}, "„Was genau?“": {"vi": "„Cụ thể là gì?“", "tr": "„Tam olarak ne?“", "ar": "„ماذا بالضبط؟“"}, "„Die sind teuer.“": {"vi": "„Mấy cái này đắt.“", "tr": "„Bunlar pahalı.“", "ar": "„هذه غالية.“"}, "Indirekte Bedarfsermittlung: Ware vorlegen und Reaktion beobachten.": {"vi": "Tìm hiểu nhu cầu gián tiếp: đưa hàng ra và quan sát phản ứng.", "tr": "Dolaylı ihtiyaç belirleme: mal sunmak ve tepkiyi gözlemlemek.", "ar": "تحديد الحاجة بشكل غير مباشر: عرض السلعة ومراقبة ردّ الفعل."}, "Eine Kundin möchte eine Jacke. Wie viele zeigst du?": {"vi": "Một khách nữ muốn mua áo khoác. Bạn cho xem bao nhiêu chiếc?", "tr": "Bir müşteri ceket istiyor. Kaç tane gösterirsin?", "ar": "تريد زبونة سترة. كم قطعة تعرض؟"}, "Drei bis fünf passende": {"vi": "Ba đến năm chiếc phù hợp", "tr": "Üç ila beş uygun ceket", "ar": "من ثلاث إلى خمس قطع مناسبة"}, "Eine einzige": {"vi": "Chỉ một chiếc", "tr": "Sadece bir tane", "ar": "قطعة واحدة فقط"}, "Zehn, für die volle Auswahl": {"vi": "Mười chiếc, để có đủ lựa chọn", "tr": "On tane, tam seçenek için", "ar": "عشر قطع، للحصول على خيارات كاملة"}, "3 bis 5 Artikel: Auswahl ohne Überforderung.": {"vi": "3 đến 5 mặt hàng: có lựa chọn mà không bị choáng ngợp.", "tr": "3 ila 5 ürün: bunalmadan seçim.", "ar": "من 3 إلى 5 سلع: خيار دون إرهاق."}, "Ein Kunde nennt keine Preisvorstellung. Womit beginnst du?": {"vi": "Một khách không nêu mức giá mong muốn. Bạn bắt đầu với gì?", "tr": "Bir müşteri fiyat beklentisi belirtmiyor. Neyle başlarsın?", "ar": "لا يذكر زبون السعر الذي يريده. بماذا تبدأ؟"}, "Mittlere Preislage": {"vi": "Tầm giá trung bình", "tr": "Orta fiyat aralığı", "ar": "فئة السعر المتوسطة"}, "Teuerste Modelle": {"vi": "Các mẫu đắt nhất", "tr": "En pahalı modeller", "ar": "أغلى الطرازات"}, "Günstigste Modelle": {"vi": "Các mẫu rẻ nhất", "tr": "En ucuz modeller", "ar": "أرخص الطرازات"}, "Mittlere Preislage – dann kannst du nach oben oder unten ausweichen.": {"vi": "Tầm giá trung bình – như vậy bạn có thể điều chỉnh lên hoặc xuống.", "tr": "Orta fiyat aralığı – böylece yukarı veya aşağı yönelebilirsin.", "ar": "فئة السعر المتوسطة – بهذا تستطيع الانتقال إلى الأعلى أو الأسفل."}, "Ein Kunde schaut sich einen Akkuschrauber an.": {"vi": "Một khách đang xem máy vặn vít chạy pin.", "tr": "Bir müşteri akülü vidalama makinesine bakıyor.", "ar": "يتفحّص زبون مفكّاً كهربائياً يعمل بالبطارية."}, "„Nehmen Sie ihn ruhig in die Hand – spüren Sie, wie leicht er ist?“": {"vi": "„Bạn cứ cầm thử – có thấy nó nhẹ thế nào không?“", "tr": "„Rahatça eline alın – ne kadar hafif olduğunu hissediyor musunuz?“", "ar": "„أمسكه بكل راحة – هل تشعر كم هو خفيف؟“"}, "„Bitte nicht anfassen.“": {"vi": "„Xin đừng sờ vào.“", "tr": "„Lütfen dokunmayın.“", "ar": "„من فضلك لا تلمس.“"}, "„Der ist gut.“": {"vi": "„Cái này tốt.“", "tr": "„Bu iyi.“", "ar": "„هذا جيّد.“"}, "Ware anfassen lassen, mehrere Sinne ansprechen.": {"vi": "Cho khách sờ hàng, tác động nhiều giác quan.", "tr": "Müşterinin malı elle tutmasına izin vermek, birden çok duyuya hitap etmek.", "ar": "السماح للزبون بلمس السلعة ومخاطبة عدّة حواس."}, "„Was ist an dieser Regenjacke besonders?“": {"vi": "„Chiếc áo mưa này đặc biệt ở điểm nào?“", "tr": "„Bu yağmurluğun özelliği nedir?“", "ar": "„ما المميز في هذه السترة المطرية؟“"}, "„Sie ist aus Gore-Tex – damit bleiben Sie auch bei Dauerregen trocken.“": {"vi": "„Nó làm từ Gore-Tex – nhờ đó bạn vẫn khô ráo ngay cả khi mưa dai dẳng.“", "tr": "„Gore-Tex'ten yapılmış – böylece sürekli yağmurda bile kuru kalırsınız.“", "ar": "„مصنوعة من Gore-Tex – وبذلك تبقين جافة حتى في المطر المستمر.“"}, "„Sie ist aus Gore-Tex.“": {"vi": "„Nó làm từ Gore-Tex.“", "tr": "„Gore-Tex'ten yapılmış.“", "ar": "„مصنوعة من Gore-Tex.“"}, "„Die ist echt top.“": {"vi": "„Cái này thật sự rất tốt.“", "tr": "„Bu gerçekten harika.“", "ar": "„هذه رائعة حقاً.“"}, "Ein sparsamer Kunde fragt nach einem Staubsauger.": {"vi": "Một khách tiết kiệm hỏi về máy hút bụi.", "tr": "Tutumlu bir müşteri elektrikli süpürge soruyor.", "ar": "يسأل زبون مقتصد عن مكنسة كهربائية."}, "„Er verbraucht wenig Strom – das spart Ihnen jedes Jahr Geld.“": {"vi": "„Nó tốn rất ít điện – giúp bạn tiết kiệm tiền mỗi năm.“", "tr": "„Çok az elektrik tüketir – her yıl para tasarrufu sağlar.“", "ar": "„تستهلك القليل من الكهرباء – وهذا يوفّر عليك المال كل عام.“"}, "„Er sieht modern aus.“": {"vi": "„Nó trông hiện đại.“", "tr": "„Modern görünüyor.“", "ar": "„تبدو عصرية.“"}, "„Den hat mein Chef ausgesucht.“": {"vi": "„Sếp tôi chọn cái này.“", "tr": "„Bunu patronum seçti.“", "ar": "„مديري هو من اختارها.“"}, "Argument passend zum Kundentyp.": {"vi": "Lý lẽ phù hợp với kiểu khách.", "tr": "Müşteri tipine uygun argüman.", "ar": "حجة تناسب نمط الزبون."}, "„Was kostet der Mantel?“": {"vi": "„Chiếc áo khoác dài giá bao nhiêu?“", "tr": "„Palto ne kadar?“", "ar": "„كم سعر المعطف؟“"}, "„Der Mantel ist wasserabweisend, er kostet 189 € – und hält Sie auch bei Minusgraden warm.“": {"vi": "„Chiếc áo khoác này chống thấm nước, giá 189 € – và giữ ấm cho bạn cả khi dưới 0 độ.“", "tr": "„Palto su itici, 189 € – ve sıfırın altındaki sıcaklıklarda bile sizi sıcak tutar.“", "ar": "„هذا المعطف طارد للماء، سعره 189 € – ويبقيك دافئة حتى في درجات الحرارة تحت الصفر.“"}, "„Der ist nicht billig.“": {"vi": "„Nó không rẻ đâu.“", "tr": "„Ucuz değil.“", "ar": "„هو ليس رخيصاً.“"}, "Sandwich: Nutzen – Preis – Nutzen.": {"vi": "Sandwich: lợi ích – giá – lợi ích.", "tr": "Sandviç: yarar – fiyat – yarar.", "ar": "الساندويتش: فائدة – سعر – فائدة."}, "Ein Kunde stutzt bei 690 € für eine Matratze.": {"vi": "Một khách giật mình trước giá 690 € cho một chiếc nệm.", "tr": "Bir müşteri bir yatak için 690 €'yu görünce duraksıyor.", "ar": "يتفاجأ زبون بسعر 690 € لمرتبة."}, "„So viel kosten Matratzen nun mal.“": {"vi": "„Nệm thì giá là như vậy thôi.“", "tr": "„Yataklar işte bu kadar tutar.“", "ar": "„المراتب أسعارها هكذا.“"}, "„Es gibt auch günstigere.“": {"vi": "„Cũng có loại rẻ hơn.“", "tr": "„Daha ucuzları da var.“", "ar": "„هناك أرخص أيضاً.“"}, "Verkleinerungsmethode: Preis auf die Nutzungsdauer verteilen.": {"vi": "Phương pháp chia nhỏ: chia giá theo thời gian sử dụng.", "tr": "Küçültme yöntemi: Fiyatı kullanım süresine bölmek.", "ar": "طريقة التجزئة: توزيع السعر على مدة الاستخدام."}, "„Warum ist das eine Modell 30 Euro teurer?“": {"vi": "„Tại sao mẫu này đắt hơn 30 euro?“", "tr": "„Bu model neden 30 euro daha pahalı?“", "ar": "„لماذا هذا الطراز أغلى بـ 30 يورو؟“"}, "„Für 30 Euro mehr bekommen Sie einen zweiten Akku – Sie können doppelt so lange arbeiten.“": {"vi": "„Thêm 30 euro, bạn nhận thêm một viên pin thứ hai – bạn có thể làm việc lâu gấp đôi.“", "tr": "„30 euro fazlasıyla ikinci bir pil alırsınız – iki kat daha uzun çalışabilirsiniz.“", "ar": "„مقابل 30 يورو إضافية تحصلين على بطارية ثانية – يمكنك العمل لضعف المدة.“"}, "„Marke halt.“": {"vi": "„Thương hiệu mà.“", "tr": "„Marka işte.“", "ar": "„العلامة التجارية وخلاص.“"}, "„Weiß ich nicht genau.“": {"vi": "„Tôi cũng không rõ lắm.“", "tr": "„Tam bilmiyorum.“", "ar": "„لا أعرف بالضبط.“"}, "Vergleichsmethode: Mehrpreis mit Nutzen erklären.": {"vi": "Phương pháp so sánh: giải thích khoản chênh lệch giá bằng lợi ích.", "tr": "Karşılaştırma yöntemi: fiyat farkını yararla açıklamak.", "ar": "طريقة المقارنة: شرح فارق السعر بالفائدة."}, "„Das ist mir zu teuer!“": {"vi": "„Cái này đắt quá với tôi!“", "tr": "„Bu bana çok pahalı!“", "ar": "„هذا غالٍ جداً عليّ!“"}, "„Ja, da haben Sie recht. Dafür hält er viele Jahre.“": {"vi": "„Vâng, bạn nói đúng. Bù lại, nó dùng được nhiều năm.“", "tr": "„Evet, haklısınız. Karşılığında yıllarca dayanır.“", "ar": "„نعم، معك حق. في المقابل يدوم سنوات عديدة.“"}, "„Gute Dinge haben ihren Preis.“": {"vi": "„Đồ tốt thì có giá của nó.“", "tr": "„İyi şeylerin bir bedeli vardır.“", "ar": "„الأشياء الجيدة لها ثمنها.“"}, "„Nein, das ist günstig.“": {"vi": "„Không, cái này rẻ mà.“", "tr": "„Hayır, bu ucuz.“", "ar": "„لا، هذا رخيص.“"}, "Ja-Aber-Methode.": {"vi": "Phương pháp Vâng-nhưng.", "tr": "Evet-Ama yöntemi.", "ar": "طريقة نعم-لكن."}, "„Im Internet ist das billiger.“": {"vi": "„Trên mạng thì rẻ hơn.“", "tr": "„İnternette daha ucuz.“", "ar": "„على الإنترنت أرخص.“"}, "„Darf ich fragen, wo genau? Dann prüfe ich, ob es dasselbe Modell ist.“": {"vi": "„Cho phép tôi hỏi cụ thể ở đâu không ạ? Tôi sẽ kiểm tra xem có phải cùng mẫu không.“", "tr": "„Tam olarak nerede olduğunu sorabilir miyim? O zaman aynı model olup olmadığını kontrol ederim.“", "ar": "„هل لي أن أسأل أين بالضبط؟ عندها أتحقق إن كان نفس الطراز.“"}, "„Das kann nicht sein.“": {"vi": "„Không thể thế được.“", "tr": "„Bu olamaz.“", "ar": "„هذا غير ممكن.“"}, "„Dann kaufen Sie dort.“": {"vi": "„Vậy bạn cứ mua ở đó.“", "tr": "„O zaman oradan alın.“", "ar": "„إذن اشتر من هناك.“"}, "Nähere Angaben erbitten und prüfen.": {"vi": "Hỏi thêm thông tin và kiểm tra.", "tr": "Ayrıntı istemek ve kontrol etmek.", "ar": "طلب تفاصيل والتحقق."}, "„Ich weiß nicht, ob die Farbe zu mir passt.“": {"vi": "„Tôi không biết màu này có hợp với tôi không.“", "tr": "„Rengin bana yakışıp yakışmadığını bilmiyorum.“", "ar": "„لا أعرف إن كان اللون يناسبني.“"}, "„Was genau macht Sie unsicher? Hier ist ein Spiegel.“": {"vi": "„Chính xác điều gì làm bạn chưa yên tâm? Đây là gương.“", "tr": "„Sizi tam olarak ne tereddüde düşürüyor? İşte ayna.“", "ar": "„ما الذي يجعلك غير متأكدة بالضبط؟ هذه هي المرآة.“"}, "„Doch, die passt.“": {"vi": "„Có chứ, nó hợp mà.“", "tr": "„Aksine, yakışıyor.“", "ar": "„بل يناسبك.“"}, "„Ist doch egal.“": {"vi": "„Kệ đi.“", "tr": "„Fark etmez.“", "ar": "„لا يهم.“"}, "Gegenfrage: den echten Grund finden.": {"vi": "Hỏi ngược lại: tìm ra lý do thật.", "tr": "Karşı soru: gerçek nedeni bulmak.", "ar": "سؤال مضاد: إيجاد السبب الحقيقي."}, "„Ist das alles, was Sie an Blusen haben?“": {"vi": "„Áo blouse bên bạn chỉ có bấy nhiêu thôi à?“", "tr": "„Bluz olarak sadece bunlar mı var?“", "ar": "„هل هذه كل ما لديكم من بلوزات؟“"}, "„Ja – dafür sind alle aus reiner Baumwolle und bügelleicht. Darf ich Ihnen zwei zeigen?“": {"vi": "„Vâng – bù lại, tất cả đều bằng cotton nguyên chất và dễ ủi. Tôi cho bạn xem hai chiếc nhé?“", "tr": "„Evet – karşılığında hepsi saf pamuktan ve ütü gerektirmez. Size iki tanesini göstereyim mi?“", "ar": "„نعم – في المقابل كلها من القطن الخالص وسهلة الكي. هل أُريك اثنتين منها؟“"}, "„Ja. Mehr gibt’s nicht.“": {"vi": "„Vâng. Không còn nữa.“", "tr": "„Evet. Başka yok.“", "ar": "„نعم. لا يوجد غيرها.“"}, "„Woanders ist es auch nicht besser.“": {"vi": "„Chỗ khác cũng chẳng khá hơn.“", "tr": "„Başka yerde de daha iyi değil.“", "ar": "„في مكان آخر ليس أفضل أيضاً.“"}, "Einwand gegen das Sortiment ernst nehmen und mit Nutzen antworten.": {"vi": "Xem trọng ý kiến phản đối về danh mục hàng và đáp lại bằng lợi ích.", "tr": "Ürün yelpazesine yönelik itirazı ciddiye almak ve yararla cevap vermek.", "ar": "أخذ الاعتراض على تشكيلة البضائع على محمل الجد والرد بفائدة."}, "Ein Kunde hat sich für einen Funkwecker entschieden.": {"vi": "Một khách đã chọn đồng hồ báo thức radio.", "tr": "Bir müşteri radyo kontrollü çalar saate karar verdi.", "ar": "قرّر زبون شراء منبّه لاسلكي."}, "„Dazu brauchen Sie noch Batterien, damit er gleich läuft.“": {"vi": "„Cho nó, bạn còn cần pin để nó chạy ngay.“", "tr": "„Bunun için bir de pil lazım, böylece hemen çalışır.“", "ar": "„لهذا تحتاج أيضاً إلى بطاريات ليعمل فوراً.“"}, "(nichts sagen)": {"vi": "(không nói gì)", "tr": "(hiçbir şey söylemez)", "ar": "(لا يقول شيئاً)"}, "Ergänzungsangebot – notwendig, muss immer angeboten werden.": {"vi": "Đề xuất bổ sung – cần thiết, phải luôn đề nghị.", "tr": "Tamamlayıcı teklif – gerekli, her zaman önerilmeli.", "ar": "عرض مكمّل – ضروري، ويجب عرضه دائماً."}, "Eine Kundin kauft ein Smartphone.": {"vi": "Một khách nữ mua điện thoại thông minh.", "tr": "Bir müşteri akıllı telefon alıyor.", "ar": "تشتري زبونة هاتفاً ذكياً."}, "„Passend dazu haben wir diese Schutzhülle – damit bleibt das Display heil.“": {"vi": "„Hợp với nó chúng tôi có ốp bảo vệ này – giúp màn hình không bị hỏng.“", "tr": "„Buna uygun bu koruyucu kılıfımız var – ekran sağlam kalır.“", "ar": "„يناسبه لدينا هذا الغلاف الواقي – يحافظ على الشاشة سليمة.“"}, "„Brauchen Sie noch was?“": {"vi": "„Bạn còn cần gì nữa không?“", "tr": "„Başka bir şeye ihtiyacınız var mı?“", "ar": "„هل تحتاجين شيئاً آخر؟“"}, "„Wollen Sie nicht noch eine Hülle?“": {"vi": "„Bạn không muốn thêm một chiếc ốp sao?“", "tr": "„Bir de kılıf istemez misiniz?“", "ar": "„ألا تريدين غلافاً أيضاً؟“"}, "Zusatzangebot mit Nutzen.": {"vi": "Đề xuất phụ kèm lợi ích.", "tr": "Yararlı ek teklif.", "ar": "عرض إضافي مع ذكر الفائدة."}, "Ein Kunde fragt nach Marke X. Ihr führt nur Marke Y in gleicher Qualität.": {"vi": "Một khách hỏi thương hiệu X. Cửa hàng chỉ có thương hiệu Y cùng chất lượng.", "tr": "Bir müşteri X markasını soruyor. Sizde yalnızca aynı kalitede Y markası var.", "ar": "يسأل زبون عن العلامة X. لديكم فقط العلامة Y بنفس الجودة."}, "„Marke X führen wir nicht – diese hier hat dieselbe Qualität und …“": {"vi": "„Chúng tôi không bán thương hiệu X – cái này có cùng chất lượng và …“", "tr": "„X markasını satmıyoruz – bu aynı kalitede ve …“", "ar": "„لا نبيع العلامة X – هذه بنفس الجودة و…“"}, "„Haben wir nicht.“": {"vi": "„Chúng tôi không có.“", "tr": "„Bizde yok.“", "ar": "„ليس لدينا.“"}, "„Höchstens die hier, weiß aber nicht, ob die was ist.“": {"vi": "„Chỉ có cái này, nhưng không biết có ra gì không.“", "tr": "„En fazla şu var, ama bir şeye benzer mi bilmiyorum.“", "ar": "„على الأكثر هذه، لكن لا أعرف إن كانت جيدة.“"}, "Alternativangebot mit gleichem Standard und Argument.": {"vi": "Đề xuất thay thế cùng tiêu chuẩn và có lý lẽ.", "tr": "Aynı standartta ve argümanlı alternatif teklif.", "ar": "عرض بديل بنفس المستوى مع حجة."}, "„Kann ich auch mit Karte zahlen?“": {"vi": "„Tôi trả bằng thẻ được không?“", "tr": "„Kartla ödeyebilir miyim?“", "ar": "„هل يمكنني الدفع بالبطاقة؟“"}, "„Selbstverständlich! Da haben Sie eine gute Wahl getroffen.“": {"vi": "„Dĩ nhiên rồi! Bạn đã chọn rất tốt.“", "tr": "„Tabii ki! Çok iyi bir seçim yaptınız.“", "ar": "„بالتأكيد! لقد أحسنتِ الاختيار.“"}, "„Ja. Aber noch mal zu den technischen Daten …“": {"vi": "„Vâng. Nhưng nói thêm về thông số kỹ thuật …“", "tr": "„Evet. Ama bir de teknik verilere dönelim …“", "ar": "„نعم. لكن مرة أخرى بخصوص البيانات التقنية …“"}, "„Ja.“": {"vi": "„Vâng.“", "tr": "„Evet.“", "ar": "„نعم.“"}, "Kaufsignal erkennen und bestätigen.": {"vi": "Nhận ra và xác nhận tín hiệu mua hàng.", "tr": "Satın alma sinyalini fark etmek ve onaylamak.", "ar": "التقاط إشارة الشراء وتأكيدها."}, "Die Kundin nickt und greift zur Geldbörse.": {"vi": "Khách nữ gật đầu và với tay lấy ví.", "tr": "Müşteri başını sallıyor ve cüzdanına uzanıyor.", "ar": "تومئ الزبونة برأسها وتمدّ يدها إلى محفظتها."}, "„Möchten Sie die Tasche gleich mitnehmen oder sollen wir sie liefern?“": {"vi": "„Bạn muốn mang túi đi luôn hay chúng tôi giao hàng?“", "tr": "„Çantayı hemen götürmek ister misiniz yoksa teslim edelim mi?“", "ar": "„هل تودّين أخذ الحقيبة معك فوراً أم نوصلها لك؟“"}, "Noch fünf Argumente nennen": {"vi": "Nêu thêm năm lý lẽ nữa", "tr": "Beş argüman daha saymak", "ar": "ذكر خمس حجج أخرى"}, "Abwarten und schweigen": {"vi": "Chờ và im lặng", "tr": "Beklemek ve susmak", "ar": "الانتظار والصمت"}, "Kaufsignal – Abschluss mit Alternativfrage.": {"vi": "Tín hiệu mua hàng – chốt đơn bằng câu hỏi lựa chọn.", "tr": "Satın alma sinyali – seçmeli soruyla kapanış.", "ar": "إشارة الشراء – الإغلاق بسؤال الاختيار."}, "Ein Kunde hat bezahlt.": {"vi": "Một khách đã thanh toán.", "tr": "Bir müşteri ödemeyi yaptı.", "ar": "دفع زبون."}, "„Vielen Dank, Herr Sommer, und ein schönes Wochenende!“": {"vi": "„Cảm ơn ông Sommer rất nhiều, chúc ông cuối tuần vui vẻ!“", "tr": "„Çok teşekkürler Bay Sommer, güzel bir hafta sonu dilerim!“", "ar": "„شكراً جزيلاً سيد Sommer، وعطلة نهاية أسبوع جميلة!“"}, "„Der Nächste!“": {"vi": "„Người tiếp theo!“", "tr": "„Sıradaki!“", "ar": "„التالي!“"}, "„Tschüss.“": {"vi": "„Tạm biệt.“", "tr": "„Hoşça kal.“", "ar": "„مع السلامة.“"}, "Bedanken, mit Namen und situationsbezogen verabschieden.": {"vi": "Cảm ơn, chào tạm biệt bằng tên và hợp tình huống.", "tr": "Teşekkür etmek, isimle ve duruma uygun vedalaşmak.", "ar": "الشكر والتوديع بالاسم وبما يناسب الموقف."}, "„Ich kann mich zwischen den beiden nicht entscheiden.“": {"vi": "„Tôi không quyết định được giữa hai cái này.“", "tr": "„Bu ikisi arasında karar veremiyorum.“", "ar": "„لا أستطيع الاختيار بين هذين.“"}, "„Was ist Ihnen am wichtigsten? Dann fasse ich die Vorteile kurz zusammen.“": {"vi": "„Điều gì quan trọng nhất với bạn? Vậy tôi tóm tắt ngắn các ưu điểm.“", "tr": "„Sizin için en önemlisi ne? O zaman avantajları kısaca özetleyeyim.“", "ar": "„ما أهمّ شيء بالنسبة لك؟ عندها ألخّص المزايا باختصار.“"}, "„Nehmen Sie einfach beide.“": {"vi": "„Bạn cứ lấy cả hai đi.“", "tr": "„İkisini de alın işte.“", "ar": "„خذ الاثنين وخلاص.“"}, "Noch drei weitere zeigen": {"vi": "Cho xem thêm ba cái nữa", "tr": "Üç tane daha göstermek", "ar": "عرض ثلاثة أخرى"}, "Auswahl einengen, Argumente zusammenfassen.": {"vi": "Thu hẹp lựa chọn, tóm tắt lý lẽ.", "tr": "Seçimi daraltmak, argümanları özetlemek.", "ar": "تضييق الخيارات وتلخيص الحجج."}, "Eine Kundin kauft ein Geschenk.": {"vi": "Một khách nữ mua quà.", "tr": "Bir müşteri hediye alıyor.", "ar": "تشتري زبونة هدية."}, "„Darf ich es Ihnen als Geschenk einpacken?“": {"vi": "„Tôi gói quà cho bạn nhé?“", "tr": "„Sizin için hediye paketi yapayım mı?“", "ar": "„هل أغلّفها لك كهدية؟“"}, "„Einpacken müssen Sie selbst.“": {"vi": "„Gói thì bạn tự gói.“", "tr": "„Paketlemeyi kendiniz yapmalısınız.“", "ar": "„التغليف عليك أنت.“"}, "„Tüte?“": {"vi": "„Túi không?“", "tr": "„Poşet?“", "ar": "„كيس؟“"}, "Warenbezogene Serviceleistung: Geschenkverpackung.": {"vi": "Dịch vụ liên quan đến hàng: gói quà.", "tr": "Mala yönelik servis: hediye paketi.", "ar": "خدمة تتعلق بالسلعة: تغليف الهدايا."}, "„Und was, wenn die Größe nicht passt?“": {"vi": "„Nếu không vừa cỡ thì sao?“", "tr": "„Peki beden uymazsa?“", "ar": "„وماذا لو لم يناسب المقاس؟“"}, "„Dann können Sie es innerhalb von 14 Tagen umtauschen.“": {"vi": "„Khi đó bạn có thể đổi trong vòng 14 ngày.“", "tr": "„O zaman 14 gün içinde değiştirebilirsiniz.“", "ar": "„عندها يمكنك استبداله خلال 14 يوماً.“"}, "„Dann haben Sie Pech.“": {"vi": "„Vậy thì bạn xui rồi.“", "tr": "„O zaman şansınıza küsün.“", "ar": "„إذن هذا سوء حظك.“"}, "„Muss passen.“": {"vi": "„Phải vừa chứ.“", "tr": "„Uymalı.“", "ar": "„يجب أن يناسب.“"}, "Umtauschmöglichkeit nennen – nimmt die Sorge vor dem Kauf.": {"vi": "Nêu khả năng đổi hàng – xóa bớt lo lắng trước khi mua.", "tr": "Değişim olanağını belirtmek – satın almadan önceki endişeyi giderir.", "ar": "ذكر إمكانية الاستبدال – يزيل القلق قبل الشراء."}, "Ein Kunde sagt: „Ich brauche eine Pfanne.“": {"vi": "Một khách nói: „Tôi cần một chiếc chảo.“", "tr": "Bir müşteri diyor ki: „Bir tavaya ihtiyacım var.“", "ar": "يقول زبون: „أحتاج مقلاة.“"}, "„Kochen Sie eher auf Gas oder auf Induktion?“": {"vi": "„Bạn nấu bằng bếp ga hay bếp từ nhiều hơn?“", "tr": "„Daha çok gazda mı yoksa indüksiyonda mı pişiriyorsunuz?“", "ar": "„هل تطبخ غالباً على الغاز أم على الحث المغناطيسي؟“"}, "„Eine Pfanne?“": {"vi": "„Một chiếc chảo à?“", "tr": "„Bir tava mı?“", "ar": "„مقلاة؟“"}, "„Die stehen dahinten.“": {"vi": "„Mấy cái đó ở phía sau kia.“", "tr": "„Onlar arkada duruyor.“", "ar": "„هذه موجودة في الخلف هناك.“"}, "Alternativfrage zur Bedarfsermittlung.": {"vi": "Câu hỏi lựa chọn để tìm hiểu nhu cầu.", "tr": "İhtiyaç belirleme için seçmeli soru.", "ar": "سؤال اختيار لتحديد الحاجة."}, "Du räumst ein. Eine Kundin wartet neben dir.": {"vi": "Bạn đang xếp hàng. Một khách nữ đang chờ bên cạnh bạn.", "tr": "Ürün yerleştiriyorsunuz. Bir müşteri yanınızda bekliyor.", "ar": "أنت تُرتّب البضائع. تنتظر زبونة بجانبك."}, "Sofort unterbrechen, Blickkontakt, begrüßen": {"vi": "Dừng ngay, giao tiếp bằng mắt, chào hỏi", "tr": "Hemen bırakmak, göz teması, selamlamak", "ar": "التوقف فوراً والتواصل البصري والتحية"}, "Erst den Karton fertig machen": {"vi": "Làm xong thùng hàng trước", "tr": "Önce kolinin işini bitirmek", "ar": "إنهاء الصندوق أولاً"}, "„Moment noch.“": {"vi": "„Chờ chút.“", "tr": "„Bir dakika.“", "ar": "„لحظة.“"}, "Bisherige Tätigkeit sofort abbrechen.": {"vi": "Dừng ngay công việc đang làm.", "tr": "Yapılan işi hemen bırakmak.", "ar": "ترك العمل الحالي فوراً."}, "„Warum soll ich diesen Topf nehmen?“": {"vi": "„Tại sao tôi nên chọn cái nồi này?“", "tr": "„Neden bu tencereyi almalıyım?“", "ar": "„لماذا يجب أن أختار هذا القدر؟“"}, "„Er ist für alle Herdarten geeignet – Sie können ihn auch nach einem Umzug weiter nutzen.“": {"vi": "„Nó dùng được cho mọi loại bếp – bạn vẫn dùng tiếp được cả sau khi chuyển nhà.“", "tr": "„Her ocak türüne uygundur – taşındıktan sonra da kullanmaya devam edebilirsiniz.“", "ar": "„يصلح لجميع أنواع المواقد – ويمكنك الاستمرار في استخدامه حتى بعد الانتقال إلى بيت جديد.“"}, "„Weil er schön ist.“": {"vi": "„Vì nó đẹp.“", "tr": "„Çünkü güzel.“", "ar": "„لأنّه جميل.“"}, "„Weil er im Angebot ist und weg muss.“": {"vi": "„Vì nó đang giảm giá và phải bán hết.“", "tr": "„Çünkü indirimde ve elden çıkması gerekiyor.“", "ar": "„لأنّه عليه عرض ويجب التخلّص منه.“"}, "Nutzen für die Kundschaft, nicht für den Betrieb.": {"vi": "Lợi ích cho khách, không phải cho cửa hàng.", "tr": "Müşteri için yarar, işletme için değil.", "ar": "فائدة للزبائن، لا للمنشأة."}, "Begrüßung und Kontaktaufnahme": {"vi": "Chào hỏi và tiếp xúc khách", "tr": "Karşılama ve ilk temas", "ar": "الترحيب والاتصال الأول"}, "Kontakt": {"vi": "Tiếp xúc", "tr": "Temas", "ar": "الاتصال"}, "Modul 4": {"vi": "Mô-đun 4", "tr": "Modül 4", "ar": "الوحدة 4"}, "11 Teilaufgaben in 7 von 14 Prüfungen (dazu „Hilfebedarf erkennen“ aus Modul 2: 6 Teilaufgaben).": {"vi": "11 câu hỏi nhỏ trong 7 trên 14 kỳ thi (thêm „nhận ra nhu cầu được giúp đỡ“ từ Mô-đun 2: 6 câu hỏi nhỏ).", "tr": "14 sınavın 7'sinde 11 alt soru (ayrıca Modül 2'den „yardım ihtiyacını fark etmek“: 6 alt soru).", "ar": "11 سؤالًا فرعيًا في 7 من 14 امتحانًا (إضافة إلى „ملاحظة الحاجة إلى المساعدة“ من الوحدة 2: 6 أسئلة فرعية)."}, "Frau Yilmaz, eine Stammkundin, {0}. Du räumst gerade Ware ein.": {"vi": "Bà Yilmaz, một khách quen, {0}. Bạn đang xếp hàng lên kệ.", "tr": "Müdavim müşteri Bayan Yilmaz {0}. Siz de mal yerleştiriyorsunuz.", "ar": "السيدة يلماز، زبونة دائمة، {0}. وأنت تنظّم البضاعة على الرفوف."}, "Herr Becker {0}. Du räumst gerade Ware ein.": {"vi": "Ông Becker {0}. Bạn đang xếp hàng lên kệ.", "tr": "Bay Becker {0}. Siz de mal yerleştiriyorsunuz.", "ar": "السيد بيكر {0}. وأنت تنظّم البضاعة على الرفوف."}, "Lena {0}. Du räumst gerade Ware ein.": {"vi": "Lena {0}. Bạn đang xếp hàng lên kệ.", "tr": "Lena {0}. Siz de mal yerleştiriyorsunuz.", "ar": "لينا {0}. وأنت تنظّم البضاعة على الرفوف."}, "Herr Okafor {0}. Du räumst gerade Ware ein.": {"vi": "Ông Okafor {0}. Bạn đang xếp hàng lên kệ.", "tr": "Bay Okafor {0}. Siz de mal yerleştiriyorsunuz.", "ar": "السيد أوكافور {0}. وأنت تنظّم البضاعة على الرفوف."}, "Weiter einräumen und warten, bis die Kundschaft fragt": {"vi": "Tiếp tục xếp hàng và chờ cho đến khi khách hỏi", "tr": "Mal yerleştirmeye devam edip müşteri sorana kadar beklemek", "ar": "مواصلة ترتيب البضاعة وانتظار أن يسأل الزبون"}, "Dann störe ich niemanden.": {"vi": "Như vậy tôi không làm phiền ai.", "tr": "Böylece kimseyi rahatsız etmem.", "ar": "وهكذا لا أزعج أحدًا."}, "(schaut sich um, niemand reagiert) …Hallo? Arbeitet hier jemand?": {"vi": "(nhìn quanh, không ai phản ứng) …Alô? Ở đây có ai làm việc không?", "tr": "(etrafa bakıyor, kimse tepki vermiyor) …Alo? Burada çalışan yok mu?", "ar": "(تنظر حولها، لا أحد يتجاوب) …ألو؟ هل يعمل أحد هنا؟"}, "(merkt gar nicht, dass sie gesehen wurde, und geht wieder)": {"vi": "(không hề nhận ra mình đã được thấy, rồi bỏ đi)", "tr": "(fark edildiğini hiç anlamıyor ve gidiyor)", "ar": "(لا تلاحظ أنه قد تمّ الانتباه إليها وتغادر)"}, "Die Kundschaft fühlt sich zurückgesetzt, wenn man sie warten lässt. Die bisherige Tätigkeit wird sofort abgebrochen – und jeder Kunde merkt, dass er wahrgenommen wurde.": {"vi": "Khách cảm thấy bị coi nhẹ khi phải chờ. Việc đang làm được dừng ngay – và mọi khách đều nhận ra mình đã được chú ý.", "tr": "Müşteri bekletildiğinde kendini ikinci planda hisseder. O an yapılan iş hemen bırakılır – ve her müşteri fark edildiğini anlar.", "ar": "يشعر الزبون بأنه مهمَّش عندما يُترك ينتظر. يُوقَف العمل الحالي فورًا – ويدرك كل زبون أنه قد لوحظ."}, "Einräumen abbrechen, von vorn Blickkontakt, lächeln, begrüßen und ansprechen": {"vi": "Dừng xếp hàng, nhìn thẳng từ phía trước, mỉm cười, chào và bắt chuyện", "tr": "Mal yerleştirmeyi bırakmak, önden göz teması, gülümseme, selamlama ve hitap", "ar": "التوقف عن الترتيب، نظرة مباشرة من الأمام، ابتسامة، تحية وبدء الحديث"}, "Ich gehe aktiv auf die Kundschaft zu.": {"vi": "Tôi chủ động đến gần khách.", "tr": "Müşteriye aktif olarak yaklaşıyorum.", "ar": "أتقدم نحو الزبون بنفسي."}, "Guten Tag! Schön, dass sich jemand Zeit nimmt.": {"vi": "Xin chào! Hay quá, có người dành thời gian cho tôi.", "tr": "İyi günler! Ne güzel, biri zaman ayırıyor.", "ar": "مرحبًا! جميل أن يخصص أحدٌ وقته."}, "Ah, guten Tag! Schön, Sie zu sehen.": {"vi": "À, xin chào! Rất vui được gặp bà.", "tr": "Ah, iyi günler! Sizi görmek ne güzel.", "ar": "آه، مرحبًا! يسعدني رؤيتكِ."}, "Äh … ich wollte eigentlich nur gucken.": {"vi": "Ờ … thật ra tôi chỉ muốn xem thôi.", "tr": "Ee … aslında sadece bakmak istemiştim.", "ar": "آه … في الواقع كنت أريد التفرج فقط."}, "Richtig bei Kundensignalen wie suchendem Blick, ratlosem Gesicht oder Ware in der Hand. Wer nur bummelt und den Blick meidet, fühlt sich dadurch aber schnell bedrängt.": {"vi": "Đúng với các tín hiệu khách như ánh mắt tìm kiếm, vẻ mặt lúng túng hoặc cầm hàng trên tay. Nhưng ai chỉ đi dạo và tránh ánh mắt sẽ dễ thấy bị làm phiền.", "tr": "Arayan bakış, şaşkın yüz veya elde ürün gibi müşteri sinyallerinde doğru. Ama sadece dolaşan ve bakışlardan kaçınan kişi bundan çabuk rahatsız olur.", "ar": "صحيح عند إشارات الزبون مثل النظرة الباحثة أو الوجه الحائر أو البضاعة في اليد. أما من يتجول فقط ويتجنب النظر فيشعر بسرعة بالإزعاج."}, "Kurz Blickkontakt, lächeln, begrüßen – und dann Freiraum lassen": {"vi": "Nhìn nhanh, mỉm cười, chào – rồi để khách tự do", "tr": "Kısa göz teması, gülümseme, selamlama – sonra serbest bırakmak", "ar": "نظرة سريعة وابتسامة وتحية – ثم ترك الحرية للزبون"}, "„Wenn Sie Hilfe brauchen, bin ich für Sie da.“": {"vi": "„Nếu cần giúp, tôi luôn sẵn sàng.“", "tr": "„Yardıma ihtiyacınız olursa buradayım.“", "ar": "„إن احتجتَ إلى مساعدة فأنا موجود.“"}, "(wartet) …Na gut, dann such ich eben selbst.": {"vi": "(chờ) …Thôi được, vậy tôi tự tìm.", "tr": "(bekliyor) …Peki, o zaman kendim ararım.", "ar": "(تنتظر) …حسنًا، إذن سأبحث بنفسي."}, "Danke, ich schau mich erst mal um. (lächelt)": {"vi": "Cảm ơn, trước hết tôi xem qua đã. (mỉm cười)", "tr": "Teşekkürler, önce bir göz atayım. (gülümsüyor)", "ar": "شكرًا، سأتفرج أولًا. (تبتسم)"}, "Ich hab eigentlich keine Zeit zum Suchen …": {"vi": "Thật ra tôi không có thời gian để tìm …", "tr": "Aslında arayacak vaktim yok …", "ar": "في الواقع ليس لدي وقت للبحث …"}, "Richtig bei Kunden, die sich erst umsehen möchten: wahrnehmen, Bereitschaft zeigen, dann Freiraum lassen. Wer Hilfe sucht oder direkt auf dich zukommt, wartet so unnötig.": {"vi": "Đúng với khách muốn xem trước: chú ý, tỏ ra sẵn sàng, rồi để họ tự do. Ai cần giúp hoặc đi thẳng đến bạn thì phải chờ một cách không cần thiết.", "tr": "Önce bakmak isteyen müşteriler için doğru: fark etmek, hazır olduğunu göstermek, sonra serbest bırakmak. Yardım arayan veya doğrudan size gelen biri bu yüzden gereksiz bekler.", "ar": "صحيح مع الزبائن الذين يريدون التفرج أولًا: الانتباه وإظهار الاستعداد ثم ترك الحرية. أما من يطلب المساعدة أو يتجه إليك مباشرة فينتظر دون داعٍ."}, "Kontaktaufnahme": {"vi": "Tiếp xúc khách", "tr": "İlk temas kurma", "ar": "الاتصال بالزبون"}, "Der erste Eindruck entsteht in Sekunden. Erst Blickkontakt, dann sprechen – nie von hinten. Bei Vorwahl auf die Kundensignale achten: Interesse zeigen, nicht angesprochen werden wollen oder nur umsehen.": {"vi": "Ấn tượng đầu tiên hình thành trong vài giây. Trước tiên giao tiếp bằng mắt, rồi mới nói – không bao giờ từ phía sau. Với hình thức chọn trước, hãy để ý tín hiệu khách: tỏ ra quan tâm, không muốn bị bắt chuyện hoặc chỉ xem qua.", "tr": "İlk izlenim birkaç saniyede oluşur. Önce göz teması, sonra konuşma – asla arkadan değil. Ön seçimde müşteri sinyallerine dikkat edin: ilgi göstermek, hitap edilmek istememek veya sadece bakmak.", "ar": "ينشأ الانطباع الأول في ثوانٍ. أولًا التواصل البصري ثم الكلام – وليس من الخلف أبدًا. في الاختيار المسبق انتبه لإشارات الزبون: إظهار الاهتمام أو عدم الرغبة في المخاطبة أو التفرج فقط."}, "Übungsaufgabe nach Prüfungsmuster": {"vi": "Bài luyện theo mẫu đề thi", "tr": "Sınav kalıbına göre alıştırma", "ar": "تمرين على نمط الامتحان"}, "Ein Kunde bleibt vor dem Regal mit den Rucksäcken stehen. Formulieren Sie eine warenbezogene Ansprache in wörtlicher Rede zu einem Rucksack!": {"vi": "Một khách dừng lại trước kệ ba lô. Hãy viết một lời bắt chuyện liên quan đến hàng hóa, bằng lời nói trực tiếp, về một chiếc ba lô!", "tr": "Bir müşteri sırt çantası rafının önünde duruyor. Bir sırt çantasıyla ilgili, ürüne yönelik bir hitabı doğrudan konuşma biçiminde yazın!", "ar": "يتوقف زبون أمام رف حقائب الظهر. صُغ مخاطبة متعلقة بالبضاعة بالكلام المباشر عن حقيبة ظهر!"}, "z. B. „Guten Tag, diesen Rucksack haben wir ganz neu im Sortiment – er hat ein gepolstertes Laptopfach.“": {"vi": "ví dụ „Xin chào, chiếc ba lô này chúng tôi mới có – nó có ngăn đệm cho laptop.“", "tr": "örn. „İyi günler, bu sırt çantası yeni geldi – yastıklı bir dizüstü bilgisayar gözü var.“", "ar": "مثلًا „مرحبًا، هذه الحقيبة جديدة لدينا – فيها جيب مبطّن للّابتوب.“"}, "Bau eine warenbezogene Ansprache.": {"vi": "Hãy xây dựng một lời bắt chuyện liên quan đến hàng hóa.", "tr": "Ürüne yönelik bir hitap oluşturun.", "ar": "ابنِ مخاطبة متعلقة بالبضاعة."}, "Begrüßung": {"vi": "Chào hỏi", "tr": "Selamlama", "ar": "التحية"}, "Guten Tag,": {"vi": "Xin chào,", "tr": "İyi günler,", "ar": "مرحبًا،"}, "Hallo, na?": {"vi": "Chào, thế nào?", "tr": "Selam, nasılsın?", "ar": "أهلًا، كيف الحال؟"}, "„Hallo, na?“ passt nicht zu jeder Kundschaft. Die Grußformel muss zur Person und zur Situation passen.": {"vi": "„Chào, thế nào?“ không hợp với mọi khách. Cách chào phải phù hợp với người và tình huống.", "tr": "„Selam, nasılsın?“ her müşteriye uymaz. Selamlama kişiye ve duruma uygun olmalı.", "ar": "„أهلًا، كيف الحال؟“ لا تناسب كل زبون. يجب أن تناسب التحية الشخص والموقف."}, "Ähm, Entschuldigung,": {"vi": "Ờ, xin lỗi,", "tr": "Ee, pardon,", "ar": "آه، عفوًا،"}, "Unsicher und ohne Gruß – der erste Eindruck zählt.": {"vi": "Thiếu tự tin và không có lời chào – ấn tượng đầu tiên rất quan trọng.", "tr": "Güvensiz ve selamsız – ilk izlenim önemlidir.", "ar": "غير واثق وبلا تحية – الانطباع الأول مهم."}, "Ansprache": {"vi": "Bắt chuyện", "tr": "Hitap", "ar": "المخاطبة"}, "kann ich Ihnen helfen?": {"vi": "tôi giúp gì được cho bà?", "tr": "size yardımcı olabilir miyim?", "ar": "هل يمكنني مساعدتك؟"}, "Geschlossene Frage: Die Antwort „Nein“ beendet das Gespräch.": {"vi": "Câu hỏi đóng: câu trả lời „Không“ kết thúc cuộc trò chuyện.", "tr": "Kapalı soru: „Hayır“ cevabı konuşmayı bitirir.", "ar": "سؤال مغلق: الجواب „لا“ ينهي الحديث."}, "suchen Sie etwas Bestimmtes?": {"vi": "bà tìm món gì cụ thể không?", "tr": "belirli bir şey mi arıyorsunuz?", "ar": "هل تبحثين عن شيء محدد؟"}, "Geschlossene Frage: Die Kundin kann mit „Nein“ antworten.": {"vi": "Câu hỏi đóng: khách có thể trả lời „Không“.", "tr": "Kapalı soru: Müşteri „Hayır“ diyebilir.", "ar": "سؤال مغلق: يمكن للزبونة أن تجيب „لا“."}, "Bezug zur Ware": {"vi": "Liên hệ với hàng hóa", "tr": "Ürünle bağlantı", "ar": "الربط بالبضاعة"}, "Die sind gerade richtig billig.": {"vi": "Mấy cái này đang rẻ lắm.", "tr": "Bunlar şu an gerçekten ucuz.", "ar": "هذه رخيصة جدًا الآن."}, "„Billig“ klingt nach schlechter Qualität. Besser: „preisgünstig“.": {"vi": "„Rẻ“ nghe như chất lượng kém. Tốt hơn: „giá hợp lý“.", "tr": "„Ucuz“ kalitesiz gibi duyulur. Daha iyisi: „uygun fiyatlı“.", "ar": "„رخيص“ يبدو كأنه جودة سيئة. الأفضل: „بسعر مناسب“."}, "Die kauft eh jeder.": {"vi": "Ai cũng mua mấy cái này.", "tr": "Bunları zaten herkes alıyor.", "ar": "الجميع يشتري هذه على أي حال."}, "Das ist kein Bezug zur Ware und klingt gleichgültig.": {"vi": "Đó không phải liên hệ với hàng hóa và nghe thờ ơ.", "tr": "Bu ürünle bir bağlantı değil ve ilgisiz duyulur.", "ar": "هذا ليس ربطًا بالبضاعة ويبدو غير مكترث."}, "Sie sprechen {0} an. Formulieren Sie eine warenbezogene Ansprache in wörtlicher Rede zum Artikel „{1}“!": {"vi": "Bạn bắt chuyện với {0}. Hãy viết một lời bắt chuyện liên quan đến hàng hóa, bằng lời nói trực tiếp, về mặt hàng „{1}“!", "tr": "{0} ile konuşuyorsunuz. „{1}“ ürünüyle ilgili, ürüne yönelik bir hitabı doğrudan konuşma biçiminde yazın!", "ar": "أنت تخاطب {0}. صُغ مخاطبة متعلقة بالبضاعة بالكلام المباشر عن السلعة „{1}“!"}, "Ihre Ansprache": {"vi": "Lời bắt chuyện của bạn", "tr": "Hitabınız", "ar": "مخاطبتك"}, "Begrüßung (z. B. „Guten Tag“)": {"vi": "Chào hỏi (ví dụ „Xin chào“)", "tr": "Selamlama (örn. „İyi günler“)", "ar": "التحية (مثلًا „مرحبًا“)"}, "Sie-Stil („Sie“, „Ihnen“, „Ihr“)": {"vi": "Cách xưng hô lịch sự („Sie“, „Ihnen“, „Ihr“)", "tr": "Nazik hitap biçimi („Sie“, „Ihnen“, „Ihr“)", "ar": "أسلوب المخاطبة المهذّبة („Sie“ و„Ihnen“ و„Ihr“)"}, "Bezug zur Ware ({0})": {"vi": "Liên hệ với hàng hóa ({0})", "tr": "Ürünle bağlantı ({0})", "ar": "الربط بالبضاعة ({0})"}, "keine geschlossene Frage wie „Kann ich helfen?“": {"vi": "không có câu hỏi đóng như „Tôi giúp được không?“", "tr": "„Yardımcı olabilir miyim?“ gibi kapalı soru yok", "ar": "لا توجد أسئلة مغلقة مثل „هل يمكنني المساعدة؟“"}, "Begründen Sie, warum Ihr Verhalten schon bei der Kontaktaufnahme wichtig ist.": {"vi": "Hãy giải thích vì sao hành vi của bạn đã quan trọng ngay từ khi tiếp xúc khách.", "tr": "Davranışınızın neden daha ilk temasta önemli olduğunu gerekçelendirin.", "ar": "علّل لماذا يكون سلوكك مهمًا منذ الاتصال الأول."}, "Hier entsteht der erste Eindruck – die Kundin fühlt sich wahrgenommen und wertgeschätzt.": {"vi": "Ấn tượng đầu tiên hình thành ở đây – khách cảm thấy được chú ý và trân trọng.", "tr": "İlk izlenim burada oluşur – müşteri fark edildiğini ve değer verildiğini hisseder.", "ar": "هنا ينشأ الانطباع الأول – تشعر الزبونة أنه تمّ الانتباه إليها وتقديرها."}, "Weil man bei der Begrüßung schon den Preis nennen sollte.": {"vi": "Vì ngay lúc chào đã nên nói giá.", "tr": "Çünkü daha selamlamada fiyat söylenmelidir.", "ar": "لأنه ينبغي ذكر السعر منذ التحية."}, "Damit die Kundin merkt, dass sie im Laden beobachtet wird.": {"vi": "Để khách nhận ra mình đang bị theo dõi trong cửa hàng.", "tr": "Müşteri mağazada gözetlendiğini fark etsin diye.", "ar": "لكي تدرك الزبونة أنها مراقَبة في المتجر."}, "Übung": {"vi": "Bài luyện", "tr": "Alıştırma", "ar": "تمرين"}, "Bedarfsermittlung": {"vi": "Xác định nhu cầu", "tr": "İhtiyaç tespiti", "ar": "تحديد الحاجة"}, "Bedarf": {"vi": "Nhu cầu", "tr": "İhtiyaç", "ar": "الحاجة"}, "Module 5 bis 7": {"vi": "Mô-đun 5 đến 7", "tr": "Modül 5 ila 7", "ar": "الوحدات 5 إلى 7"}, "Fragetechnik in 8, Bedarfsermittlung in 6, Kaufmotive in 4 von 14 Prüfungen – zusammen 22 Teilaufgaben. Fast immer: offene Frage plus Alternativfrage in wörtlicher Rede.": {"vi": "Kỹ thuật đặt câu hỏi trong 8, xác định nhu cầu trong 6, động cơ mua trong 4 trên 14 kỳ thi – tổng cộng 22 câu hỏi nhỏ. Gần như luôn: một câu hỏi mở cộng một câu hỏi lựa chọn bằng lời nói trực tiếp.", "tr": "Soru tekniği 14 sınavın 8'inde, ihtiyaç tespiti 6'sında, satın alma motifleri 4'ünde – toplam 22 alt soru. Hemen her zaman: doğrudan konuşmayla bir açık soru artı bir seçenekli soru.", "ar": "تقنية الأسئلة في 8 وتحديد الحاجة في 6 ودوافع الشراء في 4 من 14 امتحانًا – بمجموع 22 سؤالًا فرعيًا. غالبًا دائمًا: سؤال مفتوح وسؤال خيارات بالكلام المباشر."}, "Frau Yilmaz sagt: „Ich suche ein Geschenk für meinen Mann.“ Jetzt musst du herausfinden, was genau sie braucht.": {"vi": "Bà Yilmaz nói: „Tôi tìm quà cho chồng tôi.“ Bây giờ bạn phải tìm hiểu chính xác bà cần gì.", "tr": "Bayan Yilmaz şöyle diyor: „Kocam için bir hediye arıyorum.“ Şimdi tam olarak neye ihtiyacı olduğunu bulmalısınız.", "ar": "تقول السيدة يلماز: „أبحث عن هدية لزوجي.“ الآن عليك أن تعرف ما الذي تحتاجه بالضبط."}, "{0} sagt: „Ich suche {1}.“ Jetzt musst du herausfinden, was genau gebraucht wird.": {"vi": "{0} nói: „Tôi tìm {1}.“ Bây giờ bạn phải tìm hiểu chính xác cần gì.", "tr": "{0} şöyle diyor: „{1} arıyorum.“ Şimdi tam olarak neye ihtiyaç olduğunu bulmalısınız.", "ar": "يقول {0}: „أبحث عن {1}.“ الآن عليك أن تعرف ما الذي يحتاجه بالضبط."}, "Offene Fragen stellen: Wofür? Für wen? Was ist wichtig?": {"vi": "Đặt câu hỏi mở: Để làm gì? Cho ai? Điều gì quan trọng?", "tr": "Açık sorular sormak: Ne için? Kimin için? Ne önemli?", "ar": "طرح أسئلة مفتوحة: لأي غرض؟ لمن؟ ما المهم؟"}, "Direkte Bedarfsermittlung": {"vi": "Xác định nhu cầu trực tiếp", "tr": "Doğrudan ihtiyaç tespiti", "ar": "تحديد الحاجة المباشر"}, "Gute Frage! {0}": {"vi": "Câu hỏi hay! {0}", "tr": "İyi soru! {0}", "ar": "سؤال جيد! {0}"}, "(schaut auf die Uhr) {0}": {"vi": "(nhìn đồng hồ) {0}", "tr": "(saate bakıyor) {0}", "ar": "(ينظر إلى الساعة) {0}"}, "Direkte Bedarfsermittlung mit offenen Fragen bringt die meisten Informationen. Wer es sehr eilig hat und schon genau weiß, was er will, braucht aber nicht viele Fragen.": {"vi": "Xác định nhu cầu trực tiếp bằng câu hỏi mở cho nhiều thông tin nhất. Nhưng ai rất vội và đã biết chính xác mình muốn gì thì không cần nhiều câu hỏi.", "tr": "Açık sorularla doğrudan ihtiyaç tespiti en çok bilgiyi getirir. Ancak çok aceleci olan ve tam olarak ne istediğini bilen kişiye çok soru gerekmez.", "ar": "تحديد الحاجة المباشر بالأسئلة المفتوحة يعطي أكبر قدر من المعلومات. لكن من هو مستعجل جدًا ويعرف بالضبط ما يريد لا يحتاج إلى أسئلة كثيرة."}, "Gleich drei passende Modelle zeigen und an der Reaktion ablesen, was gefällt": {"vi": "Cho xem ngay ba mẫu phù hợp và đọc phản ứng xem khách thích gì", "tr": "Hemen üç uygun model göstermek ve tepkiden neyin hoşa gittiğini okumak", "ar": "عرض ثلاثة طرازات مناسبة فورًا وقراءة ردّ الفعل لمعرفة ما يعجب الزبون"}, "Indirekte Bedarfsermittlung": {"vi": "Xác định nhu cầu gián tiếp", "tr": "Dolaylı ihtiyaç tespiti", "ar": "تحديد الحاجة غير المباشر"}, "Hm, schön … aber ich weiß gar nicht, welches. {0}": {"vi": "Hm, đẹp … nhưng tôi không biết nên chọn cái nào. {0}", "tr": "Hm, güzel … ama hangisi olacağını bilmiyorum. {0}", "ar": "همم، جميل … لكنني لا أعرف أيها أختار. {0}"}, "Genau so was. Das geht schnell, prima. {0}": {"vi": "Đúng thứ như vậy. Nhanh đấy, tuyệt. {0}", "tr": "Tam böyle bir şey. Hızlı oldu, harika. {0}", "ar": "بالضبط شيء كهذا. سريع، ممتاز. {0}"}, "Okay, das hier ist ganz nett. {0}": {"vi": "Được, cái này cũng khá hay. {0}", "tr": "Tamam, bu da fena değil. {0}", "ar": "حسنًا، هذا لطيف. {0}"}, "Indirekte Bedarfsermittlung passt, wenn die Kundschaft ungefähr weiß, was sie will, oder wenig Zeit hat. Bei einem Geschenk oder wenn jemand unsicher ist, fehlen so wichtige Informationen.": {"vi": "Xác định nhu cầu gián tiếp phù hợp khi khách biết đại khái mình muốn gì hoặc có ít thời gian. Với quà tặng hoặc khi ai đó chưa chắc chắn thì thiếu thông tin quan trọng.", "tr": "Dolaylı ihtiyaç tespiti, müşteri yaklaşık ne istediğini biliyorsa veya az zamanı varsa uygundur. Hediye alırken veya biri emin değilken önemli bilgiler eksik kalır.", "ar": "يناسب تحديد الحاجة غير المباشر حين يعرف الزبون تقريبًا ما يريد أو يكون وقته قليلًا. أما عند الهدية أو عندما يكون الشخص غير متأكد فتنقص معلومات مهمة."}, "Zuerst fragen: „Wie viel wollen Sie ausgeben?“": {"vi": "Trước tiên hỏi: „Bà muốn chi bao nhiêu?“", "tr": "Önce şunu sormak: „Ne kadar harcamak istiyorsunuz?“", "ar": "السؤال أولًا: „كم تريدين أن تنفقي؟“"}, "Dann weiß ich gleich, was infrage kommt.": {"vi": "Vậy tôi biết ngay món nào phù hợp.", "tr": "O zaman hangisinin söz konusu olduğunu hemen bilirim.", "ar": "وهكذا أعرف فورًا ما الذي يأتي في الحسبان."}, "(wirkt unsicher) Das weiß ich noch nicht … nicht mehr als nötig.": {"vi": "(có vẻ bối rối) Cái đó tôi chưa biết … không hơn mức cần thiết.", "tr": "(kararsız görünüyor) Bunu henüz bilmiyorum … gerekenden fazla değil.", "ar": "(تبدو غير واثقة) هذا لا أعرفه بعد … ليس أكثر من اللازم."}, "Möglichst wenig natürlich.": {"vi": "Tất nhiên là càng ít càng tốt.", "tr": "Tabii ki mümkün olduğunca az.", "ar": "بالطبع أقل ما يمكن."}, "Diesen Fehler sollst du in der Prüfung erkennen: Wer zuerst nach dem Preis fragt, ermittelt den Bedarf nicht. Besser: „Wofür möchten Sie … verwenden?“": {"vi": "Đây là lỗi bạn phải nhận ra trong kỳ thi: ai hỏi giá trước thì chưa xác định nhu cầu. Tốt hơn: „Bà dùng … để làm gì?“", "tr": "Bu, sınavda fark etmeniz gereken hata: Önce fiyatı soran, ihtiyacı tespit etmiyor demektir. Daha iyisi: „… ürününü ne için kullanacaksınız?“", "ar": "هذا هو الخطأ الذي عليك ملاحظته في الامتحان: من يسأل عن السعر أولًا لا يحدد الحاجة. الأفضل: „لأي غرض تريدين استخدام …؟“"}, "Direkte und indirekte Bedarfsermittlung": {"vi": "Xác định nhu cầu trực tiếp và gián tiếp", "tr": "Doğrudan ve dolaylı ihtiyaç tespiti", "ar": "تحديد الحاجة المباشر وغير المباشر"}, "Direkt: den Bedarf mit offenen Fragen erfragen. Indirekt: Ware vorlegen und an der Reaktion ablesen, was gefällt. Offene Fragen beginnen mit einem W-Wort, Alternativfragen geben zwei positive Möglichkeiten.": {"vi": "Trực tiếp: hỏi nhu cầu bằng câu hỏi mở. Gián tiếp: đưa hàng ra và đọc phản ứng xem khách thích gì. Câu hỏi mở bắt đầu bằng từ để hỏi, câu hỏi lựa chọn đưa ra hai khả năng tích cực.", "tr": "Doğrudan: ihtiyacı açık sorularla sormak. Dolaylı: ürünü sunup tepkiden neyin hoşa gittiğini okumak. Açık sorular bir soru sözcüğüyle başlar, seçenekli sorular iki olumlu seçenek sunar.", "ar": "المباشر: السؤال عن الحاجة بأسئلة مفتوحة. غير المباشر: عرض البضاعة وقراءة ردّ الفعل لمعرفة ما يعجب. الأسئلة المفتوحة تبدأ بأداة استفهام، وأسئلة الخيارات تعرض احتمالين إيجابيين."}, "Ein Kunde möchte eine Jacke für seinen Sohn kaufen. Formulieren Sie eine offene Frage und eine Alternativfrage zur Bedarfsermittlung in wörtlicher Rede!": {"vi": "Một khách muốn mua áo khoác cho con trai. Hãy viết một câu hỏi mở và một câu hỏi lựa chọn để xác định nhu cầu bằng lời nói trực tiếp!", "tr": "Bir müşteri oğlu için bir ceket almak istiyor. İhtiyaç tespiti için doğrudan konuşma biçiminde bir açık soru ve bir seçenekli soru yazın!", "ar": "يريد زبون شراء سترة لابنه. صُغ سؤالًا مفتوحًا وسؤال خيارات لتحديد الحاجة بالكلام المباشر!"}, "offen z. B. „Wofür braucht Ihr Sohn die Jacke?“ – Alternativfrage z. B. „Soll die Jacke eher für den Alltag oder fürs Wandern sein?“ Für geschlossene Fragen gibt es keine Punkte.": {"vi": "mở, ví dụ „Con trai ông cần áo khoác để làm gì?“ – câu hỏi lựa chọn, ví dụ „Áo khoác nên dùng hằng ngày hay để đi bộ đường dài?“ Câu hỏi đóng không có điểm.", "tr": "açık örn. „Oğlunuz ceketi ne için istiyor?“ – seçenekli soru örn. „Ceket daha çok günlük kullanım için mi yoksa yürüyüş için mi olsun?“ Kapalı sorulara puan verilmez.", "ar": "المفتوح مثلًا „لأي غرض يحتاج ابنك السترة؟“ – سؤال الخيارات مثلًا „هل تكون السترة للاستخدام اليومي أم للتنزه؟“ الأسئلة المغلقة لا تُمنح عليها نقاط."}, "Bau eine offene Frage.": {"vi": "Hãy xây dựng một câu hỏi mở.", "tr": "Bir açık soru oluşturun.", "ar": "ابنِ سؤالًا مفتوحًا."}, "Fragewort": {"vi": "Từ để hỏi", "tr": "Soru sözcüğü", "ar": "أداة الاستفهام"}, "Wollen": {"vi": "Muốn", "tr": "İster misiniz (Wollen)", "ar": "هل تريد (Wollen)"}, "Mit „Wollen …?“ beginnt eine geschlossene Frage – Antwort: Ja oder Nein.": {"vi": "Câu bắt đầu bằng „Wollen …?“ là câu hỏi đóng – trả lời: Có hoặc Không.", "tr": "„Wollen …?“ ile başlayan soru kapalıdır – cevap: Evet veya Hayır.", "ar": "السؤال الذي يبدأ بـ „Wollen …؟“ مغلق – الجواب: نعم أو لا."}, "Ob": {"vi": "Liệu (Ob)", "tr": "Acaba (Ob)", "ar": "هل (Ob)"}, "„Ob“ ist kein Fragewort. Offene Fragen beginnen mit W-Wörtern: Wer, Wie, Was, Wofür …": {"vi": "„Ob“ không phải từ để hỏi. Câu hỏi mở bắt đầu bằng từ W: Wer, Wie, Was, Wofür …", "tr": "„Ob“ bir soru sözcüğü değildir. Açık sorular W sözcükleriyle başlar: Wer, Wie, Was, Wofür …", "ar": "„Ob“ ليست أداة استفهام. الأسئلة المفتوحة تبدأ بكلمات W: Wer وWie وWas وWofür …"}, "Sie-Stil": {"vi": "Cách xưng hô lịch sự", "tr": "Nazik hitap biçimi", "ar": "أسلوب المخاطبة المهذّبة"}, "möchten Sie": {"vi": "∅", "tr": "∅", "ar": "∅"}, "will man": {"vi": "người ta muốn (will man)", "tr": "insan ister mi (will man)", "ar": "يريد المرء (will man)"}, "„Man“ ist unpersönlich. Im Sie-Stil sprichst du die Kundin direkt an.": {"vi": "„Man“ mang tính vô nhân xưng. Trong cách xưng hô lịch sự, bạn nói trực tiếp với khách.", "tr": "„Man“ kişisizdir. Nazik hitapta müşteriye doğrudan seslenirsiniz.", "ar": "„Man“ غير شخصية. في أسلوب المخاطبة المهذّبة تخاطب الزبونة مباشرة."}, "musst du": {"vi": "bạn phải (musst du)", "tr": "sen zorundasın (musst du)", "ar": "عليك أن (musst du)"}, "Kundschaft wird gesiezt.": {"vi": "Khách được xưng hô lịch sự.", "tr": "Müşteriye „siz“ denir.", "ar": "يُخاطَب الزبائن بصيغة الاحترام."}, "Ende": {"vi": "Kết thúc", "tr": "Sonuç", "ar": "النهاية"}, "das denn jetzt?": {"vi": "cái đó bây giờ?", "tr": "bu şimdi?", "ar": "هذا الآن؟"}, "Klingt ungeduldig und unfreundlich.": {"vi": "Nghe sốt ruột và thiếu thân thiện.", "tr": "Sabırsız ve samimiyetsiz duyulur.", "ar": "يبدو غير صبور وغير ودود."}, "– ja oder nein?": {"vi": "– có hay không?", "tr": "– evet mi hayır mı?", "ar": "– نعم أم لا؟"}, "Das macht die Frage geschlossen.": {"vi": "Điều đó biến câu hỏi thành câu hỏi đóng.", "tr": "Bu, soruyu kapalı hale getirir.", "ar": "هذا يجعل السؤال مغلقًا."}, "Bau eine Alternativfrage.": {"vi": "Hãy xây dựng một câu hỏi lựa chọn.", "tr": "Bir seçenekli soru oluşturun.", "ar": "ابنِ سؤال خيارات."}, "Anfang": {"vi": "Mở đầu", "tr": "Başlangıç", "ar": "البداية"}, "Ist doch klar, dass": {"vi": "Rõ ràng là", "tr": "Zaten açık ki", "ar": "من الواضح أن"}, "So drängst du der Kundin eine Meinung auf (Suggestivfrage).": {"vi": "Như vậy bạn ép khách theo một ý kiến (câu hỏi gợi ý).", "tr": "Böylece müşteriye bir görüşü dayatırsınız (yönlendirici soru).", "ar": "وهكذا تفرض على الزبونة رأيًا (سؤال إيحائي)."}, "Möglichkeit 1": {"vi": "Khả năng 1", "tr": "Seçenek 1", "ar": "الاحتمال 1"}, "billig hông thích chút nào.", "tr": "Hım. Hiç hoşuma gitmedi.", "ar": "همم. هذا لا يعجبني إطلاقاً."}, "Verkaufsgespräch": {"vi": "Cuộc trò chuyện bán hàng", "tr": "Satış görüşmesi", "ar": "محادثة البيع"}, "Stufe für Stufe mit einer Kundschaft – Entscheidung, Satz in wörtlicher Rede, Zwischenfall, Quiz.": {"vi": "Từng bậc một với một khách hàng – quyết định, câu nói trực tiếp, sự cố, quiz.", "tr": "Bir müşteriyle basamak basamak – karar, doğrudan konuşma cümlesi, olay, sınav.", "ar": "درجة درجة مع زبون – قرار، جملة بصيغة الكلام المباشر، حادثة، اختبار."}, "Situationen": {"vi": "Tình huống", "tr": "Durumlar", "ar": "مواقف"}, "Fehler-Detektiv": {"vi": "Thám tử lỗi", "tr": "Hata dedektifi", "ar": "محقق الأخطاء"}, "Eine Kollegin verkauft – mit Fehlern. Findet sie, benennt sie und verbessert sie. Genau so fragt die IHK.": {"vi": "Một đồng nghiệp bán hàng – có lỗi. Hãy tìm, gọi tên và sửa lỗi. IHK hỏi đúng như vậy.", "tr": "Bir meslektaş satış yapıyor – hatalarla. Bulun, adlandırın ve düzeltin. IHK tam olarak böyle soruyor.", "ar": "زميلة تبيع – مع أخطاء. اعثروا عليها وسمّوها وصحّحوها. هكذا بالضبط تسأل IHK."}, "Gespräche": {"vi": "Cuộc trò chuyện", "tr": "Görüşme", "ar": "محادثات"}, "Kundenansturm": {"vi": "Khách đổ dồn", "tr": "Müşteri akını", "ar": "هجوم الزبائن"}, "Samstag, 11 Uhr: acht Kunden hintereinander, die Zeit läuft. Wer bleibt cool und reagiert richtig?": {"vi": "Thứ Bảy, 11 giờ: tám khách liên tiếp, thời gian đang chạy. Ai giữ bình tĩnh và phản ứng đúng?", "tr": "Cumartesi, saat 11: arka arkaya sekiz müşteri, zaman işliyor. Kim sakin kalıp doğru tepki veriyor?", "ar": "السبت، الساعة 11: ثمانية زبائن متتالين والوقت يجري. من يحافظ على هدوئه ويتصرف بشكل صحيح؟"}, "Kunden": {"vi": "Khách hàng", "tr": "Müşteri", "ar": "زبائن"}, "Blitzrunde": {"vi": "Vòng chớp nhoáng", "tr": "Şimşek turu", "ar": "الجولة الخاطفة"}, "Welche Stufe ist das? So viele Sätze wie möglich, bevor die Zeit abläuft. Serien geben Bonus.": {"vi": "Đây là bậc nào? Càng nhiều câu càng tốt trước khi hết giờ. Chuỗi đúng liên tiếp được thưởng.", "tr": "Bu hangi basamak? Süre dolmadan mümkün olduğunca çok cümle. Seriler bonus kazandırır.", "ar": "أيّ درجة هذه؟ أكبر عدد ممكن من الجمل قبل انتهاء الوقت. السلاسل المتتالية تمنح مكافأة."}, "Sätze": {"vi": "Câu", "tr": "Cümle", "ar": "جمل"}, "Wo ist der Fehler?": {"vi": "Lỗi ở đâu?", "tr": "Hata nerede?", "ar": "أين الخطأ؟"}, "Was ist falsch?": {"vi": "Cái gì sai?", "tr": "Ne yanlış?", "ar": "ما الخطأ؟"}, "Wie geht es besser?": {"vi": "Làm thế nào tốt hơn?", "tr": "Nasıl daha iyi olur?", "ar": "كيف يكون الأفضل؟"}, "Verkäuferin": {"vi": "Nhân viên bán hàng", "tr": "Satıcı", "ar": "البائعة"}, "Kunde": {"vi": "Khách", "tr": "Müşteri", "ar": "الزبون"}, "Tippt die Zeile an, in der die Verkäuferin einen Fehler macht.": {"vi": "Chạm vào dòng mà nhân viên bán hàng mắc lỗi.", "tr": "Satıcının hata yaptığı satıra dokunun.", "ar": "المسوا السطر الذي ترتكب فيه البائعة خطأً."}, "Tippt eine Zeile der Verkäuferin an.": {"vi": "Chạm vào một dòng của nhân viên bán hàng.", "tr": "Satıcının bir satırına dokunun.", "ar": "المسوا سطراً من سطور البائعة."}, "Noch ein Versuch.": {"vi": "Thử thêm một lần nữa.", "tr": "Bir deneme daha.", "ar": "محاولة أخرى."}, "Richtig erkannt! +1": {"vi": "Nhận ra đúng! +1", "tr": "Doğru fark ettiniz! +1", "ar": "تم التعرف بشكل صحيح! +1"}, "Der Fehler ist:": {"vi": "Lỗi là:", "tr": "Hata şu:", "ar": "الخطأ هو:"}, "Genau so! +2": {"vi": "Chính xác như vậy! +2", "tr": "Tam öyle! +2", "ar": "بالضبط هكذا! +2"}, "Nächster Fehler": {"vi": "Lỗi tiếp theo", "tr": "Sonraki hata", "ar": "الخطأ التالي"}, "Nächstes Gespräch": {"vi": "Cuộc trò chuyện tiếp theo", "tr": "Sonraki görüşme", "ar": "المحادثة التالية"}, "Zu langsam – der Kunde ist gegangen.": {"vi": "Quá chậm – khách đã bỏ đi.", "tr": "Çok yavaş – müşteri gitti.", "ar": "بطيء جداً – غادر الزبون."}, "Top!": {"vi": "Tuyệt!", "tr": "Harika!", "ar": "ممتاز!"}, "Geht so.": {"vi": "Tạm được.", "tr": "Şöyle böyle.", "ar": "مقبول."}, "Daneben.": {"vi": "Trượt rồi.", "tr": "Iskaladı.", "ar": "أخطأتم."}, "Nächster Kunde": {"vi": "Khách tiếp theo", "tr": "Sonraki müşteri", "ar": "الزبون التالي"}, "Ladenschluss – Auswertung": {"vi": "Đóng cửa – Đánh giá", "tr": "Mağaza kapanışı – Değerlendirme", "ar": "إغلاق المتجر – التقييم"}, "Punkte im Fehler-Detektiv": {"vi": "điểm trong Thám tử lỗi", "tr": "Hata dedektifinde puan", "ar": "نقاط في محقق الأخطاء"}, "Fehler gesucht": {"vi": "lỗi đã tìm", "tr": "aranan hata", "ar": "أخطاء بُحث عنها"}, "der Punkte": {"vi": "trên tổng số điểm", "tr": "puanın", "ar": "من النقاط"}, "Umsatz bis Ladenschluss": {"vi": "Doanh thu đến giờ đóng cửa", "tr": "Kapanışa kadar ciro", "ar": "المبيعات حتى الإغلاق"}, "Kunden begeistert": {"vi": "khách hài lòng", "tr": "memnun müşteri", "ar": "زبائن مسرورون"}, "Fachpunkte": {"vi": "điểm chuyên môn", "tr": "Uzmanlık puanı", "ar": "نقاط التخصص"}, "Zeit pro Kunde": {"vi": "thời gian cho mỗi khách", "tr": "Müşteri başına süre", "ar": "الوقت لكل زبون"}, "Punkte in der Blitzrunde": {"vi": "điểm trong Vòng chớp nhoáng", "tr": "Şimşek turunda puan", "ar": "نقاط في الجولة الخاطفة"}, "Sätze richtig": {"vi": "câu đúng", "tr": "doğru cümle", "ar": "جمل صحيحة"}, "längste Serie": {"vi": "chuỗi dài nhất", "tr": "en uzun seri", "ar": "أطول سلسلة"}, "Spielzeit": {"vi": "thời gian chơi", "tr": "oyun süresi", "ar": "مدة اللعب"}, "<p>Kein einziger Fehler – stark!</p>": {"vi": "<p>Không có một lỗi nào – giỏi quá!</p>", "tr": "<p>Tek bir hata yok – harika!</p>", "ar": "<p>ولا خطأ واحد – رائع!</p>"}, "<b>Neuer Rekord auf diesem Gerät!</b>": {"vi": "<b>Kỷ lục mới trên thiết bị này!</b>", "tr": "<b>Bu cihazda yeni rekor!</b>", "ar": "<b>رقم قياسي جديد على هذا الجهاز!</b>"}, "kein „billig“": {"vi": "không có từ „billig“ (rẻ tiền)", "tr": "„billig“ (ucuz) kelimesi yok", "ar": "بدون كلمة „billig“ (رخيص)"}, "Warum gibt es für „Kann ich Ihnen helfen?“ in der Prüfung keine Punkte?": {"vi": "Tại sao câu „Tôi giúp gì được cho bà?“ không có điểm trong kỳ thi?", "tr": "„Yardımcı olabilir miyim?“ cümlesine sınavda neden puan verilmez?", "ar": "لماذا لا تُمنح نقاط على „هل يمكنني مساعدتك؟“ في الامتحان؟"}, "Es ist eine geschlossene Frage – die Kundin kann mit „Nein“ antworten, und das Gespräch ist zu Ende.": {"vi": "Đó là câu hỏi đóng – khách có thể trả lời „Không“ và cuộc trò chuyện kết thúc.", "tr": "Bu kapalı bir sorudur – müşteri „Hayır“ diyebilir ve konuşma biter.", "ar": "إنه سؤال مغلق – يمكن للزبونة أن تجيب „لا“ وينتهي الحديث."}, "Weil man Kunden duzen sollte.": {"vi": "Vì nên xưng hô thân mật với khách.", "tr": "Çünkü müşterilere „sen“ denmelidir.", "ar": "لأنه ينبغي مخاطبة الزبائن بصيغة المفرد غير الرسمية."}, "Weil die Frage zu lang ist.": {"vi": "Vì câu hỏi quá dài.", "tr": "Çünkü soru çok uzun.", "ar": "لأن السؤال طويل جدًا."}, "Warenvorlage": {"vi": "Giới thiệu hàng", "tr": "Ürün sunumu", "ar": "عرض البضاعة"}, "Ware": {"vi": "Hàng", "tr": "Ürün", "ar": "البضاعة"}, "Modul 8": {"vi": "Mô-đun 8", "tr": "Modül 8", "ar": "الوحدة 8"}, "15 Teilaufgaben in 10 von 14 Prüfungen – damit das Modul, das am häufigsten drankommt. Meist: Grundsätze nennen, Anzahl der Artikel begründen, Preislage begründen.": {"vi": "15 câu hỏi nhỏ trong 10 trên 14 kỳ thi – nên đây là mô-đun xuất hiện nhiều nhất. Thường là: nêu nguyên tắc, giải thích số lượng mặt hàng, giải thích tầm giá.", "tr": "14 sınavın 10'unda 15 alt soru – yani en sık çıkan modül. Genellikle: ilkeleri saymak, ürün sayısını gerekçelendirmek, fiyat aralığını gerekçelendirmek.", "ar": "15 سؤالًا فرعيًا في 10 من 14 امتحانًا – فهي الوحدة الأكثر ورودًا. غالبًا: ذكر المبادئ، تعليل عدد القطع، تعليل فئة السعر."}, "Du weißt jetzt ungefähr, was {0} braucht. Wie legst du die Ware vor?": {"vi": "Giờ bạn đã biết đại khái {0} cần gì. Bạn đưa hàng ra thế nào?", "tr": "Şimdi {0} kişisinin yaklaşık ne istediğini biliyorsunuz. Ürünü nasıl sunarsınız?", "ar": "الآن تعرف تقريبًا ما الذي يحتاجه {0}. كيف تعرض البضاعة؟"}, "Drei bis fünf passende Modelle in der mittleren Preislage zeigen und anfassen lassen": {"vi": "Cho xem ba đến năm mẫu phù hợp ở tầm giá trung bình và cho khách cầm thử", "tr": "Orta fiyat aralığında üç ila beş uygun model göstermek ve dokunmasına izin vermek", "ar": "عرض ثلاثة إلى خمسة طرازات مناسبة بفئة سعر متوسطة والسماح للزبون بلمسها"}, "Je nach Reaktion weiche ich nach oben oder unten aus.": {"vi": "Tùy phản ứng tôi chuyển lên hoặc xuống.", "tr": "Tepkiye göre yukarı veya aşağı kayarım.", "ar": "حسب ردّ الفعل أنتقل إلى الأعلى أو الأسفل."}, "(nimmt eins in die Hand) Oh, das fühlt sich gut an!": {"vi": "(cầm một cái lên) Ôi, cảm giác thích quá!", "tr": "(birini eline alıyor) Oh, bunun hissi çok güzel!", "ar": "(تمسك واحدًا) آه، ملمسه رائع!"}, "Gut, aber bitte nicht zu viele, ich hab’s eilig.": {"vi": "Tốt, nhưng xin đừng nhiều quá, tôi đang vội.", "tr": "İyi, ama lütfen çok fazla olmasın, acelem var.", "ar": "جيد، لكن لا تعرض الكثير من فضلك، أنا مستعجل."}, "Ganz schön, aber was kosten die?": {"vi": "Khá đẹp, nhưng giá bao nhiêu?", "tr": "Oldukça güzel, ama bunların fiyatı ne?", "ar": "جميلة جدًا، لكن كم سعرها؟"}, "Das sind die Grundsätze der Warenvorlage: 3 bis 5 Artikel, mittlere Preislage, mehrere Sinne ansprechen. Hat die Kundin eine Preisvorstellung genannt, beginnt man aber in dieser Preisklasse.": {"vi": "Đây là nguyên tắc giới thiệu hàng: 3 đến 5 mặt hàng, tầm giá trung bình, kích thích nhiều giác quan. Nếu khách đã nêu mức giá mong muốn thì bắt đầu ở tầm giá đó.", "tr": "Bunlar ürün sunumunun ilkeleridir: 3 ila 5 ürün, orta fiyat aralığı, birden fazla duyuya hitap etmek. Müşteri bir fiyat beklentisi belirtmişse bu fiyat aralığıyla başlanır.", "ar": "هذه هي مبادئ عرض البضاعة: 3 إلى 5 قطع، فئة سعر متوسطة، مخاطبة عدة حواس. وإن ذكرت الزبونة فكرة عن السعر فتبدأ بهذه الفئة."}, "Alle zehn Modelle aus dem Regal auf den Tisch legen": {"vi": "Bày cả mười mẫu từ kệ ra bàn", "tr": "On modelin hepsini raftan masaya koymak", "ar": "وضع كل الطرازات العشرة من الرف على الطاولة"}, "Dann hat die Kundin die volle Auswahl.": {"vi": "Vậy khách có đầy đủ lựa chọn.", "tr": "O zaman müşterinin tam seçeneği olur.", "ar": "وهكذا يكون للزبونة الخيارات كاملة."}, "Puh … das ist ja viel zu viel. Ich weiß gar nicht mehr, was ich will.": {"vi": "Chà … nhiều quá. Tôi chẳng còn biết mình muốn gì.", "tr": "Off … bu çok fazla. Ne istediğimi bile bilmiyorum artık.", "ar": "أوف … هذا كثير جدًا. لم أعد أعرف ما أريد."}, "Zu viele Artikel überfordern. 3 bis 5 Artikel: Die Kundin hat eine Auswahl, wird aber nicht überfordert.": {"vi": "Quá nhiều mặt hàng làm khách choáng ngợp. 3 đến 5 mặt hàng: khách có lựa chọn mà không bị quá tải.", "tr": "Çok fazla ürün müşteriyi bunaltır. 3 ila 5 ürün: Müşterinin seçeneği olur ama bunalmaz.", "ar": "كثرة القطع ترهق الزبونة. من 3 إلى 5 قطع: يكون لها خيار دون أن تُرهَق."}, "Drei Modelle aus der Preisklasse zeigen, die die Kundschaft genannt hat": {"vi": "Cho xem ba mẫu thuộc tầm giá mà khách đã nêu", "tr": "Müşterinin belirttiği fiyat aralığından üç model göstermek", "ar": "عرض ثلاثة طرازات من فئة السعر التي ذكرها الزبون"}, "Kurz und gezielt.": {"vi": "Ngắn gọn và đúng mục tiêu.", "tr": "Kısa ve hedefe yönelik.", "ar": "موجز وموجَّه."}, "Hm, über den Preis habe ich doch noch gar nichts gesagt …": {"vi": "Hm, tôi đã nói gì về giá đâu …", "tr": "Hm, ben fiyat hakkında henüz hiçbir şey söylemedim ki …", "ar": "همم، لم أقل شيئًا عن السعر بعد …"}, "Super, genau mein Rahmen!": {"vi": "Tuyệt, đúng tầm của tôi!", "tr": "Harika, tam benim bütçem!", "ar": "ممتاز، هذا بالضبط ضمن حدودي!"}, "Perfekt, genau so etwas.": {"vi": "Hoàn hảo, đúng món như vậy.", "tr": "Mükemmel, tam böyle bir şey.", "ar": "ممتاز، بالضبط شيء كهذا."}, "Richtig, wenn eine Preisvorstellung genannt wurde: dann aus der gewünschten Preiskategorie vorlegen. Ohne Preisvorstellung beginnt man in der mittleren Preislage.": {"vi": "Đúng, khi khách đã nêu mức giá: thì giới thiệu từ tầm giá mong muốn. Nếu chưa có mức giá thì bắt đầu ở tầm giá trung bình.", "tr": "Doğru, bir fiyat beklentisi belirtildiyse: o zaman istenen fiyat kategorisinden sunulur. Fiyat beklentisi yoksa orta fiyat aralığıyla başlanır.", "ar": "صحيح، عند ذكر فكرة عن السعر: يُعرَض من الفئة السعرية المطلوبة. وبدون فكرة عن السعر يبدأ المرء بالفئة المتوسطة."}, "Grundsätze der Warenvorlage": {"vi": "Nguyên tắc giới thiệu hàng", "tr": "Ürün sunumunun ilkeleri", "ar": "مبادئ عرض البضاعة"}, "3 bis 5 Artikel vorlegen · mit der mittleren Preislage beginnen · sorgfältig mit der Ware umgehen · nur einwandfreie Ware zeigen · alle Sinne ansprechen · Artikel, die nicht infrage kommen, wegräumen.": {"vi": "Đưa ra 3 đến 5 mặt hàng · bắt đầu ở tầm giá trung bình · cẩn thận khi cầm hàng · chỉ cho xem hàng hoàn hảo · kích thích mọi giác quan · cất đi những mặt hàng không phù hợp.", "tr": "3 ila 5 ürün sunmak · orta fiyat aralığıyla başlamak · ürüne özenle davranmak · sadece kusursuz ürün göstermek · tüm duyulara hitap etmek · söz konusu olmayan ürünleri kaldırmak.", "ar": "عرض 3 إلى 5 قطع · البدء بفئة السعر المتوسطة · التعامل بعناية مع البضاعة · عرض البضاعة السليمة فقط · مخاطبة كل الحواس · إبعاد القطع التي لا تأتي في الحسبان."}, "Geben Sie an, wie viele Artikel Sie dem Kunden zunächst vorlegen, und begründen Sie Ihre Entscheidung!": {"vi": "Hãy nêu ban đầu bạn đưa ra bao nhiêu mặt hàng cho khách và giải thích quyết định của bạn!", "tr": "Müşteriye başlangıçta kaç ürün sunduğunuzu belirtin ve kararınızı gerekçelendirin!", "ar": "اذكر كم قطعة تعرضها على الزبون في البداية وعلّل قرارك!"}, "3–4 Artikel (1 P.); Begründung (2 P.), z. B. bei nur einem Artikel keine Auswahl; zu viele Artikel überfordern.": {"vi": "3–4 mặt hàng (1 điểm); giải thích (2 điểm), ví dụ nếu chỉ một mặt hàng thì không có lựa chọn; quá nhiều mặt hàng làm choáng ngợp.", "tr": "3–4 ürün (1 P.); gerekçe (2 P.), örn. tek ürünle seçenek olmaz; çok fazla ürün bunaltır.", "ar": "3–4 قطع (نقطة واحدة)؛ التعليل (نقطتان)، مثلًا مع قطعة واحدة لا يوجد خيار؛ والكثير من القطع يُرهِق."}, "Lade die Kundschaft ein, die Ware mit den Sinnen zu prüfen.": {"vi": "Hãy mời khách kiểm tra hàng bằng các giác quan.", "tr": "Müşteriyi ürünü duyularıyla denemeye davet edin.", "ar": "ادعُ الزبون إلى فحص البضاعة بحواسه."}, "Einladung": {"vi": "Lời mời", "tr": "Davet", "ar": "الدعوة"}, "Fassen Sie das bitte nicht an,": {"vi": "Xin đừng sờ vào cái đó,", "tr": "Lütfen buna dokunmayın,", "ar": "من فضلك لا تلمس هذا،"}, "Die Kundin soll die Ware anfassen – so baut sie eine Beziehung zum Produkt auf.": {"vi": "Khách nên cầm hàng – như vậy họ xây dựng mối liên hệ với sản phẩm.", "tr": "Müşteri ürüne dokunmalı – böylece ürünle bir bağ kurar.", "ar": "ينبغي للزبونة أن تلمس البضاعة – وهكذا تبني علاقة مع المنتج."}, "Man kann": {"vi": "Người ta có thể", "tr": "İnsan şunu yapabilir (Man kann)", "ar": "يمكن للمرء (Man kann)"}, "„Man“ ist unpersönlich. Sprich die Kundin mit „Sie“ an.": {"vi": "„Man“ mang tính vô nhân xưng. Hãy nói với khách bằng „Sie“.", "tr": "„Man“ kişisizdir. Müşteriye „Sie“ diyerek hitap edin.", "ar": "„Man“ غير شخصية. خاطب الزبونة بـ „Sie“."}, "das Ding mal an.": {"vi": "cái đồ này đi.", "tr": "şu şeye bir bakın.", "ar": "هذا الشيء."}, "„Das Ding“ wertet die Ware ab. Sorgfältig mit der Ware umgehen heißt auch: sie richtig benennen.": {"vi": "„Cái đồ này“ hạ thấp hàng hóa. Cẩn thận với hàng cũng có nghĩa là gọi tên nó cho đúng.", "tr": "„Şu şey“ ürünü küçümser. Ürüne özenle davranmak, onu doğru adlandırmayı da içerir.", "ar": "„هذا الشيء“ يحطّ من قيمة البضاعة. التعامل بعناية مع البضاعة يعني أيضًا تسميتها بشكل صحيح."}, "Sinne": {"vi": "Giác quan", "tr": "Duyular", "ar": "الحواس"}, "Aber nichts kaputt machen.": {"vi": "Nhưng đừng làm hỏng gì.", "tr": "Ama bir şeyi bozmayın.", "ar": "لكن لا تُتلف شيئًا."}, "Misstrauisch und unfreundlich.": {"vi": "Nghi ngờ và thiếu thân thiện.", "tr": "Güvensiz ve samimiyetsiz.", "ar": "مرتاب وغير ودود."}, "Ist halt Standard.": {"vi": "Thì cũng là hàng tiêu chuẩn thôi.", "tr": "Standart bir ürün işte.", "ar": "إنها بضاعة عادية فقط."}, "Kein Nutzen, keine Begeisterung.": {"vi": "Không có lợi ích, không có hứng khởi.", "tr": "Fayda yok, heyecan yok.", "ar": "لا فائدة ولا حماس."}, "Formulieren Sie in wörtlicher Rede, wie Sie {0} einladen, {1} mit mehreren Sinnen zu prüfen! (Übungsaufgabe nach Modul 8)": {"vi": "Hãy viết bằng lời nói trực tiếp cách bạn mời {0} kiểm tra {1} bằng nhiều giác quan! (Bài luyện sau Mô-đun 8)", "tr": "{0} kişisini {1} birden fazla duyuyla denemeye nasıl davet edeceğinizi doğrudan konuşma biçiminde yazın! (Modül 8'den sonra alıştırma)", "ar": "صُغ بالكلام المباشر كيف تدعو {0} إلى فحص {1} بعدة حواس! (تمرين بعد الوحدة 8)"}, "Ihre Einladung": {"vi": "Lời mời của bạn", "tr": "Davetiniz", "ar": "دعوتك"}, "Einladung zum Anfassen oder Ausprobieren": {"vi": "Mời cầm hoặc dùng thử", "tr": "Dokunmaya veya denemeye davet", "ar": "دعوة إلى اللمس أو التجربة"}, "Begründen Sie, mit welcher Preisklasse Sie die Warenvorlage beginnen.": {"vi": "Hãy giải thích bạn bắt đầu giới thiệu hàng ở tầm giá nào.", "tr": "Ürün sunumuna hangi fiyat aralığıyla başladığınızı gerekçelendirin.", "ar": "علّل بأي فئة سعر تبدأ عرض البضاعة."}, "Mittlere Preislage – dann kann ich je nach Reaktion nach oben oder unten ausweichen.": {"vi": "Tầm giá trung bình – như vậy tôi có thể chuyển lên hoặc xuống tùy phản ứng.", "tr": "Orta fiyat aralığı – böylece tepkiye göre yukarı veya aşağı kayabilirim.", "ar": "فئة السعر المتوسطة – وهكذا أستطيع الانتقال إلى الأعلى أو الأسفل حسب ردّ الفعل."}, "Mit dem teuersten Artikel – das bringt am meisten Umsatz.": {"vi": "Với mặt hàng đắt nhất – như vậy doanh thu cao nhất.", "tr": "En pahalı ürünle – bu en çok ciroyu getirir.", "ar": "بأغلى قطعة – فهذا يحقق أكبر مبيعات."}, "Mit dem günstigsten Artikel – dann ist der Kunde nie enttäuscht.": {"vi": "Với mặt hàng rẻ nhất – khi đó khách không bao giờ thất vọng.", "tr": "En ucuz ürünle – o zaman müşteri asla hayal kırıklığına uğramaz.", "ar": "بأرخص قطعة – وعندها لا يخيب أمل الزبون أبدًا."}, "Verkaufsargumentation": {"vi": "Lập luận bán hàng", "tr": "Satış argümantasyonu", "ar": "الإقناع بالبيع"}, "Argumente": {"vi": "Lập luận", "tr": "Argümanlar", "ar": "الحجج"}, "Modul 9": {"vi": "Mô-đun 9", "tr": "Modül 9", "ar": "الوحدة 9"}, "Nur 3 Teilaufgaben in 3 Prüfungen direkt gefragt – aber jedes Sandwich und jedes Ja-Aber braucht ein Nutzen-Argument.": {"vi": "Chỉ có 3 câu hỏi nhỏ trong 3 kỳ thi hỏi trực tiếp – nhưng mọi câu sandwich và mọi câu „Vâng-nhưng“ đều cần một lập luận về lợi ích.", "tr": "Sadece 3 sınavda 3 alt soru doğrudan soruluyor – ama her sandviç ve her „Evet-ama“ bir fayda argümanı gerektirir.", "ar": "ثلاثة أسئلة فرعية فقط في 3 امتحانات مسؤول عنها مباشرة – لكن كل «ساندويتش» وكل «نعم-لكن» يحتاج إلى حجة فائدة."}, "{0} fragt: „Und was ist das Besondere an {1}?“": {"vi": "{0} hỏi: „Và điểm đặc biệt của {1} là gì?“", "tr": "{0} soruyor: „Peki {1} ne özelliği var?“", "ar": "يسأل {0}: „وما الميزة الخاصة في {1}؟“"}, "Qualität betonen: lange Haltbarkeit, die man sieht und fühlt": {"vi": "Nhấn mạnh chất lượng: độ bền lâu mà người ta nhìn và cảm nhận được", "tr": "Kaliteyi vurgulamak: görülüp hissedilen uzun ömürlülük", "ar": "التأكيد على الجودة: متانة طويلة يمكن رؤيتها وإحساسها"}, "Nutzen: Sicherheit, Freude, Ansehen": {"vi": "Lợi ích: sự an tâm, niềm vui, uy tín", "tr": "Fayda: güvenlik, sevinç, itibar", "ar": "الفائدة: الأمان والفرح والمكانة"}, "Das klingt hochwertig, genau so etwas suche ich.": {"vi": "Nghe có vẻ cao cấp, đúng thứ tôi tìm.", "tr": "Kaliteli duyuluyor, tam aradığım şey.", "ar": "يبدو عالي الجودة، هذا بالضبط ما أبحث عنه."}, "Schön und gut … aber ist das nicht teuer?": {"vi": "Hay đấy … nhưng chẳng phải nó đắt sao?", "tr": "Güzel ama … pahalı değil mi?", "ar": "جميل … لكن أليس غاليًا؟"}, "Klingt gut, aber ich brauch keinen Vortrag.": {"vi": "Nghe hay, nhưng tôi không cần bài giảng.", "tr": "Kulağa hoş geliyor ama konferansa ihtiyacım yok.", "ar": "يبدو جيدًا، لكنني لا أحتاج إلى محاضرة."}, "Passt zu Kundschaft, der Qualität wichtig ist oder die etwas Besonderes verschenken möchte.": {"vi": "Phù hợp với khách coi trọng chất lượng hoặc muốn tặng món gì đặc biệt.", "tr": "Kaliteye önem veren veya özel bir şey hediye etmek isteyen müşteriye uygun.", "ar": "يناسب الزبائن الذين تهمهم الجودة أو يريدون إهداء شيء مميز."}, "Sparen und Bequemlichkeit betonen: pflegeleicht, praktisch, spart Zeit und Geld": {"vi": "Nhấn mạnh tiết kiệm và tiện lợi: dễ chăm sóc, thực dụng, tiết kiệm thời gian và tiền bạc", "tr": "Tasarruf ve kolaylığı vurgulamak: bakımı kolay, pratik, zaman ve para tasarrufu", "ar": "التأكيد على التوفير والراحة: سهل العناية وعملي ويوفّر الوقت والمال"}, "Nutzen: Sparsamkeit, Bequemlichkeit": {"vi": "Lợi ích: tiết kiệm, tiện lợi", "tr": "Fayda: tutumluluk, kolaylık", "ar": "الفائدة: التوفير والراحة"}, "Hm, praktisch … aber für ein Geschenk?": {"vi": "Hm, thực dụng … nhưng làm quà thì sao?", "tr": "Hm, pratik … ama hediye için?", "ar": "همم، عملي … لكن كهدية؟"}, "Das gefällt mir, das rechnet sich.": {"vi": "Tôi thích, tính ra có lợi.", "tr": "Hoşuma gitti, hesaplı.", "ar": "يعجبني، يستحق التكلفة."}, "Genau, unkompliziert. Das passt.": {"vi": "Đúng, đơn giản. Hợp rồi.", "tr": "Evet, karmaşık değil. Uygun.", "ar": "بالضبط، بسيط. هذا مناسب."}, "Praktisch ist schön, aber hält das auch?": {"vi": "Thực dụng thì tốt, nhưng nó có bền không?", "tr": "Pratik olması güzel ama dayanıklı mı?", "ar": "العملي جيد، لكن هل يدوم؟"}, "Passt zu Kundschaft, die auf den Preis achtet oder wenig Zeit hat.": {"vi": "Phù hợp với khách để ý đến giá hoặc có ít thời gian.", "tr": "Fiyata dikkat eden veya az zamanı olan müşteriye uygun.", "ar": "يناسب الزبائن الذين ينتبهون للسعر أو وقتهم قليل."}, "Alle technischen Daten aufzählen": {"vi": "Liệt kê tất cả thông số kỹ thuật", "tr": "Tüm teknik verileri saymak", "ar": "سرد كل المواصفات التقنية"}, "Dann weiß die Kundschaft alles.": {"vi": "Vậy khách biết hết mọi thứ.", "tr": "O zaman müşteri her şeyi bilir.", "ar": "وهكذا يعرف الزبون كل شيء."}, "(schaut verwirrt) Und … was bringt mir das jetzt?": {"vi": "(nhìn bối rối) Và … điều đó mang lại gì cho tôi?", "tr": "(şaşkın bakıyor) Ve … bunun bana ne faydası var?", "ar": "(تنظر بحيرة) وماذا … يعني هذا لي الآن؟"}, "Ein Merkmal allein verkauft nicht.
