/* ===== Mini-Spiel: Treppe bauen ===== */
function vOrder() {
  const O = S.order;
  const placed = O.placed.map(id => PHASES.find(p => p.id === id));
  return `<div class="scene">${sceneSVG()}</div>
  <section class="card stack"><span class="eyebrow">Aufwärmen · bis zu 4 Fachpunkte</span><h2>Baut die Treppe auf</h2>
  <p class="lead">Tippt die Phasen in der richtigen Reihenfolge an – von der ersten bis zur achten Stufe.</p>
  <div class="ladder">${PHASES.map((p, k) => { const c = placed[k]; let cls = c ? 'f' : ''; if (O.checked && c) cls = c.id === k + 1 ? 'ok' : 'no'; return `<div class="pl"><span class="n">${k + 1}</span><span class="c ${cls}">${c ? esc(c.name) : ''}${O.checked && c && c.id !== k + 1 ? ` <span class="tiny">→ richtig: ${esc(PHASES[k].name)}</span>` : ''}</span></div>`; }).join('')}</div>
  ${O.checked ? `<div class="fb ${O.right === 8 ? 'good' : O.right >= 5 ? 'mid' : 'bad'}">${O.right} von 8 an der richtigen Stelle · +${O.p} Fachpunkte</div><button class="btn wide" id="orderNext">Weiter zur ersten Stufe</button>`
  : `<div class="chips">${O.pool.filter(id => !O.placed.includes(id)).map(id => `<button class="chip" data-ord="${id}">${esc(PHASES.find(p => p.id === id).name)}</button>`).join('')}</div>
  <div class="row"><button class="btn ghost" id="orderReset">Neu anfangen</button><button class="btn" id="orderCheck" ${O.placed.length === 8 ? '' : 'disabled'}>Prüfen</button></div>`}

/* ===== Spielrunde ===== */
function curPh() { return PHASES.find(p => p.id === S.list[S.i]); }
function fitOf(ph, k) {
  const o = PV(ph,'opts')[k]; let f = o.fit[S.per] + ((o.shop && o.shop[S.shop]) || 0);
  if ((ph.id === 3 || ph.id === 4) && S.res[2] && S.res[2].fit === 0) f -= 1;
  return clamp(f, 0, 3);
}
function bestFit(ph) { return Math.max(...PV(ph,'opts').map((o, k) => fitOf(ph, k))); }

function vPlay() {
  const ph = curPh(), R = S.res[ph.id];
  let h = `<div class="scene">${sceneSVG()}</div><section class="card stack">${talk()}</section>`;
  h += `<section class="card stack"><span class="eyebrow">Stufe ${ph.id} · ${esc(ph.modul)}</span><h2>${esc(ph.name)}</h2>`;
  if (S.step === 'decide') {
    h += `<p>${esc(fill(pickTxt(PV(ph,'sit'))))}</p>`;
    if (ph.id >= 3 && !S.sel.has(2)) h += `<div class="hint"><b>Das wisst ihr schon:</b> „${esc(PERSONAS[S.per].need)}“</div>`;
    if ((ph.id === 3 || ph.id === 4) && S.res[2] && S.res[2].fit === 0) h += `<div class="hint">Achtung: In Stufe 2 habt ihr den Bedarf kaum ermittelt. Jetzt trefft ihr schwerer.</div>`;
    h += `<div class="opts">${PV(ph,'opts').map((o, k) => { let cls = R && R.opt === k ? 'sel' : ''; if (R && R.locked) cls += ' r' + fitOf(ph, k); return `<button class="opt ${cls}" data-opt="${k}" ${R && R.locked ? 'disabled' : ''}><span class="t">${esc(fill(o.t))}</span><span class="d">${esc(fill(o.d))}</span></button>`; }).join('')}</div>`;
    if (!R || !R.locked) h += `<button class="btn wide" id="lock" ${R && R.opt != null ? '' : 'disabled'}>Entscheidung festlegen</button>`;
    else {
      const f = R.fit, bf = bestFit(ph);
      h += `<div class="fb ${f >= 3 ? 'good' : f >= 1 ? 'mid' : 'bad'}">${f >= 3 ? 'Passt sehr gut zu ' : f >= 1 ? 'Geht so bei ' : 'Daneben bei '}${esc(PERSONAS[S.per].nameD)}. +${f} ${f === 1 ? 'Punkt' : 'Punkte'}${f < bf ? ' · Es gäbe eine bessere Wahl – die steht in der Auswertung.' : ''}</div>`;
      h += `<div class="term"><span class="eyebrow" style="color:var(--teal)">Fachbegriff</span><b>${esc(fill(PV(ph,'term')))}</b><span>${esc(fill(PV(ph,'termText')))}</span></div>`;
      h += `<button class="btn wide" id="toSay">Weiter: Jetzt sagt ihr es</button>`;
    }
  } else if (S.step === 'say') {
    h += S.level === 'basis' ? vBasis(ph) : vProfi(ph);
  } else if (S.step === 'why') {
    h += vWhy(ph);
  }
  return h + `</section>`;
}

/* Basis: Satzbaukasten */
function vBasis(ph) {
  const R = S.res[ph.id];
  if (!R.builds) R.builds = PV(ph,'basis').map(b => ({ order: b.slots.map(sl => shuffle(sl.ch.map((c, k) => k))), sel: b.slots.map(() => null), tries: 0, done: false, ok: b.slots.map(() => false), pts: 0 }));
  let h = `<p class="lead">In wörtlicher Rede: Tippt pro Zeile einen Baustein an. Dann prüfen.</p>`;
  h += `<div class="ws">${wsFor(ph).map(w => `<span>${esc(w)}</span>`).join('')}</div>`;
  PV(ph,'basis').forEach((b, bi) => {
    const B = R.builds[bi];
    const parts = b.slots.map((sl, si) => { const k = B.sel[si]; if (k == null) return '<span class="gap">&nbsp;</span>'; const cls = B.tries ? (B.ok[si] ? 'ok' : 'no') : ''; return `<span class="w ${cls}">${esc(fill(sl.ch[k].t))}</span>`; });
    h += `<div class="stack" style="gap:8px"><h3>${esc(fill(b.task))}</h3><div class="sentence">${b.plain ? '' : '„'}${parts.join(' ')}${b.plain ? '' : '“'}</div>`;
    b.slots.forEach((sl, si) => {
      const locked = B.done || (B.tries && B.ok[si]);
      h += `<div class="slot"><span class="lbl">${esc(sl.lbl)}</span><div class="chips">${B.order[si].map(k => { const c = sl.ch[k]; let cls = B.sel[si] === k ? 'sel' : ''; if (B.tries && B.sel[si] === k) cls = B.ok[si] ? 'ok' : 'no'; if (B.done && B.showRight && c.ok) cls = 'ok'; return `<button class="chip ${cls}" data-b="${bi}" data-s="${si}" data-k="${k}" ${locked ? 'disabled' : ''}>${esc(fill(c.t))}</button>`; }).join('')}</div>`;

    if (b.id === 'againNew') { drawPersona(S.per); S.turned = false; S.screen = 'draw'; render(); window.scrollTo(0, 0); return; }
    if (b.id === 'againSame') { startGame(true); return; }
    if (b.id === 'againSetup') { S.screen = 'start'; render(); window.scrollTo(0, 0); return; }
  };
  app.oninput = e => {
    const t = e.target;
    if (t.dataset && t.dataset.tx != null) {
      const ph = curPh(), R = S.res[ph.id]; R.texts[+t.dataset.tx] = t.value;
      const res = evalChecks(ph, R.texts);
      const lis = document.querySelectorAll('#checks li');
      res.forEach((c, k) => { lis[k].className = c.ok ? 'ok' : 'no'; });
      const sb = $('#submit'); if (sb) sb.disabled = !R.texts.every(x => x.trim().length >= 6);
    }
    if (t.id === 'team') S.team = t.value;
  };
}

/* ===== Gesehen-Speicher: keine doppelten Fragen, solange es neue gibt ===== */
function seenAll() { return store('sfs-seen') || {}; }

}
function newCount(mode) {

}

/* ===== Timer ===== */
let TIMER = null;
function stopTimer() { if (TIMER) { clearInterval(TIMER); TIMER = null; } }
function runTimer(end, total, onEnd) {
  const tick = () => {

    const bar = $('#tbar'), txt = $('#ttxt');

    if (txt) txt.textContent = Math.ceil(left / 1000) + ' s';
    if (left <= 0) { stopTimer(); onEnd(); }

  stopTimer(); tick(); if (Date.now() < end) TIMER = setInterval(tick, 200);
}
function afterRender() {

/* ===== Fehler-Detektiv ===== */

/* ===== Kundenansturm ===== */
const CROWD = ['#b03a5b','#3d6b8f','#2f8a63','#e0a03a','#7a4fa0','#c0603a','#4a7a2a','#2a6f8a'];

/* ===== Blitzrunde ===== */

  return `<section class="score"><span class="eyebrow" style="color:inherit;opacity:.85">${esc(MODES[m].name)} · ${lvlTag()} · zum Zeigen</span><div class="big">${big}</div><p>${sub}</p><p><b>${esc(S.team || 'Team ohne Namen')}</b></p></section>
  <section class="card stack"><div class="kpis">${kpis.map(k => `<div class="kpi"><div class="v">${k[0]}</div><div class="l">${k[1]}</div></div>`).join('')}</div>
  <p class="small">${S.newRecord ? '<b>Neuer Rekord auf diesem Gerät!</b> ' : ''}Rekord (${lvlTag()}): ${m === 'ansturm' ? S.recVal + ' €' : S.recVal + ' Punkte'} · nur auf diesem Gerät gespeichert.</p>
  <p class="small">${n ? `Noch ${n} von ${t} ${MODES[m].unit} neu.` : `Ihr habt alle ${t} ${MODES[m].unit} gespielt – ab jetzt wird neu gemischt.`}</p></section>
  <section class="card stack"><h2>Auflösung</h2>${list}</section>
  <section class="card stack"><div class="row"><button class="btn" id="mAgain">Nochmal – mit neuen Fragen</button><button class="btn ghost" id="mHome">Anderer Modus</button></div></section>`;
}

/* ===== Klicks der Modi ===== */
function modeClick(b, d) {
  if (d.mode) { S.mode = d.mode; const t = $('#team'); if (t) S.team = t.value; render(); const x = $('#startMode') || $('#toPhases'); if (x) x.scrollIntoView({ block: 'center', behavior: 'smooth' }); return true; }
  if (b.id === 'startMode') { const t = $('#team'); if (t) S.team = t.value.trim(); ({ fehler:startFehler, ansturm:startAnsturm, blitz:startBlitz })[S.mode](); return true; }
  if (b.id === 'mAgain') { ({ fehler:startFehler, ansturm:startAnsturm, blitz:startBlitz })[S.mres](); return true; }
  if (b.id === 'mHome') { S.screen = 'start'; render(); window.scrollTo(0, 0); return true; }
  /* Fehler-Detektiv */
  if (S.screen === 'fehler') {
    const F = S.fe, { E } = feCur();
    if (d.fl != null) {
      const i = +d.fl;
      if (i === E.l) { const p = F.tries ? 0 : 1; F.pts += p; F.max += 1; F.stage = 'type'; }
      else { F.wrong.push(i); F.tries++; if (F.tries >= 2) { F.max += 1; F.stage = 'type'; } }
      render(); return true;
    }
    if (d.ft) { F.typePick = d.ft; F.max += 1; if (d.ft === E.ty) F.pts += 1; render(); return true; }
    if (b.id === 'feToFix') { F.stage = 'fix'; render(); return true; }
    if (d.ff != null) { F.fixPick = +d.ff; F.max += 2; if (E.fix[F.fixPick].ok) F.pts += 2; render(); return true; }
    if (b.id === 'feSub') { F.sub = true; render(); return true; }
    if (d.fself != null) { F.self = +d.fself; F.max += 2; F.pts += F.self; render(); return true; }
    if (b.id === 'feNext') { feAdvance(); return true; }
  }
  /* Kundenansturm */
  if (S.screen === 'ansturm') {
    if (d.an != null && S.an.pick == null) { answerAnsturm(+d.an); return true; }
    if (b.id === 'anNext') { const A = S.an; if (A.k + 1 < A.items.length) { A.k++; anPrep(); render(); window.scrollTo(0, 0); } else modeResult('ansturm'); return true; }
  }
  /* Blitzrunde */
  if (S.screen === 'blitz' && d.bz != null) {
    const B = S.bz; if (B.over) return true;
    const q = B.queue[B.k % B.queue.length], pick = +d.bz, ok = pick === q.p;
    let add = 0;
    if (ok) { B.streak++; add = B.streak > 6 ? 3 : B.streak > 3 ? 2 : 1; B.pts += add; B.right++; B.best = Math.max(B.best, B.streak); } else B.streak = 0;
    B.log.push({ q, pick, ok }); B.last = { ok, add, q }; B.k++;
    if (B.k < B.queue.length) seenAdd('satz', [B.queue[B.k].id]);
    if (Date.now() >= B.end) { endBlitz(); return true; }
    render(); return true;
  }
  return false;
}
document.addEventListener('input', e => { if (e.target.dataset && e.target.dataset.fetx) { S.fe.text = e.target.value; const sb = $('#feSub'); if (sb) sb.disabled = e.target.value.trim().length < 6; } });

init();
</script></body></html>
