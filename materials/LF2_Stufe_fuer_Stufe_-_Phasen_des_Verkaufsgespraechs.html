<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stufe für Stufe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:wght@400;600;800&display=swap">
<style>
/* Layout: eine Spalte wie ein Gesprächsprotokoll; oben Statusleiste (Stimmung, Punkte, Stufe), darunter die Treppe mit Kundin und Sprechblase, dann die Aufgabenkarten */
:root{
  --bg:#eef0f5; --surface:#ffffff; --surface2:#f4f2f7; --ink:#1f1b2d; --muted:#5a5568; --line:#d6d2e0;
  --berry:#9e2457; --on-berry:#ffffff; --apricot:#f2a541; --on-apricot:#2b1a00; --teal:#16706a;
  --good:#1d7f47; --mid:#9a6400; --bad:#bf3626; --good-bg:#e1f3e8; --mid-bg:#fbf0d6; --bad-bg:#fbe3df;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15131d; --surface:#1f1c2a; --surface2:#282435; --ink:#ece9f3; --muted:#aaa4ba; --line:#3a3549;
  --berry:#ec6f9f; --on-berry:#2a0715; --apricot:#f5b960; --on-apricot:#2b1a00; --teal:#4cc2b8;
  --good:#63d18f; --mid:#eebc4a; --bad:#f2846f; --good-bg:#173626; --mid-bg:#3a3017; --bad-bg:#40221d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131d; --surface:#1f1c2a; --surface2:#282435; --ink:#ece9f3; --muted:#aaa4ba; --line:#3a3549;
  --berry:#ec6f9f; --on-berry:#2a0715; --apricot:#f5b960; --on-apricot:#2b1a00; --teal:#4cc2b8;
  --good:#63d18f; --mid:#eebc4a; --bad:#f2846f; --good-bg:#173626; --mid-bg:#3a3017; --bad-bg:#40221d; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px;
  background-image:radial-gradient(var(--line) 1.2px,transparent 1.3px);background-size:22px 22px}
.wrap{max-width:820px;margin:0 auto}
h1,h2,h3{font-family:var(--display);line-height:1.08;text-wrap:balance;margin:0}
h1{font-size:clamp(2.4rem,8vw,3.8rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.45rem,4.6vw,1.95rem);font-weight:800;letter-spacing:-.01em}
h3{font-size:1.15rem;font-weight:800}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--apricot);outline-offset:2px;border-radius:8px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:8px 16px;
  background:var(--surface);border-bottom:2px solid var(--ink);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;display:flex;align-items:center;gap:6px}
.brand svg{width:26px;height:26px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);font-weight:800;font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.pts{background:var(--apricot);color:var(--on-apricot);border-color:transparent}
.bar .sp{flex:1}
.prog{display:flex;gap:4px;width:100%}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.done{background:var(--teal)}
.prog i.now{background:var(--berry)}

main{padding-top:18px;display:grid;gap:16px}
.card{background:var(--surface);border:2px solid var(--ink);border-radius:var(--r);padding:18px;box-shadow:4px 4px 0 var(--ink);min-width:0}
.eyebrow{font-weight:800;font-size:.76rem;letter-spacing:.09em;text-transform:uppercase;color:var(--berry)}
.lead{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:12px}
.small{font-size:.9rem;color:var(--muted)}

.btn{border:2px solid var(--ink);background:var(--berry);color:var(--on-berry);font-weight:800;font-size:1.05rem;padding:12px 20px;border-radius:12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.sun{background:var(--apricot);color:var(--on-apricot)}
.btn.ghost{background:var(--surface);color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.wide{width:100%}
.linkbtn{background:none;border:none;color:var(--berry);font-weight:800;text-decoration:underline;cursor:pointer;padding:0}

input[type=text],textarea{width:100%;border:2px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:1.05rem}
textarea{min-height:92px;resize:vertical;line-height:1.45}
input[type=text]:focus,textarea:focus{border-color:var(--berry);outline:none}
label.fl{font-weight:800;font-size:.95rem;display:block;margin-bottom:4px}

/* Auswahlkarten */
.choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ch{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px;cursor:pointer;text-align:left;display:grid;gap:4px;justify-items:start;min-width:0}
.ch svg{width:54px;height:54px}
.ch b{font-family:var(--display);font-size:1.1rem}
.ch .small{hyphens:auto;overflow-wrap:anywhere}
.choice.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choice.three .ch{padding:10px}
.ch.sel{border-color:var(--berry);background:var(--surface);box-shadow:0 0 0 3px var(--berry) inset}

/* Stufenwahl */
.steps8{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.st{border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;min-width:0}
.st .n{grid-row:span 2;width:34px;height:34px;border-radius:9px;background:var(--surface);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:800}
.st .nm{font-weight:800;line-height:1.2}
.st .md{font-size:.82rem;color:var(--muted);grid-column:2}
.st .bx{grid-row:span 2;grid-column:3;width:24px;height:24px;border-radius:6px;border:2px solid var(--ink);display:grid;place-items:center;background:var(--surface)}
.st.on{border-color:var(--berry);background:var(--surface)}
.st.on .n{background:var(--berry);color:var(--on-berry)}
.st.on .bx{background:var(--berry)}
.st.on .bx::after{content:"";width:6px;height:11px;border:solid var(--on-berry);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.wr{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;background:var(--apricot);color:var(--on-apricot);padding:0 6px;border-radius:5px;margin-left:4px;vertical-align:1px}

/* Prüfungsbalken */
.heat{display:grid;gap:6px}
.hr{display:grid;grid-template-columns:minmax(0,9.5em) 1fr 3.4em;gap:8px;align-items:center;font-size:.92rem}
.hr .tr{height:14px;border-radius:7px;background:var(--surface2);border:1.5px solid var(--line);overflow:hidden}
.hr .fi{height:100%;background:var(--berry);border-radius:6px}
.hr .v{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.hr .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Szene */
.scene{border:2px solid var(--ink);border-radius:var(--r);overflow:hidden;background:#dfe7f3;display:grid;grid-template-columns:minmax(0,1fr);position:relative}
.scene svg{display:block;width:100%;height:auto}
.talk{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center}
.talk .face{width:96px;height:96px;border-radius:50%;border:2px solid var(--ink);background:#f7e8d7;overflow:hidden}
.talk .face svg{width:100%;height:100%;display:block}
.bubble{position:relative;background:var(--surface);border:2px solid var(--ink);border-radius:16px;padding:10px 14px;font-weight:600;min-width:0}
.bubble::before{content:"";position:absolute;left:-11px;top:50%;margin-top:-8px;border:8px solid transparent;border-right-color:var(--ink);border-left:0;width:0;height:0;border-right-width:11px}
.bubble::after{content:"";position:absolute;left:-7px;top:50%;margin-top:-6px;border:6px solid transparent;border-right-color:var(--surface);border-left:0;border-right-width:8px}
.bubble .who{font-size:.78rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.mood{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:800}
.mood .tr{flex:1;height:12px;border-radius:6px;background:var(--surface2);border:1.5px solid var(--line);overflow:hidden}
.mood .fi{height:100%;transition:width .5s ease}

/* Optionen */
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface2);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:3px;min-width:0}
.opt:hover:not([disabled]){border-color:var(--berry)}
.opt.sel{border-color:var(--berry);background:var(--surface);box-shadow:0 0 0 3px var(--berry) inset}
.opt[disabled]{cursor:default}
.opt .t{font-weight:800;font-size:1.05rem;line-height:1.25}
.opt .d{font-size:.93rem;color:var(--muted)}
.opt.r3{border-color:var(--good);background:var(--good-bg)}
.opt.r1,.opt.r2{border-color:var(--mid);background:var(--mid-bg)}
.opt.r0{border-color:var(--bad);background:var(--bad-bg)}

.term{border:2px dashed var(--teal);border-radius:12px;padding:12px 14px;display:grid;gap:4px;background:var(--surface2)}
.term b{font-family:var(--display);font-size:1.15rem;color:var(--teal)}
.fb{border-radius:12px;padding:10px 14px;font-weight:600}
.fb.good{background:var(--good-bg);color:var(--ink);border:2px solid var(--good)}
.fb.mid{background:var(--mid-bg);color:var(--ink);border:2px solid var(--mid)}
.fb.bad{background:var(--bad-bg);color:var(--ink);border:2px solid var(--bad)}
.hint{border-left:4px solid var(--apricot);padding:6px 12px;background:var(--surface2);border-radius:0 10px 10px 0;font-size:.95rem}

/* Satzbaukasten */
.sentence{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.35;background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-height:3.2em}
.sentence .gap{display:inline-block;min-width:3.5em;border-bottom:3px solid var(--line);margin:0 2px}
.sentence .w{border-bottom:3px solid var(--berry)}
.sentence .w.ok{border-color:var(--good)}
.sentence .w.no{border-color:var(--bad);text-decoration:line-through;text-decoration-color:var(--bad)}
.slot{display:grid;gap:6px}
.slot .lbl{font-size:.8rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;text-align:left;max-width:100%}
.chip.sel{border-color:var(--berry);box-shadow:0 0 0 2px var(--berry) inset}
.chip.ok{border-color:var(--good);background:var(--good-bg)}
.chip.no{border-color:var(--bad);background:var(--bad-bg)}
.chip[disabled]{cursor:default}
.ws{display:flex;flex-wrap:wrap;gap:6px}
.ws span{font-size:.85rem;background:var(--surface2);border:1.5px solid var(--line);border-radius:6px;padding:1px 8px}

.checks{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:.95rem}
.checks li::before{content:"";flex:none;width:18px;height:18px;margin-top:3px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.checks li.ok::before{background:var(--good);border-color:var(--good)}
.checks li.no::before{background:var(--bad);border-color:var(--bad)}
.muster{border:2px solid var(--teal);border-radius:12px;padding:12px 14px;background:var(--surface2);display:grid;gap:6px}
.muster .src{font-size:.8rem;font-weight:800;color:var(--teal);text-transform:uppercase;letter-spacing:.05em}
.quote{font-style:italic}

/* Persona-Karte */
.flip{perspective:900px}
.flip .inner{transition:transform .6s;transform-style:preserve-3d;position:relative;min-height:290px}
.flip.turned .inner{transform:rotateY(180deg)}
.flip .side{position:absolute;inset:0;backface-visibility:hidden;border:2px solid var(--ink);border-radius:var(--r);background:var(--surface);box-shadow:4px 4px 0 var(--ink);padding:18px;display:grid;place-items:center}
.flip .back{transform:rotateY(180deg);place-items:stretch}
.flip .front{background:var(--berry);color:var(--on-berry)}
.pcard{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start}
.pcard .face{width:110px;height:110px;border-radius:50%;border:2px solid var(--ink);overflow:hidden;background:#f7e8d7}
.pcard .face svg{width:100%;height:100%;display:block}
dl.facts{margin:0;display:grid;gap:4px}
dl.facts dt{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
dl.facts dd{margin:0 0 4px}

/* Reihenfolge-Spiel */
.ladder{display:grid;gap:6px}
.ladder .pl{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
.ladder .pl .n{width:34px;height:30px;border-radius:8px;border:2px solid var(--ink);display:grid;place-items:center;font-weight:800;background:var(--surface)}
.ladder .pl .c{border:2px dashed var(--line);border-radius:10px;padding:4px 10px;min-height:34px;font-weight:700}
.ladder .pl .c.f{border-style:solid;border-color:var(--berry)}
.ladder .pl .c.ok{border-color:var(--good);background:var(--good-bg)}
.ladder .pl .c.no{border-color:var(--bad);background:var(--bad-bg)}

/* Quiz */
.qbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.qb{border:2px solid var(--line);background:var(--surface2);border-radius:10px;padding:6px 4px;cursor:pointer;display:grid;justify-items:center;font-size:.78rem;line-height:1.15;font-weight:700;min-width:0}
.qb .n{font-family:var(--display);font-weight:800;font-size:1.2rem}
.qb.ok{border-color:var(--good);background:var(--good-bg)}
.qb.no{border-color:var(--bad);background:var(--bad-bg)}

/* Auswertung */
.score{background:var(--berry);color:var(--on-berry);border:2px solid var(--ink);border-radius:var(--r);box-shadow:4px 4px 0 var(--ink);padding:18px;display:grid;gap:10px;text-align:center;justify-items:center}
.score .big{font-family:var(--display);font-weight:800;font-size:clamp(3rem,13vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums}
.stars{display:flex;gap:6px}
.stars svg{width:42px;height:42px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--surface2);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.82rem;color:var(--muted);font-weight:700}
.rv{border:2px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;background:var(--surface2)}
.rv .hd{display:flex;gap:10px;align-items:center}
.mk{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff}
.mk.g{background:var(--good)} .mk.m{background:var(--mid)} .mk.b{background:var(--bad)}
:root[data-theme="dark"] .mk{color:#15131d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mk{color:#15131d}}
.said{font-family:var(--display);font-weight:600;border-left:4px solid var(--berry);padding-left:10px}
details summary{cursor:pointer;font-weight:800}
.tiny{font-size:.8rem;color:var(--muted)}


/* Modi */
.choice.two{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.ch.mode svg{width:44px;height:44px}
.newc{font-size:.78rem;font-weight:800;background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:1px 9px;color:var(--teal)}
.dlg{display:grid;gap:8px}
.ln{border:2px solid var(--line);border-radius:14px;padding:8px 12px;text-align:left;background:var(--surface2);max-width:88%;cursor:pointer;display:grid;gap:2px;font-weight:600}
.ln .who{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.ln.v{justify-self:start;border-color:var(--berry)}
.ln.k{justify-self:end;background:var(--surface)}
.ln[disabled]{cursor:default}
.ln.no{border-color:var(--bad);background:var(--bad-bg)}
.ln.hit{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 0 0 3px var(--bad) inset}
.ln.fixed{border-color:var(--good);background:var(--good-bg)}

@keyframes pop{0%{transform:scale(.85);opacity:.3}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){
  body{font-size:16px}
  .talk{grid-template-columns:72px 1fr}
  .talk .face{width:72px;height:72px}
  .pcard{grid-template-columns:80px 1fr}
  .pcard .face{width:80px;height:80px}
  .card{padding:14px}
  .qb{font-size:.7rem}
  .flip .inner{min-height:340px}
}

.t{display:none;margin:4px 0 0;padding-inline-start:8px;border-inline-start:3px solid rgba(127,127,127,.55);color:inherit;opacity:.88;font-weight:400;font-style:normal;font-size:.9em;line-height:1.45;letter-spacing:0;text-transform:none;text-align:start}
.t b{font-weight:700}
body[data-lang="vi"] .t-vi,body[data-lang="tr"] .t-tr,body[data-lang="ar"] .t-ar{display:block}
.t-ar{direction:rtl}
button .t,.chip .t,.mode .t{font-size:.8em}
.hud-in{flex-wrap:wrap}
#sprachbar{display:flex;gap:4px;align-items:center}
#sprachbar button{font:inherit;font-size:.78rem;font-weight:700;min-height:32px;min-width:34px;padding:2px 8px;border:1px solid currentColor;border-radius:14px;background:transparent;color:inherit;cursor:pointer}
#sprachbar button[aria-pressed="true"]{background:#fff;color:var(--petrol,#1F4E79)}
body:not([data-lang="de"]) .flip .inner{min-height:520px}body:not([data-lang="de"]) .flip .side{overflow:auto}@media (max-width:480px){body:not([data-lang="de"]) .flip .inner{min-height:600px}}#sprachbar{justify-content:flex-end;margin:6px 0;color:var(--ink,#222)}#sprachbar button[aria-pressed="true"]{background:var(--ink,#222);color:#fff}</style>
</head><body>

<div class="wrap" lang="de">
  <div id="sprachbar" role="group" aria-label="Sprache"><span aria-hidden="true">🌐</span><button type="button" data-l="de" title="Deutsch">DE</button><button type="button" data-l="vi" title="Tiếng Việt" lang="vi">VI</button><button type="button" data-l="tr" title="Türkçe" lang="tr">TR</button><button type="button" data-l="ar" title="العربية" lang="ar">AR</button></div>
  <div class="bar" id="bar"></div>
  <main id="app"></main>
</div>

(function(){

ع بصيغة الكلام المباشر!"}, "Ihr Alternativangebot": {"vi": "Đề xuất thay thế của bạn", "tr": "Alternatif teklifiniz", "ar": "عرضك البديل"}, "gleicher Standard oder Nutzen genannt": {"vi": "đã nêu cùng tiêu chuẩn hoặc lợi ích", "tr": "aynı standart veya yarar belirtildi", "ar": "ذُكر نفس المستوى أو الفائدة"}, "kein „höchstens“ oder „weiß nicht“": {"vi": "không có „höchstens“ (chỉ có thể) hay „weiß nicht“ (không biết)", "tr": "„höchstens“ (en fazla) veya „weiß nicht“ (bilmiyorum) yok", "ar": "لا „höchstens“ (على الأكثر) ولا „weiß nicht“ (لا أعرف)"}, "Wie nennt man dieses Angebot fachlich korrekt?": {"vi": "Đề xuất này gọi đúng thuật ngữ là gì?", "tr": "Bu teklife uzmanlık dilinde doğru olarak ne denir?", "ar": "ما الاسم المهني الصحيح لهذا العرض؟"}, "Alternativangebot": {"vi": "Đề xuất thay thế", "tr": "Alternatif teklif", "ar": "عرض بديل"}, "Entscheiden Sie und begründen Sie mit 2 Argumenten, ob die Antwort der Kollegin verkaufsfördernd wirkt!": {"vi": "Hãy quyết định và giải thích bằng 2 lý lẽ xem câu trả lời của đồng nghiệp có thúc đẩy bán hàng không!", "tr": "Meslektaşın cevabının satışı destekleyip desteklemediğine karar verin ve 2 argümanla gerekçelendirin!", "ar": "قرّر وعلّل بحجتين هل جواب الزميلة يدعم البيع!"}, "Nein – wenig überzeugende Formulierung; die Alternative wird „schlecht“ gemacht; keine Verkaufsargumente; die Verkäuferin wirkt selbst nicht überzeugt.": {"vi": "Không – cách diễn đạt thiếu thuyết phục; sản phẩm thay thế bị chê „tệ“; không có lý lẽ bán hàng; nhân viên bán hàng tự tỏ ra không tin tưởng.", "tr": "Hayır – ikna edici olmayan ifade; alternatif „kötülenir“; satış argümanı yok; satış elemanı kendisi ikna olmamış görünür.", "ar": "لا – صياغة غير مقنعة؛ يُنتقَص من البديل؛ لا توجد حجج بيع؛ وتبدو البائعة نفسها غير مقتنعة."}, "{0} schwankt noch zwischen zwei Modellen. Wann bietest du {1} an?": {"vi": "{0} vẫn còn phân vân giữa hai mẫu. Khi nào bạn đề nghị {1}?", "tr": "{0} hâlâ iki model arasında gidip geliyor. {1} ne zaman önerirsiniz?", "ar": "ما زالت {0} متردّدة بين طرازين. متى تعرض {1}؟"}, "Erst, wenn die Entscheidung für den Hauptartikel gefallen ist": {"vi": "Chỉ sau khi đã quyết định về mặt hàng chính", "tr": "Ancak ana ürün kararı verildikten sonra", "ar": "فقط بعد أن يتم اتخاذ القرار بشأن السلعة الرئيسية"}, "(entscheidet sich) Gut, dann dieses hier. – Ach, und das passt dazu? Prima.": {"vi": "(quyết định) Được, vậy lấy cái này. – À, và cái này hợp với nó à? Tuyệt.", "tr": "(karar verir) Tamam, o zaman bunu alıyorum. – Ha, bu da buna uyuyor mu? Süper.", "ar": "(تقرّر) حسناً، إذن هذا. – آه، وهذا يناسبه؟ رائع."}, "In der Regel bietet man Zusatz- und Ergänzungsartikel nach der Entscheidung für den Hauptartikel an.": {"vi": "Thông thường người ta đề nghị hàng phụ và hàng bổ sung sau khi đã quyết định mua hàng chính.", "tr": "Genellikle ek ve tamamlayıcı ürünler, ana ürün kararından sonra önerilir.", "ar": "عادةً تُعرض السلع الإضافية والمكمّلة بعد اتخاذ القرار بشأن السلعة الرئيسية."}, "Jetzt sofort – dann sieht sie, was alles dazugehört": {"vi": "Ngay bây giờ – để khách thấy những gì đi kèm", "tr": "Hemen şimdi – böylece neyin bir arada olduğunu görür", "ar": "الآن فوراً – لتشاهد الزبونة كل ما يرافقه"}, "Mehr Auswahl hilft.": {"vi": "Nhiều lựa chọn hơn thì có ích.", "tr": "Daha fazla seçenek yardımcı olur.", "ar": "المزيد من الخيارات يساعد."}, "Moment, jetzt wird es mir zu viel.": {"vi": "Khoan, giờ thì nhiều quá rồi.", "tr": "Bir dakika, şimdi bu bana fazla geldi.", "ar": "لحظة، صار هذا كثيراً عليّ الآن."}, "Solange die Kundin noch schwankt, macht ein weiteres Angebot die Entscheidung schwerer.": {"vi": "Khi khách còn phân vân, thêm một đề xuất nữa sẽ làm việc quyết định khó hơn.", "tr": "Müşteri hâlâ kararsızken bir teklif daha, kararı zorlaştırır.", "ar": "ما دامت الزبونة متردّدة، فإن عرضاً إضافياً يجعل القرار أصعب."}, "Gar nicht – das verwirrt nur": {"vi": "Không đề nghị gì – chỉ gây rối", "tr": "Hiç önermemek – sadece kafa karıştırır", "ar": "لا شيء إطلاقاً – هذا يربك فقط"}, "(kauft und geht)": {"vi": "(mua rồi đi)", "tr": "(satın alır ve gider)", "ar": "(تشتري وتنصرف)"}, "(zu Hause) Ohne Speicherkarte geht ja gar nichts …": {"vi": "(ở nhà) Không có thẻ nhớ thì chẳng làm được gì …", "tr": "(evde) Hafıza kartı olmadan hiçbir şey olmuyor …", "ar": "(في البيت) من دون بطاقة الذاكرة لا يمكن فعل شيء …"}, "Ein Zusatzangebot ist Service. Ein Ergänzungsangebot (z. B. Speicherkarte) muss immer angeboten werden.": {"vi": "Đề nghị hàng phụ là dịch vụ. Hàng bổ sung (ví dụ thẻ nhớ) thì luôn phải đề nghị.", "tr": "Ek teklif bir servistir. Tamamlayıcı ürün (örn. hafıza kartı) her zaman önerilmelidir.", "ar": "العرض الإضافي خدمة. أمّا السلعة المكمّلة (مثل بطاقة الذاكرة) فيجب عرضها دائماً."}, "Bau einen Satz: Vorteile für Betrieb und Kundin.": {"vi": "Hãy ghép một câu: lợi ích cho cửa hàng và cho khách.", "tr": "Bir cümle kur: işletme ve müşteri için yararlar.", "ar": "كوّن جملة: فوائد للمنشأة وللزبونة."}, "Betrieb": {"vi": "Cửa hàng", "tr": "İşletme", "ar": "المنشأة"}, "Der Betrieb macht mehr Umsatz und bindet die Kundschaft,": {"vi": "Cửa hàng có thêm doanh thu và giữ chân khách,", "tr": "İşletme daha fazla ciro yapar ve müşteriyi bağlar,", "ar": "تحقق المنشأة مبيعات أكثر وتربط الزبائن بها،"}, "Der Betrieb wird alte Ware los,": {"vi": "Cửa hàng bán được hàng cũ,", "tr": "İşletme eski malından kurtulur,", "ar": "تتخلّص المنشأة من البضاعة القديمة،"}, "Darum geht es nicht – es geht um Umsatz und Kundenbindung.": {"vi": "Vấn đề không phải ở đó – mà là doanh thu và gắn kết khách hàng.", "tr": "Mesele bu değil – mesele ciro ve müşteri bağlılığı.", "ar": "ليس هذا هو المقصود – بل المبيعات وربط الزبائن."}, "Kundin": {"vi": "Khách", "tr": "Müşteri", "ar": "الزبونة"}, "und die Kundin kann die Ware sofort voll nutzen.": {"vi": "và khách có thể dùng hàng đầy đủ ngay lập tức.", "tr": "ve müşteri malı hemen tam olarak kullanabilir.", "ar": "وتستطيع الزبونة استخدام السلعة بالكامل فوراً."}, "und die Kundin gibt mehr Geld aus.": {"vi": "và khách chi nhiều tiền hơn.", "tr": "ve müşteri daha fazla para harcar.", "ar": "وتنفق الزبونة مالاً أكثر."}, "Das ist kein Vorteil für die Kundin.": {"vi": "Đó không phải là lợi ích cho khách.", "tr": "Bu müşteri için bir yarar değil.", "ar": "هذه ليست فائدة للزبونة."}, "Beschreiben Sie jeweils einen Vorteil von Zusatz- oder Ergänzungsartikeln für den Betrieb und für {0}!": {"vi": "Hãy mô tả mỗi bên một lợi ích của hàng phụ hoặc hàng bổ sung: cho cửa hàng và cho {0}!", "tr": "Ek veya tamamlayıcı ürünlerin işletme ve {0} için birer yararını açıklayın!", "ar": "صِف فائدة واحدة للسلع الإضافية أو المكمّلة لكلٍّ من المنشأة و{0}!"}, "Vorteil für den Betrieb": {"vi": "Lợi ích cho cửa hàng", "tr": "İşletme için yarar", "ar": "الفائدة للمنشأة"}, "Vorteil für die Kundschaft": {"vi": "Lợi ích cho khách hàng", "tr": "Müşteriler için yarar", "ar": "الفائدة للزبائن"}, "Betrieb: z. B. Umsatz, Kundenbindung": {"vi": "Cửa hàng: ví dụ doanh thu, gắn kết khách hàng", "tr": "İşletme: örn. ciro, müşteri bağlılığı", "ar": "المنشأة: مثلاً المبيعات وربط الزبائن"}, "Kundschaft: z. B. sofort nutzen, Aufwertung": {"vi": "Khách: ví dụ dùng được ngay, nâng cấp giá trị", "tr": "Müşteri: örn. hemen kullanım, değer artışı", "ar": "الزبائن: مثلاً الاستخدام الفوري ورفع القيمة"}, "Wann bieten Sie Zusatzartikel in der Regel an?": {"vi": "Thông thường khi nào bạn đề nghị hàng phụ?", "tr": "Ek ürünleri genellikle ne zaman önerirsiniz?", "ar": "متى تعرض السلع الإضافية عادةً؟"}, "Bei der Begrüßung.": {"vi": "Lúc chào hỏi.", "tr": "Karşılama sırasında.", "ar": "عند التحية."}, "Erst nach der Verabschiedung.": {"vi": "Chỉ sau khi đã chào tạm biệt.", "tr": "Ancak vedalaştıktan sonra.", "ar": "فقط بعد التوديع."}, "Nennen Sie je einen Vorteil des Ergänzungsverkaufs für das Kaufhaus Hansa und für den Kunden!": {"vi": "Hãy nêu mỗi bên một lợi ích của việc bán bổ sung: cho cửa hàng Hansa và cho khách!", "tr": "Tamamlayıcı satışın Hansa mağazası ve müşteri için birer yararını sayın!", "ar": "اذكر فائدة واحدة للبيع المكمّل لكلٍّ من متجر Hansa والزبون!"}, "Betrieb: höherer Umsatz, Kundenbindung. Kunde: kann den Artikel sofort nutzen, bekommt alles aus einer Hand.": {"vi": "Cửa hàng: doanh thu cao hơn, gắn kết khách hàng. Khách: dùng được ngay mặt hàng, có mọi thứ ở một nơi.", "tr": "İşletme: daha yüksek ciro, müşteri bağlılığı. Müşteri: ürünü hemen kullanabilir, her şeyi tek elden alır.", "ar": "المنشأة: مبيعات أعلى وربط الزبائن. الزبون: يستطيع استخدام السلعة فوراً ويحصل على كل شيء من مكان واحد."}, "{0} schwankt zwischen zwei Modellen: „Ich kann mich einfach nicht entscheiden.“": {"vi": "{0} phân vân giữa hai mẫu: „Tôi thật sự không quyết định được.“", "tr": "{0} iki model arasında kararsız: „Bir türlü karar veremiyorum.“", "ar": "تتردّد {0} بين طرازين: „لا أستطيع أن أقرّر ببساطة.“"}, "Auswahl einengen und die wichtigsten Argumente zusammenfassen": {"vi": "Thu hẹp lựa chọn và tóm tắt các lý lẽ quan trọng nhất", "tr": "Seçimi daraltmak ve en önemli argümanları özetlemek", "ar": "تضييق الخيارات وتلخيص أهم الحجج"}, "Ja-Stimmung erzeugen": {"vi": "Tạo không khí đồng ý („vâng“)", "tr": "Evet havası yaratmak", "ar": "خلق أجواء من الموافقة („نعم“)"}, "Stimmt, genau das war mir wichtig. Dann nehme ich das.": {"vi": "Đúng, đó chính là điều tôi thấy quan trọng. Vậy tôi lấy cái này.", "tr": "Doğru, benim için önemli olan tam buydu. O zaman bunu alıyorum.", "ar": "صحيح، هذا بالضبط ما كان مهماً لي. إذن آخذ هذا."}, "Auswahl einengen und Argumente zusammenfassen erleichtern die Entscheidung.": {"vi": "Thu hẹp lựa chọn và tóm tắt lý lẽ giúp quyết định dễ hơn.", "tr": "Seçimi daraltmak ve argümanları özetlemek karar vermeyi kolaylaştırır.", "ar": "تضييق الخيارات وتلخيص الحجج يسهّلان القرار."}, "Alternativfrage: „Gefällt Ihnen eher dieses oder jenes Modell?“": {"vi": "Câu hỏi lựa chọn: „Bạn thích mẫu này hơn hay mẫu kia hơn?“", "tr": "Seçmeli soru: „Bu modeli mi yoksa şu modeli mi tercih edersiniz?“", "ar": "سؤال الاختيار: „هل يعجبك هذا الطراز أكثر أم ذاك؟“"}, "Zwei positive Möglichkeiten": {"vi": "Hai khả năng tích cực", "tr": "İki olumlu seçenek", "ar": "خياران إيجابيان"}, "Hm … eher das hier, glaube ich.": {"vi": "Ừm … chắc là cái này hơn.", "tr": "Hım … sanırım bu daha çok.", "ar": "همم … أظن هذا أكثر."}, "Das hier. Fertig.": {"vi": "Cái này. Xong.", "tr": "Bu. Bitti.", "ar": "هذا. انتهى."}, "Die Alternativfrage ist eine Abschlusstechnik. Bei sehr Unsicheren hilft es, vorher die Argumente zusammenzufassen.": {"vi": "Câu hỏi lựa chọn là một kỹ thuật chốt đơn. Với người rất lưỡng lự, nên tóm tắt các lý lẽ trước.", "tr": "Seçmeli soru bir kapanış tekniğidir. Çok kararsız olanlara önce argümanları özetlemek yardımcı olur.", "ar": "سؤال الاختيار تقنية إغلاق للبيع. ومع المترددين جداً يساعد تلخيص الحجج قبل ذلك."}, "Noch drei weitere Modelle holen": {"vi": "Lấy thêm ba mẫu nữa", "tr": "Üç model daha getirmek", "ar": "إحضار ثلاثة طرازات أخرى"}, "Vielleicht ist das richtige noch nicht dabei.": {"vi": "Có thể mẫu phù hợp vẫn chưa có ở đây.", "tr": "Belki doğru model henüz aralarında yok.", "ar": "ربما الطراز المناسب ليس بينها بعد."}, "Oh nein, jetzt ist es noch schwerer …": {"vi": "Ôi không, giờ còn khó hơn …", "tr": "Ah hayır, şimdi daha da zor …", "ar": "أوه لا، صار الأمر أصعب الآن …"}, "Mehr Auswahl macht die Entscheidung schwerer. Richtig ist: die Auswahl einengen.": {"vi": "Nhiều lựa chọn hơn làm việc quyết định khó hơn. Đúng là: thu hẹp lựa chọn.", "tr": "Daha fazla seçenek kararı zorlaştırır. Doğrusu: seçimi daraltmak.", "ar": "المزيد من الخيارات يجعل القرار أصعب. الصحيح هو: تضييق الخيارات."}, "Bau eine Abschlussfrage (Alternativfrage).": {"vi": "Hãy ghép một câu hỏi chốt đơn (câu hỏi lựa chọn).", "tr": "Bir kapanış sorusu kur (seçmeli soru).", "ar": "كوّن سؤال إغلاق (سؤال اختيار)."}, "Möchten Sie {0} gleich mitnehmen": {"vi": "Bạn có muốn mang {0} đi luôn", "tr": "{0} hemen yanınızda götürmek ister misiniz", "ar": "هل تودّين أخذ {0} معك فوراً"}, "Wollen Sie {0} jetzt endlich": {"vi": "Bạn có muốn {0} bây giờ không, cuối cùng", "tr": "{0} şimdi artık istiyor musunuz sonunda", "ar": "هل تريدين {0} الآن أخيراً"}, "Ungeduldig und drängelnd.": {"vi": "Sốt ruột và hối thúc.", "tr": "Sabırsız ve aceleci.", "ar": "متلهّف ومتعجّل."}, "oder nutzen Sie unseren Lieferservice?": {"vi": "hay dùng dịch vụ giao hàng của chúng tôi?", "tr": "yoksa teslimat servisimizden mi yararlanırsınız?", "ar": "أم تستخدمين خدمة التوصيل لدينا؟"}, "oder was?": {"vi": "hay sao?", "tr": "yoksa ne?", "ar": "أم ماذا؟"}, "Umgangssprache – eine Alternativfrage nennt zwei positive Möglichkeiten.": {"vi": "Văn nói – câu hỏi lựa chọn nêu hai khả năng tích cực.", "tr": "Günlük konuşma dili – seçmeli soru iki olumlu seçenek sunar.", "ar": "لغة عامّية – سؤال الاختيار يطرح خيارين إيجابيين."}, "Formulieren Sie in wörtlicher Rede eine Abschlussfrage für {0} als Alternativfrage!": {"vi": "Hãy viết một câu hỏi chốt đơn dạng câu hỏi lựa chọn cho {0} bằng lời nói trực tiếp!", "tr": "{0} için seçmeli soru biçiminde bir kapanış sorusunu doğrudan konuşma biçiminde yazın!", "ar": "صُغ سؤال إغلاق على شكل سؤال اختيار لـ {0} بصيغة الكلام المباشر!"}, "Ihre Abschlussfrage": {"vi": "Câu hỏi chốt đơn của bạn", "tr": "Kapanış sorunuz", "ar": "سؤال الإغلاق الخاص بك"}, "enthält „oder“": {"vi": "có „oder“ (hoặc)", "tr": "„oder“ (veya) içerir", "ar": "يحتوي على „oder“ (أو)"}, "Nennen Sie zwei Abschlusstechniken.": {"vi": "Hãy nêu hai kỹ thuật chốt đơn.", "tr": "İki kapanış tekniği adlandırın.", "ar": "اذكر تقنيتين للإغلاق."}, "Alternativfrage und Zusammenfassung der wichtigsten Argumente": {"vi": "Câu hỏi lựa chọn và tóm tắt các lý lẽ quan trọng nhất", "tr": "Seçmeli soru ve en önemli argümanların özeti", "ar": "سؤال الاختيار وتلخيص أهم الحجج"}, "Preis erhöhen und Druck machen": {"vi": "Tăng giá và gây áp lực", "tr": "Fiyatı artırmak ve baskı yapmak", "ar": "رفع السعر والضغط"}, "Schweigen und warten": {"vi": "Im lặng và chờ", "tr": "Susmak ve beklemek", "ar": "الصمت والانتظار"}, "Modul 14": {"vi": "Mô-đun 14", "tr": "Modül 14", "ar": "الوحدة 14"}, "Sie haben dem Kunden drei vergleichbare Artikel vorgeführt und erklärt. Er ist unentschlossen. Geben Sie 3 Möglichkeiten an, wie Sie ihm die Entscheidung erleichtern können!": {"vi": "Bạn đã trình diễn và giải thích ba mặt hàng tương đương cho khách. Khách còn lưỡng lự. Hãy nêu 3 cách giúp khách quyết định dễ hơn!", "tr": "Müşteriye karşılaştırılabilir üç ürünü gösterip açıkladınız. Müşteri kararsız. Kararını kolaylaştırmak için 3 yol belirtin!", "ar": "لقد عرضت وشرحت للزبون ثلاث سلع متشابهة. وهو متردّد. اذكر 3 طرق لتسهيل القرار عليه!"}, "z. B. Auswahl einengen; Umtausch anbieten; Reservierung anbieten; Geschenkverpackung anbieten; Testberichte erwähnen.": {"vi": "ví dụ thu hẹp lựa chọn; đề nghị đổi hàng; đề nghị giữ hàng; đề nghị gói quà; nhắc đến các bài đánh giá kiểm nghiệm.", "tr": "örn. seçimi daraltmak; değişim önermek; ayırma önermek; hediye paketi önermek; test raporlarından bahsetmek.", "ar": "مثلاً تضييق الخيارات؛ عرض الاستبدال؛ عرض الحجز؛ عرض تغليف الهدايا؛ ذكر تقارير الاختبار."}, "{0} hat mit Karte bezahlt. Hinter {1} ist die Schlange an der Kasse lang.": {"vi": "{0} đã thanh toán bằng thẻ. Phía sau {1}, hàng người ở quầy thu ngân rất dài.", "tr": "{0} kartla ödedi. {1} arkasında kasadaki kuyruk uzun.", "ar": "دفعت {0} بالبطاقة. خلف {1} طابور طويل عند الصندوق."}, "Bedanken, mit Namen verabschieden und einen schönen Tag wünschen": {"vi": "Cảm ơn, chào tạm biệt bằng tên và chúc một ngày tốt lành", "tr": "Teşekkür etmek, isimle vedalaşmak ve güzel bir gün dilemek", "ar": "الشكر والتوديع بالاسم وتمنّي يوم جميل"}, "Auch wenn es voll ist.": {"vi": "Ngay cả khi đông khách.", "tr": "Kalabalık olsa bile.", "ar": "حتى لو كان المكان مزدحماً."}, "Danke, Ihnen auch! Bis bald.": {"vi": "Cảm ơn, bạn cũng vậy! Hẹn gặp lại.", "tr": "Teşekkürler, size de! Yakında görüşürüz.", "ar": "شكراً، وأنتِ أيضاً! إلى اللقاء قريباً."}, "Immer zuerst bedanken. Wer mit Karte zahlt, wird mit Namen verabschiedet. Nach dem Kauf ist vor dem Kauf (Modul 15).": {"vi": "Luôn cảm ơn trước. Khách trả bằng thẻ thì chào tạm biệt bằng tên. Sau khi mua là trước khi mua tiếp (Mô-đun 15).", "tr": "Her zaman önce teşekkür et. Kartla ödeyen, isimle uğurlanır. Satın alma sonrası bir sonraki satın alma öncesidir (Modül 15).", "ar": "اشكر دائماً أولاً. من تدفع بالبطاقة تُودَّع باسمها. ما بعد الشراء هو ما قبل الشراء القادم (الوحدة 15)."}, "„Der Nächste, bitte!“": {"vi": "„Người tiếp theo, mời!“", "tr": "„Sıradaki lütfen!“", "ar": "„التالي من فضلكم!“"}, "Die Schlange ist lang.": {"vi": "Hàng người rất dài.", "tr": "Kuyruk uzun.", "ar": "الطابور طويل."}, "(geht ohne Gruß) Na, tschüss dann.": {"vi": "(đi mà không chào) Ừ, tạm biệt vậy.", "tr": "(selamsız gider) Eh, hoşça kalın o zaman.", "ar": "(تنصرف دون تحية) حسناً، إلى اللقاء إذن."}, "Die Kundin fühlt sich abgefertigt. Eine freundliche Verabschiedung sorgt dafür, dass sie wiederkommt.": {"vi": "Khách cảm thấy bị xử lý cho xong chuyện. Một lời chào tạm biệt thân thiện giúp khách quay lại.", "tr": "Müşteri savuşturulmuş hisseder. Samimi bir vedalaşma, tekrar gelmesini sağlar.", "ar": "تشعر الزبونة بأنّها أُنهيت معاملتها على عجل. التوديع اللطيف يجعلها تعود."}, "Kurz „Danke“, der Blick ist schon beim nächsten Kunden": {"vi": "Chỉ nói „Cảm ơn“ ngắn gọn, mắt đã nhìn sang khách tiếp theo", "tr": "Kısaca „Teşekkürler“, bakış zaten bir sonraki müşteride", "ar": "„شكراً“ باختصار، والنظر موجّه إلى الزبون التالي"}, "Effizient": {"vi": "Hiệu quả", "tr": "Verimli", "ar": "فعّال"}, "(nimmt die Tüte) … Ja, danke.": {"vi": "(cầm túi) … Vâng, cảm ơn.", "tr": "(poşeti alır) … Evet, teşekkürler.", "ar": "(تأخذ الكيس) … نعم، شكراً."}, "Nicht unhöflich, aber ohne persönliche Note. Ein situationsbezogener Wunsch kostet zwei Sekunden.": {"vi": "Không bất lịch sự, nhưng thiếu nét riêng. Một lời chúc hợp tình huống chỉ tốn hai giây.", "tr": "Kaba değil, ama kişisel dokunuş yok. Duruma uygun bir dilek iki saniye alır.", "ar": "ليس غير مهذّب، لكنه يفتقر إلى اللمسة الشخصية. أمنية تناسب الموقف لا تستغرق سوى ثانيتين."}, "Bau eine Verabschiedung.": {"vi": "Hãy ghép một lời chào tạm biệt.", "tr": "Bir vedalaşma kur.", "ar": "كوّن عبارة توديع."}, "Dank": {"vi": "Lời cảm ơn", "tr": "Teşekkür", "ar": "الشكر"}, "Vielen Dank für Ihren Einkauf,": {"vi": "Cảm ơn bạn rất nhiều đã mua sắm,", "tr": "Alışverişiniz için çok teşekkürler,", "ar": "شكراً جزيلاً على التسوّق،"}, "So,": {"vi": "Thế nhé,", "tr": "Şöyle,", "ar": "حسناً إذن،"}, "Kein Dank – immer zuerst bedanken.": {"vi": "Không có lời cảm ơn – luôn cảm ơn trước.", "tr": "Teşekkür yok – her zaman önce teşekkür et.", "ar": "لا يوجد شكر – اشكر دائماً أولاً."}, "Name": {"vi": "Tên", "tr": "İsim", "ar": "الاسم"}, "Sie da,": {"vi": "Này bạn kia,", "tr": "Hey siz,", "ar": "أنتِ هناك،"}, "Unpersönlich – bei Kartenzahlung kennst du den Namen.": {"vi": "Thiếu tính cá nhân – khi trả bằng thẻ bạn biết tên khách.", "tr": "Kişisel değil – kartla ödemede adı biliyorsunuz.", "ar": "غير شخصي – عند الدفع بالبطاقة تعرف الاسم."}, "Wunsch": {"vi": "Lời chúc", "tr": "Dilek", "ar": "الأمنية"}, "und ein schönes Wochenende!": {"vi": "và chúc một cuối tuần vui vẻ!", "tr": "ve güzel bir hafta sonu dilerim!", "ar": "وعطلة نهاية أسبوع جميلة!"}, "tschüssi!": {"vi": "tạm biệt nha!", "tr": "bay bay!", "ar": "باي باي!"}, "Zu salopp.": {"vi": "Quá suồng sã.", "tr": "Fazla laubali.", "ar": "غير رسمي أكثر من اللازم."}, "Nach dem Kassiervorgang verabschieden Sie {0}. Formulieren Sie eine kundenorientierte Verabschiedung in wörtlicher Rede!": {"vi": "Sau khi thanh toán, bạn chào tạm biệt {0}. Hãy viết một lời chào tạm biệt hướng đến khách hàng bằng lời nói trực tiếp!", "tr": "Ödeme işleminden sonra {0} ile vedalaşıyorsunuz. Müşteri odaklı bir vedalaşmayı doğrudan konuşma biçiminde yazın!", "ar": "بعد إتمام الدفع تودّع {0}. صُغ عبارة توديع موجّهة نحو الزبون بصيغة الكلام المباشر!"}, "Ihre Verabschiedung": {"vi": "Lời chào tạm biệt của bạn", "tr": "Vedalaşmanız", "ar": "عبارة التوديع الخاصة بك"}, "Wunsch oder Gruß": {"vi": "Lời chúc hoặc lời chào", "tr": "Dilek veya selam", "ar": "أمنية أو تحية"}, "Begründen Sie, warum eine freundliche Verabschiedung für den Betrieb wichtig ist.": {"vi": "Hãy giải thích vì sao lời chào tạm biệt thân thiện quan trọng với cửa hàng.", "tr": "Samimi bir vedalaşmanın işletme için neden önemli olduğunu gerekçelendirin.", "ar": "علّل لماذا يُعدّ التوديع اللطيف مهماً للمنشأة."}, "Die Kundin geht mit einem positiven Gefühl und kommt wieder – das bindet Stammkunden.": {"vi": "Khách ra về với cảm giác tích cực và sẽ quay lại – điều này gắn kết khách quen.", "tr": "Müşteri olumlu bir duyguyla ayrılır ve tekrar gelir – bu, sadık müşteri bağlar.", "ar": "تغادر الزبونة بشعور إيجابي وتعود – وهذا يربط الزبائن الدائمين."}, "Damit die Schlange schneller kürzer wird.": {"vi": "Để hàng người ngắn đi nhanh hơn.", "tr": "Kuyruk daha çabuk kısalsın diye.", "ar": "لكي يقصر الطابور أسرع."}, "Weil sonst die Kasse nicht schließt.": {"vi": "Vì nếu không thì quầy thu ngân không đóng được.", "tr": "Çünkü aksi halde kasa kapanmaz.", "ar": "لأنّ الصندوق لا يُغلق بدون ذلك."}, "Sie haben soeben bei einem Kunden kassiert. Formulieren Sie eine kundenorientierte Verabschiedung in wörtlicher Rede!": {"vi": "Bạn vừa thanh toán cho một khách. Hãy viết một lời chào tạm biệt hướng đến khách hàng bằng lời nói trực tiếp!", "tr": "Az önce bir müşterinin ödemesini aldınız. Müşteri odaklı bir vedalaşmayı doğrudan konuşma biçiminde yazın!", "ar": "لقد حاسبت للتو أحد الزبائن. صُغ عبارة توديع موجّهة نحو الزبون بصيغة الكلام المباشر!"}, "z. B. „Vielen Dank für Ihren Einkauf, viel Freude damit!“; „Auf Wiedersehen, bis zum nächsten Mal!“": {"vi": "ví dụ „Vielen Dank für Ihren Einkauf, viel Freude damit!“ (Cảm ơn bạn đã mua sắm, chúc bạn dùng vui!); „Auf Wiedersehen, bis zum nächsten Mal!“ (Tạm biệt, hẹn lần sau!)", "tr": "örn. „Vielen Dank für Ihren Einkauf, viel Freude damit!“ (Alışverişiniz için teşekkürler, keyfini çıkarın!); „Auf Wiedersehen, bis zum nächsten Mal!“ (Görüşmek üzere, bir dahaki sefere!)", "ar": "مثلاً „Vielen Dank für Ihren Einkauf, viel Freude damit!“ (شكراً على التسوّق، استمتعي بها!)؛ „Auf Wiedersehen, bis zum nächsten Mal!“ (إلى اللقاء، حتى المرة القادمة!)"}, "„Guten Morgen! Schauen Sie sich in Ruhe um, ich bin gleich hier vorne.“": {"vi": "„Chào buổi sáng! Bạn cứ thong thả xem nhé, tôi sẽ có mặt ở phía trước ngay.“", "tr": "„Günaydın! Rahatça bakın, ben hemen şurada ön tarafta olacağım.“", "ar": "„صباح الخير! تفضّلي بالنظر على مهلك، سأكون هنا في المقدمة بعد قليل.“"}, "„Guten Tag, Herr Linder! Schön, dass Sie wieder bei uns vorbeischauen.“": {"vi": "„Chào ông Linder! Rất vui là ông lại ghé cửa hàng chúng tôi.“", "tr": "„İyi günler Bay Linder! Tekrar bize uğramanız çok güzel.“", "ar": "„مرحباً سيد Linder! من الرائع أنّك تزورنا مجدداً.“"}, "„Guten Tag. Diese Jacke, die Sie gerade anschauen, ist wasserdicht.“": {"vi": "„Chào bạn. Chiếc áo khoác bạn đang xem này chống thấm nước.“", "tr": "„İyi günler. Şu an baktığınız bu ceket su geçirmezdir.“", "ar": "„مرحباً. هذه السترة التي تنظرين إليها الآن مقاومة للماء.“"}, "„Welche Anforderungen stellen Sie an das Fahrrad?“": {"vi": "„Bạn có những yêu cầu gì đối với chiếc xe đạp?“", "tr": "„Bisikletten beklentileriniz neler?“", "ar": "„ما هي متطلباتك من الدراجة؟“"}, "„Sie suchen also einen leichten Koffer für Flugreisen – trifft das zu?“": {"vi": "„Vậy bạn đang tìm một chiếc vali nhẹ cho các chuyến bay – đúng không ạ?“", "tr": "„Yani uçak yolculukları için hafif bir bavul arıyorsunuz – doğru mu?“", "ar": "„إذن أنت تبحثين عن حقيبة سفر خفيفة للرحلات الجوية – هل هذا صحيح؟“"}, "„Bevorzugen Sie Gold- oder Silberschmuck?“": {"vi": "„Bạn thích trang sức vàng hay bạc hơn?“", "tr": "„Altın mı yoksa gümüş takı mı tercih edersiniz?“", "ar": "„هل تفضّلين المجوهرات الذهبية أم الفضية؟“"}, "„Möchten Sie das einmal selbst ausprobieren?“": {"vi": "„Bạn có muốn tự thử một lần không?“", "tr": "„Bir kez kendiniz denemek ister misiniz?“", "ar": "„هل تودّين تجربته بنفسك مرة؟“"}, "„Ich zeige Ihnen drei Modelle, die gut zu Ihren Wünschen passen.“": {"vi": "„Tôi sẽ cho bạn xem ba mẫu rất hợp với mong muốn của bạn.“", "tr": "„Size isteklerinize çok uyan üç model göstereyim.“", "ar": "„سأريك ثلاثة طرازات تناسب رغباتك جداً.“"}, "„Probieren Sie die Schuhe gerne an – hier ist ein Spiegel.“": {"vi": "„Bạn cứ thử giày nhé – gương ở đây ạ.“", "tr": "„Ayakkabıları rahatça deneyin – ayna burada.“", "ar": "„جرّبي الحذاء بكل سرور – المرآة هنا.“"}, "„Der Akku hält zwei Tage. Damit müssen Sie das Handy nicht jeden Abend laden.“": {"vi": "„Pin dùng được hai ngày. Nhờ vậy bạn không phải sạc điện thoại mỗi tối.“", "tr": "„Pil iki gün dayanır. Böylece telefonu her akşam şarj etmeniz gerekmez.“", "ar": "„البطارية تدوم يومين. بذلك لا تضطرين إلى شحن الهاتف كل مساء.“"}, "„Die Pfanne ist spülmaschinenfest. So sparen Sie sich das Abwaschen.“": {"vi": "„Chiếc chảo này rửa được bằng máy rửa bát. Như vậy bạn đỡ phải rửa tay.“", "tr": "„Tava bulaşık makinesinde yıkanabilir. Böylece elde yıkamaktan kurtulursunuz.“", "ar": "„المقلاة صالحة للغسل في غسّالة الأطباق. بذلك توفّرين على نفسك الغسل اليدوي.“"}, "„Mit der Kamera im Smartphone machen Sie Fotos, die Sie sofort versenden können.“": {"vi": "„Với camera của điện thoại thông minh, bạn chụp được ảnh và gửi đi ngay lập tức.“", "tr": "„Akıllı telefondaki kamerayla fotoğraf çekip hemen gönderebilirsiniz.“", "ar": "„بكاميرا الهاتف الذكي تلتقطين صوراً وترسلينها فوراً.“"}, "„Diese Jeans ist sehr bequem, sie kostet 99,95 € – und sie bleibt lange in Form.“": {"vi": "„Chiếc quần jeans này rất thoải mái, giá 99,95 € – và giữ dáng được lâu.“", "tr": "„Bu kot pantolon çok rahat, 99,95 € – ve uzun süre şeklini korur.“", "ar": "„هذا الجينز مريح جداً، سعره 99,95 € – ويحافظ على شكله طويلاً.“"}, "„Die Küche besteht aus den Schränken für 4.200 €, der Arbeitsplatte für 800 € …“": {"vi": "„Bộ bếp gồm các tủ giá 4.200 €, mặt bàn bếp 800 € …“", "tr": "„Mutfak, 4.200 € tutarındaki dolaplardan, 800 € tutarındaki tezgahtan oluşuyor …“", "ar": "„المطبخ يتكوّن من الخزائن بسعر 4.200 € وسطح العمل بسعر 800 € …“"}, "„Für 18 Euro mehr bekommen Sie einen zweiten Akku dazu.“": {"vi": "„Thêm 18 euro, bạn nhận thêm một viên pin thứ hai.“", "tr": "„18 euro fazlasıyla yanında ikinci bir pil de alırsınız.“", "ar": "„مقابل 18 يورو إضافية تحصلين على بطارية ثانية.“"}, "„Gerade deshalb ist dieses Modell so robust gebaut.“": {"vi": "„Chính vì thế mẫu này được chế tạo rất chắc chắn.“", "tr": "„Tam da bu yüzden bu model çok sağlam yapılmıştır.“", "ar": "„لهذا السبب بالذات صُنع هذا الطراز متيناً جداً.“"}, "„Sie haben recht, allerdings müssen Sie diesen Mantel nie reinigen lassen.“": {"vi": "„Bạn nói đúng, tuy nhiên bạn không bao giờ phải giặt hấp chiếc áo khoác này.“", "tr": "„Haklısınız, ancak bu paltoyu hiç kuru temizlemeye vermeniz gerekmez.“", "ar": "„معك حق، ومع ذلك لن تضطرّي أبداً إلى تنظيف هذا المعطف جافاً.“"}, "„Was genau macht Sie noch unsicher?“": {"vi": "„Chính xác điều gì vẫn làm bạn chưa yên tâm?“", "tr": "„Sizi tam olarak hâlâ ne tereddüde düşürüyor?“", "ar": "„ما الذي يجعلك غير مطمئنة بعد بالضبط؟“"}, "„Zum Funkwecker brauchen Sie noch Batterien, damit er gleich läuft.“": {"vi": "„Với đồng hồ báo thức radio, bạn còn cần pin để nó chạy ngay.“", "tr": "„Radyo kontrollü çalar saat için ayrıca pil lazım, böylece hemen çalışır.“", "ar": "„للمنبّه اللاسلكي تحتاجين أيضاً إلى بطاريات ليعمل فوراً.“"}, "„Zu der Bohrmaschine passt dieser Satz Bohrer für Holz und Metall.“": {"vi": "„Bộ mũi khoan này dùng cho gỗ và kim loại rất hợp với chiếc máy khoan.“", "tr": "„Bu matkaba, ahşap ve metal için bu matkap ucu seti uyar.“", "ar": "„مع المثقاب تناسب هذه المجموعة من الرؤوس للخشب والمعدن.“"}, "„Passend zum Kleid haben wir diesen Gürtel.“": {"vi": "„Hợp với chiếc váy, chúng tôi có chiếc thắt lưng này.“", "tr": "„Elbiseye uygun olarak bu kemerimiz var.“", "ar": "„يناسب الفستان لدينا هذا الحزام.“"}, "„Darf ich Ihnen die Uhr als Geschenk einpacken?“": {"vi": "„Tôi gói chiếc đồng hồ này làm quà cho bạn nhé?“", "tr": "„Saati sizin için hediye paketi yapayım mı?“", "ar": "„هل أغلّف لك الساعة كهدية؟“"}, "„Sie haben eine gute Wahl getroffen. Wenn die Größe nicht passt, können Sie sie umtauschen.“": {"vi": "„Bạn đã chọn rất tốt. Nếu không vừa cỡ, bạn có thể đổi.“", "tr": "„Çok iyi bir seçim yaptınız. Beden uymazsa değiştirebilirsiniz.“", "ar": "„لقد أحسنتِ الاختيار. إن لم يناسبك المقاس يمكنك استبداله.“"}, "„Vielen Dank, Frau Kaya, und eine schöne Feier!“": {"vi": "„Cảm ơn chị Kaya rất nhiều, chúc chị có buổi tiệc vui vẻ!“", "tr": "„Çok teşekkürler Bayan Kaya, güzel bir kutlama dilerim!“", "ar": "„شكراً جزيلاً سيدة Kaya، واحتفال جميل!“"}, "„Diese Tasche ist leicht, hat ein Laptopfach und viele kleine Fächer – genau, wie Sie es wollten.“": {"vi": "„Chiếc túi này nhẹ, có ngăn đựng laptop và nhiều ngăn nhỏ – đúng như bạn muốn.“", "tr": "„Bu çanta hafif, dizüstü bilgisayar bölmesi ve birçok küçük gözü var – tam istediğiniz gibi.“", "ar": "„هذه الحقيبة خفيفة، وفيها جيب للابتوب وجيوب صغيرة كثيرة – تماماً كما أردتِ.“"}, "„Wofür möchten Sie den Staubsauger vor allem verwenden?“": {"vi": "„Chủ yếu bạn muốn dùng máy hút bụi vào việc gì?“", "tr": "„Elektrikli süpürgeyi esas olarak ne için kullanmak istiyorsunuz?“", "ar": "„لأيّ غرض تريدين استخدام المكنسة الكهربائية بشكل أساسي؟“"}, "„Spüren Sie einmal, wie weich der Stoff ist.“": {"vi": "„Bạn thử cảm nhận xem vải mềm thế nào.“", "tr": "„Bir dokunun, kumaş ne kadar yumuşak.“", "ar": "„المسي مرة كم هو ناعم القماش.“"}, "„Bei fünf Jahren Nutzung sind das nur etwa 5 Euro im Monat.“": {"vi": "„Dùng trong năm năm thì chỉ khoảng 5 euro mỗi tháng.“", "tr": "„Beş yıllık kullanımda bu ayda yalnızca yaklaşık 5 euro eder.“", "ar": "„على مدى خمس سنوات من الاستخدام لا يزيد هذا عن نحو 5 يورو شهرياً.“"}, "„Ja, das verstehe ich. Dafür bekommen Sie bei uns die Montage gleich dazu.“": {"vi": "„Vâng, tôi hiểu. Bù lại, bên chúng tôi lắp đặt luôn cho bạn.“", "tr": "„Evet, anlıyorum. Karşılığında bizde montaj da hemen dahildir.“", "ar": "„نعم، أفهم ذلك. في المقابل تحصلين لدينا على التركيب أيضاً.“"}, "„Diese Jacke führen wir nicht, aber diese hier hat dieselbe Membran.“": {"vi": "„Chúng tôi không bán chiếc áo khoác này, nhưng chiếc này có cùng lớp màng.“", "tr": "„Bu ceketi satmıyoruz, ama bunda aynı membran var.“", "ar": "„لا نبيع هذه السترة، لكن هذه تحتوي على نفس الغشاء.“"}, "„Guten Tag! Ich sehe, Sie interessieren sich für unsere Kaffeemaschinen.“": {"vi": "„Chào bạn! Tôi thấy bạn quan tâm đến máy pha cà phê của chúng tôi.“", "tr": "„İyi günler! Kahve makinelerimizle ilgilendiğinizi görüyorum.“", "ar": "„مرحباً! أرى أنّك مهتمة بآلات القهوة لدينا.“"}, "geschlossene Frage": {"vi": "câu hỏi đóng", "tr": "kapalı soru", "ar": "سؤال مغلق"}, "falsche Kontaktaufnahme (Begrüßung, Blickkontakt, Freiraum)": {"vi": "tiếp cận khách sai cách (chào hỏi, giao tiếp bằng mắt, khoảng trống)", "tr": "yanlış temas kurma (karşılama, göz teması, serbest alan)", "ar": "بدء تواصل خاطئ (التحية، التواصل البصري، ترك مساحة)"}, "abwertendes Wort oder Umgangssprache": {"vi": "từ hạ thấp hoặc văn nói", "tr": "küçümseyici sözcük veya günlük konuşma dili", "ar": "كلمة منتقِصة أو لغة عامّية"}, "Bedarf nicht ermittelt": {"vi": "chưa tìm hiểu nhu cầu", "tr": "ihtiyaç belirlenmedi", "ar": "لم تُحدَّد الحاجة"}, "nur Merkmal, kein Kundennutzen": {"vi": "chỉ nêu đặc điểm, không có lợi ích cho khách", "tr": "yalnızca özellik, müşteri yararı yok", "ar": "ذكر الخاصية فقط دون فائدة للزبون"}, "Fehler bei der Warenvorlage": {"vi": "lỗi khi trưng bày hàng", "tr": "mal sunumunda hata", "ar": "خطأ في عرض السلعة"}, "Preis ohne Nutzen genannt (Preisschock)": {"vi": "nêu giá không kèm lợi ích (sốc giá)", "tr": "yarar belirtilmeden fiyat söylendi (fiyat şoku)", "ar": "ذُكر السعر دون فائدة (صدمة السعر)"}, "Einwand nicht ernst genommen": {"vi": "không xem trọng ý kiến phản đối", "tr": "itiraz ciddiye alınmadı", "ar": "لم يُؤخذ الاعتراض على محمل الجد"}, "schlechtes Zusatz- oder Alternativangebot": {"vi": "đề xuất bổ sung hoặc thay thế kém", "tr": "kötü ek veya alternatif teklif", "ar": "عرض إضافي أو بديل سيئ"}, "Kaufsignal übersehen": {"vi": "bỏ lỡ tín hiệu mua hàng", "tr": "satın alma sinyali gözden kaçırıldı", "ar": "تجاهل إشارة الشراء"}, "keine Kaufbestätigung oder Verabschiedung": {"vi": "không xác nhận mua hàng hoặc không chào tạm biệt", "tr": "satın alma onayı veya vedalaşma yok", "ar": "لا تأكيد للشراء ولا توديع"}, "fehlende Warenkenntnis": {"vi": "thiếu hiểu biết về hàng hóa", "tr": "ürün bilgisi eksikliği", "ar": "نقص في معرفة السلع"}, "Schuhgeschäft": {"vi": "Cửa hàng giày", "tr": "Ayakkabı mağazası", "ar": "متجر أحذية"}, "Kann ich Ihnen helfen?": {"vi": "Tôi có thể giúp gì cho bạn không?", "tr": "Size yardımcı olabilir miyim?", "ar": "هل يمكنني مساعدتك؟"}, "Ja, ich suche Laufschuhe.": {"vi": "Vâng, tôi đang tìm giày chạy bộ.", "tr": "Evet, koşu ayakkabısı arıyorum.", "ar": "نعم، أبحث عن حذاء للجري."}, "Okay. Die hier sind gerade richtig billig.": {"vi": "Được. Mấy đôi này đang rẻ bèo luôn.", "tr": "Tamam. Bunlar şu an çok ucuz.", "ar": "حسناً. هذه رخيصة جداً الآن."}, "„Guten Tag, wie kann ich Ihnen helfen?“": {"vi": "„Chào bạn, tôi có thể giúp gì cho bạn?“", "tr": "„İyi günler, size nasıl yardımcı olabilirim?“", "ar": "„مرحباً، كيف يمكنني مساعدتك؟“"}, "„Kann ich Ihnen vielleicht helfen?“": {"vi": "„Có lẽ tôi có thể giúp bạn không?“", "tr": "„Belki size yardımcı olabilir miyim?“", "ar": "„ربما يمكنني مساعدتك؟“"}, "Immer noch geschlossen – die Antwort kann „Nein“ sein.": {"vi": "Vẫn là câu hỏi đóng – câu trả lời có thể là „Không“.", "tr": "Hâlâ kapalı – cevap „Hayır“ olabilir.", "ar": "ما زال مغلقاً – قد يكون الجواب „لا“."}, "„Was wollen Sie?“": {"vi": "„Bạn muốn gì?“", "tr": "„Ne istiyorsun?“", "ar": "„ماذا تريدين؟“"}, "Offen, aber unhöflich und ohne Gruß.": {"vi": "Câu hỏi mở, nhưng bất lịch sự và không có lời chào.", "tr": "Açık, ama kaba ve selamsız.", "ar": "سؤال مفتوح لكنه غير مهذّب ودون تحية."}, "„Diese Laufschuhe sind gerade im Angebot und besonders preisgünstig.“": {"vi": "„Những đôi giày chạy bộ này đang giảm giá và đặc biệt giá tốt.“", "tr": "„Bu koşu ayakkabıları şu an indirimde ve özellikle uygun fiyatlı.“", "ar": "„أحذية الجري هذه عليها عرض الآن وسعرها مناسب بشكل خاص.“"}, "„Die hier sind gerade spottbillig.“": {"vi": "„Mấy đôi này đang rẻ như cho.“", "tr": "„Bunlar şu an çok ucuz.“", "ar": "„هذه رخيصة جداً الآن.“"}, "„Spottbillig“ ist genauso abwertend.": {"vi": "„Rẻ như cho“ cũng mang nghĩa hạ thấp.", "tr": "„Çok ucuz“ da aynı şekilde küçümseyicidir.", "ar": "„رخيصة جداً“ منتقِصة أيضاً بنفس القدر."}, "„Die hier kauft eh jeder.“": {"vi": "„Mấy đôi này ai cũng mua mà.“", "tr": "„Bunları zaten herkes alıyor.“", "ar": "„هذه يشتريها الجميع على كل حال.“"}, "Kein Nutzen, kein Bezug zum Bedarf.": {"vi": "Không có lợi ích, không liên quan đến nhu cầu.", "tr": "Yarar yok, ihtiyaçla ilgisi yok.", "ar": "لا فائدة، ولا علاقة بالحاجة."}, "Was kostet der Fernseher?": {"vi": "Chiếc ti vi giá bao nhiêu?", "tr": "Televizyon ne kadar?", "ar": "كم سعر التلفزيون؟"}, "1.299 Euro.": {"vi": "1.299 euro.", "tr": "1.299 euro.", "ar": "1.299 يورو."}, "Oh, das ist aber teuer!": {"vi": "Ôi, đắt quá!", "tr": "Oh, bu çok pahalı!", "ar": "أوه، هذا غالٍ جداً!"}, "Gute Qualität hat eben ihren Preis.": {"vi": "Chất lượng tốt thì cũng có giá của nó.", "tr": "İyi kalitenin bir bedeli var.", "ar": "الجودة الجيدة لها ثمنها."}, "„Der Fernseher hat ein besonders helles Bild, er kostet 1.299 Euro – und Sie sehen damit auch bei Sonnenlicht alles gestochen scharf.“": {"vi": "„Chiếc ti vi này có hình ảnh đặc biệt sáng, giá 1.299 euro – và nhờ đó bạn thấy mọi thứ sắc nét ngay cả dưới ánh nắng.“", "tr": "„Bu televizyonun görüntüsü özellikle parlak, 1.299 euro – ve güneş ışığında bile her şeyi net görürsünüz.“", "ar": "„هذا التلفزيون له صورة ساطعة بشكل خاص، سعره 1.299 يورو – وبه ترين كل شيء بوضوح تام حتى في ضوء الشمس.“"}, "„Nur 1.299 Euro!“": {"vi": "„Chỉ 1.299 euro thôi!“", "tr": "„Sadece 1.299 euro!“", "ar": "„1.299 يورو فقط!“"}, "Immer noch ein nackter Preis.": {"vi": "Vẫn là một con số giá trần trụi.", "tr": "Hâlâ çıplak bir fiyat.", "ar": "ما زال سعراً مجرداً."}, "„Das wollen Sie gar nicht wissen.“": {"vi": "„Bạn không muốn biết đâu.“", "tr": "„Bunu bilmek istemezsiniz.“", "ar": "„لا تريدين أن تعرفي ذلك.“"}, "Ausweichend und unhöflich.": {"vi": "Lảng tránh và bất lịch sự.", "tr": "Kaçamak ve kaba.", "ar": "مراوغ وغير مهذّب."}, "Sandwich: „Der Fernseher hat …, er kostet 1.299 Euro – und Sie …“": {"vi": "Sandwich: „Chiếc ti vi có …, giá 1.299 euro – và bạn …“", "tr": "Sandviç: „Televizyonun …, 1.299 euro – ve siz …“", "ar": "الساندويتش: „التلفزيون له …، سعره 1.299 يورو – وأنتِ …“"}, "„Ja, da haben Sie recht. Dafür hat er fünf Jahre Garantie und wir liefern und schließen ihn kostenlos an.“": {"vi": "„Vâng, bạn nói đúng. Bù lại, nó được bảo hành năm năm và chúng tôi giao hàng, lắp đặt miễn phí.“", "tr": "„Evet, haklısınız. Karşılığında beş yıl garantisi var ve ücretsiz teslim edip bağlıyoruz.“", "ar": "„نعم، معك حق. في المقابل له ضمان خمس سنوات ونوصله ونركّبه مجاناً.“"}, "„Nein, teuer ist der nicht.“": {"vi": "„Không, nó đâu có đắt.“", "tr": "„Hayır, pahalı değil.“", "ar": "„لا، هو ليس غالياً.“"}, "Direkter Widerspruch.": {"vi": "Phản bác thẳng.", "tr": "Doğrudan itiraz.", "ar": "اعتراض مباشر."}, "„Dann kaufen Sie halt im Internet.“": {"vi": "„Vậy thì bạn cứ mua trên mạng đi.“", "tr": "„O zaman internetten alın.“", "ar": "„إذن اشتري عبر الإنترنت.“"}, "Damit ist die Kundin weg.": {"vi": "Thế là mất khách.", "tr": "Böylece müşteri kaybedilir.", "ar": "بذلك تضيع الزبونة."}, "Ja-Aber: „Ja, da haben Sie recht, dafür …“ (nach Winter 2024/25, Aufgabe 2.1)": {"vi": "Vâng-nhưng: „Vâng, bạn nói đúng, bù lại …“ (theo kỳ thi mùa đông 2024/25, bài 2.1)", "tr": "Evet-Ama: „Evet, haklısınız, karşılığında …“ (Kış 2024/25 sınavına göre, Soru 2.1)", "ar": "نعم-لكن: „نعم، معك حق، في المقابل …“ (وفق امتحان شتاء 2024/25، المهمة 2.1)"}, "(sortiert weiter ein, ohne aufzusehen) Hallo. Was wollen Sie?": {"vi": "(tiếp tục xếp hàng, không ngẩng lên) Chào. Bạn muốn gì?", "tr": "(başını kaldırmadan yerleştirmeye devam eder) Merhaba. Ne istiyorsun?", "ar": "(تواصل الترتيب دون أن ترفع رأسها) مرحباً. ماذا تريدين؟"}, "Ich brauche eine Bluse fürs Büro.": {"vi": "Tôi cần một chiếc áo blouse đi làm văn phòng.", "tr": "Ofis için bir bluz lazım.", "ar": "أحتاج بلوزة للمكتب."}, "(legt neun Blusen auf den Tisch) Suchen Sie sich was aus.": {"vi": "(đặt chín chiếc áo lên bàn) Bạn tự chọn đi.", "tr": "(dokuz bluzu masaya koyar) Kendiniz seçin.", "ar": "(تضع تسع بلوزات على الطاولة) اختاري بنفسك."}, "(aufblicken, lächeln) „Guten Tag! Wie kann ich Ihnen helfen?“": {"vi": "(ngẩng lên, mỉm cười) „Chào bạn! Tôi có thể giúp gì cho bạn?“", "tr": "(başını kaldırır, gülümser) „İyi günler! Size nasıl yardımcı olabilirim?“", "ar": "(ترفع رأسها وتبتسم) „مرحباً! كيف يمكنني مساعدتك؟“"}, "(weiter einräumen) „Guten Tag!“": {"vi": "(tiếp tục xếp hàng) „Chào bạn!“", "tr": "(yerleştirmeye devam eder) „İyi günler!“", "ar": "(تواصل الترتيب) „مرحباً!“"}, "Die Tätigkeit wird nicht unterbrochen, kein Blickkontakt.": {"vi": "Công việc không được dừng lại, không giao tiếp bằng mắt.", "tr": "İş kesilmiyor, göz teması yok.", "ar": "لا يُوقَف العمل، ولا تواصل بصري."}, "„Hallo, was brauchst du?“": {"vi": "„Chào, bạn cần gì?“", "tr": "„Selam, ne lazım?“", "ar": "„أهلاً، ماذا تحتاجين؟“"}, "Kundschaft wird gesiezt und situationsgerecht begrüßt.": {"vi": "Khách được xưng „Sie“ (Quý khách) và chào hỏi phù hợp tình huống.", "tr": "Müşteriye „Sie“ (Siz) denir ve duruma uygun karşılanır.", "ar": "يُخاطَب الزبائن بـ „Sie“ (حضرتكم) ويُحيَّون بما يناسب الموقف."}, "Tätigkeit abbrechen, Blickkontakt: „Guten Tag! Wie kann ich Ihnen helfen?“": {"vi": "Dừng việc đang làm, giao tiếp bằng mắt: „Chào bạn! Tôi có thể giúp gì cho bạn?“", "tr": "İşi bırakmak, göz teması: „İyi günler! Size nasıl yardımcı olabilirim?“", "ar": "التوقف عن العمل والتواصل البصري: „مرحباً! كيف يمكنني مساعدتك؟“"}, "(legt vier passende Blusen vor) „Diese Blusen sind bügelleicht – fühlen Sie einmal den Stoff.“": {"vi": "(đưa bốn chiếc áo phù hợp) „Những chiếc áo này dễ ủi – bạn sờ thử chất vải xem.“", "tr": "(dört uygun bluzu sunar) „Bu bluzlar ütü gerektirmez – kumaşa bir dokunun.“", "ar": "(تعرض أربع بلوزات مناسبة) „هذه البلوزات سهلة الكي – المسي القماش.“"}, "(legt zwölf Blusen vor) „Noch mehr Auswahl!“": {"vi": "(đưa mười hai chiếc áo) „Còn nhiều lựa chọn hơn nữa!“", "tr": "(on iki bluz sunar) „Daha da fazla seçenek!“", "ar": "(تعرض اثنتي عشرة بلوزة) „خيارات أكثر!“"}, "Noch mehr überfordert noch mehr.": {"vi": "Càng nhiều càng làm khách choáng ngợp hơn.", "tr": "Daha fazlası daha çok bunaltır.", "ar": "كلما زاد العدد زاد الإرهاق."}, "(legt eine Bluse vor) „Die oder keine.“": {"vi": "(đưa một chiếc áo) „Cái này hoặc không cái nào.“", "tr": "(bir bluz sunar) „Ya bu ya hiçbiri.“", "ar": "(تعرض بلوزة واحدة) „هذه أو لا شيء.“"}, "Bei nur einem Artikel gibt es keine Auswahl.": {"vi": "Chỉ một mặt hàng thì không có lựa chọn.", "tr": "Tek ürün varsa seçenek yoktur.", "ar": "مع سلعة واحدة فقط لا يوجد خيار."}, "3 bis 5 passende Artikel vorlegen und die Sinne ansprechen.": {"vi": "Đưa 3 đến 5 mặt hàng phù hợp và tác động đến các giác quan.", "tr": "3 ila 5 uygun ürün sunmak ve duyulara hitap etmek.", "ar": "عرض 3 إلى 5 سلع مناسبة ومخاطبة الحواس."}, "Drogerie": {"vi": "Cửa hàng mỹ phẩm, đồ gia dụng nhỏ", "tr": "Drogeri", "ar": "متجر مستحضرات العناية"}, "Ich suche ein Geschenk für meine Schwester.": {"vi": "Tôi đang tìm quà cho chị gái.", "tr": "Ablam için bir hediye arıyorum.", "ar": "أبحث عن هدية لأختي."}, "Wie viel wollen Sie ausgeben?": {"vi": "Bạn muốn chi bao nhiêu?", "tr": "Ne kadar harcamak istiyorsunuz?", "ar": "كم تريدين أن تنفقي؟"}, "(unsicher) Weiß ich noch nicht …": {"vi": "(lúng túng) Tôi chưa biết nữa …", "tr": "(emin değil) Henüz bilmiyorum …", "ar": "(غير متأكدة) لا أعرف بعد …"}, "Nehmen Sie das Duftset, das nimmt jeder.": {"vi": "Lấy bộ nước hoa này đi, ai cũng mua.", "tr": "Şu koku setini alın, herkes alıyor.", "ar": "خذي مجموعة العطور هذه، الجميع يأخذها."}, "„Was macht Ihre Schwester denn gern?“": {"vi": "„Chị gái bạn thích làm gì?“", "tr": "„Ablanız ne yapmaktan hoşlanır?“", "ar": "„ماذا تحب أختك أن تفعل؟“"}, "„Soll es teuer sein?“": {"vi": "„Nó có phải đắt không?“", "tr": "„Pahalı mı olsun?“", "ar": "„هل يجب أن يكون غالياً؟“"}, "Geschlossen und wieder nur der Preis.": {"vi": "Câu hỏi đóng và lại chỉ về giá.", "tr": "Kapalı ve yine sadece fiyat.", "ar": "مغلق ومرة أخرى عن السعر فقط."}, "„Haben Sie eine Idee?“": {"vi": "„Bạn có ý tưởng nào không?“", "tr": "„Aklınızda bir fikir var mı?“", "ar": "„هل لديك فكرة؟“"}, "„Was macht Ihre Schwester gern?“ – „Zu welchem Anlass soll das Geschenk sein?“": {"vi": "„Chị gái bạn thích làm gì?“ – „Món quà này nhân dịp gì?“", "tr": "„Ablanız ne yapmaktan hoşlanır?“ – „Hediye hangi vesileyle?“", "ar": "„ماذا تحب أختك أن تفعل؟“ – „بأيّ مناسبة ستكون الهدية؟“"}, "„Dieses Duftset ist mild und hautfreundlich – damit kann sich Ihre Schwester nach einem langen Tag richtig entspannen.“": {"vi": "„Bộ nước hoa này dịu nhẹ và thân thiện với da – chị gái bạn có thể thật sự thư giãn sau một ngày dài.“", "tr": "„Bu koku seti yumuşak ve cildi dostu – ablanız uzun bir günün ardından gerçekten rahatlayabilir.“", "ar": "„مجموعة العطور هذه لطيفة وصديقة للبشرة – تستطيع أختك الاسترخاء حقاً بعد يوم طويل.“"}, "„Das Duftset hat drei Teile.“": {"vi": "„Bộ nước hoa có ba món.“", "tr": "„Koku setinin üç parçası var.“", "ar": "„مجموعة العطور فيها ثلاث قطع.“"}, "Nur ein Merkmal, kein Nutzen.": {"vi": "Chỉ có một đặc điểm, không có lợi ích.", "tr": "Sadece bir özellik, yarar yok.", "ar": "خاصية واحدة فقط دون فائدة."}, "„Das ist gerade im Trend.“": {"vi": "„Cái này đang là xu hướng.“", "tr": "„Bu şu an trend.“", "ar": "„هذا رائج حالياً.“"}, "Kein Bezug zur Schwester.": {"vi": "Không liên quan đến người chị.", "tr": "Ablayla ilgisi yok.", "ar": "لا علاقة بالأخت."}, "Merkmal – Vorteil – Nutzen, passend zum Bedarf.": {"vi": "Đặc điểm – ưu điểm – lợi ích, phù hợp với nhu cầu.", "tr": "Özellik – avantaj – yarar, ihtiyaca uygun.", "ar": "الخاصية – الميزة – الفائدة، بما يناسب الحاجة."}, "Fotoabteilung": {"vi": "Khu máy ảnh", "tr": "Fotoğraf bölümü", "ar": "قسم التصوير"}, "Diese Kamera hat 24 Megapixel und einen APS-C-Sensor.": {"vi": "Máy ảnh này có 24 megapixel và cảm biến APS-C.", "tr": "Bu kameranın 24 megapiksel ve APS-C sensörü var.", "ar": "هذه الكاميرا بدقة 24 ميغابكسل وحسّاس APS-C."}, "(nickt, holt die Geldbörse heraus) Kann ich auch mit Karte zahlen?": {"vi": "(gật đầu, lấy ví ra) Tôi trả bằng thẻ được không?", "tr": "(başını sallar, cüzdanını çıkarır) Kartla da ödeyebilir miyim?", "ar": "(تومئ برأسها وتُخرج محفظتها) هل يمكنني الدفع بالبطاقة؟"}, "Moment, ich erzähle Ihnen noch etwas über den Autofokus …": {"vi": "Khoan, tôi còn muốn kể thêm về chức năng lấy nét tự động …", "tr": "Bir dakika, size bir de otomatik odaklama hakkında bir şey anlatayım …", "ar": "لحظة، سأخبرك أيضاً شيئاً عن التركيز التلقائي …"}, "„Mit 24 Megapixeln können Sie Ihre Urlaubsfotos sogar als großes Poster drucken.“": {"vi": "„Với 24 megapixel, bạn có thể in ảnh du lịch thành áp phích lớn.“", "tr": "„24 megapikselle tatil fotoğraflarınızı büyük bir poster olarak bile basabilirsiniz.“", "ar": "„بدقة 24 ميغابكسل يمكنك طباعة صور إجازتك حتى كملصق كبير.“"}, "„Die Kamera hat auch noch WLAN.“": {"vi": "„Máy ảnh còn có cả WLAN nữa.“", "tr": "„Kamerada ayrıca WLAN da var.“", "ar": "„الكاميرا فيها أيضاً واي فاي.“"}, "Noch ein Merkmal ohne Nutzen.": {"vi": "Lại một đặc điểm không có lợi ích.", "tr": "Yine yararsız bir özellik.", "ar": "خاصية أخرى دون فائدة."}, "„Die ist technisch top.“": {"vi": "„Về kỹ thuật thì nó hàng đầu.“", "tr": "„Teknik olarak üst düzey.“", "ar": "„من الناحية التقنية هي الأفضل.“"}, "Kein Merkmal und kein Nutzen.": {"vi": "Không có đặc điểm cũng không có lợi ích.", "tr": "Ne özellik ne yarar var.", "ar": "لا خاصية ولا فائدة."}, "Merkmal plus Kundennutzen.": {"vi": "Đặc điểm cộng với lợi ích cho khách.", "tr": "Özellik artı müşteri yararı.", "ar": "الخاصية مع فائدة للزبون."}, "„Selbstverständlich! Da haben Sie eine gute Wahl getroffen. Ich begleite Sie zur Kasse.“": {"vi": "„Dĩ nhiên rồi! Bạn đã chọn rất tốt. Tôi đưa bạn ra quầy thu ngân.“", "tr": "„Tabii ki! Çok iyi bir seçim yaptınız. Sizi kasaya götüreyim.“", "ar": "„بالتأكيد! لقد أحسنت الاختيار. سأرافقك إلى الصندوق.“"}, "„Gleich, erst noch die technischen Daten.“": {"vi": "„Chờ chút, còn thông số kỹ thuật nữa.“", "tr": "„Hemen, önce teknik veriler.“", "ar": "„حالاً، بعد البيانات التقنية.“"}, "Das Kaufsignal wird wieder übersehen.": {"vi": "Tín hiệu mua hàng lại bị bỏ lỡ.", "tr": "Satın alma sinyali yine gözden kaçırıldı.", "ar": "إشارة الشراء تُتجاهَل مرة أخرى."}, "„Wollen Sie wirklich?“": {"vi": "„Bạn có thật sự muốn không?“", "tr": "„Gerçekten istiyor musunuz?“", "ar": "„هل تريد حقاً؟“"}, "Sät Zweifel statt die Entscheidung zu bestärken.": {"vi": "Gieo nghi ngờ thay vì củng cố quyết định.", "tr": "Kararı pekiştirmek yerine şüphe tohumu eker.", "ar": "يزرع الشك بدل تعزيز القرار."}, "Kaufsignal erkennen, Entscheidung bestätigen, zur Kasse begleiten.": {"vi": "Nhận ra tín hiệu mua hàng, xác nhận quyết định, đưa khách ra quầy thu ngân.", "tr": "Satın alma sinyalini fark etmek, kararı onaylamak, müşteriyi kasaya götürmek.", "ar": "التقاط إشارة الشراء وتأكيد القرار ومرافقة الزبون إلى الصندوق."}, "Spielwarenabteilung": {"vi": "Khu đồ chơi", "tr": "Oyuncak bölümü", "ar": "قسم الألعاب"}, "Gut, ich nehme das ferngesteuerte Auto für meinen Enkel.": {"vi": "Được, tôi lấy chiếc xe điều khiển từ xa cho cháu trai.", "tr": "Tamam, torunum için uzaktan kumandalı arabayı alıyorum.", "ar": "حسناً، آخذ سيارة التحكم عن بُعد لحفيدي."}, "Brauchen Sie sonst noch was?": {"vi": "Bạn còn cần gì nữa không?", "tr": "Başka bir şeye ihtiyacınız var mı?", "ar": "هل تحتاجين شيئاً آخر؟"}, "Nein, danke.": {"vi": "Không, cảm ơn.", "tr": "Hayır, teşekkürler.", "ar": "لا، شكراً."}, "„Dazu brauchen Sie noch Batterien – dann kann Ihr Enkel gleich losfahren.“": {"vi": "„Cho nó, bạn còn cần pin – để cháu bạn chạy được ngay.“", "tr": "„Bunun için bir de pil lazım – torununuz hemen sürmeye başlayabilir.“", "ar": "„لهذه تحتاجين أيضاً إلى بطاريات – ليتمكن حفيدك من تشغيلها فوراً.“"}, "„Sonst noch was?“": {"vi": "„Còn gì nữa không?“", "tr": "„Başka bir şey?“", "ar": "„هل من شيء آخر؟“"}, "Geschlossen und negativ.": {"vi": "Câu hỏi đóng và tiêu cực.", "tr": "Kapalı ve olumsuz.", "ar": "مغلق وسلبي."}, "„Wir haben auch noch Puppen.“": {"vi": "„Chúng tôi còn có búp bê nữa.“", "tr": "„Bizde bir de bebekler var.“", "ar": "„لدينا أيضاً دمى.“"}, "Kein Bezug zum Hauptartikel.": {"vi": "Không liên quan đến mặt hàng chính.", "tr": "Ana ürünle ilgisi yok.", "ar": "لا علاقة بالسلعة الرئيسية."}, "Ergänzungsangebot mit Nutzen: „Dazu brauchen Sie noch …“": {"vi": "Đề xuất bổ sung kèm lợi ích: „Cho nó, bạn còn cần …“", "tr": "Yararlı tamamlayıcı teklif: „Bunun için bir de … lazım“", "ar": "عرض مكمّل مع ذكر الفائدة: „لهذه تحتاجين أيضاً …“"}, "Haushaltswaren": {"vi": "Đồ gia dụng", "tr": "Ev eşyaları", "ar": "أدوات منزلية"}, "Haben Sie die Kaffeemaschine „Crema 300“?": {"vi": "Bạn có máy pha cà phê „Crema 300“ không?", "tr": "„Crema 300“ kahve makineniz var mı?", "ar": "هل لديكم آلة القهوة „Crema 300“؟"}, "Nee. Höchstens die hier, aber keine Ahnung, ob die was taugt.": {"vi": "Không. Chỉ có cái này thôi, mà không biết có tốt không.", "tr": "Yok. En fazla şu var, ama işe yarar mı bilmiyorum.", "ar": "لا. على الأكثر هذه، لكن لا أدري إن كانت جيدة."}, "„Dieses Modell führen wir leider nicht. Diese Maschine hat aber den gleichen Mahlgrad und ist leiser. Möchten Sie einen Kaffee probieren?“": {"vi": "„Rất tiếc chúng tôi không bán mẫu này. Nhưng chiếc máy này có độ xay như vậy và êm hơn. Bạn có muốn thử một tách cà phê không?“", "tr": "„Maalesef bu modeli satmıyoruz. Ama bu makinenin öğütme derecesi aynı ve daha sessiz. Bir kahve denemek ister misiniz?“", "ar": "„للأسف لا نبيع هذا الطراز. لكن هذه الآلة لها نفس درجة الطحن وهي أهدأ. هل تودّين تجربة قهوة؟“"}, "„Nein, haben wir nicht.“": {"vi": "„Không, chúng tôi không có.“", "tr": "„Hayır, bizde yok.“", "ar": "„لا، ليس لدينا.“"}, "Kein Angebot, Gespräch zu Ende.": {"vi": "Không có đề nghị, cuộc trò chuyện kết thúc.", "tr": "Teklif yok, konuşma biter.", "ar": "لا عرض، وتنتهي المحادثة."}, "„Die hier ist halt ähnlich.“": {"vi": "„Cái này thì cũng na ná thôi.“", "tr": "„Bu da işte benzer.“", "ar": "„هذه مشابهة وخلاص.“"}, "Wenig überzeugend, kein Nutzen.": {"vi": "Thiếu thuyết phục, không có lợi ích.", "tr": "Pek ikna edici değil, yarar yok.", "ar": "غير مقنع، ولا فائدة."}, "Alternativangebot mit gleichem Standard und Nutzen.": {"vi": "Đề xuất thay thế cùng tiêu chuẩn và lợi ích.", "tr": "Aynı standart ve yararda alternatif teklif.", "ar": "عرض بديل بنفس المستوى والفائدة."}, "Käsetheke": {"vi": "Quầy phô mai", "tr": "Peynir tezgâhı", "ar": "ركن الأجبان"}, "Guten Tag, was darf es sein?": {"vi": "Chào bạn, bạn muốn gì ạ?", "tr": "İyi günler, ne arzu edersiniz?", "ar": "مرحباً، ماذا تريدين؟"}, "Ist der Gouda hier mild?": {"vi": "Phô mai Gouda này có nhẹ vị không?", "tr": "Buradaki Gouda hafif mi?", "ar": "هل جبنة الغودا هذه خفيفة الطعم؟"}, "Keine Ahnung, ich bin neu.": {"vi": "Tôi không biết, tôi mới vào làm.", "tr": "Bilmiyorum, yeniyim.", "ar": "لا أدري، أنا جديد هنا."}, "„Ja, das ist ein junger Gouda, sehr mild. Möchten Sie ein Stück probieren?“": {"vi": "„Vâng, đây là Gouda trẻ, vị rất nhẹ. Bạn có muốn nếm thử một miếng không?“", "tr": "„Evet, bu genç bir Gouda, çok hafif. Bir parça denemek ister misiniz?“", "ar": "„نعم، هذه غودا فتية، طعمها خفيف جداً. هل تودّين تذوّق قطعة؟“"}, "„Steht doch auf dem Schild.“": {"vi": "„Có ghi trên bảng mà.“", "tr": "„Tabelada yazıyor ya.“", "ar": "„مكتوب على اللافتة.“"}, "„Weiß nicht, probieren Sie halt.“": {"vi": "„Không biết, bạn cứ nếm thử đi.“", "tr": "„Bilmem, bir deneyin işte.“", "ar": "„لا أعرف، جرّبي وخلاص.“"}, "Unsicher und umgangssprachlich.": {"vi": "Thiếu chắc chắn và dùng văn nói.", "tr": "Emin değil ve günlük konuşma dili.", "ar": "غير واثق وبلغة عامّية."}, "Warenkenntnisse schaffen Vertrauen. Wenn man etwas nicht weiß: „Ich frage gern meine Kollegin.“": {"vi": "Hiểu biết về hàng hóa tạo niềm tin. Khi không biết: „Tôi sẵn lòng hỏi đồng nghiệp.“", "tr": "Ürün bilgisi güven yaratır. Bilmiyorsanız: „Meslektaşıma memnuniyetle sorarım.“", "ar": "معرفة السلع تخلق الثقة. وعندما لا تعرف: „يسعدني أن أسأل زميلتي.“"}, "Sportgeschäft": {"vi": "Cửa hàng thể thao", "tr": "Spor mağazası", "ar": "متجر رياضة"}, "Der Rucksack ist mir zu teuer.": {"vi": "Chiếc ba lô này đắt quá với tôi.", "tr": "Bu sırt çantası bana çok pahalı.", "ar": "هذه الحقيبة غالية جداً عليّ."}, "Nein, der ist gar nicht teuer, der ist günstig!": {"vi": "Không, nó không đắt chút nào, nó rẻ mà!", "tr": "Hayır, hiç pahalı değil, ucuz!", "ar": "لا، هي ليست غالية أبداً، هي رخيصة!"}, "„Ja, das verstehe ich. Dafür ist er wasserdicht und hat eine Rückenpolsterung, die auch auf langen Touren bequem bleibt.“": {"vi": "„Vâng, tôi hiểu. Bù lại, nó chống thấm nước và có đệm lưng luôn thoải mái cả trong những chuyến đi dài.“", "tr": "„Evet, anlıyorum. Karşılığında su geçirmez ve uzun turlarda bile rahat kalan sırt dolgusu var.“", "ar": "„نعم، أفهم ذلك. في المقابل هي مقاومة للماء ولها حشوة ظهر تبقى مريحة حتى في الرحلات الطويلة.“"}, "„Doch, der ist günstig, glauben Sie mir.“": {"vi": "„Có chứ, nó rẻ mà, tin tôi đi.“", "tr": "„Aksine, ucuz, inanın bana.“", "ar": "„بل هي رخيصة، صدّقيني.“"}, "Immer noch Widerspruch.": {"vi": "Vẫn là phản bác.", "tr": "Hâlâ itiraz.", "ar": "ما زال اعتراضاً."}, "„Dann eben nicht.“": {"vi": "„Vậy thì thôi.“", "tr": "„O zaman olmasın.“", "ar": "„إذن لا بأس.“"}, "Der Einwand wird gar nicht behandelt.": {"vi": "Ý kiến phản đối hoàn toàn không được giải quyết.", "tr": "İtiraz hiç ele alınmıyor.", "ar": "لا يُعالَج الاعتراض إطلاقاً."}, "Ja-Aber-Methode: erst zustimmen, dann Nutzen.": {"vi": "Phương pháp Vâng-nhưng: đồng ý trước, rồi nêu lợi ích.", "tr": "Evet-Ama yöntemi: önce katıl, sonra yarar.", "ar": "طريقة نعم-لكن: وافق أولاً ثم اذكر الفائدة."}, "Im Internet habe ich die Jacke 20 Euro billiger gesehen.": {"vi": "Trên mạng tôi thấy chiếc áo khoác này rẻ hơn 20 euro.", "tr": "İnternette bu ceketi 20 euro daha ucuza gördüm.", "ar": "رأيت هذه السترة على الإنترنت بسعر أرخص بـ 20 يورو."}, "Das kann nicht sein.": {"vi": "Không thể nào.", "tr": "Bu olamaz.", "ar": "هذا غير ممكن."}, "„Darf ich fragen, wo genau? Dann schaue ich gern, ob es dasselbe Modell ist.“": {"vi": "„Cho phép tôi hỏi cụ thể ở đâu không ạ? Tôi sẵn lòng xem có phải cùng mẫu không.“", "tr": "„Tam olarak nerede olduğunu sorabilir miyim? O zaman aynı model olup olmadığına memnuniyetle bakarım.“", "ar": "„هل لي أن أسأل أين بالضبط؟ عندها أتحقق بكل سرور إن كان نفس الطراز.“"}, "„Dann kaufen Sie sie doch dort.“": {"vi": "„Vậy bạn cứ mua ở đó đi.“", "tr": "„O zaman oradan alın.“", "ar": "„إذن اشتريها من هناك.“"}, "„Im Internet lügen alle.“": {"vi": "„Trên mạng ai cũng nói dối.“", "tr": "„İnternette herkes yalan söylüyor.“", "ar": "„على الإنترنت الجميع يكذبون.“"}, "Unsachlich und nicht belegt.": {"vi": "Thiếu khách quan và không có bằng chứng.", "tr": "Nesnel değil ve kanıtsız.", "ar": "غير موضوعي وبلا دليل."}, "Nähere Angaben erbitten und prüfen, ob es der gleiche Artikel ist.": {"vi": "Hỏi thêm thông tin và kiểm tra xem có phải cùng một mặt hàng không.", "tr": "Ayrıntı istemek ve aynı ürün olup olmadığını kontrol etmek.", "ar": "طلب تفاصيل والتحقق مما إذا كانت نفس السلعة."}, "Kasse im Supermarkt": {"vi": "Quầy thu ngân siêu thị", "tr": "Süpermarket kasası", "ar": "صندوق السوبرماركت"}, "(ohne aufzusehen) Der Nächste!": {"vi": "(không ngẩng lên) Người tiếp theo!", "tr": "(başını kaldırmadan) Sıradaki!", "ar": "(دون أن ترفع رأسها) التالي!"}, "Guten Tag.": {"vi": "Chào bạn.", "tr": "İyi günler.", "ar": "مرحباً."}, "(schiebt den Bon hin) 23,40. … Tschüss.": {"vi": "(đẩy hóa đơn qua) 23,40. … Tạm biệt.", "tr": "(fişi iter) 23,40. … Hoşça kal.", "ar": "(تدفع الإيصال) 23,40. … مع السلامة."}, "(aufsehen, lächeln) „Guten Tag!“": {"vi": "(ngẩng lên, mỉm cười) „Chào bạn!“", "tr": "(başını kaldırır, gülümser) „İyi günler!“", "ar": "(ترفع رأسها وتبتسم) „مرحباً!“"}, "„Weiter geht’s!“": {"vi": "„Tiếp tục nào!“", "tr": "„Devam!“", "ar": "„هيا بنا!“"}, "Keine Begrüßung.": {"vi": "Không chào hỏi.", "tr": "Karşılama yok.", "ar": "لا تحية."}, "„Nächster, bitte.“": {"vi": "„Người tiếp theo, mời.“", "tr": "„Sıradaki, lütfen.“", "ar": "„التالي، من فضلكم.“"}, "Immer noch ohne Gruß und Blickkontakt.": {"vi": "Vẫn không chào và không giao tiếp bằng mắt.", "tr": "Hâlâ selamsız ve göz teması yok.", "ar": "ما زال دون تحية ودون تواصل بصري."}, "Spätestens an der Kasse findet der erste Kontakt statt – mit Blickkontakt und Gruß.": {"vi": "Chậm nhất thì cuộc tiếp xúc đầu tiên diễn ra ở quầy thu ngân – với giao tiếp bằng mắt và lời chào.", "tr": "En geç kasada ilk temas gerçekleşir – göz teması ve selamla.", "ar": "على أبعد تقدير يحدث أول تواصل عند الصندوق – بالتواصل البصري والتحية."}, "„Vielen Dank für Ihren Einkauf und einen schönen Tag noch!“": {"vi": "„Cảm ơn bạn đã mua sắm, chúc bạn một ngày tốt lành!“", "tr": "„Alışverişiniz için çok teşekkürler, güzel bir gün dilerim!“", "ar": "„شكراً جزيلاً على التسوّق، ويوم جميل!“"}, "„Ciao.“": {"vi": "„Ciao.“", "tr": "„Ciao.“", "ar": "„Ciao.“"}, "„Bon brauchen Sie ja nicht.“": {"vi": "„Hóa đơn thì bạn đâu cần.“", "tr": "„Fişe ihtiyacınız yok zaten.“", "ar": "„الإيصال لا تحتاجينه على كل حال.“"}, "Kein Dank, kein Gruß.": {"vi": "Không cảm ơn, không chào.", "tr": "Teşekkür yok, selam yok.", "ar": "لا شكر ولا تحية."}, "„Vielen Dank und einen schönen Tag noch!“": {"vi": "„Cảm ơn bạn và chúc một ngày tốt lành!“", "tr": "„Teşekkürler ve güzel bir gün dilerim!“", "ar": "„شكراً لك ويوم جميل!“"}, "Und was kostet die Waschmaschine?": {"vi": "Còn máy giặt giá bao nhiêu?", "tr": "Peki çamaşır makinesi ne kadar?", "ar": "وكم سعر الغسّالة؟"}, "Die ist leider ziemlich teuer: 899 Euro.": {"vi": "Tiếc là khá đắt: 899 euro.", "tr": "Maalesef oldukça pahalı: 899 euro.", "ar": "للأسف غالية نوعاً ما: 899 يورو."}, "„Die Waschmaschine spart viel Wasser und Strom, sie kostet 899 Euro – und mit dem Kurzprogramm ist Ihre Wäsche in 30 Minuten fertig.“": {"vi": "„Máy giặt tiết kiệm nhiều nước và điện, giá 899 euro – và với chương trình giặt nhanh, đồ của bạn xong trong 30 phút.“", "tr": "„Çamaşır makinesi çok su ve elektrik tasarrufu sağlar, 899 euro – ve kısa programla çamaşırınız 30 dakikada hazır olur.“", "ar": "„الغسّالة توفّر الكثير من الماء والكهرباء، سعرها 899 يورو – وببرنامج الغسيل السريع تصبح ملابسك جاهزة في 30 دقيقة.“"}, "„899 Euro, aber das ist es wert.“": {"vi": "„899 euro, nhưng đáng giá.“", "tr": "„899 euro, ama buna değer.“", "ar": "„899 يورو، لكنها تستحق.“"}, "Fast nackt – es fehlt der konkrete Nutzen.": {"vi": "Gần như giá trần trụi – thiếu lợi ích cụ thể.", "tr": "Neredeyse çıplak fiyat – somut yarar eksik.", "ar": "يكاد يكون سعراً مجرداً – تنقصه فائدة محددة."}, "„Fragen Sie lieber nicht.“": {"vi": "„Đừng hỏi thì hơn.“", "tr": "„Hiç sormasanız daha iyi.“", "ar": "„الأفضل ألا تسألي.“"}, "Damit kündigst du den Preisschock an.": {"vi": "Như vậy bạn tự báo trước cú sốc giá.", "tr": "Böylece fiyat şokunu kendin ilan etmiş olursun.", "ar": "بذلك تُعلن بنفسك عن صدمة السعر."}, "Sandwich: Nutzen – Preis – Nutzen; nie selbst „teuer“ sagen.": {"vi": "Sandwich: lợi ích – giá – lợi ích; không bao giờ tự nói „đắt“.", "tr": "Sandviç: yarar – fiyat – yarar; asla kendin „pahalı“ deme.", "ar": "الساندويتش: فائدة – سعر – فائدة؛ لا تقل بنفسك أبداً „غالٍ“."}, "Uhrenabteilung": {"vi": "Khu đồng hồ", "tr": "Saat bölümü", "ar": "قسم الساعات"}, "Ich weiß nicht, welche ich nehmen soll.": {"vi": "Tôi không biết nên chọn cái nào.", "tr": "Hangisini alacağıma karar veremiyorum.", "ar": "لا أعرف أيّها أختار."}, "(holt fünf weitere Uhren) Dann schauen Sie sich noch die hier an.": {"vi": "(lấy thêm năm chiếc đồng hồ) Vậy bạn xem thêm mấy chiếc này.", "tr": "(beş saat daha getirir) O zaman şunlara da bakın.", "ar": "(تُحضر خمس ساعات أخرى) إذن انظري إلى هذه أيضاً."}, "„Welche zwei haben Ihnen am besten gefallen? Dann vergleichen wir nur noch diese beiden.“": {"vi": "„Hai chiếc nào bạn thích nhất? Vậy ta chỉ so sánh hai chiếc đó thôi.“", "tr": "„En çok hangi ikisini beğendiniz? O zaman sadece bu ikisini karşılaştıralım.“", "ar": "„أيّ ساعتين أعجبتاك أكثر؟ عندها نقارن بين هاتين فقط.“"}, "„Nehmen Sie einfach irgendeine.“": {"vi": "„Bạn cứ lấy đại một chiếc đi.“", "tr": "„H
