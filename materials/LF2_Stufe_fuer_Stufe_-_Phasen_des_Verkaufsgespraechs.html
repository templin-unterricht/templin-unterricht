ạn khá nhiều. Trước khi lấy hàng: bạn đảm bảo thế nào rằng mình đã hiểu đúng mọi thứ?", "tr": "{0} size epey şey anlattı. Ürünü getirmeden önce: Her şeyi doğru anladığınızdan nasıl emin olursunuz?", "ar": "روى لك {0} الكثير. قبل أن تُحضر البضاعة: كيف تتأكد أنك فهمت كل شيء جيدًا؟"}, "Den Bedarf mit einer Kontrollfrage kurz zusammenfassen": {"vi": "Tóm tắt ngắn nhu cầu bằng một câu hỏi kiểm tra", "tr": "İhtiyacı bir kontrol sorusuyla kısaca özetlemek", "ar": "تلخيص الحاجة بإيجاز بسؤال تحقق"}, "„Sie suchen also … – trifft das zu?“": {"vi": "„Vậy là bà đang tìm … – đúng không ạ?“", "tr": "„Yani … arıyorsunuz – doğru mu?“", "ar": "„إذن أنتِ تبحثين عن … – هل هذا صحيح؟“"}, "Ja, genau so! Sie haben gut zugehört.": {"vi": "Vâng, đúng thế! Cô đã lắng nghe rất tốt.", "tr": "Evet, aynen öyle! İyi dinlediniz.", "ar": "نعم، بالضبط! لقد أصغيتِ جيدًا."}, "Mit der Kontrollfrage prüfst du, ob du den Bedarf richtig verstanden hast. Die Kundschaft fühlt sich verstanden.": {"vi": "Bằng câu hỏi kiểm tra bạn xác nhận mình hiểu đúng nhu cầu. Khách cảm thấy được thấu hiểu.", "tr": "Kontrol sorusuyla ihtiyacı doğru anlayıp anlamadığınızı sınarsınız. Müşteri anlaşıldığını hisseder.", "ar": "بسؤال التحقق تتأكد من أنك فهمت الحاجة جيدًا. وتشعر الزبونة بأنها مفهومة."}, "Noch zehn weitere Fragen stellen, damit nichts fehlt": {"vi": "Hỏi thêm mười câu nữa để không thiếu gì", "tr": "Hiçbir şey eksik kalmasın diye on soru daha sormak", "ar": "طرح عشرة أسئلة أخرى حتى لا ينقص شيء"}, "(seufzt) Das hab ich doch schon gesagt …": {"vi": "(thở dài) Tôi đã nói rồi mà …", "tr": "(iç çekiyor) Bunu zaten söyledim …", "ar": "(تتنهد) لقد قلت هذا بالفعل …"}, "Ich hab wirklich keine Zeit für so viele Fragen!": {"vi": "Tôi thật sự không có thời gian cho nhiều câu hỏi thế!", "tr": "Bu kadar çok soruya gerçekten vaktim yok!", "ar": "ليس لدي وقت حقًا لكل هذه الأسئلة!"}, "Zu viele Fragen wirken wie ein Verhör. Lieber kurz zusammenfassen und bestätigen lassen.": {"vi": "Quá nhiều câu hỏi giống như thẩm vấn. Tốt hơn là tóm tắt ngắn và để khách xác nhận.", "tr": "Çok fazla soru sorgu gibi durur. Daha iyisi kısaca özetleyip onaylatmak.", "ar": "كثرة الأسئلة تشبه الاستجواب. الأفضل التلخيص بإيجاز وترك الزبون يؤكد."}, "Gar nichts sagen und einfach irgendein Modell holen": {"vi": "Không nói gì và lấy đại một mẫu", "tr": "Hiçbir şey söylememek ve rastgele bir model getirmek", "ar": "عدم قول شيء وإحضار أي طراز"}, "Wird schon passen.": {"vi": "Rồi sẽ hợp thôi.", "tr": "Nasılsa uyar.", "ar": "سيناسب على الأرجح."}, "Hm, das ist aber nicht das, was ich meinte.": {"vi": "Hm, nhưng đó không phải điều tôi muốn nói.", "tr": "Hm, ama bu benim kastettiğim şey değil.", "ar": "همم، لكن هذا ليس ما قصدته."}, "Ohne Abgleich triffst du den Bedarf oft nicht – das kostet Zeit und Vertrauen.": {"vi": "Không đối chiếu thì bạn thường không đúng nhu cầu – tốn thời gian và niềm tin.", "tr": "Karşılaştırmadan ihtiyaca çoğu zaman isabet edemezsiniz – bu zaman ve güven kaybettirir.", "ar": "بدون مطابقة غالبًا لا تُصيب الحاجة – وهذا يكلّف وقتًا وثقة."}, "Bau eine Kontrollfrage.": {"vi": "Hãy xây dựng một câu hỏi kiểm tra.", "tr": "Bir kontrol sorusu oluşturun.", "ar": "ابنِ سؤال تحقق."}, "Sie suchen also": {"vi": "Vậy là bà đang tìm", "tr": "Yani şunu arıyorsunuz", "ar": "إذن أنتِ تبحثين عن"}, "Also, Sie wollen halt": {"vi": "Tức là, bà muốn thế thôi", "tr": "Yani, siz işte şunu istiyorsunuz", "ar": "يعني، أنتِ تريدين فقط"}, "Umgangssprachlich („halt“).": {"vi": "Văn nói („halt“).", "tr": "Konuşma dili („halt“).", "ar": "لغة عامية („halt“)."}, "irgendwas Schönes": {"vi": "cái gì đó đẹp đẹp", "tr": "güzel bir şey", "ar": "أي شيء جميل"}, "Zu ungenau – eine Kontrollfrage fasst den Bedarf genau zusammen.": {"vi": "Quá mơ hồ – câu hỏi kiểm tra tóm tắt nhu cầu thật chính xác.", "tr": "Çok belirsiz – kontrol sorusu ihtiyacı tam olarak özetler.", "ar": "غير دقيق – سؤال التحقق يلخّص الحاجة بدقة."}, "Rückfrage": {"vi": "Hỏi lại", "tr": "Geri soru", "ar": "السؤال الراجع"}, "– trifft das zu?": {"vi": "– đúng không ạ?", "tr": "– doğru mu?", "ar": "– هل هذا صحيح؟"}, "– hab ich eh richtig verstanden.": {"vi": "– tôi hiểu đúng rồi mà.", "tr": "– zaten doğru anlamıştım.", "ar": "– لقد فهمت جيدًا على أي حال."}, "Das ist keine Frage mehr. Die Kundin soll bestätigen können.": {"vi": "Đây không còn là câu hỏi. Khách phải có thể xác nhận.", "tr": "Bu artık bir soru değil. Müşteri onaylayabilmeli.", "ar": "هذا لم يعد سؤالًا. يجب أن تستطيع الزبونة التأكيد."}, "Fassen Sie den Bedarf von {0} in einer Kontrollfrage in wörtlicher Rede zusammen!": {"vi": "Hãy tóm tắt nhu cầu của {0} thành một câu hỏi kiểm tra bằng lời nói trực tiếp!", "tr": "{0} kişisinin ihtiyacını doğrudan konuşma biçiminde bir kontrol sorusunda özetleyin!", "ar": "لخّص حاجة {0} في سؤال تحقق بالكلام المباشر!"}, "Ihre Kontrollfrage": {"vi": "Câu hỏi kiểm tra của bạn", "tr": "Kontrol sorunuz", "ar": "سؤال التحقق الخاص بك"}, "endet mit „?“": {"vi": "kết thúc bằng „?“", "tr": "„?“ ile biter", "ar": "ينتهي بـ „؟“"}, "Wozu dient eine Kontrollfrage?": {"vi": "Câu hỏi kiểm tra dùng để làm gì?", "tr": "Kontrol sorusu ne işe yarar?", "ar": "ما فائدة سؤال التحقّق؟"}, "Sie prüft, ob man den Bedarf richtig verstanden hat, und gibt der Kundin Sicherheit.": {"vi": "Nó kiểm tra xem mình đã hiểu đúng nhu cầu chưa và mang lại cho khách cảm giác yên tâm.", "tr": "İhtiyacın doğru anlaşılıp anlaşılmadığını kontrol eder ve müşteriye güven verir.", "ar": "يتحقّق من أنّك فهمت الحاجة بشكل صحيح ويمنح الزبونة شعوراً بالأمان."}, "Sie kontrolliert, ob die Kundin genug Geld dabeihat.": {"vi": "Nó kiểm tra xem khách có mang đủ tiền không.", "tr": "Müşterinin yanında yeterli para olup olmadığını kontrol eder.", "ar": "يتحقّق من أنّ الزبونة تحمل مالاً كافياً."}, "Sie ersetzt die Begrüßung.": {"vi": "Nó thay thế lời chào.", "tr": "Karşılamanın yerini tutar.", "ar": "يحلّ محلّ التحية."}, "Modul 8, Satzbaukasten": {"vi": "Mô-đun 8, bộ khung câu", "tr": "Modül 8, cümle kutusu", "ar": "الوحدة 8، صندوق الجمل"}, "{0} sagt: „Ich suche ein Geschenk!“": {"vi": "{0} nói: „Tôi đang tìm một món quà!“", "tr": "{0} diyor ki: „Bir hediye arıyorum!“", "ar": "تقول {0}: „أبحث عن هدية!“"}, "„Für wen soll das Geschenk denn sein?“": {"vi": "„Món quà này dành cho ai ạ?“", "tr": "„Hediye kimin için olacak?“", "ar": "„لمن ستكون الهدية؟“"}, "Für meinen Mann, er hat bald Geburtstag.": {"vi": "Cho chồng tôi, sắp đến sinh nhật anh ấy.", "tr": "Kocam için, yakında doğum günü var.", "ar": "لزوجي، عيد ميلاده قريب."}, "Für meinen Enkel, er wird zwölf.": {"vi": "Cho cháu trai tôi, bé sắp mười hai tuổi.", "tr": "Torunum için, on iki yaşına giriyor.", "ar": "لحفيدي، سيبلغ الثانية عشرة."}, "Für meine Mitbewohnerin.": {"vi": "Cho bạn cùng phòng của tôi.", "tr": "Ev arkadaşım için.", "ar": "لزميلتي في السكن."}, "Für meinen Kollegen, der geht in Rente.": {"vi": "Cho đồng nghiệp của tôi, anh ấy sắp nghỉ hưu.", "tr": "İş arkadaşım için, emekli oluyor.", "ar": "لزميلي في العمل، سيتقاعد قريباً."}, "Offene Fragen nach Person und Anlass bringen die wichtigsten Informationen.": {"vi": "Câu hỏi mở về người nhận và dịp tặng cho ta những thông tin quan trọng nhất.", "tr": "Kişi ve vesile hakkındaki açık sorular en önemli bilgileri verir.", "ar": "الأسئلة المفتوحة عن الشخص والمناسبة تعطي أهمّ المعلومات."}, "„Haben Sie schon eine Idee?“": {"vi": "„Bạn đã có ý tưởng nào chưa?“", "tr": "„Aklınızda bir fikir var mı?“", "ar": "„هل لديكِ فكرة بعد؟“"}, "Freundlich nachfragen": {"vi": "Hỏi thăm một cách thân thiện", "tr": "Samimi bir şekilde sormak", "ar": "السؤال بلطف"}, "Nein. (Pause)": {"vi": "Chưa. (Im lặng)", "tr": "Hayır. (Sessizlik)", "ar": "لا. (صمت)"}, "Geschlossene Frage: Die Antwort „Nein“ bringt dich nicht weiter. Für geschlossene Fragen gibt es in der Prüfung keine Punkte.": {"vi": "Câu hỏi đóng: câu trả lời „Chưa“ không giúp bạn tiến thêm. Trong kỳ thi, câu hỏi đóng không được điểm.", "tr": "Kapalı soru: „Hayır“ cevabı seni ileri götürmez. Sınavda kapalı sorulara puan verilmez.", "ar": "سؤال مغلق: الجواب „لا“ لا يقدّمك خطوة. في الامتحان لا تُمنح نقاط على الأسئلة المغلقة."}, "Sofort den Bestseller zeigen: „Das nehmen die meisten.“": {"vi": "Giới thiệu ngay món bán chạy nhất: „Hầu hết mọi người đều chọn món này.“", "tr": "Hemen en çok satanı göstermek: „Çoğu kişi bunu alıyor.“", "ar": "عرض الأكثر مبيعاً فوراً: „معظم الناس يأخذون هذا.“"}, "Spart Zeit.": {"vi": "Tiết kiệm thời gian.", "tr": "Zaman kazandırır.", "ar": "يوفّر الوقت."}, "Hm, aber passt das denn zu der Person?": {"vi": "Ừm, nhưng liệu nó có hợp với người đó không?", "tr": "Hım, ama bu o kişiye uyar mı ki?", "ar": "همم، لكن هل يناسب هذا الشخص؟"}, "Ohne Bedarfsermittlung weißt du nicht, für wen das Geschenk ist. Der Bestseller passt vielleicht gar nicht.": {"vi": "Nếu không tìm hiểu nhu cầu, bạn không biết quà dành cho ai. Món bán chạy có thể hoàn toàn không phù hợp.", "tr": "İhtiyaç belirlemeden hediyenin kimin için olduğunu bilemezsin. En çok satan belki hiç uymaz.", "ar": "دون تحديد الحاجة لا تعرف لمن الهدية. قد لا يناسب الأكثر مبيعاً الشخص إطلاقاً."}, "Bau eine offene Frage zum Geschenk.": {"vi": "Hãy đặt một câu hỏi mở về món quà.", "tr": "Hediye hakkında açık bir soru kur.", "ar": "كوّن سؤالاً مفتوحاً عن الهدية."}, "Ist das": {"vi": "Có phải là", "tr": "Bu mu", "ar": "هل هو"}, "Damit beginnt eine geschlossene Frage.": {"vi": "Đây là phần mở đầu của một câu hỏi đóng.", "tr": "Bu, kapalı bir sorunun başlangıcıdır.", "ar": "هذه بداية سؤال مغلق."}, "„Man“ ist unpersönlich.": {"vi": "„Man“ (người ta) mang tính chung chung, không nhân xưng.", "tr": "„Man“ (insan/kişi) kişisel değildir.", "ar": "„Man“ (المرء) صيغة غير شخصية."}, "das Geschenk überreichen?": {"vi": "trao món quà?", "tr": "hediyeyi vermek mi?", "ar": "تسليم الهدية؟"}, "– sagen Sie schon!": {"vi": "– nói đi nào!", "tr": "– hadi söyleyin artık!", "ar": "– قولي الآن!"}, "Drängelnd und unhöflich.": {"vi": "Hối thúc và bất lịch sự.", "tr": "Aceleci ve kaba.", "ar": "متعجّل وغير مهذّب."}, "{0} äußert: „Ich suche ein Geschenk!“ Formulieren Sie 2 geeignete Fragen zur genaueren Bedarfsermittlung in wörtlicher Rede!": {"vi": "{0} nói: „Tôi đang tìm một món quà!“ Hãy đặt 2 câu hỏi phù hợp để tìm hiểu nhu cầu kỹ hơn, viết dưới dạng lời nói trực tiếp!", "tr": "{0} diyor ki: „Bir hediye arıyorum!“ İhtiyacı daha ayrıntılı belirlemek için doğrudan konuşma biçiminde 2 uygun soru yazın!", "ar": "تقول {0}: „أبحث عن هدية!“ صُغ سؤالين مناسبين لتحديد الحاجة بدقة أكبر بصيغة الكلام المباشر!"}, "Frage 1": {"vi": "Câu hỏi 1", "tr": "Soru 1", "ar": "السؤال 1"}, "Frage 2": {"vi": "Câu hỏi 2", "tr": "Soru 2", "ar": "السؤال 2"}, "Frage 1 ist offen (W-Wort) oder eine Alternativfrage („oder“)": {"vi": "Câu hỏi 1 là câu hỏi mở (từ để hỏi W) hoặc câu hỏi lựa chọn (có „oder“ = hoặc)", "tr": "Soru 1 açık (W-sözcüğü) veya seçmeli soru („oder“ = veya)", "ar": "السؤال 1 مفتوح (أداة استفهام W) أو سؤال اختيار (فيه „oder“ = أو)"}, "Frage 1 endet mit „?“": {"vi": "Câu hỏi 1 kết thúc bằng „?“", "tr": "Soru 1 „?“ ile biter", "ar": "السؤال 1 ينتهي بعلامة „؟“"}, "Frage 2 ist offen (W-Wort) oder eine Alternativfrage („oder“)": {"vi": "Câu hỏi 2 là câu hỏi mở (từ để hỏi W) hoặc câu hỏi lựa chọn (có „oder“ = hoặc)", "tr": "Soru 2 açık (W-sözcüğü) veya seçmeli soru („oder“ = veya)", "ar": "السؤال 2 مفتوح (أداة استفهام W) أو سؤال اختيار (فيه „oder“ = أو)"}, "Frage 2 endet mit „?“": {"vi": "Câu hỏi 2 kết thúc bằng „?“", "tr": "Soru 2 „?“ ile biter", "ar": "السؤال 2 ينتهي بعلامة „؟“"}, "Warum gibt es für „Haben Sie schon eine Idee?“ keine Punkte?": {"vi": "Vì sao câu „Haben Sie schon eine Idee?“ (Bạn đã có ý tưởng chưa?) không được điểm?", "tr": "„Haben Sie schon eine Idee?“ (Aklınızda bir fikir var mı?) sorusu neden puan getirmez?", "ar": "لماذا لا تُمنح نقاط على „Haben Sie schon eine Idee?“ (هل لديكِ فكرة بعد؟)؟"}, "Es ist eine geschlossene Frage – sie bringt kaum Informationen.": {"vi": "Đó là câu hỏi đóng – gần như không mang lại thông tin.", "tr": "Kapalı bir sorudur – neredeyse hiç bilgi getirmez.", "ar": "إنه سؤال مغلق – لا يعطي تقريباً أي معلومات."}, "Weil man nie nach Ideen fragen darf.": {"vi": "Vì không bao giờ được hỏi về ý tưởng.", "tr": "Çünkü fikir hakkında asla soru sorulmaz.", "ar": "لأنّه لا يجوز أبداً السؤال عن الأفكار."}, "Weil die Frage zu höflich ist.": {"vi": "Vì câu hỏi này quá lịch sự.", "tr": "Çünkü soru fazla nazik.", "ar": "لأنّ السؤال مهذّب أكثر من اللازم."}, "Eine Kundin sagt: „Ich brauche etwas für meine Schwester!“ Formulieren Sie 2 geeignete Fragen zur genaueren Bedarfsermittlung in wörtlicher Rede!": {"vi": "Một khách nữ nói: „Tôi cần một món cho chị gái tôi!“ Hãy đặt 2 câu hỏi phù hợp để tìm hiểu nhu cầu kỹ hơn, viết dưới dạng lời nói trực tiếp!", "tr": "Bir müşteri diyor ki: „Ablam için bir şey lazım!“ İhtiyacı daha ayrıntılı belirlemek için doğrudan konuşma biçiminde 2 uygun soru yazın!", "ar": "تقول زبونة: „أحتاج شيئاً لأختي!“ صُغ سؤالين مناسبين لتحديد الحاجة بدقة أكبر بصيغة الكلام المباشر!"}, "2 × 2 P., z. B. „Wofür soll es sein – gibt es einen besonderen Anlass?“ „Was macht Ihre Schwester gern in ihrer Freizeit?“ „Welchen Preisrahmen haben Sie sich vorgestellt?“ Für geschlossene Fragen keine Punkte.": {"vi": "2 × 2 điểm, ví dụ „Wofür soll es sein – gibt es einen besonderen Anlass?“ (Dành cho dịp gì – có dịp đặc biệt không?) „Was macht Ihre Schwester gern in ihrer Freizeit?“ (Chị gái bạn thích làm gì lúc rảnh?) „Welchen Preisrahmen haben Sie sich vorgestellt?“ (Bạn dự kiến mức giá nào?) Câu hỏi đóng không được điểm.", "tr": "2 × 2 P., örn. „Wofür soll es sein – gibt es einen besonderen Anlass?“ (Ne için – özel bir vesile var mı?) „Was macht Ihre Schwester gern in ihrer Freizeit?“ (Ablanız boş zamanında ne yapmaktan hoşlanır?) „Welchen Preisrahmen haben Sie sich vorgestellt?“ (Nasıl bir fiyat aralığı düşünüyorsunuz?) Kapalı sorulara puan verilmez.", "ar": "2 × 2 نقطة، مثلاً „Wofür soll es sein – gibt es einen besonderen Anlass?“ (لماذا تريدينها – هل هناك مناسبة خاصة؟) „Was macht Ihre Schwester gern in ihrer Freizeit?“ (ماذا تحب أختك أن تفعل في وقت فراغها؟) „Welchen Preisrahmen haben Sie sich vorgestellt?“ (ما نطاق السعر الذي تفكرين فيه؟) لا نقاط للأسئلة المغلقة."}, "{0} betrachtet {1} interessiert, traut sich aber nicht, es anzufassen.": {"vi": "{0} nhìn {1} đầy quan tâm nhưng không dám chạm vào.", "tr": "{0} {1} ilgiyle bakıyor ama dokunmaya cesaret edemiyor.", "ar": "تنظر {0} إلى {1} باهتمام لكنها لا تجرؤ على لمسه."}, "Vorführen und dann selbst ausprobieren lassen": {"vi": "Làm mẫu rồi để khách tự thử", "tr": "Göstermek, sonra müşterinin kendisinin denemesine izin vermek", "ar": "العرض العملي ثم ترك الزبونة تجرّب بنفسها"}, "Mehrere Sinne ansprechen.": {"vi": "Tác động đến nhiều giác quan.", "tr": "Birden çok duyuya hitap etmek.", "ar": "مخاطبة عدّة حواس."}, "Oh, das fühlt sich ja richtig gut an!": {"vi": "Ồ, cầm thích thật đấy!", "tr": "Ooo, tutması gerçekten güzel!", "ar": "أوه، ملمسه رائع حقاً!"}, "Gut, aber kurz bitte.": {"vi": "Được, nhưng làm ngắn gọn thôi.", "tr": "İyi, ama kısa olsun lütfen.", "ar": "جيّد، لكن باختصار من فضلك."}, "Ware vorführen: Die Kundin sieht die Verwendung. Sinne ansprechen: Sie baut eine Beziehung zum Produkt auf.": {"vi": "Làm mẫu hàng hóa: khách thấy cách sử dụng. Tác động các giác quan: khách tạo mối liên hệ với sản phẩm.", "tr": "Malı göstermek: müşteri kullanımı görür. Duyulara hitap etmek: ürünle bağ kurar.", "ar": "عرض السلعة: ترى الزبونة الاستخدام. مخاطبة الحواس: تبني علاقة بالمنتج."}, "Nur erklären, was die Ware kann": {"vi": "Chỉ giải thích hàng làm được gì", "tr": "Sadece malın ne yapabildiğini anlatmak", "ar": "الاكتفاء بشرح ما تستطيع السلعة فعله"}, "Anfassen ist nicht nötig.": {"vi": "Không cần cho khách chạm vào.", "tr": "Dokunmaya gerek yok.", "ar": "لا حاجة للمس."}, "Aha … ich kann mir das noch nicht so richtig vorstellen.": {"vi": "À … tôi vẫn chưa hình dung được rõ lắm.", "tr": "Ha … ben bunu henüz tam olarak hayal edemiyorum.", "ar": "آه … لا أستطيع تخيّله جيداً بعد."}, "Erklären allein spricht nur das Hören an. Wer anfassen und ausprobieren darf, versteht den Nutzen schneller.": {"vi": "Chỉ giải thích thì mới tác động đến thính giác. Khách được chạm và thử sẽ hiểu lợi ích nhanh hơn.", "tr": "Sadece anlatmak yalnızca işitmeye hitap eder. Dokunup deneyebilen müşteri yararı daha çabuk anlar.", "ar": "الشرح وحده يخاطب السمع فقط. من تلمس وتجرّب تفهم الفائدة أسرع."}, "Das zerkratzte Ausstellungsstück geben – das neue bleibt verpackt": {"vi": "Đưa món trưng bày bị trầy – món mới vẫn để nguyên hộp", "tr": "Çizik sergi ürününü vermek – yenisi ambalajında kalır", "ar": "إعطاؤها قطعة العرض المخدوشة – وتبقى الجديدة في علبتها"}, "Schont die Neuware.": {"vi": "Giữ gìn hàng mới.", "tr": "Yeni malı korur.", "ar": "يحافظ على السلعة الجديدة."}, "(sieht die Kratzer) Na, das macht ja keinen guten Eindruck.": {"vi": "(thấy vết xước) Ồ, trông không ấn tượng chút nào.", "tr": "(çizikleri görür) Eh, hiç iyi bir izlenim bırakmadı.", "ar": "(ترى الخدوش) حسناً، هذا لا يعطي انطباعاً جيداً."}, "Grundsatz: nur einwandfreie, saubere Ware vorlegen – von ihrer besten Seite.": {"vi": "Nguyên tắc: chỉ đưa hàng nguyên vẹn, sạch sẽ – ở trạng thái đẹp nhất.", "tr": "İlke: yalnızca kusursuz, temiz mal sunulur – en iyi haliyle.", "ar": "القاعدة: لا تُقدَّم إلا سلعة سليمة ونظيفة – في أفضل حالاتها."}, "Bau einen Satz zum Vorführen.": {"vi": "Hãy ghép một câu để làm mẫu hàng.", "tr": "Göstermek için bir cümle kur.", "ar": "كوّن جملة للعرض العملي."}, "Ich zeige Ihnen,": {"vi": "Tôi sẽ cho bạn xem", "tr": "Size göstereyim,", "ar": "سأُريكِ"}, "Passen Sie auf,": {"vi": "Hãy chú ý,", "tr": "Dikkat edin,", "ar": "انتبهي،"}, "Klingt wie ein Befehl.": {"vi": "Nghe như một mệnh lệnh.", "tr": "Emir gibi duyuluyor.", "ar": "يبدو كأنه أمر."}, "Mitte": {"vi": "Giữa", "tr": "Orta", "ar": "الوسط"}, "wie einfach das geht –": {"vi": "việc này đơn giản thế nào –", "tr": "bunun ne kadar kolay olduğunu –", "ar": "كم هذا سهل –"}, "wie kompliziert das ist –": {"vi": "việc này phức tạp thế nào –", "tr": "bunun ne kadar karmaşık olduğunu –", "ar": "كم هذا معقّد –"}, "Negativ. Das schreckt ab.": {"vi": "Tiêu cực. Làm khách e ngại.", "tr": "Olumsuz. Caydırır.", "ar": "سلبي. يُنفّر الزبونة."}, "und dann probieren Sie es selbst.": {"vi": "rồi bạn tự thử nhé.", "tr": "sonra siz de kendiniz deneyin.", "ar": "ثم جرّبي بنفسك."}, "aber anfassen dürfen Sie es nicht.": {"vi": "nhưng bạn không được chạm vào đâu.", "tr": "ama dokunmanıza izin yok.", "ar": "لكن لا يُسمح لك بلمسه."}, "Die Kundin soll die Ware gerade selbst prüfen.": {"vi": "Khách phải tự kiểm tra hàng.", "tr": "Müşteri malı kendisi kontrol etmeli.", "ar": "يجب أن تفحص الزبونة السلعة بنفسها."}, "Formulieren Sie in wörtlicher Rede, wie Sie {0} vorführen und {1} zum Ausprobieren einladen!": {"vi": "Hãy viết dưới dạng lời nói trực tiếp cách bạn làm mẫu {0} và mời {1} thử!", "tr": "{0} nasıl gösterdiğinizi ve {1} denemeye nasıl davet ettiğinizi doğrudan konuşma biçiminde yazın!", "ar": "اكتب بصيغة الكلام المباشر كيف تعرض {0} وتدعو {1} إلى التجربة!"}, "Einladung zum Ausprobieren": {"vi": "Lời mời thử", "tr": "Denemeye davet", "ar": "الدعوة إلى التجربة"}, "Erläutern Sie die Grundregel „Ware vorführen“.": {"vi": "Hãy giải thích quy tắc „làm mẫu hàng hóa“.", "tr": "„Malı göstermek“ temel kuralını açıklayın.", "ar": "اشرح قاعدة „عرض السلعة عملياً“."}, "Die Kundin sieht die Verwendung und kann sich den Nutzen besser vorstellen.": {"vi": "Khách thấy cách dùng và hình dung được lợi ích rõ hơn.", "tr": "Müşteri kullanımı görür ve yararı daha iyi hayal eder.", "ar": "ترى الزبونة الاستخدام وتتخيّل الفائدة بشكل أفضل."}, "Die Ware wird vorgeführt, damit sie schneller kaputtgeht.": {"vi": "Hàng được làm mẫu để nhanh hỏng hơn.", "tr": "Mal, daha çabuk bozulsun diye gösterilir.", "ar": "تُعرض السلعة ليتلف أسرع."}, "Vorführen ersetzt die Beratung.": {"vi": "Làm mẫu thay thế cho việc tư vấn.", "tr": "Göstermek, danışmanlığın yerini tutar.", "ar": "العرض العملي يحلّ محلّ الاستشارة."}, "{0} hat keine Preisvorstellung genannt. Du holst drei Modelle. Welche?": {"vi": "{0} chưa nói mức giá mong muốn. Bạn lấy ba mẫu. Chọn những mẫu nào?", "tr": "{0} bir fiyat beklentisi belirtmedi. Üç model getiriyorsun. Hangilerini?", "ar": "لم تذكر {0} السعر الذي تفكر فيه. ستُحضر ثلاثة طرازات. أيّها؟"}, "Drei Modelle aus der mittleren Preislage": {"vi": "Ba mẫu ở tầm giá trung bình", "tr": "Orta fiyat aralığından üç model", "ar": "ثلاثة طرازات من فئة السعر المتوسطة"}, "Je nach Reaktion weiche ich aus.": {"vi": "Tùy phản ứng của khách, tôi sẽ điều chỉnh lên hoặc xuống.", "tr": "Tepkisine göre yukarı ya da aşağı yönelirim.", "ar": "بحسب ردّ فعلها أنتقل إلى الأعلى أو الأسفل."}, "Die gefallen mir. Das mittlere vielleicht?": {"vi": "Mấy cái này đẹp đấy. Có lẽ cái ở giữa?", "tr": "Bunları beğendim. Belki ortadaki?", "ar": "أعجبتني هذه. ربما الأوسط؟"}, "Mittlere Preislage: Je nach Reaktion kannst du nach oben oder unten ausweichen.": {"vi": "Tầm giá trung bình: tùy phản ứng của khách, bạn có thể chuyển lên hoặc xuống.", "tr": "Orta fiyat aralığı: müşterinin tepkisine göre yukarı veya aşağı yönelebilirsin.", "ar": "فئة السعر المتوسطة: بحسب ردّ فعل الزبونة يمكنك الانتقال إلى الأعلى أو الأسفل."}, "Die drei teuersten Modelle": {"vi": "Ba mẫu đắt nhất", "tr": "En pahalı üç model", "ar": "أغلى ثلاثة طرازات"}, "Qualität verkauft sich.": {"vi": "Chất lượng thì dễ bán.", "tr": "Kalite kendini satar.", "ar": "الجودة تبيع نفسها."}, "Puh, die sind ja alle sehr teuer.": {"vi": "Ôi, cái nào cũng đắt quá.", "tr": "Off, hepsi çok pahalı.", "ar": "أوف، كلها غالية جداً."}, "Das kann ich mir nie leisten.": {"vi": "Tôi không bao giờ mua nổi.", "tr": "Bunu asla karşılayamam.", "ar": "لن أستطيع شراءه أبداً."}, "Wer mit den teuersten beginnt, riskiert einen Preisschock – und kann nur noch nach unten ausweichen.": {"vi": "Bắt đầu bằng món đắt nhất có nguy cơ gây sốc giá – và chỉ còn cách điều chỉnh xuống.", "tr": "En pahalılarla başlamak fiyat şokuna yol açma riski taşır – ve ancak aşağı yönelinebilir.", "ar": "البدء بالأغلى يخاطر بصدمة السعر – ولا يبقى إلا الانتقال إلى الأسفل."}, "Ein günstiges, ein mittleres und ein teures Modell": {"vi": "Một mẫu rẻ, một mẫu trung bình và một mẫu đắt", "tr": "Bir ucuz, bir orta ve bir pahalı model", "ar": "طراز رخيص وطراز متوسط وطراز غالٍ"}, "Von allem etwas.": {"vi": "Mỗi loại một ít.", "tr": "Her birinden biraz.", "ar": "من كل شيء قليلاً."}, "Hm, die sind ja sehr verschieden.": {"vi": "Ừm, chúng khác nhau nhiều quá.", "tr": "Hım, bunlar birbirinden çok farklı.", "ar": "همم، هذه مختلفة جداً."}, "Möglich, aber die Regel lautet: mit der mittleren Preislage beginnen und dann je nach Reaktion ausweichen.": {"vi": "Có thể, nhưng quy tắc là: bắt đầu từ tầm giá trung bình rồi điều chỉnh theo phản ứng của khách.", "tr": "Olabilir, ama kural şudur: orta fiyat aralığıyla başla, sonra tepkiye göre yönel.", "ar": "ممكن، لكن القاعدة هي: ابدأ بفئة السعر المتوسطة ثم انتقل بحسب ردّ الفعل."}, "Bau eine Begründung (so wie in der Prüfung).": {"vi": "Hãy ghép một lời giải thích (như trong kỳ thi).", "tr": "Bir gerekçe kur (sınavdaki gibi).", "ar": "كوّن تعليلاً (كما في الامتحان)."}, "Preislage": {"vi": "Tầm giá", "tr": "Fiyat aralığı", "ar": "فئة السعر"}, "Ich beginne mit der mittleren Preislage,": {"vi": "Tôi bắt đầu từ tầm giá trung bình,", "tr": "Orta fiyat aralığıyla başlarım,", "ar": "أبدأ بفئة السعر المتوسطة،"}, "Ich beginne mit dem teuersten Artikel,": {"vi": "Tôi bắt đầu từ mặt hàng đắt nhất,", "tr": "En pahalı ürünle başlarım,", "ar": "أبدأ بأغلى سلعة،"}, "Dann droht ein Preisschock.": {"vi": "Khi đó sẽ bị sốc giá.", "tr": "O zaman fiyat şoku yaşanır.", "ar": "عندها تحدث صدمة السعر."}, "Ich beginne mit dem billigsten Artikel,": {"vi": "Tôi bắt đầu từ mặt hàng rẻ nhất,", "tr": "En ucuz ürünle başlarım,", "ar": "أبدأ بأرخص سلعة،"}, "Dann wirkt alles danach teuer – und „billig“ ist kein gutes Wort.": {"vi": "Khi đó mọi thứ sau đó đều có vẻ đắt – và „rẻ“ không phải là từ hay.", "tr": "O zaman sonrası hep pahalı görünür – ve „ucuz“ iyi bir sözcük değildir.", "ar": "عندها يبدو كل ما بعده غالياً – وكلمة „رخيص“ ليست كلمة جيدة."}, "Verbindung": {"vi": "Liên từ", "tr": "Bağlantı", "ar": "الربط"}, "weil ich dann": {"vi": "vì khi đó tôi", "tr": "çünkü o zaman ben", "ar": "لأنّني عندها"}, "obwohl ich dann": {"vi": "mặc dù khi đó tôi", "tr": "her ne kadar o zaman ben", "ar": "مع أنّني عندها"}, "„Obwohl“ passt nicht – du nennst einen Grund.": {"vi": "„Obwohl“ (mặc dù) không phù hợp – bạn đang nêu lý do.", "tr": "„Obwohl“ (her ne kadar) uymuyor – bir neden belirtiyorsun.", "ar": "„Obwohl“ (مع أنّ) لا تناسب – أنت تذكر سبباً."}, "Grund": {"vi": "Lý do", "tr": "Neden", "ar": "السبب"}, "je nach Reaktion nach oben oder unten ausweichen kann.": {"vi": "có thể điều chỉnh lên hoặc xuống tùy phản ứng.", "tr": "tepkiye göre yukarı ya da aşağı yönelebilirim.", "ar": "أستطيع الانتقال إلى الأعلى أو الأسفل بحسب ردّ الفعل."}, "mehr Provision bekomme.": {"vi": "nhận được nhiều hoa hồng hơn.", "tr": "daha fazla komisyon alırım.", "ar": "أحصل على عمولة أكبر."}, "Kein kundenorientierter Grund.": {"vi": "Không phải lý do hướng đến khách hàng.", "tr": "Müşteri odaklı bir neden değil.", "ar": "ليس سبباً موجّهاً نحو الزبون."}, "Begründen Sie, mit welcher Preisklasse Sie Ihre Warenvorlage beginnen!": {"vi": "Hãy giải thích bạn bắt đầu lượt trưng bày hàng ở tầm giá nào!", "tr": "Mal sunumuna hangi fiyat aralığıyla başladığınızı gerekçelendirin!", "ar": "علّل بأيّ فئة سعرية تبدأ عرض السلع!"}, "Ihre Begründung": {"vi": "Lời giải thích của bạn", "tr": "Gerekçeniz", "ar": "تعليلك"}, "mittlere Preislage genannt": {"vi": "đã nêu tầm giá trung bình", "tr": "orta fiyat aralığı belirtildi", "ar": "ذُكرت فئة السعر المتوسطة"}, "Grund: nach oben oder unten ausweichen": {"vi": "Lý do: điều chỉnh lên hoặc xuống", "tr": "Neden: yukarı veya aşağı yönelmek", "ar": "السبب: الانتقال إلى الأعلى أو الأسفل"}, "Wie viele Artikel legen Sie vor – und warum?": {"vi": "Bạn đưa ra bao nhiêu mặt hàng – và vì sao?", "tr": "Kaç ürün sunarsınız – ve neden?", "ar": "كم سلعة تعرض – ولماذا؟"}, "3 bis 5 – die Kundin hat eine Auswahl, wird aber nicht überfordert.": {"vi": "3 đến 5 – khách có lựa chọn nhưng không bị choáng ngợp.", "tr": "3 ila 5 – müşterinin seçeneği olur ama bunalmaz.", "ar": "من 3 إلى g dần", "tr": "Giderek artırma", "ar": "التصاعد"}, "Oh – das letzte Argument überzeugt mich wirklich.": {"vi": "Ồ – lý lẽ cuối cùng thật sự thuyết phục tôi.", "tr": "Ooo – son argüman beni gerçekten ikna etti.", "ar": "أوه – الحجة الأخيرة أقنعتني حقاً."}, "Die Argumente werden gesteigert: Das stärkste kommt an den Schluss, begonnen wird mit einem wichtigen (Modul 9).": {"vi": "Các lý lẽ được tăng dần: lý lẽ mạnh nhất để cuối, bắt đầu bằng một lý lẽ quan trọng (Mô-đun 9).", "tr": "Argümanlar artarak sıralanır: en güçlüsü sona gelir, önemli bir argümanla başlanır (Modül 9).", "ar": "تُرتَّب الحجج تصاعدياً: الأقوى في النهاية، وتبدأ بحجة مهمة (الوحدة 9)."}, "Das stärkste zuerst, danach die schwächeren": {"vi": "Lý lẽ mạnh nhất trước, rồi đến những lý lẽ yếu hơn", "tr": "Önce en güçlü, sonra daha zayıf argümanlar", "ar": "الحجة الأقوى أولاً ثم الأضعف"}, "Gleich mit der Tür ins Haus.": {"vi": "Vào thẳng vấn đề ngay.", "tr": "Direkt konuya girmek.", "ar": "الدخول في الموضوع مباشرة."}, "Gut … und der Rest klingt jetzt eher schwach.": {"vi": "Tốt … nhưng phần còn lại giờ nghe khá yếu.", "tr": "İyi … ama geri kalanı şimdi daha zayıf geliyor.", "ar": "جيّد … لكن الباقي يبدو الآن ضعيفاً."}, "Dann wird die Argumentation zum Ende hin schwächer – der letzte Eindruck bleibt aber hängen.": {"vi": "Khi đó lập luận yếu dần về cuối – mà ấn tượng cuối cùng lại là cái đọng lại.", "tr": "O zaman argümantasyon sona doğru zayıflar – oysa son izlenim akılda kalır.", "ar": "عندها تضعف الحجة نحو النهاية – بينما الانطباع الأخير هو ما يبقى."}, "„Weil der Chef sagt, dass wir den verkaufen sollen.“": {"vi": "„Vì sếp bảo chúng tôi phải bán món này.“", "tr": "„Çünkü patron bunu satmamız gerektiğini söylüyor.“", "ar": "„لأنّ المدير يقول إنّ علينا بيع هذا.“"}, "Ehrlich ist ehrlich.": {"vi": "Thật thà là thật thà.", "tr": "Dürüstlük dürüstlüktür.", "ar": "الصراحة صراحة."}, "(lacht unsicher) Na, das ist ja ein Argument …": {"vi": "(cười ngượng) Ừ, cũng là một lý lẽ đấy …", "tr": "(çekingen güler) Eh, o da bir argüman sayılır …", "ar": "(تضحك بتردّد) حسناً، هذه أيضاً حجة …"}, "Ein Verkaufsargument nennt immer einen Nutzen für die Kundschaft, nicht für den Betrieb.": {"vi": "Lý lẽ bán hàng luôn nêu lợi ích cho khách hàng, không phải cho cửa hàng.", "tr": "Bir satış argümanı her zaman müşteriye yönelik bir yarar belirtir, işletmeye değil.", "ar": "حجة البيع تذكر دائماً فائدة للزبائن، لا للمتجر."}, "Bau ein Argument im Sie-Stil.": {"vi": "Hãy ghép một lý lẽ theo cách xưng „Sie“ (Quý khách).", "tr": "„Sie“ (Siz) tarzında bir argüman kur.", "ar": "كوّن حجة بأسلوب „Sie“ (أنتِ/حضرتك)."}, "{0} ist halt gut.": {"vi": "{0} thì tốt thôi.", "tr": "{0} işte iyi.", "ar": "{0} جيّد وخلاص."}, "„Gut“ ist kein Merkmal.": {"vi": "„Tốt“ không phải là một đặc điểm.", "tr": "„İyi“ bir özellik değildir.", "ar": "„جيّد“ ليست خاصية."}, "Überleitung": {"vi": "Câu chuyển ý", "tr": "Geçiş", "ar": "الانتقال"}, "Das hilft Ihnen,": {"vi": "Điều này giúp bạn,", "tr": "Bu size yardımcı olur,", "ar": "هذا يساعدك،"}, "Das hilft uns,": {"vi": "Điều này giúp chúng tôi,", "tr": "Bu bize yardımcı olur,", "ar": "هذا يساعدنا،"}, "Der Nutzen muss für die Kundin sein.": {"vi": "Lợi ích phải dành cho khách.", "tr": "Yarar müşteri için olmalı.", "ar": "يجب أن تكون الفائدة للزبونة."}, "wenn Sie es brauchen.": {"vi": "khi bạn cần đến nó.", "tr": "ihtiyacınız olduğunda.", "ar": "عندما تحتاجينه."}, "Zu ungenau – welcher Nutzen genau?": {"vi": "Quá chung chung – lợi ích cụ thể là gì?", "tr": "Çok belirsiz – tam olarak hangi yarar?", "ar": "غير دقيق – ما الفائدة بالضبط؟"}, "Leiten Sie aus der Produktinformation „Verwendungszweck“ eine Eigenschaft von {0} ab und formulieren Sie dazu ein Verkaufsargument in wörtlicher Rede!": {"vi": "Từ thông tin sản phẩm „Mục đích sử dụng“, hãy suy ra một đặc điểm của {0} và viết một lý lẽ bán hàng dưới dạng lời nói trực tiếp!", "tr": "„Kullanım amacı“ ürün bilgisinden {0} için bir özellik türetin ve bununla ilgili doğrudan konuşma biçiminde bir satış argümanı yazın!", "ar": "استنتج من معلومات المنتج „غرض الاستخدام“ خاصية لـ {0} وصُغ حجة بيع بصيغة الكلام المباشر!"}, "Produkteigenschaft": {"vi": "Đặc điểm sản phẩm", "tr": "Ürün özelliği", "ar": "خاصية المنتج"}, "Verkaufsargument": {"vi": "Lý lẽ bán hàng", "tr": "Satış argümanı", "ar": "حجة البيع"}, "Eigenschaft eingetragen": {"vi": "Đã ghi đặc điểm", "tr": "Özellik yazıldı", "ar": "كُتبت الخاصية"}, "Argument im Sie-Stil": {"vi": "Lý lẽ theo cách xưng „Sie“", "tr": "„Sie“ tarzında argüman", "ar": "حجة بأسلوب „Sie“"}, "Argument nennt einen Nutzen": {"vi": "Lý lẽ nêu một lợi ích", "tr": "Argüman bir yarar belirtir", "ar": "الحجة تذكر فائدة"}, "Was ist der Unterschied zwischen Gebrauchsnutzen und Zusatznutzen?": {"vi": "Lợi ích sử dụng và lợi ích cộng thêm khác nhau thế nào?", "tr": "Kullanım yararı ile ek yarar arasındaki fark nedir?", "ar": "ما الفرق بين منفعة الاستخدام والمنفعة الإضافية؟"}, "Der Gebrauchsnutzen erfüllt den eigentlichen Bedarf, der Zusatznutzen bringt darüber hinaus z. B. Ansehen.": {"vi": "Lợi ích sử dụng đáp ứng nhu cầu thực sự, lợi ích cộng thêm mang lại thêm điều khác, ví dụ uy tín.", "tr": "Kullanım yararı asıl ihtiyacı karşılar, ek yarar bunun ötesinde örneğin itibar sağlar.", "ar": "منفعة الاستخدام تلبّي الحاجة الفعلية، والمنفعة الإضافية تمنح فوق ذلك مثلاً المكانة."}, "Gebrauchsnutzen gibt es nur bei Lebensmitteln.": {"vi": "Lợi ích sử dụng chỉ có ở thực phẩm.", "tr": "Kullanım yararı sadece gıdalarda vardır.", "ar": "منفعة الاستخدام موجودة في المواد الغذائية فقط."}, "Zusatznutzen ist der Rabatt.": {"vi": "Lợi ích cộng thêm là giảm giá.", "tr": "Ek yarar indirimdir.", "ar": "المنفعة الإضافية هي التخفيض."}, "Aus Produktinformationen kann man Verkaufsargumente ableiten. Ergänzen Sie für einen Wasserkocher die Tabelle (Produkteigenschaft, Verkaufsargumentation in wörtlicher Rede)!": {"vi": "Có thể rút ra lý lẽ bán hàng từ thông tin sản phẩm. Hãy hoàn thành bảng cho một ấm đun nước (đặc điểm sản phẩm, lập luận bán hàng dưới dạng lời nói trực tiếp)!", "tr": "Ürün bilgilerinden satış argümanları türetilebilir. Bir su ısıtıcısı için tabloyu tamamlayın (ürün özelliği, doğrudan konuşma biçiminde satış argümantasyonu)!", "ar": "يمكن استنتاج حجج البيع من معلومات المنتج. أكمل الجدول لغلّاية ماء (خاصية المنتج، حجة البيع بصيغة الكلام المباشر)!"}, "z. B. Eigenschaft: automatische Abschaltung – „Wenn das Wasser kocht, schaltet sich das Gerät von selbst ab, das spart Strom und ist sicher.“": {"vi": "ví dụ đặc điểm: tự động ngắt – „Wenn das Wasser kocht, schaltet sich das Gerät von selbst ab, das spart Strom und ist sicher.“ (Khi nước sôi, thiết bị tự tắt, vừa tiết kiệm điện vừa an toàn.)", "tr": "örn. özellik: otomatik kapanma – „Wenn das Wasser kocht, schaltet sich das Gerät von selbst ab, das spart Strom und ist sicher.“ (Su kaynayınca cihaz kendiliğinden kapanır, bu elektrikten tasarruf sağlar ve güvenlidir.)", "ar": "مثلاً الخاصية: الإيقاف التلقائي – „Wenn das Wasser kocht, schaltet sich das Gerät von selbst ab, das spart Strom und ist sicher.“ (عندما يغلي الماء ينطفئ الجهاز تلقائياً، وهذا يوفّر الكهرباء وآمن.)"}, "Welches Argument wählst du für {0}?": {"vi": "Bạn chọn lý lẽ nào cho {0}?", "tr": "{0} için hangi argümanı seçersiniz?", "ar": "أيّ حجة تختار لـ {0}؟"}, "Gütesiegel, Testergebnis, hochwertige Marke": {"vi": "Dấu chứng nhận chất lượng, kết quả kiểm nghiệm, thương hiệu cao cấp", "tr": "Kalite mührü, test sonucu, yüksek kaliteli marka", "ar": "ختم الجودة، نتيجة الاختبار، علامة تجارية رفيعة"}, "für Qualitätsbewusste": {"vi": "dành cho người coi trọng chất lượng", "tr": "kalitesine önem verenler için", "ar": "لمن يهتمّون بالجودة"}, "Das ist mir wichtig – dann weiß ich, dass es was taugt.": {"vi": "Cái này quan trọng với tôi – vậy tôi biết nó dùng được.", "tr": "Bu benim için önemli – o zaman işe yaradığını bilirim.", "ar": "هذا مهم لي – عندها أعرف أنّه جيّد."}, "Schön, aber das zahl ich doch mit.": {"vi": "Hay đấy, nhưng cái đó tôi cũng trả tiền mà.", "tr": "Güzel, ama onun parasını da ben ödüyorum.", "ar": "جميل، لكنّني أدفع ثمن ذلك أيضاً."}, "Qualitätsbewusste überzeugen Gütesiegel, Testergebnisse und hochwertige Markenartikel.": {"vi": "Người coi trọng chất lượng bị thuyết phục bởi dấu chứng nhận chất lượng, kết quả kiểm nghiệm và hàng thương hiệu cao cấp.", "tr": "Kalitesine önem verenleri kalite mühürleri, test sonuçları ve yüksek kaliteli markalı ürünler ikna eder.", "ar": "يقتنع من يهتمّون بالجودة بأختام الجودة ونتائج الاختبار والمنتجات ذات العلامات التجارية الرفيعة."}, "Angebot, Preis-Leistungs-Verhältnis": {"vi": "Ưu đãi, tỷ lệ giá/chất lượng", "tr": "Kampanya, fiyat-performans oranı", "ar": "العرض، نسبة السعر إلى الجودة"}, "für Sparsame": {"vi": "dành cho người tiết kiệm", "tr": "tutumlular için", "ar": "للمقتصدين"}, "Hm, beim Preis spare ich nicht so gern.": {"vi": "Ừm, tôi không thích tiết kiệm ở khoản giá.", "tr": "Hım, fiyattan tasarruf etmeyi pek sevmem.", "ar": "همم، لا أحب التوفير في السعر."}, "Genau das will ich hören!": {"vi": "Đúng điều tôi muốn nghe!", "tr": "Tam da duymak istediğim şey!", "ar": "هذا بالضبط ما أريد سماعه!"}, "Sparsame überzeugen Angebote, Staffelpreise und ein gutes Preis-Leistungs-Verhältnis.": {"vi": "Người tiết kiệm bị thuyết phục bởi ưu đãi, giá theo bậc số lượng và tỷ lệ giá/chất lượng tốt.", "tr": "Tutumluları kampanyalar, kademeli fiyatlar ve iyi bir fiyat-performans oranı ikna eder.", "ar": "يقتنع المقتصدون بالعروض والأسعار المتدرجة ونسبة السعر إلى الجودة الجيدة."}, "Nachhaltigkeit, Herkunft, Recycling": {"vi": "Tính bền vững, xuất xứ, tái chế", "tr": "Sürdürülebilirlik, menşe, geri dönüşüm", "ar": "الاستدامة، المنشأ، إعادة التدوير"}, "für Umweltbewusste": {"vi": "dành cho người quan tâm môi trường", "tr": "çevreye duyarlılar için", "ar": "لمن يهتمّون بالبيئة"}, "Ach, das ist auch nett zu wissen.": {"vi": "À, cái đó cũng hay để biết.", "tr": "Ha, bunu bilmek de güzel.", "ar": "آه، من اللطيف معرفة ذلك أيضاً."}, "Umweltbewusste überzeugen Nachhaltigkeit, Recyclingfähigkeit, Herkunftsland und Biolabel. Passt hier nur teilweise.": {"vi": "Người quan tâm môi trường bị thuyết phục bởi tính bền vững, khả năng tái chế, nước xuất xứ và nhãn sinh học. Ở đây chỉ phù hợp một phần.", "tr": "Çevreye duyarlıları sürdürülebilirlik, geri dönüştürülebilirlik, menşe ülke ve biyo etiket ikna eder. Burada sadece kısmen uyuyor.", "ar": "يقتنع من يهتمّون بالبيئة بالاستدامة وإمكانية إعادة التدوير وبلد المنشأ وشارة العضوي. هنا يناسب جزئياً فقط."}, "Begründen Sie, warum man Kunden in Typen und Gruppen einteilt.": {"vi": "Hãy giải thích vì sao người ta chia khách hàng thành các kiểu và nhóm.", "tr": "Müşterilerin neden tiplere ve gruplara ayrıldığını gerekçelendirin.", "ar": "علّل لماذا يُقسَّم الزبائن إلى أنماط ومجموعات."}, "Sie haben unterschiedliche Bedürfnisse und brauchen unterschiedliche Beratung.": {"vi": "Họ có nhu cầu khác nhau và cần được tư vấn khác nhau.", "tr": "Farklı ihtiyaçları vardır ve farklı danışmanlığa ihtiyaç duyarlar.", "ar": "لديهم حاجات مختلفة ويحتاجون إلى استشارة مختلفة."}, "Damit man weiß, wen man nicht bedienen muss.": {"vi": "Để biết ai không cần phục vụ.", "tr": "Kime hizmet etmek gerekmediğini bilmek için.", "ar": "لمعرفة من لا يجب خدمته."}, "Weil das Gesetz es vorschreibt.": {"vi": "Vì pháp luật quy định như vậy.", "tr": "Çünkü yasa bunu zorunlu kılıyor.", "ar": "لأنّ القانون ينصّ على ذلك."}, "Beschreiben Sie, mit welchen Argumenten Sie die Kundentypen „der Modebewusste“, „der Preisbewusste“ und „der Bequeme“ überzeugen!": {"vi": "Hãy mô tả bạn thuyết phục các kiểu khách „người chuộng thời trang“, „người quan tâm giá“ và „người thích tiện lợi“ bằng những lý lẽ nào!", "tr": "„Moda bilinçli“, „fiyat bilinçli“ ve „rahatına düşkün“ müşteri tiplerini hangi argümanlarla ikna edeceğinizi açıklayın!", "ar": "صِف بأيّ حجج تقنع أنماط الزبائن „المهتم بالموضة“ و„المهتم بالسعر“ و„الباحث عن الراحة“!"}, "Modebewusste: aktuelle Trends, neue Kollektion, Marke; Preisbewusste: Angebote, Preis-Leistungs-Verhältnis, Mengenrabatt; Bequeme: Service, Lieferung, einfache Handhabung.": {"vi": "Người chuộng thời trang: xu hướng mới, bộ sưu tập mới, thương hiệu; người quan tâm giá: ưu đãi, tỷ lệ giá/chất lượng, giảm giá số lượng; người thích tiện lợi: dịch vụ, giao hàng, dễ sử dụng.", "tr": "Moda bilinçli: güncel trendler, yeni koleksiyon, marka; fiyat bilinçli: kampanyalar, fiyat-performans oranı, toplu alım indirimi; rahatına düşkün: servis, teslimat, kolay kullanım.", "ar": "المهتم بالموضة: الصيحات الحالية، المجموعة الجديدة، العلامة التجارية؛ المهتم بالسعر: العروض، نسبة السعر إلى الجودة، خصم الكمية؛ الباحث عن الراحة: الخدمة، التوصيل، سهولة الاستخدام."}, "{0} hält zwei Modelle in der Hand: „Warum kostet das hier 20 Euro mehr?“": {"vi": "{0} cầm hai mẫu trên tay: „Tại sao cái này đắt hơn 20 euro?“", "tr": "{0} elinde iki model tutuyor: „Bu neden 20 euro daha pahalı?“", "ar": "تمسك {0} طرازين بيدها: „لماذا هذا أغلى بـ 20 يورو؟“"}, "Vergleichsmethode: zeigen, welchen Nutzen der Mehrpreis bringt": {"vi": "Phương pháp so sánh: cho thấy khoản chênh lệch giá mang lại lợi ích gì", "tr": "Karşılaştırma yöntemi: fiyat farkının hangi yararı sağladığını göstermek", "ar": "طريقة المقارنة: إظهار الفائدة التي يقدّمها فارق السعر"}, "„Für 20 Euro mehr bekommen Sie …“": {"vi": "„Với 20 euro thêm, bạn nhận được …“", "tr": "„20 euro fazlasıyla … alırsınız“", "ar": "„مقابل 20 يورو إضافية تحصلين على …“"}, "Ah, jetzt verstehe ich den Unterschied.": {"vi": "À, giờ tôi hiểu sự khác biệt rồi.", "tr": "Ha, şimdi farkı anladım.", "ar": "آه، الآن فهمت الفرق."}, "Okay, das ist ein Argument … aber 20 Euro sind 20 Euro.": {"vi": "Ừ, cũng là một lý lẽ … nhưng 20 euro vẫn là 20 euro.", "tr": "Tamam, bu bir argüman … ama 20 euro 20 euro.", "ar": "حسناً، هذه حجة … لكن 20 يورو تبقى 20 يورو."}, "Die Vergleichsmethode erklärt den Preis über einen Vergleich – hier über den zusätzlichen Nutzen.": {"vi": "Phương pháp so sánh giải thích giá thông qua việc so sánh – ở đây là lợi ích thêm.", "tr": "Karşılaştırma yöntemi fiyatı bir karşılaştırmayla açıklar – burada ek yarar üzerinden.", "ar": "طريقة المقارنة تشرح السعر بالمقارنة – هنا بالفائدة الإضافية."}, "„Das ist halt die Marke.“": {"vi": "„Đó là thương hiệu mà.“", "tr": "„Marka işte.“", "ar": "„هذه هي العلامة التجارية وخلاص.“"}, "Kurze Antwort": {"vi": "Câu trả lời ngắn", "tr": "Kısa cevap", "ar": "جواب قصير"}, "Und dafür soll ich mehr zahlen?": {"vi": "Và vì thế tôi phải trả nhiều hơn à?", "tr": "Ve bunun için daha mı fazla ödeyeceğim?", "ar": "وعلى هذا أدفع أكثر؟"}, "„Halt“ ist Umgangssprache, und ein Nutzen fehlt völlig.": {"vi": "„Halt“ là văn nói, và hoàn toàn thiếu lợi ích.", "tr": "„Halt“ günlük konuşma dilidir ve hiçbir yarar belirtilmiyor.", "ar": "„Halt“ من لغة الكلام العامية، ولا توجد فائدة مطلقاً."}, "„Nehmen Sie doch einfach das billigere.“": {"vi": "„Chị cứ lấy cái rẻ hơn đi.“", "tr": "„Siz daha ucuzunu alın.“", "ar": "„خذي الأرخص ببساطة.“"}, "Die Kundin soll nicht zu viel ausgeben.": {"vi": "Khách không nên chi quá nhiều.", "tr": "Müşteri fazla harcamamalı.", "ar": "يجب ألا تنفق الزبونة كثيراً."}, "Ist das billigere denn schlechter?": {"vi": "Cái rẻ hơn thì tệ hơn à?", "tr": "Ucuzu daha mı kötü?", "ar": "هل الأرخص أسوأ؟"}, "Okay … wenn Sie meinen.": {"vi": "Ừ … nếu bạn nói vậy.", "tr": "Tamam … siz öyle diyorsanız.", "ar": "حسناً … إن كنتَ ترى ذلك."}, "„Billig“ wertet ab, und du gibst die Beratung auf. Die Kundin soll den Unterschied verstehen und dann selbst entscheiden.": {"vi": "„Rẻ“ làm giảm giá trị, và bạn bỏ cuộc tư vấn. Khách cần hiểu sự khác biệt rồi tự quyết định.", "tr": "„Ucuz“ değer düşürür ve danışmanlığı bırakmış olursun. Müşteri farkı anlamalı ve sonra kendisi karar vermeli.", "ar": "كلمة „رخيص“ تقلّل القيمة وأنت تتخلّى عن الاستشارة. على الزبونة أن تفهم الفرق ثم تقرّر بنفسها."}, "Bau eine Antwort nach der Vergleichsmethode.": {"vi": "Hãy ghép một câu trả lời theo phương pháp so sánh.", "tr": "Karşılaştırma yöntemine göre bir cevap kur.", "ar": "كوّن جواباً وفق طريقة المقارنة."}, "Für 20 Euro mehr": {"vi": "Với 20 euro thêm", "tr": "20 euro fazlasıyla", "ar": "مقابل 20 يورو إضافية"}, "Nur 20 Euro mehr, das sind doch Peanuts –": {"vi": "Chỉ thêm 20 euro thôi, có đáng gì đâu –", "tr": "Sadece 20 euro fazla, bu da lafı mı olur –", "ar": "20 يورو فقط زيادة، هذا لا شيء –"}, "Umgangssprachlich und herablassend.": {"vi": "Văn nói và có vẻ coi thường.", "tr": "Günlük konuşma dili ve küçümseyici.", "ar": "عامّي ويبدو مستخفاً."}, "Verb": {"vi": "Động từ", "tr": "Fiil", "ar": "الفعل"}, "bekommen Sie": {"vi": "bạn nhận được", "tr": "alırsınız", "ar": "تحصلين على"}, "zahlen Sie halt": {"vi": "bạn trả thôi", "tr": "işte ödersiniz", "ar": "تدفعين فحسب"}, "„Halt“ ist Umgangssprache, und es fehlt der Nutzen.": {"vi": "„Halt“ là văn nói, và thiếu lợi ích.", "tr": "„Halt“ günlük konuşma dilidir ve yarar eksik.", "ar": "„Halt“ من لغة الكلام العامية، والفائدة مفقودة."}, "eben mehr.": {"vi": "thì trả nhiều hơn thôi.", "tr": "işte daha fazla ödersiniz.", "ar": "تدفعين أكثر فحسب."}, "Was genau? Ohne Nutzen überzeugt das nicht.": {"vi": "Cụ thể là gì? Không có lợi ích thì không thuyết phục.", "tr": "Tam olarak ne? Yarar olmadan ikna edici değil.", "ar": "ماذا بالضبط؟ دون فائدة لا يكون ذلك مقنعاً."}, "Erläutern Sie {0} in wörtlicher Rede, warum das eine Modell 20 Euro mehr kostet (Vergleichsmethode)!": {"vi": "Hãy giải thích với {0} bằng lời nói trực tiếp vì sao một mẫu đắt hơn 20 euro (phương pháp so sánh)!", "tr": "Bir modelin neden 20 euro daha pahalı olduğunu {0} doğrudan konuşma biçiminde açıklayın (karşılaştırma yöntemi)!", "ar": "اشرح لـ {0} بصيغة الكلام المباشر لماذا يكلّف أحد الطرازين 20 يورو أكثر (طريقة المقارنة)!"}, "Mehrpreis wird genannt": {"vi": "Có nêu khoản chênh lệch giá", "tr": "Fiyat farkı belirtilir", "ar": "يُذكر فارق السعر"}, "Nennen und beschreiben Sie eine weitere Methode der Preisnennung.": {"vi": "Hãy nêu và mô tả một phương pháp nêu giá khác.", "tr": "Fiyat bildirmenin bir yöntemini daha adlandırın ve açıklayın.", "ar": "اذكر طريقة أخرى لذكر السعر وصِفها."}, "Verkleinerungsmethode: Der Preis wird auf die Nutzungsdauer oder die Menge verteilt.": {"vi": "Phương pháp chia nhỏ: giá được chia theo thời gian sử dụng hoặc số lượng.", "tr": "Küçültme yöntemi: Fiyat kullanım süresine veya miktara bölünür.", "ar": "طريقة التجزئة: يُوزَّع السعر على مدة الاستخدام أو الكمية."}, "Rabattmethode: Man gibt immer sofort 10 Prozent.": {"vi": "Phương pháp giảm giá: luôn giảm ngay 10 phần trăm.", "tr": "İndirim yöntemi: Her zaman hemen yüzde 10 indirim yapılır.", "ar": "طريقة التخفيض: يُمنح دائماً خصم 10 بالمئة فوراً."}, "Schweigemethode: Man nennt den Preis gar nicht.": {"vi": "Phương pháp im lặng: không nói giá gì cả.", "tr": "Sessizlik yöntemi: Fiyat hiç söylenmez.", "ar": "طريقة الصمت: لا يُذكر السعر إطلاقاً."}, "Es gibt verschiedene Techniken, den Preis zu nennen. Nennen und beschreiben Sie 2 verkaufsorientierte Techniken!": {"vi": "Có nhiều kỹ thuật nêu giá. Hãy nêu và mô tả 2 kỹ thuật theo hướng bán hàng!", "tr": "Fiyat bildirmenin çeşitli teknikleri vardır. Satış odaklı 2 tekniği adlandırın ve açıklayın!", "ar": "هناك تقنيات متعددة لذكر السعر. اذكر وصِف تقنيتين موجّهتين نحو البيع!"}, "Sandwich (Argument – Preis – Argument); Verzögerung (Argumente zuerst, Preis am Ende); Zerlegung (Preise der Teile); Verkleinerung (Preis pro Tag oder Stück); Vergleich (Preis im Vergleich zu einem bekannten Produkt).": {"vi": "Sandwich (lý lẽ – giá – lý lẽ); trì hoãn (nêu lý lẽ trước, giá ở cuối); tách nhỏ (giá từng phần); chia nhỏ (giá theo ngày hoặc theo chiếc); so sánh (giá so với một sản phẩm quen thuộc).", "tr": "Sandviç (argüman – fiyat – argüman); erteleme (önce argümanlar, fiyat sonda); parçalara ayırma (parçaların fiyatları); küçültme (gün veya adet başına fiyat); karşılaştırma (fiyatı bilinen bir ürünle kıyaslama).", "ar": "الساندويتش (حجة – سعر – حجة)؛ التأجيل (الحجج أولاً والسعر في النهاية)؛ التفكيك (أسعار الأجزاء)؛ التجزئة (السعر لكل يوم أو قطعة)؛ المقارنة (السعر مقارنة بمنتج معروف)."}, "{0} fragt gleich am Anfang: „Was kostet {1}?“ Du weißt noch gar nicht, was gebraucht wird.": {"vi": "Ngay từ đầu {0} hỏi: „{1} giá bao nhiêu?“ Bạn còn chưa biết khách cần gì.", "tr": "{0} hemen başta soruyor: „{1} ne kadar?“ Neye ihtiyaç olduğunu henüz bilmiyorsunuz.", "ar": "تسأل {0} منذ البداية: „كم سعر {1}؟“ وأنت لا تعرف بعد ما الذي تحتاجه."}, "Verzögerungsmethode: erst den Nutzen klären, den Preis danach nennen": {"vi": "Phương pháp trì hoãn: làm rõ lợi ích trước, nêu giá sau", "tr": "Erteleme yöntemi: önce yararı netleştir, fiyatı sonra söyle", "ar": "طريقة التأجيل: وضّح الفائدة أولاً ثم اذكر السعر"}, "„Das hängt davon ab … darf ich kurz fragen …?“": {"vi": "„Điều đó còn tùy … cho phép tôi hỏi nhanh một câu …?“", "tr": "„Bu duruma bağlı … kısaca bir şey sorabilir miyim …?“", "ar": "„هذا يعتمد … هل لي أن أسأل سؤالاً سريعاً …؟“"}, "Gute Idee, fragen Sie ruhig.": {"vi": "Ý hay, bạn cứ hỏi đi.", "tr": "İyi fikir, çekinmeden sorun.", "ar": "فكرة جيدة، اسأل بكل راحة."}, "Ich wollte eigentlich nur den Preis wissen …": {"vi": "Thật ra tôi chỉ muốn biết giá thôi …", "tr": "Aslında sadece fiyatı öğrenmek istemiştim …", "ar": "في الحقيقة أردت معرفة السعر فقط …"}, "Okay, aber sagen Sie mir bitte auch den Preis.": {"vi": "Được, nhưng làm ơn cũng cho tôi biết giá.", "tr": "Tamam, ama lütfen fiyatı da söyleyin.", "ar": "حسناً، لكن أخبرني بالسعر أيضاً من فضلك."}, "Bei der Verzögerungsmethode nennst du erst Argumente und den Preis am Ende. Wer es sehr eilig hat, bekommt den Preis aber besser gleich – mit Nutzen.": {"vi": "Với phương pháp trì hoãn, bạn nêu lý lẽ trước và giá ở cuối. Nhưng với người đang rất vội thì nên nêu giá ngay – kèm lợi ích.", "tr": "Erteleme yönteminde önce argümanları, fiyatı sonda söylersin. Ama çok acelesi olana fiyatı hemen – yararla birlikte – söylemek daha iyidir.", "ar": "في طريقة التأجيل تذكر الحجج أولاً والسعر في النهاية. لكن من هو على عجلة شديدة يُفضَّل أن يحصل على السعر فوراً – مع الفائدة."}, "Sofort das Sandwich: Nutzen – Preis – Nutzen": {"vi": "Dùng sandwich ngay: lợi ích – giá – lợi ích", "tr": "Hemen sandviç: yarar – fiyat – yarar", "ar": "الساندويتش فوراً: فائدة – سعر – فائدة"}, "Den Preis gleich verpacken.": {"vi": "Gói giá vào ngay.", "tr": "Fiyatı hemen paketlemek.", "ar": "تغليف السعر فوراً."}, "Ah, verstehe.": {"vi": "À, tôi hiểu rồi.", "tr": "Ha, anladım.", "ar": "آه، فهمت."}, "Perfekt, danke – schnell und klar.": {"vi": "Tuyệt, cảm ơn – nhanh và rõ ràng.", "tr": "Harika, teşekkürler – hızlı ve net.", "ar": "ممتاز، شكراً – سريع وواضح."}, "Gut bei Kundschaft, die es eilig hat oder schon verglichen hat. Sonst kennst du den Bedarf noch nicht.": {"vi": "Tốt với khách đang vội hoặc đã so sánh rồi. Còn lại thì bạn chưa biết nhu cầu.", "tr": "Acelesi olan veya zaten karşılaştırma yapmış müşteride iyidir. Aksi halde ihtiyacı henüz bilmiyorsun.", "ar": "جيّد مع الزبائن المستعجلين أو الذين قارنوا مسبقاً. وإلا فأنت لا تعرف الحاجة بعد."}, "„Puh, ganz schön teuer, ehrlich gesagt.“": {"vi": "„Ôi, nói thật là khá đắt đấy.“", "tr": "„Off, dürüst olmak gerekirse oldukça pahalı.“", "ar": "„أوف، بصراحة غالٍ جداً.“"}, "Ehrlichkeit zahlt sich aus.": {"vi": "Thành thật sẽ được đền đáp.", "tr": "Dürüstlük kazandırır.", "ar": "الصدق يؤتي ثماره."}, "Oh. Dann lass ich es wohl lieber.": {"vi": "Ồ. Vậy chắc tôi thôi vậy.", "tr": "Oh. O zaman vazgeçeyim bari.", "ar": "أوه. إذن أفضّل أن أتركه."}, "Damit löst du den Preisschock selbst aus – noch bevor die Kundin den Nutzen kennt.": {"vi": "Như vậy chính bạn gây ra cú sốc giá – trước cả khi khách biết lợi ích.", "tr": "Böylece fiyat şokunu kendin yaratmış olursun – müşteri yararı daha bilmeden.", "ar": "بذلك تتسبّب أنت نفسك في صدمة السعر – قبل أن تعرف الزبونة الفائدة."}, "Bau eine Antwort nach der Verzögerungsmethode.": {"vi": "Hãy ghép một câu trả lời theo phương pháp trì hoãn.", "tr": "Erteleme yöntemine göre bir cevap kur.", "ar": "كوّن جواباً وفق طريقة التأجيل."}, "Das hängt davon ab,": {"vi": "Điều đó còn tùy", "tr": "Bu duruma bağlı,", "ar": "هذا يعتمد على"}, "Keine Ahnung,": {"vi": "Tôi không biết,", "tr": "Bilmiyorum,", "ar": "لا أدري،"}, "Wirkt unwissend – Warenkenntnisse schaffen Vertrauen.": {"vi": "Có vẻ không am hiểu – hiểu biết hàng hóa tạo niềm tin.", "tr": "Bilgisiz görünür – ürün bilgisi güven yaratır.", "ar": "يبدو جاهلاً – معرفة السلع تخلق الثقة."}, "welches Modell am besten zu Ihnen passt.": {"vi": "mẫu nào hợp với bạn nhất.", "tr": "hangi modelin size en çok uyduğuna.", "ar": "أيّ طراز يناسبك أكثر."}, "ob Sie sich das leisten können.": {"vi": "bạn có đủ khả năng mua hay không.", "tr": "bunu karşılayıp karşılayamayacağınıza.", "ar": "هل تستطيعين تحمّل ثمنه."}, "Herablassend.": {"vi": "Trịch thượng.", "tr": "Küçümseyici.", "ar": "متعالٍ."}, "Darf ich Sie kurz fragen, wofür Sie es nutzen möchten?": {"vi": "Cho phép tôi hỏi nhanh: bạn định dùng nó vào việc gì?", "tr": "Kısaca sorabilir miyim, ne için kullanmak istiyorsunuz?", "ar": "هل لي أن أسألك سريعاً: لأيّ غرض تريدين استخدامه؟"}, "Das sag ich Ihnen später.": {"vi": "Tôi sẽ nói cho bạn sau.", "tr": "Size sonra söylerim.", "ar": "سأخبرك لاحقاً."}, "Abweisend – die Kundin fühlt sich hingehalten.": {"vi": "Gạt đi – khách cảm thấy bị lảng tránh.", "tr": "Reddedici – müşteri oyalandığını hisseder.", "ar": "صدّ للزبونة – تشعر بأنّها تُماطَل."}, "{0} fragt sofort nach dem Preis. Formulieren Sie in wörtlicher Rede eine höfliche Antwort, mit der Sie die Preisnennung verzögern!": {"vi": "{0} hỏi giá ngay lập tức. Hãy viết một câu trả lời lịch sự bằng lời nói trực tiếp để trì hoãn việc nêu giá!", "tr": "{0} hemen fiyatı soruyor. Fiyat bildirimini erteleyen nazik bir cevabı doğrudan konuşma biçiminde yazın!", "ar": "تسأل {0} عن السعر فوراً. صُغ جواباً مهذباً بصيغة الكلام المباشر لتأجيل ذكر السعر!"}, "eine Frage zum Bedarf („?“)": {"vi": "một câu hỏi về nhu cầu („?“)", "tr": "ihtiyaca yönelik bir soru („?“)", "ar": "سؤال عن الحاجة („؟“)"}, "Beschreiben Sie die Verzögerungsmethode.": {"vi": "Hãy mô tả phương pháp trì hoãn.", "tr": "Erteleme yöntemini açıklayın.", "ar": "صِف طريقة التأجيل."}, "Erst werden Argumente genannt, der Preis kommt am Ende.": {"vi": "Trước tiên nêu các lý lẽ, giá để ở cuối.", "tr": "Önce argümanlar söylenir, fiyat sonda gelir.", "ar": "تُذكر الحجج أولاً ويأتي السعر في النهاية."}, "Der Preis wird absichtlich falsch genannt.": {"vi": "Giá được cố tình nêu sai.", "tr": "Fiyat kasıtlı olarak yanlış söylenir.", "ar": "يُذكر السعر خطأً عن قصد."}, "Die Kundin muss bis morgen auf den Preis warten.": {"vi": "Khách phải chờ đến ngày mai mới biết giá.", "tr": "Müşteri fiyat için yarına kadar beklemek zorundadır.", "ar": "على الزبونة الانتظار حتى الغد لمعرفة السعر."}, "{0} sagt: „Ich weiß nicht, ob {1} wirklich lange hält.“": {"vi": "{0} nói: „Tôi không biết {1} có thật sự bền không.“", "tr": "{0} diyor ki: „{1} gerçekten uzun dayanır mı bilmiyorum.“", "ar": "تقول {0}: „لا أعرف إن كان {1} يدوم طويلاً حقاً.“"}, "Ja-Aber mit Beweis: zustimmen, dann Material und Verarbeitung zeigen": {"vi": "„Vâng-nhưng“ có chứng minh: đồng ý trước, rồi cho xem chất liệu và độ hoàn thiện", "tr": "Kanıtlı Evet-Ama: önce katıl, sonra malzemeyi ve işçiliği göster", "ar": "„نعم-لكن“ مع إثبات: وافق أولاً ثم أرِ الخامة وجودة الصنع"}, "„Gut, dass Sie das fragen …“": {"vi": "„Rất vui là bạn hỏi điều đó …“", "tr": "„Bunu sormanız çok iyi oldu …“", "ar": "„من الجيد أنّك سألتِ ذلك …“"}, "Ah, das sieht wirklich solide aus.": {"vi": "À, trông chắc chắn thật đấy.", "tr": "Ha, gerçekten sağlam görünüyor.", "ar": "آه، يبدو متيناً حقاً."}, "Ein Einwand gegen die Qualität wird ernst genommen und mit einem neuen Argument entkräftet – am besten zum Anfassen.": {"vi": "Ý kiến phản đối về chất lượng được xem trọng và được bác bỏ bằng một lý lẽ mới – tốt nhất là để khách sờ tận tay.", "tr": "Kaliteye yönelik bir itiraz ciddiye alınır ve yeni bir argümanla çürütülür – en iyisi dokunarak.", "ar": "يُؤخذ الاعتراض على الجودة على محمل الجد ويُفنَّد بحجة جديدة – والأفضل بشيء ملموس."}, "„Doch, natürlich hält das! Alles andere ist Quatsch.“": {"vi": "„Có chứ, tất nhiên là bền! Nói khác đi là vớ vẩn.“", "tr": "„Tabii ki dayanır! Aksi saçmalık.“", "ar": "„بالطبع يدوم! غير ذلك هراء.“"}, "Mit Überzeugung": {"vi": "Với sự tin chắc", "tr": "İkna olmuş bir şekilde", "ar": "بقناعة"}, "(zieht die Augenbrauen hoch) Na, wenn Sie meinen …": {"vi": "(nhướng mày) Ừ, nếu bạn nghĩ vậy …", "tr": "(kaşlarını kaldırır) Eh, siz öyle diyorsanız …", "ar": "(ترفع حاجبيها) حسناً، إن كنتَ ترى ذلك …"}, "Direkter Widerspruch – die Kundin verliert ihr Gesicht. „Quatsch“ ist außerdem Umgangssprache.": {"vi": "Phản bác thẳng – khách mất mặt. Ngoài ra „Quatsch“ (vớ vẩn) là văn nói.", "tr": "Doğrudan itiraz – müşteri yüzünü kaybeder. Ayrıca „Quatsch“ (saçma) günlük konuşma dilidir.", "ar": "اعتراض مباشر – تفقد الزبونة ماء وجهها. كما أنّ „Quatsch“ (هراء) من لغة الكلام العامية."}, "Gegenfrage: „Was genau macht Sie unsicher?“": {"vi": "Hỏi ngược lại: „Chính xác điều gì khiến bạn lo?“", "tr": "Karşı soru: „Sizi tam olarak ne tereddüde düşürüyor?“", "ar": "سؤال مضاد: „ما الذي يجعلك غير متأكدة بالضبط؟“"}, "Erst verstehen": {"vi": "Hiểu trước đã", "tr": "Önce anlamak", "ar": "الفهم أولاً"}, "Na ja, mein letztes ging schnell kaputt.": {"vi": "Thì … cái trước của tôi hỏng nhanh lắm.", "tr": "Şey, bir öncekim çabuk bozuldu.", "ar": "حسناً، السابق عندي تعطّل سريعاً."}, "Ach, ich will jetzt nicht lange erzählen.": {"vi": "Thôi, giờ tôi không muốn kể dài.", "tr": "Ah, şimdi uzun uzun anlatmak istemiyorum.", "ar": "آه، لا أريد أن أحكي طويلاً الآن."}, "Mit der Gegenfrage findest du den echten Grund für den Einwand. Danach brauchst du aber noch ein Argument.": {"vi": "Câu hỏi ngược giúp bạn tìm ra lý do thật của sự phản đối. Nhưng sau đó bạn vẫn cần thêm một lý lẽ.", "tr": "Karşı soruyla itirazın gerçek nedenini bulursun. Ama sonrasında yine de bir argümana ihtiyacın var.", "ar": "بالسؤال المضاد تجد السبب الحقيقي للاعتراض. لكنك تحتاج بعد ذلك إلى حجة أيضاً."}, "Bau eine Gegenfrage.": {"vi": "Hãy ghép một câu hỏi ngược.", "tr": "Bir karşı soru kur.", "ar": "كوّن سؤالاً مضاداً."}, "Was genau": {"vi": "Chính xác điều gì", "tr": "Tam olarak ne", "ar": "ما الذي بالضبط"}, "Warum zum Kuckuck": {"vi": "Tại sao quái gì", "tr": "Neden Allah aşkına", "ar": "لماذا بحق السماء"}, "Umgangssprachlich und gereizt.": {"vi": "Văn nói và cáu kỉnh.", "tr": "Günlük konuşma dili ve sinirli.", "ar": "عامّي ومنزعج."}, "macht Sie": {"vi": "khiến bạn", "tr": "sizi", "ar": "يجعلك"}, "nervt Sie": {"vi": "làm bạn bực", "tr": "sizi sinirlendiriyor", "ar": "يزعجك"}, "Umgangssprache.": {"vi": "Văn nói.", "tr": "Günlük konuşma dili.", "ar": "لغة عامّية."}, "dabei unsicher?": {"vi": "không chắc chắn vậy?", "tr": "bu konuda emin değil?", "ar": "غير متأكدة في ذلك؟"}, "schon wieder?": {"vi": "lại nữa à?", "tr": "yine mi?", "ar": "مرة أخرى؟"}, "{0} sagt: „Ich weiß nicht, ob {1} wirklich lange hält.“ Formulieren Sie eine verkaufsfördernde Antwort in wörtlicher Rede und benennen Sie die Methode!": {"vi": "{0} nói: „Tôi không biết {1} có thật sự bền không.“ Hãy viết một câu trả lời thúc đẩy bán hàng bằng lời nói trực tiếp và nêu tên phương pháp!", "tr": "{0} diyor ki: „{1} gerçekten uzun dayanır mı bilmiyorum.“ Satışı destekleyen bir cevabı doğrudan konuşma biçiminde yazın ve yöntemi adlandırın!", "ar": "تقول {0}: „لا أعرف إن كان {1} يدوم طويلاً حقاً.“ صُغ جواباً يدعم البيع بصيغة الكلام المباشر وسمِّ الطريقة!"}, "kein Widerspruch wie „Quatsch“ oder „stimmt nicht“": {"vi": "không phản bác như „Quatsch“ (vớ vẩn) hoặc „stimmt nicht“ (không đúng)", "tr": "„Quatsch“ (saçma) veya „stimmt nicht“ (doğru değil) gibi bir karşı çıkış yok", "ar": "لا اعتراض مباشر مثل „Quatsch“ (هراء) أو „stimmt nicht“ (غير صحيح)"}, "Gegen welche Aspekte außer dem Preis können sich Einwände richten?": {"vi": "Ý kiến phản đối có thể nhằm vào những khía cạnh nào ngoài giá?", "tr": "İtirazlar fiyatın dışında hangi hususlara yönelebilir?", "ar": "ضدّ أيّ جوانب غير السعر يمكن أن تتوجه الاعتراضات؟"}, "gegen den Artikel, das Sortiment, das Unternehmen, die Marke oder den Verkäufer": {"vi": "nhằm vào mặt hàng, danh mục hàng, doanh nghiệp, thương hiệu hoặc nhân viên bán hàng", "tr": "ürüne, ürün yelpazesine, işletmeye, markaya veya satış elemanına", "ar": "ضدّ السلعة أو تشكيلة البضائع أو المنشأة أو العلامة التجارية أو البائع"}, "nur gegen das Wetter": {"vi": "chỉ nhằm vào thời tiết", "tr": "sadece havaya", "ar": "ضدّ الطقس فقط"}, "nur gegen die Öffnungszeiten": {"vi": "chỉ nhằm vào giờ mở cửa", "tr": "sadece çalışma saatlerine", "ar": "ضدّ ساعات الدوام فقط"}, "Kunden äußern Einwände nicht nur gegen den Preis. Nennen Sie 3 weitere Aspekte, gegen die sich Einwände richten können!": {"vi": "Khách phản đối không chỉ về giá. Hãy nêu thêm 3 khía cạnh mà ý kiến phản đối có thể nhằm vào!", "tr": "Müşteriler yalnızca fiyata itiraz etmez. İtirazların yönelebileceği 3 hususu daha sayın!", "ar": "لا يعترض الزبائن على السعر فقط. اذكر 3 جوانب أخرى يمكن أن تتوجه إليها الاعتراضات!"}, "z. B. gegen das Sortiment, den Artikel, das Unternehmen, die Marke, den Verkäufer, die Lieferzeit.": {"vi": "ví dụ nhằm vào danh mục hàng, mặt hàng, doanh nghiệp, thương hiệu, nhân viên bán hàng, thời gian giao hàng.", "tr": "örn. ürün yelpazesine, ürüne, işletmeye, markaya, satış elemanına, teslim süresine.", "ar": "مثلاً ضدّ تشكيلة البضائع أو السلعة أو المنشأة أو العلامة التجارية أو البائع أو مدة التوصيل."}, "{0} hält {1} fest in der Hand und sagt: „Ich muss mir das noch mal überlegen.“": {"vi": "{0} cầm chặt {1} trong tay và nói: „Tôi phải suy nghĩ thêm đã.“", "tr": "{0} {1} sıkıca elinde tutuyor ve şöyle diyor: „Bir daha düşünmem gerek.“", "ar": "تمسك {0} {1} بيدها بإحكام وتقول: „عليّ أن أفكر في الأمر مرة أخرى.“"}, "Freundlich nachfragen, was noch fehlt – und Zurücklegen anbieten": {"vi": "Hỏi lại thân thiện xem còn thiếu gì – và đề nghị giữ hàng", "tr": "Samimiyetle neyin eksik olduğunu sormak – ve ayırmayı önermek", "ar": "السؤال بلطف عمّا ينقص – وعرض حجز السلعة"}, "Den echten Grund finden.": {"vi": "Tìm ra lý do thật.", "tr": "Gerçek nedeni bulmak.", "ar": "إيجاد السبب الحقيقي."}, "Ehrlich gesagt bin ich mir bei der Farbe nicht sicher …": {"vi": "Nói thật là tôi chưa chắc về màu sắc …", "tr": "Dürüst olmak gerekirse rengi konusunda emin değilim …", "ar": "بصراحة لست متأكدة من اللون …"}, "Na ja, eigentlich ist es nur der Preis.": {"vi": "Thì … thật ra chỉ là vì giá.", "tr": "Şey, aslında sadece fiyat.", "ar": "حسناً، في الحقيقة هو السعر فقط."}, "Zurücklegen bis morgen wäre gut.": {"vi": "Giữ hàng đến ngày mai thì tốt.", "tr": "Yarına kadar ayırmanız iyi olur.", "ar": "حجزها حتى الغد سيكون جيداً."}, "„Ich überlege es mir noch“ ist oft ein Vorwand. Nachfragen bringt den echten Grund ans Licht; Zurücklegen erleichtert die Entscheidung.": {"vi": "„Tôi sẽ suy nghĩ thêm“ thường chỉ là cái cớ. Hỏi lại sẽ làm lộ lý do thật; giữ hàng giúp quyết định dễ hơn.", "tr": "„Bir daha düşüneceğim“ çoğu zaman bir bahanedir. Sormak gerçek nedeni ortaya çıkarır; ayırmak karar vermeyi kolaylaştırır.", "ar": "„سأفكر في الأمر“ غالباً ما تكون ذريعة. السؤال يكشف السبب الحقيقي؛ والحجز يسهّل اتخاذ القرار."}, "„Klar, kommen Sie einfach wieder.“ – und weggehen": {"vi": "„Được thôi, cứ quay lại nhé.“ – rồi bỏ đi", "tr": "„Tabii, istediğinizde tekrar gelin.“ – ve uzaklaşmak", "ar": "„بالطبع، عودي متى شئتِ.“ – والانصراف"}, "Nicht aufdringlich sein.": {"vi": "Không được làm phiền.", "tr": "Ağır basmamak lazım.", "ar": "عدم الإلحاح."}, "(legt die Ware zurück und geht)": {"vi": "(đặt hàng lại và đi)", "tr": "(malı geri koyar ve gider)", "ar": "(تعيد السلعة وتنصرف)"}, "Höflich, aber du findest nicht heraus, was der Kundin fehlt. Die Chance ist meist vertan.": {"vi": "Lịch sự, nhưng bạn không biết khách còn thiếu gì. Cơ hội thường đã mất.", "tr": "Nazik, ama müşterinin neyi eksik bulduğunu öğrenemezsin. Fırsat çoğunlukla kaçmıştır.", "ar": "مهذّب، لكنك لا تعرف ما ينقص الزبونة. غالباً ما تضيع الفرصة."}, "Druck machen: „Morgen ist das weg!“": {"vi": "Gây áp lực: „Ngày mai hết hàng đấy!“", "tr": "Baskı yapmak: „Yarın bitmiş olur!“", "ar": "الضغط: „غداً سينفد!“"}, "Ein bisschen Tempo schadet nicht.": {"vi": "Nhanh một chút cũng không hại.", "tr": "Biraz tempo zarar vermez.", "ar": "قليل من السرعة لا يضرّ."}, "(legt die Ware weg) So lasse ich mich nicht unter Druck setzen.": {"vi": "(đặt hàng xuống) Tôi không để bị ép như vậy đâu.", "tr": "(malı bırakır) Böyle baskı altına alınmam.", "ar": "(تضع السلعة) لن أسمح بأن يُضغط عليّ هكذا."}, "Druck zerstört Vertrauen – und ist oft gar nicht wahr.": {"vi": "Áp lực phá hủy lòng tin – và nhiều khi còn không đúng sự thật.", "tr": "Baskı güveni yok eder – ve çoğu zaman doğru bile değildir.", "ar": "الضغط يدمّر الثقة – وغالباً لا يكون صحيحاً أصلاً."}, "Bau eine Antwort auf „Ich überlege es mir noch“.": {"vi": "Hãy ghép một câu trả lời cho „Tôi sẽ suy nghĩ thêm“.", "tr": "„Bir daha düşüneceğim“ için bir cevap kur.", "ar": "كوّن جواباً على „سأفكر في الأمر“."}, "Selbstverständlich,": {"vi": "Dĩ nhiên rồi,", "tr": "Elbette,", "ar": "بالتأكيد،"}, "Na toll,": {"vi": "Hay đấy,", "tr": "Çok güzel,", "ar": "رائع،"}, "Genervt und unhöflich.": {"vi": "Bực bội và bất lịch sự.", "tr": "Sinirli ve kaba.", "ar": "منزعج وغير مهذّب."}, "darf ich fragen, was Ihnen noch fehlt?": {"vi": "cho phép tôi hỏi bạn còn thiếu gì không?", "tr": "size neyin eksik olduğunu sorabilir miyim?", "ar": "هل لي أن أسأل ما الذي ينقصك بعد؟"}, "aber dann ist es vielleicht weg.": {"vi": "nhưng sau đó có thể nó sẽ hết.", "tr": "ama o zaman belki kalmaz.", "ar": "لكن عندها ربما ينفد."}, "Das ist Druck.": {"vi": "Đó là gây áp lực.", "tr": "Bu baskıdır.", "ar": "هذا ضغط."}, "Ich kann {0} auch gern bis morgen für Sie zurücklegen.": {"vi": "Tôi cũng sẵn lòng giữ {0} cho bạn đến ngày mai.", "tr": "{0} yarına kadar sizin için memnuniyetle ayırabilirim.", "ar": "يمكنني أيضاً أن أحجز {0} لك حتى الغد بكل سرور."}, "Sie wissen ja, wo die Tür ist.": {"vi": "Bạn biết cửa ở đâu rồi đấy.", "tr": "Kapının nerede olduğunu biliyorsunuz.", "ar": "أنتِ تعرفين أين الباب."}, "Abweisend.": {"vi": "Gạt đi.", "tr": "Reddedici.", "ar": "صدّ."}, "{0} ist noch unentschlossen. Schlagen Sie 3 Möglichkeiten vor, wie Sie {1} bei der Kaufentscheidung unterstützen können!": {"vi": "{0} vẫn còn lưỡng lự. Hãy đề xuất 3 cách để bạn hỗ trợ {1} quyết định mua!", "tr": "{0} hâlâ kararsız. {1} satın alma kararında destek olabileceğiniz 3 yol önerin!", "ar": "ما زالت {0} مترددة. اقترح 3 طرق لدعم {1} في قرار الشراء!"}, "Ihre drei Möglichkeiten": {"vi": "Ba cách của bạn", "tr": "Üç yolunuz", "ar": "طرقك الثلاث"}, "Zurücklegen oder Reservieren": {"vi": "Giữ hàng hoặc đặt trước", "tr": "Ayırmak veya rezerve etmek", "ar": "الحجز أو الاحتفاظ بالسلعة"}, "Umtausch oder Service": {"vi": "Đổi hàng hoặc dịch vụ", "tr": "Değişim veya servis", "ar": "الاستبدال أو الخدمة"}, "Auswahl einengen, Argumente zusammenfassen oder Empfehlung": {"vi": "Thu hẹp lựa chọn, tóm tắt các lý lẽ hoặc đưa lời khuyên", "tr": "Seçimi daraltmak, argümanları özetlemek veya tavsiye vermek", "ar": "تضييق الخيارات أو تلخيص الحجج أو تقديم توصية"}, "Was ist ein Vorwand?": {"vi": "„Vorwand“ (cái cớ) là gì?", "tr": "„Vorwand“ (bahane) nedir?", "ar": "ما هي „Vorwand“ (الذريعة)؟"}, "Ein vorgeschobener Grund, hinter dem der eigentliche Grund steckt.": {"vi": "Một lý do được đưa ra làm bình phong, đằng sau là lý do thật.", "tr": "Asıl nedenin arkasında saklandığı, ileri sürülen bir neden.", "ar": "سبب يُقدَّم كغطاء، وخلفه السبب الحقيقي."}, "Ein Einwand gegen die Wand im Laden.": {"vi": "Một sự phản đối nhằm vào bức tường trong cửa hàng.", "tr": "Mağazadaki duvara yönelik bir itiraz.", "ar": "اعتراض على الجدار في المتجر."}, "Eine Frage nach dem Preis.": {"vi": "Một câu hỏi về giá.", "tr": "Fiyatla ilgili bir soru.", "ar": "سؤال عن السعر."}, "Der Kunde kann sich zwischen zwei Taschen nicht entscheiden. Schlagen Sie 3 Möglichkeiten vor, wie Sie ihn bei seiner Kaufentscheidung unterstützen können!": {"vi": "Khách nam không quyết định được giữa hai chiếc túi. Hãy đề xuất 3 cách để bạn hỗ trợ anh ấy quyết định mua!", "tr": "Müşteri iki çanta arasında karar veremiyor. Satın alma kararında ona destek olabileceğiniz 3 yol önerin!", "ar": "لا يستطيع الزبون الاختيار بين حقيبتين. اقترح 3 طرق لدعمه في قرار الشراء!"}, "z. B. wichtigste Argumente zusammenfassen; Auswahl einengen; Nutzen hervorheben; Empfehlung aussprechen; Umtausch oder Gutschein anbieten; Zurücklegen anbieten.": {"vi": "ví dụ tóm tắt các lý lẽ quan trọng nhất; thu hẹp lựa chọn; nhấn mạnh lợi ích; đưa lời khuyên; đề nghị đổi hàng hoặc phiếu quà; đề nghị giữ hàng.", "tr": "örn. en önemli argümanları özetlemek; seçimi daraltmak; yararı vurgulamak; tavsiye vermek; değişim veya hediye çeki önermek; ayırmayı önermek.", "ar": "مثلاً تلخيص أهم الحجج؛ تضييق الخيارات؛ إبراز الفائدة؛ تقديم توصية؛ عرض الاستبدال أو قسيمة؛ عرض حجز السلعة."}, "{0} fragt nach einem bestimmten Modell. Genau dieses führt ihr nicht.": {"vi": "{0} hỏi về một mẫu cụ thể. Cửa hàng bạn không bán đúng mẫu đó.", "tr": "{0} belirli bir model soruyor. Tam olarak bunu satmıyorsunuz.", "ar": "تسأل {0} عن طراز محدد. أنتم لا تبيعون هذا الطراز بالذات."}, "Alternativangebot mit gleichem Standard – und mit Nutzen": {"vi": "Đề xuất sản phẩm thay thế cùng tiêu chuẩn – kèm lợi ích", "tr": "Aynı standartta alternatif teklif – yararıyla birlikte", "ar": "عرض بديل بنفس المستوى – مع ذكر الفائدة"}, "„Dieses Modell führen wir nicht, aber …“": {"vi": "„Chúng tôi không có mẫu này, nhưng …“", "tr": "„Bu modeli satmıyoruz, ama …“", "ar": "„لا نبيع هذا الطراز، لكن …“"}, "Oh, das ist ja auch schön. Zeigen Sie mal.": {"vi": "Ồ, cái này cũng đẹp. Cho tôi xem thử.", "tr": "Oh, bu da güzelmiş. Bir bakayım.", "ar": "أوه، هذا جميل أيضاً. أرني إياه."}, "Ein Alternativangebot nur mit gleichem oder höherem Standard – und überzeugend formuliert.": {"vi": "Chỉ đề xuất sản phẩm thay thế cùng hoặc cao hơn tiêu chuẩn – và diễn đạt có sức thuyết phục.", "tr": "Alternatif teklif yalnızca aynı veya daha yüksek standartta yapılır – ve ikna edici biçimde ifade edilir.", "ar": "لا يُعرض بديل إلا بنفس المستوى أو أعلى – وبصياغة مقنعة."}, "„Leider nicht. Ich kann Ihnen höchstens das hier zeigen, weiß aber nicht, ob es Ihnen gefällt.“": {"vi": "„Tiếc là không có. Tôi chỉ có thể cho bạn xem cái này, nhưng không biết bạn có thích không.“", "tr": "„Maalesef yok. Size en fazla bunu gösterebilirim, ama beğenir misiniz bilmiyorum.“", "ar": "„للأسف لا. أستطيع أن أريك هذا على الأكثر، لكنني لا أعرف إن كان سيعجبك.“"}, "Ehrlich bleiben.": {"vi": "Giữ sự trung thực.", "tr": "Dürüst kalmak.", "ar": "البقاء صادقاً."}, "Na, wenn Sie selbst nicht überzeugt sind …": {"vi": "Ồ, nếu chính bạn còn không tin …", "tr": "Eh, kendiniz ikna olmamışsanız …", "ar": "حسناً، إن لم تكوني أنتِ نفسك مقتنعة …"}, "Typisch für die Prüfung: Die Alternative wird schlecht gemacht, es fehlen Argumente, die Verkäuferin wirkt selbst nicht überzeugt.": {"vi": "Điển hình trong kỳ thi: sản phẩm thay thế bị chê, thiếu lý lẽ, nhân viên bán hàng tỏ ra không tin tưởng.", "tr": "Sınavda tipik: Alternatif kötülenir, argüman eksiktir, satış elemanı kendisi ikna olmamış görünür.", "ar": "نموذجي في الامتحان: يُنتقَص من البديل، وتنقص الحجج، ويبدو البائع نفسه غير مقتنع."}, "„Haben wir leider nicht, aber ich kann es für Sie bestellen.“": {"vi": "„Rất tiếc chúng tôi không có, nhưng tôi có thể đặt hàng cho bạn.“", "tr": "„Maalesef yok, ama sizin için sipariş edebilirim.“", "ar": "„للأسف ليس لدينا، لكن يمكنني طلبه لك.“"}, "Service anbieten": {"vi": "Đề nghị dịch vụ", "tr": "Servis önermek", "ar": "عرض خدمة"}, "Das wäre nett.": {"vi": "Vậy thì tốt quá.", "tr": "Bu güzel olur.", "ar": "سيكون ذلك لطيفاً."}, "Ich brauche es aber heute.": {"vi": "Nhưng tôi cần nó hôm nay.", "tr": "Ama bugün lazım.", "ar": "لكنني أحتاجه اليوم."}, "Bestellen kann ich auch selbst im Internet.": {"vi": "Tôi cũng tự đặt hàng trên mạng được.", "tr": "Ben de internetten kendim sipariş verebilirim.", "ar": "أستطيع الطلب بنفسي عبر الإنترنت أيضاً."}, "Ein guter Service – aber wer es heute braucht, wäre mit einem passenden Alternativangebot besser bedient.": {"vi": "Dịch vụ tốt – nhưng ai cần hôm nay thì sẽ được phục vụ tốt hơn bằng một sản phẩm thay thế phù hợp.", "tr": "İyi bir servis – ama bugün ihtiyacı olan biri uygun bir alternatifle daha iyi hizmet alır.", "ar": "خدمة جيدة – لكن من يحتاجه اليوم يُخدَم بشكل أفضل ببديل مناسب."}, "Bau ein Alternativange /* ===== Hilfsfunktionen ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => String(Math.round(n * 10) / 10).replace('.', ',');
function fill(str) {
  if (typeof str !== 'string') return str;
  for (let k = 0; k < 3; k++) str = str.replace(/\{(\w+)\}/g, (m, key) => {
    const sh = SHOPS[S.shop] || {}, pe = PERSONAS[S.per] || {};
    if (key in sh) return sh[key];
    if (key in pe) return pe[key];
    return m;
  });
  return str;
}
function PV(ph, key) { const v = S.var && S.var[ph.id]; return (v && v[key] !== undefined) ? v[key] : ph[key]; }
function pickTxt(obj) { if (!obj) return ''; return (obj[S.per] ?? obj[S.shop] ?? obj.all ?? ''); }
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

function faceSVG(look, mood) {
  const L = look, sk = L.skin, hr = L.hair;
  const brow = mood === 'sad' ? 'M36 44 L50 40 M70 40 L84 44' : mood === 'happy' ? 'M36 40 Q43 35 50 39 M70 39 Q77 35 84 40' : 'M36 41 L50 41 M70 41 L84 41';

  let hairBack = '', hairFront = '';

  if (L.style === 'tail') { hairBack = `<path d="M84 40 Q108 50 100 92 Q96 70 86 60Z" fill="${hr}"/>`; hairFront = `<path d="M30 52 Q28 18 62 18 Q92 20 90 50 Q78 30 58 32 Q40 34 30 52Z" fill="${hr}"/>`; }

  const glasses = L.glasses ? `<g fill="none" stroke="#2a2a2a" stroke-width="3"><circle cx="45" cy="54" r="9"/><circle cx="75" cy="54" r="9"/><path d="M54 54 L66 54"/></g>` : '';
  const lines = L.grey ? `<path d="M40 66 Q44 68 46 66 M74 66 Q76 68 80 66" stroke="#b98a70" stroke-width="2" fill="none"/>` : '';

  ${beard}${hairFront}<path d="${brow}" stroke="${hr === '#c9c4bd' ? '#8d877f' : hr}" stroke-width="3.5" stroke-linecap="round" fill="none"/>

}
function shopIcon(id) {
  if (id === 'mode') return `<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M20 10 L8 18 L12 30 L18 27 L18 52 L42 52 L42 27 L48 30 L52 18 L40 10 Q30 18 20 10Z" fill="#b03a5b" stroke="#1f1b2d" stroke-width="2.5" stroke-linejoin="round"/><path d="M18 46 L42 46 M18 40 L42 40" stroke="#f2a541" stroke-width="2.5"/></svg>`;

  return `<svg viewBox="0 0 60 60" aria-hidden="true"><ellipse cx="25" cy="34" rx="19" ry="13" fill="#2f2b3a" stroke="#1f1b2d" stroke-width="2.5"/><ellipse cx="25" cy="31" rx="14" ry="8" fill="#e9e3d4"/><rect x="40" y="29" width="18" height="6" rx="3" fill="#a8672f" stroke="#1f1b2d" stroke-width="2" transform="rotate(-12 40 32)"/><path d="M18 22 Q20 16 18 11 M26 21 Q28 15 26 10" stroke="#9aa4b5" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;

const LOGO = `<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 27 H11 V21 H17 V15 H23 V9 H29 V27Z" fill="var(--berry)"/><path d="M4 10 Q4 4 11 4 H16 Q22 4 22 9 Q22 14 16 14 H12 L8 17 L9 14 Q4 14 4 10Z" fill="var(--apricot)" stroke="var(--ink)" stroke-width="1.5"/></svg>`;
function star(on) { return `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z" fill="${on ? '#f2a541' : 'none'}" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>`; }

function sceneSVG() {
  const P = PERSONAS[S.per];
  const resCol = f => f >= 3 ? '#2e9a5c' : f >= 1 ? '#d39a1c' : '#d24b36';
  let g = `<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#cfd5e1"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b8bfce" stroke-width="2.5"/></pattern></defs>`;
  g += `<rect y="-24" width="640" height="216" fill="#dfe7f3"/><rect y="188" width="640" height="4" fill="#c3cbe0"/>`;
  g += `<g transform="translate(536 -18)"><rect width="98" height="24" rx="6" fill="#1f1b2d"/><text x="49" y="16" text-anchor="middle" font-size="10.5" font-weight="800" fill="#f2a541" font-family="Nunito Sans,system-ui,sans-serif">KAUF&#8209;ABSCHLUSS</text></g>`;
  const cur = (S.screen === 'play' || S.screen === 'event') ? S.list[S.i] : null;
  let figX = 30, figY = 188;
  PHASES.forEach((ph, i) => {
    const x = 6 + i * 78, top = 154 - i * 16, w = 78;
    const on = S.sel.has(ph.id), r = S.res[ph.id];
    let fill = on ? '#ffffff' : 'url(#hatch)';
    if (r && r.fit != null) fill = resCol(r.fit);
    const isCur = cur === ph.id;
    g += `<rect x="${x}" y="${top}" width="${w}" height="${188 - top}" fill="${fill}" stroke="${isCur ? '#f2a541' : '#1f1b2d'}" stroke-width="${isCur ? 4 : 2}"/>`;
    const txtCol = r && r.fit != null ? '#ffffff' : on ? '#1f1b2d' : '#6d7487';
    g += `<text x="${x + w / 2}" y="${top + 20}" text-anchor="middle" font-size="17" font-weight="800" fill="${txtCol}" font-family="Bricolage Grotesque,Trebuchet MS,sans-serif">${ph.id}</text>`;
    g += `<text x="${x + w / 2}" y="${top + 31}" text-anchor="middle" font-size="10" font-weight="700" fill="${txtCol}" font-family="Nunito Sans,system-ui,sans-serif">${ph.short}</text>`;
    if (isCur) { figX = x + w / 2; figY = top; }
  });
  if (S.screen === 'result' || S.screen === 'quiz') { const last = Math.max(...S.list); figX = 6 + (last - 1) * 78 + 39; figY = 154 - (last - 1) * 16; }
  if (S.screen === 'order' || S.screen === 'draw') { figX = 30; figY = 188; }
  const person = (x, y, col, head) => `<g transform="translate(${x} ${y})"><rect x="-8" y="-30" width="16" height="22" rx="7" fill="${col}" stroke="#1f1b2d" stroke-width="1.6"/><rect x="-7" y="-10" width="5" height="10" fill="#2a2a38"/><rect x="2" y="-10" width="5" height="10" fill="#2a2a38"/><circle cx="0" cy="-37" r="7.5" fill="${head}" stroke="#1f1b2d" stroke-width="1.6"/></g>`;
  g += person(figX - 14, figY, '#9e2457', '#e8b892');
  g += person(figX + 14, figY, P.look.top, P.look.skin);
  if (S.screen === 'result' && S.bought) g += `<g transform="translate(${figX + 26} ${figY - 20})"><rect width="16" height="16" rx="2" fill="#f2a541" stroke="#1f1b2d" stroke-width="1.6"/><path d="M4 4 Q8 -4 12 4" fill="none" stroke="#1f1b2d" stroke-width="1.6"/></g>`;
  return `<svg viewBox="0 -24 640 216" role="img" aria-label="Treppe mit acht Stufen des Verkaufsgesprächs">${g}</svg>`;
}

/* ===== Zustand ===== */
const S = { mode:null, screen:'start', team:'', level:null, shop:null, per:null, sel:new Set([1,2,3,4,5,6,7,8]), list:[], i:0, step:'decide', res:{}, mood:55, pts:0, max:0, evAt:-1, ev:null, evRes:null, order:null, quiz:null, bubble:'', face:'ok', known:false, bought:false, lastPer:null };

function moodCol() { return S.mood >= 65 ? 'var(--good)' : S.mood >= 40 ? 'var(--mid)' : 'var(--bad)'; }
function addMood(d) { S.mood = clamp(S.mood + d, 0, 100); }
function addPts(p, m) { S.pts += p; S.max += m; }

function renderBar() {
  const inGame = ['play','event','order','quiz','result'].includes(S.screen);
  let h = `<div class="brand">${LOGO}Stufe für Stufe</div><span class="sp"></span>`;
  const mb = modeBar(); if (mb !== null) { $('#bar').innerHTML = h + mb; return; }
  if (inGame) {
    h += `<span class="pill" title="Stimmung der Kundschaft">Stimmung ${Math.round(S.mood)}</span><span class="pill pts">${fmt(S.pts)} Punkte</span>`;
    const n = S.list.length;
    h += `<div class="prog">${S.list.map((id, k) => `<i class="${S.screen === 'result' || S.screen === 'quiz' || k < S.i ? 'done' : (k === S.i && S.screen === 'play') ? 'now' : ''}"></i>`).join('')}</div>`;
  }
  $('#bar').innerHTML = h;
}

function talk() {
  const P = PERSONAS[S.per];
  return `<div class="talk"><div class="face">${faceSVG(P.look, S.face)}</div><div class="bubble pop"><div class="who">${esc(P.name)}</div>${esc(fill(S.bubble))}</div></div>
  <div class="mood"><span>Stimmung</span><div class="tr"><div class="fi" style="width:${S.mood}%;background:${moodCol()}"></div></div><span style="font-variant-numeric:tabular-nums">${Math.round(S.mood)}</span></div>`;
}

function render() {
  renderBar();
  const app = $('#app');
  stopTimer();

  app.innerHTML = f();
  bind();
  afterRender();
}

      <button class="ch ${S.level === 'profi' ? 'sel' : ''}" data-lvl="profi"><b>Profi</b><span class="small">Ihr schreibt die Sätze selbst – wie in der Prüfung – und begründet.</span></button>

    <button class="btn wide" id="toPhases" ${S.level && S.shop ? '' : 'disabled'}>Weiter: Stufen wählen</button>

        <dl class="facts"><dt>Was sie will</dt><dd>${esc(P.name)} ${esc(P.wunsch)}.</dd><dt>Tipp</dt><dd>Achtet darauf, was ${esc(P.name)} sagt. Daran erkennt ihr das Kaufmotiv.</dd></dl></div></div></div>
