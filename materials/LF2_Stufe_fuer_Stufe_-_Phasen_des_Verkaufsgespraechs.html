Erst der Nutzen zeigt der Kundin, was sie davon hat: Merkmal – Vorteil – Nutzen.": {"vi": "Riêng đặc điểm thì không bán được hàng. Lợi ích mới cho khách thấy họ được gì: đặc điểm – ưu điểm – lợi ích.", "tr": "Tek başına bir özellik satmaz. Fayda müşteriye ondan ne elde edeceğini gösterir: özellik – avantaj – fayda.", "ar": "الميزة وحدها لا تبيع. الفائدة هي التي تُري الزبونة ما تحصل عليه: ميزة – أفضلية – فائدة."}, "Merkmal – Vorteil – Nutzen": {"vi": "Đặc điểm – ưu điểm – lợi ích", "tr": "Özellik – avantaj – fayda", "ar": "ميزة – أفضلية – فائدة"}, "Warenmerkmal nennen, Vorteil aufzeigen, Kundennutzen darlegen – und zwar den Nutzen, der zum ermittelten Bedarf passt. Das stärkste Argument kommt an den Schluss.": {"vi": "Nêu đặc điểm hàng hóa, chỉ ra ưu điểm, trình bày lợi ích cho khách – và đó là lợi ích phù hợp với nhu cầu đã xác định. Lập luận mạnh nhất để ở cuối.", "tr": "Ürün özelliğini söylemek, avantajı göstermek, müşteri faydasını açıklamak – ve tespit edilen ihtiyaca uyan faydayı. En güçlü argüman sona gelir.", "ar": "ذكر ميزة البضاعة، إظهار الأفضلية، شرح فائدة الزبون – وهي الفائدة التي تناسب الحاجة المحددة. الحجة الأقوى تأتي في النهاية."}, "Ein Kunde interessiert sich für einen Fitnesstracker. Formulieren Sie ein personenbezogenes Verkaufsargument in wörtlicher Rede, um ihn von dem Artikel zu überzeugen!": {"vi": "Một khách quan tâm đến vòng đeo theo dõi sức khỏe. Hãy viết một lập luận bán hàng cá nhân hóa bằng lời nói trực tiếp để thuyết phục khách về mặt hàng!", "tr": "Bir müşteri fitness takip cihazıyla ilgileniyor. Onu ürüne ikna etmek için kişiye yönelik bir satış argümanını doğrudan konuşma biçiminde yazın!", "ar": "يهتم زبون بسوار تتبع اللياقة. صُغ حجة بيع شخصية بالكلام المباشر لإقناعه بالسلعة!"}, "z. B. „Mit dem Pulsmesser am Handgelenk sehen Sie bei jedem Lauf sofort, ob Sie im richtigen Trainingsbereich sind.“": {"vi": "ví dụ „Với cảm biến nhịp tim ở cổ tay, mỗi lần chạy ông thấy ngay mình có đang ở vùng luyện tập phù hợp không.“", "tr": "örn. „Bileğinizdeki nabız ölçerle her koşuda hemen doğru antrenman bölgesinde olup olmadığınızı görürsünüz.“", "ar": "مثلًا „مع مستشعر النبض في معصمك ترى في كل جري فورًا ما إذا كنت في منطقة التدريب الصحيحة.“"}, "Bau ein Argument: Merkmal – Vorteil – Nutzen.": {"vi": "Hãy xây dựng một lập luận: đặc điểm – ưu điểm – lợi ích.", "tr": "Bir argüman oluşturun: özellik – avantaj – fayda.", "ar": "ابنِ حجة: ميزة – أفضلية – فائدة."}, "Merkmal": {"vi": "Đặc điểm", "tr": "Özellik", "ar": "الميزة"}, "{0} ist echt top.": {"vi": "{0} đúng là tuyệt vời.", "tr": "{0} gerçekten harika.", "ar": "{0} رائع حقًا."}, "„Top“ ist kein Merkmal. Ein Merkmal ist eine Eigenschaft der Ware: Material, Technik, Form …": {"vi": "„Tuyệt vời“ không phải đặc điểm. Đặc điểm là thuộc tính của hàng hóa: chất liệu, kỹ thuật, hình dáng …", "tr": "„Harika“ bir özellik değildir. Özellik, ürünün bir niteliğidir: malzeme, teknik, biçim …", "ar": "„رائع“ ليست ميزة. الميزة صفة في البضاعة: المادة والتقنية والشكل …"}, "Vorteil": {"vi": "Ưu điểm", "tr": "Avantaj", "ar": "الأفضلية"}, "Den haben wir schon oft verkauft.": {"vi": "Món này chúng tôi đã bán nhiều rồi.", "tr": "Bunu zaten çok sattık.", "ar": "لقد بعنا هذا كثيرًا."}, "Das sagt nichts über die Ware selbst.": {"vi": "Điều đó không nói gì về chính hàng hóa.", "tr": "Bu, ürünün kendisi hakkında hiçbir şey söylemez.", "ar": "هذا لا يقول شيئًا عن البضاعة نفسها."}, "Nutzen": {"vi": "Lợi ích", "tr": "Fayda", "ar": "الفائدة"}, "Damit macht der Laden mehr Umsatz.": {"vi": "Nhờ vậy cửa hàng có doanh thu cao hơn.", "tr": "Böylece mağaza daha çok ciro yapar.", "ar": "وهكذا يحقق المتجر مبيعات أكثر."}, "Der Nutzen muss für die Kundin sein, nicht für den Betrieb.": {"vi": "Lợi ích phải dành cho khách, không phải cho doanh nghiệp.", "tr": "Fayda müşteri için olmalı, işletme için değil.", "ar": "يجب أن تكون الفائدة للزبونة لا للمنشأة."}, "Mehr weiß ich auch nicht.": {"vi": "Tôi cũng không biết thêm gì nữa.", "tr": "Ben de daha fazlasını bilmiyorum.", "ar": "لا أعرف أكثر من ذلك."}, "Unsicher – Warenkenntnisse schaffen Vertrauen.": {"vi": "Thiếu tự tin – kiến thức hàng hóa tạo niềm tin.", "tr": "Güvensiz – ürün bilgisi güven yaratır.", "ar": "غير واثق – معرفة البضاعة تخلق الثقة."}, "{0} zeigt starkes Interesse an {1}. Formulieren Sie ein personenbezogenes Verkaufsargument in wörtlicher Rede, das zum ermittelten Bedarf passt!": {"vi": "{0} tỏ ra rất quan tâm đến {1}. Hãy viết một lập luận bán hàng cá nhân hóa bằng lời nói trực tiếp, phù hợp với nhu cầu đã xác định!", "tr": "{0}, {1} ile çok ilgileniyor. Tespit edilen ihtiyaca uyan, kişiye yönelik bir satış argümanını doğrudan konuşma biçiminde yazın!", "ar": "يُظهر {0} اهتمامًا كبيرًا بـ {1}. صُغ حجة بيع شخصية بالكلام المباشر تناسب الحاجة المحددة!"}, "Ihr Verkaufsargument": {"vi": "Lập luận bán hàng của bạn", "tr": "Satış argümanınız", "ar": "حجة البيع الخاصة بك"}, "Nutzen-Formulierung („damit“, „dadurch“, „so können Sie“, „Sie sparen“ …)": {"vi": "Cách diễn đạt lợi ích („damit“, „dadurch“, „so können Sie“, „Sie sparen“ …)", "tr": "Fayda ifadesi („damit“, „dadurch“, „so können Sie“, „Sie sparen“ …)", "ar": "صياغة الفائدة („damit“ و„dadurch“ و„so können Sie“ و„Sie sparen“ …)"}, "Wohin gehört das stärkste Argument?": {"vi": "Lập luận mạnh nhất thuộc về đâu?", "tr": "En güçlü argüman nereye aittir?", "ar": "أين يوضع الحجة الأقوى؟"}, "An den Schluss – begonnen wird aber mit einem wichtigen Argument, sonst fehlt das Interesse.": {"vi": "Ở cuối – nhưng bắt đầu bằng một lập luận quan trọng, nếu không sẽ thiếu sự quan tâm.", "tr": "Sona – ama önemli bir argümanla başlanır, yoksa ilgi eksik kalır.", "ar": "في النهاية – لكن يُبدأ بحجة مهمة، وإلا يغيب الاهتمام."}, "Immer ganz an den Anfang, danach ist es egal.": {"vi": "Luôn ở ngay đầu, sau đó thế nào cũng được.", "tr": "Her zaman en başa, sonrası fark etmez.", "ar": "دائمًا في البداية تمامًا، وبعدها لا يهم."}, "Das stärkste Argument hebt man auf, falls die Kundin wiederkommt.": {"vi": "Giữ lập luận mạnh nhất lại, phòng khi khách quay lại.", "tr": "En güçlü argüman, müşteri geri gelirse diye saklanır.", "ar": "تُدّخر الحجة الأقوى لعودة الزبونة."}, "Modul 9, Merke": {"vi": "Mô-đun 9, Ghi nhớ", "tr": "Modül 9, Not", "ar": "الوحدة 9، للتذكّر"}, "Preisnennung": {"vi": "Nêu giá", "tr": "Fiyatı söylemek", "ar": "ذكر السعر"}, "Preis": {"vi": "Giá", "tr": "Fiyat", "ar": "السعر"}, "Modul 10": {"vi": "Mô-đun 10", "tr": "Modül 10", "ar": "الوحدة 10"}, "11 Teilaufgaben in 9 von 14 Prüfungen. Fast immer die Sandwich-Methode in wörtlicher Rede, dazu „Warum Sandwich?“.": {"vi": "11 câu hỏi nhỏ trong 9 trên 14 kỳ thi. Gần như luôn là phương pháp sandwich bằng lời nói trực tiếp, kèm „Tại sao sandwich?“.", "tr": "14 sınavın 9'unda 11 alt soru. Hemen her zaman doğrudan konuşmayla sandviç yöntemi, ayrıca „Neden sandviç?“.", "ar": "11 سؤالًا فرعيًا في 9 من 14 امتحانًا. غالبًا دائمًا طريقة الساندويتش بالكلام المباشر، مع „لماذا الساندويتش؟“."}, "{0} fragt: „Und was kostet {1}?“ – {2} kostet {3}.": {"vi": "{0} hỏi: „Và {1} giá bao nhiêu?“ – {2} giá {3}.", "tr": "{0} soruyor: „Peki {1} ne kadar?“ – {2} {3}.", "ar": "يسأل {0}: „وكم سعر {1}؟“ – {2} سعره {3}."}, "Sandwich: Nutzen – Preis – Nutzen": {"vi": "Sandwich: lợi ích – giá – lợi ích", "tr": "Sandviç: fayda – fiyat – fayda", "ar": "ساندويتش: فائدة – سعر – فائدة"}, "Den Preis zwischen zwei Vorteile packen.": {"vi": "Kẹp giá giữa hai ưu điểm.", "tr": "Fiyatı iki avantajın arasına koymak.", "ar": "وضع السعر بين أفضليتين."}, "Ah ja, das ist es mir wert.": {"vi": "À vâng, như vậy là đáng giá với tôi.", "tr": "Ah evet, bu benim için buna değer.", "ar": "آه نعم، هذا يستحق ذلك بالنسبة لي."}, "Okay … klingt fair.": {"vi": "Được … nghe hợp lý.", "tr": "Tamam … adil geliyor.", "ar": "حسنًا … يبدو عادلًا."}, "Die Sandwich-Methode verbindet den Preis mit dem Nutzen. So entsteht kein Preisschock.": {"vi": "Phương pháp sandwich gắn giá với lợi ích. Nhờ vậy không gây sốc giá.", "tr": "Sandviç yöntemi fiyatı faydayla birleştirir. Böylece fiyat şoku yaşanmaz.", "ar": "طريقة الساندويتش تربط السعر بالفائدة. وهكذا لا تحدث صدمة سعر."}, "Einfach den Preis sagen: „{0}.“": {"vi": "Cứ nói giá: „{0}.“", "tr": "Sadece fiyatı söylemek: „{0}.“", "ar": "ذكر السعر فقط: „{0}.“"}, "Kurz und ehrlich.": {"vi": "Ngắn gọn và thành thật.", "tr": "Kısa ve dürüst.", "ar": "موجز وصادق."}, "(zuckt zusammen) Oh! So viel?": {"vi": "(giật mình) Ồ! Nhiều vậy sao?", "tr": "(irkiliyor) Oh! Bu kadar mı?", "ar": "(تجفل) آه! كل هذا؟"}, "Hm. Okay.": {"vi": "Hm. Được thôi.", "tr": "Hm. Tamam.", "ar": "همم. حسنًا."}, "Ein nackt genannter Preis löst einen Preisschock aus – dieser Fehler ist ein Klassiker in der Prüfung.": {"vi": "Giá nêu trần trụi gây sốc giá – lỗi này là kinh điển trong kỳ thi.", "tr": "Çıplak söylenen fiyat fiyat şokuna yol açar – bu hata sınavda klasiktir.", "ar": "السعر الذي يُذكر مجرّدًا يسبب صدمة سعر – وهذا خطأ كلاسيكي في الامتحان."}, "Verkleinerungsmethode: Preis auf die Nutzungsdauer umrechnen": {"vi": "Phương pháp chia nhỏ: quy giá theo thời gian sử dụng", "tr": "Küçültme yöntemi: fiyatı kullanım süresine bölmek", "ar": "طريقة التصغير: توزيع السعر على مدة الاستخدام"}, "„Bei fünf Jahren Nutzung sind das nur … im Monat.“": {"vi": "„Dùng trong năm năm thì chỉ … mỗi tháng.“", "tr": "„Beş yıl kullanımda bu ayda sadece …“", "ar": "„على مدى خمس سنوات من الاستخدام لا يتجاوز ذلك … في الشهر.“"}, "Hm, so habe ich das noch nicht gesehen.": {"vi": "Hm, tôi chưa nhìn như vậy bao giờ.", "tr": "Hm, ben bunu böyle görmemiştim.", "ar": "همم، لم أنظر إلى الأمر هكذا من قبل."}, "Stimmt, so gerechnet ist das echt nicht viel!": {"vi": "Đúng, tính như vậy thì thật sự không nhiều!", "tr": "Doğru, böyle hesaplanınca gerçekten çok değil!", "ar": "صحيح، بهذه الحسبة ليس كثيرًا فعلًا!"}, "Ich hab keine Zeit für Rechnungen.": {"vi": "Tôi không có thời gian cho tính toán.", "tr": "Hesap kitaba vaktim yok.", "ar": "ليس لدي وقت للحسابات."}, "Ach, bei einem Geschenk rechne ich nicht in Monaten.": {"vi": "Ôi, với quà tặng tôi không tính theo tháng.", "tr": "Ah, hediyede aylık hesap yapmam.", "ar": "آه، في الهدايا لا أحسب بالأشهر."}, "Gut für preisbewusste Kundschaft und für Ware, die lange genutzt wird. Bei einem Geschenk oder in Eile passt das Sandwich besser.": {"vi": "Tốt cho khách để ý giá và cho hàng dùng lâu. Với quà tặng hoặc khi vội thì sandwich phù hợp hơn.", "tr": "Fiyata duyarlı müşteri ve uzun süre kullanılan ürün için iyi. Hediye için veya acelede sandviç daha uygundur.", "ar": "جيد للزبائن الحريصين على السعر وللبضاعة التي تُستخدم طويلًا. أما للهدية أو عند الاستعجال فالساندويتش أنسب."}, "Sandwich-Methode": {"vi": "Phương pháp sandwich", "tr": "Sandviç yöntemi", "ar": "طريقة الساندويتش"}, "Nutzen – Preis – Nutzen. Weitere Methoden: Verzögerung (Preis erst am Ende), Zerlegung (Teilpreise nennen), Verkleinerung (Preis auf Nutzungsdauer oder Menge verteilen), Vergleich.": {"vi": "Lợi ích – giá – lợi ích. Các phương pháp khác: trì hoãn (giá nói ở cuối), chia nhỏ khoản tiền (nêu giá từng phần), chia nhỏ theo thời gian (rải giá theo thời gian dùng hoặc số lượng), so sánh.", "tr": "Fayda – fiyat – fayda. Diğer yöntemler: erteleme (fiyat en sonda), parçalara ayırma (kısmi fiyatlar), küçültme (fiyatı kullanım süresine veya miktara bölmek), karşılaştırma.", "ar": "فائدة – سعر – فائدة. طرق أخرى: التأجيل (السعر في النهاية)، التجزئة (ذكر أسعار الأجزاء)، التصغير (توزيع السعر على مدة الاستخدام أو الكمية)، المقارنة."}, "Der Kunde fragt nach dem Preis einer Wolldecke. Formulieren Sie eine Antwort in wörtlicher Rede und wenden Sie dabei die Sandwich-Methode an!": {"vi": "Một khách hỏi giá một chiếc chăn len. Hãy viết một câu trả lời bằng lời nói trực tiếp và áp dụng phương pháp sandwich!", "tr": "Bir müşteri yünlü bir battaniyenin fiyatını soruyor. Doğrudan konuşma biçiminde bir cevap yazın ve sandviç yöntemini uygulayın!", "ar": "يسأل زبون عن سعر بطانية صوفية. صُغ جوابًا بالكلام المباشر وطبّق فيه طريقة الساندويتش!"}, "z. B. „Diese Decke besteht aus 100 % Schurwolle, sie kostet 79,90 €. Damit haben Sie eine Decke, die Sie viele Winter lang wärmt.“": {"vi": "ví dụ „Chiếc chăn này làm từ 100 % len cừu, giá 79,90 €. Nhờ vậy ông có chiếc chăn giữ ấm cho ông suốt nhiều mùa đông.“", "tr": "örn. „Bu battaniye %100 yeni yündür, 79,90 €. Böylece birçok kış boyunca sizi ısıtacak bir battaniyeniz olur.“", "ar": "مثلًا „هذه البطانية من صوف الغنم بنسبة 100 %، وسعرها 79,90 €. وبذلك تحصل على بطانية تدفئك شتاءات كثيرة.“"}, "Bau ein Sandwich: Nutzen – Preis – Nutzen.": {"vi": "Hãy xây dựng một sandwich: lợi ích – giá – lợi ích.", "tr": "Bir sandviç oluşturun: fayda – fiyat – fayda.", "ar": "ابنِ ساندويتش: فائدة – سعر – فائدة."}, "Nutzen 1": {"vi": "Lợi ích 1", "tr": "Fayda 1", "ar": "الفائدة 1"}, "Ganz ehrlich, das ist nicht billig:": {"vi": "Nói thật, cái này không rẻ:", "tr": "Dürüst olmak gerekirse, bu ucuz değil:", "ar": "بصراحة، هذا ليس رخيصًا:"}, "Damit kündigst du den Preisschock selbst an.": {"vi": "Như vậy chính bạn báo trước cú sốc giá.", "tr": "Böylece fiyat şokunu kendiniz önceden ilan etmiş olursunuz.", "ar": "وهكذا تعلن أنت نفسك عن صدمة السعر."}, "das kostet läppische {0}": {"vi": "cái này chỉ có {0} tầm thường", "tr": "bu sadece {0} gibi komik bir tutar", "ar": "هذا يكلّف مجرد {0} تافهة"}, "„Läppisch“ ist Umgangssprache und klingt herablassend.": {"vi": "„Läppisch“ (tầm thường) là văn nói và nghe có vẻ trịch thượng.", "tr": "„Läppisch“ (komik) konuşma dilidir ve tepeden bakar gibi duyulur.", "ar": "„Läppisch“ (تافه) من العامية ويبدو متعاليًا."}, "Nutzen 2": {"vi": "Lợi ích 2", "tr": "Fayda 2", "ar": "الفائدة 2"}, "– mehr kann ich da nicht machen.": {"vi": "– tôi cũng không làm gì hơn được.", "tr": "– ben de daha fazlasını yapamam.", "ar": "– ولا أستطيع فعل أكثر من ذلك."}, "Nach dem Preis muss ein Nutzen kommen, keine Entschuldigung.": {"vi": "Sau giá phải có một lợi ích, không phải lời xin lỗi.", "tr": "Fiyattan sonra bir fayda gelmeli, özür değil.", "ar": "بعد السعر يجب أن تأتي فائدة لا اعتذار."}, "{0} fragt nach dem Preis. Formulieren Sie eine Antwort in wörtlicher Rede und wenden Sie dabei die Sandwich-Methode an! ({1} kostet {2}.)": {"vi": "{0} hỏi giá. Hãy viết một câu trả lời bằng lời nói trực tiếp và áp dụng phương pháp sandwich! ({1} giá {2}.)", "tr": "{0} fiyatı soruyor. Doğrudan konuşma biçiminde bir cevap yazın ve sandviç yöntemini uygulayın! ({1} {2}.)", "ar": "يسأل {0} عن السعر. صُغ جوابًا بالكلام المباشر وطبّق فيه طريقة الساندويتش! ({1} سعره {2}.)"}, "Ihre Antwort": {"vi": "Câu trả lời của bạn", "tr": "Cevabınız", "ar": "جوابك"}, "Preis wird genannt": {"vi": "Giá được nêu", "tr": "Fiyat söylenmiş", "ar": "ذُكر السعر"}, "vor dem Preis steht ein Nutzen (mind. 4 Wörter)": {"vi": "trước giá có một lợi ích (ít nhất 4 từ)", "tr": "fiyattan önce bir fayda var (en az 4 kelime)", "ar": "قبل السعر توجد فائدة (4 كلمات على الأقل)"}, "nach dem Preis steht noch ein Nutzen (mind. 4 Wörter)": {"vi": "sau giá còn có một lợi ích (ít nhất 4 từ)", "tr": "fiyattan sonra bir fayda daha var (en az 4 kelime)", "ar": "بعد السعر توجد فائدة أخرى (4 كلمات على الأقل)"}, "kein „billig“ oder „teuer“": {"vi": "không có „billig“ (rẻ) hoặc „teuer“ (đắt)", "tr": "„billig“ (ucuz) veya „teuer“ (pahalı) yok", "ar": "بدون „billig“ (رخيص) أو „teuer“ (غالٍ)"}, "Erläutern Sie, warum Sie die Sandwich-Methode einsetzen.": {"vi": "Hãy giải thích vì sao bạn dùng phương pháp sandwich.", "tr": "Sandviç yöntemini neden kullandığınızı açıklayın.", "ar": "اشرح لماذا تستخدم طريقة الساندويتش."}, "Ein nackt genannter Preis kann einen Preisschock auslösen. Das Sandwich verbindet den Preis mit dem Kundennutzen.": {"vi": "Giá nêu trần trụi có thể gây sốc giá. Sandwich gắn giá với lợi ích của khách.", "tr": "Çıplak söylenen bir fiyat fiyat şokuna yol açabilir. Sandviç, fiyatı müşteri faydasıyla birleştirir.", "ar": "السعر المذكور مجرّدًا قد يسبب صدمة سعر. الساندويتش يربط السعر بفائدة الزبون."}, "Damit die Kundin den Preis gar nicht erst bemerkt.": {"vi": "Để khách thậm chí không nhận ra giá.", "tr": "Müşteri fiyatı hiç fark etmesin diye.", "ar": "لكي لا تلاحظ الزبونة السعر أصلًا."}, "Weil man so den Preis erhöhen darf.": {"vi": "Vì như vậy được phép tăng giá.", "tr": "Çünkü böylece fiyatı yükseltmek serbest olur.", "ar": "لأنه بهذه الطريقة يُسمح برفع السعر."}, "Kundeneinwände": {"vi": "Phản đối của khách", "tr": "Müşteri itirazları", "ar": "اعتراضات الزبائن"}, "Einwand": {"vi": "Phản đối", "tr": "İtiraz", "ar": "الاعتراض"}, "Modul 11": {"vi": "Mô-đun 11", "tr": "Modül 11", "ar": "الوحدة 11"}, "Einwände: 8 Teilaufgaben in 7 von 14 Prüfungen. Dazu Beschwerde/Reklamation: 31 Teilaufgaben in 12 Prüfungen – das häufigste Thema überhaupt.": {"vi": "Phản đối: 8 câu hỏi nhỏ trong 7 trên 14 kỳ thi. Thêm khiếu nại/phàn nàn: 31 câu hỏi nhỏ trong 12 kỳ thi – chủ đề thường gặp nhất.", "tr": "İtirazlar: 14 sınavın 7'sinde 8 alt soru. Ayrıca şikâyet/reklamasyon: 12 sınavda 31 alt soru – hepsinden sık çıkan konu.", "ar": "الاعتراضات: 8 أسئلة فرعية في 7 من 14 امتحانًا. إضافة إلى الشكوى/المطالبة: 31 سؤالًا فرعيًا في 12 امتحانًا – وهو الموضوع الأكثر تكرارًا على الإطلاق."}, "Nach der Preisnennung sagt {0}: „{1}“": {"vi": "Sau khi nêu giá, {0} nói: „{1}“", "tr": "Fiyatı söyledikten sonra {0} şöyle diyor: „{1}“", "ar": "بعد ذكر السعر يقول {0}: „{1}“"}, "Ja-Aber: erst zustimmen, dann einen Nutzen nennen": {"vi": "Vâng-nhưng: trước tiên đồng ý, rồi nêu một lợi ích", "tr": "Evet-ama: önce onaylamak, sonra bir fayda söylemek", "ar": "نعم-لكن: الموافقة أولًا ثم ذكر فائدة"}, "„Ja, da haben Sie recht, dafür …“": {"vi": "„Vâng, bà nói đúng, nhưng bù lại …“", "tr": "„Evet, haklısınız, ama buna karşılık …“", "ar": "„نعم، معك حق، لكن في المقابل …“"}, "Stimmt eigentlich. Das überzeugt mich.": {"vi": "Thật ra đúng. Cái đó làm tôi thuyết phục.", "tr": "Aslında doğru. Bu beni ikna ediyor.", "ar": "صحيح في الواقع. هذا يقنعني."}, "Hm, okay … das ist ein Punkt.": {"vi": "Hm, được … đó là một điểm.", "tr": "Hm, tamam … bu bir nokta.", "ar": "همم، حسنًا … هذه نقطة."}, "Die Ja-Aber-Methode nimmt die Kundin ernst und widerspricht ihr nicht direkt. Erst dann kommt ein neues Argument.": {"vi": "Phương pháp Vâng-nhưng coi trọng khách và không phản bác trực tiếp. Chỉ sau đó mới đưa ra lập luận mới.", "tr": "Evet-ama yöntemi müşteriyi ciddiye alır ve ona doğrudan karşı çıkmaz. Ancak ondan sonra yeni bir argüman gelir.", "ar": "طريقة نعم-لكن تأخذ الزبونة على محمل الجد ولا تعارضها مباشرة. وبعد ذلك فقط تأتي حجة جديدة."}, "„Gute Dinge haben halt ihren Preis.“": {"vi": "„Đồ tốt thì có giá của nó.“", "tr": "„İyi şeylerin bir bedeli vardır.“", "ar": "„الأشياء الجيدة لها ثمنها.“"}, "Das stimmt doch.": {"vi": "Đúng thế mà.", "tr": "Bu doğru ya.", "ar": "هذا صحيح."}, "(verschränkt die Arme) Na, dann eben nicht.": {"vi": "(khoanh tay) Vậy thì thôi.", "tr": "(kollarını kavuşturuyor) O zaman olmasın.", "ar": "(تعقد ذراعيها) إذن لا."}, "Das ist keine Einwandbehandlung. Dieser Satz ist ein typischer Fehler, der in der Prüfung erkannt werden soll.": {"vi": "Đó không phải cách xử lý phản đối. Câu này là lỗi điển hình mà bạn phải nhận ra trong kỳ thi.", "tr": "Bu itiraz ele alma değildir. Bu cümle, sınavda fark etmeniz gereken tipik bir hatadır.", "ar": "هذا ليس معالجة للاعتراض. هذه الجملة خطأ نموذجي يجب أن تلاحظه في الامتحان."}, "Nachfragen: „Was genau stört Sie?“ bzw. „Wo haben Sie das gesehen?“": {"vi": "Hỏi lại: „Điều gì làm bà bận tâm chính xác?“ hoặc „Bà đã thấy ở đâu?“", "tr": "Sormak: „Sizi tam olarak ne rahatsız ediyor?“ ya da „Bunu nerede gördünüz?“", "ar": "السؤال: „ما الذي يزعجك بالضبط؟“ أو „أين رأيت ذلك؟“"}, "Erst verstehen, dann antworten.": {"vi": "Trước tiên hiểu, rồi mới trả lời.", "tr": "Önce anlamak, sonra cevap vermek.", "ar": "الفهم أولًا ثم الجواب."}, "Na ja, ich hatte mit weniger gerechnet.": {"vi": "Ừ, tôi đã nghĩ là ít hơn.", "tr": "Eh, daha azını beklemiştim.", "ar": "حسنًا، كنت أتوقع أقل من ذلك."}, "Bei einem Onlineshop … aber das war ein anderes Modell, glaube ich.": {"vi": "Ở một cửa hàng trực tuyến … nhưng đó là mẫu khác, tôi nghĩ vậy.", "tr": "Bir online mağazada … ama başka bir modeldi, sanırım.", "ar": "في متجر إلكتروني … لكنه كان طرازًا آخر على ما أظن."}, "Ich hab jetzt keine Zeit für Diskussionen.": {"vi": "Giờ tôi không có thời gian tranh luận.", "tr": "Şimdi tartışmaya vaktim yok.", "ar": "ليس لدي الآن وقت للنقاش."}, "Die Gegenfrage-Methode hilft, den echten Grund zu finden. Behauptet jemand, es woanders billiger gesehen zu haben, erbittet man zuerst nähere Angaben und prüft, ob es der gleiche Artikel ist.": {"vi": "Phương pháp hỏi ngược giúp tìm ra lý do thật. Nếu ai nói đã thấy rẻ hơn ở nơi khác, trước hết hỏi thêm chi tiết và kiểm tra xem có phải cùng mặt hàng không.", "tr": "Karşı soru yöntemi gerçek nedeni bulmaya yardımcı olur. Biri başka yerde daha ucuz gördüğünü söylerse önce ayrıntı istenir ve aynı ürün olup olmadığı kontrol edilir.", "ar": "طريقة السؤال المقابل تساعد في إيجاد السبب الحقيقي. إذا قال أحد إنه رأى السلعة أرخص في مكان آخر، يُطلب أولًا مزيد من التفاصيل ويُفحص ما إذا كانت السلعة نفسها."}, "Ja-Aber-Methode": {"vi": "Phương pháp Vâng-nhưng", "tr": "Evet-ama yöntemi", "ar": "طريقة نعم-لكن"}, "Erst zustimmen („Ja, da haben Sie recht“), dann ein neues Argument bringen („dafür …“). Weitere Methoden: Gegenfrage, Umkehr, Vergleich, Bumerang. Ein Einwand ist eine Chance: Die Kundin ist interessiert.": {"vi": "Trước tiên đồng ý („Vâng, bà nói đúng“), rồi đưa lập luận mới („bù lại …“). Các phương pháp khác: hỏi ngược, đảo ngược, so sánh, boomerang. Phản đối là một cơ hội: khách có quan tâm.", "tr": "Önce onaylamak („Evet, haklısınız“), sonra yeni bir argüman getirmek („buna karşılık …“). Diğer yöntemler: karşı soru, tersine çevirme, karşılaştırma, bumerang. İtiraz bir fırsattır: Müşteri ilgileniyor.", "ar": "الموافقة أولًا („نعم، معك حق“) ثم إتيان حجة جديدة („في المقابل …“). طرق أخرى: السؤال المقابل، العكس، المقارنة، البوميرانغ. الاعتراض فرصة: الزبونة مهتمة."}, "Der Kunde sagt: „Der Schal ist mir zu teuer!“ Formulieren Sie in wörtlicher Rede, wie Sie reagieren, und benennen Sie die angewandte Methode!": {"vi": "Khách nói: „Chiếc khăn này đắt quá với tôi!“ Hãy viết bằng lời nói trực tiếp cách bạn phản ứng và gọi tên phương pháp đã dùng!", "tr": "Müşteri şöyle diyor: „Bu atkı benim için çok pahalı!“ Nasıl tepki vereceğinizi doğrudan konuşma biçiminde yazın ve uyguladığınız yöntemi adlandırın!", "ar": "يقول الزبون: „هذا الوشاح غالٍ جدًا بالنسبة لي!“ صُغ بالكلام المباشر كيف تتصرف وسمِّ الطريقة المستخدمة!"}, "Methode 1 P. (z. B. Ja-Aber-Methode), Formulierung 2 P., z. B. „Ja, das stimmt, er kostet etwas mehr. Dafür ist er aus Kaschmir und besonders weich und warm.“": {"vi": "Phương pháp 1 điểm (ví dụ phương pháp Vâng-nhưng), cách diễn đạt 2 điểm, ví dụ „Vâng, đúng, nó đắt hơn một chút. Bù lại nó làm từ cashmere và đặc biệt mềm và ấm.“", "tr": "Yöntem 1 P. (örn. Evet-ama yöntemi), ifade 2 P., örn. „Evet, doğru, biraz daha pahalı. Buna karşılık kaşmirden ve özellikle yumuşak ve sıcak.“", "ar": "الطريقة نقطة واحدة (مثلًا طريقة نعم-لكن)، الصياغة نقطتان، مثلًا „نعم، هذا صحيح، سعره أعلى قليلًا. في المقابل هو من الكشمير وناعم ودافئ بشكل خاص.“"}, "Bau eine Antwort nach der Ja-Aber-Methode.": {"vi": "Hãy xây dựng một câu trả lời theo phương pháp Vâng-nhưng.", "tr": "Evet-ama yöntemine göre bir cevap oluşturun.", "ar": "ابنِ جوابًا وفق طريقة نعم-لكن."}, "Ja …": {"vi": "Vâng …", "tr": "Evet …", "ar": "نعم …"}, "Ja, da haben Sie recht,": {"vi": "Vâng, bà nói đúng,", "tr": "Evet, haklısınız,", "ar": "نعم، معك حق،"}, "Nein, das stimmt nicht,": {"vi": "Không, điều đó không đúng,", "tr": "Hayır, bu doğru değil,", "ar": "لا، هذا غير صحيح،"}, "Direkter Widerspruch – die Kundin verliert ihr Gesicht.": {"vi": "Phản bác trực tiếp – khách mất thể diện.", "tr": "Doğrudan itiraz – müşteri yüzünü kaybeder.", "ar": "معارضة مباشرة – تفقد الزبونة ماء وجهها."}, "Tja,": {"vi": "Ừ thì,", "tr": "Eh,", "ar": "حسنًا،"}, "Gleichgültig. Du nimmst den Einwand nicht ernst.": {"vi": "Thờ ơ. Bạn không coi trọng phản đối.", "tr": "İlgisiz. İtirazı ciddiye almıyorsunuz.", "ar": "عدم اكتراث. أنت لا تأخذ الاعتراض على محمل الجد."}, "… aber": {"vi": "… nhưng", "tr": "… ama", "ar": "… لكن"}, "aber woanders ist es noch teurer.": {"vi": "nhưng ở nơi khác còn đắt hơn.", "tr": "ama başka yerde daha da pahalı.", "ar": "لكن في مكان آخر أغلى حتى."}, "Unbelegt – und es lenkt vom Nutzen ab.": {"vi": "Không có chứng cứ – và làm lạc khỏi lợi ích.", "tr": "Kanıtsız – ve faydadan dikkati dağıtır.", "ar": "بلا دليل – ويصرف الانتباه عن الفائدة."}, "aber das ist nicht mein Problem.": {"vi": "nhưng đó không phải vấn đề của tôi.", "tr": "ama bu benim sorunum değil.", "ar": "لكن هذه ليست مشكلتي."}, "Unhöflich. Damit ist das Gespräch beendet.": {"vi": "Thiếu lịch sự. Cuộc trò chuyện kết thúc.", "tr": "Kaba. Konuşma bitmiş olur.", "ar": "غير مهذّب. وبذلك ينتهي الحديث."}, "Nachdem Sie den Preis genannt haben, sagt {0}: „{1}“ Formulieren Sie eine verkaufsfördernde Antwort in wörtlicher Rede und benennen Sie die angewandte Methode!": {"vi": "Sau khi bạn nêu giá, {0} nói: „{1}“ Hãy viết một câu trả lời thúc đẩy bán hàng bằng lời nói trực tiếp và gọi tên phương pháp đã dùng!", "tr": "Fiyatı söylediğinizde {0} şöyle diyor: „{1}“ Satışı destekleyen bir cevabı doğrudan konuşma biçiminde yazın ve uyguladığınız yöntemi adlandırın!", "ar": "بعد أن تذكر السعر يقول {0}: „{1}“ صُغ جوابًا يشجّع على البيع بالكلام المباشر وسمِّ الطريقة المستخدمة!"}, "Methode": {"vi": "Phương pháp", "tr": "Yöntem", "ar": "الطريقة"}, "Zustimmung oder Verständnis am Anfang": {"vi": "Đồng ý hoặc thấu hiểu ở đầu", "tr": "Başta onay veya anlayış", "ar": "موافقة أو تفهّم في البداية"}, "danach ein Nutzen („dafür“, „allerdings“, „jedoch“ …)": {"vi": "sau đó là một lợi ích („dafür“, „allerdings“, „jedoch“ …)", "tr": "ardından bir fayda („dafür“, „allerdings“, „jedoch“ …)", "ar": "بعد ذلك فائدة („dafür“ و„allerdings“ و„jedoch“ …)"}, "Methode benannt": {"vi": "Đã gọi tên phương pháp", "tr": "Yöntem adlandırılmış", "ar": "ذُكرت الطريقة بالاسم"}, "kein Widerspruch wie „Das stimmt nicht“": {"vi": "không phản bác như „Điều đó không đúng“", "tr": "„Bu doğru değil“ gibi itiraz yok", "ar": "بدون معارضة مثل „هذا غير صحيح“"}, "Was zeigt ein Kundeneinwand?": {"vi": "Phản đối của khách cho thấy điều gì?", "tr": "Müşteri itirazı neyi gösterir?", "ar": "ماذا يُظهر اعتراض الزبون؟"}, "Die Kundin ist interessiert, ihr ist der Nutzen nur noch nicht klar. Ein Einwand ist eine Chance.": {"vi": "Khách có quan tâm, chỉ là chưa rõ lợi ích. Phản đối là một cơ hội.", "tr": "Müşteri ilgileniyor, sadece faydayı henüz anlamamış. İtiraz bir fırsattır.", "ar": "الزبونة مهتمة، لكن الفائدة غير واضحة لها بعد. الاعتراض فرصة."}, "Die Kundin will nicht kaufen – man kann das Gespräch beenden.": {"vi": "Khách không muốn mua – có thể kết thúc cuộc trò chuyện.", "tr": "Müşteri satın almak istemiyor – konuşma bitirilebilir.", "ar": "الزبونة لا تريد الشراء – يمكن إنهاء الحديث."}, "Die Kundin will den Verkäufer ärgern.": {"vi": "Khách muốn làm người bán bực mình.", "tr": "Müşteri satıcıyı kızdırmak istiyor.", "ar": "الزبونة تريد إزعاج البائع."}, "Modul 11, Merke": {"vi": "Mô-đun 11, Ghi nhớ", "tr": "Modül 11, Not", "ar": "الوحدة 11، للتذكّر"}, "Ergänzungs-, Zusatz- und Alternativangebote": {"vi": "Đề nghị bổ sung, thêm và thay thế", "tr": "Tamamlayıcı, ek ve alternatif teklifler", "ar": "عروض المكمّل والإضافة والبديل"}, "Zusatz": {"vi": "Hàng thêm", "tr": "Ek", "ar": "الإضافة"}, "Modul 13": {"vi": "Mô-đun 13", "tr": "Modül 13", "ar": "الوحدة 13"}, "13 Teilaufgaben in 6 von 14 Prüfungen: Zusatzartikel zu Hauptartikeln nennen, Zeitpunkt begründen, Vorteile für Betrieb und Kunde.": {"vi": "13 câu hỏi nhỏ trong 6 trên 14 kỳ thi: nêu hàng thêm cho hàng chính, giải thích thời điểm, ưu điểm cho doanh nghiệp và khách.", "tr": "14 sınavın 6'sında 13 alt soru: ana ürünler için ek ürünleri saymak, zamanlamayı gerekçelendirmek, işletme ve müşteri için avantajlar.", "ar": "13 سؤالًا فرعيًا في 6 من 14 امتحانًا: ذكر القطع الإضافية للقطع الرئيسية، تعليل التوقيت، فوائد المنشأة والزبون."}, "{0} hat sich für {1} entschieden.": {"vi": "{0} đã quyết định chọn {1}.", "tr": "{0}, {1} kararını verdi.", "ar": "قرّر {0} اختيار {1}."}, "Jetzt {0} anbieten – mit Nutzen": {"vi": "Bây giờ đề nghị {0} – kèm lợi ích", "tr": "Şimdi {0} önermek – faydasıyla birlikte", "ar": "الآن عرض {0} – مع ذكر الفائدة"}, "Nach der Entscheidung für den Hauptartikel.": {"vi": "Sau khi quyết định chọn mặt hàng chính.", "tr": "Ana ürün kararından sonra.", "ar": "بعد قرار اختيار السلعة الرئيسية."}, "Oh ja, gute Idee, daran hätte ich nicht gedacht.": {"vi": "Ồ vâng, ý hay, tôi đã không nghĩ đến.", "tr": "Oh evet, iyi fikir, bunu düşünmemiştim.", "ar": "آه نعم، فكرة جيدة، لم أفكر في ذلك."}, "Hm, was kostet das denn?": {"vi": "Hm, cái đó giá bao nhiêu?", "tr": "Hm, bunun fiyatı ne?", "ar": "همم، كم سعر ذلك؟"}, "Na gut, wenn’s schnell geht.": {"vi": "Được thôi, nếu nhanh.", "tr": "Peki, hızlı olacaksa.", "ar": "حسنًا، إن كان سريعًا."}, "Der richtige Zeitpunkt ist in der Regel nach der Entscheidung für den Hauptartikel. Die Kundin kann die Ware dann sofort voll nutzen.": {"vi": "Thời điểm đúng thường là sau khi quyết định chọn mặt hàng chính. Khi đó khách có thể dùng hàng đầy đủ ngay.", "tr": "Doğru zaman kural olarak ana ürün kararından sonradır. Müşteri o zaman ürünü hemen tam olarak kullanabilir.", "ar": "التوقيت الصحيح عادةً بعد قرار اختيار السلعة الرئيسية. عندها تستطيع الزبونة استخدام البضاعة بشكل كامل فورًا."}, "„Brauchen Sie sonst noch was?“": {"vi": "„Ông còn cần gì nữa không?“", "tr": "„Başka bir şeye ihtiyacınız var mı?“", "ar": "„هل تحتاج إلى شيء آخر؟“"}, "Locker nachfragen.": {"vi": "Hỏi thêm một cách thoải mái.", "tr": "Rahat bir şekilde sormak.", "ar": "السؤال بشكل عابر."}, "Nö, danke.": {"vi": "Không, cảm ơn.", "tr": "Yok, teşekkürler.", "ar": "لا، شكرًا."}, "Geschlossen, negativ und zu spät gestellt. Die Kundin sagt „Nein“, und die Chance ist vorbei.": {"vi": "Câu hỏi đóng, phủ định và đặt quá muộn. Khách nói „Không“ và cơ hội đã mất.", "tr": "Kapalı, olumsuz ve çok geç sorulmuş. Müşteri „Hayır“ der ve fırsat kaçar.", "ar": "سؤال مغلق وسلبي وجاء متأخرًا. تقول الزبونة „لا“ وتضيع الفرصة."}, "Nichts anbieten – die Kundschaft hat schon genug ausgegeben": {"vi": "Không đề nghị gì – khách đã chi đủ rồi", "tr": "Hiçbir şey önermemek – müşteri zaten yeterince harcadı", "ar": "عدم عرض أي شيء – الزبون أنفق ما يكفي"}, "Ich will nicht aufdringlich sein.": {"vi": "Tôi không muốn làm phiền.", "tr": "Işık tutmak istemem, ısrarcı olmak istemem.", "ar": "لا أريد أن أكون مُلحًّا."}, "(geht zur Kasse)": {"vi": "(đi ra quầy thu ngân)", "tr": "(kasaya gidiyor)", "ar": "(يتجه إلى الصندوق)"}, "(zu Hause) Mist, ohne Speicherkarte geht ja gar nichts …": {"vi": "(ở nhà) Chết, không có thẻ nhớ thì chẳng làm được gì …", "tr": "(evde) Hay aksi, hafıza kartı olmadan hiçbir şey olmuyor …", "ar": "(في البيت) يا للأسف، بدون بطاقة الذاكرة لا شيء يعمل …"}, "Ein Zusatzangebot ist kein Muss, aber ein Service. Ein Ergänzungsangebot (wie die Speicherkarte zur Kamera) muss dagegen immer angeboten werden.": {"vi": "Hàng thêm không bắt buộc, nhưng là một dịch vụ. Ngược lại, hàng bổ sung (như thẻ nhớ cho máy ảnh) phải luôn được đề nghị.", "tr": "Ek ürün zorunlu değildir ama bir hizmettir. Buna karşılık tamamlayıcı ürün (kameraya hafıza kartı gibi) her zaman önerilmelidir.", "ar": "عرض الإضافة ليس إلزاميًا لكنه خدمة. أما عرض المكمّل (مثل بطاقة الذاكرة للكاميرا) فيجب تقديمه دائمًا."}, "{0} Ein Alternativangebot macht man nur, wenn die gewünschte Ware fehlt – und nur mit gleichem oder höherem Standard.": {"vi": "{0} Chỉ đưa ra đề nghị thay thế khi hàng khách muốn đã hết – và chỉ với tiêu chuẩn bằng hoặc cao hơn.", "tr": "{0} Alternatif teklif sadece istenen ürün yoksa yapılır – ve sadece aynı veya daha yüksek standartla.", "ar": "{0} لا يُقدَّم عرض البديل إلا إذا كانت البضاعة المطلوبة غير متوفرة – وبالمستوى نفسه أو أعلى فقط."}, "Erklären Sie, in welcher Phase des Verkaufsgesprächs Sie Ergänzungsartikel anbieten, und begründen Sie das!": {"vi": "Hãy giải thích bạn đề nghị hàng bổ sung ở giai đoạn nào của cuộc bán hàng và giải thích lý do!", "tr": "Tamamlayıcı ürünleri satış görüşmesinin hangi aşamasında önerdiğinizi açıklayın ve gerekçelendirin!", "ar": "اشرح في أي مرحلة من محادثة البيع تعرض القطع المكمّلة وعلّل ذلك!"}, "Nach der Entscheidung für den Hauptartikel; dann ist der Kunde zum Kauf bereit und für Zubehör offen.": {"vi": "Sau khi quyết định chọn mặt hàng chính; khi đó khách sẵn sàng mua và cởi mở với phụ kiện.", "tr": "Ana ürün kararından sonra; o zaman müşteri satın almaya hazırdır ve aksesuara açıktır.", "ar": "بعد قرار اختيار السلعة الرئيسية؛ عندها يكون الزبون مستعدًا للشراء ومنفتحًا على الملحقات."}, "Bau ein {0}.": {"vi": "Hãy xây dựng một {0}.", "tr": "Bir {0} oluşturun.", "ar": "ابنِ {0}."}, "Brauchen Sie sonst noch": {"vi": "Ông còn cần gì nữa không", "tr": "Başka bir şeye ihtiyacınız var mı", "ar": "هل تحتاج إلى شيء آخر"}, "Geschlossen und negativ – „Nein, danke.“": {"vi": "Đóng và phủ định – „Không, cảm ơn.“", "tr": "Kapalı ve olumsuz – „Hayır, teşekkürler.“", "ar": "مغلق وسلبي – „لا، شكرًا.“"}, "Wollen Sie nicht noch": {"vi": "Ông không muốn thêm", "tr": "Bir de istemez misiniz", "ar": "ألا تريد أيضًا"}, "Klingt aufdringlich.": {"vi": "Nghe có vẻ ép buộc.", "tr": "Zorlayıcı duyulur.", "ar": "يبدو مُلحًّا."}, "Artikel": {"vi": "Mặt hàng", "tr": "Ürün", "ar": "السلعة"}, "irgendwas anderes": {"vi": "cái gì đó khác", "tr": "başka bir şey", "ar": "أي شيء آخر"}, "Ein Angebot muss konkret sein: ein bestimmter Artikel.": {"vi": "Một đề nghị phải cụ thể: một mặt hàng nhất định.", "tr": "Bir teklif somut olmalıdır: belirli bir ürün.", "ar": "يجب أن يكون العرض محددًا: سلعة معينة."}, "– der muss auch mal weg.": {"vi": "– nó cũng phải bán đi thôi.", "tr": "– bunun da bir şekilde gitmesi lazım.", "ar": "– هذا أيضًا يجب أن يُباع."}, "Dein Lagerproblem interessiert die Kundin nicht. Nenne ihren Nutzen.": {"vi": "Vấn đề kho của bạn không liên quan đến khách. Hãy nêu lợi ích của khách.", "tr": "Sizin depo sorununuz müşteriyi ilgilendirmez. Müşterinin faydasını söyleyin.", "ar": "مشكلة مخزنك لا تهم الزبونة. اذكر فائدتها هي."}, "Formulieren Sie in wörtlicher Rede, wie Sie {0} {1} anbieten, und benennen Sie die Angebotsart! (Übungsaufgabe nach Modul 13)": {"vi": "Hãy viết bằng lời nói trực tiếp cách bạn đề nghị {1} cho {0} và gọi tên loại đề nghị! (Bài luyện sau Mô-đun 13)", "tr": "{0} kişisine {1} nasıl önereceğinizi doğrudan konuşma biçiminde yazın ve teklif türünü adlandırın! (Modül 13'ten sonra alıştırma)", "ar": "صُغ بالكلام المباشر كيف تعرض {1} على {0} وسمِّ نوع العرض! (تمرين بعد الوحدة 13)"}, "Ihr Angebot": {"vi": "Đề nghị của bạn", "tr": "Teklifiniz", "ar": "عرضك"}, "Angebotsart": {"vi": "Loại đề nghị", "tr": "Teklif türü", "ar": "نوع العرض"}, "kein „sonst noch“": {"vi": "không có „sonst noch“ (còn gì nữa)", "tr": "„sonst noch“ (başka bir şey) yok", "ar": "بدون „sonst noch“ (أي شيء آخر)"}, "ein Nutzen für die Kundin": {"vi": "một lợi ích cho khách", "tr": "müşteri için bir fayda", "ar": "فائدة للزبونة"}, "Angebotsart richtig benannt ({0})": {"vi": "Gọi đúng tên loại đề nghị ({0})", "tr": "Teklif türü doğru adlandırılmış ({0})", "ar": "ذُكر نوع العرض بشكل صحيح ({0})"}, "Wann darf man ein Alternativangebot machen?": {"vi": "Khi nào được đưa ra đề nghị thay thế?", "tr": "Alternatif teklif ne zaman yapılabilir?", "ar": "متى يجوز تقديم عرض البديل؟"}, "Wenn die gewünschte Ware fehlt – und nur mit gleichem oder höherem Standard.": {"vi": "Khi hàng khách muốn đã hết – và chỉ với tiêu chuẩn bằng hoặc cao hơn.", "tr": "İstenen ürün yoksa – ve sadece aynı veya daha yüksek standartla.", "ar": "عندما تكون البضاعة المطلوبة غير متوفرة – وبالمستوى نفسه أو أعلى فقط."}, "Immer, wenn man eine andere Ware loswerden möchte.": {"vi": "Luôn luôn, khi muốn bán bớt một mặt hàng khác.", "tr": "Her zaman, başka bir ürünü elden çıkarmak istediğinizde.", "ar": "دائمًا، عندما يريد المرء التخلص من سلعة أخرى."}, "Nur bei Stammkunden.": {"vi": "Chỉ với khách quen.", "tr": "Sadece müdavim müşterilerde.", "ar": "فقط مع الزبائن الدائمين."}, "Kaufabschluss, Service und Verabschiedung": {"vi": "Chốt đơn, dịch vụ và lời chào tạm biệt", "tr": "Satışın tamamlanması, hizmet ve vedalaşma", "ar": "إتمام البيع والخدمة والتوديع"}, "Abschluss": {"vi": "Chốt đơn", "tr": "Sonuçlandırma", "ar": "الإتمام"}, "Module 14 und 15": {"vi": "Mô-đun 14 và 15", "tr": "Modül 14 ve 15", "ar": "الوحدتان 14 و15"}, "Kaufabschluss: 8 Teilaufgaben in 7 Prüfungen, Service und Verabschiedung: 13 in 6. Oft: Kaufbestätigung mit Verabschiedung in wörtlicher Rede.": {"vi": "Chốt đơn: 8 câu hỏi nhỏ trong 7 kỳ thi, dịch vụ và chào tạm biệt: 13 trong 6. Thường: xác nhận mua hàng kèm lời chào tạm biệt bằng lời nói trực tiếp.", "tr": "Satışın tamamlanması: 7 sınavda 8 alt soru, hizmet ve vedalaşma: 6'sında 13. Sık sık: doğrudan konuşmayla satın alma onayı ve vedalaşma.", "ar": "إتمام البيع: 8 أسئلة فرعية في 7 امتحانات، الخدمة والتوديع: 13 في 6. غالبًا: تأكيد الشراء مع توديع بالكلام المباشر."}, "{0} nimmt {1} noch einmal in die Hand, nickt und fragt: „Kann ich auch mit Karte zahlen?“": {"vi": "{0} lại cầm {1} lên, gật đầu và hỏi: „Tôi trả bằng thẻ được không?“", "tr": "{0}, {1} bir kez daha eline alıyor, başını sallıyor ve soruyor: „Kartla da ödeyebilir miyim?“", "ar": "يمسك {0} {1} مرة أخرى ويومئ برأسه ويسأل: „هل يمكنني الدفع بالبطاقة أيضًا؟“"}, "Kaufsignal erkennen: Entscheidung bestätigen, Umtausch erwähnen, zur Kasse begleiten": {"vi": "Nhận ra tín hiệu mua: xác nhận quyết định, nhắc đến việc đổi hàng, dẫn khách đến quầy thu ngân", "tr": "Satın alma sinyalini fark etmek: kararı onaylamak, değişimden bahsetmek, müşteriyi kasaya götürmek", "ar": "ملاحظة إشارة الشراء: تأكيد القرار والإشارة إلى الاستبدال ومرافقة الزبون إلى الصندوق"}, "Kaufbestätigung und freundliche Verabschiedung": {"vi": "Xác nhận mua hàng và chào tạm biệt thân thiện", "tr": "Satın alma onayı ve samimi vedalaşma", "ar": "تأكيد الشراء وتوديع ودود"}, "Wunderbar, dann nehme ich das.": {"vi": "Tuyệt, vậy tôi lấy cái này.", "tr": "Harika, o zaman bunu alıyorum.", "ar": "ممتاز، إذن سآخذ هذا."}, "Schön! Ach – können Sie es mir noch einpacken?": {"vi": "Hay quá! À – cô gói giúp tôi được không?", "tr": "Güzel! Ah – bunu bana paketleyebilir misiniz?", "ar": "جميل! آه – هل يمكنك تغليفه لي؟"}, "Die Frage nach der Zahlungsweise ist ein Kaufsignal. Jetzt bestärkst du die Entscheidung – das schafft Vertrauen und verhindert den „Kaufkater“.": {"vi": "Câu hỏi về cách thanh toán là tín hiệu mua. Bây giờ bạn củng cố quyết định – điều đó tạo niềm tin và ngăn „hối hận sau mua“.", "tr": "Ödeme şekli sorusu bir satın alma sinyalidir. Şimdi kararı pekiştirirsiniz – bu güven yaratır ve „alım pişmanlığını“ önler.", "ar": "السؤال عن طريقة الدفع إشارة شراء. الآن تعزّز القرار – وهذا يخلق الثقة ويمنع „ندم ما بعد الشراء“."}, "Abschluss mit Service: Geschenkverpackung oder Lieferung anbieten, dann bestätigen": {"vi": "Chốt đơn kèm dịch vụ: đề nghị gói quà hoặc giao hàng, rồi xác nhận", "tr": "Hizmetle birlikte sonuçlandırma: hediye paketi veya teslimat önermek, sonra onaylamak", "ar": "الإتمام مع الخدمة: عرض تغليف هدايا أو توصيل ثم التأكيد"}, "Serviceleistung plus Kaufbestätigung": {"vi": "Dịch vụ cộng với xác nhận mua hàng", "tr": "Hizmet artı satın alma onayı", "ar": "الخدمة مع تأكيد الشراء"}, "Oh, wie aufmerksam!": {"vi": "Ồ, chu đáo quá!", "tr": "Oh, ne kadar ince düşünceli!", "ar": "يا له من اهتمام!"}, "Nee, brauch ich nicht, ich will nur zahlen.": {"vi": "Không, tôi không cần, tôi chỉ muốn trả tiền.", "tr": "Yok, gerek yok, sadece ödemek istiyorum.", "ar": "لا، لا أحتاج، أريد الدفع فقط."}, "Nein danke, ich nehm’s so mit.": {"vi": "Không, cảm ơn, tôi mang về luôn.", "tr": "Hayır teşekkürler, böyle alıyorum.", "ar": "لا شكرًا، سآخذه هكذا."}, "Serviceleistungen (warenbezogen: Geschenkverpackung, Lieferung) erleichtern die Entscheidung – vor allem bei Geschenken. Wer nur schnell zahlen will, braucht sie nicht.": {"vi": "Dịch vụ liên quan đến hàng hóa (gói quà, giao hàng) giúp quyết định dễ hơn – nhất là với quà tặng. Ai chỉ muốn trả nhanh thì không cần.", "tr": "Ürünle ilgili hizmetler (hediye paketi, teslimat) kararı kolaylaştırır – özellikle hediyelerde. Sadece hızlı ödemek isteyen buna ihtiyaç duymaz.", "ar": "الخدمات المتعلقة بالبضاعة (تغليف الهدايا والتوصيل) تسهّل القرار – خاصة مع الهدايا. ومن يريد الدفع بسرعة فقط لا يحتاجها."}, "Weiter argumentieren – man kann nie genug Argumente bringen": {"vi": "Tiếp tục lập luận – không bao giờ có đủ lập luận", "tr": "Argüman getirmeye devam etmek – hiçbir zaman yeterince argüman olmaz", "ar": "مواصلة الإقناع – لا تكفي الحجج أبدًا"}, "Sicher ist sicher.": {"vi": "Chắc ăn vẫn hơn.", "tr": "Garanti olsun.", "ar": "الحذر واجب."}, "(seufzt) Ich wollte doch nur wissen, ob ich mit Karte zahlen kann …": {"vi": "(thở dài) Tôi chỉ muốn biết có trả bằng thẻ được không thôi mà …", "tr": "(iç çekiyor) Ben sadece kartla ödeyip ödeyemeyeceğimi öğrenmek istemiştim …", "ar": "(تتنهد) أردت فقط أن أعرف إن كان يمكنني الدفع بالبطاقة …"}, "Das Kaufsignal wurde übersehen. Wer jetzt weiterredet, bringt die Kundin wieder ins Zweifeln.": {"vi": "Tín hiệu mua đã bị bỏ qua. Ai nói tiếp bây giờ sẽ làm khách lại nghi ngờ.", "tr": "Satın alma sinyali gözden kaçırıldı. Şimdi konuşmaya devam eden, müşteriyi yeniden tereddüde sokar.", "ar": "تمّ تجاهل إشارة الشراء. ومن يواصل الكلام الآن يعيد الزبونة إلى الشك."}, "Kaufsignal und Kaufbestätigung": {"vi": "Tín hiệu mua và xác nhận mua hàng", "tr": "Satın alma sinyali ve satın alma onayı", "ar": "إشارة الشراء وتأكيد الشراء"}, "Kaufsignale: Fragen nach Zahlung, Lieferung oder Service, zustimmendes Nicken, die Ware erneut prüfen, nach dem Geldbeutel greifen. Danach: Entscheidung bestätigen, bedanken, situationsbezogen verabschieden – nach dem Kauf ist vor dem Kauf.": {"vi": "Tín hiệu mua: hỏi về thanh toán, giao hàng hoặc dịch vụ, gật đầu đồng ý, xem lại hàng, với tay lấy ví. Sau đó: xác nhận quyết định, cảm ơn, chào tạm biệt phù hợp tình huống – sau lần mua là trước lần mua tiếp theo.", "tr": "Satın alma sinyalleri: ödeme, teslimat veya hizmet hakkında soru, onaylayan baş sallama, ürünü yeniden kontrol etmek, cüzdana uzanmak. Sonra: kararı onaylamak, teşekkür etmek, duruma uygun vedalaşmak – satın alımdan sonrası, bir sonraki satın alımın öncesidir.", "ar": "إشارات الشراء: أسئلة عن الدفع أو التوصيل أو الخدمة، إيماءة موافقة، فحص البضاعة مرة أخرى، مدّ اليد إلى المحفظة. بعد ذلك: تأكيد القرار والشكر والتوديع المناسب للموقف – بعد الشراء هو قبل الشراء التالي."}, "Der Kunde entscheidet sich für einen Wintermantel. Formulieren Sie eine situationsgerechte Kaufbestätigung mit Verabschiedung in wörtlicher Rede!": {"vi": "Khách quyết định mua một chiếc áo khoác mùa đông. Hãy viết lời xác nhận mua hàng phù hợp tình huống kèm lời chào tạm biệt bằng lời nói trực tiếp!", "tr": "Müşteri bir kışlık palto almaya karar veriyor. Duruma uygun bir satın alma onayını vedalaşmayla birlikte doğrudan konuşma biçiminde yazın!", "ar": "يقرر الزبون شراء معطف شتوي. صُغ تأكيد شراء مناسبًا للموقف مع توديع بالكلام المباشر!"}, "z. B. „Mit diesem Mantel haben Sie eine sehr gute Wahl getroffen, er hält Sie auch bei Minusgraden warm. Falls er nicht passt, können Sie ihn umtauschen. Einen schönen Tag noch!“ Ohne Kaufbestätigung nur 1 P.": {"vi": "ví dụ „Với chiếc áo này ông đã chọn rất tốt, nó giữ ấm cho ông cả khi dưới 0 độ. Nếu không vừa, ông có thể đổi. Chúc ông một ngày tốt lành!“ Không có xác nhận mua hàng chỉ 1 điểm.", "tr": "örn. „Bu paltoyla çok iyi bir seçim yaptınız, eksi derecelerde bile sizi sıcak tutar. Uymazsa değiştirebilirsiniz. İyi günler dilerim!“ Satın alma onayı olmadan sadece 1 P.", "ar": "مثلًا „بهذا المعطف أحسنت الاختيار جدًا، فهو يبقيك دافئًا حتى في درجات حرارة تحت الصفر. وإن لم يناسبك يمكنك استبداله. أتمنى لك يومًا جميلًا!“ بدون تأكيد الشراء نقطة واحدة فقط."}, "Bau eine Kaufbestätigung mit Verabschiedung.": {"vi": "Hãy xây dựng lời xác nhận mua hàng kèm chào tạm biệt.", "tr": "Vedalaşmalı bir satın alma onayı oluşturun.", "ar": "ابنِ تأكيد شراء مع توديع."}, "Bestätigung": {"vi": "Xác nhận", "tr": "Onay", "ar": "التأكيد"}, "Na endlich haben Sie sich entschieden": {"vi": "Cuối cùng ông cũng quyết định rồi", "tr": "Nihayet karar verdiniz", "ar": "أخيرًا قررتَ"}, "Ungeduldig. Die Kundin soll sich in ihrer Entscheidung bestärkt fühlen.": {"vi": "Sốt ruột. Khách phải cảm thấy được củng cố trong quyết định.", "tr": "Sabırsız. Müşteri kararında desteklendiğini hissetmeli.", "ar": "غير صبور. يجب أن تشعر الزبونة أن قرارها تعزّز."}, "Hoffentlich gefällt es Ihnen": {"vi": "Hy vọng ông thích nó", "tr": "Umarım beğenirsiniz", "ar": "آمل أن يعجبك"}, "Das sät Zweifel – das Gegenteil einer Kaufbestätigung.": {"vi": "Điều đó gieo nghi ngờ – ngược với xác nhận mua hàng.", "tr": "Bu şüphe tohumu eker – satın alma onayının tam tersi.", "ar": "هذا يزرع الشك – عكس تأكيد الشراء."}, "Service": {"vi": "Dịch vụ", "tr": "Hizmet", "ar": "الخدمة"}, "– Umtausch gibt’s aber nicht.": {"vi": "– nhưng ở đây không đổi hàng đâu.", "tr": "– ama burada değişim yok.", "ar": "– لكن لا يوجد استبدال هنا."}, "Abweisend. Ein Hinweis auf den Umtausch nimmt der Kundin die Sorge.": {"vi": "Thiếu thân thiện. Nhắc đến việc đổi hàng giúp khách bớt lo.", "tr": "Reddedici. Değişimden bahsetmek müşterinin endişesini giderir.", "ar": "فظّ. الإشارة إلى الاستبدال تزيل قلق الزبونة."}, "Verabschiedung": {"vi": "Chào tạm biệt", "tr": "Vedalaşma", "ar": "التوديع"}, "Vielen Dank für Ihren Einkauf und einen schönen Tag noch!": {"vi": "Cảm ơn ông đã mua hàng và chúc ông một ngày tốt lành!", "tr": "Alışverişiniz için çok teşekkürler, iyi günler dilerim!", "ar": "شكرًا جزيلًا على مشترياتك وأتمنى لك يومًا جميلًا!"}, "Tschüss.": {"vi": "Tạm biệt.", "tr": "Hoşça kalın.", "ar": "إلى اللقاء."}, "Zu knapp und nicht situationsgerecht. Immer zuerst bedanken.": {"vi": "Quá cộc lốc và không phù hợp tình huống. Luôn cảm ơn trước tiên.", "tr": "Çok kısa ve duruma uygun değil. Her zaman önce teşekkür edin.", "ar": "مقتضب جدًا وغير مناسب للموقف. اشكر دائمًا أولًا."}, "Der Nächste, bitte!": {"vi": "Người tiếp theo!", "tr": "Sıradaki lütfen!", "ar": "التالي من فضلك!"}, "Die Kundin fühlt sich abgefertigt.": {"vi": "Khách cảm thấy bị làm cho xong chuyện.", "tr": "Müşteri baştan savılmış hissediyor.", "ar": "تشعر الزبونة أنه تمّ التخلص منها بسرعة."}, "{0} entschließt sich zum Kauf. Formulieren Sie eine situationsgerechte Kaufbestätigung mit Verabschiedung in wörtlicher Rede!": {"vi": "{0} quyết định mua. Hãy viết lời xác nhận mua hàng phù hợp tình huống kèm lời chào tạm biệt bằng lời nói trực tiếp!", "tr": "{0} satın almaya karar veriyor. Duruma uygun bir satın alma onayını vedalaşmayla birlikte doğrudan konuşma biçiminde yazın!", "ar": "يقرر {0} الشراء. صُغ تأكيد شراء مناسبًا للموقف مع توديع بالكلام المباشر!"}, "Ihre Kaufbestätigung mit Verabschiedung": {"vi": "Xác nhận mua hàng kèm chào tạm biệt của bạn", "tr": "Vedalaşmalı satın alma onayınız", "ar": "تأكيد الشراء مع التوديع الخاص بك"}, "Kaufbestätigung (z. B. „gute Wahl“, „Freude“, „beglückwünsche“)": {"vi": "Xác nhận mua hàng (ví dụ „lựa chọn tốt“, „niềm vui“, „xin chúc mừng“)", "tr": "Satın alma onayı (örn. „iyi seçim“, „keyif“, „tebrik ederim“)", "ar": "تأكيد الشراء (مثلًا „اختيار جيد“ و„متعة“ و„أهنئك“)"}, "Dank oder Verabschiedung": {"vi": "Cảm ơn hoặc chào tạm biệt", "tr": "Teşekkür veya vedalaşma", "ar": "شكر أو توديع"}, "Pluspunkt: Name der Kundschaft": {"vi": "Điểm cộng: tên khách", "tr": "Artı puan: müşterinin adı", "ar": "نقطة إضافية: اسم الزبون"}, "Begründen Sie, warum eine Kaufbestätigung für die Kundin wichtig ist.": {"vi": "Hãy giải thích vì sao xác nhận mua hàng quan trọng với khách.", "tr": "Satın alma onayının müşteri için neden önemli olduğunu gerekçelendirin.", "ar": "علّل لماذا يهم تأكيد الشراء للزبونة."}, "Sie bestärkt die Kundin in ihrer Entscheidung und schafft Vertrauen zur Verkäuferin.": {"vi": "Nó củng cố quyết định của khách và tạo niềm tin vào người bán.", "tr": "Müşteriyi kararında güçlendirir ve satıcıya güven yaratır.", "ar": "يعزّز قرار الزبونة ويخلق الثقة بالبائعة."}, "Sie ist gesetzlich vorgeschrieben.": {"vi": "Vì luật bắt buộc.", "tr": "Çünkü yasal olarak zorunlu.", "ar": "لأنه إلزامي قانونًا."}, "Damit die Kundin noch mehr kauft.": {"vi": "Để khách mua nhiều hơn nữa.", "tr": "Müşteri daha fazla alsın diye.", "ar": "لكي تشتري الزبونة أكثر."}, "Begleitung": {"vi": "Người đi cùng", "tr": "Refakatçi", "ar": "المرافق"}, "{0} hat jemanden dabei, der gelangweilt danebensteht und auf die Uhr schaut.": {"vi": "{0} đi cùng một người đứng bên cạnh, chán nản và nhìn đồng hồ.", "tr": "{0} yanında birini getirmiş; o can sıkıntısıyla yanında duruyor ve saate bakıyor.", "ar": "لدى {0} شخص برفقته يقف بجانبه ضجرًا وينظر إلى الساعة."}, "Die Begleitperson freundlich einbeziehen": {"vi": "Thân thiện lôi kéo người đi cùng vào cuộc trò chuyện", "tr": "Refakatçiyi samimi bir şekilde dahil etmek", "ar": "إشراك المرافق بود"}, "Nur mit der Kundschaft reden – die Begleitung stört": {"vi": "Chỉ nói chuyện với khách – người đi cùng làm phiền", "tr": "Sadece müşteriyle konuşmak – refakatçi rahatsız ediyor", "ar": "التحدث مع الزبون فقط – المرافق يزعج"}, "Begleitpersonen werden mit einbezogen. Sie beeinflussen die Kaufentscheidung oft mit (Modul 4).": {"vi": "Người đi cùng được lôi kéo vào cuộc trò chuyện. Họ thường cũng ảnh hưởng đến quyết định mua (Mô-đun 4).", "tr": "Refakatçiler dahil edilir. Satın alma kararını çoğu zaman onlar da etkiler (Modül 4).", "ar": "يُشرَك المرافقون. فهم غالبًا يؤثرون في قرار الشراء أيضًا (الوحدة 4)."}, "Kind dabei": {"vi": "Có trẻ em đi cùng", "tr": "Çocuk yanında", "ar": "طفل برفقته"}, "Ein Kind, das mit {0} gekommen ist, fängt an zu quengeln.": {"vi": "Một đứa trẻ đi cùng {0} bắt đầu mè nheo.", "tr": "{0} ile gelen bir çocuk mızmızlanmaya başlıyor.", "ar": "يبدأ طفل جاء مع {0} بالنق والتذمّر."}, "Das Kind beschäftigen, zum Beispiel mit einem Malblock": {"vi": "Cho trẻ có việc làm, ví dụ bằng một quyển vở tô màu", "tr": "Çocuğu meşgul etmek, örneğin bir boyama defteriyle", "ar": "إشغال الطفل، مثلًا بدفتر تلوين"}, "Einfach lauter weiterreden": {"vi": "Cứ nói to hơn", "tr": "Daha yüksek sesle konuşmaya devam etmek", "ar": "مواصلة الكلام بصوت أعلى"}, "Kinder beschäftigen gehört dazu, damit sich die Kundschaft willkommen fühlt (Modul 4).": {"vi": "Cho trẻ có việc làm là một phần của dịch vụ, để khách cảm thấy được chào đón (Mô-đun 4).", "tr": "Çocukları meşgul etmek işin bir parçasıdır; müşteri kendini hoş karşılanmış hissetsin diye (Modül 4).", "ar": "إشغال الأطفال جزء من العمل، لكي يشعر الزبائن بأنهم موضع ترحيب (الوحدة 4)."}, "Kollegin ruft": {"vi": "Đồng nghiệp gọi", "tr": "Meslektaş sesleniyor", "ar": "الزميلة تنادي"}, "Eine Kollegin ruft quer durch den Laden: „Hast du mal kurz?“": {"vi": "Một đồng nghiệp gọi vang khắp cửa hàng: „Cậu có rảnh một chút không?“", "tr": "Bir meslektaşınız mağazanın öbür ucundan sesleniyor: „Bir dakikan var mı?“", "ar": "تنادي زميلة عبر المتجر: „هل لديك دقيقة؟“"}, "„Ich komme gleich, ich berate gerade.“ – und weiter bei der Kundschaft bleiben": {"vi": "„Tôi đến ngay, tôi đang tư vấn.“ – và tiếp tục ở lại với khách", "tr": "„Hemen geliyorum, şu an danışmanlık yapıyorum.“ – ve müşterinin yanında kalmaya devam etmek", "ar": "„سأتي حالًا، أنا أقدّم استشارة الآن.“ – ومواصلة البقاء مع الزبون"}, "Die Kundschaft kurz stehen lassen": {"vi": "Bỏ khách đứng đó một lát", "tr": "Müşteriyi bir süre bırakmak", "ar": "ترك الزبون واقفًا لوقت قصير"}, "Kundschaft fühlt sich schnell zurückgesetzt, wenn man sie warten lässt. Die Kundin hat Vorrang (Modul 4).": {"vi": "Khách rất dễ cảm thấy bị coi nhẹ khi phải chờ. Khách có quyền ưu tiên (Mô-đun 4).", "tr": "Müşteri bekletildiğinde kendini hemen ikinci planda hisseder. Müşterinin önceliği vardır (Modül 4).", "ar": "يشعر الزبون بسرعة بأنه مهمَّش عندما يُترك ينتظر. للزبونة الأولوية (الوحدة 4)."}, "Voller Tisch": {"vi": "Bàn đầy hàng", "tr": "Dolu masa", "ar": "طاولة ممتلئة"}, "Auf dem Tisch liegen inzwischen fünf Modelle. Zwei davon gefallen {0} gar nicht.": {"vi": "Trên bàn giờ có năm mẫu. Hai trong số đó {0} hoàn toàn không thích.", "tr": "Masada şimdi beş model var. Bunlardan ikisi {0} hiç hoşuna gitmiyor.", "ar": "على الطاولة الآن خمسة طرازات. اثنان منها لا يعجبان {0} إطلاقًا."}, "Die zwei Modelle gleich wegräumen": {"vi": "Dọn ngay hai mẫu đó đi", "tr": "İki modeli hemen kaldırmak", "ar": "إزالة الطرازين فورًا"}, "Liegen lassen – mehr Auswahl ist besser": {"vi": "Để nguyên – nhiều lựa chọn hơn là tốt hơn", "tr": "Bırakmak – daha fazla seçenek daha iyidir", "ar": "تركهما – خيارات أكثر أفضل"}, "Was nicht infrage kommt, wird weggeräumt: Die Auswahl bleibt überschaubar, die Entscheidung fällt leichter.": {"vi": "Những gì không phù hợp thì cất đi: lựa chọn vẫn dễ nhìn, quyết định dễ dàng hơn.", "tr": "Söz konusu olmayanlar kaldırılır: Seçenek anlaşılır kalır, karar kolaylaşır.", "ar": "ما لا يأتي في الحسبان يُبعَد: تبقى الخيارات واضحة ويصبح القرار أسهل."}, "Erschöpft": {"vi": "Kiệt sức", "tr": "Bitkin", "ar": "منهك"}, "{0} wirkt erschöpft, stellt die Tasche ab und atmet tief durch.": {"vi": "{0} có vẻ kiệt sức, đặt túi xuống và thở sâu.", "tr": "{0} bitkin görünüyor, çantasını bırakıyor ve derin nefes alıyor.", "ar": "يبدو {0} منهكًا، يضع الحقيبة ويتنفس بعمق."}, "Eine Sitzgelegenheit und ein Glas Wasser anbieten": {"vi": "Mời một chỗ ngồi và một ly nước", "tr": "Oturacak yer ve bir bardak su ikram etmek", "ar": "عرض مقعد وكأس ماء"}, "Schneller reden, damit es bald vorbei ist": {"vi": "Nói nhanh hơn để sớm kết thúc", "tr": "Çabuk bitsin diye daha hızlı konuşmak", "ar": "التحدث بسرعة أكبر لينتهي الأمر قريبًا"}, "Eine Sitzgelegenheit und eine Erfrischung anbieten schafft eine positive Verkaufsatmosphäre und keine Hektik (Modul 4; Sommer 2020, Aufgabe 4.1).": {"vi": "Mời chỗ ngồi và đồ giải khát tạo bầu không khí bán hàng tích cực và không vội vàng (Mô-đun 4; Mùa hè 2020, bài 4.1).", "tr": "Oturacak yer ve içecek ikram etmek olumlu bir satış atmosferi yaratır ve telaşı önler (Modül 4; Yaz 2020, Görev 4.1).", "ar": "عرض مقعد ومشروب منعش يخلق جوًّا إيجابيًا للبيع ويمنع التوتر (الوحدة 4؛ صيف 2020، المهمة 4.1)."}, "Griff zum Geldbeutel": {"vi": "Với tay lấy ví", "tr": "Cüzdana uzanmak", "ar": "مدّ اليد إلى المحفظة"}, "{0} nickt zufrieden und greift unbewusst nach dem Geldbeutel.": {"vi": "{0} gật đầu hài lòng và vô thức với tay lấy ví.", "tr": "{0} memnun bir şekilde başını sallıyor ve istemeden cüzdanına uzanıyor.", "ar": "يومئ {0} برضا ويمد يده دون وعي إلى المحفظة."}, "Kaufsignal erkennen und zum Abschluss kommen": {"vi": "Nhận ra tín hiệu mua và chuyển sang chốt đơn", "tr": "Satın alma sinyalini fark edip sonuçlandırmaya geçmek", "ar": "ملاحظة إشارة الشراء والانتقال إلى الإتمام"}, "Noch fünf weitere Argumente bringen": {"vi": "Đưa thêm năm lập luận nữa", "tr": "Beş argüman daha getirmek", "ar": "إضافة خمس حجج أخرى"}, "Der Griff zum Geldbeutel ist ein körpersprachliches Kaufsignal. Jetzt nicht weiterreden, sondern den Abschluss einleiten (Modul 14).": {"vi": "Với tay lấy ví là tín hiệu mua bằng ngôn ngữ cơ thể. Bây giờ đừng nói tiếp mà hãy dẫn vào chốt đơn (Mô-đun 14).", "tr": "Cüzdana uzanmak beden diliyle bir satın alma sinyalidir. Şimdi konuşmaya devam etmeyin, satışı sonuçlandırmaya geçin (Modül 14).", "ar": "مدّ اليد إلى المحفظة إشارة شراء بلغة الجسد. الآن لا تواصل الكلام بل ابدأ بالإتمام (الوحدة 14)."}, "„Guten Tag, Frau Wolf! Schön, dass Sie wieder da sind.“": {"vi": "„Xin chào, cô Wolf! Rất vui vì cô lại đến.“", "tr": "„İyi günler Bayan Wolf! Tekrar geldiğinize sevindim.“", "ar": "„مرحبًا آنسة فولف! يسعدني أنكِ عدتِ.“"}, "„Gerne. Wenn Sie Hilfe brauchen, bin ich für Sie da.“": {"vi": "„Vâng. Nếu cần giúp, tôi luôn sẵn sàng.“", "tr": "„Memnuniyetle. Yardıma ihtiyacınız olursa buradayım.“", "ar": "„بكل سرور. إن احتجتِ إلى مساعدة فأنا موجود.“"}, "„Wofür möchten Sie den Rucksack vor allem verwenden?“": {"vi": "„Ông chủ yếu dùng ba lô để làm gì?“", "tr": "„Sırt çantasını en çok ne için kullanacaksınız?“", "ar": "„فيمَ تريد استخدام حقيبة الظهر بشكل رئيسي؟“"}, "„Trägt Ihre Tochter eher helle oder dunkle Farben?“": {"vi": "„Con gái bà thường mặc màu sáng hay màu tối hơn?“", "tr": "„Kızınız daha çok açık mı yoksa koyu renkler mi giyer?“", "ar": "„هل ترتدي ابنتك الألوان الفاتحة أم الداكنة غالبًا؟“"}, "„Nehmen Sie die Tasche ruhig einmal in die Hand.“": {"vi": "„Bà cứ cầm chiếc túi lên thử đi.“", "tr": "„Çantayı rahatça bir elinize alın.“", "ar": "„امسكي الحقيبة بكل راحة.“"}, "„Spüren Sie, wie leicht der Schlafsack ist?“": {"vi": "„Bà cảm nhận được túi ngủ nhẹ thế nào không?“", "tr": "„Uyku tulumunun ne kadar hafif olduğunu hissediyor musunuz?“", "ar": "„هل تشعرين كم كيس النوم خفيف؟“"}, "„Die Jacke ist aus Gore-Tex. Damit bleiben Sie auch bei Dauerregen trocken.“": {"vi": "„Áo khoác làm từ Gore-Tex. Nhờ đó ông vẫn khô ráo cả khi mưa dai dẳng.“", "tr": "„Ceket Gore-Tex'ten. Böylece sürekli yağmurda bile kuru kalırsınız.“", "ar": "„السترة من غور-تكس. وبذلك تبقى جافًا حتى مع المطر المتواصل.“"}, "„Der Stoff ist atmungsaktiv, das Hemd kostet 59 Euro – und Sie müssen es nicht bügeln.“": {"vi": "„Vải thoáng khí, áo sơ mi giá 59 euro – và ông không phải ủi.“", "tr": "„Kumaş nefes alır, gömlek 59 Euro – ve ütülemeniz gerekmez.“", "ar": "„القماش يسمح بمرور الهواء، والقميص بـ 59 يورو – ولا تحتاج إلى كيّه.“"}, "„Bei zehn Jahren Nutzung sind das weniger als 20 Cent pro Nacht.“": {"vi": "„Dùng trong mười năm thì chưa đến 20 xu mỗi đêm.“", "tr": "„On yıllık kullanımda bu gecede 20 sentten az.“", "ar": "„على مدى عشر سنوات من الاستخدام أقل من 20 سنتًا في الليلة.“"}, "„Ja, da haben Sie recht. Dafür ist dieser Pullover sehr pflegeleicht.“": {"vi": "„Vâng, bà nói đúng. Bù lại, chiếc áo len này rất dễ chăm sóc.“", "tr": "„Evet, haklısınız. Buna karşılık bu kazağın bakımı çok kolay.“", "ar": "„نعم، معك حق. في المقابل هذه السترة الصوفية سهلة العناية جدًا.“"}, "„Wo genau haben Sie den Artikel günstiger gesehen?“": {"vi": "„Chính xác bà đã thấy mặt hàng đó rẻ hơn ở đâu?“", "tr": "„Ürünü tam olarak nerede daha ucuz gördünüz?“", "ar": "„أين رأيتِ السلعة أرخص بالضبط؟“"}, "„Zur Kamera brauchen Sie noch eine Speicherkarte.“": {"vi": "„Cùng với máy ảnh bà cần thêm một thẻ nhớ.“", "tr": "„Kamerayla birlikte bir de hafıza kartına ihtiyacınız var.“", "ar": "„مع الكاميرا تحتاجين إلى بطاقة ذاكرة أيضًا.“"}, "„Dieses Modell führen wir nicht, aber diese Jacke hat die gleiche Qualität.“": {"vi": "„Mẫu này chúng tôi không có, nhưng chiếc áo khoác này có cùng chất lượng.“", "tr": "„Bu modeli yönetmiyoruz ama bu ceket aynı kalitede.“", "ar": "„هذا الطراز لا نوفره، لكن هذه السترة بالجودة نفسها.“"}, "„Mit dieser Uhr werden Sie Ihrer Frau eine große Freude machen.“": {"vi": "„Với chiếc đồng hồ này ông sẽ làm vợ ông rất vui.“", "tr": "„Bu saatle eşinizi çok sevindireceksiniz.“", "ar": "„بهذه الساعة ستُدخل على زوجتك فرحة كبيرة.“"}, "„Vielen Dank für Ihren Einkauf und ein schönes Wochenende!“": {"vi": "„Cảm ơn bà rất nhiều đã mua hàng và chúc bà cuối tuần vui vẻ!“", "tr": "„Alışverişiniz için çok teşekkürler ve güzel bir hafta sonu dilerim!“", "ar": "„شكرًا جزيلًا على مشترياتك وأتمنى لك عطلة نهاية أسبوع جميلة!“"}, "„Möchten Sie die Kaffeemaschine gleich mitnehmen oder nutzen Sie unseren Lieferservice?“": {"vi": "„Ông muốn mang máy pha cà phê đi luôn, hay dùng dịch vụ giao hàng của chúng tôi?“", "tr": "„Kahve makinesini hemen yanınızda mı götürmek istersiniz, yoksa teslimat hizmetimizi mi kullanırsınız?“", "ar": "„هل تريد أخذ آلة القهوة معك فورًا أم تستخدم خدمة التوصيل لدينا؟“"}, "Warum spricht man von „Stufen“ des Verkaufsgesprächs und nicht von einem „Fahrstuhl“?": {"vi": "Vì sao người ta nói „các bậc“ của cuộc bán hàng chứ không phải „thang máy“?", "tr": "Satış görüşmesinin neden „basamakları“ deniyor da „asansörü“ denmiyor?", "ar": "لماذا يُقال „درجات“ محادثة البيع وليس „مصعدًا“؟"}, "Nicht jedes Gespräch hat alle acht Phasen, und die Phasen sind unterschiedlich lang. Manchmal steht man sofort bei der Preisnennung, manchmal kommt es gar nicht zum Kauf. Zum Ziel kommt man nur, wenn man sich auf jeden Kunden neu einstellt.": {"vi": "Không phải cuộc trò chuyện nào cũng có đủ tám giai đoạn, và các giai đoạn dài ngắn khác nhau. Đôi khi đứng ngay ở bước nêu giá, đôi khi không đến việc mua. Chỉ đạt mục tiêu khi thích ứng lại với từng khách.", "tr": "Her görüşmede sekiz aşamanın hepsi olmaz ve aşamalar farklı uzunluktadır. Bazen hemen fiyat söylemede durulur, bazen satın alma hiç gerçekleşmez. Hedefe ancak her müşteriye yeniden uyum sağlayarak ulaşılır.", "ar": "ليست كل محادثة فيها المراحل الثماني كلها، والمراحل تختلف في طولها. أحيانًا يجد المرء نفسه فورًا عند ذكر السعر وأحيانًا لا يحدث الشراء أصلًا. لا يصل المرء إلى الهدف إلا إذا تكيّف من جديد مع كل زبون."}, "Erklären Sie den Unterschied zwischen einem Einwand und einem Vorwand. Woran erkennen Sie einen Vorwand?": {"vi": "Hãy giải thích sự khác nhau giữa phản đối và cái cớ. Bạn nhận ra cái cớ ở đâu?", "tr": "İtiraz ile bahane arasındaki farkı açıklayın. Bir bahaneyi nereden anlarsınız?", "ar": "اشرح الفرق بين الاعتراض والذريعة. كيف تتعرف على الذريعة؟"}, "Ein Einwand ist ein echter Grund, der gegen den Kauf spricht (z. B. Preis-Leistung, Qualität). Ein Vorwand ist ein vorgeschobener Grund, der den eigentlichen Grund verdeckt. Hinweis: Der Kunde bleibt vage, wechselt die Begründung oder geht auf Argumente gar nicht ein.": {"vi": "Phản đối là lý do thật chống lại việc mua (ví dụ giá – chất lượng, chất lượng). Cái cớ là lý do viện ra che giấu lý do thật. Gợi ý: khách nói mơ hồ, đổi lý do hoặc không hề đáp lại lập luận.", "tr": "İtiraz, satın almaya karşı gerçek bir nedendir (örn. fiyat-performans, kalite). Bahane, asıl nedeni gizleyen öne sürülmüş bir nedendir. İpucu: Müşteri belirsiz kalır, gerekçeyi değiştirir veya argümanlara hiç girmez.", "ar": "الاعتراض سبب حقيقي ضد الشراء (مثل السعر مقابل القيمة أو الجودة). الذريعة سبب مُختلَق يخفي السبب الحقيقي. دليل: يظل الزبون غامضًا أو يغيّر تعليله أو لا يتجاوب مع الحجج إطلاقًا."}, "Eine Kollegin sagt: „Null Problem! Ich zeige Ihnen mal die billigen Modelle.“ Nennen Sie zwei Fehler und verbessern Sie in wörtlicher Rede.": {"vi": "Một đồng nghiệp nói: „Không vấn đề! Để tôi chỉ mấy mẫu rẻ tiền.“ Hãy nêu hai lỗi và sửa bằng lời nói trực tiếp.", "tr": "Bir meslektaşınız şöyle diyor: „Sıfır sorun! Size ucuz modelleri göstereyim.“ İki hata belirtin ve doğrudan konuşma biçiminde düzeltin.", "ar": "تقول زميلة: „ولا مشكلة! سأريك الطرازات الرخيصة.“ اذكر خطأين وصحّحهما بالكلام المباشر."}, "Umgangssprache („Null Problem“) und das abwertende Wort „billig“; außerdem fehlt die Bedarfsermittlung. Besser: „Selbstverständlich, ich zeige Ihnen gern ein preisgünstiges Modell. Wofür möchten Sie den Akkubohrer vor allem verwenden?“": {"vi": "Văn nói („Null Problem“) và từ coi thường „billig“ (rẻ tiền); ngoài ra thiếu xác định nhu cầu. Tốt hơn: „Tất nhiên, tôi xin giới thiệu một mẫu giá hợp lý. Ông chủ yếu dùng máy khoan pin để làm gì?“", "tr": "Konuşma dili („Null Problem“) ve küçümseyici „billig“ (ucuz) sözcüğü; ayrıca ihtiyaç tespiti eksik. Daha iyisi: „Elbette, size uygun fiyatlı bir model göstermek isterim. Akülü matkabı en çok ne için kullanacaksınız?“", "ar": "لغة عامية („Null Problem“) وكلمة „billig“ (رخيص) المحقّرة؛ كما ينقص تحديد الحاجة. الأفضل: „بالطبع، يسعدني أن أعرض عليك طرازًا بسعر مناسب. فيمَ تريد استخدام المثقاب اللاسلكي بشكل رئيسي؟“"}, "Begründen Sie, warum die Phasen 5 (Preisnennung) und 6 (Einwände) oft direkt nacheinander kommen.": {"vi": "Hãy giải thích vì sao giai đoạn 5 (nêu giá) và 6 (phản đối) thường đến liền nhau.", "tr": "5. aşamanın (fiyat söyleme) ve 6. aşamanın (itirazlar) neden sık sık art arda geldiğini gerekçelendirin.", "ar": "علّل لماذا تأتي المرحلتان 5 (ذكر السعر) و6 (الاعتراضات) غالبًا مباشرة بعضهما بعد بعض."}, "Der Preis ist der häufigste Anlass für einen Einwand. Wird der Preis ohne Nutzen genannt, kommt fast sicher „Das ist aber teuer“. Darum gehören Sandwich-Methode und Ja-Aber-Methode zusammen.": {"vi": "Giá là lý do phản đối thường gặp nhất. Nếu nêu giá mà không có lợi ích thì gần như chắc chắn sẽ có „Cái này đắt đấy“. Vì vậy phương pháp sandwich và Vâng-nhưng đi cùng nhau.", "tr": "Fiyat, itirazın en sık nedenidir. Fiyat faydasız söylenirse neredeyse kesinlikle „Bu pahalı“ gelir. Bu yüzden sandviç yöntemi ve Evet-ama yöntemi birbirine aittir.", "ar": "السعر هو أكثر سبب للاعتراض. إذا ذُكر السعر دون فائدة يأتي تقريبًا بالتأكيد „هذا غالٍ“. لذلك تتكامل طريقة الساندويتش وطريقة نعم-لكن."}, "Nennen Sie je einen Vorteil von Zusatzartikeln für den Betrieb und für die Kundin.": {"vi": "Hãy nêu mỗi bên một ưu điểm của hàng thêm cho doanh nghiệp và cho khách.", "tr": "Ek ürünlerin işletme için ve müşteri için birer avantajını belirtin.", "ar": "اذكر ميزة واحدة للقطع الإضافية للمنشأة وميزة واحدة للزبونة."}, "Betrieb: Umsatzsteigerung, Kundenbindung. Kundin: kann das Produkt sofort voll nutzen, die Ware wird aufgewertet.": {"vi": "Doanh nghiệp: tăng doanh thu, gắn kết khách. Khách: dùng sản phẩm đầy đủ ngay, hàng được nâng giá trị.", "tr": "İşletme: ciro artışı, müşteri bağlılığı. Müşteri: ürünü hemen tam olarak kullanabilir, ürün değer kazanır.", "ar": "المنشأة: زيادة المبيعات وربط الزبائن. الزبونة: تستطيع استخدام المنتج بالكامل فورًا وترتفع قيمة البضاعة."}, "Warum ist eine freundliche Verabschiedung für den Betrieb wichtig? Zwei Argumente.": {"vi": "Vì sao lời chào tạm biệt thân thiện quan trọng với doanh nghiệp? Hai lập luận.", "tr": "Samimi bir vedalaşma işletme için neden önemlidir? İki argüman.", "ar": "لماذا التوديع الودود مهم للمنشأة؟ حجتان."}, "Die Kundin geht mit einem positiven Gefühl und kommt wieder (Stammkundenbindung); positives Image und Mundpropaganda; Grundlage für den nächsten Kauf.": {"vi": "Khách ra về với cảm giác tích cực và quay lại (gắn kết khách quen); hình ảnh tích cực và truyền miệng; nền tảng cho lần mua sau.", "tr": "Müşteri olumlu bir duyguyla ayrılır ve geri gelir (müdavim bağlılığı); olumlu imaj ve ağızdan ağıza yayılma; bir sonraki alımın temeli.", "ar": "تغادر الزبونة بشعور إيجابي وتعود (ربط الزبائن الدائمين)؛ صورة إيجابية ودعاية شفهية؛ أساس للشراء التالي."}, "Du kassierst gerade eine andere Kundin ab. {0} betritt die Abteilung und schaut zu dir herüber.": {"vi": "Bạn đang tính tiền cho một khách khác. {0} bước vào khu hàng và nhìn về phía bạn.", "tr": "Başka bir müşterinin ödemesini alıyorsunuz. {0} bölüme giriyor ve size doğru bakıyor.", "ar": "أنت تحاسب زبونة أخرى. يدخل {0} القسم وينظر نحوك."}, "Blickkontakt, zunicken, lächeln – fertig kassieren und dann hingehen": {"vi": "Giao tiếp bằng mắt, gật đầu, mỉm cười – tính tiền xong rồi mới đến", "tr": "Göz teması, baş selamı, gülümseme – ödemeyi bitirip sonra gitmek", "ar": "تواصل بصري وإيماءة وابتسامة – إنهاء المحاسبة ثم الذهاب"}, "Nonverbal zeigen: Ich habe Sie gesehen.": {"vi": "Thể hiện không lời: Tôi đã thấy bạn.", "tr": "Sözsüz göstermek: Sizi gördüm.", "ar": "الإظهار دون كلام: لقد رأيتك."}, "(nickt zurück und wartet entspannt)": {"vi": "(gật đầu đáp lại và chờ thoải mái)", "tr": "(başını sallayarak karşılık veriyor ve rahatça bekliyor)", "ar": "(تومئ بالمقابل وتنتظر بارتياح)"}, "(nickt, schaut aber auf die Uhr)": {"vi": "(gật đầu nhưng nhìn đồng hồ)", "tr": "(başını sallıyor ama saate bakıyor)", "ar": "(يومئ لكنه ينظر إلى الساعة)"}, "Mit Blickkontakt, Zunicken und Lächeln nimmst du sofort nonverbal Kontakt auf. Die Kundin an der Kasse wird trotzdem fertig bedient.": {"vi": "Bằng giao tiếp bằng mắt, gật đầu và mỉm cười bạn lập tức tiếp xúc không lời. Khách ở quầy vẫn được phục vụ xong.", "tr": "Göz teması, baş selamı ve gülümsemeyle hemen sözsüz temas kurarsınız. Kasadaki müşteri yine de hizmetini tamamlar.", "ar": "بالتواصل البصري والإيماءة والابتسامة تبدأ فورًا اتصالًا غير لفظي. وتُخدَم الزبونة عند الصندوق حتى النهاية."}, "Die Kundin an der Kasse stehen lassen und sofort zu {0} gehen": {"vi": "Bỏ khách ở quầy đó và đến ngay chỗ {0}", "tr": "Kasadaki müşteriyi bırakıp hemen {0} yanına gitmek", "ar": "ترك الزبونة عند الصندوق والذهاب فورًا إلى {0}"}, "Neue Kundschaft geht vor.": {"vi": "Khách mới được ưu tiên.", "tr": "Yeni müşteri önce gelir.", "ar": "الزبون الجديد له الأولوية."}, "Oh – Sie waren doch noch beschäftigt …": {"vi": "Ồ – cô còn đang bận mà …", "tr": "Oh – siz hâlâ meşguldünüz ki …", "ar": "آه – كنتِ لا تزالين مشغولة …"}, "Äh, ich wollte doch nur gucken …": {"vi": "Ờ, tôi chỉ muốn xem thôi mà …", "tr": "Ee, ben sadece bakmak istemiştim …", "ar": "آه، كنت أريد التفرج فقط …"}, "Jetzt fühlt sich die Kundin an der Kasse zurückgesetzt. Besser: nonverbal Kontakt aufnehmen und dann hingehen.": {"vi": "Bây giờ khách ở quầy cảm thấy bị coi nhẹ. Tốt hơn: tiếp xúc không lời rồi mới đến.", "tr": "Şimdi kasadaki müşteri kendini ikinci planda hissediyor. Daha iyisi: önce sözsüz temas, sonra gitmek.", "ar": "الآن تشعر الزبونة عند الصندوق بأنها مهمَّشة. الأفضل: اتصال غير لفظي ثم الذهاب."}, "Nicht reagieren – erst fertig kassieren, dann mal sehen": {"vi": "Không phản ứng – tính tiền xong rồi tính tiếp", "tr": "Tepki vermemek – önce ödemeyi bitirmek, sonra bakarız", "ar": "عدم التجاوب – إنهاء المحاسبة أولًا ثم نرى"}, "Eins nach dem anderen.": {"vi": "Từng việc một.", "tr": "Birer birer.", "ar": "خطوة بخطوة."}, "(wartet, schaut sich um) Sieht mich hier eigentlich jemand?": {"vi": "(chờ, nhìn quanh) Rốt cuộc ở đây có ai thấy tôi không?", "tr": "(bekliyor, etrafa bakıyor) Burada beni gören var mı acaba?", "ar": "(تنتظر وتنظر حولها) هل يراني أحد هنا أصلًا؟"}, "Jeder Kunde soll merken, dass er wahrgenommen wurde – auch wenn du gerade nicht sprechen kannst.": {"vi": "Mọi khách phải nhận ra mình đã được chú ý – kể cả khi bạn chưa thể nói.", "tr": "Her müşteri fark edildiğini anlamalı – o an konuşamıyor olsanız bile.", "ar": "يجب أن يدرك كل زبون أنه قد لوحظ – حتى وإن لم تستطع الكلام الآن."}, "Bau einen Satz für die wartende Kundschaft.": {"vi": "Hãy xây dựng một câu cho khách đang chờ.", "tr": "Bekleyen müşteri için bir cümle oluşturun.", "ar": "ابنِ جملة للزبون المنتظر."}, "Moment!": {"vi": "Chờ chút!", "tr": "Bir dakika!", "ar": "لحظة!"}, "Ohne Gruß wirkt das wie ein Befehl.": {"vi": "Không có lời chào thì nghe như mệnh lệnh.", "tr": "Selamsız bu bir emir gibi duyulur.", "ar": "بدون تحية يبدو هذا كأمر."}, "Hinweis": {"vi": "Lưu ý", "tr": "Not", "ar": "تنبيه"}, "ich bin sofort bei Ihnen.": {"vi": "tôi sẽ đến với bà ngay.", "tr": "hemen sizinle ilgileneceğim.", "ar": "سأكون معك حالًا."}, "Sie müssen jetzt warten.": {"vi": "Bây giờ bà phải chờ.", "tr": "Şimdi beklemek zorundasınız.", "ar": "عليك أن تنتظري الآن."}, "Unfreundlich. Sag lieber, dass du gleich kommst.": {"vi": "Thiếu thân thiện. Tốt hơn hãy nói bạn sẽ đến ngay.", "tr": "Samimiyetsiz. Daha iyisi, hemen geleceğinizi söylemek.", "ar": "غير ودود. الأفضل أن تقول إنك ستأتي قريبًا."}, "das dauert.": {"vi": "việc này mất thời gian.", "tr": "bu uzun sürer.", "ar": "هذا سيستغرق وقتًا."}, "Negativ und ohne Zuwendung.": {"vi": "Tiêu cực và không quan tâm.", "tr": "Olumsuz ve ilgisiz.", "ar": "سلبي وغير مكترث."}, "Angebot": {"vi": "Đề nghị", "tr": "Teklif", "ar": "العرض"}, "Schauen Sie sich gerne schon in Ruhe um.": {"vi": "Bà cứ thong thả xem quanh đi ạ.", "tr": "Lütfen rahatça etrafa bakın.", "ar": "تفضّلي بالتفرج بكل راحة."}, "Fassen Sie bitte nichts an.": {"vi": "Xin đừng sờ vào gì cả.", "tr": "Lütfen hiçbir şeye dokunmayın.", "ar": "من فضلك لا تلمسي شيئًا."}, "Misstrauisch – die Kundin soll sich willkommen fühlen.": {"vi": "Nghi ngờ – khách phải cảm thấy được chào đón.", "tr": "Güvensiz – müşteri kendini hoş karşılanmış hissetmeli.", "ar": "مرتاب – يجب أن تشعر الزبونة بأنها موضع ترحيب."}, "Sie kassieren noch. Formulieren Sie in wörtlicher Rede, wie Sie {0} trotzdem willkommen heißen!": {"vi": "Bạn vẫn đang tính tiền. Hãy viết bằng lời nói trực tiếp cách bạn vẫn chào đón {0}!", "tr": "Hâlâ ödeme alıyorsunuz. {0} kişisini yine de nasıl karşılayacağınızı doğrudan konuşma biçiminde yazın!", "ar": "أنت لا تزال تحاسب. صُغ بالكلام المباشر كيف ترحّب بـ {0} رغم ذلك!"}, "Ihr Satz": {"vi": "Câu của bạn", "tr": "Cümleniz", "ar": "جملتك"}, "Hinweis, dass du gleich kommst": {"vi": "Lưu ý rằng bạn sắp đến", "tr": "Hemen geleceğiniz notu", "ar": "تنبيه بأنك ستأتي قريبًا"}, "Nennen Sie Verhaltensweisen, mit denen Sie sofort nonverbal Kontakt aufnehmen.": {"vi": "Hãy nêu các hành vi giúp bạn lập tức tiếp xúc không lời.", "tr": "Hemen sözsüz temas kurmanızı sağlayan davranışları sayın.", "ar": "اذكر السلوكيات التي تبدأ بها اتصالًا غير لفظي فورًا."}, "Blickkontakt herstellen, zunicken, anlächeln, in Richtung der Kundin gehen.": {"vi": "Giao tiếp bằng mắt, gật đầu, mỉm cười, đi về phía khách.", "tr": "Göz teması kurmak, baş selamı vermek, gülümsemek, müşteriye doğru yürümek.", "ar": "التواصل البصري، الإيماء، الابتسام، التوجه نحو الزبونة."}, "Laut quer durch den Laden rufen.": {"vi": "Gọi to khắp cửa hàng.", "tr": "Mağazanın öbür ucundan yüksek sesle seslenmek.", "ar": "النداء بصوت عالٍ عبر المتجر."}, "Mit dem Finger auf die Kundin zeigen.": {"vi": "Chỉ ngón tay vào khách.", "tr": "Parmakla müşteriyi göstermek.", "ar": "الإشارة بالإصبع إلى الزبونة."}, "Geben Sie 2 Verhaltensweisen an, mit denen Sie sofort nonverbal Kontakt zu Herrn Petersen aufnehmen können!": {"vi": "Hãy nêu 2 hành vi giúp bạn lập tức tiếp xúc không lời với ông Petersen!", "tr": "Bay Petersen ile hemen sözsüz temas kurmanızı sağlayan 2 davranışı belirtin!", "ar": "اذكر سلوكين تبدأ بهما اتصالًا غير لفظي فورًا مع السيد بيترزن!"}, "z. B. Blickkontakt herstellen; in Richtung Kunde gehen; zunicken; anlächeln.": {"vi": "ví dụ giao tiếp bằng mắt; đi về phía khách; gật đầu; mỉm cười.", "tr": "örn. göz teması kurmak; müşteriye doğru yürümek; baş selamı vermek; gülümsemek.", "ar": "مثلًا التواصل البصري؛ التوجه نحو الزبون؛ الإيماء؛ الابتسام."}, "{0} kommt herein. Du erkennst {1} wieder – ihr hattet letzte Woche schon ein Gespräch.": {"vi": "{0} bước vào. Bạn nhận ra {1} – tuần trước hai người đã có một cuộc trò chuyện.", "tr": "{0} içeri giriyor. {1} tanıyorsunuz – geçen hafta bir görüşme yapmıştınız.", "ar": "يدخل {0}. تتعرف على {1} – كان بينكما حديث الأسبوع الماضي."}, "„Guten Tag, {0}! Schön, dass Sie wieder da sind.“": {"vi": "„Xin chào, {0}! Rất vui vì bà lại đến.“", "tr": "„İyi günler, {0}! Tekrar geldiğinize sevindim.“", "ar": "„مرحبًا، {0}! يسعدني أنك عدت.“"}, "Mit Namen begrüßen.": {"vi": "Chào bằng tên.", "tr": "İsmiyle selamlamak.", "ar": "التحية بالاسم."}, "Oh, Sie wissen ja noch, wer ich bin! Guten Tag!": {"vi": "Ồ, cô còn nhớ tôi là ai! Xin chào!", "tr": "Oh, kim olduğumu hâlâ biliyorsunuz! İyi günler!", "ar": "آه، ما زلت تذكرين من أنا! مرحبًا!"}, "Die Grußformel hängt auch davon ab, wie vertraut die Kundschaft ist. Mit dem Namen zeigst du Wertschätzung.": {"vi": "Cách chào cũng tùy mức độ thân quen của khách. Gọi tên cho thấy bạn trân trọng.", "tr": "Selamlama biçimi müşterinin ne kadar tanıdık olduğuna da bağlıdır. İsimle hitap, değer verdiğinizi gösterir.", "ar": "صيغة التحية تعتمد أيضًا على مدى ألفة الزبون. بالاسم تُظهر التقدير."}, "„Hallo! Na, wieder da?“": {"vi": "„Chào! Ủa, lại đến à?“", "tr": "„Selam! Ee, yine mi geldin?“", "ar": "„أهلًا! آه، عدتِ مجددًا؟“"}, "Locker und freundlich.": {"vi": "Thoải mái và thân thiện.", "tr": "Rahat ve samimi.", "ar": "عفوي وودود."}, "(stutzt) Äh … ja, guten Tag.": {"vi": "(ngạc nhiên) Ờ … vâng, xin chào.", "tr": "(şaşırıyor) Ee … evet, iyi günler.", "ar": "(تتفاجأ) آه … نعم، مرحبًا."}, "Hi … ja.": {"vi": "Hi … vâng.", "tr": "Selam … evet.", "ar": "هاي … نعم."}, "„Hallo, na?“ ist zu salopp und nicht situationsgerecht – Kundschaft wird höflich gegrüßt.": {"vi": "„Chào, thế nào?“ quá suồng sã và không phù hợp tình huống – khách được chào lịch sự.", "tr": "„Selam, nasılsın?“ fazla laubali ve duruma uygun değil – müşteri nazikçe selamlanır.", "ar": "„أهلًا، كيف الحال؟“ عامية جدًا وغير مناسبة للموقف – يُحيَّى الزبائن بأدب."}, "Nur „Guten Tag.“ – und so tun, als kenne man sich nicht": {"vi": "Chỉ „Xin chào.“ – và làm như không quen biết", "tr": "Sadece „İyi günler.“ – ve tanımıyormuş gibi davranmak", "ar": "فقط „مرحبًا.“ – والتظاهر بعدم المعرفة"}, "Neutral bleiben.": {"vi": "Giữ thái độ trung tính.", "tr": "Tarafsız kalmak.", "ar": "البقاء محايدًا."}, "Guten Tag. (etwas enttäuscht) Wir hatten doch letzte Woche …": {"vi": "Xin chào. (hơi thất vọng) Tuần trước chúng ta đã …", "tr": "İyi günler. (biraz hayal kırıklığıyla) Geçen hafta zaten …", "ar": "مرحبًا. (بخيبة أمل قليلة) ألم نتحدث الأسبوع الماضي …"}, "Nicht falsch, aber eine Chance verschenkt: Wer wiedererkannt wird, fühlt sich wertgeschätzt.": {"vi": "Không sai, nhưng bỏ lỡ một cơ hội: ai được nhận ra sẽ cảm thấy được trân trọng.", "tr": "Yanlış değil ama bir fırsat kaçırılmış: Tanınan kişi kendini değerli hisseder.", "ar": "ليس خطأً، لكن ضاعت فرصة: من يُتعرَّف عليه يشعر بالتقدير."}, "Bau eine persönliche Begrüßung.": {"vi": "Hãy xây dựng một lời chào cá nhân.", "tr": "Kişisel bir selamlama oluşturun.", "ar": "ابنِ تحية شخصية."}, "Guten Tag, {0}!": {"vi": "Xin chào, {0}!", "tr": "İyi günler, {0}!", "ar": "مرحبًا، {0}!"}, "Zu salopp. Die Grußformel muss situationsgerecht sein.": {"vi": "Quá suồng sã. Cách chào phải phù hợp tình huống.", "tr": "Fazla laubali. Selamlama duruma uygun olmalı.", "ar": "عامي جدًا. يجب أن تناسب التحية الموقف."}, "Wertschätzung": {"vi": "Sự trân trọng", "tr": "Değer verme", "ar": "التقدير"}, "Schön, dass Sie wieder bei uns sind.": {"vi": "Rất vui vì bà lại đến với chúng tôi.", "tr": "Yeniden bizimle olmanıza sevindim.", "ar": "يسعدنا أنك عدت إلينا."}, "Sie schon wieder?": {"vi": "Lại là bà à?", "tr": "Yine siz mi?", "ar": "أنتِ مرة أخرى؟"}, "Klingt genervt.": {"vi": "Nghe có vẻ bực.", "tr": "Bıkmış gibi duyulur.", "ar": "يبدو منزعجًا."}, "Frage": {"vi": "Câu hỏi", "tr": "Soru", "ar": "السؤال"}, "Wie kann ich Ihnen heute helfen?": {"vi": "Hôm nay tôi giúp gì được cho bà?", "tr": "Bugün size nasıl yardımcı olabilirim?", "ar": "كيف يمكنني مساعدتك اليوم؟"}, "Was wollen Sie denn diesmal?": {"vi": "Lần này bà muốn gì vậy?", "tr": "Bu sefer ne istiyorsunuz?", "ar": "ماذا تريدين هذه المرة؟"}, "Klingt abweisend.": {"vi": "Nghe có vẻ xua đuổi.", "tr": "Reddedici duyulur.", "ar": "يبدو طاردًا."}, "Kann ich helfen?": {"vi": "Tôi giúp được không?", "tr": "Yardımcı olabilir miyim?", "ar": "هل يمكنني المساعدة؟"}, "Geschlossene Frage.": {"vi": "Câu hỏi đóng.", "tr": "Kapalı soru.", "ar": "سؤال مغلق."}, "Formulieren Sie eine persönliche Begrüßung für {0} in wörtlicher Rede!": {"vi": "Hãy viết bằng lời nói trực tiếp một lời chào cá nhân cho {0}!", "tr": "{0} için doğrudan konuşma biçiminde kişisel bir selamlama yazın!", "ar": "صُغ بالكلام المباشر تحية شخصية لـ {0}!"}, "Ihre Begrüßung": {"vi": "Lời chào của bạn", "tr": "Selamlamanız", "ar": "تحيتك"}, "Name der Kundschaft": {"vi": "Tên khách", "tr": "Müşterinin adı", "ar": "اسم الزبون"}, "Begründen Sie, warum Ihr Verhalten bei der Begrüßung wichtig ist.": {"vi": "Hãy giải thích vì sao hành vi của bạn khi chào hỏi lại quan trọng.", "tr": "Selamlamadaki davranışınızın neden önemli olduğunu gerekçelendirin.", "ar": "علّل لماذا يهم سلوكك عند التحية."}, "Eine freundliche Begrüßung schafft eine angenehme Atmosphäre und beeinflusst das Gespräch positiv.": {"vi": "Lời chào thân thiện tạo bầu không khí dễ chịu và ảnh hưởng tích cực đến cuộc trò chuyện.", "tr": "Samimi bir selamlama hoş bir atmosfer yaratır ve görüşmeyi olumlu etkiler.", "ar": "التحية الودودة تخلق جوًا لطيفًا وتؤثر إيجابيًا في المحادثة."}, "Weil man bei der Begrüßung schon den Umsatz festlegt.": {"vi": "Vì khi chào đã quyết định doanh thu.", "tr": "Çünkü selamlamada ciro belirlenir.", "ar": "لأن المبيعات تُحدَّد عند التحية."}, "Weil die Begrüßung im Kaufvertrag steht.": {"vi": "Vì lời chào nằm trong hợp đồng mua bán.", "tr": "Çünkü selamlama satış sözleşmesinde yazar.", "ar": "لأن التحية مذكورة في عقد البيع."}, "Begründen Sie, warum der erste Eindruck bei der Begrüßung für das Verkaufsgespräch wichtig ist!": {"vi": "Hãy giải thích vì sao ấn tượng đầu tiên khi chào hỏi quan trọng với cuộc bán hàng!", "tr": "İlk izlenimin selamlamada satış görüşmesi için neden önemli olduğunu gerekçelendirin!", "ar": "علّل لماذا الانطباع الأول عند التحية مهم لمحادثة البيع!"}, "Der erste Eindruck prägt das ganze Gespräch; eine freundliche Begrüßung schafft eine angenehme Atmosphäre.": {"vi": "Ấn tượng đầu tiên định hình cả cuộc trò chuyện; lời chào thân thiện tạo bầu không khí dễ chịu.", "tr": "İlk izlenim tüm görüşmeyi şekillendirir; samimi bir selamlama hoş bir atmosfer yaratır.", "ar": "الانطباع الأول يشكّل المحادثة كلها؛ والتحية الودودة تخلق جوًا لطيفًا."}, "{0} hat dir schon einiges erzählt. Bevor du Ware holst: Wie sicherst du ab, dass du alles richtig verstanden hast?": {"vi": "{0} đã kể cho b
