<style>

textarea.in{width:100%;min-height:6.5rem;resize:vertical;line-height:1.5}

.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0}.chip{min-height:44px;padding:.2rem .8rem;border-radius:999px;border:1.5px solid var(--pri);background:#fff;font-weight:500}

select.ok,.in.ok,select.bad,.in.bad{outline-offset:0}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}
.fb{margin-top:.5rem;font-weight:600}.fb.ok{background:none;outline:0;color:var(--ok)}.fb.bad{background:none;outline:0;color:var(--bad)}.fb.mid{color:var(--warn)}
.fb small{display:block;font-weight:400;color:var(--ink)}
.bottom{background:var(--card);border-radius:16px;padding:1rem 1.1rem;margin:1rem 0}
.bottom .actions button{flex:1 1 14rem}
#result{background:var(--card);border-radius:16px;padding:1rem 1.1rem;margin:1rem 0;border-top:6px solid var(--ok)}
#result h2{margin:.2rem 0}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.ritem{border-top:1px solid var(--line);padding:.7rem 0}.ritem h4{margin:0 0 .3rem;display:flex;gap:.5rem;flex-wrap:wrap}
.ritem .st{font-weight:800}.st.g{color:var(--ok)}.st.m{color:var(--warn)}.st.r{color:var(--bad)}
.ritem ul{margin:.2rem 0;padding-left:1.2rem}.ritem li{margin:.15rem 0}
.sol{color:var(--ok);font-weight:600}.mine{color:var(--bad)}
.steps{background:#f1f4fb;border-radius:10px;padding:.4rem .8rem;margin:.3rem 0}.steps div{font-family:ui-monospace,Menlo,monospace;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#222;color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:50;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .3s}.toast.on{opacity:.95}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:1rem}.modal.on{display:flex}
.modal>div{background:#fff;border-radius:16px;padding:1.2rem;max-width:26rem}.modal .actions button{flex:1}
.hide{display:none!important}
@media(max-width:560px){.top{padding:.3rem .5rem}.top .row{gap:.3rem}.top .ttl{display:none}.pills button{min-height:44px;padding:.2rem .6rem;font-size:.8rem}.pills{border-width:1.5px}.fields{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}html{font-size:calc(16px*var(--fs))}}
.printonly{display:none}
@media print{
 body{background:#fff;font-size:11pt}.top,.card,.head .can,.bottom,.toast,.modal,.noprint,.head .fields{display:none!important}

 #result{border:0;padding:0;margin:0;display:block!important}.ritem{break-inside:avoid}

}

<script>
const SHEET={"id":"M2","short":"LF 5 · Modul 2","title":"Modul 2 – Werbegrundsätze und Werbebotschaft","sub":"Lernfeld 5 · Werben und den Verkauf fördern","can":[{"de":"Ich kann die vier Werbegrundsätze nennen und an einer Anzeige prüfen, ob sie eingehalten sind.","vi":"Em có thể nêu bốn Werbegrundsätze (nguyên tắc quảng cáo) và kiểm tra xem một quảng cáo có tuân thủ không."},{"de":"Ich kann sagen, was in eine Werbebotschaft gehört, und mit AIDA erklären, wie eine Anzeige wirkt.","vi":"Em có thể nói điều gì thuộc về Werbebotschaft (thông điệp quảng cáo) và dùng AIDA để giải thích quảng cáo tác động thế nào."},{"de":"Ich kann einen Werbeslogan beurteilen und selbst einen formulieren.","vi":"Em có thể đánh giá một Slogan (khẩu hiệu quảng cáo) và tự viết một khẩu hiệu."}],"items":[{"id":"a1","no":"Aufgabe 1","type":"free","pts":1,"title":"Ankommen: Was weißt du noch?","instr":{"de":"Beantworte die Fragen aus dem Kopf. Nicht nachschlagen. Es geht darum, was hängengeblieben ist.","vi":"Hãy trả lời bằng trí nhớ, không tra cứu. Điều quan trọng là em còn nhớ được gì."},"tip":{"de":"Denke an Modul 1 (Werbearten) und an Lernfeld 2 (Kaufmotive, Verkaufsargumente). Stichworte genügen.","vi":"Hãy nhớ lại Modul 1 (Werbearten) và Lernfeld 2 (Kaufmotive – động cơ mua hàng, Verkaufsargumente – lập luận bán hàng). Chỉ cần từ khóa."},"parts":[{"q":"1. Was ist der Unterschied zwischen Direktwerbung und Massenwerbung?","m":"Direktwerbung spricht bestimmte Personen persönlich an. Massenwerbung richtet sich an die Allgemeinheit."},{"q":"2. Zwölf Geschäfte eines Einkaufszentrums werben zusammen, ohne ihre Namen zu nennen. Wie heißt diese Werbeart?","m":"Gemeinschaftswerbung."},{"q":"3. Nenne zwei Kaufmotive. (aus LF 2)","m":"Z. B. Sicherheit, Bequemlichkeit, Prestige, Sparsamkeit, Gesundheit."},{"q":"4. Was ist das Ziel der Werbung aus Sicht des Betriebs?","m":"Den Absatz fördern: mehr Ware verkaufen, Kunden gewinnen und binden."},{"q":"5. Was ist der Unterschied zwischen einem Warenmerkmal und einem Verkaufsargument? (aus LF 2)","m":"Merkmal = Eigenschaft der Ware; Verkaufsargument = Merkmal plus Nutzen für den Kunden."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)"},"html":"<p>Werbegrundsätze · klar und wahr · wirksam · einheitlich · stetig · einprägsam · wirtschaftlich · Wiedererkennungswert · Zielgruppe · Werbebotschaft · Nutzen · AIDA-Formel · Aufmerksamkeit · Interesse · Besitzwunsch · Kaufentschluss · Slogan · Werbeaufwand<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"Werbegrundsätze = nguyên tắc quảng cáo · klar und wahr = rõ ràng và đúng sự thật · wirksam = hiệu quả · einheitlich, stetig, einprägsam = thống nhất, đều đặn, dễ nhớ · wirtschaftlich = có lợi về kinh tế · Wiedererkennungswert = khả năng được nhận ra · Zielgruppe = nhóm khách hàng mục tiêu · Werbebotschaft = thông điệp quảng cáo · Nutzen = lợi ích · AIDA-Formel = công thức AIDA · Aufmerksamkeit = sự chú ý · Interesse = sự quan tâm · Besitzwunsch = mong muốn sở hữu · Kaufentschluss = quyết định mua · Slogan = khẩu hiệu · Werbeaufwand = chi phí quảng cáo"},{"id":"r1","no":"Lesen 1","type":"read","title":"Die vier Werbegrundsätze","instr":{"de":"Lies den Text. Tippe an, woran man jeden Grundsatz erkennt.","vi":"Em đọc đoạn văn. Chạm vào những từ cho biết cách nhận ra từng nguyên tắc."},"tip":{"de":"Suche zu jedem Grundsatz die Wörter, die sagen, was die Werbung können muss.","vi":"Với mỗi nguyên tắc, hãy tìm từ nói quảng cáo phải làm được điều gì."},"paras":["Werbung kostet Geld. Damit sie wirkt und niemanden täuscht, soll jede Werbung vier Grundsätze erfüllen.","Klar und wahr: Die Werbung ist [[leicht verständlich]]. Sie enthält [[keine Unwahrheiten]] und keine Täuschungen. Wirksam: Die Werbung ist genau auf die [[Zielgruppe]] abgestimmt. Einheitlich, stetig und einprägsam: Die Werbung hat einen hohen [[Wiedererkennungswert]]. Wirtschaftlich: Der zusätzliche Erfolg ist [[höher]] als der [[Werbeaufwand]]."],"vi":"Tóm tắt: Quảng cáo tốn tiền. Mỗi quảng cáo cần 4 nguyên tắc: 1. rõ ràng và đúng sự thật, 2. hiệu quả (đúng nhóm khách hàng), 3. thống nhất, đều đặn, dễ nhớ, 4. có lợi về kinh tế (kết quả thêm lớn hơn chi phí).","quiz":{"q":"Eine Anzeige kostet 500 €. Sie bringt 200 € Mehrumsatz. Welcher Grundsatz ist verletzt?","o":["wirtschaftlich","klar und wahr","wirksam"],"a":0,"why":{"de":"Der Erfolg (200 €) ist kleiner als der Werbeaufwand (500 €). Dann ist die Werbung nicht wirtschaftlich.","vi":"Kết quả (200 €) nhỏ hơn chi phí quảng cáo (500 €). Vì vậy quảng cáo này không wirtschaftlich (có lợi về kinh tế)."}}},{"id":"w2","type":"info","title":{"de":"Grundsätze, Werbebotschaft, AIDA, Slogan","vi":"Nguyên tắc, thông điệp, AIDA, khẩu hiệu"},"html":"<p><b>Klar und wahr<\/b> – Beispiel: „Jetzt 50 % günstiger!“, obwohl der Preis vorher nie höher war. Das verstößt gegen diesen Grundsatz.<\/p><p><b>Wirksam<\/b> – Beispiel: Eine Anzeige für Schulranzen steht im Elternmagazin, nicht im Sportteil der Zeitung.<\/p><p><b>Einheitlich, stetig und einprägsam<\/b> – Beispiel: Logo, Hausfarbe und Slogan sind auf der Tüte, in der Anzeige und auf der Website gleich.<\/p><p><b>Wirtschaftlich<\/b> – Beispiel: Eine Anzeige für 800 € bringt 3.000 € Mehrumsatz: wirtschaftlich. Bringt sie nur 300 €, ist sie es nicht.<\/p><div class=\"box merke\"><b>Merke:<\/b> Die <b>Werbebotschaft<\/b> enthält die Inhalte, die einem Personenkreis durch die Werbung vermittelt werden sollen.<\/div><p><b>Das gehört in eine Werbebotschaft:<\/b><br>✓ Die Ware ist eindeutig erkennbar (Marke, Logo, Symbol, Farben, Name).<br>✓ Der Nutzen der Ware für die Zielgruppe wird deutlich und glaubhaft herausgestellt.<br>✓ Der Verbraucher wird überzeugt, dass gerade dieses Geschäft die Ware am besten liefern kann.<\/p><p><b>Die AIDA-Formel<\/b> beschreibt vier Stufen, in denen sich das Verhalten des Kunden ändert – von „Ich sehe etwas“ bis „Ich kaufe“.<br><b>A – attention (Aufmerksamkeit):<\/b> großes Foto, auffällige Farbe, kurze Schlagzeile<br><b>I – interest (Interesse):<\/b> Nutzen und Vorteile werden genannt<br><b>D – desire (Besitzwunsch):<\/b> „nur noch wenige Stück“, Bild einer zufriedenen Kundin<br><b>A – action (Kaufentschluss):<\/b> Preis, Adresse, Öffnungszeiten, QR-Code, „nur bis Samstag“<\/p><p><b>Slogan:<\/b> ein Werbeschlagwort, also eine wirksam formulierte Redewendung. Beispiele: „Haribo macht Kinder froh …“, „Ich bin doch nicht blöd!“, „Geiz ist geil!“<\/p>","vi":"Werbebotschaft = nội dung mà quảng cáo muốn truyền đến một nhóm người. Gồm: nhận ra được sản phẩm; nêu rõ lợi ích cho khách; thuyết phục khách rằng cửa hàng này bán tốt nhất.\nAIDA = 4 bước khách hàng đi qua: A (attention) chú ý → I (interest) quan tâm → D (desire) muốn sở hữu → A (action) quyết định mua.\nSlogan = câu khẩu hiệu ngắn, dễ nhớ."},{"id":"r2","no":"Lesen 2","type":"read","title":"AIDA und Slogan","instr":{"de":"Lies den Text. Tippe an, was man sich zu AIDA und zum Slogan merken muss.","vi":"Em đọc đoạn văn. Chạm vào những gì cần nhớ về AIDA và Slogan."},"tip":{"de":"Achte auf Zahlen und auf die Wörter „kurz“ und „einprägsam“.","vi":"Chú ý đến con số và các từ “kurz” (ngắn) và “einprägsam” (dễ nhớ)."},"paras":["AIDA beschreibt, in welchen [[vier Stufen]] sich das Verhalten des Kunden ändert. Die vier Buchstaben stehen für [[englische]] Wörter. Damit die Werbung bei den Kunden haften bleibt, wird sie häufig [[kurz]] und [[einprägsam]] als Slogan formuliert."],"vi":"Tóm tắt: AIDA có 4 bước, 4 chữ cái là tiếng Anh. Slogan là câu ngắn, dễ nhớ để quảng cáo đọng lại trong đầu khách.","quiz":{"q":"Wofür steht das „D“ in AIDA?","o":["desire (Besitzwunsch)","decision (Entscheidung)","discount (Rabatt)"],"a":0,"why":{"de":"D = desire, auf Deutsch Besitzwunsch: Der Kunde will die Ware haben.","vi":"D = desire, tiếng Đức là Besitzwunsch: khách hàng muốn có món hàng đó."}}},{"id":"m1","no":"Übung","type":"match","pts":0,"title":"AIDA-Stufen zuordnen","instr":{"de":"Ordne jeder AIDA-Stufe zu, wie die Werbung sie anspricht.","vi":"Em ghép mỗi bước AIDA với cách quảng cáo tác động ở bước đó."},"tip":{"de":"Stufe 1 muss man sehen. Stufe 4 muss man zum Kaufen wissen: wo und wie.","vi":"Bước 1 phải nhìn thấy ngay. Bước 4 cần để mua: ở đâu và như thế nào."},"rows":[{"l":"A – attention (Aufmerksamkeit)","a":"großes Foto, auffällige Farbe, kurze Schlagzeile"},{"l":"I – interest (Interesse)","a":"Nutzen und Vorteile werden genannt"},{"l":"D – desire (Besitzwunsch)","a":"„nur noch wenige Stück“, Bild einer zufriedenen Kundin"},{"l":"A – action (Kaufentschluss)","a":"Preis, Adresse, Öffnungszeiten, QR-Code"}]},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: So prüfst du eine Anzeige","html":"<div class=\"box\"><b>Die Anzeige:<\/b> Fahrradhaus Struck, Bremerhaven<br>„Frühjahrs-Check für 29 € – Bremsen, Schaltung, Licht. Nur im März. Termin unter 0471 …, Hafenstraße 12.“<\/div><p><b>Klar und wahr?<\/b> Ja. Leistung, Preis, Zeitraum und Adresse stehen da. Es bleibt nichts offen, und es wird nichts versprochen, was nicht eingehalten wird.<\/p><p><b>Wirksam?<\/b> Ja. Die Anzeige spricht Radfahrer kurz vor Saisonbeginn an – genau die Zielgruppe, die jetzt an ihr Rad denkt.<\/p><p><b>Einheitlich, stetig und einprägsam?<\/b> Das lässt sich an einer einzelnen Anzeige nicht beurteilen. Dafür müsste man mehrere Werbemittel des Betriebs nebeneinanderlegen.<\/p><p><b>Wirtschaftlich?<\/b> Kann man erst hinterher sagen: Kosten der Anzeige mit den zusätzlichen Check-Aufträgen vergleichen.<\/p><p><b>Und AIDA?<\/b> „Frühjahrs-Check für 29 €“ ist die Aufmerksamkeit (A). Die drei genannten Leistungen wecken Interesse (I). „Nur im März“ erzeugt den Besitzwunsch bzw. Handlungsdruck (D). Telefonnummer und Adresse führen zum Kaufentschluss (A).<\/p><div class=\"box merke\"><b>Ergebnis:<\/b> Drei Grundsätze sind erfüllt oder erfüllbar, einer ist an einer einzelnen Anzeige nicht prüfbar. Alle vier AIDA-Stufen sind vorhanden.<\/div>","vi":"Ví dụ mẫu: quảng cáo kiểm tra xe đạp mùa xuân giá 29 €. Rõ ràng, đúng sự thật; đúng nhóm khách; “thống nhất” không đánh giá được từ một quảng cáo; “wirtschaftlich” chỉ biết sau khi so chi phí với đơn hàng thêm. Cả bốn bước AIDA đều có."},{"id":"a3","no":"Aufgabe 3","type":"table","pts":1,"title":"Geführte Übung: Welcher Grundsatz?","instr":{"de":"Entscheide jeweils: Welcher Werbegrundsatz ist betroffen? Ist er erfüllt oder verletzt?","vi":"Em quyết định: nguyên tắc quảng cáo nào bị ảnh hưởng? Nó được tuân thủ (erfüllt) hay bị vi phạm (verletzt)?"},"tip":{"de":"Nicht jede Aufgabe ist ein Verstoß. Bei der Zahl-Aufgabe vergleichst du zwei Zahlen: Kosten und zusätzlicher Erfolg.","vi":"Không phải câu nào cũng là vi phạm. Với câu có số, em so sánh hai số: chi phí và kết quả thêm."},"cols":["Fall","Welcher Grundsatz?","Erfüllt oder verletzt?"],"colOpts":[null,["Klar und wahr","Wirksam","Einheitlich, stetig und einprägsam","Wirtschaftlich"],["Erfüllt","Verletzt"]],"rows":[["1. „Der beste Kaffee der Welt – wissenschaftlich bewiesen.“ Eine solche Untersuchung gibt es nicht.",{"a":"Klar und wahr"},{"a":"Verletzt"}],["2. Ein Sportgeschäft wirbt für Laufschuhe mit einer Anzeige in einer Zeitschrift für Angler.",{"a":"Wirksam"},{"a":"Verletzt"}],["3. Ein Modehaus benutzt in jeder Anzeige, auf der Tüte und im Schaufenster dieselbe Farbe und denselben Slogan.",{"a":"Einheitlich, stetig und einprägsam"},{"a":"Erfüllt"}],["4. Eine Anzeige kostet 1.200 €. Der Betrieb verkauft dadurch zusätzlich Ware für 600 €.",{"a":"Wirtschaftlich"},{"a":"Verletzt"}]]},{"id":"a4","no":"Aufgabe 4","type":"free","pts":1,"title":"Freie Übung","instr":{"de":"Beantworte die Fragen in eigenen Worten.","vi":"Em trả lời các câu hỏi bằng lời của mình."},"tip":{"de":"Bei Frage 5 überlege, was die Frist („nur noch bis Samstag“) beim Kunden auslöst. Bei Frage 6: kurz, einprägsam, mit Bezug zur Leistung.","vi":"Câu 5: nghĩ xem thời hạn (“nur noch bis Samstag” – chỉ đến thứ Bảy) làm khách hàng cảm thấy gì. Câu 6: ngắn, dễ nhớ, liên quan đến dịch vụ."},"parts":[{"q":"1. Nenne die vier Werbegrundsätze.","m":"Klar und wahr – wirksam – einheitlich, stetig und einprägsam – wirtschaftlich."},{"q":"2. Erkläre mit eigenen Worten, was eine Werbebotschaft ist.","m":"Die Werbebotschaft enthält die Inhalte, die einem Personenkreis durch die Werbung vermittelt werden sollen – also das, was der Kunde über die Ware erfahren soll.","s":["Die Werbebotschaft ist …","Das ist das, was der Kunde … soll."]},{"q":"3. Nenne drei Punkte, die in eine Werbebotschaft gehören.","m":"Die Ware ist eindeutig erkennbar. Der Nutzen für die Zielgruppe wird herausgestellt. Der Kunde wird überzeugt, dass dieses Geschäft die Ware am besten liefern kann."},{"q":"4. Wofür stehen die vier Buchstaben von AIDA? Schreibe die deutschen Begriffe dazu.","m":"A = attention (Aufmerksamkeit), I = interest (Interesse), D = desire (Besitzwunsch), A = action (Kaufentschluss)."},{"q":"5. Welche AIDA-Stufe spricht „Nur noch bis Samstag!“ an? Begründe kurz.","m":"Die Stufe D (Besitzwunsch) und den Übergang zu A (Kaufentschluss): Die Frist erzeugt den Wunsch, jetzt zu handeln.","s":["Die Stufe … , weil …"]},{"q":"6. Formuliere einen Slogan für ein Fahrradgeschäft, das einen Frühjahrs-Check anbietet.","m":"Zum Beispiel: „Struck macht Ihr Rad frühlingsfit.“ Wichtig ist: kurz, einprägsam, mit Bezug zur Leistung."}]},{"id":"a5","no":"Aufgabe 5","type":"free","pts":1,"title":"Aus deinem Betrieb","instr":{"de":"Suche eine Werbung deines Ausbildungsbetriebs (Anzeige, Aushang, Newsletter, Social-Media-Beitrag). Prüfe sie an den vier Werbegrundsätzen und notiere, welche AIDA-Stufen du wiederfindest.","vi":"Tìm một quảng cáo của cửa hàng nơi em thực tập (tờ rơi, bảng thông báo, bản tin, bài đăng mạng xã hội). Kiểm tra theo bốn Werbegrundsätze và ghi các bước AIDA mà em tìm thấy."},"tip":{"de":"Schreibe zu jedem Grundsatz einen Satz mit Begründung. Nenne mindestens zwei AIDA-Stufen und zeige, woran du sie erkennst.","vi":"Viết một câu giải thích cho mỗi nguyên tắc. Nêu ít nhất hai bước AIDA và chỉ ra em nhận ra chúng ở đâu."},"parts":[{"q":"Meine Werbung, die vier Grundsätze und die AIDA-Stufen:","m":"Individuelle Lösung. Erwartet wird: zu jedem der vier Grundsätze ein Satz mit Begründung und mindestens zwei benannte AIDA-Stufen mit Beleg aus der Werbung.","s":["Klar und wahr: …, weil …","Wirksam: …, weil …","Die Stufe … erkenne ich an …"]}]},{"id":"a6","no":"Aufgabe 6","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh."},"tip":{"de":"6.1: Wirkung und Wahrheit sind zwei verschiedene Dinge. 6.2: Wie weit ist es im Internet vom Wunsch bis zum Kauf? 6.3: Was geht verloren, wenn sich alles jedes Jahr ändert?","vi":"6.1: Hiệu quả và sự thật là hai việc khác nhau. 6.2: Trên mạng, từ mong muốn đến lúc mua xa bao nhiêu? 6.3: Mất gì khi mọi thứ thay đổi mỗi năm?"},"parts":[{"q":"6.1 Kann eine Werbung wirksam sein und trotzdem gegen „klar und wahr“ verstoßen? Begründe mit einem Beispiel.","m":"Ja. Eine übertriebene Aussage kann die Wünsche der Zielgruppe stark ansprechen und trotzdem unwahr sein – zum Beispiel ein Schlankheitsmittel mit „10 kg in einer Woche“. Die Werbung wirkt, aber sie täuscht."},{"q":"6.2 Die AIDA-Formel ist über 100 Jahre alt. Welche Stufe ist beim Einkauf im Internet heute besonders kurz – und warum?","m":"Die Stufe A (action). Zwischen Besitzwunsch und Kauf liegen im Internet nur ein Klick und kein Weg zum Geschäft. Deshalb setzen Online-Händler den Kauf-Button direkt neben das Bild."},{"q":"6.3 Ein Betrieb wechselt jedes Jahr Logo, Farben und Slogan. Welcher Grundsatz leidet, und was kostet ihn das?","m":"Der Grundsatz „einheitlich, stetig und einprägsam“. Der Wiedererkennungswert geht verloren; der Betrieb muss jedes Jahr neu bekannt werden und zahlt für denselben Bekanntheitsgrad mehrfach (neue Schilder, Tüten, Drucksachen)."}]},{"id":"v1","level":"v","no":"Vertiefung 1","type":"free","pts":1,"title":"Warum ist das so?","instr":{"de":"Begründe in ganzen Sätzen.","vi":"Em giải thích bằng câu hoàn chỉnh."},"tip":{"de":"Denke an den Unterschied zwischen „Die Anzeige wirkt“ und „Die Anzeige sagt die Wahrheit“.","vi":"Hãy nghĩ đến sự khác nhau giữa “quảng cáo có hiệu quả” và “quảng cáo nói đúng sự thật”."},"parts":[{"q":"Warum reicht es nicht, dass eine Werbung nur wirksam ist? Warum muss sie auch „klar und wahr“ sein?","m":"Eine Werbung kann sehr wirksam sein und trotzdem täuschen (siehe 6.1). Der Grundsatz „klar und wahr“ sorgt dafür, dass niemand getäuscht wird. Zum Beispiel können getäuschte Kunden enttäuscht sein und nicht wiederkommen.","s":["Wirksam allein reicht nicht, weil …"]}]},{"id":"v2","level":"v","no":"Vertiefung 2","type":"free","pts":1,"title":"Begründe deine Entscheidung","instr":{"de":"Warum kann man den Grundsatz „wirtschaftlich“ an einer einzelnen Anzeige nicht sofort prüfen? Begründe.","vi":"Tại sao không thể kiểm tra ngay nguyên tắc “wirtschaftlich” chỉ từ một quảng cáo? Hãy giải thích."},"tip":{"de":"Du brauchst zwei Zahlen. Wann kennst du die zweite Zahl?","vi":"Em cần hai con số. Khi nào em biết được con số thứ hai?"},"parts":[{"q":"Meine Begründung:","m":"Man muss die Kosten der Anzeige mit dem zusätzlichen Erfolg (zum Beispiel zusätzliche Aufträge) vergleichen. Der Erfolg ist erst hinterher bekannt.","s":["Man braucht … und …","Das weiß man erst …"]}]}]};

function def(){return{lang:'de',level:'b',name:'',date:new Date().toLocaleDateString('de-DE'),ans:{},checked:{},shown:{},can:{},sub:false}}

function hashSeed(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function shuf(arr,seed){const a=arr.slice();let s=hashSeed(seed)||1;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function parts(it){switch(it.type){case'mc':return it.qs;case'tf':return it.st;case'gap':return it.gaps;case'match':return it.rows;case'table':return cells(it);case'calc':case'free':return it.parts;default:return[]}}

/* ---------- Bewertung ---------- */
function mcTxt(p,idx){return String(idx).split(',').filter(x=>x!=='').map(i=>p.o[+i]).join(' / ')}
function grade(it){
 const a=A(it.id),ps=parts(it),res=[];
 if(it.type==='read'){const keys=readKeys(it),sel=a.m||[];const found=keys.filter(k=>sel.indexOf(k)>=0).length,extra=sel.filter(k=>keys.indexOf(k)<0).length;
  const q=it.quiz,qa=a.q;return{type:'read',found,total:keys.length,extra,qok:q?(qa!=null&&+qa===q.a):null,max:0,got:0,parts:[],filled:!!(a.chk&&(!q||qa!=null))}}
 ps.forEach((p,i)=>{const v=a['p'+i];let ok=false,mine='',sol='',has=v!=null&&String(v).trim()!=='';
  switch(it.type){
  case'mc':{const sa=[].concat(p.a).slice().sort().join(',');const sv=has?String(v).split(',').sort().join(','):'';ok=has&&sv===sa;mine=has?mcTxt(p,v):'';sol=mcTxt(p,sa);break}
  case'tf':ok=has&&(v==='t')===p.a;mine=has?(v==='t'?u('richtig'):u('falsch')):'';sol=p.a?u('richtig'):u('falsch');break;
  case'gap':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'match':ok=has&&v===p.a;mine=has?v:'';sol=p.a;break;
  case'table':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'calc':{const n=num(v);ok=has&&!isNaN(n)&&Math.abs(n-p.a)<=(p.tol==null?0.01:p.tol);mine=has?v:'';sol=fnum(p.a)+(p.u?' '+p.u:'');if(a['p'+i+'w'])mine+=' | '+u('path')+': '+a['p'+i+'w'];break}
  case'free':{const r=a.r;ok=r==='y'?true:r==='p'?0.5:false;has=has&&!!r;mine=a['p'+i]||'';sol=T(p.m);break}
  }
  res.push({ok,has,mine,sol,why:p.why,q:p.q,p});});
 const per=ps.length?it.pts/ps.length:0;let got=0;res.forEach(r=>{got+=(r.ok===true?1:r.ok===0.5?0.5:0)*per});
 let filled;if(it.type==='free')filled=ps.every((p,i)=>String(a['p'+i]||'').trim()!=='');else filled=res.every(r=>r.has);
 return{type:it.type,parts:res,max:it.pts||0,got,filled,any:res.some(r=>r.has)}}
function tokens(p){const out=[];let idx=0;let m;
 const parts=[];let last=0,s=p;const rg=/\[\[(.+?)\]\]|\{\{(.+?)\}\}/g;while((m=rg.exec(s))){if(m.index>last)parts.push({t:s.slice(last,m.index)});parts.push({t:m[1]||m[2],key:!!m[1]});last=rg.lastIndex}
 if(last<s.length)parts.push({t:s.slice(last)});
 parts.forEach((pt,pi)=>{const prev=parts[pi-1];pt.t.split(/\s+/).filter(Boolean).forEach((w,wi)=>{const att=wi===0&&prev&&!/\s$/.test(prev.t)&&!/^\s/.test(pt.t);out.push({w,key:!!pt.key,i:idx++,att,pu:/^[.,;:!?)“”„"]+$/.test(w)})})});return out}
function allTokens(it){let g=0;return it.paras.map(p=>tokens(p).map(t=>({w:t.w,key:t.key,att:t.att,pu:t.pu,i:g++})))}
function readKeys(it){const k=[];allTokens(it).forEach(ps=>ps.forEach(t=>{if(t.key)k.push(t.i)}));return k}

const BODY={
 info(it){return`<div class="info">${it.html||''}</div>`+(it.vi&&S.lang==='vi'?`<div class="vis">${rich(it.vi)}</div>`:'')},
 read(it){const per=allTokens(it);const a=A(it.id);const sel=a.m||[];
  const ps=per.map(ts=>`<p class="rd${a.chk?' chk':''}" data-rd="${it.id}">`+ts.map(t=>t.pu&&t.att?esc(t.w):(t.att?'':' ')+`<span class="w${t.key?' key':''}${sel.indexOf(t.i)>=0?' sel':''}" data-w="${t.i}" role="button" tabindex="0">${esc(t.w)}</span>`).join('').trim()+'</p>').join('');
  const q=it.quiz;let quiz='';
  if(q&&a.chk){quiz=`<div class="q" data-part="0"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="radio" name="${it.id}_q" data-k="q" value="${j}"${a.q!=null&&+a.q===j?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}
  return`<p class="vis">${u('tap')}</p>${ps}<div class="actions"><button type="button" class="primary" data-act="rdchk" data-id="${it.id}">${u('chkmark')}</button></div>${quiz}`+(it.vi&&S.lang==='vi'?`<p class="vis">${rich(it.vi)}</p>`:'')},
 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';
   else el=`<input class="in" type="text" data-k="p${i}" data-part="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(8,String([].concat(g.a)[0]).length+2)}" value="${esc(v)}">`;
   html=html.replace('{'+i+'}',el)});
  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},
 match(it){const a=A(it.id);const o=matchOpts(it);return it.rows.map((r,i)=>`<div class="mrow" data-part="${i}"><div><b>${rich(T(r.l))}</b></div><select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${a['p'+i]===x?' selected':''}>${esc(x)}</option>`).join('')+'</select></div>').join('')},
 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{

    return`<div class="fld" data-part="${i}"><label>${esc(it.cols[ci])}</label>${f}</div>`}
   return`<div class="fld"><label>${esc(it.cols[ci])}</label><div>${rich(T(c))}</div></div>`}).join('')+'</div>'}).join('')},
 calc(it){const a=A(it.id);return it.parts.map((p,i)=>`<div class="crow" data-part="${i}"><p class="qt">${rich(T(p.q))}</p><input class="in" type="text" inputmode="decimal" data-k="p${i}" value="${esc(a['p'+i]||'')}" autocomplete="off" placeholder="0,00"><span class="u">${esc(p.u||'')}</span>${p.work?`<textarea class="in" data-k="p${i}w" rows="2" style="min-height:4rem" placeholder="${S.lang==='vi'?'Cách tính (viết ra)':'Rechenweg (aufschreiben)'}">${esc(a['p'+i+'w']||'')}</textarea>`:''}</div>`).join('')},
 free(it){const a=A(it.id);const sh=S.shown[it.id];return it.parts.map((p,i)=>`<div class="fpart"><p class="qt">${rich(T(p.q))}</p>${wg(it,i,p)}<textarea class="in" id="${it.id}_${i}" data-k="p${i}" rows="3" placeholder="…">${esc(a['p'+i]||'')}</textarea>`+(sh?`<div class="model"><div class="t">${u('model').replace(/ anzeigen| ?$/,'')}</div>${rich(T(p.m))}</div>`:'')+'</div>').join('')+(sh?`<div class="rate"><span style="flex:1 1 100%;font-weight:600">${u('rate')}</span>`+['y','p','n'].map(v=>`<button type="button" data-rate="${v}" data-k="r" class="${a.r===v?'on':''}">${u(v)}</button>`).join('')+'</div>':'')}
};

 [25,50,75,100].forEach(m=>{if(pc>=m&&!(S.toast||{})[m]&&n>0){S.toast=S.toast||{};S.toast[m]=1;if(m===100||m===50)toast(m+' % ✓')}})}

  let h=`${g.found===g.total&&!g.extra?'✔':'ℹ️'} ${g.found} ${u('of')} ${g.total} ${u('found')}`+(g.extra?`, ${g.extra} ${u('extra')}`:'');fb.className='fb '+(g.found===g.total&&!g.extra?'ok':'mid');fb.innerHTML=h;

window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
