<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF 4 · Digitales Arbeitsblatt</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + .5rem) 1rem .4rem}
#bar .row{display:flex;align-items:center;gap:.6rem;max-width:56rem;margin:0 auto}
#bar .ttl{font-weight:700;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{height:.7rem;background:#e6e3da;border-radius:1rem;overflow:hidden;max-width:56rem;margin:.35rem auto 0}
#progf{height:100%;width:0;background:var(--pri);transition:width .4s}
#progt{font-size:.8rem;color:var(--mute);max-width:56rem;margin:.1rem auto 0}
#langs{display:flex;gap:.4rem;overflow-x:auto;max-width:56rem;margin:.35rem auto 0;padding-bottom:.15rem;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;min-height:44px;padding:0 .9rem;border:2px solid var(--line);background:#fff;border-radius:2rem;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;margin:0 0 1rem}
.card h2{font-size:1.25rem;margin:0 0 .4rem;line-height:1.3}
.card h2 .nr{display:inline-block;background:var(--pri);color:#fff;border-radius:.5rem;padding:0 .5rem;margin-right:.4rem;font-size:.95rem}
.vtag{display:inline-block;background:#6a3fa0;color:#fff;border-radius:.5rem;padding:0 .5rem;font-size:.85rem;margin-left:.3rem}
.card.v{border-color:#6a3fa0;background:#faf6ff}
.tr{font-size:.9rem;color:#4a5a66;background:#f1f6f9;border-left:4px solid #9cc3d5;border-radius:.4rem;padding:.3rem .6rem;margin:.3rem 0 .5rem;line-height:1.5}
.tr[dir=rtl]{border-left:0;border-right:4px solid #9cc3d5}
.tr[lang=ti]{font-family:"Kefa","Noto Sans Ethiopic",sans-serif}
.tr[lang=vi]{line-height:1.65}
small.b{display:block;font-size:.72rem;font-weight:400;opacity:.9;line-height:1.2}
.in{display:block;width:100%;min-height:48px;font:inherit;font-size:1rem;padding:.55rem .7rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink)}
input.in,select.in{font-size:1rem}
textarea.in{min-height:5.5rem;resize:vertical}
.btn{min-height:48px;padding:.4rem 1.1rem;border:0;border-radius:.8rem;background:var(--pri);color:#fff;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin:.3rem .4rem .3rem 0}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.gray{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.big{min-height:56px;font-size:1.1rem}
.btn:active,.pill:active,.opt:active,.ch:active{transform:scale(.97)}
.tipb{min-height:48px;min-width:48px;border-radius:2rem;border:2px solid var(--warn);background:var(--warnbg);font:inherit;font-size:1rem;cursor:pointer;padding:0 .9rem;float:right;margin:0 0 .3rem .5rem}
.tipbox{background:var(--warnbg);border:2px solid var(--warn);border-radius:.8rem;padding:.5rem .8rem;margin:.4rem 0}
.q{margin:.8rem 0 .2rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:.45rem;margin:.3rem 0}
.opt{min-height:48px;text-align:left;padding:.5rem .8rem;border:2px solid var(--line);background:#fff;border-radius:.8rem;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--pri);background:var(--pri2);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.tbl{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:1rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.4rem .3rem;text-align:left;vertical-align:middle}
.tbl.info th{background:#eef3f6}
.tbl.info td,.tbl.info th{border:1px solid var(--line);padding:.4rem .5rem}
.tbl td.c{text-align:center;white-space:nowrap}
.ch{min-width:48px;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:.7rem;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer;margin:2px}
.ch.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.sol{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
tr.rok td{background:var(--okbg)}tr.rno td{background:var(--badbg)}
.fb{border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0;font-size:1rem}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb.part{background:var(--warnbg);border:1px solid var(--warn)}
.sit{background:#eef3f6;border-left:5px solid var(--pri);border-radius:.5rem;padding:.5rem .8rem;margin:.5rem 0}
.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#23303a;color:#fff;padding:.6rem 1.1rem;border-radius:2rem;z-index:99;font-size:1rem;max-width:90%}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}
.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}
#set.open{display:block}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row2 label{font-weight:600;min-width:7rem}
.nowrap{white-space:nowrap}
#report{display:none}
@media (max-width:600px){main{padding-top:8.2rem}.card{padding:.8rem}h1{font-size:1.35rem}.tbl{font-size:.95rem}}
@media print{
 body{background:#fff;padding:0;font-size:11pt}
 #bar,#set,main,.toast,.dlg,.noprint{display:none!important}
 #report{display:block!important}
 #report h1{font-size:16pt}
 #report table{width:100%;border-collapse:collapse;font-size:10pt}
 #report td,#report th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

.tbl.selt td:first-child{width:55%}
.tbl.selt select.gapsel{width:100%;min-width:0}

</style>
</head>

{k:'read',id:'r1',h:'Zum Nachlesen: Warenträger und Platzierungsarten',sum:'Der Warenträger muss zur Ware passen. Verbundplatzierung heißt: Artikel, die sich ergänzen, stehen zusammen.',
 paras:['[[Warenträger]] sind Teil der Ladeneinrichtung. Auf ihnen wird die Ware gelagert und den Kunden [[ansprechend]] und [[gut erreichbar]] präsentiert.','Der Warenträger muss zur Ware passen: wertvoll → [[Vitrine]], hängend → [[Ständer]], Menge → [[Palette]] oder [[Display]]. Ein [[Stopper]] (Tisch, Ständer oder Figur mitten am Weg) bremst den Kunden und lenkt den Blick.','Bei der [[Warengruppenplatzierung]] stehen gleichartige Artikel zusammen. Bei der [[Verbundplatzierung]] stehen Artikel zusammen, die sich ergänzen (Bedarfsbündel).','Bei der [[Zweitplatzierung]] steht ein Artikel zusätzlich an einem zweiten Platz. Bei der [[Mehrfachplatzierung]] steht ein Artikel an mehreren Stellen. Eine [[Aktionsfläche]] ist eine Fläche für Angebote und Themen auf Zeit.'],

{k:'task',id:'a3',n:'Aufgabe 3',h:'Vorgemacht: eine Prüfungsaufgabe',hk:'c.vor.h',intro:'Lies das Beispiel. Dann entscheide: richtig oder falsch?',ik:'c.vor.i',tip:'Schau in die Tabelle „So gehe ich vor“. Die Erläuterung bringt 2 Punkte, das Beispiel 1 Punkt.',ex:'Die Erläuterung muss ein ganzer Satz sein. Die Artikel im Beispiel müssen sich wirklich ergänzen.',
 sit:'<b>Die Aufgabe:</b> In der Gartenabteilung eines Baumarkts sollen die Waren verkaufsaktiver präsentiert werden. Sie sollen passende Artikel in einer Verbundplatzierung anbieten. Erklären Sie den Begriff Verbundplatzierung und nennen Sie ein Beispiel Ihrer Wahl! (3 Punkte)<table class="tbl info"><tr><th>Denkschritt</th><th>So gehe ich vor</th></tr><tr><td>1 Punkte verteilen</td><td>3 Punkte: Erläuterung 2, Beispiel 1 – also muss die Erläuterung ein ganzer Satz sein.</td></tr><tr><td>2 Erläutern</td><td>Verbundplatzierung ist die Platzierung von Artikeln, die sich gegenseitig ergänzen, an einem Ort.</td></tr><tr><td>3 Beispiel</td><td>Grillfleisch zusammen mit Grillsoßen und passenden Getränken.</td></tr><tr><td>4 Prüfen</td><td>Ergänzen sich die Artikel wirklich? „Äpfel neben Birnen“ wäre Warengruppenplatzierung, keine Verbundplatzierung.</td></tr></table>',items:[
 {t:'tf',id:'a3.1',rows:[['Die Erläuterung bringt 2 Punkte, das Beispiel 1 Punkt.',true],['„Äpfel neben Birnen“ ist eine Verbundplatzierung.',false],['Die Erläuterung schreibe ich als ganzen Satz.',true]]}]},
{k:'task',id:'a4',n:'Aufgabe 4',h:'Geführte Übung: Welcher Warenträger passt?',intro:'Wähle für jeden Artikel den passenden Warenträger.',ik:'a4.i',tip:'Frage dich: Ist der Artikel wertvoll, hängend, in großer Menge, klein und viel Auswahl, oder billig zum Stöbern?',ex:'Goldkette: Vitrine (wertvoll, geschützt). Sommerkleider: Rundständer (hängend, knitterfrei). Wein: Wandregal (viele Sorten übersichtlich). Grillkohle im Angebot: Palette oder Display (große Menge). Sonnenbrillen: Drehständer mit Spiegel (zum Anprobieren). Socken im Angebot: Wühltisch oder Korb (Massenware zum Stöbern).',items:[
 {t:'sel',id:'a4.1',o:['Vitrine','Rundständer oder Barrenständer','Regal (Wandregal)','Palette oder Display am Hauptweg','Drehständer mit Spiegel','Wühltisch oder Korb'],rows:[['Goldkette',0],['Sommerkleider',1],['Wein',2],['Grillkohle im Sonderangebot',3],['Sonnenbrillen',4],['Socken im Angebot',5]]}]},
{k:'task',id:'a5',n:'Aufgabe 5',h:'Geführte Übung: Welche Platzierungsart ist das?',intro:'Lies jede Beobachtung. Welche Platzierungsart ist es?',ik:'a5.i',tip:'Gleichartig zusammen? Sich ergänzend zusammen? Zusätzlicher zweiter Platz? Mehrere Stellen?',ex:'Gleichartige Artikel = Warengruppenplatzierung. Sich ergänzende Artikel = Verbundplatzierung. Ein Artikel an einem zweiten Platz = Zweitplatzierung. Ein Artikel an mehreren Stellen = Mehrfachplatzierung.',items:[
 {t:'sel',id:'a5.1',o:['Warengruppenplatzierung','Verbundplatzierung','Zweitplatzierung','Mehrfachplatzierung'],rows:[['1 Alle Kaffeesorten stehen nebeneinander im Kaffeeregal.',0],['2 Neben dem Grillfleisch stehen Grillsoßen und Holzkohle.',1],['3 Die Chips stehen im Regal und zusätzlich auf einem Display an der Kasse.',2],['4 Auf einem Tisch am Eingang: Schulranzen, Hefte, Stifte und Brotdosen.',1],['5 Batterien hängen im Elektroregal, an der Kasse und bei den Spielwaren.',3],['6 Alle Shampoos stehen zusammen in einem Regalblock.',0]]}]},
{k:'task',id:'a6',n:'Aufgabe 6',h:'Freie Übung: Eine Aktionsfläche planen (2 Leistungspunkte)',intro:'Das Warenhaus „Anton Geller“ will im Untergeschoss die Lebensmittelabteilung beleben (Arbeitsheft S. 171). Plane eine Aktionsfläche zum Thema „Frühstück wie im Hotel“ oder zu einem eigenen Thema.',ik:'a6.i',tip:'Gehe die Planungspunkte der Reihe nach durch: Thema, Artikel, Warenträger und Standort, Gestaltung, Erfolgskontrolle.',ex:'Gute Pläne haben ein passendes Verbund-Sortiment, einen begründeten Standort mit Warenträger und zwei Wege der Erfolgskontrolle.',items:[
 {t:'free',id:'a6.1',pts:2,nq:1,q:'Thema und Zielgruppe · Artikel (mindestens 6, als Verbund) · Warenträger und Standort (Zone!) · Gestaltung: Licht, Farbe, Deko, Sinne · Wie prüfen wir den Erfolg? (2 Möglichkeiten)',model:'Thema: Frühstück wie im Hotel – Paare und Familien am Wochenende. Artikel: Aufbackbrötchen, Marmelade, Honig, Kaffee, Orangensaft, Eierbecher, Frühstücksbrettchen. Warenträger und Standort: Tisch als Stopper plus Kühlregal-Display, am Hauptweg bzw. in einem schwachen Mittelgang zur Aufwertung. Gestaltung: warmes Licht, gedeckter Frühstückstisch, Kaffeeduft, Verkostung am Samstag. Erfolg prüfen: Umsatz der Artikel vorher und nachher vergleichen; Abverkauf zählen; Kunden befragen.'}]},

 sit:'<b>Situation:</b> Im Warenhaus Seeblick GmbH werden verschiedene Warenträger eingesetzt. Ihr Abteilungsleiter bittet Sie, Ware aus Ihrer Abteilung neu zu präsentieren.',items:[

 {t:'free',id:'a7.1b',pts:4,q:'7.1 Begründen Sie, warum der jeweilige Warenträger passt! (je 2 Punkte)',model:'Armbanduhr – Vitrine: wertvoll, diebstahlgefährdet; beleuchtet und geschützt, wirkt hochwertig. Sommerkleid – Rundständer: hängt knitterfrei, Kunden sehen Schnitt und Farbe, viele Größen auf wenig Platz.'},
 {t:'free',id:'a7.2',pts:4,q:'7.2 Sie sollen Ware für eine Aktion präsentieren. Wählen Sie einen Artikel und einen passenden Warenträger – einen anderen als in 7.1 – und begründen Sie Ihre Wahl! (4 Punkte: Artikel 1, Warenträger 1, Begründung 2)',model:'z. B. Grillkohle – Palette/Display am Hauptweg: große Menge, auffällig, Kunden nehmen im Vorbeigehen mit'}]},
{k:'task',id:'a8',n:'Aufgabe 8',h:'Für Profis',hk:'c.profis.h',intro:'Schwierigere Fragen. Begründe deine Antwort.',ik:'c.profis.i',tip:'8.1: Was bekommt der Händler gratis, was gibt er ab? 8.2: Welche Waren sind klein und zahlreich?',ex:'Ein gutes Urteil nennt Vorteile und Nachteile und begründet die Entscheidung.',items:[
 {t:'free',id:'a8.1',q:'8.1 Viele Displays stellt der Hersteller kostenlos zur Verfügung – mit seiner Ware. Beurteilen Sie dieses Angebot aus Sicht des Händlers (je zwei Vor- und Nachteile).',model:'Vorteile: kostenlos, auffällig, professionell gestaltet, oft mit Werbeaktion. Nachteile: Hersteller bestimmt, was platziert wird; passt vielleicht nicht zum Ladenbild; nimmt Platz für andere Ware weg; Abhängigkeit.'},
 {t:'free',id:'a8.2',q:'8.2 Beim Rackjobber-System mietet ein Großhändler oder Hersteller ein Regal im Laden und bestückt es selbst (Lehrbuch S. 219, Randspalte). Erläutern Sie, für welche Waren sich das eignet und was der Händler dabei aus der Hand gibt.',model:'Für Randsortimente mit vielen kleinen Artikeln (Strumpfwaren, Kurzwaren, Zeitschriften, Tierbedarf). Der Händler gibt Sortimentsgestaltung und Regalpflege ab, verdient an der Fläche, hat aber weniger Einfluss auf Auswahl und Preise.'}]},
{k:'task',id:'v1',lvl:'v',n:'Vertiefung',h:'Warum ist das so?',hk:'c.v.h',intro:'Begründe deine Antwort in ganzen Sätzen. Vergleiche danach mit der Musterlösung.',ik:'c.v.i',tip:'Beginne mit „Weil …“. Denke an die Ware und den Kunden.',tk:'c.v.t',ek:'c.v.e',items:[
 {t:'free',id:'v1.1',pts:2,q:'V1 Warum sind „Äpfel neben Birnen“ eine Warengruppenplatzierung und keine Verbundplatzierung?',model:'Äpfel und Birnen sind gleichartige Artikel (beides Obst). Sie ergänzen sich nicht gegenseitig. Bei der Verbundplatzierung stehen Artikel zusammen, die man zusammen braucht, z. B. Grillfleisch, Soßen und Kohle.'},
 {t:'free',id:'v1.2',pts:2,q:'V2 Begründe am Beispiel Goldkette: Warum muss der Warenträger zur Ware passen?',model:'Eine Goldkette ist wertvoll und diebstahlgefährdet. In einer Vitrine wird sie hervorgehoben und ist geschützt. Ein Wühltisch würde sie billig wirken lassen und wäre nicht sicher.'}]},

'title':['Kệ trưng bày và cách sắp xếp hàng','Soportes de mercancía y formas de colocación','Suportes de mercadoria e formas de colocação','Стелажі та способи розміщення товару','መእቀቢ ኣቕሑትን ኣገባብ ኣቀማምጣን','Стеллажи и способы размещения товара','حاملات البضائع وأنواع الترتيب','Mal taşıyıcılar ve yerleştirme türleri'],
'can.0':['Gọi tên Warenträger (kệ trưng bày) và giải thích chúng hợp với loại hàng nào.','Nombrar los Warenträger (soportes de mercancía) y justificar para qué mercancía sirven.','Nomear os Warenträger (suportes de mercadoria) e justificar para que mercadoria servem.','Називати Warenträger (стелажі) та обґрунтовувати, для якого товару вони підходять.','Warenträger ሰም ሃብ፣ ንኣየናይ ኣቕሓ ከም ዝሰማማዕ ኣረጋግጽ።','Называть Warenträger (стеллажи) и обосновывать, для какого товара они подходят.','تسمية Warenträger (حاملات البضائع) وتعليل ملاءمتها لأي بضاعة.','Warenträger’ı (mal taşıyıcı) adlandırmak ve hangi mala uyduğunu gerekçelendirmek.'],
'can.1':['Giải thích Verbundplatzierung (đặt hàng bổ trợ), Zweitplatzierung (đặt lần hai) và Mehrfachplatzierung (đặt nhiều nơi) qua ví dụ.','Explicar con ejemplos la Verbundplatzierung (colocación conjunta), Zweitplatzierung (segunda colocación) y Mehrfachplatzierung (colocación múltiple).','Explicar com exemplos a Verbundplatzierung (colocação conjunta), Zweitplatzierung (segunda colocação) e Mehrfachplatzierung (colocação múltipla).','Пояснювати на прикладах Verbundplatzierung (комплексне розміщення), Zweitplatzierung (друге розміщення) і Mehrfachplatzierung (багаторазове розміщення).','Verbundplatzierung፣ Zweitplatzierung ን Mehrfachplatzierung ብኣብነታት ግለጽ።','Объяснять на примерах Verbundplatzierung (комплексное размещение), Zweitplatzierung (второе размещение) и Mehrfachplatzierung (многократное размещение).','شرح Verbundplatzierung (الترتيب المتكامل) وZweitplatzierung (الترتيب الثاني) وMehrfachplatzierung (الترتيب المتعدد) بأمثلة.','Verbundplatzierung (tamamlayıcı yerleştirme), Zweitplatzierung (ikinci yerleştirme) ve Mehrfachplatzierung (çoklu yerleştirme) kavramlarını örneklerle açıklamak.'],
'a1.t':['Hãy nghĩ đến mũi tên trong sơ đồ: khách nhìn về đâu?','Piensa en la flecha del plano: ¿hacia dónde miran los clientes?','Pensa na seta da planta: para onde olham os clientes?','Згадай стрілку на плані: куди дивляться клієнти?','ነቲ ምልክት ኣብ ካርታ ሕሰብ: ዓሚላት ናበይ ይጥምቱ?','Вспомни стрелку на плане: куда смотрят клиенты?','تذكّر السهم في المخطط: إلى أين ينظر الزبائن؟','Plandaki oku düşün: Müşteriler nereye bakar?'],
'a1.e':['Xem lại Modul 6: khu mạnh/yếu và các loại hàng.','Repasa el Modul 6: zonas fuertes/débiles y tipos de artículo.','Revê o Modul 6: zonas fortes/fracas e tipos de artigo.','Повтори Modul 6: сильні/слабкі зони й види товарів.','Modul 6 ደጊምካ ርአ: ጽኑዕ/ድኹም ዞናትን ዓይነታት ኣቕሑትን።','Повтори Modul 6: сильные/слабые зоны и виды товаров.','راجع Modul 6: المناطق القوية/الضعيفة وأنواع السلع.','Modul 6’ya tekrar bak: güçlü/zayıf bölgeler ve ürün türleri.'],
'a1.1.q':['1.1 Khu bên trái đường chính là verkaufsstark (bán mạnh) hay verkaufsschwach (bán yếu)?','1.1 ¿La zona a la izquierda del recorrido principal es verkaufsstark (fuerte) o verkaufsschwach (débil)?','1.1 A zona à esquerda do percurso principal é verkaufsstark (forte) ou verkaufsschwach (fraca)?','1.1 Зона ліворуч від головного маршруту verkaufsstark (сильна) чи verkaufsschwach (слабка)?','1.1 እታ ኣብ ጸጋም ቀንዲ መገዲ ዘላ ዞና verkaufsstark ድዩ verkaufsschwach?','1.1 Зона слева от главного пути verkaufsstark (сильная) или verkaufsschwach (слабая)?','1.1 هل المنطقة يسار المسار الرئيسي verkaufsstark (قوية) أم verkaufsschwach (ضعيفة)؟','1.1 Ana yolun solundaki bölge verkaufsstark (güçlü) mu verkaufsschwach (zayıf) mı?'],
'a1.2.q':['1.2 Đặt Impulsartikel (hàng mua bốc đồng) ở đâu?','1.2 ¿Dónde se colocan los Impulsartikel (artículos de impulso)?','1.2 Onde se colocam os Impulsartikel (artigos de impulso)?','1.2 Де розміщують Impulsartikel (імпульсні товари)?','1.2 Impulsartikel ኣበይ ይቕመጡ?','1.2 Где размещают Impulsartikel (импульсные товары)?','1.2 أين توضع Impulsartikel (سلع الاندفاع)؟','1.2 Impulsartikel (ani alım ürünleri) nereye konur?'],
'a1.3.q':['1.3 Kể hai biện pháp làm cho khu yếu hấp dẫn hơn.','1.3 Nombra dos medidas para revalorizar zonas débiles.','1.3 Nomeia duas medidas para valorizar zonas fracas.','1.3 Назви два заходи для покращення слабких зон.','1.3 ንድኹማት ዞናት ዘሐይሉ ክልተ ተግባራት ጥቀስ።','1.3 Назови две меры для улучшения слабых зон.','1.3 اذكر إجراءين لرفع قيمة المناطق الضعيفة.','1.3 Zayıf bölgeleri iyileştirmek için iki önlem say.'],
'a2.h':['Thử thách buổi nướng thịt','El reto de la barbacoa','O desafio do churrasco','Челендж «Вечір барбекю»','ፈተና ምሸት ጥሑል ስጋ','Челлендж «Вечер барбекю»','تحدّي حفلة الشواء','Mangal akşamı yarışması'],
'a2.i':['Trong giờ học, nhóm em dùng mười hai thẻ hàng để dựng một khu bán „buổi nướng thịt“ trên bàn. Trả lời các câu hỏi ở đây.','En clase tu grupo monta con doce tarjetas una zona de venta «barbacoa» sobre la mesa. Responde aquí las preguntas.','Na aula o teu grupo monta com doze cartões uma zona de venda «churrasco» na mesa. Responde aqui às perguntas.','На уроці твоя група з дванадцяти карток збирає на столі зону продажу «барбекю». Відповідай тут на запитання.','ኣብ ትምህርቲ ጉጅለኻ ብዓሰርተ ክልተ ካርድ ኣብ ጠረጴዛ ዞና ሽያጥ «ጥሑል ስጋ» ይሰርሕ። ኣብዚ ንሕቶታት መልስ።','На уроке твоя группа из двенадцати карточек собирает на столе зону продажи «барбекю». Отвечай здесь на вопросы.','في الحصة تبني مجموعتك بإثنتي عشرة بطاقة منطقة بيع «شواء» على الطاولة. أجب هنا عن الأسئلة.','Derste grubun on iki kartla masada «mangal akşamı» satış alanı kurar. Soruları burada cevapla.'],
'a2.t':['Nghĩ xem: Cần những gì cho buổi nướng thịt? Thông thường chúng ở những khu nào?','Piensa: ¿qué hace falta para una barbacoa? ¿En qué secciones suele estar?','Pensa: o que é preciso para um churrasco? Em que secções costuma estar?','Подумай: що потрібно для барбекю? У яких відділах це зазвичай стоїть?','ሕሰብ: ንጥሑል ስጋ እንታይ የድሊ? ብዙሕ ግዜ ኣብ ኣየኖት ክፍልታት ይርከብ?','Подумай: что нужно для барбекю? В каких отделах это обычно стоит?','فكّر: ماذا يلزم للشواء؟ في أي أقسام يوجد عادةً؟','Düşün: Mangal için neler gerekir? Normalde hangi bölümlerde durur?'],
'a2.e':['Hàng bổ trợ cho nhau được xếp cùng chỗ. Thuận tiện cho khách và giúp cửa hàng bán thêm.','Las mercancías que se complementan se colocan juntas. Es cómodo para los clientes y aporta compras adicionales.','As mercadorias que se complementam ficam juntas. É cómodo para os clientes e traz compras adicionais.','Товари, що доповнюють один одного, ставлять разом. Це зручно клієнтам і дає магазину додаткові покупки.','ዝተመላለሱ ኣቕሑት ብሓባር ይቕመጡ። ንዓሚላት ምቹእ እዩ፣ ንድኳን ድማ ተወሳኺ ሽያጥ የምጽእ።','Дополняющие друг друга товары ставят вместе. Это удобно клиентам и даёт магазину дополнительные покупки.','البضائع المتكاملة توضع معًا. هذا مريح للزبائن ويجلب مشتريات إضافية للمتجر.','Birbirini tamamlayan mallar birlikte konur. Müşteriye rahatlık sağlar, mağazaya ek satış getirir.'],
'a2.1.q':['2.1 Nhóm em sắp xếp các thẻ theo nguyên tắc nào?','2.1 ¿Con qué principio habéis ordenado las tarjetas?','2.1 Com que princípio ordenaram os cartões?','2.1 За яким принципом ви розклали картки?','2.1 ነተን ካርድ ብኸመይ መትከል ሰራዕኩሙ?','2.1 По какому принципу вы разложили карточки?','2.1 بأي مبدأ رتّبتم البطاقات؟','2.1 Kartları hangi ilkeye göre dizdiniz?'],
'a2.2.q':['2.2 Ở siêu thị, những hàng này thường nằm ở năm khu khác nhau. Cách làm của nhóm em có lợi gì cho khách – và cho cửa hàng?','2.2 En el supermercado estas mercancías suelen estar en cinco secciones distintas. ¿Qué ventaja tiene vuestra solución para los clientes y para la tienda?','2.2 No supermercado estas mercadorias costumam estar em cinco secções diferentes. Que vantagem tem a vossa solução para os clientes e para a loja?','2.2 У супермаркеті ці товари зазвичай стоять у п’яти різних відділах. Яка користь від вашого рішення для клієнтів і для магазину?','2.2 ኣብ ሱፐርማርኬት እዞም ኣቕሑት ብዙሕ ግዜ ኣብ ሓሙሽተ ዝተፈላለዩ ክፍልታት እዮም። እዚ ፍታሕኩም ንዓሚላትን ንድኳንን እንታይ ረብሓ ኣለዎ?','2.2 В супермаркете эти товары обычно стоят в пяти разных отделах. Какая польза от вашего решения для клиентов и для магазина?','2.2 في السوبرماركت تقف هذه البضائع عادةً في خمسة أقسام مختلفة. ما فائدة حلّكم للزبائن وللمتجر؟','2.2 Markette bu mallar normalde beş farklı bölümde durur. Çözümünüzün müşteri ve mağaza için yararı nedir?'],
'r1.h':['Đọc thêm: Kệ trưng bày và các cách sắp xếp hàng','Para leer: soportes de mercancía y formas de colocación','Para ler: suportes de mercadoria e formas de colocação','Для читання: стелажі та способи розміщення товару','ንምንባብ: መእቀቢ ኣቕሑትን ኣገባብ ኣቀማምጣን','Для чтения: стеллажи и способы размещения товара','للقراءة: حاملات البضائع وأنواع الترتيب','Okumak için: Mal taşıyıcılar ve yerleştirme türleri'],
'r1.s':['Warenträger phải hợp với hàng. Verbundplatzierung nghĩa là hàng bổ trợ cho nhau được đặt cùng chỗ.','El Warenträger debe encajar con la mercancía. Verbundplatzierung significa que se colocan juntos artículos que se complementan.','O Warenträger tem de combinar com a mercadoria. Verbundplatzierung significa que artigos que se complementam ficam juntos.','Warenträger має пасувати товару. Verbundplatzierung означає, що товари, які доповнюють один одного, стоять разом.','Warenträger ምስ ኣቕሓ ክሰማማዕ ኣለዎ። Verbundplatzierung ማለት ዝተመላለሱ ኣቕሑት ብሓባር ይቕመጡ።','Warenträger должен подходить товару. Verbundplatzierung означает, что дополняющие друг друга товары стоят вместе.','يجب أن يناسب Warenträger البضاعة. Verbundplatzierung تعني وضع سلع متكاملة معًا.','Warenträger mala uymalı. Verbundplatzierung birbirini tamamlayan malların bir arada durması demektir.'],
'r1.qq':['Verbundplatzierung là gì?','¿Qué es una Verbundplatzierung?','O que é uma Verbundplatzierung?','Що таке Verbundplatzierung?','Verbundplatzierung እንታይ እዩ?','Что такое Verbundplatzierung?','ما هي Verbundplatzierung؟','Verbundplatzierung nedir?'],
'a3.t':['Xem bảng „So gehe ich vor“. Phần giải thích được 2 điểm, ví dụ 1 điểm.','Mira la tabla «So gehe ich vor». La explicación vale 2 puntos, el ejemplo 1.','Vê a tabela «So gehe ich vor». A explicação vale 2 pontos, o exemplo 1.','Подивись таблицю «So gehe ich vor». Пояснення — 2 бали, приклад — 1.','ሰንጠረዥ «So gehe ich vor» ርአ። መግለጺ 2 ነጥቢ፣ ኣብነት 1።','Посмотри таблицу «So gehe ich vor». Объяснение — 2 балла, пример — 1.','انظر جدول «So gehe ich vor». الشرح بنقطتين والمثال بنقطة.','«So gehe ich vor» tablosuna bak. Açıklama 2 puan, örnek 1 puan.'],
'a3.e':['Phần giải thích phải là một câu đầy đủ. Các món trong ví dụ phải thật sự bổ trợ nhau.','La explicación debe ser una frase completa. Los artículos del ejemplo deben complementarse de verdad.','A explicação tem de ser uma frase completa. Os artigos do exemplo têm de se complementar mesmo.','Пояснення має бути повним реченням. Товари в прикладі мають справді доповнювати один одного.','መግለጺ ምሉእ ሓረግ ክኸውን ኣለዎ። እቶም ኣብ ኣብነት ዘለዉ ኣቕሑት ብሓቂ ክመላለሱ ኣለዎም።','Объяснение должно быть полным предложением. Товары в примере должны действительно дополнять друг друга.','يجب أن يكون الشرح جملة كاملة، وأن تتكامل السلع في المثال فعلًا.','Açıklama tam cümle olmalı. Örnekteki mallar gerçekten birbirini tamamlamalı.'],
'a4.h':['Bài tập có hướng dẫn: Warenträger nào phù hợp?','Ejercicio guiado: ¿qué Warenträger encaja?','Exercício guiado: que Warenträger combina?','Керована вправа: який Warenträger підходить?','ምምሕዳር ልምምድ: ኣየናይ Warenträger ይሰማማዕ?','Упражнение с подсказкой: какой Warenträger подходит?','تمرين موجَّه: أي Warenträger يناسب؟','Rehberli alıştırma: Hangi Warenträger uyar?'],
'a4.i':['Chọn Warenträger (kệ trưng bày) phù hợp cho từng mặt hàng.','Elige para cada artículo el Warenträger (soporte) adecuado.','Escolhe para cada artigo o Warenträger (suporte) adequado.','Обери для кожного товару відповідний Warenträger (стелаж).','ንነፍሲ ወከፍ ኣቕሓ ዝግባእ Warenträger ምረጽ።','Выбери для каждого товара подходящий Warenträger (стеллаж).','اختر لكل سلعة Warenträger (حامل) مناسبًا.','Her ürün için uygun Warenträger’ı (mal taşıyıcı) seç.'],
'a4.t':['Hỏi: Hàng đắt, treo, số lượng lớn, nhỏ và nhiều mẫu, hay rẻ để lục lọi?','Pregunta: ¿es valiosa, colgante, de gran cantidad, pequeña con mucha variedad o barata para rebuscar?','Pergunta: é valiosa, pendurada, em grande quantidade, pequena com muita variedade ou barata para remexer?','Запитай: товар цінний, висячий, у великій кількості, маленький із великим вибором чи дешевий для перебирання?','ሕተት: ክቡር፣ ዝተሰቀለ፣ ብብዙሕ ብዝሒ፣ ንእሽቶ ምስ ብዙሕ ምርጫ ወይ ርካሽ ንምድላይ?','Спроси себя: товар ценный, висячий, большое количество, маленький с большим выбором или дешёвый для копания?','اسأل: هل هي ثمينة، معلّقة، بكمية كبيرة، صغيرة مع خيارات كثيرة، أم رخيصة للتفتيش؟','Sor: Değerli mi, asılı mı, büyük miktar mı, küçük ve çok seçenekli mi, yoksa ucuz ve karıştırmalık mı?'],
'a4.e':['Goldkette: Vitrine (quý, được bảo vệ). Sommerkleider: Rundständer (treo, không nhăn). Wein: Wandregal (nhiều loại, dễ nhìn). Grillkohle giảm giá: Palette/Display (số lượng lớn). Sonnenbrillen: Drehständer có gương (để thử). Socken giảm giá: Wühltisch/Korb (hàng loạt để lục).','Goldkette: Vitrine (valiosa, protegida). Sommerkleider: Rundständer (colgante, sin arrugas). Wein: Wandregal (muchas variedades claras). Grillkohle en oferta: Palette/Display (gran cantidad). Sonnenbrillen: Drehständer con espejo (para probar). Socken en oferta: Wühltisch/Korb (masa, para rebuscar).','Goldkette: Vitrine (valiosa, protegida). Sommerkleider: Rundständer (pendurado, sem vincos). Wein: Wandregal (muitas variedades). Grillkohle em promoção: Palette/Display (grande quantidade). Sonnenbrillen: Drehständer com espelho (para experimentar). Socken em promoção: Wühltisch/Korb (massa, para remexer).','Goldkette: Vitrine (цінна, захищена). Sommerkleider: Rundständer (висять, не м’ятуться). Wein: Wandregal (багато сортів). Grillkohle в акції: Palette/Display (велика кількість). Sonnenbrillen: Drehständer із дзеркалом (приміряти). Socken в акції: Wühltisch/Korb (масовий товар для перебирання).','Goldkette: Vitrine (ክቡር፣ ዝተሓለወ)። Sommerkleider: Rundständer። Wein: Wandregal። Grillkohle ቅናሽ: Palette/Display። Sonnenbrillen: Drehständer ምስ መስተዋት። Socken ቅናሽ: Wühltisch/Korb።','Goldkette: Vitrine (ценная, защищена). Sommerkleider: Rundständer (висят, не мнутся). Wein: Wandregal (много сортов). Grillkohle по акции: Palette/Display (большое количество). Sonnenbrillen: Drehständer с зеркалом (примерять). Socken по акции: Wühltisch/Korb (массовый товар, перебирать).','Goldkette: Vitrine (ثمينة، محمية). Sommerkleider: Rundständer (معلّقة بلا تجعد). Wein: Wandregal (أصناف كثيرة). Grillkohle عرض: Palette/Display (كمية كبيرة). Sonnenbrillen: Drehständer مع مرآة (للتجربة). Socken عرض: Wühltisch/Korb (سلعة رخيصة للتفتيش).','Goldkette: Vitrine (değerli, korunur). Sommerkleider: Rundständer (asılı, buruşmaz). Wein: Wandregal (çok çeşit net görünür). İndirimli Grillkohle: Palette/Display (büyük miktar). Sonnenbrillen: aynalı Drehständer (denemek için). İndirimli Socken: Wühltisch/Korb (ucuz toplu mal, karıştırmak için).'],
'a5.h':['Bài tập có hướng dẫn: Đây là cách đặt hàng nào?','Ejercicio guiado: ¿qué forma de colocación es?','Exercício guiado: que forma de colocação é?','Керована вправа: який це спосіб розміщення?','ምምሕዳር ልምምድ: እዚ ኣየናይ ኣገባብ ኣቀማምጣ እዩ?','Упражнение с подсказкой: какой это способ размещения?','تمرين موجَّه: أي نوع ترتيب هذا؟','Rehberli alıştırma: Bu hangi yerleştirme türü?'],
'a5.i':['Đọc từng quan sát. Đó là Platzierungsart (cách đặt hàng) nào?','Lee cada observación. ¿Qué Platzierungsart (forma de colocación) es?','Lê cada observação. Que Platzierungsart (forma de colocação) é?','Прочитай кожне спостереження. Який це Platzierungsart (спосіб розміщення)?','ነፍሲ ወከፍ ምስትውዓል ኣንብብ። ኣየናይ Platzierungsart እዩ?','Прочитай каждое наблюдение. Какой это Platzierungsart (способ размещения)?','اقرأ كل ملاحظة. أي Platzierungsart (نوع ترتيب) هذا؟','Her gözlemi oku. Bu hangi Platzierungsart (yerleştirme türü)?'],
'a5.t':['Cùng loại đặt chung? Hàng bổ trợ đặt chung? Thêm chỗ thứ hai? Nhiều nơi?','¿Del mismo tipo juntos? ¿Complementarios juntos? ¿Un segundo lugar extra? ¿Varios lugares?','Do mesmo tipo juntos? Complementares juntos? Um segundo lugar extra? Vários lugares?','Однотипні разом? Доповнювальні разом? Додаткове друге місце? Кілька місць?','ተመሳሳሊ ብሓባር? ዝተመላለሱ ብሓባር? ተወሳኺ ካልኣይ ቦታ? ብዙሕ ቦታታት?','Однотипные вместе? Дополняющие вместе? Дополнительное второе место? Несколько мест?','متشابهة معًا؟ متكاملة معًا؟ مكان ثانٍ إضافي؟ أماكن متعددة؟','Aynı türden olanlar bir arada mı? Tamamlayıcılar bir arada mı? Ek ikinci yer mi? Birden çok yer mi?'],
'a5.e':['Cùng loại = Warengruppenplatzierung. Bổ trợ nhau = Verbundplatzierung. Một mặt hàng ở chỗ thứ hai = Zweitplatzierung. Một mặt hàng ở nhiều nơi = Mehrfachplatzierung.','Del mismo tipo = Warengruppenplatzierung. Complementarios = Verbundplatzierung. Un artículo en segundo lugar = Zweitplatzierung. Un artículo en varios lugares = Mehrfachplatzierung.','Do mesmo tipo = Warengruppenplatzierung. Complementares = Verbundplatzierung. Um artigo num segundo lugar = Zweitplatzierung. Um artigo em vários lugares = Mehrfachplatzierung.','Однотипні = Warengruppenplatzierung. Доповнювальні = Verbundplatzierung. Один товар на другому місці = Zweitplatzierung. Один товар у кількох місцях = Mehrfachplatzierung.','ተመሳሳሊ = Warengruppenplatzierung። ዝተመላለሱ = Verbundplatzierung። ሓደ ኣቕሓ ኣብ ካልኣይ ቦታ = Zweitplatzierung። ሓደ ኣቕሓ ኣብ ብዙሕ ቦታታት = Mehrfachplatzierung።','Однотипные = Warengruppenplatzierung. Дополняющие = Verbundplatzierung. Один товар на втором месте = Zweitplatzierung. Один товар в нескольких местах = Mehrfachplatzierung.','متشابهة = Warengruppenplatzierung. متكاملة = Verbundplatzierung. سلعة في مكان ثانٍ = Zweitplatzierung. سلعة في عدة أماكن = Mehrfachplatzierung.','Aynı tür = Warengruppenplatzierung. Tamamlayıcı = Verbundplatzierung. Bir mal ikinci yerde = Zweitplatzierung. Bir mal birçok yerde = Mehrfachplatzierung.'],
'a6.h':['Bài tập tự do: Lập kế hoạch một khu khuyến mãi (2 điểm)','Ejercicio libre: planificar una zona de acción (2 puntos)','Exercício livre: planear uma zona de ação (2 pontos)','Вільна вправа: сплануй акційну зону (2 бали)','ናጻ ልምምድ: ዞና ተግባር ምዕላል (2 ነጥቢ)','Свободное упражнение: спланируй акционную зону (2 балла)','تمرين حر: خطّط لمنطقة عروض (نقطتان)','Serbest alıştırma: Aksiyon alanı planla (2 puan)'],
'a6.i':['Warenhaus „Anton Geller“ muốn làm sôi động khu thực phẩm ở tầng hầm (Arbeitsheft tr. 171). Hãy lập kế hoạch một Aktionsfläche (khu khuyến mãi) với chủ đề „Frühstück wie im Hotel“ (bữa sáng như ở khách sạn) hoặc chủ đề riêng.','El Warenhaus «Anton Geller» quiere animar la sección de alimentación del sótano (Arbeitsheft p. 171). Planifica una Aktionsfläche (zona de acción) con el tema «Frühstück wie im Hotel» (desayuno de hotel) o uno propio.','O Warenhaus «Anton Geller» quer animar a secção de alimentação da cave (Arbeitsheft p. 171). Planeia uma Aktionsfläche (zona de ação) com o tema «Frühstück wie im Hotel» (pequeno-almoço de hotel) ou um tema próprio.','Warenhaus «Anton Geller» хоче пожвавити відділ продуктів у підвалі (Arbeitsheft с. 171). Сплануй Aktionsfläche (акційну зону) на тему «Frühstück wie im Hotel» (сніданок як у готелі) або власну.','Warenhaus «Anton Geller» ኣብ ትሕቲ መሬት ክፍሊ መግቢ ክነጥፎ ይደሊ (Arbeitsheft ገጽ 171)። Aktionsfläche ብጕዳይ «Frühstück wie im Hotel» ወይ ብናይ ባዕልኻ ጕዳይ ዕላል።','Warenhaus «Anton Geller» хочет оживить отдел продуктов в подвале (Arbeitsheft с. 171). Спланируй Aktionsfläche (акционную зону) на тему «Frühstück wie im Hotel» (завтрак как в отеле) или на свою тему.','يريد Warenhaus «Anton Geller» إحياء قسم الأغذية في الطابق السفلي (Arbeitsheft ص. 171). خطّط لـ Aktionsfläche (منطقة عروض) بموضوع «Frühstück wie im Hotel» (فطور كما في الفندق) أو بموضوع خاص.','Warenhaus «Anton Geller» bodrumdaki gıda bölümünü canlandırmak istiyor (Arbeitsheft s. 171). «Frühstück wie im Hotel» (otel kahvaltısı) veya kendi konunla bir Aktionsfläche (aksiyon alanı) planla.'],
'a6.t':['Đi lần lượt các điểm kế hoạch: chủ đề, món hàng, kệ và vị trí, cách bài trí, kiểm tra kết quả.','Recorre los puntos del plan: tema, artículos, soporte y lugar, diseño, control del éxito.','Percorre os pontos do plano: tema, artigos, suporte e local, design, controlo do êxito.','Пройди пункти плану: тема, товари, стелаж і місце, оформлення, перевірка успіху.','ነጥብታት ዕቑር ብተኸታታሊ ሕለፍ: ጕዳይ፣ ኣቕሑት፣ መእቀቢን ቦታን፣ ዲዛይን፣ ምፍታሽ ዓወት።','Пройди пункты плана: тема, товары, стеллаж и место, оформление, проверка успеха.','مرّ على نقاط الخطة بالترتيب: الموضوع، السلع، الحامل والمكان، التصميم، قياس النجاح.','Plan maddelerini sırayla geç: konu, ürünler, taşıyıcı ve yer, tasarım, başarı kontrolü.'],
'a6.e':['Kế hoạch tốt có: nhóm hàng bổ trợ hợp lý, vị trí có lý do kèm kệ, và hai cách kiểm tra kết quả.','Un buen plan tiene: surtido complementario adecuado, lugar justificado con soporte y dos formas de control del éxito.','Um bom plano tem: sortido complementar adequado, local justificado com suporte e duas formas de controlo do êxito.','Хороший план має: доречний комплексний асортимент, обґрунтоване місце зі стелажем і два способи перевірки успіху.','ጽቡቕ ዕቑር: ዝግባእ ዝተመላለሰ ሶርቲመንት፣ ብምኽንያት ዝተመደበ ቦታ ምስ መእቀቢ፣ ክልተ መገድታት ምፍታሽ ዓወት።','Хороший план содержит: подходящий комплексный ассортимент, обоснованное место со стеллажом и два способа проверки успеха.','الخطة الجيدة فيها: تشكيلة متكاملة مناسبة، ومكان معلَّل مع حامل، وطريقتان لقياس النجاح.','İyi bir plan: uygun tamamlayıcı çeşit, gerekçeli yer ve taşıyıcı, iki başarı kontrol yolu içerir.'],
'a6.1.q':['Thema und Zielgruppe (chủ đề và đối tượng) · Artikel (ít nhất 6, dạng Verbund) · Warenträger und Standort (kệ và vị trí – nhớ khu!) · Gestaltung (bài trí: ánh sáng, màu, trang trí, giác quan) · Cách kiểm tra kết quả (2 cách)','Thema und Zielgruppe (tema y grupo objetivo) · Artikel (mínimo 6, en Verbund) · Warenträger und Standort (soporte y lugar – ¡la zona!) · Gestaltung (luz, color, decoración, sentidos) · ¿Cómo comprobamos el éxito? (2 formas)','Thema und Zielgruppe (tema e público-alvo) · Artikel (mínimo 6, em Verbund) · Warenträger und Standort (suporte e local – a zona!) · Gestaltung (luz, cor, decoração, sentidos) · Como verificamos o êxito? (2 formas)','Thema und Zielgruppe (тема й цільова група) · Artikel (щонайменше 6, у Verbund) · Warenträger und Standort (стелаж і місце — зона!) · Gestaltung (світло, колір, декор, органи чуття) · Як перевіряємо успіх? (2 способи)','Thema und Zielgruppe (ጕዳይን ዕላማ ዓሚላትን) · Artikel (ብውሑዱ 6) · Warenträger und Standort (መእቀቢን ቦታን) · Gestaltung · ዓወት ከመይ ንፍትሽ? (2 መገድታት)','Thema und Zielgruppe (тема и целевая группа) · Artikel (минимум 6, в Verbund) · Warenträger und Standort (стеллаж и место — зона!) · Gestaltung (свет, цвет, декор, органы чувств) · Как проверим успех? (2 способа)','Thema und Zielgruppe (الموضوع والفئة) · Artikel (6 على الأقل، كـ Verbund) · Warenträger und Standort (الحامل والمكان – المنطقة!) · Gestaltung (ضوء، لون، ديكور، حواس) · كيف نقيس النجاح؟ (طريقتان)','Thema und Zielgruppe (konu ve hedef kitle) · Artikel (en az 6, Verbund olarak) · Warenträger und Standort (taşıyıcı ve yer – bölge!) · Gestaltung (ışık, renk, dekor, duyular) · Başarıyı nasıl ölçeriz? (2 yol)'],
'a7.t':['Chọn Warenträger trước. Rồi giải thích: Tại sao nó hợp với hàng?','Elige primero el Warenträger. Luego justifica: ¿por qué encaja con la mercancía?','Escolhe primeiro o Warenträger. Depois justifica: porque combina com a mercadoria?','Спершу обери Warenträger. Потім обґрунтуй: чому він пасує до товару?','ቀዳምነት Warenträger ምረጽ። ድሕሪኡ ኣረጋግጽ: ስለምንታይ ምስ ኣቕሓ ይሰማማዕ?','Сначала выбери Warenträger. Потом обоснуй: почему он подходит товару?','اختر Warenträger أولًا. ثم علّل: لماذا يناسب البضاعة؟','Önce Warenträger’ı seç. Sonra gerekçelendir: Neden mala uyuyor?'],
'a7.e':['Lý do tốt nêu hàng cần gì (bảo vệ, treo, số lượng) và Warenträger làm được gì.','Una buena justificación dice qué necesita la mercancía (protección, colgar, cantidad) y qué ofrece el Warenträger.','Uma boa justificação diz o que a mercadoria precisa (proteção, pendurar, quantidade) e o que o Warenträger oferece.','Добре обґрунтування вказує, що потрібно товару (захист, підвішування, кількість) і що дає Warenträger.','ጽቡቕ መረዳእታ እቲ ኣቕሓ እንታይ ከም ዘድልዮ (ክልእ፣ ምስቃል፣ ብዝሒ) ን Warenträger እንታይ ከም ዝህብ ይጥቅስ።','Хорошее обоснование указывает, что нужно товару (защита, подвешивание, количество) и что даёт Warenträger.','التعليل الجيد يذكر ما تحتاجه البضاعة (حماية، تعليق، كمية) وما يقدمه Warenträger.','İyi bir gerekçe malın neye ihtiyaç duyduğunu (koruma, asma, miktar) ve Warenträger’ın ne sağladığını söyler.'],
'a7.1.q':['7.1 Warenträger nào phù hợp? (mỗi cái 1 điểm)','7.1 ¿Qué Warenträger encaja? (1 punto cada uno)','7.1 Que Warenträger combina? (1 ponto cada)','7.1 Який Warenträger підходить? (по 1 балу)','7.1 ኣየናይ Warenträger ይሰማማዕ? (ነፍሲ ወከፍ 1 ነጥቢ)','7.1 Какой Warenträger подходит? (по 1 баллу)','7.1 أي Warenträger يناسب؟ (نقطة لكل واحد)','7.1 Hangi Warenträger uyar? (her biri 1 puan)'],
'a7.1b.q':['7.1 Giải thích tại sao từng Warenträger phù hợp! (mỗi cái 2 điểm)','7.1 ¡Justifique por qué encaja cada Warenträger! (2 puntos cada uno)','7.1 Justifique porque combina cada Warenträger! (2 pontos cada)','7.1 Обґрунтуйте, чому кожен Warenträger підходить! (по 2 бали)','7.1 ስለምንታይ ነፍሲ ወከፍ Warenträger ከም ዝሰማማዕ ኣረጋግጽ! (ነፍሲ ወከፍ 2 ነጥቢ)','7.1 Обоснуйте, почему каждый Warenträger подходит! (по 2 балла)','7.1 علّل لماذا يناسب كل Warenträger! (نقطتان لكل واحد)','7.1 Her Warenträger’ın neden uyduğunu gerekçelendir! (her biri 2 puan)'],
'a7.2.q':['7.2 Em phải trưng bày hàng cho một đợt khuyến mãi. Chọn một món hàng và một Warenträger phù hợp – khác 7.1 – và giải thích! (4 điểm: món hàng 1, Warenträger 1, lý do 2)','7.2 Debes presentar mercancía para una acción. Elige un artículo y un Warenträger adecuado, distinto al de 7.1, ¡y justifica! (4 puntos)','7.2 Deves apresentar mercadoria para uma ação. Escolhe um artigo e um Warenträger adequado, diferente do de 7.1, e justifica! (4 pontos)','7.2 Ви маєте розмістити товар для акції. Оберіть товар і відповідний Warenträger, інший ніж у 7.1, та обґрунтуйте! (4 бали)','7.2 ንሓደ ተግባር ኣቕሑት ከተቕርብ ኣለካ። ሓደ ኣቕሓን ዝግባእ Warenträger ን (ካብ 7.1 ዝፈልየ) ምረጽን ኣረጋግጽን! (4 ነጥቢ)','7.2 Вам нужно представить товар для акции. Выберите товар и подходящий Warenträger, отличный от 7.1, и обоснуйте! (4 балла)','7.2 عليك عرض بضاعة لحملة. اختر سلعة وWarenträger مناسبًا مختلفًا عن 7.1 وعلّل! (4 نقاط)','7.2 Bir kampanya için mal sunmalısın. Bir ürün ve 7.1’den farklı uygun bir Warenträger seç ve gerekçelendir! (4 puan)'],
'a8.t':['8.1: Người bán nhận miễn phí gì, phải nhường gì? 8.2: Loại hàng nào nhỏ và nhiều mẫu?','8.1: ¿Qué recibe gratis el comerciante y qué cede? 8.2: ¿Qué mercancías son pequeñas y numerosas?','8.1: O que recebe grátis o comerciante e o que cede? 8.2: Que mercadorias são pequenas e numerosas?','8.1: Що торговець отримує безкоштовно, що віддає? 8.2: Які товари дрібні й численні?','8.1: ነጋዳይ እንታይ ብነጻ ይረክብ፣ እንታይ ይሕደግ? 8.2: ኣየኖት ኣቕሑት ንኣሽቱን ብዙሓትን?','8.1: Что торговец получает бесплатно, что отдаёт? 8.2: Какие товары мелкие и многочисленные?','8.1: ماذا يحصل التاجر عليه مجانًا وماذا يتنازل عنه؟ 8.2: أي السلع صغيرة وكثيرة؟','8.1: Satıcı neyi bedava alır, neyi bırakır? 8.2: Hangi mallar küçük ve çok sayıdadır?'],
'a8.e':['Một nhận định tốt nêu ưu, nhược điểm và giải thích quyết định.','Un buen juicio nombra ventajas y desventajas y justifica la decisión.','Um bom juízo nomeia vantagens e desvantagens e justifica a decisão.','Хороша оцінка називає переваги й недоліки й обґрунтовує рішення.','ጽቡቕ ፍርዲ ረብሓታትን ጉድለታትን ይጥቅስን ውሳኔ የረጋግጽን።','Хорошая оценка называет плюсы и минусы и обосновывает решение.','الحكم الجيد يذكر المزايا والعيوب ويعلّل القرار.','İyi bir değerlendirme artıları ve eksileri söyler ve kararı gerekçelendirir.'],
'a8.1.q':['8.1 Nhiều Display do nhà sản xuất cung cấp miễn phí – kèm hàng của họ. Đánh giá lời đề nghị này từ góc nhìn của người bán (mỗi loại hai ưu và nhược điểm).','8.1 Muchos Display los da el fabricante gratis, con su mercancía. Valora esta oferta desde la perspectiva del comerciante (dos ventajas y dos desventajas).','8.1 Muitos Display são fornecidos gratuitamente pelo fabricante, com a sua mercadoria. Avalia esta oferta do ponto de vista do comerciante (duas vantagens e duas desvantagens).','8.1 Багато Display виробник надає безкоштовно — разом зі своїм товаром. Оціни цю пропозицію з погляду торговця (по дві переваги й недоліки).','8.1 ብዙሕ Display ኣምራቒ ብነጻ ይህብ — ምስ ኣቕሑቱ። እዚ ቅርቦት ካብ ኣረኣእያ ነጋዳይ ገምግም (ክልተ ረብሓታትን ክልተ ጉድለታትን)።','8.1 Многие Display производитель предоставляет бесплатно — вместе со своим товаром. Оцени это предложение с точки зрения торговца (по два плюса и минуса).','8.1 كثير من Display يوفّرها المصنّع مجانًا مع بضاعته. قيّم هذا العرض من منظور التاجر (ميزتان وعيبان).','8.1 Birçok Display’i üretici ücretsiz sağlar – kendi malıyla birlikte. Bu teklifi satıcı açısından değerlendir (ikişer artı ve eksi).'],
'a8.2.q':['8.2 Trong hệ thống Rackjobber, nhà bán buôn hoặc nhà sản xuất thuê một kệ trong cửa hàng và tự xếp hàng (Lehrbuch tr. 219). Giải thích hợp với loại hàng nào và người bán phải nhường gì.','8.2 En el sistema Rackjobber un mayorista o fabricante alquila un estante en la tienda y lo surte él mismo (Lehrbuch p. 219). Explica para qué mercancía sirve y qué cede el comerciante.','8.2 No sistema Rackjobber um grossista ou fabricante aluga uma prateleira na loja e abastece-a ele próprio (Lehrbuch p. 219). Explica para que mercadoria serve e o que cede o comerciante.','8.2 У системі Rackjobber оптовик або виробник орендує полицю в магазині й сам її наповнює (Lehrbuch с. 219). Поясни, для яких товарів це підходить і що віддає торговець.','8.2 ኣብ ስርዓት Rackjobber ሓደ ጅምላ ነጋዳይ ወይ ኣምራቒ ኣብ ድኳን መደርደሪ ይክራይ ባዕሉ ድማ የቕምጥ (Lehrbuch ገጽ 219)። ንኣየኖት ኣቕሑት ከም ዝግባእን ነጋዳይ እንታይ ከም ዝሕድግን ግለጽ።','8.2 В системе Rackjobber оптовик или производитель арендует полку в магазине и сам её заполняет (Lehrbuch с. 219). Объясни, для каких товаров это подходит и что отдаёт торговец.','8.2 في نظام Rackjobber يستأجر تاجر جملة أو مصنّع رفًّا في المتجر ويملؤه بنفسه (Lehrbuch ص. 219). اشرح لأي بضائع يصلح وماذا يتنازل التاجر.','8.2 Rackjobber sisteminde bir toptancı veya üretici mağazada bir raf kiralar ve kendisi doldurur (Lehrbuch s. 219). Hangi mallara uygun olduğunu ve satıcının neyi elden bıraktığını açıkla.'],
'v1.1.q':['V1 Tại sao „Äpfel neben Birnen“ (táo cạnh lê) là Warengruppenplatzierung chứ không phải Verbundplatzierung?','V1 ¿Por qué «Äpfel neben Birnen» (manzanas junto a peras) es una Warengruppenplatzierung y no una Verbundplatzierung?','V1 Porque é que «Äpfel neben Birnen» (maçãs ao lado de peras) é uma Warengruppenplatzierung e não uma Verbundplatzierung?','V1 Чому «Äpfel neben Birnen» (яблука біля груш) — це Warengruppenplatzierung, а не Verbundplatzierung?','V1 ስለምንታይ «Äpfel neben Birnen» Warengruppenplatzierung እዩ ንVerbundplatzierung ኣይኮነን?','V1 Почему «Äpfel neben Birnen» (яблоки рядом с грушами) — это Warengruppenplatzierung, а не Verbundplatzierung?','V1 لماذا «Äpfel neben Birnen» (تفاح بجانب كمثرى) هي Warengruppenplatzierung وليست Verbundplatzierung؟','V1 «Äpfel neben Birnen» (elma yanında armut) neden Warengruppenplatzierung’dur, Verbundplatzierung değil?'],

 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';

 return h}

 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});

 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';

 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));

 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;

 case 'sol':S.sol[id]=true;break;

 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;

 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});

 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
