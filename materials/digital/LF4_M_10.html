<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF 4 · Digitales Arbeitsblatt</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + .5rem) 1rem .4rem}
#bar .row{display:flex;align-items:center;gap:.6rem;max-width:56rem;margin:0 auto}
#bar .ttl{font-weight:700;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{height:.7rem;background:#e6e3da;border-radius:1rem;overflow:hidden;max-width:56rem;margin:.35rem auto 0}
#progf{height:100%;width:0;background:var(--pri);transition:width .4s}
#progt{font-size:.8rem;color:var(--mute);max-width:56rem;margin:.1rem auto 0}
#langs{display:flex;gap:.4rem;overflow-x:auto;max-width:56rem;margin:.35rem auto 0;padding-bottom:.15rem;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;min-height:44px;padding:0 .9rem;border:2px solid var(--line);background:#fff;border-radius:2rem;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;margin:0 0 1rem}
.card h2{font-size:1.25rem;margin:0 0 .4rem;line-height:1.3}
.card h2 .nr{display:inline-block;background:var(--pri);color:#fff;border-radius:.5rem;padding:0 .5rem;margin-right:.4rem;font-size:.95rem}
.vtag{display:inline-block;background:#6a3fa0;color:#fff;border-radius:.5rem;padding:0 .5rem;font-size:.85rem;margin-left:.3rem}
.card.v{border-color:#6a3fa0;background:#faf6ff}
.tr{font-size:.9rem;color:#4a5a66;background:#f1f6f9;border-left:4px solid #9cc3d5;border-radius:.4rem;padding:.3rem .6rem;margin:.3rem 0 .5rem;line-height:1.5}
.tr[dir=rtl]{border-left:0;border-right:4px solid #9cc3d5}
.tr[lang=ti]{font-family:"Kefa","Noto Sans Ethiopic",sans-serif}
.tr[lang=vi]{line-height:1.65}
small.b{display:block;font-size:.72rem;font-weight:400;opacity:.9;line-height:1.2}
.in{display:block;width:100%;min-height:48px;font:inherit;font-size:1rem;padding:.55rem .7rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink)}
input.in,select.in{font-size:1rem}
textarea.in{min-height:5.5rem;resize:vertical}
.btn{min-height:48px;padding:.4rem 1.1rem;border:0;border-radius:.8rem;background:var(--pri);color:#fff;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin:.3rem .4rem .3rem 0}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.gray{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.big{min-height:56px;font-size:1.1rem}
.btn:active,.pill:active,.opt:active,.ch:active{transform:scale(.97)}
.tipb{min-height:48px;min-width:48px;border-radius:2rem;border:2px solid var(--warn);background:var(--warnbg);font:inherit;font-size:1rem;cursor:pointer;padding:0 .9rem;float:right;margin:0 0 .3rem .5rem}
.tipbox{background:var(--warnbg);border:2px solid var(--warn);border-radius:.8rem;padding:.5rem .8rem;margin:.4rem 0}
.q{margin:.8rem 0 .2rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:.45rem;margin:.3rem 0}
.opt{min-height:48px;text-align:left;padding:.5rem .8rem;border:2px solid var(--line);background:#fff;border-radius:.8rem;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--pri);background:var(--pri2);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.tbl{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:1rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.4rem .3rem;text-align:left;vertical-align:middle}
.tbl.info th{background:#eef3f6}
.tbl.info td,.tbl.info th{border:1px solid var(--line);padding:.4rem .5rem}
.tbl td.c{text-align:center;white-space:nowrap}
.ch{min-width:48px;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:.7rem;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer;margin:2px}
.ch.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.sol{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
tr.rok td{background:var(--okbg)}tr.rno td{background:var(--badbg)}
.fb{border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0;font-size:1rem}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb.part{background:var(--warnbg);border:1px solid var(--warn)}
.sit{background:#eef3f6;border-left:5px solid var(--pri);border-radius:.5rem;padding:.5rem .8rem;margin:.5rem 0}
.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#23303a;color:#fff;padding:.6rem 1.1rem;border-radius:2rem;z-index:99;font-size:1rem;max-width:90%}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}
.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}
#set.open{display:block}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row2 label{font-weight:600;min-width:7rem}
.nowrap{white-space:nowrap}
#report{display:none}
@media (max-width:600px){main{padding-top:8.2rem}.card{padding:.8rem}h1{font-size:1.35rem}.tbl{font-size:.95rem}}
@media print{
 body{background:#fff;padding:0;font-size:11pt}
 #bar,#set,main,.toast,.dlg,.noprint{display:none!important}
 #report{display:block!important}
 #report h1{font-size:16pt}
 #report table{width:100%;border-collapse:collapse;font-size:10pt}
 #report td,#report th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

</style>
</head>

{k:'read',id:'r1',h:'Zum Nachlesen: Die Preisangabenverordnung (PAngV)',sum:'Auf das Preisschild gehören Gesamtpreis, Warenbezeichnung, Menge und Grundpreis. Der Grundpreis gilt je 1 kg oder 1 l.',
 paras:['Die [[Preisangabenverordnung]] (PAngV) sorgt dafür, dass Kunden Preise erkennen und vergleichen können – bevor sie kaufen. Sie gilt für alle Waren, die Kunden sichtbar angeboten werden: im Verkaufsraum, im Schaufenster, am Regal, im Katalog, im Onlineshop und in der Werbung mit Preisen.','Auf das Preisschild gehören: der [[Gesamtpreis]] (einschließlich Umsatzsteuer), die [[Warenbezeichnung]], die [[Menge]] und der [[Grundpreis]]. Das [[Pfand]] wird getrennt angegeben. Es gehört nicht zum Gesamtpreis und nicht in die Grundpreisrechnung.','Seit dem 28. Mai 2022 darf der Grundpreis nur noch je [[1 Kilogramm]] oder [[1 Liter]] angegeben werden. Die frühere Angabe „je 100 g“ oder „je 100 ml“ ist nicht mehr erlaubt.','Die Preise dürfen am Regal stehen (Regalauszeichnung). Jede einzelne Packung muss nicht ausgezeichnet sein. Das Schild muss eindeutig zur Ware gehören.','Der Preis am Regal stimmt nicht mit dem Kassenpreis überein? Das Preisschild ist kein verbindliches Angebot. Der [[Kaufvertrag]] entsteht erst an der Kasse. Der Kunde hat keinen Rechtsanspruch auf den Regalpreis. Falsche Preise sind aber eine Ordnungswidrigkeit. Darum: freundlich entschuldigen, meist aus Kulanz den niedrigeren Preis berechnen und das Schild sofort korrigieren.'],
 html:'<table class="tbl info"><tr><th>Angabe</th><th>Das bedeutet</th></tr><tr><td>Gesamtpreis</td><td>der Preis, den der Kunde zahlt – einschließlich Umsatzsteuer und sonstiger Preisbestandteile; unmissverständlich, klar erkennbar und gut lesbar</td></tr><tr><td>Warenbezeichnung</td><td>handelsübliche Bezeichnung der Ware (z. B. „Fruchtjoghurt Erdbeere“)</td></tr><tr><td>Menge</td><td>bei Fertigpackungen: Inhalt in g, kg, ml oder l</td></tr><tr><td>Grundpreis</td><td>bei Waren nach Gewicht, Volumen, Länge oder Fläche: Preis je 1 kg, 1 l, 1 m, 1 m² oder 1 m³ – in unmittelbarer Nähe des Gesamtpreises</td></tr><tr><td>Pfand</td><td>wird getrennt angegeben und gehört nicht zum Gesamtpreis und nicht in die Grundpreisrechnung</td></tr></table>',
 q:{q:'Wie darf der Grundpreis seit 2022 angegeben werden?',o:['je 1 kg oder 1 l','je 100 g oder 100 ml','je 250 g'],a:0}},

{k:'task',id:'a6',n:'Aufgabe 6',h:'Freie Übung: Falscher Preis – Rollenspiel oder Schulungsvideo (4 Leistungspunkte)',intro:'Herr Goos kauft im Baumarkt eine Bohrmaschine. Am Regal stand 139,99 €, an der Kasse wurden 149,99 € berechnet. Er merkt es erst nach dem Bezahlen. Der Geschäftsführer sagt: „Der Regalpreis muss nicht stimmen. Der Kunde muss beim Scannen aufpassen und sofort reklamieren.“ (Arbeitsheft S. 173) Im Unterricht spielt ihr ein Rollenspiel oder dreht ein kurzes Schulungsvideo. Beantworte hier die Fragen.',ik:'a6.i',tip:'Frage dich: Hat Herr Goos einen Rechtsanspruch auf den Regalpreis? Müssen Preise stimmen? Was tut ein kundenfreundlicher Händler?',ex:'Kein Anspruch auf den Regalpreis, aber Preise müssen stimmen (PAngV). Kundenfreundlich: Differenz aus Kulanz erstatten, Schild korrigieren.',items:[

 {t:'free',id:'a6.2',pts:2,q:'6.1 Stimmt die Aussage des Geschäftsführers? Begründe.',model:'Teilweise: Einen Anspruch auf den Regalpreis hat der Kunde nicht, der Kaufvertrag kam an der Kasse zum Kassenpreis zustande. Falsch ist aber „muss nicht stimmen“: Nach der PAngV müssen die Preise stimmen, sonst droht ein Bußgeld. Kundenfreundlich: Differenz aus Kulanz erstatten, Schild korrigieren.'},
 {t:'free',id:'a6.3',pts:1,q:'6.2 Schreibe eine freundliche, lösungsorientierte Kundenansprache in wörtlicher Rede.',model:'z. B. „Es tut mir leid, das Schild am Regal war falsch. Ich erstatte Ihnen die Differenz von 10 € gern zurück.“ (freundlich entschuldigen, aus Kulanz den niedrigeren Regalpreis berechnen)'},

'a2.h':['Hộp sữa chua nào rẻ hơn?','¿Qué yogur es más barato?','Que iogurte é mais barato?','Який йогурт дешевший?','ኣየናይ ዮጎርት ርካሽ እዩ?','Какой йогурт дешевле?','أي لبن أرخص؟','Hangi yoğurt daha ucuz?'],
'a2.i':['Trong tủ lạnh có hai hộp sữa chua cạnh nhau: Becher A 150 g giá 0,69 € – Becher B 500 g giá 1,99 €. Tính giá cho 1 kg. Viết kết quả bằng dấu phẩy.','En la nevera hay dos yogures: vaso A 150 g por 0,69 € – vaso B 500 g por 1,99 €. Calcula el precio por 1 kg. Escribe el resultado con coma.','No frigorífico há dois iogurtes lado a lado: copo A 150 g por 0,69 € – copo B 500 g por 1,99 €. Calcula o preço por 1 kg. Escreve o resultado com vírgula.','У холодильнику стоять два йогурти: стаканчик A 150 г за 0,69 € — стаканчик B 500 г за 1,99 €. Порахуй ціну за 1 кг. Пиши результат із комою.','ኣብ ዝሑል መደርደሪ ክልተ ዮጎርት ጎኒ ጎኒ ኣለዉ: ዋንጫ A 150 ግ ብ 0,69 € – ዋንጫ B 500 ግ ብ 1,99 €። ዋጋ ንሓደ ኪሎ ሕሰብ። ውጽኢት ብነጥቢ ጽሓፍ።','В холодильнике рядом два йогурта: стаканчик A 150 г за 0,69 € — стаканчик B 500 г за 1,99 €. Посчитай цену за 1 кг. Пиши результат с запятой.','في البراد لبنان جنبًا إلى جنب: كوب A 150 غ بـ 0,69 € – كوب B 500 غ بـ 1,99 €. احسب السعر لكل 1 كغ. اكتب النتيجة بالفاصلة.','Soğutucuda iki yoğurt yan yana: A kabı 150 g, 0,69 € – B kabı 500 g, 1,99 €. 1 kg fiyatını hesapla. Sonucu virgülle yaz.'],
'a2.t':['Đổi lượng sang kg trước: 150 g = 0,15 kg. Rồi lấy giá chia cho lượng.','Convierte primero la cantidad a kg: 150 g = 0,15 kg. Luego divide el precio entre la cantidad.','Converte primeiro a quantidade para kg: 150 g = 0,15 kg. Depois divide o preço pela quantidade.','Спершу переведи кількість у кг: 150 г = 0,15 кг. Потім розділи ціну на кількість.','ቀዳምነት ብዝሒ ናብ ኪሎ ቀይር: 150 ግ = 0,15 ኪሎ። ድሕሪኡ ዋጋ ብብዝሒ ኣካፍል።','Сначала переведи количество в кг: 150 г = 0,15 кг. Потом раздели цену на количество.','حوّل الكمية إلى كغ أولًا: 150 غ = 0,15 كغ. ثم اقسم السعر على الكمية.','Önce miktarı kg’a çevir: 150 g = 0,15 kg. Sonra fiyatı miktara böl.'],
'a2.e':['Giá ÷ lượng tính bằng kg = giá mỗi kg. Giá mỗi kg nhỏ hơn thì rẻ hơn.','Precio ÷ cantidad en kg = precio por kg. El precio por kg más bajo es más barato.','Preço ÷ quantidade em kg = preço por kg. O preço por kg mais baixo é mais barato.','Ціна ÷ кількість у кг = ціна за кг. Менша ціна за кг — дешевше.','ዋጋ ÷ ብዝሒ ብኪሎ = ዋጋ ንሓደ ኪሎ። ንእሽቶ ዋጋ ንኪሎ ርካሽ እዩ።','Цена ÷ количество в кг = цена за кг. Меньшая цена за кг — дешевле.','السعر ÷ الكمية بالكغ = السعر لكل كغ. السعر الأقل لكل كغ أرخص.','Fiyat ÷ kg cinsinden miktar = kg fiyatı. Daha düşük kg fiyatı daha ucuzdur.'],

'a2.4.q':['2.2 Thông tin nào trên nhãn giá giúp em khỏi phải tính?','2.2 ¿Qué indicación de la etiqueta te ahorra este cálculo?','2.2 Que indicação na etiqueta te poupa este cálculo?','2.2 Яке значення на цінику позбавляє тебе цього розрахунку?','2.2 ኣየናይ ሓበሬታ ኣብ ምልክት ዋጋ ነዚ ሕሳብ የድሕነካ?','2.2 Какое указание на ценнике избавляет тебя от этого расчёта?','2.2 أي بيان على بطاقة السعر يوفّر عليك هذا الحساب؟','2.2 Fiyat etiketindeki hangi bilgi sana bu hesabı kolaylaştırır?'],
'r1.h':['Đọc thêm: Preisangabenverordnung (PAngV)','Para leer: la Preisangabenverordnung (PAngV)','Para ler: a Preisangabenverordnung (PAngV)','Для читання: Preisangabenverordnung (PAngV)','ንምንባብ: Preisangabenverordnung (PAngV)','Для чтения: Preisangabenverordnung (PAngV)','للقراءة: Preisangabenverordnung (PAngV)','Okumak için: Preisangabenverordnung (PAngV)'],
'r1.s':['Nhãn giá cần có Gesamtpreis, tên hàng, lượng và Grundpreis. Grundpreis tính trên 1 kg hoặc 1 l.','La etiqueta necesita Gesamtpreis, denominación, cantidad y Grundpreis. El Grundpreis es por 1 kg o 1 l.','A etiqueta precisa de Gesamtpreis, designação, quantidade e Grundpreis. O Grundpreis é por 1 kg ou 1 l.','На цінику мають бути Gesamtpreis, назва, кількість і Grundpreis. Grundpreis — за 1 кг або 1 л.','ኣብ ምልክት ዋጋ Gesamtpreis፣ ስም ኣቕሓ፣ ብዝሒን Grundpreis ክህሉ ኣለዎ። Grundpreis ንሓደ ኪሎ ወይ ሊትሮ እዩ።','На ценнике должны быть Gesamtpreis, название, количество и Grundpreis. Grundpreis — за 1 кг или 1 л.','يجب أن تتضمن البطاقة Gesamtpreis والتسمية والكمية وGrundpreis. Grundpreis لكل 1 كغ أو 1 لتر.','Etikette Gesamtpreis, mal adı, miktar ve Grundpreis olmalı. Grundpreis 1 kg veya 1 l içindir.'],
'r1.qq':['Từ 2022, Grundpreis (giá cơ sở) được ghi thế nào?','¿Cómo puede indicarse el Grundpreis (precio base) desde 2022?','Como pode ser indicado o Grundpreis (preço base) desde 2022?','Як можна вказувати Grundpreis (базову ціну) з 2022 року?','ካብ 2022 Grundpreis ከመይ ክግለጽ ይኽእል?','Как можно указывать Grundpreis (базовую цену) с 2022 года?','كيف يمكن بيان Grundpreis (السعر الأساسي) منذ 2022؟','2022’den beri Grundpreis (birim fiyat) nasıl belirtilebilir?'],
'a3.i':['Đọc ba bước với ví dụ „250 g cà phê giá 4,49 €“. Rồi quyết định: đúng hay sai?','Lee los tres pasos con el ejemplo «250 g de café por 4,49 €». Luego decide: ¿verdadero o falso?','Lê os três passos com o exemplo «250 g de café por 4,49 €». Depois decide: verdadeiro ou falso?','Прочитай три кроки на прикладі «250 г кави за 4,49 €». Потім вирішуй: правда чи ні?','ሰለስተ ደረጃታት ብኣብነት «250 ግ ቡን ብ 4,49 €» ኣንብብ። ድሕሪኡ ወስን: ሓቂ ወይ ሓሶት?','Прочитай три шага на примере «250 г кофе за 4,49 €». Потом реши: верно или неверно?','اقرأ الخطوات الثلاث بمثال «250 غ قهوة بـ 4,49 €». ثم قرّر: صحيح أم خطأ؟','«250 g kahve 4,49 €» örneğiyle üç adımı oku. Sonra karar ver: doğru mu yanlış mı?'],
'a3.t':['Bước 1: đổi lượng sang kg hoặc l. Bước 2: lấy giá chia cho lượng. Bước 3: làm tròn đến xu.','Paso 1: convertir la cantidad a kg o l. Paso 2: dividir el precio entre la cantidad. Paso 3: redondear a céntimos.','Passo 1: converter a quantidade para kg ou l. Passo 2: dividir o preço pela quantidade. Passo 3: arredondar a cêntimos.','Крок 1: перевести кількість у кг або л. Крок 2: розділити ціну на кількість. Крок 3: округлити до центів.','ደረጃ 1: ብዝሒ ናብ ኪሎ ወይ ሊትሮ ቀይር። ደረጃ 2: ዋጋ ብብዝሒ ኣካፍል። ደረጃ 3: ናብ ሳንቲም ዕብዓብ።','Шаг 1: перевести количество в кг или л. Шаг 2: разделить цену на количество. Шаг 3: округлить до центов.','الخطوة 1: حوّل الكمية إلى كغ أو لتر. الخطوة 2: اقسم السعر على الكمية. الخطوة 3: قرّب إلى السنت.','Adım 1: Miktarı kg veya l’ye çevir. Adım 2: Fiyatı miktara böl. Adım 3: Kuruşa yuvarla.'],
'a3.e':['250 g = 0,25 kg. Rồi 4,49 € : 0,25 kg = 17,96 € mỗi 1 kg.','250 g = 0,25 kg. Luego 4,49 € : 0,25 kg = 17,96 € por 1 kg.','250 g = 0,25 kg. Depois 4,49 € : 0,25 kg = 17,96 € por 1 kg.','250 г = 0,25 кг. Потім 4,49 € : 0,25 кг = 17,96 € за 1 кг.','250 ግ = 0,25 ኪሎ። ድሕሪኡ 4,49 € : 0,25 ኪሎ = 17,96 € ንሓደ ኪሎ።','250 г = 0,25 кг. Затем 4,49 € : 0,25 кг = 17,96 € за 1 кг.','250 غ = 0,25 كغ. ثم 4,49 € : 0,25 كغ = 17,96 € لكل 1 كغ.','250 g = 0,25 kg. Sonra 4,49 € : 0,25 kg = 1 kg için 17,96 €.'],
'a4.h':['Bài tập có hướng dẫn: Grundpreis (giá cơ sở)','Ejercicio guiado: Grundpreise (precios base)','Exercício guiado: Grundpreise (preços base)','Керована вправа: Grundpreise (базові ціни)','ምምሕዳር ልምምድ: Grundpreise','Упражнение с подсказкой: Grundpreise (базовые цены)','تمرين موجَّه: Grundpreise (الأسعار الأساسية)','Rehberli alıştırma: Grundpreise (birim fiyatlar)'],
'a4.i':['Tính Grundpreis cho 1 kg hoặc 1 l. Làm tròn đến xu. Viết kết quả bằng dấu phẩy.','Calcula el Grundpreis por 1 kg o 1 l. Redondea a céntimos. Escribe el resultado con coma.','Calcula o Grundpreis por 1 kg ou 1 l. Arredonda a cêntimos. Escreve o resultado com vírgula.','Порахуй Grundpreis за 1 кг або 1 л. Округли до центів. Пиши результат із комою.','Grundpreis ንሓደ ኪሎ ወይ ሊትሮ ሕሰብ። ናብ ሳንቲም ዕብዓብ። ውጽኢት ብነጥቢ ጽሓፍ።','Рассчитай Grundpreis за 1 кг или 1 л. Округли до центов. Пиши результат с запятой.','احسب Grundpreis لكل 1 كغ أو 1 لتر. قرّب إلى السنت. اكتب النتيجة بالفاصلة.','1 kg veya 1 l için Grundpreis hesapla. Kuruşa yuvarla. Sonucu virgülle yaz.'],
'a4.t':['Đổi lượng sang kg hoặc l trước, rồi mới chia. Đừng tính Pfand (tiền cọc vỏ chai).','Convierte primero la cantidad a kg o l y luego divide. No cuentes el Pfand (depósito).','Converte primeiro a quantidade para kg ou l e depois divide. Não contes o Pfand (depósito).','Спершу переведи кількість у кг або л, потім дій. Pfand (заставу) не враховуй.','ቀዳምነት ብዝሒ ናብ ኪሎ ወይ ሊትሮ ቀይር ድሕሪኡ ኣካፍል። Pfand ኣይትሕሰብ።','Сначала переведи количество в кг или л, потом дели. Pfand (залог) не учитывай.','حوّل الكمية إلى كغ أو لتر أولًا ثم اقسم. لا تحسب Pfand (التأمين).','Önce miktarı kg veya l’ye çevir, sonra böl. Pfand’ı (depozito) hesaba katma.'],
'a4.e':['Grundpreis = Gesamtpreis : lượng tính bằng kg hoặc l. Làm tròn đến xu. Không tính Pfand.','Grundpreis = Gesamtpreis : cantidad en kg o l. Redondear a céntimos. No contar el Pfand.','Grundpreis = Gesamtpreis : quantidade em kg ou l. Arredondar a cêntimos. Não contar o Pfand.','Grundpreis = Gesamtpreis : кількість у кг або л. Округлити до центів. Pfand не враховувати.','Grundpreis = Gesamtpreis : ብዝሒ ብኪሎ ወይ ሊትሮ። ናብ ሳንቲም ዕብዓብ። Pfand ኣይትሕሰብ።','Grundpreis = Gesamtpreis : количество в кг или л. Округлить до центов. Pfand не учитывать.','Grundpreis = Gesamtpreis : الكمية بالكغ أو اللتر. التقريب إلى السنت. لا يُحتسب Pfand.','Grundpreis = Gesamtpreis : kg veya l cinsinden miktar. Kuruşa yuvarla. Pfand sayılmaz.'],
'a4.1.w':['Em chưa đổi lượng sang kg. 250 g = 0,25 kg.','No has convertido la cantidad a kg. 250 g = 0,25 kg.','Não converteste a quantidade para kg. 250 g = 0,25 kg.','Ти не перевів(ла) кількість у кг. 250 г = 0,25 кг.','ብዝሒ ናብ ኪሎ ኣይቀየርካን። 250 ግ = 0,25 ኪሎ።','Ты не перевёл(а) количество в кг. 250 г = 0,25 кг.','لم تحوّل الكمية إلى كغ. 250 غ = 0,25 كغ.','Miktarı kg’a çevirmedin. 250 g = 0,25 kg.'],
'a4.3.w':['Em đã tính cả Pfand. Pfand không thuộc phép tính Grundpreis.','Has contado el Pfand. El Pfand no entra en el cálculo del Grundpreis.','Contaste o Pfand. O Pfand não entra no cálculo do Grundpreis.','Ти врахував(ла) Pfand. Pfand не входить до розрахунку Grundpreis.','Pfand ሓሲብካ። Pfand ኣብ ሕሳብ Grundpreis ኣይኣቱን።','Ты учёл(а) Pfand. Pfand не входит в расчёт Grundpreis.','لقد احتسبت Pfand. Pfand لا يدخل في حساب Grundpreis.','Pfand’ı da hesaba kattın. Pfand, Grundpreis hesabına girmez.'],
'a5.h':['Bài tập có hướng dẫn: Kiểm tra một nhãn giá','Ejercicio guiado: comprobar una etiqueta de precio','Exercício guiado: verificar uma etiqueta de preço','Керована вправа: перевір цінник','ምምሕዳር ልምምድ: ምልክት ዋጋ ምፍታሽ','Упражнение с подсказкой: проверь ценник','تمرين موجَّه: فحص بطاقة سعر','Rehberli alıştırma: Fiyat etiketini kontrol et'],
'a5.i':['Trên nhãn giá chỉ ghi: „Bio-Heidelbeerjoghurt 0,89“ (không có thông tin khác). Hộp chứa 150 g.','En la etiqueta solo pone: «Bio-Heidelbeerjoghurt 0,89» (sin más datos). El vaso contiene 150 g.','Na etiqueta só diz: «Bio-Heidelbeerjoghurt 0,89» (sem mais indicações). O copo contém 150 g.','На цінику лише: «Bio-Heidelbeerjoghurt 0,89» (без інших даних). У стаканчику 150 г.','ኣብ ምልክት ዋጋ «Bio-Heidelbeerjoghurt 0,89» ጥራይ ተጻሒፉ (ካልእ ሓበሬታ የለን)። እቲ ዋንጫ 150 ግ ኣለዎ።','На ценнике только: «Bio-Heidelbeerjoghurt 0,89» (без других данных). В стаканчике 150 г.','على البطاقة فقط: «Bio-Heidelbeerjoghurt 0,89» (بلا بيانات أخرى). الكوب يحتوي 150 غ.','Etikette yalnızca «Bio-Heidelbeerjoghurt 0,89» yazıyor (başka bilgi yok). Kapta 150 g var.'],
'a5.t':['So với bảng ở phần đọc thêm: Cái gì đã có? Cái gì còn thiếu?','Compara con la tabla de la lectura: ¿qué hay ya? ¿Qué falta?','Compara com a tabela da leitura: o que já há? O que falta?','Порівняй із таблицею в тексті: що вже є? Чого бракує?','ምስ ሰንጠረዥ ኣብ ምንባብ ኣነጻጽር: እንታይ ኣሎ? እንታይ ይጎድል?','Сравни с таблицей в тексте: что уже есть? Чего не хватает?','قارن مع الجدول في القراءة: ما الموجود؟ وما الناقص؟','Okuma bölümündeki tabloyla karşılaştır: Neler var? Neler eksik?'],
'a5.e':['Còn thiếu lượng và Grundpreis. Đơn vị tiền (€) cũng thuộc Gesamtpreis.','Faltan cantidad y Grundpreis. La moneda (€) también forma parte del Gesamtpreis.','Faltam a quantidade e o Grundpreis. A moeda (€) também faz parte do Gesamtpreis.','Бракує кількості й Grundpreis. Валюта (€) теж є частиною Gesamtpreis.','ብዝሒን Grundpreis ን ይጎድሉ። ገንዘብ (€) እውን ክፋል Gesamtpreis እዩ።','Не хватает количества и Grundpreis. Валюта (€) тоже часть Gesamtpreis.','تنقص الكمية وGrundpreis. العملة (€) جزء من Gesamtpreis أيضًا.','Miktar ve Grundpreis eksik. Para birimi (€) de Gesamtpreis’in parçasıdır.'],
'a5.1.q':['5.1 Thiếu những thông tin bắt buộc nào? (Arbeitsheft tr. 174, Aufgabe 3)','5.1 ¿Qué indicaciones obligatorias faltan? (Arbeitsheft p. 174, Aufgabe 3)','5.1 Que indicações obrigatórias faltam? (Arbeitsheft p. 174, Aufgabe 3)','5.1 Яких обов’язкових даних бракує? (Arbeitsheft с. 174, Aufgabe 3)','5.1 እንታይ ግዱድ ሓበሬታ ይጎድል? (Arbeitsheft ገጽ 174, Aufgabe 3)','5.1 Каких обязательных данных не хватает? (Arbeitsheft с. 174, Aufgabe 3)','5.1 ما البيانات الإلزامية الناقصة؟ (Arbeitsheft ص. 174, Aufgabe 3)','5.1 Hangi zorunlu bilgiler eksik? (Arbeitsheft s. 174, Aufgabe 3)'],

'a6.h':['Bài tập tự do: Sai giá – đóng vai hoặc video đào tạo (4 điểm)','Ejercicio libre: precio erróneo – juego de roles o vídeo de formación (4 puntos)','Exercício livre: preço errado – jogo de papéis ou vídeo de formação (4 pontos)','Вільна вправа: неправильна ціна — рольова гра або навчальне відео (4 бали)','ናጻ ልምምድ: ጌጋ ዋጋ – ተግባራዊ ጻወታ ወይ ቪድዮ ስልጠና (4 ነጥቢ)','Свободное упражнение: неверная цена — ролевая игра или обучающее видео (4 балла)','تمرين حر: سعر خاطئ – لعب أدوار أو فيديو تدريبي (4 نقاط)','Serbest alıştırma: Yanlış fiyat – rol oyunu veya eğitim videosu (4 puan)'],
'a6.i':['Anh Goos mua một máy khoan ở cửa hàng vật liệu xây dựng. Giá trên kệ là 139,99 €, ở quầy tính 149,99 €. Anh chỉ nhận ra sau khi trả tiền. Giám đốc nói: „Giá trên kệ không nhất thiết phải đúng. Khách phải chú ý khi quét và khiếu nại ngay.“ (Arbeitsheft tr. 173) Trong giờ học các em đóng vai hoặc quay video đào tạo ngắn. Hãy trả lời các câu hỏi ở đây.','El Sr. Goos compra un taladro en la ferretería. En el estante ponía 139,99 €, en caja le cobraron 149,99 €. Lo nota después de pagar. El gerente dice: «El precio del estante no tiene por qué ser correcto. El cliente debe fijarse al escanear y reclamar enseguida.» (Arbeitsheft p. 173) En clase hacéis un juego de roles o un vídeo de formación. Responde aquí las preguntas.','O Sr. Goos compra um berbequim na loja de bricolage. Na prateleira estava 139,99 €, na caixa cobraram 149,99 €. Só repara depois de pagar. O gerente diz: «O preço da prateleira não tem de estar certo. O cliente deve ter atenção ao passar e reclamar logo.» (Arbeitsheft p. 173) Na aula fazem um jogo de papéis ou um vídeo de formação. Responde aqui às perguntas.','Пан Goos купує дриль у будівельному магазині. На полиці було 139,99 €, на касі — 149,99 €. Він помічає це лише після оплати. Керівник каже: «Ціна на полиці не мусить бути правильною. Клієнт має стежити під час сканування й одразу скаржитися.» (Arbeitsheft с. 173) На уроці ви граєте рольову гру або знімаєте навчальне відео. Відповідай тут на запитання.','ኣቶ Goos ኣብ ድኳን ኣቕሑት ሕንጻ ሓደ መሰርሒ ይገዝእ። ኣብ መደርደሪ 139,99 € ነይሩ፣ ኣብ ካሳ 149,99 € ተሓሲቡ። ድሕሪ ክፍሊት ጥራይ ይርእዮ። ሓላፊ «ዋጋ መደርደሪ ቅኑዕ ክኸውን የብሉን፣ ዓሚል ኣብ ምስካን ክጥንቀቕ ብቕልጡፍ ከኣ ክነቕፍ ኣለዎ» ይብል። (Arbeitsheft ገጽ 173) ኣብ ትምህርቲ ተግባራዊ ጻወታ ወይ ቪድዮ ስልጠና ትገብሩ። ኣብዚ ንሕቶታት መልስ።','Господин Goos покупает дрель в строительном магазине. На полке было 139,99 €, на кассе — 149,99 €. Он замечает это только после оплаты. Управляющий говорит: «Цена на полке не обязана быть верной. Клиент должен смотреть при сканировании и сразу жаловаться.» (Arbeitsheft с. 173) На уроке вы играете ролевую игру или снимаете обучающее видео. Отвечай здесь на вопросы.','السيد Goos يشتري مثقابًا من متجر مواد البناء. على الرف 139,99 € وعلى الصندوق حُسب 149,99 €. لم يلاحظ إلا بعد الدفع. قال المدير: «سعر الرف لا يجب أن يكون صحيحًا. على الزبون الانتباه عند المسح والاعتراض فورًا.» (Arbeitsheft ص. 173) في الحصة تؤدّون لعب أدوار أو تصوّرون فيديو تدريبيًّا. أجب هنا عن الأسئلة.','Bay Goos yapı marketten bir matkap alıyor. Rafta 139,99 €, kasada 149,99 € hesaplandı. Bunu ödemeden sonra fark ediyor. Müdür diyor ki: «Raf fiyatının doğru olması gerekmez. Müşteri taramada dikkat etmeli ve hemen itiraz etmeli.» (Arbeitsheft s. 173) Derste rol oyunu oynar veya kısa bir eğitim videosu çekersiniz. Soruları burada cevapla.'],
'a6.t':['Tự hỏi: Anh Goos có quyền đòi giá trên kệ không? Giá có phải đúng không? Người bán thân thiện làm gì?','Pregúntate: ¿tiene el Sr. Goos derecho al precio del estante? ¿Deben ser correctos los precios? ¿Qué hace un comerciante amable?','Pergunta-te: o Sr. Goos tem direito ao preço da prateleira? Os preços têm de estar certos? O que faz um comerciante amigo do cliente?','Запитай себе: чи має пан Goos право на ціну з полиці? Чи ціни мають бути правильними? Що робить привітний торговець?','ባዕልኻ ሕተት: ኣቶ Goos መሰል ዋጋ መደርደሪ ኣለዎ ዶ? ዋጋታት ቅኑዕ ክኾኑ ኣለዎም ዶ? ሕያዋይ ነጋዳይ እንታይ ይገብር?','Спроси себя: есть ли у господина Goos право на цену с полки? Должны ли цены быть верными? Что делает дружелюбный торговец?','اسأل نفسك: هل للسيد Goos حق في سعر الرف؟ هل يجب أن تكون الأسعار صحيحة؟ ماذا يفعل التاجر الودود؟','Kendine sor: Bay Goos’un raf fiyatı üzerinde hakkı var mı? Fiyatlar doğru olmak zorunda mı? Müşteri dostu bir satıcı ne yapar?'],
'a6.e':['Không có quyền đòi giá kệ, nhưng giá phải đúng (PAngV). Thân thiện: hoàn lại chênh lệch vì thiện chí, sửa nhãn.','Sin derecho al precio del estante, pero los precios deben ser correctos (PAngV). Amable: devolver la diferencia por cortesía y corregir la etiqueta.','Sem direito ao preço da prateleira, mas os preços têm de estar certos (PAngV). Amigo do cliente: devolver a diferença por cortesia e corrigir a etiqueta.','Права на ціну з полиці немає, але ціни мають бути правильні (PAngV). Привітно: повернути різницю з доброї волі, виправити цінник.','መሰል ዋጋ መደርደሪ የለን፣ ግን ዋጋታት ቅኑዕ ክኾኑ ኣለዎም (PAngV)። ሕያዋይ: ፍልልይ ብኽብረት ምምላስ፣ ምልክት ምእራም።','Права на цену с полки нет, но цены должны быть верными (PAngV). Дружелюбно: вернуть разницу из любезности, исправить ценник.','لا حق في سعر الرف، لكن يجب أن تكون الأسعار صحيحة (PAngV). بودّ: إرجاع الفرق من باب المجاملة وتصحيح البطاقة.','Raf fiyatı hakkı yok, ama fiyatlar doğru olmalı (PAngV). Müşteri dostu: farkı nezaketen iade et, etiketi düzelt.'],
'a6.1.q':['Chênh lệch giữa giá ở quầy và giá trên kệ là bao nhiêu euro?','¿Cuántos euros es la diferencia entre el precio de caja y el del estante?','Quantos euros é a diferença entre o preço da caixa e o da prateleira?','Скільки євро становить різниця між ціною на касі й на полиці?','ፍልልይ ዋጋ ካሳን ዋጋ መደርደሪን ክንደይ ዩሮ እዩ?','Сколько евро составляет разница между ценой на кассе и на полке?','كم يورو الفرق بين سعر الصندوق وسعر الرف؟','Kasa fiyatı ile raf fiyatı arasındaki fark kaç euro?'],
'a6.2.q':['6.1 Lời của giám đốc có đúng không? Giải thích.','6.1 ¿Es correcta la afirmación del gerente? Justifica.','6.1 A afirmação do gerente está certa? Justifica.','6.1 Чи правильне твердження керівника? Обґрунтуй.','6.1 ዘረባ ሓላፊ ቅኑዕ ድዩ? ኣረጋግጽ።','6.1 Верно ли утверждение управляющего? Обоснуй.','6.1 هل كلام المدير صحيح؟ علّل.','6.1 Müdürün sözü doğru mu? Gerekçelendir.'],
'a6.3.q':['6.2 Viết một lời nói thân thiện, hướng đến giải pháp với khách (lời nói trực tiếp).','6.2 Escribe un saludo amable y orientado a soluciones para el cliente en estilo directo.','6.2 Escreve uma abordagem amável e orientada a soluções para o cliente em discurso direto.','6.2 Напиши привітне, спрямоване на рішення звернення до клієнта прямою мовою.','6.2 ንዓሚል ሕያዋይን ፍታሕ ዘምጽእን ዘረባ ብቀጥታዊ ዘረባ ጽሓፍ።','6.2 Напиши дружелюбное, ориентированное на решение обращение к клиенту прямой речью.','6.2 اكتب عبارة ودية موجهة للحل للزبون بالكلام المباشر.','6.2 Müşteriye dostça, çözüm odaklı bir cümleyi doğrudan konuşma olarak yaz.'],
'a6.4.q':['6.3 Nêu một biện pháp chống nhãn giá sai.','6.3 Nombra una medida contra etiquetas erróneas.','6.3 Nomeia uma medida contra etiquetas erradas.','6.3 Назви один захід проти неправильних цінників.','6.3 ሓደ ተግባር ኣብ ልዕሊ ጌጋ ምልክታት ዋጋ ጥቀስ።','6.3 Назови одну меру против неверных ценников.','6.3 اذكر إجراءً واحدًا ضد بطاقات الأسعار الخاطئة.','6.3 Yanlış etiketlere karşı bir önlem say.'],
'a7.t':['Beurteilen/Entscheiden (đánh giá/quyết định) = Có hoặc Không VÀ một lý do. Nhớ: Regalauszeichnung được phép, khách không có quyền pháp lý.','Beurteilen/Entscheiden (valorar/decidir) = Sí o No Y un motivo. Recuerda: Regalauszeichnung permitida, el cliente no tiene derecho legal.','Beurteilen/Entscheiden (avaliar/decidir) = Sim ou Não E um motivo. Lembra: Regalauszeichnung permitida, o cliente não tem direito legal.','Beurteilen/Entscheiden (оцінити/вирішити) = Так або Ні І причина. Пам’ятай: Regalauszeichnung дозволене, клієнт не має юридичного права.','Beurteilen/Entscheiden = እወ ወይ ኣይፋል ከምኡውን ምኽንያት። ዘክር: Regalauszeichnung ተፈቒዱ፣ ዓሚል ሕጋዊ መሰል የብሉን።','Beurteilen/Entscheiden (оценить/решить) = Да или Нет И причина. Помни: Regalauszeichnung разрешена, у клиента нет юридического права.','Beurteilen/Entscheiden (قيّم/قرّر) = نعم أو لا مع سبب. تذكّر: Regalauszeichnung مسموح، والزبون ليس له حق قانوني.','Beurteilen/Entscheiden (değerlendir/karar ver) = Evet veya Hayır VE bir neden. Hatırla: Regalauszeichnung serbest, müşterinin yasal hakkı yok.'],
'a7.e':['Với „Entscheiden und begründen“ có điểm cho quyết định và cho lý do.','En «Entscheiden und begründen» hay puntos por la decisión y por el motivo.','Em «Entscheiden und begründen» há pontos pela decisão e pelo motivo.','За «Entscheiden und begründen» є бали за рішення й за причину.','ኣብ «Entscheiden und begründen» ንውሳኔን ንምኽንያትን ነጥቢ ኣሎ።','За «Entscheiden und begründen» есть баллы за решение и за причину.','في «Entscheiden und begründen» هناك نقاط للقرار وللسبب.','«Entscheiden und begründen»’de karar ve gerekçe için puan verilir.'],
'a7.1.q':['7.1 Ở quầy thu ngân, khách thấy giá trên kệ khác giá của Warenwirtschaftssystem (hệ thống quản lý hàng hóa). Đánh giá tình huống pháp lý! (2 điểm)','7.1 En caja una clienta nota que el precio del estante no coincide con el del Warenwirtschaftssystem (sistema de gestión de mercancías). ¡Valore la situación legal! (2 puntos)','7.1 Na caixa uma cliente nota que o preço da prateleira não coincide com o do Warenwirtschaftssystem (sistema de gestão de mercadorias). Avalie a situação legal! (2 pontos)','7.1 На касі клієнтка помічає, що ціна на полиці не збігається з ціною в Warenwirtschaftssystem (системі обліку товарів). Оцініть правову ситуацію! (2 бали)','7.1 ኣብ ካሳ ሓንቲ ዓሚል ዋጋ መደርደሪ ምስ Warenwirtschaftssystem ከም ዘይሰማማዕ ትርኢ። ሕጋዊ ኩነታት ገምግም! (2 ነጥቢ)','7.1 На кассе клиентка замечает, что цена на полке не совпадает с ценой в Warenwirtschaftssystem (системе учёта товаров). Оцените правовую ситуацию! (2 балла)','7.1 عند الصندوق تلاحظ زبونة أن سعر الرف لا يطابق سعر Warenwirtschaftssystem (نظام إدارة البضائع). قيّم الوضع القانوني! (نقطتان)','7.1 Kasada bir müşteri raf fiyatının Warenwirtschaftssystem (mal yönetim sistemi) fiyatıyla uyuşmadığını fark ediyor. Hukuki durumu değerlendir! (2 puan)'],
'a7.2.q':['7.2 In nhãn giá cho hàng mới. Preisangabenverordnung yêu cầu 2 thông tin nào? Hãy nêu! (2 điểm)','7.2 Se imprimen etiquetas para artículos nuevos. ¿Qué 2 indicaciones exige la Preisangabenverordnung? ¡Nómbrelas! (2 puntos)','7.2 Imprimem-se etiquetas para artigos novos. Que 2 indicações exige a Preisangabenverordnung? Nomeie-as! (2 pontos)','7.2 Для нових товарів друкують цінники. Які 2 дані вимагає Preisangabenverordnung? Назвіть їх! (2 бали)','7.2 ንሓደስቲ ኣቕሑት ምልክታት ዋጋ ይሕተሙ። Preisangabenverordnung ኣየኖት 2 ሓበሬታታት ትደሊ? ጥቀሶም! (2 ነጥቢ)','7.2 Для новых товаров печатают ценники. Какие 2 данных требует Preisangabenverordnung? Назовите их! (2 балла)','7.2 تُطبع بطاقات أسعار لسلع جديدة. ما البيانان اللذان تطلبهما Preisangabenverordnung؟ اذكرهما! (نقطتان)','7.2 Yeni ürünler için fiyat etiketleri basılıyor. Preisangabenverordnung hangi 2 bilgiyi ister? Say! (2 puan)'],
'a7.3.q':['7.3 Trên bao bì không dán nhãn giá, nhãn giá chỉ treo ở kệ. Cách niêm yết này có hợp pháp không? Quyết định và giải thích! (3 điểm)','7.3 En el envase no hay etiqueta, los precios solo cuelgan del estante. ¿Es lícita esta forma de etiquetado? ¡Decida y justifique! (3 puntos)','7.3 Na embalagem não há etiqueta, os preços estão só na prateleira. Esta forma de marcação é lícita? Decida e justifique! (3 pontos)','7.3 На упаковці немає цінника, цінники висять лише на полиці. Чи дозволене таке маркування? Вирішіть і обґрунтуйте! (3 бали)','7.3 ኣብ ዓቕሚ ምልክት ዋጋ የለን፣ ምልክታት ኣብ መደርደሪ ጥራይ ተሰቒሎም። እዚ ኣገባብ ሕጋዊ ድዩ? ወስንን ኣረጋግጽን! (3 ነጥቢ)','7.3 На упаковке нет ценника, ценники висят только на полке. Допустимо ли такое маркирование? Решите и обоснуйте! (3 балла)','7.3 لا توجد بطاقة سعر على العبوة، وبطاقات الأسعار معلّقة على الرف فقط. هل هذا الوسم جائز قانونًا؟ قرّر وعلّل! (3 نقاط)','7.3 Ambalajda etiket yok, fiyat etiketleri yalnızca rafta asılı. Bu fiyat etiketleme hukuken uygun mu? Karar ver ve gerekçelendir! (3 puan)'],
'a7.4.q':['7.4 Ở Warenhaus Seeblick GmbH hầu hết hàng được niêm yết giá ở kệ. Cách này có hợp pháp không? Quyết định và giải thích! (2 điểm)','7.4 En el Warenhaus Seeblick GmbH la mayoría de artículos se etiquetan en el estante. ¿Es lícita esta forma? ¡Decida y justifique! (2 puntos)','7.4 No Warenhaus Seeblick GmbH a maioria dos artigos é marcada na prateleira. Esta forma é lícita? Decida e justifique! (2 pontos)','7.4 У Warenhaus Seeblick GmbH більшість товарів маркують на полиці. Чи це дозволено? Вирішіть і обґрунтуйте! (2 бали)','7.4 ኣብ Warenhaus Seeblick GmbH መብዛሕትኦም ኣቕሑት ኣብ መደርደሪ ይምልከቱ። እዚ ኣገባብ ሕጋዊ ድዩ? ወስንን ኣረጋግጽን! (2 ነጥቢ)','7.4 В Warenhaus Seeblick GmbH большинство товаров маркируют на полке. Допустима ли такая форма? Решите и обоснуйте! (2 балла)','7.4 في Warenhaus Seeblick GmbH تُسعَّر معظم السلع على الرف. هل هذا الشكل جائز قانونًا؟ قرّر وعلّل! (نقطتان)','7.4 Warenhaus Seeblick GmbH’de ürünlerin çoğu rafta fiyatlandırılıyor. Bu biçim hukuken uygun mu? Karar ver ve gerekçelendir! (2 puan)'],
'a7.5.q':['7.5 Cho đợt khuyến mãi, người ta in nhãn giá. Phải tuân theo quy định pháp lý nào? (1 điểm)','7.5 Para una acción publicitaria se imprimen etiquetas. ¿Qué norma legal debe respetar? (1 punto)','7.5 Para uma ação publicitária imprimem-se etiquetas. Que norma legal deve respeitar? (1 ponto)','7.5 Для рекламної акції друкують цінники. Яке правове положення слід дотримуватися? (1 бал)','7.5 ንሓደ ተግባር መወከሲ ምልክታት ዋጋ ይሕተሙ። ኣየናይ ሕጋዊ ደንቢ ክትከተል ኣለካ? (1 ነጥቢ)','7.5 Для рекламной акции печатают ценники. Какое правовое положение нужно соблюдать? (1 балл)','7.5 تُطبع بطاقات أسعار لحملة إعلانية. أي قاعدة قانونية يجب مراعاتها؟ (نقطة)','7.5 Bir reklam kampanyası için fiyat etiketleri basılıyor. Hangi yasal düzenlemeye uymalısın? (1 puan)'],
'a8.t':['8.1: Người bán có thể làm gì trước „giảm giá“? 8.2: Nhìn lợi ích cho người bán và khách – và lòng tin.','8.1: ¿Qué podría hacer un comerciante antes de un «descuento»? 8.2: Mira ventajas para comerciante y clientes, y la confianza.','8.1: O que poderia fazer um comerciante antes de um «desconto»? 8.2: Olha para as vantagens para comerciante e clientes, e a confiança.','8.1: Що міг би зробити торговець перед «знижкою»? 8.2: Подивись на переваги для торговця й клієнтів — і на довіру.','8.1: ነጋዳይ ቅድሚ «ቅናሽ» እንታይ ክገብር ይኽእል? 8.2: ረብሓታት ንነጋዳይን ዓሚላትን ከምኡውን እምነት ርአ።','8.1: Что может сделать торговец перед «скидкой»? 8.2: Посмотри на преимущества для торговца и клиентов — и на доверие.','8.1: ماذا يمكن للتاجر أن يفعل قبل «التخفيض»؟ 8.2: انظر إلى المزايا للتاجر والزبائن – وإلى الثقة.','8.1: Satıcı bir «indirimden» önce ne yapabilir? 8.2: Satıcı ve müşteri avantajlarına ve güvene bak.'],
'a8.e':['Một nhận định tốt nêu ưu, nhược điểm và giải thích quyết định.','Un buen juicio nombra ventajas y desventajas y justifica la decisión.','Um bom juízo nomeia vantagens e desvantagens e justifica a decisão.','Хороша оцінка називає переваги й недоліки й обґрунтовує рішення.','ጽቡቕ ፍርዲ ረብሓታትን ጉድለታትን ይጥቅስን ውሳኔ የረጋግጽን።','Хорошая оценка называет плюсы и минусы и обосновывает решение.','الحكم الجيد يذكر المزايا والعيوب ويعلّل القرار.','İyi bir değerlendirme artıları ve eksileri söyler ve kararı gerekçelendirir.'],
'a8.1.q':['8.1 Từ 2022, khi giảm giá phải ghi cả giá thấp nhất trong 30 ngày qua (§ 11 PAngV). Giải thích quy định này nhằm giải quyết vấn đề gì.','8.1 Desde 2022, en una rebaja debe indicarse también el precio más bajo de los últimos 30 días (§ 11 PAngV). Explica qué problema debe resolver la norma.','8.1 Desde 2022, numa redução tem de se indicar também o preço mais baixo dos últimos 30 dias (§ 11 PAngV). Explica que problema a regra deve resolver.','8.1 З 2022 року при знижці треба вказувати й найнижчу ціну за останні 30 днів (§ 11 PAngV). Поясни, яку проблему має розв’язувати це правило.','8.1 ካብ 2022 ኣብ ቅናሽ ዝተሓተ ዋጋ ናይ ዝሓለፈ 30 መዓልታት እውን ክግለጽ ኣለዎ (§ 11 PAngV)። እዚ ደንቢ እንታይ ጸገም ክፈትሕ ከም ዝደሊ ግለጽ።','8.1 С 2022 года при снижении цены нужно указывать и самую низкую цену за последние 30 дней (§ 11 PAngV). Объясни, какую проблему должно решать это правило.','8.1 منذ 2022 يجب عند التخفيض بيان أدنى سعر خلال آخر 30 يومًا أيضًا (§ 11 PAngV). اشرح أي مشكلة تريد القاعدة حلّها.','8.1 2022’den beri indirimde son 30 günün en düşük fiyatı da belirtilmelidir (§ 11 PAngV). Kuralın hangi sorunu çözmek istediğini açıkla.'],
'a8.2.q':['8.2 Elektronische Regaletikett (nhãn kệ điện tử) cho phép đổi giá theo từng phút („dynamische Preise“, giá linh hoạt). Đánh giá từ góc nhìn của người bán và khách.','8.2 Las Elektronische Regaletiketten (etiquetas electrónicas) permiten cambiar precios por minutos («dynamische Preise», precios dinámicos). Valora esto desde el comerciante y los clientes.','8.2 As Elektronische Regaletiketten (etiquetas eletrónicas) permitem mudar preços ao minuto («dynamische Preise», preços dinâmicos). Avalia do ponto de vista do comerciante e dos clientes.','8.2 Elektronische Regaletiketten (електронні цінники) дозволяють змінювати ціни щохвилини («dynamische Preise», динамічні ціни). Оціни це з погляду торговця й клієнтів.','8.2 Elektronische Regaletiketten ዋጋ ብደቓይቕ ክቕየር የኽእሉ («dynamische Preise»)። እዚ ካብ ኣረኣእያ ነጋዳይን ዓሚላትን ገምግም።','8.2 Elektronische Regaletiketten (электронные ценники) позволяют менять цены каждую минуту («dynamische Preise», динамические цены). Оцени это с точки зрения торговца и клиентов.','8.2 تتيح Elektronische Regaletiketten (بطاقات رفوف إلكترونية) تغيير الأسعار كل دقيقة («dynamische Preise»، أسعار ديناميكية). قيّم ذلك من منظور التاجر والزبائن.','8.2 Elektronische Regaletiketten (elektronik raf etiketleri) fiyatların dakikalar içinde değişmesini sağlar («dynamische Preise», dinamik fiyatlar). Satıcı ve müşteri açısından değerlendir.'],
'v1.h':['Nâng cao: Tại sao lại như vậy? Hãy tính cùng!','Profundización: ¿por qué es así? ¡Calcula!','Aprofundamento: porque é assim? Calcula!','Поглиблення: чому так? Порахуй!','ኣዝዩ ዝዓሞቐ: ስለምንታይ? ሕሳብ ግበር!','Углубление: почему так? Посчитай!','تعمّق: لماذا هذا؟ احسب!','Derinleştirme: Neden böyle? Hesapla!'],
'v1.i':['Tính và giải thích. Sau đó so sánh với bài giải mẫu.','Calcula y justifica. Luego compara con la solución modelo.','Calcula e justifica. Depois compara com a solução modelo.','Порахуй й обґрунтуй. Потім порівняй із зразком.','ሕሰብን ኣረጋግጽን። ድሕሪኡ ምስ ኣብነታዊ መልሲ ኣነጻጽር።','Посчитай и обоснуй. Потом сравни с образцом.','احسب وعلّل. ثم قارن مع الحل النموذجي.','Hesapla ve gerekçelendir. Sonra örnek çözümle karşılaştır.'],
'v1.t':['V1: Tính hiệu của hai Grundpreis ở Aufgabe 2. V2 và V3: Bắt đầu bằng „Weil …“ (vì …).','V1: Calcula la diferencia de los dos Grundpreise de la Aufgabe 2. V2 y V3: empieza con «Weil …» (porque …).','V1: Calcula a diferença dos dois Grundpreise da Aufgabe 2. V2 e V3: começa com «Weil …» (porque …).','V1: Порахуй різницю двох Grundpreise з Aufgabe 2. V2 і V3: почни з «Weil …» (тому що …).','V1: ፍልልይ እቶም ክልተ Grundpreise ካብ Aufgabe 2 ሕሰብ። V2 ን V3: ብ «Weil …» ጀምር።','V1: Посчитай разницу двух Grundpreise из Aufgabe 2. V2 и V3: начни с «Weil …» (потому что …).','V1: احسب الفرق بين Grundpreise من Aufgabe 2. V2 وV3: ابدأ بـ «Weil …» (لأن …).','V1: Aufgabe 2’deki iki Grundpreis’in farkını hesapla. V2 ve V3: «Weil …» (çünkü …) ile başla.'],
'v1.1.q':['V1 Mua Becher B thay vì Becher A thì tiết kiệm được bao nhiêu euro mỗi 1 kg?','V1 ¿Cuántos euros por kg se ahorran al comprar el vaso B en lugar del A?','V1 Quantos euros por kg se poupam ao comprar o copo B em vez do A?','V1 Скільки євро за 1 кг економиться, якщо купити стаканчик B замість A?','V1 ዋንጫ B ብዘይ A እንተ ዓዲግካ ንሓደ ኪሎ ክንደይ ዩሮ ትቑጥብ?','V1 Сколько евро за 1 кг экономится, если купить стаканчик B вместо A?','V1 كم يورو لكل 1 كغ يُوفَّر عند شراء الكوب B بدل A؟','V1 A yerine B kabını alırsan 1 kg için kaç euro tasarruf edersin?'],
'v1.2.q':['V2 Tại sao Pfand (tiền cọc) phải ghi riêng và không được tính vào Grundpreis?','V2 ¿Por qué el Pfand (depósito) debe indicarse aparte y no entra en el Grundpreis?','V2 Porque é que o Pfand (depósito) tem de ser indicado à parte e não entra no Grundpreis?','V2 Чому Pfand (заставу) вказують окремо й не включають у Grundpreis?','V2 ስለምንታይ Pfand ብፍሉይ ክግለጽን ኣብ Grundpreis ከይኣቱን ኣለዎ?','V2 Почему Pfand (залог) указывают отдельно и не включают в Grundpreis?','V2 لماذا يجب بيان Pfand (التأمين) منفصلًا وعدم إدخاله في Grundpreis؟','V2 Pfand (depozito) neden ayrı belirtilir ve Grundpreis hesabına girmez?'],
'v1.3.q':['V3 Giải thích: Tại sao giá ở kệ phải đúng dù khách không có quyền pháp lý đòi giá trên kệ?','V3 Justifica: ¿por qué deben ser correctos los precios del estante aunque el cliente no tenga derecho legal a ellos?','V3 Justifica: porque é que os preços da prateleira têm de estar certos, mesmo que o cliente não tenha direito legal a eles?','V3 Обґрунтуй: чому ціни на полиці мають бути правильними, хоч клієнт не має юридичного права на них?','V3 ኣረጋግጽ: ስለምንታይ ዋጋታት መደርደሪ ቅኑዕ ክኾኑ ኣለዎም ዓሚል ሕጋዊ መሰል እኳ እንተ ዘይብሉ?','V3 Обоснуй: почему цены на полке должны быть верными, хотя у клиента нет юридического права на них?','V3 علّل: لماذا يجب أن تكون أسعار الرف صحيحة رغم أن الزبون لا حق قانوني له فيها؟','V3 Gerekçelendir: Müşterinin yasal hakkı olmasa da raf fiyatları neden doğru olmalı?']
