<script>
const SHEET={"id":"M4","short":"LF 5 · Modul 4","title":"Modul 4 – Der Werbeplan","sub":"Lernfeld 5 · Werben und den Verkauf fördern","can":[{"de":"Ich kann die Begriffe Werbeetat, Streuzeit, Streukreis und Streugebiet erklären.","vi":"Em có thể giải thích các từ Werbeetat (ngân sách quảng cáo), Streuzeit (thời gian phát quảng cáo), Streukreis (nhóm người nhận) và Streugebiet (khu vực phát).","tr":"Werbeetat (reklam bütçesi), Streuzeit (reklam zamanı), Streukreis (reklamın hedeflediği kişi çevresi) ve Streugebiet (reklam bölgesi) kavramlarını açıklayabilirim.","ar":"يمكنني شرح المصطلحات Werbeetat (ميزانية الإعلان) و Streuzeit (وقت نشر الإعلان) و Streukreis (فئة الأشخاص المستهدفين) و Streugebiet (منطقة نشر الإعلان).","ti":"ነዞም ቃላት Werbeetat (ባጀት ማስታወቕያ)፣ Streuzeit (ግዜ ማስታወቕያ)፣ Streukreis (ጉጅለ ሰባት ዝዕደሙ) ከምኡ’ውን Streugebiet (ከባቢ ማስታወቕያ) ክገልጾም እኽእል እየ።","uk":"Я можу пояснити поняття Werbeetat (рекламний бюджет), Streuzeit (час реклами), Streukreis (коло людей, на яких спрямована реклама) і Streugebiet (територія реклами).","ru":"Я могу объяснить понятия Werbeetat (рекламный бюджет), Streuzeit (время рекламы), Streukreis (круг людей, на которых направлена реклама) и Streugebiet (территория рекламы).","es":"Puedo explicar los conceptos Werbeetat (presupuesto publicitario), Streuzeit (momento de la publicidad), Streukreis (grupo de personas al que va dirigida) y Streugebiet (zona de la publicidad).","pt":"Consigo explicar os conceitos Werbeetat (orçamento de publicidade), Streuzeit (momento da publicidade), Streukreis (grupo de pessoas a que a publicidade se dirige) e Streugebiet (zona da publicidade)."},{"de":"Ich kann einen fertigen Werbeplan lesen und die Angaben darin erklären.","vi":"Em có thể đọc một Werbeplan (kế hoạch quảng cáo) có sẵn và giải thích các số liệu trong đó.","tr":"Hazır bir Werbeplan'ı (reklam planı) okuyabilir ve içindeki bilgileri açıklayabilirim.","ar":"يمكنني قراءة Werbeplan (خطة إعلانية) جاهزة وشرح المعلومات الموجودة فيها.","ti":"ዝተዳለወ Werbeplan (መደብ ማስታወቕያ) ከንብብን ኣብኡ ዘለዉ ሓበሬታታት ክገልጽን እኽእል እየ።","uk":"Я можу прочитати готовий Werbeplan (рекламний план) і пояснити дані в ньому.","ru":"Я могу прочитать готовый Werbeplan (рекламный план) и объяснить данные в нём.","es":"Puedo leer un Werbeplan (plan publicitario) ya hecho y explicar los datos que contiene.","pt":"Consigo ler um Werbeplan (plano de publicidade) já feito e explicar os dados que contém."},{"de":"Ich kann für ein Produkt einen Werbeplan aufstellen und meine Entscheidungen begründen.","vi":"Em có thể lập một Werbeplan cho một sản phẩm và giải thích các quyết định của mình.","tr":"Bir ürün için Werbeplan (reklam planı) hazırlayabilir ve kararlarımı gerekçelendirebilirim.","ar":"يمكنني وضع Werbeplan (خطة إعلانية) لمنتج وتبرير قراراتي.","ti":"ንሓደ ፍርያት Werbeplan (መደብ ማስታወቕያ) ከዳሉን ንውሳነታተይ ምኽንያት ክህብን እኽእል እየ።","uk":"Я можу скласти Werbeplan (рекламний план) для товару й обґрунтувати свої рішення.","ru":"Я могу составить Werbeplan (рекламный план) для товара и обосновать свои решения.","es":"Puedo elaborar un Werbeplan (plan publicitario) para un producto y justificar mis decisiones.","pt":"Consigo elaborar um Werbeplan (plano de publicidade) para um produto e justificar as minhas decisões."}],"items":[{"id":"a1","no":"Aufgabe 1","type":"free","pts":1,"title":"Ankommen: Was weißt du noch?","instr":{"de":"Beantworte die Fragen aus dem Kopf. Nicht nachschlagen. Es geht darum, was hängengeblieben ist.","vi":"Hãy trả lời bằng trí nhớ, không tra cứu. Điều quan trọng là em còn nhớ được gì.","tr":"Soruları aklından cevapla. Bakma. Önemli olan aklında ne kaldığıdır.","ar":"أجب عن الأسئلة من ذاكرتك. لا تبحث في الكتاب. المهم هو ما بقي في ذهنك.","ti":"ነቶም ሕቶታት ካብ ኣእምሮኻ መልሶም። ኣይትድህስስ። ዘገድስ እንታይ ከም ዝተረፈካ እዩ።","uk":"Відповідай на питання з пам’яті. Не підглядай. Важливо, що в тебе залишилось у голові.","ru":"Отвечай на вопросы по памяти. Не подсматривай. Важно, что осталось у тебя в голове.","es":"Responde a las preguntas de memoria. No mires los apuntes. Lo importante es lo que has retenido.","pt":"Responde às perguntas de memória. Não consultes os apontamentos. O importante é o que ficou na tua cabeça."},"tip":{"de":"Denke an Modul 2 und 3 und an frühere Lernfelder und WiSo. Stichworte genügen.","vi":"Hãy nhớ lại Modul 2 và 3, các Lernfeld trước và WiSo. Chỉ cần từ khóa.","tr":"Modul 2 ve 3'ü, önceki Lernfeld'leri ve WiSo'yu düşün. Anahtar kelimeler yeterli.","ar":"تذكّر Modul 2 و 3 و الـ Lernfelder السابقة و WiSo. تكفي الكلمات المفتاحية.","ti":"ንModul 2 ን 3 ን ነቶም ቀዳሞት Lernfeld ን WiSo ን ዘክር። ቀንዲ ቃላት ጥራይ ይኣክል።","uk":"Згадай Modul 2 і 3, попередні Lernfelder і WiSo. Достатньо ключових слів.","ru":"Вспомни Modul 2 и 3, прежние Lernfelder и WiSo. Достаточно ключевых слов.","es":"Piensa en Modul 2 y 3, en los Lernfelder anteriores y en WiSo. Bastan palabras clave.","pt":"Pensa no Modul 2 e 3, nos Lernfelder anteriores e em WiSo. Bastam palavras-chave."},"parts":[{"q":"1. Was ist der Unterschied zwischen Werbemittel und Werbeträger?","m":"Das Werbemittel vermittelt die Werbebotschaft (z. B. die Anzeige), der Werbeträger verbreitet sie (z. B. die Zeitung)."},{"q":"2. Was besagt das ökonomische Prinzip als Maximalprinzip? (aus LF 1)","m":"Mit gegebenen Mitteln einen möglichst großen Erfolg erzielen."},{"q":"3. Welcher Werbegrundsatz verlangt, dass der zusätzliche Erfolg höher ist als der Werbeaufwand?","m":"Der Grundsatz „wirtschaftlich“."},{"q":"4. Was ist eine Zielgruppe?","m":"Der Personenkreis, den die Werbung erreichen soll – zum Beispiel Frauen zwischen 25 und 45 Jahren."},{"q":"5. Wie lange darf die Probezeit in der Ausbildung dauern? (aus WiSo)","m":"Mindestens einen Monat, höchstens vier Monate."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)","tr":"Wortspeicher (kelime deposu)","ar":"Wortspeicher (مخزن الكلمات)","ti":"Wortspeicher (መኽዘን ቃላት)","uk":"Wortspeicher (скарбничка слів)","ru":"Wortspeicher (копилка слов)","es":"Wortspeicher (almacén de palabras)","pt":"Wortspeicher (banco de palavras)"},"html":"<p>Werbeplan · Werbeetat · Werbebudget · Plankosten · Sollkosten · Streuzeit · Streukreis · Zielgruppe · Streugebiet · Werbeverbreitungsgebiet · Reichweite · Kosten für 1.000 Kontakte · Werbedisposition · Erinnerungswerbung<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"Werbeplan = kế hoạch quảng cáo · Werbeetat/Werbebudget = ngân sách quảng cáo · Plankosten/Sollkosten = chi phí kế hoạch · Streuzeit = thời gian và tần suất quảng cáo · Streukreis = nhóm người được quảng cáo · Zielgruppe = nhóm khách hàng mục tiêu · Streugebiet = khu vực quảng cáo · Reichweite = số người tiếp cận được · Kosten für 1.000 Kontakte = chi phí cho 1.000 lượt tiếp cận · Werbedisposition = bố trí lịch quảng cáo · Erinnerungswerbung = quảng cáo nhắc nhớ","sum":{"tr":"Werbeplan = reklam planı · Werbeetat/Werbebudget = reklam bütçesi · Plankosten/Sollkosten = planlanan maliyet · Streuzeit = reklamın zamanı ve sıklığı · Streukreis = reklamın hedeflediği kişi çevresi · Zielgruppe = hedef müşteri grubu · Streugebiet = reklam bölgesi · Reichweite = ulaşılan kişi sayısı · Kosten für 1.000 Kontakte = 1.000 temas başına maliyet · Werbedisposition = reklam yayın planlaması · Erinnerungswerbung = hatırlatma reklamı","ar":"Werbeplan = خطة إعلانية · Werbeetat/Werbebudget = ميزانية الإعلان · Plankosten/Sollkosten = التكاليف المخططة · Streuzeit = وقت الإعلان وعدد مرات تكراره · Streukreis = فئة الأشخاص المستهدفين بالإعلان · Zielgruppe = الفئة المستهدفة من الزبائن · Streugebiet = منطقة الإعلان · Reichweite = عدد الأشخاص الذين يصل إليهم الإعلان · Kosten für 1.000 Kontakte = تكلفة 1.000 اتصال · Werbedisposition = جدولة نشر الإعلانات · Erinnerungswerbung = إعلان تذكيري","ti":"Werbeplan = መደብ ማስታወቕያ · Werbeetat/Werbebudget = ባጀት ማስታወቕያ · Plankosten/Sollkosten = ዝተመደበ ወጻኢ · Streuzeit = ግዜን ብዝሒን ማስታወቕያ · Streukreis = ጉጅለ ሰባት ዝዕደሙ · Zielgruppe = ዕላማ ጉጅለ ዓማዊል · Streugebiet = ከባቢ ማስታወቕያ · Reichweite = ዝበጽሑ ሰባት ብዝሒ · Kosten für 1.000 Kontakte = ዋጋ 1.000 ርክባት · Werbedisposition = ምድላው ግዜ ማስታወቕያ · Erinnerungswerbung = ኣዘኻኽሪ ማስታወቕያ","uk":"Werbeplan = рекламний план · Werbeetat/Werbebudget = рекламний бюджет · Plankosten/Sollkosten = планові витрати · Streuzeit = час і частота реклами · Streukreis = коло людей, на яких спрямована реклама · Zielgruppe = цільова група клієнтів · Streugebiet = територія реклами · Reichweite = кількість людей, яких охоплює реклама · Kosten für 1.000 Kontakte = витрати на 1.000 контактів · Werbedisposition = розклад виходу реклами · Erinnerungswerbung = нагадувальна реклама","ru":"Werbeplan = рекламный план · Werbeetat/Werbebudget = рекламный бюджет · Plankosten/Sollkosten = плановые расходы · Streuzeit = время и частота рекламы · Streukreis = круг людей, на которых направлена реклама · Zielgruppe = целевая группа клиентов · Streugebiet = территория рекламы · Reichweite = количество людей, которых охватывает реклама · Kosten für 1.000 Kontakte = расходы на 1.000 контактов · Werbedisposition = расписание выхода рекламы · Erinnerungswerbung = напоминающая реклама","es":"Werbeplan = plan publicitario · Werbeetat/Werbebudget = presupuesto publicitario · Plankosten/Sollkosten = costes previstos · Streuzeit = momento y frecuencia de la publicidad · Streukreis = grupo de personas al que va dirigida la publicidad · Zielgruppe = grupo objetivo de clientes · Streugebiet = zona de la publicidad · Reichweite = número de personas alcanzadas · Kosten für 1.000 Kontakte = coste por cada 1.000 contactos · Werbedisposition = planificación del calendario publicitario · Erinnerungswerbung = publicidad de recordatorio","pt":"Werbeplan = plano de publicidade · Werbeetat/Werbebudget = orçamento de publicidade · Plankosten/Sollkosten = custos previstos · Streuzeit = momento e frequência da publicidade · Streukreis = grupo de pessoas a que a publicidade se dirige · Zielgruppe = grupo-alvo de clientes · Streugebiet = zona da publicidade · Reichweite = número de pessoas alcançadas · Kosten für 1.000 Kontakte = custo por cada 1.000 contactos · Werbedisposition = planeamento do calendário publicitário · Erinnerungswerbung = publicidade de lembrete"}},{"id":"r1","no":"Lesen 1","type":"read","title":"Die fünf Fragen des Werbeplans","instr":{"de":"Lies den Text. Tippe die Wörter an, die zu den fünf Fragen gehören.","vi":"Em đọc đoạn văn. Chạm vào những từ thuộc về năm câu hỏi.","tr":"Metni oku. Beş soruya ait kelimelere dokun.","ar":"اقرأ النص. المس الكلمات التي تنتمي إلى الأسئلة الخمسة.","ti":"እቲ ጽሑፍ ኣንብብ። ነቶም ናይ ሓሙሽተ ሕቶታት ዝኾኑ ቃላት ተንክዮም።","uk":"Прочитай текст. Торкнись слів, які стосуються п’яти питань.","ru":"Прочитай текст. Нажми на слова, которые относятся к пяти вопросам.","es":"Lee el texto. Toca las palabras que corresponden a las cinco preguntas.","pt":"Lê o texto. Toca nas palavras que pertencem às cinco perguntas."},"tip":{"de":"Es sind fünf Fragen. Suche: Was? Womit? Wie viel? Wann? Für wen und wo?","vi":"Có năm câu hỏi. Tìm: Cái gì? Bằng gì? Bao nhiêu? Khi nào? Cho ai và ở đâu?","tr":"Beş soru var. Ara: Ne? Neyle? Ne kadar? Ne zaman? Kim için ve nerede?","ar":"هناك خمسة أسئلة. ابحث عن: ماذا؟ بماذا؟ كم؟ متى؟ لمن وأين؟","ti":"ሓሙሽተ ሕቶታት እየን። ድለ፥ እንታይ? ብምንታይ? ክንደይ? መዓስ? ንመንን ኣበይን?","uk":"Є п’ять питань. Шукай: Що? Чим? Скільки? Коли? Для кого і де?","ru":"Есть пять вопросов. Ищи: Что? Чем? Сколько? Когда? Для кого и где?","es":"Son cinco preguntas. Busca: ¿Qué? ¿Con qué? ¿Cuánto? ¿Cuándo? ¿Para quién y dónde?","pt":"São cinco perguntas. Procura: O quê? Com quê? Quanto? Quando? Para quem e onde?"},"paras":["Bevor ein Betrieb Geld für Werbung ausgibt, schreibt er einen Werbeplan. Darin beantwortet er fünf Fragen: Welche [[Werbebotschaft]] soll vermittelt werden? Welche [[Werbemittel]] und [[Werbeträger]] sind einzusetzen? Welche Beträge können eingesetzt werden ([[Werbeetat]])? Welche [[Streuzeit]] wird festgesetzt? Welche [[Streukreise]] und [[Streugebiete]] sind auszuwählen?"],"vi":"Tóm tắt: Trước khi chi tiền cho quảng cáo, cửa hàng viết Werbeplan (kế hoạch quảng cáo) và trả lời 5 câu hỏi: nội dung gì – bằng phương tiện nào – bao nhiêu tiền – khi nào – cho ai và ở đâu.","quiz":{"q":"Welche Frage gehört zur Streuzeit?","o":["Wann und wie oft wird geworben?","Wie viel Geld steht zur Verfügung?","Wo wird geworben?"],"a":0,"why":{"de":"Streuzeit = Beginn und Häufigkeit der Werbung.","vi":"Streuzeit = thời điểm bắt đầu và số lần quảng cáo.","tr":"Streuzeit = reklamın başlangıcı ve kaç kez yapıldığı.","ar":"Streuzeit = بداية الإعلان وعدد مرات تكراره.","ti":"Streuzeit = መጀመርታን ብዝሒ ግዜን ናይ ማስታወቕያ።","uk":"Streuzeit = початок реклами і як часто вона виходить.","ru":"Streuzeit = начало рекламы и как часто она выходит.","es":"Streuzeit = inicio y frecuencia de la publicidad.","pt":"Streuzeit = início e frequência da publicidade."}},"sum":{"tr":"Özet: İşletme reklama para harcamadan önce bir Werbeplan (reklam planı) yazar ve 5 soruyu cevaplar: hangi mesaj – hangi araçla – ne kadar para – ne zaman – kim için ve nerede.","ar":"ملخص: قبل أن تنفق المنشأة المال على الإعلان، تكتب Werbeplan (خطة إعلانية) وتجيب عن 5 أسئلة: ما المضمون – بأي وسيلة – كم من المال – متى – لمن وأين.","ti":"ማጠቃለሊ: ሓደ ትካል ንማስታወቕያ ገንዘብ ቅድሚ ምክፋሉ Werbeplan (መደብ ማስታወቕያ) ይጽሕፍን 5 ሕቶታት ይምልስን፥ እንታይ መልእኽቲ – ብምንታይ መሳርሒ – ክንደይ ገንዘብ – መዓስ – ንመንን ኣበይን።","uk":"Підсумок: Перш ніж витрачати гроші на рекламу, підприємство складає Werbeplan (рекламний план) і відповідає на 5 питань: який зміст – якими засобами – скільки грошей – коли – для кого і де.","ru":"Кратко: Прежде чем тратить деньги на рекламу, предприятие составляет Werbeplan (рекламный план) и отвечает на 5 вопросов: какое содержание – какими средствами – сколько денег – когда – для кого и где.","es":"Resumen: Antes de gastar dinero en publicidad, la empresa elabora un Werbeplan (plan publicitario) y responde a 5 preguntas: qué contenido – con qué medios – cuánto dinero – cuándo – para quién y dónde.","pt":"Resumo: Antes de gastar dinheiro em publicidade, a empresa elabora um Werbeplan (plano de publicidade) e responde a 5 perguntas: que conteúdo – com que meios – quanto dinheiro – quando – para quem e onde."}},{"id":"m1","no":"Übung 1","type":"match","pts":0,"title":"Begriff und Frage","instr":{"de":"Ordne jedem Begriff die passende Frage zu.","vi":"Em ghép mỗi từ với câu hỏi phù hợp.","tr":"Her kavramı uygun soruyla eşleştir.","ar":"اربط كل مصطلح بالسؤال المناسب.","ti":"ንነፍሲ ወከፍ ቃል ዝሰማማዕ ሕቶ ኣዛምድ።","uk":"Підбери до кожного поняття відповідне питання.","ru":"Подбери к каждому понятию подходящий вопрос.","es":"Une cada concepto con la pregunta que le corresponde.","pt":"Liga cada conceito à pergunta certa."},"tip":{"de":"Merke: Was – womit – wie viel – wann – für wen und wo.","vi":"Ghi nhớ: Cái gì – bằng gì – bao nhiêu – khi nào – cho ai và ở đâu.","tr":"Aklında tut: Ne – neyle – ne kadar – ne zaman – kim için ve nerede.","ar":"تذكّر: ماذا – بماذا – كم – متى – لمن وأين.","ti":"ዘክር፥ እንታይ – ብምንታይ – ክንደይ – መዓስ – ንመንን ኣበይን።","uk":"Запам’ятай: що – чим – скільки – коли – для кого і де.","ru":"Запомни: что – чем – сколько – когда – для кого и где.","es":"Recuerda: qué – con qué – cuánto – cuándo – para quién y dónde.","pt":"Lembra-te: o quê – com quê – quanto – quando – para quem e onde."},"rows":[{"l":"Werbeetat","a":"Wie viel Geld?"},{"l":"Streuzeit","a":"Wann und wie oft?"},{"l":"Streukreis","a":"Wer wird umworben?"},{"l":"Streugebiet","a":"Wo wird geworben?"}]},{"id":"w2","type":"info","title":{"de":"Werbeetat, Streuzeit, Streukreis, Streugebiet","vi":"Werbeetat, Streuzeit, Streukreis, Streugebiet","tr":"Werbeetat, Streuzeit, Streukreis, Streugebiet","ar":"Werbeetat, Streuzeit, Streukreis, Streugebiet","ti":"Werbeetat, Streuzeit, Streukreis, Streugebiet","uk":"Werbeetat, Streuzeit, Streukreis, Streugebiet","ru":"Werbeetat, Streuzeit, Streukreis, Streugebiet","es":"Werbeetat, Streuzeit, Streukreis, Streugebiet","pt":"Werbeetat, Streuzeit, Streukreis, Streugebiet"},"html":"<p><b>Werbeetat (Werbebudget):<\/b> weist die Geldmittel aus, die in einer bestimmten Zeit für Werbemaßnahmen ausgegeben werden sollen. Geplant wird meist für ein Jahr. Die Plankosten (Sollkosten) werden ausgewiesen. Der Etat wird auf die Warengruppen verteilt: Waren mit guten Wachstumschancen bekommen viel Werbung. Bei den umsatzstärksten Waren genügt eine Erinnerungswerbung.<\/p><p><b>Streuzeit:<\/b> Beginn und Häufigkeit der Werbung. Drei Möglichkeiten: einmalig und intensiv – regelmäßig (pro Tag, Woche, Monat) – in unregelmäßigen Abständen kurz, aber intensiv.<\/p><p><b>Streukreis:<\/b> der Personenkreis, der umworben wird (zum Beispiel Frauen zwischen 25 und 45 Jahren). <b>Streugebiet (Werbeverbreitungsgebiet):<\/b> das Gebiet, in dem geworben wird (zum Beispiel Bremerhaven und der Landkreis Cuxhaven). Es muss festgelegt werden, weil der Bedarf in Stadt und Land unterschiedlich sein kann.<\/p><div class=\"box merke\"><b>Merke:<\/b> Je länger und je häufiger geworben wird, desto schneller treten wirtschaftliche Werbewirkungen ein. Trotzdem kann ein kurzer, intensiver Werbeeinsatz sinnvoll sein, etwa bei einer Neueröffnung.<\/div>","vi":"Werbeetat = số tiền dành cho quảng cáo (thường cho một năm), chia cho các nhóm hàng; hàng bán chạy nhất chỉ cần quảng cáo nhắc nhớ. Streuzeit = khi nào và bao nhiêu lần. Streukreis = nhóm người được quảng cáo. Streugebiet = khu vực quảng cáo (thành phố và nông thôn có nhu cầu khác nhau).","sum":{"tr":"Werbeetat = reklam için ayrılan para (genelde bir yıllık), mal gruplarına dağıtılır; en çok satan mallar için sadece Erinnerungswerbung (hatırlatma reklamı) yeterlidir. Streuzeit = ne zaman ve kaç kez. Streukreis = reklamın hedeflediği kişiler. Streugebiet = reklam yapılan bölge (şehir ve kırsalın ihtiyaçları farklıdır).","ar":"Werbeetat = المبلغ المخصص للإعلان (غالباً لسنة واحدة)، ويُوزَّع على مجموعات السلع؛ السلع الأكثر مبيعاً تحتاج فقط إلى Erinnerungswerbung (إعلان تذكيري). Streuzeit = متى وكم مرة. Streukreis = فئة الأشخاص المستهدفين. Streugebiet = منطقة الإعلان (للمدينة والريف احتياجات مختلفة).","ti":"Werbeetat = ንማስታወቕያ ዝተመደበ ገንዘብ (ብዙሕ ግዜ ንሓደ ዓመት)፣ ኣብ ጉጅለ ኣቑሑት ይካፈል፤ ዝያዳ ዝሽየጡ ኣቑሑት Erinnerungswerbung (ኣዘኻኽሪ ማስታወቕያ) ጥራይ የድልዮም። Streuzeit = መዓስን ክንደይ ግዜን። Streukreis = ጉጅለ ሰባት ዝዕደሙ። Streugebiet = ከባቢ ማስታወቕያ (ከተማን ገጠርን ዝተፈላለየ ድሌት ኣለዎም)።","uk":"Werbeetat = гроші, призначені на рекламу (зазвичай на один рік), їх розподіляють між групами товарів; для товарів, що продаються найкраще, достатньо Erinnerungswerbung (нагадувальної реклами). Streuzeit = коли і скільки разів. Streukreis = коло людей, на яких спрямована реклама. Streugebiet = територія реклами (у місті й на селі потреби різні).","ru":"Werbeetat = деньги, выделенные на рекламу (обычно на один год), их распределяют по группам товаров; для самых продаваемых товаров достаточно Erinnerungswerbung (напоминающей рекламы). Streuzeit = когда и сколько раз. Streukreis = круг людей, на которых направлена реклама. Streugebiet = территория рекламы (в городе и в деревне потребности разные).","es":"Werbeetat = dinero destinado a la publicidad (normalmente para un año), repartido entre los grupos de productos; para los productos más vendidos basta una Erinnerungswerbung (publicidad de recordatorio). Streuzeit = cuándo y cuántas veces. Streukreis = grupo de personas al que va dirigida la publicidad. Streugebiet = zona de la publicidad (la ciudad y el campo tienen necesidades distintas).","pt":"Werbeetat = dinheiro destinado à publicidade (normalmente para um ano), repartido pelos grupos de produtos; para os produtos mais vendidos basta uma Erinnerungswerbung (publicidade de lembrete). Streuzeit = quando e quantas vezes. Streukreis = grupo de pessoas a que a publicidade se dirige. Streugebiet = zona da publicidade (na cidade e no campo as necessidades são diferentes)."}},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: Einen Werbeplan lesen und nachrechnen","html":"<p>Im Lehrbuch steht der Werbeplan des Modehauses Böhlen GmbH für den Monat Februar. So liest du eine Zeile:<\/p><div class=\"box\"><b>Anzeige Tageszeitung<\/b> · Reichweite 180 Tsd. · Umfang ¼ Seite · Anzahl 10 · Kosten für 1.000 Kontakte 8,40 € · Verbreitung insgesamt 15.120,00 €<\/div><p><b>Was bedeutet „Reichweite 180 Tsd.“?<\/b> Eine einzelne Anzeige erreicht rund 180.000 Leser.<\/p><p><b>Wie viele Kontakte sind das insgesamt?<\/b> Die Anzeige erscheint zehnmal: 180 Tsd. × 10 = 1.800 Tsd. Kontakte, also 1.800.000.<\/p><p><b>Wie kommt man auf die Verbreitungskosten?<\/b> 1.000 Kontakte kosten 8,40 €. Also: 1.800 × 8,40 € = 15.120,00 €.<\/p><p><b>Wofür sind die Spalten „KW 5“ bis „KW 8“ da?<\/b> Das sind die Werbedispositionen (Planung): In welcher Kalenderwoche erscheint die Anzeige wie oft? Das ist die Streuzeit in Tabellenform.<\/p><div class=\"box merke\"><b>Ergebnis:<\/b> Kontakte = Reichweite × Anzahl der Schaltungen. Verbreitungskosten = Kontakte (in Tsd.) × Preis für 1.000 Kontakte.<\/div>","vi":"Ví dụ mẫu: một quảng cáo báo tiếp cận 180.000 người, đăng 10 lần → 180 × 10 = 1.800 nghìn lượt tiếp cận. 1.000 lượt tiếp cận tốn 8,40 € → 1.800 × 8,40 € = 15.120,00 €. Công thức: số lượt = Reichweite × số lần đăng; chi phí = số lượt (nghìn) × giá cho 1.000 lượt.","sum":{"tr":"Örnek: Bir gazete ilanı 180.000 kişiye ulaşır, 10 kez yayımlanır → 180 × 10 = 1.800 bin temas. 1.000 temas 8,40 € tutar → 1.800 × 8,40 € = 15.120,00 €. Formül: temas sayısı = Reichweite × yayın sayısı; maliyet = temas sayısı (bin) × 1.000 temasın fiyatı.","ar":"مثال: إعلان في جريدة يصل إلى 180.000 شخص ويظهر 10 مرات → 180 × 10 = 1.800 ألف اتصال. تكلفة 1.000 اتصال هي 8,40 € → 1.800 × 8,40 € = 15.120,00 €. القاعدة: عدد الاتصالات = Reichweite × عدد مرات النشر؛ التكلفة = عدد الاتصالات (بالآلاف) × سعر 1.000 اتصال.","ti":"ኣብነት: ሓንቲ ናይ ጋዜጣ ማስታወቕያ ንሰባት 180.000 ትበጽሕን 10 ግዜ ትወጽእን → 180 × 10 = 1.800 ሽሕ ርክባት። ዋጋ 1.000 ርክባት 8,40 € እዩ → 1.800 × 8,40 € = 15.120,00 €። ቀመር: ብዝሒ ርክባት = Reichweite × ብዝሒ ግዜ፣ ዋጋ = ብዝሒ ርክባት (ብሽሕ) × ዋጋ 1.000 ርክባት።","uk":"Приклад: оголошення в газеті охоплює 180.000 людей і виходить 10 разів → 180 × 10 = 1.800 тис. контактів. 1.000 контактів коштують 8,40 € → 1.800 × 8,40 € = 15.120,00 €. Формула: кількість контактів = Reichweite × кількість виходів; витрати = кількість контактів (у тис.) × ціна за 1.000 контактів.","ru":"Пример: объявление в газете охватывает 180.000 человек и выходит 10 раз → 180 × 10 = 1.800 тыс. контактов. 1.000 контактов стоят 8,40 € → 1.800 × 8,40 € = 15.120,00 €. Формула: количество контактов = Reichweite × количество выходов; расходы = количество контактов (в тыс.) × цена за 1.000 контактов.","es":"Ejemplo: un anuncio de periódico llega a 180.000 personas y aparece 10 veces → 180 × 10 = 1.800 mil contactos. 1.000 contactos cuestan 8,40 € → 1.800 × 8,40 € = 15.120,00 €. Fórmula: contactos = Reichweite × número de publicaciones; costes = contactos (en miles) × precio por 1.000 contactos.","pt":"Exemplo: um anúncio de jornal chega a 180.000 pessoas e aparece 10 vezes → 180 × 10 = 1.800 mil contactos. 1.000 contactos custam 8,40 € → 1.800 × 8,40 € = 15.120,00 €. Fórmula: contactos = Reichweite × número de publicações; custos = contactos (em milhares) × preço por 1.000 contactos."}},{"id":"c1","no":"Übung 2","type":"calc","pts":0,"title":"Verbreitungskosten berechnen","instr":{"de":"Rechne wie im Beispiel. Eine Anzeige erreicht 120 Tsd. Leser und erscheint fünfmal. 1.000 Kontakte kosten 7,50 €.","vi":"Em tính như trong ví dụ. Một quảng cáo tiếp cận 120 nghìn độc giả và đăng 5 lần. 1.000 lượt tiếp cận tốn 7,50 €.","tr":"Örnekteki gibi hesapla. Bir ilan 120 Tsd. (120 bin) okura ulaşır ve beş kez yayımlanır. 1.000 Kontakte (temas) 7,50 € tutar.","ar":"احسب كما في المثال. إعلان واحد يصل إلى 120 Tsd. (ألف) قارئ ويظهر خمس مرات. تكلفة 1.000 Kontakte (اتصال) هي 7,50 €.","ti":"ከም ኣብ ኣብነት ኣሽብ። ሓንቲ ማስታወቕያ ንመንበብቲ 120 Tsd. (120 ሽሕ) ትበጽሕን ሓሙሽተ ግዜ ትወጽእን። ዋጋ 1.000 Kontakte (ርክባት) 7,50 € እዩ።","uk":"Порахуй, як у прикладі. Одне оголошення охоплює 120 Tsd. (120 тис.) читачів і виходить п’ять разів. 1.000 Kontakte (контактів) коштують 7,50 €.","ru":"Посчитай, как в примере. Одно объявление охватывает 120 Tsd. (120 тыс.) читателей и выходит пять раз. 1.000 Kontakte (контактов) стоят 7,50 €.","es":"Calcula como en el ejemplo. Un anuncio llega a 120 Tsd. (120 mil) lectores y aparece cinco veces. 1.000 Kontakte (contactos) cuestan 7,50 €.","pt":"Calcula como no exemplo. Um anúncio chega a 120 Tsd. (120 mil) leitores e aparece cinco vezes. 1.000 Kontakte (contactos) custam 7,50 €."},"tip":{"de":"Erst die Kontakte insgesamt (Reichweite mal Anzahl), dann mal den Preis für 1.000 Kontakte. Achte auf „Tsd.“.","vi":"Trước hết tính tổng số lượt tiếp cận (Reichweite nhân số lần), rồi nhân với giá cho 1.000 lượt. Chú ý đơn vị “Tsd.” (nghìn).","tr":"Önce toplam temas sayısını bul (Reichweite çarpı yayın sayısı), sonra 1.000 temasın fiyatıyla çarp. “Tsd.” (bin) ifadesine dikkat et.","ar":"أولاً احسب مجموع الاتصالات (Reichweite × عدد مرات الظهور)، ثم اضربه في سعر 1.000 اتصال. انتبه إلى “Tsd.” (ألف).","ti":"ቅድም ጠቕላላ Kontakte (ርክባት) ኣሽብ (Reichweite × ብዝሒ ግዜ)፣ ድሕሪኡ ምስ ዋጋ 1.000 Kontakte ተባዝሕ። ንቃል “Tsd.” (ሽሕ) ሓልዎ።","uk":"Спочатку порахуй усі контакти разом (Reichweite помножити на кількість разів), потім помнож на ціну за 1.000 контактів. Зверни увагу на “Tsd.” (тисяча).","ru":"Сначала посчитай все контакты вместе (Reichweite умножить на количество раз), потом умножь на цену за 1.000 контактов. Обрати внимание на “Tsd.” (тысяча).","es":"Primero calcula el total de contactos (Reichweite por número de veces), luego multiplica por el precio de 1.000 contactos. Fíjate en “Tsd.” (mil).","pt":"Primeiro calcula o total de contactos (Reichweite vezes o número de vezes), depois multiplica pelo preço de 1.000 contactos. Atenção a “Tsd.” (mil)."},"parts":[{"q":"a) Kontakte insgesamt (in Tsd.)","u":"Tsd.","a":600,"tol":0.01,"steps":["120 Tsd. × 5 = 600 Tsd. Kontakte"]},{"q":"b) Verbreitungskosten","u":"€","a":4500,"tol":0.01,"work":true,"steps":["600 Tsd. Kontakte = 600 × 1.000 Kontakte","600 × 7,50 € = 4.500,00 €"]}]},{"id":"a3","no":"Aufgabe 3","type":"match","pts":1,"title":"Geführte Übung: Welcher Begriff?","instr":{"de":"Ordne jede Aussage einem der vier Begriffe zu: Werbeetat, Streuzeit, Streukreis, Streugebiet.","vi":"Em ghép mỗi câu với một trong bốn từ: Werbeetat, Streuzeit, Streukreis, Streugebiet.","tr":"Her cümleyi dört kavramdan biriyle eşleştir: Werbeetat, Streuzeit, Streukreis, Streugebiet.","ar":"اربط كل عبارة بأحد المصطلحات الأربعة: Werbeetat, Streuzeit, Streukreis, Streugebiet.","ti":"ንነፍሲ ወከፍ ሓሳብ ምስ ሓደ ካብዞም ኣርባዕተ ቃላት ኣዛምዶ፥ Werbeetat, Streuzeit, Streukreis, Streugebiet።","uk":"Підбери до кожного твердження одне з чотирьох понять: Werbeetat, Streuzeit, Streukreis, Streugebiet.","ru":"Подбери к каждому утверждению одно из четырёх понятий: Werbeetat, Streuzeit, Streukreis, Streugebiet.","es":"Une cada afirmación con uno de los cuatro conceptos: Werbeetat, Streuzeit, Streukreis, Streugebiet.","pt":"Liga cada afirmação a um dos quatro conceitos: Werbeetat, Streuzeit, Streukreis, Streugebiet."},"tip":{"de":"Frage dich: Wie viel Geld, wann, für wen oder wo? Streugebiet steht im Atlas, Streukreis im Adressbuch.","vi":"Tự hỏi: bao nhiêu tiền, khi nào, cho ai hay ở đâu? Streugebiet có trong bản đồ, Streukreis có trong danh bạ.","tr":"Kendine sor: Ne kadar para, ne zaman, kim için ya da nerede? Streugebiet atlasta, Streukreis adres defterinde yer alır.","ar":"اسأل نفسك: كم من المال، متى، لمن أو أين؟ Streugebiet موجود في الأطلس، Streukreis في دفتر العناوين.","ti":"ርእስኻ ሕተት፥ ክንደይ ገንዘብ፣ መዓስ፣ ንመን ወይ ኣበይ? Streugebiet ኣብ ኣትላስ፣ Streukreis ኣብ መዝገብ ኣድራሻ ኣሎ።","uk":"Запитай себе: скільки грошей, коли, для кого чи де? Streugebiet є в атласі, Streukreis — в адресній книзі.","ru":"Спроси себя: сколько денег, когда, для кого или где? Streugebiet есть в атласе, Streukreis — в адресной книге.","es":"Pregúntate: ¿cuánto dinero, cuándo, para quién o dónde? Streugebiet está en el atlas, Streukreis en la agenda de direcciones.","pt":"Pergunta a ti próprio: quanto dinheiro, quando, para quem ou onde? Streugebiet está no atlas, Streukreis na agenda de moradas."},"rows":[{"l":"1. „Für die Werbung stehen im Mai 3.500 € zur Verfügung.“","a":"Werbeetat"},{"l":"2. „Beworben werden Frauen zwischen 25 und 45 Jahren.“","a":"Streukreis"},{"l":"3. „Geworben wird in Bremerhaven und im Landkreis Cuxhaven.“","a":"Streugebiet"},{"l":"4. „Die Anzeige erscheint jeden Freitag im März.“","a":"Streuzeit"}],"extra":["Werbeetat","Streuzeit","Streukreis","Streugebiet"],"why":{"de":"Geld = Werbeetat. Datum oder „wie oft“ = Streuzeit. Menschen = Streukreis. Gebiet = Streugebiet.","vi":"Tiền = Werbeetat. Ngày hoặc “bao nhiêu lần” = Streuzeit. Con người = Streukreis. Khu vực = Streugebiet.","tr":"Para = Werbeetat. Tarih veya “kaç kez” = Streuzeit. İnsanlar = Streukreis. Bölge = Streugebiet.","ar":"المال = Werbeetat. التاريخ أو “كم مرة” = Streuzeit. الأشخاص = Streukreis. المنطقة = Streugebiet.","ti":"ገንዘብ = Werbeetat። ዕለት ወይ “ክንደይ ግዜ” = Streuzeit። ሰባት = Streukreis። ከባቢ = Streugebiet።","uk":"Гроші = Werbeetat. Дата або “як часто” = Streuzeit. Люди = Streukreis. Територія = Streugebiet.","ru":"Деньги = Werbeetat. Дата или “как часто” = Streuzeit. Люди = Streukreis. Территория = Streugebiet.","es":"Dinero = Werbeetat. Fecha o “con qué frecuencia” = Streuzeit. Personas = Streukreis. Zona = Streugebiet.","pt":"Dinheiro = Werbeetat. Data ou “quantas vezes” = Streuzeit. Pessoas = Streukreis. Zona = Streugebiet."}},{"id":"a4","no":"Aufgabe 4 (1–5)","type":"free","pts":0.5,"title":"Freie Übung","instr":{"de":"Beantworte die Fragen in eigenen Worten.","vi":"Em trả lời các câu hỏi bằng lời của mình.","tr":"Soruları kendi cümlelerinle cevapla.","ar":"أجب عن الأسئلة بكلماتك الخاصة.","ti":"ነቶም ሕቶታት ብናትካ ቃላት መልሶም።","uk":"Дай відповіді на питання своїми словами.","ru":"Ответь на вопросы своими словами.","es":"Responde a las preguntas con tus propias palabras.","pt":"Responde às perguntas com as tuas próprias palavras."},"tip":{"de":"Bei Frage 1 hilft: Was – womit – wie viel – wann – für wen und wo.","vi":"Câu 1: nhớ “Was – womit – wie viel – wann – für wen und wo”.","tr":"1. soruda şu yardımcı olur: Ne – neyle – ne kadar – ne zaman – kim için ve nerede.","ar":"للسؤال 1 يساعدك: ماذا – بماذا – كم – متى – لمن وأين.","ti":"ንሕቶ 1 ዝሕግዝ፥ እንታይ – ብምንታይ – ክንደይ – መዓስ – ንመንን ኣበይን።","uk":"До питання 1 допоможе: що – чим – скільки – коли – для кого і де.","ru":"К вопросу 1 поможет: что – чем – сколько – когда – для кого и где.","es":"Para la pregunta 1 te ayuda: qué – con qué – cuánto – cuándo – para quién y dónde.","pt":"Para a pergunta 1 ajuda: o quê – com quê – quanto – quando – para quem e onde."},"parts":[{"q":"1. Nenne die fünf Fragen, die ein Werbeplan beantwortet.","m":"Welche Werbebotschaft? Welche Werbemittel und Werbeträger? Welcher Werbeetat? Welche Streuzeit? Welche Streukreise und Streugebiete?"},{"q":"2. Erkläre den Begriff Werbeetat.","m":"Der Werbeetat weist die Geldmittel aus, die in einer bestimmten Zeit für die Werbemaßnahmen ausgegeben werden sollen.","s":["Der Werbeetat ist …"]},{"q":"3. Nenne die drei Möglichkeiten der zeitlichen Planung von Werbeaktionen.","m":"Einmalig bzw. zeitlich begrenzt und intensiv; regelmäßig (pro Tag, Woche, Monat); in unregelmäßigen Abständen kurz, aber intensiv."},{"q":"4. Erkläre den Unterschied zwischen Streukreis und Streugebiet.","m":"Der Streukreis ist der Personenkreis, der umworben wird. Das Streugebiet ist das Gebiet, in dem die Werbung durchgeführt wird."},{"q":"5. Warum muss ein Betrieb das Streugebiet festlegen? Nenne einen Grund.","m":"Weil Art und Umfang des Bedarfs in verschiedenen Gebieten unterschiedlich sein können – Kunden in der Stadt haben andere Bedürfnisse als Kunden auf dem Land.","s":["Das Streugebiet muss festgelegt werden, weil …"]}]},{"id":"a4c","no":"Aufgabe 4 (6)","type":"calc","pts":0.5,"title":"Freie Übung: Rechnen","instr":{"de":"Eine Anzeige erreicht 90.000 Leser und erscheint viermal. 1.000 Kontakte kosten 6,00 €. Wie hoch sind die Verbreitungskosten? Schreibe den Rechenweg auf.","vi":"Một quảng cáo tiếp cận 90.000 độc giả và đăng 4 lần. 1.000 lượt tiếp cận tốn 6,00 €. Chi phí phát tán là bao nhiêu? Em viết cách tính ra.","tr":"Bir ilan 90.000 okura ulaşır ve dört kez yayımlanır. 1.000 Kontakte (temas) 6,00 € tutar. Verbreitungskosten (yayılma maliyeti) ne kadardır? Hesap yolunu yaz.","ar":"إعلان واحد يصل إلى 90.000 قارئ ويظهر أربع مرات. تكلفة 1.000 Kontakte (اتصال) هي 6,00 €. كم تبلغ Verbreitungskosten (تكاليف النشر)؟ اكتب طريقة الحساب.","ti":"ሓንቲ ማስታወቕያ ንመንበብቲ 90.000 ትበጽሕን ኣርባዕተ ግዜ ትወጽእን። ዋጋ 1.000 Kontakte (ርክባት) 6,00 € እዩ። Verbreitungskosten (ዋጋ ምዝርጋሕ) ክንደይ እዩ? መንገዲ ስሌት ጽሓፍ።","uk":"Одне оголошення охоплює 90.000 читачів і виходить чотири рази. 1.000 Kontakte (контактів) коштують 6,00 €. Яка сума Verbreitungskosten (витрат на поширення)? Запиши хід розрахунку.","ru":"Одно объявление охватывает 90.000 читателей и выходит четыре раза. 1.000 Kontakte (контактов) стоят 6,00 €. Какова сумма Verbreitungskosten (расходов на распространение)? Запиши ход расчёта.","es":"Un anuncio llega a 90.000 lectores y aparece cuatro veces. 1.000 Kontakte (contactos) cuestan 6,00 €. ¿A cuánto ascienden los Verbreitungskosten (costes de difusión)? Escribe el procedimiento de cálculo.","pt":"Um anúncio chega a 90.000 leitores e aparece quatro vezes. 1.000 Kontakte (contactos) custam 6,00 €. A quanto ascendem os Verbreitungskosten (custos de difusão)? Escreve o cálculo."},"tip":{"de":"Rechne zuerst die Kontakte insgesamt in Tausend. Danach mal den Preis für 1.000 Kontakte.","vi":"Trước hết tính tổng số lượt tiếp cận theo nghìn. Sau đó nhân với giá cho 1.000 lượt.","tr":"Önce toplam temas sayısını bin olarak hesapla. Sonra 1.000 temasın fiyatıyla çarp.","ar":"احسب أولاً مجموع الاتصالات بالآلاف. ثم اضربه في سعر 1.000 اتصال.","ti":"ቅድም ጠቕላላ Kontakte ብሽሕ ኣሽብ። ድሕሪኡ ምስ ዋጋ 1.000 Kontakte ተባዝሕ።","uk":"Спочатку порахуй усі контакти разом у тисячах. Потім помнож на ціну за 1.000 контактів.","ru":"Сначала посчитай все контакты вместе в тысячах. Потом умножь на цену за 1.000 контактов.","es":"Primero calcula el total de contactos en miles. Después multiplica por el precio de 1.000 contactos.","pt":"Primeiro calcula o total de contactos em milhares. Depois multiplica pelo preço de 1.000 contactos."},"parts":[{"q":"Verbreitungskosten","u":"€","a":2160,"tol":0.01,"work":true,"steps":["90 Tsd. × 4 = 360 Tsd. Kontakte","360 × 6,00 € = 2.160,00 € Verbreitungskosten"]}]},{"id":"a5","no":"Aufgabe 5","type":"free","pts":1,"title":"Aus deinem Betrieb","instr":{"de":"Denke an eine Werbeaktion deines Ausbildungsbetriebs. Notiere Streuzeit, Streukreis und Streugebiet. Schätze, wie hoch der Werbeetat ungefähr war.","vi":"Hãy nghĩ đến một đợt quảng cáo của cửa hàng nơi em thực tập. Ghi Streuzeit, Streukreis và Streugebiet. Ước tính ngân sách quảng cáo khoảng bao nhiêu.","tr":"Staj yaptığın işletmenin bir reklam kampanyasını düşün. Streuzeit, Streukreis ve Streugebiet'i not et. Werbeetat'ın yaklaşık ne kadar olduğunu tahmin et.","ar":"فكّر في حملة إعلانية في المنشأة التي تتدرب فيها. دوّن Streuzeit و Streukreis و Streugebiet. قدّر تقريباً كم كانت Werbeetat.","ti":"ብዛዕባ ሓደ ማስታወቕያ ናይ እትሰልጥነሉ ትካል ሕሰብ። Streuzeit, Streukreis ከምኡ’ውን Streugebiet ጽሓፍ። Werbeetat ኣስታት ክንደይ ከም ዝነበረ ገምት።","uk":"Подумай про рекламну акцію твого підприємства, де ти навчаєшся. Запиши Streuzeit, Streukreis і Streugebiet. Приблизно оціни, яким був Werbeetat.","ru":"Подумай о рекламной акции предприятия, где ты проходишь обучение. Запиши Streuzeit, Streukreis и Streugebiet. Примерно оцени, каким был Werbeetat.","es":"Piensa en una acción publicitaria de tu empresa de prácticas. Anota Streuzeit, Streukreis y Streugebiet. Estima aproximadamente a cuánto ascendió el Werbeetat.","pt":"Pensa numa ação publicitária da tua empresa de estágio. Anota Streuzeit, Streukreis e Streugebiet. Estima aproximadamente quanto foi o Werbeetat."},"tip":{"de":"Vier Angaben: Zeitraum mit Häufigkeit, Zielgruppe, Gebiet und eine geschätzte Summe mit kurzer Begründung.","vi":"Bốn thông tin: khoảng thời gian và số lần, nhóm khách hàng, khu vực và một số tiền ước tính kèm lý do ngắn.","tr":"Dört bilgi: süre ve sıklık, hedef grup, bölge ve kısa gerekçeli tahmini bir tutar.","ar":"أربع معلومات: الفترة مع التكرار، الفئة المستهدفة، المنطقة، ومبلغ تقديري مع تبرير قصير.","ti":"ኣርባዕተ ሓበሬታታት፥ ግዜን ብዝሒን፣ ዕላማ ጉጅለ፣ ከባቢ፣ ከምኡ’ውን ዝተገመተ ድምር ምስ ሓጺር ምኽንያት።","uk":"Чотири дані: період і частота, цільова група, територія та приблизна сума з коротким поясненням.","ru":"Четыре данных: период и частота, целевая группа, территория и примерная сумма с кратким объяснением.","es":"Cuatro datos: periodo y frecuencia, grupo objetivo, zona y una suma estimada con una breve justificación.","pt":"Quatro dados: período e frequência, grupo-alvo, zona e um montante estimado com uma breve justificação."},"parts":[{"q":"Meine Werbeaktion:","m":"Individuelle Lösung. Erwartet werden vier Angaben: ein Zeitraum mit Häufigkeit (Streuzeit), eine benannte Zielgruppe (Streukreis), ein Gebiet (Streugebiet) und eine geschätzte Summe mit kurzer Begründung.","s":["Streuzeit: …","Streukreis: …","Streugebiet: …","Werbeetat: etwa … €, weil …"]}]},{"id":"a6","no":"Aufgabe 6","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh.","tr":"Soruları cevapla. Cevaplarını tam cümlelerle gerekçelendir.","ar":"أجب عن الأسئلة. برّر إجاباتك بجمل كاملة.","ti":"ነቶም ሕቶታት መልሶም። ብምሉእ ሓሳብ ምኽንያት ሃብ።","uk":"Дай відповіді на питання. Обґрунтуй повними реченнями.","ru":"Ответь на вопросы. Обоснуй полными предложениями.","es":"Responde a las preguntas. Justifica con frases completas.","pt":"Responde às perguntas. Justifica com frases completas."},"tip":{"de":"6.1: Welche Waren verkaufen sich schon gut? 6.2: Denke an Neueröffnung und Wettbewerber. 6.3: Was sagt der Anzeigenpreis nicht?","vi":"6.1: Hàng nào đã bán tốt rồi? 6.2: Nghĩ đến khai trương và đối thủ cạnh tranh. 6.3: Giá đăng quảng cáo không cho biết điều gì?","tr":"6.1: Hangi mallar zaten iyi satılıyor? 6.2: Neueröffnung (açılış) ve Wettbewerber (rakipler) düşün. 6.3: İlan fiyatı neyi söylemez?","ar":"6.1: أي السلع تُباع جيداً بالفعل؟ 6.2: فكّر في Neueröffnung (افتتاح جديد) و Wettbewerber (المنافسين). 6.3: ما الذي لا يخبرنا به سعر الإعلان؟","ti":"6.1: ኣየኖት ኣቑሑት ድሮ ጽቡቕ ይሽየጡ? 6.2: ብዛዕባ Neueröffnung (ሓዱሽ ምኽፋት) ከምኡ’ውን Wettbewerber (ተወዳደርቲ) ሕሰብ። 6.3: ዋጋ ማስታወቕያ እንታይ ኣይነግርን?","uk":"6.1: Які товари вже добре продаються? 6.2: Подумай про Neueröffnung (відкриття) і Wettbewerber (конкурентів). 6.3: Про що не говорить ціна оголошення?","ru":"6.1: Какие товары уже хорошо продаются? 6.2: Подумай об Neueröffnung (открытии) и Wettbewerber (конкурентах). 6.3: О чём не говорит цена объявления?","es":"6.1: ¿Qué productos ya se venden bien? 6.2: Piensa en la Neueröffnung (inauguración) y en los Wettbewerber (competidores). 6.3: ¿Qué no dice el precio del anuncio?","pt":"6.1: Que produtos já se vendem bem? 6.2: Pensa na Neueröffnung (inauguração) e nos Wettbewerber (concorrentes). 6.3: O que não diz o preço do anúncio?"},"parts":[{"q":"6.1 Ein Betrieb hat 12.000 € Werbeetat. Warum sollte er nicht ausgerechnet die umsatzstärkste Warengruppe am stärksten bewerben?","m":"Weil die umsatzstärkste Warengruppe sich ohnehin gut verkauft. Hier genügt eine Erinnerungswerbung. Das Geld wirkt stärker bei Waren mit guten Wachstumschancen, bei denen die Werbung zusätzlichen Umsatz auslösen kann."},{"q":"6.2 Nenne zwei Situationen, in denen ein kurzzeitiger, intensiver Werbeeinsatz sinnvoll ist.","m":"Zum Beispiel bei einer Neueröffnung, wenn schnell ein hoher Bekanntheitsgrad erreicht werden soll (Fitnesscenter in neuen Räumen), oder als Reaktion auf einen Wettbewerber, etwa wenn ein Lebensmittelgeschäft eine neue Fleischwarenabteilung eröffnet und die örtlichen Metzgereien mit Anzeigen und Handzetteln gegenhalten."},{"q":"6.3 Warum sagt „Kosten für 1.000 Kontakte“ mehr aus als der reine Anzeigenpreis, wenn man zwei Werbeträger vergleicht?","m":"Weil der Anzeigenpreis nichts darüber sagt, wie viele Menschen erreicht werden. Eine teure Anzeige in einer großen Zeitung kann pro erreichtem Leser billiger sein als eine günstige Anzeige in einem kleinen Blatt. Die Kosten für 1.000 Kontakte machen beide Werbeträger vergleichbar."}]},{"id":"v1","level":"v","no":"Vertiefung 1","type":"calc","pts":1,"title":"Zwei Werbeträger vergleichen","instr":{"de":"Zeitung A: Eine Anzeige kostet 2.400 € und erreicht 150 Tsd. Leser. Zeitung B: Eine Anzeige kostet 900 € und erreicht 40 Tsd. Leser. Berechne jeweils die Kosten für 1.000 Kontakte.","vi":"Báo A: một quảng cáo giá 2.400 €, tiếp cận 150 nghìn độc giả. Báo B: một quảng cáo giá 900 €, tiếp cận 40 nghìn độc giả. Hãy tính chi phí cho 1.000 lượt tiếp cận của mỗi báo.","tr":"Gazete A: Bir ilan 2.400 € tutar ve 150 Tsd. (150 bin) okura ulaşır. Gazete B: Bir ilan 900 € tutar ve 40 Tsd. (40 bin) okura ulaşır. Her biri için 1.000 temasın maliyetini hesapla.","ar":"الصحيفة A: الإعلان الواحد يكلف 2.400 € ويصل إلى 150 Tsd. (ألف) قارئ. الصحيفة B: الإعلان الواحد يكلف 900 € ويصل إلى 40 Tsd. (ألف) قارئ. احسب تكلفة 1.000 اتصال لكل صحيفة.","ti":"ጋዜጣ A: ዋጋ ሓንቲ ማስታወቕያ 2.400 € እዩ ንመንበብቲ ድማ 150 Tsd. (150 ሽሕ) ትበጽሕ። ጋዜጣ B: ዋጋ ሓንቲ ማስታወቕያ 900 € እዩ ንመንበብቲ ድማ 40 Tsd. (40 ሽሕ) ትበጽሕ። ንነፍሲ ወከፎም ዋጋ 1.000 Kontakte ኣሽብ።","uk":"Газета A: одне оголошення коштує 2.400 € і охоплює 150 Tsd. (150 тис.) читачів. Газета B: одне оголошення коштує 900 € і охоплює 40 Tsd. (40 тис.) читачів. Порахуй для кожної витрати на 1.000 контактів.","ru":"Газета A: одно объявление стоит 2.400 € и охватывает 150 Tsd. (150 тыс.) читателей. Газета B: одно объявление стоит 900 € и охватывает 40 Tsd. (40 тыс.) читателей. Посчитай для каждой расходы на 1.000 контактов.","es":"Periódico A: un anuncio cuesta 2.400 € y llega a 150 Tsd. (150 mil) lectores. Periódico B: un anuncio cuesta 900 € y llega a 40 Tsd. (40 mil) lectores. Calcula en cada caso el coste de 1.000 contactos.","pt":"Jornal A: um anúncio custa 2.400 € e chega a 150 Tsd. (150 mil) leitores. Jornal B: um anúncio custa 900 € e chega a 40 Tsd. (40 mil) leitores. Calcula  const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.rate){const it=cardOf(t);A(it.id)[t.dataset.k]=t.dataset.rate;$$('[data-k="'+t.dataset.k+'"]',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));progress();save();return}
 const act=t.dataset.act;if(!act)return;const it=D.items.find(x=>x.id===t.dataset.id);
 if(act==='check'){S.checked[it.id]=true;paint(it);progress();save()}
 if(act==='rdchk'){A(it.id).chk=true;const c=$('#c_'+it.id);const keep=window.scrollY;const fbk=true;renderCard(it);paint(it);window.scrollTo(0,keep);progress();save()}
 if(act==='model'){S.shown[it.id]=true;renderCard(it);progress();save()}
});
function renderCard(it){const old=$('#c_'+it.id);const tmp=document.createElement('div');tmp.innerHTML=cardHtml(it);const det=old.querySelector('.tip').open;old.replaceWith(tmp.firstChild);if(S.checked[it.id]||it.type==='read')paint(it)}
function evaluate(){renderResult();$('#result').scrollIntoView({behavior:'smooth'})}
$('#b_eval').onclick=evaluate;
$('#b_pdf').onclick=()=>{renderResult();setTimeout(()=>window.print(),100)};
$('#b_restart').onclick=()=>$('#modal').classList.add('on');
$('#m_no').onclick=()=>$('#modal').classList.remove('on');
$('#m_yes').onclick=()=>{$('#modal').classList.remove('on');S=def();clearStore();$('#nm').value='';$('#dt').value=S.date;renderAll();window.scrollTo(0,0)};

const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a.r=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();
