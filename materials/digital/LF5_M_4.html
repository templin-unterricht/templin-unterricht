}

<script>
const SHEET={"id":"M4","short":"LF 5 · Modul 4","title":"Modul 4 – Der Werbeplan","sub":"Lernfeld 5 · Werben und den Verkauf fördern","can":[{"de":"Ich kann die Begriffe Werbeetat, Streuzeit, Streukreis und Streugebiet erklären.","vi":"Em có thể giải thích các từ Werbeetat (ngân sách quảng cáo), Streuzeit (thời gian phát quảng cáo), Streukreis (nhóm người nhận) và Streugebiet (khu vực phát)."},{"de":"Ich kann einen fertigen Werbeplan lesen und die Angaben darin erklären.","vi":"Em có thể đọc một Werbeplan (kế hoạch quảng cáo) có sẵn và giải thích các số liệu trong đó."},{"de":"Ich kann für ein Produkt einen Werbeplan aufstellen und meine Entscheidungen begründen.","vi":"Em có thể lập một Werbeplan cho một sản phẩm và giải thích các quyết định của mình."}],"items":[{"id":"a1","no":"Aufgabe 1","type":"free","pts":1,"title":"Ankommen: Was weißt du noch?","instr":{"de":"Beantworte die Fragen aus dem Kopf. Nicht nachschlagen. Es geht darum, was hängengeblieben ist.","vi":"Hãy trả lời bằng trí nhớ, không tra cứu. Điều quan trọng là em còn nhớ được gì."},"tip":{"de":"Denke an Modul 2 und 3 und an frühere Lernfelder und WiSo. Stichworte genügen.","vi":"Hãy nhớ lại Modul 2 và 3, các Lernfeld trước và WiSo. Chỉ cần từ khóa."},"parts":[{"q":"1. Was ist der Unterschied zwischen Werbemittel und Werbeträger?","m":"Das Werbemittel vermittelt die Werbebotschaft (z. B. die Anzeige), der Werbeträger verbreitet sie (z. B. die Zeitung)."},{"q":"2. Was besagt das ökonomische Prinzip als Maximalprinzip? (aus LF 1)","m":"Mit gegebenen Mitteln einen möglichst großen Erfolg erzielen."},{"q":"3. Welcher Werbegrundsatz verlangt, dass der zusätzliche Erfolg höher ist als der Werbeaufwand?","m":"Der Grundsatz „wirtschaftlich“."},{"q":"4. Was ist eine Zielgruppe?","m":"Der Personenkreis, den die Werbung erreichen soll – zum Beispiel Frauen zwischen 25 und 45 Jahren."},{"q":"5. Wie lange darf die Probezeit in der Ausbildung dauern? (aus WiSo)","m":"Mindestens einen Monat, höchstens vier Monate."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)"},"html":"<p>Werbeplan · Werbeetat · Werbebudget · Plankosten · Sollkosten · Streuzeit · Streukreis · Zielgruppe · Streugebiet · Werbeverbreitungsgebiet · Reichweite · Kosten für 1.000 Kontakte · Werbedisposition · Erinnerungswerbung<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"Werbeplan = kế hoạch quảng cáo · Werbeetat/Werbebudget = ngân sách quảng cáo · Plankosten/Sollkosten = chi phí kế hoạch · Streuzeit = thời gian và tần suất quảng cáo · Streukreis = nhóm người được quảng cáo · Zielgruppe = nhóm khách hàng mục tiêu · Streugebiet = khu vực quảng cáo · Reichweite = số người tiếp cận được · Kosten für 1.000 Kontakte = chi phí cho 1.000 lượt tiếp cận · Werbedisposition = bố trí lịch quảng cáo · Erinnerungswerbung = quảng cáo nhắc nhớ"},{"id":"r1","no":"Lesen 1","type":"read","title":"Die fünf Fragen des Werbeplans","instr":{"de":"Lies den Text. Tippe die Wörter an, die zu den fünf Fragen gehören.","vi":"Em đọc đoạn văn. Chạm vào những từ thuộc về năm câu hỏi."},"tip":{"de":"Es sind fünf Fragen. Suche: Was? Womit? Wie viel? Wann? Für wen und wo?","vi":"Có năm câu hỏi. Tìm: Cái gì? Bằng gì? Bao nhiêu? Khi nào? Cho ai và ở đâu?"},"paras":["Bevor ein Betrieb Geld für Werbung ausgibt, schreibt er einen Werbeplan. Darin beantwortet er fünf Fragen: Welche [[Werbebotschaft]] soll vermittelt werden? Welche [[Werbemittel]] und [[Werbeträger]] sind einzusetzen? Welche Beträge können eingesetzt werden ([[Werbeetat]])? Welche [[Streuzeit]] wird festgesetzt? Welche [[Streukreise]] und [[Streugebiete]] sind auszuwählen?"],"vi":"Tóm tắt: Trước khi chi tiền cho quảng cáo, cửa hàng viết Werbeplan (kế hoạch quảng cáo) và trả lời 5 câu hỏi: nội dung gì – bằng phương tiện nào – bao nhiêu tiền – khi nào – cho ai và ở đâu.","quiz":{"q":"Welche Frage gehört zur Streuzeit?","o":["Wann und wie oft wird geworben?","Wie viel Geld steht zur Verfügung?","Wo wird geworben?"],"a":0,"why":{"de":"Streuzeit = Beginn und Häufigkeit der Werbung.","vi":"Streuzeit = thời điểm bắt đầu và số lần quảng cáo."}}},{"id":"m1","no":"Übung 1","type":"match","pts":0,"title":"Begriff und Frage","instr":{"de":"Ordne jedem Begriff die passende Frage zu.","vi":"Em ghép mỗi từ với câu hỏi phù hợp."},"tip":{"de":"Merke: Was – womit – wie viel – wann – für wen und wo.","vi":"Ghi nhớ: Cái gì – bằng gì – bao nhiêu – khi nào – cho ai và ở đâu."},"rows":[{"l":"Werbeetat","a":"Wie viel Geld?"},{"l":"Streuzeit","a":"Wann und wie oft?"},{"l":"Streukreis","a":"Wer wird umworben?"},{"l":"Streugebiet","a":"Wo wird geworben?"}]},{"id":"w2","type":"info","title":{"de":"Werbeetat, Streuzeit, Streukreis, Streugebiet","vi":"Werbeetat, Streuzeit, Streukreis, Streugebiet"},"html":"<p><b>Werbeetat (Werbebudget):<\/b> weist die Geldmittel aus, die in einer bestimmten Zeit für Werbemaßnahmen ausgegeben werden sollen. Geplant wird meist für ein Jahr. Die Plankosten (Sollkosten) werden ausgewiesen. Der Etat wird auf die Warengruppen verteilt: Waren mit guten Wachstumschancen bekommen viel Werbung. Bei den umsatzstärksten Waren genügt eine Erinnerungswerbung.<\/p><p><b>Streuzeit:<\/b> Beginn und Häufigkeit der Werbung. Drei Möglichkeiten: einmalig und intensiv – regelmäßig (pro Tag, Woche, Monat) – in unregelmäßigen Abständen kurz, aber intensiv.<\/p><p><b>Streukreis:<\/b> der Personenkreis, der umworben wird (zum Beispiel Frauen zwischen 25 und 45 Jahren). <b>Streugebiet (Werbeverbreitungsgebiet):<\/b> das Gebiet, in dem geworben wird (zum Beispiel Bremerhaven und der Landkreis Cuxhaven). Es muss festgelegt werden, weil der Bedarf in Stadt und Land unterschiedlich sein kann.<\/p><div class=\"box merke\"><b>Merke:<\/b> Je länger und je häufiger geworben wird, desto schneller treten wirtschaftliche Werbewirkungen ein. Trotzdem kann ein kurzer, intensiver Werbeeinsatz sinnvoll sein, etwa bei einer Neueröffnung.<\/div>","vi":"Werbeetat = số tiền dành cho quảng cáo (thường cho một năm), chia cho các nhóm hàng; hàng bán chạy nhất chỉ cần quảng cáo nhắc nhớ. Streuzeit = khi nào và bao nhiêu lần. Streukreis = nhóm người được quảng cáo. Streugebiet = khu vực quảng cáo (thành phố và nông thôn có nhu cầu khác nhau)."},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: Einen Werbeplan lesen und nachrechnen","html":"<p>Im Lehrbuch steht der Werbeplan des Modehauses Böhlen GmbH für den Monat Februar. So liest du eine Zeile:<\/p><div class=\"box\"><b>Anzeige Tageszeitung<\/b> · Reichweite 180 Tsd. · Umfang ¼ Seite · Anzahl 10 · Kosten für 1.000 Kontakte 8,40 € · Verbreitung insgesamt 15.120,00 €<\/div><p><b>Was bedeutet „Reichweite 180 Tsd.“?<\/b> Eine einzelne Anzeige erreicht rund 180.000 Leser.<\/p><p><b>Wie viele Kontakte sind das insgesamt?<\/b> Die Anzeige erscheint zehnmal: 180 Tsd. × 10 = 1.800 Tsd. Kontakte, also 1.800.000.<\/p><p><b>Wie kommt man auf die Verbreitungskosten?<\/b> 1.000 Kontakte kosten 8,40 €. Also: 1.800 × 8,40 € = 15.120,00 €.<\/p><p><b>Wofür sind die Spalten „KW 5“ bis „KW 8“ da?<\/b> Das sind die Werbedispositionen (Planung): In welcher Kalenderwoche erscheint die Anzeige wie oft? Das ist die Streuzeit in Tabellenform.<\/p><div class=\"box merke\"><b>Ergebnis:<\/b> Kontakte = Reichweite × Anzahl der Schaltungen. Verbreitungskosten = Kontakte (in Tsd.) × Preis für 1.000 Kontakte.<\/div>","vi":"Ví dụ mẫu: một quảng cáo báo tiếp cận 180.000 người, đăng 10 lần → 180 × 10 = 1.800 nghìn lượt tiếp cận. 1.000 lượt tiếp cận tốn 8,40 € → 1.800 × 8,40 € = 15.120,00 €. Công thức: số lượt = Reichweite × số lần đăng; chi phí = số lượt (nghìn) × giá cho 1.000 lượt."},{"id":"c1","no":"Übung 2","type":"calc","pts":0,"title":"Verbreitungskosten berechnen","instr":{"de":"Rechne wie im Beispiel. Eine Anzeige erreicht 120 Tsd. Leser und erscheint fünfmal. 1.000 Kontakte kosten 7,50 €.","vi":"Em tính như trong ví dụ. Một quảng cáo tiếp cận 120 nghìn độc giả và đăng 5 lần. 1.000 lượt tiếp cận tốn 7,50 €."},"tip":{"de":"Erst die Kontakte insgesamt (Reichweite mal Anzahl), dann mal den Preis für 1.000 Kontakte. Achte auf „Tsd.“.","vi":"Trước hết tính tổng số lượt tiếp cận (Reichweite nhân số lần), rồi nhân với giá cho 1.000 lượt. Chú ý đơn vị “Tsd.” (nghìn)."},"parts":[{"q":"a) Kontakte insgesamt (in Tsd.)","u":"Tsd.","a":600,"tol":0.01,"steps":["120 Tsd. × 5 = 600 Tsd. Kontakte"]},{"q":"b) Verbreitungskosten","u":"€","a":4500,"tol":0.01,"work":true,"steps":["600 Tsd. Kontakte = 600 × 1.000 Kontakte","600 × 7,50 € = 4.500,00 €"]}]},{"id":"a3","no":"Aufgabe 3","type":"match","pts":1,"title":"Geführte Übung: Welcher Begriff?","instr":{"de":"Ordne jede Aussage einem der vier Begriffe zu: Werbeetat, Streuzeit, Streukreis, Streugebiet.","vi":"Em ghép mỗi câu với một trong bốn từ: Werbeetat, Streuzeit, Streukreis, Streugebiet."},"tip":{"de":"Frage dich: Wie viel Geld, wann, für wen oder wo? Streugebiet steht im Atlas, Streukreis im Adressbuch.","vi":"Tự hỏi: bao nhiêu tiền, khi nào, cho ai hay ở đâu? Streugebiet có trong bản đồ, Streukreis có trong danh bạ."},"rows":[{"l":"1. „Für die Werbung stehen im Mai 3.500 € zur Verfügung.“","a":"Werbeetat"},{"l":"2. „Beworben werden Frauen zwischen 25 und 45 Jahren.“","a":"Streukreis"},{"l":"3. „Geworben wird in Bremerhaven und im Landkreis Cuxhaven.“","a":"Streugebiet"},{"l":"4. „Die Anzeige erscheint jeden Freitag im März.“","a":"Streuzeit"}],"extra":["Werbeetat","Streuzeit","Streukreis","Streugebiet"],"why":{"de":"Geld = Werbeetat. Datum oder „wie oft“ = Streuzeit. Menschen = Streukreis. Gebiet = Streugebiet.","vi":"Tiền = Werbeetat. Ngày hoặc “bao nhiêu lần” = Streuzeit. Con người = Streukreis. Khu vực = Streugebiet."}},{"id":"a4","no":"Aufgabe 4 (1–5)","type":"free","pts":0.5,"title":"Freie Übung","instr":{"de":"Beantworte die Fragen in eigenen Worten.","vi":"Em trả lời các câu hỏi bằng lời của mình."},"tip":{"de":"Bei Frage 1 hilft: Was – womit – wie viel – wann – für wen und wo.","vi":"Câu 1: nhớ “Was – womit – wie viel – wann – für wen und wo”."},"parts":[{"q":"1. Nenne die fünf Fragen, die ein Werbeplan beantwortet.","m":"Welche Werbebotschaft? Welche Werbemittel und Werbeträger? Welcher Werbeetat? Welche Streuzeit? Welche Streukreise und Streugebiete?"},{"q":"2. Erkläre den Begriff Werbeetat.","m":"Der Werbeetat weist die Geldmittel aus, die in einer bestimmten Zeit für die Werbemaßnahmen ausgegeben werden sollen.","s":["Der Werbeetat ist …"]},{"q":"3. Nenne die drei Möglichkeiten der zeitlichen Planung von Werbeaktionen.","m":"Einmalig bzw. zeitlich begrenzt und intensiv; regelmäßig (pro Tag, Woche, Monat); in unregelmäßigen Abständen kurz, aber intensiv."},{"q":"4. Erkläre den Unterschied zwischen Streukreis und Streugebiet.","m":"Der Streukreis ist der Personenkreis, der umworben wird. Das Streugebiet ist das Gebiet, in dem die Werbung durchgeführt wird."},{"q":"5. Warum muss ein Betrieb das Streugebiet festlegen? Nenne einen Grund.","m":"Weil Art und Umfang des Bedarfs in verschiedenen Gebieten unterschiedlich sein können – Kunden in der Stadt haben andere Bedürfnisse als Kunden auf dem Land.","s":["Das Streugebiet muss festgelegt werden, weil …"]}]},{"id":"a4c","no":"Aufgabe 4 (6)","type":"calc","pts":0.5,"title":"Freie Übung: Rechnen","instr":{"de":"Eine Anzeige erreicht 90.000 Leser und erscheint viermal. 1.000 Kontakte kosten 6,00 €. Wie hoch sind die Verbreitungskosten? Schreibe den Rechenweg auf.","vi":"Một quảng cáo tiếp cận 90.000 độc giả và đăng 4 lần. 1.000 lượt tiếp cận tốn 6,00 €. Chi phí phát tán là bao nhiêu? Em viết cách tính ra."},"tip":{"de":"Rechne zuerst die Kontakte insgesamt in Tausend. Danach mal den Preis für 1.000 Kontakte.","vi":"Trước hết tính tổng số lượt tiếp cận theo nghìn. Sau đó nhân với giá cho 1.000 lượt."},"parts":[{"q":"Verbreitungskosten","u":"€","a":2160,"tol":0.01,"work":true,"steps":["90 Tsd. × 4 = 360 Tsd. Kontakte","360 × 6,00 € = 2.160,00 € Verbreitungskosten"]}]},{"id":"a5","no":"Aufgabe 5","type":"free","pts":1,"title":"Aus deinem Betrieb","instr":{"de":"Denke an eine Werbeaktion deines Ausbildungsbetriebs. Notiere Streuzeit, Streukreis und Streugebiet. Schätze, wie hoch der Werbeetat ungefähr war.","vi":"Hãy nghĩ đến một đợt quảng cáo của cửa hàng nơi em thực tập. Ghi Streuzeit, Streukreis và Streugebiet. Ước tính ngân sách quảng cáo khoảng bao nhiêu."},"tip":{"de":"Vier Angaben: Zeitraum mit Häufigkeit, Zielgruppe, Gebiet und eine geschätzte Summe mit kurzer Begründung.","vi":"Bốn thông tin: khoảng thời gian và số lần, nhóm khách hàng, khu vực và một số tiền ước tính kèm lý do ngắn."},"parts":[{"q":"Meine Werbeaktion:","m":"Individuelle Lösung. Erwartet werden vier Angaben: ein Zeitraum mit Häufigkeit (Streuzeit), eine benannte Zielgruppe (Streukreis), ein Gebiet (Streugebiet) und eine geschätzte Summe mit kurzer Begründung.","s":["Streuzeit: …","Streukreis: …","Streugebiet: …","Werbeetat: etwa … €, weil …"]}]},{"id":"a6","no":"Aufgabe 6","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh."},"tip":{"de":"6.1: Welche Waren verkaufen sich schon gut? 6.2: Denke an Neueröffnung und Wettbewerber. 6.3: Was sagt der Anzeigenpreis nicht?","vi":"6.1: Hàng nào đã bán tốt rồi? 6.2: Nghĩ đến khai trương và đối thủ cạnh tranh. 6.3: Giá đăng quảng cáo không cho biết điều gì?"},"parts":[{"q":"6.1 Ein Betrieb hat 12.000 € Werbeetat. Warum sollte er nicht ausgerechnet die umsatzstärkste Warengruppe am stärksten bewerben?","m":"Weil die umsatzstärkste Warengruppe sich ohnehin gut verkauft. Hier genügt eine Erinnerungswerbung. Das Geld wirkt stärker bei Waren mit guten Wachstumschancen, bei denen die Werbung zusätzlichen Umsatz auslösen kann."},{"q":"6.2 Nenne zwei Situationen, in denen ein kurzzeitiger, intensiver Werbeeinsatz sinnvoll ist.","m":"Zum Beispiel bei einer Neueröffnung, wenn schnell ein hoher Bekanntheitsgrad erreicht werden soll (Fitnesscenter in neuen Räumen), oder als Reaktion auf einen Wettbewerber, etwa wenn ein Lebensmittelgeschäft eine neue Fleischwarenabteilung eröffnet und die örtlichen Metzgereien mit Anzeigen und Handzetteln gegenhalten."},{"q":"6.3 Warum sagt „Kosten für 1.000 Kontakte“ mehr aus als der reine Anzeigenpreis, wenn man zwei Werbeträger vergleicht?","m":"Weil der Anzeigenpreis nichts darüber sagt, wie viele Menschen erreicht werden. Eine teure Anzeige in einer großen Zeitung kann pro erreichtem Leser billiger sein als eine günstige Anzeige in einem kleinen Blatt. Die Kosten für 1.000 Kontakte machen beide Werbeträger vergleichbar."}]},{"id":"v1","level":"v","no":"Vertiefung 1","type":"calc","pts":1,"title":"Zwei Werbeträger vergleichen","instr":{"de":"Zeitung A: Eine Anzeige kostet 2.400 € und erreicht 150 Tsd. Leser. Zeitung B: Eine Anzeige kostet 900 € und erreicht 40 Tsd. Leser. Berechne jeweils die Kosten für 1.000 Kontakte.","vi":"Báo A: một quảng cáo giá 2.400 €, tiếp cận 150 nghìn độc giả. Báo B: một quảng cáo giá 900 €, tiếp cận 40 nghìn độc giả. Hãy tính chi phí cho 1.000 lượt tiếp cận của mỗi báo."},"tip":{"de":"Teile den Anzeigenpreis durch die Reichweite in Tausend.","vi":"Chia giá đăng quảng cáo cho Reichweite tính bằng nghìn."},"parts":[{"q":"Zeitung A: Kosten für 1.000 Kontakte","u":"€","a":16,"tol":0.01,"work":true,"steps":["2.400 € : 150 = 16,00 € pro 1.000 Kontakte"]},{"q":"Zeitung B: Kosten für 1.000 Kontakte","u":"€","a":22.5,"tol":0.01,"work":true,"steps":["900 € : 40 = 22,50 € pro 1.000 Kontakte"]}]},{"id":"v2","level":"v","no":"Vertiefung 2","type":"free","pts":1,"title":"Warum ist das so?","instr":{"de":"Welche Zeitung ist im Beispiel zuvor günstiger – und warum sagt der Anzeigenpreis allein nicht genug? Begründe.","vi":"Trong ví dụ trên, báo nào rẻ hơn – và tại sao chỉ nhìn giá đăng quảng cáo là chưa đủ? Hãy giải thích."},"tip":{"de":"Vergleiche die Kosten pro 1.000 Kontakte, nicht den Anzeigenpreis.","vi":"Hãy so sánh chi phí cho mỗi 1.000 lượt tiếp cận, không phải giá đăng."},"parts":[{"q":"Meine Begründung:","m":"Zeitung A ist günstiger (16,00 € statt 22,50 € pro 1.000 Kontakte), obwohl die Anzeige teurer ist. Der Anzeigenpreis sagt nicht, wie viele Menschen erreicht werden. Erst die Kosten für 1.000 Kontakte machen beide Werbeträger vergleichbar.","s":["Zeitung … ist günstiger, weil …"]}]}]};

function shuf(arr,seed){const a=arr.slice();let s=hashSeed(seed)||1;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9%€., ]/g,' ').replace(/\s+/g,' ').trim()}

function grade(it){
 const a=A(it.id),ps=parts(it),res=[];
 if(it.type==='read'){const keys=readKeys(it),sel=a.m||[];const found=keys.filter(k=>sel.indexOf(k)>=0).length,extra=sel.filter(k=>keys.indexOf(k)<0).length;

  switch(it.type){
  case'mc':{const sa=[].concat(p.a).slice().sort().join(',');const sv=has?String(v).split(',').sort().join(','):'';ok=has&&sv===sa;mine=has?mcTxt(p,v):'';sol=mcTxt(p,sa);break}
  case'tf':ok=has&&(v==='t')===p.a;mine=has?(v==='t'?u('richtig'):u('falsch')):'';sol=p.a?u('richtig'):u('falsch');break;
  case'gap':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'match':ok=has&&v===p.a;mine=has?v:'';sol=p.a;break;
  case'table':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'calc':{const n=num(v);ok=has&&!isNaN(n)&&Math.abs(n-p.a)<=(p.tol==null?0.01:p.tol);mine=has?v:'';sol=fnum(p.a)+(p.u?' '+p.u:'');if(a['p'+i+'w'])mine+=' | '+u('path')+': '+a['p'+i+'w'];break}
  case'free':{const r=a['r'+i];ok=r==='y'?true:r==='p'?0.5:false;has=has&&!!r;mine=a['p'+i]||'';sol=T(p.m);break}
  }
  res.push({ok,has,mine,sol,why:p.why,q:p.q,p});});
 const per=ps.length?it.pts/ps.length:0;let got=0;res.forEach(r=>{got+=(r.ok===true?1:r.ok===0.5?0.5:0)*per});
 let filled;if(it.type==='free')filled=ps.every((p,i)=>String(a['p'+i]||'').trim()!=='');else filled=res.every(r=>r.has);
 return{type:it.type,parts:res,max:it.pts||0,got,filled,any:res.some(r=>r.has)}}
function tokens(p){const out=[];let idx=0;let m;
 const parts=[];let last=0,s=p;const rg=/\[\[(.+?)\]\]|\{\{(.+?)\}\}/g;while((m=rg.exec(s))){if(m.index>last)parts.push({t:s.slice(last,m.index)});parts.push({t:m[1]||m[2],key:!!m[1]});last=rg.lastIndex}
 if(last<s.length)parts.push({t:s.slice(last)});
 parts.forEach((pt,pi)=>{const prev=parts[pi-1];pt.t.split(/\s+/).filter(Boolean).forEach((w,wi)=>{const att=wi===0&&prev&&!/\s$/.test(prev.t)&&!/^\s/.test(pt.t);out.push({w,key:!!pt.key,i:idx++,att,pu:/^[.,;:!?)“”„"]+$/.test(w)})})});return out}
function allTokens(it){let g=0;return it.paras.map(p=>tokens(p).map(t=>({w:t.w,key:t.key,att:t.att,pu:t.pu,i:g++})))}
function readKeys(it){const k=[];allTokens(it).forEach(ps=>ps.forEach(t=>{if(t.key)k.push(t.i)}));return k}
/* ---------- Rendern ---------- */
function ptsLabel(it){if(it.type==='read'||!it.pts)return'';return it.level==='v'?'+'+fmt(it.pts)+' '+(S.lang==='vi'?'điểm thưởng':'Bonus'):fmt(it.pts)+' '+(S.lang==='vi'?'điểm':(it.pts===1?'Punkt':'Punkte'))}
function tipBlock(it){return it.tip?`<details class="tip"><summary>💡 ${u('tip')}</summary><div>${rich(T(it.tip))}</div></details>`:''}
function wg(it,i,p){if(!p.w&&!p.s)return'';const ch=(p.w||[]).concat(p.s||[]).map(x=>`<button type="button" class="chip" data-chip="${esc(x)}" data-for="${it.id}_${i}">${esc(x)}</button>`).join('');return`<details class="wg"><summary>✏️ ${u('words')}</summary><div class="chips">${ch}</div></details>`}
const BODY={
 info(it){return`<div class="info">${it.html||''}</div>`+(it.vi&&S.lang==='vi'?`<div class="vis">${rich(it.vi)}</div>`:'')},
 read(it){const per=allTokens(it);const a=A(it.id);const sel=a.m||[];
  const ps=per.map(ts=>`<p class="rd${a.chk?' chk':''}" data-rd="${it.id}">`+ts.map(t=>t.pu&&t.att?esc(t.w):(t.att?'':' ')+`<span class="w${t.key?' key':''}${sel.indexOf(t.i)>=0?' sel':''}" data-w="${t.i}" role="button" tabindex="0">${esc(t.w)}</span>`).join('').trim()+'</p>').join('');
  const q=it.quiz;let quiz='';
  if(q&&a.chk){quiz=`<div class="q" data-part="0"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="radio" name="${it.id}_q" data-k="q" value="${j}"${a.q!=null&&+a.q===j?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}
  return`<p class="vis">${u('tap')}</p>${ps}<div class="actions"><button type="button" class="primary" data-act="rdchk" data-id="${it.id}">${u('chkmark')}</button></div>${quiz}`+(it.vi&&S.lang==='vi'?`<p class="vis">${rich(it.vi)}</p>`:'')},
 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';
   else el=`<input class="in" type="text" data-k="p${i}" data-part="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(8,String([].concat(g.a)[0]).length+2)}" value="${esc(v)}">`;
   html=html.replace('{'+i+'}',el)});
  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},
 match(it){const a=A(it.id);const o=matchOpts(it);return it.rows.map((r,i)=>`<div class="mrow" data-part="${i}"><div><b>${rich(T(r.l))}</b></div><select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${a['p'+i]===x?' selected':''}>${esc(x)}</option>`).join('')+'</select></div>').join('')},
 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{
   if(c&&typeof c==='object'){const i=n++;const o=c.o||(it.colOpts||[])[ci];const v=a['p'+i]||'';const f=o?`<select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>':`<input class="in" type="text" data-k="p${i}" value="${esc(v)}" autocomplete="off">`;
    return`<div class="fld" data-part="${i}"><label>${esc(it.cols[ci])}</label>${f}</div>`}
   return`<div class="fld"><label>${esc(it.cols[ci])}</label><div>${rich(T(c))}</div></div>`}).join('')+'</div>'}).join('')},
 calc(it){const a=A(it.id);return it.parts.map((p,i)=>`<div class="crow" data-part="${i}"><p class="qt">${rich(T(p.q))}</p><input class="in" type="text" inputmode="decimal" data-k="p${i}" value="${esc(a['p'+i]||'')}" autocomplete="off" placeholder="0,00"><span class="u">${esc(p.u||'')}</span>${p.work?`<textarea class="in" data-k="p${i}w" rows="2" style="min-height:4rem" placeholder="${S.lang==='vi'?'Cách tính (viết ra)':'Rechenweg (aufschreiben)'}">${esc(a['p'+i+'w']||'')}</textarea>`:''}</div>`).join('')},
 free(it){const a=A(it.id);const sh=S.shown[it.id];return it.parts.map((p,i)=>`<div class="fpart"><p class="qt">${rich(T(p.q))}</p>${wg(it,i,p)}<textarea class="in" id="${it.id}_${i}" data-k="p${i}" rows="3" placeholder="…">${esc(a['p'+i]||'')}</textarea>`+(sh?`<div class="model"><div class="t">${u('model').replace(/ anzeigen| ?$/,'')}</div>${rich(T(p.m))}</div><div class="rate" data-part="${i}"><span style="flex:1 1 100%;font-weight:600">${u('rate')}</span>`+['y','p','n'].map(v=>`<button type="button" data-rate="${v}" data-k="r${i}" class="${a['r'+i]===v?'on':''}">${u(v)}</button>`).join('')+'</div>':'')+'</div>').join('')}
};
function actions(it){if(it.type==='info'||it.type==='read')return'';if(it.type==='free')return S.shown[it.id]?'':`<button type="button" class="primary" data-act="model" data-id="${it.id}">${u('model')}</button>`;return`<button type="button" class="primary" data-act="check" data-id="${it.id}">${u('check')}</button>`}
function cardHtml(it){const v=it.level==='v';
 return`<section class="card${v?' vert':''}" id="c_${it.id}" data-id="${it.id}"><header>${it.no?`<span class="no">${esc(it.no)}</span>`:''}<h2>${rich(T(it.title))}</h2><span class="pts">${ptsLabel(it)}</span></header>`+
 (it.instr?`<p class="instr">${rich(T(it.instr))}</p>`:'')+tipBlock(it)+`<div class="body">${BODY[it.type](it)}</div><div class="actions">${actions(it)}</div><div class="fb" aria-live="polite"></div></section>`}
function renderAll(){
 document.documentElement.lang=S.lang==='vi'?'vi':'de';
 $('#cards').innerHTML=D.items.filter(visible).map(cardHtml).join('');
 $('#t_can').textContent=u('can');$('#l_name').textContent=u('name');$('#l_date').textContent=u('date');
 $('#cans').innerHTML=D.can.map((c,i)=>`<label><input type="checkbox" data-can="${i}"${S.can[i]?' checked':''}><span>${rich(T(c))}</span></label>`).join('');
 $('#b_eval').textContent=u('eval');$('#b_pdf').textContent='📄 '+u('pdf');$('#b_restart').textContent=u('restart');
 $$('[data-lv]').forEach(b=>{b.textContent=u(b.dataset.lv==='b'?'basis':'vert');b.classList.toggle('on',S.level===b.dataset.lv)});
 $$('[data-lg]').forEach(b=>b.classList.toggle('on',S.lang===b.dataset.lg));
 $('#cnt').textContent='';$('#m_ask').textContent=u('ask');$('#m_yes').textContent=u('yes');$('#m_no').textContent=u('no');
 D.items.filter(visible).forEach(it=>{if(S.checked[it.id])paint(it)});
 if(S.sub)renderResult();else $('#result').classList.add('hide');
 progress()}
function progress(){const its=D.items.filter(it=>visible(it)&&counted(it));let n=0;its.forEach(it=>{if(grade(it).filled)n++});
 const pc=its.length?Math.round(n/its.length*100):0;$('#barfill').style.width=pc+'%';$('#cnt').textContent=n+' / '+its.length+' '+u('progress');
 $$('.card').forEach(c=>{const it=D.items.find(x=>x.id===c.dataset.id);c.classList.toggle('done',counted(it)&&grade(it).filled)});
 [25,50,75,100].forEach(m=>{if(pc>=m&&!(S.toast||{})[m]&&n>0){S.toast=S.toast||{};S.toast[m]=1;if(m===100||m===50)toast(m+' % ✓')}})}
function paint(it){const c=$('#c_'+it.id);if(!c)return;const g=grade(it);const fb=$('.fb',c);
 if(it.type==='read'){const a=A(it.id);const rd=$$('.rd',c);rd.forEach(r=>r.classList.add('chk'));
  let h=`${g.found===g.total&&!g.extra?'✔':'ℹ️'} ${g.found} ${u('of')} ${g.total} ${u('found')}`+(g.extra?`, ${g.extra} ${u('extra')}`:'');fb.className='fb '+(g.found===g.total&&!g.extra?'ok':'mid');fb.innerHTML=h;
  const q=it.quiz;if(q&&a.q!=null){const qq=$('.q',c);const ok=+a.q===q.a;qq.classList.toggle('ok',ok);qq.classList.toggle('bad',!ok);fb.innerHTML+=`<small>${ok?'✓':'✗'} ${rich(T(q.why))}</small>`}return}
 if(!S.checked[it.id]||it.type==='info')return;
 if(it.type==='free'){return}
 const right=g.parts.filter(p=>p.ok===true).length;
 g.parts.forEach((p,i)=>{$$('[data-part="'+i+'"]',c).forEach(el=>{el.classList.remove('ok','bad');if(p.has)el.classList.add(p.ok===true?'ok':'bad');else el.classList.add('bad')})});
 fb.className='fb '+(right===g.parts.length?'ok':right?'mid':'bad');
 fb.innerHTML=(right===g.parts.length?'✓ '+u('allright'):right+' '+u('of')+' '+g.parts.length+' '+u('right')+'. '+(g.filled?'':u('fill')+' ')+(right<g.parts.length?`<small>${u('notall')}</small>`:''))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
/* ---------- Ergebnis ---------- */
function stateOf(r){return r.ok===true?'g':r.ok===0.5?'m':'r'}
function renderResult(){
 const its=D.items.filter(visible);let got=0,max=0,bg=0,bm=0;
 const html=its.filter(it=>it.type!=='info').map(it=>{const g=grade(it);
  if(it.type==='read'){return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))} <span class="st ${g.found===g.total&&!g.extra?'g':'m'}">${g.filled?g.found+' / '+g.total:'–'}</span></h4><small>${u('readfb')}</small></div>`}
  if(it.level==='v'){bg+=g.got;bm+=g.max}else{got+=g.got;max+=g.max}
  const nr=g.parts.filter(r=>r.ok===true).length;const full=it.pts?g.got>=g.max-0.001:nr===g.parts.length;const cls=full?'g':(it.pts?g.got>0:nr>0)?'m':'r';
  let li=g.parts.map((r,i)=>{const p=r.p;let line='';const lab=it.type==='match'?T(p.l):it.type==='table'?(it.rows[p.ri]&&T(it.rows[p.ri][0])||'')+' ['+it.cols[p.ci]+']':it.type==='gap'?'('+(i+1)+')':T(p.q||p.t||'')||(i+1);
   const mark=r.ok===true?'✓':r.ok===0.5?'◐':'✗';
   line=`<li><b>${mark}</b> ${rich(String(lab).slice(0,200))}<br><span class="${r.ok===true?'':'mine'}">${u('mine')}: ${r.mine?rich(r.mine):u('empty')}</span>`;
   if(r.ok!==true||it.type==='free')line+=`<br><span class="sol">${u('sol')}: ${rich(r.sol)}</span>`;
   if(r.ok!==true&&r.why)line+=`<br><small>${u('why')}: ${rich(T(r.why))}</small>`;
   if(it.type==='calc'&&p.steps)line+=`<div class="steps"><b>${u('path')}:</b>`+p.steps.map(s=>`<div>${esc(T(s))}</div>`).join('')+'</div>';
   return line+'</li>'}).join('');
  if(it.why&&!full)li+=`<li><small>${u('why')}: ${rich(T(it.why))}</small></li>`;
  if(it.type==='free'&&g.parts.some(r=>!r.has))li+=`<li><small>${u('unrated')}</small></li>`;
  return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))}${it.level==='v'?' ('+u('vert')+')':''} <span class="st ${cls}">${it.pts?fmt(g.got)+' / '+fmt(g.max):''}</span></h4><ul>${li}</ul></div>`}).join('');
 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}
/* ---------- Ereignisse ---------- */
function cardOf(e){const c=e.closest('.card');return c?D.items.find(x=>x.id===c.dataset.id):null}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();return}if(t.id==='dt'){S.date=t.value;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.rate){const it=cardOf(t);A(it.id)[t.dataset.k]=t.dataset.rate;$$('[data-k="'+t.dataset.k+'"]',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));progress();save();return}
 const act=t.dataset.act;if(!act)return;const it=D.items.find(x=>x.id===t.dataset.id);
 if(act==='check'){S.checked[it.id]=true;paint(it);progress();save()}
 if(act==='rdchk'){A(it.id).chk=true;const c=$('#c_'+it.id);const keep=window.scrollY;const fbk=true;renderCard(it);paint(it);window.scrollTo(0,keep);progress();save()}
 if(act==='model'){S.shown[it.id]=true;renderCard(it);progress();save()}
});
function renderCard(it){const old=$('#c_'+it.id);const tmp=document.createElement('div');tmp.innerHTML=cardHtml(it);const det=old.querySelector('.tip').open;old.replaceWith(tmp.firstChild);if(S.checked[it.id]||it.type==='read')paint(it)}
function evaluate(){renderResult();$('#result').scrollIntoView({behavior:'smooth'})}
$('#b_eval').onclick=evaluate;
$('#b_pdf').onclick=()=>{renderResult();setTimeout(()=>window.print(),100)};
$('#b_restart').onclick=()=>$('#modal').classList.add('on');
$('#m_no').onclick=()=>$('#modal').classList.remove('on');
$('#m_yes').onclick=()=>{$('#modal').classList.remove('on');S=def();clearStore();$('#nm').value='';$('#dt').value=S.date;renderAll();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',()=>{$$('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})});
/* ---------- Start ---------- */
const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a['r'+i]=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();
