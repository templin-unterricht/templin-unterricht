<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8">

<title>Modul 11 – Teamarbeit</title>
<style>
:root{--fs:1;--ink:#1f2937;--mut:#5b6472;--bg:#f3f5fb;--card:#fff;--pri:#3b4cca;--pri2:#e8ebff;--ok:#1b8a4b;--okbg:#e3f6ea;--bad:#c0392b;--badbg:#fdeaea;--warn:#b7791f;--warnbg:#fff6dd;--vert:#7a3fb5;--vertbg:#f3eafc;--line:#d9deea}
*{box-sizing:border-box}html{font-size:calc(17px*var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55;overflow-wrap:anywhere}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:48px;border-radius:12px;border:2px solid var(--pri);background:#fff;color:var(--pri);padding:.5rem 1rem;font-weight:600;touch-action:manipulation}
button.primary{background:var(--pri);color:#fff}button:disabled{opacity:.5}
button:active{transform:scale(.98)}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:.5rem .75rem;padding-top:max(.5rem,env(safe-area-inset-top))}
.top .row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;max-width:62rem;margin:0 auto}
.top .ttl{font-weight:700;font-size:.95rem;flex:1 1 12rem}
.pills{display:inline-flex;border:2px solid var(--pri);border-radius:12px;overflow:hidden}
.pills button{border:0;border-radius:0;min-height:44px;padding:.3rem .9rem}
.pills button.on{background:var(--pri);color:#fff}
.bar{height:12px;background:#e5e8f3;border-radius:8px;overflow:hidden;flex:1 1 8rem}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b4cca,#27a37a);transition:width .4s}
.cnt{font-size:.8rem;color:var(--mut);flex:0 0 auto}
.wrap{max-width:62rem;margin:0 auto;padding:1rem .75rem 5rem}
.head{background:var(--card);border-radius:16px;padding:1rem 1.1rem;margin-bottom:1rem;border-top:6px solid var(--pri)}
.head h1{margin:0 0 .2rem;font-size:1.5rem;line-height:1.25}.head .sub{color:var(--mut);margin:0 0 .8rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.fields label{display:block;font-weight:600;font-size:.85rem}
.fields input{width:100%;min-height:48px;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:.4rem .7rem;background:#fff}
.can{margin-top:.9rem}.can h3{margin:.2rem 0 .4rem;font-size:1rem}
.can label{display:flex;gap:.7rem;align-items:flex-start;padding:.45rem .2rem;min-height:48px}
.can input{width:26px;height:26px;margin-top:.1rem;flex:none;accent-color:var(--pri)}
.card{background:var(--card);border-radius:16px;padding:1rem 1.1rem;margin-bottom:1rem;border-left:6px solid var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card.vert{border-left-color:var(--vert);background:linear-gradient(var(--vertbg),#fff 5rem)}
.card.done{border-left-color:var(--ok)}
.card header{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap}
.card h2{margin:0;font-size:1.15rem;flex:1 1 12rem;line-height:1.3}
.no{background:var(--pri2);color:var(--pri);font-weight:700;border-radius:8px;padding:.1rem .6rem;font-size:.9rem}
.vert .no{background:var(--vertbg);color:var(--vert)}
.pts{font-size:.85rem;color:var(--mut);white-space:nowrap}
.instr{margin:.5rem 0;font-weight:500}.instr.vi,.vi-t{color:#34495e}
.tip{margin:.5rem 0;border:1.5px dashed #d9a400;background:var(--warnbg);border-radius:12px}
.tip summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;padding:.3rem .8rem;font-weight:600;color:var(--warn)}
.tip summary::-webkit-details-marker{display:none}.tip>div{padding:0 .9rem .7rem}
.box{background:var(--pri2);border-radius:12px;padding:.7rem .9rem;margin:.6rem 0}
.box.merke{background:#fff3cd}.box h4{margin:0 0 .2rem}
.info p{margin:.5rem 0}
.vis{font-size:.95rem;border-left:4px solid var(--line);padding-left:.7rem;color:#34495e;margin:.5rem 0}
.rd{line-height:2.25;margin:.5rem 0}
.w{display:inline-block;padding:.1rem .2rem;margin:0 .05rem;border-radius:6px;cursor:pointer;user-select:none;-webkit-user-select:none;min-height:2rem}
.w.sel{background:#ffe566}
.rd.chk .w.key.sel{background:#b9ebc9;outline:2px solid var(--ok)}
.rd.chk .w.key:not(.sel){outline:2px dashed var(--ok)}
.rd.chk .w.sel:not(.key){background:#f5b7b1;outline:2px solid var(--bad)}
.q{margin:.8rem 0;padding:.4rem;border-radius:12px}.q .qt{margin:.1rem 0 .4rem;font-weight:600}
.opts{display:grid;gap:.45rem}
.opt{display:flex;gap:.7rem;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:.55rem .8rem;min-height:48px;cursor:pointer;background:#fff}
.opt input{width:24px;height:24px;margin-top:.1rem;flex:none;accent-color:var(--pri)}
.opt:has(input:checked){border-color:var(--pri);background:var(--pri2)}
.tfrow{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.5rem 0;padding:.4rem;border-radius:12px}
.tfrow .st{flex:1 1 16rem}.tfrow .opts{display:flex;gap:.4rem}
select,.in{min-height:48px;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:.35rem .6rem;background:#fff;max-width:100%}
select:focus,.in:focus,textarea:focus{outline:3px solid #9fb0ff;border-color:var(--pri)}
.gaptxt{line-height:2.6}.gaptxt select,.gaptxt .in{margin:0 .15rem}
.mrow{display:grid;grid-template-columns:minmax(8rem,1fr) 2fr;gap:.5rem;align-items:center;margin:.5rem 0;padding:.4rem;border-radius:12px}
.mrow select{width:100%}
.trow{border:1.5px solid var(--line);border-radius:12px;padding:.6rem;margin:.6rem 0;display:grid;gap:.5rem}
.trow .fld label{display:block;font-size:.8rem;font-weight:700;color:var(--mut)}.trow .fld select,.trow .fld .in{width:100%}
.trow .fld{padding:.2rem;border-radius:10px}
@media(min-width:760px){.trow{grid-template-columns:repeat(var(--n),1fr)}}
.crow{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.6rem 0;padding:.4rem;border-radius:12px}
.crow .qt{flex:1 1 100%;font-weight:600;margin:0}.crow .in{width:10rem;text-align:right}.crow .u{font-weight:600}
textarea.in{width:100%;min-height:6.5rem;resize:vertical;line-height:1.5}
.fpart{margin:.8rem 0}.fpart .qt{font-weight:600;margin:.2rem 0}
.wg{margin:.3rem 0}.wg summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--pri);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0}.chip{min-height:44px;padding:.2rem .8rem;border-radius:999px;border:1.5px solid var(--pri);background:#fff;font-weight:500}
.model{background:var(--okbg);border-radius:12px;padding:.6rem .9rem;margin:.4rem 0}
.model .t{font-weight:700;color:var(--ok);font-size:.85rem}
.rate{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0}.rate button{flex:1 1 7rem}
.rate button.on{background:var(--pri);color:#fff}
.ok{background:var(--okbg)!important;outline:2px solid var(--ok)}.bad{background:var(--badbg)!important;outline:2px solid var(--bad)}
select.ok,.in.ok,select.bad,.in.bad{outline-offset:0}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}
.fb{margin-top:.5rem;font-weight:600}.fb.ok{background:none;outline:0;color:var(--ok)}.fb.bad{background:none;outline:0;color:var(--bad)}.fb.mid{color:var(--warn)}
.fb small{display:block;font-weight:400;color:var(--ink)}
.bottom{background:var(--card);border-radius:16px;padding:1rem 1.1rem;margin:1rem 0}
.bottom .actions button{flex:1 1 14rem}
#result{background:var(--card);border-radius:16px;padding:1rem 1.1rem;margin:1rem 0;border-top:6px solid var(--ok)}
#result h2{margin:.2rem 0}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.ritem{border-top:1px solid var(--line);padding:.7rem 0}.ritem h4{margin:0 0 .3rem;display:flex;gap:.5rem;flex-wrap:wrap}
.ritem .st{font-weight:800}.st.g{color:var(--ok)}.st.m{color:var(--warn)}.st.r{color:var(--bad)}
.ritem ul{margin:.2rem 0;padding-left:1.2rem}.ritem li{margin:.15rem 0}
.sol{color:var(--ok);font-weight:600}.mine{color:var(--bad)}
.steps{background:#f1f4fb;border-radius:10px;padding:.4rem .8rem;margin:.3rem 0}.steps div{font-family:ui-monospace,Menlo,monospace;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#222;color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:50;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .3s}.toast.on{opacity:.95}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:1rem}.modal.on{display:flex}
.modal>div{background:#fff;border-radius:16px;padding:1.2rem;max-width:26rem}.modal .actions button{flex:1}
.hide{display:none!important}
@media(max-width:560px){.top{padding:.3rem .5rem}.top .row{gap:.3rem}.top .ttl{display:none}.pills button{min-height:44px;padding:.2rem .6rem;font-size:.8rem}.pills{border-width:1.5px}.fields{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}html{font-size:calc(16px*var(--fs))}}
.printonly{display:none}
@media print{
 body{background:#fff;font-size:11pt}.top,.card,.head .can,.bottom,.toast,.modal,.noprint,.head .fields{display:none!important}
 .head{border:0;padding:0;margin:0}.printonly{display:block}
 #result{border:0;padding:0;margin:0;display:block!important}.ritem{break-inside:avoid}
 .wrap{padding:0;max-width:none}
}

<script>
const SHEET={"id":"M11","short":"LF 5 · Modul 11","title":"Modul 11 – Teamarbeit","sub":"Lernfeld 5 · Werben und den Verkauf fördern","can":[{"de":"Ich kann die Voraussetzungen für gute Teamarbeit nennen.","vi":"Em có thể nêu các điều kiện để làm việc nhóm (Teamarbeit) tốt."},{"de":"Ich kann die fünf Phasen einer Teamsitzung in der richtigen Reihenfolge nennen.","vi":"Em có thể nêu năm giai đoạn của Teamsitzung (buổi họp nhóm) theo đúng thứ tự."},{"de":"Ich kann eine Teamsitzung vorbereiten, die Gesprächsregeln einhalten und das Ergebnis vorstellen.","vi":"Em có thể chuẩn bị một buổi họp nhóm, giữ các Gesprächsregeln (quy tắc trò chuyện) và trình bày kết quả."}],"items":[{"id":"a1","no":"Aufgabe 1","type":"free","pts":1,"title":"Ankommen: Was weißt du noch?","instr":{"de":"Beantworte die Fragen aus dem Kopf. Nicht nachschlagen. Es geht darum, was hängengeblieben ist.","vi":"Hãy trả lời bằng trí nhớ, không tra cứu. Điều quan trọng là em còn nhớ được gì."},"tip":{"de":"Denke an Modul 10, 8 und 4 und an LF 3 und LF 4. Stichworte genügen.","vi":"Hãy nhớ lại Modul 10, 8 và 4, LF 3 và LF 4. Chỉ cần từ khóa."},"parts":[{"q":"1. Was ist der Unterschied zwischen Frachtführer und Spediteur?","m":"Der Frachtführer befördert das Gut selbst, der Spediteur besorgt die Versendung im eigenen Namen für fremde Rechnung."},{"q":"2. Nenne zwei unbare Zahlungsarten an der Kasse. (aus LF 3)","m":"Z. B. Girocard, Kreditkarte, Bezahlen mit dem Smartphone."},{"q":"3. Was verbietet das UWG bei der Werbung per E-Mail?","m":"Werbe-E-Mails ohne Einwilligung des Empfängers – das ist eine unzumutbare Belästigung."},{"q":"4. Was ist eine Zweitplatzierung? (aus LF 4)","m":"Die Ware steht zusätzlich an einem zweiten Platz, z. B. auf einer Aktionsfläche oder an der Kasse."},{"q":"5. Was ist ein Streugebiet?","m":"Das Gebiet, in dem die Werbemaßnahmen durchgeführt werden."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)"},"html":"<p>Teamarbeit · Teamleitung · gemeinsames Ziel · Zielvereinbarung · Einzelbeitrag · Lösungsansatz · Präsentation · Tagesordnung · Zeitrahmen · Protokoll · Verlaufsprotokoll · Ergebnisprotokoll · Gesprächsregeln · Rederecht · themenzentriert · Stimmungsbild · Feedback<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"Teamarbeit = làm việc nhóm · Teamleitung = trưởng nhóm · gemeinsames Ziel = mục tiêu chung · Zielvereinbarung = thỏa thuận mục tiêu · Einzelbeitrag = đóng góp cá nhân · Lösungsansatz = hướng giải quyết · Präsentation = thuyết trình · Tagesordnung = chương trình họp · Zeitrahmen = khung thời gian · Protokoll = biên bản · Verlaufsprotokoll = biên bản diễn biến · Ergebnisprotokoll = biên bản kết quả · Gesprächsregeln = quy tắc trò chuyện · Rederecht = quyền phát biểu · themenzentriert = bám sát chủ đề · Stimmungsbild = bảng khảo sát tâm trạng · Feedback = phản hồi"},{"id":"r1","no":"Lesen 1","type":"read","title":"Was ist Teamarbeit?","instr":{"de":"Lies den Text. Tippe an: Was ist Teamarbeit? Wofür ist die Teamleitung verantwortlich?","vi":"Em đọc đoạn văn. Chạm vào: Teamarbeit là gì? Trưởng nhóm chịu trách nhiệm về điều gì?"},"tip":{"de":"Suche das Wort „Ziel“ und die zwei Dinge, für die die Teamleitung verantwortlich ist.","vi":"Tìm từ “Ziel” (mục tiêu) và hai điều mà trưởng nhóm chịu trách nhiệm."},"paras":["Teamarbeit ist die [[Zusammenarbeit]] in einer Gruppe, um ein [[gemeinsames Ziel]] zu erreichen. Bei der Teamarbeit trägt die Teamleitung eine besondere Verantwortung für sachgerechte [[Arbeitsabläufe]] und eine konstruktive [[Arbeitsatmosphäre]]."],"vi":"Tóm tắt: Teamarbeit = làm việc cùng nhau trong một nhóm để đạt mục tiêu chung. Trưởng nhóm chịu trách nhiệm đặc biệt về quy trình làm việc hợp lý và bầu không khí tích cực.","quiz":{"q":"Was braucht ein Team als Erstes?","o":["Ein gemeinsames, eindeutig formuliertes Ziel","Einen schnellen Chef","Möglichst viele Mitglieder"],"a":0,"why":{"de":"Voraussetzung Nummer 1: ein gemeinsames Ziel, das eindeutig formuliert ist.","vi":"Điều kiện số 1: một mục tiêu chung được nêu rõ ràng."}}},{"id":"w2","type":"info","title":{"de":"Voraussetzungen und fünf Phasen","vi":"Điều kiện và năm giai đoạn"},"html":"<p><b>Voraussetzungen einer guten Teamarbeit:<\/b><br>✓ Das Team hat ein gemeinsames Ziel.<br>✓ Das Ziel ist eindeutig formuliert.<br>✓ Alle Entscheidungen werden gemeinsam beschlossen.<br>✓ Die Teammitglieder unterstützen sich gegenseitig, im Notfall ersetzen sie sich.<br>✓ Der Teamleiter koordiniert die Arbeit und schlichtet Konflikte.<br>✓ Das Team gibt sich klare Regeln und ordnet Verantwortungsbereiche zu.<\/p><p><b>Die fünf Phasen der Teamarbeit:<\/b><br>1. Zielvereinbarung: Das Team einigt sich auf ein gemeinsames Ziel. Alle müssen zustimmen.<br>2. Einzelbeiträge der Teammitglieder: Jeder bringt sein Wissen und seine Erfahrung ein.<br>3. Diskussion über einzelne Lösungsansätze: Stärken und Schwächen werden untersucht.<br>4. Entwickeln einer gemeinsamen Lösung: Ideen werden zusammengefasst und geordnet.<br>5. Präsentation: Die Lösung wird vorgestellt.<\/p><div class=\"box merke\"><b>Merkhilfe:<\/b> erst das Ziel, dann die Einzelnen, dann der Streit über die Vorschläge, dann die gemeinsame Lösung, zum Schluss das Vorstellen.<\/div>","vi":"Điều kiện: mục tiêu chung và rõ ràng; quyết định chung; hỗ trợ nhau; trưởng nhóm điều phối và hòa giải; có quy tắc rõ ràng. Năm giai đoạn: 1. thỏa thuận mục tiêu, 2. mỗi người đóng góp, 3. thảo luận các hướng giải quyết, 4. xây dựng giải pháp chung, 5. thuyết trình."},{"id":"m1","no":"Übung 1","type":"match","pts":0,"title":"Die fünf Phasen in die richtige Reihenfolge bringen","instr":{"de":"Welche Phase ist das? Ordne jedem Schritt die richtige Phase zu.","vi":"Đây là giai đoạn nào? Em ghép mỗi bước với giai đoạn đúng."},"tip":{"de":"Merkhilfe: erst das Ziel, dann die Einzelnen, dann der Streit, dann die gemeinsame Lösung, zum Schluss das Vorstellen.","vi":"Gợi nhớ: trước hết mục tiêu, rồi từng người, rồi tranh luận, rồi giải pháp chung, cuối cùng là trình bày."},"rows":[{"l":"Präsentation","a":"Phase 5"},{"l":"Zielvereinbarung","a":"Phase 1"},{"l":"Entwickeln einer gemeinsamen Lösung","a":"Phase 4"},{"l":"Einzelbeiträge der Teammitglieder","a":"Phase 2"},{"l":"Diskussion über einzelne Lösungsansätze","a":"Phase 3"}]},{"id":"w3","type":"info","title":{"de":"Eine Teamsitzung organisieren","vi":"Tổ chức một buổi họp nhóm"},"html":"<p><b>Die sechs Schritte:<\/b><br>1. Thema festlegen (Grundlage ist ein Informationsbedarf, zum Beispiel Kundenbeschwerden).<br>2. Team bilden (fachlich geeignet, motiviert, passen zusammen).<br>3. Sitzung vorbereiten: Termin abstimmen · Tagesordnung mit Zeitrahmen · Informationsmaterial beschaffen · Raum reservieren und ausstatten · Einladung mit Tagesordnung und Material verschicken.<br>4. Sitzung durchführen: Begrüßung · kurze Einführung zu Zweck und Ziel · Protokollführung und Protokollart festlegen (Verlaufs- oder Ergebnisprotokoll) · Gesprächsregeln festlegen · Rederecht zuteilen, Zeitrahmen einhalten · themenzentriert führen · Zwischenergebnisse festhalten, Gesamtergebnis feststellen · Raum aufgeräumt verlassen.<br>5. Sitzung abschließen: Meinung zum Ablauf, Änderungswünsche.<br>6. Ergebnisse präsentieren (Präsentationsregeln aus Lernfeld 1).<\/p><div class=\"box merke\"><b>Die vier Gesprächsregeln:<\/b> freie Meinungsäußerung · ausreden lassen und zuhören · respektvoller Umgang miteinander · keine übermäßigen Redeanteile eines Einzelnen<\/div><p><b>Das Stimmungsbild:<\/b> Die Teilnehmer setzen farbige Klebepunkte auf ein Flipchart-Plakat mit Smilies. Bei mehreren Sitzungen wechselt die Farbe. So wird die Veränderung im Zeitablauf sichtbar. Das gibt einen Impuls für ein mündliches Feedback.<\/p>","vi":"Sáu bước: 1. chọn chủ đề, 2. lập nhóm, 3. chuẩn bị buổi họp (thời gian, chương trình, tài liệu, phòng, thư mời), 4. tiến hành họp, 5. kết thúc họp, 6. trình bày kết quả. Bốn quy tắc trò chuyện: tự do bày tỏ ý kiến; để người khác nói hết và lắng nghe; tôn trọng nhau; không ai nói quá nhiều. Stimmungsbild = dán chấm màu lên tấm áp phích có hình mặt cười để thể hiện tâm trạng."},{"id":"t1","no":"Lesen 2","type":"tf","pts":0,"title":"Richtig oder falsch?","instr":{"de":"Entscheide: Ist die Aussage richtig oder falsch?","vi":"Em quyết định: câu này đúng hay sai?"},"tip":{"de":"Lies noch einmal die vier Gesprächsregeln und die Voraussetzungen.","vi":"Đọc lại bốn quy tắc trò chuyện và các điều kiện."},"st":[{"t":"In einem Team entscheidet allein die Teamleitung.","a":false,"why":{"de":"Alle Entscheidungen werden gemeinsam beschlossen.","vi":"Mọi quyết định đều được cả nhóm cùng quyết định."}},{"t":"Zu den Gesprächsregeln gehört: ausreden lassen und zuhören.","a":true},{"t":"Das Stimmungsbild zeigt die Veränderung im Zeitablauf, wenn die Farbe der Klebepunkte wechselt.","a":true},{"t":"Eine Teamsitzung braucht keine Tagesordnung.","a":false,"why":{"de":"Zur Vorbereitung gehört eine Tagesordnung mit Zeitrahmen.","vi":"Chuẩn bị họp cần có chương trình họp kèm khung thời gian."}}]},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: Eine Sitzung vorbereiten","html":"<div class=\"box\"><b>Der Auftrag:<\/b> In deinem Ausbildungsbetrieb häufen sich Kundenbeschwerden über lange Wartezeiten an der Kasse am Samstagvormittag. Die Filialleitung beauftragt ein Team aus fünf Auszubildenden, Vorschläge zu erarbeiten. Du bist die Teamleitung.<\/div><p><b>Schritt 1: Ziel?<\/b> Nicht „Es soll schneller gehen“, sondern zum Beispiel: „Bis zum 30. April liegen drei umsetzbare Vorschläge vor, wie die Wartezeit an der Kasse am Samstagvormittag verkürzt werden kann.“ Ein eindeutiges Ziel ist die erste Voraussetzung.<\/p><p><b>Schritt 2: Wen nehme ich ins Team?<\/b> Fachlich geeignete und motivierte Leute, deren Fähigkeiten sich ergänzen: jemand von der Kasse, jemand aus dem Verkauf, jemand, der gut rechnet, jemand, der gut präsentiert.<\/p><p><b>Schritt 3: Vor der Sitzung:<\/b> Termin abstimmen, Tagesordnung mit Zeitrahmen aufstellen, Informationsmaterial beschaffen (zum Beispiel Kundenzahlen pro Stunde), Raum reservieren, Einladung verschicken.<\/p><p><b>Schritt 4: Beginn:<\/b> Begrüßung, kurze Einführung, Protokollführung bestimmen, Gesprächsregeln erläutern. Erst dann geht es in die Sache.<\/p><p><b>Schritt 5: Ende:<\/b> Gesamtergebnis feststellen, Stimmungsbild einholen, Raum aufgeräumt verlassen.<\/p><div class=\"box merke\"><b>Ergebnis:<\/b> Die halbe Sitzung entscheidet sich vorher: eindeutiges Ziel, passendes Team, Tagesordnung mit Zeitrahmen, Material für alle.<\/div>","vi":"Ví dụ mẫu: khách phàn nàn chờ lâu ở quầy thu ngân sáng thứ Bảy; em là trưởng nhóm. Bước 1: mục tiêu rõ ràng (ví dụ ba đề xuất trước ngày 30/4). Bước 2: chọn người phù hợp, bổ sung cho nhau. Bước 3: chuẩn bị (thời gian, chương trình, tài liệu, phòng, thư mời). Bước 4: bắt đầu bằng chào hỏi, giới thiệu, người ghi biên bản, quy tắc. Bước 5: kết thúc bằng tổng kết và Stimmungsbild."},{"id":"a3","no":"Aufgabe 3","type":"table","pts":1,"title":"Geführte Übung","instr":{"de":"Entscheide jeweils: Welche Voraussetzung oder welche Regel ist verletzt oder fehlt?","vi":"Em quyết định: điều kiện hoặc quy tắc nào bị vi phạm hoặc còn thiếu?"},"tip":{"de":"Wer entscheidet in einem Team? Welche der vier Gesprächsregeln passt? Das Buch hat einen eigenen Begriff für „beim Thema bleiben“. Was gehört ans Ende jeder Sitzung?","vi":"Ai quyết định trong một nhóm? Quy tắc nào trong bốn quy tắc phù hợp? Sách có một thuật ngữ riêng cho “bám sát chủ đề”. Điều gì thuộc về cuối mỗi buổi họp?"},"cols":["Fall","Was ist verletzt oder fehlt?"],"colOpts":[null,["Alle Entscheidungen werden gemeinsam beschlossen","Keine übermäßigen Redeanteile eines Einzelnen","Themenzentriert führen, Abschweifungen vermeiden","Gesamtergebnis als Abschluss feststellen","Ausreden lassen und zuhören","Einladung mit Tagesordnung verschicken"]],"rows":[["1. Die Teamleiterin sagt: „Wir machen das jetzt so, ich habe mich entschieden.“",{"a":"Alle Entscheidungen werden gemeinsam beschlossen","why":{"de":"Besser: Vorschlag einbringen, diskutieren, gemeinsam entscheiden.","vi":"Tốt hơn: đưa ra đề xuất, thảo luận, cùng quyết định."}}],["2. Ein Teilnehmer redet 20 der 45 Minuten, zwei andere sagen gar nichts.",{"a":"Keine übermäßigen Redeanteile eines Einzelnen","why":{"de":"Die Teamleitung muss das Rederecht zuteilen und den Zeitrahmen einhalten.","vi":"Trưởng nhóm phải phân bổ quyền phát biểu và giữ khung thời gian."}}],["3. Nach 15 Minuten redet das Team über den letzten Betriebsausflug.",{"a":"Themenzentriert führen, Abschweifungen vermeiden","why":{"de":"Die Teamleitung muss Abschweifungen vermeiden und zum Thema zurückführen.","vi":"Trưởng nhóm phải tránh lạc đề và đưa mọi người quay lại chủ đề."}}],["4. Am Ende der Sitzung gehen alle, ohne dass festgehalten wurde, was beschlossen wurde.",{"a":"Gesamtergebnis als Abschluss feststellen","why":{"de":"Ohne Gesamtergebnis fehlt auch die Grundlage für das Protokoll.","vi":"Không có kết quả tổng kết thì cũng không có cơ sở cho biên bản."}}]]},{"id":"a4","no":"Aufgabe 4","type":"free","pts":1,"title":"Freie Übung","instr":{"de":"Beantworte die Fragen in eigenen Worten.","vi":"Em trả lời các câu hỏi bằng lời của mình."},"tip":{"de":"Bei Frage 3 hilft die Merkhilfe: Ziel – Einzelne – Streit – Lösung – Vorstellen.","vi":"Câu 3: dùng gợi nhớ: mục tiêu – từng người – tranh luận – giải pháp – trình bày."},"parts":[{"q":"1. Definiere den Begriff Teamarbeit.","m":"Teamarbeit ist die Zusammenarbeit in einer Gruppe, um ein gemeinsames Ziel zu erreichen.","s":["Teamarbeit ist …"]},{"q":"2. Nenne vier Voraussetzungen einer guten Teamarbeit.","m":"Gemeinsames Ziel; eindeutig formuliertes Ziel; gemeinsame Entscheidungen; gegenseitige Unterstützung; der Teamleiter koordiniert und schlichtet; klare Regeln und Verantwortungsbereiche."},{"q":"3. Nenne die fünf Phasen der Teamarbeit in der richtigen Reihenfolge.","m":"Zielvereinbarung – Einzelbeiträge der Teammitglieder – Diskussion über einzelne Lösungsansätze – Entwickeln einer gemeinsamen Lösung – Präsentation."},{"q":"4. Welche Verantwortung trägt die Teamleitung?","m":"Eine besondere Verantwortung für sachgerechte Arbeitsabläufe und eine konstruktive Arbeitsatmosphäre; außerdem koordiniert sie die Arbeit und schlichtet Konflikte."},{"q":"5. Nenne vier Aufgaben, die vor einer Teamsitzung zu erledigen sind.","m":"Termin abstimmen; Thematik formulieren und Tagesordnung mit Zeitrahmen aufstellen; Informationsmaterial beschaffen; Besprechungsraum reservieren und ausstatten; Einladung mit Tagesordnung und Material verschicken."},{"q":"6. Erkläre, wie ein Stimmungsbild mit Klebepunkten funktioniert und wozu es dient.","m":"Die Teilnehmer setzen farbige Klebepunkte zu Smilies auf ein Flipchart-Plakat. Bei mehreren Sitzungen wechselt die Farbe, sodass die Veränderung im Zeitablauf sichtbar wird. Es gibt den Impuls für ein mündliches Feedback und hilft der Teamleitung, Gesprächsatmosphäre und Arbeitsmotivation zu verbessern.","s":["Die Teilnehmer setzen …","Es dient dazu, …"]}]},{"id":"a5","no":"Aufgabe 5","type":"info","title":"Die Teamsitzung (5 Punkte, im Unterricht)","html":"<div class=\"box\">In der zweiten Doppelstunde führt ihr eine echte Teamsitzung durch: mit Teamleitung, Tagesordnung, Protokoll, Gesprächsregeln, Stimmungsbild und Präsentation. Das Material dazu steht im Dokument „LF5 Modul 11 – Teamsitzung“: Rollenkarten, Tagesordnung, Protokollvorlage, Beobachtungsbogen und Stimmungsposter. <a href=\"../LF5_M_11_Teamsitzung.pdf\" style=\"font-weight:700\">PDF öffnen<\/a><br>Für Selbstlernende wird daraus die Auswertung der Exkursion bzw. der Betriebserkundung, vorgestellt an einem der Stopps.<\/div>","vi":"Trong tiết học thứ hai, cả lớp tổ chức một buổi họp nhóm thật (trưởng nhóm, chương trình, biên bản, quy tắc, Stimmungsbild, thuyết trình). Tài liệu nằm trong tệp PDF “Teamsitzung”. Người tự học: đánh giá chuyến tham quan hoặc khảo sát cửa hàng và trình bày ở một trạm dừng."},{"id":"a6","no":"Aufgabe 6","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh."},"tip":{"de":"6.1: Wer mitentscheidet, setzt mit um. 6.2: Was fehlt, wenn ein Team schlecht arbeitet? 6.3: Dasselbe Plakat wird mehrfach benutzt.","vi":"6.1: ai cùng quyết định thì cùng thực hiện. 6.2: thiếu gì khi nhóm làm việc kém? 6.3: cùng một tấm áp phích được dùng nhiều lần."},"parts":[{"q":"6.1 Warum verlangt das Buch, dass alle Entscheidungen gemeinsam beschlossen werden – obwohl das länger dauert als eine Entscheidung der Teamleitung?","m":"Weil eine gemeinsam beschlossene Lösung auch gemeinsam getragen wird. Wer mitentschieden hat, setzt die Lösung mit um; wer überstimmt oder übergangen wurde, arbeitet oft dagegen. Die Zeit, die man beim Entscheiden verliert, gewinnt man bei der Umsetzung zurück."},{"q":"6.2 „Ein Team schafft bessere Ergebnisse als die Summe seiner Mitglieder.“ Nenne eine Situation, in der das nicht stimmt, und begründe.","m":"Zum Beispiel, wenn das Ziel unklar ist, eine Person alle Redeanteile an sich zieht oder niemand Verantwortung übernimmt. Dann kostet die Abstimmung mehr, als die verschiedenen Sichtweisen einbringen – das Ergebnis ist schlechter als das, was eine fachkundige Einzelperson erarbeitet hätte. Genau deshalb nennt das Buch die Voraussetzungen zuerst."},{"q":"6.3 Warum wechselt beim Stimmungsposter von Sitzung zu Sitzung die Farbe der Klebepunkte?","m":"Weil dasselbe Plakat immer wieder verwendet wird. Durch die wechselnden Farben bleibt sichtbar, welche Punkte aus welcher Sitzung stammen – so zeigt das Poster nicht nur die Stimmung von heute, sondern die Veränderung im Zeitablauf."}]},{"id":"s1","type":"info","title":"STOPP – Für Selbstlerner","html":"<div class=\"box merke\"><b>Pflicht-Stopp 4 · Generalprobe Fachgespräch.<\/b> Deine Lehrkraft spielt die Prüferin und stellt dir fünf Fragen aus dem Fachgespräch-Training (Module 1–11). Du antwortest frei, ohne Unterlagen. Danach schreibst du die Übungsklausur.<\/div>","vi":"Dừng lại (dành cho em tự học): Cô giáo đóng vai giám khảo và hỏi em năm câu từ phần luyện Fachgespräch (Modul 1–11). Em trả lời tự do, không xem tài liệu. Sau đó em làm bài thi thử."},{"id":"v1","level":"v","no":"Vertiefung 1","type":"free","pts":1,"title":"Warum ist das so?","instr":{"de":"Warum ist ein eindeutig formuliertes Ziel die erste Voraussetzung guter Teamarbeit? Vergleiche „Es soll schneller gehen“ mit einem Ziel, das Zahl und Termin nennt.","vi":"Tại sao mục tiêu được nêu rõ ràng là điều kiện đầu tiên của làm việc nhóm tốt? Hãy so sánh “Es soll schneller gehen” (cần nhanh hơn) với một mục tiêu có số lượng và thời hạn."},"tip":{"de":"Woran erkennt das Team, dass es das Ziel erreicht hat?","vi":"Nhóm nhận biết thế nào là đã đạt mục tiêu?"},"parts":[{"q":"Meine Begründung:","m":"Ein Ziel wie „Es soll schneller gehen“ ist unklar: Jeder versteht etwas anderes, und man kann nicht prüfen, ob es erreicht ist. Ein Ziel mit Zahl und Termin (zum Beispiel „bis zum 30. April drei umsetzbare Vorschläge“) ist eindeutig. Alle wissen, was sie tun sollen, und das Team erkennt, wann es fertig ist.","s":["Ein eindeutiges Ziel ist wichtig, weil …"]}]},{"id":"v2","level":"v","no":"Vertiefung 2","type":"free","pts":1,"title":"Begründe deine Entscheidung","instr":{"de":"Du bist Teamleitung und darfst fünf Auszubildende ins Team holen. Wen wählst du aus und warum? Beschreibe die Fähigkeiten, die sich ergänzen sollen.","vi":"Em là trưởng nhóm và được chọn năm học viên vào nhóm. Em chọn ai và vì sao? Hãy mô tả những khả năng cần bổ sung cho nhau."},"tip":{"de":"Denke an Aufgabe 2, Schritt 2: Wer kann was besonders gut?","vi":"Nghĩ đến Aufgabe 2, bước 2: ai giỏi việc gì?"},"parts":[{"q":"Meine Auswahl und meine Begründung:","m":"Mögliche Antwort: jemand von der Kasse (kennt die Abläufe), jemand aus dem Verkauf (kennt die Kunden), jemand, der gut rechnet (wertet Zahlen aus), jemand, der gut präsentiert, und jemand, der gut organisiert. Ein Team ist so zusammengesetzt, dass sich die Fähigkeiten gegenseitig ergänzen.","s":["Ich wähle …, weil …"]}]}]};
</script>
