<style>
:root{--fs:1;--ink:#1f2937;--mut:#5b6472;--bg:#f3f5fb;--card:#fff;--pri:#3b4cca;--pri2:#e8ebff;--ok:#1b8a4b;--okbg:#e3f6ea;--bad:#c0392b;--badbg:#fdeaea;--warn:#b7791f;--warnbg:#fff6dd;--vert:#7a3fb5;--vertbg:#f3eafc;--line:#d9deea}
*{box-sizing:border-box}html{font-size:calc(17px*var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55;overflow-wrap:anywhere}
button,select,input,textarea{font:inherit;color:inherit}

.crow .qt{flex:1 1 100%;font-weight:600;margin:0}.crow .in{width:10rem;text-align:right}.crow .u{font-weight:600}

.fpart{margin:.8rem 0}.fpart .qt{font-weight:600;margin:.2rem 0}

.model{background:var(--okbg);border-radius:12px;padding:.6rem .9rem;margin:.4rem 0}
.model .t{font-weight:700;color:var(--ok);font-size:.85rem}
.rate{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0}.rate button{flex:1 1 7rem}
.rate button.on{background:var(--pri);color:#fff}
.ok{background:var(--okbg)!important;outline:2px solid var(--ok)}.bad{background:var(--badbg)!important;outline:2px solid var(--bad)}
select.ok,.in.ok,select.bad,.in.bad{outline-offset:0}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}
.fb{margin-top:.5rem;font-weight:600}.fb.ok{background:none;outline:0;color:var(--ok)}.fb.bad{background:none;outline:0;color:var(--bad)}.fb.mid{color:var(--warn)}

.bottom{background:var(--card);border-radius:16px;padding:1rem 1.1rem;margin:1rem 0}

.score{font-size:2rem;font-weight:800;color:var(--pri)}
.ritem{border-top:1px solid var(--line);padding:.7rem 0}.ritem h4{margin:0 0 .3rem;display:flex;gap:.5rem;flex-wrap:wrap}

.ritem ul{margin:.2rem 0;padding-left:1.2rem}.ritem li{margin:.15rem 0}

.steps{background:#f1f4fb;border-radius:10px;padding:.4rem .8rem;margin:.3rem 0}.steps div{font-family:ui-monospace,Menlo,monospace;font-size:.9rem}

.hide{display:none!important}
@media(max-width:560px){.top{padding:.3rem .5rem}.top .row{gap:.3rem}.top .ttl{display:none}.pills button{min-height:44px;padding:.2rem .6rem;font-size:.8rem}.pills{border-width:1.5px}.fields{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}html{font-size:calc(16px*var(--fs))}}
.printonly{display:none}
@media print{
 body{background:#fff;font-size:11pt}.top,.card,.head .can,.bottom,.toast,.modal,.noprint,.head .fields{display:none!important}

}

<script>
const SHEET={"id":"M11","short":"LF 5 · Modul 11","title":"Modul 11 – Teamarbeit","sub":"Lernfeld 5 · Werben und den Verkauf fördern","can":[{"de":"Ich kann die Voraussetzungen für gute Teamarbeit nennen.","vi":"Em có thể nêu các điều kiện để làm việc nhóm (Teamarbeit) tốt.","tr":"Güçlü bir ekip çalışması (Teamarbeit) için gerekli koşulları sayabilirim.","ar":"أستطيع ذكر شروط العمل الجماعي الجيد (Teamarbeit).","ti":"ንጽቡቕ ዕዮ ጉጅለ (Teamarbeit) ዘድልዩ ኩነታት ክጠቅስ እኽእል እየ።","uk":"Я можу назвати умови для гарної командної роботи (Teamarbeit).","ru":"Я могу назвать условия хорошей командной работы (Teamarbeit).","es":"Puedo nombrar las condiciones para un buen trabajo en equipo (Teamarbeit).","pt":"Sei indicar as condições para um bom trabalho de equipa (Teamarbeit)."},{"de":"Ich kann die fünf Phasen einer Teamsitzung in der richtigen Reihenfolge nennen.","vi":"Em có thể nêu năm giai đoạn của Teamsitzung (buổi họp nhóm) theo đúng thứ tự.","tr":"Bir ekip toplantısının (Teamsitzung) beş aşamasını doğru sırayla sayabilirim.","ar":"أستطيع ذكر المراحل الخمس لاجتماع الفريق (Teamsitzung) بالترتيب الصحيح.","ti":"ሓሙሽተ ደረጃታት ኣኼባ ጉጅለ (Teamsitzung) ብትኽክለኛ ተኸተልታ ክጠቅስ እኽእል እየ።","uk":"Я можу назвати п'ять фаз засідання команди (Teamsitzung) у правильному порядку.","ru":"Я могу назвать пять фаз заседания команды (Teamsitzung) в правильном порядке.","es":"Puedo nombrar las cinco fases de una reunión de equipo (Teamsitzung) en el orden correcto.","pt":"Sei indicar as cinco fases de uma reunião de equipa (Teamsitzung) pela ordem correta."},{"de":"Ich kann eine Teamsitzung vorbereiten, die Gesprächsregeln einhalten und das Ergebnis vorstellen.","vi":"Em có thể chuẩn bị một buổi họp nhóm, giữ các Gesprächsregeln (quy tắc trò chuyện) và trình bày kết quả.","tr":"Bir ekip toplantısı hazırlayabilir, Gesprächsregeln'e (konuşma kuralları) uyabilir ve sonucu sunabilirim.","ar":"أستطيع تحضير اجتماع فريق، والالتزام بقواعد الحوار (Gesprächsregeln)، وعرض النتيجة.","ti":"ኣኼባ ጉጅለ ከዳሉ፣ ሕግታት ዋዕላ (Gesprächsregeln) ክሕሉ ከምኡውን ውጽኢቱ ከቕርብ እኽእል እየ።","uk":"Я можу підготувати засідання команди, дотримуватися Gesprächsregeln (правил розмови) і представити результат.","ru":"Я могу подготовить заседание команды, соблюдать Gesprächsregeln (правила разговора) и представить результат.","es":"Puedo preparar una reunión de equipo, respetar las Gesprächsregeln (reglas de conversación) y presentar el resultado.","pt":"Sei preparar uma reunião de equipa, cumprir as Gesprächsregeln (regras de conversa) e apresentar o resultado."}],"items":[{"id":"a1","no":"Aufgabe 1","type":"free","pts":1,"title":"Ankommen: Was weißt du noch?","instr":{"de":"Beantworte die Fragen aus dem Kopf. Nicht nachschlagen. Es geht darum, was hängengeblieben ist.","vi":"Hãy trả lời bằng trí nhớ, không tra cứu. Điều quan trọng là em còn nhớ được gì.","tr":"Soruları ezberden cevapla. Bakma. Önemli olan aklında ne kaldığıdır.","ar":"أجب عن الأسئلة من الذاكرة. لا تبحث في الكتاب. المهم هو ما بقي في ذهنك.","ti":"ነቲ ሕቶታት ካብ ተዘክሮኻ መልስ። ኣይትርኣይ። ኣገዳሲ እቲ ዝተሪፈካ እዩ።","uk":"Відповідай на запитання по пам'яті. Не підглядай. Важливо, що залишилося в голові.","ru":"Отвечай на вопросы по памяти. Не подглядывай. Важно, что осталось в голове.","es":"Responde las preguntas de memoria. No mires los apuntes. Lo importante es lo que te ha quedado.","pt":"Responde às perguntas de memória. Não consultes. O que importa é o que ficou na cabeça."},"tip":{"de":"Denke an Modul 10, 8 und 4 und an LF 3 und LF 4. Stichworte genügen.","vi":"Hãy nhớ lại Modul 10, 8 và 4, LF 3 và LF 4. Chỉ cần từ khóa.","tr":"Modul 10, 8 ve 4'ü, ayrıca LF 3 ve LF 4'ü hatırla. Anahtar kelimeler yeterli.","ar":"تذكّر Modul 10 و 8 و 4 وكذلك LF 3 و LF 4. تكفي الكلمات المفتاحية.","ti":"ንModul 10፣ 8 ን 4 ን LF 3 ን LF 4 ን ዘክር። ቁልፊ ቃላት ይኣክል።","uk":"Згадай Modul 10, 8 і 4 та LF 3 і LF 4. Достатньо ключових слів.","ru":"Вспомни Modul 10, 8 и 4, а также LF 3 и LF 4. Достаточно ключевых слов.","es":"Piensa en el Modul 10, 8 y 4 y en el LF 3 y el LF 4. Bastan palabras clave.","pt":"Pensa no Modul 10, 8 e 4 e no LF 3 e LF 4. Bastam palavras-chave."},"parts":[{"q":"1. Was ist der Unterschied zwischen Frachtführer und Spediteur?","m":"Der Frachtführer befördert das Gut selbst, der Spediteur besorgt die Versendung im eigenen Namen für fremde Rechnung."},{"q":"2. Nenne zwei unbare Zahlungsarten an der Kasse. (aus LF 3)","m":"Z. B. Girocard, Kreditkarte, Bezahlen mit dem Smartphone."},{"q":"3. Was verbietet das UWG bei der Werbung per E-Mail?","m":"Werbe-E-Mails ohne Einwilligung des Empfängers – das ist eine unzumutbare Belästigung."},{"q":"4. Was ist eine Zweitplatzierung? (aus LF 4)","m":"Die Ware steht zusätzlich an einem zweiten Platz, z. B. auf einer Aktionsfläche oder an der Kasse."},{"q":"5. Was ist ein Streugebiet?","m":"Das Gebiet, in dem die Werbemaßnahmen durchgeführt werden."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)","tr":"Wortspeicher (kelime deposu)","ar":"Wortspeicher (مخزن الكلمات)","ti":"Wortspeicher (መኽዘን ቃላት)","uk":"Wortspeicher (скарбничка слів)","ru":"Wortspeicher (копилка слов)","es":"Wortspeicher (almacén de palabras)","pt":"Wortspeicher (banco de palavras)"},"html":"<p>Teamarbeit · Teamleitung · gemeinsames Ziel · Zielvereinbarung · Einzelbeitrag · Lösungsansatz · Präsentation · Tagesordnung · Zeitrahmen · Protokoll · Verlaufsprotokoll · Ergebnisprotokoll · Gesprächsregeln · Rederecht · themenzentriert · Stimmungsbild · Feedback<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"Teamarbeit = làm việc nhóm · Teamleitung = trưởng nhóm · gemeinsames Ziel = mục tiêu chung · Zielvereinbarung = thỏa thuận mục tiêu · Einzelbeitrag = đóng góp cá nhân · Lösungsansatz = hướng giải quyết · Präsentation = thuyết trình · Tagesordnung = chương trình họp · Zeitrahmen = khung thời gian · Protokoll = biên bản · Verlaufsprotokoll = biên bản diễn biến · Ergebnisprotokoll = biên bản kết quả · Gesprächsregeln = quy окол · Verlaufsprotokoll = протокол перебігу · Ergebnisprotokoll = протокол результатів · Gesprächsregeln = правила розмови · Rederecht = право голосу · themenzentriert = зосереджено на темі · Stimmungsbild = картина настрою · Feedback = зворотний зв'язок","ru":"Teamarbeit = командная работа · Teamleitung = руководитель команды · gemeinsames Ziel = общая цель · Zielvereinbarung = договорённость о цели · Einzelbeitrag = вклад отдельного человека · Lösungsansatz = подход к решению · Präsentation = презентация · Tagesordnung = повестка дня · Zeitrahmen = временные рамки · Protokoll = протокол · Verlaufsprotokoll = протокол хода обсуждения · Ergebnisprotokoll = протокол результатов · Gesprächsregeln = правила разговора · Rederecht = право слова · themenzentriert = сосредоточенно на теме · Stimmungsbild = картина настроения · Feedback = обратная связь","es":"Teamarbeit = trabajo en equipo · Teamleitung = jefe/jefa de equipo · gemeinsames Ziel = objetivo común · Zielvereinbarung = acuerdo de objetivo · Einzelbeitrag = aportación individual · Lösungsansatz = propuesta de solución · Präsentation = presentación · Tagesordnung = orden del día · Zeitrahmen = marco de tiempo · Protokoll = acta · Verlaufsprotokoll = acta del desarrollo · Ergebnisprotokoll = acta de resultados · Gesprächsregeln = reglas de conversación · Rederecht = turno de palabra · themenzentriert = centrado en el tema · Stimmungsbild = panel del estado de ánimo · Feedback = retroalimentación","pt":"Teamarbeit = trabalho de equipa · Teamleitung = chefe de equipa · gemeinsames Ziel = objetivo comum · Zielvereinbarung = acordo de objetivo · Einzelbeitrag = contributo individual · Lösungsansatz = proposta de solução · Präsentation = apresentação · Tagesordnung = ordem de trabalhos · Zeitrahmen = limite de tempo · Protokoll = ata · Verlaufsprotokoll = ata do decurso · Ergebnisprotokoll = ata de resultados · Gesprächsregeln = regras de conversa · Rederecht = direito de palavra · themenzentriert = centrado no tema · Stimmungsbild = painel de disposição · Feedback = feedback"}},{"id":"r1","no":"Lesen 1","type":"read","title":"Was ist Teamarbeit?","instr":{"de":"Lies den Text. Tippe an: Was ist Teamarbeit? Wofür ist die Teamleitung verantwortlich?","vi":"Em đọc đoạn văn. Chạm vào: Teamarbeit là gì? Trưởng nhóm chịu trách nhiệm về điều gì?","tr":"Metni oku. Dokun: Teamarbeit nedir? Teamleitung neyden sorumludur?","ar":"اقرأ النص. المس الجواب: ما هو العمل الجماعي (Teamarbeit)؟ عن ماذا يكون قائد الفريق (Teamleitung) مسؤولاً؟","ti":"እቲ ጽሑፍ ኣንብብ። ተንከፍ: Teamarbeit እንታይ እዩ? Teamleitung ብእንታይ ተሓታቲ እያ?","uk":"Прочитай текст. Торкнися: Що таке Teamarbeit? За що відповідає Teamleitung?","ru":"Прочитай текст. Коснись: Что такое Teamarbeit? За что отвечает Teamleitung?","es":"Lee el texto. Toca: ¿Qué es Teamarbeit? ¿De qué es responsable la Teamleitung?","pt":"Lê o texto. Toca: O que é Teamarbeit? De que é responsável a Teamleitung?"},"tip":{"de":"Suche das Wort „Ziel“ und die zwei Dinge, für die die Teamleitung verantwortlich ist.","vi":"Tìm từ “Ziel” (mục tiêu) và hai điều mà trưởng nhóm chịu trách nhiệm.","tr":"„Ziel“ (hedef) kelimesini ve Teamleitung'un sorumlu olduğu iki şeyi bul.","ar":"ابحث عن كلمة „Ziel“ (الهدف) وعن الشيئين اللذين يكون قائد الفريق مسؤولاً عنهما.","ti":"ቃል „Ziel“ (ዕላማ) ን እቲ Teamleitung ተሓታቲ ዝኾነትሉ ክልተ ነገራትን ድለ።","uk":"Знайди слово „Ziel“ (мета) і дві речі, за які відповідає Teamleitung.","ru":"Найди слово „Ziel“ (цель) и две вещи, за которые отвечает Teamleitung.","es":"Busca la palabra „Ziel“ (objetivo) y las dos cosas de las que es responsable la Teamleitung.","pt":"Procura a palavra „Ziel“ (objetivo) e as duas coisas de que a Teamleitung é responsável."},"paras":["Teamarbeit ist die [[Zusammenarbeit]] in einer Gruppe, um ein [[gemeinsames Ziel]] zu erreichen. Bei der Teamarbeit trägt die Teamleitung eine besondere Verantwortung für sachgerechte [[Arbeitsabläufe]] und eine konstruktive [[Arbeitsatmosphäre]]."],"vi":"Tóm tắt: Teamarbeit = làm việc cùng nhau trong một nhóm để đạt mục tiêu chung. Trưởng nhóm chịu trách nhiệm đặc biệt về quy trình làm việc hợp lý và bầu không khí tích cực.","quiz":{"q":"Was braucht ein Team als Erstes?","o":["Ein gemeinsames, eindeutig formuliertes Ziel","Einen schnellen Chef","Möglichst viele Mitglieder"],"a":0,"why":{"de":"Voraussetzung Nummer 1: ein gemeinsames Ziel, das eindeutig formuliert ist.","vi":"Điều kiện số 1: một mục tiêu chung được nêu rõ ràng.","tr":"Koşul numarası 1: net biçimde ifade edilmiş ortak bir hedef (Ziel).","ar":"الشرط رقم 1: هدف مشترك مصاغ بوضوح.","ti":"ኩነት ቁጽሪ 1: ብንጹር ዝተገልጸ ሓባራዊ ዕላማ።","uk":"Умова номер 1: спільна мета, сформульована чітко.","ru":"Условие номер 1: общая цель, сформулированная чётко.","es":"Condición número 1: un objetivo común formulado con claridad.","pt":"Condição número 1: um objetivo comum formulado com clareza."}},"sum":{"tr":"Özet: Teamarbeit = ortak bir hedefe ulaşmak için bir grupta birlikte çalışmaktır. Teamleitung, mantıklı iş akışlarından ve olumlu bir çalışma ortamından özellikle sorumludur.","ar":"ملخص: Teamarbeit = العمل معاً في فريق لتحقيق هدف مشترك. يتحمل قائد الفريق مسؤولية خاصة عن سير العمل بشكل سليم وعن أجواء عمل إيجابية.","ti":"ማጠቃለሊ: Teamarbeit = ሓባራዊ ዕላማ ንምብጻሕ ኣብ ጉጅለ ብሓባር ምስራሕ። Teamleitung ንቅኑዕ ኣካይዳ ዕዮን ጽቡቕ ኣየር ዕዮን ፍሉይ ሓላፍነት ኣለዋ።","uk":"Підсумок: Teamarbeit = спільна робота в групі для досягнення спільної мети. Керівник команди особливо відповідає за розумний порядок роботи та позитивну атмосферу.","ru":"Кратко: Teamarbeit = работа вместе в группе для достижения общей цели. Руководитель команды особенно отвечает за разумный порядок работы и положительную атмосферу.","es":"Resumen: Teamarbeit = trabajar juntos en un grupo para lograr un objetivo común. La Teamleitung es responsable en especial de un desarrollo del trabajo sensato y de un ambiente positivo.","pt":"Resumo: Teamarbeit = trabalhar em conjunto num grupo para atingir um objetivo comum. A Teamleitung é responsável em especial por um decurso do trabalho sensato e por um ambiente positivo."}},{"id":"w2","type":"info","title":{"de":"Voraussetzungen und fünf Phasen","vi":"Điều kiện và năm giai đoạn","tr":"Koşullar ve beş aşama","ar":"الشروط والمراحل الخمس","ti":"ኩነታትን ሓሙሽተ ደረጃታትን","uk":"Умови та п'ять фаз","ru":"Условия и пять фаз","es":"Condiciones y cinco fases","pt":"Condições e cinco fases"},"html":"<p><b>Voraussetzungen einer guten Teamarbeit:<\/b><br>✓ Das Team hat ein gemeinsames Ziel.<br>✓ Das Ziel ist eindeutig formuliert.<br>✓ Alle Entscheidungen werden gemeinsam beschlossen.<br>✓ Die Teammitglieder unterstützen sich gegenseitig, im Notfall ersetzen sie sich.<br>✓ Der Teamleiter koordiniert die Arbeit und schlichtet Konflikte.<br>✓ Das Team gibt sich klare Regeln und ordnet Verantwortungsbereiche zu.<\/p><p><b>Die fünf Phasen der Teamarbeit:<\/b><br>1. Zielvereinbarung: Das Team einigt sich auf ein gemeinsames Ziel. Alle müssen zustimmen.<br>2. Einzelbeiträge der Teammitglieder: Jeder bringt sein Wissen und seine Erfahrung ein.<br>3. Diskussion über einzelne Lösungsansätze: Stärken und Schwächen werden untersucht.<br>4. Entwickeln einer gemeinsamen Lösung: Ideen werden zusammengefasst und geordnet.<br>5. Präsentation: Die Lösung wird vorgestellt.<\/p><div class=\"box merke\"><b>Merkhilfe:<\/b> erst das Ziel, dann die Einzelnen, dann der Streit über die Vorschläge, dann die gemeinsame Lösung, zum Schluss das Vorstellen.<\/div>","vi":"Điều kiện: mục tiêu chung và rõ ràng; quyết định chung; hỗ trợ nhau; trưởng nhóm điều phối và hòa giải; có quy tắc rõ ràng. Năm giai đoạn: 1. thỏa thuận mục tiêu, 2. mỗi người đóng góp, 3. thảo luận các hướng giải quyết, 4. xây dựng giải pháp chung, 5. thuyết trình.","sum":{"tr":"Koşullar: ortak ve net hedef; ortak kararlar; birbirine destek; ekip lideri işi koordine eder ve uzlaştırır; net kurallar. Beş aşama: 1. Zielvereinbarung (hedef anlaşması), 2. herkes katkı sunar, 3. çözüm yaklaşımları tartışılır, 4. ortak çözüm geliştirilir, 5. Präsentation (sunum).","ar":"الشروط: هدف مشترك وواضح؛ قرارات مشتركة؛ دعم متبادل؛ قائد الفريق ينسّق ويحلّ الخلافات؛ قواعد واضحة. المراحل الخمس: 1. Zielvereinbarung (الاتفاق على الهدف)، 2. يساهم كل فرد، 3. مناقشة مقاربات الحل، 4. بناء حل مشترك، 5. Präsentation (العرض).","ti":"ኩነታት: ሓባራዊን ንጹርን ዕላማ፣ ሓባራዊ ውሳኔታት፣ ነንሕድሕድካ ምድጋፍ፣ መራሒ ጉጅለ ዕዮ የወሃሃድን ግጭት የስላሕን፣ ንጹር ሕግታት። ሓሙሽተ ደረጃታት: 1. Zielvereinbarung (ስምምዕ ዕላማ)፣ 2. ነፍሲ ወከፍ ይወፍር፣ 3. መገድታት ፍታሕ ይዛተ፣ 4. ሓባራዊ ፍታሕ ይሰራሕ፣ 5. Präsentation (ምቕራብ)።","uk":"Умови: спільна й чітка мета; спільні рішення; підтримка одне одного; керівник команди координує й мирить; чіткі правила. П'ять фаз: 1. Zielvereinbarung (домовленість про мету), 2. кожен робить свій внесок, 3. обговорення підходів до розв'язання, 4. розробка спільного рішення, 5. Präsentation (презентація).","ru":"Условия: общая и чёткая цель; совместные решения; поддержка друг друга; руководитель команды координирует и мирит; чёткие правила. Пять фаз: 1. Zielvereinbarung (договорённость о цели), 2. каждый вносит свой вклад, 3. обсуждение подходов к решению, 4. разработка общего решения, 5. Präsentation (презентация).","es":"Condiciones: objetivo común y claro; decisiones en común; apoyo mutuo; la Teamleitung coordina y media; reglas claras. Cinco fases: 1. Zielvereinbarung (acuerdo de objetivo), 2. cada persona aporta, 3. discusión de las propuestas de solución, 4. desarrollo de una solución común, 5. Präsentation (presentación).","pt":"Condições: objetivo comum e claro; decisões em conjunto; apoio mútuo; a Teamleitung coordena e medeia; regras claras. Cinco fases: 1. Zielvereinbarung (acordo de objetivo), 2. cada pessoa contribui, 3. discussão das propostas de solução, 4. desenvolvimento de uma solução comum, 5. Präsentation (apresentação)."}},{"id":"m1","no":"Übung 1","type":"match","pts":0,"title":"Die fünf Phasen in die richtige Reihenfolge bringen","instr":{"de":"Welche Phase ist das? Ordne jedem Schritt die richtige Phase zu.","vi":"Đây là giai đoạn nào? Em ghép mỗi bước với giai đoạn đúng.","tr":"Bu hangi aşama? Her adımı doğru aşamayla eşleştir.","ar":"أي مرحلة هذه؟ طابق كل خطوة مع المرحلة الصحيحة.","ti":"እዚ ኣየናይ ደረጃ እዩ? ነፍሲ ወከፍ ስጉምቲ ምስ ቅኑዕ ደረጃ ኣዛምድ።","uk":"Яка це фаза? Поєднай кожен крок із правильною фазою.","ru":"Что это за фаза? Подбери к каждому шагу правильную фазу.","es":"¿Qué fase es? Une cada paso con la fase correcta.","pt":"Que fase é esta? Liga cada passo à fase certa."},"tip":{"de":"Merkhilfe: erst das Ziel, dann die Einzelnen, dann der Streit, dann die gemeinsame Lösung, zum Schluss das Vorstellen.","vi":"Gợi nhớ: trước hết mục tiêu, rồi từng người, rồi tranh luận, rồi giải pháp chung, cuối cùng là trình bày.","tr":"Hatırlama ipucu: önce hedef, sonra tek tek kişiler, sonra tartışma, sonra ortak çözüm, en sonda sunum.","ar":"للتذكّر: أولاً الهدف، ثم الأفراد، ثم النقاش، ثم الحل المشترك، وأخيراً العرض.","ti":"መዘኻኸሪ: ቅድም ዕላማ፣ ድሕሪኡ ነናይ ሰብ፣ ድሕሪኡ ክትዕ፣ ድሕሪኡ ሓባራዊ ፍታሕ፣ ኣብ መወዳእታ ምቕራብ።","uk":"Підказка: спочатку мета, потім окремі люди, потім суперечка, потім спільне рішення, наприкінці презентація.","ru":"Подсказка: сначала цель, потом отдельные люди, потом спор, потом общее решение, в конце презентация.","es":"Truco para recordar: primero el objetivo, luego cada persona, luego la discusión, luego la solución común y al final la presentación.","pt":"Truque para memorizar: primeiro o objetivo, depois cada pessoa, depois a discussão, depois a solução comum e, no fim, a apresentação."},"rows":[{"l":"Präsentation","a":"Phase 5"},{"l":"Zielvereinbarung","a":"Phase 1"},{"l":"Entwickeln einer gemeinsamen Lösung","a":"Phase 4"},{"l":"Einzelbeiträge der Teammitglieder","a":"Phase 2"},{"l":"Diskussion über einzelne Lösungsansätze","a":"Phase 3"}]},{"id":"w3","type":"info","title":{"de":"Eine Teamsitzung organisieren","vi":"Tổ chức một buổi họp nhóm","tr":"Bir ekip toplantısı düzenlemek","ar":"تنظيم اجتماع فريق","ti":"ኣኼባ ጉጅለ ምውዳብ","uk":"Організувати засідання команди","ru":"Организовать заседание команды","es":"Organizar una reunión de equipo","pt":"Organizar uma reunião de equipa"},"html":"<p><b>Die sechs Schritte:<\/b><br>1. Thema festlegen (Grundlage ist ein Informationsbedarf, zum Beispiel Kundenbeschwerden).<br>2. Team bilden (fachlich geeignet, motiviert, passen zusammen).<br>3. Sitzung vorbereiten: Termin abstimmen · Tagesordnung mit Zeitrahmen · Informationsmaterial beschaffen · Raum reservieren und ausstatten · Einladung mit Tagesordnung und Material verschicken.<br>4. Sitzung durchführen: Begrüßung · kurze Einführung zu Zweck und Ziel · Protokollführung und Protokollart festlegen (Verlaufs- oder Ergebnisprotokoll) · Gesprächsregeln festlegen · Rederecht zuteilen, Zeitrahmen einhalten · themenzentriert führen · Zwischenergebnisse festhalten, Gesamtergebnis feststellen · Raum aufgeräumt verlassen.<br>5. Sitzung abschließen: Meinung zum Ablauf, Änderungswünsche.<br>6. Ergebnisse präsentieren (Präsentationsregeln aus Lernfeld 1).<\/p><div class=\"box merke\"><b>Die vier Gesprächsregeln:<\/b> freie Meinungsäußerung · ausreden lassen und zuhören · respektvoller Umgang miteinander · keine übermäßigen Redeanteile eines Einzelnen<\/div><p><b>Das Stimmungsbild:<\/b> Die Teilnehmer setzen farbige Klebepunkte auf ein Flipchart-Plakat mit Smilies. Bei mehreren Sitzungen wechselt die Farbe. So wird die Veränderung im Zeitablauf sichtbar. Das gibt einen Impuls für ein mündliches Feedback.<\/p>","vi":"Sáu bước: 1. chọn chủ đề, 2. lập nhóm, 3. chuẩn bị buổi họp (thời gian, chương trình, tài liệu, phòng, thư mời), 4. tiến hành họp, 5. kết thúc họp, 6. trình bày kết quả. Bốn quy tắc trò chuyện: tự do bày tỏ ý kiến; để người khác nói hết và lắng nghe; tôn trọng nhau; không ai nói quá nhiều. Stimmungsbild = dán chấm màu lên tấm áp phích có hình mặt cười để thể hiện tâm trạng.","sum":{"tr":"Altı adım: 1. konuyu belirle, 2. ekibi kur, 3. toplantıyı hazırla (tarih, Tagesordnung, malzeme, oda, davet), 4. toplantıyı yürüt, 5. toplantıyı bitir, 6. sonuçları sun. Dört Gesprächsregeln: fikrini özgürce söyle; başkasını sonuna kadar dinle; birbirinize saygı göster; hiç kimse çok fazla konuşmasın. Stimmungsbild = ruh halini göstermek için gülen yüzlü bir posterin üzerine renkli çıkartma yapıştırmak.","ar":"ست خطوات: 1. تحديد الموضوع، 2. تشكيل الفريق، 3. تحضير الاجتماع (الموعد، Tagesordnung، المواد، القاعة، الدعوة)، 4. إجراء الاجتماع، 5. إنهاء الاجتماع، 6. عرض النتائج. أربع قواعد للحوار: حرية التعبير عن الرأي؛ ترك الآخرين يكملون كلامهم والاستماع إليهم؛ احترام بعضنا بعضاً؛ ألا يتكلم أحد أكثر من اللازم. Stimmungsbild = لصق نقاط ملونة على ملصق عليه وجوه مبتسمة للتعبير عن المزاج.","ti":"ሽዱሽተ ስጉምትታት: 1. ኣርእስቲ ምምራጽ፣ 2. ጉጅለ ምቛም፣ 3. ኣኼባ ምድላው (ዕለት፣ Tagesordnung፣ መሳሪሒ፣ ክፍሊ፣ ዕድማ)፣ 4. ኣኼባ ምክያድ፣ 5. ኣኼባ ምዝዛም፣ 6. ውጽኢት ምቕራብ። ኣርባዕተ ሕግታት ዋዕላ: ሓሳብካ ብነጻ ምግላጽ፤ ሰባት ከዛርቡ ምብዳህን ምስማዕን፤ ነንሕድሕድ ምኽባር፤ ሓደ ሰብ ብዙሕ ከይዛረብ። Stimmungsbild = ስምዒት ንምርኣይ ኣብ ፖስተር ስእሊ ሰብ ዝስሓቕ ዘለዎ ቀለማት ዘለዎ ነጥቢታት ምጥባቅ።","uk":"Шість кроків: 1. обрати тему, 2. створити команду, 3. підготувати засідання (дата, Tagesordnung, матеріали, кімната, запрошення), 4. провести засідання, 5. завершити засідання, 6. представити результати. Чотири правила розмови: вільно висловлювати думку; давати договорити й слухати; поважати одне одного; ніхто не говорить надто багато. Stimmungsbild = наклеювання кольорових крапок на плакат зі смайликами, щоб показати настрій.","ru":"Шесть шагов: 1. выбрать тему, 2. создать команду, 3. подготовить заседание (дата, Tagesordnung, материалы, помещение, приглашение), 4. провести заседание, 5. завершить заседание, 6. представить результаты. Четыре правила разговора: свободно высказывать мнение; дать договорить и слушать; уважать друг друга; никто не говорит слишком много. Stimmungsbild = наклеивание цветных точек на плакат со смайликами, чтобы показать настроение.","es":"Seis pasos: 1. elegir el tema, 2. formar el equipo, 3. preparar la reunión (fecha, Tagesordnung, material, sala, invitación), 4. realizar la reunión, 5. cerrar la reunión, 6. presentar los resultados. Cuatro reglas de conversación: expresar la opinión libremente; dejar terminar y escuchar; tratarse con respeto; nadie habla demasiado. Stimmungsbild = pegar puntos de colores en un cartel con caritas para mostrar el estado de ánimo.","pt":"Seis passos: 1. escolher o tema, 2. formar a equipa, 3. preparar a reunião (data, Tagesordnung, material, sala, convite), 4. realizar a reunião, 5. encerrar a reunião, 6. apresentar os resultados. Quatro regras de conversa: exprimir a opinião livremente; deixar terminar e ouvir; tratar-se com respeito; ninguém fala demasiado. Stimmungsbild = colar pontos coloridos num cartaz com smiles para mostrar a disposição."}},{"id":"t1","no":"Lesen 2","type":"tf","pts":0,"title":"Richtig oder falsch?","instr":{"de":"Entscheide: Ist die Aussage richtig oder falsch?","vi":"Em quyết định: câu này đúng hay sai?","tr":"Karar ver: İfade doğru mu yanlış mı?","ar":"قرّر: هل العبارة صحيحة أم خاطئة؟","ti":"ውሰን: እዚ ሓሳብ ቅኑዕ ድዩ ጌጋ?","uk":"Вирішуй: твердження правильне чи неправильне?","ru":"Реши: утверждение верное или неверное?","es":"Decide: ¿la afirmación es verdadera o falsa?","pt":"Decide: a afirmação é verdadeira ou falsa?"},"tip":{"de":"Lies noch einmal die vier Gesprächsregeln und die Voraussetzungen.","vi":"Đọc lại bốn quy tắc trò chuyện và các điều kiện.","tr":"Dört Gesprächsregeln'i (konuşma kuralları) ve koşulları bir kez daha oku.","ar":"اقرأ مرة أخرى قواعد الحوار الأربع (Gesprächsregeln) والشروط.","ti":"ኣርባዕተ ሕግታት ዋዕላ (Gesprächsregeln) ን እቲ ኩነታትን ዳግም ኣንብብ።","uk":"Ще раз прочитай чотири Gesprächsregeln (правила розмови) та умови.","ru":"Ещё раз прочитай четыре Gesprächsregeln (правила разговора) и условия.","es":"Lee otra vez las cuatro Gesprächsregeln (reglas de conversación) y las condiciones.","pt":"Lê outra vez as quatro Gesprächsregeln (regras de conversa) e as condições."},"st":[{"t":"In einem Team entscheidet allein die Teamleitung.","a":false,"why":{"de":"Alle Entscheidungen werden gemeinsam beschlossen.","vi":"Mọi quyết định đều được cả nhóm cùng quyết định.","tr":"Bütün kararlar birlikte alınır.","ar":"تُتَّخذ جميع القرارات بشكل مشترك.","ti":"ኩሎም ውሳኔታት ብሓባር ይውሰኑ።","uk":"Усі рішення ухвалюються спільно.","ru":"Все решения принимаются совместно.","es":"Todas las decisiones se toman en común.","pt":"Todas as decisões são tomadas em conjunto."}},{"t":"Zu den Gesprächsregeln gehört: ausreden lassen und zuhören.","a":true},{"t":"Das Stimmungsbild zeigt die Veränderung im Zeitablauf, wenn die Farbe der Klebepunkte wechselt.","a":true},{"t":"Eine Teamsitzung braucht keine Tagesordnung.","a":false,"why":{"de":"Zur Vorbereitung gehört eine Tagesordnung mit Zeitrahmen.","vi":"Chuẩn bị họp cần có chương trình họp kèm khung thời gian.","tr":"Hazırlığa zaman çerçevesi olan bir Tagesordnung (gündem) da dahildir.","ar":"يشمل التحضير جدول أعمال (Tagesordnung) مع إطار زمني.","ti":"ኣብ ዝግጅት ዝርዝር ኣጀንዳ (Tagesordnung) ምስ ግዜ ኣካል እዩ።","uk":"До підготовки належить Tagesordnung (порядок денний) із часовими рамками.","ru":"К подготовке относится Tagesordnung (повестка дня) с временными рамками.","es":"La preparación incluye una Tagesordnung (orden del día) con un marco de tiempo.","pt":"A preparação inclui uma Tagesordnung (ordem de trabalhos) com limite de tempo."}}]},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: Eine Sitzung vorbereiten","html":"<div class=\"box\"><b>Der Auftrag:<\/b> In deinem Ausbildungsbetrieb häufen sich Kundenbeschwerden über lange Wartezeiten an der Kasse am Samstagvormittag. Die Filialleitung beauftragt ein Team aus fünf Auszubildenden, Vorschläge zu erarbeiten. Du bist die Teamleitung.<\/div><p><b>Schritt 1: Ziel?<\/b> Nicht „Es soll schneller gehen“, sondern zum Beispiel: „Bis zum 30. April liegen drei umsetzbare Vorschläge vor, wie die Wartezeit an der Kasse am Samstagvormittag verkürzt werden kann.“ Ein eindeutiges Ziel ist die erste Voraussetzung.<\/p><p><b>Schritt 2: Wen nehme ich ins Team?<\/b> Fachlich geeignete und motivierte Leute, deren Fähigkeiten sich ergänzen: jemand von der Kasse, jemand aus dem Verkauf, jemand, der gut rechnet, jemand, der gut präsentiert.<\/p><p><b>Schritt 3: Vor der Sitzung:<\/b> Termin abstimmen, Tagesordnung mit Zeitrahmen aufstellen, Informationsmaterial beschaffen (zum Beispiel Kundenzahlen pro Stunde), Raum reservieren, Einladung verschicken.<\/p><p><b>Schritt 4: Beginn:<\/b> Begrüßung, kurze Einführung, Protokollführung bestimmen, Gesprächsregeln erläutern. Erst dann geht es in die Sache.<\/p><p><b>Schritt 5: Ende:<\/b> Gesamtergebnis feststellen, Stimmungsbild einholen, Raum aufgeräumt verlassen.<\/p><div class=\"box merke\"><b>Ergebnis:<\/b> Die halbe Sitzung entscheidet sich vorher: eindeutiges Ziel, passendes Team, Tagesordnung mit Zeitrahmen, Material für alle.<\/div>","vi":"Ví dụ mẫu: khách phàn nàn chờ lâu ở quầy thu ngân sáng thứ Bảy; em là trưởng nhóm. Bước 1: mục tiêu rõ ràng (ví dụ ba đề xuất trước ngày 30/4). Bước 2: chọn người phù hợp, bổ sung cho nhau. Bước 3: chuẩn bị (thời gian, chương trình, tài liệu, phòng, thư mời). Bước 4: bắt đầu bằng chào hỏi, giới thiệu, người ghi biên bản, quy tắc. Bước 5: kết thúc bằng tổng kết và Stimmungsbild.","sum":{"tr":"Örnek: Müşteriler cumartesi sabahı kasada uzun beklemekten şikâyet ediyor; sen Teamleitung'sun. Adım 1: net hedef (örneğin 30 Nisan'a kadar üç öneri). Adım 2: uygun, birbirini tamamlayan kişileri seç. Adım 3: hazırlık (tarih, Tagesordnung, malzeme, oda, davet). Adım 4: selamlama, giriş, tutanak tutacak kişi ve kurallarla başla. Adım 5: genel sonuç ve Stimmungsbild ile bitir.","ar":"مثال: يشتكي الزبائن من الانتظار الطويل عند الصندوق صباح السبت؛ أنت قائد الفريق. الخطوة 1: هدف واضح (مثلاً ثلاثة اقتراحات قبل 30/4). الخطوة 2: اختيار أشخاص مناسبين يكمّل بعضهم بعضاً. الخطوة 3: التحضير (الموعد، Tagesordnung، المواد، القاعة، الدعوة). الخطوة 4: البدء بالترحيب والمقدمة وتحديد كاتب المحضر والقواعد. الخطوة 5: الإنهاء بتحديد النتيجة العامة وStimmungsbild.","ti":"ኣብነት: ዓማዊል ቀዳም ንግሆ ኣብ ካሳ ነዊሕ ምጽባይ ይጥወቑ፤ ንስኻ Teamleitung ኢኻ። ስጉምቲ 1: ንጹር ዕላማ (ንኣብነት ክሳብ 30 ሚያዝያ ሰለስተ ሓሳባት)። ስጉምቲ 2: ንነንሕድሕዶም ዝመላኣኡ ግቡኣት ሰባት ምምራጽ። ስጉምቲ 3: ምድላው (ዕለት፣ Tagesordnung፣ መሳሪሒ፣ ክፍሊ፣ ዕድማ)። ስጉምቲ 4: ብሰላምታ፣ መእተዊ፣ ጸሓፊ ቃለ-ጉባኤን ሕግታትን ምጅማር። ስጉምቲ 5: ብሓፈሻዊ ውጽኢትን Stimmungsbild ምዝዛም።","uk":"Приклад: клієнти скаржаться на довге очікування біля каси в суботу зранку; ти — Teamleitung. Крок 1: чітка мета (наприклад, три пропозиції до 30 квітня). Крок 2: обрати відповідних людей, які доповнюють одне одного. Крок 3: підготовка (дата, Tagesordnung, матеріали, кімната, запрошення). Крок 4: почати з привітання, вступу, визначення того, хто веде протокол, і правил. Крок 5: завершити підбиттям загального результату та Stimmungsbild.","ru":"Пример: клиенты жалуются на долгое ожидание у кассы в субботу утром; ты — Teamleitung. Шаг 1: чёткая цель (например, три предложения до 30 апреля). Шаг 2: выбрать подходящих людей, которые дополняют друг друга. Шаг 3: подготовка (дата, Tagesordnung, материалы, помещение, приглашение). Шаг 4: начать с приветствия, вступления, выбора того, кто ведёт протокол, и правил. Шаг 5: завершить подведением общего результата и Stimmungsbild.","es":"Ejemplo: los clientes se quejan de la larga espera en la caja el sábado por la mañana; tú eres la Teamleitung. Paso 1: objetivo claro (por ejemplo, tres propuestas antes del 30 de abril). Paso 2: elegir personas adecuadas que se complementen. Paso 3: preparación (fecha, Tagesordnung, material, sala, invitación). Paso 4: empezar con el saludo, la introducción, quién lleva el acta y las reglas. Paso 5: terminar con el resultado global y el Stimmungsbild.","pt":"Exemplo: os clientes queixam-se da longa espera na caixa ao sábado de manhã; tu és a Teamleitung. Passo 1: objetivo claro (por exemplo, três propostas até 30 de abril). Passo 2: escolher pessoas adequadas que se complementem. Passo 3: preparação (data, Tagesordnung, material, sala, convite). Passo 4: começar com a saudação, a introdução, quem faz a ata e as regras. Passo 5: terminar com o resultado global e o Stimmungsbild."}},{"id":"a3","no":"Aufgabe 3","type":"table","pts":1,"title":"Geführte Übung","instr":{"de":"Entscheide jeweils: Welche Voraussetzung oder welche Regel ist verletzt oder fehlt?","vi":"Em quyết định: điều kiện hoặc quy tắc nào bị vi phạm hoặc còn thiếu?","tr":"Her seferinde karar ver: Hangi koşul veya hangi kural ihlal edilmiş ya da eksik?","ar":"قرّر في كل حالة: أي شرط أو أي قاعدة تم خرقها أو مفقودة؟","ti":"ንነፍሲ ወከፍ ውሰን: እንታይ ኩነት ወይ እንታይ ሕጊ ተጣሒሱ ወይ ጎዲሉ?","uk":"Щоразу вирішуй: яку умову чи яке правило порушено або бракує?","ru":"Каждый раз решай: какое условие или какое правило нарушено или отсутствует?","es":"Decide en cada caso: ¿qué condición o qué regla se ha incumplido o falta?","pt":"Decide em cada caso: que condição ou que regra foi violada ou está em falta?"},"tip":{"de":"Wer entscheidet in einem Team? Welche der vier Gesprächsregeln passt? Das Buch hat einen eigenen Begriff für „beim Thema bleiben“. Was gehört ans Ende jeder Sitzung?","vi":"Ai quyết định trong một nhóm? Quy tắc nào trong bốn quy tắc phù hợp? Sách có một thuật ngữ riêng cho “bám sát chủ đề”. Điều gì thuộc về cuối mỗi buổi họp?","tr":"Bir ekipte kim karar verir? Dört konuşma kuralından hangisi uyar? Kitapta „konudan ayrılmama“ için ayrı bir terim var. Her toplantının sonunda ne olmalı?","ar":"من يقرر في الفريق؟ أي قاعدة من قواعد الحوار الأربع تناسب؟ للكتاب مصطلح خاص لعبارة „البقاء في الموضوع“. ماذا يجب أن يكون في نهاية كل اجتماع؟","ti":"ኣብ ጉጅለ መን እዩ ዝውስን? ካብ ኣርባዕተ ሕግታት ዋዕላ ኣየናይ ይሰማማዕ? እቲ መጽሓፍ ን„ኣብ ኣርእስቲ ምጽናሕ“ ፍሉይ ቃል ኣለዎ። ኣብ መወዳእታ ነፍሲ ወከፍ ኣኼባ እንታይ ክህሉ ኣለዎ?","uk":"Хто вирішує в команді? Яке з чотирьох правил розмови підходить? У книжці є окремий термін для „триматися теми“. Що має бути наприкінці кожного засідання?","ru":"Кто принимает решения в команде? Какое из четырёх правил разговора подходит? В книге есть отдельный термин для „держаться темы“. Что должно быть в конце каждого заседания?","es":"¿Quién decide en un equipo? ¿Cuál de las cuatro reglas de conversación encaja? El libro tiene un término propio para „ceñirse al tema“. ¿Qué debe haber al final de cada reunión?","pt":"Quem decide numa equipa? Qual das quatro regras de conversa serve? O livro tem um termo próprio para „manter-se no tema“. O que deve haver no fim de cada reunião?"},"cols":["Fall","Was ist verletzt oder fehlt?"],"colOpts":[null,["Alle Entscheidungen werden gemeinsam beschlossen","Keine übermäßigen Redeanteile eines Einzelnen","Themenzentriert führen, Abschweifungen vermeiden","Gesamtergebnis als Abschluss feststellen","Ausreden lassen und zuhören","Einladung mit Tagesordnung verschicken"]],"rows":[["1. Die Teamleiterin sagt: „Wir machen das jetzt so, ich habe mich entschieden.“",{"a":"Alle Entscheidungen werden gemeinsam beschlossen","why":{"de":"Besser: Vorschlag einbringen, diskutieren, gemeinsam entscheiden.","vi":"Tốt hơn: đưa ra đề xuất, thảo luận, cùng quyết định.","tr":"Daha iyisi: öneri getir, tartış, birlikte karar ver.","ar":"الأفضل: تقديم اقتراح، ثم مناقشته، ثم اتخاذ القرار معاً.","ti":"ዝሓሸ: ሓሳብ የቕርብ፣ ይዛተ፣ ብሓባር ይውሰን።","uk":"Краще: внести пропозицію, обговорити, вирішити разом.","ru":"Лучше: внести предложение, обсудить, решить вместе.","es":"Mejor: presentar una propuesta, discutirla y decidir en común.","pt":"Melhor: apresentar uma proposta, discutir e decidir em conjunto."}}],["2. Ein Teilnehmer redet 20 der 45 Minuten, zwei andere sagen gar nichts.",{"a":"Keine übermäßigen Redeanteile eines Einzelnen","why":{"de":"Die Teamleitung muss das Rederecht zuteilen und den Zeitrahmen einhalten.","vi":"Trưởng nhóm phải phân bổ quyền phát biểu và giữ khung thời gian.","tr":"Teamleitung söz hakkını (Rederecht) dağıtmalı ve zaman çerçevesine (Zeitrahmen) uymalı.","ar":"على قائد الفريق (Teamleitung) أن يوزّع حق الكلام (Rederecht) وأن يلتزم بالإطار الزمني (Zeitrahmen).","ti":"Teamleitung መሰል ዘረባ (Rederecht) ክትዕድልን ግዜ (Zeitrahmen) ክትሕሉን ኣለዋ።","uk":"Teamleitung має розподіляти право голосу (Rederecht) і дотримуватися часових рамок (Zeitrahmen).","ru":"Teamleitung должна распределять право слова (Rederecht) и соблюдать временные рамки (Zeitrahmen).","es":"La Teamleitung debe repartir el turno de palabra (Rederecht) y respetar el marco de tiempo (Zeitrahmen).","pt":"A Teamleitung tem de distribuir o direito de palavra (Rederecht) e cumprir o limite de tempo (Zeitrahmen)."}}],["3. Nach 15 Minuten redet das Team über den letzten Betriebsausflug.",{"a":"Themenzentriert führen, Abschweifungen vermeiden","why":{"de":"Die Teamleitung muss Abschweifungen vermeiden und zum Thema zurückführen.","vi":"Trưởng nhóm phải tránh lạc đề và đưa mọi người quay lại chủ đề.","tr":"Teamleitung konudan sapmaları önlemeli ve konuya geri döndürmeli.","ar":"على قائد الفريق (Teamleitung) أن يمنع الخروج عن الموضوع وأن يعيد الجميع إلى الموضوع.","ti":"Teamleitung ካብ ኣርእስቲ ምርሓቕ ክትከላኸልን ንኹሉ ናብ ኣርእስቲ ክትመልስን ኣለዋ።","uk":"Teamleitung має уникати відхилень від теми й повертати всіх до теми.","ru":"Teamleitung должна избегать отклонений от темы и возвращать всех к теме.","es":"La Teamleitung debe evitar las desviaciones y devolver al grupo al tema.","pt":"A Teamleitung tem de evitar desvios e voltar a levar todos ao tema."}}],["4. Am Ende der Sitzung gehen alle, ohne dass festgehalten wurde, was beschlossen wurde.",{"a":"Gesamtergebnis als Abschluss feststellen","why":{"de":"Ohne Gesamtergebnis fehlt auch die Grundlage für das Protokoll.","vi":"Không có kết quả tổng kết thì cũng không có cơ sở cho biên bản.","tr":"Genel sonuç (Gesamtergebnis) yoksa Protokoll (tutanak) için de temel yoktur.","ar":"من دون نتيجة عامة (Gesamtergebnis) لا يوجد أساس للمحضر (Protokoll) أيضاً.","ti":"ብዘይ ሓፈሻዊ ውጽኢት (Gesamtergebnis) መሰረት ናይ ቃለ-ጉባኤ (Protokoll) እውን የለን።","uk":"Без загального результату (Gesamtergebnis) немає й основи для Protokoll (протоколу).","ru":"Без общего результата (Gesamtergebnis) нет и основы для Protokoll (протокола).","es":"Sin un resultado global (Gesamtergebnis) tampoco hay base para el Protokoll (acta).","pt":"Sem resultado global (Gesamtergebnis) também falta a base para o Protokoll (ata)."}}]]},{"id":"a4","no":"Aufgabe 4","type":"free","pts":1,"title":"Freie Übung","instr":{"de":"Beantworte die Fragen in eigenen Worten.","vi":"Em trả lời các câu hỏi bằng lời của mình.","tr":"Soruları kendi cümlelerinle cevapla.","ar":"أجب عن الأسئلة بكلماتك الخاصة.","ti":"ነቲ ሕቶታት ብናትካ ቃላት መልስ።","uk":"Відповідай на запитання своїми словами.","ru":"Отвечай на вопросы своими словами.","es":"Responde las preguntas con tus propias palabras.","pt":"Responde às perguntas com as tuas próprias palavras."},"tip":{"de":"Bei Frage 3 hilft die Merkhilfe: Ziel – Einzelne – Streit – Lösung – Vorstellen.","vi":"Câu 3: dùng gợi nhớ: mục tiêu – từng người – tranh luận – giải pháp – trình bày.","tr":"3. soruda hatırlama ipucu yardımcı olur: Hedef – Tek tek kişiler – Tartışma – Çözüm – Sunum.","ar":"في السؤال 3 تساعدك أداة التذكّر: الهدف – الأفراد – النقاش – الحل – العرض.","ti":"ኣብ ሕቶ 3 እቲ መዘኻኸሪ ይሕግዝ: ዕላማ – ነናይ ሰብ – ክትዕ – ፍታሕ – ምቕራብ።","uk":"У запитанні 3 допоможе підказка: мета – окремі люди – суперечка – рішення – презентація.","ru":"В вопросе 3 поможет подсказка: цель – отдельные люди – спор – решение – презентация.","es":"En la pregunta 3 te ayuda el truco: objetivo – cada persona – discusión – solución – presentación.","pt":"Na pergunta 3 ajuda o truque: objetivo – cada pessoa – discussão – solução – apresentação."},"parts":[{"q":"1. Definiere den Begriff Teamarbeit.","m":"Teamarbeit ist die Zusammenarbeit in einer Gruppe, um ein gemeinsames Ziel zu erreichen.","s":["Teamarbeit ist …"]},{"q":"2. Nenne vier Voraussetzungen einer guten Teamarbeit.","m":"Gemeinsames Ziel; eindeutig formuliertes Ziel; gemeinsame Entscheidungen; gegenseitige Unterstützung; der Teamleiter koordiniert und schlichtet; klare Regeln und Verantwortungsbereiche."},{"q":"3. Nenne die fünf Phasen der Teamarbeit in der richtigen Reihenfolge.","m":"Zielvereinbarung – Einzelbeiträge der Teammitglieder – Diskussion über einzelne Lösungsansätze – Entwickeln einer gemeinsamen Lösung – Präsentation."},{"q":"4. Welche Verantwortung trägt die Teamleitung?","m":"Eine besondere Verantwortung für sachgerechte Arbeitsabläufe und eine konstruktive Arbeitsatmosphäre; außerdem koordiniert sie die Arbeit und schlichtet Konflikte."},{"q":"5. Nenne vier Aufgaben, die vor einer Teamsitzung zu erledigen sind.","m":"Termin abstimmen; Thematik formulieren und Tagesordnung mit Zeitrahmen aufstellen; Informationsmaterial beschaffen; Besprechungsraum reservieren und ausstatten; Einladung mit Tagesordnung und Material verschicken."},{"q":"6. Erkläre, wie ein Stimmungsbild mit Klebepunkten funktioniert und wozu es dient.","m":"Die Teilnehmer setzen farbige Klebepunkte zu Smilies auf ein Flipchart-Plakat. Bei mehreren Sitzungen wechselt die Farbe, sodass die Veränderung im Zeitablauf sichtbar wird. Es gibt den Impuls für ein mündliches Feedback und hilft der Teamleitung, Gesprächsatmosphäre und Arbeitsmotivation zu verbessern.","s":["Die Teilnehmer setzen …","Es dient dazu, …"]}]},{"id":"a5","no":"Aufgabe 5","type":"info","title":"Die Teamsitzung (5 Punkte, im Unterricht)","html":"<div class=\"box\">In der zweiten Doppelstunde führt ihr eine echte Teamsitzung durch: mit Teamleitung, Tagesordnung, Protokoll, Gesprächsregeln, Stimmungsbild und Präsentation. Das Material dazu steht im Dokument „LF5 Modul 11 – Teamsitzung“: Rollenkarten, Tagesordnung, Protokollvorlage, Beobachtungsbogen und Stimmungsposter. <a href=\"../LF5_M_11_Teamsitzung.pdf\" style=\"font-weight:700\">PDF öffnen<\/a><br>Für Selbstlernende wird daraus die Auswertung der Exkursion bzw. der Betriebserkundung, vorgestellt an einem der Stopps.<\/div>","vi":"Trong tiết học thứ hai, cả lớp tổ chức một buổi họp nhóm thật (trưởng nhóm, chương trình, biên bản, quy tắc, Stimmungsbild, thuyết trình). Tài liệu nằm trong tệp PDF “Teamsitzung”. Người tự học: đánh giá chuyến tham quan hoặc khảo sát cửa hàng và trình bày ở một trạm dừng.","sum":{"tr":"İkinci ders saatinde sınıf gerçek bir ekip toplantısı yapar (Teamleitung, Tagesordnung, Protokoll, kurallar, Stimmungsbild, sunum). Malzeme „Teamsitzung“ PDF dosyasında. Kendi başına öğrenenler: gezinin veya mağaza incelemesinin değerlendirmesini yapıp bir durakta sunar.","ar":"في الحصة المزدوجة الثانية تُجرون اجتماع فريق حقيقياً (قائد الفريق، Tagesordnung، Protokoll، القواعد، Stimmungsbild، العرض). المواد موجودة في ملف PDF بعنوان „Teamsitzung“. للمتعلمين ذاتياً: تقييم الرحلة أو استطلاع المتجر وعرضه في إحدى المحطات.","ti":"ኣብ ካልኣይ ድርብ ትምህርቲ ሓቀኛ ኣኼባ ጉጅለ ተካይዱ (Teamleitung፣ Tagesordnung፣ Protokoll፣ ሕግታት፣ Stimmungsbild፣ ምቕራብ)። እቲ መሳሪሒ ኣብ PDF „Teamsitzung“ ኣሎ። ባዕሎም ዝመሃሩ: ንጉዕዞ ወይ ንምርኣይ ድኳን ገምግሙ ኣብ ሓደ ደው ዝበሉሉ ቦታ ኣቕርቡ።","uk":"На другому здвоєному занятті ви проводите справжнє засідання команди (Teamleitung, Tagesordnung, Protokoll, правила, Stimmungsbild, презентація). Матеріали — у PDF-файлі „Teamsitzung“. Для тих, хто вчиться самостійно: оцінити екскурсію або огляд магазину й представити на одній із зупинок.","ru":"На втором сдвоенном занятии вы проводите настоящее заседание команды (Teamleitung, Tagesordnung, Protokoll, правила, Stimmungsbild, презентация). Материалы — в PDF-файле „Teamsitzung“. Для тех, кто учится самостоятельно: оценить экскурсию или обзор магазина и представить на одной из остановок.","es":"En la segunda clase doble hacéis una reunión de equipo de verdad (Teamleitung, Tagesordnung, Protokoll, reglas, Stimmungsbild, presentación). El material está en el PDF „Teamsitzung“. Para quien estudia por su cuenta: evaluar la excursión o la visita a la tienda y presentarlo en una de las paradas.","pt":"Na segunda aula dupla fazem uma reunião de equipa a sério (Teamleitung, Tagesordnung, Protokoll, regras, Stimmungsbild, apresentação). O material está no PDF „Teamsitzung“. Para quem estuda sozinho: avaliar a excursão ou a visita à loja e apresentar numa das paragens."}},{"id":"a6","no":"Aufgabe 6","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh.","tr":"Soruları cevapla. Tam cümlelerle gerekçelendir.","ar":"أجب عن الأسئلة. اشرح السبب بجمل كاملة.","ti":"ነቲ ሕቶታት መልስ። ብምሉእ ሓረግ ምኽንያት ሃብ።","uk":"Відповідай на запитання. Обґрунтовуй повними реченнями.","ru":"Ответь на вопросы. Обоснуй полными предложениями.","es":"Responde las preguntas. Justifica con frases completas.","pt":"Responde às perguntas. Justifica com frases completas."},"tip":{"de":"6.1: Wer mitentscheidet, setzt mit um. 6.2: Was fehlt, wenn ein Team schlecht arbeitet? 6.3: Dasselbe Plakat wird mehrfach benutzt.","vi":"6.1: ai cùng quyết định thì cùng thực hiện. 6.2: thiếu gì khi nhóm làm việc kém? 6.3: cùng một tấm áp phích được dùng nhiều lần.","tr":"6.1: Birlikte karar veren, uygulamaya da katılır. 6.2: Bir ekip kötü çalışıyorsa ne eksiktir? 6.3: Aynı poster birden çok kez kullanılıyor.","ar":"6.1: من يشارك في القرار يشارك في التنفيذ. 6.2: ما الذي ينقص عندما يعمل الفريق بشكل سيئ؟ 6.3: يُستخدم الملصق نفسه عدة مرات.","ti":"6.1: ብሓባር ዝውስን፣ ብሓባር የተግብር። 6.2: ጉጅለ ክሳብ ዘይሰርሕ እንታይ ይጎድል? 6.3: ሓደ ፖስተር ብዙሕ ጊዜ ይጥቀምሉ።","uk":"6.1: Хто разом вирішує, той разом і виконує. 6.2: Чого бракує, коли команда працює погано? 6.3: Той самий плакат використовують кілька разів.","ru":"6.1: Кто участвует в решении, тот участвует и в выполнении. 6.2: Чего не хватает, когда команда работает плохо? 6.3: Один и тот же плакат используют несколько раз.","es":"6.1: Quien participa en la decisión, participa en la ejecución. 6.2: ¿Qué falta cuando un equipo trabaja mal? 6.3: El mismo cartel se usa varias veces.","pt":"6.1: Quem participa na decisão, participa na execução. 6.2: O que falta quando uma equipa trabalha mal? 6.3: O mesmo cartaz é usado várias vezes."},"parts":[{"q":"6.1 Warum verlangt das Buch, dass alle Entscheidungen gemeinsam beschlossen werden – obwohl das länger dauert als eine Entscheidung der Teamleitung?","m":"Weil eine gemeinsam beschlossene Lösung auch gemeinsam getragen wird. Wer mitentschieden hat, setzt die Lösung mit um; wer überstimmt oder übergangen wurde, arbeitet oft dagegen. Die Zeit, die man beim Entscheiden verliert, gewinnt man bei der Umsetzung zurück."},{"q":"6.2 „Ein Team schafft bessere Ergebnisse als die Summe seiner Mitglieder.“ Nenne eine Situation, in der das nicht stimmt, und begründe.","m":"Zum Beispiel, wenn das Ziel unklar ist, eine Person alle Redeanteile an sich zieht oder niemand Verantwortung übernimmt. Dann kostet die Abstimmung mehr, als die verschiedenen Sichtweisen einbringen – das Ergebnis ist schlechter als das, was eine fachkundige Einzelperson erarbeitet hätte. Genau deshalb nennt das Buch die Voraussetzungen zuerst."},{"q":"6.3 Warum wechselt beim Stimmungsposter von Sitzung zu Sitzung die Farbe der Klebepunkte?","m":"Weil dasselbe Plakat immer wieder verwendet wird. Durch die wechselnden Farben bleibt sichtbar, welche Punkte aus welcher Sitzung stammen – so zeigt das Poster nicht nur die Stimmung von heute, sondern die Veränderung im Zeitablauf."}]},{"id":"s1","type":"info","title":"STOPP – Für Selbstlerner","html":"<div class=\"box merke\"><b>Pflicht-Stopp 4 · Generalprobe Fachgespräch.<\/b> Deine Lehrkraft spielt die Prüferin und stellt dir fünf Fragen aus dem Fachgespräch-Training (Module 1–11). Du antwortest frei, ohne Unterlagen. Danach schreibst du die Übungsklausur.<\/div>","vi":"Dừng lại (dành cho em tự học): Cô giáo đóng vai giám khảo và hỏi em năm câu từ phần luyện Fachgespräch (Modul 1–11). Em trả lời tự do, không xem tài liệu. Sau đó em làm bài thi thử.","sum":{"tr":"Dur (kendi başına öğrenenler için): Öğretmenin sınav görevlisi rolünü oynar ve sana Fachgespräch (uzmanlık görüşmesi) çalışmasından (Modul 1–11) beş soru sorar. Serbestçe, belgelere bakmadan cevap verirsin. Sonra deneme sınavını (Übungsklausur) yaparsın.","ar":"قف (للمتعلمين ذاتياً): تقوم المعلمة بدور الممتحِنة وتطرح عليك خمسة أسئلة من تدريب Fachgespräch (الوحدات 1–11). تجيب بحرية ومن دون أوراق. بعد ذلك تكتب امتحان التدريب (Übungsklausur).","ti":"ደው በል (ንባዕሎም ዝመሃሩ): እቲ መምህር ተፈታሒት ሓላዊት ኮይና ካብ ልምምድ Fachgespräch (Modul 1–11) ሓሙሽተ ሕቶታት ትሓትት። ብነጻ ብዘይ ጽሑፍ ትምልስ። ድሕሪኡ Übungsklausur ትጽሕፍ።","uk":"Стоп (для тих, хто вчиться самостійно): викладачка грає роль екзаменаторки й ставить тобі п'ять запитань із тренування Fachgespräch (Modul 1–11). Ти відповідаєш вільно, без матеріалів. Після цього пишеш пробну контрольну (Übungsklausur).","ru":"Стоп (для тех, кто учится самостоятельно): преподавательница играет роль экзаменатора и задаёт тебе пять вопросов из тренировки Fachgespräch (Modul 1–11). Ты отвечаешь свободно, без материалов. После этого пишешь пробную контрольную (Übungsklausur).","es":"Alto (para quien estudia por su cuenta): la profesora hace de examinadora y te hace cinco preguntas del entrenamiento de Fachgespräch (Modul 1–11). Respondes libremente, sin apuntes. Después haces el examen de práctica (Übungsklausur).","pt":"Pára (para quem estuda sozinho): a professora faz de examinadora e faz-te cinco perguntas do treino de Fachgespräch (Modul 1–11). Respondes livremente, sem apontamentos. Depois fazes o teste de treino (Übungsklausur)."}},{"id":"v1","level":"v","no":"Vertiefung 1","type":"free","pts":1,"title":"Warum ist das so?","instr":{"de":"Warum ist ein eindeutig formuliertes Ziel die erste Voraussetzung guter Teamarbeit? Vergleiche „Es soll schneller gehen“ mit einem Ziel, das Zahl und Termin nennt.","vi":"Tại sao mục tiêu được nêu rõ ràng là điều kiện đầu tiên của làm việc nhóm tốt? Hãy so sánh “Es soll schneller gehen” (cần nhanh hơn) với một mục tiêu có số lượng và thời hạn.","tr":"Net ifade edilmiş bir hedef neden iyi ekip çalışmasının ilk koşuludur? „Es soll schneller gehen“ (daha hızlı olsun) ifadesini sayı ve tarih içeren bir hedefle karşılaştır.","ar":"لماذا يُعدّ الهدف المصاغ بوضوح الشرط الأول للعمل الجماعي الجيد؟ قارن „Es soll schneller gehen“ (يجب أن يكون أسرع) بهدف يذكر عدداً وموعداً.","ti":"ስለምንታይ እዩ ብንጹር ዝተገልጸ ዕላማ ቀዳማይ ኩነት ጽቡቕ ዕዮ ጉጅለ? „Es soll schneller gehen“ (ቀልጢፉ ይኹን) ምስቲ ቁጽርን ዕለትን ዘለዎ ዕላማ ኣወዳድሮ።","uk":"Чому чітко сформульована мета — перша умова гарної командної роботи? Порівняй „Es soll schneller gehen“ (має бути швидше) з метою, у якій є число й термін.","ru":"Почему чётко сформулированная цель — первое условие хорошей командной работы? Сравни „Es soll schneller gehen“ (должно быть быстрее) с целью, в которой есть число и срок.","es":"¿Por qué un objetivo formulado con claridad es la primera condición de un buen trabajo en equipo? Compara „Es soll schneller gehen“ (tiene que ir más rápido) con un objetivo que indica cifra y fecha.","pt":"Porque é que um objetivo formulado com clareza é a primeira condição de um bom trabalho de equipa? Compara „Es soll schneller gehen“ (tem de ser mais rápido) com um objetivo que indica número e data."},"tip":{"de":"Woran erkennt das Team, dass es das Ziel erreicht hat?","vi":"Nhóm nhận biết thế nào là đã đạt mục tiêu?","tr":"Ekip hedefe ulaştığını nereden anlar?","ar":"كيف يعرف الفريق أنه حقق الهدف؟","ti":"እቲ ጉጅለ ዕላማ ከም ዘመስከተ ብኸመይ ይፈልጥ?","uk":"Як команда розуміє, що досягла мети?","ru":"Как команда понимает, что достигла цели?","es":"¿Cómo se da cuenta el equipo de que ha alcanzado el objetivo?","pt":"Como é que a equipa reconhece que atingiu o objetivo?"},"parts":[{"q":"Meine Begründung:","m":"Ein Ziel wie „Es soll schneller gehen“ ist unklar: Jeder versteht etwas anderes, und man kann nicht prüfen, ob es erreicht ist. Ein Ziel mit Zahl und Termin (zum Beispiel „bis zum 30. April drei umsetzbare Vorschläge“) ist eindeutig. Alle wissen, was sie tun sollen, und das Team erkennt, wann es fertig ist.","s":["Ein eindeutiges Ziel ist wichtig, weil …"]}]},{"id":"v2","level":"v","no":"Vertiefung 2","type":"free","pts":1,"title":"Begründe deine Entscheidung","instr":{"de":"Du bist Teamleitung und darfst fünf Auszubildende ins Team holen. Wen wählst du aus und warum? Beschreibe die Fähigkeiten, die sich ergänzen sollen.","vi":"Em là trưởng nhóm và được chọn năm học viên vào nhóm. Em chọn ai và vì sao? Hãy mô tả những khả năng cần bổ sung cho nhau.","tr":"Sen Teamleitung'sun ve ekibe beş çırak (Auszubildende) alabilirsin. Kimi seçersin, neden? Birbirini tamamlaması gereken yetenekleri anlat.","ar":"أنت قائد الفريق (Teamleitung) ويمكنك ضم خمسة متدربين (Auszubildende) إلى الفريق. من تختار ولماذا؟ صف القدرات التي يجب أن يكمّل بعضها بعضاً.","ti":"ንስኻ Teamleitung ኢኻ፣ ሓሙሽተ ተለማማዲ (Auszubildende) ናብ ጉጅለ ክትወስድ ትኽእል። መንን ስለምንታይን ትመርጽ? ነንሕድሕዱ ዝመላኣሎ ክእለታት ግለጽ።","uk":"Ти Teamleitung і можеш узяти до команди п'ятьох учнів-стажистів (Auszubildende). Кого ти обереш і чому? Опиши здібності, які мають доповнювати одна одну.","ru":"Ты Teamleitung и можешь взять в команду пятерых стажёров (Auszubildende). Кого ты выберешь и почему? Опиши способности, которые должны дополнять друг друга.","es":"Eres la Teamleitung y puedes elegir a cinco aprendices (Auszubildende) para el equipo. ¿A quién eliges y por qué? Describe las habilidades que deben complementarse.","pt":"És a Teamleitung e podes escolher cinco formandos (Auszubildende) para a equipa. Quem escolhes e porquê? Descreve as capacidades que se devem complementar."},"tip":{"de":"Denke an Aufgabe 2, Schritt 2: Wer kann was besonders gut?","vi":"Nghĩ đến Aufgabe 2, bước 2: ai giỏi việc gì?","tr":"Aufgabe 2, Schritt 2'yi düşün: Kim neyi özellikle iyi yapabilir?","ar":"فكّر في Aufgabe 2، الخطوة 2: من يجيد ماذا بشكل خاص؟","ti":"ኣብ Aufgabe 2፣ ስጉምቲ 2 ሕሰብ: መን እንታይ ብፍሉይ ይኽእል?","uk":"Згадай Aufgabe 2, крок 2: хто що вміє особливо добре?","ru":"Вспомни Aufgabe 2, шаг 2: кто что умеет особенно хорошо?","es":"Piensa en la Aufgabe 2, paso 2: ¿quién sabe hacer bien qué cosa?","pt":"Pensa na Aufgabe 2, passo 2: quem é especialmente bom em quê?"},"parts":[{"q":"Meine Auswahl und meine Begründung:","m":"Mögliche Antwort: jemand von der Kasse (kennt die Abläufe), jemand aus dem Verkauf (kennt die Kunden), jemand, der gut rechnet (wertet Zahlen aus), jemand, der gut präsentiert, und jemand, der gut organisiert. Ein Team ist so zusammengesetzt, dass sich die Fähigkeiten gegenseitig ergänzen.","s":["Ich wähle …, weil …"]}]}],"ui":{"tr":{"progress":"görev yapıldı","tip":"İpucu","check":"Kontrol et","model":"Örnek çözümü göster","basis":"Temel","vert":"Deri const T=x=>x==null?'':typeof x==='string'?x:(x[S.lang]||x.de||'');
function def(){return{lang:'de',level:'b',name:'',date:new Date().toLocaleDateString('de-DE'),ans:{},checked:{},shown:{},can:{},sub:false}}
let S=def();
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);S=Object.assign(def(),o);return true}}catch(e){}return false}
let st=null;function save(){clearTimeout(st);st=setTimeout(saveNow,400)}
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function clearStore(){try{localStorage.removeItem(KEY)}catch(e){}}
const A=id=>S.ans[id]||(S.ans[id]={});
function hashSeed(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function shuf(arr,seed){const a=arr.slice();let s=hashSeed(seed)||1;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9%€., ]/g,' ').replace(/\s+/g,' ').trim()}
function num(s){s=String(s==null?'':s).replace(/[€%\s]|[a-zA-Z²³]+/g,'');if(!s)return NaN;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s)}
const fmt=n=>(Math.round(n*10)/10).toString().replace('.',',');
const fnum=n=>n.toLocaleString('de-DE',{maximumFractionDigits:4});
/* ---------- Teile je Typ ---------- */
function cells(it){const o=[];it.rows.forEach((r,ri)=>r.forEach((c,ci)=>{if(c&&typeof c==='object')o.push({ri,ci,a:c.a,o:c.o||(it.colOpts||[])[ci],typed:c.typed,why:c.why})}));return o}
function parts(it){switch(it.type){case'mc':return it.qs;case'tf':return it.st;case'gap':return it.gaps;case'match':return it.rows;case'table':return cells(it);case'calc':case'free':return it.parts;default:return[]}}
function matchOpts(it){return shuf([...new Set(it.rows.map(r=>r.a).concat(it.extra||[]))],it.id)}
function visible(it){return it.level==='v'?S.level==='v':true}
function scored(it){return['mc','tf','gap','match','table','calc','free'].indexOf(it.type)>=0}
function counted(it){return scored(it)||it.type==='read'}
/* ---------- Bewertung ---------- */
function mcTxt(p,idx){return String(idx).split(',').filter(x=>x!=='').map(i=>p.o[+i]).join(' / ')}
function grade(it){
 const a=A(it.id),ps=parts(it),res=[];
 if(it.type==='read'){const keys=readKeys(it),sel=a.m||[];const found=keys.filter(k=>sel.indexOf(k)>=0).length,extra=sel.filter(k=>keys.indexOf(k)<0).length;
  const q=it.quiz,qa=a.q;return{type:'read',found,total:keys.length,extra,qok:q?(qa!=null&&+qa===q.a):null,max:0,got:0,parts:[],filled:!!(a.chk&&(!q||qa!=null))}}
 ps.forEach((p,i)=>{const v=a['p'+i];let ok=false,mine='',sol='',has=v!=null&&String(v).trim()!=='';
  switch(it.type){
  case'mc':{const sa=[].concat(p.a).slice().sort().join(',');const sv=has?String(v).split(',').sort().join(','):'';ok=has&&sv===sa;mine=has?mcTxt(p,v):'';sol=mcTxt(p,sa);break}
  case'tf':ok=has&&(v==='t')===p.a;mine=has?(v==='t'?u('richtig'):u('falsch')):'';sol=p.a?u('richtig'):u('falsch');break;
  case'gap':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'match':ok=has&&v===p.a;mine=has?v:'';sol=p.a;break;
  case'table':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'calc':{const n=num(v);ok=has&&!isNaN(n)&&Math.abs(n-p.a)<=(p.tol==null?0.01:p.tol);mine=has?v:'';sol=fnum(p.a)+(p.u?' '+p.u:'');if(a['p'+i+'w'])mine+=' | '+u('path')+': '+a['p'+i+'w'];break}
  case'free':{const r=a.r;ok=r==='y'?true:r==='p'?0.5:false;has=has&&!!r;mine=a['p'+i]||'';sol=T(p.m);break}
  }
  res.push({ok,has,mine,sol,why:p.why,q:p.q,p});});
 const per=ps.length?it.pts/ps.length:0;let got=0;res.forEach(r=>{got+=(r.ok===true?1:r.ok===0.5?0.5:0)*per});
 let filled;if(it.type==='free')filled=ps.every((p,i)=>String(a['p'+i]||'').trim()!=='');else filled=res.every(r=>r.has);
 return{type:it.type,parts:res,max:it.pts||0,got,filled,any:res.some(r=>r.has)}}
function tokens(p){const out=[];let idx=0;let m;
 const parts=[];let last=0,s=p;const rg=/\[\[(.+?)\]\]|\{\{(.+?)\}\}/g;while((m=rg.exec(s))){if(m.index>last)parts.push({t:s.slice(last,m.index)});parts.push({t:m[1]||m[2],key:!!m[1]});last=rg.lastIndex}
 if(last<s.length)parts.push({t:s.slice(last)});
 parts.forEach((pt,pi)=>{const prev=parts[pi-1];pt.t.split(/\s+/).filter(Boolean).forEach((w,wi)=>{const att=wi===0&&prev&&!/\s$/.test(prev.t)&&!/^\s/.test(pt.t);out.push({w,key:!!pt.key,i:idx++,att,pu:/^[.,;:!?)“”„"]+$/.test(w)})})});return out}
function allTokens(it){let g=0;return it.paras.map(p=>tokens(p).map(t=>({w:t.w,key:t.key,att:t.att,pu:t.pu,i:g++})))}
function readKeys(it){const k=[];allTokens(it).forEach(ps=>ps.forEach(t=>{if(t.key)k.push(t.i)}));return k}
/* ---------- Rendern ---------- */
function ptsLabel(it){if(it.type==='read'||!it.pts)return'';return it.level==='v'?'+'+fmt(it.pts)+' '+(S.lang==='de'?'Bonus':u('bonusw')):fmt(it.pts)+' '+(S.lang==='de'?(it.pts===1?'Punkt':'Punkte'):u('pts'))}
function sum(it){return (it.sum&&it.sum[S.lang])||(S.lang==='vi'?it.vi:'')||''}
function autoDir(){if(!RTL[S.lang])return;$$('p,h1,h2,h3,h4,li,summary,label,.info,.vis,.qt,.st,.instr,.opt span,.chip,.fb,.model,.sub,.cnt').forEach(e=>e.setAttribute('dir','auto'))}
function tipBlock(it){return it.tip?`<details class="tip"><summary>💡 ${u('tip')}</summary><div>${rich(T(it.tip))}</div></details>`:''}
function wg(it,i,p){if(!p.w&&!p.s)return'';const ch=(p.w||[]).concat(p.s||[]).map(x=>`<button type="button" class="chip" data-chip="${esc(x)}" data-for="${it.id}_${i}">${esc(x)}</button>`).join('');return`<details class="wg"><summary>✏️ ${u('words')}</summary><div class="chips">${ch}</div></details>`}
const BODY={
 info(it){return`<div class="info">${it.html||''}</div>`+(sum(it)?`<div class="vis" lang="${S.lang}">${rich(sum(it))}</div>`:'')},
 read(it){const per=allTokens(it);const a=A(it.id);const sel=a.m||[];
  const ps=per.map(ts=>`<p class="rd${a.chk?' chk':''}" data-rd="${it.id}">`+ts.map(t=>t.pu&&t.att?esc(t.w):(t.att?'':' ')+`<span class="w${t.key?' key':''}${sel.indexOf(t.i)>=0?' sel':''}" data-w="${t.i}" role="button" tabindex="0">${esc(t.w)}</span>`).join('').trim()+'</p>').join('');
  const q=it.quiz;let quiz='';
  if(q&&a.chk){quiz=`<div class="q" data-part="0"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="radio" name="${it.id}_q" data-k="q" value="${j}"${a.q!=null&&+a.q===j?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}
  return`<p class="vis">${u('tap')}</p>${ps}<div class="actions"><button type="button" class="primary" data-act="rdchk" data-id="${it.id}">${u('chkmark')}</button></div>${quiz}`+(sum(it)?`<p class="vis" lang="${S.lang}">${rich(sum(it))}</p>`:'')},
 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';
   else el=`<input class="in" type="text" data-k="p${i}" data-part="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(8,String([].concat(g.a)[0]).length+2)}" value="${esc(v)}">`;
   html=html.replace('{'+i+'}',el)});
  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},
 match(it){const a=A(it.id);const o=matchOpts(it);return it.rows.map((r,i)=>`<div class="mrow" data-part="${i}"><div><b>${rich(T(r.l))}</b></div><select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${a['p'+i]===x?' selected':''}>${esc(x)}</option>`).join('')+'</select></div>').join('')},
 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{
   if(c&&typeof c==='object'){const i=n++;const o=c.o||(it.colOpts||[])[ci];const v=a['p'+i]||'';const f=o?`<select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>':`<input class="in" type="text" data-k="p${i}" value="${esc(v)}" autocomplete="off">`;
    return`<div class="fld" data-part="${i}"><label>${esc(it.cols[ci])}</label>${f}</div>`}
   return`<div class="fld"><label>${esc(it.cols[ci])}</label><div>${rich(T(c))}</div></div>`}).join('')+'</div>'}).join('')},
 calc(it){const a=A(it.id);return it.parts.map((p,i)=>`<div class="crow" data-part="${i}"><p class="qt">${rich(T(p.q))}</p><input class="in" type="text" inputmode="decimal" data-k="p${i}" value="${esc(a['p'+i]||'')}" autocomplete="off" placeholder="0,00"><span class="u">${esc(p.u||'')}</span>${p.work?`<textarea class="in" data-k="p${i}w" rows="2" style="min-height:4rem" placeholder="${u('workph')}">${esc(a['p'+i+'w']||'')}</textarea>`:''}</div>`).join('')},
 free(it){const a=A(it.id);const sh=S.shown[it.id];return it.parts.map((p,i)=>`<div class="fpart"><p class="qt">${rich(T(p.q))}</p>${wg(it,i,p)}<textarea class="in" id="${it.id}_${i}" data-k="p${i}" rows="3" placeholder="…">${esc(a['p'+i]||'')}</textarea>`+(sh?`<div class="model"><div class="t">${u('model').replace(/ anzeigen| ?$/,'')}</div>${rich(T(p.m))}</div>`:'')+'</div>').join('')+(sh?`<div class="rate"><span style="flex:1 1 100%;font-weight:600">${u('rate')}</span>`+['y','p','n'].map(v=>`<button type="button" data-rate="${v}" data-k="r" class="${a.r===v?'on':''}">${u(v)}</button>`).join('')+'</div>':'')}
};
function actions(it){if(it.type==='info'||it.type==='read')return'';if(it.type==='free')return S.shown[it.id]?'':`<button type="button" class="primary" data-act="model" data-id="${it.id}">${u('model')}</button>`;return`<button type="button" class="primary" data-act="check" data-id="${it.id}">${u('check')}</button>`}
function cardHtml(it){const v=it.level==='v';
 return`<section class="card${v?' vert':''}" id="c_${it.id}" data-id="${it.id}"><header>${it.no?`<span class="no">${esc(it.no)}</span>`:''}<h2>${rich(T(it.title))}</h2><span class="pts">${ptsLabel(it)}</span></header>`+
 (it.instr?`<p class="instr">${rich(T(it.instr))}</p>`:'')+tipBlock(it)+`<div class="body">${BODY[it.type](it)}</div><div class="actions">${actions(it)}</div><div class="fb" aria-live="polite"></div></section>`}
function renderAll(){
 document.documentElement.lang=S.lang;
 $('#cards').innerHTML=D.items.filter(visible).map(cardHtml).join('');
 $('#t_can').textContent=u('can');$('#l_name').textContent=u('name');$('#l_date').textContent=u('date');
 $('#cans').innerHTML=D.can.map((c,i)=>`<label><input type="checkbox" data-can="${i}"${S.can[i]?' checked':''}><span>${rich(T(c))}</span></label>`).join('');
 $('#b_eval').textContent=u('eval');$('#b_pdf').textContent='📄 '+u('pdf');$('#b_restart').textContent=u('restart');
 $$('[data-lv]').forEach(b=>{b.textContent=u(b.dataset.lv==='b'?'basis':'vert');b.classList.toggle('on',S.level===b.dataset.lv)});
 $$('[data-lg]').forEach(b=>b.classList.toggle('on',S.lang===b.dataset.lg));
 $('#cnt').textContent='';$('#m_ask').textContent=u('ask');$('#m_yes').textContent=u('yes');$('#m_no').textContent=u('no');
 D.items.filter(visible).forEach(it=>{if(S.checked[it.id])paint(it)});
 if(S.sub)renderResult();else $('#result').classList.add('hide');
 autoDir();progress()}
function progress(){const its=D.items.filter(it=>visible(it)&&counted(it));let n=0;its.forEach(it=>{if(grade(it).filled)n++});
 const pc=its.length?Math.round(n/its.length*100):0;$('#barfill').style.width=pc+'%';$('#cnt').textContent=n+' / '+its.length+' '+u('progress');
 $$('.card').forEach(c=>{const it=D.items.find(x=>x.id===c.dataset.id);c.classList.toggle('done',counted(it)&&grade(it).filled)});
 [25,50,75,100].forEach(m=>{if(pc>=m&&!(S.toast||{})[m]&&n>0){S.toast=S.toast||{};S.toast[m]=1;if(m===100||m===50)toast(m+' % ✓')}})}
function paint(it){const c=$('#c_'+it.id);if(!c)return;const g=grade(it);const fb=$('.fb',c);
 if(it.type==='read'){const a=A(it.id);const rd=$$('.rd',c);rd.forEach(r=>r.classList.add('chk'));
  let h=`${g.found===g.total&&!g.extra?'✔':'ℹ️'} ${g.found} ${u('of')} ${g.total} ${u('found')}`+(g.extra?`, ${g.extra} ${u('extra')}`:'');fb.className='fb '+(g.found===g.total&&!g.extra?'ok':'mid');fb.innerHTML=h;
  const q=it.quiz;if(q&&a.q!=null){const qq=$('.q',c);const ok=+a.q===q.a;qq.classList.toggle('ok',ok);qq.classList.toggle('bad',!ok);fb.innerHTML+=`<small>${ok?'✓':'✗'} ${rich(T(q.why))}</small>`}return}
 if(!S.checked[it.id]||it.type==='info')return;
 if(it.type==='free'){return}
 const right=g.parts.filter(p=>p.ok===true).length;
 g.parts.forEach((p,i)=>{$$('[data-part="'+i+'"]',c).forEach(el=>{el.classList.remove('ok','bad');if(p.has)el.classList.add(p.ok===true?'ok':'bad');else el.classList.add('bad')})});
 fb.className='fb '+(right===g.parts.length?'ok':right?'mid':'bad');
 fb.innerHTML=(right===g.parts.length?'✓ '+u('allright'):right+' '+u('of')+' '+g.parts.length+' '+u('right')+'. '+(g.filled?'':u('fill')+' ')+(right<g.parts.length?`<small>${u('notall')}</small>`:''))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
/* ---------- Ergebnis ---------- */
function stateOf(r){return r.ok===true?'g':r.ok===0.5?'m':'r'}
function renderResult(){
 const its=D.items.filter(visible);let got=0,max=0,bg=0,bm=0;
 const html=its.filter(it=>it.type!=='info').map(it=>{const g=grade(it);
  if(it.type==='read'){return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))} <span class="st ${g.found===g.total&&!g.extra?'g':'m'}">${g.filled?g.found+' / '+g.total:'–'}</span></h4><small>${u('readfb')}</small></div>`}
  if(it.level==='v'){bg+=g.got;bm+=g.max}else{got+=g.got;max+=g.max}
  const nr=g.parts.filter(r=>r.ok===true).length;const full=it.pts?g.got>=g.max-0.001:nr===g.parts.length;const cls=full?'g':(it.pts?g.got>0:nr>0)?'m':'r';
  let li=g.parts.map((r,i)=>{const p=r.p;let line='';const lab=it.type==='match'?T(p.l):it.type==='table'?(it.rows[p.ri]&&T(it.rows[p.ri][0])||'')+' ['+it.cols[p.ci]+']':it.type==='gap'?'('+(i+1)+')':T(p.q||p.t||'')||(i+1);
   const mark=r.ok===true?'✓':r.ok===0.5?'◐':'✗';
   line=`<li><b>${mark}</b> ${rich(String(lab).slice(0,200))}<br><span class="${r.ok===true?'':'mine'}">${u('mine')}: ${r.mine?rich(r.mine):u('empty')}</span>`;
   if(r.ok!==true||it.type==='free')line+=`<br><span class="sol">${u('sol')}: ${rich(r.sol)}</span>`;
   if(r.ok!==true&&r.why)line+=`<br><small>${u('why')}: ${rich(T(r.why))}</small>`;
   if(it.type==='calc'&&p.steps)line+=`<div class="steps"><b>${u('path')}:</b>`+p.steps.map(s=>`<div>${esc(T(s))}</div>`).join('')+'</div>';
   return line+'</li>'}).join('');
  if(it.why&&!full)li+=`<li><small>${u('why')}: ${rich(T(it.why))}</small></li>`;
  if(it.type==='free'&&g.parts.some(r=>!r.has))li+=`<li><small>${u('unrated')}</small></li>`;
  return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))}${it.level==='v'?' ('+u('vert')+')':''} <span class="st ${cls}">${it.pts?fmt(g.got)+' / '+fmt(g.max):''}</span></h4><ul>${li}</ul></div>`}).join('');
 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}
/* ---------- Ereignisse ---------- */
function cardOf(e){const c=e.closest('.card');return c?D.items.find(x=>x.id===c.dataset.id):null}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();return}if(t.id==='dt'){S.date=t.value;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
