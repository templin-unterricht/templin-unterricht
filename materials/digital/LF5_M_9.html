etz (ሕጊ ማሸጊያ) ክጥቅስ ከምኡውን Grüner Punkt (ሓምላይ ነጥቢ) እንታይ ማለት ምዃኑ ከረድእ እኽእል እየ።","uk":"Я можу назвати обов'язки за Verpackungsgesetz (закон про упаковку) і пояснити, що означає Grüner Punkt (Зелена крапка).","ru":"Я могу назвать обязанности по Verpackungsgesetz (закон об упаковке) и объяснить, что означает Grüner Punkt (Зелёная точка).","es":"Puedo nombrar las obligaciones del Verpackungsgesetz (ley de embalajes) y explicar qué significa Grüner Punkt (Punto Verde).","pt":"Sei indicar as obrigações do Verpackungsgesetz (lei das embalagens) e explicar o que significa Grüner Punkt (Ponto Verde)."}],"items":[{"id":"a1","no":"Aufgabe 1","type":"free","pts":1,"title":"Ankommen: Was weißt du noch?","instr":{"de":"Beantworte die Fragen aus dem Kopf. Nicht nachschlagen. Es geht darum, was hängengeblieben ist.","vi":"Hãy trả lời bằng trí nhớ, không tra cứu. Điều quan trọng là em còn nhớ được gì.","tr":"Soruları aklından cevapla. Bakma. Önemli olan aklında ne kaldığıdır.","ar":"أجب عن الأسئلة من الذاكرة. لا تبحث في الكتاب. المهم هو ما بقي في ذهنك.","ti":"ነቲ ሕቶታት ካብ ኣእምሮኻ መልስ። ኣይትደልይ (ኣብ መጽሓፍ ኣይትረአ)። ኣገዳሲ እቲ ኣብ ኣእምሮኻ ዝተረፈ እዩ።","uk":"Відповідай на запитання по пам'яті. Не підглядай. Важливо, що в тебе залишилося в голові.","ru":"Отвечай на вопросы по памяти. Не подглядывай. Важно, что у тебя осталось в голове.","es":"Responde las preguntas de memoria. No consultes. Lo importante es lo que te ha quedado.","pt":"Responde às perguntas de cabeça. Não consultes. O importante é o que ficou na memória."},"tip":{"de":"Denke an Modul 7 und 8 und an LF 1, LF 4 und WiSo. Bei Frage 5 darfst du raten.","vi":"Hãy nhớ lại Modul 7 và 8, LF 1, LF 4 và WiSo. Câu 5 em được phép đoán.","tr":"Modul 7 ve 8'i, LF 1'i, LF 4'ü ve WiSo'yu düşün. 5. soruda tahmin edebilirsin.","ar":"فكّر في Modul 7 و 8 وفي LF 1 و LF 4 و WiSo. في السؤال 5 يمكنك التخمين.","ti":"ንModul 7 ን 8 ን LF 1 ን LF 4 ን WiSo ን ሕሰብ። ኣብ ሕቶ 5 ክትገምት ትኽእል ኢኻ።","uk":"Згадай Modul 7 і 8, LF 1, LF 4 та WiSo. У запитанні 5 можеш здогадуватися.","ru":"Вспомни Modul 7 и 8, LF 1, LF 4 и WiSo. В вопросе 5 можешь угадывать.","es":"Piensa en el Modul 7 y 8, en LF 1, LF 4 y WiSo. En la pregunta 5 puedes adivinar.","pt":"Pensa no Modul 7 e 8, em LF 1, LF 4 e WiSo. Na pergunta 5 podes adivinhar."},"parts":[{"q":"1. Nenne drei Bedienungsformen im Einzelhandel. (aus LF 1/LF 4)","m":"Bedienung (Fremdbedienung), Vorwahl, Selbstbedienung."},{"q":"2. Was ist ein Lockangebot?","m":"Die beworbene Ware wird nicht in angemessenem Umfang vorgehalten – angemessen ist ein Vorrat für zwei Tage."},{"q":"3. Nenne zwei Instrumente der Kundenbindung.","m":"Zum Beispiel Kundenzeitung, Newsletter, Kunden-App, Coupons, Bonuspunkte, Social Media."},{"q":"4. Nenne zwei Pflichten von Auszubildenden. (aus WiSo)","m":"Z. B. Lernpflicht, Berufsschulpflicht, Weisungen befolgen, Schweigepflicht, Ausbildungsnachweis führen."},{"q":"5. Warum ist die Verpackung auch ein Werbemittel? (Rate ruhig.)","m":"Weil sie durch Farbe, Form und Gestaltung auffällt und in der Selbstbedienung die Aufgabe des Verkäufers übernimmt."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)","tr":"Wortspeicher (kelime deposu)","ar":"Wortspeicher (مخزن الكلمات)","ti":"Wortspeicher (መኽዘን ቃላት)","uk":"Wortspeicher (скарбничка слів)","ru":"Wortspeicher (копилка слов)","es":"Wortspeicher (banco de palabras)","pt":"Wortspeicher (banco de palavras)"},"html":"<p>Verpackung · Schutz der Waren · Serviceaufgabe · Werbemittel · Transportverpackung · Umverpackung · Verkaufsverpackung · Einwegverpackung · Mehrwegverpackung · Verpackungsgesetz · Zentrale Stelle Verpackungsregister · Registrierungspflicht · Systembeteiligungspflicht · Vertreiber · Grüner Punkt · Entgelt · Verwertungsquote<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"Verpackung = bao bì · Transportverpackung = bao bì vận chuyển · Umverpackung = bao bì ngoài (bọc thêm) · Verkaufsverpackung = bao bì bán hàng (khách mang về) · Einwegverpackung = bao bì dùng một lần · Mehrwegverpackung = bao bì dùng nhiều lần · Verpackungsgesetz = luật bao bì · Zentrale Stelle Verpackungsregister = cơ quan đăng ký bao bì · Registrierungspflicht = nghĩa vụ đăng ký · Systembeteiligungspflicht = nghĩa vụ tham gia hệ thống thu gom · Vertreiber = bên đưa hàng ra thị trường · Grüner Punkt = Chấm xanh (hệ thống thu gom bao bì) · Entgelt = phí · Verwertungsquote = tỷ lệ tái chế","sum":{"tr":"Verpackung = ambalaj · Transportverpackung = taşıma ambalajı · Umverpackung = dış ambalaj (ek sarma) · Verkaufsverpackung = satış ambalajı (müşteri eve götürür) · Einwegverpackung = tek kullanımlık ambalaj · Mehrwegverpackung = çok kullanımlık ambalaj · Verpackungsgesetz = ambalaj yasası · Zentrale Stelle Verpackungsregister = ambalaj sicili merkezi kurumu · Registrierungspflicht = kayıt yükümlülüğü · Systembeteiligungspflicht = toplama sistemine katılma yükümlülüğü · Vertreiber = malı piyasaya sunan · Grüner Punkt = Yeşil Nokta (ambalaj toplama sistemi) · Entgelt = ücret · Verwertungsquote = geri dönüşüm oranı","ar":"Verpackung = التغليف · Transportverpackung = تغليف النقل · Umverpackung = تغليف خارجي (إضافي) · Verkaufsverpackung = تغليف البيع (يأخذه الزبون معه) · Einwegverpackung = تغليف لاستعمال واحد · Mehrwegverpackung = تغليف متعدد الاستعمال · Verpackungsgesetz = قانون التغليف · Zentrale Stelle Verpackungsregister = الجهة المركزية لسجل التغليف · Registrierungspflicht = واجب التسجيل · Systembeteiligungspflicht = واجب المشاركة في نظام الجمع · Vertreiber = الجهة التي تطرح السلعة في السوق · Grüner Punkt = النقطة الخضراء (نظام لجمع التغليف) · Entgelt = رسوم · Verwertungsquote = نسبة إعادة التدوير","ti":"Verpackung = ማሸጊያ · Transportverpackung = ማሸጊያ ንመጓዓዚ · Umverpackung = ደገ ማሸጊያ (ተወሳኺ) · Verkaufsverpackung = ማሸጊያ ሽያጭ (ዓሚል ዝወስዶ) · Einwegverpackung = ሓደ ጊዜ ዝጥቀሙሉ ማሸጊያ · Mehrwegverpackung = ብዙሕ ጊዜ ዝጥቀሙሉ ማሸጊያ · Verpackungsgesetz = ሕጊ ማሸጊያ · Zentrale Stelle Verpackungsregister = ማእከላይ ቦታ ምዝገባ ማሸጊያ · Registrierungspflicht = ግዴታ ምምዝጋብ · Systembeteiligungspflicht = ግዴታ ኣብ ስርዓት ምሳተፍ · Vertreiber = እቲ ሸቀጥ ናብ ዕዳጋ ዘእቱ · Grüner Punkt = ሓምላይ ነጥቢ (ስርዓት ምእካብ ማሸጊያ) · Entgelt = ክፍሊት · Verwertungsquote = ሚእታዊ ዳግመ-ምጥቃም (Recycling)","uk":"Verpackung = упаковка · Transportverpackung = транспортна упаковка · Umverpackung = зовнішня (додаткова) упаковка · Verkaufsverpackung = торговельна упаковка (клієнт забирає з собою) · Einwegverpackung = одноразова упаковка · Mehrwegverpackung = багаторазова упаковка · Verpackungsgesetz = закон про упаковку · Zentrale Stelle Verpackungsregister = центральний орган реєстру упаковки · Registrierungspflicht = обов'язок реєстрації · Systembeteiligungspflicht = обов'язок участі в системі збору · Vertreiber = той, хто випускає товар на ринок · Grüner Punkt = Зелена крапка (система збору упаковки) · Entgelt = плата · Verwertungsquote = частка переробки","ru":"Verpackung = упаковка · Transportverpackung = транспортная упаковка · Umverpackung = внешняя (дополнительная) упаковка · Verkaufsverpackung = торговая упаковка (клиент уносит с собой) · Einwegverpackung = одноразовая упаковка · Mehrwegverpackung = многоразовая упаковка · Verpackungsgesetz = закон об упаковке · Zentrale Stelle Verpackungsregister = центральный орган реестра упаковки · Registrierungspflicht = обязанность регистрации · Systembeteiligungspflicht = обязанность участия в системе сбора · Vertreiber = тот, кто выпускает товар на рынок · Grüner Punkt = Зелёная точка (система сбора упаковки) · Entgelt = плата · Verwertungsquote = доля переработки","es":"Verpackung = embalaje · Transportverpackung = embalaje de transporte · Umverpackung = embalaje exterior (adicional) · Verkaufsverpackung = embalaje de venta (el cliente se lo lleva) · Einwegverpackung = embalaje de un solo uso · Mehrwegverpackung = embalaje reutilizable · Verpackungsgesetz = ley de embalajes · Zentrale Stelle Verpackungsregister = oficina central del registro de embalajes · Registrierungspflicht = obligación de registro · Systembeteiligungspflicht = obligación de adherirse a un sistema de recogida · Vertreiber = quien pone la mercancía en el mercado · Grüner Punkt = Punto Verde (sistema de recogida de embalajes) · Entgelt = tarifa · Verwertungsquote = tasa de reciclaje","pt":"Verpackung = embalagem · Transportverpackung = embalagem de transporte · Umverpackung = embalagem exterior (adicional) · Verkaufsverpackung = embalagem de venda (o cliente leva consigo) · Einwegverpackung = embalagem de uso único · Mehrwegverpackung = embalagem reutilizável · Verpackungsgesetz = lei das embalagens · Zentrale Stelle Verpackungsregister = serviço central do registo de embalagens · Registrierungspflicht = obrigação de registo · Systembeteiligungspflicht = obrigação de aderir a um sistema de recolha · Vertreiber = quem coloca a mercadoria no mercado · Grüner Punkt = Ponto Verde (sistema de recolha de embalagens) · Entgelt = taxa · Verwertungsquote = taxa de reciclagem"}},{"id":"r1","no":"Lesen 1","type":"read","title":"Wozu dient die Verpackung?","instr":{"de":"Lies den Text. Tippe an: Wozu dient die Verpackung?","vi":"Em đọc đoạn văn. Chạm vào: bao bì dùng để làm gì?","tr":"Metni oku. Dokun: Ambalaj ne işe yarar?","ar":"اقرأ النص. المس: ما فائدة التغليف؟","ti":"እቲ ጽሑፍ ኣንብብ። ተንከፍ፥ እቲ ማሸጊያ ንምንታይ ይጥቀም?","uk":"Прочитай текст. Торкнися: для чого потрібна упаковка?","ru":"Прочитай текст. Нажми: для чего нужна упаковка?","es":"Lee el texto. Toca: ¿para qué sirve el embalaje?","pt":"Lê o texto. Toca: para que serve a embalagem?"},"tip":{"de":"Es sind drei Dinge: Schutz, Werbung und ein dritter Bereich, der mit dem Kaufen zu tun hat.","vi":"Có ba điều: bảo vệ, quảng cáo và một điều thứ ba liên quan đến việc mua bán.","tr":"Üç şey var: koruma, reklam ve satın almayla ilgili üçüncü bir alan.","ar":"هناك ثلاثة أشياء: الحماية والإعلان ومجال ثالث له علاقة بالشراء.","ti":"ሰለስተ ነገራት እየን፥ ሓለዋ፣ ምስሕሓብ (Werbung) ከምኡውን ምስ ምግዛእ ዝተኣሳሰር ሳልሳይ ዓውዲ።","uk":"Є три речі: захист, реклама і третя сфера, пов'язана з купівлею.","ru":"Есть три вещи: защита, реклама и третья область, связанная с покупкой.","es":"Son tres cosas: protección, publicidad y un tercer ámbito relacionado con la compra.","pt":"São três coisas: proteção, publicidade e uma terceira área relacionada com a compra."},"paras":["Die Verpackung dient dem [[Schutz]] der Ware während des [[Transports]] sowie der [[Werbung]] und dem [[Verkauf]]. In der Selbstbedienung übernimmt sie im Verkaufsraum die Aufgabe des [[Verkäufers]]."],"vi":"Tóm tắt: Bao bì bảo vệ hàng trong lúc vận chuyển, đồng thời dùng để quảng cáo và bán hàng. Trong tự phục vụ, bao bì làm công việc của người bán hàng.","quiz":{"q":"Welche Aufgabe übernimmt die Verpackung in der Selbstbedienung?","o":["Die Aufgabe des Verkäufers","Die Aufgabe der Kasse","Die Aufgabe des Lieferanten"],"a":0,"why":{"de":"Durch Farbe, Form und Gestaltung „verkauft“ die Verpackung die Ware.","vi":"Nhờ màu sắc, hình dáng và thiết kế mà bao bì “bán” món hàng.","tr":"Renk, biçim ve tasarım sayesinde ambalaj ürünü „satar“.","ar":"بفضل اللون والشكل والتصميم «يبيع» التغليف السلعة.","ti":"ብሕብሪ፣ ቅርጺን ንድፍን እቲ ማሸጊያ ነቲ ሸቀጥ „ይሸጦ“።","uk":"Завдяки кольору, формі та дизайну упаковка «продає» товар.","ru":"Благодаря цвету, форме и дизайну упаковка «продаёт» товар.","es":"Con el color, la forma y el diseño, el embalaje «vende» la mercancía.","pt":"Através da cor, da forma e do design, a embalagem «vende» a mercadoria."}},"sum":{"tr":"Özet: Ambalaj, malı taşıma sırasında korur; aynı zamanda reklam ve satış için kullanılır. Self-servis satışta ambalaj satıcının işini yapar.","ar":"ملخص: يحمي التغليف السلعة أثناء النقل، ويُستعمل أيضًا للإعلان والبيع. وفي الخدمة الذاتية يقوم التغليف بعمل البائع.","ti":"ማጠቃለሊ: እቲ ማሸጊያ ኣብ ግዜ መጓዓዚ ነቲ ሸቀጥ ይሕልዎ፣ ብተወሳኺ ንምስሕሓብን ንሽያጥን ይጥቀም። ኣብ Selbstbedienung (ባዕል ኣገልግሎት) እቲ ማሸጊያ ስራሕ ናይ ሸያጢ ይሰርሕ።","uk":"Підсумок: Упаковка захищає товар під час перевезення, а також використовується для реклами та продажу. У самообслуговуванні упаковка виконує роботу продавця.","ru":"Кратко: Упаковка защищает товар при перевозке, а также используется для рекламы и продажи. В самообслуживании упаковка выполняет работу продавца.","es":"Resumen: El embalaje protege la mercancía durante el transporte y sirve también para la publicidad y la venta. En el autoservicio, el embalaje hace el trabajo del vendedor.","pt":"Resumo: A embalagem protege a mercadoria durante o transporte e serve também para a publicidade e a venda. No self-service, a embalagem faz o trabalho do vendedor."}},{"id":"w2","type":"info","title":{"de":"Aufgaben und Arten der Verpackung","vi":"Nhiệm vụ và loại bao bì","tr":"Ambalajın görevleri ve türleri","ar":"مهام التغليف وأنواعه","ti":"ዕማማትን ዓይነታትን ማሸጊያ","uk":"Завдання та види упаковки","ru":"Задачи и виды упаковки","es":"Funciones y tipos de embalaje","pt":"Funções e tipos de embalagem"},"html":"<p><b>Die fünf Aufgaben:<\/b><br><b>Schutz der Waren:<\/b> vor Schmutz, Beschädigung, Nässe oder Austrocknung.<br><b>Informationen über die Ware:<\/b> Menge, Herkunft, Gebrauch, Pflege, Haltbarkeit, Zusammensetzung.<br><b>Erleichterung des Gebrauchs:<\/b> Öffnen, Verschließen, Dosieren, Lagern, Stapeln (zum Beispiel Sprühflasche).<br><b>Serviceaufgaben:<\/b> Essen zubereiten, Verpackung wiederverwenden (Senf im Trinkglas), Bedarfseinheiten bilden.<br><b>Werbemittel:<\/b> attraktive Gestaltung. Die Verpackung gibt der Ware „ein Gesicht“.<\/p><p><b>Die fünf Arten:<\/b><br><b>Transportverpackung:<\/b> schützt auf dem Weg vom Hersteller zum Einzelhändler (Kartonagen, Paletten, Schrumpffolien).<br><b>Umverpackung:<\/b> zusätzliche Verpackung um die Verkaufsverpackung (Faltschachtel um eine Zahnpastatube). Sie ermöglicht Selbstbedienung, wirbt und erschwert Diebstahl.<br><b>Verkaufsverpackung:<\/b> vom Endverbraucher zum Transport oder bis zum Verbrauch verwendet (Tüten, Flaschen, Dosen).<br><b>Einwegverpackung:<\/b> einmal genutzt, dann Recycling (Konservendose, Joghurtbecher).<br><b>Mehrwegverpackung:<\/b> für mehrmaligen Gebrauch (Pfandflasche, Getränkekisten, Paletten).<\/p><div class=\"box merke\"><b>Aufpassen:<\/b> Einweg und Mehrweg beschreiben, wie oft eine Verpackung benutzt wird. Transport, Um- und Verkaufsverpackung beschreiben, wo im Weg der Ware sie eingesetzt wird. Eine Pfandflasche ist also gleichzeitig Verkaufs- und Mehrwegverpackung.<\/div>","vi":"Năm nhiệm vụ: bảo vệ hàng; cung cấp thông tin; làm dễ sử dụng; dịch vụ (dùng lại, chế biến); quảng cáo. Năm loại: Transportverpackung (vận chuyển), Umverpackung (bọc ngoài), Verkaufsverpackung (khách mang về), Einweg (dùng một lần), Mehrweg (dùng nhiều lần). Chú ý: Einweg/Mehrweg nói về số lần dùng; Transport/Um/Verkauf nói về vị trí trên đường đi của hàng. Chai có tiền đặt cọc vừa là Verkaufs- vừa là Mehrwegverpackung.","sum":{"tr":"Beş görev: malı korumak; bilgi vermek; kullanımı kolaylaştırmak; hizmet (yeniden kullanım, hazırlama); reklam. Beş tür: Transportverpackung (taşıma), Umverpackung (dış sarma), Verkaufsverpackung (müşteri eve götürür), Einweg (tek kullanımlık), Mehrweg (çok kullanımlık). Dikkat: Einweg/Mehrweg kaç kez kullanıldığını anlatır; Transport/Um/Verkauf ise malın yolundaki yerini anlatır. Depozitolu şişe hem Verkaufs- hem de Mehrwegverpackung'dır.","ar":"خمس مهام: حماية السلعة؛ إعطاء معلومات؛ تسهيل الاستعمال؛ خدمة (إعادة الاستعمال، التحضير)؛ إعلان. خمسة أنواع: Transportverpackung (للنقل)، Umverpackung (غلاف خارجي)، Verkaufsverpackung (يأخذه الزبون معه)، Einweg (استعمال واحد)، Mehrweg (استعمال متعدد). انتبه: Einweg/Mehrweg تصف عدد مرات الاستعمال؛ أما Transport/Um/Verkauf فتصف موقعه في طريق السلعة. الزجاجة ذات التأمين (Pfand) هي Verkaufs- وMehrwegverpackung معًا.","ti":"ሓሙሽተ ዕማማት፥ ሓለዋ ሸቀጥ፤ inform ምሃብ፤ ኣጠቓቕማ ምቅላል፤ Service (ዳግም ምጥቃም፣ ምድላው)፤ ምስሕሓብ። ሓሙሽተ ዓይነታት፥ Transportverpackung (ንመጓዓዚ)፣ Umverpackung (ደገ ዝዕምበብ)፣ Verkaufsverpackung (ዓሚል ዝወስዶ)፣ Einweg (ሓደ ጊዜ)፣ Mehrweg (ብዙሕ ጊዜ)። ጥንቃቐ፥ Einweg/Mehrweg ክንደይ ጊዜ ዝጥቀሙሉ ይገልጽ፤ Transport/Um/Verkauf ድማ ኣብ መገዲ እቲ ሸቀጥ ዘሎ ቦታ ይገልጽ። ሓደ Pfand ዘለዎ ጥርሙዝ ሓደ ጊዜ Verkaufs- ድማ Mehrwegverpackung እዩ።","uk":"П'ять завдань: захищати товар; давати інформацію; полегшувати користування; сервіс (повторне використання, приготування); реклама. П'ять видів: Transportverpackung (транспортна), Umverpackung (зовнішня), Verkaufsverpackung (клієнт забирає з собою), Einweg (одноразова), Mehrweg (багаторазова). Увага: Einweg/Mehrweg говорить про кількість використань; Transport/Um/Verkauf — про місце на шляху товару. Пляшка із заставою (Pfand) є одночасно Verkaufs- і Mehrwegverpackung.","ru":"Пять задач: защищать товар; давать информацию; облегчать использование; сервис (повторное использование, приготовление); реклама. Пять видов: Transportverpackung (транспортная), Umverpackung (внешняя), Verkaufsverpackung (клиент уносит с собой), Einweg (одноразовая), Mehrweg (многоразовая). Внимание: Einweg/Mehrweg говорит о числе использований; Transport/Um/Verkauf — о месте на пути товара. Бутылка с залогом (Pfand) — это одновременно Verkaufs- и Mehrwegverpackung.","es":"Cinco funciones: proteger la mercancía; dar información; facilitar el uso; servicio (reutilizar, preparar); publicidad. Cinco tipos: Transportverpackung (transporte), Umverpackung (envoltorio exterior), Verkaufsverpackung (el cliente se la lleva), Einweg (un solo uso), Mehrweg (reutilizable). Atención: Einweg/Mehrweg indica cuántas veces se usa; Transport/Um/Verkauf indica dónde está en el camino de la mercancía. Una botella con depósito (Pfand) es a la vez Verkaufs- y Mehrwegverpackung.","pt":"Cinco funções: proteger a mercadoria; dar informações; facilitar a utilização; serviço (reutilizar, preparar); publicidade. Cinco tipos: Transportverpackung (transporte), Umverpackung (invólucro exterior), Verkaufsverpackung (o cliente leva consigo), Einweg (uso único), Mehrweg (reutilizável). Atenção: Einweg/Mehrweg indica quantas vezes se usa; Transport/Um/Verkauf indica onde está no caminho da mercadoria. Uma garrafa com depósito (Pfand) é ao mesmo tempo Verkaufs- e Mehrwegverpackung."}},{"id":"m1","no":"Übung 1","type":"match","pts":0,"title":"Die fünf Aufgaben der Verpackung","instr":{"de":"Ordne jedes Beispiel der richtigen Aufgabe zu.","vi":"Em ghép mỗi ví dụ với đúng nhiệm vụ.","tr":"Her örneği doğru göreve eşleştir.","ar":"اربط كل مثال بالمهمة الصحيحة.","ti":"ነፍሲ ወከፍ ኣብነት ምስ ቅኑዕ ዕማም ኣዛምድ።","uk":"Підбери до кожного прикладу правильне завдання.","ru":"Подбери к каждому примеру правильную задачу.","es":"Relaciona cada ejemplo con la función correcta.","pt":"Liga cada exemplo à função certa."},"tip":{"de":"Frage dich: Schützt es, informiert es, erleichtert es den Gebrauch, ist es ein Service oder wirbt es?","vi":"Tự hỏi: nó bảo vệ, thông báo, giúp dễ dùng, là dịch vụ hay quảng cáo?","tr":"Kendine sor: Koruyor mu, bilgi veriyor mu, kullanımı kolaylaştırıyor mu, hizmet mi, yoksa reklam mı yapıyor?","ar":"اسأل نفسك: هل يحمي؟ هل يعطي معلومات؟ هل يسهّل الاستعمال؟ هل هو خدمة؟ أم يعلن؟","ti":"ርእስኻ ሕተት፥ ይሕሉ ድዩ፣ information ይህብ ድዩ፣ ኣጠቓቕማ የቐልል ድዩ፣ Service ድዩ ወይስ የስሕሕብ?","uk":"Запитай себе: вона захищає, інформує, полегшує користування, є сервісом чи рекламує?","ru":"Спроси себя: она защищает, информирует, облегчает использование, это сервис или она рекламирует?","es":"Pregúntate: ¿protege, informa, facilita el uso, es un servicio o hace publicidad?","pt":"Pergunta a ti próprio: protege, informa, facilita a utilização, é um serviço ou faz publicidade?"},"rows":[{"l":"Auf dem Etikett steht das Mindesthaltbarkeitsdatum.","a":"Informationen über die Ware"},{"l":"Eine Sprühflasche lässt sich leicht dosieren.","a":"Erleichterung des Gebrauchs"},{"l":"Senf im Trinkglas: Das Glas wird später als Trinkglas benutzt.","a":"Serviceaufgaben"},{"l":"Die Schachtel hat ein Foto und leuchtende Farben.","a":"Werbemittel"},{"l":"Eine Folie hält Nässe und Schmutz fern.","a":"Schutz der Waren"}]},{"id":"m2","no":"Übung 2","type":"match","pts":0,"title":"Die Verpackungsarten","instr":{"de":"Ordne jedem Beispiel die richtige Art zu.","vi":"Em ghép mỗi ví dụ với đúng loại.","tr":"Her örneği doğru türe eşleştir.","ar":"اربط كل مثال بالنوع الصحيح.","ti":"ነፍሲ ወከፍ ኣብነት ምስ ቅኑዕ ዓይነት ኣዛምድ።","uk":"Підбери до кожного прикладу правильний вид.","ru":"Подбери к каждому примеру правильный вид.","es":"Relaciona cada ejemplo con el tipo correcto.","pt":"Liga cada exemplo ao tipo certo."},"tip":{"de":"Wo im Weg der Ware steht die Verpackung? Und wie oft wird sie benutzt?","vi":"Bao bì đứng ở đâu trên đường đi của hàng? Và được dùng bao nhiêu lần?","tr":"Ambalaj malın yolunda nerede duruyor? Ve kaç kez kullanılıyor?","ar":"أين يقف التغليف في طريق السلعة؟ وكم مرة يُستعمل؟","ti":"እቲ ማሸጊያ ኣብ መገዲ እቲ ሸቀጥ ኣበይ ደው ይብል? ከምኡውን ክንደይ ጊዜ ይጥቀምሉ?","uk":"Де упаковка стоїть на шляху товару? І скільки разів її використовують?","ru":"Где упаковка стоит на пути товара? И сколько раз её используют?","es":"¿Dónde está el embalaje en el camino de la mercancía? ¿Y cuántas veces se usa?","pt":"Onde está a embalagem no caminho da mercadoria? E quantas vezes é utilizada?"},"rows":[{"l":"Kartons und Paletten, mit denen der Hersteller liefert","a":"Transportverpackung"},{"l":"Faltschachtel um eine Zahnpastatube","a":"Umverpackung"},{"l":"Papiertüte, in der der Kunde die Ware nach Hause trägt","a":"Verkaufsverpackung"},{"l":"Joghurtbecher","a":"Einwegverpackung"},{"l":"Getränkekiste, die zum Hersteller zurückgeht","a":"Mehrwegverpackung"}]},{"id":"r2","no":"Lesen 2","type":"read","title":"Das Verpackungsgesetz","instr":{"de":"Lies den Text. Tippe an: Was ist das Ziel des Verpackungsgesetzes?","vi":"Em đọc đoạn văn. Chạm vào: mục tiêu của Verpackungsgesetz là gì?","tr":"Metni oku. Dokun: Verpackungsgesetz'in amacı nedir?","ar":"اقرأ النص. المس: ما هدف Verpackungsgesetz؟","ti":"እቲ ጽሑፍ ኣንብብ። ተንከፍ፥ ዕላማ Verpackungsgesetz እንታይ እዩ?","uk":"Прочитай текст. Торкнися: яка мета Verpackungsgesetz?","ru":"Прочитай текст. Нажми: какова цель Verpackungsgesetz?","es":"Lee el texto. Toca: ¿cuál es el objetivo del Verpackungsgesetz?","pt":"Lê o texto. Toca: qual é o objetivo do Verpackungsgesetz?"},"tip":{"de":"Es geht um zwei Ziele: weniger von etwas und mehr von etwas anderem.","vi":"Có hai mục tiêu: ít đi một thứ và nhiều lên một thứ khác.","tr":"İki amaç var: bir şeyden daha az, başka bir şeyden daha fazla.","ar":"هناك هدفان: أقل من شيء وأكثر من شيء آخر.","ti":"ክልተ ዕላማታት እየን፥ ካብ ሓደ ነገር ንእሽቶ ካብ ካልእ ድማ ዝያዳ።","uk":"Є дві цілі: менше чогось і більше чогось іншого.","ru":"Есть две цели: меньше чего-то и больше чего-то другого.","es":"Hay dos objetivos: menos de algo y más de otra cosa.","pt":"Há dois objetivos: menos de uma coisa e mais de outra."},"paras":["Das Verpackungsgesetz (VerpackG) gilt für alle, die eine mit Ware befüllte Verpackung in Verkehr bringen, die beim Endverbraucher anfällt. Ziel ist, den anfallenden [[Verpackungsmüll]] zu [[verringern]] und wesentlich mehr Abfälle aus privaten Haushalten zu [[recyceln]]. Dafür gibt es die „Zentrale Stelle Verpackungsregister“."],"vi":"Tóm tắt: Verpackungsgesetz áp dụng cho người đưa hàng đóng gói ra thị trường. Mục tiêu: giảm rác bao bì và tái chế nhiều hơn rác thải từ hộ gia đình.","quiz":{"q":"Wer ist im Verpackungsgesetz mit „Hersteller“ gemeint?","o":["Der Vertreiber, der die Verpackung erstmals gewerbsmäßig in Verkehr bringt","Die Firma, die das Verpackungsmaterial herstellt","Der Endverbraucher"],"a":0,"why":{"de":"Gemeint ist der Vertreiber, auch ein Onlinehändler. Nicht der Hersteller des Materials.","vi":"Ý nói người đưa hàng ra thị trường, kể cả cửa hàng online. Không phải nhà sản xuất vật liệu bao bì.","tr":"Kastedilen Vertreiber'dir (malı piyasaya sunan), online satıcı da dahildir. Ambalaj malzemesinin üreticisi değil.","ar":"المقصود هو Vertreiber (الجهة التي تطرح السلعة في السوق)، ومنها أيضًا متجر الإنترنت. وليس منتج مادة التغليف.","ti":"ዝተባህለ Vertreiber (እቲ ሸቀጥ ናብ ዕዳጋ ዘእቱ) እዩ፣ ናይ ኦንላይን ነጋዳይ’ውን ይሓቝፍ። ኣምራቲ ናይ ማሸጊያ ነገር ኣይኮነን።","uk":"Йдеться про Vertreiber (того, хто випускає товар на ринок), зокрема й інтернет-магазин. Не про виробника матеріалу упаковки.","ru":"Имеется в виду Vertreiber (тот, кто выпускает товар на рынок), в том числе интернет-магазин. Не производитель материала упаковки.","es":"Se refiere al Vertreiber (quien pone la mercancía en el mercado), también a una tienda online. No al fabricante del material.","pt":"Refere-se ao Vertreiber (quem coloca a mercadoria no mercado), também a uma loja online. Não ao fabricante do material."}},"sum":{"tr":"Özet: Verpackungsgesetz, paketlenmiş malı piyasaya süren kişiler için geçerlidir. Amaç: ambalaj çöpünü azaltmak ve evlerden çıkan atığın daha çoğunu geri dönüştürmek.","ar":"ملخص: يسري Verpackungsgesetz على من يطرح سلعة معبأة في السوق. الهدف: تقليل نفايات التغليف وإعادة تدوير مزيد من نفايات المنازل.","ti":"ማጠቃለሊ: Verpackungsgesetz ንዝተሸገ ሸቀጥ ናብ ዕዳጋ ዘእቱ ይምልከት። ዕላማ፥ ጎሓፍ ማሸጊያ ምንካይን ካብ ኣባይቲ ዝመጽእ ጎሓፍ ዝያዳ ዳግመ-ምጥቃም (recycling) ምግባርን።","uk":"Підсумок: Verpackungsgesetz стосується тих, хто випускає на ринок товар в упаковці. Мета: зменшити сміття від упаковки та переробляти більше побутових відходів.","ru":"Кратко: Verpackungsgesetz относится к тем, кто выпускает на рынок товар в упаковке. Цель: уменьшить упаковочный мусор и перерабатывать больше бытовых отходов.","es":"Resumen: El Verpackungsgesetz se aplica a quien pone en el mercado mercancía embalada. Objetivo: reducir los residuos de embalaje y reciclar más residuos de los hogares.","pt":"Resumo: O Verpackungsgesetz aplica-se a quem coloca no mercado mercadoria embalada. Objetivo: reduzir o lixo de embalagens e reciclar mais resíduos das casas."}},{"id":"w3","type":"info","title":{"de":"Drei Pflichten und Folgen für den Einzelhändler","vi":"Ba nghĩa vụ và hệ quả cho nhà bán lẻ","tr":"Perakendeci için üç yükümlülük ve sonuçları","ar":"ثلاثة واجبات ونتائجها على تاجر التجزئة","ti":"ሰለስተ ግዴታታትን ሳዕቤናትን ንናይ ችርቻሮ ነጋዳይ","uk":"Три обов'язки та наслідки для роздрібного торговця","ru":"Три обязанности и последствия для розничного торговца","es":"Tres obligaciones y consecuencias para el comercio minorista","pt":"Três obrigações e consequências para o comerciante a retalho"},"html":"<p><b>1. Registrierungspflicht:<\/b> Wer mit Ware befüllte Verpackungen, die beim privaten Endverbraucher anfallen, erstmals gewerbsmäßig in Verkehr bringt, muss sich vorher bei der Zentralen Stelle Verpackungsregister registrieren. Einen Dritten damit zu beauftragen, ist nicht zulässig.<br><b>2. Systembeteiligungspflicht:<\/b> Der Vertreiber darf Rücknahme und Verwertung nicht selbst organisieren. Er muss sich einem System anschließen, zum Beispiel der Grüner Punkt GmbH.<br><b>3. Meldepflicht:<\/b> Die in Verkehr gebrachten Verpackungen müssen an die Zentrale Stelle gemeldet werden, mit Materialart und Menge.<\/p><p>Für die Beteiligung an einem System zahlen die Vertreiber ein <b>Entgelt<\/b>. Es ist umso höher, je ökologisch problematischer der Verpackungsstoff ist. Davon finanzieren die Systeme gelbe Tonnen, Glascontainer, Altpapiertonnen und die Verwertung.<\/p><p><b>Für den Einzelhändler:<\/b> Fallen bei ihm Verkaufs- und Umverpackungen an, muss er sie zurücknehmen und der Wiederverwendung oder dem Recycling zuführen. Seit Januar 2019 steigen die Anforderungen: Papier, Pappe und Karton sollen im Jahresmittel von 70 % auf 85 % wiederverwendet oder recycelt werden, Aluminium von 60 % auf 80 %. Der Anteil der in Mehrweggetränkeverpackungen abgefüllten Getränke soll mindestens 70 % erreichen.<\/p>","vi":"Ba nghĩa vụ: 1. đăng ký với cơ quan trung ương (không được nhờ người khác); 2. tham gia một hệ thống thu gom như Grüner Punkt (không tự tổ chức); 3. báo cáo loại vật liệu và số lượng. Phí (Entgelt) càng cao khi vật liệu càng gây hại cho môi trường. Nhà bán lẻ phải nhận lại bao bì bán hàng và bao bì ngoài.","sum":{"tr":"Üç yükümlülük: 1. merkezi kurumda kayıt (başkasına yaptırılamaz); 2. Grüner Punkt gibi bir toplama sistemine katılmak (kendi başına organize edilemez); 3. malzeme türünü ve miktarını bildirmek. Ücret (Entgelt), malzeme çevre için ne kadar sorunluysa o kadar yüksektir. Perakendeci satış ambalajlarını ve dış ambalajları geri almak zorundadır.","ar":"ثلاثة واجبات: 1. التسجيل لدى الجهة المركزية (لا يجوز تكليف شخص آخر)؛ 2. المشاركة في نظام جمع مثل Grüner Punkt (لا يجوز التنظيم بنفسك)؛ 3. الإبلاغ عن نوع المادة وكميتها. الرسوم (Entgelt) أعلى كلما كانت المادة أكثر ضررًا بالبيئة. على تاجر التجزئة أن يسترجع تغليف البيع والتغليف الخارجي.","ti":"ሰለስተ ግዴታታት፥ 1. ኣብ ማእከላይ ቦታ ምምዝጋብ (ንካልእ ሰብ ምእዛዝ ኣይፍቀድን)፤ 2. ኣብ ሓደ ናይ ምእካብ ስርዓት ከም Grüner Punkt ምሳተፍ (ባዕልኻ ከተወዳድብ ኣይፍቀድን)፤ 3. ዓይነት ነገርን መጠንን ምንጋር። እቲ ክፍሊት (Entgelt) እቲ ነገር ንኣከባቢ ዝያዳ ጎዳኢ ምስ ኮነ ዝያዳ ይልዕል። እቲ ናይ ችርቻሮ ነጋዳይ ማሸጊያ ሽያጭን ደገ ማሸጊያን ክመልስ ኣለዎ።","uk":"Три обов'язки: 1. реєстрація в центральному органі (доручити іншому не можна); 2. участь у системі збору, як-от Grüner Punkt (організовувати самому не можна); 3. повідомляти вид матеріалу та кількість. Плата (Entgelt) тим вища, чим небезпечніший матеріал для довкілля. Роздрібний торговець мусить приймати назад торговельну та зовнішню упаковку.","ru":"Три обязанности: 1. регистрация в центральном органе (поручить другому нельзя); 2. участие в системе сбора, например Grüner Punkt (организовать самому нельзя); 3. сообщать вид материала и количество. Плата (Entgelt) тем выше, чем вреднее материал для окружающей среды. Розничный торговец обязан принимать обратно торговую и внешнюю упаковку.","es":"Tres obligaciones: 1. registrarse en la oficina central (no se puede encargar a otra persona); 2. adherirse a un sistema de recogida como Grüner Punkt (no se puede organizar por cuenta propia); 3. comunicar el tipo de material y la cantidad. La tarifa (Entgelt) es más alta cuanto más problemático es el material para el medio ambiente. El comerciante minorista debe recoger de vuelta los embalajes de venta y los exteriores.","pt":"Três obrigações: 1. registar-se no serviço central (não se pode encarregar outra pessoa); 2. aderir a um sistema de recolha como o Grüner Punkt (não se pode organizar por conta própria); 3. comunicar o tipo de material e a quantidade. A taxa (Entgelt) é tanto mais alta quanto mais problemático for o material para o ambiente. O comerciante a retalho tem de receber de volta as embalagens de venda e as exteriores."}},{"id":"m3","no":"Übung 3","type":"match","pts":0,"title":"Die drei Pflichten","instr":{"de":"Ordne jeder Pflicht die richtige Beschreibung zu.","vi":"Em ghép mỗi nghĩa vụ với mô tả đúng.","tr":"Her yükümlülüğü doğru açıklamayla eşleştir.","ar":"اربط كل واجب بالوصف الصحيح.","ti":"ነፍሲ ወከፍ ግዴታ ምስ ቅኑዕ መግለጺ ኣዛምድ።","uk":"Підбери до кожного обов'язку правильний опис.","ru":"Подбери к каждой обязанности правильное описание.","es":"Relaciona cada obligación con la descripción correcta.","pt":"Liga cada obrigação à descrição certa."},"tip":{"de":"Registrieren = anmelden. Systembeteiligung = bei einem System mitmachen. Melden = Zahlen mitteilen.","vi":"Registrieren = đăng ký. Systembeteiligung = tham gia một hệ thống. Melden = báo số liệu.","tr":"Registrieren = kaydolmak. Systembeteiligung = bir sisteme katılmak. Melden = sayıları bildirmek.","ar":"Registrieren = التسجيل. Systembeteiligung = المشاركة في نظام. Melden = إبلاغ الأرقام.","ti":"Registrieren = ምምዝጋብ። Systembeteiligung = ኣብ ሓደ ስርዓት ምሳተፍ። Melden = ቁጽሪ ምንጋር።","uk":"Registrieren = зареєструватися. Systembeteiligung = брати участь у системі. Melden = повідомляти цифри.","ru":"Registrieren = зарегистрироваться. Systembeteiligung = участвовать в системе. Melden = сообщать цифры.","es":"Registrieren = registrarse. Systembeteiligung = participar en un sistema. Melden = comunicar cifras.","pt":"Registrieren = registar-se. Systembeteiligung = participar num sistema. Melden = comunicar números."},"rows":[{"l":"Registrierungspflicht","a":"Sich vor dem Inverkehrbringen bei der Zentralen Stelle Verpackungsregister anmelden"},{"l":"Systembeteiligungspflicht","a":"Sich einem System anschließen, zum Beispiel dem Grünen Punkt"},{"l":"Meldepflicht","a":"Materialart und Menge der Verpackungen an die Zentrale Stelle melden"}]},{"id":"mcq","no":"Übung 4","type":"mc","pts":0,"title":"Zahlen und Regeln","instr":{"de":"Wähle die richtige Antwort.","vi":"Em chọn đáp án đúng.","tr":"Doğru cevabı seç.","ar":"اختر الإجابة الصحيحة.","ti":"ቅኑዕ መልሲ ምረጽ።","uk":"Вибери правильну відповідь.","ru":"Выбери правильный ответ.","es":"Elige la respuesta correcta.","pt":"Escolhe a resposta certa."},"tip":{"de":"Lies im Abschnitt „Für den Einzelhändler“ nach.","vi":"Đọc lại phần “Für den Einzelhändler”.","tr":"„Für den Einzelhändler“ bölümünü oku.","ar":"اقرأ في القسم «Für den Einzelhändler».","ti":"ኣብቲ ክፍሊ „Für den Einzelhändler“ ኣንብብ።","uk":"Перечитай розділ «Für den Einzelhändler».","ru":"Прочитай раздел «Für den Einzelhändler».","es":"Lee en la sección «Für den Einzelhändler».","pt":"Lê na secção «Für den Einzelhändler»."},"qs":[{"q":"Wie hoch soll der Anteil der Mehrweggetränkeverpackungen mindestens sein?","o":["70 %","40 %","100 %"],"a":0,"why":{"de":"Der Anteil soll mindestens 70 % erreichen.","vi":"Tỷ lệ phải đạt ít nhất 70 %.","tr":"Oran en az 70 %'e ulaşmalı.","ar":"يجب أن تبلغ النسبة 70 % على الأقل.","ti":"እቲ ሚእታዊ ብዝተኻኣለ ብውሑዱ 70 % ክበጽሕ ኣለዎ።","uk":"Частка має досягти щонайменше 70 %.","ru":"Доля должна достигать не менее 70 %.","es":"La proporción debe alcanzar al menos el 70 %.","pt":"A percentagem deve atingir pelo menos 70 %."}},{"q":"Was muss der Einzelhändler mit Verkaufs- und Umverpackungen tun, die bei ihm anfallen?","o":["Zurücknehmen und der Wiederverwendung oder dem Recycling zuführen","In den Hausmüll werfen","Verbrennen"],"a":0,"why":{"de":"Er ist zur Rücknahme verpflichtet.","vi":"Cửa hàng có nghĩa vụ nhận lại.","tr":"Geri alma yükümlülüğü vardır.","ar":"هو ملزم بالاسترجاع (استعادة التغليف).","ti":"ክመልስ (Rücknahme) ግዴታ ኣለዎ።","uk":"Він зобов'язаний приймати упаковку назад.","ru":"Он обязан принимать упаковку обратно.","es":"Está obligado a la recogida (Rücknahme) del embalaje.","pt":"Ele é obrigado a receber de volta a embalagem (Rücknahme)."}}]},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: Eine Verpackung einordnen","html":"<div class=\"box\"><b>Der Gegenstand:<\/b> Eine Zahnpastatube steckt in einer bedruckten Faltschachtel. Beim Kauf legt die Verkäuferin sie in eine Papiertüte.<\/div><p><b>Schritt 1:<\/b> Drei Verpackungen sind beteiligt: die Tube, die Faltschachtel und die Papiertüte.<br><b>Schritt 2:<\/b> Die Tube nimmt der Kunde mit nach Hause und benutzt sie bis zum Verbrauch. Das ist die Verkaufsverpackung. Sie wird einmal genutzt, also zugleich eine Einwegverpackung.<br><b>Schritt 3:<\/b> Die Faltschachtel ist eine zusätzliche Verpackung um die Verkaufsverpackung. Sie ermöglicht Selbstbedienung, wirbt und erschwert Diebstahl. Das ist eine Umverpackung.<br><b>Schritt 4:<\/b> Die Papiertüte dient dem Kunden zum Transport. Auch eine Verkaufsverpackung.<br><b>Schritt 5:<\/b> Die Faltschachtel erfüllt diese Aufgaben: Schutz der Ware, Informationen über die Ware und Werbemittel.<\/p><div class=\"box merke\"><b>Ergebnis:<\/b> Zwei getrennte Fragen: Wo im Weg der Ware steht die Verpackung (Transport – Um – Verkauf)? Und wie oft wird sie benutzt (Einweg – Mehrweg)?<\/div>","vi":"Ví dụ mẫu: tuýp kem đánh răng trong hộp giấy, khi mua cho vào túi giấy. Tuýp = Verkaufsverpackung và Einwegverpackung. Hộp giấy = Umverpackung (cho phép tự phục vụ, quảng cáo, chống trộm). Túi giấy = Verkaufsverpackung. Hai câu hỏi tách biệt: bao bì ở đâu trên đường đi của hàng? Dùng bao nhiêu lần?","sum":{"tr":"Örnek: Diş macunu tüpü katlanır kutunun içinde, satın alınırken kâğıt poşete konuyor. Tüp = Verkaufsverpackung ve Einwegverpackung. Katlanır kutu = Umverpackung (self-servisi sağlar, reklam yapar, hırsızlığı zorlaştırır). Kâğıt poşet = Verkaufsverpackung. İki ayrı soru: Ambalaj malın yolunda nerede duruyor? Kaç kez kullanılıyor?","ar":"مثال: أنبوب معجون أسنان داخل علبة قابلة للطي، وعند الشراء يوضع في كيس ورقي. الأنبوب = Verkaufsverpackung وEinwegverpackung. العلبة = Umverpackung (تتيح الخدمة الذاتية، وتعلن، وتصعّب السرقة). الكيس الورقي = Verkaufsverpackung. سؤالان منفصلان: أين يقف التغليف في طريق السلعة؟ كم مرة يُستعمل؟","ti":"ኣብነት፥ ቱቦ ጥርሙስ ስናን ኣብ ውሽጢ ዝሰዓብ ሳጹን፣ ኣብ ግዜ ምግዛእ ድማ ኣብ ወረቐት ሻንጣ ይኣቱ። እቲ ቱቦ = Verkaufsverpackung ከምኡውን Einwegverpackung። እቲ ሳጹን = Umverpackung (ባዕል ኣገልግሎት የኽእል፣ የስሕሕብ፣ ስርቂ የጸግም)። እቲ ወረቐት ሻንጣ = Verkaufsverpackung። ክልተ ፍሉያት ሕቶታት፥ እቲ ማሸጊያ ኣብ መገዲ እቲ ሸቀጥ ኣበይ ደው ይብል? ክንደይ ጊዜ ይጥቀምሉ?","uk":"Приклад: тюбик зубної пасти в складаній коробці, під час покупки кладуть у паперовий пакет. Тюбик = Verkaufsverpackung і Einwegverpackung. Коробка = Umverpackung (дає змогу самообслуговування, рекламує, ускладнює крадіжку). Паперовий пакет = Verkaufsverpackung. Два окремі запитання: де упаковка стоїть на шляху товару? Скільки разів її використовують?","ru":"Пример: тюбик зубной пасты в складной коробке, при покупке кладут в бумажный пакет. Тюбик = Verkaufsverpackung и Einwegverpackung. Коробка = Umverpackung (позволяет самообслуживание, рекламирует, затрудняет кражу). Бумажный пакет = Verkaufsverpackung. Два отдельных вопроса: где упаковка стоит на пути товара? Сколько раз её используют?","es":"Ejemplo: un tubo de pasta de dientes en una caja plegable; al comprar, se mete en una bolsa de papel. Tubo = Verkaufsverpackung y Einwegverpackung. Caja = Umverpackung (permite el autoservicio, hace publicidad, dificulta el robo). Bolsa de papel = Verkaufsverpackung. Dos preguntas separadas: ¿dónde está el embalaje en el camino de la mercancía? ¿Cuántas veces se usa?","pt":"Exemplo: um tubo de pasta de dentes numa caixa dobrável; na compra, é posto num saco de papel. Tubo = Verkaufsverpackung e Einwegverpackung. Caixa = Umverpackung (permite o self-service, faz publicidade, dificulta o furto). Saco de papel = Verkaufsverpackung. Duas perguntas separadas: onde está a embalagem no caminho da mercadoria? Quantas vezes é utilizada?"}},{"id":"a3","no":"Aufgabe 3","type":"table","pts":1,"title":"Geführte Übung","instr":{"de":"Wähle zu jedem Gegenstand die Verpackungsart. Wähle bei den Beispielen 1 bis 3 auch Einweg oder Mehrweg und bei den Beispielen 3 und 4 eine Aufgabe der Verpackung.","vi":"Với mỗi vật, em chọn loại bao bì. Với ví dụ 1 đến 3, chọn thêm Einweg hoặc Mehrweg; với ví dụ 3 và 4, chọn thêm một nhiệm vụ của bao bì.","tr":"Her nesne için ambalaj türünü seç. 1 ile 3 arasındaki örneklerde ayrıca Einweg (tek kullanımlık) veya Mehrweg (çok kullanımlık) seç, 3 ve 4 numaralı örneklerde ise ambalajın bir görevini seç.","ar":"اختر لكل غرض نوع التغليف. في الأمثلة من 1 إلى 3 اختر أيضًا Einweg (استعمال واحد) أو Mehrweg (استعمال متعدد)، وفي المثالين 3 و 4 اختر أيضًا مهمة من مهام التغليف.","ti":"ንነፍሲ ወከፍ ነገር ዓይነት ማሸጊያ ምረጽ። ኣብ ኣብነታት 1 ክሳብ 3 ድማ Einweg (ሓደ ጊዜ ዝጥቀሙሉ) ወይ Mehrweg (ብዙሕ ጊዜ ዝጥቀሙሉ) ምረጽ፣ ኣብ ኣብነታት 3 ን 4 ን ድማ ሓደ ዕማም ናይቲ ማሸጊያ ምረጽ።","uk":"До кожного предмета вибери вид упаковки. У прикладах з 1 по 3 вибери ще Einweg (одноразова) або Mehrweg (багаторазова), а в прикладах 3 і 4 — ще одне завдання упаковки.","ru":"Для каждого предмета выбери вид упаковки. В примерах с 1 по 3 выбери ещё Einweg (одноразовая) или Mehrweg (многоразовая), а в примерах 3 и 4 — ещё одну задачу упаковки.","es":"Elige el tipo de embalaje para cada objeto. En los ejemplos 1 a 3 elige también Einweg (de un solo uso) o Mehrweg (reutilizable), y en los ejemplos 3 y 4 una función del embalaje.","pt":"Para cada objeto, escolhe o tipo de embalagem. Nos exemplos 1 a 3, escolhe também Einweg (de uso único) ou Mehrweg (reutilizável), e nos exemplos 3 e 4 uma função da embalagem."},"tip":{"de":"Zwei Fragen: Wo steht die Verpackung im Weg der Ware? Wie oft wird sie benutzt? Pfand ist ein Hinweis auf die Nutzungsart.","vi":"Hai câu hỏi: bao bì đứng ở đâu trên đường đi của hàng? Dùng bao nhiêu lần? Tiền đặt cọc (Pfand) là gợi ý về cách sử dụng.","tr":"İki soru: Ambalaj malın yolunda nerede duruyor? Kaç kez kullanılıyor? Pfand (depozito) kullanım türüne işaret eder.","ar":"سؤالان: أين يقف التغليف في طريق السلعة؟ كم مرة يُستعمل؟ Pfand (مبلغ التأمين المسترد) إشارة إلى طريقة الاستعمال.","ti":"ክልተ ሕቶታት፥ እቲ ማሸጊያ ኣብ መገዲ እቲ ሸቀጥ ኣበይ ደው ይብል? ክንደይ ጊዜ ይጥቀምሉ? Pfand (ዳግም ዝምለስ ተቀማጣይ ገንዘብ) ንኣጠቓቕማ ዝሕብር ምልክት እዩ።","uk":"Два запитання: де упаковка стоїть на шляху товару? Скільки разів її використовують? Pfand (заставна вартість) — підказка щодо способу використання.","ru":"Два вопроса: где упаковка стоит на пути товара? Сколько раз её используют? Pfand (залог за тару) — подсказка о способе использования.","es":"Dos preguntas: ¿dónde está el embalaje en el camino de la mercancía? ¿Cuántas veces se usa? El Pfand (depósito) es una pista sobre el tipo de uso.","pt":"Duas perguntas: onde está a embalagem no caminho da mercadoria? Quantas vezes é utilizada? O Pfand (depósito) é uma pista sobre o tipo de utilização."},"cols":["Gegenstand","Art (Weg der Ware)","Einweg oder Mehrweg","Aufgabe"],"colOpts":[null,["Transportverpackung","Umverpackung","Verkaufsverpackung"],["Einwegverpackung","Mehrwegverpackung"],["Schutz der Waren","Informationen über die Ware","Erleichterung des Gebrauchs","Serviceaufgaben","Werbemittel"]],"rows":[["1. Eine Palette, auf der Getränkekisten zum Einzelhändler geliefert werden und die anschließend zum Hersteller zurückgeht.",{"a":"Transportverpackung"},{"a":"Mehrwegverpackung"},"–"],["2. Eine Glasflasche mit Pfand.",{"a":"Verkaufsverpackung"},{"a":"Mehrwegverpackung"},"–"],["3. Eine Konservendose mit Erbsen. Auf dem Etikett stehen Zutaten, Nettofüllmenge und Mindesthaltbarkeitsdatum.",{"a":"Verkaufsverpackung"},{"a":"Einwegverpackung"},{"a":["Schutz der Waren","Informationen über die Ware"]}],["4. Eine auffällig gestaltete Parfümschachtel mit Foto und Werbetext.",{"a":"Umverpackung"},"–",{"a":"Werbemittel"}]]},{"id":"a4","no":"Aufgabe 4","type":"free","pts":2,"title":"Freie Übung","instr":{"de":"Beantworte die Fragen in eigenen Worten.","vi":"Em trả lời các câu hỏi bằng lời của mình.","tr":"Soruları kendi sözcüklerinle cevapla.","ar":"أجب عن الأسئلة بكلماتك الخاصة.","ti":"ነቲ ሕቶታት ብናትካ ቃላት መልስ።","uk":"Дай відповіді на запитання своїми словами.","ru":"Ответь на вопросы своими словами.","es":"Responde las preguntas con tus propias palabras.","pt":"Responde às perguntas por palavras tuas."},"tip":{"de":"Bei Frage 5: Registrieren, anschließen, melden. Bei Frage 6: Wofür wird das Geld verwendet, und was macht es teurer?","vi":"Câu 5: đăng ký, tham gia, báo cáo. Câu 6: tiền dùng vào việc gì, và điều gì làm nó đắt hơn?","tr":"5. soruda: kaydolmak, katılmak, bildirmek. 6. soruda: Para ne için kullanılıyor ve onu ne daha pahalı yapıyor?","ar":"في السؤال 5: التسجيل، الانضمام، الإبلاغ. في السؤال 6: في ماذا يُستعمل المال، وما الذي يجعله أغلى؟","ti":"ኣብ ሕቶ 5፥ ምምዝጋብ፣ ምስ ስርዓት ምጽንባር (ምሳተፍ)፣ ምንጋር። ኣብ ሕቶ 6፥ እቲ ገንዘብ ንምንታይ ይውዕል፣ እንታይከ የክፍሎ?","uk":"У запитанні 5: зареєструватися, приєднатися, повідомити. У запитанні 6: на що йдуть гроші і що робить їх дорожчими?","ru":"В вопросе 5: зарегистрироваться, присоединиться, сообщить. В вопросе 6: на что идут деньги и что делает их дороже?","es":"En la pregunta 5: registrarse, adherirse, comunicar. En la pregunta 6: ¿para qué se usa el dinero y qué lo hace más caro?","pt":"Na pergunta 5: registar-se, aderir, comunicar. Na pergunta 6: para que é usado o dinheiro e o que o torna mais caro?"},"parts":[{"q":"1. Nenne die fünf Aufgaben der Verpackung.","m":"Schutz der Waren, Informationen über die Ware, Erleichterung des Gebrauchs, Serviceaufgaben, Werbemittel."},{"q":"2. Nenne die fünf Arten der Verpackung.","m":"Transportverpackung, Umverpackung, Verkaufsverpackung, Einwegverpackung, Mehrwegverpackung."},{"q":"3. Erkläre den Unterschied zwischen Umverpackung und Verkaufsverpackung.","m":"Die Umverpackung ist eine zusätzliche Verpackung um die Verkaufsverpackung; sie ermöglicht die Selbstbedienung, wirbt und erschwert Diebstahl. Die Verkaufsverpackung verwendet der Endverbraucher zum Transport oder bis zum Verbrauch der Ware.","s":["Die Umverpackung ist …","Die Verkaufsverpackung ist …"]},{"q":"4. Was ist das Ziel des Verpackungsgesetzes?","m":"Den anfallenden Verpackungsmüll zu verringern und wesentlich mehr Abfälle aus privaten Haushalten zu recyceln."},{"q":"5. Nenne die drei Pflichten, die sich aus dem Verpackungsgesetz ergeben.","m":"Registrierungspflicht bei der Zentralen Stelle Verpackungsregister, Systembeteiligungspflicht (z. B. Grüner Punkt) und Meldepflicht über Materialart und Menge."},{"q":"6. Wofür wird das Entgelt verwendet, das ein Vertreiber an ein System zahlt? Und wovon hängt seine Höhe ab?","m":"Aus den Zahlungen finanzieren die Systeme die Erfassung der Verpackungen – gelbe Tonne, Glascontainer, Altpapiertonne – und die Verwertung. Das Entgelt ist umso höher, je ökologisch problematischer der Verpackungsstoff ist."},{"q":"7. Was muss ein Einzelhändler mit Verkaufs- und Umverpackungen tun, die bei ihm anfallen?","m":"Er ist verpflichtet, sie zurückzunehmen und einer Wiederverwendung oder dem Recycling zuzuführen. Eine Rückgabe an den Vorvertreiber ist ebenfalls möglich."}]},{"id":"a5","no":"Aufgabe 5","type":"free","pts":1,"title":"Aus deinem Betrieb","instr":{"de":"Suche in deinem Ausbildungsbetrieb zu jeder der fünf Verpackungsarten ein Beispiel. Notiere zu einem davon, welche Aufgaben die Verpackung erfüllt.","vi":"Tìm trong cửa hàng nơi em thực tập một ví dụ cho mỗi loại trong năm loại bao bì. Với một ví dụ, ghi bao bì đó làm những nhiệm vụ nào.","tr":"Staj yaptığın işletmede beş ambalaj türünün her biri için bir örnek bul. Bunlardan biri için ambalajın hangi görevleri yerine getirdiğini yaz.","ar":"ابحث في مكان تدريبك عن مثال لكل نوع من أنواع التغليف الخمسة. اكتب لأحدها المهام التي يؤديها التغليف.","ti":"ኣብቲ ናይ ልምምድ ቦታኻ ንነፍሲ ወከፍ ሓሙሽተ ዓይነታት ማሸጊያ ሓደ ኣብነት ድለ። ሓደ ኣብነት ሕረ፣ እቲ ማሸጊያ እንታይ ዕማማት ከም ዘፍጽም ጽሓፍ።","uk":"Знайди на місці своєї практики по одному прикладу для кожного з п'яти видів упаковки. Для одного з них запиши, які завдання виконує упаковка.","ru":"Найди на месте своей практики по одному примеру для каждого из пяти видов упаковки. Для одного из них запиши, какие задачи выполняет упаковка.","es":"Busca en tu empresa de prácticas un ejemplo de cada uno de los cinco tipos de embalaje. De uno de ellos, anota qué funciones cumple el embalaje.","pt":"Procura na tua empresa de formação um exemplo para cada um dos cinco tipos de embalagem. De um deles, anota que funções a embalagem cumpre."},"tip":{"de":"Typisch: Karton vom Lieferanten, Faltschachtel, Tüte oder Flasche, Joghurtbecher, Getränkekiste oder Palette.","vi":"Thường gặp: thùng carton từ nhà cung cấp, hộp giấy, túi hoặc chai, cốc sữa chua, két nước hoặc pallet.","tr":"Tipik örnekler: tedarikçiden gelen karton, katlanır kutu, poşet veya şişe, yoğurt kabı, içecek kasası veya palet.","ar":"أمثلة شائعة: كرتون من المورّد، علبة قابلة للطي، كيس أو زجاجة، علبة لبن، صندوق مشروبات أو منصة نقل (Palette).","ti":"ልሙድ፥ ካርቶን ካብ ኣቕራቢ፣ ዝሰዓብ ሳጹን (Faltschachtel)፣ ሻንጣ ወይ ጥርሙዝ፣ ጽዋዕ ዮጉርት፣ ሳጹን መስተ ወይ Palette።","uk":"Типово: картон від постачальника, складана коробка, пакет або пляшка, стаканчик від йогурту, ящик для напоїв або палета.","ru":"Типично: картон от поставщика, складная коробка, пакет или бутылка, стаканчик из-под йогурта, ящик для напитков или паллета.","es":"Típico: cartón del proveedor, caja plegable, bolsa o botella, vaso de yogur, caja de bebidas o palé.","pt":"Típico: cartão do fornecedor, caixa dobrável, saco ou garrafa, copo de iogurte, grade de bebidas ou palete."},"parts":[{"q":"Meine fünf Beispiele und die Aufgaben:","m":"Individuelle Lösung. Erwartet werden fünf Beispiele mit korrekter Zuordnung und zu einem davon mindestens zwei benannte Aufgaben. Häufig genannt: Karton vom Lieferanten (Transport), Faltschachtel (Um), Tüte oder Flasche (Verkauf), Joghurtbecher (Einweg), Getränkekiste oder Palette (Mehrweg).","s":["Transportverpackung: …","Umverpackung: …","Die Aufgaben sind: …"]}]},{"id":"a6","no":"Aufgabe 6","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh.","tr":"Soruları cevapla. Tam cümlelerle gerekçelendir.","ar":"أجب عن الأسئلة. علّل بجمل كاملة.","ti":"ነቲ ሕቶታት መልስ። ብምሉእ ሓረጋት ኣብርህ።","uk":"Дай відповіді на запитання. Обґрунтуй повними реченнями.","ru":"Ответь на вопросы. Обоснуй полными предложениями.","es":"Responde las preguntas. Justifica con frases completas.","pt":"Responde às perguntas. Justifica com frases completas."},"tip":{"de":"6.1: Das Entgelt wird zum Preis für Umweltbelastung. 6.2: Auffällige Verpackung gegen Müll. 6.3: Wer soll die Verantwortung tragen?","vi":"6.1: phí trở thành giá của việc gây hại môi trường. 6.2: bao bì bắt mắt so với rác thải. 6.3: ai phải chịu trách nhiệm?","tr":"6.1: Ücret (Entgelt), çevre yükünün bedeli olur. 6.2: Dikkat çekici ambalaj ve çöp. 6.3: Sorumluluğu kim taşımalı?","ar":"6.1: الرسوم (Entgelt) تصبح ثمن العبء على البيئة. 6.2: تغليف لافت مقابل النفايات. 6.3: من يجب أن يتحمل المسؤولية؟","ti":"6.1፥ እቲ ክፍሊት (Entgelt) ዋጋ ናይ ጉድኣት ኣከባቢ ይኸውን። 6.2፥ ዘተኣምን ማሸጊያ ኣንጻር ጎሓፍ። 6.3፥ መን እዩ ሓላፍነት ክወስድ ዘለዎ?","uk":"6.1: Плата (Entgelt) стає ціною за навантаження на довкілля. 6.2: Яскрава упаковка проти сміття. 6.3: Хто має нести відповідальність?","ru":"6.1: Плата (Entgelt) становится ценой за нагрузку на окружающую среду. 6.2: Яркая упаковка против мусора. 6.3: Кто должен нести ответственность?","es":"6.1: La tarifa (Entgelt) se convierte en el precio de la carga ambiental. 6.2: Embalaje llamativo frente a basura. 6.3: ¿Quién debe asumir la responsabilidad?","pt":"6.1: A taxa (Entgelt) torna-se o preço da carga ambiental. 6.2: Embalagem chamativa contra lixo. 6.3: Quem deve assumir a responsabilidade?"},"parts":[{"q":"6.1 Warum staffelt ein System wie der Grüne Punkt sein Entgelt danach, wie problematisch der Verpackungsstoff ist? Welche Wirkung soll das haben?","m":"Weil das Entgelt so zu einem Preis für Umweltbelastung wird. Wer eine schwer recycelbare Verpackung wählt, zahlt mehr – und hat damit einen wirtschaftlichen Grund, auf eine besser verwertbare umzustellen. Das Gesetz verbietet die schlechte Verpackung also nicht, es macht sie teurer."},{"q":"6.2 Die Verpackung ist Werbemittel und Abfall zugleich. Beschreibe den Zielkonflikt, in dem ein Einzelhändler dadurch steckt, und nenne einen Weg, ihn zu entschärfen.","m":"Eine auffällige, aufwendige Verpackung verkauft besser, erzeugt aber mehr Müll, höhere Systementgelte und schadet dem Bild eines umweltbewussten Betriebs. Entschärfen lässt sich das zum Beispiel durch recyclingfähige Materialien, weniger Umverpackung, Mehrwegsysteme oder das Anbieten unverpackter Ware – und indem der Betrieb genau das in seiner Öffentlichkeitsarbeit sichtbar macht."},{"q":"6.3 Warum verbietet das Gesetz, die Registrierung bei der Zentralen Stelle von einem Dritten erledigen zu lassen?","m":"Weil die Registrierung die Verantwortung eindeutig zuordnen soll. Nur wenn sich derjenige selbst registriert, der die Verpackung tatsächlich in Verkehr bringt, lassen sich seine Meldungen mit den Daten der dualen Systeme abgleichen. Über Dritte ließen sich Mengen verschleiern, und genau das soll die Zentrale Stelle verhindern."}]},{"id":"v1","level":"v","no":"Vertiefung 1","type":"free","pts":1,"title":"Warum ist das so?","instr":{"de":"Warum ist eine Pfandflasche gleichzeitig Verkaufsverpackung und Mehrwegverpackung? Begründe.","vi":"Tại sao chai có đặt cọc vừa là Verkaufsverpackung vừa là Mehrwegverpackung? Hãy giải thích.","tr":"Depozitolu bir şişe neden hem Verkaufsverpackung (satış ambalajı) hem de Mehrwegverpackung (çok kullanımlık ambalaj)? Açıkla.","ar":"لماذا تُعدّ الزجاجة ذات التأمين (Pfand) Verkaufsverpackung (تغليف بيع) وMehrwegverpackung (تغليف متعدد الاستعمال) في الوقت نفسه؟ علّل.","ti":"ስለምንታይ እዩ ሓደ Pfand ዘለዎ ጥርሙዝ ሓደ ጊዜ Verkaufsverpackung (ማሸጊያ ሽያጭ) ድማ Mehrwegverpackung (ብዙሕ ጊዜ ዝጥቀሙሉ ማሸጊያ) ዝኸውን? ኣብርህ።","uk":"Чому пляшка із заставою (Pfand) одночасно є Verkaufsverpackung (торговельна упаковка) і Mehrwegverpackung (багаторазова упаковка)? Обґрунтуй.","ru":"Почему бутылка с залогом (Pfand) одновременно является Verkaufsverpackung (торговая упаковка) и Mehrwegverpackung (многоразовая упаковка)? Объясни.","es":"¿Por qué una botella con depósito (Pfand) es a la vez Verkaufsverpackung (embalaje de venta) y Mehrwegverpackung (embalaje reutilizable)? Justifícalo.","pt":"Porque é que uma garrafa com depósito (Pfand) é ao mesmo tempo Verkaufsverpackung (embalagem de venda) e Mehrwegverpackung (embalagem reutilizável)? Justifica."},"tip":{"de":"Es sind zwei verschiedene Fragen: Wo steht sie im Weg der Ware? Wie oft wird sie benutzt?","vi":"Đó là hai câu hỏi khác nhau: nó đứng ở đâu trên đường đi của hàng? Dùng bao nhiêu lần?","tr":"İki farklı soru var: Malın yolunda nerede duruyor? Kaç kez kullanılıyor?","ar":"هذان سؤالان مختلفان: أين تقف في طريق السلعة؟ كم مرة تُستعمل؟","ti":"ክልተ ዝተፈላለዩ ሕቶታት እየን፥ ኣብ መገዲ እቲ ሸቀጥ ኣበይ ደው ይብል? ክንደይ ጊዜ ይጥቀምሉ?","uk":"Це два різні запитання: де вона стоїть на шляху товару? Скільки разів її використовують?","ru":"Это два разных вопроса: где она стоит на пути товара? Сколько раз её используют?","es":"Son dos preguntas distintas: ¿dónde está en el camino de la mercancía? ¿Cuántas veces se usa?","pt":"São duas perguntas diferentes: onde está no caminho da mercadoria? Quantas vezes é utilizada?"},"parts":[{"q":"Meine Begründung:","m":"Der Endverbraucher nimmt die Flasche mit nach Hause (Verkaufsverpackung). Sie wird zurückgebracht, gereinigt und wieder befüllt, also mehrmals benutzt (Mehrwegverpackung). Die beiden Begriffe beantworten zwei verschiedene Fragen: Wo? und Wie oft?","s":["Die Flasche ist …, weil …"]}]},{"id":"v2","level":"v","no":"Vertiefung 2","type":"free","pts":1,"title":"Begründe deine Entscheidung","instr":{"de":"Ein Onlinehändler verschickt Ware in Kartons an Privatkunden. Muss er sich bei der Zentralen Stelle Verpackungsregister registrieren? Begründe.","vi":"Một cửa hàng online gửi hàng trong thùng carton cho khách cá nhân. Cửa hàng có phải đăng ký tại Zentrale Stelle Verpackungsregister không? Hãy giải thích.","tr":"Bir online satıcı malı karton kutularla özel müşterilere gönderiyor. Zentrale Stelle Verpackungsregister'e kaydolmak zorunda mı? Açıkla.","ar":"يرسل متجر إنترنت بضائع في كراتين إلى زبائن أفراد. هل يجب عليه التسجيل لدى Zentrale Stelle Verpackungsregister؟ علّل.","ti":"ሓደ ናይ ኦንላይን ነጋዳይ   return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))}${it.level==='v'?' ('+u('vert')+')':''} <span class="st ${cls}">${it.pts?fmt(g.got)+' / '+fmt(g.max):''}</span></h4><ul>${li}</ul></div>`}).join('');
 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}
/* ---------- Ereignisse ---------- */
function cardOf(e){const c=e.closest('.card');return c?D.items.find(x=>x.id===c.dataset.id):null}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();return}if(t.id==='dt'){S.date=t.value;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.rate){const it=cardOf(t);A(it.id)[t.dataset.k]=t.dataset.rate;$$('[data-k="'+t.dataset.k+'"]',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));progress();save();return}
 const act=t.dataset.act;if(!act)return;const it=D.items.find(x=>x.id===t.dataset.id);
 if(act==='check'){S.checked[it.id]=true;paint(it);progress();save()}
 if(act==='rdchk'){A(it.id).chk=true;const c=$('#c_'+it.id);const keep=window.scrollY;const fbk=true;renderCard(it);paint(it);window.scrollTo(0,keep);progress();save()}
 if(act==='model'){S.shown[it.id]=true;renderCard(it);progress();save()}
});
function renderCard(it){const old=$('#c_'+it.id);const tmp=document.createElement('div');tmp.innerHTML=cardHtml(it);const det=old.querySelector('.tip').open;old.replaceWith(tmp.firstChild);if(S.checked[it.id]||it.type==='read')paint(it)}
function evaluate(){renderResult();$('#result').scrollIntoView({behavior:'smooth'})}
$('#b_eval').onclick=evaluate;
$('#b_pdf').onclick=()=>{renderResult();setTimeout(()=>window.print(),100)};
$('#b_restart').onclick=()=>$('#modal').classList.add('on');
$('#m_no').onclick=()=>$('#modal').classList.remove('on');
$('#m_yes').onclick=()=>{$('#modal').classList.remove('on');S=def();clearStore();$('#nm').value='';$('#dt').value=S.date;renderAll();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',()=>{$$('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})});
/* ---------- Start ---------- */
const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a.r=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();
