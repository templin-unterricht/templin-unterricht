<script>
const SHEET={"id":"M9","short":"LF 5 · Modul 9","title":"Modul 9 – Verpackung und Verpackungsgesetz","sub":"Lernfeld 5 · Werben und den Verkauf fördern","can":[{"de":"Ich kann die fünf Aufgaben der Verpackung nennen und an einem Produkt zeigen.","vi":"Em có thể nêu năm nhiệm vụ của Verpackung (bao bì) và chỉ ra trên một sản phẩm."},{"de":"Ich kann die fünf Verpackungsarten unterscheiden.","vi":"Em có thể phân biệt năm loại bao bì."},{"de":"Ich kann die Pflichten aus dem Verpackungsgesetz nennen und erklären, wofür der Grüne Punkt steht.","vi":"Em có thể nêu các nghĩa vụ theo Verpackungsgesetz (luật bao bì) và giải thích Grüner Punkt (Chấm xanh) là gì."}],"items":[{"id":"a1","no":"Aufgabe 1","type":"free","pts":1,"title":"Ankommen: Was weißt du noch?","instr":{"de":"Beantworte die Fragen aus dem Kopf. Nicht nachschlagen. Es geht darum, was hängengeblieben ist.","vi":"Hãy trả lời bằng trí nhớ, không tra cứu. Điều quan trọng là em còn nhớ được gì."},"tip":{"de":"Denke an Modul 7 und 8 und an LF 1, LF 4 und WiSo. Bei Frage 5 darfst du raten.","vi":"Hãy nhớ lại Modul 7 và 8, LF 1, LF 4 và WiSo. Câu 5 em được phép đoán."},"parts":[{"q":"1. Nenne drei Bedienungsformen im Einzelhandel. (aus LF 1/LF 4)","m":"Bedienung (Fremdbedienung), Vorwahl, Selbstbedienung."},{"q":"2. Was ist ein Lockangebot?","m":"Die beworbene Ware wird nicht in angemessenem Umfang vorgehalten – angemessen ist ein Vorrat für zwei Tage."},{"q":"3. Nenne zwei Instrumente der Kundenbindung.","m":"Zum Beispiel Kundenzeitung, Newsletter, Kunden-App, Coupons, Bonuspunkte, Social Media."},{"q":"4. Nenne zwei Pflichten von Auszubildenden. (aus WiSo)","m":"Z. B. Lernpflicht, Berufsschulpflicht, Weisungen befolgen, Schweigepflicht, Ausbildungsnachweis führen."},{"q":"5. Warum ist die Verpackung auch ein Werbemittel? (Rate ruhig.)","m":"Weil sie durch Farbe, Form und Gestaltung auffällt und in der Selbstbedienung die Aufgabe des Verkäufers übernimmt."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)"},"html":"<p>Verpackung · Schutz der Waren · Serviceaufgabe · Werbemittel · Transportverpackung · Umverpackung · Verkaufsverpackung · Einwegverpackung · Mehrwegverpackung · Verpackungsgesetz · Zentrale Stelle Verpackungsregister · Registrierungspflicht · Systembeteiligungspflicht · Vertreiber · Grüner Punkt · Entgelt · Verwertungsquote<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"Verpackung = bao bì · Transportverpackung = bao bì vận chuyển · Umverpackung = bao bì ngoài (bọc thêm) · Verkaufsverpackung = bao bì bán hàng (khách mang về) · Einwegverpackung = bao bì dùng một lần · Mehrwegverpackung = bao bì dùng nhiều lần · Verpackungsgesetz = luật bao bì · Zentrale Stelle Verpackungsregister = cơ quan đăng ký bao bì · Registrierungspflicht = nghĩa vụ đăng ký · Systembeteiligungspflicht = nghĩa vụ tham gia hệ thống thu gom · Vertreiber = bên đưa hàng ra thị trường · Grüner Punkt = Chấm xanh (hệ thống thu gom bao bì) · Entgelt = phí · Verwertungsquote = tỷ lệ tái chế"},{"id":"r1","no":"Lesen 1","type":"read","title":"Wozu dient die Verpackung?","instr":{"de":"Lies den Text. Tippe an: Wozu dient die Verpackung?","vi":"Em đọc đoạn văn. Chạm vào: bao bì dùng để làm gì?"},"tip":{"de":"Es sind drei Dinge: Schutz, Werbung und ein dritter Bereich, der mit dem Kaufen zu tun hat.","vi":"Có ba điều: bảo vệ, quảng cáo và một điều thứ ba liên quan đến việc mua bán."},"paras":["Die Verpackung dient dem [[Schutz]] der Ware während des [[Transports]] sowie der [[Werbung]] und dem [[Verkauf]]. In der Selbstbedienung übernimmt sie im Verkaufsraum die Aufgabe des [[Verkäufers]]."],"vi":"Tóm tắt: Bao bì bảo vệ hàng trong lúc vận chuyển, đồng thời dùng để quảng cáo và bán hàng. Trong tự phục vụ, bao bì làm công việc của người bán hàng.","quiz":{"q":"Welche Aufgabe übernimmt die Verpackung in der Selbstbedienung?","o":["Die Aufgabe des Verkäufers","Die Aufgabe der Kasse","Die Aufgabe des Lieferanten"],"a":0,"why":{"de":"Durch Farbe, Form und Gestaltung „verkauft“ die Verpackung die Ware.","vi":"Nhờ màu sắc, hình dáng và thiết kế mà bao bì “bán” món hàng."}}},{"id":"w2","type":"info","title":{"de":"Aufgaben und Arten der Verpackung","vi":"Nhiệm vụ và loại bao bì"},"html":"<p><b>Die fünf Aufgaben:<\/b><br><b>Schutz der Waren:<\/b> vor Schmutz, Beschädigung, Nässe oder Austrocknung.<br><b>Informationen über die Ware:<\/b> Menge, Herkunft, Gebrauch, Pflege, Haltbarkeit, Zusammensetzung.<br><b>Erleichterung des Gebrauchs:<\/b> Öffnen, Verschließen, Dosieren, Lagern, Stapeln (zum Beispiel Sprühflasche).<br><b>Serviceaufgaben:<\/b> Essen zubereiten, Verpackung wiederverwenden (Senf im Trinkglas), Bedarfseinheiten bilden.<br><b>Werbemittel:<\/b> attraktive Gestaltung. Die Verpackung gibt der Ware „ein Gesicht“.<\/p><p><b>Die fünf Arten:<\/b><br><b>Transportverpackung:<\/b> schützt auf dem Weg vom Hersteller zum Einzelhändler (Kartonagen, Paletten, Schrumpffolien).<br><b>Umverpackung:<\/b> zusätzliche Verpackung um die Verkaufsverpackung (Faltschachtel um eine Zahnpastatube). Sie ermöglicht Selbstbedienung, wirbt und erschwert Diebstahl.<br><b>Verkaufsverpackung:<\/b> vom Endverbraucher zum Transport oder bis zum Verbrauch verwendet (Tüten, Flaschen, Dosen).<br><b>Einwegverpackung:<\/b> einmal genutzt, dann Recycling (Konservendose, Joghurtbecher).<br><b>Mehrwegverpackung:<\/b> für mehrmaligen Gebrauch (Pfandflasche, Getränkekisten, Paletten).<\/p><div class=\"box merke\"><b>Aufpassen:<\/b> Einweg und Mehrweg beschreiben, wie oft eine Verpackung benutzt wird. Transport, Um- und Verkaufsverpackung beschreiben, wo im Weg der Ware sie eingesetzt wird. Eine Pfandflasche ist also gleichzeitig Verkaufs- und Mehrwegverpackung.<\/div>","vi":"Năm nhiệm vụ: bảo vệ hàng; cung cấp thông tin; làm dễ sử dụng; dịch vụ (dùng lại, chế biến); quảng cáo. Năm loại: Transportverpackung (vận chuyển), Umverpackung (bọc ngoài), Verkaufsverpackung (khách mang về), Einweg (dùng một lần), Mehrweg (dùng nhiều lần). Chú ý: Einweg/Mehrweg nói về số lần dùng; Transport/Um/Verkauf nói về vị trí trên đường đi của hàng. Chai có tiền đặt cọc vừa là Verkaufs- vừa là Mehrwegverpackung."},{"id":"m1","no":"Übung 1","type":"match","pts":0,"title":"Die fünf Aufgaben der Verpackung","instr":{"de":"Ordne jedes Beispiel der richtigen Aufgabe zu.","vi":"Em ghép mỗi ví dụ với đúng nhiệm vụ."},"tip":{"de":"Frage dich: Schützt es, informiert es, erleichtert es den Gebrauch, ist es ein Service oder wirbt es?","vi":"Tự hỏi: nó bảo vệ, thông báo, giúp dễ dùng, là dịch vụ hay quảng cáo?"},"rows":[{"l":"Auf dem Etikett steht das Mindesthaltbarkeitsdatum.","a":"Informationen über die Ware"},{"l":"Eine Sprühflasche lässt sich leicht dosieren.","a":"Erleichterung des Gebrauchs"},{"l":"Senf im Trinkglas: Das Glas wird später als Trinkglas benutzt.","a":"Serviceaufgaben"},{"l":"Die Schachtel hat ein Foto und leuchtende Farben.","a":"Werbemittel"},{"l":"Eine Folie hält Nässe und Schmutz fern.","a":"Schutz der Waren"}]},{"id":"m2","no":"Übung 2","type":"match","pts":0,"title":"Die Verpackungsarten","instr":{"de":"Ordne jedem Beispiel die richtige Art zu.","vi":"Em ghép mỗi ví dụ với đúng loại."},"tip":{"de":"Wo im Weg der Ware steht die Verpackung? Und wie oft wird sie benutzt?","vi":"Bao bì đứng ở đâu trên đường đi của hàng? Và được dùng bao nhiêu lần?"},"rows":[{"l":"Kartons und Paletten, mit denen der Hersteller liefert","a":"Transportverpackung"},{"l":"Faltschachtel um eine Zahnpastatube","a":"Umverpackung"},{"l":"Papiertüte, in der der Kunde die Ware nach Hause trägt","a":"Verkaufsverpackung"},{"l":"Joghurtbecher","a":"Einwegverpackung"},{"l":"Getränkekiste, die zum Hersteller zurückgeht","a":"Mehrwegverpackung"}]},{"id":"r2","no":"Lesen 2","type":"read","title":"Das Verpackungsgesetz","instr":{"de":"Lies den Text. Tippe an: Was ist das Ziel des Verpackungsgesetzes?","vi":"Em đọc đoạn văn. Chạm vào: mục tiêu của Verpackungsgesetz là gì?"},"tip":{"de":"Es geht um zwei Ziele: weniger von etwas und mehr von etwas anderem.","vi":"Có hai mục tiêu: ít đi một thứ và nhiều lên một thứ khác."},"paras":["Das Verpackungsgesetz (VerpackG) gilt für alle, die eine mit Ware befüllte Verpackung in Verkehr bringen, die beim Endverbraucher anfällt. Ziel ist, den anfallenden [[Verpackungsmüll]] zu [[verringern]] und wesentlich mehr Abfälle aus privaten Haushalten zu [[recyceln]]. Dafür gibt es die „Zentrale Stelle Verpackungsregister“."],"vi":"Tóm tắt: Verpackungsgesetz áp dụng cho người đưa hàng đóng gói ra thị trường. Mục tiêu: giảm rác bao bì và tái chế nhiều hơn rác thải từ hộ gia đình.","quiz":{"q":"Wer ist im Verpackungsgesetz mit „Hersteller“ gemeint?","o":["Der Vertreiber, der die Verpackung erstmals gewerbsmäßig in Verkehr bringt","Die Firma, die das Verpackungsmaterial herstellt","Der Endverbraucher"],"a":0,"why":{"de":"Gemeint ist der Vertreiber, auch ein Onlinehändler. Nicht der Hersteller des Materials.","vi":"Ý nói người đưa hàng ra thị trường, kể cả cửa hàng online. Không phải nhà sản xuất vật liệu bao bì."}}},{"id":"w3","type":"info","title":{"de":"Drei Pflichten und Folgen für den Einzelhändler","vi":"Ba nghĩa vụ và hệ quả cho nhà bán lẻ"},"html":"<p><b>1. Registrierungspflicht:<\/b> Wer mit Ware befüllte Verpackungen, die beim privaten Endverbraucher anfallen, erstmals gewerbsmäßig in Verkehr bringt, muss sich vorher bei der Zentralen Stelle Verpackungsregister registrieren. Einen Dritten damit zu beauftragen, ist nicht zulässig.<br><b>2. Systembeteiligungspflicht:<\/b> Der Vertreiber darf Rücknahme und Verwertung nicht selbst organisieren. Er muss sich einem System anschließen, zum Beispiel der Grüner Punkt GmbH.<br><b>3. Meldepflicht:<\/b> Die in Verkehr gebrachten Verpackungen müssen an die Zentrale Stelle gemeldet werden, mit Materialart und Menge.<\/p><p>Für die Beteiligung an einem System zahlen die Vertreiber ein <b>Entgelt<\/b>. Es ist umso höher, je ökologisch problematischer der Verpackungsstoff ist. Davon finanzieren die Systeme gelbe Tonnen, Glascontainer, Altpapiertonnen und die Verwertung.<\/p><p><b>Für den Einzelhändler:<\/b> Fallen bei ihm Verkaufs- und Umverpackungen an, muss er sie zurücknehmen und der Wiederverwendung oder dem Recycling zuführen. Seit Januar 2019 steigen die Anforderungen: Papier, Pappe und Karton sollen im Jahresmittel von 70 % auf 85 % wiederverwendet oder recycelt werden, Aluminium von 60 % auf 80 %. Der Anteil der in Mehrweggetränkeverpackungen abgefüllten Getränke soll mindestens 70 % erreichen.<\/p>","vi":"Ba nghĩa vụ: 1. đăng ký với cơ quan trung ương (không được nhờ người khác); 2. tham gia một hệ thống thu gom như Grüner Punkt (không tự tổ chức); 3. báo cáo loại vật liệu và số lượng. Phí (Entgelt) càng cao khi vật liệu càng gây hại cho môi trường. Nhà bán lẻ phải nhận lại bao bì bán hàng và bao bì ngoài."},{"id":"m3","no":"Übung 3","type":"match","pts":0,"title":"Die drei Pflichten","instr":{"de":"Ordne jeder Pflicht die richtige Beschreibung zu.","vi":"Em ghép mỗi nghĩa vụ với mô tả đúng."},"tip":{"de":"Registrieren = anmelden. Systembeteiligung = bei einem System mitmachen. Melden = Zahlen mitteilen.","vi":"Registrieren = đăng ký. Systembeteiligung = tham gia một hệ thống. Melden = báo số liệu."},"rows":[{"l":"Registrierungspflicht","a":"Sich vor dem Inverkehrbringen bei der Zentralen Stelle Verpackungsregister anmelden"},{"l":"Systembeteiligungspflicht","a":"Sich einem System anschließen, zum Beispiel dem Grünen Punkt"},{"l":"Meldepflicht","a":"Materialart und Menge der Verpackungen an die Zentrale Stelle melden"}]},{"id":"mcq","no":"Übung 4","type":"mc","pts":0,"title":"Zahlen und Regeln","instr":{"de":"Wähle die richtige Antwort.","vi":"Em chọn đáp án đúng."},"tip":{"de":"Lies im Abschnitt „Für den Einzelhändler“ nach.","vi":"Đọc lại phần “Für den Einzelhändler”."},"qs":[{"q":"Wie hoch soll der Anteil der Mehrweggetränkeverpackungen mindestens sein?","o":["70 %","40 %","100 %"],"a":0,"why":{"de":"Der Anteil soll mindestens 70 % erreichen.","vi":"Tỷ lệ phải đạt ít nhất 70 %."}},{"q":"Was muss der Einzelhändler mit Verkaufs- und Umverpackungen tun, die bei ihm anfallen?","o":["Zurücknehmen und der Wiederverwendung oder dem Recycling zuführen","In den Hausmüll werfen","Verbrennen"],"a":0,"why":{"de":"Er ist zur Rücknahme verpflichtet.","vi":"Cửa hàng có nghĩa vụ nhận lại."}}]},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: Eine Verpackung einordnen","html":"<div class=\"box\"><b>Der Gegenstand:<\/b> Eine Zahnpastatube steckt in einer bedruckten Faltschachtel. Beim Kauf legt die Verkäuferin sie in eine Papiertüte.<\/div><p><b>Schritt 1:<\/b> Drei Verpackungen sind beteiligt: die Tube, die Faltschachtel und die Papiertüte.<br><b>Schritt 2:<\/b> Die Tube nimmt der Kunde mit nach Hause und benutzt sie bis zum Verbrauch. Das ist die Verkaufsverpackung. Sie wird einmal genutzt, also zugleich eine Einwegverpackung.<br><b>Schritt 3:<\/b> Die Faltschachtel ist eine zusätzliche Verpackung um die Verkaufsverpackung. Sie ermöglicht Selbstbedienung, wirbt und erschwert Diebstahl. Das ist eine Umverpackung.<br><b>Schritt 4:<\/b> Die Papiertüte dient dem Kunden zum Transport. Auch eine Verkaufsverpackung.<br><b>Schritt 5:<\/b> Die Faltschachtel erfüllt diese Aufgaben: Schutz der Ware, Informationen über die Ware und Werbemittel.<\/p><div class=\"box merke\"><b>Ergebnis:<\/b> Zwei getrennte Fragen: Wo im Weg der Ware steht die Verpackung (Transport – Um – Verkauf)? Und wie oft wird sie benutzt (Einweg – Mehrweg)?<\/div>","vi":"Ví dụ mẫu: tuýp kem đánh răng trong hộp giấy, khi mua cho vào túi giấy. Tuýp = Verkaufsverpackung và Einwegverpackung. Hộp giấy = Umverpackung (cho phép tự phục vụ, quảng cáo, chống trộm). Túi giấy = Verkaufsverpackung. Hai câu hỏi tách biệt: bao bì ở đâu trên đường đi của hàng? Dùng bao nhiêu lần?"},{"id":"a3","no":"Aufgabe 3","type":"table","pts":1,"title":"Geführte Übung","instr":{"de":"Wähle zu jedem Gegenstand die Verpackungsart. Wähle bei den Beispielen 1 bis 3 auch Einweg oder Mehrweg und bei den Beispielen 3 und 4 eine Aufgabe der Verpackung.","vi":"Với mỗi vật, em chọn loại bao bì. Với ví dụ 1 đến 3, chọn thêm Einweg hoặc Mehrweg; với ví dụ 3 và 4, chọn thêm một nhiệm vụ của bao bì."},"tip":{"de":"Zwei Fragen: Wo steht die Verpackung im Weg der Ware? Wie oft wird sie benutzt? Pfand ist ein Hinweis auf die Nutzungsart.","vi":"Hai câu hỏi: bao bì đứng ở đâu trên đường đi của hàng? Dùng bao nhiêu lần? Tiền đặt cọc (Pfand) là gợi ý về cách sử dụng."},"cols":["Gegenstand","Art (Weg der Ware)","Einweg oder Mehrweg","Aufgabe"],"colOpts":[null,["Transportverpackung","Umverpackung","Verkaufsverpackung"],["Einwegverpackung","Mehrwegverpackung"],["Schutz der Waren","Informationen über die Ware","Erleichterung des Gebrauchs","Serviceaufgaben","Werbemittel"]],"rows":[["1. Eine Palette, auf der Getränkekisten zum Einzelhändler geliefert werden und die anschließend zum Hersteller zurückgeht.",{"a":"Transportverpackung"},{"a":"Mehrwegverpackung"},"–"],["2. Eine Glasflasche mit Pfand.",{"a":"Verkaufsverpackung"},{"a":"Mehrwegverpackung"},"–"],["3. Eine Konservendose mit Erbsen. Auf dem Etikett stehen Zutaten, Nettofüllmenge und Mindesthaltbarkeitsdatum.",{"a":"Verkaufsverpackung"},{"a":"Einwegverpackung"},{"a":["Schutz der Waren","Informationen über die Ware"]}],["4. Eine auffällig gestaltete Parfümschachtel mit Foto und Werbetext.",{"a":"Umverpackung"},"–",{"a":"Werbemittel"}]]},{"id":"a4","no":"Aufgabe 4","type":"free","pts":2,"title":"Freie Übung","instr":{"de":"Beantworte die Fragen in eigenen Worten.","vi":"Em trả lời các câu hỏi bằng lời của mình."},"tip":{"de":"Bei Frage 5: Registrieren, anschließen, melden. Bei Frage 6: Wofür wird das Geld verwendet, und was macht es teurer?","vi":"Câu 5: đăng ký, tham gia, báo cáo. Câu 6: tiền dùng vào việc gì, và điều gì làm nó đắt hơn?"},"parts":[{"q":"1. Nenne die fünf Aufgaben der Verpackung.","m":"Schutz der Waren, Informationen über die Ware, Erleichterung des Gebrauchs, Serviceaufgaben, Werbemittel."},{"q":"2. Nenne die fünf Arten der Verpackung.","m":"Transportverpackung, Umverpackung, Verkaufsverpackung, Einwegverpackung, Mehrwegverpackung."},{"q":"3. Erkläre den Unterschied zwischen Umverpackung und Verkaufsverpackung.","m":"Die Umverpackung ist eine zusätzliche Verpackung um die Verkaufsverpackung; sie ermöglicht die Selbstbedienung, wirbt und erschwert Diebstahl. Die Verkaufsverpackung verwendet der Endverbraucher zum Transport oder bis zum Verbrauch der Ware.","s":["Die Umverpackung ist …","Die Verkaufsverpackung ist …"]},{"q":"4. Was ist das Ziel des Verpackungsgesetzes?","m":"Den anfallenden Verpackungsmüll zu verringern und wesentlich mehr Abfälle aus privaten Haushalten zu recyceln."},{"q":"5. Nenne die drei Pflichten, die sich aus dem Verpackungsgesetz ergeben.","m":"Registrierungspflicht bei der Zentralen Stelle Verpackungsregister, Systembeteiligungspflicht (z. B. Grüner Punkt) und Meldepflicht über Materialart und Menge."},{"q":"6. Wofür wird das Entgelt verwendet, das ein Vertreiber an ein System zahlt? Und wovon hängt seine Höhe ab?","m":"Aus den Zahlungen finanzieren die Systeme die Erfassung der Verpackungen – gelbe Tonne, Glascontainer, Altpapiertonne – und die Verwertung. Das Entgelt ist umso höher, je ökologisch problematischer der Verpackungsstoff ist."},{"q":"7. Was muss ein Einzelhändler mit Verkaufs- und Umverpackungen tun, die bei ihm anfallen?","m":"Er ist verpflichtet, sie zurückzunehmen und einer Wiederverwendung oder dem Recycling zuzuführen. Eine Rückgabe an den Vorvertreiber ist ebenfalls möglich."}]},{"id":"a5","no":"Aufgabe 5","type":"free","pts":1,"title":"Aus deinem Betrieb","instr":{"de":"Suche in deinem Ausbildungsbetrieb zu jeder der fünf Verpackungsarten ein Beispiel. Notiere zu einem davon, welche Aufgaben die Verpackung erfüllt.","vi":"Tìm trong cửa hàng nơi em thực tập một ví dụ cho mỗi loại trong năm loại bao bì. Với một ví dụ, ghi bao bì đó làm những nhiệm vụ nào."},"tip":{"de":"Typisch: Karton vom Lieferanten, Faltschachtel, Tüte oder Flasche, Joghurtbecher, Getränkekiste oder Palette.","vi":"Thường gặp: thùng carton từ nhà cung cấp, hộp giấy, túi hoặc chai, cốc sữa chua, két nước hoặc pallet."},"parts":[{"q":"Meine fünf Beispiele und die Aufgaben:","m":"Individuelle Lösung. Erwartet werden fünf Beispiele mit korrekter Zuordnung und zu einem davon mindestens zwei benannte Aufgaben. Häufig genannt: Karton vom Lieferanten (Transport), Faltschachtel (Um), Tüte oder Flasche (Verkauf), Joghurtbecher (Einweg), Getränkekiste oder Palette (Mehrweg).","s":["Transportverpackung: …","Umverpackung: …","Die Aufgaben sind: …"]}]},{"id":"a6","no":"Aufgabe 6","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh."},"tip":{"de":"6.1: Das Entgelt wird zum Preis für Umweltbelastung. 6.2: Auffällige Verpackung gegen Müll. 6.3: Wer soll die Verantwortung tragen?","vi":"6.1: phí trở thành giá của việc gây hại môi trường. 6.2: bao bì bắt mắt so với rác thải. 6.3: ai phải chịu trách nhiệm?"},"parts":[{"q":"6.1 Warum staffelt ein System wie der Grüne Punkt sein Entgelt danach, wie problematisch der Verpackungsstoff ist? Welche Wirkung soll das haben?","m":"Weil das Entgelt so zu einem Preis für Umweltbelastung wird. Wer eine schwer recycelbare Verpackung wählt, zahlt mehr – und hat damit einen wirtschaftlichen Grund, auf eine besser verwertbare umzustellen. Das Gesetz verbietet die schlechte Verpackung also nicht, es macht sie teurer."},{"q":"6.2 Die Verpackung ist Werbemittel und Abfall zugleich. Beschreibe den Zielkonflikt, in dem ein Einzelhändler dadurch steckt, und nenne einen Weg, ihn zu entschärfen.","m":"Eine auffällige, aufwendige Verpackung verkauft besser, erzeugt aber mehr Müll, höhere Systementgelte und schadet dem Bild eines umweltbewussten Betriebs. Entschärfen lässt sich das zum Beispiel durch recyclingfähige Materialien, weniger Umverpackung, Mehrwegsysteme oder das Anbieten unverpackter Ware – und indem der Betrieb genau das in seiner Öffentlichkeitsarbeit sichtbar macht."},{"q":"6.3 Warum verbietet das Gesetz, die Registrierung bei der Zentralen Stelle von einem Dritten erledigen zu lassen?","m":"Weil die Registrierung die Verantwortung eindeutig zuordnen soll. Nur wenn sich derjenige selbst registriert, der die Verpackung tatsächlich in Verkehr bringt, lassen sich seine Meldungen mit den Daten der dualen Systeme abgleichen. Über Dritte ließen sich Mengen verschleiern, und genau das soll die Zentrale Stelle verhindern."}]},{"id":"v1","level":"v","no":"Vertiefung 1","type":"free","pts":1,"title":"Warum ist das so?","instr":{"de":"Warum ist eine Pfandflasche gleichzeitig Verkaufsverpackung und Mehrwegverpackung? Begründe.","vi":"Tại sao chai có đặt cọc vừa là Verkaufsverpackung vừa là Mehrwegverpackung? Hãy giải thích."},"tip":{"de":"Es sind zwei verschiedene Fragen: Wo steht sie im Weg der Ware? Wie oft wird sie benutzt?","vi":"Đó là hai câu hỏi khác nhau: nó đứng ở đâu trên đường đi của hàng? Dùng bao nhiêu lần?"},"parts":[{"q":"Meine Begründung:","m":"Der Endverbraucher nimmt die Flasche mit nach Hause (Verkaufsverpackung). Sie wird zurückgebracht, gereinigt und wieder befüllt, also mehrmals benutzt (Mehrwegverpackung). Die beiden Begriffe beantworten zwei verschiedene Fragen: Wo? und Wie oft?","s":["Die Flasche ist …, weil …"]}]},{"id":"v2","level":"v","no":"Vertiefung 2","type":"free","pts":1,"title":"Begründe deine Entscheidung","instr":{"de":"Ein Onlinehändler verschickt Ware in Kartons an Privatkunden. Muss er sich bei der Zentralen Stelle Verpackungsregister registrieren? Begründe.","vi":"Một cửa hàng online gửi hàng trong thùng carton cho khách cá nhân. Cửa hàng có phải đăng ký tại Zentrale Stelle Verpackungsregister không? Hãy giải thích."},"tip":{"de":"Lies die „Stolperfalle“: Wer ist im Gesetz mit „Hersteller“ gemeint?","vi":"Đọc “Stolperfalle” (cái bẫy): trong luật “Hersteller” chỉ ai?"},"parts":[{"q":"Meine Entscheidung und meine Begründung:","m":"Ja. Im Verpackungsgesetz ist mit „Hersteller“ der Vertreiber gemeint, der die Verpackung erstmals gewerbsmäßig in Verkehr bringt – dazu zählen auch Onlinehändler. Die Kartons mit Ware fallen beim privaten Endverbraucher an.","s":["Ja/Nein, weil …"]}]}]};
</script>

  return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))}${it.level==='v'?' ('+u('vert')+')':''} <span class="st ${cls}">${it.pts?fmt(g.got)+' / '+fmt(g.max):''}</span></h4><ul>${li}</ul></div>`}).join('');
 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}
/* ---------- Ereignisse ---------- */
function cardOf(e){const c=e.closest('.card');return c?D.items.find(x=>x.id===c.dataset.id):null}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();return}if(t.id==='dt'){S.date=t.value;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.rate){const it=cardOf(t);A(it.id)[t.dataset.k]=t.dataset.rate;$$('[data-k="'+t.dataset.k+'"]',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));progress();save();return}
 const act=t.dataset.act;if(!act)return;const it=D.items.find(x=>x.id===t.dataset.id);
 if(act==='check'){S.checked[it.id]=true;paint(it);progress();save()}
 if(act==='rdchk'){A(it.id).chk=true;const c=$('#c_'+it.id);const keep=window.scrollY;const fbk=true;renderCard(it);paint(it);window.scrollTo(0,keep);progress();save()}
 if(act==='model'){S.shown[it.id]=true;renderCard(it);progress();save()}
});
function renderCard(it){const old=$('#c_'+it.id);const tmp=document.createElement('div');tmp.innerHTML=cardHtml(it);const det=old.querySelector('.tip').open;old.replaceWith(tmp.firstChild);if(S.checked[it.id]||it.type==='read')paint(it)}
function evaluate(){renderResult();$('#result').scrollIntoView({behavior:'smooth'})}
$('#b_eval').onclick=evaluate;
$('#b_pdf').onclick=()=>{renderResult();setTimeout(()=>window.print(),100)};
$('#b_restart').onclick=()=>$('#modal').classList.add('on');
$('#m_no').onclick=()=>$('#modal').classList.remove('on');
$('#m_yes').onclick=()=>{$('#modal').classList.remove('on');S=def();clearStore();$('#nm').value='';$('#dt').value=S.date;renderAll();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',()=>{$$('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})});
/* ---------- Start ---------- */
const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a.r=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();
