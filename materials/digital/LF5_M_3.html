<style>

*{box-sizing:border-box}html{font-size:calc(17px*var(--fs));-webkit-text-size-adjust:100%}

button,select,input,textarea{font:inherit;color:inherit}

.model{background:var(--okbg);border-radius:12px;padding:.6rem .9rem;margin:.4rem 0}
.model .t{font-weight:700;color:var(--ok);font-size:.85rem}
.rate{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0}.rate button{flex:1 1 7rem}
.rate button.on{background:var(--pri);color:#fff}
.ok{background:var(--okbg)!important;outline:2px solid var(--ok)}.bad{background:var(--badbg)!important;outline:2px solid var(--bad)}
select.ok,.in.ok,select.bad,.in.bad{outline-offset:0}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}
.fb{margin-top:.5rem;font-weight:600}.fb.ok{background:none;outline:0;color:var(--ok)}.fb.bad{background:none;outline:0;color:var(--bad)}.fb.mid{color:var(--warn)}

.bottom{background:var(--card);border-radius:16px;padding:1rem 1.1rem;margin:1rem 0}

#result h2{margin:.2rem 0}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.ritem{border-top:1px solid var(--line);padding:.7rem 0}.ritem h4{margin:0 0 .3rem;display:flex;gap:.5rem;flex-wrap:wrap}
.ritem .st{font-weight:800}.st.g{color:var(--ok)}.st.m{color:var(--warn)}.st.r{color:var(--bad)}
.ritem ul{margin:.2rem 0;padding-left:1.2rem}.ritem li{margin:.15rem 0}
.sol{color:var(--ok);font-weight:600}.mine{color:var(--bad)}
.steps{background:#f1f4fb;border-radius:10px;padding:.4rem .8rem;margin:.3rem 0}.steps div{font-family:ui-monospace,Menlo,monospace;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#222;color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:50;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .3s}.toast.on{opacity:.95}

.hide{display:none!important}
@media(max-width:560px){.top{padding:.3rem .5rem}.top .row{gap:.3rem}.top .ttl{display:none}.pills button{min-height:44px;padding:.2rem .6rem;font-size:.8rem}.pills{border-width:1.5px}.fields{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}html{font-size:calc(16px*var(--fs))}}

@media print{
 body{background:#fff;font-size:11pt}.top,.card,.head .can,.bottom,.toast,.modal,.noprint,.head .fields{display:none!important}

}

<script>
const SHEET={"id":"M3","short":"LF 5 · Modul 3","title":"Modul 3 – Werbemittel und Werbeträger","sub":"Lernfeld 5 · Werben und den Verkauf fördern","can":[{"de":"Ich kann Werbemittel und Werbeträger unterscheiden und zu beidem vier Beispiele nennen.","vi":"Em có thể phân biệt Werbemittel (phương tiện quảng cáo) và Werbeträger (nơi/kênh mang quảng cáo) và nêu bốn ví dụ cho mỗi loại.","tr":"Werbemittel (reklam aracı) ile Werbeträger (reklam taşıyıcısı) arasındaki farkı söyleyebilirim ve ikisi için de dört örnek verebilirim.","ar":"أستطيع أن أفرّق بين وسيلة الإعلان (Werbemittel) وحامل الإعلان (Werbeträger) وأذكر أربعة أمثلة لكل منهما.","ti":"ኣብ መንጎ Werbemittel (መሳርሒ ማስታወቂያ) ን Werbeträger (ተሸካሚ ማስታወቂያ) ን ፈላላዪ ክገብር እኽእል፣ ን ነፍሲ ወከፍ ድማ ኣርባዕተ ኣብነት ክጠቅስ እኽእል።","uk":"Я вмію розрізняти Werbemittel (засіб реклами) і Werbeträger (носій реклами) та називати по чотири приклади для кожного.","ru":"Я умею различать Werbemittel (рекламное средство) и Werbeträger (рекламоноситель) и приводить по четыре примера для каждого.","es":"Puedo distinguir Werbemittel (medio publicitario) y Werbeträger (soporte publicitario) y nombrar cuatro ejemplos de cada uno.","pt":"Consigo distinguir Werbemittel (meio publicitário) e Werbeträger (suporte publicitário) e dar quatro exemplos de cada um."},{"de":"Ich kann zu einem Werbemittel sagen, welche Sinne es anspricht.","vi":"Em có thể nói một Werbemittel tác động đến giác quan nào.","tr":"Bir Werbemittel'in (reklam aracı) hangi duyulara hitap ettiğini söyleyebilirim.","ar":"أستطيع أن أقول أي الحواس تخاطبها وسيلة الإعلان (Werbemittel).","ti":"ሓደ Werbemittel (መሳርሒ ማስታወቂያ) ኣየኖት ህዋሳት ከም ዝጽዕን ክነግር እኽእል።","uk":"Я вмію сказати, на які органи чуття впливає Werbemittel (засіб реклами).","ru":"Я умею сказать, на какие органы чувств действует Werbemittel (рекламное средство).","es":"Puedo decir qué sentidos activa un Werbemittel (medio publicitario).","pt":"Consigo dizer que sentidos um Werbemittel (meio publicitário) desperta."},{"de":"Ich kann erklären, was Corporate Design ist, und drei Beispiele aus einem Betrieb nennen.","vi":"Em có thể giải thích Corporate Design (nhận diện thương hiệu) là gì và nêu ba ví dụ từ một cửa hàng.","tr":"Corporate Design'ın (kurumsal tasarım) ne olduğunu açıklayabilirim ve bir işletmeden üç örnek verebilirim.","ar":"أستطيع أن أشرح ما هو التصميم المؤسسي (Corporate Design) وأذكر ثلاثة أمثلة من منشأة تجارية.","ti":"Corporate Design (ሓቢሩ ዝኸይድ ናይ ትካል ምሕሳብ ዲዛይን) እንታይ ምዃኑ ክገልጽ፣ ካብ ሓደ ትካል ድማ ሰለስተ ኣብነት ክጠቅስ እኽእል።","uk":"Я вмію пояснити, що таке Corporate Design (фірмовий стиль), і назвати три приклади з підприємства.","ru":"Я умею объяснить, что такое Corporate Design (фирменный стиль), и привести три примера из предприятия.","es":"Puedo explicar qué es Corporate Design (identidad corporativa) y nombrar tres ejemplos de una empresa.","pt":"Consigo explicar o que é Corporate Design (identidade corporativa) e dar três exemplos de uma empresa."}],"items":[{"id":"a1","no":"Aufgabe 1","type":"free","pts":1,"title":"Ankommen: Was weißt du noch?","instr":{"de":"Beantworte die Fragen aus dem Kopf. Nicht nachschlagen. Es geht darum, was hängengeblieben ist.","vi":"Hãy trả lời bằng trí nhớ, không tra cứu. Điều quan trọng là em còn nhớ được gì.","tr":"Soruları aklından cevapla. Bakma. Önemli olan aklında neyin kaldığı.","ar":"أجب عن الأسئلة من الذاكرة. لا تبحث في المراجع. المهم هو ما بقي في ذهنك.","ti":"ነቲ ሕቶታት ካብ ኣእምሮኻ መልሶ። ኣይትርኣይ። እቲ ኣገዳሲ ኣብ ኣእምሮኻ እንታይ ተሪፉ ዝብል እዩ።","uk":"Відповідай на питання з пам’яті. Не підглядай. Важливо, що в тебе залишилося в голові.","ru":"Отвечай на вопросы по памяти. Не подсматривай. Важно, что у тебя осталось в голове.","es":"Responde a las preguntas de memoria. No mires. Lo importante es lo que has retenido.","pt":"Responde às perguntas de memória. Não consultes. O importante é o que ficou na tua cabeça."},"tip":{"de":"Denke an Modul 2 (Grundsätze, AIDA, Werbebotschaft) und an frühere Lernfelder. Stichworte genügen.","vi":"Hãy nhớ lại Modul 2 (nguyên tắc, AIDA, thông điệp quảng cáo) và các Lernfeld trước. Chỉ cần từ khóa.","tr":"Modul 2'yi (ilkeler, AIDA, reklam mesajı) ve önceki Lernfeld'leri (öğrenme alanları) düşün. Anahtar kelimeler yeterli.","ar":"تذكّر Modul 2 (المبادئ، AIDA، الرسالة الإعلانية) والمجالات التعليمية السابقة (Lernfelder). تكفي الكلمات المفتاحية.","ti":"ብዛዕባ Modul 2 (ሓሳባት፣ AIDA፣ መልእኽቲ ማስታወቂያ) ከምኡ'ውን ቀደም ዝነበሩ Lernfelder (ዓውድታት ትምህርቲ) ሕሰብ። ቁልፍ ቃላት ይኣክሉ።","uk":"Згадай Modul 2 (принципи, AIDA, рекламне повідомлення) та попередні Lernfelder (навчальні поля). Достатньо ключових слів.","ru":"Вспомни Modul 2 (принципы, AIDA, рекламное сообщение) и предыдущие Lernfelder (учебные поля). Достаточно ключевых слов.","es":"Piensa en el Modul 2 (principios, AIDA, mensaje publicitario) y en los Lernfelder (campos de aprendizaje) anteriores. Bastan palabras clave.","pt":"Pensa no Modul 2 (princípios, AIDA, mensagem publicitária) e nos Lernfelder (campos de aprendizagem) anteriores. Bastam palavras-chave."},"parts":[{"q":"1. Nenne zwei der vier Werbegrundsätze.","m":"Zwei aus: klar und wahr – wirksam – einheitlich, stetig und einprägsam – wirtschaftlich."},{"q":"2. Wofür stehen die vier Buchstaben von AIDA? Die deutschen Begriffe genügen.","m":"Aufmerksamkeit – Interesse – Besitzwunsch – Kaufentschluss."},{"q":"3. Was ist eine Werbebotschaft?","m":"Die Inhalte, die einem Personenkreis durch die Werbung vermittelt werden sollen."},{"q":"4. Was ist der Unterschied zwischen Kernsortiment und Randsortiment? (aus LF 1)","m":"Kernsortiment: bringt den Hauptumsatz und prägt das Geschäft; Randsortiment: ergänzt es, kleiner Umsatzanteil."},{"q":"5. Wie prüfst du einen Geldschein auf Echtheit? (aus LF 3)","m":"Fühlen – Sehen – Kippen."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)","tr":"Wortspeicher (kelime deposu)","ar":"Wortspeicher (مخزن الكلمات)","ti":"Wortspeicher (መኽዘን ቃላት)","uk":"Wortspeicher (сховище слів)","ru":"Wortspeicher (хранилище слов)","es":"Wortspeicher (almacén de palabras)","pt":"Wortspeicher (armazém de palavras)"},"html":"<p>Werbemittel · Werbeträger · Streumedien · optisch · akustisch · geschmacklich · geruchlich · gemischte Werbemittel · Printmedien · Schaufenster · Hörfunk · Plakatanschlagstelle · Bandenwerbung · Werbegeschenk · Corporate Design · Firmenlogo<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"Werbemittel = phương tiện quảng cáo (cái truyền nội dung) · Werbeträger = nơi mang quảng cáo (cái phát tán) · Streumedien = phương tiện truyền thông · optisch = nhìn thấy · akustisch = nghe thấy · geschmacklich = nếm · geruchlich = ngửi · gemischte Werbemittel = phương tiện kết hợp · Printmedien = báo in · Schaufenster = tủ kính trưng bày · Hörfunk = đài phát thanh · Plakatanschlagstelle = nơi dán áp phích · Bandenwerbung = quảng cáo quanh sân vận động · Werbegeschenk = quà tặng quảng cáo · Corporate Design = nhận diện thương hiệu · Firmenlogo = logo công ty","sum":{"tr":"Werbemittel = reklam aracı (içeriği aktaran şey) · Werbeträger = reklam taşıyıcısı (yayan şey) · Streumedien = yayın araçları · optisch = görülen · akustisch = duyulan · geschmacklich = tadılan · geruchlich = koklanan · gemischte Werbemittel = karma reklam araçları · Printmedien = basılı medya · Schaufenster = vitrin · Hörfunk = radyo · Plakatanschlagstelle = afiş panosu yeri · Bandenwerbung = stadyum çevresi reklamı · Werbegeschenk = reklam hediyesi · Corporate Design = kurumsal tasarım · Firmenlogo = firma logosu","ar":"Werbemittel = وسيلة الإعلان (ما ينقل المضمون) · Werbeträger = حامل الإعلان (ما ينشره) · Streumedien = وسائل النشر · optisch = يُرى · akustisch = يُسمع · geschmacklich = يُذاق · geruchlich = يُشَمّ · gemischte Werbemittel = وسائل إعلان مختلطة · Printmedien = الوسائط المطبوعة · Schaufenster = واجهة العرض · Hörfunk = الإذاعة · Plakatanschlagstelle = مكان تعليق الملصقات · Bandenwerbung = إعلانات حول الملعب · Werbegeschenk = هدية إعلانية · Corporate Design = التصميم المؤسسي · Firmenlogo = شعار الشركة","ti":"Werbemittel = መሳርሒ ማስታወቂያ (ትሕዝቶ ዘራኽብ) · Werbeträger = ተሸካሚ ማስታወቂያ (ዘሰራጭ) · Streumedien = መሳርሒ ምዝርጋሕ · optisch = ዝርአ · akustisch = ዝስማዕ · geschmacklich = ዝጥዓም · geruchlich = ዝሽተት · gemischte Werbemittel = ዝተሓዋወሱ መሳርሒ ማስታወቂያ · Printmedien = ዝጽሓፉ ሚድያታት · Schaufenster = መስኮት ምርኢት ድኳን · Hörfunk = ራድዮ · Plakatanschlagstelle = ቦታ መለጠፊ ፖስተር · Bandenwerbung = ኣብ ዙርያ ስታዲዮም ዝግበር ማስታወቂያ · Werbegeschenk = ናይ ማስታወቂያ ህያብ · Corporate Design = Corporate Design (ዲዛይን ትካል) · Firmenlogo = ሎጎ ትካል","uk":"Werbemittel = засіб реклами (те, що передає зміст) · Werbeträger = носій реклами (те, що поширює) · Streumedien = засоби поширення · optisch = те, що бачимо · akustisch = те, що чуємо · geschmacklich = те, що куштуємо · geruchlich = те, що нюхаємо · gemischte Werbemittel = змішані засоби реклами · Printmedien = друковані ЗМІ · Schaufenster = вітрина · Hörfunk = радіо · Plakatanschlagstelle = місце для плакатів · Bandenwerbung = реклама навколо стадіону · Werbegeschenk = рекламний подарунок · Corporate Design = фірмовий стиль · Firmenlogo = логотип компанії","ru":"Werbemittel = рекламное средство (то, что передаёт содержание) · Werbeträger = рекламоноситель (то, что распространяет) · Streumedien = средства распространения · optisch = то, что видим · akustisch = то, что слышим · geschmacklich = то, что пробуем на вкус · geruchlich = то, что нюхаем · gemischte Werbemittel = смешанные рекламные средства · Printmedien = печатные СМИ · Schaufenster = витрина · Hörfunk = радио · Plakatanschlagstelle = место для плакатов · Bandenwerbung = реклама вокруг стадиона · Werbegeschenk = рекламный подарок · Corporate Design = фирменный стиль · Firmenlogo = логотип компании","es":"Werbemittel = medio publicitario (lo que transmite el contenido) · Werbeträger = soporte publicitario (lo que lo difunde) · Streumedien = medios de difusión · optisch = se ve · akustisch = se oye · geschmacklich = se prueba · geruchlich = se huele · gemischte Werbemittel = medios publicitarios mixtos · Printmedien = medios impresos · Schaufenster = escaparate · Hörfunk = radio · Plakatanschlagstelle = lugar para carteles · Bandenwerbung = publicidad alrededor del estadio · Werbegeschenk = regalo publicitario · Corporate Design = identidad corporativa · Firmenlogo = logotipo de la empresa","pt":"Werbemittel = meio publicitário (o que transmite o conteúdo) · Werbeträger = suporte publicitário (o que o difunde) · Streumedien = meios de difusão · optisch = vê-se · akustisch = ouve-se · geschmacklich = prova-se · geruchlich = cheira-se · gemischte Werbemittel = meios publicitários mistos · Printmedien = meios impressos · Schaufenster = montra · Hörfunk = rádio · Plakatanschlagstelle = local para cartazes · Bandenwerbung = publicidade à volta do estádio · Werbegeschenk = brinde publicitário · Corporate Design = identidade corporativa · Firmenlogo = logótipo da empresa"}},{"id":"r1","no":"Lesen 1","type":"read","title":"Werbemittel und Werbeträger","instr":{"de":"Lies den Text. Tippe an, was ein Werbemittel und was ein Werbeträger ist.","vi":"Em đọc đoạn văn. Chạm vào từ cho biết Werbemittel và Werbeträger là gì.","tr":"Metni oku. Neyin Werbemittel, neyin Werbeträger olduğuna dokun.","ar":"اقرأ النص. المس ما هو Werbemittel وما هو Werbeträger.","ti":"እቲ ጽሑፍ ኣንብቦ። Werbemittel እንታይ፣ Werbeträger እንታይ ምዃኑ ተንከፍ።","uk":"Прочитай текст. Торкнися того, що є Werbemittel, а що є Werbeträger.","ru":"Прочитай текст. Нажми на то, что является Werbemittel, и на то, что является Werbeträger.","es":"Lee el texto. Toca lo que es un Werbemittel y lo que es un Werbeträger.","pt":"Lê o texto. Toca no que é um Werbemittel e no que é um Werbeträger."},"tip":{"de":"Das Werbemittel „vermittelt“, der Werbeträger „trägt“ und „verbreitet“.","vi":"Werbemittel “vermittelt” (truyền đạt), Werbeträger “trägt” (mang) và “verbreitet” (lan truyền).","tr":"Werbemittel “vermittelt” (aktarır), Werbeträger “trägt” (taşır) ve “verbreitet” (yayar).","ar":"الـ Werbemittel “vermittelt” (ينقل)، والـ Werbeträger “trägt” (يحمل) و“verbreitet” (ينشر).","ti":"Werbemittel “vermittelt” (የራኽብ)፣ Werbeträger ድማ “trägt” (ይጸውር) “verbreitet” (የሰራጭ)።","uk":"Werbemittel «vermittelt» (передає), Werbeträger «trägt» (несе) і «verbreitet» (поширює).","ru":"Werbemittel «vermittelt» (передаёт), Werbeträger «trägt» (несёт) и «verbreitet» (распространяет).","es":"El Werbemittel “vermittelt” (transmite), el Werbeträger “trägt” (lleva) y “verbreitet” (difunde).","pt":"O Werbemittel “vermittelt” (transmite), o Werbeträger “trägt” (leva) e “verbreitet” (difunde)."},"paras":["Werbemittel [[vermitteln]] die Werbebotschaft. Werbeträger sind die [[Medien]], die die Werbebotschaft [[verbreiten]]. Das Werbemittel ist das, was du liest, hörst, schmeckst oder riechst. Der Werbeträger ist das, worauf oder worüber es zu dir kommt. Beispiel: Der Aufdruck auf der Einkaufstasche ist das Werbemittel. Die Tasche ist der Werbeträger."],"vi":"Tóm tắt: Werbemittel = thứ mang nội dung (em đọc, nghe, nếm, ngửi). Werbeträger = thứ hoặc nơi mà nội dung đến với em. Ví dụ: chữ in trên túi mua hàng là Werbemittel, chiếc túi là Werbeträger.","quiz":{"q":"Auf einer Plakatwand hängt ein Plakat. Was ist die Plakatwand?","o":["der Werbeträger","das Werbemittel","die Werbebotschaft"],"a":0,"why":{"de":"Das Plakat ist das Werbemittel. Die Plakatwand trägt es: Sie ist der Werbeträger.","vi":"Áp phích là Werbemittel. Bảng dán áp phích mang nó: đó là Werbeträger.","tr":"Afiş Werbemittel'dir. Afiş panosu onu taşır: o Werbeträger'dir.","ar":"الملصق هو الـ Werbemittel. لوحة الملصقات تحمله: إنها الـ Werbeträger.","ti":"እቲ ፖስተር Werbemittel እዩ። እቲ ሰሌዳ ፖስተር ይጸውሮ፦ Werbeträger እዩ።","uk":"Плакат — це Werbemittel. Дошка для плакатів несе його: це Werbeträger.","ru":"Плакат — это Werbemittel. Рекламный щит несёт его: это Werbeträger.","es":"El cartel es el Werbemittel. La valla lo lleva: es el Werbeträger.","pt":"O cartaz é o Werbemittel. O painel leva-o: é o Werbeträger."}},"sum":{"tr":"Özet: Werbemittel = içeriği taşıyan şey (okursun, duyarsın, tadarsın, koklarsın). Werbeträger = içeriğin sana ulaştığı şey ya da yer. Örnek: Alışveriş çantasındaki yazı Werbemittel'dir, çanta Werbeträger'dir.","ar":"ملخص: Werbemittel = ما يحمل المضمون (تقرؤه، تسمعه، تتذوقه، تشمّه). Werbeträger = ما أو المكان الذي يصل إليك المضمون عبره. مثال: الطباعة على كيس التسوق هي Werbemittel، والكيس هو Werbeträger.","ti":"ማጠቃለሊ፦ Werbemittel = ትሕዝቶ ዝጸውር (ተንብቦ፣ ትሰምዕ፣ ትጥዕም፣ ትሽተት)። Werbeträger = እቲ ትሕዝቶ ብእኡ ዝመጽኣካ ነገር ወይ ቦታ። ኣብነት፦ እቲ ኣብ ሰንዱቕ ዕዳጋ ዝተሓትመ ጽሑፍ Werbemittel እዩ፣ እቲ ሰንዱቕ Werbeträger እዩ።","uk":"Підсумок: Werbemittel = те, що несе зміст (ти читаєш, чуєш, куштуєш, нюхаєш). Werbeträger = те або те місце, через яке зміст доходить до тебе. Приклад: напис на торбі для покупок — це Werbemittel, торба — це Werbeträger.","ru":"Кратко: Werbemittel = то, что несёт содержание (ты читаешь, слышишь, пробуешь, нюхаешь). Werbeträger = то или то место, через которое содержание доходит до тебя. Пример: надпись на пакете для покупок — это Werbemittel, пакет — это Werbeträger.","es":"Resumen: Werbemittel = lo que lleva el contenido (lo lees, lo oyes, lo pruebas, lo hueles). Werbeträger = aquello o el lugar por el que el contenido llega a ti. Ejemplo: el texto impreso en la bolsa de compra es el Werbemittel, la bolsa es el Werbeträger.","pt":"Resumo: Werbemittel = o que leva o conteúdo (lês, ouves, provas, cheiras). Werbeträger = aquilo ou o lugar por onde o conteúdo chega a ti. Exemplo: o texto impresso no saco de compras é o Werbemittel, o saco é o Werbeträger."}},{"id":"w2","type":"info","title":{"de":"Sinne, Werbeträger und Corporate Design","vi":"Giác quan, Werbeträger và Corporate Design","tr":"Duyular, Werbeträger ve Corporate Design","ar":"الحواس والـ Werbeträger والتصميم المؤسسي (Corporate Design)","ti":"ህዋሳት፣ Werbeträger ን Corporate Design ን","uk":"Органи чуття, Werbeträger і Corporate Design","ru":"Органы чувств, Werbeträger и Corporate Design","es":"Sentidos, Werbeträger y Corporate Design","pt":"Sentidos, Werbeträger e Corporate Design"},"html":"<p><b>Werbemittel nach Sinnen:<\/b><br><b>Optisch (Sehen):<\/b> Plakate, Anzeigen, Schaufensterdekorationen, E-Mails, Instant Messaging<br><b>Akustisch (Gehör):<\/b> Verkaufsgespräch, Werbevorführungen, Werbespots im Radio<br><b>Geschmacklich:<\/b> Kostproben – der Kunde soll sich von der Güte der Ware überzeugen<br><b>Geruchlich:<\/b> Parfümproben, Duftproben in einem Kundenheft<\/p><p>Werden verschiedene Werbemittel kombiniert, spricht man von <b>gemischten Werbemitteln<\/b>, zum Beispiel eine Lebensmittelprobe, die man sehen und kosten kann. Sie sind besonders werbewirksam, weil sie mehrere Sinne gleichzeitig ansprechen.<\/p><p><b>Werbeträger<\/b> heißen auch <b>Streumedien<\/b>. Sechs Gruppen sind im Einzelhandel wichtig:<br>1. Printmedien: Zeitungen, Zeitschriften, Anzeigenblätter, Werbebrief, Kundenzeitschrift<br>2. Schaufenster: das Schaufenster des eigenen Geschäfts<br>3. Hörfunk, Fernsehen, Kino<br>4. Plakatanschlagstellen und Verkehrsmittel: Litfaßsäule, Plakatwand, Nah- und Fernverkehrsmittel, Bandenwerbung im Stadion<br>5. Internet: Website des Betriebs, Social Media, CD-Werbung<br>6. Werbegeschenke: Einkaufstaschen, Kugelschreiber und Ähnliches mit Firmenaufdruck<\/p><div class=\"box merke\"><b>Corporate Design<\/b> (CD-Werbung): Der Betrieb stellt Firmenlogo, Gestaltungselemente, Verpackungsmaterial, Farben und Bilder und sogar die Unternehmensgebäude in den Dienst der Werbung. Alles sieht aus wie aus einem Guss. Das ist der Werbegrundsatz „einheitlich, stetig und einprägsam“ aus Modul 2.<\/div>","vi":"Werbemittel chia theo giác quan: optisch (nhìn): áp phích, quảng cáo, tủ kính; akustisch (nghe): tư vấn bán hàng, quảng cáo radio; geschmacklich (nếm): dùng thử thức ăn; geruchlich (ngửi): thử nước hoa. Gemischte Werbemittel = kết hợp nhiều giác quan, hiệu quả nhất.\nSáu nhóm Werbeträger: báo in; tủ kính cửa hàng; radio, TV, rạp chiếu phim; áp phích và phương tiện giao thông; Internet; quà tặng quảng cáo.\nCorporate Design: logo, màu sắc, bao bì, cả tòa nhà đều thống nhất để làm quảng cáo.","sum":{"tr":"Duyulara göre Werbemittel: optisch (görme): afiş, ilan, vitrin; akustisch (duyma): satış görüşmesi, radyo reklamı; geschmacklich (tat): yiyecek tadımı; geruchlich (koku): parfüm denemesi. Gemischte Werbemittel = birden fazla duyunun birleşimi, en etkilisi.\nAltı Werbeträger grubu: basılı medya; mağaza vitrini; radyo, TV, sinema; afişler ve ulaşım araçları; internet; reklam hediyeleri.\nCorporate Design: logo, renkler, ambalaj, hatta bina bile reklam için tek tip olur.","ar":"Werbemittel حسب الحواس: optisch (النظر): ملصقات، إعلانات، واجهة العرض؛ akustisch (السمع): حوار البيع، إعلان إذاعي؛ geschmacklich (الذوق): تذوق عينة طعام؛ geruchlich (الشم): تجربة عطر. Gemischte Werbemittel = جمع عدة حواس، وهي الأكثر فعالية.\nست مجموعات من Werbeträger: الوسائط المطبوعة؛ واجهة المحل؛ الإذاعة والتلفزيون والسينما؛ الملصقات ووسائل النقل؛ الإنترنت؛ الهدايا الإعلانية.\nCorporate Design: الشعار والألوان والتغليف وحتى المبنى كلها موحّدة لخدمة الإعلان.","ti":"Werbemittel ብህዋሳት፦ optisch (ምርኣይ)፦ ፖስተር፣ ማስታወቂያ፣ Schaufenster፤ akustisch (ምስማዕ)፦ ዘተ ሽያጥ፣ ናይ ራድዮ ማስታወቂያ፤ geschmacklich (ጥዕሚ)፦ ናይ መግቢ ሙከራ፤ geruchlich (ሽታ)፦ ናይ ሽቱ ሙከራ። Gemischte Werbemittel = ብዙሓት ህዋሳት ዝሓዋውስ፣ ዝበለጸ ሃዋህው ዘለዎ።\nሽድሽተ ጉጅለታት Werbeträger፦ ዝጽሓፉ ሚድያታት፤ መስኮት ድኳን፤ ራድዮ፣ ቲቪ፣ ሲነማ፤ ፖስተራትን መጓዓዚያን፤ ኢንተርነት፤ ናይ ማስታወቂያ ህያባት።\nCorporate Design፦ ሎጎ፣ ሕብሪ፣ መጠቓለሊ ከምኡ'ውን ህንጻ ሓደ ዓይነት ሆይኑ ንማስታወቂያ ይሕገዝ።","uk":"Werbemittel за органами чуття: optisch (зір): плакати, оголошення, вітрина; akustisch (слух): розмова з продажу, радіореклама; geschmacklich (смак): дегустація їжі; geruchlich (нюх): проба парфумів. Gemischte Werbemittel = поєднання кількох органів чуття, найефективніші.\nШість груп Werbeträger: друковані ЗМІ; вітрина магазину; радіо, ТБ, кіно; плакати й транспорт; інтернет; рекламні подарунки.\nCorporate Design: логотип, кольори, упаковка, навіть будівля — усе єдине для реклами.","ru":"Werbemittel по органам чувств: optisch (зрение): плакаты, объявления, витрина; akustisch (слух): разговор о продаже, радиореклама; geschmacklich (вкус): дегустация еды; geruchlich (обоняние): проба духов. Gemischte Werbemittel = сочетание нескольких органов чувств, самые эффективные.\nШесть групп Werbeträger: печатные СМИ; витрина магазина; радио, ТВ, кино; плакаты и транспорт; интернет; рекламные подарки.\nCorporate Design: логотип, цвета, упаковка, даже здание — всё единое для рекламы.","es":"Werbemittel según los sentidos: optisch (vista): carteles, anuncios, escaparate; akustisch (oído): conversación de venta, anuncio de radio; geschmacklich (gusto): degustación de comida; geruchlich (olfato): prueba de perfume. Gemischte Werbemittel = combinación de varios sentidos, los más eficaces.\nSeis grupos de Werbeträger: medios impresos; escaparate de la tienda; radio, TV, cine; carteles y transporte; internet; regalos publicitarios.\nCorporate Design: logotipo, colores, embalaje e incluso el edificio son uniformes para la publicidad.","pt":"Werbemittel segundo os sentidos: optisch (visão): cartazes, anúncios, montra; akustisch (audição): conversa de venda, anúncio de rádio; geschmacklich (paladar): prova de comida; geruchlich (olfato): prova de perfume. Gemischte Werbemittel = combinação de vários sentidos, os mais eficazes.\nSeis grupos de Werbeträger: meios impressos; montra da loja; rádio, TV, cinema; cartazes e transportes; internet; brindes publicitários.\nCorporate Design: logótipo, cores, embalagem e até o edifício são uniformes para a publicidade."}},{"id":"t1","no":"Lesen 2","type":"tf","pts":0,"title":"Richtig oder falsch?","instr":{"de":"Entscheide: Ist die Aussage richtig oder falsch?","vi":"Em quyết định: câu này đúng hay sai?","tr":"Karar ver: Bu cümle doğru mu, yanlış mı?","ar":"قرّر: هل العبارة صحيحة أم خاطئة؟","ti":"ውሳኔ ግበር፦ እቲ ሓሳብ ልክዕ ድዩ ጌጋ?","uk":"Вирішуй: це твердження правильне чи неправильне?","ru":"Реши: это утверждение верное или неверное?","es":"Decide: ¿la frase es verdadera o falsa?","pt":"Decide: a frase é verdadeira ou falsa?"},"tip":{"de":"Frage dich: Ist es das, was die Botschaft zeigt, oder das, worauf sie steht?","vi":"Tự hỏi: đó là thứ thể hiện thông điệp, hay là thứ mà thông điệp nằm trên đó?","tr":"Kendine sor: Mesajı gösteren şey mi, yoksa mesajın üzerinde durduğu şey mi?","ar":"اسأل نفسك: هل هو ما يُظهر الرسالة، أم ما تقف عليه الرسالة؟","ti":"ርእስኻ ሕተት፦ እቲ መልእኽቲ ዘርኢ ድዩ፣ ወይስ እቲ መልእኽቲ ዝተጻሕፈሉ?","uk":"Запитай себе: це те, що показує повідомлення, чи те, на чому воно розміщене?","ru":"Спроси себя: это то, что показывает сообщение, или то, на чём оно размещено?","es":"Pregúntate: ¿es lo que muestra el mensaje o aquello sobre lo que está?","pt":"Pergunta a ti próprio: é aquilo que mostra a mensagem ou aquilo em que ela está?"},"st":[{"t":"Das Plakat ist das Werbemittel, die Litfaßsäule ist der Werbeträger.","a":true},{"t":"Eine Kostprobe ist ein optisches Werbemittel.","a":false,"why":{"de":"Eine Kostprobe spricht den Geschmack an. Sie ist ein geschmackliches Werbemittel.","vi":"Dùng thử thức ăn tác động đến vị giác. Đó là geschmackliches Werbemittel.","tr":"Bir Kostprobe (tadım örneği) tat duyusuna hitap eder. Bu geschmackliches Werbemittel'dir (tat duyusuna yönelik reklam aracı).","ar":"عينة التذوق (Kostprobe) تخاطب حاسة الذوق. إنها geschmackliches Werbemittel (وسيلة إعلان للذوق).","ti":"ሓደ Kostprobe (ናይ ጥዕም ሙከራ) ንጥዕሚ ይጽዕን። እዚ geschmackliches Werbemittel (መሳርሒ ማስታወቂያ ጥዕሚ) እዩ።","uk":"Kostprobe (дегустація) діє на смак. Це geschmackliches Werbemittel (смаковий засіб реклами).","ru":"Kostprobe (дегустация) действует на вкус. Это geschmackliches Werbemittel (вкусовое рекламное средство).","es":"Una Kostprobe (degustación) se dirige al gusto. Es un geschmackliches Werbemittel (medio publicitario del gusto).","pt":"Uma Kostprobe (prova) dirige-se ao paladar. É um geschmackliches Werbemittel (meio publicitário do paladar)."}},{"t":"Werbeträger heißen auch Streumedien.","a":true},{"t":"Gemischte Werbemittel sprechen nur einen Sinn an.","a":false,"why":{"de":"Gemischte Werbemittel sprechen mehrere Sinne gleichzeitig an.","vi":"Gemischte Werbemittel tác động đến nhiều giác quan cùng lúc.","tr":"Gemischte Werbemittel (karma reklam araçları) aynı anda birden fazla duyuya hitap eder.","ar":"الـ Gemischte Werbemittel (وسائل الإعلان المختلطة) تخاطب عدة حواس في وقت واحد.","ti":"Gemischte Werbemittel (ዝተሓዋወሱ መሳርሒ ማስታወቂያ) ብሓደ ጊዜ ብዙሓት ህዋሳት ይጽዕኑ።","uk":"Gemischte Werbemittel (змішані засоби реклами) діють на кілька органів чуття одночасно.","ru":"Gemischte Werbemittel (смешанные рекламные средства) действуют сразу на несколько органов чувств.","es":"Los Gemischte Werbemittel (medios publicitarios mixtos) se dirigen a varios sentidos a la vez.","pt":"Os Gemischte Werbemittel (meios publicitários mistos) dirigem-se a vários sentidos ao mesmo tempo."}}]},{"id":"m1","no":"Übung 1","type":"match","pts":0,"title":"Werbemittel und Sinne","instr":{"de":"Ordne jedem Werbemittel den Sinn zu.","vi":"Em ghép mỗi Werbemittel với giác quan tương ứng.","tr":"Her Werbemittel'i doğru duyuyla eşleştir.","ar":"اربط كل Werbemittel بالحاسة المناسبة.","ti":"ንነፍሲ ወከፍ Werbemittel ምስ ዝምልከቶ ህዋስ ኣዛምዶ።","uk":"Зістав кожен Werbemittel з органом чуття.","ru":"Сопоставь каждый Werbemittel с органом чувств.","es":"Une cada Werbemittel con su sentido.","pt":"Liga cada Werbemittel ao seu sentido."},"tip":{"de":"Frage dich: Womit nimmt der Kunde das Werbemittel auf: Auge, Ohr, Zunge, Nase – oder mehreren?","vi":"Tự hỏi: khách hàng tiếp nhận bằng gì: mắt, tai, lưỡi, mũi – hay nhiều thứ?","tr":"Kendine sor: Müşteri Werbemittel'i neyle algılıyor: göz, kulak, dil, burun – yoksa birkaçıyla mı?","ar":"اسأل نفسك: بماذا يستقبل الزبون الـ Werbemittel: بالعين، الأذن، اللسان، الأنف – أم بأكثر من واحدة؟","ti":"ርእስኻ ሕተት፦ እቲ ዓሚል ነቲ Werbemittel ብምንታይ ይቕበሎ፦ ብዓይኒ፣ እዝኒ፣ ልሳን፣ ኣፍንጫ – ወይስ ብዝበዝሑ?","uk":"Запитай себе: чим клієнт сприймає Werbemittel: оком, вухом, язиком, носом — чи кількома?","ru":"Спроси себя: чем покупатель воспринимает Werbemittel: глазом, ухом, языком, носом — или несколькими?","es":"Pregúntate: ¿con qué percibe el cliente el Werbemittel: ojo, oído, lengua, nariz o varios?","pt":"Pergunta a ti próprio: com que é que o cliente recebe o Werbemittel: olho, ouvido, língua, nariz – ou vários?"},"rows":[{"l":"Plakat","a":"Optisch (Sehen)"},{"l":"Radiospot","a":"Akustisch (Gehör)"},{"l":"Kostprobe","a":"Geschmacklich (Geschmack)"},{"l":"Parfümprobe","a":"Geruchlich (Geruch)"},{"l":"Lebensmittelprobe zum Sehen und Kosten","a":"Gemischt (mehrere Sinne)"}]},{"id":"m2","no":"Übung 2","type":"match","pts":0,"title":"Werbeträger-Gruppen","instr":{"de":"Ordne jedes Beispiel der richtigen Gruppe der Werbeträger zu.","vi":"Em ghép mỗi ví dụ với đúng nhóm Werbeträger.","tr":"Her örneği Werbeträger'in doğru grubuyla eşleştir.","ar":"اربط كل مثال بالمجموعة الصحيحة من الـ Werbeträger.","ti":"ንነፍሲ ወከፍ ኣብነት ምስ ሰሪሕ ጉጅለ Werbeträger ኣዛምዶ።","uk":"Зістав кожен приклад з правильною групою Werbeträger.","ru":"Сопоставь каждый пример с правильной группой Werbeträger.","es":"Une cada ejemplo con el grupo correcto de Werbeträger.","pt":"Liga cada exemplo ao grupo certo de Werbeträger."},"tip":{"de":"Lies die sechs Gruppen noch einmal in der Übersicht oben.","vi":"Đọc lại sáu nhóm trong phần tổng quan ở trên.","tr":"Yukarıdaki genel bakışta altı grubu bir kez daha oku.","ar":"اقرأ المجموعات الست مرة أخرى في النظرة العامة أعلاه.","ti":"እተን ሽድሽተ ጉጅለታት ኣብቲ ላዕሊ ዘሎ ሓጺር መግለጺ ዳግማይ ኣንብበን።","uk":"Ще раз прочитай шість груп у огляді вище.","ru":"Ещё раз прочитай шесть групп в обзоре выше.","es":"Lee otra vez los seis grupos en el resumen de arriba.","pt":"Lê outra vez os seis grupos no resumo acima."},"rows":[{"l":"Tageszeitung","a":"Printmedien"},{"l":"Das eigene Schaufenster","a":"Schaufenster"},{"l":"Radiosender","a":"Hörfunk, Fernsehen, Kino"},{"l":"Litfaßsäule","a":"Plakatanschlagstellen und Verkehrsmittel"},{"l":"Social Media","a":"Internet"},{"l":"Kugelschreiber mit Firmenaufdruck","a":"Werbegeschenke"}],"extra":[]},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: Mittel, Träger, Sinn","html":"<p>Bei jedem Beispiel stellst du dieselben drei Fragen.<\/p><p><b>Eine Anzeige in der Nordsee-Zeitung:<\/b> Werbemittel ist die Anzeige. Werbeträger ist die Zeitung (Printmedium). Sinn: Sehen, also ein optisches Werbemittel.<\/p><p><b>Ein Werbespot bei Radio Bremen:<\/b> Werbemittel: der Spot. Werbeträger: der Hörfunk. Sinn: Gehör, ein akustisches Werbemittel.<\/p><p><b>Eine Käse-Kostprobe an der Frischetheke:<\/b> Werbemittel: die Kostprobe. Werbeträger: das Geschäft selbst mit seiner Theke. Sinn: Geschmack. Und weil man den Käse auch sieht, ist es ein gemischtes Werbemittel.<\/p><div class=\"box merke\"><b>Ergebnis:<\/b> Immer dieselbe Reihenfolge: erst das Werbemittel, dann der Werbeträger, dann der Sinn.<\/div>","vi":"Ví dụ mẫu: luôn hỏi theo thứ tự: 1. Werbemittel là gì? 2. Werbeträger là gì? 3. Tác động đến giác quan nào? Ví dụ quảng cáo trên báo: Werbemittel = quảng cáo, Werbeträger = tờ báo, giác quan = nhìn (optisch).","sum":{"tr":"Örnek: Hep bu sırayla sor: 1. Werbemittel nedir? 2. Werbeträger nedir? 3. Hangi duyuya hitap ediyor? Gazete ilanı örneği: Werbemittel = ilan, Werbeträger = gazete, duyu = görme (optisch).","ar":"مثال نموذجي: اسأل دائمًا بهذا الترتيب: 1. ما هو الـ Werbemittel؟ 2. ما هو الـ Werbeträger؟ 3. أي حاسة يخاطب؟ مثال إعلان في صحيفة: Werbemittel = الإعلان، Werbeträger = الصحيفة، الحاسة = النظر (optisch).","ti":"ኣብነት፦ ኩሉ ጊዜ በዚ ሰዓብ ሕተት፦ 1. Werbemittel እንታይ እዩ? 2. Werbeträger እንታይ እዩ? 3. ኣየናይ ህዋስ ይጽዕን? ኣብነት ናይ ጋዜጣ ማስታወቂያ፦ Werbemittel = እቲ ማስታወቂያ፣ Werbeträger = እቲ ጋዜጣ፣ ህዋስ = ምርኣይ (optisch)።","uk":"Приклад: став запитання завжди в такому порядку: 1. Що є Werbemittel? 2. Що є Werbeträger? 3. На який орган чуття діє? Приклад — оголошення в газеті: Werbemittel = оголошення, Werbeträger = газета, орган чуття = зір (optisch).","ru":"Пример: задавай вопросы всегда в таком порядке: 1. Что такое Werbemittel? 2. Что такое Werbeträger? 3. На какой орган чувств действует? Пример — объявление в газете: Werbemittel = объявление, Werbeträger = газета, орган чувств = зрение (optisch).","es":"Ejemplo modelo: pregunta siempre en este orden: 1. ¿Qué es el Werbemittel? 2. ¿Qué es el Werbeträger? 3. ¿A qué sentido se dirige? Ejemplo de anuncio en el periódico: Werbemittel = el anuncio, Werbeträger = el periódico, sentido = vista (optisch).","pt":"Exemplo modelo: pergunta sempre por esta ordem: 1. O que é o Werbemittel? 2. O que é o Werbeträger? 3. A que sentido se dirige? Exemplo de anúncio no jornal: Werbemittel = o anúncio, Werbeträger = o jornal, sentido = visão (optisch)."}},{"id":"a3","no":"Aufgabe 3","type":"table","pts":1,"title":"Geführte Übung","instr":{"de":"Wähle zu jedem Beispiel das Werbemittel, den Werbeträger und den angesprochenen Sinn.","vi":"Với mỗi ví dụ, em chọn Werbemittel, Werbeträger và giác quan được tác động.","tr":"Her örnek için Werbemittel'i, Werbeträger'i ve hitap edilen duyuyu seç.","ar":"اختر لكل مثال الـ Werbemittel والـ Werbeträger والحاسة المخاطَبة.","ti":"ንነፍሲ ወከፍ ኣብነት Werbemittel፣ Werbeträger ን እቲ ዝተጸዓነ ህዋስን ሕረ።","uk":"До кожного прикладу вибери Werbemittel, Werbeträger і орган чуття, на який він діє.","ru":"К каждому примеру выбери Werbemittel, Werbeträger и орган чувств, на который он действует.","es":"Para cada ejemplo, elige el Werbemittel, el Werbeträger y el sentido al que se dirige.","pt":"Para cada exemplo, escolhe o Werbemittel, o Werbeträger e o sentido a que se dirige."},"tip":{"de":"Das Werbemittel kann man abnehmen oder austauschen. Der Werbeträger bleibt. Achte darauf, ob mehr als ein Sinn angesprochen wird.","vi":"Werbemittel có thể gỡ xuống hoặc thay thế, còn Werbeträger thì ở lại. Chú ý xem có hơn một giác quan được tác động không.","tr":"Werbemittel çıkarılabilir veya değiştirilebilir. Werbeträger kalır. Birden fazla duyuya hitap edilip edilmediğine dikkat et.","ar":"يمكن إزالة الـ Werbemittel أو استبداله. أما الـ Werbeträger فيبقى. انتبه هل تُخاطَب أكثر من حاسة واحدة.","ti":"እቲ Werbemittel ክውሰድ ወይ ክቕየር ይከኣል። እቲ Werbeträger ግን ይተርፍ። ካብ ሓደ ህዋስ ንላዕሊ ይጽዕን ድዩ ኢልካ ተጠንቀቕ።","uk":"Werbemittel можна зняти або замінити. Werbeträger залишається. Зверни увагу, чи діє реклама більш ніж на один орган чуття.","ru":"Werbemittel можно снять или заменить. Werbeträger остаётся. Обрати внимание, действует ли реклама больше чем на один орган чувств.","es":"El Werbemittel se puede quitar o cambiar. El Werbeträger se queda. Fíjate si se activa más de un sentido.","pt":"O Werbemittel pode ser retirado ou trocado. O Werbeträger fica. Repara se é desperto mais do que um sentido."},"cols":["Beispiel","Werbemittel","Werbeträger","Sinn"],"colOpts":[null,["Plakat","Werbespot","Duftprobe","Aufdruck mit Logo"],["Litfaßsäule","Kino","Kundenheft","Einkaufstasche"],["Optisch (Sehen)","Akustisch (Gehör)","Geschmacklich (Geschmack)","Geruchlich (Geruch)","Gemischt (mehrere Sinne)"]],"rows":[["1. Ein Plakat hängt an einer Litfaßsäule.",{"a":"Plakat"},{"a":"Litfaßsäule"},{"a":"Optisch (Sehen)"}],["2. Im Kino läuft vor dem Film ein Werbespot.",{"a":"Werbespot"},{"a":"Kino"},{"a":"Gemischt (mehrere Sinne)"}],["3. Eine Drogerie verschickt ein Kundenheft mit einer Duftprobe.",{"a":"Duftprobe"},{"a":"Kundenheft"},{"a":["Geruchlich (Geruch)","Gemischt (mehrere Sinne)"]}],["4. Ein Supermarkt gibt Einkaufstaschen mit seinem Logo aus.",{"a":"Aufdruck mit Logo"},{"a":"Einkaufstasche"},{"a":"Optisch (Sehen)"}]]},{"id":"a4","no":"Aufgabe 4","type":"free","pts":1,"title":"Freie Übung","instr":{"de":"Beantworte die Fragen in eigenen Worten.","vi":"Em trả lời các câu hỏi bằng lời của mình.","tr":"Soruları kendi cümlelerinle cevapla.","ar":"أجب عن الأسئلة بكلماتك الخاصة.","ti":"ነቲ ሕቶታት ብናትካ ቃላት መልሶ።","uk":"Дай відповіді на питання своїми словами.","ru":"Ответь на вопросы своими словами.","es":"Responde a las preguntas con tus propias palabras.","pt":"Responde às perguntas com as tuas palavras."},"tip":{"de":"Bei Frage 6: Was steht im Schaufenster, und was ist das Schaufenster selbst?","vi":"Câu 6: trong tủ kính có gì, và bản thân tủ kính là gì?","tr":"6. soruda: Vitrinde (Schaufenster) ne var ve vitrinin kendisi nedir?","ar":"في السؤال 6: ماذا يوجد في واجهة العرض (Schaufenster)، وما هي واجهة العرض نفسها؟","ti":"ኣብ ሕቶ 6፦ ኣብቲ Schaufenster (መስኮት ምርኢት ድኳን) እንታይ ኣሎ፣ እቲ Schaufenster ባዕሉ ድማ እንታይ እዩ?","uk":"У питанні 6: що є у вітрині (Schaufenster) і чим є сама вітрина?","ru":"В вопросе 6: что находится в витрине (Schaufenster) и чем является сама витрина?","es":"En la pregunta 6: ¿qué hay en el escaparate (Schaufenster) y qué es el escaparate en sí?","pt":"Na pergunta 6: o que há na montra (Schaufenster) e o que é a própria montra?"},"parts":[{"q":"1. Erkläre mit eigenen Worten den Unterschied zwischen Werbemittel und Werbeträger.","m":"Das Werbemittel vermittelt die Werbebotschaft (z. B. die Anzeige). Der Werbeträger ist das Medium, das sie verbreitet (z. B. die Zeitung).","s":["Das Werbemittel ist …","Der Werbeträger ist …"]},{"q":"2. Nenne vier Werbeträger, die ein Einzelhandelsbetrieb nutzen kann.","m":"Zum Beispiel: Tageszeitung, Schaufenster, Hörfunk, Litfaßsäule, Website, Einkaufstasche."},{"q":"3. Nenne zu jedem der vier Sinne ein Werbemittel.","m":"Sehen: Plakat. Gehör: Radiospot. Geschmack: Kostprobe. Geruch: Duftprobe."},{"q":"4. Was sind gemischte Werbemittel, und warum sind sie besonders werbewirksam?","m":"Sie kombinieren mehrere Werbemittel, zum Beispiel eine Lebensmittelprobe zum Sehen und Kosten. Sie sind besonders wirksam, weil sie verschiedene Sinne gleichzeitig ansprechen."},{"q":"5. Erkläre den Begriff Corporate Design und nenne drei Beispiele aus einem Betrieb.","m":"Der Betrieb stellt seine Gestaltung ganz in den Dienst der Werbung. Beispiele: Firmenlogo, Hausfarbe, Verpackungsmaterial, Arbeitskleidung, Gestaltung der Gebäude."},{"q":"6. Ist das Schaufenster ein Werbemittel oder ein Werbeträger? Begründe.","m":"Das Schaufenster ist der Werbeträger. Das Werbemittel ist die Schaufensterdekoration, die darin gezeigt wird.","s":["Das Schaufenster ist …, weil …"]}]},{"id":"a5","no":"Aufgabe 5","type":"free","pts":1,"title":"Aus deinem Betrieb","instr":{"de":"Notiere drei Werbeträger, die dein Ausbildungsbetrieb nutzt. Schreibe zu jedem das passende Werbemittel und den angesprochenen Sinn dazu.","vi":"Ghi ba Werbeträger mà cửa hàng thực tập của em sử dụng. Viết thêm Werbemittel phù hợp và giác quan được tác động cho mỗi cái.","tr":"Eğitim aldığın işletmenin kullandığı üç Werbeträger yaz. Her biri için uygun Werbemittel'i ve hitap edilen duyuyu da yaz.","ar":"اكتب ثلاثة Werbeträger يستخدمها مكان تدريبك. واكتب لكل واحد الـ Werbemittel المناسب والحاسة المخاطَبة.","ti":"እቲ ዝሰልጠንኻሉ ትካል ዝጥቀመሎም ሰለስተ Werbeträger ጸሓፍ። ንነፍሲ ወከፍ ዝምልከቶ Werbemittel ን እቲ ዝተጸዓነ ህዋስን ጸሓፎ።","uk":"Запиши три Werbeträger, які використовує твоє місце практики. До кожного напиши підходящий Werbemittel і орган чуття, на який він діє.","ru":"Запиши три Werbeträger, которые использует твоё место практики. К каждому напиши подходящий Werbemittel и орган чувств, на который он действует.","es":"Anota tres Werbeträger que use tu empresa de prácticas. Escribe para cada uno el Werbemittel adecuado y el sentido al que se dirige.","pt":"Anota três Werbeträger que a tua empresa de formação usa. Escreve para cada um o Werbemittel adequado e o sentido a que se dirige."},"tip":{"de":"Schreibe drei Zeilen nach dem Muster: Werbeträger – Werbemittel – Sinn.","vi":"Viết ba dòng theo mẫu: Werbeträger – Werbemittel – giác quan.","tr":"Şu kalıba göre üç satır yaz: Werbeträger – Werbemittel – duyu.","ar":"اكتب ثلاثة أسطر على هذا النموذج: Werbeträger – Werbemittel – الحاسة.","ti":"ሰለስተ መስርዕ ከምዚ ዝስዕብ ኣብነት ጸሓፍ፦ Werbeträger – Werbemittel – ህዋስ።","uk":"Напиши три рядки за зразком: Werbeträger – Werbemittel – орган чуття.","ru":"Напиши три строки по образцу: Werbeträger – Werbemittel – орган чувств.","es":"Escribe tres líneas según el modelo: Werbeträger – Werbemittel – sentido.","pt":"Escreve três linhas segundo o modelo: Werbeträger – Werbemittel – sentido."},"parts":[{"q":"Meine drei Zeilen:","m":"Individuelle Lösung. Erwartet werden drei Zeilen nach dem Muster: Werbeträger – Werbemittel – Sinn, zum Beispiel „Schaufenster – Dekoration mit der neuen Kollektion – optisch“.","s":["Schaufenster – …","Website – …"]}]},{"id":"a6","no":"Aufgabe 6","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh.","tr":"Soruları cevapla. Tam cümlelerle gerekçelendir.","ar":"أجب عن الأسئلة. علّل بجمل كاملة.","ti":"ነቲ ሕቶታት መልሶ። ብምሉእ ሓረጋት ምኽንያት ሃብ።","uk":"Дай відповіді на питання. Поясни повними реченнями.","ru":"Ответь на вопросы. Объясни полными предложениями.","es":"Responde a las preguntas. Justifica con frases completas.","pt":"Responde às perguntas. Justifica com frases completas."},"tip":{"de":"6.1: Denke an eine Vorführung mit Probe. 6.2: Wie oft sieht man eine Tasche? Wer kann steuern, wo sie getragen wird? 6.3: Welcher Grundsatz aus Modul 2 passt zu „alles sieht gleich aus“?","vi":"6.1: nghĩ đến buổi trình diễn có dùng thử. 6.2: một chiếc túi được nhìn thấy bao nhiêu lần? Ai kiểm soát được nó được mang đi đâu? 6.3: nguyên tắc nào của Modul 2 khớp với “mọi thứ trông giống nhau”?","tr":"6.1: Deneme yapılan bir tanıtımı düşün. 6.2: Bir çanta kaç kez görülür? Nerede taşınacağını kim belirleyebilir? 6.3: Modul 2'deki hangi ilke “her şey aynı görünüyor” ile uyuşuyor?","ar":"6.1: فكّر في عرض توضيحي مع تجربة. 6.2: كم مرة تُرى الحقيبة؟ من يستطيع التحكم في المكان الذي تُحمل فيه؟ 6.3: أي مبدأ من Modul 2 يناسب عبارة “كل شيء يبدو متشابهًا”؟","ti":"6.1፦ ብዛዕባ ሙከራ ዘለዎ ምርኢት ሕሰብ። 6.2፦ ሓንቲ ሰንዱቕ ክንደይ ጊዜ ትርአ? ኣበይ ከም እትስከም መን ክቆጻጸር ይኽእል? 6.3፦ ካብ Modul 2 እየናይ ሓሳብ “ኩሉ ነገር ሓደ ዓይነት ይመስል” ምስ ዝብል ይሰማማዕ?","uk":"6.1: Подумай про демонстрацію з пробою. 6.2: Скільки разів бачать сумку? Хто може вирішувати, де її носитимуть? 6.3: Який принцип із Modul 2 підходить до «все виглядає однаково»?","ru":"6.1: Подумай о демонстрации с пробой. 6.2: Сколько раз видят сумку? Кто может решать, где её будут носить? 6.3: Какой принцип из Modul 2 подходит к «всё выглядит одинаково»?","es":"6.1: Piensa en una demostración con prueba. 6.2: ¿Cuántas veces se ve un bolso? ¿Quién puede controlar dónde se lleva? 6.3: ¿Qué principio del Modul 2 encaja con “todo se ve igual”?","pt":"6.1: Pensa numa demonstração com prova. 6.2: Quantas vezes se vê uma mala? Quem pode controlar onde é levada? 6.3: Que princípio do Modul 2 combina com “tudo parece igual”?"},"parts":[{"q":"6.1 Nenne ein Werbemittel, das drei Sinne gleichzeitig anspricht, und begründe deine Wahl.","m":"Zum Beispiel eine Warenvorführung mit Kostprobe an der Käsetheke: Man sieht die Ware, hört die Erklärung der Verkäuferin und schmeckt die Probe. Damit sind Sehen, Gehör und Geschmack angesprochen."},{"q":"6.2 Warum sind Werbegeschenke besonders langlebige Werbeträger? Nenne auch einen Nachteil.","m":"Ein Werbegeschenk wie eine Einkaufstasche wird über Monate benutzt und dabei jedes Mal von vielen Menschen gesehen – die Werbung wirkt also lange und ohne weitere Kosten. Nachteil: Der Betrieb kann nicht steuern, wer die Tasche wo trägt, und die Streuung ist zufällig."},{"q":"6.3 Ein Betrieb hat ein starkes Corporate Design. Welchen Werbegrundsatz aus Modul 2 unterstützt das – und warum spart es auf Dauer Geld?","m":"Den Grundsatz „einheitlich, stetig und einprägsam“. Der Wiedererkennungswert steigt, weil alles gleich aussieht. Auf Dauer spart das Geld, weil der Betrieb nicht immer wieder neue Gestaltungen entwickeln und drucken lassen muss und weil jede einzelne Werbung auf den bereits bekannten Auftritt einzahlt."}]},{"id":"s1","type":"info","title":"STOPP – Für Selbstlerner","html":"<div class=\"box merke\"><b>Pflicht-Stopp 1 · Werbung erkennen.<\/b> Komm mit diesem Arbeitsblatt zu deiner Lehrkraft. Sie zeigt dir fünf Werbebeispiele. Du sagst zu jedem in ganzen Sätzen: Was ist das Werbemittel, was der Werbeträger, welche Werbeart (Wen sprechen wir an? Wer wirbt? Wofür?). Erst danach machst du mit Modul 4 weiter.<\/div>","vi":"Dừng lại (dành cho em tự học): Hãy mang phiếu này đến gặp cô giáo. Cô sẽ cho em xem năm ví dụ quảng cáo. Với mỗi ví dụ, em nói bằng câu hoàn chỉnh: Werbemittel là gì, Werbeträger là gì, Werbeart (loại quảng cáo) nào. Sau đó mới làm tiếp Modul 4.","sum":{"tr":"Dur (kendi kendine öğrenenler için): Bu kâğıdı öğretmenine götür. Sana beş reklam örneği gösterecek. Her örnek için tam cümlelerle söyle: Werbemittel nedir, Werbeträger nedir, hangi Werbeart (reklam türü). Ondan sonra Modul 4'e devam et.","ar":"قف (للمتعلم الذاتي): خذ هذه الورقة إلى معلّمتك. ستعرض عليك خمسة أمثلة إعلانية. قل عن كل مثال بجمل كاملة: ما هو الـ Werbemittel، وما هو الـ Werbeträger، وأي Werbeart (نوع الإعلان). بعد ذلك فقط تابع Modul 4.","ti":"ደው በል (ንባዕሎም ዝመሃሩ)፦ እዚ ወረቐት ናብ መምህርካ ወስዶ። ሓሙሽተ ኣብነት ማስታወቂያ ከርእየካ እያ። ንነፍሲ ወከፍ ብምሉእ ሓረጋት ንገር፦ Werbemittel እንታይ እዩ፣ Werbeträger እንታይ እዩ፣ እንታይ Werbeart (ዓይነት ማስታወቂያ)። ድሕሪኡ ጥራይ Modul 4 ቀጽል።","uk":"Стоп (для самостійного навчання): Принеси цей аркуш до вчительки. Вона покаже тобі п’ять прикладів реклами. До кожного скажи повними реченнями: що є Werbemittel, що є Werbeträger, який Werbeart (вид реклами). Лише після цього продовжуй Modul 4.","ru":"Стоп (для самостоятельного обучения): Принеси этот лист учителю. Она покажет тебе пять примеров рекламы. К каждому скажи полными предложениями: что такое Werbemittel, что такое Werbeträger, какой Werbeart (вид рекламы). Только после этого продолжай Modul 4.","es":"Alto (para quien aprende solo): Lleva esta hoja a tu profesora. Ella te mostrará cinco ejemplos de publicidad. Di de cada uno con frases completas: qué es el Werbemittel, qué es el Werbeträger y qué Werbeart (tipo de publicidad). Solo después sigue con el Modul 4.","pt":"Pára (para quem aprende sozinho): Leva esta folha à tua professora. Ela vai mostrar-te cinco exemplos de publicidade. Diz de cada um, com frases completas: o que é o Werbemittel, o que é o Werbeträger e que Werbeart (tipo de publicidade). Só depois continuas com o Modul 4."}},{"id":"v1","level":"v","no":"Vertiefung 1","type":"free","pts":1,"title":"Warum ist das so?","instr":{"de":"Begründe in ganzen Sätzen.","vi":"Em giải thích bằng câu hoàn chỉnh.","tr":"Tam cümlelerle gerekçelendir.","ar":"علّل بجمل كاملة.","ti":"ብምሉእ ሓረጋት ምኽንያት ሃብ።","uk":"Поясни повними реченнями.","ru":"Объясни полными предложениями.","es":"Justifica con frases completas.","pt":"Justifica com frases completas."},"tip":{"de":"Denke an die Sinne: Wie viele Sinne spricht die Werbung an?","vi":"Hãy nghĩ đến các giác quan: quảng cáo tác động đến mấy giác quan?","tr":"Duyuları düşün: Reklam kaç duyuya hitap ediyor?","ar":"فكّر في الحواس: كم حاسة يخاطبها الإعلان؟","ti":"ብዛዕባ ህዋሳት ሕሰብ፦ እቲ ማስታወቂያ ክንደይ ህዋሳት ይጽዕን?","uk":"Подумай про органи чуття: на скільки органів чуття діє реклама?","ru":"Подумай об органах чувств: на сколько органов чувств действует реклама?","es":"Piensa en los sentidos: ¿a cuántos sentidos se dirige la publicidad?","pt":"Pensa nos sentidos: a quantos sentidos se dirige a publicidade?"},"parts":[{"q":"Warum sind gemischte Werbemittel besonders werbewirksam? Gib ein eigenes Beispiel.","m":"Sie sprechen mehrere Sinne gleichzeitig an. Der Kunde sieht, hört oder schmeckt die Ware und erinnert sich besser. Beispiel: eine Kostprobe mit Schild und Erklärung der Verkäuferin.","s":["Gemischte Werbemittel wirken, weil …","Ein Beispiel ist …"]}]},{"id":"v2","level":"v","no":"Vertiefung 2","type":"free","pts":1,"title":"Begründe deine Entscheidung","instr":{"de":"Ein Betrieb will vor allem Jugendliche erreichen. Er kann die Tageszeitung, die Litfaßsäule oder das Internet (Social Media) als Werbeträger nutzen. Wofür entscheidest du dich? Begründe.","vi":"Một cửa hàng muốn tiếp cận chủ yếu thanh thiếu niên. Có thể dùng báo hằng ngày, Litfaßsäule (cột quảng cáo) hoặc Internet (mạng xã hội) làm Werbeträger. Em chọn gì? Hãy giải thích.","tr":"Bir işletme özellikle gençlere ulaşmak istiyor. Werbeträger olarak günlük gazeteyi (Tageszeitung), Litfaßsäule'yi (reklam sütunu) veya interneti (sosyal medya) kullanabilir. Sen hangisini seçersin? Gerekçelendir.","ar":"تريد منشأة تجارية أن تصل خصوصًا إلى الشباب. يمكنها أن تستخدم الصحيفة اليومية (Tageszeitung) أو عمود الإعلانات (Litfaßsäule) أو الإنترنت (وسائل التواصل الاجتماعي) كـ Werbeträger. ماذا تختار؟ علّل.","ti":"ሓደ ትካል ብፍላይ ቆልዑን ጓል መንእሰያትን ክበጽሕ ይደሊ። ከም Werbeträger ዕለታዊ ጋዜጣ (Tageszeitung)፣ Litfaßsäule (ዓምዲ ማስታወቂያ) ወይ ኢንተርነት (ማሕበራዊ ሚድያ) ክጥቀም ይኽእል። ንስኻ እንታይ ትመርጽ? ምኽንያት ሃብ።","uk":"Підприємство хоче охопити передусім молодь. Як Werbeträger воно може використати щоденну газету (Tageszeitung), Litfaßsäule (рекламну тумбу) або інтернет (соцмережі). Що обереш ти? Поясни.","ru":"Предприятие хочет охватить прежде всего молодёжь. В качестве Werbeträger оно может использовать ежедневную газету (Tageszeitung), Litfaßsäule (рекламную тумбу) или интернет (соцсети). Что выберешь ты? Объясни.","es":"Una empresa quiere llegar sobre todo a los jóvenes. Como Werbeträger puede usar el periódico diario (Tageszeitung), la Litfaßsäule (columna publicitaria) o internet (redes sociales). ¿Qué eliges tú? Justifica.","pt":"Uma empresa quer chegar sobretudo aos jovens. Como Werbeträger pode usar o jornal diário (Tageszeitung), a Litfaßsäule (coluna publicitária) ou a internet (redes sociais). Qual escolhes tu? Justifica."},"tip":{"de":"Denke an den Grundsatz „wirksam“ und an die Zielgruppe.","vi":"Hãy nghĩ đến nguyên tắc “wirksam” (hiệu quả) và nhóm khách hàng mục tiêu.","tr":"“wirksam” (etkili) ilkesini ve hedef kitleyi düşün.","ar":"فكّر في مبدأ “wirksam” (فعّال) وفي الفئة المستهدفة.","ti":"ብዛዕባ እቲ ሓሳብ “wirksam” (ሃዋህው ዘለዎ) ን ብዛዕባ እቲ ዝተባህለ ጉጅለ ዓሚላትን ሕሰብ።","uk":"Подумай про принцип «wirksam» (дієвий) і про цільову групу.","ru":"Подумай о принципе «wirksam» (действенный) и о целевой группе.","es":"Piensa en el principio “wirksam” (eficaz) y en el grupo objetivo.","pt":"Pensa no princípio “wirksam” (eficaz) e no grupo-alvo."},"parts":[{"q":"Meine Entscheidung und meine Begründung:","m":"Mögliche Antwort: Internet/Social Media, weil viele Jugendliche dort täglich Zei function tokens(p){const out=[];let idx=0;let m;
 const parts=[];let last=0,s=p;const rg=/\[\[(.+?)\]\]|\{\{(.+?)\}\}/g;while((m=rg.exec(s))){if(m.index>last)parts.push({t:s.slice(last,m.index)});parts.push({t:m[1]||m[2],key:!!m[1]});last=rg.lastIndex}
 if(last<s.length)parts.push({t:s.slice(last)});
 parts.forEach((pt,pi)=>{const prev=parts[pi-1];pt.t.split(/\s+/).filter(Boolean).forEach((w,wi)=>{const att=wi===0&&prev&&!/\s$/.test(prev.t)&&!/^\s/.test(pt.t);out.push({w,key:!!pt.key,i:idx++,att,pu:/^[.,;:!?)“”„"]+$/.test(w)})})});return out}
function allTokens(it){let g=0;return it.paras.map(p=>tokens(p).map(t=>({w:t.w,key:t.key,att:t.att,pu:t.pu,i:g++})))}
function readKeys(it){const k=[];allTokens(it).forEach(ps=>ps.forEach(t=>{if(t.key)k.push(t.i)}));return k}
/* ---------- Rendern ---------- */
function ptsLabel(it){if(it.type==='read'||!it.pts)return'';return it.level==='v'?'+'+fmt(it.pts)+' '+(S.lang==='de'?'Bonus':u('bonusw')):fmt(it.pts)+' '+(S.lang==='de'?(it.pts===1?'Punkt':'Punkte'):u('pts'))}
function sum(it){return (it.sum&&it.sum[S.lang])||(S.lang==='vi'?it.vi:'')||''}
function autoDir(){if(!RTL[S.lang])return;$$('p,h1,h2,h3,h4,li,summary,label,.info,.vis,.qt,.st,.instr,.opt span,.chip,.fb,.model,.sub,.cnt').forEach(e=>e.setAttribute('dir','auto'))}
function tipBlock(it){return it.tip?`<details class="tip"><summary>💡 ${u('tip')}</summary><div>${rich(T(it.tip))}</div></details>`:''}
function wg(it,i,p){if(!p.w&&!p.s)return'';const ch=(p.w||[]).concat(p.s||[]).map(x=>`<button type="button" class="chip" data-chip="${esc(x)}" data-for="${it.id}_${i}">${esc(x)}</button>`).join('');return`<details class="wg"><summary>✏️ ${u('words')}</summary><div class="chips">${ch}</div></details>`}
const BODY={
 info(it){return`<div class="info">${it.html||''}</div>`+(sum(it)?`<div class="vis" lang="${S.lang}">${rich(sum(it))}</div>`:'')},
 read(it){const per=allTokens(it);const a=A(it.id);const sel=a.m||[];
  const ps=per.map(ts=>`<p class="rd${a.chk?' chk':''}" data-rd="${it.id}">`+ts.map(t=>t.pu&&t.att?esc(t.w):(t.att?'':' ')+`<span class="w${t.key?' key':''}${sel.indexOf(t.i)>=0?' sel':''}" data-w="${t.i}" role="button" tabindex="0">${esc(t.w)}</span>`).join('').trim()+'</p>').join('');
  const q=it.quiz;let quiz='';
  if(q&&a.chk){quiz=`<div class="q" data-part="0"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="radio" name="${it.id}_q" data-k="q" value="${j}"${a.q!=null&&+a.q===j?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}
  return`<p class="vis">${u('tap')}</p>${ps}<div class="actions"><button type="button" class="primary" data-act="rdchk" data-id="${it.id}">${u('chkmark')}</button></div>${quiz}`+(sum(it)?`<p class="vis" lang="${S.lang}">${rich(sum(it))}</p>`:'')},
 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';
   else el=`<input class="in" type="text" data-k="p${i}" data-part="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(8,String([].concat(g.a)[0]).length+2)}" value="${esc(v)}">`;
   html=html.replace('{'+i+'}',el)});
  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},
 match(it){const a=A(it.id);const o=matchOpts(it);return it.rows.map((r,i)=>`<div class="mrow" data-part="${i}"><div><b>${rich(T(r.l))}</b></div><select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${a['p'+i]===x?' selected':''}>${esc(x)}</option>`).join('')+'</select></div>').join('')},
 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{
   if(c&&typeof c==='object'){const i=n++;const o=c.o||(it.colOpts||[])[ci];const v=a['p'+i]||'';const f=o?`<select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>':`<input class="in" type="text" data-k="p${i}" value="${esc(v)}" autocomplete="off">`;
    return`<div class="fld" data-part="${i}"><label>${esc(it.cols[ci])}</label>${f}</div>`}
   return`<div class="fld"><label>${esc(it.cols[ci])}</label><div>${rich(T(c))}</div></div>`}).join('')+'</div>'}).join('')},
 calc(it){const a=A(it.id);return it.parts.map((p,i)=>`<div class="crow" data-part="${i}"><p class="qt">${rich(T(p.q))}</p><input class="in" type="text" inputmode="decimal" data-k="p${i}" value="${esc(a['p'+i]||'')}" autocomplete="off" placeholder="0,00"><span class="u">${esc(p.u||'')}</span>${p.work?`<textarea class="in" data-k="p${i}w" rows="2" style="min-height:4rem" placeholder="${u('workph')}">${esc(a['p'+i+'w']||'')}</textarea>`:''}</div>`).join('')},
 free(it){const a=A(it.id);const sh=S.shown[it.id];return it.parts.map((p,i)=>`<div class="fpart"><p class="qt">${rich(T(p.q))}</p>${wg(it,i,p)}<textarea class="in" id="${it.id}_${i}" data-k="p${i}" rows="3" placeholder="…">${esc(a['p'+i]||'')}</textarea>`+(sh?`<div class="model"><div class="t">${u('model').replace(/ anzeigen| ?$/,'')}</div>${rich(T(p.m))}</div>`:'')+'</div>').join('')+(sh?`<div class="rate"><span style="flex:1 1 100%;font-weight:600">${u('rate')}</span>`+['y','p','n'].map(v=>`<button type="button" data-rate="${v}" data-k="r" class="${a.r===v?'on':''}">${u(v)}</button>`).join('')+'</div>':'')}
};
function actions(it){if(it.type==='info'||it.type==='read')return'';if(it.type==='free')return S.shown[it.id]?'':`<button type="button" class="primary" data-act="model" data-id="${it.id}">${u('model')}</button>`;return`<button type="button" class="primary" data-act="check" data-id="${it.id}">${u('check')}</button>`}
function cardHtml(it){const v=it.level==='v';
 return`<section class="card${v?' vert':''}" id="c_${it.id}" data-id="${it.id}"><header>${it.no?`<span class="no">${esc(it.no)}</span>`:''}<h2>${rich(T(it.title))}</h2><span class="pts">${ptsLabel(it)}</span></header>`+
 (it.instr?`<p class="instr">${rich(T(it.instr))}</p>`:'')+tipBlock(it)+`<div class="body">${BODY[it.type](it)}</div><div class="actions">${actions(it)}</div><div class="fb" aria-live="polite"></div></section>`}
function renderAll(){
 document.documentElement.lang=S.lang;
 $('#cards').innerHTML=D.items.filter(visible).map(cardHtml).join('');
 $('#t_can').textContent=u('can');$('#l_name').textContent=u('name');$('#l_date').textContent=u('date');
 $('#cans').innerHTML=D.can.map((c,i)=>`<label><input type="checkbox" data-can="${i}"${S.can[i]?' checked':''}><span>${rich(T(c))}</span></label>`).join('');
 $('#b_eval').textContent=u('eval');$('#b_pdf').textContent='📄 '+u('pdf');$('#b_restart').textContent=u('restart');
 $$('[data-lv]').forEach(b=>{b.textContent=u(b.dataset.lv==='b'?'basis':'vert');b.classList.toggle('on',S.level===b.dataset.lv)});
 $$('[data-lg]').forEach(b=>b.classList.toggle('on',S.lang===b.dataset.lg));
 $('#cnt').textContent='';$('#m_ask').textContent=u('ask');$('#m_yes').textContent=u('yes');$('#m_no').textContent=u('no');
 D.items.filter(visible).forEach(it=>{if(S.checked[it.id])paint(it)});
 if(S.sub)renderResult();else $('#result').classList.add('hide');
 autoDir();progress()}
function progress(){const its=D.items.filter(it=>visible(it)&&counted(it));let n=0;its.forEach(it=>{if(grade(it).filled)n++});
 const pc=its.length?Math.round(n/its.length*100):0;$('#barfill').style.width=pc+'%';$('#cnt').textContent=n+' / '+its.length+' '+u('progress');
 $$('.card').forEach(c=>{const it=D.items.find(x=>x.id===c.dataset.id);c.classList.toggle('done',counted(it)&&grade(it).filled)});
 [25,50,75,100].forEach(m=>{if(pc>=m&&!(S.toast||{})[m]&&n>0){S.toast=S.toast||{};S.toast[m]=1;if(m===100||m===50)toast(m+' % ✓')}})}
function paint(it){const c=$('#c_'+it.id);if(!c)return;const g=grade(it);const fb=$('.fb',c);
 if(it.type==='read'){const a=A(it.id);const rd=$$('.rd',c);rd.forEach(r=>r.classList.add('chk'));
  let h=`${g.found===g.total&&!g.extra?'✔':'ℹ️'} ${g.found} ${u('of')} ${g.total} ${u('found')}`+(g.extra?`, ${g.extra} ${u('extra')}`:'');fb.className='fb '+(g.found===g.total&&!g.extra?'ok':'mid');fb.innerHTML=h;
  const q=it.quiz;if(q&&a.q!=null){const qq=$('.q',c);const ok=+a.q===q.a;qq.classList.toggle('ok',ok);qq.classList.toggle('bad',!ok);fb.innerHTML+=`<small>${ok?'✓':'✗'} ${rich(T(q.why))}</small>`}return}
 if(!S.checked[it.id]||it.type==='info')return;
 if(it.type==='free'){return}
 const right=g.parts.filter(p=>p.ok===true).length;
 g.parts.forEach((p,i)=>{$$('[data-part="'+i+'"]',c).forEach(el=>{el.classList.remove('ok','bad');if(p.has)el.classList.add(p.ok===true?'ok':'bad');else el.classList.add('bad')})});
 fb.className='fb '+(right===g.parts.length?'ok':right?'mid':'bad');
 fb.innerHTML=(right===g.parts.length?'✓ '+u('allright'):right+' '+u('of')+' '+g.parts.length+' '+u('right')+'. '+(g.filled?'':u('fill')+' ')+(right<g.parts.length?`<small>${u('notall')}</small>`:''))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
/* ---------- Ergebnis ---------- */
function stateOf(r){return r.ok===true?'g':r.ok===0.5?'m':'r'}
function renderResult(){
 const its=D.items.filter(visible);let got=0,max=0,bg=0,bm=0;
 const html=its.filter(it=>it.type!=='info').map(it=>{const g=grade(it);
  if(it.type==='read'){return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))} <span class="st ${g.found===g.total&&!g.extra?'g':'m'}">${g.filled?g.found+' / '+g.total:'–'}</span></h4><small>${u('readfb')}</small></div>`}
  if(it.level==='v'){bg+=g.got;bm+=g.max}else{got+=g.got;max+=g.max}
  const nr=g.parts.filter(r=>r.ok===true).length;const full=it.pts?g.got>=g.max-0.001:nr===g.parts.length;const cls=full?'g':(it.pts?g.got>0:nr>0)?'m':'r';
  let li=g.parts.map((r,i)=>{const p=r.p;let line='';const lab=it.type==='match'?T(p.l):it.type==='table'?(it.rows[p.ri]&&T(it.rows[p.ri][0])||'')+' ['+it.cols[p.ci]+']':it.type==='gap'?'('+(i+1)+')':T(p.q||p.t||'')||(i+1);
   const mark=r.ok===true?'✓':r.ok===0.5?'◐':'✗';
   line=`<li><b>${mark}</b> ${rich(String(lab).slice(0,200))}<br><span class="${r.ok===true?'':'mine'}">${u('mine')}: ${r.mine?rich(r.mine):u('empty')}</span>`;
   if(r.ok!==true||it.type==='free')line+=`<br><span class="sol">${u('sol')}: ${rich(r.sol)}</span>`;
   if(r.ok!==true&&r.why)line+=`<br><small>${u('why')}: ${rich(T(r.why))}</small>`;
   if(it.type==='calc'&&p.steps)line+=`<div class="steps"><b>${u('path')}:</b>`+p.steps.map(s=>`<div>${esc(T(s))}</div>`).join('')+'</div>';
   return line+'</li>'}).join('');
  if(it.why&&!full)li+=`<li><small>${u('why')}: ${rich(T(it.why))}</small></li>`;
  if(it.type==='free'&&g.parts.some(r=>!r.has))li+=`<li><small>${u('unrated')}</small></li>`;
  return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))}${it.level==='v'?' ('+u('vert')+')':''} <span class="st ${cls}">${it.pts?fmt(g.got)+' / '+fmt(g.max):''}</span></h4><ul>${li}</ul></div>`}).join('');
 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}
/* ---------- Ereignisse ---------- */
function cardOf(e){const c=e.closest('.card');return c?D.items.find(x=>x.id===c.dataset.id):null}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();return}if(t.id==='dt'){S.date=t.value;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.rate){const it=cardOf(t);A(it.id)[t.dataset.k]=t.dataset.rate;$$('[data-k="'+t.dataset.k+'"]',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));progress();save();return}
 const act=t.dataset.act;if(!act)return;const it=D.items.find(x=>x.id===t.dataset.id);
 if(act==='check'){S.checked[it.id]=true;paint(it);progress();save()}
 if(act==='rdchk'){A(it.id).chk=true;const c=$('#c_'+it.id);const keep=window.scrollY;const fbk=true;renderCard(it);paint(it);window.scrollTo(0,keep);progress();save()}
 if(act==='model'){S.shown[it.id]=true;renderCard(it);progress();save()}
});
function renderCard(it){const old=$('#c_'+it.id);const tmp=document.createElement('div');tmp.innerHTML=cardHtml(it);const det=old.querySelector('.tip').open;old.replaceWith(tmp.firstChild);if(S.checked[it.id]||it.type==='read')paint(it)}
function evaluate(){renderResult();$('#result').scrollIntoView({behavior:'smooth'})}
$('#b_eval').onclick=evaluate;
$('#b_pdf').onclick=()=>{renderResult();setTimeout(()=>window.print(),100)};
$('#b_restart').onclick=()=>$('#modal').classList.add('on');
$('#m_no').onclick=()=>$('#modal').classList.remove('on');
$('#m_yes').onclick=()=>{$('#modal').classList.remove('on');S=def();clearStore();$('#nm').value='';$('#dt').value=S.date;renderAll();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',()=>{$$('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})});
/* ---------- Start ---------- */
const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a.r=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();
