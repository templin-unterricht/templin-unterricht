<style>
:root{--fs:1;--ink:#1f2937;--mut:#5b6472;--bg:#f3f5fb;--card:#fff;--pri:#3b4cca;--pri2:#e8ebff;--ok:#1b8a4b;--okbg:#e3f6ea;--bad:#c0392b;--badbg:#fdeaea;--warn:#b7791f;--warnbg:#fff6dd;--vert:#7a3fb5;--vertbg:#f3eafc;--line:#d9deea}
*{box-sizing:border-box}html{font-size:calc(17px*var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.55;overflow-wrap:anywhere}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;min-height:48px;border-radius:12px;border:2px solid var(--pri);background:#fff;color:var(--pri);padding:.5rem 1rem;font-weight:600;touch-action:manipulation}
button.primary{background:var(--pri);color:#fff}button:disabled{opacity:.5}
button:active{transform:scale(.98)}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:.5rem .75rem;padding-top:max(.5rem,env(safe-area-inset-top))}
.top .row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;max-width:62rem;margin:0 auto}
.top .ttl{font-weight:700;font-size:.95rem;flex:1 1 12rem}
.pills{display:inline-flex;border:2px solid var(--pri);border-radius:12px;overflow:hidden}
.pills button{border:0;border-radius:0;min-height:44px;padding:.3rem .9rem}
.pills button.on{background:var(--pri);color:#fff}
.bar{height:12px;background:#e5e8f3;border-radius:8px;overflow:hidden;flex:1 1 8rem}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b4cca,#27a37a);transition:width .4s}
.cnt{font-size:.8rem;color:var(--mut);flex:0 0 auto}
.wrap{max-width:62rem;margin:0 auto;padding:1rem .75rem 5rem}
.head{background:var(--card);border-radius:16px;padding:1rem 1.1rem;margin-bottom:1rem;border-top:6px solid var(--pri)}
.head h1{margin:0 0 .2rem;font-size:1.5rem;line-height:1.25}.head .sub{color:var(--mut);margin:0 0 .8rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.fields label{display:block;font-weight:600;font-size:.85rem}
.fields input{width:100%;min-height:48px;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:.4rem .7rem;background:#fff}

.card.vert{border-left-color:var(--vert);background:linear-gradient(var(--vertbg),#fff 5rem)}

.vert .no{background:var(--vertbg);color:var(--vert)}
.pts{font-size:.85rem;color:var(--mut);white-space:nowrap}
.instr{margin:.5rem 0;font-weight:500}.instr.vi,.vi-t{color:#34495e}
.tip{margin:.5rem 0;border:1.5px dashed #d9a400;background:var(--warnbg);border-radius:12px}
.tip summary{list-style:none;cursor:pointer;min-height:48px;display:flex;align-items:center;padding:.3rem .8rem;font-weight:600;color:var(--warn)}
.tip summary::-webkit-details-marker{display:none}.tip>div{padding:0 .9rem .7rem}
.box{background:var(--pri2);border-radius:12px;padding:.7rem .9rem;margin:.6rem 0}
.box.merke{background:#fff3cd}.box h4{margin:0 0 .2rem}
.info p{margin:.5rem 0}
.vis{font-size:.95rem;border-left:4px solid var(--line);padding-left:.7rem;color:#34495e;margin:.5rem 0}
.rd{line-height:2.25;margin:.5rem 0}
.w{display:inline-block;padding:.1rem .2rem;margin:0 .05rem;border-radius:6px;cursor:pointer;user-select:none;-webkit-user-select:none;min-height:2rem}

.opts{display:grid;gap:.45rem}

.tfrow{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:.5rem 0;padding:.4rem;border-radius:12px}
.tfrow .st{flex:1 1 16rem}.tfrow .opts{display:flex;gap:.4rem}
select,.in{min-height:48px;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:.35rem .6rem;background:#fff;max-width:100%}
select:focus,.in:focus,textarea:focus{outline:3px solid #9fb0ff;border-color:var(--pri)}
.gaptxt{line-height:2.6}.gaptxt select,.gaptxt .in{margin:0 .15rem}
.mrow{display:grid;grid-template-columns:minmax(8rem,1fr) 2fr;gap:.5rem;align-items:center;margin:.5rem 0;padding:.4rem;border-radius:12px}
.mrow select{width:100%}
.trow{border:1.5px solid var(--line);border-radius:12px;padding:.6rem;margin:.6rem 0;display:grid;gap:.5rem}

.trow .fld{padding:.2rem;border-radius:10px}

.crow .qt{flex:1 1 100%;font-weight:600;margin:0}.crow .in{width:10rem;text-align:right}.crow .u{font-weight:600}
textarea.in{width:100%;min-height:6.5rem;resize:vertical;line-height:1.5}
.fpart{margin:.8rem 0}.fpart .qt{font-weight:600;margin:.2rem 0}
.wg{margin:.3rem 0}.wg summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--pri);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin:.3rem 0}.chip{min-height:44px;padding:.2rem .8rem;border-radius:999px;border:1.5px solid var(--pri);background:#fff;font-weight:500}
.model{background:var(--okbg);border-radius:12px;padding:.6rem .9rem;margin:.4rem 0}
.model .t{font-weight:700;color:var(--ok);font-size:.85rem}
.rate{display:flex;gap:.5rem;flex-wrap:wrap;margin:.4rem 0}.rate button{flex:1 1 7rem}
.rate button.on{background:var(--pri);color:#fff}
.ok{background:var(--okbg)!important;outline:2px solid var(--ok)}.bad{background:var(--badbg)!important;outline:2px solid var(--bad)}
select.ok,.in.ok,select.bad,.in.bad{outline-offset:0}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.6rem}
.fb{margin-top:.5rem;font-weight:600}.fb.ok{background:none;outline:0;color:var(--ok)}.fb.bad{background:none;outline:0;color:var(--bad)}.fb.mid{color:var(--warn)}
.fb small{display:block;font-weight:400;color:var(--ink)}
.bottom{background:var(--card);border-radius:16px;padding:1rem 1.1rem;margin:1rem 0}
.bottom .actions button{flex:1 1 14rem}
#result{background:var(--card);border-radius:16px;padding:1rem 1.1rem;margin:1rem 0;border-top:6px solid var(--ok)}
#result h2{margin:.2rem 0}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.ritem{border-top:1px solid var(--line);padding:.7rem 0}.ritem h4{margin:0 0 .3rem;display:flex;gap:.5rem;flex-wrap:wrap}
.ritem .st{font-weight:800}.st.g{color:var(--ok)}.st.m{color:var(--warn)}.st.r{color:var(--bad)}
.ritem ul{margin:.2rem 0;padding-left:1.2rem}.ritem li{margin:.15rem 0}
.sol{color:var(--ok);font-weight:600}.mine{color:var(--bad)}
.steps{background:#f1f4fb;border-radius:10px;padding:.4rem .8rem;margin:.3rem 0}.steps div{font-family:ui-monospace,Menlo,monospace;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#222;color:#fff;padding:.7rem 1.1rem;border-radius:12px;z-index:50;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .3s}.toast.on{opacity:.95}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:1rem}.modal.on{display:flex}
.modal>div{background:#fff;border-radius:16px;padding:1.2rem;max-width:26rem}.modal .actions button{flex:1}
.hide{display:none!important}
@media(max-width:560px){.top{padding:.3rem .5rem}.top .row{gap:.3rem}.top .ttl{display:none}.pills button{min-height:44px;padding:.2rem .6rem;font-size:.8rem}.pills{border-width:1.5px}.fields{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}html{font-size:calc(16px*var(--fs))}}
.printonly{display:none}
@media print{
 body{background:#fff;font-size:11pt}.top,.card,.head .can,.bottom,.toast,.modal,.noprint,.head .fields{display:none!important}
 .head{border:0;padding:0;margin:0}.printonly{display:block}
 #result{border:0;padding:0;margin:0;display:block!important}.ritem{break-inside:avoid}
 .wrap{padding:0;max-width:none}
}

<script>
const SHEET={"id":"M6","short":"LF 5 · Modul 6","title":"Modul 6 – Verkaufsförderung und Öffentlichkeitsarbeit","sub":"Lernfeld 5 · Werben und den Verkauf fördern","can":[{"de":"Ich kann Kunden-, Mitarbeiter- und Händlerpromotion unterscheiden und je ein Beispiel nennen.","vi":"Em có thể phân biệt Kundenpromotion (khuyến mãi cho khách), Mitarbeiterpromotion (cho nhân viên), Händlerpromotion (cho nhà bán lẻ) và nêu mỗi loại một ví dụ."},{"de":"Ich kann Verkaufsförderung von Öffentlichkeitsarbeit und Sponsoring abgrenzen.","vi":"Em có thể phân biệt Verkaufsförderung (xúc tiến bán hàng) với Öffentlichkeitsarbeit (quan hệ công chúng) và Sponsoring (tài trợ)."}],"items":[{"id":"a1","no":"Aufgabe 1","type":"free","pts":1,"title":"Ankommen: Was weißt du noch?","instr":{"de":"Beantworte die Fragen aus dem Kopf. Nicht nachschlagen. Es geht darum, was hängengeblieben ist.","vi":"Hãy trả lời bằng trí nhớ, không tra cứu. Điều quan trọng là em còn nhớ được gì."},"tip":{"de":"Denke an Modul 4 und 5 und an LF 4 (Warenplatzierung). Stichworte genügen.","vi":"Hãy nhớ lại Modul 4 và 5 và LF 4 (cách xếp hàng). Chỉ cần từ khóa."},"parts":[{"q":"1. Was ist ein Impulskauf? (aus LF 4)","m":"Ein ungeplanter Kauf, der spontan im Laden ausgelöst wird."},{"q":"2. Wofür stehen die vier Buchstaben von AIDA?","m":"Aufmerksamkeit – Interesse – Besitzwunsch – Kaufentschluss."},{"q":"3. Was legt der Streukreis fest?","m":"Den Personenkreis, der umworben wird – also die Zielgruppe."},{"q":"4. Wie berechnet man den Erfolg der Werbung in Prozent?","m":"Zahl der Käufer × 100 ÷ Zahl der eingeladenen Kunden."},{"q":"5. Was ist eine Verbundplatzierung? (aus LF 4)","m":"Artikel, die sich ergänzen, werden zusammen platziert, z. B. Nudeln und Tomatensoße."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)"},"html":"<p>Verkaufsförderung · Salespromotion · Point of Sale · Impulskauf · Kundenpromotion · Mitarbeiterpromotion · Händlerpromotion · Warenvorführung · Verkostung · Display · Einführungsrabatt · Öffentlichkeitsarbeit · Public Relations · Vertrauen · Sponsoring · Eventmarketing · Veröffentlichung · Spende<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"Verkaufsförderung = xúc tiến bán hàng · Point of Sale (POS) = nơi bán hàng · Impulskauf = mua bốc đồng · Kundenpromotion = khuyến mãi hướng đến khách · Mitarbeiterpromotion = hướng đến nhân viên · Händlerpromotion = hướng đến nhà bán lẻ (do nhà sản xuất làm) · Verkostung = nếm thử · Display = giá trưng bày · Einführungsrabatt = giảm giá khi nhập hàng mới · Öffentlichkeitsarbeit = quan hệ công chúng (PR) · Vertrauen = sự tin tưởng · Sponsoring = tài trợ (có đền đáp) · Eventmarketing = tiếp thị sự kiện · Veröffentlichung = đăng tải thông tin · Spende = quyên góp (không đền đáp)"},{"id":"r1","no":"Lesen 1","type":"read","title":"Verkaufsförderung","instr":{"de":"Lies den Text. Tippe an: Was ist Verkaufsförderung? Wo findet sie statt?","vi":"Em đọc đoạn văn. Chạm vào: Verkaufsförderung là gì? Diễn ra ở đâu?"},"tip":{"de":"Achte auf die Wörter, die Zeit und Ort beschreiben.","vi":"Chú ý các từ chỉ thời gian và địa điểm."},"paras":["Verkaufsförderung sind [[kurzfristige]] Maßnahmen am [[Verkaufsort]], um den [[Absatz]] der Waren zu steigern. Die Verkaufsförderung will die Kaufentscheidung genau dort beeinflussen, wo sie fällt: am Point of Sale (POS). Ziel ist, die Kunden zu [[Impulskäufen]] zu veranlassen."],"vi":"Tóm tắt: Verkaufsförderung là biện pháp ngắn hạn tại nơi bán để tăng doanh số. POS = Point of Sale (nơi bán hàng). Mục tiêu: khiến khách mua bốc đồng (Impulskauf).","quiz":{"q":"Was bedeutet POS?","o":["Point of Sale: der Ort des Verkaufs","Preis ohne Steuer","Plan für Online-Shops"],"a":0,"why":{"de":"POS = Point of Sale, der Ort, an dem verkauft wird.","vi":"POS = Point of Sale, nơi diễn ra việc bán hàng."}}},{"id":"w2","type":"info","title":{"de":"Die drei Promotionsarten","vi":"Ba loại Promotion"},"html":"<p><b>Kundenpromotion:<\/b> Sie spricht den Kunden an und fördert den Verkauf am Verkaufsort durch kurzfristige Aktionen. Beispiele: Verkostungen, Warenproben, Warenvorführungen, Werbegeschenke, Gewinnspiele, Gutscheine, Preisausschreiben, Modeschauen, Kochvorführungen.<\/p><p><b>Mitarbeiterpromotion:<\/b> Sie spricht die eigenen Verkaufsmitarbeiter an. Sie sollen motiviert werden, und die Qualität des Verkaufs soll steigen. Beispiele: Schulung bei neuen Waren oder Geräten, Verkaufstraining, Verkaufswettbewerbe, Prämien und Provisionen.<\/p><p><b>Händlerpromotion:<\/b> Sie wird von Herstellern und Großhändlern betrieben. Sie gibt dem Einzelhändler Anreize, ihre Waren verstärkt anzubieten. Beispiele: Einführungsrabatte, Rücknahmegarantien, Gratisware, Displays, Regale, Schaufensterdekorationen.<\/p><p>Die Kundenpromotion ist wichtiger geworden, weil ein Großteil der Kaufentscheidungen erst am Verkaufsort fällt.<\/p>","vi":"Kundenpromotion: hướng đến khách tại nơi bán (nếm thử, dùng thử, trình diễn, quà tặng, xổ số, phiếu quà tặng). Mitarbeiterpromotion: hướng đến nhân viên bán hàng của cửa hàng (đào tạo, thi đua bán hàng, tiền thưởng). Händlerpromotion: nhà sản xuất hoặc nhà bán buôn khuyến khích nhà bán lẻ (giảm giá nhập hàng, hàng tặng, giá trưng bày)."},{"id":"m1","no":"Übung 1","type":"match","pts":0,"title":"Beispiele den Promotionsarten zuordnen","instr":{"de":"Ordne jedes Beispiel der richtigen Art zu.","vi":"Em ghép mỗi ví dụ với đúng loại."},"tip":{"de":"Frage dich: Wer spricht wen an? Kunde, eigener Mitarbeiter oder Händler?","vi":"Tự hỏi: ai nói với ai? Khách, nhân viên của mình hay nhà bán lẻ?"},"rows":[{"l":"Verkostung im Supermarkt","a":"Kundenpromotion"},{"l":"Verkaufstraining für das Personal","a":"Mitarbeiterpromotion"},{"l":"Einführungsrabatt vom Hersteller","a":"Händlerpromotion"},{"l":"Gewinnspiel im Verkaufsraum","a":"Kundenpromotion"},{"l":"Prämie für verkaufte Geräte an die Verkäufer","a":"Mitarbeiterpromotion"},{"l":"Gratisware für den Einzelhändler","a":"Händlerpromotion"}],"extra":["Öffentlichkeitsarbeit"]},{"id":"w3","type":"info","title":{"de":"Öffentlichkeitsarbeit (Public Relations)","vi":"Öffentlichkeitsarbeit (quan hệ công chúng)"},"html":"<div class=\"box merke\"><b>Merke:<\/b> Die Öffentlichkeitsarbeit hat das Ziel, Vertrauen für das Einzelhandelsgeschäft zu werben. Es geht nicht um eine einzelne Ware, sondern um das Ansehen des ganzen Betriebs.<\/div><p><b>Sponsoring:<\/b> gegenseitiger Leistungsaustausch. Der Betrieb gibt Fördermittel nur, wenn er dafür eine Gegenleistung erhält, zum Beispiel Werbung. Beispiel: Ein Sportgeschäft stattet den örtlichen Fußballverein mit Trikots aus. Auf den Trikots steht der Name des Geschäfts.<\/p><p><b>Eventmarketing:<\/b> erlebnisorientierte Darstellung des Unternehmens und seiner Waren mit Showaktionen. Beispiel: Ein Autohaus stellt ein neues Modell bei einem Familientag vor, mit Essen, Probefahrten, Spielen und einer Band.<\/p><p><b>Veröffentlichungen:<\/b> Informationen über Firmenzeitschrift, Newsletter, Homepage oder Zeitungen.<\/p><p><b>Spende:<\/b> Der Betrieb gibt etwas, ohne eine Gegenleistung zu verlangen, und macht es öffentlich. Beispiel: Ein Einkaufszentrum spendet einer Berufsschule einen EDV-Raum mit 15 PCs.<\/p><div class=\"box merke\"><b>Merke:<\/b> Verkaufsförderung soll heute etwas verkaufen. Öffentlichkeitsarbeit soll langfristig Vertrauen aufbauen. Sponsoring ist ein Geschäft auf Gegenseitigkeit, eine Spende nicht.<\/div>","vi":"Öffentlichkeitsarbeit = xây dựng sự tin tưởng với công chúng, không phải bán một món hàng. Sponsoring = tài trợ có đền đáp (ví dụ quảng cáo trên áo đội bóng). Eventmarketing = sự kiện trải nghiệm. Veröffentlichung = đăng thông tin. Spende = quyên góp không đòi đền đáp. Verkaufsförderung = bán hàng ngay hôm nay; Öffentlichkeitsarbeit = tạo niềm tin lâu dài."},{"id":"t1","no":"Lesen 2","type":"tf","pts":0,"title":"Richtig oder falsch?","instr":{"de":"Entscheide: Ist die Aussage richtig oder falsch?","vi":"Em quyết định: câu này đúng hay sai?"},"tip":{"de":"Achte darauf, ob der Betrieb eine Gegenleistung bekommt.","vi":"Chú ý xem cửa hàng có nhận được gì đền đáp không."},"st":[{"t":"Bei einer Spende verlangt der Betrieb keine Gegenleistung.","a":true},{"t":"Sponsoring und Spende sind dasselbe.","a":false,"why":{"de":"Beim Sponsoring gibt es eine Gegenleistung, zum Beispiel Werbung auf Trikots. Bei der Spende nicht.","vi":"Với Sponsoring có đền đáp, ví dụ quảng cáo trên áo đấu. Với Spende thì không."}},{"t":"Händlerpromotion machen Hersteller und Großhändler.","a":true},{"t":"Verkaufsförderung soll langfristig Vertrauen aufbauen.","a":false,"why":{"de":"Verkaufsförderung wirkt kurzfristig am Verkaufsort. Langfristiges Vertrauen ist Ziel der Öffentlichkeitsarbeit.","vi":"Verkaufsförderung tác động ngắn hạn tại nơi bán. Xây dựng niềm tin lâu dài là mục tiêu của Öffentlichkeitsarbeit."}}]},{"id":"m2","no":"Übung 2","type":"match","pts":0,"title":"Formen der Öffentlichkeitsarbeit","instr":{"de":"Ordne jedem Beispiel die richtige Form zu.","vi":"Em ghép mỗi ví dụ với đúng hình thức."},"tip":{"de":"Gibt es eine Gegenleistung? Wird verkauft? Gibt es Show und Erlebnis?","vi":"Có đền đáp không? Có bán hàng không? Có biểu diễn và trải nghiệm không?"},"rows":[{"l":"Ein Sportgeschäft druckt seinen Namen auf die Trikots des Fußballvereins.","a":"Sponsoring"},{"l":"Ein Autohaus lädt zu einem Familientag mit Probefahrten, Band und Spielen ein.","a":"Eventmarketing"},{"l":"Ein Betrieb schickt einen Newsletter über seine Unternehmensziele.","a":"Veröffentlichung"},{"l":"Ein Einkaufszentrum schenkt einer Schule 15 PCs und lädt die Presse ein.","a":"Spende"}]},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: Drei Fragen, drei Formen","html":"<p><b>Ein Getränkehersteller stellt dem Supermarkt einen Kühlschrank mit seinem Logo hin.<\/b> Wer spricht wen an? Der Hersteller spricht den Einzelhändler an. Was will er? Dass der Händler seine Ware verstärkt anbietet. → Händlerpromotion.<\/p><p><b>Im Supermarkt steht am Samstag eine Frau an der Käsetheke und gibt Kostproben aus.<\/b> Der Händler spricht den Kunden an, direkt am Verkaufsort. Er will einen Impulskauf auslösen. → Kundenpromotion.<\/p><p><b>Der Supermarkt schult sein Personal an der neuen Kasse.<\/b> Der Betrieb spricht die eigenen Mitarbeiter an. Er will bessere Qualität im Verkauf. → Mitarbeiterpromotion.<\/p><p><b>Derselbe Supermarkt spendet dem Kindergarten neue Fahrräder und lädt die Zeitung dazu ein.<\/b> Hier wird nichts verkauft, und es gibt keine vereinbarte Gegenleistung. Es geht um das Ansehen des Betriebs. → Öffentlichkeitsarbeit, und zwar eine Spende.<\/p><div class=\"box merke\"><b>Ergebnis:<\/b> Erst fragen: Wer wird angesprochen – Kunde, Mitarbeiter oder Händler? Dann: Geht es um Absatz heute oder um Vertrauen auf Dauer?<\/div>","vi":"Ví dụ mẫu: nhà sản xuất đặt tủ lạnh có logo ở siêu thị → Händlerpromotion. Nếm thử phô mai cho khách ở quầy → Kundenpromotion. Đào tạo nhân viên dùng máy thu ngân mới → Mitarbeiterpromotion. Tặng xe đạp cho trường mẫu giáo và mời báo chí → Öffentlichkeitsarbeit (Spende)."},{"id":"a3","no":"Aufgabe 3","type":"match","pts":1,"title":"Geführte Übung","instr":{"de":"Ordne jede Maßnahme zu: Kundenpromotion, Mitarbeiterpromotion, Händlerpromotion oder Öffentlichkeitsarbeit.","vi":"Em xếp mỗi biện pháp vào: Kundenpromotion, Mitarbeiterpromotion, Händlerpromotion hoặc Öffentlichkeitsarbeit."},"tip":{"de":"Frage dich: Von wem geht die Maßnahme aus, und wer bekommt etwas? Bekommt der Betrieb etwas zurück, dann ist es Sponsoring (Öffentlichkeitsarbeit).","vi":"Tự hỏi: biện pháp xuất phát từ ai và ai nhận được gì? Nếu cửa hàng nhận lại điều gì đó thì đó là Sponsoring (Öffentlichkeitsarbeit)."},"rows":[{"l":"1. Ein Modehaus veranstaltet im Verkaufsraum eine Modenschau.","a":"Kundenpromotion"},{"l":"2. Ein Hersteller von Kaffeemaschinen gewährt dem Händler einen Einführungsrabatt, wenn er das neue Modell ins Sortiment nimmt.","a":"Händlerpromotion"},{"l":"3. Ein Elektromarkt zahlt seinen Verkäufern eine Prämie für jedes verkaufte Gerät der neuen Serie.","a":"Mitarbeiterpromotion"},{"l":"4. Ein Baumarkt übernimmt die Kosten für die neuen Trikots des örtlichen Handballvereins. Auf den Trikots steht sein Name.","a":"Öffentlichkeitsarbeit"}],"extra":["Kundenpromotion","Mitarbeiterpromotion","Händlerpromotion","Öffentlichkeitsarbeit"],"why":{"de":"Kunde im Verkaufsraum = Kundenpromotion. Hersteller gibt dem Händler Anreiz = Händlerpromotion. Eigene Verkäufer = Mitarbeiterpromotion. Name auf Trikots gegen Kosten = Sponsoring, also Öffentlichkeitsarbeit.","vi":"Khách trong khu bán hàng = Kundenpromotion. Nhà sản xuất khuyến khích nhà bán lẻ = Händlerpromotion. Nhân viên bán hàng của mình = Mitarbeiterpromotion. Tên trên áo đấu đổi lấy chi phí = Sponsoring, tức là Öffentlichkeitsarbeit."}},{"id":"a4","no":"Aufgabe 4","type":"free","pts":1,"title":"Freie Übung","instr":{"de":"Beantworte die Fragen in eigenen Worten.","vi":"Em trả lời các câu hỏi bằng lời của mình."},"tip":{"de":"Bei Frage 5 hilft das Wort „Gegenleistung“.","vi":"Câu 5: từ “Gegenleistung” (sự đền đáp) sẽ giúp em."},"parts":[{"q":"1. Definiere den Begriff Verkaufsförderung.","m":"Verkaufsförderung sind kurzfristige Maßnahmen am Verkaufsort, um den Absatz der Waren zu steigern.","s":["Verkaufsförderung sind …"]},{"q":"2. Wofür steht die Abkürzung POS, und warum ist dieser Ort für die Verkaufsförderung so wichtig?","m":"POS steht für Point of Sale, also den Ort des Verkaufs. Er ist wichtig, weil ein Großteil der Kaufentscheidungen erst dort fällt."},{"q":"3. Nenne zu jeder der drei Promotionsarten ein Beispiel.","m":"Kundenpromotion: Verkostung. Mitarbeiterpromotion: Verkaufstraining. Händlerpromotion: Einführungsrabatt des Herstellers."},{"q":"4. Was ist das Ziel der Öffentlichkeitsarbeit?","m":"Vertrauen für das Einzelhandelsgeschäft zu werben."},{"q":"5. Erkläre den Unterschied zwischen Sponsoring und einer Spende.","m":"Beim Sponsoring gibt es eine Gegenleistung, zum Beispiel Werbung auf den Trikots. Eine Spende wird ohne Gegenleistung gegeben.","s":["Beim Sponsoring …","Bei einer Spende …"]},{"q":"6. Was ist Eventmarketing? Nenne ein Beispiel.","m":"Eine erlebnisorientierte Darstellung des Unternehmens und seiner Waren in einer Mischung aus Showaktionen, die zur Zielgruppe passen – zum Beispiel ein Familientag im Autohaus mit Probefahrten, Essen und einer Band."}]},{"id":"a5","no":"Aufgabe 5","type":"free","pts":0,"title":"Aus deinem Betrieb","instr":{"de":"Welche Maßnahmen der Verkaufsförderung gibt es in deinem Ausbildungsbetrieb? Notiere je eine für Kunden-, Mitarbeiter- und Händlerpromotion. Falls dir zu einer Form nichts einfällt, frage nach.","vi":"Cửa hàng nơi em thực tập có những biện pháp Verkaufsförderung nào? Ghi mỗi loại một cái: Kundenpromotion, Mitarbeiterpromotion, Händlerpromotion. Nếu không nghĩ ra, em hãy hỏi."},"tip":{"de":"Typische Beispiele: Verkostung, Aktionsplatzierung (Kunde) – Schulung, Prämie (Mitarbeiter) – Display, Gratisware vom Lieferanten (Händler).","vi":"Ví dụ thường gặp: nếm thử, xếp hàng khuyến mãi (khách) – đào tạo, tiền thưởng (nhân viên) – giá trưng bày, hàng tặng từ nhà cung cấp (nhà bán lẻ)."},"parts":[{"q":"Meine drei Maßnahmen:","m":"Individuelle Lösung. Erwartet werden drei Maßnahmen mit jeweils einer Zuordnung. Häufige Nennungen: Verkostung oder Aktionsplatzierung (Kunde), Schulung oder Prämie (Mitarbeiter), Display oder Gratisware vom Lieferanten (Händler).","s":["Kundenpromotion: …","Mitarbeiterpromotion: …","Händlerpromotion: …"]}]},{"id":"a6","no":"Aufgabe 6","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh."},"tip":{"de":"6.1: Wer entscheidet, was im Regal steht? 6.2: Denke an Modul 5. 6.3: Entscheidend ist, ob eine Gegenleistung vereinbart wurde.","vi":"6.1: ai quyết định hàng nào ở trên kệ? 6.2: nhớ lại Modul 5. 6.3: điều quyết định là có thỏa thuận đền đáp hay không."},"parts":[{"q":"6.1 Warum investieren Hersteller Geld in Händlerpromotion, obwohl sie damit nicht direkt an den Endkunden verkaufen?","m":"Weil der Hersteller den Endkunden nur erreicht, wenn seine Ware überhaupt im Regal steht. Der Einzelhändler entscheidet über Sortiment, Platzierung und Menge. Wer ihm Rabatte, Displays oder Rücknahmegarantien bietet, senkt sein Risiko – und bekommt dafür den besseren Platz im Laden."},{"q":"6.2 Eine Verkostung kostet den Betrieb Personal, Ware und Fläche. Woran könnte er messen, ob sie sich gelohnt hat? Denke an Modul 5.","m":"Über die Kennzahlen der wirtschaftlichen Werbeerfolgskontrolle: Absatz der verkosteten Ware am Aktionstag im Vergleich zu einem normalen Tag, Kundenzahl (Frequenz), Umsatz und daraus die Werberendite. Über die Kassenbons lässt sich zusätzlich prüfen, ob auch andere Waren mehr gekauft wurden."},{"q":"6.3 Ein Discounter spendet an eine Tafel und lässt darüber in der Zeitung berichten. Ist das noch Öffentlichkeitsarbeit oder schon Werbung? Begründe beide Sichtweisen.","m":"Für Öffentlichkeitsarbeit spricht: Es geht nicht um eine einzelne Ware, sondern um das Ansehen des Betriebs – er zeigt sich als sozial. Für Werbung spricht: Die Spende wird bewusst öffentlich gemacht, um den Absatz mittelbar zu fördern. Beides stimmt; die Grenze ist fließend. Entscheidend für die Einordnung ist, ob eine Gegenleistung vereinbart wurde – dann wäre es Sponsoring."}]},{"id":"v1","level":"v","no":"Vertiefung 1","type":"free","pts":1,"title":"Warum ist das so?","instr":{"de":"Warum ist die Kundenpromotion in den letzten Jahren wichtiger geworden? Begründe.","vi":"Tại sao Kundenpromotion trong những năm gần đây trở nên quan trọng hơn? Hãy giải thích."},"tip":{"de":"Wo fällt ein Großteil der Kaufentscheidungen?","vi":"Phần lớn quyết định mua được đưa ra ở đâu?"},"parts":[{"q":"Meine Begründung:","m":"Ein Großteil der Kaufentscheidungen fällt erst am Verkaufsort. Dort ist noch kurzfristig eine Information der Kunden möglich, und die Kunden lassen sich zu Impulskäufen anregen.","s":["Sie ist wichtiger geworden, weil …"]}]},{"id":"v2","level":"v","no":"Vertiefung 2","type":"free","pts":1,"title":"Begründe deine Entscheidung","instr":{"de":"Ein Betrieb gibt einem Verein 500 € und verlangt, dass sein Logo auf den Trikots steht. Ist das eine Spende oder Sponsoring? Begründe.","vi":"Một cửa hàng cho câu lạc bộ 500 € và yêu cầu in logo của mình lên áo đấu. Đó là Spende hay Sponsoring? Hãy giải thích."},"tip":{"de":"Bekommt der Betrieb etwas für sein Geld zurück?","vi":"Cửa hàng có nhận lại thứ gì cho số tiền của mình không?"},"parts":[{"q":"Meine Entscheidung und meine Begründung:","m":"Das ist Sponsoring, denn der Betrieb erhält eine Gegenleistung: Sein Logo steht auf den Trikots. Bei einer Spende gäbe es keine Gegenleistung.","s":["Das ist …, weil …"]}]}]};
</script>

function cells(it){const o=[];it.rows.forEach((r,ri)=>r.forEach((c,ci)=>{if(c&&typeof c==='object')o.push({ri,ci,a:c.a,o:c.o||(it.colOpts||[])[ci],typed:c.typed,why:c.why})}));return o}
function parts(it){switch(it.type){case'mc':return it.qs;case'tf':return it.st;case'gap':return it.gaps;case'match':return it.rows;case'table':return cells(it);case'calc':case'free':return it.parts;default:return[]}}
function matchOpts(it){return shuf([...new Set(it.rows.map(r=>r.a).concat(it.extra||[]))],it.id)}
function visible(it){return it.level==='v'?S.level==='v':true}
function scored(it){return['mc','tf','gap','match','table','calc','free'].indexOf(it.type)>=0}
function counted(it){return scored(it)||it.type==='read'}
/* ---------- Bewertung ---------- */
function mcTxt(p,idx){return String(idx).split(',').filter(x=>x!=='').map(i=>p.o[+i]).join(' / ')}
function grade(it){
 const a=A(it.id),ps=parts(it),res=[];
 if(it.type==='read'){const keys=readKeys(it),sel=a.m||[];const found=keys.filter(k=>sel.indexOf(k)>=0).length,extra=sel.filter(k=>keys.indexOf(k)<0).length;
  const q=it.quiz,qa=a.q;return{type:'read',found,total:keys.length,extra,qok:q?(qa!=null&&+qa===q.a):null,max:0,got:0,parts:[],filled:!!(a.chk&&(!q||qa!=null))}}
 ps.forEach((p,i)=>{const v=a['p'+i];let ok=false,mine='',sol='',has=v!=null&&String(v).trim()!=='';
  switch(it.type){
  case'mc':{const sa=[].concat(p.a).slice().sort().join(',');const sv=has?String(v).split(',').sort().join(','):'';ok=has&&sv===sa;mine=has?mcTxt(p,v):'';sol=mcTxt(p,sa);break}
  case'tf':ok=has&&(v==='t')===p.a;mine=has?(v==='t'?u('richtig'):u('falsch')):'';sol=p.a?u('richtig'):u('falsch');break;
  case'gap':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'match':ok=has&&v===p.a;mine=has?v:'';sol=p.a;break;
  case'table':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'calc':{const n=num(v);ok=has&&!isNaN(n)&&Math.abs(n-p.a)<=(p.tol==null?0.01:p.tol);mine=has?v:'';sol=fnum(p.a)+(p.u?' '+p.u:'');if(a['p'+i+'w'])mine+=' | '+u('path')+': '+a['p'+i+'w'];break}
  case'free':{const r=a.r;ok=r==='y'?true:r==='p'?0.5:false;has=has&&!!r;mine=a['p'+i]||'';sol=T(p.m);break}
  }
  res.push({ok,has,mine,sol,why:p.why,q:p.q,p});});
 const per=ps.length?it.pts/ps.length:0;let got=0;res.forEach(r=>{got+=(r.ok===true?1:r.ok===0.5?0.5:0)*per});
 let filled;if(it.type==='free')filled=ps.every((p,i)=>String(a['p'+i]||'').trim()!=='');else filled=res.every(r=>r.has);
 return{type:it.type,parts:res,max:it.pts||0,got,filled,any:res.some(r=>r.has)}}
function tokens(p){const out=[];let idx=0;let m;
 const parts=[];let last=0,s=p;const rg=/\[\[(.+?)\]\]|\{\{(.+?)\}\}/g;while((m=rg.exec(s))){if(m.index>last)parts.push({t:s.slice(last,m.index)});parts.push({t:m[1]||m[2],key:!!m[1]});last=rg.lastIndex}
 if(last<s.length)parts.push({t:s.slice(last)});
 parts.forEach((pt,pi)=>{const prev=parts[pi-1];pt.t.split(/\s+/).filter(Boolean).forEach((w,wi)=>{const att=wi===0&&prev&&!/\s$/.test(prev.t)&&!/^\s/.test(pt.t);out.push({w,key:!!pt.key,i:idx++,att,pu:/^[.,;:!?)“”„"]+$/.test(w)})})});return out}
function allTokens(it){let g=0;return it.paras.map(p=>tokens(p).map(t=>({w:t.w,key:t.key,att:t.att,pu:t.pu,i:g++})))}
function readKeys(it){const k=[];allTokens(it).forEach(ps=>ps.forEach(t=>{if(t.key)k.push(t.i)}));return k}
/* ---------- Rendern ---------- */
function ptsLabel(it){if(it.type==='read'||!it.pts)return'';return it.level==='v'?'+'+fmt(it.pts)+' '+(S.lang==='vi'?'điểm thưởng':'Bonus'):fmt(it.pts)+' '+(S.lang==='vi'?'điểm':(it.pts===1?'Punkt':'Punkte'))}
function tipBlock(it){return it.tip?`<details class="tip"><summary>💡 ${u('tip')}</summary><div>${rich(T(it.tip))}</div></details>`:''}
function wg(it,i,p){if(!p.w&&!p.s)return'';const ch=(p.w||[]).concat(p.s||[]).map(x=>`<button type="button" class="chip" data-chip="${esc(x)}" data-for="${it.id}_${i}">${esc(x)}</button>`).join('');return`<details class="wg"><summary>✏️ ${u('words')}</summary><div class="chips">${ch}</div></details>`}
const BODY={
 info(it){return`<div class="info">${it.html||''}</div>`+(it.vi&&S.lang==='vi'?`<div class="vis">${rich(it.vi)}</div>`:'')},
 read(it){const per=allTokens(it);const a=A(it.id);const sel=a.m||[];
  const ps=per.map(ts=>`<p class="rd${a.chk?' chk':''}" data-rd="${it.id}">`+ts.map(t=>t.pu&&t.att?esc(t.w):(t.att?'':' ')+`<span class="w${t.key?' key':''}${sel.indexOf(t.i)>=0?' sel':''}" data-w="${t.i}" role="button" tabindex="0">${esc(t.w)}</span>`).join('').trim()+'</p>').join('');
  const q=it.quiz;let quiz='';
  if(q&&a.chk){quiz=`<div class="q" data-part="0"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="radio" name="${it.id}_q" data-k="q" value="${j}"${a.q!=null&&+a.q===j?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}
  return`<p class="vis">${u('tap')}</p>${ps}<div class="actions"><button type="button" class="primary" data-act="rdchk" data-id="${it.id}">${u('chkmark')}</button></div>${quiz}`+(it.vi&&S.lang==='vi'?`<p class="vis">${rich(it.vi)}</p>`:'')},
 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';
   else el=`<input class="in" type="text" data-k="p${i}" data-part="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(8,String([].concat(g.a)[0]).length+2)}" value="${esc(v)}">`;
   html=html.replace('{'+i+'}',el)});
  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},
 match(it){const a=A(it.id);const o=matchOpts(it);return it.rows.map((r,i)=>`<div class="mrow" data-part="${i}"><div><b>${rich(T(r.l))}</b></div><select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${a['p'+i]===x?' selected':''}>${esc(x)}</option>`).join('')+'</select></div>').join('')},
 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{
   if(c&&typeof c==='object'){const i=n++;const o=c.o||(it.colOpts||[])[ci];const v=a['p'+i]||'';const f=o?`<select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>':`<input class="in" type="text" data-k="p${i}" value="${esc(v)}" autocomplete="off">`;
    return`<div class="fld" data-part="${i}"><label>${esc(it.cols[ci])}</label>${f}</div>`}
   return`<div class="fld"><label>${esc(it.cols[ci])}</label><div>${rich(T(c))}</div></div>`}).join('')+'</div>'}).join('')},
 calc(it){const a=A(it.id);return it.parts.map((p,i)=>`<div class="crow" data-part="${i}"><p class="qt">${rich(T(p.q))}</p><input class="in" type="text" inputmode="decimal" data-k="p${i}" value="${esc(a['p'+i]||'')}" autocomplete="off" placeholder="0,00"><span class="u">${esc(p.u||'')}</span>${p.work?`<textarea class="in" data-k="p${i}w" rows="2" style="min-height:4rem" placeholder="${S.lang==='vi'?'Cách tính (viết ra)':'Rechenweg (aufschreiben)'}">${esc(a['p'+i+'w']||'')}</textarea>`:''}</div>`).join('')},
 free(it){const a=A(it.id);const sh=S.shown[it.id];return it.parts.map((p,i)=>`<div class="fpart"><p class="qt">${rich(T(p.q))}</p>${wg(it,i,p)}<textarea class="in" id="${it.id}_${i}" data-k="p${i}" rows="3" placeholder="…">${esc(a['p'+i]||'')}</textarea>`+(sh?`<div class="model"><div class="t">${u('model').replace(/ anzeigen| ?$/,'')}</div>${rich(T(p.m))}</div>`:'')+'</div>').join('')+(sh?`<div class="rate"><span style="flex:1 1 100%;font-weight:600">${u('rate')}</span>`+['y','p','n'].map(v=>`<button type="button" data-rate="${v}" data-k="r" class="${a.r===v?'on':''}">${u(v)}</button>`).join('')+'</div>':'')}
};
function actions(it){if(it.type==='info'||it.type==='read')return'';if(it.type==='free')return S.shown[it.id]?'':`<button type="button" class="primary" data-act="model" data-id="${it.id}">${u('model')}</button>`;return`<button type="button" class="primary" data-act="check" data-id="${it.id}">${u('check')}</button>`}
function cardHtml(it){const v=it.level==='v';
 return`<section class="card${v?' vert':''}" id="c_${it.id}" data-id="${it.id}"><header>${it.no?`<span class="no">${esc(it.no)}</span>`:''}<h2>${rich(T(it.title))}</h2><span class="pts">${ptsLabel(it)}</span></header>`+
 (it.instr?`<p class="instr">${rich(T(it.instr))}</p>`:'')+tipBlock(it)+`<div class="body">${BODY[it.type](it)}</div><div class="actions">${actions(it)}</div><div class="fb" aria-live="polite"></div></section>`}
function renderAll(){
 document.documentElement.lang=S.lang==='vi'?'vi':'de';
 $('#cards').innerHTML=D.items.filter(visible).map(cardHtml).join('');
 $('#t_can').textContent=u('can');$('#l_name').textContent=u('name');$('#l_date').textContent=u('date');
 $('#cans').innerHTML=D.can.map((c,i)=>`<label><input type="checkbox" data-can="${i}"${S.can[i]?' checked':''}><span>${rich(T(c))}</span></label>`).join('');
 $('#b_eval').textContent=u('eval');$('#b_pdf').textContent='📄 '+u('pdf');$('#b_restart').textContent=u('restart');
 $$('[data-lv]').forEach(b=>{b.textContent=u(b.dataset.lv==='b'?'basis':'vert');b.classList.toggle('on',S.level===b.dataset.lv)});
 $$('[data-lg]').forEach(b=>b.classList.toggle('on',S.lang===b.dataset.lg));
 $('#cnt').textContent='';$('#m_ask').textContent=u('ask');$('#m_yes').textContent=u('yes');$('#m_no').textContent=u('no');
 D.items.filter(visible).forEach(it=>{if(S.checked[it.id])paint(it)});
 if(S.sub)renderResult();else $('#result').classList.add('hide');
 progress()}
function progress(){const its=D.items.filter(it=>visible(it)&&counted(it));let n=0;its.forEach(it=>{if(grade(it).filled)n++});
 const pc=its.length?Math.round(n/its.length*100):0;$('#barfill').style.width=pc+'%';$('#cnt').textContent=n+' / '+its.length+' '+u('progress');
 $$('.card').forEach(c=>{const it=D.items.find(x=>x.id===c.dataset.id);c.classList.toggle('done',counted(it)&&grade(it).filled)});
 [25,50,75,100].forEach(m=>{if(pc>=m&&!(S.toast||{})[m]&&n>0){S.toast=S.toast||{};S.toast[m]=1;if(m===100||m===50)toast(m+' % ✓')}})}
function paint(it){const c=$('#c_'+it.id);if(!c)return;const g=grade(it);const fb=$('.fb',c);
 if(it.type==='read'){const a=A(it.id);const rd=$$('.rd',c);rd.forEach(r=>r.classList.add('chk'));
  let h=`${g.found===g.total&&!g.extra?'✔':'ℹ️'} ${g.found} ${u('of')} ${g.total} ${u('found')}`+(g.extra?`, ${g.extra} ${u('extra')}`:'');fb.className='fb '+(g.found===g.total&&!g.extra?'ok':'mid');fb.innerHTML=h;
  const q=it.quiz;if(q&&a.q!=null){const qq=$('.q',c);const ok=+a.q===q.a;qq.classList.toggle('ok',ok);qq.classList.toggle('bad',!ok);fb.innerHTML+=`<small>${ok?'✓':'✗'} ${rich(T(q.why))}</small>`}return}
 if(!S.checked[it.id]||it.type==='info')return;
 if(it.type==='free'){return}
 const right=g.parts.filter(p=>p.ok===true).length;
 g.parts.forEach((p,i)=>{$$('[data-part="'+i+'"]',c).forEach(el=>{el.classList.remove('ok','bad');if(p.has)el.classList.add(p.ok===true?'ok':'bad');else el.classList.add('bad')})});
 fb.className='fb '+(right===g.parts.length?'ok':right?'mid':'bad');
 fb.innerHTML=(right===g.parts.length?'✓ '+u('allright'):right+' '+u('of')+' '+g.parts.length+' '+u('right')+'. '+(g.filled?'':u('fill')+' ')+(right<g.parts.length?`<small>${u('notall')}</small>`:''))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
/* ---------- Ergebnis ---------- */
function stateOf(r){return r.ok===true?'g':r.ok===0.5?'m':'r'}
function renderResult(){
 const its=D.items.filter(visible);let got=0,max=0,bg=0,bm=0;
 const html=its.filter(it=>it.type!=='info').map(it=>{const g=grade(it);
  if(it.type==='read'){return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))} <span class="st ${g.found===g.total&&!g.extra?'g':'m'}">${g.filled?g.found+' / '+g.total:'–'}</span></h4><small>${u('readfb')}</small></div>`}
  if(it.level==='v'){bg+=g.got;bm+=g.max}else{got+=g.got;max+=g.max}
  const nr=g.parts.filter(r=>r.ok===true).length;const full=it.pts?g.got>=g.max-0.001:nr===g.parts.length;const cls=full?'g':(it.pts?g.got>0:nr>0)?'m':'r';
  let li=g.parts.map((r,i)=>{const p=r.p;let line='';const lab=it.type==='match'?T(p.l):it.type==='table'?(it.rows[p.ri]&&T(it.rows[p.ri][0])||'')+' ['+it.cols[p.ci]+']':it.type==='gap'?'('+(i+1)+')':T(p.q||p.t||'')||(i+1);
   const mark=r.ok===true?'✓':r.ok===0.5?'◐':'✗';
   line=`<li><b>${mark}</b> ${rich(String(lab).slice(0,200))}<br><span class="${r.ok===true?'':'mine'}">${u('mine')}: ${r.mine?rich(r.mine):u('empty')}</span>`;
   if(r.ok!==true||it.type==='free')line+=`<br><span class="sol">${u('sol')}: ${rich(r.sol)}</span>`;
   if(r.ok!==true&&r.why)line+=`<br><small>${u('why')}: ${rich(T(r.why))}</small>`;
   if(it.type==='calc'&&p.steps)line+=`<div class="steps"><b>${u('path')}:</b>`+p.steps.map(s=>`<div>${esc(T(s))}</div>`).join('')+'</div>';
   return line+'</li>'}).join('');
  if(it.why&&!full)li+=`<li><small>${u('why')}: ${rich(T(it.why))}</small></li>`;

 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}

});

/* ---------- Start ---------- */
const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a.r=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();

</script>
