<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF 4 · Digitales Arbeitsblatt</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + .5rem) 1rem .4rem}
#bar .row{display:flex;align-items:center;gap:.6rem;max-width:56rem;margin:0 auto}
#bar .ttl{font-weight:700;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{height:.7rem;background:#e6e3da;border-radius:1rem;overflow:hidden;max-width:56rem;margin:.35rem auto 0}
#progf{height:100%;width:0;background:var(--pri);transition:width .4s}
#progt{font-size:.8rem;color:var(--mute);max-width:56rem;margin:.1rem auto 0}
#langs{display:flex;gap:.4rem;overflow-x:auto;max-width:56rem;margin:.35rem auto 0;padding-bottom:.15rem;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;min-height:44px;padding:0 .9rem;border:2px solid var(--line);background:#fff;border-radius:2rem;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;margin:0 0 1rem}
.card h2{font-size:1.25rem;margin:0 0 .4rem;line-height:1.3}
.card h2 .nr{display:inline-block;background:var(--pri);color:#fff;border-radius:.5rem;padding:0 .5rem;margin-right:.4rem;font-size:.95rem}
.vtag{display:inline-block;background:#6a3fa0;color:#fff;border-radius:.5rem;padding:0 .5rem;font-size:.85rem;margin-left:.3rem}
.card.v{border-color:#6a3fa0;background:#faf6ff}
.tr{font-size:.9rem;color:#4a5a66;background:#f1f6f9;border-left:4px solid #9cc3d5;border-radius:.4rem;padding:.3rem .6rem;margin:.3rem 0 .5rem;line-height:1.5}
.tr[dir=rtl]{border-left:0;border-right:4px solid #9cc3d5}
.tr[lang=ti]{font-family:"Kefa","Noto Sans Ethiopic",sans-serif}
.tr[lang=vi]{line-height:1.65}
small.b{display:block;font-size:.72rem;font-weight:400;opacity:.9;line-height:1.2}
.in{display:block;width:100%;min-height:48px;font:inherit;font-size:1rem;padding:.55rem .7rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink)}
input.in,select.in{font-size:1rem}
textarea.in{min-height:5.5rem;resize:vertical}
.btn{min-height:48px;padding:.4rem 1.1rem;border:0;border-radius:.8rem;background:var(--pri);color:#fff;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin:.3rem .4rem .3rem 0}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.gray{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.big{min-height:56px;font-size:1.1rem}
.btn:active,.pill:active,.opt:active,.ch:active{transform:scale(.97)}
.tipb{min-height:48px;min-width:48px;border-radius:2rem;border:2px solid var(--warn);background:var(--warnbg);font:inherit;font-size:1rem;cursor:pointer;padding:0 .9rem;float:right;margin:0 0 .3rem .5rem}
.tipbox{background:var(--warnbg);border:2px solid var(--warn);border-radius:.8rem;padding:.5rem .8rem;margin:.4rem 0}
.q{margin:.8rem 0 .2rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:.45rem;margin:.3rem 0}
.opt{min-height:48px;text-align:left;padding:.5rem .8rem;border:2px solid var(--line);background:#fff;border-radius:.8rem;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--pri);background:var(--pri2);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.tbl{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:1rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.4rem .3rem;text-align:left;vertical-align:middle}
.tbl.info th{background:#eef3f6}
.tbl.info td,.tbl.info th{border:1px solid var(--line);padding:.4rem .5rem}
.tbl td.c{text-align:center;white-space:nowrap}
.ch{min-width:48px;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:.7rem;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer;margin:2px}
.ch.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.sol{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
tr.rok td{background:var(--okbg)}tr.rno td{background:var(--badbg)}
.fb{border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0;font-size:1rem}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb.part{background:var(--warnbg);border:1px solid var(--warn)}
.sit{background:#eef3f6;border-left:5px solid var(--pri);border-radius:.5rem;padding:.5rem .8rem;margin:.5rem 0}
.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#23303a;color:#fff;padding:.6rem 1.1rem;border-radius:2rem;z-index:99;font-size:1rem;max-width:90%}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}
.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}
#set.open{display:block}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row2 label{font-weight:600;min-width:7rem}
.nowrap{white-space:nowrap}
#report{display:none}
@media (max-width:600px){main{padding-top:8.2rem}.card{padding:.8rem}h1{font-size:1.35rem}.tbl{font-size:.95rem}}
@media print{
 body{background:#fff;padding:0;font-size:11pt}
 #bar,#set,main,.toast,.dlg,.noprint{display:none!important}
 #report{display:block!important}
 #report h1{font-size:16pt}
 #report table{width:100%;border-collapse:collapse;font-size:10pt}
 #report td,#report th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

</style>
</head>

 paras:['Ein [[breites Sortiment]] hat viele verschiedene Warengruppen. Ein [[tiefes Sortiment]] hat eine große Auswahl innerhalb einer Warengruppe: Marken, Farben, Größen, Formen, Sorten, Preislagen. Ein [[schmales]] Sortiment hat wenige Warengruppen, ein [[flaches]] Sortiment hat kleine Auswahl.','Vorteil für den Kunden: Bei einem breiten Sortiment bekommt er vieles an einem Ort (spart Zeit). Bei einem tiefen Sortiment hat er große Auswahl und kann vergleichen.','Das [[Kernsortiment]] bringt den [[Hauptumsatz]] und prägt den Charakter des Geschäfts. Das [[Randsortiment]] sind Ergänzungsartikel, die das Kernsortiment abrunden. Das [[Saisonsortiment]] gibt es nur zu bestimmten Zeiten oder Anlässen.','Eine [[Eigenmarke]] (Handelsmarke) führt nur dieser Händler: Kundenbindung, Abgrenzung von Mitbewerbern, [[höhere Gewinnspanne]], besseres Image. Ein [[Markenartikel]] (Herstellermarke) gibt es in vielen Geschäften: gleichbleibende Qualität, hoher Bekanntheitsgrad durch Werbung, Wiedererkennung, rechtlich geschützt.'],

'can.0':['Phân biệt Sortiment (chủng loại hàng) rộng và sâu.','Distinguir un surtido ancho y uno profundo.','Distinguir um sortido largo e um profundo.','Розрізняти широкий і глибокий асортимент.','ሰፊሕን ዕምቆትን ሶርቲመንት ፍለይ።','Различать широкий и глубокий ассортимент.','التمييز بين تشكيلة واسعة وعميقة.','Geniş ve derin ürün çeşidini ayırt etmek.'],
'can.1':['Giải thích Kern-, Rand- und Saisonsortiment (hàng chính, hàng phụ, hàng theo mùa) và đặt Eigenmarke (nhãn riêng) đúng chỗ.','Explicar Kern-, Rand- y Saisonsortiment (surtido principal, complementario y de temporada) y colocar bien las Eigenmarken (marcas propias).','Explicar Kern-, Rand- e Saisonsortiment (sortido principal, complementar e sazonal) e colocar bem as Eigenmarken (marcas próprias).','Пояснювати Kern-, Rand- та Saisonsortiment (основний, додатковий і сезонний асортимент) і правильно розміщувати Eigenmarken (власні марки).','Kern-, Rand- ን Saisonsortiment ግለጽ ን Eigenmarken ብቅኑዕ ኣቐምጥ።','Объяснять Kern-, Rand- и Saisonsortiment (основной, дополнительный и сезонный ассортимент) и правильно размещать Eigenmarken (собственные марки).','شرح Kern- وRand- وSaisonsortiment (التشكيلة الأساسية والإضافية والموسمية) ووضع Eigenmarken (العلامات الخاصة) في مكانها.','Kern-, Rand- ve Saisonsortiment’i (ana, yan ve mevsimlik çeşit) açıklamak ve Eigenmarken’i (özel markalar) doğru yerleştirmek.'],
'a1.t':['Hãy nhớ Regalzonen (vùng kệ) ở Modul 8 và khái niệm Sortiment ở Lernfeld 1.','Recuerda las Regalzonen (zonas del estante) del Modul 8 y el concepto Sortiment del Lernfeld 1.','Lembra as Regalzonen (zonas da prateleira) do Modul 8 e o conceito Sortiment do Lernfeld 1.','Згадай Regalzonen (зони полиці) з Modul 8 і поняття Sortiment з Lernfeld 1.','Regalzonen ካብ Modul 8 ን Sortiment ካብ Lernfeld 1 ዘክር።','Вспомни Regalzonen (зоны стеллажа) из Modul 8 и понятие Sortiment из Lernfeld 1.','تذكّر Regalzonen (مناطق الرف) من Modul 8 ومفهوم Sortiment من Lernfeld 1.','Modul 8’deki Regalzonen’i (raf bölgeleri) ve Lernfeld 1’deki Sortiment kavramını hatırla.'],
'a1.e':['Xem lại Modul 8 (vùng kệ) và Lernfeld 1 (chủng loại hàng).','Repasa el Modul 8 (zonas del estante) y el Lernfeld 1 (surtido).','Revê o Modul 8 (zonas da prateleira) e o Lernfeld 1 (sortido).','Повтори Modul 8 (зони полиці) і Lernfeld 1 (асортимент).','Modul 8 (ዞናት መደርደሪ) ን Lernfeld 1 (ሶርቲመንት) ደጊምካ ርአ።','Повтори Modul 8 (зоны стеллажа) и Lernfeld 1 (ассортимент).','راجع Modul 8 (مناطق الرف) وLernfeld 1 (التشكيلة).','Modul 8’e (raf bölgeleri) ve Lernfeld 1’e (ürün çeşidi) tekrar bak.'],
'a1.1.q':['1.1 Mặt hàng có Gewinnspanne (tỷ suất lợi nhuận) cao thuộc vùng kệ nào?','1.1 ¿En qué Regalzone (zona del estante) van los artículos con alta Gewinnspanne (margen)?','1.1 Em que Regalzone (zona da prateleira) vão os artigos com alta Gewinnspanne (margem)?','1.1 У яку Regalzone (зону полиці) ставлять товари з високою Gewinnspanne (націнкою)?','1.1 ኣቕሑት ብላዕለዋይ Gewinnspanne ኣብ ኣየናይ Regalzone ይቕመጡ?','1.1 В какую Regalzone (зону стеллажа) ставят товары с высокой Gewinnspanne (наценкой)?','1.1 في أي Regalzone (منطقة رف) توضع السلع ذات Gewinnspanne (هامش الربح) العالي؟','1.1 Yüksek Gewinnspanne’li (kâr marjlı) ürünler hangi Regalzone’a (raf bölgesi) konur?'],
'a1.2.q':['1.2 Sortiment là gì?','1.2 ¿Qué es un Sortiment (surtido)?','1.2 O que é um Sortiment (sortido)?','1.2 Що таке Sortiment (асортимент)?','1.2 Sortiment እንታይ እዩ?','1.2 Что такое Sortiment (ассортимент)?','1.2 ما هو Sortiment (التشكيلة)؟','1.2 Sortiment (ürün çeşidi) nedir?'],
'a1.3.q':['1.3 Kể một ưu điểm của Eigenmarke (nhãn riêng) đối với người bán.','1.3 Nombra una ventaja de una Eigenmarke (marca propia) para el comerciante.','1.3 Nomeia uma vantagem de uma Eigenmarke (marca própria) para o comerciante.','1.3 Назви одну перевагу Eigenmarke (власної марки) для торговця.','1.3 ሓደ ረብሓ Eigenmarke ንነጋዳይ ጥቀስ።','1.3 Назови одно преимущество Eigenmarke (собственной марки) для торговца.','1.3 اذكر ميزة واحدة لـ Eigenmarke (العلامة الخاصة) للتاجر.','1.3 Eigenmarke’nin (özel marka) satıcı için bir avantajını söyle.'],
'a2.h':['Rộng hay sâu?','¿Ancho o profundo?','Largo ou profundo?','Широкий чи глибокий?','ሰፊሕ ወይ ዕምቆት?','Широкий или глубокий?','واسعة أم عميقة؟','Geniş mi derin mi?'],
'a2.i':['Quyết định với mỗi cửa hàng: Sortiment (chủng loại hàng) của nó rộng hay sâu?','Decide para cada tienda si su Sortiment (surtido) es ancho o profundo.','Decide para cada loja se o seu Sortiment (sortido) é largo ou profundo.','Вирішуй для кожного магазину: його Sortiment (асортимент) широкий чи глибокий?','ንነፍሲ ወከፍ ድኳን Sortiment ሰፊሕ ድዩ ዕምቆት ወስን።','Реши для каждого магазина: его Sortiment (ассортимент) широкий или глубокий?','قرّر لكل متجر إن كانت تشكيلته واسعة أم عميقة.','Her mağaza için Sortiment’inin (ürün çeşidi) geniş mi derin mi olduğuna karar ver.'],
'a2.t':['Rộng = nhiều nhóm hàng khác nhau. Sâu = nhiều lựa chọn trong một nhóm hàng.','Ancho = muchos grupos de mercancía distintos. Profundo = gran elección en un grupo.','Largo = muitos grupos de mercadoria diferentes. Profundo = grande escolha num grupo.','Широкий = багато різних груп товарів. Глибокий = великий вибір в одній групі.','ሰፊሕ = ብዙሕ ዝተፈላለዩ ጉጅለታት። ዕምቆት = ብዙሕ ምርጫ ኣብ ሓንቲ ጉጅለ።','Широкий = много разных групп товаров. Глубокий = большой выбор в одной группе.','واسعة = مجموعات بضائع كثيرة مختلفة. عميقة = خيارات كثيرة داخل مجموعة.','Geniş = çok farklı mal grubu. Derin = bir grupta büyük seçenek.'],
'a2.e':['Kaufhaus và Kiosk: nhiều nhóm hàng = rộng. Cửa hàng trà và giày chạy: nhiều lựa chọn trong một nhóm = sâu (và hẹp).','Kaufhaus y Kiosk: muchos grupos = ancho. Tienda de té y zapatillas: gran elección en un grupo = profundo (y estrecho).','Kaufhaus e Kiosk: muitos grupos = largo. Loja de chá e ténis: grande escolha num grupo = profundo (e estreito).','Kaufhaus і Kiosk: багато груп = широкий. Чайна крамниця й бігові кросівки: великий вибір в одній групі = глибокий (і вузький).','Kaufhaus ን Kiosk: ብዙሕ ጉጅለታት = ሰፊሕ። ድኳን ሻሂን ሳእኒ ሩጫን: ብዙሕ ምርጫ ኣብ ሓንቲ ጉጅለ = ዕምቆት።','Kaufhaus и Kiosk: много групп = широкий. Чайный магазин и беговые кроссовки: большой выбор в одной группе = глубокий (и узкий).','Kaufhaus وKiosk: مجموعات كثيرة = واسعة. متجر الشاي وأحذية الجري: خيارات كثيرة في مجموعة = عميقة (وضيقة).','Kaufhaus ve Kiosk: çok grup = geniş. Çay dükkânı ve koşu ayakkabısı: bir grupta çok seçenek = derin (ve dar).'],
'r1.h':['Đọc thêm: Sortiment (chủng loại hàng)','Para leer: el Sortiment (surtido)','Para ler: o Sortiment (sortido)','Для читання: Sortiment (асортимент)','ንምንባብ: Sortiment','Для чтения: Sortiment (ассортимент)','للقراءة: Sortiment (التشكيلة)','Okumak için: Sortiment (ürün çeşidi)'],
'r1.s':['Rộng = nhiều nhóm hàng. Sâu = nhiều lựa chọn trong một nhóm. Kernsortiment mang lại doanh thu chính.','Ancho = muchos grupos. Profundo = gran elección en un grupo. El Kernsortiment aporta la mayor parte de las ventas.','Largo = muitos grupos. Profundo = grande escolha num grupo. O Kernsortiment traz a maior parte das vendas.','Широкий = багато груп. Глибокий = великий вибір в одній групі. Kernsortiment приносить основний оборот.','ሰፊሕ = ብዙሕ ጉጅለታት። ዕምቆት = ብዙሕ ምርጫ ኣብ ሓንቲ ጉጅለ። Kernsortiment ዝበዝሐ ሽያጥ የምጽእ።','Широкий = много групп. Глубокий = большой выбор в одной группе. Kernsortiment приносит основной оборот.','واسعة = مجموعات كثيرة. عميقة = خيارات كثيرة في مجموعة. Kernsortiment يجلب معظم المبيعات.','Geniş = çok grup. Derin = bir grupta çok seçenek. Kernsortiment ana cirosunu getirir.'],
'r1.qq':['Kernsortiment mang lại điều gì?','¿Qué aporta el Kernsortiment?','O que traz o Kernsortiment?','Що приносить Kernsortiment?','Kernsortiment እንታይ የምጽእ?','Что приносит Kernsortiment?','ماذا يجلب Kernsortiment؟','Kernsortiment ne getirir?'],
'a3.i':['Đọc bài. Sau đó ghép đúng phần giải thích và ví dụ.','Lee la tarea. Luego relaciona bien las explicaciones y los ejemplos.','Lê a tarefa. Depois associa bem as explicações e os exemplos.','Прочитай завдання. Потім правильно добери пояснення й приклади.','ነቲ ዕማም ኣንብብ። ድሕሪኡ መግለጺታትን ኣብነታትን ብቅኑዕ ዛምድ።','Прочитай задание. Потом правильно сопоставь объяснения и примеры.','اقرأ المهمة. ثم طابق الشروح والأمثلة بشكل صحيح.','Görevi oku. Sonra açıklamaları ve örnekleri doğru eşleştir.'],
'a3.t':['Breite (rộng) = số nhóm hàng cạnh nhau. Tiefe (sâu) = lựa chọn trong một nhóm hàng.','Breite (ancho) = número de grupos uno junto a otro. Tiefe (profundo) = elección dentro de un grupo.','Breite (largo) = número de grupos lado a lado. Tiefe (profundo) = escolha dentro de um grupo.','Breite (широкий) = кількість груп поруч. Tiefe (глибокий) = вибір усередині однієї групи.','Breite = ብዝሒ ጉጅለታት። Tiefe = ምርጫ ኣብ ውሽጢ ሓንቲ ጉጅለ።','Breite (широкий) = число групп рядом. Tiefe (глубокий) = выбор внутри одной группы.','Breite (واسعة) = عدد المجموعات جنبًا إلى جنب. Tiefe (عميقة) = الاختيار داخل مجموعة.','Breite (geniş) = yan yana grup sayısı. Tiefe (derin) = bir grup içindeki seçenek.'],
'a3.e':['Ví dụ „rộng“ nêu nhiều nhóm hàng; ví dụ „sâu“ nêu các biến thể của một mặt hàng.','El ejemplo de «ancho» nombra varios grupos; el de «profundo» variantes de un artículo.','O exemplo de «largo» nomeia vários grupos; o de «profundo» variantes de um artigo.','Приклад «широкого» називає кілька груп; приклад «глибокого» — варіанти одного товару.','ኣብነት «ሰፊሕ» ብዙሕ ጉጅለታት ይጥቅስ፣ «ዕምቆት» ድማ ዝተፈላለዩ ዓይነታት ሓደ ኣቕሓ።','Пример «широкого» называет несколько групп; пример «глубокого» — варианты одного товара.','مثال «الواسعة» يذكر عدة مجموعات، ومثال «العميقة» يذكر أشكالًا لسلعة واحدة.','«Geniş» örneği birkaç grubu, «derin» örneği bir ürünün çeşitlerini söyler.'],
'a3.1.q':['3.1 Erläuterung (giải thích, mỗi ý 1 điểm)','3.1 Erläuterung (explicación, 1 punto cada una)','3.1 Erläuterung (explicação, 1 ponto cada)','3.1 Erläuterung (пояснення, по 1 балу)','3.1 Erläuterung (መግለጺ፣ ነፍሲ ወከፍ 1 ነጥቢ)','3.1 Erläuterung (объяснение, по 1 баллу)','3.1 Erläuterung (شرح، نقطة لكل واحد)','3.1 Erläuterung (açıklama, her biri 1 puan)'],
'a3.2.q':['3.2 Beispiel (ví dụ, mỗi ý 1 điểm)','3.2 Beispiel (ejemplo, 1 punto cada uno)','3.2 Beispiel (exemplo, 1 ponto cada)','3.2 Beispiel (приклад, по 1 балу)','3.2 Beispiel (ኣብነት፣ ነፍሲ ወከፍ 1 ነጥቢ)','3.2 Beispiel (пример, по 1 баллу)','3.2 Beispiel (مثال، نقطة لكل واحد)','3.2 Beispiel (örnek, her biri 1 puan)'],
'a4.h':['Bài tập có hướng dẫn: Hàng chính, phụ hay theo mùa?','Ejercicio guiado: ¿principal, complementario o de temporada?','Exercício guiado: principal, complementar ou sazonal?','Керована вправа: основний, додатковий чи сезонний?','ምምሕዳር ልምምድ: ኣርእስታዊ፣ ተወሳኺ ወይ ወቅታዊ?','Упражнение с подсказкой: основной, дополнительный или сезонный?','تمرين موجَّه: أساسي أم إضافي أم موسمي؟','Rehberli alıştırma: Ana, yan veya mevsimlik?'],
'a4.i':['Mặt hàng thuộc Kernsortiment, Randsortiment hay Saisonsortiment? Sau đó em điền sơ đồ phân cấp.','¿El artículo pertenece al Kernsortiment, Randsortiment o Saisonsortiment? Luego completas el esquema de niveles.','O artigo pertence ao Kernsortiment, Randsortiment ou Saisonsortiment? Depois completas o esquema de níveis.','Товар належить до Kernsortiment, Randsortiment чи Saisonsortiment? Потім заповнюєш схему рівнів.','ኣቕሓ ናይ Kernsortiment፣ Randsortiment ወይ Saisonsortiment ድዩ? ድሕሪኡ ነቲ መደባት ምላእ።','Товар относится к Kernsortiment, Randsortiment или Saisonsortiment? Потом заполняешь схему уровней.','هل تنتمي السلعة إلى Kernsortiment أم Randsortiment أم Saisonsortiment؟ ثم تُكمل مخطط المستويات.','Ürün Kernsortiment’e mi, Randsortiment’e mi yoksa Saisonsortiment’e mi ait? Sonra kademe şemasını doldur.'],
'a4.t':['Kern = doanh thu chính, đặc trưng cửa hàng. Rand = bổ sung. Saison = chỉ vào một số thời điểm.','Kern = ventas principales, carácter de la tienda. Rand = complemento. Saison = solo en ciertas épocas.','Kern = vendas principais, caráter da loja. Rand = complemento. Saison = só em certas épocas.','Kern = основний оборот, характер магазину. Rand = доповнення. Saison = лише в певні періоди.','Kern = ዝበዝሐ ሽያጥ፣ ባህሪ ድኳን። Rand = ተወሳኺ። Saison = ኣብ ዝተወሰነ ግዜ ጥራይ።','Kern = основной оборот, характер магазина. Rand = дополнение. Saison = только в определённое время.','Kern = المبيعات الرئيسية وطابع المتجر. Rand = إضافة. Saison = فقط في أوقات معينة.','Kern = ana ciro, mağazanın karakteri. Rand = ek. Saison = yalnız belirli zamanlarda.'],
'a4.e':['Brot, Milch, Butter, Jeans = Kern. Batterien, Regenschirme = Rand. Lebkuchen tháng 11 và Sonnencreme tháng 6 = Saison.','Pan, leche, mantequilla, vaqueros = Kern. Pilas, paraguas = Rand. Lebkuchen en noviembre y crema solar en junio = Saison.','Pão, leite, manteiga, jeans = Kern. Pilhas, guarda-chuvas = Rand. Lebkuchen em novembro e protetor solar em junho = Saison.','Хліб, молоко, масло, джинси = Kern. Батарейки, парасольки = Rand. Lebkuchen у листопаді й сонцезахисний крем у червні = Saison.','እንጀራ፣ ሓሊብ፣ ጠስሚ፣ ጅንስ = Kern። ባተሪ፣ ጥላ = Rand። Lebkuchen ኣብ ሕዳር ን ክሬም ጸሓይ ኣብ ሰነ = Saison።','Хлеб, молоко, масло, джинсы = Kern. Батарейки, зонты = Rand. Lebkuchen в ноябре и солнцезащитный крем в июне = Saison.','الخبز والحليب والزبدة والجينز = Kern. البطاريات والمظلات = Rand. Lebkuchen في نوفمبر وكريم الشمس في يونيو = Saison.','Ekmek, süt, tereyağı, kot = Kern. Pil, şemsiye = Rand. Kasımda Lebkuchen ve haziranda güneş kremi = Saison.'],
'a4.2.q':['4.2 Hoàn thành sơ đồ phân cấp bằng một ví dụ trong ngành của em: Sortimentsbereich – Warengruppe – Warenart – Artikel.','4.2 Completa el esquema con un ejemplo de tu sector: Sortimentsbereich – Warengruppe – Warenart – Artikel.','4.2 Completa o esquema com um exemplo do teu setor: Sortimentsbereich – Warengruppe – Warenart – Artikel.','4.2 Заповни схему прикладом зі своєї галузі: Sortimentsbereich – Warengruppe – Warenart – Artikel.','4.2 ነቲ መደባት ብኣብነት ካብ ዓውድካ ምላእ: Sortimentsbereich – Warengruppe – Warenart – Artikel።','4.2 Заполни схему примером из своей отрасли: Sortimentsbereich – Warengruppe – Warenart – Artikel.','4.2 أكمل المخطط بمثال من مجالك: Sortimentsbereich – Warengruppe – Warenart – Artikel.','4.2 Şemayı kendi sektöründen bir örnekle doldur: Sortimentsbereich – Warengruppe – Warenart – Artikel.'],
'a5.h':['Bài tập tự do: Đưa Sonnencreme vào Kernsortiment?','Ejercicio libre: ¿crema solar al Kernsortiment?','Exercício livre: protetor solar para o Kernsortiment?','Вільна вправа: сонцезахисний крем у Kernsortiment?','ናጻ ልምምድ: ክሬም ጸሓይ ናብ Kernsortiment?','Свободное упражнение: солнцезащитный крем в Kernsortiment?','تمرين حر: كريم الشمس إلى Kernsortiment؟','Serbest alıştırma: Güneş kremi Kernsortiment’e mi?'],
'a5.i':['Một thành viên đề xuất chuyển Sonnencreme (kem chống nắng) từ Saisonsortiment sang Kernsortiment.','Un miembro propone pasar la Sonnencreme (crema solar) del Saisonsortiment al Kernsortiment.','Um membro propõe passar a Sonnencreme (protetor solar) do Saisonsortiment para o Kernsortiment.','Член команди пропонує перенести Sonnencreme (сонцезахисний крем) із Saisonsortiment до Kernsortiment.','ሓደ ኣባል ክሬም ጸሓይ (Sonnencreme) ካብ Saisonsortiment ናብ Kernsortiment ከሰግር ይሓስብ።','Член команды предлагает перенести Sonnencreme (солнцезащитный крем) из Saisonsortiment в Kernsortiment.','يقترح أحد الأعضاء نقل Sonnencreme (كريم الشمس) من Saisonsortiment إلى Kernsortiment.','Bir ekip üyesi Sonnencreme’i (güneş kremi) Saisonsortiment’ten Kernsortiment’e almayı öneriyor.'],
'a5.t':['5.1: Khi nào hàng theo mùa được bán? 5.2: Ai hỏi mua những hàng này cả ngoài mùa?','5.1: ¿Cuándo se ofrece la mercancía de temporada? 5.2: ¿Quién pide estos artículos también fuera de temporada?','5.1: Quando se oferece a mercadoria sazonal? 5.2: Quem pede estes artigos também fora da época?','5.1: Коли пропонують сезонний товар? 5.2: Хто питає ці товари й поза сезоном?','5.1: ወቅታዊ ኣቕሑት መዓስ ይቐርቡ? 5.2: መን እዞም ኣቕሑት ኣብ ወቅቲ ደጊም ይሓትት?','5.1: Когда предлагают сезонный товар? 5.2: Кто спрашивает эти товары и вне сезона?','5.1: متى تُعرض البضاعة الموسمية؟ 5.2: من يطلب هذه السلع خارج الموسم أيضًا؟','5.1: Mevsimlik mal ne zaman sunulur? 5.2: Bu ürünleri sezon dışında da kim ister?'],
'a5.e':['Hàng theo mùa chỉ có vào một số dịp. Chuyển sang Kernsortiment có lý khi khách mua quanh năm.','La mercancía de temporada solo se ofrece en ciertas ocasiones. El cambio compensa si los clientes la compran todo el año.','A mercadoria sazonal só se oferece em certas ocasiões. A mudança compensa se os clientes a compram o ano todo.','Сезонний товар є лише з нагоди. Перенесення виправдане, якщо клієнти купують його цілий рік.','ወቅታዊ ኣቕሑት ኣብ ዝተወሰኑ ኣጋጣሚታት ጥራይ። ምቕያር ዓሚላት ዓመት ጠንከር ምስ ዝገዝኡ ይሕይሽ።','Сезонный товар есть только по поводу. Перенос оправдан, если клиенты покупают его круглый год.','البضاعة الموسمية تُعرض في مناسبات محددة. النقل يستحق إذا اشتراها الزبائن طوال السنة.','Mevsimlik mal yalnız belirli zamanlarda sunulur. Müşteriler yıl boyu alıyorsa taşımak mantıklıdır.'],
'a5.1.q':['5.1 Giải thích một đặc điểm của Saisonsortiment! (2 điểm)','5.1 ¡Explique una característica del Saisonsortiment! (2 puntos)','5.1 Explique uma característica do Saisonsortiment! (2 pontos)','5.1 Поясніть одну ознаку Saisonsortiment! (2 бали)','5.1 ሓደ ባህሪ ናይ Saisonsortiment ግለጽ! (2 ነጥቢ)','5.1 Объясните один признак Saisonsortiment! (2 балла)','5.1 اشرح خاصية واحدة لـ Saisonsortiment! (نقطتان)','5.1 Saisonsortiment’in bir özelliğini açıkla! (2 puan)'],
'a5.2.q':['5.2 Lý do chung nào ủng hộ việc „chuyển“ như vậy? Giải thích! (2 điểm)','5.2 ¿Qué motivo general apoya ese «traslado»? ¡Explique! (2 puntos)','5.2 Que motivo geral apoia essa «transferência»? Explique! (2 pontos)','5.2 Яка загальна причина підтримує таке «перенесення»? Поясніть! (2 бали)','5.2 ኣየናይ ሓፈሻዊ ምኽንያት ነዚ «ምስግጋር» ይድግፍ? ግለጽ! (2 ነጥቢ)','5.2 Какая общая причина говорит в пользу такого «переноса»? Объясните! (2 балла)','5.2 ما السبب العام الذي يدعم هذا «النقل»؟ اشرح! (نقطتان)','5.2 Böyle bir «kaydırma» lehine genel neden nedir? Açıkla! (2 puan)'],
'a6.t':['Erklären (giải thích) = câu đầy đủ. Nennen (kể tên) = từ khóa. Mỗi đặc điểm cần một lời giải thích ngắn.','Erklären (explicar) = frases completas. Nennen (nombrar) = palabras clave. Cada rasgo necesita una explicación breve.','Erklären (explicar) = frases completas. Nennen (nomear) = palavras-chave. Cada característica precisa de uma explicação curta.','Erklären (пояснити) = повні речення. Nennen (назвати) = ключові слова. Кожна ознака потребує короткого пояснення.','Erklären = ምሉእ ሓረጋት። Nennen = ቃላት። ነፍሲ ወከፍ ባህሪ ሓጺር መግለጺ የድልዮ።','Erklären (объяснить) = полные предложения. Nennen (назвать) = ключевые слова. Каждому признаку нужно короткое объяснение.','Erklären (اشرح) = جمل كاملة. Nennen (اذكر) = كلمات مفتاحية. كل خاصية تحتاج شرحًا قصيرًا.','Erklären (açıkla) = tam cümleler. Nennen (say) = anahtar kelimeler. Her özellik kısa bir açıklama ister.'],
'a6.e':['Với „erklären“, mỗi khái niệm cần một đặc điểm kèm giải thích.','En «erklären», cada concepto necesita un rasgo con explicación.','Em «erklären», cada conceito precisa de uma característica com explicação.','При «erklären» до кожного поняття потрібна ознака з поясненням.','ኣብ «erklären» ነፍሲ ወከፍ ቃል ባህሪ ምስ መግለጺ የድልዮ።','При «erklären» к каждому понятию нужен признак с объяснением.','في «erklären» يحتاج كل مفهوم إلى خاصية مع شرح.','«erklären»’de her kavram için açıklamalı bir özellik gerekir.'],
'a6.1.q':['6.1 Ghép phần giải thích với từng khái niệm!','6.1 ¡Relacione las explicaciones con los conceptos!','6.1 Associe as explicações aos conceitos!','6.1 Зіставте пояснення з поняттями!','6.1 መግለጺታት ምስ ቃላት ዛምድ!','6.1 Сопоставьте объяснения с понятиями!','6.1 طابق الشروح مع المفاهيم!','6.1 Açıklamaları kavramlarla eşleştir!'],
'a6.2.q':['6.2 Muốn đưa thêm Eigenmarken (nhãn riêng) vào Kernsortiment. Kể 3 ưu điểm của Eigenmarken cho Warenhaus Seeblick GmbH! (3 điểm)','6.2 Se quieren incluir más Eigenmarken (marcas propias) en el Kernsortiment. ¡Nombre 3 ventajas para el Warenhaus Seeblick GmbH! (3 puntos)','6.2 Querem incluir mais Eigenmarken (marcas próprias) no Kernsortiment. Nomeie 3 vantagens para o Warenhaus Seeblick GmbH! (3 pontos)','6.2 До Kernsortiment хочуть додати більше Eigenmarken (власних марок). Назвіть 3 переваги для Warenhaus Seeblick GmbH! (3 бали)','6.2 ብዙሕ Eigenmarken ናብ Kernsortiment ክኣትዉ ይደልዩ። ሰለስተ ረብሓታት ንWarenhaus Seeblick GmbH ጥቀስ! (3 ነጥቢ)','6.2 В Kernsortiment хотят включить больше Eigenmarken (собственных марок). Назовите 3 преимущества для Warenhaus Seeblick GmbH! (3 балла)','6.2 يُراد إدخال المزيد من Eigenmarken (العلامات الخاصة) في Kernsortiment. اذكر 3 مزايا لـ Warenhaus Seeblick GmbH! (3 نقاط)','6.2 Kernsortiment’e daha çok Eigenmarken (özel marka) alınacak. Warenhaus Seeblick GmbH için 3 avantaj say! (3 puan)'],
'a6.3.q':['6.3 Ở một số nhóm hàng sẽ bán thêm Markenartikel (hàng thương hiệu). Giải thích 2 đặc điểm của Markenartikel! (4 điểm)','6.3 En algunos grupos se ofrecerán más Markenartikel (artículos de marca). ¡Explique 2 rasgos! (4 puntos)','6.3 Em alguns grupos serão oferecidos mais Markenartikel (artigos de marca). Explique 2 características! (4 pontos)','6.3 У деяких групах пропонуватимуть більше Markenartikel (брендових товарів). Поясніть 2 ознаки! (4 бали)','6.3 ኣብ ገለ ጉጅለታት ብዙሕ Markenartikel ይቐርቡ። ክልተ ባህሪታት ግለጽ! (4 ነጥቢ)','6.3 В некоторых группах будут предлагать больше Markenartikel (брендовых товаров). Объясните 2 признака! (4 балла)','6.3 في بعض المجموعات ستُعرض Markenartikel (سلع ماركة) أكثر. اشرح خاصيتين! (4 نقاط)','6.3 Bazı gruplarda daha çok Markenartikel (marka ürün) sunulacak. 2 özelliğini açıkla! (4 puan)'],
'a7.t':['7.1: Discounter được gì, tốn gì? 7.2: Nhà sản xuất tiết kiệm ở đâu với nhãn riêng?','7.1: ¿Qué gana el Discounter y qué le cuesta? 7.2: ¿Dónde ahorra el fabricante con las marcas propias?','7.1: O que ganha o Discounter e o que lhe custa? 7.2: Onde poupa o fabricante com as marcas próprias?','7.1: Що виграє дискаунтер і що це коштує? 7.2: На чому економить виробник у випадку власних марок?','7.1: Discounter እንታይ ይረክብ፣ እንታይ ይኽልፍ? 7.2: ኣምራቒ ብ Eigenmarken ኣበይ የቑርብ?','7.1: Что выигрывает дискаунтер и что это стоит? 7.2: На чём экономит производитель при собственных марках?','7.1: ماذا يكسب الـ Discounter وماذا يكلّفه؟ 7.2: أين يوفّر المصنّع مع العلامات الخاصة؟','7.1: Discounter ne kazanır, neye mal olur? 7.2: Üretici özel markada nereden tasarruf eder?'],
'a7.e':['Một nhận định tốt nêu cơ hội và rủi ro. Trong bán hàng không được nói điều sai sự thật.','Un buen juicio nombra oportunidades y riesgos. En la venta no se debe afirmar nada falso.','Um bom juízo nomeia oportunidades e riscos. Na venda não se deve afirmar nada falso.','Хороша оцінка називає можливості й ризики. У продажу не можна стверджувати неправди.','ጽቡቕ ፍርዲ ዕድላትን ሓደጋታትን ይጥቅስ። ኣብ ሽያጥ ሓሶት ኣይትበል።','Хорошая оценка называет возможности и риски. В продаже нельзя утверждать неправду.','الحكم الجيد يذكر الفرص والمخاطر. في البيع لا يجوز ادّعاء ما هو غير صحيح.','İyi bir değerlendirme fırsatları ve riskleri söyler. Satışta yalan söylenmez.'],
'a7.1.q':['7.1 Một Discounter muốn mở rộng và đào sâu mạnh Sortiment. Đánh giá chiến lược này: được gì, rủi ro gì (chi phí, kho, hình ảnh, sự rõ ràng)?','7.1 Un Discounter quiere ampliar y profundizar mucho su Sortiment. Valora la estrategia: ¿qué gana y qué arriesga (costes, almacén, imagen, claridad)?','7.1 Um Discounter quer alargar e aprofundar muito o seu Sortiment. Avalia a estratégia: o que ganha e o que arrisca (custos, armazém, imagem, clareza)?','7.1 Discounter хоче значно розширити й поглибити свій Sortiment. Оціни цю стратегію: що виграє, чим ризикує (витрати, склад, імідж, оглядність)?','7.1 ሓደ Discounter ሶርቲመንቱ ብዙሕ ክሰፍሕን ከዕምቅን ይደሊ። እዚ ስትራተጂ ገምግም: እንታይ ይረክብ፣ እንታይ የሰጋእ (ወጻኢ፣ መኽዘን፣ ምስሊ፣ ንጽህና)?','7.1 Discounter хочет сильно расширить и углубить свой Sortiment. Оцени стратегию: что он выигрывает, чем рискует (расходы, склад, имидж, обозримость)?','7.1 يريد Discounter توسيع تشكيلته وتعميقها كثيرًا. قيّم هذه الاستراتيجية: ماذا يكسب وماذا يخاطر (تكاليف، مخزن، صورة، وضوح)؟','7.1 Bir Discounter ürün çeşidini belirgin biçimde genişletmek ve derinleştirmek istiyor. Bu stratejiyi değerlendir: Ne kazanır, neyi riske eder (maliyet, depo, imaj, düzen)?'],
'a7.2.q':['7.2 Eigenmarken thường do cùng nhà sản xuất làm ra như Markenartikel. Giải thích vì sao vẫn có thể rẻ hơn và cách dùng hiểu biết này khi bán hàng – mà không nói điều sai sự thật.','7.2 Las Eigenmarken suelen fabricarse por el mismo fabricante que los Markenartikel. Explica por qué pueden ser más baratas y cómo usar ese saber en la venta, sin afirmaciones falsas.','7.2 As Eigenmarken são muitas vezes produzidas pelo mesmo fabricante que os Markenartikel. Explica porque podem ser mais baratas e como usar esse saber na venda, sem afirmações falsas.','7.2 Eigenmarken часто виробляє той самий виробник, що й Markenartikel. Поясни, чому вони можуть бути дешевшими й як використати це знання в розмові з клієнтом — без неправдивих тверджень.','7.2 Eigenmarken ብዙሕ ግዜ ብሓደ ኣምራቒ ከም Markenartikel ይፍጠሩ። ስለምንታይ ርካሽ ክኾኑ ከም ዝኽእሉን እዚ ፍልጠት ኣብ ዘረባ ሽያጥ ከመይ ክጥቀም ከም ዝኽእልን ብዘይ ሓሶት ግለጽ።','7.2 Eigenmarken часто производит тот же производитель, что и Markenartikel. Объясни, почему они могут быть дешевле и как использовать это знание в разговоре — без неправдивых утверждений.','7.2 غالبًا ينتج المصنّع نفسه Eigenmarken وMarkenartikel. اشرح لماذا قد تكون أرخص وكيف تستخدم هذه المعرفة في حديث البيع دون ادّعاءات كاذبة.','7.2 Eigenmarken çoğu zaman Markenartikel ile aynı üretici tarafından üretilir. Neden daha ucuz olabileceğini ve bu bilgiyi satış görüşmesinde yalan söylemeden nasıl kullanacağını açıkla.'],
'v1.1.q':['V1 Tại sao ví dụ cho „sortiment rộng“ nêu nhiều nhóm hàng còn ví dụ cho „sortiment sâu“ nêu các biến thể của một mặt hàng?','V1 ¿Por qué en el ejemplo de «surtido ancho» se nombran varios grupos y en el de «profundo» variantes de un artículo?','V1 Porque é que no exemplo de «sortido largo» se nomeiam vários grupos e no de «profundo» variantes de um artigo?','V1 Чому в прикладі «широкого асортименту» називають кілька груп, а в «глибокого» — варіанти одного товару?','V1 ስለምንታይ ኣብ ኣብነት «ሰፊሕ ሶርቲመንት» ብዙሕ ጉጅለታት፣ ኣብ «ዕምቆት» ድማ ዓይነታት ሓደ ኣቕሓ ይጥቀሱ?','V1 Почему в примере «широкого ассортимента» называют несколько групп, а в «глубокого» — варианты одного товара?','V1 لماذا يُذكر في مثال «التشكيلة الواسعة» عدة مجموعات وفي «العميقة» أشكال سلعة واحدة؟','V1 «Geniş çeşit» örneğinde neden birkaç grup, «derin çeşit» örneğinde neden bir ürünün çeşitleri söylenir?'],
'v1.2.q':['V2 Giải thích: Tại sao Eigenmarken có thể có Gewinnspanne (tỷ suất lợi nhuận) cao hơn Markenartikel?','V2 Justifica: ¿por qué las Eigenmarken pueden tener mayor Gewinnspanne (margen) que los Markenartikel?','V2 Justifica: porque é que as Eigenmarken podem ter maior Gewinnspanne (margem) do que os Markenartikel?','V2 Обґрунтуй: чому Eigenmarken можуть мати вищу Gewinnspanne (націнку), ніж Markenartikel?','V2 ኣረጋግጽ: ስለምንታይ Eigenmarken ካብ Markenartikel ዝለዓለ Gewinnspanne ክህልወን ይኽእል?','V2 Обоснуй: почему Eigenmarken могут иметь более высокую Gewinnspanne (наценку), чем Markenartikel?','V2 علّل: لماذا قد يكون لـ Eigenmarken هامش ربح (Gewinnspanne) أعلى من Markenartikel؟','V2 Gerekçelendir: Eigenmarken neden Markenartikel’den daha yüksek Gewinnspanne’ya (kâr marjı) sahip olabilir?']
};

function answered(it){
 var v=A(it.id);
 switch(it.t){
 case 'free':return !!(v&&v.t&&v.t.trim());
 case 'mc':return v!=null;
 case 'calc':return !!(v&&String(v).trim());

 }return false}

function updProg(){var u=units();var d=u.filter(function(x){return x.done}).length;var p=u.length?Math.round(100*d/u.length):0;var f=document.getElementById('progf');if(f){f.style.width=p+'%';document.getElementById('progt').textContent=U('progress')+': '+d+' / '+u.length+' '+U('done')+' ('+p+' %)'}
 var q=p===100&&!S.pdone;if(q){S.pdone=1;toast('🎉 100 %')}}
/* Bewertung */
function num(s){var t=String(s).replace(/\s/g,'').replace(/€|%|cm|g|kg|ml|l|m/gi,'');if(t.indexOf(',')>=0&&t.indexOf('.')>=0)t=t.replace(/\./g,'');t=t.replace(',','.');var x=parseFloat(t);return isNaN(x)?null:x}
function grade(it){
 var v=A(it.id),got=0,max=0,rows=[];
 switch(it.t){
 case 'free':max=it.pts||1;var s=v&&v.s!=null?v.s:null;got=s==null?0:[0,.5,1][s]*max;break;

 case 'table':case 'sel':it.rows.forEach(function(r,i){max++;var ok=v&&v[i]===r[1];if(ok)got++;rows.push(ok)});break;
 case 'tf':it.rows.forEach(function(r,i){max++;var ok=v&&v[i]===r[1];if(ok)got++;rows.push(ok)});break;
 case 'gap':it.a.forEach(function(a,i){max++;var ok=v&&v[i]===a;if(ok)got++;rows.push(ok)});break}
 return {got:got,max:max,rows:rows}}

function fbBox(kind,html){return '<div class="fb '+kind+'">'+html+'</div>'}
function showFb(b){return S.chk[b.id]||S.sub}

 var v=A(it.id),fb=showFb(b),h='',g,q=it.q?'<div class="q">'+esc(it.q)+'</div>'+(it.nq?'':tl(it.qk||it.id+'.q')):'';
 switch(it.t){

 case 'free':
  v=v||{};h=q+'<textarea class="in" rows="4" data-act="txt" data-id="'+it.id+'" placeholder="…">'+esc(v.t||'')+'</textarea>';
  h+='<div class="noprint"><button class="btn sec" data-act="sol" data-id="'+it.id+'">'+B('sol')+'</button></div>';
  if(S.sol[it.id]||fb&&v.t){h+='<div class="model"><b>'+esc(UI.model[0])+'</b>'+it.model+'</div>';
   h+='<div class="q">'+esc(UI.selfq[0])+'</div>'+tl_ui('selfq')+'<div class="row2">'+[['selfyes',2],['selfpart',1],['selfno',0]].map(function(p){return '<button class="btn gray" style="'+(v.s===p[1]&&v.s!=null?'background:#e3f0f6;border-color:#2f6f8f':'')+'" data-act="self" data-id="'+it.id+'" data-i="'+p[1]+'">'+B(p[0])+'</button>'}).join('')+'</div>'}
  break;
 case 'mc':
  g=grade(it);h=q+opts(it.o,v,fb?function(i){return i===it.a?'ok':(v===i?'no':'')}:null,'mc',it.id);
  if(fb)h+=fbBox(g.got?'ok':'no',g.got?esc(U('right')):esc(U('wrong'))+' '+esc(UI.correctis[0])+' <b>'+esc(it.o[it.a])+'</b>');
  break;
 case 'calc':
  g=grade(it);h=q+'<div class="row2"><input class="in" style="max-width:12rem" inputmode="decimal" autocomplete="off" data-act="calc" data-id="'+it.id+'" value="'+esc(v||'')+'"><b>'+esc(it.unit||'')+'</b></div>';
  if(fb){h+=fbBox(g.got?'ok':'no',(g.got?esc(U('right')):esc(U('wrong'))+' '+esc(UI.correctis[0])+' <b>'+r1(it.a)+' '+esc(it.unit||'')+'</b>')+'<div><b>'+esc(UI.steps[0])+':</b><br>'+it.steps.map(esc).join('<br>')+'</div>'+tl_ui('steps'))}

 case 'table':
  g=grade(it);h=q+'<table class="tbl"><tr><th>'+(it.hd||'')+'</th>'+it.cols.map(function(c){return '<th class="c" title="'+esc(c[1]||'')+'">'+esc(c[0])+'</th>'}).join('')+'</tr>'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+'</td>'+it.cols.map(function(c,j){var cl=sel===j?' on':'';if(fb){if(j===r[1])cl+=sel===j?' ok':' sol';else if(sel===j)cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tb" data-id="'+it.id+'" data-r="'+i+'" data-i="'+j+'" aria-label="'+esc(c[1]||c[0])+'">'+esc(c[0])+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';

 case 'tf':
  g=grade(it);h=q+'<table class="tbl">'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+'</td>'+[[true,'✔'],[false,'✘']].map(function(c){var cl=sel===c[0]?' on':'';if(fb){if(c[0]===r[1])cl+=sel===c[0]?' ok':' sol';else if(sel===c[0])cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tf" data-id="'+it.id+'" data-r="'+i+'" data-i="'+(c[0]?1:0)+'">'+c[1]+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'sel':
  g=grade(it);h=q+'<table class="tbl">'+it.rows.map(function(r,i){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';
   return '<tr><td>'+esc(r[0])+'</td><td><select class="in gapsel'+cl+'" data-act="sel" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.o.map(function(o,j){return '<option value="'+j+'"'+(sel===j?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'+(fb&&!g.rows[i]?'<div class="meta">'+esc(UI.correctis[0])+' <b>'+esc(it.o[r[1]])+'</b></div>':'')+'</td></tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'gap':
  g=grade(it);var k=0;h=q+'<div class="gaptxt">'+it.text.split('___').map(function(p,i,arr){var s=esc(p);if(i<arr.length-1){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';s+='<select class="gapsel'+cl+'" data-act="gap" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.bank.map(function(o){return '<option'+(sel===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}return s}).join('')+'</div>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max+(g.got<g.max?' — '+esc(UI.correctis[0])+' <b>'+it.a.map(esc).join(' · ')+'</b>':''));
  break}
 if(fb&&it.ex&&it.t!=='free')h+='<div class="meta">'+esc(it.ex)+'</div>'+tl(it.id+'.e');
 return '<div class="item">'+h+'</div>'}
function tl_ui(k){if(S.lang==='de')return '';return '<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U(k))+'</div>'}
function renderEst(it){var v=A(it.id)||{};var t=totals();return '<div class="row2"><label>'+B('estl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="e" value="'+esc(v.e||'')+'"></div><div class="row2"><label>'+B('resl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="r" value="'+esc(v.r||'')+'"></div>'+(v.e&&v.r?'<div class="meta">'+esc(UI.diff[0])+': '+(Number(v.r)-Number(v.e))+'</div>':'')}
function renderRead(b){
 var mk=S.mk[b.id]||[],done=S.chk[b.id],idx=0,tot=0,hit=0,wrong=0;
 var paras=b.paras.map(function(p){return '<p>'+p.replace(/\[\[(.+?)\]\]([.,;:!?)]*)|\{\{(.+?)\}\}([.,;:!?)]*)|([^\s\[\{]+)/g,function(m,a,pa,d,pd,w){var i=idx++,sel=mk.indexOf(i)>=0,cl='';var good=a!=null;if(good)tot++;
   if(done){if(sel&&good){cl=' ok';hit++}else if(sel){cl=' no';wrong++}else if(good)cl=' miss'}else if(sel)cl=' on';
   return '<span class="w'+cl+'" data-act="mk" data-id="'+b.id+'" data-i="'+i+'">'+esc(a||d||w)+'</span>'+esc(pa||pd||'')+' '})+'</p>'}).join('');
 var h='<div class="card read"><h2>📖 '+esc(b.h)+'</h2>'+tl(b.hk||b.id+'.h')+'<div class="meta">'+esc(U('readhint'))+'</div>'+(b.sum?'<div class="meta"><b>→ </b>'+esc(b.sum)+'</div>'+tl(b.id+'.s'):'')+paras;
 if(b.html)h+=b.html;
 h+='<button class="btn" data-act="mkchk" data-id="'+b.id+'">'+B('mark')+'</button>';
 if(done){var all=b.paras.join(' ').match(/\[\[.+?\]\]/g)||[];h+=fbBox(wrong===0&&hit===all.length?'ok':'part','✔ '+hit+' / '+all.length+' '+esc(U('found'))+(wrong?' · ✘ '+wrong+' '+esc(U('toomany')):'')+(hit<all.length?'<br>'+esc(U('missed')):''))}
 if(b.q){var v=A(b.id+'.q');h+='<div class="q">'+esc(b.q.q)+'</div>'+tl(b.id+'.qq')+opts(b.q.o,v,(done&&v!=null)?function(i){return i===b.q.a?'ok':(v===i?'no':'')}:null,'mc',b.id+'.q')}
 return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});
 return h}
function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';
 SHEET.blocks.forEach(function(b){if(b.k==='read')h+=renderRead(b);else if(vis(b))h+=renderTask(b)});
 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';
 if(S.sub)h+=renderResult();
 document.getElementById('app').innerHTML=h;
 document.getElementById('report').innerHTML=renderReport();
 renderBar();updProg();pad();
 window.scrollTo(0,y)}
function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');
 document.documentElement.lang=S.lang;
 }

window.addEventListener('resize',pad);
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function dialog(msgKey,onYes){var d=document.createElement('div');d.className='dlg';d.innerHTML='<div><p><b>'+esc(UI[msgKey][0])+'</b></p>'+(S.lang!=='de'?'<p>'+esc(U(msgKey))+'</p>':'')+'<button class="btn" data-d="y">'+B('yes')+'</button><button class="btn gray" data-d="n">'+B('cancel')+'</button></div>';d.addEventListener('click',function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-d');if(!x&&e.target!==d&&!e.target.closest('[data-d]'))return;var dd=e.target.closest('[data-d]');if(dd&&dd.getAttribute('data-d')==='y')onYes();d.remove()});document.body.appendChild(d)}
function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});
document.getElementById('gear').addEventListener('click',function(){S.open=!S.open;save();renderBar()});
document.addEventListener('change',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act');if(act==='gap'||act==='sel'){var arr=S.a[el.getAttribute('data-id')]||[];var v=el.value;arr[Number(el.getAttribute('data-r'))]=act==='sel'?(v===''?null:Number(v)):(v===''?null:v);S.a[el.getAttribute('data-id')]=arr;save();updProg()}});
document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
document.addEventListener('visibilitychange',saveNow);window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',function(){document.getElementById('report').innerHTML=renderReport()});
/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;

if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};

})();
