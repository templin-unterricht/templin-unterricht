<style>

<script>
const SHEET={"id":"M1","short":"LF 5 · Modul 1","title":"Modul 1 – Werbung und Werbearten","sub":"Lernfeld 5 · Werben und den Verkauf fördern","can":[{"de":"Ich kann erklären, was Werbung ist, und das Ziel der Werbung aus Sicht des Betriebs und aus Sicht des Kunden nennen.","vi":"Em có thể giải thích Werbung (quảng cáo) là gì và nêu mục tiêu của quảng cáo từ góc nhìn của cửa hàng và của khách hàng.","tr":"Werbung (reklam) nedir açıklayabilirim ve reklamın amacını işletmenin ve müşterinin bakış açısından söyleyebilirim.","ar":"أستطيع أن أشرح ما هو الإعلان (Werbung) وأن أذكر هدف الإعلان من وجهة نظر المحل ومن وجهة نظر الزبون.","ti":"ወርቡንግ (Werbung፣ ምስላ/ሓቕታ ንግዲ) እንታይ ከምዝኾነ ክገልጽ እኽእል ኢየ፣ ዕላማ ወርቡንግ ድማ ካብ ኣተሓሳስባ ትካልን ካብ ኣተሓሳስባ ዓሚልን ክሕብር እኽእል ኢየ።","uk":"Я можу пояснити, що таке Werbung (реклама), і назвати мету реклами з погляду магазину та з погляду клієнта.","ru":"Я могу объяснить, что такое Werbung (реклама), и назвать цель рекламы с точки зрения магазина и с точки зрения клиента.","es":"Puedo explicar qué es la Werbung (publicidad) y decir el objetivo de la publicidad desde el punto de vista de la tienda y del cliente.","pt":"Sei explicar o que é Werbung (publicidade) e indicar o objetivo da publicidade do ponto de vista da loja e do cliente."},{"de":"Ich kann die neun Werbearten erklären und zu jeder ein Beispiel finden.","vi":"Em có thể giải thích chín Werbearten (loại quảng cáo) và tìm ví dụ cho mỗi loại.","tr":"Dokuz Werbeart'ı (reklam türü) açıklayabilirim ve her biri için bir örnek bulabilirim.","ar":"أستطيع أن أشرح أنواع الإعلان التسعة (Werbearten) وأن أجد مثالًا لكل نوع.","ti":"ሽዱሽተ ዓይነታት ወርቡንግ (Werbearten) ክገልጽ እኽእል ኢየ፣ ንነፍስ ወከፍ ድማ ኣብነት ክረክብ እኽእል ኢየ።","uk":"Я можу пояснити дев'ять Werbearten (видів реклами) і знайти приклад до кожного.","ru":"Я могу объяснить девять Werbearten (видов рекламы) и найти пример к каждому.","es":"Puedo explicar las nueve Werbearten (tipos de publicidad) y encontrar un ejemplo para cada una.","pt":"Sei explicar as nove Werbearten (tipos de publicidade) e encontrar um exemplo para cada uma."},{"de":"Ich kann den Unterschied zwischen Direktwerbung und Massenwerbung nennen.","vi":"Em có thể nêu sự khác nhau giữa Direktwerbung (quảng cáo trực tiếp) và Massenwerbung (quảng cáo đại chúng).","tr":"Direktwerbung (doğrudan reklam) ile Massenwerbung (kitle reklamı) arasındaki farkı söyleyebilirim.","ar":"أستطيع أن أذكر الفرق بين الإعلان المباشر (Direktwerbung) والإعلان الجماهيري (Massenwerbung).","ti":"ኣብ መንጎ Direktwerbung (ቀጥታዊ መበገሲ ምስላ) ከምኡውን Massenwerbung (ሓፈሻዊ ምስላ) ዘሎ ፍልልይ ክሕብር እኽእል ኢየ።","uk":"Я можу назвати різницю між Direktwerbung (прямою рекламою) і Massenwerbung (масовою рекламою).","ru":"Я могу назвать разницу между Direktwerbung (прямой рекламой) и Massenwerbung (массовой рекламой).","es":"Puedo decir la diferencia entre Direktwerbung (publicidad directa) y Massenwerbung (publicidad masiva).","pt":"Sei indicar a diferença entre Direktwerbung (publicidade direta) e Massenwerbung (publicidade de massas)."},{"de":"Ich kann Alleinwerbung, Gemeinschaftswerbung und Sammelwerbung unterscheiden.","vi":"Em có thể phân biệt Alleinwerbung, Gemeinschaftswerbung và Sammelwerbung.","tr":"Alleinwerbung, Gemeinschaftswerbung ve Sammelwerbung arasındaki farkı ayırt edebilirim.","ar":"أستطيع أن أميّز بين Alleinwerbung (إعلان منفرد) وGemeinschaftswerbung (إعلان مشترك) وSammelwerbung (إعلان جماعي).","ti":"Alleinwerbung፣ Gemeinschaftswerbung ከምኡውን Sammelwerbung ክፈላልይ እኽእል ኢየ።","uk":"Я можу розрізняти Alleinwerbung, Gemeinschaftswerbung і Sammelwerbung.","ru":"Я могу различать Alleinwerbung, Gemeinschaftswerbung и Sammelwerbung.","es":"Puedo distinguir Alleinwerbung, Gemeinschaftswerbung y Sammelwerbung.","pt":"Sei distinguir Alleinwerbung, Gemeinschaftswerbung e Sammelwerbung."}],"items":[{"id":"a1","no":"Aufgabe 1","type":"free","pts":1,"title":"Ankommen: Was weißt du noch?","instr":{"de":"Beantworte die Fragen aus dem Kopf. Nicht nachschlagen. Es geht darum, was hängengeblieben ist.","vi":"Hãy trả lời bằng trí nhớ, không tra cứu. Điều quan trọng là em còn nhớ được gì.","tr":"Soruları ezberden cevapla. Bakma. Önemli olan aklında ne kaldığı.","ar":"أجب عن الأسئلة من الذاكرة. لا تبحث في الكتاب. المهم هو ما بقي في ذهنك.","ti":"ነቲ ሕቶታት ብዕግበት ኣእምሮኻ መልስ። ኣይትድህስስ። ዘገድስ እንታይ ኣብ ኣእምሮኻ ከምዝተረፈ እዩ።","uk":"Відповідай на питання з пам'яті. Не підглядай. Важливо, що в тебе залишилося в голові.","ru":"Отвечай на вопросы по памяти. Не подглядывай. Важно, что у тебя осталось в голове.","es":"Responde las preguntas de memoria. No mires. Lo importante es qué recuerdas.","pt":"Responde às perguntas de memória. Não consultes. O importante é aquilo de que te lembras."},"tip":{"de":"Denk an das Thema Sortiment und Verkaufsraum aus den letzten Wochen. Schreibe Stichworte, keine ganzen Sätze.","vi":"Hãy nhớ lại chủ đề Sortiment (danh mục hàng) và Verkaufsraum (khu bán hàng) mấy tuần trước. Chỉ cần viết từ khóa, không cần viết cả câu.","tr":"Son haftalardaki Sortiment (ürün çeşidi) ve Verkaufsraum (satış alanı) konusunu düşün. Tam cümle değil, anahtar kelimeler yaz.","ar":"تذكّر موضوع Sortiment (تشكيلة البضائع) وVerkaufsraum (قاعة البيع) من الأسابيع الماضية. اكتب كلمات مفتاحية، وليس جملًا كاملة.","ti":"ብዛዕባ Sortiment (ዓይነት ኣቕሑት) ከምኡውን Verkaufsraum (ቦታ ሽያጥ) ኣብዘሕለፍናዮ ሰሙናት ዝነበረ ርእሰ ጉዳይ ኣስተውዕል። ቀሊል ቃላት ጸሓፍ፣ ምሉእ ሓሳብ ኣይኮነን።","uk":"Згадай тему Sortiment (асортимент) і Verkaufsraum (торговий зал) за останні тижні. Пиши ключові слова, а не цілі речення.","ru":"Вспомни тему Sortiment (ассортимент) и Verkaufsraum (торговый зал) за последние недели. Пиши ключевые слова, а не целые предложения.","es":"Piensa en el tema Sortiment (surtido) y Verkaufsraum (sala de ventas) de las últimas semanas. Escribe palabras clave, no frases completas.","pt":"Pensa no tema Sortiment (sortido) e Verkaufsraum (sala de vendas) das últimas semanas. Escreve palavras-chave, não frases completas."},"parts":[{"q":"1. Was ist der Unterschied zwischen einem breiten und einem tiefen Sortiment?","m":"Breites Sortiment: viele verschiedene Warengruppen nebeneinander. Tiefes Sortiment: von einer Warengruppe viele Sorten, Größen und Preislagen.","w":["Warengruppen","Sorten","Größen","Preislagen"]},{"q":"2. Was gehört zum Kernsortiment, was zum Randsortiment?","m":"Kernsortiment: die Waren, für die der Betrieb bekannt ist und die den größten Teil des Umsatzes bringen. Randsortiment: ergänzende Waren, die das Angebot abrunden.","s":["Zum Kernsortiment gehört …","Zum Randsortiment gehört …"]},{"q":"3. Nenne drei Zonen eines Verkaufsregals.","m":"Reckzone, Sichtzone, Griffzone, Bückzone (drei davon genügen)."},{"q":"4. Nenne zwei Aufgaben des Einzelhandels.","m":"Zum Beispiel: Waren in kleinen Mengen anbieten (Mengenausgleich), Waren bereithalten (Zeitausgleich), Waren dorthin bringen, wo Kunden sind (Raumausgleich), beraten, Sortiment zusammenstellen, Kredit gewähren."},{"q":"5. Nenne zwei Vorteile der Selbstbedienung für den Kunden.","m":"Zum Beispiel: Der Kunde kann die Ware selbst ansehen und anfassen, er kann in Ruhe vergleichen, er ist nicht an Beratung gebunden, es geht schneller."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)","tr":"Wortspeicher (sözcük deposu)","ar":"Wortspeicher (مخزن الكلمات)","ti":"Wortspeicher (መኽዘን ቃላት)","uk":"Wortspeicher (скарбничка слів)","ru":"Wortspeicher (копилка слов)","es":"Wortspeicher (almacén de palabras)","pt":"Wortspeicher (banco de palavras)"},"html":"<p>Werbung · Absatz · Direktwerbung · Massenwerbung · Alleinwerbung · Einzelwerbung · Kollektivwerbung · Gemeinschaftswerbung · Sammelwerbung · Warenwerbung · Sortimentswerbung · Firmenwerbung · Aktionswerbung · Zielgruppe · Wirtschaftszweig<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"Werbung = quảng cáo · Absatz = lượng hàng bán được · Direktwerbung = quảng cáo trực tiếp · Massenwerbung = quảng cáo đại chúng · Alleinwerbung (Einzelwerbung) = một cửa hàng tự quảng cáo · Gemeinschaftswerbung = nhiều cửa hàng cùng quảng cáo (có nêu tên) · Sammelwerbung = cả một ngành quảng cáo (không nêu tên) · Warenwerbung = quảng cáo một món hàng · Sortimentswerbung = quảng cáo cả danh mục hàng · Firmenwerbung = quảng cáo cho chính cửa hàng · Aktionswerbung = quảng cáo khuyến mãi có thời hạn · Zielgruppe = nhóm khách hàng mục tiêu · Wirtschaftszweig = ngành kinh tế","sum":{"tr":"Werbung = reklam · Absatz = satılan miktar · Direktwerbung = doğrudan reklam · Massenwerbung = kitle reklamı · Alleinwerbung (Einzelwerbung) = bir işletme tek başına reklam yapar · Gemeinschaftswerbung = birkaç işletme birlikte reklam yapar (isimler verilir) · Sammelwerbung = bütün bir ekonomi kolu reklam yapar (isim verilmez) · Warenwerbung = tek bir ürünün reklamı · Sortimentswerbung = bütün ürün çeşidinin reklamı · Firmenwerbung = işletmenin kendisinin reklamı · Aktionswerbung = süreli kampanya reklamı · Zielgruppe = hedef kitle · Wirtschaftszweig = ekonomi kolu","ar":"Werbung = إعلان · Absatz = الكمية المباعة · Direktwerbung = إعلان مباشر · Massenwerbung = إعلان جماهيري · Alleinwerbung (Einzelwerbung) = محل واحد يعلن وحده · Gemeinschaftswerbung = عدة محلات تعلن معًا (تُذكر الأسماء) · Sammelwerbung = قطاع اقتصادي كامل يعلن (لا تُذكر الأسماء) · Warenwerbung = إعلان عن سلعة واحدة · Sortimentswerbung = إعلان عن التشكيلة كلها · Firmenwerbung = إعلان عن المحل نفسه · Aktionswerbung = إعلان عن عرض محدود المدة · Zielgruppe = الفئة المستهدفة · Wirtschaftszweig = قطاع اقتصادي","ti":"Werbung = ምስላ · Absatz = እቲ ዝሸጥ ብዝሒ · Direktwerbung = ቀጥታዊ ምስላ · Massenwerbung = ሓፈሻዊ ምስላ · Alleinwerbung (Einzelwerbung) = ሓደ ትካል ባዕሉ የስምዕ · Gemeinschaftswerbung = ብዙሓት ትካላት ሓቢሮም የስምዑ (ስማት ይጥቀሱ) · Sammelwerbung = ምሉእ ዓይነት ቀይዲ ቢዝነስ የስምዕ (ስማት ኣይጥቀሱን) · Warenwerbung = ምስላ ሓደ ፍርያት · Sortimentswerbung = ምስላ ምሉእ ዓይነት ኣቕሑት · Firmenwerbung = ምስላ እቲ ትካል ባዕሉ · Aktionswerbung = ምስላ ዝተወሰነ ጊዜ ቅናሽ · Zielgruppe = ዕላማ ጉጅለ ዓማዊል · Wirtschaftszweig = ቀይዲ ቢዝነስ","uk":"Werbung = реклама · Absatz = кількість проданого · Direktwerbung = пряма реклама · Massenwerbung = масова реклама · Alleinwerbung (Einzelwerbung) = один магазин рекламується сам · Gemeinschaftswerbung = кілька магазинів рекламуються разом (назви вказано) · Sammelwerbung = рекламує вся галузь (назв немає) · Warenwerbung = реклама одного товару · Sortimentswerbung = реклама всього асортименту · Firmenwerbung = реклама самого магазину · Aktionswerbung = реклама акції на обмежений час · Zielgruppe = цільова група клієнтів · Wirtschaftszweig = галузь економіки","ru":"Werbung = реклама · Absatz = количество проданного · Direktwerbung = прямая реклама · Massenwerbung = массовая реклама · Alleinwerbung (Einzelwerbung) = один магазин рекламирует себя сам · Gemeinschaftswerbung = несколько магазинов рекламируют вместе (названия указаны) · Sammelwerbung = рекламирует вся отрасль (названий нет) · Warenwerbung = реклама одного товара · Sortimentswerbung = реклама всего ассортимента · Firmenwerbung = реклама самого магазина · Aktionswerbung = реклама акции на ограниченное время · Zielgruppe = целевая группа клиентов · Wirtschaftszweig = отрасль экономики","es":"Werbung = publicidad · Absatz = cantidad vendida · Direktwerbung = publicidad directa · Massenwerbung = publicidad masiva · Alleinwerbung (Einzelwerbung) = una tienda se anuncia sola · Gemeinschaftswerbung = varias tiendas se anuncian juntas (con nombres) · Sammelwerbung = anuncia todo un sector (sin nombres) · Warenwerbung = publicidad de un solo artículo · Sortimentswerbung = publicidad de todo el surtido · Firmenwerbung = publicidad de la propia empresa · Aktionswerbung = publicidad de una oferta por tiempo limitado · Zielgruppe = grupo objetivo · Wirtschaftszweig = sector económico","pt":"Werbung = publicidade · Absatz = quantidade vendida · Direktwerbung = publicidade direta · Massenwerbung = publicidade de massas · Alleinwerbung (Einzelwerbung) = uma loja anuncia sozinha · Gemeinschaftswerbung = várias lojas anunciam juntas (com nomes) · Sammelwerbung = um setor inteiro anuncia (sem nomes) · Warenwerbung = publicidade de um só artigo · Sortimentswerbung = publicidade de todo o sortido · Firmenwerbung = publicidade da própria empresa · Aktionswerbung = publicidade de uma oferta por tempo limitado · Zielgruppe = grupo-alvo · Wirtschaftszweig = setor económico"}},{"id":"r1","no":"Lesen 1","type":"read","title":"Was ist Werbung?","instr":{"de":"Lies den Text. Tippe die wichtigen Wörter an: Was ist Werbung? Was ist ihr Ziel?","vi":"Em đọc đoạn văn. Chạm vào các từ quan trọng: Werbung (quảng cáo) là gì? Mục tiêu của nó là gì?","tr":"Metni oku. Önemli kelimelere dokun: Werbung (reklam) nedir? Amacı nedir?","ar":"اقرأ النص. المس الكلمات المهمة: ما هو الإعلان (Werbung)؟ وما هدفه؟","ti":"እቲ ጽሑፍ ኣንብብ። ኣብቶም ኣገደስቲ ቃላት ተንክዮ: ወርቡንግ (Werbung) እንታይ እዩ? ዕላማኡ እንታይ እዩ?","uk":"Прочитай текст. Торкнись важливих слів: що таке Werbung (реклама)? Яка її мета?","ru":"Прочитай текст. Нажми на важные слова: что такое Werbung (реклама)? Какова её цель?","es":"Lee el texto. Toca las palabras importantes: ¿Qué es la Werbung (publicidad)? ¿Cuál es su objetivo?","pt":"Lê o texto. Toca nas palavras importantes: O que é Werbung (publicidade)? Qual é o seu objetivo?"},"tip":{"de":"Suche Wörter, die sagen, was Werbung tut und was sie erreichen soll.","vi":"Hãy tìm những từ nói quảng cáo làm gì và muốn đạt được điều gì.","tr":"Reklamın ne yaptığını ve neyi başarmak istediğini söyleyen kelimeleri bul.","ar":"ابحث عن الكلمات التي تقول ماذا يفعل الإعلان وماذا يريد أن يحقق.","ti":"እቲ ወርቡንግ እንታይ ከምዝገብርን እንታይ ከምዝርከብን ዝገልጹ ቃላት ድለ።","uk":"Знайди слова, які говорять, що робить реклама і чого вона хоче досягти.","ru":"Найди слова, которые говорят, что делает реклама и чего она хочет достичь.","es":"Busca palabras que digan qué hace la publicidad y qué quiere conseguir.","pt":"Procura palavras que digam o que a publicidade faz e o que quer alcançar."},"paras":["Werbung sind alle [[Maßnahmen]], die das [[Kaufverhalten]] von Kunden beeinflussen sollen. Ziel ist, den [[Absatz]] einer Ware oder einer Dienstleistung zu [[fördern]]. Absatz heißt: die Menge, die verkauft wird.","Der Einzelhandelsbetrieb wirbt, um die Verbraucher über sein Angebot zu informieren. Sein Ziel: [[Kunden gewinnen]] und [[Kunden binden]]. Der Kunde liest Werbung, um den richtigen Anbieter zu finden. Sein Ziel: seine Bedürfnisse bestmöglich erfüllen."],"vi":"Tóm tắt: Werbung (quảng cáo) là mọi biện pháp ảnh hưởng đến việc mua hàng của khách để tăng Absatz (lượng hàng bán). Cửa hàng muốn có thêm khách và giữ khách cũ. Khách hàng muốn tìm đúng nơi bán để thỏa mãn nhu cầu.","quiz":{"q":"Was bedeutet „Absatz“?","o":["Die Menge, die verkauft wird","Der Preis einer Ware","Der Gewinn des Betriebs"],"a":0,"why":{"de":"Absatz heißt: die Menge, die verkauft wird.","vi":"Absatz nghĩa là: số lượng hàng bán được.","tr":"Absatz şu demek: satılan miktar.","ar":"Absatz يعني: الكمية التي تُباع.","ti":"Absatz ማለት: እቲ ዝሸጥ ብዝሒ።","uk":"Absatz означає: кількість, яку продають.","ru":"Absatz означает: количество, которое продаётся.","es":"Absatz significa: la cantidad que se vende.","pt":"Absatz significa: a quantidade que é vendida."}},"sum":{"tr":"Özet: Werbung (reklam), müşterinin satın alma davranışını etkileyen ve Absatz'ı (satılan miktar) artırmayı amaçlayan tüm önlemlerdir. İşletme yeni müşteri kazanmak ve mevcut müşteriyi elde tutmak ister. Müşteri, ihtiyacını karşılamak için doğru satıcıyı bulmak ister.","ar":"ملخص: الإعلان (Werbung) هو كل الإجراءات التي تؤثر في سلوك الزبون الشرائي لزيادة Absatz (الكمية المباعة). يريد المحل كسب زبائن جدد والحفاظ على الزبائن القدامى. ويريد الزبون أن يجد البائع المناسب ليلبّي حاجاته.","ti":"ማጠቃለሊ: ወርቡንግ (Werbung) ንኣገዛዝኣ ዓሚል ዝጸልዉ ንAbsatz (እቲ ዝሸጥ ብዝሒ) ንምዕባይ ዝግበር ኩሉ ስጉምቲ እዩ። እቲ ትካል ሓደስቲ ዓማዊል ምርካብን ነባራት ምሕላውን የድልዮ። እቲ ዓሚል ድማ ጠለባቱ ንምምላእ ትክክለኛ ሸያጢ ክረክብ ይደሊ።","uk":"Підсумок: Werbung (реклама) — це всі заходи, що впливають на поведінку клієнта під час купівлі, щоб збільшити Absatz (кількість проданого). Магазин хоче залучити нових клієнтів і втримати старих. Клієнт хоче знайти потрібного продавця, щоб задовольнити свої потреби.","ru":"Кратко: Werbung (реклама) — это все меры, которые влияют на покупательское поведение клиента, чтобы увеличить Absatz (количество проданного). Магазин хочет привлечь новых клиентов и удержать прежних. Клиент хочет найти подходящего продавца, чтобы удовлетворить свои потребности.","es":"Resumen: La Werbung (publicidad) son todas las medidas que influyen en el comportamiento de compra del cliente para aumentar el Absatz (cantidad vendida). La tienda quiere ganar clientes nuevos y conservar a los antiguos. El cliente quiere encontrar al vendedor adecuado para satisfacer sus necesidades.","pt":"Resumo: A Werbung (publicidade) é o conjunto de todas as medidas que influenciam o comportamento de compra do cliente, para aumentar o Absatz (quantidade vendida). A loja quer ganhar novos clientes e manter os antigos. O cliente quer encontrar o vendedor certo para satisfazer as suas necessidades."}},{"id":"r2","no":"Lesen 2","type":"read","title":"Die drei Fragen hinter den Werbearten","instr":{"de":"Lies den Merksatz. Tippe an, was man sich merken muss.","vi":"Em đọc câu cần nhớ. Chạm vào những gì cần ghi nhớ.","tr":"Merksatz'ı (hatırlanacak cümle) oku. Akılda tutulması gerekene dokun.","ar":"اقرأ الجملة المهمة (Merksatz). المس ما يجب تذكّره.","ti":"እቲ Merksatz (ክዝከር ዘለዎ ሓሳብ) ኣንብብ። እቲ ክዝከር ዘለዎ ተንክዮ።","uk":"Прочитай Merksatz (речення, яке треба запам'ятати). Торкнись того, що треба запам'ятати.","ru":"Прочитай Merksatz (предложение, которое нужно запомнить). Нажми на то, что нужно запомнить.","es":"Lee el Merksatz (frase para recordar). Toca lo que hay que recordar.","pt":"Lê o Merksatz (frase a memorizar). Toca no que é preciso memorizar."},"tip":{"de":"Es geht um die Anzahl der Fragen und darum, wann man sie beantwortet.","vi":"Quan trọng là có bao nhiêu câu hỏi và khi nào trả lời chúng.","tr":"Önemli olan soru sayısı ve onlara ne zaman cevap verildiği.","ar":"المهم هو عدد الأسئلة ومتى تتم الإجابة عنها.","ti":"ዘገድስ ብዝሒ ሕቶታትን መዓስ ከምዝምለሱን እዩ።","uk":"Важливо, скільки питань і коли на них відповідають.","ru":"Важно, сколько вопросов и когда на них отвечают.","es":"Lo importante es cuántas preguntas hay y cuándo se responden.","pt":"O importante é quantas perguntas há e quando se responde a elas."},"paras":["Werbearten wirken auf den ersten Blick wie eine lange Liste. Sie werden übersichtlich, wenn du dir bei jeder Werbung drei Fragen stellst: Frage 1: Wen sprechen wir an? Frage 2: Wer wirbt? Frage 3: Wofür wird geworben?","Merke: Jede Werbung beantwortet [[alle drei Fragen]] [[gleichzeitig]]. Eine Anzeige ist also nicht entweder Massenwerbung oder Aktionswerbung. Sie ist [[beides]], und dazu noch eine Antwort auf Frage 2."],"vi":"Tóm tắt: Với mỗi quảng cáo, em hỏi 3 câu: 1. Ai là người nhận? 2. Ai quảng cáo? 3. Quảng cáo cho cái gì? Một quảng cáo luôn trả lời cả ba câu cùng lúc.","quiz":{"q":"Eine Anzeige ist Massenwerbung. Kann sie auch Aktionswerbung sein?","o":["Ja, sie beantwortet beide Fragen gleichzeitig.","Nein, es gibt nur eine Antwort.","Nur wenn sie im Radio läuft."],"a":0,"why":{"de":"Frage 1 und Frage 3 sind unabhängig. Eine Anzeige kann also Massenwerbung und Aktionswerbung sein.","vi":"Câu hỏi 1 và câu hỏi 3 độc lập với nhau. Vì vậy một quảng cáo có thể vừa là Massenwerbung vừa là Aktionswerbung.","tr":"Soru 1 ve soru 3 birbirinden bağımsızdır. Yani bir ilan hem Massenwerbung hem Aktionswerbung olabilir.","ar":"السؤال 1 والسؤال 3 مستقلان عن بعضهما. لذلك يمكن أن يكون الإعلان Massenwerbung وAktionswerbung في الوقت نفسه.","ti":"ሕቶ 1 ከምኡውን ሕቶ 3 ንሓድሕዶም ነጻ እዮም። ስለዚ ሓንቲ መግለጺ Massenwerbung ከምኡውን Aktionswerbung ክትከውን ትኽእል።","uk":"Питання 1 і питання 3 незалежні. Тому оголошення може бути і Massenwerbung, і Aktionswerbung.","ru":"Вопрос 1 и вопрос 3 независимы. Поэтому объявление может быть и Massenwerbung, и Aktionswerbung.","es":"La pregunta 1 y la pregunta 3 son independientes. Por eso un anuncio puede ser Massenwerbung y Aktionswerbung a la vez.","pt":"A pergunta 1 e a pergunta 3 são independentes. Por isso, um anúncio pode ser Massenwerbung e Aktionswerbung ao mesmo tempo."}},"sum":{"tr":"Özet: Her reklam için 3 soru sor: 1. Alıcı kim? 2. Kim reklam yapıyor? 3. Ne için reklam yapılıyor? Bir reklam her zaman üç soruyu aynı anda cevaplar.","ar":"ملخص: لكل إعلان اطرح 3 أسئلة: 1. من المتلقي؟ 2. من يعلن؟ 3. عن ماذا يُعلن؟ الإعلان الواحد يجيب دائمًا عن الأسئلة الثلاثة معًا.","ti":"ማጠቃለሊ: ንነፍስ ወከፍ ወርቡንግ 3 ሕቶታት ሕተት: 1. መን እዩ ተቐባሊ? 2. መን የስምዕ? 3. ንእንታይ ይስመዕ? ሓደ ወርቡንግ ኩሉ ጊዜ ነተን ሰለስተ ሕቶታት ብሓንሳብ ይምልስ።","uk":"Підсумок: Для кожної реклами став 3 питання: 1. Хто отримувач? 2. Хто рекламує? 3. Що рекламують? Одна реклама завжди відповідає на всі три питання одночасно.","ru":"Кратко: Для каждой рекламы задай 3 вопроса: 1. Кто получатель? 2. Кто рекламирует? 3. Что рекламируют? Одна реклама всегда отвечает на все три вопроса одновременно.","es":"Resumen: Para cada anuncio haces 3 preguntas: 1. ¿Quién es el receptor? 2. ¿Quién anuncia? 3. ¿Qué se anuncia? Un anuncio siempre responde a las tres preguntas a la vez.","pt":"Resumo: Para cada anúncio fazes 3 perguntas: 1. Quem é o destinatário? 2. Quem anuncia? 3. O que se anuncia? Um anúncio responde sempre às três perguntas ao mesmo tempo."}},{"id":"w2","type":"info","title":{"de":"Die neun Werbearten","vi":"Chín Werbearten (loại quảng cáo)","tr":"Dokuz Werbeart (reklam türü)","ar":"أنواع الإعلان التسعة (Werbearten)","ti":"ትሸዓተ ዓይነታት ወርቡንግ (Werbearten)","uk":"Дев'ять Werbearten (видів реклами)","ru":"Девять Werbearten (видов рекламы)","es":"Las nueve Werbearten (tipos de publicidad)","pt":"As nove Werbearten (tipos de publicidade)"},"html":"<div class=\"box\"><b>Frage 1: Wen sprechen wir an?<\/b> Direktwerbung oder Massenwerbung<br><b>Frage 2: Wer wirbt?<\/b> Alleinwerbung, Gemeinschaftswerbung oder Sammelwerbung<br><b>Frage 3: Wofür wird geworben?<\/b> Warenwerbung, Sortimentswerbung, Firmenwerbung oder Aktionswerbung<\/div><p><b>Direktwerbung<\/b> – Bestimmte Personen werden direkt und persönlich angesprochen.<br><i>Beispiel: Das Modehaus schickt seiner Stammkundin einen Brief mit einem Gutschein zum Geburtstag.<\/i><\/p><p><b>Massenwerbung<\/b> – Die Werbung richtet sich an die Allgemeinheit. Sie kann sich auch an eine große Gruppe richten, zum Beispiel an Jugendliche oder an Heimwerker.<br><i>Beispiel: Ein Radiospot für den Sommerschlussverkauf.<\/i><\/p><p><b>Alleinwerbung (Einzelwerbung)<\/b> – Ein Betrieb wirbt allein und mit seinem eigenen Namen.<br><i>Beispiel: Das Spielwarengeschäft Kinderglück schaltet eine eigene Anzeige.<\/i><\/p><p><b>Gemeinschaftswerbung<\/b> – Mehrere Betriebe werben zusammen. Die Namen der beteiligten Betriebe werden genannt.<br><i>Beispiel: Zwölf Geschäfte eines Einkaufszentrums werben gemeinsam für den verkaufsoffenen Sonntag.<\/i><\/p><p><b>Sammelwerbung<\/b> – Ein ganzer Wirtschaftszweig wirbt. Die Namen der einzelnen Betriebe werden nicht genannt.<br><i>Beispiel: Die deutsche Milchwirtschaft wirbt für Milch.<\/i><\/p><p><b>Warenwerbung<\/b> – Ein einzelner Artikel wird herausgestellt. Oft wird diese Werbung vom Hersteller erstellt und bezahlt.<br><i>Beispiel: Eine Anzeige für eine bestimmte Bohrmaschine mit Preis.<\/i><\/p><p><b>Sortimentswerbung<\/b> – Die Breite, die Tiefe oder das Niveau des Sortiments wird gezeigt.<br><i>Beispiel: „Über 300 Teesorten bei uns im Haus.“<\/i><\/p><p><b>Firmenwerbung<\/b> – Der Betrieb selbst steht im Mittelpunkt: sein Name und seine Leistungsfähigkeit.<br><i>Beispiel: „Seit 1954 Ihr Fachgeschäft in Bremerhaven – Beratung, die weiterhilft.“<\/i><\/p><p><b>Aktionswerbung<\/b> – Kunden werden auf ein befristetes Angebot aufmerksam gemacht. Die Ware soll kurzfristig abverkauft werden.<br><i>Beispiel: „Nur am Samstag: 20 % auf alle Winterjacken.“<\/i><\/p>","vi":"Frage 1 (Ai là người nhận?): Direktwerbung = gửi riêng cho từng người · Massenwerbung = gửi cho mọi người.\nFrage 2 (Ai quảng cáo?): Alleinwerbung = một cửa hàng · Gemeinschaftswerbung = nhiều cửa hàng, có nêu tên · Sammelwerbung = cả một ngành, không nêu tên.\nFrage 3 (Quảng cáo cho cái gì?): Warenwerbung = một món hàng · Sortimentswerbung = cả danh mục hàng · Firmenwerbung = chính cửa hàng · Aktionswerbung = ưu đãi có thời hạn.","sum":{"tr":"Frage 1 (Alıcı kim?): Direktwerbung = her kişiye özel gönderilir · Massenwerbung = herkese gönderilir.\nFrage 2 (Kim reklam yapıyor?): Alleinwerbung = tek işletme · Gemeinschaftswerbung = birkaç işletme, isimler verilir · Sammelwerbung = bütün bir ekonomi kolu, isim verilmez.\nFrage 3 (Ne için?): Warenwerbung = tek ürün · Sortimentswerbung = bütün ürün çeşidi · Firmenwerbung = işletmenin kendisi · Aktionswerbung = süreli teklif.","ar":"Frage 1 (من المتلقي؟): Direktwerbung = تُرسل لكل شخص بشكل خاص · Massenwerbung = تُرسل للجميع.\nFrage 2 (من يعلن؟): Alleinwerbung = محل واحد · Gemeinschaftswerbung = عدة محلات، تُذكر الأسماء · Sammelwerbung = قطاع كامل، لا تُذكر الأسماء.\nFrage 3 (عن ماذا؟): Warenwerbung = سلعة واحدة · Sortimentswerbung = التشكيلة كلها · Firmenwerbung = المحل نفسه · Aktionswerbung = عرض محدود المدة.","ti":"Frage 1 (መን እዩ ተቐባሊ?): Direktwerbung = ንነፍስ ወከፍ ሰብ ብፍሉይ ይለኣኽ · Massenwerbung = ንኹሉ ይለኣኽ።\nFrage 2 (መን የስምዕ?): Alleinwerbung = ሓደ ትካል · Gemeinschaftswerbung = ብዙሓት ትካላት፣ ስማት ይጥቀሱ · Sammelwerbung = ምሉእ ቀይዲ ቢዝነስ፣ ስማት ኣይጥቀሱን።\nFrage 3 (ንእንታይ?): Warenwerbung = ሓደ ፍርያት · Sortimentswerbung = ምሉእ ዓይነት ኣቕሑት · Firmenwerbung = እቲ ትካል ባዕሉ · Aktionswerbung = ዝተወሰነ ጊዜ ቅናሽ።","uk":"Frage 1 (Хто отримувач?): Direktwerbung = надсилають кожній людині окремо · Massenwerbung = надсилають усім.\nFrage 2 (Хто рекламує?): Alleinwerbung = один магазин · Gemeinschaftswerbung = кілька магазинів, назви вказано · Sammelwerbung = уся галузь, назв немає.\nFrage 3 (Що рекламують?): Warenwerbung = один товар · Sortimentswerbung = увесь асортимент · Firmenwerbung = сам магазин · Aktionswerbung = пропозиція на обмежений час.","ru":"Frage 1 (Кто получатель?): Direktwerbung = отправляют каждому человеку лично · Massenwerbung = отправляют всем.\nFrage 2 (Кто рекламирует?): Alleinwerbung = один магазин · Gemeinschaftswerbung = несколько магазинов, названия указаны · Sammelwerbung = вся отрасль, названий нет.\nFrage 3 (Что рекламируют?): Warenwerbung = один товар · Sortimentswerbung = весь ассортимент · Firmenwerbung = сам магазин · Aktionswerbung = предложение на ограниченное время.","es":"Frage 1 (¿Quién es el receptor?): Direktwerbung = se envía a cada persona en particular · Massenwerbung = se envía a todos.\nFrage 2 (¿Quién anuncia?): Alleinwerbung = una tienda · Gemeinschaftswerbung = varias tiendas, con nombres · Sammelwerbung = todo un sector, sin nombres.\nFrage 3 (¿Qué se anuncia?): Warenwerbung = un artículo · Sortimentswerbung = todo el surtido · Firmenwerbung = la propia empresa · Aktionswerbung = oferta por tiempo limitado.","pt":"Frage 1 (Quem é o destinatário?): Direktwerbung = enviada a cada pessoa em particular · Massenwerbung = enviada a todos.\nFrage 2 (Quem anuncia?): Alleinwerbung = uma loja · Gemeinschaftswerbung = várias lojas, com nomes · Sammelwerbung = um setor inteiro, sem nomes.\nFrage 3 (O que se anuncia?): Warenwerbung = um artigo · Sortimentswerbung = todo o sortido · Firmenwerbung = a própria empresa · Aktionswerbung = oferta por tempo limitado."}},{"id":"t1","no":"Lesen 3","type":"tf","pts":0,"title":"Richtig oder falsch?","instr":{"de":"Entscheide: Ist die Aussage richtig oder falsch?","vi":"Em quyết định: câu này đúng hay sai?","tr":"Karar ver: İfade doğru mu yanlış mı?","ar":"قرّر: هل العبارة صحيحة أم خاطئة؟","ti":"ወስን: እቲ ሓሳብ ልክዕ ድዩ ጌጋ?","uk":"Вирішуй: твердження правильне чи неправильне?","ru":"Реши: утверждение верное или неверное?","es":"Decide: ¿la afirmación es verdadera o falsa?","pt":"Decide: a afirmação é verdadeira ou falsa?"},"tip":{"de":"Lies in der Übersicht oben nach. Achte auf die Namen der Betriebe.","vi":"Đọc lại bảng tổng quan ở trên. Chú ý đến việc tên các cửa hàng có được nêu hay không.","tr":"Yukarıdaki özette tekrar oku. İşletmelerin adlarının verilip verilmediğine dikkat et.","ar":"اقرأ الملخص أعلاه مرة أخرى. انتبه إلى أسماء المحلات.","ti":"ኣብቲ ላዕሊ ዘሎ ጽማቝ ደጊምካ ኣንብብ። ንስማት ትካላት ኣስተውዕል።","uk":"Перечитай огляд вище. Зверни увагу на назви магазинів.","ru":"Перечитай обзор выше. Обрати внимание на названия магазинов.","es":"Vuelve a leer el resumen de arriba. Fíjate en los nombres de las empresas.","pt":"Lê outra vez o resumo acima. Presta atenção aos nomes das empresas."},"st":[{"t":"Bei der Sammelwerbung werden die Namen der einzelnen Betriebe genannt.","a":false,"why":{"de":"Bei der Sammelwerbung wirbt ein ganzer Wirtschaftszweig, ohne Namen.","vi":"Với Sammelwerbung cả một ngành quảng cáo, không nêu tên cửa hàng nào.","tr":"Sammelwerbung'da bütün bir ekonomi kolu reklam yapar, isim verilmez.","ar":"في Sammelwerbung يعلن قطاع اقتصادي كامل، بدون ذكر أسماء.","ti":"ኣብ Sammelwerbung ምሉእ ዓይነት ቀይዲ ቢዝነስ ብዘይ ስም የስምዕ።","uk":"У Sammelwerbung рекламує вся галузь економіки, без назв.","ru":"В Sammelwerbung рекламирует вся отрасль экономики, без названий.","es":"En la Sammelwerbung anuncia todo un sector económico, sin nombres.","pt":"Na Sammelwerbung anuncia um setor económico inteiro, sem nomes."}},{"t":"Eine Anzeige kann Massenwerbung und Aktionswerbung zugleich sein.","a":true},{"t":"Alleinwerbung wird auch Einzelwerbung genannt.","a":true},{"t":"Direktwerbung richtet sich an die Allgemeinheit.","a":false,"why":{"de":"Direktwerbung spricht bestimmte Personen persönlich an.","vi":"Direktwerbung nói với từng người cụ thể. Quảng cáo cho mọi người là Massenwerbung.","tr":"Direktwerbung belirli kişilere doğrudan seslenir. Herkese yapılan reklam Massenwerbung'dur.","ar":"Direktwerbung تخاطب أشخاصًا محددين بشكل شخصي. أما الإعلان الموجّه للجميع فهو Massenwerbung.","ti":"Direktwerbung ንዝተወሰኑ ሰባት ብቐጥታ የዘራርብ። ንኹሉ ሰብ ዝኾነ ምስላ Massenwerbung እዩ።","uk":"Direktwerbung звертається до певних людей особисто. Реклама для всіх — це Massenwerbung.","ru":"Direktwerbung обращается к определённым людям лично. Реклама для всех — это Massenwerbung.","es":"La Direktwerbung se dirige a personas concretas de forma personal. La publicidad para todos es Massenwerbung.","pt":"A Direktwerbung dirige-se a pessoas determinadas, de forma pessoal. A publicidade para todos é Massenwerbung."}}]},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: So ordnest du eine Werbung ein","html":"<div class=\"box\"><b>Die Anzeige:<\/b> Möbel-Haus Rieck, Bremerhaven<br>„Nur bis Samstag: Alle Polstergarnituren 20 % reduziert!“ (Anzeige in der Tageszeitung)<\/div><p><b>Frage 1: Wen sprechen wir an?<\/b> Die Anzeige steht in der Zeitung. Sie spricht niemanden mit Namen an, sondern alle Leser. → <b>Massenwerbung<\/b><\/p><p><b>Frage 2: Wer wirbt?<\/b> Oben steht ein einziger Betrieb mit seinem Namen. Kein zweiter Betrieb ist beteiligt. → <b>Alleinwerbung<\/b><\/p><p><b>Frage 3: Wofür wird geworben?<\/b> Es geht nicht um ein einzelnes Modell und nicht um das ganze Sortiment, sondern um ein Angebot mit Rabatt, das am Samstag endet. → <b>Aktionswerbung<\/b><\/p><div class=\"box merke\"><b>Ergebnis:<\/b> Massenwerbung, Alleinwerbung, Aktionswerbung.<\/div>","vi":"Ví dụ làm mẫu: quảng cáo đăng báo của một cửa hàng đồ nội thất, giảm giá đến hết thứ Bảy. Câu 1: đăng báo, ai cũng đọc được → Massenwerbung. Câu 2: chỉ có một cửa hàng → Alleinwerbung. Câu 3: ưu đãi có thời hạn → Aktionswerbung.","sum":{"tr":"Örnek: Bir mobilya mağazasının gazete ilanı, Cumartesi gününe kadar indirim. Soru 1: Gazetede, herkes okuyabilir → Massenwerbung. Soru 2: Yalnızca bir işletme → Alleinwerbung. Soru 3: süreli teklif → Aktionswerbung.","ar":"مثال محلول: إعلان في الجريدة لمحل أثاث، تخفيض حتى يوم السبت. السؤال 1: في الجريدة، يستطيع الجميع قراءته → Massenwerbung. السؤال 2: محل واحد فقط → Alleinwerbung. السؤال 3: عرض محدود المدة → Aktionswerbung.","ti":"ኣብነት: ኣብ ጋዜጣ ዝወጸ ምልክታ ናይ ሓደ ሱቕ ኣቑሑት ገዛ፣ ክሳብ ቀዳም ቅናሽ። ሕቶ 1: ኣብ ጋዜጣ፣ ኩሉ ሰብ ከንብቦ ይኽእል → Massenwerbung። ሕቶ 2: ሓደ ትካል ጥራይ → Alleinwerbung። ሕቶ 3: ዝተወሰነ ጊዜ ቅናሽ → Aktionswerbung።","uk":"Приклад: оголошення в газеті від магазину меблів, знижка до суботи. Питання 1: у газеті, читати може кожен → Massenwerbung. Питання 2: лише один магазин → Alleinwerbung. Питання 3: пропозиція на обмежений час → Aktionswerbung.","ru":"Пример: объявление в газете от мебельного магазина, скидка до субботы. Вопрос 1: в газете, читать может каждый → Massenwerbung. Вопрос 2: только один магазин → Alleinwerbung. Вопрос 3: предложение на ограниченное время → Aktionswerbung.","es":"Ejemplo resuelto: anuncio en el periódico de una tienda de muebles, descuento hasta el sábado. Pregunta 1: en el periódico, lo puede leer cualquiera → Massenwerbung. Pregunta 2: solo una tienda → Alleinwerbung. Pregunta 3: oferta por tiempo limitado → Aktionswerbung.","pt":"Exemplo resolvido: anúncio no jornal de uma loja de móveis, desconto até sábado. Pergunta 1: no jornal, qualquer pessoa pode ler → Massenwerbung. Pergunta 2: só uma loja → Alleinwerbung. Pergunta 3: oferta por tempo limitado → Aktionswerbung."}},{"id":"a3","no":"Aufgabe 3","type":"table","pts":1,"title":"Geführte Übung","instr":{"de":"Einige Felder sind schon ausgefüllt. Ergänze die fehlenden. Beantworte pro Werbung die drei Fragen.","vi":"Một số ô đã được điền sẵn. Em điền các ô còn thiếu. Với mỗi quảng cáo, trả lời ba câu hỏi.","tr":"Bazı alanlar zaten doldurulmuş. Eksikleri tamamla. Her reklam için üç soruyu cevapla.","ar":"بعض الخانات مملوءة مسبقًا. أكمل الخانات الناقصة. أجب عن الأسئلة الثلاثة لكل إعلان.","ti":"ገሊአን ቦታታት ተመሊአን ኣለዋ። እተን ዝጎድላ ምልኣ። ንነፍስ ወከፍ ወርቡንግ ሰለስተ ሕቶታት መልስ።","uk":"Деякі поля вже заповнені. Заповни ті, що залишилися. Для кожної реклами дай відповідь на три питання.","ru":"Некоторые поля уже заполнены. Заполни недостающие. Для каждой рекламы ответь на три вопроса.","es":"Algunos campos ya están rellenos. Completa los que faltan. Responde las tres preguntas para cada anuncio.","pt":"Alguns campos já estão preenchidos. Completa os que faltam. Para cada anúncio, responde às três perguntas."},"tip":{"de":"Gehe die drei Fragen der Reihe nach durch: Wen? Wer? Wofür? Der Hinweis unter der Werbung hilft dir.","vi":"Lần lượt trả lời ba câu hỏi: Ai nhận? Ai quảng cáo? Quảng cáo cho cái gì? Phần gợi ý dưới mỗi quảng cáo sẽ giúp em.","tr":"Üç soruyu sırayla cevapla: Kime? Kim? Ne için? Reklamın altındaki ipucu sana yardım eder.","ar":"أجب عن الأسئلة الثلاثة بالترتيب: من يستقبل؟ من يعلن؟ عن ماذا؟ التلميح تحت الإعلان يساعدك.","ti":"ነተን ሰለስተ ሕቶታት ብስርዓት መልስ: ንመን? መን? ንእንታይ? እቲ ኣብ ትሕቲ ወርቡንግ ዘሎ ሓገዝ ይሕግዘካ።","uk":"Відповідай на три питання по черзі: Кому? Хто? Для чого? Підказка під рекламою тобі допоможе.","ru":"Отвечай на три вопроса по порядку: Кому? Кто? Для чего? Подсказка под рекламой тебе поможет.","es":"Responde las tres preguntas en orden: ¿A quién? ¿Quién? ¿Para qué? La pista debajo del anuncio te ayuda.","pt":"Responde às três perguntas por ordem: A quem? Quem? Para quê? A dica debaixo do anúncio ajuda-te."},"cols":["Werbung","Frage 1: Wen?","Frage 2: Wer?","Frage 3: Wofür?"],"colOpts":[null,["Direktwerbung","Massenwerbung"],["Alleinwerbung","Gemeinschaftswerbung","Sammelwerbung"],["Warenwerbung","Sortimentswerbung","Firmenwerbung","Aktionswerbung"]],"rows":[["Ein Werbebrief an die Kundinnen der Modeabteilung: „Zu Ihrem Geburtstag 15 % auf das gesamte Sortiment.“ Hinweis: Der Brief geht an eine bestimmte Person.","Direktwerbung",{"a":"Alleinwerbung"},{"a":"Aktionswerbung"}],["Plakat: „Die Milch macht’s.“ Geworben wird von der deutschen Milchwirtschaft, einzelne Molkereien werden nicht genannt. Hinweis: Es wirbt ein ganzer Wirtschaftszweig.",{"a":"Massenwerbung"},"Sammelwerbung",{"a":"Warenwerbung"}],["Anzeige des Columbus Centers mit den Logos von zwölf Geschäften: „Verkaufsoffener Sonntag.“ Hinweis: Die Namen der Geschäfte stehen auf der Anzeige.","Massenwerbung",{"a":"Gemeinschaftswerbung"},{"a":"Aktionswerbung"}],["Schaufensterbeschriftung eines Teegeschäfts: „Bei uns finden Sie über 300 Teesorten.“",{"a":"Massenwerbung"},{"a":"Alleinwerbung"},{"a":"Sortimentswerbung"}]]},{"id":"a4","no":"Aufgabe 4","type":"table","pts":2,"title":"Freie Übung","instr":{"de":"Ordne jede Werbung mit den drei Fragen ein.","vi":"Em xếp từng quảng cáo bằng ba câu hỏi.","tr":"Her reklamı üç soruyla sınıflandır.","ar":"صنّف كل إعلان بالأسئلة الثلاثة.","ti":"ነፍስ ወከፍ ወርቡንግ ብሰለስተ ሕቶታት ምድባ።","uk":"Визнач вид кожної реклами за допомогою трьох питань.","ru":"Определи вид каждой рекламы с помощью трёх вопросов.","es":"Clasifica cada anuncio con las tres preguntas.","pt":"Classifica cada anúncio com as três perguntas."},"tip":{"de":"Frage 2: Werden Namen genannt? Wie viele Betriebe werben? Frage 3: Ist es ein Artikel, das ganze Sortiment, der Betrieb oder ein befristetes Angebot?","vi":"Câu 2: Có nêu tên không? Bao nhiêu cửa hàng quảng cáo? Câu 3: Là một món hàng, cả danh mục, chính cửa hàng hay ưu đãi có thời hạn?","tr":"Soru 2: İsimler veriliyor mu? Kaç işletme reklam yapıyor? Soru 3: Tek bir ürün mü, bütün Sortiment mi, işletme mi, yoksa süreli bir teklif mi?","ar":"السؤال 2: هل تُذكر الأسماء؟ كم محلًا يعلن؟ السؤال 3: هل هو سلعة واحدة، أم التشكيلة كلها، أم المحل نفسه، أم عرض محدود المدة؟","ti":"ሕቶ 2: ስማት ይጥቀሱ ድዮም? ክንደይ ትካላት የስምዑ ኣለዉ? ሕቶ 3: ሓደ ፍርያት ድዩ፣ ምሉእ Sortiment ድዩ፣ እቲ ትካል ድዩ፣ ወይስ ዕዮ ዘለዎ ጊዜ ዝተወሰነ ቅናሽ?","uk":"Питання 2: чи названо імена? Скільки магазинів рекламують? Питання 3: це один товар, увесь Sortiment, сам магазин чи пропозиція на обмежений час?","ru":"Вопрос 2: названы ли имена? Сколько магазинов рекламируют? Вопрос 3: это один товар, весь Sortiment, сам магазин или предложение на ограниченное время?","es":"Pregunta 2: ¿Se mencionan nombres? ¿Cuántas empresas anuncian? Pregunta 3: ¿Es un artículo, todo el Sortiment, la empresa o una oferta por tiempo limitado?","pt":"Pergunta 2: São referidos nomes? Quantas empresas anunciam? Pergunta 3: É um artigo, todo o Sortiment, a empresa ou uma oferta por tempo limitado?"},"cols":["Werbung","Frage 1: Wen?","Frage 2: Wer?","Frage 3: Wofür?"],"colOpts":[null,["Direktwerbung","Massenwerbung"],["Alleinwerbung","Gemeinschaftswerbung","Sammelwerbung"],["Warenwerbung","Sortimentswerbung","Firmenwerbung","Aktionswerbung"]],"rows":[["Newsletter an registrierte Kunden: „Neu bei uns: der Wanderschuh Trekker 3.“",{"a":"Direktwerbung"},{"a":"Alleinwerbung"},{"a":"Warenwerbung"}],["Radiospot: „Elektro Germer – seit 40 Jahren Ihr Fachbetrieb in der Region.“",{"a":"Massenwerbung"},{"a":"Alleinwerbung"},{"a":"Firmenwerbung"}],["Prospekt der Werbegemeinschaft Innenstadt: „Stadtfest-Wochenende – Sonderangebote in 24 Geschäften“, alle Geschäfte sind aufgeführt.",{"a":"Massenwerbung"},{"a":"Gemeinschaftswerbung"},{"a":"Aktionswerbung"}],["Plakat: „Obst und Gemüse aus Deutschland – frisch auf den Tisch.“ Geworben wird von der Landwirtschaft, ohne einzelne Höfe zu nennen.",{"a":"Massenwerbung"},{"a":"Sammelwerbung"},{"a":"Warenwerbung"}],["Katalog eines Warenhauses, der das gesamte Angebot der Haushaltsabteilung zeigt.",{"a":"Massenwerbung"},{"a":"Alleinwerbung"},{"a":"Sortimentswerbung"}],["Persönliche Einladung an Stammkunden zur Hausmesse am kommenden Freitag.",{"a":"Direktwerbung"},{"a":"Alleinwerbung"},{"a":"Aktionswerbung"}]]},{"id":"a5","no":"Aufgabe 5","type":"free","pts":1,"title":"Aus deinem Betrieb","instr":{"de":"Suche eine Werbung deines Ausbildungsbetriebs (Anzeige, Aushang, Newsletter, Social-Media-Beitrag). Beschreibe sie kurz und ordne sie mit den drei Fragen ein.","vi":"Tìm một quảng cáo của cửa hàng nơi em thực tập (tờ rơi, bảng thông báo, bản tin, bài đăng mạng xã hội). Mô tả ngắn gọn và xếp loại bằng ba câu hỏi.","tr":"Staj yaptığın işletmenin bir reklamını bul (ilan, pano, bülten, sosyal medya paylaşımı). Kısaca anlat ve üç soruyla sınıflandır.","ar":"ابحث عن إعلان لمحل تدريبك (إعلان في جريدة، لوحة، نشرة، منشور على وسائل التواصل). صفه باختصار وصنّفه بالأسئلة الثلاثة.","ti":"ናይ ትካል ልምምድካ ዝኾነ ሓደ ወርቡንግ ድለ (ምልክታ፣ ሰሌዳ፣ ጋዜጣ፣ ኣብ ማሕበራዊ መርበብ ዝተለጠፈ)። ብሓጺሩ ግለጾ ከምኡውን ብሰለስተ ሕቶታት ምድበ።","uk":"Знайди рекламу свого навчального підприємства (оголошення, афіша, розсилка, допис у соцмережах). Коротко опиши її та визнач вид за трьома питаннями.","ru":"Найди рекламу своего учебного предприятия (объявление, афиша, рассылка, пост в соцсетях). Коротко опиши её и определи вид по трём вопросам.","es":"Busca un anuncio de tu empresa de prácticas (anuncio, cartel, boletín, publicación en redes sociales). Descríbelo brevemente y clasifícalo con las tres preguntas.","pt":"Procura um anúncio da tua empresa de formação (anúncio, cartaz, newsletter, publicação nas redes sociais). Descreve-o brevemente e classifica-o com as três perguntas."},"tip":{"de":"Beschreibe zuerst, was auf der Werbung steht. Beantworte dann Frage 1, 2 und 3 mit je einem Satz.","vi":"Trước tiên mô tả nội dung quảng cáo. Sau đó trả lời câu hỏi 1, 2 và 3, mỗi câu một câu văn.","tr":"Önce reklamda ne yazdığını anlat. Sonra soru 1, 2 ve 3'ü birer cümleyle cevapla.","ar":"صف أولًا ما هو مكتوب في الإعلان. ثم أجب عن السؤال 1 و2 و3 بجملة لكل منها.","ti":"ቅድም ኣብቲ ወርቡንግ እንታይ ከምዝተጻሕፈ ግለጽ። ድሕሪኡ ንሕቶ 1፣ 2 ከምኡውን 3 ብሓንቲ ሓሳብ መልስ።","uk":"Спочатку опиши, що написано в рекламі. Потім дай відповідь на питання 1, 2 і 3 одним реченням кожне.","ru":"Сначала опиши, что написано в рекламе. Затем ответь на вопросы 1, 2 и 3 одним предложением каждый.","es":"Primero describe lo que dice el anuncio. Luego responde las preguntas 1, 2 y 3 con una frase cada una.","pt":"Primeiro descreve o que está escrito no anúncio. Depois responde às perguntas 1, 2 e 3 com uma frase cada."},"parts":[{"q":"Meine Werbung und die Einordnung:","m":"Individuelle Lösung. Wichtig ist, dass alle drei Fragen beantwortet werden und die Zuordnung zum beschriebenen Beispiel passt.","s":["Die Werbung zeigt …","Das ist … (Frage 1), weil …","Wer wirbt? …","Wofür wird geworben? …"]}]},{"id":"a6","no":"Aufgabe 6","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh.","tr":"Soruları cevapla. Tam cümlelerle gerekçelendir.","ar":"أجب عن الأسئلة. علّل بجمل كاملة.","ti":"ነቶም ሕቶታት መልስ። ብምሉእ ሓሳባት ኣብርህ።","uk":"Дай відповіді на питання. Обґрунтуй повними реченнями.","ru":"Ответь на вопросы. Обоснуй полными предложениями.","es":"Responde las preguntas. Justifica con frases completas.","pt":"Responde às perguntas. Justifica com frases completas."},"tip":{"de":"Denke bei 6.1 an die Nachfrage nach der ganzen Warengruppe und an die Kosten. Bei 6.3: Die drei Fragen sind unabhängig voneinander.","vi":"Câu 6.1: nghĩ đến nhu cầu cho cả nhóm hàng và chi phí. Câu 6.3: ba câu hỏi độc lập với nhau.","tr":"6.1 için tüm ürün grubuna olan talebi ve maliyetleri düşün. 6.3 için: Üç soru birbirinden bağımsızdır.","ar":"في 6.1 فكّر في الطلب على مجموعة البضائع كلها وفي التكاليف. في 6.3: الأسئلة الثلاثة مستقلة عن بعضها.","ti":"ኣብ 6.1 ንጠለብ ናይ ምሉእ ጉጅለ ኣቕሑትን ንወጻኢታትን ኣስተውዕል። ኣብ 6.3: እተን ሰለስተ ሕቶታት ንሓድሕደን ነጻ እየን።","uk":"У 6.1 подумай про попит на всю групу товарів і про витрати. У 6.3: три питання незалежні одне від одного.","ru":"В 6.1 подумай о спросе на всю группу товаров и о затратах. В 6.3: три вопроса независимы друг от друга.","es":"En 6.1 piensa en la demanda de todo el grupo de productos y en los costes. En 6.3: las tres preguntas son independientes entre sí.","pt":"Em 6.1 pensa na procura de todo o grupo de produtos e nos custos. Em 6.3: as três perguntas são independentes umas das outras."},"parts":[{"q":"6.1 Bei der Sammelwerbung werden die Namen der beteiligten Betriebe nicht genannt. Erkläre, warum ein einzelner Einzelhändler trotzdem davon profitiert.","m":"Die Sammelwerbung erhöht die Nachfrage nach der ganzen Warengruppe. Wenn mehr Menschen Milch kaufen wollen, kaufen sie auch im Geschäft dieses Händlers mehr Milch. Außerdem sind die Kosten auf viele Betriebe verteilt, sodass eine große Reichweite bezahlbar wird.","s":["Der Händler profitiert, weil …"]},{"q":"6.2 Nenne einen Fall, in dem Gemeinschaftswerbung für einen kleinen Betrieb sinnvoller ist als Alleinwerbung. Begründe.","m":"Zum Beispiel beim verkaufsoffenen Sonntag oder einem Stadtfest: Allein könnte sich das kleine Geschäft eine ganzseitige Anzeige nicht leisten, gemeinsam schon. Außerdem wirkt ein Anlass, zu dem viele Geschäfte öffnen, stärker als die Werbung eines einzelnen Ladens. Die Kunden kommen wegen des Anlasses in die Stadt und gehen dann auch in dieses Geschäft."},{"q":"6.3 Knacknuss: Kann eine Werbung gleichzeitig Direktwerbung und Sammelwerbung sein? Begründe mit einem Beispiel – oder zeige, warum es nicht geht.","m":"Ja, möglich ist es. Beispiel: Ein Branchenverband der Optiker schreibt alle Haushalte einer Stadt persönlich an und wirbt für regelmäßige Sehtests, ohne einzelne Optiker zu nennen. Das ist direkt (persönliche Ansprache) und zugleich Sammelwerbung. In der Praxis kommt das selten vor. Wichtig ist die Einsicht: Die drei Fragen sind voneinander unabhängig, deshalb sind viele Kombinationen möglich."}]},{"id":"d1","no":"Domino","type":"match","pts":0,"title":"Anlage: Domino-Rundlauf „Werbearten“","instr":{"de":"Ordne jeder Frage die richtige Antwort zu. (Das ist das Domino zum Ausschneiden, nur digital.)","vi":"Em ghép mỗi câu hỏi với đáp án đúng. (Đây là trò domino cắt giấy, nhưng làm trên máy.)","tr":"Her soruya doğru cevabı eşleştir. (Bu, kesilecek domino oyunun dijital hali.)","ar":"اربط كل سؤال بالإجابة الصحيحة. (هذه لعبة الدومينو التي تُقص بالمقص، لكن بشكل رقمي.)","ti":"ነፍስ ወከፍ ሕቶ ምስ ትክክለኛ መልሲ ኣዛምድ። (እዚ ዶሚኖ ዝቑረጽ እዩ፣ ግን ብዲጂታል።)","uk":"Підбери до кожного питання правильну відповідь. (Це доміно, яке треба вирізати, але в цифровому вигляді.)","ru":"Подбери к каждому вопросу правильный ответ. (Это домино, которое нужно вырезать, но в цифровом виде.)","es":"Une cada pregunta con la respuesta correcta. (Es el dominó para recortar, pero en digital.)","pt":"Associa a cada pergunta a resposta certa. (É o dominó para recortar, mas em formato digital.)"},"tip":{"de":"Beginne mit den Fragen, bei denen du die Antwort sicher weißt. Streiche in Gedanken die Begriffe durch, die schon verwendet sind.","vi":"Bắt đầu với những câu em chắc chắn. Trong đầu hãy gạch bỏ những từ đã dùng rồi.","tr":"Cevabını kesin bildiğin sorularla başla. Kullanılmış kavramları aklında çiz.","ar":"ابدأ بالأسئلة التي تعرف إجابتها بيقين. اشطب في ذهنك الكلمات التي استُخدمت بالفعل.","ti":"ብሕቶታት ዝመለስኻ ብርግጽ እትፈልጦም ጀምር። ነቶም ዝተጠቀምካዮም ቃላት ኣብ ሓሳብካ ሰርዞም።","uk":"Почни з питань, відповідь на які ти знаєш точно. Подумки викреслюй слова, які вже використано.","ru":"Начни с вопросов, ответ на которые ты знаешь точно. Мысленно вычёркивай слова, которые уже использованы.","es":"Empieza con las preguntas cuya respuesta sabes con seguridad. Tacha mentalmente los términos que ya has usado.","pt":"Começa pelas perguntas cuja resposta sabes com certeza. Risca mentalmente os termos que já foram usados."},"rows":[{"l":"Welches Ziel verfolgt der Einzelhandelsbetrieb mit Werbung?","a":"Kunden gewinnen und binden"},{"l":"Welches Ziel hat der Kunde, wenn er Werbung liest?","a":"Den richtigen Anbieter finden und seine Bedürfnisse bestmöglich erfüllen"},{"l":"Das Modehaus schickt seiner Stammkundin einen Brief mit einem Geburtstagsgutschein. Welche Werbeart?","a":"Direktwerbung"},{"l":"Ein Radiospot wirbt für den Sommerschlussverkauf. Welche Werbeart?","a":"Massenwerbung"},{"l":"Das Spielwarengeschäft Kinderglück schaltet eine Anzeige unter eigenem Namen. Welche Werbeart?","a":"Alleinwerbung"},{"l":"Zwölf Geschäfte eines Einkaufszentrums werben zusammen, alle Namen stehen auf der Anzeige. Welche Werbeart?","a":"Gemeinschaftswerbung"},{"l":"Die deutsche Milchwirtschaft wirbt für Milch, ohne einzelne Molkereien zu nennen. Welche Werbeart?","a":"Sammelwerbung"},{"l":"Eine Anzeige zeigt eine bestimmte Bohrmaschine mit Preis. Welche Werbeart?","a":"Warenwerbung"},{"l":"„Über 300 Teesorten bei uns im Haus.“ Welche Werbeart?","a":"Sortimentswerbung"},{"l":"„Seit 1954 Ihr Fachgeschäft in Bremerhaven.“ Welche Werbeart?","a":"Firmenwerbung"},{"l":"„Nur am Samstag: 20 % auf alle Winterjacken.“ Welche Werbeart?","a":"Aktionswerbung"},{"l":"Alle Maßnahmen, die das Kaufverhalten beeinflussen sollen, um den Absatz zu fördern – wie heißt der Oberbegriff?","a":"Werbung"}]},{"id":"v1","level":"v","no":"Vertiefung 1","type":"free","pts":1,"title":"Warum ist das so?","instr":{"de":"Begründe deine Antwort in ganzen Sätzen.","vi":"Em giải thích câu trả lời bằng câu hoàn chỉnh.","tr":"Cevabını tam cümlelerle gerekçelendir.","ar":"علّل إجابتك بجمل كاملة.","ti":"መልስኻ ብምሉእ ሓሳባት ኣብርህ።","uk":"Обґрунтуй свою відповідь повними реченнями.","ru":"Обоснуй свой ответ полными предложениями.","es":"Justifica tu respuesta con frases completas.","pt":"Justifica a tua resposta com frases completas."},"tip":{"de":"Überlege: Welche Frage fragt nach dem Empfänger, welche nach dem Absender, welche nach dem Inhalt?","vi":"Hãy nghĩ: câu hỏi nào hỏi về người nhận, câu nào về người gửi, câu nào về nội dung?","tr":"Düşün: Hangi soru alıcıyı, hangisi göndereni, hangisi içeriği soruyor?","ar":"فكّر: أي سؤال يسأل عن المتلقي، وأيها عن المُرسِل، وأيها عن المحتوى؟","ti":"ሕሰብ: እንታይ ሕቶ ንተቐባሊ፣ እንታይ ንለኣኺ፣ እንታይ ድማ ንትሕዝቶ ይሓትት?","uk":"Подумай: яке питання стосується отримувача, яке — відправника, яке — змісту?","ru":"Подумай: какой вопрос касается получателя, какой — отправителя, какой — содержания?","es":"Piensa: ¿qué pregunta se refiere al receptor, cuál al emisor y cuál al contenido?","pt":"Pensa: Que pergunta se refere ao destinatário, qual ao emissor e qual ao conteúdo?"},"parts":[{"q":"Warum kann dieselbe Anzeige gleichzeitig Massenwerbung, Alleinwerbung und Aktionswerbung sein? Begründe.","m":"Die drei Fragen (Wen? Wer? Wofür?) fragen nach verschiedenen Dingen: nach dem Empfänger, nach dem Werbenden und nach dem Inhalt. Sie sind voneinander unabhängig. Deshalb beantwortet jede Anzeige alle drei Fragen gleichzeitig, zum Beispiel: Zeitungsanzeige (Massen-), ein Betrieb (Allein-), befristeter Rabatt (Aktions-).","s":["Das ist so, weil …","Die drei Fragen fragen nach …"]}]},{"id":"v2","level":"v","no":"Vertiefung 2","type":"free","pts":1,"title":"Begründe deine Entscheidung","instr":{"de":"Ein kleines Blumengeschäft will für den Muttertag werben. Es kann allein oder mit anderen Geschäften werben. Wofür entscheidest du dich? Begründe.","vi":"Một cửa hàng hoa nhỏ muốn quảng cáo cho Ngày của Mẹ. Cửa hàng có thể tự quảng cáo hoặc cùng các cửa hàng khác. Em chọn cách nào? Hãy giải thích.","tr":"Küçük bir çiçekçi Anneler Günü için reklam yapmak istiyor. Tek başına ya da başka dükkânlarla birlikte reklam yapabilir. Sen hangisini seçersin? Gerekçelendir.","ar":"محل زهور صغير يريد الإعلان بمناسبة عيد الأم. يمكنه أن يعلن وحده أو مع محلات أخرى. ماذا تختار؟ علّل.","ti":"ሓንቲ ንእሽቶ ሱቕ ዕምባባ ንመዓልቲ ኣዴታት ክተስምዕ ትደሊ። ባዕላ ወይ ምስ ካልኦት ሱቓት ክትስምዕ ትኽእል። ንስኻ ኣየናይ ትመርጽ? ኣብርህ።","uk":"Невеликий квітковий магазин хоче зробити рекламу до Дня матері. Він може рекламуватися сам або разом з іншими магазинами. Що ти обереш? Обґрунтуй.","ru":"Небольшой цветочный магазин хочет сделать рекламу ко Дню матери. Он может рекламироваться сам или вместе с другими магазинами. Что ты выберешь? Обоснуй.","es":"Una pequeña floristería quiere hacer publicidad para el Día de la Madre. Puede anunciarse sola o con otras tiendas. ¿Qué eliges? Justifica.","pt":"Uma pequena florista quer fazer publicidade para o Dia da Mãe. Pode anunciar sozinha ou com outras lojas. Qual escolhes? Justifica."},"tip":{"de":"Denke an die Kosten und daran, wie viele Kunden die Werbung erreicht.","vi":"Hãy nghĩ đến chi phí và số khách hàng mà quảng cáo tiếp cận được.","tr":"Maliyetleri ve reklamın kaç müşteriye ulaştığını düşün.","ar":"فكّر في التكاليف وفي عدد الزبائن الذين يصل إليهم الإعلان.","ti":"ንወጻኢታትን ክንደይ ዓማዊል እቲ ወርቡንግ ከምዝበጽሕን ኣስተውዕል።","uk":"Подумай про витрати і про те, скільки клієнтів охопить реклама.","ru":"Подумай о затратах и о том, сколько клиентов охватит реклама.","es":"Piensa en los costes y en cuántos clientes alcanza la publicidad.","pt":"Pensa nos custos e em quantos clientes a publicidade alcança."},"parts":[{"q":"Meine Entscheidung und meine Begründung:","m":"Mögliche Begründung: Gemeinschaftswerbung ist gü  const a=A(it.id),ps=parts(it),res=[];
 if(it.type==='read'){const keys=readKeys(it),sel=a.m||[];const found=keys.filter(k=>sel.indexOf(k)>=0).length,extra=sel.filter(k=>keys.indexOf(k)<0).length;
  const q=it.quiz,qa=a.q;return{type:'read',found,total:keys.length,extra,qok:q?(qa!=null&&+qa===q.a):null,max:0,got:0,parts:[],filled:!!(a.chk&&(!q||qa!=null))}}
 ps.forEach((p,i)=>{const v=a['p'+i];let ok=false,mine='',sol='',has=v!=null&&String(v).trim()!=='';
  switch(it.type){
  case'mc':{const sa=[].concat(p.a).slice().sort().join(',');const sv=has?String(v).split(',').sort().join(','):'';ok=has&&sv===sa;mine=has?mcTxt(p,v):'';sol=mcTxt(p,sa);break}
  case'tf':ok=has&&(v==='t')===p.a;mine=has?(v==='t'?u('richtig'):u('falsch')):'';sol=p.a?u('richtig'):u('falsch');break;
  case'gap':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'match':ok=has&&v===p.a;mine=has?v:'';sol=p.a;break;
  case'table':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'calc':{const n=num(v);ok=has&&!isNaN(n)&&Math.abs(n-p.a)<=(p.tol==null?0.01:p.tol);mine=has?v:'';sol=fnum(p.a)+(p.u?' '+p.u:'');if(a['p'+i+'w'])mine+=' | '+u('path')+': '+a['p'+i+'w'];break}
  case'free':{const r=a.r;ok=r==='y'?true:r==='p'?0.5:false;has=has&&!!r;mine=a['p'+i]||'';sol=T(p.m);break}
  }
  res.push({ok,has,mine,sol,why:p.why,q:p.q,p});});
 const per=ps.length?it.pts/ps.length:0;let got=0;res.forEach(r=>{got+=(r.ok===true?1:r.ok===0.5?0.5:0)*per});
 let filled;if(it.type==='free')filled=ps.every((p,i)=>String(a['p'+i]||'').trim()!=='');else filled=res.every(r=>r.has);
 return{type:it.type,parts:res,max:it.pts||0,got,filled,any:res.some(r=>r.has)}}
function tokens(p){const out=[];let idx=0;let m;
 const parts=[];let last=0,s=p;const rg=/\[\[(.+?)\]\]|\{\{(.+?)\}\}/g;while((m=rg.exec(s))){if(m.index>last)parts.push({t:s.slice(last,m.index)});parts.push({t:m[1]||m[2],key:!!m[1]});last=rg.lastIndex}
 if(last<s.length)parts.push({t:s.slice(last)});
 parts.forEach((pt,pi)=>{const prev=parts[pi-1];pt.t.split(/\s+/).filter(Boolean).forEach((w,wi)=>{const att=wi===0&&prev&&!/\s$/.test(prev.t)&&!/^\s/.test(pt.t);out.push({w,key:!!pt.key,i:idx++,att,pu:/^[.,;:!?)“”„"]+$/.test(w)})})});return out}
function allTokens(it){let g=0;return it.paras.map(p=>tokens(p).map(t=>({w:t.w,key:t.key,att:t.att,pu:t.pu,i:g++})))}
function readKeys(it){const k=[];allTokens(it).forEach(ps=>ps.forEach(t=>{if(t.key)k.push(t.i)}));return k}

 info(it){return`<div class="info">${it.html||''}</div>`+(sum(it)?`<div class="vis" lang="${S.lang}">${rich(sum(it))}</div>`:'')},

  return`<p class="vis">${u('tap')}</p>${ps}<div class="actions"><button type="button" class="primary" data-act="rdchk" data-id="${it.id}">${u('chkmark')}</button></div>${quiz}`+(sum(it)?`<p class="vis" lang="${S.lang}">${rich(sum(it))}</p>`:'')},
 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';
   else el=`<input class="in" type="text" data-k="p${i}" data-part="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(8,String([].concat(g.a)[0]).length+2)}" value="${esc(v)}">`;
   html=html.replace('{'+i+'}',el)});
  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},
 match(it){const a=A(it.id);const o=matchOpts(it);return it.rows.map((r,i)=>`<div class="mrow" data-part="${i}"><div><b>${rich(T(r.l))}</b></div><select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${a['p'+i]===x?' selected':''}>${esc(x)}</option>`).join('')+'</select></div>').join('')},
 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{
   if(c&&typeof c==='object'){const i=n++;const o=c.o||(it.colOpts||[])[ci];const v=a['p'+i]||'';const f=o?`<select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>':`<input class="in" type="text" data-k="p${i}" value="${esc(v)}" autocomplete="off">`;
    return`<div class="fld" data-part="${i}"><label>${esc(it.cols[ci])}</label>${f}</div>`}
   return`<div class="fld"><label>${esc(it.cols[ci])}</label><div>${rich(T(c))}</div></div>`}).join('')+'</div>'}).join('')},
 calc(it){const a=A(it.id);return it.parts.map((p,i)=>`<div class="crow" data-part="${i}"><p class="qt">${rich(T(p.q))}</p><input class="in" type="text" inputmode="decimal" data-k="p${i}" value="${esc(a['p'+i]||'')}" autocomplete="off" placeholder="0,00"><span class="u">${esc(p.u||'')}</span>${p.work?`<textarea class="in" data-k="p${i}w" rows="2" style="min-height:4rem" placeholder="${u('workph')}">${esc(a['p'+i+'w']||'')}</textarea>`:''}</div>`).join('')},

window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
