@media(max-width:560px){.top{padding:.3rem .5rem}.top .row{gap:.3rem}.top .ttl{display:none}.pills button{min-height:44px;padding:.2rem .6rem;font-size:.8rem}.pills{border-width:1.5px}.fields{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}html{font-size:calc(16px*var(--fs))}}

<script>
const SHEET={"id":"M8","short":"LF 5 · Modul 8","title":"Modul 8 – Das UWG","sub":"Lernfeld 5 · Werben und den Verkauf fördern","can":[{"de":"Ich kann sagen, wen das UWG schützt und warum es das Gesetz gibt.","vi":"Em có thể nói UWG bảo vệ ai và tại sao có luật này."},{"de":"Ich kann irreführende Werbung, Mondpreise und Lockangebote erkennen und erklären, warum sie unzulässig sind.","vi":"Em có thể nhận ra irreführende Werbung (quảng cáo gây hiểu lầm), Mondpreis (giá ảo) và Lockangebot (hàng mồi) và giải thích tại sao chúng không được phép."},{"de":"Ich kann prüfen, ob vergleichende Werbung in einem Fall zulässig ist.","vi":"Em có thể kiểm tra xem quảng cáo so sánh trong một trường hợp có được phép không."},{"de":"Ich kann aggressive Handlungen und unzumutbare Belästigung an Beispielen erkennen.","vi":"Em có thể nhận ra aggressive Handlungen (hành vi cưỡng ép) và unzumutbare Belästigung (làm phiền quá mức) qua ví dụ."}],"items":[{"id":"a1","no":"Aufgabe 1","type":"free","pts":1,"title":"Ankommen: Was weißt du noch?","instr":{"de":"Beantworte die Fragen aus dem Kopf. Nicht nachschlagen. Es geht darum, was hängengeblieben ist.","vi":"Hãy trả lời bằng trí nhớ, không tra cứu. Điều quan trọng là em còn nhớ được gì."},"tip":{"de":"Denke an Modul 2, 4 und 5, an LF 4 (Preisschild) und an WiSo. Stichworte genügen.","vi":"Hãy nhớ lại Modul 2, 4 và 5, LF 4 (bảng giá) và WiSo. Chỉ cần từ khóa."},"parts":[{"q":"1. Welcher Werbegrundsatz verlangt, dass Werbung keine Unwahrheiten enthält?","m":"Der Grundsatz „klar und wahr“."},{"q":"2. Was muss nach der Preisangabenverordnung auf dem Preisschild stehen? (aus LF 4)","m":"Der Gesamtpreis (mit Umsatzsteuer); bei Waren nach Gewicht oder Volumen zusätzlich der Grundpreis."},{"q":"3. Was legt die Streuzeit fest?","m":"Beginn und Häufigkeit der Werbung sowie den zeitlichen Einsatz von Werbemitteln und Werbeträgern."},{"q":"4. Wie berechnet man die Werberendite?","m":"Umsatzzuwachs × 100 ÷ Werbekosten."},{"q":"5. Ab wann ist man voll geschäftsfähig? (aus WiSo)","m":"Ab 18 Jahren."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)"},"html":"<p>UWG · unlauter · Mitbewerber · Verbraucher · Marktteilnehmer · Wettbewerbsvorteil · schwarze Liste · Herabsetzung · Verunglimpfung · Nachahmung · aggressive Handlung · Entscheidungsfreiheit · geschäftliche Unerfahrenheit · irreführend · Mondpreis · Lockangebot · Bevorratung · vergleichende Werbung · unzumutbare Belästigung · Einwilligung<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"UWG = Luật chống cạnh tranh không lành mạnh · unlauter = không lành mạnh, không công bằng · Mitbewerber = đối thủ cạnh tranh · Verbraucher = người tiêu dùng · Wettbewerbsvorteil = lợi thế cạnh tranh · schwarze Liste = danh sách đen (luôn bị cấm) · Herabsetzung/Verunglimpfung = hạ thấp, bôi nhọ · Nachahmung = làm giả · aggressive Handlung = hành vi cưỡng ép · Entscheidungsfreiheit = quyền tự quyết định · geschäftliche Unerfahrenheit = thiếu kinh nghiệm kinh doanh · irreführend = gây hiểu lầm · Mondpreis = giá ảo · Lockangebot = hàng mồi · Bevorratung = dự trữ hàng · vergleichende Werbung = quảng cáo so sánh · unzumutbare Belästigung = làm phiền quá mức · Einwilligung = sự đồng ý"},{"id":"r1","no":"Lesen 1","type":"read","title":"Wen schützt das UWG?","instr":{"de":"Lies den Text. Tippe an: Wen schützt das UWG? Was ist „unlauter“?","vi":"Em đọc đoạn văn. Chạm vào: UWG bảo vệ ai? “Unlauter” là gì?"},"tip":{"de":"Suche die drei Gruppen und die Wörter, die sagen, wann etwas unlauter ist.","vi":"Tìm ba nhóm người và những từ cho biết khi nào là unlauter."},"paras":["UWG ist die Abkürzung für „Gesetz gegen den unlauteren Wettbewerb“. Es schützt drei Gruppen vor unlauteren geschäftlichen Handlungen: die [[Mitbewerber]], die [[Verbraucher]] und die sonstigen [[Marktteilnehmer]].","Unlauter sind alle geschäftlichen Handlungen, mit denen sich ein Unternehmen einen [[Wettbewerbsvorteil]] verschafft, der [[gesetzlich nicht erlaubt]] ist. Unlautere geschäftliche Handlungen sind [[unzulässig]]."],"vi":"Tóm tắt: UWG bảo vệ 3 nhóm: đối thủ cạnh tranh, người tiêu dùng và các bên khác trên thị trường. Unlauter = một cửa hàng tạo lợi thế mà luật không cho phép. Những hành vi như vậy là cấm (unzulässig).","quiz":{"q":"Wen schützt das UWG?","o":["Mitbewerber, Verbraucher und sonstige Marktteilnehmer","Nur die Hersteller","Nur die Verbraucher"],"a":0,"why":{"de":"Das UWG schützt drei Gruppen: Mitbewerber, Verbraucher und sonstige Marktteilnehmer.","vi":"UWG bảo vệ ba nhóm: đối thủ cạnh tranh, người tiêu dùng và các bên khác trên thị trường."}}},{"id":"w2","type":"info","title":{"de":"Die vier Gruppen und die einzelnen Fälle","vi":"Bốn nhóm và các trường hợp"},"html":"<p>Im Anhang des Gesetzes steht die „schwarze Liste“ mit Handlungen, die immer unzulässig sind. In den §§ 3 bis 7 UWG gibt es vier Gruppen:<br><b>1. Unlautere geschäftliche Handlungen:<\/b> Ein Betrieb verschafft sich einen unerlaubten Vorteil.<br><b>2. Irreführende geschäftliche Handlungen:<\/b> unwahre Angaben oder weggelassene wichtige Informationen.<br><b>3. Unlautere vergleichende Werbung:<\/b> ein unfairer Vergleich mit der Konkurrenz.<br><b>4. Unzumutbare Belästigungen:<\/b> Werbung, obwohl der Empfänger sie nicht will.<\/p><p><b>Gruppe 1 – Herabsetzung/Verunglimpfung:<\/b> Ein Autohändler erzählt, auf dem Dach des gegenüberliegenden Autohauses sitze der Pleitegeier.<br><b>Gruppe 1 – Nachahmung:<\/b> Gefälschte Rolex-Uhren.<br><b>Gruppe 1 – Aggressive Handlung:<\/b> Bei einer „Kaffeefahrt“ werden die Teilnehmer nicht aus dem Raum gelassen. Wer nicht kauft, wird bloßgestellt.<br><b>Gruppe 1 – Ausnutzung geschäftlicher Unerfahrenheit<\/b> (Kinder, Jugendliche): Kurznachricht „Ruf mich zurück, du kannst gewinnen.“<br><b>Gruppe 2 – Irreführende Angaben über das Unternehmen:<\/b> „Größte Goldschmiede Deutschlands“ ist unzulässig, wenn es Konkurrenten mit höherem Umsatz gibt. Stimmt die Angabe, ist sie erlaubt.<br><b>Gruppe 2 – Mondpreis:<\/b> Wanderschuhe für 120,00 EUR, nach drei Tagen „nur 99,00 EUR statt 120,00 EUR“, zwei Tage später wieder 120,00 EUR.<br><b>Gruppe 2 – Lockangebot (nicht ausreichende Bevorratung):<\/b> Pfifferlinge für 4,99 EUR, nur 10 Körbchen je Filiale, nach einer halben Stunde ausverkauft. Angemessen ist ein Vorrat, der im Regelfall zwei Tage reicht.<br><b>Gruppe 2 – Vorenthaltung wesentlicher Informationen:<\/b> Ein Vertreter verschweigt, dass die Bohrmaschine 2. Wahl ist.<br><b>Gruppe 4 – Unzumutbare Belästigung:<\/b> Werbung im Briefkasten trotz „Keine Werbung“-Schild; Werbeanrufe, Anrufmaschinen oder E-Mails ohne Einwilligung.<\/p><div class=\"box merke\"><b>Neu seit 2022: Die 30-Tage-Regel (§ 11 Preisangabenverordnung).<\/b> Wer mit einer Preissenkung wirbt, muss als früheren Preis den niedrigsten Preis der letzten 30 Tage vor der Senkung angeben. Beispiel: Ein Fernseher kostet den ganzen Mai 499 €. Am 1. Juni steigt der Preis auf 599 €. Am 10. Juni wirbt der Laden: „statt 599 € jetzt nur 499 €“. Der niedrigste Preis der letzten 30 Tage war 499 €. Diese Werbung ist unzulässig. Ausnahme: schnell verderbliche Lebensmittel, die kurz vor Ablauf billiger werden.<\/div>","vi":"Có bốn nhóm: 1. hành vi không công bằng (hạ thấp đối thủ, làm giả, ép khách, lợi dụng trẻ em); 2. gây hiểu lầm (thông tin sai, Mondpreis = giá ảo, Lockangebot = hàng mồi không đủ hàng – phải đủ cho khoảng 2 ngày, giấu thông tin quan trọng); 3. so sánh không công bằng; 4. làm phiền quá mức (quảng cáo khi người nhận không muốn, không có Einwilligung = sự đồng ý). Quy tắc 30 ngày: khi quảng cáo giảm giá phải ghi giá thấp nhất trong 30 ngày trước đó."},{"id":"m1","no":"Übung 1","type":"match","pts":0,"title":"Fall und Fachbegriff","instr":{"de":"Ordne jedem Fall den richtigen Fachbegriff zu.","vi":"Em ghép mỗi trường hợp với đúng thuật ngữ."},"tip":{"de":"Lies in der Übersicht oben die Beispiele noch einmal. Achte auf Wörter wie „ausverkauft“, „statt“ und „ohne Einwilligung“.","vi":"Đọc lại các ví dụ trong phần tổng quan. Chú ý những từ như “ausverkauft” (hết hàng), “statt” (thay vì) và “ohne Einwilligung” (không có sự đồng ý)."},"rows":[{"l":"Pfifferlinge für 4,99 €: nur 10 Körbchen je Filiale, nach 30 Minuten ausverkauft","a":"Lockangebot"},{"l":"Wanderschuhe „nur 99 € statt 120 €“; zwei Tage später wieder 120 €","a":"Mondpreis"},{"l":"Gefälschte Rolex-Uhren","a":"Nachahmung"},{"l":"Werbeanruf ohne Einwilligung","a":"Unzumutbare Belästigung"},{"l":"Ein Autohändler spricht vom „Pleitegeier“ beim Konkurrenten","a":"Herabsetzung eines Mitbewerbers"},{"l":"Kaffeefahrt: Teilnehmer werden nicht aus dem Raum gelassen","a":"Aggressive Handlung"}],"extra":["Vorenthaltung wesentlicher Informationen"]},{"id":"w3","type":"info","title":{"de":"Vergleichende Werbung","vi":"Quảng cáo so sánh"},"html":"<p>Vergleichende Werbung ist grundsätzlich zulässig. Sie wird erst <b>unlauter<\/b>, wenn der Vergleich nicht fair ist:<\/p><p>• wenn er <b>unterschiedliche Waren<\/b> oder Dienstleistungen betrifft („Unser Fernseher Typ ABC ist um 20 % günstiger als der Fernseher Typ DEF.“),<br>• wenn er einen Mitbewerber <b>herabsetzt<\/b> oder verunglimpft („Die Möbel der Marke Wertgut sind von minderer Qualität.“),<br>• wenn er Preise für <b>unterschiedliche Mengen oder Qualitäten<\/b> vergleicht („Die Flasche Hohes C kostet beim Discounter 0,70 EUR, bei uns nur 0,65 EUR“, aber 0,75 Liter gegen 1,0 Liter).<\/p><div class=\"box merke\"><b>Merke:<\/b> Gleiche Ware, gleiche Menge, gleiche Qualität. Sonst hinkt der Vergleich und ist unlauter.<\/div>","vi":"Quảng cáo so sánh về nguyên tắc được phép. Nó không công bằng (unlauter) khi: so sánh hàng khác nhau; hạ thấp đối thủ; so sánh giá của lượng hoặc chất lượng khác nhau. Nhớ: cùng hàng, cùng lượng, cùng chất lượng."},{"id":"t1","no":"Lesen 2","type":"tf","pts":0,"title":"Richtig oder falsch?","instr":{"de":"Entscheide: Ist die Aussage richtig oder falsch?","vi":"Em quyết định: câu này đúng hay sai?"},"tip":{"de":"Vergleichen ist erlaubt, wenn es fair ist.","vi":"So sánh được phép nếu công bằng."},"st":[{"t":"Vergleichende Werbung ist grundsätzlich verboten.","a":false,"why":{"de":"Sie ist grundsätzlich zulässig und wird erst unlauter, wenn der Vergleich nicht fair ist.","vi":"Về nguyên tắc nó được phép và chỉ không lành mạnh khi so sánh không công bằng."}},{"t":"Ein beworbener Artikel muss im Regelfall zwei Tage reichen.","a":true},{"t":"Eine wahre Angabe wie „Größte Goldschmiede Deutschlands“ ist erlaubt.","a":true},{"t":"Werbe-E-Mails ohne Einwilligung sind erlaubt, wenn die Adresse gekauft wurde.","a":false,"why":{"de":"Ohne Einwilligung ist E-Mail-Werbung eine unzumutbare Belästigung.","vi":"Không có sự đồng ý thì quảng cáo email là làm phiền quá mức."}}]},{"id":"mc30","no":"Übung 2","type":"mc","pts":0,"title":"Die 30-Tage-Regel","instr":{"de":"Wähle die richtige Antwort. Nutze die 30-Tage-Regel.","vi":"Em chọn đáp án đúng. Dùng quy tắc 30 ngày."},"tip":{"de":"Der frühere Preis ist der niedrigste Preis der letzten 30 Tage vor der Senkung.","vi":"Giá trước đây là giá thấp nhất trong 30 ngày trước khi giảm."},"qs":[{"q":"Eine Jacke kostete den ganzen Mai 79 €. Am 2. Juni steigt der Preis auf 99 €. Am 12. Juni wirbt der Laden: „statt 99 € jetzt nur 79 €“. Ist das zulässig?","o":["Nein. Der niedrigste Preis der letzten 30 Tage war 79 €.","Ja. Der letzte Preis war 99 €.","Ja. Eine Preissenkung ist immer erlaubt."],"a":0,"why":{"de":"Als früherer Preis muss der niedrigste Preis der letzten 30 Tage genannt werden: 79 €.","vi":"Giá trước đây phải là giá thấp nhất trong 30 ngày: 79 €."}},{"q":"Ein Pullover kostete 60 Tage lang 59 €. Am 1. Juli setzt der Laden den Preis auf 49 € herab und wirbt: „statt 59 € jetzt nur 49 €“. Ist das zulässig?","o":["Ja. 59 € war der niedrigste Preis der letzten 30 Tage.","Nein. Man darf nie einen früheren Preis nennen.","Nein. Der Preis muss in Euro und Cent stehen."],"a":0,"why":{"de":"Der niedrigste Preis der letzten 30 Tage vor der Senkung war 59 €. Dieser Preis darf als früherer Preis genannt werden.","vi":"Giá thấp nhất trong 30 ngày trước khi giảm là 59 €. Giá này được phép ghi là giá trước đây."}}]},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: So prüfst du einen Fall","html":"<div class=\"box\"><b>Der Fall:<\/b> Ein Schuhgeschäft bietet Wanderschuhe für 120,00 EUR an. Nach drei Tagen senkt es den Preis auf 99,00 EUR. In der Zeitungsanzeige steht: „Wanderschuhe der Marke G &amp; W für nur 99,00 EUR statt 120,00 EUR.“ Zwei Tage später kostet der Schuh wieder 120,00 EUR.<\/div><p><b>Schritt 1: Wer könnte geschädigt werden?<\/b> Der Verbraucher. Er glaubt, ein Schnäppchen zu machen, und kauft schneller.<\/p><p><b>Schritt 2: In welche der vier Gruppen fällt der Fall?<\/b> In Gruppe 2: irreführende geschäftliche Handlungen. Es wird eine unwahre Angabe gemacht.<\/p><p><b>Schritt 3: Wie heißt der Fall genau?<\/b> Irreführende Werbung mit einem Mondpreis. Der „durchgestrichene“ Preis war nie ein ernsthafter Verkaufspreis.<\/p><p><b>Schritt 4: Was ist die Folge?<\/b> Die Werbung ist unzulässig. Mitbewerber und Verbände können dagegen vorgehen.<\/p><div class=\"box merke\"><b>Ergebnis:<\/b> Immer dieselben vier Schritte: Wer wird geschädigt? Welche Gruppe? Welcher Fall genau? Welche Folge?<\/div>","vi":"Ví dụ mẫu: giày leo núi 120 €, giảm xuống 99 € rồi 2 ngày sau lại 120 €. Bước 1: người tiêu dùng bị thiệt. Bước 2: nhóm 2 (gây hiểu lầm). Bước 3: Mondpreis (giá ảo). Bước 4: quảng cáo bị cấm; đối thủ và hiệp hội có thể kiện."},{"id":"a3","no":"Aufgabe 3","type":"table","pts":1,"title":"Geführte Übung: Verstoß oder nicht?","instr":{"de":"Entscheide jeweils: Liegt ein Verstoß gegen das UWG vor? Wenn ja, wie heißt der Fall?","vi":"Em quyết định: có vi phạm UWG không? Nếu có, trường hợp đó gọi là gì?"},"tip":{"de":"Frage dich: Reicht die Ware für den Ansturm? Wird ein Mitbewerber schlechtgemacht? Stimmt die Angabe? Liegt eine Einwilligung vor?","vi":"Tự hỏi: hàng có đủ cho lượng khách không? Có nói xấu đối thủ không? Thông tin có đúng không? Có sự đồng ý không?"},"cols":["Fall","Verstoß?","Wie heißt der Fall?"],"colOpts":[null,["Ja","Nein"],["Lockangebot (nicht ausreichende Bevorratung)","Unlautere vergleichende Werbung (Herabsetzung)","Mondpreis (irreführende Werbung)","Unzumutbare Belästigung","Kein Verstoß"]],"rows":[["1. Eine Lebensmittelkette bewirbt frische Pfifferlinge für 4,99 EUR je Körbchen. Jede Filiale bekommt zehn Körbchen; nach einer halben Stunde sind sie ausverkauft.",{"a":"Ja"},{"a":"Lockangebot (nicht ausreichende Bevorratung)"}],["2. Ein Möbelhaus wirbt: „Die Möbel der Marke Wertgut sind gegenüber unseren Möbeln von minderer Qualität.“",{"a":"Ja"},{"a":"Unlautere vergleichende Werbung (Herabsetzung)"}],["3. Ein Juwelier wirbt mit „Größte Goldschmiede Deutschlands“. Er kann nachweisen, dass sein Unternehmen tatsächlich den höchsten Umsatz in Deutschland erzielt.",{"a":"Nein"},{"a":"Kein Verstoß"}],["4. Ein Versicherungsunternehmen schickt Werbe-E-Mails an alle Verbraucher, deren Adresse es gekauft hat. Eine Einwilligung liegt nicht vor.",{"a":"Ja"},{"a":"Unzumutbare Belästigung"}]]},{"id":"a4","no":"Aufgabe 4","type":"free","pts":1,"title":"Freie Übung","instr":{"de":"Beantworte die Fragen in eigenen Worten.","vi":"Em trả lời các câu hỏi bằng lời của mình."},"tip":{"de":"Bei Frage 4 und 5 findest du Hinweise in der Übersicht oben. Bei Frage 6: Briefkasten, Telefon, E-Mail.","vi":"Câu 4 và 5: gợi ý có trong phần tổng quan ở trên. Câu 6: hộp thư, điện thoại, email."},"parts":[{"q":"1. Wofür steht die Abkürzung UWG?","m":"Gesetz gegen den unlauteren Wettbewerb."},{"q":"2. Wen schützt das UWG? Nenne drei Gruppen.","m":"Die Mitbewerber, die Verbraucher und die sonstigen Marktteilnehmer. Zugleich schützt es das Interesse der Allgemeinheit an einem unverfälschten Wettbewerb."},{"q":"3. Erkläre mit eigenen Worten, wann eine geschäftliche Handlung unlauter ist.","m":"Wenn sich ein Unternehmen damit einen Wettbewerbsvorteil verschafft, der gesetzlich nicht erlaubt ist.","s":["Eine Handlung ist unlauter, wenn …"]},{"q":"4. Was ist ein Mondpreis?","m":"Ein hoher Preis, der nur kurz gesetzt wird, damit der spätere „Aktionspreis“ als große Ersparnis erscheint. Das ist irreführende Werbung."},{"q":"5. Wie lange muss ein beworbener Artikel im Regelfall vorrätig sein, damit kein Lockangebot vorliegt?","m":"Der Warenvorrat muss im Regelfall zwei Tage reichen."},{"q":"6. Nenne zwei Beispiele für unzumutbare Belästigung.","m":"Zum Beispiel: Werbematerial im Briefkasten trotz „Keine Werbung“-Schild; Werbeanrufe ohne Einwilligung; E-Mails oder Anrufmaschinen ohne Einwilligung; Nachrichten mit verschleiertem Absender."}]},{"id":"a5","no":"Aufgabe 5","type":"free","pts":1,"title":"Aus deinem Betrieb","instr":{"de":"Sieh dir drei Werbeaussagen oder Preisauszeichnungen in deinem Ausbildungsbetrieb an (Schaufenster, Regal, Prospekt). Notiere sie und prüfe, ob sie nach dem UWG zulässig wären.","vi":"Xem ba câu quảng cáo hoặc bảng giá ở cửa hàng nơi em thực tập (tủ kính, kệ, tờ rơi). Ghi lại và kiểm tra xem chúng có được phép theo UWG không."},"tip":{"de":"Schreibe die Aussage genau auf. Prüfe sie mit den vier Schritten aus Aufgabe 2.","vi":"Viết chính xác câu quảng cáo. Kiểm tra bằng bốn bước ở Aufgabe 2."},"parts":[{"q":"Meine drei Aussagen und meine Prüfung:","m":"Individuelle Lösung. Erwartet werden drei konkret zitierte Aussagen und zu jeder eine Einschätzung mit Begründung, die einen der Fälle aus der Tabelle benennt.","s":["Die Aussage lautet: „…“","Das ist zulässig / unzulässig, weil …"]}]},{"id":"a6","no":"Aufgabe 6","type":"info","title":"Escape Room „Die Werbeagentur“ (4 Punkte, eigene Datei)","html":"<p>Du machst ein Praktikum in der Werbeagentur Nordlicht. Sechs Werbeentwürfe liegen im Tresor, und der Tresor hat ein sechsstelliges Zahlenschloss. Jede Station ist ein Fall. Wer ihn richtig einordnet, bekommt eine Ziffer.<\/p><p><a href=\"../LF5_M_8_Escape_Room.html\" style=\"font-weight:700\">▶ Escape Room öffnen<\/a> (eigene Datei, etwa 25 Minuten, allein oder zu zweit). Die Punkte gibt es für den geöffneten Tresor. Notiere die Zahl der Fehlversuche.<\/p><div class=\"box merke\"><b>STOPP – Für Selbstlerner · Pflicht-Stopp 3 · UWG mündlich.<\/b> Zeig deiner Lehrkraft die Urkunde aus dem Escape Room und die Zahl deiner Fehlversuche. Dann beurteilst du zwei Werbefälle mündlich: erlaubt oder nicht? Nenne den Fachbegriff und begründe, auch mit der 30-Tage-Regel.<\/div>","vi":"Escape Room là một tệp riêng (khoảng 25 phút). Em giải mỗi trường hợp để nhận một chữ số; sáu chữ số mở được két. Ghi lại số lần thử sai. Dừng lại (tự học): cho cô giáo xem chứng nhận và nói miệng hai trường hợp: được phép hay không? Nêu thuật ngữ và giải thích, kể cả quy tắc 30 ngày."},{"id":"a7","no":"Aufgabe 7","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh."},"tip":{"de":"7.1: Wird der Herr unter Druck gesetzt? 7.2: Waggon oder Kiste? 7.3: Kinder durchschauen Werbeabsichten nicht so gut.","vi":"7.1: ông cụ có bị gây áp lực không? 7.2: toa tàu hay thùng? 7.3: trẻ em khó nhận ra ý đồ quảng cáo."},"parts":[{"q":"7.1 Ein älterer Herr fährt bei einer kostenlosen „Jubiläumsfahrt“ mit. Kurz vor der Rückfahrt bietet der Veranstalter Heizdecken an. Der Herr kauft nicht. Daraufhin stellt ihm der Veranstalter 25,00 EUR Fahrtkostenanteil in Rechnung, weil er nichts gekauft habe. Liegt ein Verstoß gegen das UWG vor? Begründe.","m":"Ja. Die Fahrt wurde als kostenlos angeboten; die nachträgliche Rechnung setzt den Teilnehmer unter Druck, doch noch zu kaufen. Das beeinträchtigt die Entscheidungsfreiheit des Verbrauchers durch eine aggressive Handlung und ist unzulässig. Zusätzlich ist die Ankündigung „kostenlos“ irreführend, wenn im Fall des Nichtkaufs doch gezahlt werden muss."},{"q":"7.2 Eine Zeitungsanzeige lautet: „Sonderangebot! 5 Waggons Apfelsinen eingetroffen!“ Tatsächlich waren es fünf Kisten. Ist die Anzeige zulässig?","m":"Nein. Fünf Waggons sind ein Vielfaches von fünf Kisten – das ist eine unwahre Angabe und damit eine irreführende geschäftliche Handlung. Außerdem wird mit einer Menge geworben, die gar nicht vorhanden ist; die Bevorratung reicht nicht aus, es handelt sich zugleich um ein Lockangebot."},{"q":"7.3 Warum verbietet das UWG die Ausnutzung geschäftlicher Unerfahrenheit von Kindern und Jugendlichen besonders – obwohl Werbung doch immer überzeugen will?","m":"Weil Kinder und Jugendliche den Wert von Angeboten, versteckte Kosten und Werbeabsichten noch nicht sicher einschätzen können. Werbung darf überzeugen – aber sie darf diese Unerfahrenheit nicht gezielt ausnutzen, etwa mit Gewinnversprechen per Kurznachricht, hinter denen teure Rückrufnummern stecken."}]},{"id":"v1","level":"v","no":"Vertiefung 1","type":"free","pts":1,"title":"Warum ist das so?","instr":{"de":"Warum ist Vergleichen in der Werbung erlaubt, Schlechtmachen aber nicht? Begründe.","vi":"Tại sao so sánh trong quảng cáo được phép, nhưng nói xấu thì không? Hãy giải thích."},"tip":{"de":"Denke an die Merkregel: gleiche Ware, gleiche Menge, gleiche Qualität. Und: Wer wird geschützt?","vi":"Nghĩ đến quy tắc: cùng hàng, cùng lượng, cùng chất lượng. Và: ai được bảo vệ?"},"parts":[{"q":"Meine Begründung:","m":"Ein fairer Vergleich informiert den Verbraucher. Wenn Ware, Menge und Qualität gleich sind, kann er besser entscheiden. Das Schlechtmachen (Herabsetzung) schadet dem Mitbewerber und täuscht den Verbraucher. Das UWG schützt beide.","s":["Vergleichen ist erlaubt, weil …","Schlechtmachen ist verboten, weil …"]}]},{"id":"v2","level":"v","no":"Vertiefung 2","type":"free","pts":1,"title":"Begründe deine Entscheidung","instr":{"de":"Ein Händler wirbt: „Unser Kaffee, 500 g, kostet 4,49 €. Beim Konkurrenten kostet der Kaffee, 250 g, 2,49 €.“ Ist der Vergleich zulässig? Begründe.","vi":"Một người bán quảng cáo: “Cà phê của chúng tôi, 500 g, giá 4,49 €. Ở đối thủ, cà phê 250 g giá 2,49 €.” So sánh này có được phép không? Hãy giải thích."},"tip":{"de":"Vergleiche die Mengen. Rechne den Preis für gleiche Menge um, wenn du magst.","vi":"So sánh khối lượng. Nếu muốn, hãy quy đổi giá về cùng một khối lượng."},"parts":[{"q":"Meine Entscheidung und meine Begründung:","m":"Nicht zulässig, denn die Mengen sind verschieden (500 g gegen 250 g). Ein Preisvergleich ist nur bei gleicher Ware, gleicher Menge und gleicher Qualität fair. Bei gleicher Menge wäre die Werbung erlaubt.","s":["Der Vergleich ist (nicht) zulässig, weil …"]}]}]};
</script>

const UI={

   if(it.type==='calc'&&p.steps)line+=`<div class="steps"><b>${u('path')}:</b>`+p.steps.map(s=>`<div>${esc(T(s))}</div>`).join('')+'</div>';
   return line+'</li>'}).join('');
  if(it.why&&!full)li+=`<li><small>${u('why')}: ${rich(T(it.why))}</small></li>`;
  if(it.type==='free'&&g.parts.some(r=>!r.has))li+=`<li><small>${u('unrated')}</small></li>`;
  return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))}${it.level==='v'?' ('+u('vert')+')':''} <span class="st ${cls}">${it.pts?fmt(g.got)+' / '+fmt(g.max):''}</span></h4><ul>${li}</ul></div>`}).join('');
 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}
/* ---------- Ereignisse ---------- */
function cardOf(e){const c=e.closest('.card');return c?D.items.find(x=>x.id===c.dataset.id):null}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();return}if(t.id==='dt'){S.date=t.value;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.rate){const it=cardOf(t);A(it.id)[t.dataset.k]=t.dataset.rate;$$('[data-k="'+t.dataset.k+'"]',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));progress();save();return}
 const act=t.dataset.act;if(!act)return;const it=D.items.find(x=>x.id===t.dataset.id);
 if(act==='check'){S.checked[it.id]=true;paint(it);progress();save()}
 if(act==='rdchk'){A(it.id).chk=true;const c=$('#c_'+it.id);const keep=window.scrollY;const fbk=true;renderCard(it);paint(it);window.scrollTo(0,keep);progress();save()}
 if(act==='model'){S.shown[it.id]=true;renderCard(it);progress();save()}
});
function renderCard(it){const old=$('#c_'+it.id);const tmp=document.createElement('div');tmp.innerHTML=cardHtml(it);const det=old.querySelector('.tip').open;old.replaceWith(tmp.firstChild);if(S.checked[it.id]||it.type==='read')paint(it)}
function evaluate(){renderResult();$('#result').scrollIntoView({behavior:'smooth'})}
$('#b_eval').onclick=evaluate;
$('#b_pdf').onclick=()=>{renderResult();setTimeout(()=>window.print(),100)};
$('#b_restart').onclick=()=>$('#modal').classList.add('on');
$('#m_no').onclick=()=>$('#modal').classList.remove('on');
$('#m_yes').onclick=()=>{$('#modal').classList.remove('on');S=def();clearStore();$('#nm').value='';$('#dt').value=S.date;renderAll();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',()=>{$$('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})});
/* ---------- Start ---------- */
const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a['r'+i]=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();

</script>
