<style>

<script>
const SHEET={"id":"M8","short":"LF 5 · Modul 8","title":"Modul 8 – Das UWG","sub":"Lernfeld 5 · Werben und den Verkauf fördern","can":[{"de":"Ich kann sagen, wen das UWG schützt und warum es das Gesetz gibt.","vi":"Em có thể nói UWG bảo vệ ai và tại sao có luật này.","tr":"UWG'nin kimi koruduğunu ve bu kanunun neden var olduğunu söyleyebilirim.","ar":"يمكنني أن أقول من يحميه قانون UWG ولماذا يوجد هذا القانون.","ti":"UWG ንመን ከም ዝሕሉን ስለምንታይ እዚ ሕጊ ከም ዘሎን ክብል እኽእል።","uk":"Я можу сказати, кого захищає UWG і чому існує цей закон.","ru":"Я могу сказать, кого защищает UWG и зачем существует этот закон.","es":"Puedo decir a quién protege la UWG y por qué existe esta ley.","pt":"Consigo dizer quem a UWG protege e porque existe esta lei."},{"de":"Ich kann irreführende Werbung, Mondpreise und Lockangebote erkennen und erklären, warum sie unzulässig sind.","vi":"Em có thể nhận ra irreführende Werbung (quảng cáo gây hiểu lầm), Mondpreis (giá ảo) và Lockangebot (hàng mồi) và giải thích tại sao chúng không được phép.","tr":"Irreführende Werbung (yanıltıcı reklam), Mondpreis (hayali fiyat) ve Lockangebot (tuzak teklif) kavramlarını tanıyabilir ve neden yasak olduklarını açıklayabilirim.","ar":"يمكنني التعرف على irreführende Werbung (الإعلان المضلِّل) وMondpreis (السعر الوهمي) وLockangebot (عرض الإغراء) وشرح سبب عدم السماح بها.","ti":"Irreführende Werbung (ዘሳስት ምልክታ)፣ Mondpreis (ሓሶታዊ ዋጋ) ከምኡውን Lockangebot (ዘጓትት ኣቕራቦ) ከለልይ፣ ስለምንታይ ዘይፍቀዱ ከም ዝኾኑ ድማ ክገልጽ እኽእል።","uk":"Я можу розпізнати irreführende Werbung (оманливу рекламу), Mondpreis (фіктивну ціну) і Lockangebot (приманку-пропозицію) та пояснити, чому вони заборонені.","ru":"Я могу распознать irreführende Werbung (вводящую в заблуждение рекламу), Mondpreis (фиктивную цену) и Lockangebot (заманивающее предложение) и объяснить, почему они запрещены.","es":"Puedo reconocer irreführende Werbung (publicidad engañosa), Mondpreis (precio ficticio) y Lockangebot (oferta señuelo) y explicar por qué no están permitidos.","pt":"Consigo reconhecer irreführende Werbung (publicidade enganosa), Mondpreis (preço fictício) e Lockangebot (oferta isco) e explicar porque não são permitidos."},{"de":"Ich kann prüfen, ob vergleichende Werbung in einem Fall zulässig ist.","vi":"Em có thể kiểm tra xem quảng cáo so sánh trong một trường hợp có được phép không.","tr":"Karşılaştırmalı reklamın (vergleichende Werbung) bir durumda izinli olup olmadığını kontrol edebilirim.","ar":"يمكنني التحقق مما إذا كان الإعلان المقارن (vergleichende Werbung) جائزًا في حالة معينة.","ti":"ኣብ ሓደ ጉዳይ vergleichende Werbung (ምንጽጻራዊ ምልክታ) ዝፍቀድ ድኣ ዘይፍቀድ ክምርምር እኽእል።","uk":"Я можу перевірити, чи дозволена порівняльна реклама (vergleichende Werbung) у конкретному випадку.","ru":"Я могу проверить, допустима ли сравнительная реклама (vergleichende Werbung) в конкретном случае.","es":"Puedo comprobar si la publicidad comparativa (vergleichende Werbung) está permitida en un caso.","pt":"Consigo verificar se a publicidade comparativa (vergleichende Werbung) é permitida num caso."},{"de":"Ich kann aggressive Handlungen und unzumutbare Belästigung an Beispielen erkennen.","vi":"Em có thể nhận ra aggressive Handlungen (hành vi cưỡng ép) và unzumutbare Belästigung (làm phiền quá mức) qua ví dụ.","tr":"Aggressive Handlungen (zorlayıcı davranışlar) ve unzumutbare Belästigung (katlanılamaz rahatsız etme) kavramlarını örneklerde tanıyabilirim.","ar":"يمكنني التعرف من خلال أمثلة على aggressive Handlungen (التصرفات العدوانية) وunzumutbare Belästigung (الإزعاج غير المقبول).","ti":"Aggressive Handlungen (ጉልበታዊ ተግባራት) ከምኡውን unzumutbare Belästigung (ዘይግቡእ ምርባሽ) ብኣብነታት ክለልይ እኽእል።","uk":"Я можу розпізнати на прикладах aggressive Handlungen (агресивні дії) та unzumutbare Belästigung (неприпустиме набридання).","ru":"Я могу распознать на примерах aggressive Handlungen (агрессивные действия) и unzumutbare Belästigung (недопустимое навязчивое беспокойство).","es":"Puedo reconocer con ejemplos aggressive Handlungen (acciones agresivas) y unzumutbare Belästigung (molestia inaceptable).","pt":"Consigo reconhecer, através de exemplos, aggressive Handlungen (ações agressivas) e unzumutbare Belästigung (incómodo inaceitável)."}],"items":[{"id":"a1","no":"Aufgabe 1","type":"free","pts":1,"title":"Ankommen: Was weißt du noch?","instr":{"de":"Beantworte die Fragen aus dem Kopf. Nicht nachschlagen. Es geht darum, was hängengeblieben ist.","vi":"Hãy trả lời bằng trí nhớ, không tra cứu. Điều quan trọng là em còn nhớ được gì.","tr":"Soruları ezbere cevapla. Bakma. Önemli olan aklında ne kaldığıdır.","ar":"أجب عن الأسئلة من الذاكرة. لا تبحث في المراجع. المهم هو ما بقي في ذهنك.","ti":"ነቶም ሕቶታት ብዘክሮኻ መልስ። ኣይትመርምር። ዝረአ ኣብ ኣእምሮኻ እንታይ ከም ዝተረፈ እዩ።","uk":"Відповідай на запитання по пам'яті. Не підглядай. Важливо, що в тебе залишилося в голові.","ru":"Отвечай на вопросы по памяти. Не подглядывай. Важно, что у тебя осталось в голове.","es":"Responde las preguntas de memoria. No busques. Lo importante es lo que has retenido.","pt":"Responde às perguntas de memória. Não consultes. O importante é o que ficou na tua cabeça."},"tip":{"de":"Denke an Modul 2, 4 und 5, an LF 4 (Preisschild) und an WiSo. Stichworte genügen.","vi":"Hãy nhớ lại Modul 2, 4 và 5, LF 4 (bảng giá) và WiSo. Chỉ cần từ khóa.","tr":"Modul 2, 4 ve 5'i, LF 4'ü (fiyat etiketi) ve WiSo'yu düşün. Anahtar kelimeler yeterli.","ar":"تذكّر Modul 2 و4 و5 وLF 4 (بطاقة السعر) وWiSo. تكفي الكلمات المفتاحية.","ti":"ኣብ Modul 2, 4 ን 5፣ ኣብ LF 4 (ናይ ዋጋ ወረቐት) ን WiSo ሓስብ። ቃላት ቁልፊ ጥራይ ይኣክል።","uk":"Згадай Modul 2, 4 і 5, LF 4 (цінник) та WiSo. Достатньо ключових слів.","ru":"Вспомни Modul 2, 4 и 5, LF 4 (ценник) и WiSo. Достаточно ключевых слов.","es":"Piensa en el Modul 2, 4 y 5, en LF 4 (etiqueta de precio) y en WiSo. Bastan palabras clave.","pt":"Pensa no Modul 2, 4 e 5, em LF 4 (etiqueta de preço) e em WiSo. Bastam palavras-chave."},"parts":[{"q":"1. Welcher Werbegrundsatz verlangt, dass Werbung keine Unwahrheiten enthält?","m":"Der Grundsatz „klar und wahr“."},{"q":"2. Was muss nach der Preisangabenverordnung auf dem Preisschild stehen? (aus LF 4)","m":"Der Gesamtpreis (mit Umsatzsteuer); bei Waren nach Gewicht oder Volumen zusätzlich der Grundpreis."},{"q":"3. Was legt die Streuzeit fest?","m":"Beginn und Häufigkeit der Werbung sowie den zeitlichen Einsatz von Werbemitteln und Werbeträgern."},{"q":"4. Wie berechnet man die Werberendite?","m":"Umsatzzuwachs × 100 ÷ Werbekosten."},{"q":"5. Ab wann ist man voll geschäftsfähig? (aus WiSo)","m":"Ab 18 Jahren."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)","tr":"Wortspeicher (kelime deposu)","ar":"Wortspeicher (مخزن الكلمات)","ti":"Wortspeicher (መኽዘን ቃላት)","uk":"Wortspeicher (склад слів)","ru":"Wortspeicher (запас слов)","es":"Wortspeicher (banco de palabras)","pt":"Wortspeicher (banco de palavras)"},"html":"<p>UWG · unlauter · Mitbewerber · Verbraucher · Marktteilnehmer · Wettbewerbsvorteil · schwarze Liste · Herabsetzung · Verunglimpfung · Nachahmung · aggressive Handlung · Entscheidungsfreiheit · geschäftliche Unerfahrenheit · irreführend · Mondpreis · Lockangebot · Bevorratung · vergleichende Werbung · unzumutbare Belästigung · Einwilligung<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"UWG = Luật chống cạnh tranh không lành mạnh · unlauter = không lành mạnh, không công bằng · Mitbewerber = đối thủ cạnh tranh · Verbraucher = người tiêu dùng · Wettbewerbsvorteil = lợi thế cạnh tranh · schwarze Liste = danh sách đen (luôn bị cấm) · Herabsetzung/Verunglimpfung = hạ thấp, bôi nhọ · Nachahmung = làm giả · aggressive Handlung = hành vi cưỡng ép · Entscheidungsfreiheit = quyền tự quyết định · geschäftliche Unerfahrenheit = thiếu kinh nghiệm kinh doanh · irreführend = gây hiểu lầm · Mondpreis = giá ảo · Lockangebot = hàng mồi · Bevorratung = dự trữ hàng · vergleichende Werbung = quảng cáo so sánh · unzumutbare Belästigung = làm phiền quá mức · Einwilligung = sự đồng ý","sum":{"tr":"UWG = haksız rekabete karşı kanun · unlauter = haksız, dürüst olmayan · Mitbewerber = rakip · Verbraucher = tüketici · Wettbewerbsvorteil = rekabet avantajı · schwarze Liste = kara liste (her zaman yasak) · Herabsetzung/Verunglimpfung = küçük düşürme, kötüleme · Nachahmung = taklit · aggressive Handlung = zorlayıcı davranış · Entscheidungsfreiheit = karar özgürlüğü · geschäftliche Unerfahrenheit = ticari tecrübesizlik · irreführend = yanıltıcı · Mondpreis = hayali fiyat · Lockangebot = tuzak teklif · Bevorratung = stok bulundurma · vergleichende Werbung = karşılaştırmalı reklam · unzumutbare Belästigung = katlanılamaz rahatsız etme · Einwilligung = izin, onay","ar":"UWG = قانون مكافحة المنافسة غير النزيهة · unlauter = غير نزيه · Mitbewerber = منافس · Verbraucher = مستهلك · Wettbewerbsvorteil = ميزة تنافسية · schwarze Liste = القائمة السوداء (محظورة دائمًا) · Herabsetzung/Verunglimpfung = الحطّ من القدر، التشويه · Nachahmung = التقليد · aggressive Handlung = تصرف عدواني · Entscheidungsfreiheit = حرية القرار · geschäftliche Unerfahrenheit = قلة الخبرة التجارية · irreführend = مضلِّل · Mondpreis = سعر وهمي · Lockangebot = عرض إغراء · Bevorratung = تخزين البضاعة · vergleichende Werbung = إعلان مقارن · unzumutbare Belästigung = إزعاج غير مقبول · Einwilligung = موافقة","ti":"UWG = ሕጊ ኣንጻር ዘይቕኑዕ ውድድር · unlauter = ዘይቕኑዕ · Mitbewerber = ተወዳዳሪ · Verbraucher = ተጠቃሚ · Wettbewerbsvorteil = ጥቕሚ ውድድር · schwarze Liste = ጸሊም ዝርዝር (ኩሉ ጊዜ ክልኩል) · Herabsetzung/Verunglimpfung = ምንዕዓቕ፣ ምጽላእ · Nachahmung = ምምስሳል · aggressive Handlung = ጉልበታዊ ተግባር · Entscheidungsfreiheit = ናጽነት ውሳኔ · geschäftliche Unerfahrenheit = ናይ ንግዲ ተሞክሮ ዘይምህላው · irreführend = ዘሳስት · Mondpreis = ሓሶታዊ ዋጋ · Lockangebot = ዘጓትት ኣቕራቦ · Bevorratung = ምዕቃብ ዕቃ · vergleichende Werbung = ምንጽጻራዊ ምልክታ · unzumutbare Belästigung = ዘይግቡእ ምርባሽ · Einwilligung = ፍቓድ","uk":"UWG = закон про захист від недобросовісної конкуренції · unlauter = нечесний, недобросовісний · Mitbewerber = конкурент · Verbraucher = споживач · Wettbewerbsvorteil = конкурентна перевага · schwarze Liste = чорний список (завжди заборонено) · Herabsetzung/Verunglimpfung = приниження, очорнення · Nachahmung = підробка, наслідування · aggressive Handlung = агресивна дія · Entscheidungsfreiheit = свобода вибору · geschäftliche Unerfahrenheit = відсутність досвіду в торгівлі · irreführend = оманливий · Mondpreis = фіктивна ціна · Lockangebot = приманка-пропозиція · Bevorratung = запас товару · vergleichende Werbung = порівняльна реклама · unzumutbare Belästigung = неприпустиме набридання · Einwilligung = згода","ru":"UWG = закон о борьбе с недобросовестной конкуренцией · unlauter = недобросовестный, нечестный · Mitbewerber = конкурент · Verbraucher = потребитель · Wettbewerbsvorteil = конкурентное преимущество · schwarze Liste = чёрный список (всегда запрещено) · Herabsetzung/Verunglimpfung = унижение, очернение · Nachahmung = подделка, подражание · aggressive Handlung = агрессивное действие · Entscheidungsfreiheit = свобода выбора · geschäftliche Unerfahrenheit = отсутствие опыта в торговле · irreführend = вводящий в заблуждение · Mondpreis = фиктивная цена · Lockangebot = заманивающее предложение · Bevorratung = запас товара · vergleichende Werbung = сравнительная реклама · unzumutbare Belästigung = недопустимое навязчивое беспокойство · Einwilligung = согласие","es":"UWG = ley contra la competencia desleal · unlauter = desleal · Mitbewerber = competidor · Verbraucher = consumidor · Wettbewerbsvorteil = ventaja competitiva · schwarze Liste = lista negra (siempre prohibido) · Herabsetzung/Verunglimpfung = menosprecio, denigración · Nachahmung = imitación · aggressive Handlung = acción agresiva · Entscheidungsfreiheit = libertad de decisión · geschäftliche Unerfahrenheit = inexperiencia comercial · irreführend = engañoso · Mondpreis = precio ficticio · Lockangebot = oferta señuelo · Bevorratung = existencias · vergleichende Werbung = publicidad comparativa · unzumutbare Belästigung = molestia inaceptable · Einwilligung = consentimiento","pt":"UWG = lei contra a concorrência desleal · unlauter = desleal · Mitbewerber = concorrente · Verbraucher = consumidor · Wettbewerbsvorteil = vantagem competitiva · schwarze Liste = lista negra (sempre proibido) · Herabsetzung/Verunglimpfung = depreciação, difamação · Nachahmung = imitação · aggressive Handlung = ação agressiva · Entscheidungsfreiheit = liberdade de decisão · geschäftliche Unerfahrenheit = inexperiência comercial · irreführend = enganoso · Mondpreis = preço fictício · Lockangebot = oferta isco · Bevorratung = existências · vergleichende Werbung = publicidade comparativa · unzumutbare Belästigung = incómodo inaceitável · Einwilligung = consentimento"}},{"id":"r1","no":"Lesen 1","type":"read","title":"Wen schützt das UWG?","instr":{"de":"Lies den Text. Tippe an: Wen schützt das UWG? Was ist „unlauter“?","vi":"Em đọc đoạn văn. Chạm vào: UWG bảo vệ ai? “Unlauter” là gì?","tr":"Metni oku. Dokun: UWG kimi korur? „Unlauter“ (haksız, dürüst olmayan) ne demek?","ar":"اقرأ النص. المس: من يحميه قانون UWG؟ ما معنى „unlauter“ (غير نزيه)؟","ti":"እቲ ጽሑፍ ኣንብብ። ተንከፍ፡ UWG ንመን ይሕሉ? „Unlauter“ (ዘይቕኑዕ) እንታይ ማለት እዩ?","uk":"Прочитай текст. Торкнись: Кого захищає UWG? Що таке „unlauter“ (нечесний)?","ru":"Прочитай текст. Коснись: Кого защищает UWG? Что такое „unlauter“ (недобросовестный)?","es":"Lee el texto. Toca: ¿A quién protege la UWG? ¿Qué es „unlauter“ (desleal)?","pt":"Lê o texto. Toca: Quem protege a UWG? O que é „unlauter“ (desleal)?"},"tip":{"de":"Suche die drei Gruppen und die Wörter, die sagen, wann etwas unlauter ist.","vi":"Tìm ba nhóm người và những từ cho biết khi nào là unlauter.","tr":"Üç grubu ve bir şeyin ne zaman unlauter olduğunu söyleyen kelimeleri bul.","ar":"ابحث عن المجموعات الثلاث وعن الكلمات التي تبيّن متى يكون الشيء unlauter.","ti":"እተን ሰለስተ ጉጅለታትን እቶም unlauter ክኸውን ከሎ ዝገልጹ ቃላትን ድለ።","uk":"Знайди три групи та слова, які кажуть, коли щось є unlauter.","ru":"Найди три группы и слова, которые говорят, когда что-то является unlauter.","es":"Busca los tres grupos y las palabras que dicen cuándo algo es unlauter.","pt":"Procura os três grupos e as palavras que dizem quando algo é unlauter."},"paras":["UWG ist die Abkürzung für „Gesetz gegen den unlauteren Wettbewerb“. Es schützt drei Gruppen vor unlauteren geschäftlichen Handlungen: die [[Mitbewerber]], die [[Verbraucher]] und die sonstigen [[Marktteilnehmer]].","Unlauter sind alle geschäftlichen Handlungen, mit denen sich ein Unternehmen einen [[Wettbewerbsvorteil]] verschafft, der [[gesetzlich nicht erlaubt]] ist. Unlautere geschäftliche Handlungen sind [[unzulässig]]."],"vi":"Tóm tắt: UWG bảo vệ 3 nhóm: đối thủ cạnh tranh, người tiêu dùng và các bên khác trên thị trường. Unlauter = một cửa hàng tạo lợi thế mà luật không cho phép. Những hành vi như vậy là cấm (unzulässig).","quiz":{"q":"Wen schützt das UWG?","o":["Mitbewerber, Verbraucher und sonstige Marktteilnehmer","Nur die Hersteller","Nur die Verbraucher"],"a":0,"why":{"de":"Das UWG schützt drei Gruppen: Mitbewerber, Verbraucher und sonstige Marktteilnehmer.","vi":"UWG bảo vệ ba nhóm: đối thủ cạnh tranh, người tiêu dùng và các bên khác trên thị trường.","tr":"UWG üç grubu korur: Mitbewerber (rakipler), Verbraucher (tüketiciler) ve diğer piyasa katılımcıları.","ar":"يحمي قانون UWG ثلاث مجموعات: Mitbewerber (المنافسين) وVerbraucher (المستهلكين) وسائر المشاركين في السوق.","ti":"UWG ንሰለስተ ጉጅለታት ይሕሉ፡ Mitbewerber (ተወዳደርቲ)፣ Verbraucher (ተጠቃሚ) ን ካልኦት ተሳተፍቲ ዕዳጋ።","uk":"UWG захищає три групи: Mitbewerber (конкурентів), Verbraucher (споживачів) та інших учасників ринку.","ru":"UWG защищает три группы: Mitbewerber (конкурентов), Verbraucher (потребителей) и других участников рынка.","es":"La UWG protege a tres grupos: Mitbewerber (competidores), Verbraucher (consumidores) y otros participantes del mercado.","pt":"A UWG protege três grupos: Mitbewerber (concorrentes), Verbraucher (consumidores) e outros participantes no mercado."}},"sum":{"tr":"Özet: UWG 3 grubu korur: rakipleri, tüketicileri ve piyasadaki diğer katılımcıları. Unlauter = bir işletme, kanunun izin vermediği bir avantaj sağlar. Böyle davranışlar yasaktır (unzulässig).","ar":"ملخص: يحمي قانون UWG ثلاث مجموعات: المنافسين والمستهلكين وسائر المشاركين في السوق. Unlauter = منشأة تحصل على ميزة لا يسمح بها القانون. هذه التصرفات ممنوعة (unzulässig).","ti":"ማጠቃለሊ: UWG ሰለስተ ጉጅለታት ይሕሉ፡ ተወዳደርቲ፣ ተጠቃሚን ካልኦት ተሳተፍቲ ዕዳጋን። Unlauter = ሓደ ንግዳዊ ትካል ሕጊ ዘይፈቅዶ ጥቕሚ ይረክብ። ከምዚ ዝኣመሰለ ተግባር ክልኩል እዩ (unzulässig)።","uk":"Підсумок: UWG захищає 3 групи: конкурентів, споживачів та інших учасників ринку. Unlauter = підприємство отримує перевагу, яку закон не дозволяє. Такі дії заборонені (unzulässig).","ru":"Кратко: UWG защищает 3 группы: конкурентов, потребителей и других участников рынка. Unlauter = предприятие получает преимущество, которое закон не разрешает. Такие действия запрещены (unzulässig).","es":"Resumen: La UWG protege a 3 grupos: los competidores, los consumidores y otros participantes del mercado. Unlauter = una empresa obtiene una ventaja que la ley no permite. Estas acciones están prohibidas (unzulässig).","pt":"Resumo: A UWG protege 3 grupos: os concorrentes, os consumidores e outros participantes no mercado. Unlauter = uma empresa obtém uma vantagem que a lei não permite. Estas ações são proibidas (unzulässig)."}},{"id":"w2","type":"info","title":{"de":"Die vier Gruppen und die einzelnen Fälle","vi":"Bốn nhóm và các trường hợp","tr":"Dört grup ve tek tek durumlar","ar":"المجموعات الأربع والحالات المنفردة","ti":"እቶም ኣርባዕተ ጉጅለታትን ነናቱ ጉዳያትን","uk":"Чотири групи та окремі випадки","ru":"Четыре группы и отдельные случаи","es":"Los cuatro grupos y los casos concretos","pt":"Os quatro grupos e os casos individuais"},"html":"<p>Im Anhang des Gesetzes steht die „schwarze Liste“ mit Handlungen, die immer unzulässig sind. In den §§ 3 bis 7 UWG gibt es vier Gruppen:<br><b>1. Unlautere geschäftliche Handlungen:<\/b> Ein Betrieb verschafft sich einen unerlaubten Vorteil.<br><b>2. Irreführende geschäftliche Handlungen:<\/b> unwahre Angaben oder weggelassene wichtige Informationen.<br><b>3. Unlautere vergleichende Werbung:<\/b> ein unfairer Vergleich mit der Konkurrenz.<br><b>4. Unzumutbare Belästigungen:<\/b> Werbung, obwohl der Empfänger sie nicht will.<\/p><p><b>Gruppe 1 – Herabsetzung/Verunglimpfung:<\/b> Ein Autohändler erzählt, auf dem Dach des gegenüberliegenden Autohauses sitze der Pleitegeier.<br><b>Gruppe 1 – Nachahmung:<\/b> Gefälschte Rolex-Uhren.<br><b>Gruppe 1 – Aggressive Handlung:<\/b> Bei einer „Kaffeefahrt“ werden die Teilnehmer nicht aus dem Raum gelassen. Wer nicht kauft, wird bloßgestellt.<br><b>Gruppe 1 – Ausnutzung geschäftlicher Unerfahrenheit<\/b> (Kinder, Jugendliche): Kurznachricht „Ruf mich zurück, du kannst gewinnen.“<br><b>Gruppe 2 – Irreführende Angaben über das Unternehmen:<\/b> „Größte Goldschmiede Deutschlands“ ist unzulässig, wenn es Konkurrenten mit höherem Umsatz gibt. Stimmt die Angabe, ist sie erlaubt.<br><b>Gruppe 2 – Mondpreis:<\/b> Wanderschuhe für 120,00 EUR, nach drei Tagen „nur 99,00 EUR statt 120,00 EUR“, zwei Tage später wieder 120,00 EUR.<br><b>Gruppe 2 – Lockangebot (nicht ausreichende Bevorratung):<\/b> Pfifferlinge für 4,99 EUR, nur 10 Körbchen je Filiale, nach einer halben Stunde ausverkauft. Angemessen ist ein Vorrat, der im Regelfall zwei Tage reicht.<br><b>Gruppe 2 – Vorenthaltung wesentlicher Informationen:<\/b> Ein Vertreter verschweigt, dass die Bohrmaschine 2. Wahl ist.<br><b>Gruppe 4 – Unzumutbare Belästigung:<\/b> Werbung im Briefkasten trotz „Keine Werbung“-Schild; Werbeanrufe, Anrufmaschinen oder E-Mails ohne Einwilligung.<\/p><div class=\"box merke\"><b>Neu seit 2022: Die 30-Tage-Regel (§ 11 Preisangabenverordnung).<\/b> Wer mit einer Preissenkung wirbt, muss als früheren Preis den niedrigsten Preis der letzten 30 Tage vor der Senkung angeben. Beispiel: Ein Fernseher kostet den ganzen Mai 499 €. Am 1. Juni steigt der Preis auf 599 €. Am 10. Juni wirbt der Laden: „statt 599 € jetzt nur 499 €“. Der niedrigste Preis der letzten 30 Tage war 499 €. Diese Werbung ist unzulässig. Ausnahme: schnell verderbliche Lebensmittel, die kurz vor Ablauf billiger werden.<\/div>","vi":"Có bốn nhóm: 1. hành vi không công bằng (hạ thấp đối thủ, làm giả, ép khách, lợi dụng trẻ em); 2. gây hiểu lầm (thông tin sai, Mondpreis = giá ảo, Lockangebot = hàng mồi không đủ hàng – phải đủ cho khoảng 2 ngày, giấu thông tin quan trọng); 3. so sánh không công bằng; 4. làm phiền quá mức (quảng cáo khi người nhận không muốn, không có Einwilligung = sự đồng ý). Quy tắc 30 ngày: khi quảng cáo giảm giá phải ghi giá thấp nhất trong 30 ngày trước đó.","sum":{"tr":"Dört grup vardır: 1. haksız davranışlar (rakibi küçük düşürme, taklit, müşteriye baskı, çocukları istismar); 2. yanıltıcı olanlar (yanlış bilgi, Mondpreis = hayali fiyat, Lockangebot = yeterli mal olmayan tuzak teklif – stok yaklaşık 2 gün yetmelidir, önemli bilgiyi saklama); 3. adil olmayan karşılaştırma; 4. katlanılamaz rahatsız etme (alıcı istemediği halde reklam, Einwilligung = izin yok). 30 gün kuralı: indirim reklamı yapılırken önceki 30 günün en düşük fiyatı belirtilmelidir.","ar":"هناك أربع مجموعات: 1. تصرفات غير نزيهة (الحطّ من المنافس، التقليد، الضغط على الزبون، استغلال الأطفال)؛ 2. تصرفات مضلِّلة (معلومات كاذبة، Mondpreis = سعر وهمي، Lockangebot = عرض إغراء دون كمية كافية – يجب أن تكفي البضاعة نحو يومين، إخفاء معلومات مهمة)؛ 3. مقارنة غير عادلة؛ 4. إزعاج غير مقبول (إعلان رغم أن المتلقي لا يريده، دون Einwilligung = موافقة). قاعدة الثلاثين يومًا: عند الإعلان عن تخفيض يجب ذكر أدنى سعر في الأيام الثلاثين السابقة.","ti":"ኣርባዕተ ጉጅለታት ኣለዉ፡ 1. ዘይቕኑዕ ተግባራት (ተወዳዳሪ ምንዕዓቕ፣ ምምስሳል፣ ኣብ ዓሚል ጸቕጢ ምግባር፣ ቆልዑ ምጥቃም)፤ 2. ዘሳስቱ (ሓሶት ሓበሬታ፣ Mondpreis = ሓሶታዊ ዋጋ፣ Lockangebot = ዘየኽእል ዕቃ ዘለዎ ዘጓትት ኣቕራቦ – ዕቃ ዳርጋ ንኽልተ መዓልቲ ክኣክል ኣለዎ፣ ኣገዳሲ ሓበሬታ ምሕባእ)፤ 3. ዘይቕኑዕ ምንጽጻር፤ 4. ዘይግቡእ ምርባሽ (ተቐባሊ ዘይደለዮ ምልክታ፣ ብዘይ Einwilligung = ፍቓድ)። ሕጊ 30 መዓልታት፡ ጉዳል ዋጋ ክእወጅ ከሎ እቲ ኣብ ዝሓለፉ 30 መዓልታት ዝነበረ ዝተሓተ ዋጋ ክሕበር ኣለዎ።","uk":"Є чотири групи: 1. нечесні дії (приниження конкурента, підробка, тиск на клієнта, використання дітей); 2. оманливі дії (неправдива інформація, Mondpreis = фіктивна ціна, Lockangebot = приманка без достатньої кількості товару – запасу має вистачити приблизно на 2 дні, приховування важливої інформації); 3. нечесне порівняння; 4. неприпустиме набридання (реклама, коли отримувач її не хоче, без Einwilligung = згоди). Правило 30 днів: коли рекламують знижку, треба вказати найнижчу ціну за попередні 30 днів.","ru":"Есть четыре группы: 1. недобросовестные действия (унижение конкурента, подделка, давление на клиента, использование детей); 2. вводящие в заблуждение (ложная информация, Mondpreis = фиктивная цена, Lockangebot = заманивающее предложение без достаточного количества товара – запаса должно хватить примерно на 2 дня, сокрытие важной информации); 3. нечестное сравнение; 4. недопустимое навязчивое беспокойство (реклама, когда получатель её не хочет, без Einwilligung = согласия). Правило 30 дней: при рекламе скидки нужно указать самую низкую цену за предыдущие 30 дней.","es":"Hay cuatro grupos: 1. acciones desleales (desprestigiar al competidor, imitación, presionar al cliente, aprovecharse de niños); 2. engañosas (datos falsos, Mondpreis = precio ficticio, Lockangebot = oferta señuelo sin existencias suficientes – deben alcanzar para unos 2 días, ocultar información importante); 3. comparación desleal; 4. molestia inaceptable (publicidad aunque el destinatario no la quiere, sin Einwilligung = consentimiento). Regla de los 30 días: al anunciar una rebaja hay que indicar el precio más bajo de los 30 días anteriores.","pt":"Há quatro grupos: 1. ações desleais (denegrir o concorrente, imitação, pressionar o cliente, aproveitar-se de crianças); 2. enganosas (informações falsas, Mondpreis = preço fictício, Lockangebot = oferta isco sem existências suficientes – devem chegar para cerca de 2 dias, ocultar informação importante); 3. comparação desleal; 4. incómodo inaceitável (publicidade mesmo que o destinatário não a queira, sem Einwilligung = consentimento). Regra dos 30 dias: ao anunciar uma redução tem de se indicar o preço mais baixo dos 30 dias anteriores."}},{"id":"m1","no":"Übung 1","type":"match","pts":0,"title":"Fall und Fachbegriff","instr":{"de":"Ordne jedem Fall den richtigen Fachbegriff zu.","vi":"Em ghép mỗi trường hợp với đúng thuật ngữ.","tr":"Her duruma doğru terimi eşleştir.","ar":"اربط كل حالة بالمصطلح الصحيح.","ti":"ንነፍሲ ወከፍ ጉዳይ ትክክለኛ ቃል ኣዛምዶ።","uk":"До кожного випадку добери правильний термін.","ru":"К каждому случаю подбери правильный термин.","es":"Asocia a cada caso el término correcto.","pt":"Associa a cada caso o termo correto."},"tip":{"de":"Lies in der Übersicht oben die Beispiele noch einmal. Achte auf Wörter wie „ausverkauft“, „statt“ und „ohne Einwilligung“.","vi":"Đọc lại các ví dụ trong phần tổng quan. Chú ý những từ như “ausverkauft” (hết hàng), “statt” (thay vì) và “ohne Einwilligung” (không có sự đồng ý).","tr":"Yukarıdaki özette örnekleri tekrar oku. „ausverkauft“ (tükendi), „statt“ (yerine) ve „ohne Einwilligung“ (izinsiz) gibi kelimelere dikkat et.","ar":"اقرأ الأمثلة في النظرة العامة أعلاه مرة أخرى. انتبه إلى كلمات مثل „ausverkauft“ (نفد) و„statt“ (بدلاً من) و„ohne Einwilligung“ (دون موافقة).","ti":"ኣብ ላዕሊ ኣብ እቲ ሓፈሻዊ ርእይቶ ዘለዉ ኣብነታት ዳግማይ ኣንብብ። ከም „ausverkauft“ (ተሸይጡ ወዲኡ)፣ „statt“ (ክንዲ) ን „ohne Einwilligung“ (ብዘይ ፍቓድ) ዝኣመሰሉ ቃላት ርኣይ።","uk":"Ще раз прочитай приклади в огляді вище. Зверни увагу на слова „ausverkauft“ (розпродано), „statt“ (замість) і „ohne Einwilligung“ (без згоди).","ru":"Ещё раз прочитай примеры в обзоре выше. Обрати внимание на слова „ausverkauft“ (распродано), „statt“ (вместо) и „ohne Einwilligung“ (без согласия).","es":"Vuelve a leer los ejemplos de la vista general de arriba. Fíjate en palabras como „ausverkauft“ (agotado), „statt“ (en lugar de) y „ohne Einwilligung“ (sin consentimiento).","pt":"Lê outra vez os exemplos da visão geral acima. Presta atenção a palavras como „ausverkauft“ (esgotado), „statt“ (em vez de) e „ohne Einwilligung“ (sem consentimento)."},"rows":[{"l":"Pfifferlinge für 4,99 €: nur 10 Körbchen je Filiale, nach 30 Minuten ausverkauft","a":"Lockangebot"},{"l":"Wanderschuhe „nur 99 € statt 120 €“; zwei Tage später wieder 120 €","a":"Mondpreis"},{"l":"Gefälschte Rolex-Uhren","a":"Nachahmung"},{"l":"Werbeanruf ohne Einwilligung","a":"Unzumutbare Belästigung"},{"l":"Ein Autohändler spricht vom „Pleitegeier“ beim Konkurrenten","a":"Herabsetzung eines Mitbewerbers"},{"l":"Kaffeefahrt: Teilnehmer werden nicht aus dem Raum gelassen","a":"Aggressive Handlung"}],"extra":["Vorenthaltung wesentlicher Informationen"]},{"id":"w3","type":"info","title":{"de":"Vergleichende Werbung","vi":"Quảng cáo so sánh","tr":"Karşılaştırmalı reklam (Vergleichende Werbung)","ar":"الإعلان المقارن (Vergleichende Werbung)","ti":"ምንጽጻራዊ ምልክታ (Vergleichende Werbung)","uk":"Порівняльна реклама (Vergleichende Werbung)","ru":"Сравнительная реклама (Vergleichende Werbung)","es":"Publicidad comparativa (Vergleichende Werbung)","pt":"Publicidade comparativa (Vergleichende Werbung)"},"html":"<p>Vergleichende Werbung ist grundsätzlich zulässig. Sie wird erst <b>unlauter<\/b>, wenn der Vergleich nicht fair ist:<\/p><p>• wenn er <b>unterschiedliche Waren<\/b> oder Dienstleistungen betrifft („Unser Fernseher Typ ABC ist um 20 % günstiger als der Fernseher Typ DEF.“),<br>• wenn er einen Mitbewerber <b>herabsetzt<\/b> oder verunglimpft („Die Möbel der Marke Wertgut sind von minderer Qualität.“),<br>• wenn er Preise für <b>unterschiedliche Mengen oder Qualitäten<\/b> vergleicht („Die Flasche Hohes C kostet beim Discounter 0,70 EUR, bei uns nur 0,65 EUR“, aber 0,75 Liter gegen 1,0 Liter).<\/p><div class=\"box merke\"><b>Merke:<\/b> Gleiche Ware, gleiche Menge, gleiche Qualität. Sonst hinkt der Vergleich und ist unlauter.<\/div>","vi":"Quảng cáo so sánh về nguyên tắc được phép. Nó không công bằng (unlauter) khi: so sánh hàng khác nhau; hạ thấp đối thủ; so sánh giá của lượng hoặc chất lượng khác nhau. Nhớ: cùng hàng, cùng lượng, cùng chất lượng.","sum":{"tr":"Karşılaştırmalı reklam prensipte izinlidir. Şu durumlarda unlauter (haksız) olur: farklı mallar karşılaştırılırsa; rakip küçük düşürülürse; farklı miktar veya kalitedeki fiyatlar karşılaştırılırsa. Hatırla: aynı mal, aynı miktar, aynı kalite.","ar":"الإعلان المقارن جائز من حيث المبدأ. ويصبح unlauter (غير نزيه) في هذه الحالات: مقارنة بضائع مختلفة؛ الحطّ من قدر المنافس؛ مقارنة أسعار كميات أو جودات مختلفة. تذكّر: بضاعة متماثلة، كمية متماثلة، جودة متماثلة.","ti":"ምንጽጻራዊ ምልክታ ብመሰረቱ ይፍቀድ። ኣብዚ unlauter (ዘይቕኑዕ) ይኸውን፡ ዝተፈላለዩ ዕቃታት እንተ ተነጻጺሮም፤ ተወዳዳሪ እንተ ተነዒቑ፤ ናይ ዝተፈላለየ መጠን ወይ ጽሬት ዋጋታት እንተ ተነጻጺሮም። ዘክር፡ ሓደ ዓይነት ዕቃ፣ ሓደ መጠን፣ ሓደ ጽሬት።","uk":"Порівняльна реклама в принципі дозволена. Вона стає unlauter (нечесною), коли: порівнюють різні товари; принижують конкурента; порівнюють ціни на різну кількість або якість. Запам'ятай: той самий товар, та сама кількість, та сама якість.","ru":"Сравнительная реклама в принципе допустима. Она становится unlauter (недобросовестной), когда: сравнивают разные товары; унижают конкурента; сравнивают цены на разное количество или качество. Запомни: тот же товар, то же количество, то же качество.","es":"La publicidad comparativa está permitida en principio. Se vuelve unlauter (desleal) cuando: se comparan mercancías distintas; se desprestigia a un competidor; se comparan precios de cantidades o calidades distintas. Recuerda: misma mercancía, misma cantidad, misma calidad.","pt":"A publicidade comparativa é, em princípio, permitida. Torna-se unlauter (desleal) quando: se comparam mercadorias diferentes; se denigre um concorrente; se comparam preços de quantidades ou qualidades diferentes. Lembra-te: mesma mercadoria, mesma quantidade, mesma qualidade."}},{"id":"t1","no":"Lesen 2","type":"tf","pts":0,"title":"Richtig oder falsch?","instr":{"de":"Entscheide: Ist die Aussage richtig oder falsch?","vi":"Em quyết định: câu này đúng hay sai?","tr":"Karar ver: İfade doğru mu yanlış mı?","ar":"قرّر: هل العبارة صحيحة أم خاطئة؟","ti":"ውሰን፡ እቲ ዘረባ ቅኑዕ ድዩ ጌጋ?","uk":"Вирішуй: твердження правильне чи неправильне?","ru":"Реши: утверждение верное или неверное?","es":"Decide: ¿la afirmación es verdadera o falsa?","pt":"Decide: a afirmação é verdadeira ou falsa?"},"tip":{"de":"Vergleichen ist erlaubt, wenn es fair ist.","vi":"So sánh được phép nếu công bằng.","tr":"Karşılaştırma yapmak, adil olduğu sürece serbesttir.","ar":"المقارنة جائزة إذا كانت عادلة.","ti":"ምንጽጻር ቅኑዕ እንተ ኾይኑ ይፍቀድ።","uk":"Порівнювати дозволено, якщо це чесно.","ru":"Сравнивать можно, если это честно.","es":"Comparar está permitido si es justo.","pt":"Comparar é permitido se for justo."},"st":[{"t":"Vergleichende Werbung ist grundsätzlich verboten.","a":false,"why":{"de":"Sie ist grundsätzlich zulässig und wird erst unlauter, wenn der Vergleich nicht fair ist.","vi":"Về nguyên tắc nó được phép và chỉ không lành mạnh khi so sánh không công bằng.","tr":"Karşılaştırmalı reklam prensipte izinlidir; ancak karşılaştırma adil değilse unlauter (haksız) olur.","ar":"هو جائز من حيث المبدأ، ولا يصبح unlauter (غير نزيه) إلا إذا لم تكن المقارنة عادلة.","ti":"ብመሰረቱ ይፍቀድ፣ እቲ ምንጽጻር ቅኑዕ እንተ ዘይኮነ ጥራይ unlauter (ዘይቕኑዕ) ይኸውን።","uk":"Вона в принципі дозволена і стає unlauter (нечесною) лише тоді, коли порівняння нечесне.","ru":"В принципе она допустима и становится unlauter (недобросовестной) только тогда, когда сравнение нечестное.","es":"En principio está permitida y solo se vuelve unlauter (desleal) cuando la comparación no es justa.","pt":"Em princípio é permitida e só se torna unlauter (desleal) quando a comparação não é justa."}},{"t":"Ein beworbener Artikel muss im Regelfall zwei Tage reichen.","a":true},{"t":"Eine wahre Angabe wie „Größte Goldschmiede Deutschlands“ ist erlaubt.","a":true},{"t":"Werbe-E-Mails ohne Einwilligung sind erlaubt, wenn die Adresse gekauft wurde.","a":false,"why":{"de":"Ohne Einwilligung ist E-Mail-Werbung eine unzumutbare Belästigung.","vi":"Không có sự đồng ý thì quảng cáo email là làm phiền quá mức.","tr":"İzin (Einwilligung) olmadan e-posta reklamı, katlanılamaz rahatsız etmedir (unzumutbare Belästigung).","ar":"من دون موافقة (Einwilligung) يُعدّ الإعلان بالبريد الإلكتروني إزعاجًا غير مقبول (unzumutbare Belästigung).","ti":"ብዘይ ፍቓድ (Einwilligung) ናይ ኢሜይል ምልክታ unzumutbare Belästigung (ዘይግቡእ ምርባሽ) እዩ።","uk":"Без згоди (Einwilligung) реклама електронною поштою — це неприпустиме набридання (unzumutbare Belästigung).","ru":"Без согласия (Einwilligung) реклама по электронной почте — это недопустимое навязчивое беспокойство (unzumutbare Belästigung).","es":"Sin consentimiento (Einwilligung), la publicidad por correo electrónico es una molestia inaceptable (unzumutbare Belästigung).","pt":"Sem consentimento (Einwilligung), a publicidade por e-mail é um incómodo inaceitável (unzumutbare Belästigung)."}}]},{"id":"mc30","no":"Übung 2","type":"mc","pts":0,"title":"Die 30-Tage-Regel","instr":{"de":"Wähle die richtige Antwort. Nutze die 30-Tage-Regel.","vi":"Em chọn đáp án đúng. Dùng quy tắc 30 ngày.","tr":"Doğru cevabı seç. 30 gün kuralını kullan.","ar":"اختر الإجابة الصحيحة. استخدم قاعدة الثلاثين يومًا.","ti":"ቅኑዕ መልሲ ምረጽ። ሕጊ 30 መዓልታት ተጠቐም።","uk":"Вибери правильну відповідь. Використай правило 30 днів.","ru":"Выбери правильный ответ. Используй правило 30 дней.","es":"Elige la respuesta correcta. Usa la regla de los 30 días.","pt":"Escolhe a resposta certa. Usa a regra dos 30 dias."},"tip":{"de":"Der frühere Preis ist der niedrigste Preis der letzten 30 Tage vor der Senkung.","vi":"Giá trước đây là giá thấp nhất trong 30 ngày trước khi giảm.","tr":"Önceki fiyat, indirimden önceki son 30 günün en düşük fiyatıdır.","ar":"السعر السابق هو أدنى سعر في الأيام الثلاثين التي سبقت التخفيض.","ti":"እቲ ቀዳማይ ዋጋ ቅድሚ ምጉዳል ኣብ ዝነበሩ 30 መዓልታት ዝነበረ ዝተሓተ ዋጋ እዩ።","uk":"Попередня ціна — це найнижча ціна за останні 30 днів до зниження.","ru":"Прежняя цена — это самая низкая цена за последние 30 дней до снижения.","es":"El precio anterior es el precio más bajo de los últimos 30 días antes de la rebaja.","pt":"O preço anterior é o preço mais baixo dos últimos 30 dias antes da redução."},"qs":[{"q":"Eine Jacke kostete den ganzen Mai 79 €. Am 2. Juni steigt der Preis auf 99 €. Am 12. Juni wirbt der Laden: „statt 99 € jetzt nur 79 €“. Ist das zulässig?","o":["Nein. Der niedrigste Preis der letzten 30 Tage war 79 €.","Ja. Der letzte Preis war 99 €.","Ja. Eine Preissenkung ist immer erlaubt."],"a":0,"why":{"de":"Als früherer Preis muss der niedrigste Preis der letzten 30 Tage genannt werden: 79 €.","vi":"Giá trước đây phải là giá thấp nhất trong 30 ngày: 79 €.","tr":"Önceki fiyat olarak son 30 günün en düşük fiyatı belirtilmelidir: 79 €.","ar":"يجب ذكر أدنى سعر في الأيام الثلاثين الأخيرة كسعر سابق: 79 €.","ti":"ከም ቀዳማይ ዋጋ እቲ ኣብ ዝሓለፉ 30 መዓልታት ዝነበረ ዝተሓተ ዋጋ ክሕበር ኣለዎ፡ 79 €።","uk":"Як попередню ціну треба вказати найнижчу ціну за останні 30 днів: 79 €.","ru":"В качестве прежней цены нужно указать самую низкую цену за последние 30 дней: 79 €.","es":"Como precio anterior hay que indicar el precio más bajo de los últimos 30 días: 79 €.","pt":"Como preço anterior tem de ser indicado o preço mais baixo dos últimos 30 dias: 79 €."}},{"q":"Ein Pullover kostete 60 Tage lang 59 €. Am 1. Juli setzt der Laden den Preis auf 49 € herab und wirbt: „statt 59 € jetzt nur 49 €“. Ist das zulässig?","o":["Ja. 59 € war der niedrigste Preis der letzten 30 Tage.","Nein. Man darf nie einen früheren Preis nennen.","Nein. Der Preis muss in Euro und Cent stehen."],"a":0,"why":{"de":"Der niedrigste Preis der letzten 30 Tage vor der Senkung war 59 €. Dieser Preis darf als früherer Preis genannt werden.","vi":"Giá thấp nhất trong 30 ngày trước khi giảm là 59 €. Giá này được phép ghi là giá trước đây.","tr":"İndirimden önceki son 30 günün en düşük fiyatı 59 € idi. Bu fiyat önceki fiyat olarak belirtilebilir.","ar":"كان أدنى سعر في الأيام الثلاثين التي سبقت التخفيض 59 €. يجوز ذكر هذا السعر كسعر سابق.","ti":"ቅድሚ ምጉዳል ኣብ ዝነበሩ 30 መዓልታት ዝተሓተ ዋጋ 59 € እዩ ነይሩ። እዚ ዋጋ ከም ቀዳማይ ዋጋ ክሕበር ይፍቀድ።","uk":"Найнижча ціна за 30 днів до зниження була 59 €. Цю ціну можна вказати як попередню.","ru":"Самая низкая цена за 30 дней до снижения была 59 €. Эту цену можно указать как прежнюю.","es":"El precio más bajo de los 30 días antes de la rebaja fue 59 €. Este precio se puede indicar como precio anterior.","pt":"O preço mais baixo dos 30 dias antes da redução foi 59 €. Este preço pode ser indicado como preço anterior."}}]},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: So prüfst du einen Fall","html":"<div class=\"box\"><b>Der Fall:<\/b> Ein Schuhgeschäft bietet Wanderschuhe für 120,00 EUR an. Nach drei Tagen senkt es den Preis auf 99,00 EUR. In der Zeitungsanzeige steht: „Wanderschuhe der Marke G &amp; W für nur 99,00 EUR statt 120,00 EUR.“ Zwei Tage später kostet der Schuh wieder 120,00 EUR.<\/div><p><b>Schritt 1: Wer könnte geschädigt werden?<\/b> Der Verbraucher. Er glaubt, ein Schnäppchen zu machen, und kauft schneller.<\/p><p><b>Schritt 2: In welche der vier Gruppen fällt der Fall?<\/b> In Gruppe 2: irreführende geschäftliche Handlungen. Es wird eine unwahre Angabe gemacht.<\/p><p><b>Schritt 3: Wie heißt der Fall genau?<\/b> Irreführende Werbung mit einem Mondpreis. Der „durchgestrichene“ Preis war nie ein ernsthafter Verkaufspreis.<\/p><p><b>Schritt 4: Was ist die Folge?<\/b> Die Werbung ist unzulässig. Mitbewerber und Verbände können dagegen vorgehen.<\/p><div class=\"box merke\"><b>Ergebnis:<\/b> Immer dieselben vier Schritte: Wer wird geschädigt? Welche Gruppe? Welcher Fall genau? Welche Folge?<\/div>","vi":"Ví dụ mẫu: giày leo núi 120 €, giảm xuống 99 € rồi 2 ngày sau lại 120 €. Bước 1: người tiêu dùng bị thiệt. Bước 2: nhóm 2 (gây hiểu lầm). Bước 3: Mondpreis (giá ảo). Bước 4: quảng cáo bị cấm; đối thủ và hiệp hội có thể kiện.","sum":{"tr":"Örnek: yürüyüş ayakkabısı 120 €, 99 €'ya indirildi, 2 gün sonra tekrar 120 €. Adım 1: tüketici zarar görür. Adım 2: grup 2 (yanıltıcı). Adım 3: Mondpreis (hayali fiyat). Adım 4: reklam yasaktır; rakipler ve dernekler dava açabilir.","ar":"مثال محلول: حذاء جبلي بسعر 120 €، خُفّض إلى 99 € ثم عاد بعد يومين إلى 120 €. الخطوة 1: المستهلك يتضرر. الخطوة 2: المجموعة 2 (مضلِّل). الخطوة 3: Mondpreis (سعر وهمي). الخطوة 4: الإعلان ممنوع؛ ويمكن للمنافسين والاتحادات مقاضاته.","ti":"ኣብነት፡ ናይ ጎዳጉዲ ጫማ 120 €፣ ናብ 99 € ወሪዱ፣ ድሕሪ 2 መዓልታት ሕጂውን 120 €። ስጉምቲ 1፡ ተጠቃሚ ይጎድእ። ስጉምቲ 2፡ ጉጅለ 2 (ዘሳስት)። ስጉምቲ 3፡ Mondpreis (ሓሶታዊ ዋጋ)። ስጉምቲ 4፡ እቲ ምልክታ ክልኩል እዩ፤ ተወዳደርትን ማሕበራትን ክጣበቑሉ ይኽእሉ።","uk":"Приклад: туристичні черевики 120 €, знижено до 99 €, через 2 дні знову 120 €. Крок 1: збитки зазнає споживач. Крок 2: група 2 (оманливі дії). Крок 3: Mondpreis (фіктивна ціна). Крок 4: реклама заборонена; конкуренти та об'єднання можуть подати позов.","ru":"Пример: туристические ботинки 120 €, цену снизили до 99 €, через 2 дня снова 120 €. Шаг 1: ущерб несёт потребитель. Шаг 2: группа 2 (вводящие в заблуждение). Шаг 3: Mondpreis (фиктивная цена). Шаг 4: реклама запрещена; конкуренты и объединения могут подать иск.","es":"Ejemplo resuelto: botas de montaña 120 €, rebajadas a 99 € y 2 días después otra vez 120 €. Paso 1: sale perjudicado el consumidor. Paso 2: grupo 2 (engañosa). Paso 3: Mondpreis (precio ficticio). Paso 4: la publicidad está prohibida; los competidores y las asociaciones pueden denunciarla.","pt":"Exemplo resolvido: botas de caminhada 120 €, reduzidas para 99 € e 2 dias depois outra vez 120 €. Passo 1: o consumidor é prejudicado. Passo 2: grupo 2 (enganosa). Passo 3: Mondpreis (preço fictício). Passo 4: a publicidade é proibida; os concorrentes e as associações podem agir judicialmente."}},{"id":"a3","no":"Aufgabe 3","type":"table","pts":1,"title":"Geführte Übung: Verstoß oder nicht?","instr":{"de":"Entscheide jeweils: Liegt ein Verstoß gegen das UWG vor? Wenn ja, wie heißt der Fall?","vi":"Em quyết định: có vi phạm UWG không? Nếu có, trường hợp đó gọi là gì?","tr":"Her biri için karar ver: UWG'ye aykırılık var mı? Varsa, durumun adı nedir?","ar":"قرّر في كل حالة: هل توجد مخالفة لقانون UWG؟ إن وُجدت، فما اسم الحالة؟","ti":"ንነፍሲ ወከፍ ውሰን፡ ኣብ UWG ጥሕስ ኣሎ ድዩ? እንተ ኣሎ፣ ስም እቲ ጉዳይ እንታይ እዩ?","uk":"Вирішуй щоразу: чи є порушення UWG? Якщо так, як називається цей випадок?","ru":"Решай каждый раз: есть ли нарушение UWG? Если да, как называется этот случай?","es":"Decide en cada caso: ¿hay una infracción de la UWG? Si es así, ¿cómo se llama el caso?","pt":"Decide em cada caso: há uma infração à UWG? Se sim, como se chama o caso?"},"tip":{"de":"Frage dich: Reicht die Ware für den Ansturm? Wird ein Mitbewerber schlechtgemacht? Stimmt die Angabe? Liegt eine Einwilligung vor?","vi":"Tự hỏi: hàng có đủ cho lượng khách không? Có nói xấu đối thủ không? Thông tin có đúng không? Có sự đồng ý không?","tr":"Kendine sor: Mal, müşteri yoğunluğuna yeter mi? Bir rakip kötüleniyor mu? Bilgi doğru mu? İzin var mı?","ar":"اسأل نفسك: هل تكفي البضاعة لإقبال الزبائن؟ هل يُشوَّه سمعة منافس؟ هل المعلومة صحيحة؟ هل توجد موافقة؟","ti":"ባዕልኻ ሕተት፡ እቲ ዕቃ ንብዝሒ ዓማዊል ይኣክል ድዩ? ሓደ ተወዳዳሪ ይጸይፍ ድዩ? እቲ ሓበሬታ ቅኑዕ ድዩ? ፍቓድ ኣሎ ድዩ?","uk":"Запитай себе: Чи вистачить товару для ажіотажу? Чи очорнюють конкурента? Чи правдива інформація? Чи є згода?","ru":"Спроси себя: Хватит ли товара при наплыве покупателей? Не очерняют ли конкурента? Правдива ли информация? Есть ли согласие?","es":"Pregúntate: ¿Alcanza la mercancía para la afluencia de clientes? ¿Se desprestigia a un competidor? ¿Es cierto el dato? ¿Hay consentimiento?","pt":"Pergunta a ti próprio: A mercadoria chega para a afluência de clientes? Está a denegrir-se um concorrente? A informação é verdadeira? Existe consentimento?"},"cols":["Fall","Verstoß?","Wie heißt der Fall?"],"colOpts":[null,["Ja","Nein"],["Lockangebot (nicht ausreichende Bevorratung)","Unlautere vergleichende Werbung (Herabsetzung)","Mondpreis (irreführende Werbung)","Unzumutbare Belästigung","Kein Verstoß"]],"rows":[["1. Eine Lebensmittelkette bewirbt frische Pfifferlinge für 4,99 EUR je Körbchen. Jede Filiale bekommt zehn Körbchen; nach einer halben Stunde sind sie ausverkauft.",{"a":"Ja"},{"a":"Lockangebot (nicht ausreichende Bevorratung)"}],["2. Ein Möbelhaus wirbt: „Die Möbel der Marke Wertgut sind gegenüber unseren Möbeln von minderer Qualität.“",{"a":"Ja"},{"a":"Unlautere vergleichende Werbung (Herabsetzung)"}],["3. Ein Juwelier wirbt mit „Größte Goldschmiede Deutschlands“. Er kann nachweisen, dass sein Unternehmen tatsächlich den höchsten Umsatz in Deutschland erzielt.",{"a":"Nein"},{"a":"Kein Verstoß"}],["4. Ein Versicherungsunternehmen schickt Werbe-E-Mails an alle Verbraucher, deren Adresse es gekauft hat. Eine Einwilligung liegt nicht vor.",{"a":"Ja"},{"a":"Unzumutbare Belästigung"}]]},{"id":"a4","no":"Aufgabe 4","type":"free","pts":1,"title":"Freie Übung","instr":{"de":"Beantworte die Fragen in eigenen Worten.","vi":"Em trả lời các câu hỏi bằng lời của mình.","tr":"Soruları kendi cümlelerinle cevapla.","ar":"أجب عن الأسئلة بكلماتك الخاصة.","ti":"ነቶም ሕቶታት ብናትካ ቃላት መልሶም።","uk":"Відповідай на запитання своїми словами.","ru":"Отвечай на вопросы своими словами.","es":"Responde las preguntas con tus propias palabras.","pt":"Responde às perguntas com as tuas próprias palavras."},"tip":{"de":"Bei Frage 4 und 5 findest du Hinweise in der Übersicht oben. Bei Frage 6: Briefkasten, Telefon, E-Mail.","vi":"Câu 4 và 5: gợi ý có trong phần tổng quan ở trên. Câu 6: hộp thư, điện thoại, email.","tr":"4. ve 5. soruda ipuçlarını yukarıdaki özette bulursun. 6. soruda: posta kutusu, telefon, e-posta.","ar":"في السؤالين 4 و5 تجد تلميحات في النظرة العامة أعلاه. في السؤال 6: صندوق البريد، الهاتف، البريد الإلكتروني.","ti":"ኣብ ሕቶ 4 ን 5 ሓገዝ ኣብቲ ላዕሊ ዘሎ ሓፈሻዊ ርእይቶ ትረክብ። ኣብ ሕቶ 6፡ ሳጹን ደብዳበ፣ ተሌፎን፣ ኢሜይል።","uk":"До запитань 4 і 5 підказки є в огляді вище. До запитання 6: поштова скринька, телефон, електронна пошта.","ru":"К вопросам 4 и 5 подсказки есть в обзоре выше. К вопросу 6: почтовый ящик, телефон, электронная почта.","es":"En las preguntas 4 y 5 encuentras pistas en la vista general de arriba. En la pregunta 6: buzón, teléfono, correo electrónico.","pt":"Nas perguntas 4 e 5 encontras pistas na visão geral acima. Na pergunta 6: caixa do correio, telefone, e-mail."},"parts":[{"q":"1. Wofür steht die Abkürzung UWG?","m":"Gesetz gegen den unlauteren Wettbewerb."},{"q":"2. Wen schützt das UWG? Nenne drei Gruppen.","m":"Die Mitbewerber, die Verbraucher und die sonstigen Marktteilnehmer. Zugleich schützt es das Interesse der Allgemeinheit an einem unverfälschten Wettbewerb."},{"q":"3. Erkläre mit eigenen Worten, wann eine geschäftliche Handlung unlauter ist.","m":"Wenn sich ein Unternehmen damit einen Wettbewerbsvorteil verschafft, der gesetzlich nicht erlaubt ist.","s":["Eine Handlung ist unlauter, wenn …"]},{"q":"4. Was ist ein Mondpreis?","m":"Ein hoher Preis, der nur kurz gesetzt wird, damit der spätere „Aktionspreis“ als große Ersparnis erscheint. Das ist irreführende Werbung."},{"q":"5. Wie lange muss ein beworbener Artikel im Regelfall vorrätig sein, damit kein Lockangebot vorliegt?","m":"Der Warenvorrat muss im Regelfall zwei Tage reichen."},{"q":"6. Nenne zwei Beispiele für unzumutbare Belästigung.","m":"Zum Beispiel: Werbematerial im Briefkasten trotz „Keine Werbung“-Schild; Werbeanrufe ohne Einwilligung; E-Mails oder Anrufmaschinen ohne Einwilligung; Nachrichten mit verschleiertem Absender."}]},{"id":"a5","no":"Aufgabe 5","type":"free","pts":1,"title":"Aus deinem Betrieb","instr":{"de":"Sieh dir drei Werbeaussagen oder Preisauszeichnungen in deinem Ausbildungsbetrieb an (Schaufenster, Regal, Prospekt). Notiere sie und prüfe, ob sie nach dem UWG zulässig wären.","vi":"Xem ba câu quảng cáo hoặc bảng giá ở cửa hàng nơi em thực tập (tủ kính, kệ, tờ rơi). Ghi lại và kiểm tra xem chúng có được phép theo UWG không.","tr":"Staj yaptığın işletmede üç reklam ifadesine veya fiyat etiketine bak (vitrin, raf, broşür). Not al ve UWG'ye göre izinli olup olmadığını kontrol et.","ar":"انظر إلى ثلاث عبارات إعلانية أو بطاقات أسعار في مكان تدريبك (واجهة المحل، الرف، النشرة). دوّنها وتحقق مما إذا كانت جائزة بحسب قانون UWG.","ti":"ኣብ ቦታ ልምምድካ ሰለስተ ናይ ምልክታ ዘረባታት ወይ ናይ ዋጋ ምልክታታት (መስኮት ድኳን፣ ጣውላ፣ ወረቐት ምልክታ) ርአ። ጽሓፎም ብUWG ዝፍቀዱ ድዮም ኣይኮኑን ድማ መርምር።","uk":"Подивися на три рекламні твердження або цінники на підприємстві, де ти проходиш практику (вітрина, полиця, проспект). Запиши їх і перевір, чи були б вони дозволені за UWG.","ru":"Посмотри на три рекламных утверждения или ценника на своём предприятии, где ты проходишь практику (витрина, полка, проспект). Запиши их и проверь, были бы они допустимы по UWG.","es":"Mira tres afirmaciones publicitarias o etiquetas de precio en tu empresa de prácticas (escaparate, estantería, folleto). Anótalas y comprueba si estarían permitidas según la UWG.","pt":"Vê três afirmações publicitárias ou etiquetas de preço na tua empresa de formação (montra, prateleira, folheto). Anota-as e verifica se seriam permitidas segundo a UWG."},"tip":{"de":"Schreibe die Aussage genau auf. Prüfe sie mit den vier Schritten aus Aufgabe 2.","vi":"Viết chính xác câu quảng cáo. Kiểm tra bằng bốn bước ở Aufgabe 2.","tr":"İfadeyi tam olarak yaz. Aufgabe 2'deki dört adımla kontrol et.","ar":"اكتب العبارة بدقة. افحصها بالخطوات الأربع من Aufgabe 2.","ti":"እቲ ዘረባ ብልክዕ ጽሓፎ። ብኣርባዕተ ስጉምትታት ካብ Aufgabe 2 መርምሮ።","uk":"Запиши твердження точно. Перевір його чотирма кроками із Aufgabe 2.","ru":"Запиши утверждение точно. Проверь его по четырём шагам из Aufgabe 2.","es":"Escribe la afirmación exactamente. Compruébala con los cuatro pasos de la Aufgabe 2.","pt":"Escreve a afirmação exatamente. Verifica-a com os quatro passos da Aufgabe 2."},"parts":[{"q":"Meine drei Aussagen und meine Prüfung:","m":"Individuelle Lösung. Erwartet werden drei konkret zitierte Aussagen und zu jeder eine Einschätzung mit Begründung, die einen der Fälle aus der Tabelle benennt.","s":["Die Aussage lautet: „…“","Das ist zulässig / unzulässig, weil …"]}]},{"id":"a6","no":"Aufgabe 6","type":"info","title":"Escape Room „Die Werbeagentur“ (4 Punkte, eigene Datei)","html":"<p>Du machst ein Praktikum in der Werbeagentur Nordlicht. Sechs Werbeentwürfe liegen im Tresor, und der Tresor hat ein sechsstelliges Zahlenschloss. Jede Station ist ein Fall. Wer ihn richtig einordnet, bekommt eine Ziffer.<\/p><p><a href=\"../LF5_M_8_Escape_Room.html\" style=\"font-weight:700\">▶ Escape Room öffnen<\/a> (eigene Datei, etwa 25 Minuten, allein oder zu zweit). Die Punkte gibt es für den geöffneten Tresor. Notiere die Zahl der Fehlversuche.<\/p><div class=\"box merke\"><b>STOPP – Für Selbstlerner · Pflicht-Stopp 3 · UWG mündlich.<\/b> Zeig deiner Lehrkraft die Urkunde aus dem Escape Room und die Zahl deiner Fehlversuche. Dann beurteilst du zwei Werbefälle mündlich: erlaubt oder nicht? Nenne den Fachbegriff und begründe, auch mit der 30-Tage-Regel.<\/div>","vi":"Escape Room là một tệp riêng (khoảng 25 phút). Em giải mỗi trường hợp để nhận một chữ số; sáu chữ số mở được két. Ghi lại số lần thử sai. Dừng lại (tự học): cho cô giáo xem chứng nhận và nói miệng hai trường hợp: được phép hay không? Nêu thuật ngữ và giải thích, kể cả quy tắc 30 ngày.","sum":{"tr":"Escape Room ayrı bir dosyadır (yaklaşık 25 dakika). Her durumu çözünce bir rakam alırsın; altı rakam kasayı açar. Yanlış deneme sayısını not et. Dur (kendi kendine öğrenme): sertifikayı öğretmene göster ve iki durumu sözlü anlat: izinli mi değil mi? Terimi söyle ve açıkla, 30 gün kuralı dahil.","ar":"Escape Room ملف منفصل (نحو 25 دقيقة). تحلّ كل حالة فتحصل على رقم؛ ستة أرقام تفتح الخزنة. دوّن عدد المحاولات الخاطئة. توقف (للتعلم الذاتي): أرِ المعلمة الشهادة وتحدّث شفهيًا عن حالتين: جائزة أم لا؟ اذكر المصطلح واشرحه، بما في ذلك قاعدة الثلاثين يومًا.","ti":"Escape Room ፍሉይ ፋይል እዩ (ኣስታት 25 ደቓይቕ)። ነፍሲ ወከፍ ጉዳይ ምስ ፈታሕካ ሓደ ቁጽሪ ትረክብ፤ ሽዱሽተ ቁጽርታት ነታ ካዝና ይኸፍቱ። ብዝተሳሕተ ዝፈተንካዮ ብዝሒ ጽሓፍ። ደው ኢልካ (ባዕልኻ ንዝመሃር)፦ ነቲ ምስክር ወረቐት ንመምህርትካ ኣርእየን ክልተ ጉዳያት ብቓልሓ ተዛረብ፦ ዝፍቀድ ድዩ ኣይፍቀድን? እቲ ቃል ጥቀስን ኣብርህን፣ ሕጊ 30 መዓልታት ሓዊሱ።","uk":"Escape Room — це окремий файл (приблизно 25 хвилин). За кожен розв'язаний випадок ти отримуєш одну цифру; шість цифр відкривають сейф. Запиши кількість невдалих спроб. Стоп (для самостійного навчання): покажи вчительці сертифікат і усно розбери два випадки: дозволено чи ні? Назви термін і поясни, зокрема за правилом 30 днів.","ru":"Escape Room — это отдельный файл (примерно 25 минут). За каждый решённый случай ты получаешь одну цифру; шесть цифр открывают сейф. Запиши количество неудачных попыток. Стоп (для самостоятельного обучения): покажи учительнице сертификат и устно разбери два случая: разрешено или нет? Назови термин и объясни, в том числе по правилу 30 дней.","es":"El Escape Room es un archivo aparte (unos 25 minutos). Por cada caso resuelto recibes una cifra; seis cifras abren la caja fuerte. Anota el número de intentos fallidos. Parada (autoaprendizaje): enseña el certificado a la profesora y explica oralmente dos casos: ¿permitido o no? Nombra el término y justifica, también con la regla de los 30 días.","pt":"O Escape Room é um ficheiro à parte (cerca de 25 minutos). Por cada caso resolvido recebes um algarismo; seis algarismos abrem o cofre. Anota o número de tentativas falhadas. Pára (autoaprendizagem): mostra o certificado à professora e explica oralmente dois casos: permitido ou não? Indica o termo e justifica, também com a regra dos 30 dias."}},{"id":"a7","no":"Aufgabe 7","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh.","tr":"Soruları cevapla. Tam cümlelerle gerekçelendir.","ar":"أجب عن الأسئلة. علّل بجمل كاملة.","ti":"ነቶም ሕቶታት መልሶም። ብምሉእ ሓረጋት ኣብርህ።","uk":"Відповідай на запитання. Обґрунтуй повними реченнями.","ru":"Ответь на вопросы. Обоснуй полными предложениями.","es":"Responde las preguntas. Justifica con frases completas.","pt":"Responde às perguntas. Justifica com frases completas."},"tip":{"de":"7.1: Wird der Herr unter Druck gesetzt? 7.2: Waggon oder Kiste? 7.3: Kinder durchschauen Werbeabsichten nicht so gut.","vi":"7.1: ông cụ có bị gây áp lực không? 7.2: toa tàu hay thùng? 7.3: trẻ em khó nhận ra ý đồ quảng cáo.","tr":"7.1: Beyefendiye baskı yapılıyor mu? 7.2: Vagon mu, sandık mı? 7.3: Çocuklar reklam amaçlarını pek iyi anlayamaz.","ar":"7.1: هل يُضغط على الرجل؟ 7.2: عربة قطار أم صندوق؟ 7.3: الأطفال لا يدركون النوايا الإعلانية جيدًا.","ti":"7.1: እቲ ጐዳን ጸቕጢ ይግበረሉ ድዩ? 7.2: ዋጎን ድዩ ሳጹን? 7.3: ቆልዑ ዕላማ ምልክታ ጽቡቕ ኣይርድኡን።","uk":"7.1: Чи тиснуть на пана? 7.2: Вагон чи ящик? 7.3: Діти гірше розуміють рекламні наміри.","ru":"7.1: Давят ли на господина? 7.2: Вагон или ящик? 7.3: Дети хуже понимают рекламные намерения.","es":"7.1: ¿Se presiona al señor? 7.2: ¿Vagón o caja? 7.3: Los niños entienden peor las intenciones publicitarias.","pt":"7.1: O senhor está a ser pressionado? 7.2: Vagão ou caixa? 7.3: As crianças percebem pior as intenções publicitárias."},"parts":[{"q":"7.1 Ein älterer Herr fährt bei einer kostenlosen „Jubiläumsfahrt“ mit. Kurz vor der Rückfahrt bietet der Veranstalter Heizdecken an. Der Herr kauft nicht. Daraufhin stellt ihm der Veranstalter 25,00 EUR Fahrtkostenanteil in Rechnung, weil er nichts gekauft habe. Liegt ein Verstoß gegen das UWG vor? Begründe.","m":"Ja. Die Fahrt wurde als kostenlos angeboten; die nachträgliche Rechnung setzt den Teilnehmer unter Druck, doch noch zu kaufen. Das beeinträchtigt die Entscheidungsfreiheit des Verbrauchers durch eine aggressive Handlung und ist unzulässig. Zusätzlich ist die Ankündigung „kostenlos“ irreführend, wenn im Fall des Nichtkaufs doch gezahlt werden muss."},{"q":"7.2 Eine Zeitungsanzeige lautet: „Sonderangebot! 5 Waggons Apfelsinen eingetroffen!“ Tatsächlich waren es fünf Kisten. Ist die Anzeige zulässig?","m":"Nein. Fünf Waggons sind ein Vielfaches von fünf Kisten – das ist eine unwahre Angabe und damit eine irreführende geschäftliche Handlung. Außerdem wird mit einer Menge geworben, die gar nicht vorhanden ist; die Bevorratung reicht nicht aus, es handelt sich zugleich um ein Lockangebot."},{"q":"7.3 Warum verbietet das UWG die Ausnutzung geschäftlicher Unerfahrenheit von Kindern und Jugendlichen besonders – obwohl Werbung doch immer überzeugen will?","m":"Weil Kinder und Jugendliche den Wert von Angeboten, versteckte Kosten und Werbeabsichten noch nicht sicher einschätzen können. Werbung darf überzeugen – aber sie darf diese Unerfahrenheit nicht gezielt ausnutzen, etwa mit Gewinnversprechen per Kurznachricht, hinter denen teure Rückrufnummern stecken."}]},{"id":"v1","level":"v","no":"Vertiefung 1","type":"free","pts":1,"title":"Warum ist das so?","instr":{"de":"Warum ist Vergleichen in der Werbung erlaubt, Schlechtmachen aber nicht? Begründe.","vi":"Tại sao so sánh trong quảng cáo được phép, nhưng nói xấu thì không? Hãy giải thích.","tr":"Reklamda karşılaştırma neden serbest, kötüleme ise neden yasak? Gerekçelendir.","ar":"لماذا تجوز المقارنة في الإعلان ولا يجوز التشويه والتحقير؟ علّل.","ti":"ስለምንታይ ኣብ ምልክታ ምንጽጻር ይፍቀድ፣ ምጽላእ ግን ኣይፍቀድን? ኣብርህ።","uk":"Чому порівнювати в рекламі можна, а очорнювати — ні? Обґрунтуй.","ru":"Почему в рекламе сравнивать можно, а очернять нельзя? Обоснуй.","es":"¿Por qué en la publicidad se permite comparar, pero no desprestigiar? Justifica.","pt":"Porque é que na publicidade se pode comparar, mas não denegrir? Justifica."},"tip":{"de":"Denke an die Merkregel: gleiche Ware, gleiche Menge, gleiche Qualität. Und: Wer wird geschützt?","vi":"Nghĩ đến quy tắc: cùng hàng, cùng lượng, cùng chất lượng. Và: ai được bảo vệ?","tr":"Hatırlatma kuralını düşün: aynı mal, aynı miktar, aynı kalite. Ve: Kim korunuyor?","ar":"تذكّر القاعدة: بضاعة متماثلة، كمية متماثلة، جودة متماثلة. ومن هو المحمي؟","ti":"ሕጊ ምዝካር ሓስብ፡ ሓደ ዓይነት ዕቃ፣ ሓደ መጠን፣ ሓደ ጽሬት። ከምኡውን፡ መን ይሕሉ?","uk":"Згадай правило: той самий товар, та сама кількість, та сама якість. І ще: кого захищають?","ru":"Вспомни правило: тот же товар, то же количество, то же качество. И ещё: кого защищают?","es":"Piensa en la regla para recordar: misma mercancía, misma cantidad, misma calidad. Y: ¿a quién se protege?","pt":"Pensa na regra para fixar: mesma mercadoria, mesma quantidade, mesma qualidade. E: quem é protegido?"},"parts":[{"q":"Meine Begründung:","m":"Ein fairer Vergleich informiert den Verbraucher. Wenn Ware, Menge und Qualität gleich sind, kann er besser entscheiden. Das Schlechtmachen (Herabsetzung) schadet dem Mitbewerber und täuscht den Verbraucher. Das UWG schützt beide.","s":["Vergleichen ist erlaubt, weil …","Schlechtmachen ist verboten, weil …"]}]},{"id":"v2","level":"v","no":"Vertiefung 2","type":"free","pts":1,"title":"Begründe deine Entscheidung","instr":{"de":"Ein Händler wirbt: „Unser Kaffee, 500 g, kostet 4,49 €. Beim Konkurrenten kostet der Kaffee, 250 g, 2,49 €.“ Ist der Vergleich zulässig? Begründe.","vi":"Một người bán quảng cáo: “Cà phê của chúng tôi, 500 g, giá 4,49 €. Ở đối thủ, cà phê 250 g giá 2,49 €.” So sánh này có được phép không? Hãy giải thích.","tr":"Bir satıcı reklam yapıyor: „Kahvemiz, 500 g, 4,49 €. Rakipte kahve, 250 g, 2,49 €.“ Karşılaştırma izinli mi? Gerekçelendir.","ar":"يعلن تاجر: „قهوتنا، 500 g، سعرها 4,49 €. عند المنافس القهوة، 250 g، بسعر 2,49 €.“ هل المقارنة جائزة؟ علّل.","ti":"ሓደ ነጋዳይ ይሕብር፡ „ቡንና፣ 500 g፣ 4,49 € ይሽየጥ። ኣብ ተወዳዳሪ እቲ ቡን፣ 250 g፣ 2,49 € እዩ።“ እቲ ምንጽጻር ይፍቀድ ድዩ? ኣብርህ።","uk":"Продавець рекламує: „Наша кава, 500 г, коштує 4,49 €. У конкурента кава, 250 г, коштує 2,49 €.“ Чи дозволене таке порівняння? Обґрунтуй.","ru":"Продавец рекламирует: „Наш кофе, 500 г, стоит 4,49 €. У конкурента кофе, 250 г, стоит 2,49 €.“ Допустимо ли такое сравнение? Обоснуй.","es":"Un comerciante anuncia: „Nuestro café, 500 g, cuesta 4,49 €. En la competencia el café, 250 g, cuesta 2,49 €.“ ¿Está permitida la comparación? Justifica.","pt":"Um comerciante anuncia: „O nosso café, 500 g, custa 4,49 €. No concorrente o café, 250 g, custa 2,49 €.“ A comparação é permitida? Justifica."},"tip":{"de":"Vergleiche die Mengen. Rechne den Preis für gleiche Menge um, wenn du magst.","vi":"So sánh khối lượng. Nếu muốn, hãy quy đổi giá về cùng một khối lượng.","tr":"Miktarları karşılaştır. İstersen fiyatı aynı miktara çevirerek hesapla.","ar":"قارن الكميات. احسب السعر لكمية متساوية إن أردت.","ti":"መጠናት ኣወዳድር። እንተ ደለኻ ዋጋ ንሓደ ዓይነት መጠን ኣስተኻኽል።","uk":"Порівняй кількості. Якщо хочеш, перерахуй ціну на однакову кількість.","ru":"Сравни количества. Если хочешь, пересчитай цену на одинаковое количество.","es":"Compara las cantidades. Si quieres, calcula el precio para la misma cantidad.","pt":"Compara as quantidades. Se quiseres, calcula o preço para a mesma quantidade."},"parts":[{"q":"Meine Entscheidung und meine Begründung:","m":"Nicht zulässig, denn die Mengen sind verschieden (500 g gegen 250 g). Ein Preisvergleich ist nur bei gleicher Ware, gleicher Menge und gleicher Qualität fair. Bei gleicher Menge wäre die Werbung erlaubt.","s":["Der Vergleich ist (nicht) zulässig, weil …"]}]}],"ui":{"tr":{"progress":"görev yapıldı","tip":"İpucu","check":"Kontrol et","model":"Örnek çözümü göster","basis":"Temel","vert":"Derinleştirme","name":"Ad","date":"Tarih","can":"Sonrasında şunu yapabilirim","eval":"Değerlendirmeyi göster","pdf":"PDF kaydet / yazdır","restart":"Yeniden başla","ask":"Hepsi silinsin ve yeniden başlansın mı? Bu çalışma kâğıdındaki cevapların kaybolacak.","yes":"Evet, sil","no":"İptal","rate":"Cevabın ne kadar iyiydi? Örnek çözümle karşılaştır.","y":"Başardım","p":"Kısmen","n":"Henüz değil","choose":"– seç –","richtig":"doğru","falsch":"yanlış","tap":"Önemli sözcüklere dokun (sarı).","chkmark":"İşaretleri kontrol et","words":"Dokunmak için sözcükler ve cümle başlangıçları","res":"Değerlendirmen","pts":"puan","bonus":"Bonus (Derinleştirme)","mine":"Cevabın","sol":"Doğru çözüm","why":"Açıklama","path":"Hesap yolu","empty":"(cevap yok)","next":"Sonraki kişi","restored":"Kaldığın yerden devam et","level":"Seviye","selfeval":"Kendi değerlendirmen","unrated":"henüz değerlendirilmedi","of":"/","right":"doğru","found":"anahtar kavram bulundu","extra":"fazla işaretlendi","allright":"Hepsi doğru!","notall":"Henüz hepsi doğru değil. Kırmızı = yanlış. Bir daha dene.","fill":"Önce tüm alanları doldur.","readfb":"Okuma alıştırması (puansız)","hint":"Claude yardımıyla hazırlandı – lütfen kontrol ettir.","d   return`<p class="vis">${u('tap')}</p>${ps}<div class="actions"><button type="button" class="primary" data-act="rdchk" data-id="${it.id}">${u('chkmark')}</button></div>${quiz}`+(sum(it)?`<p class="vis" lang="${S.lang}">${rich(sum(it))}</p>`:'')},
 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';
   else el=`<input class="in" type="text" data-k="p${i}" data-part="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(8,String([].concat(g.a)[0]).length+2)}" value="${esc(v)}">`;
   html=html.replace('{'+i+'}',el)});
  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},
 match(it){const a=A(it.id);const o=matchOpts(it);return it.rows.map((r,i)=>`<div class="mrow" data-part="${i}"><div><b>${rich(T(r.l))}</b></div><select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${a['p'+i]===x?' selected':''}>${esc(x)}</option>`).join('')+'</select></div>').join('')},
 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{
   if(c&&typeof c==='object'){const i=n++;const o=c.o||(it.colOpts||[])[ci];const v=a['p'+i]||'';const f=o?`<select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>':`<input class="in" type="text" data-k="p${i}" value="${esc(v)}" autocomplete="off">`;
    return`<div class="fld" data-part="${i}"><label>${esc(it.cols[ci])}</label>${f}</div>`}
   return`<div class="fld"><label>${esc(it.cols[ci])}</label><div>${rich(T(c))}</div></div>`}).join('')+'</div>'}).join('')},
 calc(it){const a=A(it.id);return it.parts.map((p,i)=>`<div class="crow" data-part="${i}"><p class="qt">${rich(T(p.q))}</p><input class="in" type="text" inputmode="decimal" data-k="p${i}" value="${esc(a['p'+i]||'')}" autocomplete="off" placeholder="0,00"><span class="u">${esc(p.u||'')}</span>${p.work?`<textarea class="in" data-k="p${i}w" rows="2" style="min-height:4rem" placeholder="${u('workph')}">${esc(a['p'+i+'w']||'')}</textarea>`:''}</div>`).join('')},
 free(it){const a=A(it.id);const sh=S.shown[it.id];return it.parts.map((p,i)=>`<div class="fpart"><p class="qt">${rich(T(p.q))}</p>${wg(it,i,p)}<textarea class="in" id="${it.id}_${i}" data-k="p${i}" rows="3" placeholder="…">${esc(a['p'+i]||'')}</textarea>`+(sh?`<div class="model"><div class="t">${u('model').replace(/ anzeigen| ?$/,'')}</div>${rich(T(p.m))}</div>`:'')+'</div>').join('')+(sh?`<div class="rate"><span style="flex:1 1 100%;font-weight:600">${u('rate')}</span>`+['y','p','n'].map(v=>`<button type="button" data-rate="${v}" data-k="r" class="${a.r===v?'on':''}">${u(v)}</button>`).join('')+'</div>':'')}
};
function actions(it){if(it.type==='info'||it.type==='read')return'';if(it.type==='free')return S.shown[it.id]?'':`<button type="button" class="primary" data-act="model" data-id="${it.id}">${u('model')}</button>`;return`<button type="button" class="primary" data-act="check" data-id="${it.id}">${u('check')}</button>`}
function cardHtml(it){const v=it.level==='v';
 return`<section class="card${v?' vert':''}" id="c_${it.id}" data-id="${it.id}"><header>${it.no?`<span class="no">${esc(it.no)}</span>`:''}<h2>${rich(T(it.title))}</h2><span class="pts">${ptsLabel(it)}</span></header>`+
 (it.instr?`<p class="instr">${rich(T(it.instr))}</p>`:'')+tipBlock(it)+`<div class="body">${BODY[it.type](it)}</div><div class="actions">${actions(it)}</div><div class="fb" aria-live="polite"></div></section>`}
function renderAll(){
 document.documentElement.lang=S.lang;
 $('#cards').innerHTML=D.items.filter(visible).map(cardHtml).join('');
 $('#t_can').textContent=u('can');$('#l_name').textContent=u('name');$('#l_date').textContent=u('date');
 $('#cans').innerHTML=D.can.map((c,i)=>`<label><input type="checkbox" data-can="${i}"${S.can[i]?' checked':''}><span>${rich(T(c))}</span></label>`).join('');
 $('#b_eval').textContent=u('eval');$('#b_pdf').textContent='📄 '+u('pdf');$('#b_restart').textContent=u('restart');
 $$('[data-lv]').forEach(b=>{b.textContent=u(b.dataset.lv==='b'?'basis':'vert');b.classList.toggle('on',S.level===b.dataset.lv)});
 $$('[data-lg]').forEach(b=>b.classList.toggle('on',S.lang===b.dataset.lg));
 $('#cnt').textContent='';$('#m_ask').textContent=u('ask');$('#m_yes').textContent=u('yes');$('#m_no').textContent=u('no');
 D.items.filter(visible).forEach(it=>{if(S.checked[it.id])paint(it)});
 if(S.sub)renderResult();else $('#result').classList.add('hide');
 autoDir();progress()}
function progress(){const its=D.items.filter(it=>visible(it)&&counted(it));let n=0;its.forEach(it=>{if(grade(it).filled)n++});
 const pc=its.length?Math.round(n/its.length*100):0;$('#barfill').style.width=pc+'%';$('#cnt').textContent=n+' / '+its.length+' '+u('progress');
 $$('.card').forEach(c=>{const it=D.items.find(x=>x.id===c.dataset.id);c.classList.toggle('done',counted(it)&&grade(it).filled)});
 [25,50,75,100].forEach(m=>{if(pc>=m&&!(S.toast||{})[m]&&n>0){S.toast=S.toast||{};S.toast[m]=1;if(m===100||m===50)toast(m+' % ✓')}})}
function paint(it){const c=$('#c_'+it.id);if(!c)return;const g=grade(it);const fb=$('.fb',c);
 if(it.type==='read'){const a=A(it.id);const rd=$$('.rd',c);rd.forEach(r=>r.classList.add('chk'));
  let h=`${g.found===g.total&&!g.extra?'✔':'ℹ️'} ${g.found} ${u('of')} ${g.total} ${u('found')}`+(g.extra?`, ${g.extra} ${u('extra')}`:'');fb.className='fb '+(g.found===g.total&&!g.extra?'ok':'mid');fb.innerHTML=h;
  const q=it.quiz;if(q&&a.q!=null){const qq=$('.q',c);const ok=+a.q===q.a;qq.classList.toggle('ok',ok);qq.classList.toggle('bad',!ok);fb.innerHTML+=`<small>${ok?'✓':'✗'} ${rich(T(q.why))}</small>`}return}
 if(!S.checked[it.id]||it.type==='info')return;
 if(it.type==='free'){return}
 const right=g.parts.filter(p=>p.ok===true).length;
 g.parts.forEach((p,i)=>{$$('[data-part="'+i+'"]',c).forEach(el=>{el.classList.remove('ok','bad');if(p.has)el.classList.add(p.ok===true?'ok':'bad');else el.classList.add('bad')})});
 fb.className='fb '+(right===g.parts.length?'ok':right?'mid':'bad');
 fb.innerHTML=(right===g.parts.length?'✓ '+u('allright'):right+' '+u('of')+' '+g.parts.length+' '+u('right')+'. '+(g.filled?'':u('fill')+' ')+(right<g.parts.length?`<small>${u('notall')}</small>`:''))}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)}
/* ---------- Ergebnis ---------- */
function stateOf(r){return r.ok===true?'g':r.ok===0.5?'m':'r'}
function renderResult(){
 const its=D.items.filter(visible);let got=0,max=0,bg=0,bm=0;
 const html=its.filter(it=>it.type!=='info').map(it=>{const g=grade(it);
  if(it.type==='read'){return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))} <span class="st ${g.found===g.total&&!g.extra?'g':'m'}">${g.filled?g.found+' / '+g.total:'–'}</span></h4><small>${u('readfb')}</small></div>`}
  if(it.level==='v'){bg+=g.got;bm+=g.max}else{got+=g.got;max+=g.max}
  const nr=g.parts.filter(r=>r.ok===true).length;const full=it.pts?g.got>=g.max-0.001:nr===g.parts.length;const cls=full?'g':(it.pts?g.got>0:nr>0)?'m':'r';
  let li=g.parts.map((r,i)=>{const p=r.p;let line='';const lab=it.type==='match'?T(p.l):it.type==='table'?(it.rows[p.ri]&&T(it.rows[p.ri][0])||'')+' ['+it.cols[p.ci]+']':it.type==='gap'?'('+(i+1)+')':T(p.q||p.t||'')||(i+1);
   const mark=r.ok===true?'✓':r.ok===0.5?'◐':'✗';
   line=`<li><b>${mark}</b> ${rich(String(lab).slice(0,200))}<br><span class="${r.ok===true?'':'mine'}">${u('mine')}: ${r.mine?rich(r.mine):u('empty')}</span>`;
   if(r.ok!==true||it.type==='free')line+=`<br><span class="sol">${u('sol')}: ${rich(r.sol)}</span>`;
   if(r.ok!==true&&r.why)line+=`<br><small>${u('why')}: ${rich(T(r.why))}</small>`;
   if(it.type==='calc'&&p.steps)line+=`<div class="steps"><b>${u('path')}:</b>`+p.steps.map(s=>`<div>${esc(T(s))}</div>`).join('')+'</div>';
   return line+'</li>'}).join('');
  if(it.why&&!full)li+=`<li><small>${u('why')}: ${rich(T(it.why))}</small></li>`;
  if(it.type==='free'&&g.parts.some(r=>!r.has))li+=`<li><small>${u('unrated')}</small></li>`;
  return`<div class="ritem"><h4><span>${esc(it.no||'')}</span> ${rich(T(it.title))}${it.level==='v'?' ('+u('vert')+')':''} <span class="st ${cls}">${it.pts?fmt(g.got)+' / '+fmt(g.max):''}</span></h4><ul>${li}</ul></div>`}).join('');
 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}
/* ---------- Ereignisse ---------- */
function cardOf(e){const c=e.closest('.card');return c?D.items.find(x=>x.id===c.dataset.id):null}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();return}if(t.id==='dt'){S.date=t.value;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.rate){const it=cardOf(t);A(it.id)[t.dataset.k]=t.dataset.rate;$$('[data-k="'+t.dataset.k+'"]',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));progress();save();return}
 const act=t.dataset.act;if(!act)return;const it=D.items.find(x=>x.id===t.dataset.id);
 if(act==='check'){S.checked[it.id]=true;paint(it);progress();save()}
 if(act==='rdchk'){A(it.id).chk=true;const c=$('#c_'+it.id);const keep=window.scrollY;const fbk=true;renderCard(it);paint(it);window.scrollTo(0,keep);progress();save()}
 if(act==='model'){S.shown[it.id]=true;renderCard(it);progress();save()}
});
function renderCard(it){const old=$('#c_'+it.id);const tmp=document.createElement('div');tmp.innerHTML=cardHtml(it);const det=old.querySelector('.tip').open;old.replaceWith(tmp.firstChild);if(S.checked[it.id]||it.type==='read')paint(it)}
function evaluate(){renderResult();$('#result').scrollIntoView({behavior:'smooth'})}
$('#b_eval').onclick=evaluate;
$('#b_pdf').onclick=()=>{renderResult();setTimeout(()=>window.print(),100)};
$('#b_restart').onclick=()=>$('#modal').classList.add('on');
$('#m_no').onclick=()=>$('#modal').classList.remove('on');
$('#m_yes').onclick=()=>{$('#modal').classList.remove('on');S=def();clearStore();$('#nm').value='';$('#dt').value=S.date;renderAll();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',()=>{$$('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})});
/* ---------- Start ---------- */
const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a.r=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();

</script>
