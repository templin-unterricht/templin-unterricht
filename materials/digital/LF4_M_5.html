<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF 4 · Digitales Arbeitsblatt</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + .5rem) 1rem .4rem}
#bar .row{display:flex;align-items:center;gap:.6rem;max-width:56rem;margin:0 auto}
#bar .ttl{font-weight:700;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{height:.7rem;background:#e6e3da;border-radius:1rem;overflow:hidden;max-width:56rem;margin:.35rem auto 0}
#progf{height:100%;width:0;background:var(--pri);transition:width .4s}
#progt{font-size:.8rem;color:var(--mute);max-width:56rem;margin:.1rem auto 0}
#langs{display:flex;gap:.4rem;overflow-x:auto;max-width:56rem;margin:.35rem auto 0;padding-bottom:.15rem;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;min-height:44px;padding:0 .9rem;border:2px solid var(--line);background:#fff;border-radius:2rem;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;margin:0 0 1rem}
.card h2{font-size:1.25rem;margin:0 0 .4rem;line-height:1.3}
.card h2 .nr{display:inline-block;background:var(--pri);color:#fff;border-radius:.5rem;padding:0 .5rem;margin-right:.4rem;font-size:.95rem}
.vtag{display:inline-block;background:#6a3fa0;color:#fff;border-radius:.5rem;padding:0 .5rem;font-size:.85rem;margin-left:.3rem}
.card.v{border-color:#6a3fa0;background:#faf6ff}
.tr{font-size:.9rem;color:#4a5a66;background:#f1f6f9;border-left:4px solid #9cc3d5;border-radius:.4rem;padding:.3rem .6rem;margin:.3rem 0 .5rem;line-height:1.5}
.tr[dir=rtl]{border-left:0;border-right:4px solid #9cc3d5}
.tr[lang=ti]{font-family:"Kefa","Noto Sans Ethiopic",sans-serif}
.tr[lang=vi]{line-height:1.65}
small.b{display:block;font-size:.72rem;font-weight:400;opacity:.9;line-height:1.2}
.in{display:block;width:100%;min-height:48px;font:inherit;font-size:1rem;padding:.55rem .7rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink)}
input.in,select.in{font-size:1rem}
textarea.in{min-height:5.5rem;resize:vertical}
.btn{min-height:48px;padding:.4rem 1.1rem;border:0;border-radius:.8rem;background:var(--pri);color:#fff;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin:.3rem .4rem .3rem 0}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.gray{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.big{min-height:56px;font-size:1.1rem}
.btn:active,.pill:active,.opt:active,.ch:active{transform:scale(.97)}
.tipb{min-height:48px;min-width:48px;border-radius:2rem;border:2px solid var(--warn);background:var(--warnbg);font:inherit;font-size:1rem;cursor:pointer;padding:0 .9rem;float:right;margin:0 0 .3rem .5rem}
.tipbox{background:var(--warnbg);border:2px solid var(--warn);border-radius:.8rem;padding:.5rem .8rem;margin:.4rem 0}
.q{margin:.8rem 0 .2rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:.45rem;margin:.3rem 0}
.opt{min-height:48px;text-align:left;padding:.5rem .8rem;border:2px solid var(--line);background:#fff;border-radius:.8rem;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--pri);background:var(--pri2);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.tbl{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:1rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.4rem .3rem;text-align:left;vertical-align:middle}
.tbl.info th{background:#eef3f6}
.tbl.info td,.tbl.info th{border:1px solid var(--line);padding:.4rem .5rem}
.tbl td.c{text-align:center;white-space:nowrap}
.ch{min-width:48px;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:.7rem;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer;margin:2px}
.ch.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.sol{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
tr.rok td{background:var(--okbg)}tr.rno td{background:var(--badbg)}
.fb{border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0;font-size:1rem}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb.part{background:var(--warnbg);border:1px solid var(--warn)}
.sit{background:#eef3f6;border-left:5px solid var(--pri);border-radius:.5rem;padding:.5rem .8rem;margin:.5rem 0}
.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#23303a;color:#fff;padding:.6rem 1.1rem;border-radius:2rem;z-index:99;font-size:1rem;max-width:90%}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}
.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}
#set.open{display:block}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row2 label{font-weight:600;min-width:7rem}
.nowrap{white-space:nowrap}
#report{display:none}
@media (max-width:600px){main{padding-top:8.2rem}.card{padding:.8rem}h1{font-size:1.35rem}.tbl{font-size:.95rem}}
@media print{
 body{background:#fff;padding:0;font-size:11pt}
 #bar,#set,main,.toast,.dlg,.noprint{display:none!important}
 #report{display:block!important}
 #report h1{font-size:16pt}
 #report table{width:100%;border-collapse:collapse;font-size:10pt}
 #report td,#report th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

</style>
</head>

{k:'task',id:'a2',n:'Aufgabe 2',h:'Was stimmt nicht im Laden von Familie Brandt?',intro:'Familie Brandt führt einen kleinen Supermarkt. Die Kunden beschweren sich, dass sie sich unwohl fühlen und nichts finden. Welcher Mangel passt zur Beobachtung?',tip:'Frage dich: Was stört den Kunden? Sieht er alles? Kommt er gut durch? Findet er die Ware?',ex:'Verbesserungen: Mittelregale höchstens etwa 1,50 m · breitere Gänge · Aktionsware auf eine Aktionsfläche, Wege frei · Beschilderung und Lageplan · hellere Beleuchtung · Rundlauf (Loop) statt Sackgasse.',items:[
 {t:'sel',id:'a2.1',q:'2.1 Welcher Mangel passt?',o:['Kunden verlieren die Übersicht (zu hohe Regale)','Zu eng für Einkaufswagen, Kinderwagen und Rollator','Barriere und Unfallgefahr','Kunden finden die Ware nicht (keine Orientierung)','Dunkle Bereiche werden gemieden','Sackgasse: Kunden müssen umkehren'],rows:[['1 Die Regale in der Mitte sind 2,20 m hoch.',0],['2 Die Gänge sind nur 80 cm breit.',1],['3 Mitten im Hauptgang stehen Kartons mit Aktionsware.',2],['4 Es gibt keine Schilder, welche Ware wo steht.',3],['5 Die hintere Ecke mit den Getränken ist dunkel.',4],['6 Der Gang zu den Getränken endet vor einer Wand.',5]]}]},
{k:'read',id:'r1',h:'Zum Nachlesen: Den Verkaufsraum aufteilen und die Wege planen',sum:'Ein guter Verkaufsraum ist übersichtlich, hat breite Gänge ohne Barrieren und führt die Kunden an viel Ware vorbei.',
 paras:['Der Verkaufsraum hat drei Flächen: die [[Warenfläche]] (hier steht die Ware), die [[Kundenfläche]] (Laufwege, Ein- und Ausgänge, Treppen) und die [[übrige Verkaufsfläche]] (Kassen, Anprobe, Ruhezonen). Beim Erlebniskauf wird die übrige Verkaufsfläche immer größer.','Die [[Raumordnung]] gliedert den Verkaufsraum. Ziel ist ein flüssiger [[Kundenstrom]]: Die Kunden sollen an möglichst vielen Waren vorbeikommen, ohne sich gelenkt oder eingeengt zu fühlen.','Kriterien für die Anordnung der Warenträger: [[genügend breite Gänge]], [[Übersichtlichkeit]] (Warenträger in der Mitte höchstens etwa 1,50 m hoch), [[klare Struktur]], [[Lenkung des Kundenlaufs]], [[gute Erreichbarkeit]] der Ware und [[keine Barrieren]].','Für ältere Kunden zusätzlich: Sitzmöglichkeiten, größere und gut lesbare Preisschilder, Leselupen am Regal, gute Beleuchtung, rutschfester Boden, Einkaufswagen mit Sitz oder für Rollatoren, kleinere Packungen, Lieferservice.','Bei der Wegeführung gibt es den [[Loop]] (Rundlauf), den [[Zwangsumlauf]] und den [[Individualumlauf]]. Lange Wege werden durch [[Faszinationspunkte]], [[Stopper]] und Ruhezonen unterbrochen. Beim [[Arenaprinzip]] steigen die Warenträger nach außen an wie in einem Stadion.'],
 html:'<table class="tbl info"><tr><th>Form</th><th>So funktioniert es</th><th>Beispiel</th></tr><tr><td>Loop (Rundlauf)</td><td>ein Rundweg durch den ganzen Laden, kein Wegstück doppelt</td><td>Warenhaus, großer Supermarkt</td></tr><tr><td>Zwangsumlauf</td><td>der Kunde kann vom vorgegebenen Weg nicht abweichen – in der Praxis selten</td><td>manche Möbelhäuser, Discounter mit Schranke</td></tr><tr><td>Individualumlauf</td><td>der Kunde wählt seinen Weg selbst</td><td></td></tr><tr><td>– Kreuzprinzip</td><td>Gänge kreuzen sich rechtwinklig</td><td>Lebensmittelmarkt</td></tr><tr><td>– Sternprinzip</td><td>Wege führen strahlenförmig von einem Mittelpunkt weg</td><td>Fachgeschäft, Kaufhausetage</td></tr><tr><td>– Kojenprinzip</td><td>viele Nischen mit engem Kontakt zur Ware</td><td>Modehaus, Buchhandlung</td></tr></table><p class="meta"><b>Arenaprinzip:</b> vorn Tische und Podeste (0,80–1,40 m), dann halbhohe Regale (1,40–1,60 m), an der Wand hohe Regale und Dekoration (ab 2,30 m).</p>',

{k:'task',id:'a3',n:'Aufgabe 3',h:'Vorgemacht: eine Prüfungsaufgabe',hk:'c.vor.h',intro:'Lies das Beispiel. Dann entscheide: richtig oder falsch?',ik:'c.vor.i',tip:'Schau in die Tabelle „So gehe ich vor“. Schicke den Kunden im Kopf durch den Laden.',ex:'Genau vier verschiedene Kriterien. „Breite Gänge“ und „genügend Platz für Laufwege“ sind dasselbe.',
 sit:'<b>Die Aufgabe:</b> Der Schuhmarkt Westend GmbH baut seine Sportabteilung um. Dabei werden auch die Warenträger neu angeordnet. Nennen Sie 4 Kriterien, die Sie dabei beachten sollten! (4 Punkte)<table class="tbl info"><tr><th>Denkschritt</th><th>So gehe ich vor</th></tr><tr><td>1 Operator</td><td>„Geben Sie an“ = Stichworte, genau vier. Jedes bringt 1 Punkt.</td></tr><tr><td>2 Den Kunden im Kopf durch den Laden schicken</td><td>Kommt er gut durch? Sieht er alles? Findet er die Ware? Erreicht er sie?</td></tr><tr><td>3 Aufschreiben</td><td>genügend Platz für Laufwege · übersichtliche Raumaufteilung · kundenorientierte Warenplatzierung · leichte Erreichbarkeit der Ware</td></tr><tr><td>4 Prüfen</td><td>Vier verschiedene Kriterien? „Breite Gänge“ und „genügend Platz für Laufwege“ ist dasselbe – nicht doppelt zählen.</td></tr></table>',items:[
 {t:'tf',id:'a3.1',rows:[['Bei „Geben Sie an“ schreibe ich genau vier Stichworte.',true],['„Breite Gänge“ und „genügend Platz für Laufwege“ zählen als zwei Kriterien.',false],['Ich frage mich: Findet der Kunde die Ware und erreicht er sie?',true]]}]},
{k:'task',id:'a4',n:'Aufgabe 4',h:'Geführte Übung: Welche Wegeführung ist das?',intro:'Lies jede Beschreibung. Welche Form der Wegeführung ist es?',ik:'a4.i',tip:'Gibt es einen vorgegebenen Weg? Einen Rundweg? Kreuzende Gänge? Wege von einer Mitte aus? Nischen?',ex:'Ein Weg ohne Wahl = Zwangsumlauf. Rundweg = Loop. Rechtwinklige Gänge = Kreuzprinzip. Strahlen von einer Mitte = Sternprinzip. Nischen = Kojenprinzip. Freie Wahl = Individualumlauf.',items:[
 {t:'sel',id:'a4.1',o:['Zwangsumlauf','Loop (Rundlauf)','Kreuzprinzip','Sternprinzip','Kojenprinzip','Individualumlauf'],rows:[['1 Der Kunde kann nur einem Weg folgen, bis er an der Kasse ankommt.',0],['2 Ein Rundweg führt durch den ganzen Laden, kein Wegstück wird doppelt gegangen.',1],['3 Gänge kreuzen sich rechtwinklig wie Straßen; der Kunde wählt seinen Weg selbst.',2],['4 Von einem Platz in der Mitte gehen Wege in alle Richtungen zu den Abteilungen.',3],['5 Viele kleine, halb offene Nischen, in denen Waren besonders nah präsentiert werden.',4],['6 Der Kunde darf gehen, wie er will – es gibt keinen vorgegebenen Weg.',5]]}]},
{k:'task',id:'a5',n:'Aufgabe 5',h:'Geführte Übung: Den Laufweg einzeichnen',intro:'Auf dem Papier-Arbeitsblatt zeichnest du in den Grundriss mit Pfeilen ein, wie die meisten Kunden durch den Supermarkt gehen. Die meisten Kunden gehen rechts herum und bevorzugen die Außengänge. Beantworte hier die Fragen dazu.',ik:'a5.i',tip:'Wohin gehen die meisten Kunden nach dem Eingang? Wo liegen die Kassen?',ex:'Der Kunde läuft den ganzen Laden ab und kommt an viel Ware vorbei.',items:[
 {t:'free',id:'a5.1',q:'5.1 Welche Form der Wegeführung hat dieser Supermarkt?',model:'Individualumlauf nach dem Kreuzprinzip, mit einem Hauptlaufweg als Rundlauf an den Außenwänden'},
 {t:'free',id:'a5.2',q:'5.2 Warum liegen Eingang und Kassen an entgegengesetzten Enden der Vorderseite?',model:'Der Kunde muss den ganzen Laden durchlaufen und kommt an möglichst viel Ware vorbei.'}]},
{k:'task',id:'a6',n:'Aufgabe 6',h:'Freie Übung: Ein Laden für ältere Kunden',intro:'Das Kaufhaus Hansa GmbH möchte stärker auf die Bedürfnisse von „Best Agern“ und Senioren eingehen, weil diese Kundengruppe immer größer wird.',ik:'a6.i',tip:'Denke an Gehen, Sehen, Tragen und Sitzen. Was fällt älteren Menschen schwer?',ex:'Gute Maßnahmen helfen beim Gehen, Sehen, Tragen und Ausruhen.',items:[
 {t:'free',id:'a6.1',pts:5,q:'6.1 Welche 5 Maßnahmen kann das Kaufhaus ergreifen? (5 Punkte)',model:'z. B. breitere Gänge, keine hohen Regale; Einkaufswagen für Rollatoren; Sitzmöglichkeiten; größere Preisschilder und Leselupen; kleinere Packungsgrößen; Lieferservice; gute Beleuchtung (je 1 P.)'},
 {t:'free',id:'a6.2',q:'6.2 Welche dieser Maßnahmen kosten wenig und helfen allen Kunden? Wähle zwei aus und begründe.',model:'z. B. breite Gänge (auch für Kinderwagen), größere Preisschilder (für alle schneller lesbar) – kaum Mehrkosten, mehr Zufriedenheit'}]},
{k:'task',id:'a7',n:'Aufgabe 7',h:'Prüfungs-Check (10 Punkte · etwa 10 Minuten)',hk:'c.pruef.h',intro:'Lies die Situation. Beantworte die Fragen wie in der Prüfung.',ik:'c.pruef.i',tip:'Erläutern = Grund nennen UND erklären. Nennen = Stichworte. Beschreiben = ganze Sätze.',tk:'a7.t',ex:'Bei 7.3 müssen es andere Kriterien als in 7.2 sein, in ganzen Sätzen.',
 sit:'<b>Situation:</b> Eine Abteilung der Möbelhaus Nord GmbH (Wohnen und Dekoration) soll modernisiert werden. Sie sind Mitglied eines Teams und sollen Vorschläge erarbeiten.',items:[
 {t:'free',id:'a7.1',pts:4,q:'7.1 Erläutern Sie 2 Gründe, warum die Abteilung modernisiert werden sollte! (4 Punkte)',model:'neue Kaufanreize für die Kunden; angenehmere Einkaufsatmosphäre; Abhebung von Mitbewerbern; Einkaufen wird zum Erlebnis (je 2 P.)'},
 {t:'free',id:'a7.2',pts:4,q:'7.2 Sie wollen die Waren kundenfreundlicher präsentieren. Nennen Sie 4 Kriterien für die Anordnung der Warenträger! (4 Punkte)',model:'genügend breite Gänge, Übersichtlichkeit, klare Struktur der Warenanordnung, positive Lenkung des Kundenlaufs, gute Erreichbarkeit der Ware (nicht zu hohe Regale)'},
 {t:'free',id:'a7.3',pts:4,q:'7.3 Beschreiben Sie 2 weitere Kriterien für die Aufstellung der Warenträger! Nehmen Sie andere Kriterien als in 7.2 und schreiben Sie in ganzen Sätzen. (4 Punkte)',model:'z. B. Die Gangbreite muss ausreichend sein, damit Kunden mit Einkaufswagen aneinander vorbeikommen. Es dürfen keine Barrieren entstehen, über die Kunden stolpern. (je 2 P.)'}]},
{k:'task',id:'a8',n:'Aufgabe 8',h:'Für Profis',hk:'c.profis.h',intro:'Schwierigere Fragen. Begründe deine Antwort.',ik:'c.profis.i',tip:'8.1: Schaue auf Händler und Kunden. 8.2: Denke an ein Stadion: Wo sitzen die Zuschauer hinten?',ex:'Ein gutes Urteil nennt beide Seiten. Beim Arenaprinzip steigen die Warenträger nach außen an.',items:[
 {t:'free',id:'a8.1',q:'8.1 Einige Möbelhäuser führen ihre Kunden im Zwangsumlauf durch die ganze Ausstellung. Beurteilen Sie diese Wegeführung aus Sicht des Händlers und aus Sicht der Kunden.',model:'Händler: Kunden sehen das ganze Sortiment, viele Impuls- und Zusatzkäufe, planbarer Kundenstrom. Kunden: bequem für Stöberer, aber lästig für Eilige (lange Wege, kein direkter Weg zur gesuchten Ware); Abkürzungen dämpfen den Ärger. Urteil begründet.'},
 {t:'free',id:'a8.2',q:'8.2 Erläutern Sie das Arenaprinzip und beschreiben Sie die drei Ebenen mit ihren Höhen. (Die Skizze zeichnest du auf Papier.)',model:'Warenträger steigen nach außen an: Tische/Podeste 0,80–1,40 m, halbhohe Regale 1,40–1,60 m, Wand ab 2,30 m. Vom Hauptweg sieht der Kunde alle Ebenen – wie die Zuschauer im Stadion.'}]},
{k:'task',id:'v1',lvl:'v',n:'Vertiefung',h:'Warum ist das so?',hk:'c.v.h',intro:'Begründe deine Antwort in ganzen Sätzen. Vergleiche danach mit der Musterlösung.',ik:'c.v.i',tip:'Beginne mit „Weil …“. Denke an den Kunden im Laden.',tk:'c.v.t',ek:'c.v.e',items:[

 {t:'free',id:'v1.2',pts:2,q:'V2 Begründe: Warum wird beim Erlebniskauf die „übrige Verkaufsfläche“ immer größer?',model:'Zur übrigen Verkaufsfläche gehören Kassen, Anprobe- und Vorführräume sowie Ruhe- und Erfrischungszonen. Beim Erlebniskauf sollen Kunden sich wohlfühlen und länger bleiben – dafür braucht man mehr solcher Flächen und weniger reine Warenfläche.'}]},
{k:'task',id:'a9',n:'Aufgabe 9',h:'Exkursion Teil 2 (DS 15)',intro:'',items:[{t:'note',html:'In der zweiten Hälfte von DS 14 bildet ihr Teams und füllt den Vorbereitungsbogen aus dem Exkursionsheft aus. In DS 15 bearbeitet jedes Team im Supermarkt seinen Bogen (Sinne, Laufweg, Zonen, Regal, Preisschild). Das Laufweg-Team braucht dieses Arbeitsblatt: Die Tabelle „Wegeführung“ ist eure Checkliste.'}]},

'title':['Phân chia không gian bán hàng và lối đi','Distribución del espacio y recorridos','Divisão do espaço e percursos','Розподіл простору й маршрути','ምምቕቓል ቦታን መገድታትን','Разделение пространства и маршруты','تقسيم المساحة وممرات السير','Alan bölümü ve yürüyüş yolları'],
'can.0':['Phân biệt Warenfläche (diện tích để hàng), Kundenfläche (diện tích khách) và übrige Verkaufsfläche (diện tích bán hàng khác).','Distinguir Warenfläche (superficie de mercancías), Kundenfläche (superficie de clientes) y übrige Verkaufsfläche (otra superficie de venta).','Distinguir Warenfläche (área de mercadoria), Kundenfläche (área de clientes) e übrige Verkaufsfläche (outra área de venda).','Розрізняти Warenfläche (площа для товару), Kundenfläche (площа для клієнтів) і übrige Verkaufsfläche (інша торгова площа).','Warenfläche፣ Kundenfläche ን übrige Verkaufsfläche ፍለይ።','Различать Warenfläche (площадь товара), Kundenfläche (площадь клиентов) и übrige Verkaufsfläche (прочая торговая площадь).','التمييز بين Warenfläche (مساحة البضائع) وKundenfläche (مساحة الزبائن) وübrige Verkaufsfläche (مساحة بيع أخرى).','Warenfläche (mal alanı), Kundenfläche (müşteri alanı) ve übrige Verkaufsfläche (diğer satış alanı) farkını bilmek.'],
'can.1':['Kể tiêu chí thiết kế phòng bán hàng – cả cho khách lớn tuổi.','Nombrar criterios para diseñar una sala de ventas, también para clientes mayores.','Nomear critérios para o desenho de uma sala de vendas, também para clientes mais velhos.','Назвати критерії оформлення торгового залу, зокрема для літніх клієнтів.','መዐቀኒታት ንዲዛይን ቤት ሽያጥ ጥቀስ — ንኣረጋውያን ዓሚላትውን።','Назвать критерии оформления торгового зала, в том числе для пожилых клиентов.','ذكر معايير تصميم قاعة البيع – بما فيها للزبائن كبار السن.','Satış salonu tasarımının ölçütlerini, yaşlı müşteriler için de söylemek.'],
'can.2':['Phân biệt Loop (vòng tròn), Zwangsumlauf (đường bắt buộc) và Individualumlauf (đường tự chọn).','Distinguir Loop (circuito), Zwangsumlauf (recorrido obligatorio) e Individualumlauf (recorrido libre).','Distinguir Loop (circuito), Zwangsumlauf (percurso obrigatório) e Individualumlauf (percurso livre).','Розрізняти Loop (кільце), Zwangsumlauf (примусовий маршрут) та Individualumlauf (вільний маршрут).','Loop፣ Zwangsumlauf ን Individualumlauf ፍለይ።','Различать Loop (кольцо), Zwangsumlauf (принудительный обход) и Individualumlauf (свободный обход).','التمييز بين Loop (حلقة) وZwangsumlauf (مسار إجباري) وIndividualumlauf (مسار حر).','Loop (halka), Zwangsumlauf (zorunlu yol) ve Individualumlauf (serbest yol) farkını bilmek.'],
'a1.t':['Hãy nghĩ đến ba hình thức bán hàng và „stummer Verkäufer“ (người bán thầm lặng).','Piensa en las tres formas de venta y en el «stumme Verkäufer» (vendedor mudo).','Pensa nas três formas de venda e no «stumme Verkäufer» (vendedor mudo).','Згадай три форми продажу й «stummer Verkäufer» (німого продавця).','ሰለስተ ቅርጽታት ሽያጥን «stummer Verkäufer» ን ሕሰብ።','Вспомни три формы продажи и «stummer Verkäufer» (немого продавца).','فكّر في أشكال البيع الثلاثة وفي «stummer Verkäufer» (البائع الصامت).','Üç satış biçimini ve «stummer Verkäufer»’i (sessiz satıcı) düşün.'],
'a1.e':['Xem lại Modul 4: Vollbedienung, Vorwahl, Selbstbedienung.','Repasa el Modul 4: Vollbedienung, Vorwahl, Selbstbedienung.','Revê o Modul 4: Vollbedienung, Vorwahl, Selbstbedienung.','Повтори Modul 4: Vollbedienung, Vorwahl, Selbstbedienung.','Modul 4 ደጊምካ ርአ: Vollbedienung, Vorwahl, Selbstbedienung።','Повтори Modul 4: Vollbedienung, Vorwahl, Selbstbedienung.','راجع Modul 4: Vollbedienung وVorwahl وSelbstbedienung.','Modul 4’e tekrar bak: Vollbedienung, Vorwahl, Selbstbedienung.'],
'a1.1.q':['1.1 Hình thức bán hàng nào: khách tự chọn trước, nhân viên tư vấn khi được yêu cầu?','1.1 ¿Qué forma de venta: el cliente elige primero y el personal asesora si se pide?','1.1 Que forma de venda: o cliente escolhe primeiro e o pessoal aconselha se for pedido?','1.1 Яка форма продажу: клієнт сам обирає, персонал консультує на прохання?','1.1 ኣየናይ ቅርጺ ሽያጥ: ዓሚል ባዕሉ ይመርጽ፣ ሰራሕተኛ ብሕቶ ይመኽር?','1.1 Какая форма продажи: клиент сам выбирает, персонал консультирует по желанию?','1.1 أي شكل بيع: الزبون يختار بنفسه والموظفون يستشيرون عند الطلب؟','1.1 Hangi satış biçimi: Müşteri kendisi seçer, personel isteğe göre danışmanlık verir?'],
'a1.2.q':['1.2 Kể một ưu điểm của Selbstbedienung (tự phục vụ) đối với cửa hàng.','1.2 Nombra una ventaja de la Selbstbedienung (autoservicio) para la empresa.','1.2 Nomeia uma vantagem da Selbstbedienung (self-service) para a empresa.','1.2 Назви одну перевагу Selbstbedienung (самообслуговування) для підприємства.','1.2 ሓደ ረብሓ Selbstbedienung ንኩባንያ ጥቀስ።','1.2 Назови одно преимущество Selbstbedienung (самообслуживания) для предприятия.','1.2 اذكر ميزة واحدة لـ Selbstbedienung (الخدمة الذاتية) بالنسبة للمنشأة.','1.2 Selbstbedienung’un (self servis) işletme için bir avantajını söyle.'],
'a1.3.q':['1.3 Tại sao trưng bày hàng trong Selbstbedienung gọi là „stummer Verkäufer“?','1.3 ¿Por qué la presentación de la mercancía en la Selbstbedienung se llama «stumme Verkäufer»?','1.3 Porque é que a apresentação da mercadoria na Selbstbedienung se chama «stumme Verkäufer»?','1.3 Чому презентація товару в Selbstbedienung називається «stummer Verkäufer»?','1.3 ስለምንታይ ምርኢት ኣቕሑት ኣብ Selbstbedienung «stummer Verkäufer» ይበሃል?','1.3 Почему презентация товара в Selbstbedienung называется «stummer Verkäufer»?','1.3 لماذا يُسمّى عرض البضاعة في Selbstbedienung «stummer Verkäufer»؟','1.3 Selbstbedienung’da mal sunumuna neden «stummer Verkäufer» denir?'],
'a2.h':['Cửa hàng của gia đình Brandt có gì không ổn?','¿Qué falla en la tienda de la familia Brandt?','O que está errado na loja da família Brandt?','Що не так у магазині родини Brandt?','ኣብ ድኳን ስድራ Brandt እንታይ ጌጋ ኣሎ?','Что не так в магазине семьи Brandt?','ما الخطأ في متجر عائلة Brandt؟','Brandt ailesinin mağazasında ne yanlış?'],
'a2.i':['Gia đình Brandt có một siêu thị nhỏ. Khách phàn nàn là họ thấy khó chịu và không tìm thấy gì. Khiếm khuyết nào hợp với quan sát?','La familia Brandt tiene un pequeño supermercado. Los clientes se quejan de que se sienten incómodos y no encuentran nada. ¿Qué defecto encaja con la observación?','A família Brandt tem um pequeno supermercado. Os clientes queixam-se de que se sentem desconfortáveis e não encontram nada. Que defeito combina com a observação?','Родина Brandt має невеликий супермаркет. Клієнти скаржаться, що почуваються незатишно й нічого не знаходять. Який недолік пасує до спостереження?','ስድራ Brandt ንእሽቶ ሱፐርማርኬት ኣለዋ። ዓሚላት ድማ ኣይምቹእን ከም ዝስምዖምን ዝረኽብዎ ከም ዘይብሎምን የማርሩ። ኣየናይ ጉድለት ምስ ምስትውዓል ይሰማማዕ?','У семьи Brandt небольшой супермаркет. Клиенты жалуются, что им неуютно и они ничего не находят. Какой недостаток подходит к наблюдению?','تملك عائلة Brandt سوبرماركت صغيرًا. يشتكي الزبائن من عدم الراحة وعدم العثور على شيء. أي عيب يناسب الملاحظة؟','Brandt ailesinin küçük bir marketi var. Müşteriler rahatsız olduklarından ve hiçbir şey bulamadıklarından şikâyet ediyor. Hangi eksiklik gözleme uyuyor?'],
'a2.t':['Tự hỏi: Điều gì làm khách khó chịu? Khách có thấy hết không? Có đi lại dễ không? Có tìm được hàng không?','Pregúntate: ¿qué molesta al cliente? ¿Lo ve todo? ¿Circula bien? ¿Encuentra la mercancía?','Pergunta-te: o que incomoda o cliente? Vê tudo? Circula bem? Encontra a mercadoria?','Запитай себе: що заважає клієнту? Чи він усе бачить? Чи легко проходить? Чи знаходить товар?','ባዕልኻ ሕተት: ንዓሚል እንታይ የጸግሞ? ኩሉ ይርኢ ዶ? ጽቡቕ ይሓልፍ ዶ? ኣቕሑት ይረክብ ዶ?','Спроси себя: что мешает клиенту? Видит ли он всё? Легко ли проходит? Находит ли товар?','اسأل نفسك: ما الذي يزعج الزبون؟ هل يرى كل شيء؟ هل يتحرك بسهولة؟ هل يجد البضاعة؟','Kendine sor: Müşteriyi ne rahatsız ediyor? Her şeyi görüyor mu? Rahat geçiyor mu? Malı buluyor mu?'],
'a2.e':['Cách sửa: kệ giữa cao tối đa khoảng 1,50 m · lối đi rộng hơn · hàng khuyến mãi để ở khu riêng, giữ lối đi thông · biển chỉ dẫn và sơ đồ · chiếu sáng tốt hơn · đường vòng (Loop) thay vì ngõ cụt.','Mejoras: estantes centrales de máx. 1,50 m · pasillos más anchos · mercancía de oferta en zona propia, caminos libres · señalización y plano · más luz · circuito (Loop) en vez de callejón sin salida.','Melhorias: prateleiras centrais até 1,50 m · corredores mais largos · mercadoria promocional em zona própria, caminhos livres · sinalização e planta · mais luz · circuito (Loop) em vez de beco sem saída.','Покращення: центральні полиці до 1,50 м · ширші проходи · акційні товари в окремій зоні, шляхи вільні · таблички й план · краще освітлення · кільце (Loop) замість глухого кута.','ምሕሻል: ማእከላይ መደርደሪታት ክሳብ 1,50 ሜ · ሰፍሕ መንገዲ · ፍሉይ ቅናሽ ኣቕሑት ኣብ ፍሉይ ቦታ፣ መገዲ ባዶ · ምልክታትን ካርታን · ዝበለጸ ብርሃን · Loop (ዙርያ መገዲ) ብዘይ ዝዕጾ መገዲ።','Улучшения: центральные стеллажи до 1,50 м · шире проходы · акционный товар в отдельной зоне, проходы свободны · указатели и план · лучше освещение · кольцо (Loop) вместо тупика.','التحسينات: رفوف الوسط حتى 1,50 م · ممرات أوسع · بضائع العروض في منطقة خاصة وممرات خالية · لافتات وخريطة · إضاءة أفضل · حلقة (Loop) بدل الطريق المسدود.','İyileştirmeler: orta raflar en çok 1,50 m · daha geniş koridorlar · kampanya malı ayrı alanda, yollar açık · tabelalar ve plan · daha iyi aydınlatma · çıkmaz yerine döngü (Loop).'],
'a2.1.q':['2.1 Khiếm khuyết nào hợp?','2.1 ¿Qué defecto encaja?','2.1 Que defeito combina?','2.1 Який недолік пасує?','2.1 ኣየናይ ጉድለት ይሰማማዕ?','2.1 Какой недостаток подходит?','2.1 أي عيب يناسب؟','2.1 Hangi eksiklik uyuyor?'],
'r1.h':['Đọc thêm: Chia không gian bán hàng và lập kế hoạch lối đi','Para leer: dividir la sala de ventas y planificar los recorridos','Para ler: dividir a sala de vendas e planear os percursos','Для читання: розподіл торгового залу й планування маршрутів','ንምንባብ: ምምቕቓል ቤት ሽያጥን ምውጻእ መገድታትን','Для чтения: разделение торгового зала и планирование маршрутов','للقراءة: تقسيم قاعة البيع وتخطيط الممرات','Okumak için: Satış salonunu bölmek ve yolları planlamak'],
'r1.s':['Phòng bán hàng tốt thì dễ nhìn, lối đi rộng không vật cản, và dẫn khách đi qua nhiều hàng.','Una buena sala de ventas es clara, tiene pasillos anchos sin barreras y lleva al cliente ante mucha mercancía.','Uma boa sala de vendas é clara, tem corredores largos sem barreiras e leva o cliente a ver muita mercadoria.','Хороший торговий зал оглядний, має широкі проходи без перешкод і веде клієнтів повз багато товару.','ጽቡቕ ቤት ሽያጥ ንጹር፣ ሰፍሕ መንገዲ ዘይብሉ ዕንቅፋት ኣለዎ፣ ንዓሚላት ኣብ ብዙሕ ኣቕሑት የሕልፎም።','Хороший торговый зал обозрим, имеет широкие проходы без препятствий и ведёт клиентов мимо большого количества товара.','قاعة البيع الجيدة واضحة وفيها ممرات واسعة بلا عوائق وتمرّر الزبائن بجانب بضائع كثيرة.','İyi bir satış salonu net görünür, engelsiz geniş koridorları vardır ve müşteriyi çok malın yanından geçirir.'],
'r1.qq':['Kệ ở giữa phòng nên cao tối đa bao nhiêu?','¿Qué altura máxima deben tener los estantes en el centro de la sala?','Que altura máxima devem ter as prateleiras no centro da sala?','Якої максимальної висоти мають бути стелажі в центрі залу?','መደርደሪታት ኣብ ማእከል ክሳብ ክንደይ ክዓብዩ ኣለዎም?','Какой максимальной высоты должны быть стеллажи в центре зала?','ما أقصى ارتفاع للرفوف في وسط القاعة؟','Salonun ortasındaki raflar en çok ne kadar yüksek olmalı?'],
'a3.t':['Xem bảng „So gehe ich vor“. Hãy tưởng tượng khách đi qua cửa hàng.','Mira la tabla «So gehe ich vor». Imagina al cliente recorriendo la tienda.','Vê a tabela «So gehe ich vor». Imagina o cliente a percorrer a loja.','Подивись таблицю «So gehe ich vor». Уяви клієнта в магазині.','ሰንጠረዥ «So gehe ich vor» ርአ። ንዓሚል ኣብ ድኳን ክኸይድ ሕሰብ።','Посмотри таблицу «So gehe ich vor». Представь клиента в магазине.','انظر جدول «So gehe ich vor». تخيّل الزبون يمرّ في المتجر.','«So gehe ich vor» tablosuna bak. Müşterinin mağazada gezdiğini hayal et.'],
'a3.e':['Đúng bốn tiêu chí khác nhau. „Lối đi rộng“ và „đủ chỗ cho lối đi“ là một.','Exactamente cuatro criterios distintos. «Pasillos anchos» y «espacio suficiente para circular» es lo mismo.','Exatamente quatro critérios diferentes. «Corredores largos» e «espaço suficiente para circular» é o mesmo.','Рівно чотири різні критерії. «Широкі проходи» і «достатньо місця для проходу» — те саме.','ኣርባዕተ ዝተፈላለዩ መዐቀኒታት። «ሰፍሕ መንገዲ» ን «ልዑል ቦታ ንመገዲ» ሓደ እዩ።','Ровно четыре разных критерия. «Широкие проходы» и «достаточно места для прохода» — одно и то же.','أربعة معايير مختلفة بالضبط. «ممرات واسعة» و«مساحة كافية للمرور» شيء واحد.','Tam dört farklı ölçüt. «Geniş koridor» ile «yürüyüş için yeterli alan» aynı şeydir.'],
'a4.h':['Bài tập có hướng dẫn: Đây là Wegeführung (dẫn lối đi) nào?','Ejercicio guiado: ¿qué Wegeführung (guía de recorrido) es?','Exercício guiado: que Wegeführung (condução do percurso) é?','Керована вправа: яка це Wegeführung (організація маршруту)?','ምምሕዳር ልምምድ: እዚ ኣየናይ Wegeführung እዩ?','Упражнение с подсказкой: какая это Wegeführung (организация маршрута)?','تمرين موجَّه: أي Wegeführung (توجيه مسار) هذه؟','Rehberli alıştırma: Bu hangi Wegeführung (yol yönlendirme)?'],
'a4.i':['Đọc từng mô tả. Đó là hình thức Wegeführung (dẫn lối đi) nào?','Lee cada descripción. ¿Qué forma de Wegeführung (guía de recorrido) es?','Lê cada descrição. Que forma de Wegeführung (condução do percurso) é?','Прочитай кожен опис. Яка це форма Wegeführung (організації маршруту)?','ነፍሲ ወከፍ መግለጺ ኣንብብ። ኣየናይ ዓይነት Wegeführung እዩ?','Прочитай каждое описание. Какая это форма Wegeführung (организации маршрута)?','اقرأ كل وصف. أي شكل من Wegeführung (توجيه المسار) هذا؟','Her açıklamayı oku. Bu hangi Wegeführung (yol yönlendirme) biçimi?'],
'a4.t':['Có đường định sẵn không? Đường vòng? Lối đi giao nhau? Đường tỏa ra từ trung tâm? Các hốc nhỏ?','¿Hay un camino fijo? ¿Un circuito? ¿Pasillos que se cruzan? ¿Caminos desde un centro? ¿Nichos?','Há um caminho fixo? Um circuito? Corredores que se cruzam? Caminhos a partir de um centro? Nichos?','Чи є заданий шлях? Кільце? Проходи, що перехрещуються? Шляхи від центру? Ніші?','ዝተወሰነ መገዲ ኣሎ ዶ? ዙርያ ዝኾነ መገዲ? ዝተጋጠሙ መገድታት? ካብ ማእከል ዝወጽኡ መገድታት? ንኣሽቱ ኩርናዓት?','Есть ли заданный путь? Кольцо? Пересекающиеся проходы? Пути от центра? Ниши?','هل هناك مسار محدد؟ حلقة؟ ممرات متقاطعة؟ طرق تخرج من مركز؟ حنيات؟','Belirlenmiş bir yol var mı? Halka? Kesişen koridorlar? Merkezden çıkan yollar? Nişler?'],
'a4.e':['Một đường không có lựa chọn = Zwangsumlauf. Đường vòng = Loop. Lối đi vuông góc = Kreuzprinzip. Tỏa tia từ trung tâm = Sternprinzip. Các hốc = Kojenprinzip. Tự do chọn = Individualumlauf.','Un camino sin elección = Zwangsumlauf. Circuito = Loop. Pasillos en ángulo recto = Kreuzprinzip. Rayos desde un centro = Sternprinzip. Nichos = Kojenprinzip. Libre elección = Individualumlauf.','Um caminho sem escolha = Zwangsumlauf. Circuito = Loop. Corredores em ângulo reto = Kreuzprinzip. Raios a partir de um centro = Sternprinzip. Nichos = Kojenprinzip. Livre escolha = Individualumlauf.','Шлях без вибору = Zwangsumlauf. Кільце = Loop. Прямокутні проходи = Kreuzprinzip. Промені від центру = Sternprinzip. Ніші = Kojenprinzip. Вільний вибір = Individualumlauf.','መገዲ ብዘይ ምርጫ = Zwangsumlauf። ዙርያ = Loop። ብቅኑዕ ኣንግል ዝተጋጠሙ = Kreuzprinzip። ካብ ማእከል ጨረር = Sternprinzip። ጎዶሎታት = Kojenprinzip። ናጻ ምርጫ = Individualumlauf።','Путь без выбора = Zwangsumlauf. Кольцо = Loop. Проходы под прямым углом = Kreuzprinzip. Лучи от центра = Sternprinzip. Ниши = Kojenprinzip. Свободный выбор = Individualumlauf.','مسار بلا خيار = Zwangsumlauf. حلقة = Loop. ممرات بزوايا قائمة = Kreuzprinzip. أشعة من مركز = Sternprinzip. حنيات = Kojenprinzip. اختيار حر = Individualumlauf.','Seçimsiz tek yol = Zwangsumlauf. Halka = Loop. Dik açılı koridorlar = Kreuzprinzip. Merkezden ışınlar = Sternprinzip. Nişler = Kojenprinzip. Serbest seçim = Individualumlauf.'],
'a5.h':['Bài tập có hướng dẫn: Vẽ lối đi của khách','Ejercicio guiado: dibujar el recorrido','Exercício guiado: desenhar o percurso','Керована вправа: накреслити маршрут','ምምሕዳር ልምምድ: መገዲ ምስኣል','Упражнение с подсказкой: нарисовать маршрут','تمرين موجَّه: ارسم مسار الزبائن','Rehberli alıştırma: Yürüyüş yolunu çiz'],
'a5.i':['Trên phiếu giấy, em vẽ mũi tên vào sơ đồ mặt bằng để cho thấy phần lớn khách đi qua siêu thị thế nào. Phần lớn khách đi sang phải và thích lối đi ngoài. Trả lời các câu hỏi ở đây.','En la hoja de papel dibujas con flechas en el plano cómo recorre la mayoría de clientes el supermercado. La mayoría gira a la derecha y prefiere los pasillos exteriores. Responde aquí las preguntas.','Na folha em papel desenhas com setas na planta como a maioria dos clientes percorre o supermercado. A maioria vira à direita e prefere os corredores exteriores. Responde aqui às perguntas.','На паперовому аркуші ти стрілками малюєш на плані, як більшість клієнтів ходить супермаркетом. Більшість повертає праворуч і віддає перевагу зовнішнім проходам. Відповідай тут на запитання.','ኣብ ወረቐት ብመርገጺ ኣብ ካርታ፣ ኣብ ሱፐርማርኬት መብዛሕትኦም ዓሚላት ከመይ ከም ዝኸዱ ትስእል። መብዛሕትኦም ናብ የማን ይግይሱ፣ ናይ ደገ መገድታት ድማ ይመርጹ። ኣብዚ ንሕቶታት መልስ።','На бумажном листе ты стрелками рисуешь на плане, как большинство клиентов ходит по супермаркету. Большинство идёт направо и предпочитает внешние проходы. Отвечай здесь на вопросы.','على الورقة ترسم بالأسهم على المخطط كيف يمشي معظم الزبائن في السوبرماركت. معظمهم يتجه يمينًا ويفضّل الممرات الخارجية. أجب هنا عن الأسئلة.','Kağıt çalışma sayfasında planın üzerine oklarla çoğu müşterinin marketi nasıl gezdiğini çizersin. Çoğu müşteri sağa döner ve dış koridorları tercih eder. Soruları burada cevapla.'],
'a5.t':['Sau lối vào, đa số khách đi hướng nào? Quầy thu ngân ở đâu?','¿Hacia dónde va la mayoría tras la entrada? ¿Dónde están las cajas?','Para onde vai a maioria depois da entrada? Onde ficam as caixas?','Куди йде більшість після входу? Де каси?','ድሕሪ ምእታው መብዛሕትኦም ናበይ ይኸዱ? ካሳታት ኣበይ ኣለዉ?','Куда идёт большинство после входа? Где кассы?','إلى أين يتجه معظم الزبائن بعد المدخل؟ أين الصناديق؟','Girişten sonra çoğu müşteri nereye gider? Kasalar nerede?'],
'a5.e':['Khách đi hết cửa hàng và đi qua nhiều hàng.','El cliente recorre toda la tienda y pasa ante mucha mercancía.','O cliente percorre toda a loja e passa por muita mercadoria.','Клієнт проходить весь магазин і повз багато товару.','ዓሚል ኩሉ ድኳን ይዘውር ኣብ ብዙሕ ኣቕሑት ይሓልፍ።','Клиент обходит весь магазин и проходит мимо большого количества товара.','يمشي الزبون في كل المتجر ويمرّ بجانب بضائع كثيرة.','Müşteri tüm mağazayı dolaşır ve çok malın yanından geçer.'],
'a5.1.q':['5.1 Siêu thị này có hình thức Wegeführung (dẫn lối đi) nào?','5.1 ¿Qué forma de Wegeführung (guía de recorrido) tiene este supermercado?','5.1 Que forma de Wegeführung (condução do percurso) tem este supermercado?','5.1 Яку форму Wegeführung (організації маршруту) має цей супермаркет?','5.1 እዚ ሱፐርማርኬት ኣየናይ ዓይነት Wegeführung ኣለዎ?','5.1 Какую форму Wegeführung (организации маршрута) имеет этот супермаркет?','5.1 أي شكل من Wegeführung (توجيه المسار) في هذا السوبرماركت؟','5.1 Bu marketin Wegeführung (yol yönlendirme) biçimi nedir?'],
'a5.2.q':['5.2 Tại sao lối vào và quầy thu ngân nằm ở hai đầu đối diện của mặt trước?','5.2 ¿Por qué la entrada y las cajas están en extremos opuestos de la parte delantera?','5.2 Porque é que a entrada e as caixas ficam em extremos opostos da frente?','5.2 Чому вхід і каси розташовані на протилежних кінцях фасаду?','5.2 ስለምንታይ እቲ መእተዊን ካሳታትን ኣብ ተቓራኒ መወዳእታታት ቅድሚ ዘለዉ?','5.2 Почему вход и кассы расположены на противоположных концах передней стороны?','5.2 لماذا يقع المدخل والصناديق في طرفين متقابلين من الواجهة؟','5.2 Giriş ve kasalar ön tarafın zıt uçlarında neden yer alır?'],
'a6.h':['Bài tập tự do: Cửa hàng cho khách lớn tuổi','Ejercicio libre: una tienda para clientes mayores','Exercício livre: uma loja para clientes mais velhos','Вільна вправа: магазин для літніх клієнтів','ናጻ ልምምድ: ድኳን ንኣረጋውያን ዓሚላት','Свободное упражнение: магазин для пожилых клиентов','تمرين حر: متجر للزبائن كبار السن','Serbest alıştırma: Yaşlı müşteriler için mağaza'],
'a6.i':['Kaufhaus Hansa GmbH muốn quan tâm nhiều hơn đến nhu cầu của „Best Ager“ và người cao tuổi, vì nhóm khách này ngày càng lớn.','Kaufhaus Hansa GmbH quiere atender más las necesidades de los «Best Ager» y personas mayores, porque este grupo de clientes crece.','A Kaufhaus Hansa GmbH quer atender mais as necessidades dos «Best Ager» e idosos, porque este grupo de clientes cresce.','Kaufhaus Hansa GmbH хоче більше враховувати потреби «Best Ager» і літніх людей, бо ця група клієнтів зростає.','Kaufhaus Hansa GmbH ንድልየታት «Best Ager» ን ኣረጋውያንን ብዝያዳ ክዕቀብ ይደሊ፣ ምኽንያቱ እዛ ጉጅለ ዓሚላት ትዓቢ ኣላ።','Kaufhaus Hansa GmbH хочет лучше учитывать потребности «Best Ager» и пожилых людей, потому что эта группа клиентов растёт.','تريد Kaufhaus Hansa GmbH مراعاة احتياجات «Best Ager» وكبار السن أكثر، لأن هذه الفئة تكبر.','Kaufhaus Hansa GmbH, giderek büyüyen «Best Ager» ve yaşlı müşteri grubunun ihtiyaçlarına daha çok önem vermek istiyor.'],
'a6.t':['Nghĩ đến đi lại, nhìn, mang vác và ngồi. Điều gì khó với người lớn tuổi?','Piensa en caminar, ver, cargar y sentarse. ¿Qué les resulta difícil a las personas mayores?','Pensa em andar, ver, carregar e sentar. O que é difícil para as pessoas mais velhas?','Подумай про ходьбу, зір, перенесення вантажу й сидіння. Що важко літнім людям?','ምኻድ፣ ምርኣይ፣ ምጽዋርን ምቕማጥን ሕሰብ። ንኣረጋውያን እንታይ ከቢድ እዩ?','Подумай о ходьбе, зрении, переноске и сидении. Что трудно пожилым людям?','فكّر في المشي والرؤية والحمل والجلوس. ما الصعب على كبار السن؟','Yürümeyi, görmeyi, taşımayı ve oturmayı düşün. Yaşlılara ne zor gelir?'],
'a6.e':['Biện pháp tốt giúp đi lại, nhìn, mang vác và nghỉ ngơi.','Las buenas medidas ayudan a caminar, ver, cargar y descansar.','Boas medidas ajudam a andar, ver, carregar e descansar.','Добрі заходи допомагають ходити, бачити, нести й відпочивати.','ጽቡቕ ተግባራት ምኻድን ምርኣይን ምጽዋርን ምዕራፍን የሕግዙ።','Хорошие меры помогают ходить, видеть, носить и отдыхать.','الإجراءات الجيدة تساعد على المشي والرؤية والحمل والراحة.','İyi önlemler yürümeye, görmeye, taşımaya ve dinlenmeye yardım eder.'],
'a6.1.q':['6.1 Kaufhaus có thể làm 5 biện pháp nào? (5 điểm)','6.1 ¿Qué 5 medidas puede tomar el Kaufhaus? (5 puntos)','6.1 Que 5 medidas pode tomar o Kaufhaus? (5 pontos)','6.1 Які 5 заходів може вжити Kaufhaus? (5 балів)','6.1 Kaufhaus ኣየኖት 5 ተግባራት ክወስድ ይኽእል? (5 ነጥቢ)','6.1 Какие 5 мер может принять Kaufhaus? (5 баллов)','6.1 ما الإجراءات الخمسة التي يمكن لـ Kaufhaus اتخاذها؟ (5 نقاط)','6.1 Kaufhaus hangi 5 önlemi alabilir? (5 puan)'],
'a6.2.q':['6.2 Biện pháp nào ít tốn kém và giúp mọi khách hàng? Chọn hai và giải thích.','6.2 ¿Qué medidas cuestan poco y ayudan a todos los clientes? Elige dos y justifica.','6.2 Que medidas custam pouco e ajudam todos os clientes? Escolhe duas e justifica.','6.2 Які з цих заходів коштують мало й допомагають усім клієнтам? Обери два й обґрунтуй.','6.2 ኣየኖት ካብዚ ተግባራት ውሑድ ዝኽልፉን ንኩሎም ዓሚላት ዝሕግዙን? ክልተ ምረጽን ኣረጋግጽን።','6.2 Какие из этих мер стоят мало и помогают всем клиентам? Выбери две и обоснуй.','6.2 أي هذه الإجراءات قليلة التكلفة وتفيد جميع الزبائن؟ اختر اثنين وعلّل.','6.2 Bu önlemlerden hangileri az maliyetli ve tüm müşterilere yardım eder? İkisini seç ve gerekçelendir.'],
'a7.t':['Erläutern (giải thích) = nêu lý do VÀ giải thích. Nennen (kể tên) = từ khóa. Beschreiben (mô tả) = câu đầy đủ.','Erläutern (explicar) = dar el motivo Y explicarlo. Nennen (nombrar) = palabras clave. Beschreiben (describir) = frases completas.','Erläutern (explicar) = dar o motivo E explicá-lo. Nennen (nomear) = palavras-chave. Beschreiben (descrever) = frases completas.','Erläutern (пояснити) = назвати причину І пояснити. Nennen (назвати) = ключові слова. Beschreiben (описати) = повні речення.','Erläutern = ምኽንያት ጥቀስን ግለጽን። Nennen = ቃላት። Beschreiben = ምሉእ ሓረግ።','Erläutern (объяснить) = назвать причину И объяснить. Nennen (назвать) = ключевые слова. Beschreiben (описать) = полные предложения.','Erläutern (اشرح) = اذكر السبب واشرحه. Nennen (اذكر) = كلمات مفتاحية. Beschreiben (صف) = جمل كاملة.','Erläutern (açıkla) = nedeni söyle VE açıkla. Nennen (say) = anahtar kelimeler. Beschreiben (tanımla) = tam cümleler.'],
'a7.e':['Ở 7.3 phải là tiêu chí khác với 7.2 và viết bằng câu đầy đủ.','En 7.3 deben ser criterios distintos a 7.2 y en frases completas.','Em 7.3 têm de ser critérios diferentes de 7.2 e em frases completas.','У 7.3 мають бути інші критерії, ніж у 7.2, повними реченнями.','ኣብ 7.3 ካብ 7.2 ዝፈልዩ መዐቀኒታት ብምሉእ ሓረግ ክኾኑ ኣለዎም።','В 7.3 критерии должны отличаться от 7.2, полными предложениями.','في 7.3 يجب أن تكون معايير مختلفة عن 7.2 وبجمل كاملة.','7.3’te ölçütler 7.2’den farklı olmalı ve tam cümlelerle yazılmalı.'],
'a7.1.q':['7.1 Giải thích 2 lý do tại sao nên hiện đại hóa khu vực này! (4 điểm)','7.1 ¡Explique 2 motivos por los que debería modernizarse la sección! (4 puntos)','7.1 Explique 2 motivos pelos quais a secção deveria ser modernizada! (4 pontos)','7.1 Поясніть 2 причини, чому відділ слід модернізувати! (4 бали)','7.1 ስለምንታይ እቲ ክፍሊ ክሕደስ ከም ዘለዎ ክልተ ምኽንያታት ግለጽ! (4 ነጥቢ)','7.1 Объясните 2 причины, почему отдел следует модернизировать! (4 балла)','7.1 اشرح سببين لضرورة تحديث القسم! (4 نقاط)','7.1 Bölümün neden modernleştirilmesi gerektiğine dair 2 neden açıkla! (4 puan)'],
'a7.2.q':['7.2 Kể 4 tiêu chí sắp xếp kệ hàng (Warenträger)! (4 điểm)','7.2 ¡Nombre 4 criterios para colocar los Warenträger (soportes de mercancía)! (4 puntos)','7.2 Nomeie 4 critérios para dispor os Warenträger (suportes de mercadoria)! (4 pontos)','7.2 Назвіть 4 критерії розташування Warenträger (стелажів)! (4 бали)','7.2 ኣርባዕተ መዐቀኒታት ንኣቀማምጣ Warenträger ጥቀስ! (4 ነጥቢ)','7.2 Назовите 4 критерия расположения Warenträger (стеллажей)! (4 балла)','7.2 اذكر 4 معايير لترتيب Warenträger (حاملات البضائع)! (4 نقاط)','7.2 Warenträger’ın (mal taşıyıcılar) yerleşimi için 4 ölçüt say! (4 puan)'],
'a7.3.q':['7.3 Mô tả thêm 2 tiêu chí khác khi đặt kệ! Dùng tiêu chí khác với 7.2 và viết câu đầy đủ. (4 điểm)','7.3 ¡Describa 2 criterios más! Use criterios distintos a los de 7.2 y escriba frases completas. (4 puntos)','7.3 Descreva mais 2 critérios! Use critérios diferentes dos de 7.2 e escreva frases completas. (4 pontos)','7.3 Опишіть ще 2 критерії! Візьміть інші, ніж у 7.2, і пишіть повними реченнями. (4 бали)','7.3 ተወሳኺ ክልተ መዐቀኒታት ግለጽ! ካብ 7.2 ዝፈልዩ ተጠቐምን ብምሉእ ሓረግ ጽሓፍን። (4 ነጥቢ)','7.3 Опишите ещё 2 критерия! Возьмите другие, чем в 7.2, и пишите полными предложениями. (4 балла)','7.3 صف معيارين آخرين! استخدم معايير غير التي في 7.2 واكتب جملًا كاملة. (4 نقاط)','7.3 2 ölçüt daha tanımla! 7.2’dekilerden farklı olsun ve tam cümlelerle yaz. (4 puan)'],
'a8.t':['8.1: Nhìn cả người bán và khách. 8.2: Nghĩ đến sân vận động: khán giả ở phía sau ngồi chỗ nào?','8.1: Mira al comerciante y a los clientes. 8.2: Piensa en un estadio: ¿dónde se sientan los espectadores de atrás?','8.1: Olha para o comerciante e os clientes. 8.2: Pensa num estádio: onde se sentam os espectadores de trás?','8.1: Дивись на торговця й клієнтів. 8.2: Подумай про стадіон: де сидять глядачі позаду?','8.1: ንነጋዳይን ዓሚላትን ርአ። 8.2: ስታዲየም ሕሰብ: ተዓዘብቲ ድሕሪት ኣበይ ይቕመጡ?','8.1: Посмотри на торговца и клиентов. 8.2: Подумай о стадионе: где сидят зрители сзади?','8.1: انظر إلى التاجر والزبائن. 8.2: فكّر في ملعب: أين يجلس المشاهدون في الخلف؟','8.1: Satıcıya ve müşterilere bak. 8.2: Stadyumu düşün: Arkadaki seyirciler nerede oturur?'],
'a8.e':['Một nhận định tốt nêu cả hai phía. Ở Arenaprinzip (nguyên tắc đấu trường), kệ hàng cao dần ra phía ngoài.','Un buen juicio nombra ambos lados. En el Arenaprinzip (principio de arena) los soportes suben hacia fuera.','Um bom juízo nomeia os dois lados. No Arenaprinzip (princípio de arena) os suportes sobem para fora.','Хороша оцінка називає обидві сторони. За Arenaprinzip (принципом арени) стелажі піднімаються назовні.','ጽቡቕ ፍርዲ ክልተ ወገናት ይጥቅስ። ኣብ Arenaprinzip መደርደሪታት ናብ ደጀን ይደይቡ።','Хорошая оценка называет обе стороны. По Arenaprinzip (принципу арены) стеллажи поднимаются наружу.','الحكم الجيد يذكر الجانبين. في Arenaprinzip (مبدأ الحلبة) ترتفع الحاملات نحو الخارج.','İyi bir değerlendirme iki tarafı söyler. Arenaprinzip’te (arena ilkesi) taşıyıcılar dışa doğru yükselir.'],
'a8.1.q':['8.1 Một số cửa hàng nội thất dẫn khách đi theo Zwangsumlauf (đường bắt buộc) qua toàn bộ khu trưng bày. Đánh giá cách dẫn này từ góc nhìn của người bán và của khách.','8.1 Algunas tiendas de muebles guían a los clientes en Zwangsumlauf (recorrido obligatorio) por toda la exposición. Valora esta guía desde la perspectiva del comerciante y de los clientes.','8.1 Algumas lojas de móveis conduzem os clientes em Zwangsumlauf (percurso obrigatório) por toda a exposição. Avalia esta condução do ponto de vista do comerciante e dos clientes.','8.1 Деякі меблеві магазини ведуть клієнтів через усю виставку в Zwangsumlauf (примусовому маршруті). Оціни такий маршрут з погляду торговця та клієнтів.','8.1 ገለ ድኳናት መንበርን ኣቕሓ ገዛን ንዓሚላት ብZwangsumlauf ብኩሉ ኤግዚቢሽን የሕልፍዎም። እዚ መገዲ ካብ ኣረኣእያ ነጋዳይን ዓሚላትን ገምግም።','8.1 Некоторые мебельные магазины ведут клиентов в Zwangsumlauf (принудительном обходе) по всей выставке. Оцени такой маршрут с точки зрения торговца и клиентов.','8.1 بعض متاجر الأثاث تقود الزبائن في Zwangsumlauf (مسار إجباري) عبر المعرض كله. قيّم هذا المسار من منظور التاجر والزبائن.','8.1 Bazı mobilya mağazaları müşterileri Zwangsumlauf (zorunlu yol) ile tüm sergiden geçirir. Bu yönlendirmeyi satıcı ve müşteri açısından değerlendir.'],
'a8.2.q':['8.2 Giải thích Arenaprinzip (nguyên tắc đấu trường) và mô tả ba tầng cùng độ cao. (Hình vẽ em vẽ trên giấy.)','8.2 Explica el Arenaprinzip (principio de arena) y describe los tres niveles con sus alturas. (El dibujo lo haces en papel.)','8.2 Explica o Arenaprinzip (princípio de arena) e descreve os três níveis com as suas alturas. (O desenho fazes em papel.)','8.2 Поясни Arenaprinzip (принцип арени) й опиши три рівні з їхніми висотами. (Ескіз малюєш на папері.)','8.2 Arenaprinzip ግለጽ፣ ሰለስተ ደረጃታትን ርኽቦታቶምን ግለጽ። (እቲ ስእሊ ኣብ ወረቐት ትስእል።)','8.2 Объясни Arenaprinzip (принцип арены) и опиши три уровня с их высотами. (Эскиз рисуешь на бумаге.)','8.2 اشرح Arenaprinzip (مبدأ الحلبة) وصف المستويات الثلاثة وارتفاعاتها. (الرسم على الورق.)','8.2 Arenaprinzip’i (arena ilkesi) açıkla ve üç seviyeyi yükseklikleriyle anlat. (Çizimi kağıda yaparsın.)'],
'v1.1.q':['V1 Tại sao kệ ở giữa phòng chỉ nên cao tối đa khoảng 1,50 m?','V1 ¿Por qué los estantes del centro de la sala deben medir como máximo unos 1,50 m?','V1 Porque é que as prateleiras no centro da sala devem ter no máximo 1,50 m?','V1 Чому стелажі в центрі залу мають бути не вищі за приблизно 1,50 м?','V1 ስለምንታይ መደርደሪታት ኣብ ማእከል ክሳብ ዳርጋ 1,50 ሜ ጥራይ ክዓብዩ ኣለዎም?','V1 Почему стеллажи в центре зала должны быть не выше примерно 1,50 м?','V1 لماذا لا ينبغي أن تزيد رفوف وسط القاعة عن 1,50 م تقريبًا؟','V1 Salonun ortasındaki raflar neden en çok yaklaşık 1,50 m olmalı?'],
'v1.2.q':['V2 Giải thích: Tại sao ở Erlebniskauf (mua sắm trải nghiệm), „übrige Verkaufsfläche“ ngày càng lớn?','V2 Justifica: ¿por qué en el Erlebniskauf (compra como experiencia) crece la «übrige Verkaufsfläche» (otra superficie de venta)?','V2 Justifica: porque é que no Erlebniskauf (compra como experiência) a «übrige Verkaufsfläche» (outra área de venda) cresce?','V2 Обґрунтуй: чому при Erlebniskauf (покупках-враженнях) «übrige Verkaufsfläche» (інша торгова площа) постійно зростає?','V2 ኣረጋግጽ: ስለምንታይ ኣብ Erlebniskauf «übrige Verkaufsfläche» ይዓብይ?','V2 Обоснуй: почему при Erlebniskauf (покупках-впечатлениях) «übrige Verkaufsfläche» (прочая торговая площадь) растёт?','V2 علّل: لماذا تكبر «übrige Verkaufsfläche» (مساحة البيع الأخرى) في Erlebniskauf (التسوق كتجربة)؟','V2 Gerekçelendir: Erlebniskauf’ta (deneyimli alışveriş) «übrige Verkaufsfläche» (diğer satış alanı) neden giderek büyür?'],

 var v=A(it.id);

 case 'calc':return !!(v&&String(v).trim());

 }return false}

 var q=p===100&&!S.pdone;if(q){S.pdone=1;toast('🎉 100 %')}}

  break;

 case 'tf':

   return '<tr'+rc+'><td>'+esc(r[0])+'</td>'+[[true,'✔'],[false,'✘']].map(function(c){var cl=sel===c[0]?' on':'';if(fb){if(c[0]===r[1])cl+=sel===c[0]?' ok':' sol';else if(sel===c[0])cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tf" data-id="'+it.id+'" data-r="'+i+'" data-i="'+(c[0]?1:0)+'">'+c[1]+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';

 h+='<button class="btn" data-act="mkchk" data-id="'+b.id+'">'+B('mark')+'</button>';
 if(done){var all=b.paras.join(' ').match(/\[\[.+?\]\]/g)||[];h+=fbBox(wrong===0&&hit===all.length?'ok':'part','✔ '+hit+' / '+all.length+' '+esc(U('found'))+(wrong?' · ✘ '+wrong+' '+esc(U('toomany')):'')+(hit<all.length?'<br>'+esc(U('missed')):''))}
 if(b.q){var v=A(b.id+'.q');h+='<div class="q">'+esc(b.q.q)+'</div>'+tl(b.id+'.qq')+opts(b.q.o,v,(done&&v!=null)?function(i){return i===b.q.a?'ok':(v===i?'no':'')}:null,'mc',b.id+'.q')}
 return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});
 return h}
function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';
 SHEET.blocks.forEach(function(b){if(b.k==='read')h+=renderRead(b);else if(vis(b))h+=renderTask(b)});
 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';
 if(S.sub)h+=renderResult();
 document.getElementById('app').innerHTML=h;
 document.getElementById('report').innerHTML=renderReport();
 renderBar();updProg();pad();
 window.scrollTo(0,y)}
function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');
 document.documentElement.lang=S.lang;
 }
function pad(){var m=document.querySelector('main'),b=document.getElementById('bar');if(m&&b)m.style.paddingTop=(b.offsetHeight+14)+'px'}
window.addEventListener('resize',pad);
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function dialog(msgKey,onYes){var d=document.createElement('div');d.className='dlg';d.innerHTML='<div><p><b>'+esc(UI[msgKey][0])+'</b></p>'+(S.lang!=='de'?'<p>'+esc(U(msgKey))+'</p>':'')+'<button class="btn" data-d="y">'+B('yes')+'</button><button class="btn gray" data-d="n">'+B('cancel')+'</button></div>';d.addEventListener('click',function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-d');if(!x&&e.target!==d&&!e.target.closest('[data-d]'))return;var dd=e.target.closest('[data-d]');if(dd&&dd.getAttribute('data-d')==='y')onYes();d.remove()});document.body.appendChild(d)}
function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});
document.getElementById('gear').addEventListener('click',function(){S.open=!S.open;save();renderBar()});
document.addEventListener('change',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act');if(act==='gap'||act==='sel'){var arr=S.a[el.getAttribute('data-id')]||[];var v=el.value;arr[Number(el.getAttribute('data-r'))]=act==='sel'?(v===''?null:Number(v)):(v===''?null:v);S.a[el.getAttribute('data-id')]=arr;save();updProg()}});
document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
document.addEventListener('visibilitychange',saveNow);window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',function(){document.getElementById('report').innerHTML=renderReport()});
/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;
render();
if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};
window.__state=function(){return S};
})();
