@media(max-width:560px){.top{padding:.3rem .5rem}.top .row{gap:.3rem}.top .ttl{display:none}.pills button{min-height:44px;padding:.2rem .6rem;font-size:.8rem}.pills{border-width:1.5px}.fields{grid-template-columns:1fr}.mrow{grid-template-columns:1fr}html{font-size:calc(16px*var(--fs))}}

<script>
const SHEET={"id":"M5","short":"LF 5 · Modul 5","title":"Modul 5 – Werbeerfolgskontrolle","sub":"Lernfeld 5 · Werben und den Verkauf fördern","can":[{"de":"Ich kann wirtschaftliche und nicht wirtschaftliche Werbeerfolgskontrolle unterscheiden.","vi":"Em có thể phân biệt Werbeerfolgskontrolle (kiểm tra hiệu quả quảng cáo) wirtschaftlich (về kinh tế) và nicht wirtschaftlich (không về kinh tế)."},{"de":"Ich kann den Werbeerfolg in Prozent und die Werberendite berechnen.","vi":"Em có thể tính Erfolg der Werbung (hiệu quả quảng cáo, %) và Werberendite (tỷ suất quảng cáo)."},{"de":"Ich kann sagen, warum sich der Erfolg von Werbung nie ganz genau messen lässt.","vi":"Em có thể nói tại sao hiệu quả quảng cáo không bao giờ đo được hoàn toàn chính xác."}],"items":[{"id":"a1","no":"Aufgabe 1","type":"free","pts":1,"title":"Ankommen: Was weißt du noch?","instr":{"de":"Beantworte die Fragen aus dem Kopf. Nicht nachschlagen. Es geht darum, was hängengeblieben ist.","vi":"Hãy trả lời bằng trí nhớ, không tra cứu. Điều quan trọng là em còn nhớ được gì."},"tip":{"de":"Denke an Modul 4 (Werbeplan) und an LF 3 (Kasse) und WiSo (Kaufvertrag). Stichworte genügen.","vi":"Hãy nhớ lại Modul 4 (Werbeplan), LF 3 (thu ngân) và WiSo (Kaufvertrag – hợp đồng mua bán). Chỉ cần từ khóa."},"parts":[{"q":"1. Was legt der Werbeetat fest?","m":"Die Geldmittel, die in einer bestimmten Zeit für die Werbemaßnahmen ausgegeben werden sollen."},{"q":"2. Was ist der Unterschied zwischen Streukreis und Streugebiet?","m":"Streukreis = der Personenkreis, der umworben wird. Streugebiet = das Gebiet, in dem geworben wird."},{"q":"3. Nenne die Schritte beim Kassieren mit Bargeld. (aus LF 3)","m":"Betrag nennen – Geld annehmen und Wert nennen – Geld sichtbar ablegen – Rückgeld vorzählen."},{"q":"4. Wann kommt ein Kaufvertrag zustande? (aus WiSo)","m":"Durch zwei übereinstimmende Willenserklärungen: Antrag und Annahme."},{"q":"5. Was bedeutet Erinnerungswerbung?","m":"Sparsame Werbung für eine Ware, die sich ohnehin gut verkauft – sie soll nur in Erinnerung bleiben."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)"},"html":"<p>Werbeerfolgskontrolle · nicht wirtschaftlich · wirtschaftlich · Einstellung der Kunden · Kennzahlen · Kassenbon · Absatzzahlen · Frequenzanalyse · Umsatz · Werberendite · Umsatzzuwachs · Werbekosten · Warenwirtschaftssystem<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"Werbeerfolgskontrolle = kiểm tra hiệu quả quảng cáo · wirtschaftlich = tính bằng tiền, số liệu · nicht wirtschaftlich = đo thái độ khách hàng · Einstellung der Kunden = thái độ của khách · Kennzahlen = chỉ số · Kassenbon = hóa đơn thu ngân · Absatzzahlen = số lượng bán · Frequenzanalyse = phân tích lượng khách · Umsatz = doanh thu · Werberendite = tỷ suất sinh lời của quảng cáo · Umsatzzuwachs = doanh thu tăng thêm · Werbekosten = chi phí quảng cáo · Warenwirtschaftssystem = hệ thống quản lý hàng hóa"},{"id":"r1","no":"Lesen 1","type":"read","title":"Was ist Werbeerfolgskontrolle?","instr":{"de":"Lies den Text. Tippe an, was die Werbeerfolgskontrolle prüft.","vi":"Em đọc đoạn văn. Chạm vào từ cho biết Werbeerfolgskontrolle kiểm tra điều gì."},"tip":{"de":"Suche das Wort, das sagt, was mit den Werbemaßnahmen am Ende herauskommen soll.","vi":"Tìm từ nói điều gì cần đạt được từ các biện pháp quảng cáo."},"paras":["Die Werbeerfolgskontrolle überprüft, ob sich die Werbemaßnahmen [[gelohnt]] haben. Die Werbung ist dann [[wirtschaftlich]], wenn der [[Ertrag]] der Werbung die [[Kosten]] übersteigt."],"vi":"Tóm tắt: Werbeerfolgskontrolle kiểm tra xem quảng cáo có đáng không. Quảng cáo là wirtschaftlich (có lợi) khi thu về (Ertrag) nhiều hơn chi phí (Kosten).","quiz":{"q":"Wann ist Werbung wirtschaftlich?","o":["Wenn der Ertrag die Kosten übersteigt.","Wenn sie sehr schön aussieht.","Wenn sie viele Leute sehen."],"a":0,"why":{"de":"Wirtschaftlich heißt: Der Ertrag der Werbung ist höher als ihre Kosten.","vi":"Wirtschaftlich nghĩa là: thu về từ quảng cáo cao hơn chi phí."}}},{"id":"w2","type":"info","title":{"de":"Zwei Wege der Kontrolle","vi":"Hai cách kiểm tra"},"html":"<p><b>Nicht wirtschaftliche Werbeerfolgskontrolle:<\/b> Wie ist die Werbung bei den Umworbenen „angekommen“? Hat sich ihre Einstellung zum Sortiment, zu den Dienstleistungen oder zum Geschäft positiv verändert? Gemessen wird mit Befragungen, Rückmeldungen, Teilnahme an Aktionen und der Kennzahl „Erfolg der Werbung in Prozent“.<\/p><p><b>Wirtschaftliche Werbeerfolgskontrolle:<\/b> Was hat die Werbung wirtschaftlich gebracht? Übersteigt der Ertrag die Kosten? Gemessen wird mit betrieblichen Kennzahlen und Kassenbons: Absatzzahlen, Frequenzanalyse, Umsatz, Werberendite.<\/p><p>Voraussetzung ist ein computergestütztes <b>Warenwirtschaftssystem<\/b>. Über die Kassenbons sieht der Betrieb auch, ob die Werbung für eine Ware den Absatz anderer Waren gesteigert hat.<\/p><div class=\"box merke\"><b>Auswendig können:<\/b><br>Erfolg der Werbung = Zahl der Käufer × 100 ÷ Zahl der eingeladenen Kunden<br>Werberendite = Umsatzzuwachs × 100 ÷ Werbekosten<br>Beide Formeln geben ein Ergebnis in Prozent. Erst mal 100 nehmen, dann teilen.<\/div>","vi":"Nicht wirtschaftlich = hỏi khách thấy thế nào (khảo sát, phản hồi, tham gia sự kiện, “hiệu quả quảng cáo %”). Wirtschaftlich = tính bằng số liệu (số lượng bán, lượng khách, doanh thu, Werberendite).\nHai công thức (kết quả là %): Erfolg der Werbung = số người mua × 100 ÷ số khách được mời. Werberendite = doanh thu tăng thêm × 100 ÷ chi phí quảng cáo."},{"id":"m1","no":"Übung 1","type":"match","pts":0,"title":"Welcher Weg der Kontrolle?","instr":{"de":"Ordne jede Messgröße der richtigen Kontrolle zu.","vi":"Em xếp mỗi cách đo vào đúng loại kiểm tra."},"tip":{"de":"Frage dich: Geht es um Menschen und ihre Meinung oder um Euro und Zahlen?","vi":"Tự hỏi: đây là con người và ý kiến, hay là tiền và con số?"},"rows":[{"l":"Befragung der Kunden","a":"Nicht wirtschaftliche Kontrolle"},{"l":"Umsatz","a":"Wirtschaftliche Kontrolle"},{"l":"Rückmeldungen der Kunden","a":"Nicht wirtschaftliche Kontrolle"},{"l":"Frequenzanalyse","a":"Wirtschaftliche Kontrolle"},{"l":"Teilnahme an Aktionen","a":"Nicht wirtschaftliche Kontrolle"},{"l":"Werberendite","a":"Wirtschaftliche Kontrolle"},{"l":"Erfolg der Werbung in Prozent","a":"Nicht wirtschaftliche Kontrolle"}]},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: Zwei Rechenwege","html":"<div class=\"box\"><b>Beispiel 1 (nicht wirtschaftlich).<\/b> Ein Haushaltswarengeschäft führt ein neues Kochtopfsortiment vor. Eine persönliche Einladung ergeht an 80 Kunden. 20 der anwesenden Personen kaufen danach einen Kochtopf.<\/div><p>Schritt 1: Zahl der Käufer = 20. Zahl der eingeladenen Kunden = 80.<br>Schritt 2: Erfolg der Werbung = Zahl der Käufer × 100 ÷ Zahl der eingeladenen Kunden.<br>Schritt 3: 20 × 100 = 2.000. 2.000 ÷ 80 = 25.<br>Schritt 4: Der Erfolg der Werbung beträgt <b>25 %<\/b>. Bei einem Viertel der eingeladenen Kunden war die Werbung erfolgreich.<\/p><div class=\"box\"><b>Beispiel 2 (wirtschaftlich).<\/b> Ein Kaufhaus setzt für „Sommerkleider“ am letzten Juni-Wochenende einen Sonderverkauf an. Die Werbekosten betragen 9.866,50 EUR. Bis zum 29. Juni wurden durchschnittlich 146 Kleider pro Tag zu 59,90 EUR verkauft. Am Samstag, dem 30. Juni, waren es 511 Kleider zu 39,90 EUR.<\/div><p>Schritt 1: Umsatz vorher: 146 × 59,90 EUR = 8.745,40 EUR.<br>Schritt 2: Umsatz am Aktionstag: 511 × 39,90 EUR = 20.388,90 EUR.<br>Schritt 3: Umsatzzuwachs: 20.388,90 EUR − 8.745,40 EUR = 11.643,50 EUR.<br>Schritt 4: Werberendite: 11.643,50 × 100 = 1.164.350. 1.164.350 ÷ 9.866,50 = 118 (gerundet).<br>Schritt 5: Die Werberendite beträgt rund <b>118 %<\/b>. Der Umsatzzuwachs ist größer als die Werbekosten. Die Werbung hat sich gelohnt.<\/p><div class=\"box merke\"><b>Merke:<\/b> Reihenfolge: Umsatz vorher – Umsatz nachher – Zuwachs – erst dann die Werberendite.<\/div>","vi":"Ví dụ 1: mời 80 khách, 20 người mua → 20 × 100 ÷ 80 = 25 %. Ví dụ 2: doanh thu trước 8.745,40 €, sau 20.388,90 € → tăng 11.643,50 €. Werberendite = 11.643,50 × 100 ÷ 9.866,50 ≈ 118 %. Thứ tự: doanh thu trước – doanh thu sau – phần tăng – rồi mới tính Werberendite."},{"id":"a3","no":"Aufgabe 3","type":"calc","pts":1,"title":"Geführte Übung","instr":{"de":"Rechne Schritt für Schritt. Schreibe immer den Rechenweg auf. In der Prüfung gibt es dafür Punkte.","vi":"Em tính từng bước. Luôn viết cách tính ra. Trong kỳ thi cũng có điểm cho cách tính."},"tip":{"de":"Erfolg der Werbung: Käufer mal 100, geteilt durch Eingeladene. Werberendite: Umsatzzuwachs mal 100, geteilt durch Werbekosten. Beim dritten Fall erst beide Umsätze, dann die Differenz.","vi":"Erfolg der Werbung: số người mua × 100 ÷ số người được mời. Werberendite: doanh thu tăng thêm × 100 ÷ chi phí quảng cáo. Ở câu 3: trước hết tính hai doanh thu, rồi hiệu số."},"parts":[{"q":"1. Ein Sportgeschäft lädt 120 Stammkunden zu einem Lauftreff ein. 36 von ihnen kaufen danach ein Paar Laufschuhe. Wie hoch ist der Erfolg der Werbung?","u":"%","a":30,"tol":0.1,"work":true,"steps":["36 × 100 = 3.600","3.600 ÷ 120 = 30","Der Erfolg der Werbung beträgt 30 %."]},{"q":"2. Eine Bäckerei gibt 400 € für Handzettel aus. Der Umsatz steigt dadurch um 1.200 €. Wie hoch ist die Werberendite?","u":"%","a":300,"tol":0.5,"work":true,"steps":["1.200 × 100 = 120.000","120.000 ÷ 400 = 300","Die Werberendite beträgt 300 %."]},{"q":"3a. Ein Elektrogeschäft verkauft normalerweise 40 Kaffeemaschinen im Monat zu 89,00 €. Im Aktionsmonat sind es 95 Stück zu 79,00 €. Die Werbung kostete 1.500 €. Wie hoch war der Umsatz vorher?","u":"€","a":3560,"tol":0.01,"work":true,"steps":["40 × 89,00 € = 3.560,00 €"]},{"q":"3b. Wie hoch war der Umsatz im Aktionsmonat?","u":"€","a":7505,"tol":0.01,"steps":["95 × 79,00 € = 7.505,00 €"]},{"q":"3c. Wie hoch ist der Umsatzzuwachs?","u":"€","a":3945,"tol":0.01,"steps":["7.505,00 € − 3.560,00 € = 3.945,00 €"]},{"q":"3d. Wie hoch ist die Werberendite?","u":"%","a":263,"tol":0.5,"steps":["3.945 × 100 ÷ 1.500 = 263","Die Werberendite beträgt 263 %."]}]},{"id":"a3d","no":"Aufgabe 3.4","type":"free","pts":0,"title":"Welche Aufgabe gehört zur nicht wirtschaftlichen Kontrolle?","instr":{"de":"Welche der drei Aufgaben oben gehört zur nicht wirtschaftlichen Werbeerfolgskontrolle? Begründe.","vi":"Trong ba bài trên, bài nào thuộc nicht wirtschaftliche Werbeerfolgskontrolle? Hãy giải thích."},"tip":{"de":"Frage dich: Geht es um Menschen oder um Euro?","vi":"Tự hỏi: đây là con người hay là tiền (Euro)?"},"parts":[{"q":"Meine Antwort:","m":"Die erste. Dort wird gemessen, wie die Werbung bei den eingeladenen Kunden angekommen ist – nicht, wie viel Umsatz sie gebracht hat.","s":["Die Aufgabe … gehört dazu, weil …"]}]},{"id":"a4","no":"Aufgabe 4","type":"free","pts":1,"title":"Freie Übung","instr":{"de":"Beantworte die Fragen in eigenen Worten.","vi":"Em trả lời các câu hỏi bằng lời của mình."},"tip":{"de":"Bei Frage 3: vier Kennzahlen, die du in der Übersicht oben findest.","vi":"Câu 3: bốn chỉ số có trong phần tổng quan ở trên."},"parts":[{"q":"1. Was überprüft die Werbeerfolgskontrolle?","m":"Ob sich die Werbemaßnahmen gelohnt haben."},{"q":"2. Erkläre den Unterschied zwischen wirtschaftlicher und nicht wirtschaftlicher Werbeerfolgskontrolle.","m":"Die nicht wirtschaftliche Kontrolle fragt, wie die Werbung bei den Umworbenen angekommen ist und ob sich ihre Einstellung positiv verändert hat. Die wirtschaftliche Kontrolle misst den Erfolg in Zahlen – über Kennzahlen und Kassenbons.","s":["Die nicht wirtschaftliche Kontrolle fragt …","Die wirtschaftliche Kontrolle misst …"]},{"q":"3. Nenne vier Kennzahlen der wirtschaftlichen Werbeerfolgskontrolle.","m":"Absatzzahlen, Frequenzanalyse, Umsatz und Werberendite."},{"q":"4. Wann ist Werbung nach dem Lehrbuch wirtschaftlich?","m":"Wenn der Ertrag der Werbung die Kosten übersteigt."},{"q":"5. Welche technische Voraussetzung braucht ein Betrieb für die wirtschaftliche Werbeerfolgskontrolle?","m":"Ein computergestütztes Warenwirtschaftssystem, aus dem alle benötigten Informationen abgerufen werden können."},{"q":"6. Warum wertet ein Betrieb auch die Kassenbons aus?","m":"Um zu sehen, ob die Werbung für eine bestimmte Ware auch zu Umsatzsteigerungen bei anderen Waren geführt hat."}]},{"id":"a5","no":"Aufgabe 5","type":"free","pts":1,"title":"Aus deinem Betrieb","instr":{"de":"Frage in deinem Ausbildungsbetrieb nach einer Werbeaktion der letzten Monate: Woran hat der Betrieb gemerkt, ob sie erfolgreich war? Notiere die Antwort und entscheide, ob es eine wirtschaftliche oder nicht wirtschaftliche Kontrolle ist.","vi":"Hãy hỏi cửa hàng nơi em thực tập về một đợt quảng cáo mấy tháng gần đây: Họ nhận ra nó thành công bằng cách nào? Ghi câu trả lời và quyết định đó là kiểm tra wirtschaftlich hay nicht wirtschaftlich."},"tip":{"de":"Schreibe: Welche Aktion? Welche Messgröße (Umsatz, Kundenzahl, Rückmeldungen)? Welche Kontrolle? Warum?","vi":"Viết: Đợt quảng cáo nào? Đo bằng gì (doanh thu, số khách, phản hồi)? Loại kiểm tra nào? Vì sao?"},"parts":[{"q":"Meine Antwort:","m":"Individuelle Lösung. Erwartet werden: eine konkrete Aktion, mindestens eine genannte Messgröße (z. B. Umsatz, Kundenzahl, Rückmeldungen) und eine begründete Zuordnung zu wirtschaftlicher oder nicht wirtschaftlicher Kontrolle.","s":["Die Aktion war …","Der Betrieb hat gemessen: …","Das ist eine … Kontrolle, weil …"]}]},{"id":"a6","no":"Aufgabe 6","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh."},"tip":{"de":"6.1: Was kann den Umsatz noch erhöhen außer Werbung? 6.2: Umsatz oder Gewinn? 6.3: Was bedeutet 90 %, wenn 100 % „Zuwachs gleich Kosten“ wären?","vi":"6.1: Ngoài quảng cáo, điều gì khác có thể làm tăng doanh thu? 6.2: doanh thu hay lợi nhuận? 6.3: 90 % nghĩa là gì nếu 100 % là “doanh thu tăng bằng chi phí”?"},"parts":[{"q":"6.1 Der Umsatz ist nach einer Werbeaktion gestiegen. Nenne zwei andere Gründe, die den Anstieg ebenfalls verursacht haben könnten.","m":"Zum Beispiel: gutes Wetter, ein Feiertag oder Ferienbeginn, eine Preissenkung, ein Konkurrent hat geschlossen, eine Ware war plötzlich in den sozialen Medien beliebt. Deshalb lässt sich der Werbeerfolg nie ganz genau messen – die Kennzahlen zeigen, dass etwas passiert ist, aber nicht sicher, warum."},{"q":"6.2 Im Kaufhaus-Beispiel wurde der Preis von 59,90 € auf 39,90 € gesenkt. Warum sagt die Werberendite allein noch nicht, ob sich die Aktion für den Betrieb wirklich gelohnt hat?","m":"Weil die Werberendite mit dem Umsatz rechnet, nicht mit dem Gewinn. Bei 39,90 € statt 59,90 € verdient das Kaufhaus an jedem Kleid 20 € weniger. Das Buch setzt deshalb voraus, dass auch zu 39,90 € noch ein Gewinn erzielt wird – im Verlustfall wäre die Aktion nutzlos."},{"q":"6.3 Eine Werbeaktion bringt eine Werberendite von 90 %. Was bedeutet das – und würdest du die Aktion wiederholen?","m":"90 % bedeutet: Der Umsatzzuwachs war kleiner als die Werbekosten. Für 100 € Werbung kamen nur 90 € zusätzlicher Umsatz herein – und vom Umsatz muss der Wareneinsatz noch abgezogen werden. In dieser Form würde man die Aktion nicht wiederholen, sondern Werbemittel, Zielgruppe oder Streuzeit ändern."}]},{"id":"s1","type":"info","title":"STOPP – Für Selbstlerner","html":"<div class=\"box merke\"><b>Pflicht-Stopp 2 · Standortbestimmung Werbung (Module 1–5).<\/b> Bearbeite vorher im Prüfungstraining die Aufgaben zu Modul 1 bis 5 mit der Uhr und kontrolliere sie selbst. Bring deinen Werbeplan aus Modul 4 mit. Bei deiner Lehrkraft rechnest du eine Werberendite laut vor und erklärst deinen Werbeplan. Ihr legt gemeinsam fest, was du wiederholst, bevor es weitergeht.<\/div>","vi":"Dừng lại (dành cho em tự học): Trước đó em làm các bài về Modul 1 đến 5 trong Prüfungstraining, có đồng hồ bấm giờ, và tự kiểm tra. Mang theo Werbeplan của Modul 4. Với cô giáo, em vừa tính vừa nói to một Werberendite và giải thích Werbeplan. Cô và em cùng quyết định em cần ôn lại gì."},{"id":"v1","level":"v","no":"Vertiefung 1","type":"calc","pts":1,"title":"Werberendite berechnen","instr":{"de":"Ein Möbelhaus hatte vor der Aktion 6.400 € Umsatz pro Woche. In der Aktionswoche waren es 9.150 €. Die Werbung kostete 2.200 €. Berechne den Umsatzzuwachs und die Werberendite.","vi":"Một cửa hàng đồ nội thất có doanh thu 6.400 € mỗi tuần trước đợt khuyến mãi. Trong tuần khuyến mãi là 9.150 €. Quảng cáo tốn 2.200 €. Hãy tính Umsatzzuwachs và Werberendite."},"tip":{"de":"Erst die Differenz der Umsätze, dann mal 100, dann geteilt durch die Werbekosten.","vi":"Trước hết lấy hiệu hai doanh thu, rồi nhân 100, rồi chia cho chi phí quảng cáo."},"parts":[{"q":"Umsatzzuwachs","u":"€","a":2750,"tol":0.01,"work":true,"steps":["9.150 € − 6.400 € = 2.750 €"]},{"q":"Werberendite","u":"%","a":125,"tol":0.5,"work":true,"steps":["2.750 × 100 = 275.000","275.000 ÷ 2.200 = 125","Die Werberendite beträgt 125 %."]}]},{"id":"v2","level":"v","no":"Vertiefung 2","type":"free","pts":1,"title":"Warum ist das so?","instr":{"de":"Der Möbelhaus-Chef sagt bei 125 % Werberendite: „Die Aktion hat sich bestimmt gelohnt.“ Warum kann das trotzdem falsch sein? Begründe.","vi":"Ông chủ cửa hàng nói với Werberendite 125 %: “Chắc chắn đợt này đáng làm.” Tại sao điều đó vẫn có thể sai? Hãy giải thích."},"tip":{"de":"Die Werberendite rechnet mit dem Umsatz. Was muss vom Umsatz noch abgezogen werden?","vi":"Werberendite tính theo doanh thu. Còn phải trừ gì khỏi doanh thu nữa?"},"parts":[{"q":"Meine Begründung:","m":"Die Werberendite rechnet mit dem Umsatz, nicht mit dem Gewinn. Vom Umsatz muss noch der Wareneinsatz abgezogen werden. Außerdem kann der Umsatz auch aus anderen Gründen gestiegen sein (zum Beispiel Wetter, Feiertag).","s":["Das kann falsch sein, weil …"]}]}]};
</script>

function hashSeed(s){let h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
function shuf(arr,seed){const a=arr.slice();let s=hashSeed(seed)||1;for(let i=a.length-1;i>0;i--){s=(s*1664525+1013904223)>>>0;const j=s%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function norm(s){return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9%€., ]/g,' ').replace(/\s+/g,' ').trim()}
function num(s){s=String(s==null?'':s).replace(/[€%\s]|[a-zA-Z²³]+/g,'');if(!s)return NaN;if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');return parseFloat(s)}

function parts(it){switch(it.type){case'mc':return it.qs;case'tf':return it.st;case'gap':return it.gaps;case'match':return it.rows;case'table':return cells(it);case'calc':case'free':return it.parts;default:return[]}}

/* ---------- Bewertung ---------- */
function mcTxt(p,idx){return String(idx).split(',').filter(x=>x!=='').map(i=>p.o[+i]).join(' / ')}
function grade(it){
 const a=A(it.id),ps=parts(it),res=[];
 if(it.type==='read'){const keys=readKeys(it),sel=a.m||[];const found=keys.filter(k=>sel.indexOf(k)>=0).length,extra=sel.filter(k=>keys.indexOf(k)<0).length;
  const q=it.quiz,qa=a.q;return{type:'read',found,total:keys.length,extra,qok:q?(qa!=null&&+qa===q.a):null,max:0,got:0,parts:[],filled:!!(a.chk&&(!q||qa!=null))}}
 ps.forEach((p,i)=>{const v=a['p'+i];let ok=false,mine='',sol='',has=v!=null&&String(v).trim()!=='';
  switch(it.type){
  case'mc':{const sa=[].concat(p.a).slice().sort().join(',');const sv=has?String(v).split(',').sort().join(','):'';ok=has&&sv===sa;mine=has?mcTxt(p,v):'';sol=mcTxt(p,sa);break}
  case'tf':ok=has&&(v==='t')===p.a;mine=has?(v==='t'?u('richtig'):u('falsch')):'';sol=p.a?u('richtig'):u('falsch');break;
  case'gap':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'match':ok=has&&v===p.a;mine=has?v:'';sol=p.a;break;
  case'table':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'calc':{const n=num(v);ok=has&&!isNaN(n)&&Math.abs(n-p.a)<=(p.tol==null?0.01:p.tol);mine=has?v:'';sol=fnum(p.a)+(p.u?' '+p.u:'');if(a['p'+i+'w'])mine+=' | '+u('path')+': '+a['p'+i+'w'];break}
  case'free':{const r=a.r;ok=r==='y'?true:r==='p'?0.5:false;has=has&&!!r;mine=a['p'+i]||'';sol=T(p.m);break}
  }
  res.push({ok,has,mine,sol,why:p.why,q:p.q,p});});
 const per=ps.length?it.pts/ps.length:0;let got=0;res.forEach(r=>{got+=(r.ok===true?1:r.ok===0.5?0.5:0)*per});
 let filled;if(it.type==='free')filled=ps.every((p,i)=>String(a['p'+i]||'').trim()!=='');else filled=res.every(r=>r.has);
 return{type:it.type,parts:res,max:it.pts||0,got,filled,any:res.some(r=>r.has)}}
function tokens(p){const out=[];let idx=0;let m;
 const parts=[];let last=0,s=p;const rg=/\[\[(.+?)\]\]|\{\{(.+?)\}\}/g;while((m=rg.exec(s))){if(m.index>last)parts.push({t:s.slice(last,m.index)});parts.push({t:m[1]||m[2],key:!!m[1]});last=rg.lastIndex}
 if(last<s.length)parts.push({t:s.slice(last)});
 parts.forEach((pt,pi)=>{const prev=parts[pi-1];pt.t.split(/\s+/).filter(Boolean).forEach((w,wi)=>{const att=wi===0&&prev&&!/\s$/.test(prev.t)&&!/^\s/.test(pt.t);out.push({w,key:!!pt.key,i:idx++,att,pu:/^[.,;:!?)“”„"]+$/.test(w)})})});return out}
function allTokens(it){let g=0;return it.paras.map(p=>tokens(p).map(t=>({w:t.w,key:t.key,att:t.att,pu:t.pu,i:g++})))}
function readKeys(it){const k=[];allTokens(it).forEach(ps=>ps.forEach(t=>{if(t.key)k.push(t.i)}));return k}
/* ---------- Rendern ---------- */
function ptsLabel(it){if(it.type==='read'||!it.pts)return'';return it.level==='v'?'+'+fmt(it.pts)+' '+(S.lang==='vi'?'điểm thưởng':'Bonus'):fmt(it.pts)+' '+(S.lang==='vi'?'điểm':(it.pts===1?'Punkt':'Punkte'))}
function tipBlock(it){return it.tip?`<details class="tip"><summary>💡 ${u('tip')}</summary><div>${rich(T(it.tip))}</div></details>`:''}
function wg(it,i,p){if(!p.w&&!p.s)return'';const ch=(p.w||[]).concat(p.s||[]).map(x=>`<button type="button" class="chip" data-chip="${esc(x)}" data-for="${it.id}_${i}">${esc(x)}</button>`).join('');return`<details class="wg"><summary>✏️ ${u('words')}</summary><div class="chips">${ch}</div></details>`}
const BODY={
 info(it){return`<div class="info">${it.html||''}</div>`+(it.vi&&S.lang==='vi'?`<div class="vis">${rich(it.vi)}</div>`:'')},
 read(it){const per=allTokens(it);const a=A(it.id);const sel=a.m||[];
  const ps=per.map(ts=>`<p class="rd${a.chk?' chk':''}" data-rd="${it.id}">`+ts.map(t=>t.pu&&t.att?esc(t.w):(t.att?'':' ')+`<span class="w${t.key?' key':''}${sel.indexOf(t.i)>=0?' sel':''}" data-w="${t.i}" role="button" tabindex="0">${esc(t.w)}</span>`).join('').trim()+'</p>').join('');
  const q=it.quiz;let quiz='';
  if(q&&a.chk){quiz=`<div class="q" data-part="0"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="radio" name="${it.id}_q" data-k="q" value="${j}"${a.q!=null&&+a.q===j?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}
  return`<p class="vis">${u('tap')}</p>${ps}<div class="actions"><button type="button" class="primary" data-act="rdchk" data-id="${it.id}">${u('chkmark')}</button></div>${quiz}`+(it.vi&&S.lang==='vi'?`<p class="vis">${rich(it.vi)}</p>`:'')},
 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';
   else el=`<input class="in" type="text" data-k="p${i}" data-part="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(8,String([].concat(g.a)[0]).length+2)}" value="${esc(v)}">`;
   html=html.replace('{'+i+'}',el)});
  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},
 match(it){const a=A(it.id);const o=matchOpts(it);return it.rows.map((r,i)=>`<div class="mrow" data-part="${i}"><div><b>${rich(T(r.l))}</b></div><select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${a['p'+i]===x?' selected':''}>${esc(x)}</option>`).join('')+'</select></div>').join('')},
 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{
   if(c&&typeof c==='object'){const i=n++;const o=c.o||(it.colOpts||[])[ci];const v=a['p'+i]||'';const f=o?`<select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>':`<input class="in" type="text" data-k="p${i}" value="${esc(v)}" autocomplete="off">`;
    return`<div class="fld" data-part="${i}"><label>${esc(it.cols[ci])}</label>${f}</div>`}
   return`<div class="fld"><label>${esc(it.cols[ci])}</label><div>${rich(T(c))}</div></div>`}).join('')+'</div>'}).join('')},
 calc(it){const a=A(it.id);return it.parts.map((p,i)=>`<div class="crow" data-part="${i}"><p class="qt">${rich(T(p.q))}</p><input class="in" type="text" inputmode="decimal" data-k="p${i}" value="${esc(a['p'+i]||'')}" autocomplete="off" placeholder="0,00"><span class="u">${esc(p.u||'')}</span>${p.work?`<textarea class="in" data-k="p${i}w" rows="2" style="min-height:4rem" placeholder="${S.lang==='vi'?'Cách tính (viết ra)':'Rechenweg (aufschreiben)'}">${esc(a['p'+i+'w']||'')}</textarea>`:''}</div>`).join('')},
 free(it){const a=A(it.id);const sh=S.shown[it.id];return it.parts.map((p,i)=>`<div class="fpart"><p class="qt">${rich(T(p.q))}</p>${wg(it,i,p)}<textarea class="in" id="${it.id}_${i}" data-k="p${i}" rows="3" placeholder="…">${esc(a['p'+i]||'')}</textarea>`+(sh?`<div class="model"><div class="t">${u('model').replace(/ anzeigen| ?$/,'')}</div>${rich(T(p.m))}</div>`:'')+'</div>').join('')+(sh?`<div class="rate"><span style="flex:1 1 100%;font-weight:600">${u('rate')}</span>`+['y','p','n'].map(v=>`<button type="button" data-rate="${v}" data-k="r" class="${a.r===v?'on':''}">${u(v)}</button>`).join('')+'</div>':'')}
};

function progress(){const its=D.items.filter(it=>visible(it)&&counted(it));let n=0;its.forEach(it=>{if(grade(it).filled)n++});
 const pc=its.length?Math.round(n/its.length*100):0;$('#barfill').style.width=pc+'%';$('#cnt').textContent=n+' / '+its.length+' '+u('progress');
 $$('.card').forEach(c=>{const it=D.items.find(x=>x.id===c.dataset.id);c.classList.toggle('done',counted(it)&&grade(it).filled)});
 [25,50,75,100].forEach(m=>{if(pc>=m&&!(S.toast||{})[m]&&n>0){S.toast=S.toast||{};S.toast[m]=1;if(m===100||m===50)toast(m+' % ✓')}})}
function paint(it){const c=$('#c_'+it.id);if(!c)return;const g=grade(it);const fb=$('.fb',c);
 if(it.type==='read'){const a=A(it.id);const rd=$$('.rd',c);rd.forEach(r=>r.classList.add('chk'));
  let h=`${g.found===g.total&&!g.extra?'✔':'ℹ️'} ${g.found} ${u('of')} ${g.total} ${u('found')}`+(g.extra?`, ${g.extra} ${u('extra')}`:'');fb.className='fb '+(g.found===g.total&&!g.extra?'ok':'mid');fb.innerHTML=h;
  const q=it.quiz;if(q&&a.q!=null){const qq=$('.q',c);const ok=+a.q===q.a;qq.classList.toggle('ok',ok);qq.classList.toggle('bad',!ok);fb.innerHTML+=`<small>${ok?'✓':'✗'} ${rich(T(q.why))}</small>`}return}
 if(!S.checked[it.id]||it.type==='info')return;
 if(it.type==='free'){return}
 const right=g.parts.filter(p=>p.ok===true).length;

 fb.className='fb '+(right===g.parts.length?'ok':right?'mid':'bad');
 fb.innerHTML=(right===g.parts.length?'✓ '+u('allright'):right+' '+u('of')+' '+g.parts.length+' '+u('right')+'. '+(g.filled?'':u('fill')+' ')+(right<g.parts.length?`<small>${u('notall')}</small>`:''))}

window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
