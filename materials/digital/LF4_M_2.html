<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF 4 · Digitales Arbeitsblatt</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + .5rem) 1rem .4rem}
#bar .row{display:flex;align-items:center;gap:.6rem;max-width:56rem;margin:0 auto}
#bar .ttl{font-weight:700;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{height:.7rem;background:#e6e3da;border-radius:1rem;overflow:hidden;max-width:56rem;margin:.35rem auto 0}
#progf{height:100%;width:0;background:var(--pri);transition:width .4s}
#progt{font-size:.8rem;color:var(--mute);max-width:56rem;margin:.1rem auto 0}
#langs{display:flex;gap:.4rem;overflow-x:auto;max-width:56rem;margin:.35rem auto 0;padding-bottom:.15rem;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;min-height:44px;padding:0 .9rem;border:2px solid var(--line);background:#fff;border-radius:2rem;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;margin:0 0 1rem}
.card h2{font-size:1.25rem;margin:0 0 .4rem;line-height:1.3}
.card h2 .nr{display:inline-block;background:var(--pri);color:#fff;border-radius:.5rem;padding:0 .5rem;margin-right:.4rem;font-size:.95rem}
.vtag{display:inline-block;background:#6a3fa0;color:#fff;border-radius:.5rem;padding:0 .5rem;font-size:.85rem;margin-left:.3rem}
.card.v{border-color:#6a3fa0;background:#faf6ff}
.tr{font-size:.9rem;color:#4a5a66;background:#f1f6f9;border-left:4px solid #9cc3d5;border-radius:.4rem;padding:.3rem .6rem;margin:.3rem 0 .5rem;line-height:1.5}
.tr[dir=rtl]{border-left:0;border-right:4px solid #9cc3d5}
.tr[lang=ti]{font-family:"Kefa","Noto Sans Ethiopic",sans-serif}
.tr[lang=vi]{line-height:1.65}
small.b{display:block;font-size:.72rem;font-weight:400;opacity:.9;line-height:1.2}
.in{display:block;width:100%;min-height:48px;font:inherit;font-size:1rem;padding:.55rem .7rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink)}
input.in,select.in{font-size:1rem}
textarea.in{min-height:5.5rem;resize:vertical}
.btn{min-height:48px;padding:.4rem 1.1rem;border:0;border-radius:.8rem;background:var(--pri);color:#fff;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin:.3rem .4rem .3rem 0}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.gray{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.big{min-height:56px;font-size:1.1rem}
.btn:active,.pill:active,.opt:active,.ch:active{transform:scale(.97)}
.tipb{min-height:48px;min-width:48px;border-radius:2rem;border:2px solid var(--warn);background:var(--warnbg);font:inherit;font-size:1rem;cursor:pointer;padding:0 .9rem;float:right;margin:0 0 .3rem .5rem}
.tipbox{background:var(--warnbg);border:2px solid var(--warn);border-radius:.8rem;padding:.5rem .8rem;margin:.4rem 0}
.q{margin:.8rem 0 .2rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:.45rem;margin:.3rem 0}
.opt{min-height:48px;text-align:left;padding:.5rem .8rem;border:2px solid var(--line);background:#fff;border-radius:.8rem;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--pri);background:var(--pri2);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.tbl{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:1rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.4rem .3rem;text-align:left;vertical-align:middle}
.tbl.info th{background:#eef3f6}
.tbl.info td,.tbl.info th{border:1px solid var(--line);padding:.4rem .5rem}
.tbl td.c{text-align:center;white-space:nowrap}
.ch{min-width:48px;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:.7rem;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer;margin:2px}
.ch.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.sol{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
tr.rok td{background:var(--okbg)}tr.rno td{background:var(--badbg)}
.fb{border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0;font-size:1rem}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb.part{background:var(--warnbg);border:1px solid var(--warn)}
.sit{background:#eef3f6;border-left:5px solid var(--pri);border-radius:.5rem;padding:.5rem .8rem;margin:.5rem 0}
.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#23303a;color:#fff;padding:.6rem 1.1rem;border-radius:2rem;z-index:99;font-size:1rem;max-width:90%}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}
.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}
#set.open{display:block}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row2 label{font-weight:600;min-width:7rem}
.nowrap{white-space:nowrap}
#report{display:none}
@media (max-width:600px){main{padding-top:8.2rem}.card{padding:.8rem}h1{font-size:1.35rem}.tbl{font-size:.95rem}}
@media print{
 body{background:#fff;padding:0;font-size:11pt}
 #bar,#set,main,.toast,.dlg,.noprint{display:none!important}
 #report{display:block!important}
 #report h1{font-size:16pt}
 #report table{width:100%;border-collapse:collapse;font-size:10pt}
 #report td,#report th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

</style>
</head>

{k:'read',id:'r1',h:'Zum Nachlesen: Licht und Farbe',sum:'Licht und Farbe müssen zur Ware passen.',
 paras:['Es gibt drei Arten von Licht: [[Grundbeleuchtung]] (genug Licht auf der ganzen Fläche), [[Warenwandbeleuchtung]] (hebt die Waren an den Wänden hervor) und [[Akzentbeleuchtung]] (betont einzelne Waren, zum Beispiel mit einem Spot auf die neue Handtasche).','Die [[Lichtfarbe]] muss zur Ware passen: Warmes Licht lässt Tomaten, Fleisch und Brot appetitlich wirken. Bei Textilien muss das Licht [[naturgetreu]] sein, sonst sieht die Farbe zu Hause anders aus.','[[Farbe]] hat drei Aufgaben: Sie ordnet, sie lässt Kunden sich wohlfühlen und sie sorgt für Wiedererkennung ([[Hausfarbe]], Logo).','Faustregel: Bei teurer Ware mit viel Beratung wirken [[kühle Farben]] (Blau, Grün) entspannend. Bei Sonderangeboten und Impulsartikeln wirken [[warme Farben]] (Rot, Gelb) aktivierend.'],
 html:'<table class="tbl info"><tr><th>Farbe</th><th>Wirkung</th><th>Farbe</th><th>Wirkung</th></tr><tr><td>Rot</td><td>aktiviert, Signal, Kraft, Leidenschaft</td><td>Grün</td><td>natürlich, frisch, entspannend</td></tr><tr><td>Gelb</td><td>hell, heiter, warm, offen</td><td>Weiß</td><td>sauber, frisch, festlich</td></tr><tr><td>Orange</td><td>anregend, warm, freundlich</td><td>Schwarz</td><td>feierlich, elegant, ernst</td></tr><tr><td>Blau</td><td>kühl, ruhig, Klarheit, Vertrauen</td><td></td><td></td></tr></table>',
 q:{q:'Welche Farben wirken bei Sonderangeboten aktivierend?',o:['Blau und Grün','Rot und Gelb','Weiß und Schwarz'],a:1}},
{k:'read',id:'r2',h:'Zum Nachlesen: Dekoration, Musik, Duft, Material, Ruhezonen und die fünf Sinne',sum:'Alle fünf Sinne können im Laden angesprochen werden.',
 paras:['[[Dekoration]] muss positiv und sympathisch sein, oft hat sie ein Thema (Frühling, Urlaub, Grillabend) und wechselt regelmäßig. [[Musik]] muss zur Zielgruppe passen: ruhig im Möbelhaus, schnell in junger Mode, nicht zu laut. Ruhige Musik: Kunden bleiben länger.','[[Duft]] passt zur Ware (Kaffee, Backwaren). Er steigert die [[Kaufbereitschaft]] und die [[Verweildauer]]. Obst braucht es kühl, in Ruhezonen darf es warm sein. [[Material]] wie Holz, Marmor und Messing wirkt edel.','[[Ruhezonen]] (Sitzecke, Café, Imbiss) liegen meist zentral. Kunden erholen sich und bleiben länger. Die fünf Sinne am Point of Sale: [[Sehen]], [[Hören]], [[Riechen]], [[Schmecken]], [[Fühlen]].'],
 html:'<table class="tbl info"><tr><th>Sinn</th><th>Beispiele im Geschäft</th></tr><tr><td>Sehen</td><td>Licht, Farben, Dekoration, Displays, Bildschirme mit Produktvideos</td></tr><tr><td>Hören</td><td>Hintergrundmusik, Durchsagen zu Angeboten, Vorführung einer Soundbar</td></tr><tr><td>Riechen</td><td>Duft frischer Backwaren, Raumbeduftung, Parfümproben</td></tr><tr><td>Schmecken</td><td>Verkostung von Käse, Kaffee, Wein</td></tr><tr><td>Fühlen</td><td>Ware zum Anfassen und Anprobieren, Materialproben, Teppich zum Barfußlaufen</td></tr></table>',
 q:{q:'Wozu dienen Ruhezonen?',o:['Kunden erholen sich und bleiben länger.','Sie sparen Verkaufsfläche.','Sie ersetzen die Kasse.'],a:0}},
{k:'task',id:'a3',n:'Aufgabe 3',h:'Vorgemacht: Sinne ansprechen',hk:'c.vor.h',intro:'Lies das Beispiel. Dann entscheide: richtig oder falsch?',ik:'c.vor.i',tip:'Das Beispiel bringt 2 Punkte, der Sinn nur 1. Ein „damit …“ zeigt den Zweck.',ex:'Gute Antworten nennen den Sinn und beschreiben, was passiert und wozu („damit …“).',
 sit:'<b>Die Aufgabe:</b> Die Kaufhaus Hansa GmbH startet die Aktion „Grillsaison“. Nennen Sie zwei Sinne, die angesprochen werden sollen, und beschreiben Sie je ein Beispiel zur Umsetzung. (6 Punkte: je Sinn 1 Punkt, je Beispiel 2 Punkte)<table class="tbl info"><tr><th>Denkschritt</th><th>So gehe ich vor</th></tr><tr><td>1 Punkte lesen</td><td>Das Beispiel bringt 2 Punkte, der Sinn nur 1. Also muss das Beispiel ausführlich sein: was passiert und wozu.</td></tr><tr><td>2 Passend zur Aktion</td><td>Grillsaison: Was riecht, schmeckt, klingt nach Grillen?</td></tr><tr><td>3 Aufschreiben</td><td>Riechen: Vor dem Eingang wird gegrillt, damit der Duft die Kunden in die Abteilung lockt und Appetit macht. · Schmecken: Kunden dürfen neue Grillsoßen probieren, damit sie sich vom Geschmack überzeugen.</td></tr><tr><td>4 Prüfen</td><td>Zwei verschiedene Sinne? Hat jedes Beispiel ein „damit …“? Dann gibt es volle Punktzahl.</td></tr></table>',items:[

{k:'task',id:'a4',n:'Aufgabe 4',h:'Geführte Übung: Licht und Farbe',intro:'4.1: Welche Beleuchtung ist gemeint? 4.2: Welche Farbe passt?',ik:'a4.i',tip:'Gleichmäßig überall hell = Grundbeleuchtung. Wand = Warenwandbeleuchtung. Eine einzelne Ware betont = Akzentbeleuchtung.',ex:'Grundlicht: überall. Wandlicht: Regale an der Wand. Akzentlicht: einzelne Ware. Farbe: siehe Tabelle im Nachlesen.',items:[
 {t:'table',id:'a4.1',q:'4.1 G = Grundbeleuchtung · W = Warenwandbeleuchtung · A = Akzentbeleuchtung',cols:[['G','Grundbeleuchtung'],['W','Warenwandbeleuchtung'],['A','Akzentbeleuchtung']],rows:[['1 Die ganze Verkaufsfläche ist gleichmäßig hell.',0],['2 Ein Spot strahlt die neue Handtasche auf dem Podest an.',2],['3 Lichtbänder beleuchten die Regale an der Rückwand.',1],['4 Eine Dekoinsel mit Gartenmöbeln wird hervorgehoben.',2],['5 Die Schuhwand wird von oben gleichmäßig ausgeleuchtet.',1],['6 Deckenleuchten sorgen dafür, dass man die Preise überall lesen kann.',0]]},
 {t:'sel',id:'a4.2',q:'4.2 Welche Farbe passt? Nutze die Tabelle „Farbe“ im Nachlesen.',o:['Grün','Rot oder Gelb','Schwarz (mit Gold oder Weiß)','Blau','Weiß','Orange oder Gelb'],rows:[['Obst- und Gemüseabteilung im Bio-Markt',0],['Aktionsfläche mit Sonderangeboten',1],['Juwelier, hochwertige Uhren',2],['Beratungsecke für teure Matratzen',3],['Hochzeitsabteilung im Modehaus',4],['Kasse mit Süßigkeiten für den Spontankauf',5]],ex:'Wirkung: Grün natürlich, frisch · Rot/Gelb aktiviert · Schwarz edel, festlich · Blau ruhig, Vertrauen · Weiß festlich, rein · Orange/Gelb warm, anregend.'}]},

{k:'task',id:'a6',n:'Aufgabe 6',h:'Freie Übung: Eine Warenwand mit allen Sinnen planen (5 Leistungspunkte)',intro:'Wähle eine Ware aus deinem Ausbildungsbetrieb (oder: Snowboards, Arbeitsheft S. 159). Plane eine Warenwand oder Aktionsfläche, die alle fünf Sinne anspricht. Schreibe zu jedem Sinn eine Maßnahme und ihre Wirkung.',ik:'a6.i',tip:'Gehe die fünf Sinne der Reihe nach durch: Sehen (Licht, Farbe, Deko), Hören, Riechen, Schmecken, Fühlen.',ex:'Für jeden Sinn eine passende Maßnahme mit Wirkung (je 1 Punkt; Sehen zählt einmal).',items:[
 {t:'free',id:'a6.1',pts:5,nq:1,q:'Meine Ware, meine Zielgruppe und je Sinn eine Maßnahme mit Wirkung:',model:'Beispiel Snowboards – Sehen: Akzentlicht auf das neue Board, Weiß und Blau, Schneedeko → lenkt den Blick, Winterstimmung. Hören: aktuelle Musik der Zielgruppe, nicht zu laut → junge Kunden fühlen sich angesprochen. Riechen: Duft von Wachs oder Holz → wirkt echt, erinnert an die Hütte. Schmecken: heißer Tee oder Punsch (alkoholfrei) am Samstag → Kunden bleiben länger. Fühlen: Boards zum Anfassen, Bindung zum Ausprobieren → Kunden prüfen die Qualität selbst.'}]},
{k:'task',id:'a7',n:'Aufgabe 7',h:'Prüfungs-Check: im Stil der Abschlussprüfung (10 Punkte · etwa 10 Minuten)',hk:'c.pruef.h',intro:'Lies die Situation. Beantworte die Fragen wie in der Prüfung.',ik:'c.pruef.i',tip:'Erläutern = ein Element nennen UND erklären, wie es wirkt. Nennen = Sinn und je ein Beispiel.',tk:'a7.t',ex:'Bei „erläutern“ gehört zum Namen immer die Erklärung dazu. Bei den Sinnen gibt es Punkte für den Sinn und für das Beispiel.',
 sit:'<b>Situation:</b> Die Kaufhaus Hansa GmbH möchte ihre Multimedia-Abteilung verkaufsfördernd gestalten.',items:[
 {t:'free',id:'a7.1',pts:4,q:'7.1 Erläutern Sie zwei Gestaltungselemente, mit denen die Abteilung verkaufsfördernd gestaltet werden kann. (4 Punkte)',model:'z. B. Beleuchtung: hat einen wesentlichen Einfluss auf die Verkaufsförderung und wird gezielt eingesetzt, z. B. Spots auf neue Fernseher. Farben: wirken emotional und beeinflussen die Stimmung der Kunden. (je 2 P.)'},
 {t:'free',id:'a7.2',pts:6,q:'7.2 Nennen Sie drei Sinne, die in der Abteilung angesprochen werden können, und je ein Beispiel. (6 Punkte)',model:'Sehen – Displays, Produktvideos; Hören – Vorführung einer Soundbar; Fühlen – Tablets zum Ausprobieren (je Sinn 1 P., je Beispiel 1 P.)'}]},
{k:'task',id:'a8',n:'Aufgabe 8',h:'Für Profis',hk:'c.profis.h',intro:'Schwierigere Fragen. Begründe deine Antwort.',ik:'c.profis.i',tip:'Schaue immer auf beide Seiten: Was sagt der Händler? Was sagen die Kunden? Dann entscheide.',ex:'Ein gutes Urteil nennt beide Sichtweisen und begründet die Entscheidung.',items:[
 {t:'free',id:'a8.1',q:'8.1 Manche Händler setzen Duftmarketing gezielt ein, damit Kunden länger bleiben und mehr kaufen. Beurteilen Sie, ob das eine unzulässige Beeinflussung der Kunden ist. Berücksichtigen Sie die Sicht des Händlers und der Kunden.',model:'Händler: legitime Gestaltung wie Licht und Musik, der Kunde entscheidet frei. Kunden: wirkt unbewusst, kann zu Käufen führen, die man nicht geplant hat. Urteil: zulässig, solange nicht getäuscht wird (z. B. kein Backduft ohne frische Backwaren); kritisch, wenn es Kunden gezielt manipuliert.'},
 {t:'free',id:'a8.2',q:'8.2 Einige Supermärkte bieten eine „stille Stunde“ an: gedimmtes Licht, keine Musik, keine Durchsagen. Erläutern Sie, für welche Kunden das gedacht ist, und beurteilen Sie, ob das der Idee des Visual Merchandising widerspricht.',model:'Für Menschen, die schnell von Reizen überfordert sind, z. B. mit Autismus, ältere Menschen, Familien mit kleinen Kindern. Kein Widerspruch: Visual Merchandising soll eine Atmosphäre schaffen, in der sich die Zielgruppe wohlfühlt – für diese Kunden ist das eine ruhige.'}]},
{k:'task',id:'v1',lvl:'v',n:'Vertiefung',h:'Warum ist das so?',hk:'c.v.h',intro:'Begründe deine Antwort in ganzen Sätzen. Vergleiche danach mit der Musterlösung.',ik:'c.v.i',tip:'Beginne mit „Weil …“. Denke an die Wirkung auf den Kunden.',tk:'c.v.t',ek:'c.v.e',items:[

'title':['Với mọi giác quan','Con todos los sentidos','Com todos os sentidos','Усіма органами чуття','ብኹሉ ስምዒታት','Всеми органами чувств','بكل الحواس','Tüm duyularla'],
'can.0':['Phân biệt Grundbeleuchtung (đèn nền), Akzentbeleuchtung (đèn nhấn) và Warenwandbeleuchtung (đèn tường trưng bày).','Distinguir Grundbeleuchtung (luz general), Akzentbeleuchtung (luz de acento) y Warenwandbeleuchtung (luz de pared de mercancías).','Distinguir Grundbeleuchtung (luz geral), Akzentbeleuchtung (luz de destaque) e Warenwandbeleuchtung (luz da parede de mercadoria).','Розрізняти Grundbeleuchtung (загальне світло), Akzentbeleuchtung (акцентне світло) і Warenwandbeleuchtung (світло стіни з товаром).','Grundbeleuchtung (ሓፈሻዊ ብርሃን)፣ Akzentbeleuchtung (ዘጎልህ ብርሃን) ከምኡ Warenwandbeleuchtung (ብርሃን ግድግዳ ኣቕሑት) ፍለይ።','Различать Grundbeleuchtung (общий свет), Akzentbeleuchtung (акцентный свет) и Warenwandbeleuchtung (свет товарной стены).','التمييز بين Grundbeleuchtung (إضاءة عامة) وAkzentbeleuchtung (إضاءة تركيز) وWarenwandbeleuchtung (إضاءة جدار البضائع).','Grundbeleuchtung (genel aydınlatma), Akzentbeleuchtung (vurgu ışığı) ve Warenwandbeleuchtung (duvar ışığı) farkını bilmek.'],
'can.1':['Giải thích tác dụng của màu sắc, nhạc, mùi hương, chất liệu và Ruhezone (khu nghỉ).','Explicar el efecto de colores, música, aroma, material y Ruhezonen (zonas de descanso).','Explicar o efeito de cores, música, aroma, material e Ruhezonen (zonas de descanso).','Пояснити дію кольорів, музики, запаху, матеріалу та Ruhezonen (зон відпочинку).','ተጽዕኖ ሕብርታት፣ ሙዚቃ፣ ጨና፣ ኣቕሑትን Ruhezonen (ቦታ ዕረፍቲ) ግለጽ።','Объяснить действие цветов, музыки, запаха, материала и Ruhezonen (зон отдыха).','شرح تأثير الألوان والموسيقى والرائحة والمواد وRuhezonen (مناطق الراحة).','Renklerin, müziğin, kokunun, malzemenin ve Ruhezonen’in (dinlenme alanları) etkisini açıklamak.'],
'can.2':['Cho một mặt hàng, chỉ ra cách tác động đến cả năm giác quan.','Mostrar para una mercancía cómo se estimulan los cinco sentidos.','Mostrar, para uma mercadoria, como se estimulam os cinco sentidos.','Показати на прикладі товару, як задіяти всі п’ять органів чуття.','ንሓደ ኣቕሑት ሓሙሽተ ስምዒታት ከመይ ከም እተሰርሑ ኣርኢ።','Показать на примере товара, как задействовать все пять органов чувств.','أن أُظهر لسلعة ما كيف تُخاطَب الحواس الخمس.','Bir ürün için beş duyunun nasıl ele alındığını göstermek.'],
'a1.t':['Hãy nhớ các từ Erlebnis (trải nghiệm), Atmosphäre (không khí) và optisch (về thị giác).','Piensa en las palabras Erlebnis (experiencia), Atmosphäre (ambiente) y optisch (visual).','Pensa nas palavras Erlebnis (experiência), Atmosphäre (ambiente) e optisch (visual).','Згадай слова Erlebnis (враження), Atmosphäre (атмосфера) та optisch (візуальний).','ነቲ ቃላት Erlebnis (ተመክሮ)፣ Atmosphäre (ከባቢ) ን optisch (ብዓይኒ) ሕሰብ።','Вспомни слова Erlebnis (впечатление), Atmosphäre (атмосфера) и optisch (визуальный).','تذكّر الكلمات Erlebnis (تجربة) وAtmosphäre (أجواء) وoptisch (بصري).','Erlebnis (deneyim), Atmosphäre (atmosfer) ve optisch (görsel) sözcüklerini düşün.'],
'a1.e':['Xem lại Modul 1: Erlebnisstrategie và Visual Merchandising.','Repasa el Modul 1: Erlebnisstrategie y Visual Merchandising.','Revê o Modul 1: Erlebnisstrategie e Visual Merchandising.','Повтори Modul 1: Erlebnisstrategie та Visual Merchandising.','ን Modul 1 ደጊምካ ርአ: Erlebnisstrategie ን Visual Merchandising ን።','Повтори Modul 1: Erlebnisstrategie и Visual Merchandising.','راجع Modul 1: Erlebnisstrategie وVisual Merchandising.','Modul 1’e tekrar bak: Erlebnisstrategie ve Visual Merchandising.'],
'a1.1.q':['1.1 Mục tiêu của Erlebnisstrategie (chiến lược trải nghiệm) là gì?','1.1 ¿Cuál es el objetivo de la Erlebnisstrategie (estrategia de experiencia)?','1.1 Qual é o objetivo da Erlebnisstrategie (estratégia de experiência)?','1.1 Яка мета Erlebnisstrategie (стратегії вражень)?','1.1 ዕላማ Erlebnisstrategie እንታይ እዩ?','1.1 Какова цель Erlebnisstrategie (стратегии впечатлений)?','1.1 ما هدف Erlebnisstrategie (استراتيجية التجربة)؟','1.1 Erlebnisstrategie’nin (deneyim stratejisi) amacı nedir?'],
'a1.2.q':['1.2 Visual Merchandising (trưng bày hàng hóa bằng hình ảnh) nghĩa là gì?','1.2 ¿Qué significa Visual Merchandising (presentación visual de mercancías)?','1.2 O que significa Visual Merchandising (apresentação visual da mercadoria)?','1.2 Що означає Visual Merchandising (візуальне оформлення товарів)?','1.2 Visual Merchandising እንታይ ማለት እዩ?','1.2 Что означает Visual Merchandising (визуальная подача товара)?','1.2 ماذا يعني Visual Merchandising (العرض البصري للبضائع)؟','1.2 Visual Merchandising (görsel ürün sunumu) ne demektir?'],
'a1.3.q':['1.3 Kể hai mục tiêu: tại sao người bán thay đổi thiết kế cửa hàng?','1.3 Nombra dos objetivos: ¿por qué un comerciante rediseña su tienda?','1.3 Nomeia dois objetivos: porque é que um comerciante remodela a sua loja?','1.3 Назви дві цілі: чому торговець змінює оформлення магазину?','1.3 ክልተ ዕላማታት ጥቀስ: ስለምንታይ ሓደ ነጋዳይ ድኳኑ ይቕይር?','1.3 Назови две цели: почему торговец переоформляет магазин?','1.3 اذكر هدفين: لماذا يعيد التاجر تصميم متجره؟','1.3 İki hedef say: Bir satıcı mağazasını neden yeniden tasarlar?'],
'a2.h':['Hành trình các giác quan','El recorrido de los sentidos','O percurso dos sentidos','Парcур відчуттів','መስርሕ ስምዒታት','Парcур чувств','جولة الحواس','Duyu parkuru'],
'a2.i':['Trong giờ học, em đi qua các trạm cùng nhóm. Ở đây em ghép: Cảm nhận nào hợp với cửa hàng nào?','En clase recorres estaciones con tu equipo. Aquí relacionas: ¿qué percepción encaja en qué tienda?','Na aula percorres estações com a tua equipa. Aqui associas: que perceção combina com que loja?','На уроці ти з командою проходиш станції. Тут ти добираєш: яке сприйняття підходить якому магазину?','ኣብ ትምህርቲ ምስ ጉጅለኻ ኣብ ጣቢያታት ትሓልፍ። ኣብዚ ትዛምድ: ኣየናይ ስምዒት ምስ ኣየናይ ድኳን ይሰማማዕ?','На уроке ты с командой проходишь станции. Здесь ты сопоставляешь: какое восприятие подходит какому магазину?','في الحصة تمرّ بالمحطات مع فريقك. هنا تطابق: أي إحساس يناسب أي متجر؟','Derste ekibinle istasyonları gezersin. Burada eşleştirirsin: Hangi algı hangi mağazaya uyar?'],
'a2.t':['Hãy nghĩ đến cửa hàng: Khách hàng nên cảm thấy gì? Cà phê thơm tạo cảm giác ấm cúng. Ánh sáng ấm làm đồ ăn ngon mắt.','Piensa en la tienda: ¿qué debe sentir el cliente? El café huele acogedor. La luz cálida hace apetitosa la comida.','Pensa na loja: o que deve sentir o cliente? O café cheira a aconchego. A luz quente torna a comida apetitosa.','Подумай про магазин: що має відчувати клієнт? Кава пахне затишком. Тепле світло робить їжу апетитною.','ብዛዕባ ድኳን ሕሰብ: ዓሚል እንታይ ክስምዖ ኣለዎ? ቡን ጽቡቕ ይወስድ። ዝሙቐ ብርሃን መግቢ የጥዕም።','Подумай о магазине: что должен чувствовать клиент? Кофе пахнет уютом. Тёплый свет делает еду аппетитной.','فكّر في المتجر: ماذا يجب أن يشعر الزبون؟ القهوة رائحتها دافئة. الضوء الدافئ يجعل الطعام شهيًّا.','Mağazayı düşün: Müşteri ne hissetmeli? Kahve rahatlatıcı kokar. Sıcak ışık yemeği iştah açıcı gösterir.'],
'a2.e':['Tác động phải hợp với hàng hóa và nhóm khách hàng.','El efecto debe encajar con la mercancía y el grupo objetivo.','O efeito tem de combinar com a mercadoria e o público-alvo.','Дія має відповідати товару й цільовій групі.','ተጽዕኖ ምስ ኣቕሑትን ምስ ዕላማ ዓሚላትን ክሰማማዕ ኣለዎ።','Эффект должен подходить товару и целевой группе.','يجب أن يناسب التأثير البضاعة والفئة المستهدفة.','Etki ürüne ve hedef kitleye uymalı.'],
'a2.1.q':['2.1 Cảm nhận nào hợp với cửa hàng nào?','2.1 ¿Qué tienda encaja con cada percepción?','2.1 Que loja combina com cada perceção?','2.1 Який магазин підходить до кожного сприйняття?','2.1 ኣየናይ ድኳን ምስ ነፍሲ ወከፍ ስምዒት ይሰማማዕ?','2.1 Какой магазин подходит к каждому восприятию?','2.1 أي متجر يناسب كل إحساس؟','2.1 Hangi mağaza hangi algıya uyar?'],
'a2.2.q':['2.2 Chọn một trạm. Nó tác động đến em thế nào?','2.2 Elige una estación. ¿Cómo te afecta?','2.2 Escolhe uma estação. Como te afeta?','2.2 Обери одну станцію. Як вона на тебе діє?','2.2 ሓደ ጣቢያ ምረጽ። ከመይ ይጸሉኻ?','2.2 Выбери одну станцию. Как она на тебя действует?','2.2 اختر محطة. كيف تؤثر فيك؟','2.2 Bir istasyon seç. Sana nasıl etki ediyor?'],
'r1.h':['Đọc thêm: Ánh sáng và màu sắc','Para leer: luz y color','Para ler: luz e cor','Для читання: світло й колір','ንምንባብ: ብርሃንን ሕብርን','Для чтения: свет и цвет','للقراءة: الضوء واللون','Okumak için: Işık ve renk'],
'r1.s':['Ánh sáng và màu sắc phải hợp với hàng hóa.','La luz y el color deben encajar con la mercancía.','A luz e a cor têm de combinar com a mercadoria.','Світло й колір мають пасувати до товару.','ብርሃንን ሕብርን ምስ ኣቕሑት ክሰማምዑ ኣለዎም።','Свет и цвет должны подходить товару.','يجب أن يناسب الضوء واللون البضاعة.','Işık ve renk ürüne uymalı.'],
'r1.qq':['Màu nào có tác dụng kích thích ở hàng khuyến mãi (Sonderangebote)?','¿Qué colores activan en las ofertas especiales (Sonderangebote)?','Que cores ativam nas promoções (Sonderangebote)?','Які кольори активують на акційних товарах (Sonderangebote)?','ኣየናይ ሕብርታት ኣብ Sonderangebote (ፍሉይ ቅናሽ) የተባብዑ?','Какие цвета активируют при спецпредложениях (Sonderangebote)?','أي الألوان تنشّط عند العروض الخاصة (Sonderangebote)؟','Sonderangebote’de (özel tekliflerde) hangi renkler harekete geçirir?'],
'r2.h':['Đọc thêm: Trang trí, nhạc, mùi hương, chất liệu, khu nghỉ và năm giác quan','Para leer: decoración, música, aroma, material, zonas de descanso y los cinco sentidos','Para ler: decoração, música, aroma, material, zonas de descanso e os cinco sentidos','Для читання: декор, музика, запах, матеріал, зони відпочинку й п’ять органів чуття','ንምንባብ: ድኮር፣ ሙዚቃ፣ ጨና፣ ቁስ፣ ቦታ ዕረፍቲን ሓሙሽተ ስምዒታትን','Для чтения: декор, музыка, запах, материал, зоны отдыха и пять органов чувств','للقراءة: الديكور والموسيقى والرائحة والمواد ومناطق الراحة والحواس الخمس','Okumak için: Dekor, müzik, koku, malzeme, dinlenme alanları ve beş duyu'],
'r2.s':['Cả năm giác quan đều có thể được tác động trong cửa hàng.','Se pueden estimular los cinco sentidos en la tienda.','Podem-se estimular os cinco sentidos na loja.','У магазині можна задіяти всі п’ять органів чуття.','ኣብ ድኳን ሓሙሽተ ስምዒታት ክሰርሑ ይኽእሉ።','В магазине можно задействовать все пять органов чувств.','يمكن مخاطبة الحواس الخمس في المتجر.','Mağazada beş duyunun hepsine hitap edilebilir.'],
'r2.qq':['Ruhezone (khu nghỉ) dùng để làm gì?','¿Para qué sirven las Ruhezonen (zonas de descanso)?','Para que servem as Ruhezonen (zonas de descanso)?','Для чого потрібні Ruhezonen (зони відпочинку)?','Ruhezonen ንምንታይ ይጠቕሙ?','Для чего нужны Ruhezonen (зоны отдыха)?','ما فائدة Ruhezonen (مناطق الراحة)؟','Ruhezonen (dinlenme alanları) ne işe yarar?'],
'a3.t':['Ví dụ được 2 điểm, giác quan chỉ 1 điểm. „damit …“ (để …) cho thấy mục đích.','El ejemplo vale 2 puntos, el sentido solo 1. Un «damit …» (para que …) muestra la finalidad.','O exemplo vale 2 pontos, o sentido só 1. Um «damit …» (para que …) mostra a finalidade.','Приклад — 2 бали, орган чуття лише 1. «damit …» (щоб …) показує мету.','ኣብነት 2 ነጥቢ፣ ስምዒት 1 ጥራይ። «damit …» (ብምኽንያት …) ዕላማ የርኢ።','Пример — 2 балла, орган чувств только 1. «damit …» (чтобы …) показывает цель.','المثال بنقطتين والحاسة بنقطة واحدة فقط. «damit …» (كي …) يبيّن الغرض.','Örnek 2 puan, duyu sadece 1 puan. «damit …» (… diye) amacı gösterir.'],
'a3.e':['Câu trả lời tốt nêu giác quan và mô tả điều xảy ra cùng mục đích („damit …“).','Una buena respuesta nombra el sentido y describe qué ocurre y para qué («damit …»).','Uma boa resposta nomeia o sentido e descreve o que acontece e para quê («damit …»).','Хороша відповідь називає орган чуття й описує, що відбувається і навіщо («damit …»).','ጽቡቕ መልሲ ነቲ ስምዒት ይጥቅስን እንታይ ከም ዝዀነን ስለምንታይን («damit …») ይገልጽ።','Хороший ответ называет орган чувств и описывает, что происходит и зачем («damit …»).','الجواب الجيد يذكر الحاسة ويصف ما يحدث ولماذا («damit …»).','İyi cevap duyuyu söyler ve ne olduğunu ve neden olduğunu anlatır («damit …»).'],
'a4.h':['Bài tập có hướng dẫn: Ánh sáng và màu sắc','Ejercicio guiado: luz y color','Exercício guiado: luz e cor','Керована вправа: світло й колір','ምምሕዳር ልምምድ: ብርሃንን ሕብርን','Упражнение с подсказкой: свет и цвет','تمرين موجَّه: الضوء واللون','Rehberli alıştırma: Işık ve renk'],
'a4.i':['4.1: Đây là loại chiếu sáng nào? 4.2: Màu nào phù hợp?','4.1: ¿Qué iluminación se describe? 4.2: ¿Qué color encaja?','4.1: Que iluminação é descrita? 4.2: Que cor combina?','4.1: Яке освітлення описано? 4.2: Який колір підходить?','4.1: ኣየናይ ብርሃን እዩ? 4.2: ኣየናይ ሕብሪ ይሰማማዕ?','4.1: Какое освещение описано? 4.2: Какой цвет подходит?','4.1: أي إضاءة هذه؟ 4.2: أي لون يناسب؟','4.1: Hangi aydınlatma anlatılıyor? 4.2: Hangi renk uygun?'],
'a4.t':['Sáng đều khắp nơi = Grundbeleuchtung (đèn nền). Tường = Warenwandbeleuchtung. Làm nổi một món hàng = Akzentbeleuchtung (đèn nhấn).','Claro y uniforme por todas partes = Grundbeleuchtung. Pared = Warenwandbeleuchtung. Resaltar una mercancía = Akzentbeleuchtung.','Claro e uniforme em todo o lado = Grundbeleuchtung. Parede = Warenwandbeleuchtung. Destacar uma mercadoria = Akzentbeleuchtung.','Рівномірно світло всюди = Grundbeleuchtung. Стіна = Warenwandbeleuchtung. Виділення одного товару = Akzentbeleuchtung.','ኣብ ኩሉ ቦታ ሓደ ዓይነት ብርሃን = Grundbeleuchtung። ግድግዳ = Warenwandbeleuchtung። ሓደ ኣቕሓ ምጉላሕ = Akzentbeleuchtung።','Равномерно светло везде = Grundbeleuchtung. Стена = Warenwandbeleuchtung. Выделение одного товара = Akzentbeleuchtung.','إضاءة متساوية في كل مكان = Grundbeleuchtung. الجدار = Warenwandbeleuchtung. إبراز سلعة واحدة = Akzentbeleuchtung.','Her yerde eşit aydınlık = Grundbeleuchtung. Duvar = Warenwandbeleuchtung. Tek bir ürünü öne çıkarma = Akzentbeleuchtung.'],
'a4.e':['Đèn nền: khắp nơi. Đèn tường: kệ ở tường. Đèn nhấn: một món hàng. Màu sắc: xem bảng trong phần đọc thêm.','Luz general: en todas partes. Luz de pared: estantes de la pared. Luz de acento: una mercancía. Color: mira la tabla de la lectura.','Luz geral: em todo o lado. Luz de parede: prateleiras da parede. Luz de destaque: uma mercadoria. Cor: vê a tabela na leitura.','Загальне світло: скрізь. Світло стіни: полиці біля стіни. Акцентне світло: один товар. Колір: див. таблицю в тексті.','ሓፈሻዊ ብርሃን: ኣብ ኩሉ ቦታ። ብርሃን ግድግዳ: መደርደሪ ግድግዳ። ዘጎልህ ብርሃን: ሓደ ኣቕሓ። ሕብሪ: ኣብ ሰንጠረዥ ርአ።','Общий свет: везде. Свет стены: полки у стены. Акцентный свет: один товар. Цвет: см. таблицу в тексте.','الإضاءة العامة: في كل مكان. إضاءة الجدار: رفوف الجدار. إضاءة التركيز: سلعة واحدة. اللون: انظر الجدول في القراءة.','Genel ışık: her yerde. Duvar ışığı: duvardaki raflar. Vurgu ışığı: tek bir ürün. Renk: okuma bölümündeki tabloya bak.'],
'a4.1.q':['4.1 G = Grundbeleuchtung (đèn nền) · W = Warenwandbeleuchtung (đèn tường) · A = Akzentbeleuchtung (đèn nhấn)','4.1 G = Grundbeleuchtung (luz general) · W = Warenwandbeleuchtung (luz de pared) · A = Akzentbeleuchtung (luz de acento)','4.1 G = Grundbeleuchtung (luz geral) · W = Warenwandbeleuchtung (luz de parede) · A = Akzentbeleuchtung (luz de destaque)','4.1 G = Grundbeleuchtung (загальне) · W = Warenwandbeleuchtung (стіна) · A = Akzentbeleuchtung (акцент)','4.1 G = Grundbeleuchtung · W = Warenwandbeleuchtung · A = Akzentbeleuchtung','4.1 G = Grundbeleuchtung (общий) · W = Warenwandbeleuchtung (стена) · A = Akzentbeleuchtung (акцент)','4.1 G = Grundbeleuchtung (عامة) · W = Warenwandbeleuchtung (الجدار) · A = Akzentbeleuchtung (تركيز)','4.1 G = Grundbeleuchtung (genel) · W = Warenwandbeleuchtung (duvar) · A = Akzentbeleuchtung (vurgu)'],
'a4.2.q':['4.2 Màu nào phù hợp? Dùng bảng „Farbe“ (màu) trong phần đọc thêm.','4.2 ¿Qué color encaja? Usa la tabla «Farbe» (color) de la lectura.','4.2 Que cor combina? Usa a tabela «Farbe» (cor) da leitura.','4.2 Який колір підходить? Скористайся таблицею «Farbe» (колір) у тексті.','4.2 ኣየናይ ሕብሪ ይሰማማዕ? ነቲ ሰንጠረዥ «Farbe» ተጠቐም።','4.2 Какой цвет подходит? Используй таблицу «Farbe» (цвет) в тексте.','4.2 أي لون يناسب؟ استخدم جدول «Farbe» (اللون) في القراءة.','4.2 Hangi renk uygun? Okuma bölümündeki «Farbe» (renk) tablosunu kullan.'],
'a5.h':['Bài tập có hướng dẫn: Cái gì sai ở đây?','Ejercicio guiado: ¿Qué falla aquí?','Exercício guiado: O que está errado aqui?','Керована вправа: що тут не так?','ምምሕዳር ልምምድ: ኣብዚ እንታይ ጌጋ ኣሎ?','Упражнение с подсказкой: что здесь не так?','تمرين موجَّه: ما الخطأ هنا؟','Rehberli alıştırma: Burada ne yanlış?'],
'a5.i':['Mô tả lỗi và đưa ra đề xuất cải thiện.','Describe el error y haz una propuesta de mejora.','Descreve o erro e faz uma proposta de melhoria.','Опиши помилку й запропонуй, як покращити.','ጌጋ ግለጽ፣ ምሕሻል ሓሳብ ድማ ሃብ።','Опиши ошибку и предложи улучшение.','صف الخطأ واقترح تحسينًا.','Hatayı anlat ve bir iyileştirme önerisi yap.'],
'a5.t':['Tự hỏi: Có hợp với hàng hóa và nhóm khách không? Điều gì làm khách khó chịu?','Pregúntate: ¿encaja con la mercancía y el grupo objetivo? ¿Qué molestaría al cliente?','Pergunta-te: combina com a mercadoria e o público-alvo? O que incomodaria o cliente?','Запитай себе: чи це пасує товару й цільовій групі? Що завадило б клієнту?','ባዕልኻ ሕተት: ምስ ኣቕሑትን ዓሚላትን ይሰማማዕ ዶ? ንዓሚል እንታይ የጸግሞ?','Спроси себя: подходит ли это товару и целевой группе? Что помешало бы клиенту?','اسأل نفسك: هل يناسب البضاعة والفئة؟ ما الذي يزعج الزبون؟','Kendine sor: Ürüne ve hedef kitleye uyuyor mu? Müşteriyi ne rahatsız eder?'],
'a5.e':['Lỗi và cách cải thiện luôn đi cùng nhau: Cái gì sai? Làm tốt hơn thế nào?','Error y mejora van juntos: ¿qué está mal? ¿Cómo se hace mejor?','Erro e melhoria andam juntos: o que está mal? Como se faz melhor?','Помилка й покращення завжди разом: що не так? Як зробити краще?','ጌጋን ምሕሻልን ሓቢሮም ይኸዱ: እንታይ ጌጋ? ከመይ ይሕሸ?','Ошибка и улучшение всегда вместе: что не так? Как сделать лучше?','الخطأ والتحسين معًا دائمًا: ما الخطأ؟ كيف نحسّنه؟','Hata ve iyileştirme birlikte yazılır: Ne yanlış? Nasıl daha iyi olur?'],
'a6.h':['Bài tập tự do: Lập kế hoạch một bức tường hàng với cả năm giác quan (5 điểm)','Ejercicio libre: planificar una pared de mercancías con los cinco sentidos (5 puntos)','Exercício livre: planear uma parede de mercadoria com os cinco sentidos (5 pontos)','Вільна вправа: сплануй товарну стіну для всіх п’яти органів чуття (5 балів)','ናጻ ልምምድ: ግድግዳ ኣቕሑት ብሓሙሽተ ስምዒታት ምዕላል (5 ነጥቢ)','Свободное упражнение: спланируй товарную стену для всех пяти органов чувств (5 баллов)','تمرين حر: خطّط لجدار بضائع يخاطب الحواس الخمس (5 نقاط)','Serbest alıştırma: Beş duyuya hitap eden bir ürün duvarı planla (5 puan)'],
'a6.i':['Chọn một mặt hàng ở nơi em học nghề (hoặc: ván trượt tuyết, Arbeitsheft tr. 159). Lập kế hoạch một bức tường hàng hoặc khu khuyến mãi tác động đến cả năm giác quan. Với mỗi giác quan, viết một biện pháp và tác dụng.','Elige una mercancía de tu empresa (o: tablas de snowboard, Arbeitsheft p. 159). Planifica una pared de mercancías o zona de acción que estimule los cinco sentidos. Escribe para cada sentido una medida y su efecto.','Escolhe uma mercadoria da tua empresa (ou: pranchas de snowboard, Arbeitsheft p. 159). Planeia uma parede de mercadoria ou zona de ação que estimule os cinco sentidos. Escreve para cada sentido uma medida e o seu efeito.','Обери товар зі свого підприємства (або: сноуборди, Arbeitsheft с. 159). Сплануй товарну стіну чи акційну зону для всіх п’яти органів чуття. До кожного органа чуття запиши захід і його дію.','ካብ ቦታ ልምምድካ ሓደ ኣቕሓ ምረጽ (ወይ: ስኖውቦርድ፣ Arbeitsheft ገጽ 159)። ሓሙሽተ ስምዒታት ዝሰርሕ ግድግዳ ኣቕሑት ዕላል። ንነፍሲ ወከፍ ስምዒት ሓደ ተግባርን ጽልዋኡን ጽሓፍ።','Выбери товар из своего предприятия (или: сноуборды, Arbeitsheft с. 159). Спланируй товарную стену или акционную зону для всех пяти органов чувств. К каждому чувству запиши меру и её действие.','اختر سلعة من شركة تدريبك (أو: ألواح تزلج، Arbeitsheft ص. 159). خطّط لجدار بضائع أو منطقة عروض تخاطب الحواس الخمس. اكتب لكل حاسة إجراءً وتأثيره.','Eğitim işletmenden bir ürün seç (veya: snowboard, Arbeitsheft s. 159). Beş duyuya hitap eden bir ürün duvarı veya aksiyon alanı planla. Her duyu için bir önlem ve etkisini yaz.'],
'a6.t':['Lần lượt đi qua năm giác quan: nhìn (ánh sáng, màu, trang trí), nghe, ngửi, nếm, chạm.','Recorre los cinco sentidos en orden: ver (luz, color, decoración), oír, oler, probar, tocar.','Percorre os cinco sentidos por ordem: ver (luz, cor, decoração), ouvir, cheirar, provar, tocar.','Пройди всі п’ять органів чуття по черзі: зір (світло, колір, декор), слух, нюх, смак, дотик.','ሓሙሽተ ስምዒታት ብተኸተልቲ ሕለፍ: ምርኣይ (ብርሃን፣ ሕብሪ፣ ድኮር)፣ ምስማዕ፣ ምጥሓን፣ ምጥዓም፣ ምትንካፍ።','Пройди все пять органов чувств по порядку: зрение (свет, цвет, декор), слух, обоняние, вкус, осязание.','مرّ على الحواس الخمس بالترتيب: البصر (ضوء، لون، ديكور)، السمع، الشم، التذوق، اللمس.','Beş duyuyu sırayla düşün: görme (ışık, renk, dekor), duyma, koklama, tatma, dokunma.'],
'a6.e':['Mỗi giác quan một biện pháp phù hợp kèm tác dụng (mỗi cái 1 điểm; „nhìn“ chỉ tính một lần).','Para cada sentido una medida adecuada con su efecto (1 punto cada una; «ver» cuenta una vez).','Para cada sentido uma medida adequada com o efeito (1 ponto cada; «ver» conta uma vez).','Для кожного органа чуття — доречний захід із дією (по 1 балу; «зір» рахується один раз).','ንነፍሲ ወከፍ ስምዒት ዝግባእ ተግባርን ጽልዋኡን (ነፍሲ ወከፍ 1 ነጥቢ፤ ምርኣይ ሓንሳብ ይቑጸር)።','Для каждого чувства — подходящая мера с действием (по 1 баллу; «зрение» считается один раз).','لكل حاسة إجراء مناسب مع تأثيره (نقطة لكل واحدة؛ «البصر» يُحسب مرة واحدة).','Her duyu için uygun bir önlem ve etkisi (her biri 1 puan; «görme» bir kez sayılır).'],
'a7.t':['Erläutern (giải thích) = gọi tên một yếu tố VÀ giải thích tác dụng. Nennen (kể tên) = giác quan và mỗi cái một ví dụ.','Erläutern (explicar) = nombrar un elemento Y explicar cómo actúa. Nennen (nombrar) = sentido y un ejemplo cada uno.','Erläutern (explicar) = nomear um elemento E explicar como atua. Nennen (nomear) = sentido e um exemplo cada.','Erläutern (пояснити) = назвати елемент І пояснити, як він діє. Nennen (назвати) = орган чуття й по одному прикладу.','Erläutern (ምግላጽ) = ሓደ ኣካል ጥቀስን ከመይ ከም ዝሰርሕ ግለጽን። Nennen (ምጥቃስ) = ስምዒትን ነናይ ሓደ ኣብነትን።','Erläutern (объяснить) = назвать элемент И объяснить его действие. Nennen (назвать) = орган чувств и по одному примеру.','Erläutern (اشرح) = اذكر عنصرًا واشرح تأثيره. Nennen (اذكر) = الحاسة ومثال لكل منها.','Erläutern (açıkla) = bir öğeyi söyle VE etkisini açıkla. Nennen (say) = duyu ve her biri için bir örnek.'],
'a7.e':['Với „erläutern“, tên luôn đi kèm lời giải thích. Với các giác quan, có điểm cho giác quan và cho ví dụ.','En «erläutern» siempre va el nombre con su explicación. En los sentidos hay puntos por el sentido y por el ejemplo.','Em «erläutern» o nome vem sempre com a explicação. Nos sentidos há pontos pelo sentido e pelo exemplo.','При «erläutern» до назви завжди додається пояснення. За органи чуття є бали за чуття й за приклад.','ኣብ «erläutern» ሽም ሁሌ ምስ መግለጺ። ኣብ ስምዒታት ንስምዒትን ንኣብነትን ነጥቢ ኣለዎ።','При «erläutern» к названию всегда добавляется объяснение. За органы чувств есть баллы за чувство и за пример.','في «erläutern» يرافق الاسمَ دائمًا الشرحُ. في الحواس نقاط للحاسة وللمثال.','«erläutern»’de ad her zaman açıklamayla birlikte yazılır. Duyularda hem duyu hem örnek için puan var.'],
'a7.1.q':['7.1 Giải thích hai yếu tố thiết kế giúp khu vực thúc đẩy bán hàng. (4 điểm)','7.1 Explique dos elementos de diseño que fomentan las ventas de la sección. (4 puntos)','7.1 Explica dois elementos de design que promovem as vendas da secção. (4 pontos)','7.1 Поясни два елементи оформлення, що сприяють продажам відділу. (4 бали)','7.1 ክልተ ዲዛይን ኣካላት ሽያጥ ዘደሃሱ ግለጽ። (4 ነጥቢ)','7.1 Объясни два элемента оформления, способствующих продажам отдела. (4 балла)','7.1 اشرح عنصرين من عناصر التصميم يعززان مبيعات القسم. (4 نقاط)','7.1 Bölümün satışını artıran iki tasarım öğesini açıkla. (4 puan)'],
'a7.2.q':['7.2 Kể ba giác quan có thể tác động trong khu vực và mỗi giác quan một ví dụ. (6 điểm)','7.2 Nombra tres sentidos que se pueden estimular en la sección y un ejemplo de cada uno. (6 puntos)','7.2 Nomeia três sentidos que podem ser estimulados na secção e um exemplo de cada. (6 pontos)','7.2 Назви три органи чуття, які можна задіяти у відділі, і по одному прикладу. (6 балів)','7.2 ሰለስተ ኣብ ክፍሊ ዝሰርሑ ስምዒታትን ነናይ ሓደ ኣብነትን ጥቀስ። (6 ነጥቢ)','7.2 Назови три органа чувств, которые можно задействовать в отделе, и по одному примеру. (6 баллов)','7.2 اذكر ثلاث حواس يمكن مخاطبتها في القسم ومثالًا لكل منها. (6 نقاط)','7.2 Bölümde hitap edilebilecek üç duyuyu ve her biri için bir örnek say. (6 puan)'],
'a8.t':['Luôn nhìn cả hai phía: Người bán nói gì? Khách hàng nói gì? Rồi mới quyết định.','Mira siempre ambos lados: ¿qué dice el comerciante? ¿Qué dicen los clientes? Luego decide.','Olha sempre para os dois lados: o que diz o comerciante? O que dizem os clientes? Depois decide.','Завжди дивись з обох сторін: що каже торговець? Що кажуть клієнти? Потім вирішуй.','ኩሉ ግዜ ክልቲኦም ወገናት ርአ: ነጋዳይ እንታይ ይብል? ዓሚላት እንታይ ይብሉ? ድሕሪኡ ወስን።','Всегда смотри с обеих сторон: что говорит торговец? Что говорят клиенты? Потом реши.','انظر دائمًا إلى الجانبين: ماذا يقول التاجر؟ ماذا يقول الزبائن؟ ثم قرّر.','Her zaman iki tarafa bak: Satıcı ne der? Müşteriler ne der? Sonra karar ver.'],
'a8.e':['Một nhận định tốt nêu cả hai quan điểm và giải thích quyết định.','Un buen juicio nombra ambos puntos de vista y justifica la decisión.','Um bom juízo nomeia os dois pontos de vista e justifica a decisão.','Хороша оцінка називає обидві точки зору й обґрунтовує рішення.','ጽቡቕ ፍርዲ ክልቲኡ ሓሳብ ይጥቅስን ውሳኔ ከኣ የረጋግጽን።','Хорошая оценка называет обе точки зрения и обосновывает решение.','الحكم الجيد يذكر وجهتي النظر ويعلّل القرار.','İyi bir değerlendirme her iki bakış açısını söyler ve kararı gerekçelendirir.'],
'a8.1.q':['8.1 Một số người bán dùng Duftmarketing (tiếp thị bằng mùi hương) để khách ở lâu và mua nhiều hơn. Đánh giá: đó có phải là tác động không được phép đến khách không? Xét quan điểm của người bán và khách hàng.','8.1 Algunos comerciantes usan Duftmarketing (marketing olfativo) para que los clientes se queden más y compren más. Valora si es una influencia inadmisible. Considera la perspectiva del comerciante y de los clientes.','8.1 Alguns comerciantes usam Duftmarketing (marketing olfativo) para que os clientes fiquem mais tempo e comprem mais. Avalia se é uma influência inadmissível. Considera a perspetiva do comerciante e dos clientes.','8.1 Деякі торговці використовують Duftmarketing (ароматичний маркетинг), щоб клієнти довше затримувались і більше купували. Оціни, чи це недозволений вплив. Врахуй погляд торговця й клієнтів.','8.1 ገለ ነጋዶ Duftmarketing (ማርኬቲንግ ብጨና) ዓሚላት ንነዊሕ ክጸንሑን ብዙሕ ክገዝኡን ይጥቀሙ። እዚ ዘይፍቱው ጽልዋ ድዩ ገምግም። ጠመተ ነጋዳይን ዓሚላትን ሕሰብ።','8.1 Некоторые торговцы используют Duftmarketing (ароматический маркетинг), чтобы клиенты дольше оставались и больше покупали. Оцени, недопустимое ли это воздействие. Учти взгляд торговца и клиентов.','8.1 يستخدم بعض التجار Duftmarketing (التسويق بالروائح) ليبقى الزبائن أطول ويشتروا أكثر. قيّم: هل هذا تأثير غير مقبول؟ راعِ وجهة نظر التاجر والزبائن.','8.1 Bazı satıcılar müşteriler daha uzun kalsın ve daha çok alsın diye Duftmarketing (koku pazarlaması) kullanır. Bunun izin verilmeyen bir etkileme olup olmadığını değerlendir. Satıcının ve müşterilerin bakışını düşün.'],
'a8.2.q':['8.2 Một số siêu thị có „stille Stunde“ (giờ yên tĩnh): đèn mờ, không nhạc, không thông báo. Giải thích dành cho khách nào và đánh giá xem có trái với ý tưởng Visual Merchandising không.','8.2 Algunos supermercados ofrecen una «stille Stunde» (hora tranquila): luz tenue, sin música, sin avisos. Explica para qué clientes es y valora si contradice la idea del Visual Merchandising.','8.2 Alguns supermercados oferecem uma «stille Stunde» (hora tranquila): luz suave, sem música, sem avisos. Explica para que clientes é e avalia se contradiz a ideia do Visual Merchandising.','8.2 Деякі супермаркети пропонують «stille Stunde» (тиху годину): приглушене світло, без музики й оголошень. Поясни, для яких клієнтів це, і оціни, чи суперечить це ідеї Visual Merchandising.','8.2 ገለ ሱፐርማርኬት «stille Stunde» (ሰዓት ህድኣት) የቕርቡ: ዝተጸለለ ብርሃን፣ ሙዚቃ የለን፣ ምልክታ የለን። ን ኣየኖት ዓሚላት ከም ዝኾነ ግለጽ፣ ምስ ሓሳብ Visual Merchandising ይጋጮ ዶ ገምግም።','8.2 Некоторые супермаркеты предлагают «stille Stunde» (тихий час): приглушённый свет, без музыки и объявлений. Объясни, для каких клиентов это, и оцени, противоречит ли это идее Visual Merchandising.','8.2 تقدّم بعض السوبرماركت «stille Stunde» (ساعة هادئة): إضاءة خافتة وبلا موسيقى وبلا إعلانات. اشرح لأي زبائن هي، وقيّم هل تتعارض مع فكرة Visual Merchandising.','8.2 Bazı marketler «stille Stunde» (sessiz saat) sunar: kısık ışık, müzik yok, anons yok. Bunun kimler için olduğunu açıkla ve Visual Merchandising fikrine aykırı olup olmadığını değerlendir.'],
'v1.1.q':['V1 Tại sao ánh sáng ở hàng may mặc (Textilien) phải trung thực với màu thật?','V1 ¿Por qué la luz en los Textilien (textiles) debe ser fiel al color natural?','V1 Porque é que a luz nos Textilien (têxteis) tem de ser fiel à cor natural?','V1 Чому світло для Textilien (текстилю) має бути природним?','V1 ስለምንታይ ብርሃን ኣብ Textilien (ጨርቂ) ተፈጥሮኣዊ ክኸውን ኣለዎ?','V1 Почему свет для Textilien (текстиля) должен быть естественным?','V1 لماذا يجب أن يكون الضوء عند Textilien (المنسوجات) طبيعيًّا؟','V1 Textilien (tekstil) için ışık neden doğal renkte olmalı?'],
'v1.2.q':['V2 Giải thích: Tại sao hàng đắt hợp với màu lạnh, còn hàng khuyến mãi hợp với màu nóng?','V2 Justifica: ¿por qué la mercancía cara pide colores fríos y las ofertas colores cálidos?','V2 Justifica: porque é que a mercadoria cara pede cores frias e as promoções cores quentes?','V2 Обґрунтуй: чому для дорогого товару підходять холодні кольори, а для акцій — теплі?','V2 ኣረጋግጽ: ስለምንታይ ንኣቕሑት ክቡር ዝሑል ሕብርታት፣ ንፍሉይ ቅናሽ ድማ ዝሙቑ ሕብርታት ይሰማምዑ?','V2 Обоснуй: почему для дорогого товара подходят холодные цвета, а для акций — тёплые?','V2 علّل: لماذا تناسب الألوان الباردة البضائع الغالية والألوان الدافئة العروض؟','V2 Gerekçelendir: Pahalı ürünlerde neden soğuk renkler, kampanyalarda sıcak renkler uygundur?'],

 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});
 return h}
function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';
 SHEET.blocks.forEach(function(b){if(b.k==='read')h+=renderRead(b);else if(vis(b))h+=renderTask(b)});
 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';
 if(S.sub)h+=renderResult();
 document.getElementById('app').innerHTML=h;
 document.getElementById('report').innerHTML=renderReport();
 renderBar();updProg();pad();
 window.scrollTo(0,y)}
function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');
 document.documentElement.lang=S.lang;
 }
function pad(){var m=document.querySelector('main'),b=document.getElementById('bar');if(m&&b)m.style.paddingTop=(b.offsetHeight+14)+'px'}
window.addEventListener('resize',pad);
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function dialog(msgKey,onYes){var d=document.createElement('div');d.className='dlg';d.innerHTML='<div><p><b>'+esc(UI[msgKey][0])+'</b></p>'+(S.lang!=='de'?'<p>'+esc(U(msgKey))+'</p>':'')+'<button class="btn" data-d="y">'+B('yes')+'</button><button class="btn gray" data-d="n">'+B('cancel')+'</button></div>';d.addEventListener('click',function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-d');if(!x&&e.target!==d&&!e.target.closest('[data-d]'))return;var dd=e.target.closest('[data-d]');if(dd&&dd.getAttribute('data-d')==='y')onYes();d.remove()});document.body.appendChild(d)}
function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});
document.getElementById('gear').addEventListener('click',function(){S.open=!S.open;save();renderBar()});
document.addEventListener('change',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act');if(act==='gap'||act==='sel'){var arr=S.a[el.getAttribute('data-id')]||[];var v=el.value;arr[Number(el.getAttribute('data-r'))]=act==='sel'?(v===''?null:Number(v)):(v===''?null:v);S.a[el.getAttribute('data-id')]=arr;save();updProg()}});
document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
document.addEventListener('visibilitychange',saveNow);window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',function(){document.getElementById('report').innerHTML=renderReport()});
/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;
render();
if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};
window.__state=function(){return S};
})();
