còn nhớ được gì.","tr":"Soruları ezberden cevapla. Bakma. Önemli olan aklında ne kaldığı.","ar":"أجب عن الأسئلة من الذاكرة. لا تبحث في الكتب. المهم هو ما بقي في ذهنك.","ti":"ነቶም ሕቶታት ካብ ኣእምሮኻ መልሲ። ኣይትረአ። እቲ ኣገዳሲ እንታይ ኣብ ኣእምሮኻ ተሪፉ እዩ።","uk":"Відповідай на запитання по пам'яті. Не підглядай. Важливо, що в тебе залишилося в голові.","ru":"Отвечай на вопросы по памяти. Не подглядывай. Важно, что у тебя осталось в голове.","es":"Responde las preguntas de memoria. No mires los apuntes. Lo importante es qué te ha quedado.","pt":"Responde às perguntas de memória. Não consultes nada. O importante é o que ficou na tua cabeça."},"tip":{"de":"Denke an Modul 9 (Verpackung) und an LF 2 und LF 4. Stichworte genügen.","vi":"Hãy nhớ lại Modul 9 (bao bì), LF 2 và LF 4. Chỉ cần từ khóa.","tr":"Modul 9'u (Verpackung = ambalaj), LF 2'yi ve LF 4'ü hatırla. Anahtar kelimeler yeterli.","ar":"تذكّر Modul 9 (التغليف، Verpackung) و LF 2 و LF 4. تكفي الكلمات المفتاحية.","ti":"ኣብ Modul 9 (Verpackung = ማሸግ)፣ LF 2 ከምኡውን LF 4 ሕሰብ። ቀንዲ ቃላት ይኣክል።","uk":"Згадай Modul 9 (Verpackung = пакування), LF 2 і LF 4. Досить ключових слів.","ru":"Вспомни Modul 9 (Verpackung = упаковка), LF 2 и LF 4. Достаточно ключевых слов.","es":"Piensa en el Modul 9 (Verpackung = embalaje), en LF 2 y en LF 4. Bastan palabras clave.","pt":"Pensa no Modul 9 (Verpackung = embalagem), no LF 2 e no LF 4. Bastam palavras-chave."},"parts":[{"q":"1. Nenne zwei der fünf Aufgaben der Verpackung.","m":"Zwei aus: Schutz der Waren, Informationen über die Ware, Erleichterung des Gebrauchs, Serviceaufgaben, Werbemittel."},{"q":"2. Was ist eine Transportverpackung?","m":"Sie schützt die Ware auf dem Weg vom Hersteller bzw. Großhändler zum Einzelhändler und fällt beim Hersteller an."},{"q":"3. Was ist das Ziel des Verpackungsgesetzes?","m":"Weniger Verpackungsmüll und wesentlich mehr Recycling von Abfällen aus privaten Haushalten."},{"q":"4. Wie nennt man es, wenn der Preis zwischen zwei Vorteilen genannt wird? (aus LF 2)","m":"Sandwich-Methode."},{"q":"5. Welche Regalzonen verkaufen am besten? (aus LF 4)","m":"Sichtzone (Augenhöhe) und Greifzone."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)","tr":"Wortspeicher (kelime deposu)","ar":"Wortspeicher (مخزن الكلمات)","ti":"Wortspeicher (መኽዘን ቃላት)","uk":"Wortspeicher (словничок)","ru":"Wortspeicher (словарик)","es":"Wortspeicher (banco de palabras)","pt":"Wortspeicher (banco de palavras)"},"html":"<p>Warenzustellung · firmeneigen · firmenfremd · Versandabteilung · Tourenplanung · Zustellkosten · Pauschale · Lieferschein · Inkassovollmacht · Gefahrübergang · Frachtführer · Frachtvertrag · Spediteur · Speditionsvertrag · Beförderungspflicht · Kontrahierungszwang · Güterkraftverkehr · Paketdienst<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"Warenzustellung = giao hàng · firmeneigen = của chính cửa hàng · firmenfremd = của bên ngoài · Tourenplanung = lập kế hoạch tuyến giao hàng · Zustellkosten = phí giao hàng · Pauschale = phí trọn gói · Lieferschein = phiếu giao hàng · Inkassovollmacht = quyền thu tiền · Gefahrübergang = chuyển giao rủi ro · Frachtführer = người vận chuyển · Spediteur = người tổ chức vận chuyển (công ty giao nhận) · Beförderungspflicht/Kontrahierungszwang = nghĩa vụ phải vận chuyển · Güterkraftverkehr = vận tải hàng hóa bằng xe · Paketdienst = dịch vụ chuyển phát bưu kiện","sum":{"tr":"Warenzustellung = mal teslimatı · firmeneigen = işletmenin kendisine ait · firmenfremd = dışarıdan · Tourenplanung = güzergâh planlaması · Zustellkosten = teslimat maliyeti · Pauschale = sabit ücret · Lieferschein = irsaliye · Inkassovollmacht = tahsilat yetkisi · Gefahrübergang = riziko geçişi · Frachtführer = taşıyıcı · Spediteur = nakliye organizatörü (spedisyon firması) · Beförderungspflicht/Kontrahierungszwang = taşıma zorunluluğu · Güterkraftverkehr = karayolu yük taşımacılığı · Paketdienst = kargo şirketi","ar":"Warenzustellung = توصيل البضائع · firmeneigen = خاص بالشركة · firmenfremd = تابع لجهة خارجية · Tourenplanung = تخطيط جولات التوصيل · Zustellkosten = تكاليف التوصيل · Pauschale = أجرة ثابتة · Lieferschein = إشعار التسليم · Inkassovollmacht = تفويض بالتحصيل · Gefahrübergang = انتقال الخطر · Frachtführer = الناقل · Spediteur = المُنظِّم اللوجستي (شركة الشحن والتخليص) · Beförderungspflicht/Kontrahierungszwang = الالتزام بالنقل · Güterkraftverkehr = نقل البضائع بالشاحنات · Paketdienst = خدمة الطرود","ti":"Warenzustellung = ምብጻሕ ዕቃ · firmeneigen = ናይ ድኳን ባዕሉ · firmenfremd = ካብ ደገ ዝመጽእ · Tourenplanung = መደብ መንገዲ ምብጻሕ · Zustellkosten = ወጻኢ ምብጻሕ · Pauschale = ቀዋሚ ክፍሊት · Lieferschein = ወረቐት ምብጻሕ ዕቃ · Inkassovollmacht = ሓይሊ ምእካብ ገንዘብ · Gefahrübergang = ምስጋገር ሓደጋ · Frachtführer = ኣጻዋዒ · Spediteur = ኣዳላዊ ማጓዓዚ · Beförderungspflicht/Kontrahierungszwang = ግዴታ ምጽዋዕ · Güterkraftverkehr = ጽዕነት ብመኪና · Paketdienst = ኣገልግሎት ፓኬት","uk":"Warenzustellung = доставка товарів · firmeneigen = власний (фірми) · firmenfremd = сторонній · Tourenplanung = планування маршрутів доставки · Zustellkosten = витрати на доставку · Pauschale = фіксована плата · Lieferschein = накладна · Inkassovollmacht = право отримувати гроші · Gefahrübergang = перехід ризику · Frachtführer = перевізник · Spediteur = експедитор (транспортно-експедиційна компанія) · Beförderungspflicht/Kontrahierungszwang = обов'язок перевозити · Güterkraftverkehr = вантажні автоперевезення · Paketdienst = служба доставки посилок","ru":"Warenzustellung = доставка товаров · firmeneigen = собственный (фирмы) · firmenfremd = сторонний · Tourenplanung = планирование маршрутов доставки · Zustellkosten = расходы на доставку · Pauschale = фиксированная плата · Lieferschein = накладная · Inkassovollmacht = право получать деньги · Gefahrübergang = переход риска · Frachtführer = перевозчик · Spediteur = экспедитор (транспортно-экспедиционная компания) · Beförderungspflicht/Kontrahierungszwang = обязанность перевозить · Güterkraftverkehr = грузовые автоперевозки · Paketdienst = служба доставки посылок","es":"Warenzustellung = reparto de mercancías · firmeneigen = propio de la empresa · firmenfremd = de una empresa externa · Tourenplanung = planificación de rutas de reparto · Zustellkosten = costes de entrega · Pauschale = tarifa fija · Lieferschein = albarán de entrega · Inkassovollmacht = poder de cobro · Gefahrübergang = traspaso del riesgo · Frachtführer = transportista · Spediteur = agente de transporte (empresa de expedición) · Beförderungspflicht/Kontrahierungszwang = obligación de transportar · Güterkraftverkehr = transporte de mercancías por carretera · Paketdienst = servicio de paquetería","pt":"Warenzustellung = entrega de mercadorias · firmeneigen = da própria empresa · firmenfremd = de uma empresa externa · Tourenplanung = planeamento das rotas de entrega · Zustellkosten = custos de entrega · Pauschale = taxa fixa · Lieferschein = guia de entrega · Inkassovollmacht = poder de cobrança · Gefahrübergang = transferência do risco · Frachtführer = transportador · Spediteur = transitário (empresa de expedição) · Beförderungspflicht/Kontrahierungszwang = obrigação de transportar · Güterkraftverkehr = transporte rodoviário de mercadorias · Paketdienst = serviço de encomendas"}},{"id":"r1","no":"Lesen 1","type":"read","title":"Firmeneigene Warenzustellung","instr":{"de":"Lies den Text. Tippe an: Was gehört zur firmeneigenen Zustellung?","vi":"Em đọc đoạn văn. Chạm vào: điều gì thuộc về firmeneigene Zustellung?","tr":"Metni oku. Dokun: Hangisi firmeneigene Zustellung'a (firmanın kendi teslimatı) aittir?","ar":"اقرأ النص. المس: ما الذي يتبع التوصيل الخاص بالشركة (firmeneigene Zustellung)؟","ti":"እቲ ጽሑፍ ኣንብብ። ንካዕ: እንታይ እዩ ናይ firmeneigene Zustellung (ናይ ባዕሉ ምብጽሓት) ዝኸውን?","uk":"Прочитай текст. Натисни: що належить до firmeneigene Zustellung (власної доставки)?","ru":"Прочитай текст. Нажми: что относится к firmeneigene Zustellung (собственной доставке)?","es":"Lee el texto. Toca: ¿Qué forma parte de la firmeneigene Zustellung (reparto propio)?","pt":"Lê o texto. Toca: o que faz parte da firmeneigene Zustellung (entrega própria)?"},"tip":{"de":"Suche die eigenen Mittel des Betriebs und die zusätzlichen Leistungen.","vi":"Tìm những phương tiện riêng của cửa hàng và các dịch vụ thêm.","tr":"İşletmenin kendi araçlarını ve ek hizmetleri bul.","ar":"ابحث عن وسائل المحل الخاصة والخدمات الإضافية.","ti":"ናይ ድኳን ናቱ ዝዀነ መሳለጢታትን ተወሳኺ ኣገልግሎታትን ድለይ።","uk":"Знайди власні засоби підприємства та додаткові послуги.","ru":"Найди собственные средства предприятия и дополнительные услуги.","es":"Busca los medios propios de la empresa y los servicios adicionales.","pt":"Procura os meios próprios da empresa e os serviços adicionais."},"paras":["Warenhäuser, Möbel- oder Elektrogeschäfte unterhalten oft eine eigene [[Versandabteilung]] mit betriebseigenen [[Fahrzeugen]]. Sie übernehmen neben dem Transport weitere [[Serviceleistungen]], zum Beispiel das Aufstellen der Möbel. Große Geschäfte fahren nach einem festen Fahrplan bestimmte Routen ab. Das nennt man [[Tourenplanung]]."],"vi":"Tóm tắt: Nhiều cửa hàng lớn có bộ phận giao hàng riêng với xe riêng, kèm dịch vụ như lắp đặt đồ nội thất. Tourenplanung = lập kế hoạch các tuyến giao hàng cố định.","quiz":{"q":"Was bedeutet Tourenplanung?","o":["Das Abfahren bestimmter Routen nach festem Fahrplan","Das Einkaufen auf einer Messe","Das Packen von Paketen"],"a":0,"why":{"de":"Tourenplanung heißt: feste Routen nach einem Fahrplan.","vi":"Tourenplanung nghĩa là: các tuyến cố định theo lịch.","tr":"Tourenplanung (güzergâh planlaması) şu demek: Sefer tarifesine göre sabit güzergâhlar.","ar":"Tourenplanung (تخطيط الجولات) تعني: مسارات ثابتة حسب جدول زمني.","ti":"Tourenplanung (መደብ መንገዲ) ማለት: ብመርሓ ግብሪ ዘለዉ ቀዋሚ መንገድታት።","uk":"Tourenplanung (планування маршрутів) означає: постійні маршрути за розкладом.","ru":"Tourenplanung (планирование маршрутов) означает: постоянные маршруты по расписанию.","es":"Tourenplanung (planificación de rutas) significa: rutas fijas según un horario.","pt":"Tourenplanung (planeamento de rotas) significa: rotas fixas segundo um horário."}},"sum":{"tr":"Özet: Birçok büyük mağazanın kendi araçlarıyla çalışan kendi sevkiyat bölümü (Versandabteilung) vardır ve mobilya kurulumu gibi hizmetler de sunar. Tourenplanung = sabit teslimat güzergâhlarının planlanması.","ar":"ملخص: لدى كثير من المحلات الكبيرة قسم توصيل خاص بسيارات خاصة، ويقدّم خدمات مثل تركيب الأثاث. Tourenplanung = تخطيط مسارات توصيل ثابتة.","ti":"ማጠቃለሊ: ብዙሓት ዓበይቲ ድኳናት ብናይ ባዕሎም መኪናታት ዝሰርሕ ናይ ባዕሎም ክፍሊ ምልኣኽ ኣለዎም፣ ከምኡውን ከም ምትካል ናይ ዕቃ ገዛ ዝኣመሰሉ ኣገልግሎታት ይህቡ። Tourenplanung = ምውጻእ መደብ ቀዋሚ መንገድታት ምብጻሕ።","uk":"Підсумок: Багато великих магазинів мають власний відділ доставки зі своїми автомобілями та пропонують такі послуги, як збирання меблів. Tourenplanung = планування постійних маршрутів доставки.","ru":"Кратко: У многих крупных магазинов есть собственный отдел доставки со своими машинами; они предлагают такие услуги, как сборка мебели. Tourenplanung = планирование постоянных маршрутов доставки.","es":"Resumen: Muchas tiendas grandes tienen un departamento de envíos propio con vehículos propios y ofrecen servicios como el montaje de muebles. Tourenplanung = planificación de rutas de reparto fijas.","pt":"Resumo: Muitas lojas grandes têm um departamento de expedição próprio, com viaturas próprias, e oferecem serviços como a montagem de móveis. Tourenplanung = planeamento de rotas de entrega fixas."}},{"id":"w2","type":"info","title":{"de":"Eigene Zustellung: Vorteile und Nachteile, drei Begriffe","vi":"Tự giao hàng: ưu, nhược điểm, ba khái niệm","tr":"Kendi teslimatı: avantajlar ve dezavantajlar, üç kavram","ar":"التوصيل الخاص: المزايا والعيوب، ثلاثة مصطلحات","ti":"ናይ ባዕሉ ምብጽሓት: ጥቕምታትን ጉድለታትን፣ ሰለስተ ሓሳባት","uk":"Власна доставка: плюси й мінуси, три поняття","ru":"Собственная доставка: плюсы и минусы, три понятия","es":"Reparto propio: ventajas y desventajas, tres conceptos","pt":"Entrega própria: vantagens e desvantagens, três conceitos"},"html":"<p><b>Drei Begriffe, die in der Prüfung auftauchen:<\/b><br><b>Lieferschein:<\/b> Mit der Unterschrift auf dem Durchschlag bestätigt der Kunde die ordnungsgemäße Zustellung.<br><b>Inkassovollmacht:<\/b> Hat der Auslieferungsfahrer sie, kassiert er den fälligen Rechnungsbetrag sofort.<br><b>Gefahrübergang:<\/b> Beim Verbrauchsgüterkauf geht die Gefahr erst über, wenn der Kunde die Kaufsache erhalten hat. Bis zur Übergabe haftet der Einzelhändler für Beschädigung und Verlust.<\/p><p><b>Vorteile:<\/b> zufriedene Kunden und mehr Kundentreue durch geschultes Personal · auswärtige Kunden können gewonnen werden · das Einzugsgebiet wird größer · Werbewirkung durch beschriftete Fahrzeuge · Serviceleistungen steigern den Umsatz.<br><b>Nachteile:<\/b> Die berechneten Zustellkosten decken die Kosten nur zum Teil · höheres Risiko (Haftung bis zur Übergabe) · hoher Kapitaleinsatz für den Fuhrpark.<\/p>","vi":"Lieferschein: khách ký xác nhận đã nhận hàng. Inkassovollmacht: tài xế được thu tiền ngay. Gefahrübergang: rủi ro chỉ chuyển sang khách khi khách đã nhận hàng; trước đó cửa hàng chịu trách nhiệm về hư hỏng, mất mát. Ưu điểm: khách hài lòng, mở rộng khu vực, xe có logo quảng cáo, tăng doanh thu. Nhược điểm: phí không đủ bù chi phí, rủi ro, vốn lớn cho đội xe.","sum":{"tr":"Lieferschein: Müşteri malı teslim aldığını imzayla onaylar. Inkassovollmacht: Sürücü parayı hemen tahsil edebilir. Gefahrübergang: Risk, müşteri malı teslim alınca müşteriye geçer; ondan önce hasar ve kayıptan işletme sorumludur. Avantajlar: memnun müşteri, daha geniş bölge, reklam yazılı araçlar, daha çok ciro. Dezavantajlar: ücret masrafları karşılamaz, risk, filo için yüksek sermaye.","ar":"Lieferschein: يوقّع الزبون لتأكيد استلام البضاعة. Inkassovollmacht: يستطيع السائق تحصيل المبلغ فورًا. Gefahrübergang: ينتقل الخطر إلى الزبون فقط عندما يستلم البضاعة؛ وقبل ذلك يتحمّل المحل مسؤولية التلف والضياع. المزايا: زبائن راضون، منطقة بيع أوسع، دعاية على السيارات، مبيعات أكثر. العيوب: الأجرة لا تغطي التكاليف، خطر أكبر، رأس مال كبير لأسطول السيارات.","ti":"Lieferschein: እቲ ዓሚል ብፊርማ ዕቃ ከም ዝተቐበለ የረጋግጽ። Inkassovollmacht: እቲ ሹፌር ገንዘብ ብቕጽበት ክእክብ ይኽእል። Gefahrübergang: ሓደጋ ናብ ዓሚል እቲ ዓሚል ዕቃ ምስ ተቐበለ ጥራይ ይሰጋገር፤ ቅድሚኡ እቲ ድኳን ንብልሽውናን ክስረትን ተሓታቲ እዩ። ጥቕምታት: ዕጉባት ዓማዊል፣ ሰፊሕ ከባቢ፣ ኣብ መኪናታት ዝተጻሕፈ መወዓውዒ፣ ዝበዝሐ መስተዋድዕ። ጉድለታት: እቲ ክፍሊት ወጻኢታት ኣይሽፍንን፣ ሓደጋ፣ ንጉጅለ መኪናታት ዓቢ ገንዘብ።","uk":"Lieferschein: клієнт підписом підтверджує, що отримав товар. Inkassovollmacht: водій може одразу отримати гроші. Gefahrübergang: ризик переходить до клієнта лише тоді, коли клієнт отримав товар; до цього магазин відповідає за пошкодження та втрату. Плюси: задоволені клієнти, більша територія, реклама на автомобілях, більше продажів. Мінуси: плата не покриває витрат, ризик, великі вкладення в автопарк.","ru":"Lieferschein: клиент подписью подтверждает, что получил товар. Inkassovollmacht: водитель может сразу получить деньги. Gefahrübergang: риск переходит к клиенту только тогда, когда клиент получил товар; до этого магазин отвечает за повреждение и потерю. Плюсы: довольные клиенты, больше территория, реклама на машинах, больше продаж. Минусы: плата не покрывает расходы, риск, большие вложения в автопарк.","es":"Lieferschein: el cliente firma para confirmar que ha recibido la mercancía. Inkassovollmacht: el conductor puede cobrar el dinero en el momento. Gefahrübergang: el riesgo pasa al cliente solo cuando este ha recibido la mercancía; hasta entonces la tienda responde de daños y pérdidas. Ventajas: clientes satisfechos, zona de venta más amplia, vehículos con publicidad, más ventas. Desventajas: la tarifa no cubre los costes, riesgo, mucho capital para la flota.","pt":"Lieferschein: o cliente assina para confirmar que recebeu a mercadoria. Inkassovollmacht: o condutor pode cobrar o dinheiro logo. Gefahrübergang: o risco só passa para o cliente quando este recebeu a mercadoria; até lá, a loja responde por danos e perdas. Vantagens: clientes satisfeitos, área de venda maior, viaturas com publicidade, mais vendas. Desvantagens: a taxa não cobre os custos, risco, muito capital para a frota."}},{"id":"m1","no":"Übung 1","type":"match","pts":0,"title":"Vorteil oder Nachteil?","instr":{"de":"Ordne jede Aussage zu: Vorteil oder Nachteil der firmeneigenen Zustellung.","vi":"Em xếp mỗi câu: ưu điểm hay nhược điểm của firmeneigene Zustellung.","tr":"Her ifadeyi eşleştir: firmeneigene Zustellung'un avantajı mı, dezavantajı mı?","ar":"صنّف كل جملة: هل هي ميزة أم عيب للتوصيل الخاص بالشركة (firmeneigene Zustellung)؟","ti":"ነንሕድሕድ ሓሳብ ኣዛምድ: ጥቕሚ ድዩ ጉድለት ናይ firmeneigene Zustellung?","uk":"Розподіли кожне твердження: плюс чи мінус firmeneigene Zustellung (власної доставки)?","ru":"Распредели каждое утверждение: плюс или минус firmeneigene Zustellung (собственной доставки)?","es":"Clasifica cada afirmación: ¿ventaja o desventaja de la firmeneigene Zustellung (reparto propio)?","pt":"Associa cada afirmação: vantagem ou desvantagem da firmeneigene Zustellung (entrega própria)?"},"tip":{"de":"Frage dich: Hilft es dem Geschäft oder kostet es das Geschäft?","vi":"Tự hỏi: nó giúp cửa hàng hay làm cửa hàng tốn kém?","tr":"Kendine sor: İşletmeye yardımcı oluyor mu, yoksa işletmeye maliyet mi getiriyor?","ar":"اسأل نفسك: هل يساعد المحل أم يكلّف المحل مالًا؟","ti":"ርእስኻ ሕተት: ንድኳን ይሕግዝ ድዩ ወይስ ገንዘብ የውጽኣሉ?","uk":"Запитай себе: це допомагає магазину чи коштує магазину грошей?","ru":"Спроси себя: это помогает магазину или обходится магазину дорого?","es":"Pregúntate: ¿ayuda al negocio o le cuesta dinero al negocio?","pt":"Pergunta a ti próprio: ajuda a loja ou custa dinheiro à loja?"},"rows":[{"l":"Beschriftete Fahrzeuge werben im Einzugsgebiet.","a":"Vorteil"},{"l":"Die Pauschale deckt die Kosten nur zum Teil.","a":"Nachteil"},{"l":"Auswärtige Kunden können gewonnen werden.","a":"Vorteil"},{"l":"Hoher Kapitaleinsatz für den Fuhrpark.","a":"Nachteil"},{"l":"Das Geschäft haftet bis zur Übergabe der Ware.","a":"Nachteil"},{"l":"Serviceleistungen wie das Aufstellen steigern den Umsatz.","a":"Vorteil"}]},{"id":"w3","type":"info","title":{"de":"Frachtführer, Spediteur und Anbieter","vi":"Frachtführer, Spediteur và các nhà cung cấp","tr":"Frachtführer (taşıyıcı), Spediteur (nakliye organizatörü) ve sağlayıcılar","ar":"الناقل (Frachtführer) والمُنظِّم اللوجستي (Spediteur) ومقدّمو الخدمة","ti":"Frachtführer (ኣጻዋዒ)፣ Spediteur (ኣዳላዊ ማጓዓዚ) ከምኡውን ኣቕራቢታት","uk":"Frachtführer (перевізник), Spediteur (експедитор) і постачальники послуг","ru":"Frachtführer (перевозчик), Spediteur (экспедитор) и поставщики услуг","es":"Frachtführer (transportista), Spediteur (agente de transporte) y proveedores","pt":"Frachtführer (transportador), Spediteur (transitário) e prestadores"},"html":"<p><b>Frachtführer:<\/b> selbstständige Kaufleute, die gewerbsmäßig Güter befördern. Vertrag: Frachtvertrag. Er befördert das Gut zum Bestimmungsort und liefert es dort dem Empfänger ab.<\/p><p><b>Spediteur:<\/b> selbstständige Kaufleute, die im eigenen Namen und für fremde Rechnung gewerbsmäßig Güterversendungen besorgen, zum Beispiel durch Frachtführer. Vertrag: Speditionsvertrag. Er wählt das günstigste Beförderungsmittel aus und vermittelt zwischen Versender und Frachtführer.<\/p><div class=\"box merke\"><b>Merke:<\/b> Der Frachtführer fährt selbst. Der Spediteur organisiert. Übernimmt der Spediteur den Transport selbst, tritt er zugleich als Frachtführer auf.<\/div><p><b>Anbieter:<\/b><br><b>Deutsche Bahn AG und Deutsche Post AG:<\/b> Beförderungspflicht (Kontrahierungszwang). Sie müssen alle Waren befördern, wenn die Beförderungsbestimmungen eingehalten werden.<br><b>Gewerblicher Güterkraftverkehr:<\/b> Beförderung mit Kraftfahrzeugen. Er ist erlaubnispflichtig.<br><b>Private Paketdienste:<\/b> holen Pakete werktags zu einer abgesprochenen Zeit ab. Sie dürfen Sendungen ablehnen, zum Beispiel wenn sie nicht gewinnbringend sind.<\/p><div class=\"box merke\"><b>Merke:<\/b> Bahn und Post müssen befördern. Private Paketdienste dürfen ablehnen.<\/div>","vi":"Frachtführer = tự vận chuyển (hợp đồng Frachtvertrag). Spediteur = tổ chức vận chuyển, chọn phương tiện rẻ nhất, thuê Frachtführer (hợp đồng Speditionsvertrag). Nhớ: Frachtführer lái xe; Spediteur tổ chức. Deutsche Bahn và Deutsche Post phải vận chuyển (Beförderungspflicht). Dịch vụ chuyển phát tư nhân được phép từ chối.","sum":{"tr":"Frachtführer = kendisi taşır (Frachtvertrag sözleşmesi). Spediteur = taşımayı organize eder, en ucuz aracı seçer, Frachtführer görevlendirir (Speditionsvertrag sözleşmesi). Unutma: Frachtführer sürer; Spediteur organize eder. Deutsche Bahn ve Deutsche Post taşımak zorundadır (Beförderungspflicht). Özel kargo şirketleri reddedebilir.","ar":"Frachtführer = ينقل بنفسه (عقد Frachtvertrag). Spediteur = ينظّم النقل، ويختار أرخص وسيلة، ويكلّف ناقلًا (عقد Speditionsvertrag). تذكّر: الناقل (Frachtführer) يقود؛ والمُنظِّم (Spediteur) ينظّم. Deutsche Bahn و Deutsche Post ملزمتان بالنقل (Beförderungspflicht). يحق لشركات الطرود الخاصة الرفض.","ti":"Frachtführer = ባዕሉ የጻዕር (ውዕል Frachtvertrag)። Spediteur = ማጓዓዚ የዳሊ፣ ዝረከሰ መንገዲ ይመርጽ፣ Frachtführer ይቆጽር (ውዕል Speditionsvertrag)። ኣስተውዕል: Frachtführer ይዝውር፤ Spediteur የዳሊ። Deutsche Bahn ን Deutsche Post ከጻዕዩ ግዴታ ኣለዎም (Beförderungspflicht)። ናይ ብሕቲ ናይ ፓኬት ኣገልግሎታት ክኽልክሉ ይኽእሉ።","uk":"Frachtführer = перевозить сам (договір Frachtvertrag). Spediteur = організовує перевезення, обирає найдешевший транспорт, наймає Frachtführer (договір Speditionsvertrag). Запам'ятай: Frachtführer їде; Spediteur організовує. Deutsche Bahn і Deutsche Post зобов'язані перевозити (Beförderungspflicht). Приватні служби доставки посилок можуть відмовити.","ru":"Frachtführer = перевозит сам (договор Frachtvertrag). Spediteur = организует перевозку, выбирает самый дешёвый транспорт, нанимает Frachtführer (договор Speditionsvertrag). Запомни: Frachtführer едет; Spediteur организует. Deutsche Bahn и Deutsche Post обязаны перевозить (Beförderungspflicht). Частные службы доставки посылок могут отказать.","es":"Frachtführer = transporta él mismo (contrato Frachtvertrag). Spediteur = organiza el transporte, elige el medio más barato y contrata a un Frachtführer (contrato Speditionsvertrag). Recuerda: el Frachtführer conduce; el Spediteur organiza. Deutsche Bahn y Deutsche Post están obligadas a transportar (Beförderungspflicht). Las empresas privadas de paquetería pueden rechazar envíos.","pt":"Frachtführer = transporta ele próprio (contrato Frachtvertrag). Spediteur = organiza o transporte, escolhe o meio mais barato e contrata um Frachtführer (contrato Speditionsvertrag). Lembra-te: o Frachtführer conduz; o Spediteur organiza. A Deutsche Bahn e a Deutsche Post são obrigadas a transportar (Beförderungspflicht). As empresas privadas de encomendas podem recusar."}},{"id":"m2","no":"Übung 2","type":"match","pts":0,"title":"Frachtführer oder Spediteur?","instr":{"de":"Ordne jede Aussage zu: Frachtführer oder Spediteur.","vi":"Em xếp mỗi câu: Frachtführer hay Spediteur.","tr":"Her ifadeyi eşleştir: Frachtführer mı, Spediteur mu?","ar":"صنّف كل جملة: ناقل (Frachtführer) أم منظِّم لوجستي (Spediteur)؟","ti":"ነንሕድሕድ ሓሳብ ኣዛምድ: Frachtführer ድዩ Spediteur?","uk":"Розподіли кожне твердження: Frachtführer чи Spediteur?","ru":"Распредели каждое утверждение: Frachtführer или Spediteur?","es":"Clasifica cada afirmación: ¿Frachtführer o Spediteur?","pt":"Associa cada afirmação: Frachtführer ou Spediteur?"},"tip":{"de":"Fährt er selbst oder organisiert er?","vi":"Anh ta tự lái xe hay chỉ tổ chức?","tr":"Kendisi mi sürüyor, yoksa organize mi ediyor?","ar":"هل يقود بنفسه أم ينظّم؟","ti":"ባዕሉ ይዝውር ድዩ ወይስ የዳሊ?","uk":"Він їде сам чи організовує?","ru":"Он сам едет или организует?","es":"¿Conduce él mismo u organiza?","pt":"Conduz ele próprio ou organiza?"},"rows":[{"l":"Schließt einen Frachtvertrag ab.","a":"Frachtführer"},{"l":"Wählt das günstigste Beförderungsmittel aus.","a":"Spediteur"},{"l":"Befördert das Gut selbst zum Bestimmungsort.","a":"Frachtführer"},{"l":"Vermittelt zwischen Versender und Frachtführer.","a":"Spediteur"},{"l":"Schließt einen Speditionsvertrag ab.","a":"Spediteur"}]},{"id":"t1","no":"Lesen 2","type":"tf","pts":0,"title":"Richtig oder falsch?","instr":{"de":"Entscheide: Ist die Aussage richtig oder falsch?","vi":"Em quyết định: câu này đúng hay sai?","tr":"Karar ver: İfade doğru mu, yanlış mı?","ar":"قرّر: هل الجملة صحيحة أم خاطئة؟","ti":"ወስን: እቲ ሓሳብ ልክዕ ድዩ ጌጋ?","uk":"Вирішуй: твердження правильне чи неправильне?","ru":"Реши: утверждение верно или неверно?","es":"Decide: ¿la afirmación es verdadera o falsa?","pt":"Decide: a afirmação é verdadeira ou falsa?"},"tip":{"de":"Merke: Bahn und Post müssen befördern. Private Paketdienste dürfen ablehnen.","vi":"Nhớ: Bahn và Post phải vận chuyển. Dịch vụ chuyển phát tư nhân được từ chối.","tr":"Unutma: Bahn (Alman Demiryolu) ve Post (Alman Postası) taşımak zorundadır. Özel kargo şirketleri reddedebilir.","ar":"تذكّر: السكك الحديدية (Bahn) والبريد (Post) ملزمان بالنقل. أما شركات الطرود الخاصة فيحق لها الرفض.","ti":"ኣስተውዕል: Bahn (ባቡር) ን Post (ፖስታ) ከጻዕዩ ግዴታ ኣለዎም። ናይ ብሕቲ ናይ ፓኬት ኣገልግሎታት ክኽልክሉ ይኽእሉ።","uk":"Запам'ятай: Bahn (залізниця) і Post (пошта) зобов'язані перевозити. Приватні служби доставки посилок можуть відмовити.","ru":"Запомни: Bahn (железная дорога) и Post (почта) обязаны перевозить. Частные службы доставки посылок могут отказать.","es":"Recuerda: Bahn (ferrocarril alemán) y Post (correos alemán) están obligados a transportar. Las empresas privadas de paquetería pueden rechazar envíos.","pt":"Lembra-te: a Bahn (caminhos de ferro alemães) e a Post (correios alemães) são obrigadas a transportar. As empresas privadas de encomendas podem recusar."},"st":[{"t":"Private Paketdienste müssen jede Sendung befördern.","a":false,"why":{"de":"Private Paketdienste dürfen Sendungen ablehnen. Nur Bahn und Post haben eine Beförderungspflicht.","vi":"Dịch vụ chuyển phát tư nhân được từ chối. Chỉ Bahn và Post có Beförderungspflicht.","tr":"Özel kargo şirketleri (Paketdienste) gönderileri reddedebilir. Yalnızca Bahn ve Post'un Beförderungspflicht'i (taşıma zorunluluğu) vardır.","ar":"يحق لشركات الطرود الخاصة (Paketdienste) رفض الشحنات. فقط Bahn و Post عليهما التزام بالنقل (Beförderungspflicht).","ti":"ናይ ብሕቲ ናይ ፓኬት ኣገልግሎታት (Paketdienste) ዕቃ ክኽልክሉ ይኽእሉ። Bahn ን Post ጥራይ እዮም Beförderungspflicht (ግዴታ ምጽዋዕ) ዘለዎም።","uk":"Приватні служби доставки посилок (Paketdienste) можуть відмовитися прийняти відправлення. Лише Bahn і Post мають Beförderungspflicht (обов'язок перевозити).","ru":"Частные службы доставки посылок (Paketdienste) могут отказаться принять отправление. Только у Bahn и Post есть Beförderungspflicht (обязанность перевозить).","es":"Las empresas privadas de paquetería (Paketdienste) pueden rechazar envíos. Solo Bahn y Post tienen Beförderungspflicht (obligación de transportar).","pt":"As empresas privadas de encomendas (Paketdienste) podem recusar envios. Só a Bahn e a Post têm Beförderungspflicht (obrigação de transportar)."}},{"t":"Beim Verbrauchsgüterkauf haftet der Einzelhändler bis zur Übergabe der Ware.","a":true},{"t":"Mit der Inkassovollmacht darf der Fahrer den Rechnungsbetrag kassieren.","a":true},{"t":"Der Spediteur fährt immer selbst.","a":false,"why":{"de":"Der Spediteur organisiert. Nur wenn er selbst fährt, ist er zugleich Frachtführer.","vi":"Spediteur tổ chức. Chỉ khi tự lái xe thì anh ta đồng thời là Frachtführer.","tr":"Spediteur organize eder. Yalnızca kendisi sürerse aynı zamanda Frachtführer olur.","ar":"المُنظِّم اللوجستي (Spediteur) ينظّم. وفقط إذا قاد بنفسه يكون في الوقت نفسه ناقلًا (Frachtführer).","ti":"Spediteur የዳሊ። ባዕሉ እንተዝውር ጥራይ ኣብ ሓደ ግዜ Frachtführer እዩ።","uk":"Spediteur організовує. Лише якщо він їде сам, він водночас Frachtführer.","ru":"Spediteur организует. Только если он сам едет, он одновременно Frachtführer.","es":"El Spediteur organiza. Solo si conduce él mismo es también Frachtführer.","pt":"O Spediteur organiza. Só se conduzir ele próprio é também Frachtführer."}}]},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: Eigener Wagen oder fremder Dienstleister?","html":"<div class=\"box\"><b>Der Fall:<\/b> Das Möbelhaus Struck in Bremerhaven liefert Küchen im Umkreis von 40 Kilometern mit zwei eigenen Lkw aus und baut sie beim Kunden auf. Kleinteile wie Lampen und Deko verschickt es über einen privaten Paketdienst.<\/div><p><b>Warum die Küchen mit eigenem Wagen?<\/b> Weil zur Lieferung der Aufbau gehört. Das kann nur geschultes eigenes Personal. Der Kunde ist zufriedener, die Serviceleistung bringt Umsatz, und der beschriftete Lkw wirbt nebenbei.<\/p><p><b>Was kostet das den Betrieb?<\/b> Zwei Lkw und Fahrer müssen unterhalten werden: hoher Kapitaleinsatz. Die Pauschale deckt die Kosten nur zum Teil. Bis die Küche beim Kunden steht, haftet das Möbelhaus.<\/p><p><b>Warum die Kleinteile fremd?<\/b> Für eine einzelne Lampe lohnt sich keine eigene Tour. Der Paketdienst fährt ohnehin täglich.<\/p><p><b>Und mit einem Spediteur?<\/b> Der Spediteur würde den Transport organisieren und einen Frachtführer beauftragen. Nur wenn er selbst fährt, ist er zugleich Frachtführer.<\/p><div class=\"box merke\"><b>Ergebnis:<\/b> Die Entscheidung hängt an drei Fragen: Gehört eine Serviceleistung dazu? Lohnt die Menge eine eigene Tour? Wer trägt das Risiko bis zur Übergabe?<\/div>","vi":"Ví dụ mẫu: cửa hàng nội thất giao bếp bằng xe riêng (có lắp đặt), còn đồ nhỏ gửi qua dịch vụ chuyển phát. Ba câu hỏi: Có dịch vụ kèm theo không? Số lượng có đáng đi một tuyến riêng không? Ai chịu rủi ro đến khi giao xong?","sum":{"tr":"Örnek: Bir mobilya mağazası mutfakları kendi aracıyla teslim eder (kurulumla birlikte), küçük parçaları kargo şirketiyle gönderir. Üç soru: Ek hizmet var mı? Miktar ayrı bir sefere değer mi? Teslimata kadar riski kim taşıyor?","ar":"مثال محلول: محل أثاث يوصّل المطابخ بسيارته الخاصة (مع التركيب)، ويرسل القطع الصغيرة عبر شركة طرود. ثلاثة أسئلة: هل هناك خدمة إضافية؟ هل تستحق الكمية جولة خاصة؟ من يتحمّل الخطر حتى انتهاء التسليم؟","ti":"ኣብነት: ሓደ ድኳን ኣቑሑ ገዛ ክቹዛናታት ብናይ ባዕሉ መኪና የብጽሕ (ምስ ምትካል)፣ ንኣናእሽተይቲ ዕቃታት ድማ ብናይ ፓኬት ኣገልግሎት ይሰደ። ሰለስተ ሕቶታት: ተወሳኺ ኣገልግሎት ኣሎ ድዩ? እቲ ብዝሒ ናይ ባዕሉ ጉዕዞ ይግብኦ ድዩ? ክሳብ ምብጻሕ ሓደጋ መን ይሕዝ?","uk":"Приклад: меблевий магазин доставляє кухні власним автомобілем (зі встановленням), а дрібні речі надсилає через службу доставки посилок. Три запитання: Чи є додаткова послуга? Чи вартий обсяг окремого рейсу? Хто несе ризик до завершення доставки?","ru":"Пример: мебельный магазин доставляет кухни на собственной машине (с установкой), а мелкие вещи отправляет через службу доставки посылок. Три вопроса: Есть ли дополнительная услуга? Стоит ли количество отдельного рейса? Кто несёт риск до окончания доставки?","es":"Ejemplo resuelto: una tienda de muebles entrega las cocinas con vehículo propio (con montaje) y envía los objetos pequeños con una empresa de paquetería. Tres preguntas: ¿Hay un servicio adicional? ¿Merece la pena una ruta propia por la cantidad? ¿Quién asume el riesgo hasta la entrega?","pt":"Exemplo resolvido: uma loja de móveis entrega as cozinhas com viatura própria (com montagem) e envia os objetos pequenos por uma empresa de encomendas. Três perguntas: Há um serviço adicional? A quantidade compensa uma rota própria? Quem assume o risco até à entrega?"}},{"id":"a3","no":"Aufgabe 3","type":"table","pts":0,"title":"Geführte Übung","instr":{"de":"Wähle zu jedem Fall die richtige Antwort.","vi":"Em chọn câu trả lời đúng cho mỗi tình huống.","tr":"Her durum için doğru cevabı seç.","ar":"اختر الإجابة الصحيحة لكل حالة.","ti":"ንነንሕድሕድ ጉዳይ ትክክለኛ መልሲ ምረጽ።","uk":"Обери правильну відповідь для кожного випадку.","ru":"Выбери правильный ответ для каждого случая.","es":"Elige la respuesta correcta para cada caso.","pt":"Escolhe a resposta correta para cada caso."},"tip":{"de":"Fährt er selbst oder lässt er fahren? Wer hat eine Beförderungspflicht? Wann geht die Gefahr über?","vi":"Anh ta tự lái hay thuê người lái? Ai có nghĩa vụ vận chuyển? Khi nào rủi ro được chuyển?","tr":"Kendisi mi sürüyor, yoksa sürdürüyor mu? Kimin Beförderungspflicht'i (taşıma zorunluluğu) var? Gefahrübergang (riziko geçişi) ne zaman olur?","ar":"هل يقود بنفسه أم يكلّف غيره بالقيادة؟ من عليه التزام بالنقل (Beförderungspflicht)؟ متى ينتقل الخطر (Gefahrübergang)؟","ti":"ባዕሉ ይዝውር ድዩ ወይስ የዝውር? መን እዩ Beförderungspflicht (ግዴታ ምጽዋዕ) ዘለዎ? መዓስ እዩ ሓደጋ ዝሰጋገር (Gefahrübergang)?","uk":"Він їде сам чи наймає водія? Хто має Beförderungspflicht (обов'язок перевозити)? Коли переходить ризик (Gefahrübergang)?","ru":"Он сам едет или нанимает водителя? У кого есть Beförderungspflicht (обязанность перевозить)? Когда переходит риск (Gefahrübergang)?","es":"¿Conduce él mismo o hace conducir a otro? ¿Quién tiene Beförderungspflicht (obligación de transportar)? ¿Cuándo pasa el riesgo (Gefahrübergang)?","pt":"Conduz ele próprio ou manda conduzir? Quem tem Beförderungspflicht (obrigação de transportar)? Quando passa o risco (Gefahrübergang)?"},"cols":["Fall","Antwort"],"colOpts":[null,null],"rows":[["1. Ein Unternehmen fährt die Ware mit eigenem Lkw zum Kunden und stellt dafür eine Rechnung. Wer ist das?",{"a":"Frachtführer","o":["Frachtführer","Spediteur"]}],["2. Ein Unternehmen sucht für das Möbelhaus das günstigste Transportmittel aus, beauftragt eine Spedition in Hamburg und rechnet mit dem Möbelhaus ab. Wer ist das?",{"a":"Spediteur","o":["Frachtführer","Spediteur"]}],["3. Ein Paketdienst lehnt es ab, eine sperrige Einzelsendung nach Helgoland mitzunehmen. Ist das zulässig?",{"a":"Zulässig","o":["Zulässig","Nicht zulässig"]}],["4. Ein Kunde bestellt eine Waschmaschine. Auf dem Transport im Lkw des Händlers fällt sie um und wird beschädigt. Wer haftet?",{"a":"Der Einzelhändler","o":["Der Einzelhändler","Der Kunde"]}]]},{"id":"a4","no":"Aufgabe 4","type":"free","pts":1,"title":"Freie Übung","instr":{"de":"Beantworte die Fragen in eigenen Worten.","vi":"Em trả lời các câu hỏi bằng lời của mình.","tr":"Soruları kendi cümlelerinle cevapla.","ar":"أجب عن الأسئلة بكلماتك الخاصة.","ti":"ነቶም ሕቶታት ብናትካ ቃላት መልሲ።","uk":"Дай відповіді на запитання своїми словами.","ru":"Ответь на вопросы своими словами.","es":"Responde las preguntas con tus propias palabras.","pt":"Responde às perguntas com as tuas próprias palavras."},"tip":{"de":"Bei Frage 3 hilft das Merkwort: Der eine fährt, der andere organisiert.","vi":"Câu 3: nhớ rằng một người lái xe, người kia tổ chức.","tr":"3. soruda şu akılda tutma sözü yardımcı olur: Biri sürer, diğeri organize eder.","ar":"في السؤال 3 تساعدك هذه العبارة: الأول يقود، والثاني ينظّم.","ti":"ንሕቶ 3 እዚ ምዝካር ይሕግዝ: ሓደ ይዝውር፣ እቲ ካልእ የዳሊ።","uk":"До запитання 3 допоможе підказка: один їде, інший організовує.","ru":"К вопросу 3 поможет запоминалка: один едет, другой организует.","es":"Para la pregunta 3 ayuda esta regla: uno conduce, el otro organiza.","pt":"Na pergunta 3 ajuda esta regra: um conduz, o outro organiza."},"parts":[{"q":"1. Nenne drei Vorteile der firmeneigenen Warenzustellung.","m":"Zufriedene Kunden und stärkere Kundentreue durch geschultes Personal; auswärtige Kunden lassen sich gewinnen; das Einzugsgebiet kann erweitert werden; Werbewirkung der beschrifteten Fahrzeuge; Serviceleistungen steigern den Umsatz."},{"q":"2. Nenne zwei Nachteile der firmeneigenen Warenzustellung.","m":"Die berechneten Zustellkosten decken die Kosten nur zum Teil; der Betrieb haftet bis zur Übergabe; hoher Kapitaleinsatz für den Fuhrpark."},{"q":"3. Erkläre den Unterschied zwischen Frachtführer und Spediteur.","m":"Der Frachtführer befördert das Gut selbst zum Bestimmungsort. Der Spediteur besorgt die Versendung im eigenen Namen und für fremde Rechnung – er wählt das Beförderungsmittel aus und vermittelt zwischen Versender und Frachtführer.","s":["Der Frachtführer …","Der Spediteur …"]},{"q":"4. Was bedeutet Beförderungspflicht, und für wen gilt sie?","m":"Beförderungspflicht (Kontrahierungszwang) heißt: Deutsche Bahn AG und Deutsche Post AG müssen alle Waren befördern, sofern die Beförderungsbestimmungen eingehalten werden."},{"q":"5. Was ist eine Inkassovollmacht?","m":"Mit ihr darf der Auslieferungsfahrer den fälligen Rechnungsbetrag sofort beim Kunden kassieren."}]},{"id":"a5","no":"Aufgabe 5","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh.","tr":"Soruları cevapla. Tam cümlelerle gerekçelendir.","ar":"أجب عن الأسئلة. علّل بجمل كاملة.","ti":"ነቶም ሕቶታት መልሲ። ብምሉእ ሓሳብ ኣብርህ።","uk":"Дай відповіді на запитання. Обґрунтуй повними реченнями.","ru":"Ответь на вопросы. Обоснуй целыми предложениями.","es":"Responde las preguntas. Justifica con frases completas.","pt":"Responde às perguntas. Justifica com frases completas."},"tip":{"de":"5.1: Eine Pauschale ist einfach und wirkt fair. 5.2: Was fällt weg, wenn man keine eigenen Fahrzeuge hat? 5.3: Pflicht gegen Erlaubnis.","vi":"5.1: phí trọn gói đơn giản và có vẻ công bằng. 5.2: mất gì nếu không có xe riêng? 5.3: nghĩa vụ so với giấy phép.","tr":"5.1: Pauschale (sabit ücret) basittir ve adil görünür. 5.2: Kendi araçların yoksa ne ortadan kalkar? 5.3: Zorunluluk ve izin karşılaştırması.","ar":"5.1: الأجرة الثابتة (Pauschale) بسيطة وتبدو عادلة. 5.2: ماذا يسقط إذا لم تكن لديك سيارات خاصة؟ 5.3: الالتزام مقابل الترخيص.","ti":"5.1: Pauschale (ቀዋሚ ክፍሊት) ቀሊል እዩ ከምኡውን ፍትሓዊ ይመስል። 5.2: ናይ ገዛእ ርእስኻ ተሽከርካሪታት እንተዘይብልካ እንታይ ይጠፍእ? 5.3: ግዴታ ኣንጻር ፍቓድ።","uk":"5.1: Pauschale (фіксована плата) проста й здається справедливою. 5.2: Що відпадає, якщо немає власних автомобілів? 5.3: Обов'язок проти дозволу.","ru":"5.1: Pauschale (фиксированная плата) проста и кажется справедливой. 5.2: Что отпадает, если нет собственных машин? 5.3: Обязанность против разрешения.","es":"5.1: Una Pauschale (tarifa fija) es sencilla y parece justa. 5.2: ¿Qué desaparece si no se tienen vehículos propios? 5.3: Obligación frente a permiso.","pt":"5.1: Uma Pauschale (taxa fixa) é simples e parece justa. 5.2: O que deixa de existir se não houver veículos próprios? 5.3: Obrigação contra autorização."},"parts":[{"q":"5.1 Warum verlangen viele Möbelhäuser eine Zustellpauschale, obwohl sie damit die Kosten nicht decken?","m":"Eine Pauschale ist einfach zu kommunizieren und wirkt für den Kunden fair und überschaubar. Deckte sie die vollen Kosten, wäre sie so hoch, dass viele Kunden auf die Lieferung verzichten oder woanders kaufen würden. Der Rest wird über den Warenpreis und den zusätzlichen Umsatz aus Serviceleistungen getragen."},{"q":"5.2 Ein Betrieb überlegt, seinen Fuhrpark abzuschaffen und alles über Paketdienste abzuwickeln. Nenne zwei Gründe, die dagegen sprechen.","m":"Erstens fielen die Serviceleistungen weg – Aufbau der Möbel, Anschließen der Geräte. Genau die machen zufriedene Kunden und bringen Umsatz. Zweitens entfiele die Werbewirkung der eigenen Fahrzeuge, und bei sperriger Ware nehmen Paketdienste die Sendung womöglich gar nicht an."},{"q":"5.3 Warum ist der gewerbliche Güterkraftverkehr erlaubnispflichtig, private Paketdienste dürfen Sendungen aber ablehnen? Was sagt das über den Unterschied zwischen Pflicht und Erlaubnis?","m":"Die Erlaubnispflicht regelt, wer überhaupt gewerblich Güter transportieren darf – sie sichert Qualität und Sicherheit. Eine Beförderungspflicht dagegen zwingt zum Vertragsabschluss und gilt nur für Bahn und Post, weil sie Aufgaben der Daseinsvorsorge übernehmen. Ein privates Unternehmen darf deshalb frei entscheiden, welchen Auftrag es annimmt."}]},{"id":"v1","level":"v","no":"Vertiefung 1","type":"free","pts":1,"title":"Warum ist das so?","instr":{"de":"Auf dem Transport im Lkw des Händlers wird eine Waschmaschine beschädigt. Warum muss der Händler den Schaden tragen und nicht der Kunde? Begründe.","vi":"Trong lúc vận chuyển bằng xe của cửa hàng, một chiếc máy giặt bị hư. Tại sao cửa hàng phải chịu thiệt hại mà không phải khách? Hãy giải thích.","tr":"Satıcının kamyonunda taşıma sırasında bir çamaşır makinesi hasar görüyor. Zararı neden müşteri değil, satıcı karşılamak zorunda? Gerekçelendir.","ar":"أثناء النقل في شاحنة التاجر تضرّرت غسالة. لماذا يجب أن يتحمّل التاجر الضرر وليس الزبون؟ علّل.","ti":"ኣብ ጽዕነት ናይ ነጋዳይ መኪና ሓንቲ ማሺን ምሕጻብ ክዳን ተበላሽያ። ስለምንታይ እዩ ነጋዳይ እምበር ዓሚል እቲ ጉድኣት ዝሕዝ? ኣብርህ።","uk":"Під час перевезення у вантажівці продавця пошкоджено пральну машину. Чому збиток має нести продавець, а не покупець? Обґрунтуй.","ru":"При перевозке в грузовике продавца стиральная машина повреждена. Почему ущерб должен нести продавец, а не покупатель? Обоснуй.","es":"Durante el transporte en el camión del comerciante se daña una lavadora. ¿Por qué tiene que asumir el daño el comerciante y no el cliente? Justifica.","pt":"Durante o transporte no camião do comerciante, uma máquina de lavar roupa fica danificada. Porque é que o comerciante tem de suportar o prejuízo e não o cliente? Justifica."},"tip":{"de":"Denke an den Begriff Gefahrübergang. Wann hat der Kunde die Ware erhalten?","vi":"Nghĩ đến từ Gefahrübergang. Khi nào khách đã nhận hàng?","tr":"Gefahrübergang (riziko geçişi) kavramını düşün. Müşteri malı ne zaman teslim almış olur?","ar":"فكّر في مصطلح انتقال الخطر (Gefahrübergang). متى استلم الزبون البضاعة؟","ti":"ብዛዕባ እቲ ቃል Gefahrübergang (ምስጋገር ሓደጋ) ሕሰብ። እቲ ዓሚል መዓስ እዩ እቲ ዕቃ ዝተቐበለ?","uk":"Подумай про поняття Gefahrübergang (перехід ризику). Коли покупець отримав товар?","ru":"Подумай о понятии Gefahrübergang (переход риска). Когда покупатель получил товар?","es":"Piensa en el concepto Gefahrübergang (traspaso del riesgo). ¿Cuándo ha recibido el cliente la mercancía?","pt":"Pensa no conceito Gefahrübergang (transferência do risco). Quando é que o cliente recebeu a mercadoria?"},"parts":[{"q":"Meine Begründung:","m":"Beim Verbrauchsgüterkauf geht die Gefahr erst über, wenn der Kunde die Kaufsache erhalten hat. Bis zur Übergabe haftet der Einzelhändler für Beschädigung und Verlust. Die Ware war noch nicht beim Kunden.","s":["Der Händler haftet, weil …"]}]},{"id":"v2","level":"v","no":"Vertiefung 2","type":"free","pts":1,"title":"Begründe deine Entscheidung","instr":{"de":"Ein Elektrogeschäft verkauft eine große Waschmaschine, die angeschlossen werden muss. Soll es eigenen Wagen oder einen Paketdienst nutzen? Begründe mit den drei Fragen aus Aufgabe 2.","vi":"Một cửa hàng điện máy bán một chiếc máy giặt lớn cần được lắp đặt. Nên dùng xe riêng hay dịch vụ chuyển phát? Hãy giải thích bằng ba câu hỏi ở Aufgabe 2.","tr":"Bir elektrikli ev aletleri mağazası, bağlantısı yapılması gereken büyük bir çamaşır makinesi satıyor. Kendi aracını mı yoksa bir kargo şirketini (Paketdienst) mi kullanmalı? Aufgabe 2'deki üç soruyla gerekçelendir.","ar":"يبيع محل أجهزة كهربائية غسالة كبيرة تحتاج إلى توصيل وتركيب. هل يستخدم سيارته الخاصة أم شركة طرود (Paketdienst)؟ علّل بالأسئلة الثلاثة من Aufgabe 2.","ti":"ሓደ ድኳን ኤሌክትሪክ ዕቃታት ክትከል ዘለዎ ዓባይ ማሺን ምሕጻብ ክዳን ይሸይጥ። ናይ ገዛእ ርእሱ መኪና ድዩ ወይስ ናይ ፓኬት ኣገልግሎት (Paketdienst) ክጥቀም? ብሰለስተ ሕቶታት ካብ Aufgabe 2 ኣብርህ።","uk":"Магазин електротоварів продає велику пральну машину, яку треба підключити. Що обрати: власний автомобіль чи службу доставки посилок (Paketdienst)? Обґрунтуй трьома запитаннями з Aufgabe 2.","ru":"Магазин электротоваров продаёт большую стиральную машину, которую нужно подключить. Что выбрать: собственную машину или службу доставки посылок (Paketdienst)? Обоснуй тремя вопросами из Aufgabe 2.","es":"Una tienda de electrodomésticos vende una lavadora grande que hay que instalar. ¿Debe usar su propio vehículo o una empresa de paquetería? Justifica con las tres preguntas de la Aufgabe 2.","pt":"Uma loja de eletrodomésticos vende uma máquina de lavar roupa grande que tem de ser instalada. Deve usar a viatura própria ou uma empresa de encomendas? Justifica com as três perguntas da Aufgabe 2."},"tip":{"de":"Gehört eine Serviceleistung dazu? Lohnt eine eigene Tour? Wer trägt das Risiko?","vi":"Có dịch vụ kèm theo không? Có đáng đi một tuyến riêng không? Ai chịu rủi ro?","tr":"Hizmet de işin içinde mi? Ayrı bir sefer buna değer mi? Riski kim taşıyor?","ar":"هل هناك خدمة إضافية؟ هل تستحق الكمية جولة خاصة؟ من يتحمّل الخطر؟","ti":"ኣገልግሎት ኣብ ውሽጡ ኣሎ ድዩ? ናይ ባዕሉ ጉዕዞ ይግብኦ ድዩ? ሓደጋ መን ይሕዝ?","uk":"Чи входить у доставку послуга? Чи вартий окремий рейс витрат? Хто несе ризик?","ru":"Входит ли в доставку услуг function cardOf(e){const c=e.closest('.card');return c?D.items.find(x=>x.id===c.dataset.id):null}
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();return}if(t.id==='dt'){S.date=t.value;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;if(t.type==='radio'||t.type==='checkbox')return;A(it.id)[t.dataset.k]=t.value;if(S.checked[it.id]&&t.closest('.card'))t.classList.remove('ok','bad');progress();save()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.can!=null){S.can[t.dataset.can]=t.checked;save();return}
 const it=cardOf(t);if(!it||!t.dataset.k)return;const a=A(it.id);
 if(t.type==='radio'){a[t.dataset.k]=t.value}
 else if(t.type==='checkbox'){const vals=$$('input[name="'+t.name+'"]:checked',t.closest('.card')).map(x=>x.value);a[t.dataset.k]=vals.join(',')}
 else a[t.dataset.k]=t.value;
 if(it.type==='read'&&a.chk){paint(it);}
 if(S.checked[it.id]){const el=t.closest('[data-part]');if(el)el.classList.remove('ok','bad')}
 progress();save()});
document.addEventListener('click',e=>{const t=e.target.closest('button,.w,[data-lg],[data-lv]');if(!t)return;
 if(t.dataset.lg){S.lang=t.dataset.lg;renderAll();save();return}
 if(t.dataset.lv){S.level=t.dataset.lv;renderAll();save();return}
 if(t.classList.contains('w')){const it=cardOf(t);const a=A(it.id);if(a.chk)return;a.m=a.m||[];const i=+t.dataset.w;const k=a.m.indexOf(i);if(k>=0)a.m.splice(k,1);else a.m.push(i);t.classList.toggle('sel');save();return}
 if(t.dataset.chip){const ta=document.getElementById(t.dataset.for);if(!ta)return;const s=ta.selectionStart==null?ta.value.length:ta.selectionStart,en=ta.selectionEnd==null?s:ta.selectionEnd;const ins=t.dataset.chip+' ';ta.value=ta.value.slice(0,s)+ins+ta.value.slice(en);ta.focus();ta.selectionStart=ta.selectionEnd=s+ins.length;ta.dispatchEvent(new Event('input',{bubbles:true}));return}
 if(t.dataset.rate){const it=cardOf(t);A(it.id)[t.dataset.k]=t.dataset.rate;$$('[data-k="'+t.dataset.k+'"]',t.parentNode).forEach(b=>b.classList.toggle('on',b===t));progress();save();return}
 const act=t.dataset.act;if(!act)return;const it=D.items.find(x=>x.id===t.dataset.id);
 if(act==='check'){S.checked[it.id]=true;paint(it);progress();save()}
 if(act==='rdchk'){A(it.id).chk=true;const c=$('#c_'+it.id);const keep=window.scrollY;const fbk=true;renderCard(it);paint(it);window.scrollTo(0,keep);progress();save()}
 if(act==='model'){S.shown[it.id]=true;renderCard(it);progress();save()}
});
function renderCard(it){const old=$('#c_'+it.id);const tmp=document.createElement('div');tmp.innerHTML=cardHtml(it);const det=old.querySelector('.tip').open;old.replaceWith(tmp.firstChild);if(S.checked[it.id]||it.type==='read')paint(it)}
function evaluate(){renderResult();$('#result').scrollIntoView({behavior:'smooth'})}
$('#b_eval').onclick=evaluate;
$('#b_pdf').onclick=()=>{renderResult();setTimeout(()=>window.print(),100)};
$('#b_restart').onclick=()=>$('#modal').classList.add('on');
$('#m_no').onclick=()=>$('#modal').classList.remove('on');
$('#m_yes').onclick=()=>{$('#modal').classList.remove('on');S=def();clearStore();$('#nm').value='';$('#dt').value=S.date;renderAll();window.scrollTo(0,0)};
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',()=>{$$('textarea').forEach(t=>{t.style.height='auto';t.style.height=t.scrollHeight+'px'})});
/* ---------- Start ---------- */
const had=load();
$('#h_title').textContent=D.title;$('#h_sub').textContent=D.sub;$('#topt').textContent=D.short;
$('#nm').value=S.name;$('#dt').value=S.date;
renderAll();if(had&&Object.keys(S.ans).length)toast(u('restored'));
/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
   case'gap':a[k]=right?[].concat(p.a)[0]:'xxx';break;
   case'match':a[k]=right?p.a:'—falsch—';break;
   case'table':a[k]=right?[].concat(p.a)[0]:'—falsch—';break;
   case'calc':a[k]=right?String(p.a).replace('.',','):'1';break;
   case'free':a[k]='Beispielantwort';a.r=right?'y':'n';S.shown[it.id]=true;break}});
  if(it.type==='read'){a.m=right?readKeys(it):[];a.chk=true;if(it.quiz)a.q=right?it.quiz.a:(it.quiz.a+1)%it.quiz.o.length}
  S.checked[it.id]=true});renderAll();evaluate();return S},
 data:D};
})();
