<script>
const SHEET={"id":"M10","short":"LF 5 · Modul 10","title":"Modul 10 – Warenzustellung","sub":"Lernfeld 5 · Werben und den Verkauf fördern","can":[{"de":"Ich kann Vor- und Nachteile der firmeneigenen Zustellung nennen.","vi":"Em có thể nêu ưu và nhược điểm của việc cửa hàng tự giao hàng (firmeneigene Zustellung)."},{"de":"Ich kann Frachtführer und Spediteur unterscheiden.","vi":"Em có thể phân biệt Frachtführer (người vận chuyển) và Spediteur (người tổ chức vận chuyển)."}],"items":[{"id":"a1","no":"Aufgabe 1","type":"free","pts":1,"title":"Ankommen: Was weißt du noch?","instr":{"de":"Beantworte die Fragen aus dem Kopf. Nicht nachschlagen. Es geht darum, was hängengeblieben ist.","vi":"Hãy trả lời bằng trí nhớ, không tra cứu. Điều quan trọng là em còn nhớ được gì."},"tip":{"de":"Denke an Modul 9 (Verpackung) und an LF 2 und LF 4. Stichworte genügen.","vi":"Hãy nhớ lại Modul 9 (bao bì), LF 2 và LF 4. Chỉ cần từ khóa."},"parts":[{"q":"1. Nenne zwei der fünf Aufgaben der Verpackung.","m":"Zwei aus: Schutz der Waren, Informationen über die Ware, Erleichterung des Gebrauchs, Serviceaufgaben, Werbemittel."},{"q":"2. Was ist eine Transportverpackung?","m":"Sie schützt die Ware auf dem Weg vom Hersteller bzw. Großhändler zum Einzelhändler und fällt beim Hersteller an."},{"q":"3. Was ist das Ziel des Verpackungsgesetzes?","m":"Weniger Verpackungsmüll und wesentlich mehr Recycling von Abfällen aus privaten Haushalten."},{"q":"4. Wie nennt man es, wenn der Preis zwischen zwei Vorteilen genannt wird? (aus LF 2)","m":"Sandwich-Methode."},{"q":"5. Welche Regalzonen verkaufen am besten? (aus LF 4)","m":"Sichtzone (Augenhöhe) und Greifzone."}]},{"id":"w1","type":"info","title":{"de":"Wortspeicher","vi":"Wortspeicher (kho từ)"},"html":"<p>Warenzustellung · firmeneigen · firmenfremd · Versandabteilung · Tourenplanung · Zustellkosten · Pauschale · Lieferschein · Inkassovollmacht · Gefahrübergang · Frachtführer · Frachtvertrag · Spediteur · Speditionsvertrag · Beförderungspflicht · Kontrahierungszwang · Güterkraftverkehr · Paketdienst<\/p><div class=\"box\"><b>Tipp für Schnelle:<\/b> Deck den Wortspeicher ab und schau nur hin, wenn du wirklich nicht weiterkommst.<\/div>","vi":"Warenzustellung = giao hàng · firmeneigen = của chính cửa hàng · firmenfremd = của bên ngoài · Tourenplanung = lập kế hoạch tuyến giao hàng · Zustellkosten = phí giao hàng · Pauschale = phí trọn gói · Lieferschein = phiếu giao hàng · Inkassovollmacht = quyền thu tiền · Gefahrübergang = chuyển giao rủi ro · Frachtführer = người vận chuyển · Spediteur = người tổ chức vận chuyển (công ty giao nhận) · Beförderungspflicht/Kontrahierungszwang = nghĩa vụ phải vận chuyển · Güterkraftverkehr = vận tải hàng hóa bằng xe · Paketdienst = dịch vụ chuyển phát bưu kiện"},{"id":"r1","no":"Lesen 1","type":"read","title":"Firmeneigene Warenzustellung","instr":{"de":"Lies den Text. Tippe an: Was gehört zur firmeneigenen Zustellung?","vi":"Em đọc đoạn văn. Chạm vào: điều gì thuộc về firmeneigene Zustellung?"},"tip":{"de":"Suche die eigenen Mittel des Betriebs und die zusätzlichen Leistungen.","vi":"Tìm những phương tiện riêng của cửa hàng và các dịch vụ thêm."},"paras":["Warenhäuser, Möbel- oder Elektrogeschäfte unterhalten oft eine eigene [[Versandabteilung]] mit betriebseigenen [[Fahrzeugen]]. Sie übernehmen neben dem Transport weitere [[Serviceleistungen]], zum Beispiel das Aufstellen der Möbel. Große Geschäfte fahren nach einem festen Fahrplan bestimmte Routen ab. Das nennt man [[Tourenplanung]]."],"vi":"Tóm tắt: Nhiều cửa hàng lớn có bộ phận giao hàng riêng với xe riêng, kèm dịch vụ như lắp đặt đồ nội thất. Tourenplanung = lập kế hoạch các tuyến giao hàng cố định.","quiz":{"q":"Was bedeutet Tourenplanung?","o":["Das Abfahren bestimmter Routen nach festem Fahrplan","Das Einkaufen auf einer Messe","Das Packen von Paketen"],"a":0,"why":{"de":"Tourenplanung heißt: feste Routen nach einem Fahrplan.","vi":"Tourenplanung nghĩa là: các tuyến cố định theo lịch."}}},{"id":"w2","type":"info","title":{"de":"Eigene Zustellung: Vorteile und Nachteile, drei Begriffe","vi":"Tự giao hàng: ưu, nhược điểm, ba khái niệm"},"html":"<p><b>Drei Begriffe, die in der Prüfung auftauchen:<\/b><br><b>Lieferschein:<\/b> Mit der Unterschrift auf dem Durchschlag bestätigt der Kunde die ordnungsgemäße Zustellung.<br><b>Inkassovollmacht:<\/b> Hat der Auslieferungsfahrer sie, kassiert er den fälligen Rechnungsbetrag sofort.<br><b>Gefahrübergang:<\/b> Beim Verbrauchsgüterkauf geht die Gefahr erst über, wenn der Kunde die Kaufsache erhalten hat. Bis zur Übergabe haftet der Einzelhändler für Beschädigung und Verlust.<\/p><p><b>Vorteile:<\/b> zufriedene Kunden und mehr Kundentreue durch geschultes Personal · auswärtige Kunden können gewonnen werden · das Einzugsgebiet wird größer · Werbewirkung durch beschriftete Fahrzeuge · Serviceleistungen steigern den Umsatz.<br><b>Nachteile:<\/b> Die berechneten Zustellkosten decken die Kosten nur zum Teil · höheres Risiko (Haftung bis zur Übergabe) · hoher Kapitaleinsatz für den Fuhrpark.<\/p>","vi":"Lieferschein: khách ký xác nhận đã nhận hàng. Inkassovollmacht: tài xế được thu tiền ngay. Gefahrübergang: rủi ro chỉ chuyển sang khách khi khách đã nhận hàng; trước đó cửa hàng chịu trách nhiệm về hư hỏng, mất mát. Ưu điểm: khách hài lòng, mở rộng khu vực, xe có logo quảng cáo, tăng doanh thu. Nhược điểm: phí không đủ bù chi phí, rủi ro, vốn lớn cho đội xe."},{"id":"m1","no":"Übung 1","type":"match","pts":0,"title":"Vorteil oder Nachteil?","instr":{"de":"Ordne jede Aussage zu: Vorteil oder Nachteil der firmeneigenen Zustellung.","vi":"Em xếp mỗi câu: ưu điểm hay nhược điểm của firmeneigene Zustellung."},"tip":{"de":"Frage dich: Hilft es dem Geschäft oder kostet es das Geschäft?","vi":"Tự hỏi: nó giúp cửa hàng hay làm cửa hàng tốn kém?"},"rows":[{"l":"Beschriftete Fahrzeuge werben im Einzugsgebiet.","a":"Vorteil"},{"l":"Die Pauschale deckt die Kosten nur zum Teil.","a":"Nachteil"},{"l":"Auswärtige Kunden können gewonnen werden.","a":"Vorteil"},{"l":"Hoher Kapitaleinsatz für den Fuhrpark.","a":"Nachteil"},{"l":"Das Geschäft haftet bis zur Übergabe der Ware.","a":"Nachteil"},{"l":"Serviceleistungen wie das Aufstellen steigern den Umsatz.","a":"Vorteil"}]},{"id":"w3","type":"info","title":{"de":"Frachtführer, Spediteur und Anbieter","vi":"Frachtführer, Spediteur và các nhà cung cấp"},"html":"<p><b>Frachtführer:<\/b> selbstständige Kaufleute, die gewerbsmäßig Güter befördern. Vertrag: Frachtvertrag. Er befördert das Gut zum Bestimmungsort und liefert es dort dem Empfänger ab.<\/p><p><b>Spediteur:<\/b> selbstständige Kaufleute, die im eigenen Namen und für fremde Rechnung gewerbsmäßig Güterversendungen besorgen, zum Beispiel durch Frachtführer. Vertrag: Speditionsvertrag. Er wählt das günstigste Beförderungsmittel aus und vermittelt zwischen Versender und Frachtführer.<\/p><div class=\"box merke\"><b>Merke:<\/b> Der Frachtführer fährt selbst. Der Spediteur organisiert. Übernimmt der Spediteur den Transport selbst, tritt er zugleich als Frachtführer auf.<\/div><p><b>Anbieter:<\/b><br><b>Deutsche Bahn AG und Deutsche Post AG:<\/b> Beförderungspflicht (Kontrahierungszwang). Sie müssen alle Waren befördern, wenn die Beförderungsbestimmungen eingehalten werden.<br><b>Gewerblicher Güterkraftverkehr:<\/b> Beförderung mit Kraftfahrzeugen. Er ist erlaubnispflichtig.<br><b>Private Paketdienste:<\/b> holen Pakete werktags zu einer abgesprochenen Zeit ab. Sie dürfen Sendungen ablehnen, zum Beispiel wenn sie nicht gewinnbringend sind.<\/p><div class=\"box merke\"><b>Merke:<\/b> Bahn und Post müssen befördern. Private Paketdienste dürfen ablehnen.<\/div>","vi":"Frachtführer = tự vận chuyển (hợp đồng Frachtvertrag). Spediteur = tổ chức vận chuyển, chọn phương tiện rẻ nhất, thuê Frachtführer (hợp đồng Speditionsvertrag). Nhớ: Frachtführer lái xe; Spediteur tổ chức. Deutsche Bahn và Deutsche Post phải vận chuyển (Beförderungspflicht). Dịch vụ chuyển phát tư nhân được phép từ chối."},{"id":"m2","no":"Übung 2","type":"match","pts":0,"title":"Frachtführer oder Spediteur?","instr":{"de":"Ordne jede Aussage zu: Frachtführer oder Spediteur.","vi":"Em xếp mỗi câu: Frachtführer hay Spediteur."},"tip":{"de":"Fährt er selbst oder organisiert er?","vi":"Anh ta tự lái xe hay chỉ tổ chức?"},"rows":[{"l":"Schließt einen Frachtvertrag ab.","a":"Frachtführer"},{"l":"Wählt das günstigste Beförderungsmittel aus.","a":"Spediteur"},{"l":"Befördert das Gut selbst zum Bestimmungsort.","a":"Frachtführer"},{"l":"Vermittelt zwischen Versender und Frachtführer.","a":"Spediteur"},{"l":"Schließt einen Speditionsvertrag ab.","a":"Spediteur"}]},{"id":"t1","no":"Lesen 2","type":"tf","pts":0,"title":"Richtig oder falsch?","instr":{"de":"Entscheide: Ist die Aussage richtig oder falsch?","vi":"Em quyết định: câu này đúng hay sai?"},"tip":{"de":"Merke: Bahn und Post müssen befördern. Private Paketdienste dürfen ablehnen.","vi":"Nhớ: Bahn và Post phải vận chuyển. Dịch vụ chuyển phát tư nhân được từ chối."},"st":[{"t":"Private Paketdienste müssen jede Sendung befördern.","a":false,"why":{"de":"Private Paketdienste dürfen Sendungen ablehnen. Nur Bahn und Post haben eine Beförderungspflicht.","vi":"Dịch vụ chuyển phát tư nhân được từ chối. Chỉ Bahn và Post có Beförderungspflicht."}},{"t":"Beim Verbrauchsgüterkauf haftet der Einzelhändler bis zur Übergabe der Ware.","a":true},{"t":"Mit der Inkassovollmacht darf der Fahrer den Rechnungsbetrag kassieren.","a":true},{"t":"Der Spediteur fährt immer selbst.","a":false,"why":{"de":"Der Spediteur organisiert. Nur wenn er selbst fährt, ist er zugleich Frachtführer.","vi":"Spediteur tổ chức. Chỉ khi tự lái xe thì anh ta đồng thời là Frachtführer."}}]},{"id":"a2","no":"Aufgabe 2","type":"info","title":"Vorgemacht: Eigener Wagen oder fremder Dienstleister?","html":"<div class=\"box\"><b>Der Fall:<\/b> Das Möbelhaus Struck in Bremerhaven liefert Küchen im Umkreis von 40 Kilometern mit zwei eigenen Lkw aus und baut sie beim Kunden auf. Kleinteile wie Lampen und Deko verschickt es über einen privaten Paketdienst.<\/div><p><b>Warum die Küchen mit eigenem Wagen?<\/b> Weil zur Lieferung der Aufbau gehört. Das kann nur geschultes eigenes Personal. Der Kunde ist zufriedener, die Serviceleistung bringt Umsatz, und der beschriftete Lkw wirbt nebenbei.<\/p><p><b>Was kostet das den Betrieb?<\/b> Zwei Lkw und Fahrer müssen unterhalten werden: hoher Kapitaleinsatz. Die Pauschale deckt die Kosten nur zum Teil. Bis die Küche beim Kunden steht, haftet das Möbelhaus.<\/p><p><b>Warum die Kleinteile fremd?<\/b> Für eine einzelne Lampe lohnt sich keine eigene Tour. Der Paketdienst fährt ohnehin täglich.<\/p><p><b>Und mit einem Spediteur?<\/b> Der Spediteur würde den Transport organisieren und einen Frachtführer beauftragen. Nur wenn er selbst fährt, ist er zugleich Frachtführer.<\/p><div class=\"box merke\"><b>Ergebnis:<\/b> Die Entscheidung hängt an drei Fragen: Gehört eine Serviceleistung dazu? Lohnt die Menge eine eigene Tour? Wer trägt das Risiko bis zur Übergabe?<\/div>","vi":"Ví dụ mẫu: cửa hàng nội thất giao bếp bằng xe riêng (có lắp đặt), còn đồ nhỏ gửi qua dịch vụ chuyển phát. Ba câu hỏi: Có dịch vụ kèm theo không? Số lượng có đáng đi một tuyến riêng không? Ai chịu rủi ro đến khi giao xong?"},{"id":"a3","no":"Aufgabe 3","type":"table","pts":0,"title":"Geführte Übung","instr":{"de":"Wähle zu jedem Fall die richtige Antwort.","vi":"Em chọn câu trả lời đúng cho mỗi tình huống."},"tip":{"de":"Fährt er selbst oder lässt er fahren? Wer hat eine Beförderungspflicht? Wann geht die Gefahr über?","vi":"Anh ta tự lái hay thuê người lái? Ai có nghĩa vụ vận chuyển? Khi nào rủi ro được chuyển?"},"cols":["Fall","Antwort"],"colOpts":[null,null],"rows":[["1. Ein Unternehmen fährt die Ware mit eigenem Lkw zum Kunden und stellt dafür eine Rechnung. Wer ist das?",{"a":"Frachtführer","o":["Frachtführer","Spediteur"]}],["2. Ein Unternehmen sucht für das Möbelhaus das günstigste Transportmittel aus, beauftragt eine Spedition in Hamburg und rechnet mit dem Möbelhaus ab. Wer ist das?",{"a":"Spediteur","o":["Frachtführer","Spediteur"]}],["3. Ein Paketdienst lehnt es ab, eine sperrige Einzelsendung nach Helgoland mitzunehmen. Ist das zulässig?",{"a":"Zulässig","o":["Zulässig","Nicht zulässig"]}],["4. Ein Kunde bestellt eine Waschmaschine. Auf dem Transport im Lkw des Händlers fällt sie um und wird beschädigt. Wer haftet?",{"a":"Der Einzelhändler","o":["Der Einzelhändler","Der Kunde"]}]]},{"id":"a4","no":"Aufgabe 4","type":"free","pts":1,"title":"Freie Übung","instr":{"de":"Beantworte die Fragen in eigenen Worten.","vi":"Em trả lời các câu hỏi bằng lời của mình."},"tip":{"de":"Bei Frage 3 hilft das Merkwort: Der eine fährt, der andere organisiert.","vi":"Câu 3: nhớ rằng một người lái xe, người kia tổ chức."},"parts":[{"q":"1. Nenne drei Vorteile der firmeneigenen Warenzustellung.","m":"Zufriedene Kunden und stärkere Kundentreue durch geschultes Personal; auswärtige Kunden lassen sich gewinnen; das Einzugsgebiet kann erweitert werden; Werbewirkung der beschrifteten Fahrzeuge; Serviceleistungen steigern den Umsatz."},{"q":"2. Nenne zwei Nachteile der firmeneigenen Warenzustellung.","m":"Die berechneten Zustellkosten decken die Kosten nur zum Teil; der Betrieb haftet bis zur Übergabe; hoher Kapitaleinsatz für den Fuhrpark."},{"q":"3. Erkläre den Unterschied zwischen Frachtführer und Spediteur.","m":"Der Frachtführer befördert das Gut selbst zum Bestimmungsort. Der Spediteur besorgt die Versendung im eigenen Namen und für fremde Rechnung – er wählt das Beförderungsmittel aus und vermittelt zwischen Versender und Frachtführer.","s":["Der Frachtführer …","Der Spediteur …"]},{"q":"4. Was bedeutet Beförderungspflicht, und für wen gilt sie?","m":"Beförderungspflicht (Kontrahierungszwang) heißt: Deutsche Bahn AG und Deutsche Post AG müssen alle Waren befördern, sofern die Beförderungsbestimmungen eingehalten werden."},{"q":"5. Was ist eine Inkassovollmacht?","m":"Mit ihr darf der Auslieferungsfahrer den fälligen Rechnungsbetrag sofort beim Kunden kassieren."}]},{"id":"a5","no":"Aufgabe 5","type":"free","pts":0,"title":"Für Profis: Zum Weiterdenken","instr":{"de":"Beantworte die Fragen. Begründe in ganzen Sätzen.","vi":"Em trả lời các câu hỏi và giải thích bằng câu hoàn chỉnh."},"tip":{"de":"5.1: Eine Pauschale ist einfach und wirkt fair. 5.2: Was fällt weg, wenn man keine eigenen Fahrzeuge hat? 5.3: Pflicht gegen Erlaubnis.","vi":"5.1: phí trọn gói đơn giản và có vẻ công bằng. 5.2: mất gì nếu không có xe riêng? 5.3: nghĩa vụ so với giấy phép."},"parts":[{"q":"5.1 Warum verlangen viele Möbelhäuser eine Zustellpauschale, obwohl sie damit die Kosten nicht decken?","m":"Eine Pauschale ist einfach zu kommunizieren und wirkt für den Kunden fair und überschaubar. Deckte sie die vollen Kosten, wäre sie so hoch, dass viele Kunden auf die Lieferung verzichten oder woanders kaufen würden. Der Rest wird über den Warenpreis und den zusätzlichen Umsatz aus Serviceleistungen getragen."},{"q":"5.2 Ein Betrieb überlegt, seinen Fuhrpark abzuschaffen und alles über Paketdienste abzuwickeln. Nenne zwei Gründe, die dagegen sprechen.","m":"Erstens fielen die Serviceleistungen weg – Aufbau der Möbel, Anschließen der Geräte. Genau die machen zufriedene Kunden und bringen Umsatz. Zweitens entfiele die Werbewirkung der eigenen Fahrzeuge, und bei sperriger Ware nehmen Paketdienste die Sendung womöglich gar nicht an."},{"q":"5.3 Warum ist der gewerbliche Güterkraftverkehr erlaubnispflichtig, private Paketdienste dürfen Sendungen aber ablehnen? Was sagt das über den Unterschied zwischen Pflicht und Erlaubnis?","m":"Die Erlaubnispflicht regelt, wer überhaupt gewerblich Güter transportieren darf – sie sichert Qualität und Sicherheit. Eine Beförderungspflicht dagegen zwingt zum Vertragsabschluss und gilt nur für Bahn und Post, weil sie Aufgaben der Daseinsvorsorge übernehmen. Ein privates Unternehmen darf deshalb frei entscheiden, welchen Auftrag es annimmt."}]},{"id":"v1","level":"v","no":"Vertiefung 1","type":"free","pts":1,"title":"Warum ist das so?","instr":{"de":"Auf dem Transport im Lkw des Händlers wird eine Waschmaschine beschädigt. Warum muss der Händler den Schaden tragen und nicht der Kunde? Begründe.","vi":"Trong lúc vận chuyển bằng xe của cửa hàng, một chiếc máy giặt bị hư. Tại sao cửa hàng phải chịu thiệt hại mà không phải khách? Hãy giải thích."},"tip":{"de":"Denke an den Begriff Gefahrübergang. Wann hat der Kunde die Ware erhalten?","vi":"Nghĩ đến từ Gefahrübergang. Khi nào khách đã nhận hàng?"},"parts":[{"q":"Meine Begründung:","m":"Beim Verbrauchsgüterkauf geht die Gefahr erst über, wenn der Kunde die Kaufsache erhalten hat. Bis zur Übergabe haftet der Einzelhändler für Beschädigung und Verlust. Die Ware war noch nicht beim Kunden.","s":["Der Händler haftet, weil …"]}]},{"id":"v2","level":"v","no":"Vertiefung 2","type":"free","pts":1,"title":"Begründe deine Entscheidung","instr":{"de":"Ein Elektrogeschäft verkauft eine große Waschmaschine, die angeschlossen werden muss. Soll es eigenen Wagen oder einen Paketdienst nutzen? Begründe mit den drei Fragen aus Aufgabe 2.","vi":"Một cửa hàng điện máy bán một chiếc máy giặt lớn cần được lắp đặt. Nên dùng xe riêng hay dịch vụ chuyển phát? Hãy giải thích bằng ba câu hỏi ở Aufgabe 2."},"tip":{"de":"Gehört eine Serviceleistung dazu? Lohnt eine eigene Tour? Wer trägt das Risiko?","vi":"Có dịch vụ kèm theo không? Có đáng đi một tuyến riêng không? Ai chịu rủi ro?"},"parts":[{"q":"Meine Entscheidung und meine Begründung:","m":"Eigener Wagen: Zur Lieferung gehört das Anschließen, das kann geschultes eigenes Personal. Das schafft zufriedene Kunden und Umsatz. Das Risiko trägt der Händler bis zur Übergabe, ein Paketdienst würde die sperrige Ware womöglich ablehnen.","s":["Ich entscheide mich für …, weil …"]}]}]};

 const a=A(it.id),ps=parts(it),res=[];
 if(it.type==='read'){const keys=readKeys(it),sel=a.m||[];const found=keys.filter(k=>sel.indexOf(k)>=0).length,extra=sel.filter(k=>keys.indexOf(k)<0).length;
  const q=it.quiz,qa=a.q;return{type:'read',found,total:keys.length,extra,qok:q?(qa!=null&&+qa===q.a):null,max:0,got:0,parts:[],filled:!!(a.chk&&(!q||qa!=null))}}
 ps.forEach((p,i)=>{const v=a['p'+i];let ok=false,mine='',sol='',has=v!=null&&String(v).trim()!=='';
  switch(it.type){
  case'mc':{const sa=[].concat(p.a).slice().sort().join(',');const sv=has?String(v).split(',').sort().join(','):'';ok=has&&sv===sa;mine=has?mcTxt(p,v):'';sol=mcTxt(p,sa);break}
  case'tf':ok=has&&(v==='t')===p.a;mine=has?(v==='t'?u('richtig'):u('falsch')):'';sol=p.a?u('richtig'):u('falsch');break;
  case'gap':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'match':ok=has&&v===p.a;mine=has?v:'';sol=p.a;break;
  case'table':{const acc=[].concat(p.a);ok=has&&acc.some(x=>norm(x)===norm(v));mine=has?v:'';sol=acc[0];break}
  case'calc':{const n=num(v);ok=has&&!isNaN(n)&&Math.abs(n-p.a)<=(p.tol==null?0.01:p.tol);mine=has?v:'';sol=fnum(p.a)+(p.u?' '+p.u:'');if(a['p'+i+'w'])mine+=' | '+u('path')+': '+a['p'+i+'w'];break}
  case'free':{const r=a.r;ok=r==='y'?true:r==='p'?0.5:false;has=has&&!!r;mine=a['p'+i]||'';sol=T(p.m);break}
  }
  res.push({ok,has,mine,sol,why:p.why,q:p.q,p});});
 const per=ps.length?it.pts/ps.length:0;let got=0;res.forEach(r=>{got+=(r.ok===true?1:r.ok===0.5?0.5:0)*per});
 let filled;if(it.type==='free')filled=ps.every((p,i)=>String(a['p'+i]||'').trim()!=='');else filled=res.every(r=>r.has);
 return{type:it.type,parts:res,max:it.pts||0,got,filled,any:res.some(r=>r.has)}}
function tokens(p){const out=[];let idx=0;let m;
 const parts=[];let last=0,s=p;const rg=/\[\[(.+?)\]\]|\{\{(.+?)\}\}/g;while((m=rg.exec(s))){if(m.index>last)parts.push({t:s.slice(last,m.index)});parts.push({t:m[1]||m[2],key:!!m[1]});last=rg.lastIndex}
 if(last<s.length)parts.push({t:s.slice(last)});
 parts.forEach((pt,pi)=>{const prev=parts[pi-1];pt.t.split(/\s+/).filter(Boolean).forEach((w,wi)=>{const att=wi===0&&prev&&!/\s$/.test(prev.t)&&!/^\s/.test(pt.t);out.push({w,key:!!pt.key,i:idx++,att,pu:/^[.,;:!?)“”„"]+$/.test(w)})})});return out}
function allTokens(it){let g=0;return it.paras.map(p=>tokens(p).map(t=>({w:t.w,key:t.key,att:t.att,pu:t.pu,i:g++})))}
function readKeys(it){const k=[];allTokens(it).forEach(ps=>ps.forEach(t=>{if(t.key)k.push(t.i)}));return k}

function ptsLabel(it){if(it.type==='read'||!it.pts)return'';return it.level==='v'?'+'+fmt(it.pts)+' '+(S.lang==='vi'?'điểm thưởng':'Bonus'):fmt(it.pts)+' '+(S.lang==='vi'?'điểm':(it.pts===1?'Punkt':'Punkte'))}
function tipBlock(it){return it.tip?`<details class="tip"><summary>💡 ${u('tip')}</summary><div>${rich(T(it.tip))}</div></details>`:''}
function wg(it,i,p){if(!p.w&&!p.s)return'';const ch=(p.w||[]).concat(p.s||[]).map(x=>`<button type="button" class="chip" data-chip="${esc(x)}" data-for="${it.id}_${i}">${esc(x)}</button>`).join('');return`<details class="wg"><summary>✏️ ${u('words')}</summary><div class="chips">${ch}</div></details>`}
const BODY={
 info(it){return`<div class="info">${it.html||''}</div>`+(it.vi&&S.lang==='vi'?`<div class="vis">${rich(it.vi)}</div>`:'')},
 read(it){const per=allTokens(it);const a=A(it.id);const sel=a.m||[];
  const ps=per.map(ts=>`<p class="rd${a.chk?' chk':''}" data-rd="${it.id}">`+ts.map(t=>t.pu&&t.att?esc(t.w):(t.att?'':' ')+`<span class="w${t.key?' key':''}${sel.indexOf(t.i)>=0?' sel':''}" data-w="${t.i}" role="button" tabindex="0">${esc(t.w)}</span>`).join('').trim()+'</p>').join('');
  const q=it.quiz;let quiz='';
  if(q&&a.chk){quiz=`<div class="q" data-part="0"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="radio" name="${it.id}_q" data-k="q" value="${j}"${a.q!=null&&+a.q===j?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}
  return`<p class="vis">${u('tap')}</p>${ps}<div class="actions"><button type="button" class="primary" data-act="rdchk" data-id="${it.id}">${u('chkmark')}</button></div>${quiz}`+(it.vi&&S.lang==='vi'?`<p class="vis">${rich(it.vi)}</p>`:'')},
 mc(it){const a=A(it.id);return it.qs.map((q,i)=>{const multi=Array.isArray(q.a);const cur=String(a['p'+i]==null?'':a['p'+i]).split(',');
  return`<div class="q" data-part="${i}"><p class="qt">${rich(T(q.q))}</p><div class="opts">`+q.o.map((o,j)=>`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${it.id}_${i}" data-k="p${i}" ${multi?'data-multi="1"':''} value="${j}"${cur.indexOf(String(j))>=0?' checked':''}><span>${rich(o)}</span></label>`).join('')+'</div></div>'}).join('')},
 tf(it){const a=A(it.id);return it.st.map((s,i)=>`<div class="tfrow" data-part="${i}"><div class="st">${rich(T(s.t))}</div><div class="opts">`+['t','f'].map(v=>`<label class="opt"><input type="radio" name="${it.id}_${i}" data-k="p${i}" value="${v}"${a['p'+i]===v?' checked':''}><span>${u(v==='t'?'richtig':'falsch')}</span></label>`).join('')+'</div></div>').join('')},
 gap(it){const a=A(it.id);let html=esc(it.text);const bank=it.bank?shuf(it.bank,it.id):null;
  it.gaps.forEach((g,i)=>{const v=a['p'+i]||'';let el;const o=g.o?shuf(g.o,it.id+i):bank;
   if(o)el=`<select data-k="p${i}" data-part="${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>';
   else el=`<input class="in" type="text" data-k="p${i}" data-part="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" size="${Math.max(8,String([].concat(g.a)[0]).length+2)}" value="${esc(v)}">`;
   html=html.replace('{'+i+'}',el)});
  return`<p class="gaptxt">${html.replace(/\n/g,'<br>')}</p>`},
 match(it){const a=A(it.id);const o=matchOpts(it);return it.rows.map((r,i)=>`<div class="mrow" data-part="${i}"><div><b>${rich(T(r.l))}</b></div><select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${a['p'+i]===x?' selected':''}>${esc(x)}</option>`).join('')+'</select></div>').join('')},
 table(it){const a=A(it.id);let n=0;return it.rows.map(r=>{const cols=r.length;return`<div class="trow" style="--n:${cols}">`+r.map((c,ci)=>{
   if(c&&typeof c==='object'){const i=n++;const o=c.o||(it.colOpts||[])[ci];const v=a['p'+i]||'';const f=o?`<select data-k="p${i}"><option value="">${u('choose')}</option>`+o.map(x=>`<option${x===v?' selected':''}>${esc(x)}</option>`).join('')+'</select>':`<input class="in" type="text" data-k="p${i}" value="${esc(v)}" autocomplete="off">`;
    return`<div class="fld" data-part="${i}"><label>${esc(it.cols[ci])}</label>${f}</div>`}
   return`<div class="fld"><label>${esc(it.cols[ci])}</label><div>${rich(T(c))}</div></div>`}).join('')+'</div>'}).join('')},
 calc(it){const a=A(it.id);return it.parts.map((p,i)=>`<div class="crow" data-part="${i}"><p class="qt">${rich(T(p.q))}</p><input class="in" type="text" inputmode="decimal" data-k="p${i}" value="${esc(a['p'+i]||'')}" autocomplete="off" placeholder="0,00"><span class="u">${esc(p.u||'')}</span>${p.work?`<textarea class="in" data-k="p${i}w" rows="2" style="min-height:4rem" placeholder="${S.lang==='vi'?'Cách tính (viết ra)':'Rechenweg (aufschreiben)'}">${esc(a['p'+i+'w']||'')}</textarea>`:''}</div>`).join('')},
 free(it){const a=A(it.id);const sh=S.shown[it.id];return it.parts.map((p,i)=>`<div class="fpart"><p class="qt">${rich(T(p.q))}</p>${wg(it,i,p)}<textarea class="in" id="${it.id}_${i}" data-k="p${i}" rows="3" placeholder="…">${esc(a['p'+i]||'')}</textarea>`+(sh?`<div class="model"><div class="t">${u('model').replace(/ anzeigen| ?$/,'')}</div>${rich(T(p.m))}</div>`:'')+'</div>').join('')+(sh?`<div class="rate"><span style="flex:1 1 100%;font-weight:600">${u('rate')}</span>`+['y','p','n'].map(v=>`<button type="button" data-rate="${v}" data-k="r" class="${a.r===v?'on':''}">${u(v)}</button>`).join('')+'</div>':'')}
};

function progress(){const its=D.items.filter(it=>visible(it)&&counted(it));let n=0;its.forEach(it=>{if(grade(it).filled)n++});
 const pc=its.length?Math.round(n/its.length*100):0;$('#barfill').style.width=pc+'%';$('#cnt').textContent=n+' / '+its.length+' '+u('progress');
 $$('.card').forEach(c=>{const it=D.items.find(x=>x.id===c.dataset.id);c.classList.toggle('done',counted(it)&&grade(it).filled)});
 [25,50,75,100].forEach(m=>{if(pc>=m&&!(S.toast||{})[m]&&n>0){S.toast=S.toast||{};S.toast[m]=1;if(m===100||m===50)toast(m+' % ✓')}})}
function paint(it){const c=$('#c_'+it.id);if(!c)return;const g=grade(it);const fb=$('.fb',c);
 if(it.type==='read'){const a=A(it.id);const rd=$$('.rd',c);rd.forEach(r=>r.classList.add('chk'));
  let h=`${g.found===g.total&&!g.extra?'✔':'ℹ️'} ${g.found} ${u('of')} ${g.total} ${u('found')}`+(g.extra?`, ${g.extra} ${u('extra')}`:'');fb.className='fb '+(g.found===g.total&&!g.extra?'ok':'mid');fb.innerHTML=h;
  const q=it.quiz;if(q&&a.q!=null){const qq=$('.q',c);const ok=+a.q===q.a;qq.classList.toggle('ok',ok);qq.classList.toggle('bad',!ok);fb.innerHTML+=`<small>${ok?'✓':'✗'} ${rich(T(q.why))}</small>`}return}
 if(!S.checked[it.id]||it.type==='info')return;
 if(it.type==='free'){return}
 const right=g.parts.filter(p=>p.ok===true).length;
 g.parts.forEach((p,i)=>{$$('[data-part="'+i+'"]',c).forEach(el=>{el.classList.remove('ok','bad');if(p.has)el.classList.add(p.ok===true?'ok':'bad');else el.classList.add('bad')})});
 fb.className='fb '+(right===g.parts.length?'ok':right?'mid':'bad');
 fb.innerHTML=(right===g.parts.length?'✓ '+u('allright'):right+' '+u('of')+' '+g.parts.length+' '+u('right')+'. '+(g.filled?'':u('fill')+' ')+(right<g.parts.length?`<small>${u('notall')}</small>`:''))}

  if(it.level==='v'){bg+=g.got;bm+=g.max}else{got+=g.got;max+=g.max}
  const nr=g.parts.filter(r=>r.ok===true).length;const full=it.pts?g.got>=g.max-0.001:nr===g.parts.length;const cls=full?'g':(it.pts?g.got>0:nr>0)?'m':'r';
  let li=g.parts.map((r,i)=>{const p=r.p;let line='';const lab=it.type==='match'?T(p.l):it.type==='table'?(it.rows[p.ri]&&T(it.rows[p.ri][0])||'')+' ['+it.cols[p.ci]+']':it.type==='gap'?'('+(i+1)+')':T(p.q||p.t||'')||(i+1);
   const mark=r.ok===true?'✓':r.ok===0.5?'◐':'✗';
   line=`<li><b>${mark}</b> ${rich(String(lab).slice(0,200))}<br><span class="${r.ok===true?'':'mine'}">${u('mine')}: ${r.mine?rich(r.mine):u('empty')}</span>`;

 const el=$('#result');el.classList.remove('hide');
 el.innerHTML=`<h2>${u('res')}</h2><p><b>${u('name')}:</b> ${esc(S.name)||'______'} &nbsp; <b>${u('date')}:</b> ${esc(S.date)} &nbsp; <b>${u('level')}:</b> ${u(S.level==='v'?'vert':'basis')}</p><p>${esc(D.title)}</p><div class="score">${fmt(got)} ${u('of')} ${fmt(max)} ${u('pts')}</div>`+(S.level==='v'&&bm?`<p><b>${u('bonus')}:</b> +${fmt(bg)} (${fmt(bm)})</p>`:'')+html+`<p class="noprint"><button type="button" id="b_next">${u('next')}</button></p>`;
 $('#b_next').onclick=()=>{S=def();clearStore();renderAll();window.scrollTo(0,0)};
 S.sub=true;save()}

/* Test-Hilfe (für Lehrkraft-Prüfung per Konsole): LF5.solve(true|false) */
window.LF5={S:()=>S,grade:id=>grade(D.items.find(x=>x.id===id)),
 solve(right){D.items.forEach(it=>{const a=A(it.id);parts(it).forEach((p,i)=>{const k='p'+i;
  switch(it.type){
   case'mc':{const sa=[].concat(p.a);a[k]=right?sa.join(','):String((sa[0]+1)%p.o.length);break}
   case'tf':a[k]=(right===p.a)?'t':'f';break;
