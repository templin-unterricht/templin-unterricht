<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF 4 · Digitales Arbeitsblatt</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + .5rem) 1rem .4rem}
#bar .row{display:flex;align-items:center;gap:.6rem;max-width:56rem;margin:0 auto}
#bar .ttl{font-weight:700;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{height:.7rem;background:#e6e3da;border-radius:1rem;overflow:hidden;max-width:56rem;margin:.35rem auto 0}
#progf{height:100%;width:0;background:var(--pri);transition:width .4s}
#progt{font-size:.8rem;color:var(--mute);max-width:56rem;margin:.1rem auto 0}
#langs{display:flex;gap:.4rem;overflow-x:auto;max-width:56rem;margin:.35rem auto 0;padding-bottom:.15rem;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;min-height:44px;padding:0 .9rem;border:2px solid var(--line);background:#fff;border-radius:2rem;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;margin:0 0 1rem}
.card h2{font-size:1.25rem;margin:0 0 .4rem;line-height:1.3}
.card h2 .nr{display:inline-block;background:var(--pri);color:#fff;border-radius:.5rem;padding:0 .5rem;margin-right:.4rem;font-size:.95rem}
.vtag{display:inline-block;background:#6a3fa0;color:#fff;border-radius:.5rem;padding:0 .5rem;font-size:.85rem;margin-left:.3rem}
.card.v{border-color:#6a3fa0;background:#faf6ff}
.tr{font-size:.9rem;color:#4a5a66;background:#f1f6f9;border-left:4px solid #9cc3d5;border-radius:.4rem;padding:.3rem .6rem;margin:.3rem 0 .5rem;line-height:1.5}
.tr[dir=rtl]{border-left:0;border-right:4px solid #9cc3d5}
.tr[lang=ti]{font-family:"Kefa","Noto Sans Ethiopic",sans-serif}
.tr[lang=vi]{line-height:1.65}
small.b{display:block;font-size:.72rem;font-weight:400;opacity:.9;line-height:1.2}
.in{display:block;width:100%;min-height:48px;font:inherit;font-size:1rem;padding:.55rem .7rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink)}
input.in,select.in{font-size:1rem}
textarea.in{min-height:5.5rem;resize:vertical}
.btn{min-height:48px;padding:.4rem 1.1rem;border:0;border-radius:.8rem;background:var(--pri);color:#fff;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin:.3rem .4rem .3rem 0}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.gray{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.big{min-height:56px;font-size:1.1rem}
.btn:active,.pill:active,.opt:active,.ch:active{transform:scale(.97)}
.tipb{min-height:48px;min-width:48px;border-radius:2rem;border:2px solid var(--warn);background:var(--warnbg);font:inherit;font-size:1rem;cursor:pointer;padding:0 .9rem;float:right;margin:0 0 .3rem .5rem}
.tipbox{background:var(--warnbg);border:2px solid var(--warn);border-radius:.8rem;padding:.5rem .8rem;margin:.4rem 0}
.q{margin:.8rem 0 .2rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:.45rem;margin:.3rem 0}
.opt{min-height:48px;text-align:left;padding:.5rem .8rem;border:2px solid var(--line);background:#fff;border-radius:.8rem;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--pri);background:var(--pri2);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.tbl{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:1rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.4rem .3rem;text-align:left;vertical-align:middle}
.tbl.info th{background:#eef3f6}
.tbl.info td,.tbl.info th{border:1px solid var(--line);padding:.4rem .5rem}
.tbl td.c{text-align:center;white-space:nowrap}
.ch{min-width:48px;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:.7rem;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer;margin:2px}
.ch.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.sol{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
tr.rok td{background:var(--okbg)}tr.rno td{background:var(--badbg)}
.fb{border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0;font-size:1rem}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb.part{background:var(--warnbg);border:1px solid var(--warn)}
.sit{background:#eef3f6;border-left:5px solid var(--pri);border-radius:.5rem;padding:.5rem .8rem;margin:.5rem 0}
.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#23303a;color:#fff;padding:.6rem 1.1rem;border-radius:2rem;z-index:99;font-size:1rem;max-width:90%}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}
.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}
#set.open{display:block}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row2 label{font-weight:600;min-width:7rem}
.nowrap{white-space:nowrap}
#report{display:none}
@media (max-width:600px){main{padding-top:8.2rem}.card{padding:.8rem}h1{font-size:1.35rem}.tbl{font-size:.95rem}}
@media print{
 body{background:#fff;padding:0;font-size:11pt}
 #bar,#set,main,.toast,.dlg,.noprint{display:none!important}
 #report{display:block!important}
 #report h1{font-size:16pt}
 #report table{width:100%;border-collapse:collapse;font-size:10pt}
 #report td,#report th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

.tbl.selt td:first-child{width:55%}
.tbl.selt select.gapsel{width:100%;min-width:0}

</style>
</head>

{k:'read',id:'r1',h:'Zum Nachlesen: Pflichtangaben auf Lebensmitteln',sum:'MHD = mindestens haltbar bis, danach oft noch gut. Verbrauchsdatum = zu verbrauchen bis, danach nicht mehr verkaufen.',
 paras:['Die EU-Lebensmittelinformationsverordnung (LMIV) verlangt auf Lebensmitteln: die [[Bezeichnung]], das [[Zutatenverzeichnis]], die [[Nettofüllmenge]], das [[Mindesthaltbarkeitsdatum]] oder [[Verbrauchsdatum]], Name und [[Anschrift]] des Lebensmittelunternehmers und die [[Nährwertdeklaration]].','Im Zutatenverzeichnis stehen die Zutaten nach Gewichtsanteil geordnet. [[Allergene]] (z. B. Milch, Gluten, Nüsse, Soja) werden hervorgehoben.','Beim [[MHD]] („mindestens haltbar bis“) ist die Ware danach oft noch essbar und darf mit Hinweis verkauft werden. Das [[Verbrauchsdatum]] („zu verbrauchen bis“) steht bei leicht verderblicher Ware wie Hackfleisch: Danach darf sie [[nicht mehr verkauft]] werden.','Auch andere Waren haben Pflichtangaben, z. B. Textilien die Faserzusammensetzung („97 % Baumwolle, 3 % Elasthan“) und Elektrogeräte das Energielabel.'],
 html:'<table class="tbl info"><tr><th>Pflichtangabe</th><th>Hinweis</th></tr><tr><td>Bezeichnung des Lebensmittels</td><td>z. B. „Holländischer Gouda, mittelalt“</td></tr><tr><td>Zutatenverzeichnis</td><td>nach Gewichtsanteil geordnet; Allergene werden hervorgehoben</td></tr><tr><td>Nettofüllmenge</td><td>in g, kg, ml oder l</td></tr><tr><td>Mindesthaltbarkeitsdatum oder Verbrauchsdatum</td><td>MHD: danach oft noch essbar. Verbrauchsdatum: danach nicht mehr verkaufen.</td></tr><tr><td>Name und Anschrift des Lebensmittelunternehmers</td><td>Hersteller, Verpacker oder Händler</td></tr><tr><td>Nährwertdeklaration</td><td>Energie, Fett, Kohlenhydrate, Zucker, Eiweiß, Salz je 100 g</td></tr><tr><td>weitere</td><td>Losnummer, Aufbewahrungshinweise, Herkunft (z. B. bei Obst, Gemüse, Fleisch)</td></tr></table>',
 q:{q:'Hackfleisch trägt ein Verbrauchsdatum, das abgelaufen ist. Was gilt?',o:['Es darf nicht mehr verkauft werden.','Es darf mit Hinweis weiter verkauft werden.','Es darf reduziert verkauft werden.'],a:0}},
{k:'read',id:'r2',h:'Zum Nachlesen: Zeichen, Siegel und die GTIN',sum:'CE ist kein Prüfzeichen, GS schon. Die GTIN ist eine Kennung für das Warenwirtschaftssystem.',
 paras:['Eine [[Marke]] (Name, Logo) unterscheidet die Ware eines Herstellers von anderen und ist durch das Markengesetz geschützt. Ein [[Gütezeichen]] (z. B. RAL) bedeutet, dass Waren verschiedener Hersteller Mindestanforderungen erfüllen.','[[Umwelt- und Sozialzeichen]] zeigen ökologische Herstellung oder faire Bedingungen (Blauer Engel, EU-Bio-Siegel, Fairtrade). Ein [[Prüfzeichen]] wie GS („geprüfte Sicherheit“) zeigt: Eine unabhängige Stelle hat die Sicherheit geprüft.','Die [[CE-Kennzeichnung]] ist Pflicht für viele technische Produkte in der EU. Der Hersteller erklärt damit selbst, dass die EU-Vorschriften erfüllt sind – das ist [[kein Prüfzeichen]]. Warnzeichen sind rot umrandete Rauten (entzündbar, ätzend, umweltgefährlich).','Die [[GTIN-13]] ist die 13-stellige Nummer unter dem Strichcode. Die Stellen 1–2 sind das [[Länderpräfix]] (40–44 = Deutschland), 3–7 die Betriebsnummer, 8–12 die Artikelnummer und Stelle 13 die [[Prüfziffer]]. Das Präfix zeigt nicht unbedingt das Herkunftsland der Ware.','Vorteile der GTIN: Die Kasse liest den Preis aus der Datenbank (PLU) – kein Einzeletikett nötig, Preisänderungen zentral, schnelles und fehlerfreies Kassieren, genaue Daten fürs Warenwirtschaftssystem.'],
 html:'<table class="tbl info"><tr><th>Stellen</th><th>Bedeutung</th><th>im Beispiel</th></tr><tr><td>1–2</td><td>Länderpräfix</td><td>40</td></tr><tr><td>3–7</td><td>Betriebsnummer des Herstellers</td><td>01234</td></tr><tr><td>8–12</td><td>Artikelnummer des Herstellers</td><td>56789</td></tr><tr><td>13</td><td>Prüfziffer – erkennt Lesefehler</td><td>1</td></tr></table><p class="meta">Beispiel-GTIN: 40 01234 56789 1</p>',
 q:{q:'Was bedeutet die CE-Kennzeichnung?',o:['Der Hersteller erklärt, dass die EU-Vorschriften erfüllt sind.','Eine unabhängige Stelle hat die Sicherheit geprüft.','Das Produkt ist besonders umweltfreundlich.'],a:0}},
{k:'task',id:'t1',n:'Aufgabe',h:'Richtig oder falsch?',hk:'c.tf.h',intro:'Tippe ✔ (richtig) oder ✘ (falsch).',ik:'c.tf.i',tip:'Schau in die Tabellen im Nachlesen.',ex:'Prüfe jede Aussage noch einmal im Nachlesen.',items:[
 {t:'tf',id:'t1.1',rows:[['Allergene werden im Zutatenverzeichnis hervorgehoben.',true],['Das GS-Zeichen ist ein Prüfzeichen.',true],['Die CE-Kennzeichnung ist ein Prüfzeichen einer unabhängigen Stelle.',false],['Die letzte Stelle der GTIN-13 ist die Prüfziffer.',true]]}]},
{k:'task',id:'a3',n:'Aufgabe 3',h:'Geführte Übung: Welches Zeichen ist gemeint?',intro:'Lies jede Beschreibung. Welche Art von Zeichen ist gemeint?',ik:'a3.i',tip:'Frage dich: Wer bestätigt das? Eine unabhängige Stelle, der Hersteller selbst oder ein Siegel für Umwelt und Fairness?',ex:'Umweltzeichen: umweltfreundlich. EU-Bio-Siegel: ökologischer Landbau. GS: unabhängig geprüfte Sicherheit. CE: Hersteller erklärt selbst. Marke: Name und Logo. Fairtrade: faire Preise und Arbeitsbedingungen. EU-Energielabel: Skala A bis G.',items:[
 {t:'sel',id:'a3.1',o:['Umweltzeichen (z. B. Blauer Engel)','EU-Bio-Siegel (Umweltzeichen)','Prüfzeichen GS („geprüfte Sicherheit“)','CE-Kennzeichnung','Marke','Fairtrade-Siegel (Sozialsiegel)','EU-Energielabel'],rows:[['1 Das Zeichen bestätigt: Ein Produkt ist umweltfreundlicher als vergleichbare Produkte (z. B. Recyclingpapier, Farben).',0],['2 Das Zeichen zeigt: Das Lebensmittel stammt aus ökologischem Landbau nach EU-Regeln.',1],['3 Das Zeichen zeigt: Eine unabhängige Stelle hat die Sicherheit eines Geräts geprüft.',2],['4 Der Hersteller erklärt damit, dass sein Produkt die Vorschriften der EU erfüllt – ohne Prüfung durch eine unabhängige Stelle.',3],['5 Der Name und das Logo eines bestimmten Herstellers, geschützt durch das Markengesetz.',4],['6 Das Zeichen bestätigt faire Preise und Arbeitsbedingungen für die Erzeuger.',5],['7 Das Etikett zeigt den Energieverbrauch eines Geräts auf einer Skala von A bis G.',6]]}]},
{k:'task',id:'a4',n:'Aufgabe 4',h:'Geführte Übung: MHD oder Verbrauchsdatum?',intro:'Beantworte die Fragen. Denke an den Unterschied zwischen MHD und Verbrauchsdatum.',ik:'a4.i',tip:'MHD: danach oft noch gut, Verkauf mit Hinweis möglich. Verbrauchsdatum: danach nicht mehr verkaufen. Allergene stehen im Zutatenverzeichnis.',ex:'MHD abgelaufen: nur, wenn einwandfrei, meist reduziert und mit Hinweis. Verbrauchsdatum abgelaufen: nicht verkaufen.',items:[
 {t:'mc',id:'a4.1',q:'4.1 Heute ist der 10. März. Ein Joghurt hat „mindestens haltbar bis 08.03.“. Darf er noch verkauft werden?',o:['Ja, wenn er einwandfrei ist – meist reduziert und mit Hinweis','Nein, nie'],a:0,ex:'Der Händler trägt die Verantwortung.'},
 {t:'mc',id:'a4.2',q:'4.2 Frisches Hackfleisch trägt „zu verbrauchen bis 09.03.“. Darf es am 10. März noch verkauft werden?',o:['Ja, mit Hinweis','Nein – nach Ablauf des Verbrauchsdatums darf es nicht mehr verkauft werden'],a:1},
 {t:'free',id:'a4.3',q:'4.3 Eine Kundin mit Nussallergie fragt, ob Nüsse in den Keksen sind. Wo schaust du nach – und wie antwortest du?',model:'im Zutatenverzeichnis, Allergene sind hervorgehoben; auch „Kann Spuren enthalten“ beachten. Ehrlich antworten, im Zweifel nicht raten.'}]},
{k:'task',id:'a5',n:'Aufgabe 5',h:'Freie Übung: Zeichen-Jagd (2 Leistungspunkte)',intro:'Sammle in deinem Ausbildungsbetrieb fünf verschiedene Zeichen auf Waren oder Verpackungen (Foto oder Skizze, keine Personen). Stelle sie deiner Gruppe vor. Schreibe hier eines davon auf: Was bedeutet das Zeichen – und wie nutzt du es im Verkaufsgespräch?',ik:'a5.i',tip:'Sage erst, was das Zeichen bedeutet. Dann formuliere einen Satz für das Verkaufsgespräch.',ex:'Ein gutes Beispiel nennt das Zeichen, die Art (z. B. Umweltzeichen) und einen Satz in wörtlicher Rede.',items:[
 {t:'free',id:'a5.1',pts:2,q:'Zeichen – Art – So nutze ich es im Verkaufsgespräch (wörtliche Rede):',nq:1,model:'Beispiel: Blauer Engel – Umweltzeichen – „Dieses Papier ist mit dem Blauen Engel ausgezeichnet – es besteht aus Altpapier.“'}]},
{k:'task',id:'a6',n:'Aufgabe 6',h:'Prüfungs-Check: im Stil der Prüfung (8 Punkte · etwa 8 Minuten)',hk:'c.pruef.h',intro:'Lies die Situation. Beantworte die Fragen wie in der Prüfung.',ik:'c.pruef.i',tip:'6.1/6.2: Denke an Kasse, Preis und Warenwirtschaftssystem. 6.3: Nenne das Zeichen, erkläre es und sprich den Kunden direkt an.',tk:'a6.t',ex:'6.3 bringt Punkte für das Zeichen, die Erklärung und die wörtliche Rede.',
 sit:'<b>Situation:</b> Sie sind an der Kasse der Kaufhaus Hansa GmbH eingesetzt. Beim Scannen fällt Ihnen der Strichcode mit der Nummer 4001234567891 auf.',items:[
 {t:'free',id:'a6.1',pts:2,q:'6.1 Erläutern Sie die Bedeutung dieses Strichcodes für die Kaufhaus Hansa GmbH. (2 Punkte)',model:'Der Strichcode (GTIN-13) ist eine einmalige Kennung des Artikels für das Warenwirtschaftssystem; an der Kasse wird darüber der Preis abgerufen und der Verkauf erfasst.'},
 {t:'free',id:'a6.2',pts:2,q:'6.2 Nennen Sie zwei Vorteile der GTIN für die Kaufhaus Hansa GmbH. (2 Punkte)',model:'kein Einzeletikettieren, zentrale Preisänderung, schnelles fehlerfreies Kassieren, genaue Verkaufsdaten'},
 {t:'free',id:'a6.3',pts:4,q:'6.3 Eine Kundin fragt, ob der Kinderwecker sicher ist. Nennen Sie ein Zeichen, auf das Sie hinweisen können, und formulieren Sie Ihre Antwort in wörtlicher Rede. (4 Punkte)',model:'GS-Zeichen: „Der Wecker trägt das GS-Zeichen – eine unabhängige Stelle hat die Sicherheit geprüft.“ (Zeichen 1 P., Erklärung 1 P., wörtliche Rede 2 P.)'}]},
{k:'task',id:'a7',n:'Aufgabe 7',h:'Für Profis',hk:'c.profis.h',intro:'Schwierigere Aufgaben. Rechne und begründe.',ik:'c.profis.i',tip:'7.1: Multipliziere die Ziffern abwechselnd mit 1 und 3 und addiere alles. Die Prüfziffer ergänzt die Summe zur nächsten Zehnerzahl. 7.2: Wer vergibt die Präfix-Nummer?',tk:'a7.t',ex:'Das Präfix zeigt, welche Organisation die Nummer vergeben hat, nicht unbedingt das Herkunftsland.',items:[
 {t:'calc',id:'a7.1',pts:2,nq:1,q:'7.1 Berechnen Sie die Prüfziffer der GTIN 400123456789_.',a:1,tol:0.001,unit:'',steps:['Ziffern abwechselnd mit 1 und 3 multiplizieren (von links, beginnend mit 1):','4·1 + 0·3 + 0·1 + 1·3 + 2·1 + 3·3 + 4·1 + 5·3 + 6·1 + 7·3 + 8·1 + 9·3','= 4 + 0 + 0 + 3 + 2 + 9 + 4 + 15 + 6 + 21 + 8 + 27 = 99','Bis zur nächsten Zehnerzahl (100) fehlt 1 → Prüfziffer 1 (4001234567891).']},
 {t:'free',id:'a7.2',q:'7.2 „Die GTIN beginnt mit 40 – also ist das Produkt in Deutschland hergestellt.“ Beurteilen Sie diese Aussage eines Kunden.',model:'Falsch: Das Präfix zeigt nur, welche GS1-Organisation die Nummer vergeben hat. Die Ware kann im Ausland hergestellt sein. Das Herkunftsland steht – wo vorgeschrieben – als eigene Angabe auf der Verpackung.'}]},
{k:'task',id:'v1',lvl:'v',n:'Vertiefung',h:'Warum ist das so? Rechne mit!',hk:'v1.h',intro:'Rechne und begründe. Vergleiche danach mit der Musterlösung.',ik:'v1.i',tip:'V1: Gleiche Regel wie in Aufgabe 7.1. V2 und V3: Beginne mit „Weil …“.',tk:'v1.t',ek:'c.v.e',items:[
 {t:'calc',id:'v1.1',pts:1,nq:1,q:'V1 Berechnen Sie die Prüfziffer der GTIN 400123456780_.',a:8,tol:0.001,unit:'',steps:['4·1 + 0·3 + 0·1 + 1·3 + 2·1 + 3·3 + 4·1 + 5·3 + 6·1 + 7·3 + 8·1 + 0·3','= 4 + 0 + 0 + 3 + 2 + 9 + 4 + 15 + 6 + 21 + 8 + 0 = 72','Bis zur nächsten Zehnerzahl (80) fehlen 8 → Prüfziffer 8 (4001234567808).']},
 {t:'free',id:'v1.2',pts:2,q:'V2 Warum ist die CE-Kennzeichnung kein Prüfzeichen, das GS-Zeichen aber schon?',model:'Bei CE erklärt der Hersteller selbst, dass sein Produkt die EU-Vorschriften erfüllt – ohne Prüfung durch eine unabhängige Stelle. Beim GS-Zeichen hat eine unabhängige Stelle die Sicherheit geprüft.'},
 {t:'free',id:'v1.3',pts:2,q:'V3 Begründe: Warum darf Hackfleisch nach dem Verbrauchsdatum nicht mehr verkauft werden, ein Joghurt nach dem MHD aber unter Umständen schon?',model:'Hackfleisch ist leicht verderblich; nach dem Verbrauchsdatum ist es nicht mehr sicher. Beim MHD ist die Ware danach oft noch einwandfrei und essbar; der Händler prüft sie, verkauft sie meist reduziert und mit Hinweis und trägt die Verantwortung.'}]},

]};
var TR={
'title':['Ghi nhãn hàng hóa và GTIN','Etiquetado de mercancías y GTIN','Rotulagem de mercadorias e GTIN','Маркування товарів і GTIN','ምልክት ኣቕሑትን GTIN','Маркировка товаров и GTIN','وسم البضائع وGTIN','Ürün etiketleme ve GTIN'],
'can.0':['Kể thông tin bắt buộc trên thực phẩm và phân biệt MHD (hạn dùng tốt nhất trước) với Verbrauchsdatum (hạn sử dụng).','Nombrar las indicaciones obligatorias en alimentos y distinguir MHD (consumo preferente) de Verbrauchsdatum (fecha de caducidad).','Nomear as indicações obrigatórias em alimentos e distinguir MHD (consumo preferencial) de Verbrauchsdatum (data-limite de consumo).','Назвати обов’язкові дані на харчових продуктах і розрізняти MHD (бажаний термін придатності) та Verbrauchsdatum (кінцевий термін споживання).','ግዱድ ሓበሬታታት ኣብ መግቢ ጥቀስ MHD ን Verbrauchsdatum ን ፍለይ።','Назвать обязательные данные на продуктах питания и различать MHD (рекомендуемый срок годности) и Verbrauchsdatum (дату употребления).','ذكر البيانات الإلزامية على الأغذية والتمييز بين MHD (يفضّل استهلاكه قبل) وVerbrauchsdatum (تاريخ الاستهلاك).','Gıdalardaki zorunlu bilgileri söylemek ve MHD (tavsiye edilen son tüketim) ile Verbrauchsdatum’u (son tüketim tarihi) ayırt etmek.'],
'can.1':['Phân biệt nhãn hiệu, dấu chất lượng, dấu môi trường và dấu kiểm định, và giải thích cấu tạo của GTIN.','Distinguir marcas, sellos de calidad, ambientales y de ensayo y explicar la estructura del GTIN.','Distinguir marcas, selos de qualidade, ambientais e de ensaio e explicar a estrutura do GTIN.','Розрізняти марки, знаки якості, екознаки й знаки випробувань та пояснювати будову GTIN.','ምልክታት፣ ጽሬት፣ ከባቢ ከምኡውን ፈተና ምልክታት ፍለይ ነቲ ቅርጺ GTIN ግለጽ።','Различать марки, знаки качества, экознаки и знаки испытаний и объяснять структуру GTIN.','التمييز بين العلامات وأختام الجودة والبيئة والاختبار وشرح بنية GTIN.','Marka, kalite, çevre ve test işaretlerini ayırt etmek ve GTIN yapısını açıklamak.'],
'a1.t':['Hãy nghĩ đến nhãn giá, Grundpreis (giá cơ sở) và giá kệ ở Modul 10.','Piensa en la etiqueta, el Grundpreis (precio base) y el precio del estante del Modul 10.','Pensa na etiqueta, no Grundpreis (preço base) e no preço da prateleira do Modul 10.','Згадай цінник, Grundpreis (базову ціну) і ціну на полиці з Modul 10.','ምልክት ዋጋ፣ Grundpreis ን ዋጋ መደርደሪን ካብ Modul 10 ዘክር።','Вспомни ценник, Grundpreis (базовую цену) и цену на полке из Modul 10.','تذكّر بطاقة السعر وGrundpreis (السعر الأساسي) وسعر الرف من Modul 10.','Modul 10’daki fiyat etiketini, Grundpreis’i (birim fiyat) ve raf fiyatını hatırla.'],
'a1.e':['Xem lại Modul 10: Gesamtpreis, Grundpreis và giá kệ sai.','Repasa el Modul 10: Gesamtpreis, Grundpreis y precios de estante erróneos.','Revê o Modul 10: Gesamtpreis, Grundpreis e preços de prateleira errados.','Повтори Modul 10: Gesamtpreis, Grundpreis і неправильні ціни на полиці.','Modul 10 ደጊምካ ርአ: Gesamtpreis፣ Grundpreis ን ጌጋ ዋጋ መደርደሪን።','Повтори Modul 10: Gesamtpreis, Grundpreis и неверные цены на полке.','راجع Modul 10: Gesamtpreis وGrundpreis وأسعار الرف الخاطئة.','Modul 10’a tekrar bak: Gesamtpreis, Grundpreis ve yanlış raf fiyatları.'],
'a1.1.q':['1.1 Gesamtpreis (tổng giá) gồm những gì?','1.1 ¿Qué forma parte del Gesamtpreis (precio total)?','1.1 O que faz parte do Gesamtpreis (preço total)?','1.1 Що входить до Gesamtpreis (загальної ціни)?','1.1 እንታይ ክፋል Gesamtpreis እዩ?','1.1 Что входит в Gesamtpreis (общую цену)?','1.1 ما الذي يدخل في Gesamtpreis (السعر الإجمالي)؟','1.1 Gesamtpreis’e (toplam fiyat) ne dahildir?'],
'a1.2.q':['1.2 Grundpreis của phô mai được ghi theo đơn vị nào?','1.2 ¿En qué unidad se indica el Grundpreis del queso?','1.2 Em que unidade se indica o Grundpreis do queijo?','1.2 В якій одиниці вказують Grundpreis сиру?','1.2 Grundpreis ናይ ኣይቲ ብኣየናይ ዓቐን ይግለጽ?','1.2 В какой единице указывают Grundpreis сыра?','1.2 بأي وحدة يُبيَّن Grundpreis الجبن؟','1.2 Peynirin Grundpreis’i hangi birimle belirtilir?'],
'a1.3.q':['1.3 Khách có quyền đòi giá kệ sai, thấp hơn không?','1.3 ¿Tiene un cliente derecho a un precio de estante erróneo y más bajo?','1.3 Um cliente tem direito a um preço de prateleira errado e mais baixo?','1.3 Чи має клієнт право на неправильну, нижчу ціну на полиці?','1.3 ዓሚል መሰል ንጌጋ ትሕቲ ዋጋ መደርደሪ ኣለዎ ዶ?','1.3 Есть ли у клиента право на неверную, более низкую цену на полке?','1.3 هل للزبون حق في سعر رف خاطئ أقل؟','1.3 Müşterinin yanlış, daha düşük raf fiyatı üzerinde hakkı var mı?'],
'a2.h':['Bao bì cho biết điều gì?','¿Qué revela el envase?','O que revela a embalagem?','Що розкриває упаковка?','እቲ ዓቕሚ እንታይ የርኢ?','Что рассказывает упаковка?','ماذا تكشف العبوة؟','Ambalaj neyi gösteriyor?'],
'a2.i':['Lấy một bao bì thực phẩm từ cặp của em hoặc từ hộp của cô giáo. Tìm các thông tin và viết ra những gì em thấy: Bezeichnung (tên), Zutatenverzeichnis (danh sách thành phần – chất gây dị ứng nào được in đậm?), Menge (lượng), MHD hoặc Verbrauchsdatum, nhà sản xuất kèm địa chỉ, bảng dinh dưỡng (năng lượng mỗi 100 g), dấu và nhãn.','Coge un envase de alimento de tu bolsa o de la caja de tu profesora. Busca las indicaciones y escribe lo que encuentras: Bezeichnung (denominación), Zutatenverzeichnis (ingredientes – ¿qué alérgenos están resaltados?), Menge (cantidad), MHD o Verbrauchsdatum, fabricante con dirección, tabla nutricional (energía por 100 g), signos y sellos.','Pega numa embalagem de alimento da tua mochila ou da caixa da professora. Procura as indicações e escreve o que encontras: Bezeichnung (denominação), Zutatenverzeichnis (ingredientes – que alergénios estão destacados?), Menge (quantidade), MHD ou Verbrauchsdatum, fabricante com morada, tabela nutricional (energia por 100 g), símbolos e selos.','Візьми харчову упаковку зі своєї сумки або з коробки вчительки. Знайди дані й запиши, що бачиш: Bezeichnung (назва), Zutatenverzeichnis (склад — які алергени виділено?), Menge (кількість), MHD або Verbrauchsdatum, виробник з адресою, таблиця харчової цінності (енергія на 100 г), знаки й печатки.','ሓደ ዓቕሚ መግቢ ካብ ሳንጋኻ ወይ ካብ ሳጹን መምህርትካ ውሰድ። ሓበሬታታት ድለይን ዝረኸብካዮ ጽሓፍ: Bezeichnung፣ Zutatenverzeichnis (ኣየኖት ኣለርጂ ተጉሊሖም?)፣ Menge፣ MHD ወይ Verbrauchsdatum፣ ኣምራቒ ምስ ኣድራሻ፣ ሰንጠረዥ ሓይሊ (ንፍሉይ 100 ግ)፣ ምልክታትን ማህተምን።','Возьми упаковку продуктов из сумки или из коробки учительницы. Найди данные и запиши, что видишь: Bezeichnung (название), Zutatenverzeichnis (состав — какие аллергены выделены?), Menge (количество), MHD или Verbrauchsdatum, производитель с адресом, таблица питательной ценности (энергия на 100 г), знаки и печати.','خذ عبوة طعام من حقيبتك أو من صندوق المعلمة. ابحث عن البيانات واكتب ما تجده: Bezeichnung (التسمية)، Zutatenverzeichnis (المكوّنات – ما المواد المسبّبة للحساسية المميّزة؟)، Menge (الكمية)، MHD أو Verbrauchsdatum، المنتج مع العنوان، جدول التغذية (الطاقة لكل 100 غ)، الرموز والأختام.','Çantandan veya öğretmeninin kutusundan bir gıda ambalajı al. Bilgileri bul ve gördüklerini yaz: Bezeichnung (ad), Zutatenverzeichnis (içindekiler – hangi alerjenler vurgulanmış?), Menge (miktar), MHD veya Verbrauchsdatum, adresli üretici, besin tablosu (100 g başına enerji), işaretler ve mühürler.'],
'a2.t':['Đọc bao bì từng phần. Các Pflichtangabe (thông tin bắt buộc) có trong bảng ở phần đọc thêm.','Lee el envase parte por parte. Las Pflichtangaben (indicaciones obligatorias) están en la tabla de la lectura.','Lê a embalagem parte por parte. As Pflichtangaben (indicações obrigatórias) estão na tabela da leitura.','Читай упаковку частинами. Pflichtangaben (обов’язкові дані) є в таблиці в тексті.','ነቲ ዓቕሚ ክፋል ብክፋል ኣንብብ። Pflichtangaben ኣብ ሰንጠረዥ ምንባብ ኣለዉ።','Читай упаковку по частям. Pflichtangaben (обязательные данные) есть в таблице в тексте.','اقرأ العبوة جزءًا جزءًا. Pflichtangaben (البيانات الإلزامية) موجودة في جدول القراءة.','Ambalajı parça parça oku. Pflichtangaben (zorunlu bilgiler) okuma bölümündeki tablodadır.'],
'a2.e':['So sánh danh sách của em với các thông tin bắt buộc trong phần đọc thêm.','Compara tu lista con las indicaciones obligatorias de la lectura.','Compara a tua lista com as indicações obrigatórias da leitura.','Порівняй свій список з обов’язковими даними в тексті.','ዝርዝርካ ምስ ግዱድ ሓበሬታታት ኣብ ምንባብ ኣነጻጽር።','Сравни свой список с обязательными данными в тексте.','قارن قائمتك مع البيانات الإلزامية في القراءة.','Listeni okuma bölümündeki zorunlu bilgilerle karşılaştır.'],
'r1.h':['Đọc thêm: Thông tin bắt buộc trên thực phẩm','Para leer: indicaciones obligatorias en alimentos','Para ler: indicações obrigatórias em alimentos','Для читання: обов’язкові дані на харчових продуктах','ንምንባብ: ግዱድ ሓበሬታታት ኣብ መግቢ','Для чтения: обязательные данные на продуктах питания','للقراءة: البيانات الإلزامية على الأغذية','Okumak için: Gıdalardaki zorunlu bilgiler'],
'r1.s':['MHD = ăn ngon nhất trước ngày này, sau đó thường vẫn dùng được. Verbrauchsdatum = phải dùng trước ngày này, sau đó không được bán.','MHD = consumir preferentemente antes de; después suele estar bien. Verbrauchsdatum = consumir antes de; después no se puede vender.','MHD = consumir de preferência antes de; depois costuma estar bom. Verbrauchsdatum = consumir antes de; depois não se pode vender.','MHD = краще вжити до цієї дати, потім часто ще придатне. Verbrauchsdatum = вжити до цієї дати, потім продавати не можна.','MHD = ዝበለጸ ቅድሚ እዚ ዕለት፣ ድሕሪኡ ብዙሕ ግዜ ጽቡቕ እዩ። Verbrauchsdatum = ቅድሚ እዚ ዕለት ክትጥቀም፣ ድሕሪኡ ኣይሽየጥን።','MHD = лучше употребить до этой даты, потом часто ещё годен. Verbrauchsdatum = употребить до этой даты, потом продавать нельзя.','MHD = يُفضَّل استهلاكه قبل هذا التاريخ وغالبًا يصلح بعده. Verbrauchsdatum = يجب استهلاكه قبل هذا التاريخ ولا يُباع بعده.','MHD = bu tarihten önce tüketilmesi tavsiye edilir, sonrası çoğu zaman hâlâ iyidir. Verbrauchsdatum = bu tarihten önce tüketilmeli, sonra satılamaz.'],
'r1.qq':['Hackfleisch (thịt băm) có Verbrauchsdatum đã hết hạn. Điều gì áp dụng?','El Hackfleisch (carne picada) tiene el Verbrauchsdatum vencido. ¿Qué se aplica?','O Hackfleisch (carne picada) tem o Verbrauchsdatum expirado. O que se aplica?','У Hackfleisch (фаршу) минув Verbrauchsdatum. Що діє?','Hackfleisch Verbrauchsdatum ዝሓለፎ ኣለዎ። እንታይ ይስርሕ?','У Hackfleisch (фарша) истёк Verbrauchsdatum. Что действует?','Hackfleisch (اللحم المفروم) انتهى Verbrauchsdatum. ماذا يسري؟','Hackfleisch’in (kıyma) Verbrauchsdatum’u geçti. Ne geçerlidir?'],
'r2.h':['Đọc thêm: Dấu hiệu, nhãn và GTIN','Para leer: signos, sellos y GTIN','Para ler: símbolos, selos e GTIN','Для читання: знаки, печатки й GTIN','ንምንባብ: ምልክታት፣ ማህተምን GTIN ን','Для чтения: знаки, печати и GTIN','للقراءة: الرموز والأختام وGTIN','Okumak için: İşaretler, mühürler ve GTIN'],
'r2.s':['CE không phải Prüfzeichen (dấu kiểm định), GS thì có. GTIN là mã cho hệ thống quản lý hàng hóa.','CE no es un Prüfzeichen (sello de ensayo), GS sí. El GTIN es un identificador para el sistema de gestión de mercancías.','CE não é um Prüfzeichen (selo de ensaio), GS é. O GTIN é um identificador para o sistema de gestão de mercadorias.','CE — не Prüfzeichen (знак випробувань), а GS — так. GTIN — ідентифікатор для системи обліку товарів.','CE Prüfzeichen ኣይኮነን፣ GS እወ። GTIN መለለዪ ንስርዓት ምምሕዳር ኣቕሑት እዩ።','CE — не Prüfzeichen (знак испытаний), а GS — да. GTIN — идентификатор для системы учёта товаров.','CE ليست Prüfzeichen (علامة اختبار) لكن GS كذلك. GTIN معرّف لنظام إدارة البضائع.','CE bir Prüfzeichen (test işareti) değildir, GS’dir. GTIN, mal yönetim sistemi için bir tanıtıcıdır.'],
'r2.qq':['Dấu CE có nghĩa là gì?','¿Qué significa el marcado CE?','O que significa a marcação CE?','Що означає маркування CE?','ምልክት CE እንታይ ማለት እዩ?','Что означает маркировка CE?','ماذا يعني وسم CE؟','CE işareti ne anlama gelir?'],
'a3.h':['Bài tập có hướng dẫn: Đây là dấu hiệu nào?','Ejercicio guiado: ¿qué signo es?','Exercício guiado: que símbolo é?','Керована вправа: який це знак?','ምምሕዳር ልምምድ: እዚ ኣየናይ ምልክት እዩ?','Упражнение с подсказкой: какой это знак?','تمرين موجَّه: أي رمز هذا؟','Rehberli alıştırma: Bu hangi işaret?'],
'a4.h':['Bài tập có hướng dẫn: MHD hay Verbrauchsdatum?','Ejercicio guiado: ¿MHD o Verbrauchsdatum?','Exercício guiado: MHD ou Verbrauchsdatum?','Керована вправа: MHD чи Verbrauchsdatum?','ምምሕዳር ልምምድ: MHD ወይ Verbrauchsdatum?','Упражнение с подсказкой: MHD или Verbrauchsdatum?','تمرين موجَّه: MHD أم Verbrauchsdatum؟','Rehberli alıştırma: MHD mi Verbrauchsdatum mu?'],
'a3.i':['Đọc từng mô tả. Đó là loại dấu nào?','Lee cada descripción. ¿Qué tipo de signo es?','Lê cada descrição. Que tipo de símbolo é?','Прочитай кожен опис. Який це вид знака?','ነፍሲ ወከፍ መግለጺ ኣንብብ። ኣየናይ ዓይነት ምልክት እዩ?','Прочитай каждое описание. Какой это вид знака?','اقرأ كل وصف. أي نوع من الرموز هذا؟','Her açıklamayı oku. Bu hangi tür işaret?'],
'a3.t':['Hỏi: Ai xác nhận điều này? Một cơ quan độc lập, chính nhà sản xuất, hay dấu về môi trường và công bằng?','Pregunta: ¿quién lo confirma? ¿Un organismo independiente, el propio fabricante o un sello de medio ambiente y justicia?','Pergunta: quem o confirma? Um organismo independente, o próprio fabricante ou um selo de ambiente e justiça?','Запитай: хто це підтверджує? Незалежна установа, сам виробник чи знак про довкілля й справедливість?','ሕተት: መን የረጋግጽ? ናጻ ትካል፣ እቲ ኣምራቒ ባዕሉ ወይ ምልክት ከባቢን ፍትሕን?','Спроси: кто это подтверждает? Независимая организация, сам производитель или знак об экологии и справедливости?','اسأل: من يؤكد ذلك؟ جهة مستقلة أم المصنّع نفسه أم ختم للبيئة والعدالة؟','Sor: Bunu kim onaylıyor? Bağımsız bir kuruluş mu, üreticinin kendisi mi, yoksa çevre ve adalet mührü mü?'],
'a3.e':['Umweltzeichen: thân thiện môi trường. EU-Bio: nông nghiệp hữu cơ. GS: an toàn do cơ quan độc lập kiểm tra. CE: nhà sản xuất tự tuyên bố. Marke: tên và logo. Fairtrade: giá và điều kiện làm việc công bằng. EU-Energielabel: thang A đến G.','Umweltzeichen: respetuoso con el medio ambiente. EU-Bio: agricultura ecológica. GS: seguridad comprobada por un organismo independiente. CE: declara el propio fabricante. Marke: nombre y logo. Fairtrade: precios y condiciones justas. EU-Energielabel: escala A a G.','Umweltzeichen: amigo do ambiente. EU-Bio: agricultura biológica. GS: segurança verificada por organismo independente. CE: declara o próprio fabricante. Marke: nome e logótipo. Fairtrade: preços e condições justas. EU-Energielabel: escala de A a G.','Umweltzeichen: екологічний. EU-Bio: органічне землеробство. GS: безпеку перевірила незалежна установа. CE: заявляє сам виробник. Marke: назва й логотип. Fairtrade: справедливі ціни й умови праці. EU-Energielabel: шкала від A до G.','Umweltzeichen: ምሕዋይ ከባቢ። EU-Bio: ሰብኣዊ ሕርሻ። GS: ውሕስነት ብናጻ ትካል ዝተፈተነ። CE: ኣምራቒ ባዕሉ ይእውጅ። Marke: ስምን ሎጎን። Fairtrade: ፍትሓዊ ዋጋን ኩነታት ስራሕን። EU-Energielabel: ዓቐን ካብ A ክሳብ G።','Umweltzeichen: экологичный. EU-Bio: органическое земледелие. GS: безопасность проверена независимой организацией. CE: заявляет сам производитель. Marke: название и логотип. Fairtrade: справедливые цены и условия труда. EU-Energielabel: шкала от A до G.','Umweltzeichen: صديق للبيئة. EU-Bio: زراعة عضوية. GS: سلامة اختبرتها جهة مستقلة. CE: يعلنها المصنّع نفسه. Marke: اسم وشعار. Fairtrade: أسعار وظروف عمل عادلة. EU-Energielabel: مقياس من A إلى G.','Umweltzeichen: çevre dostu. EU-Bio: organik tarım. GS: güvenliği bağımsız kuruluş test etmiş. CE: üretici kendisi beyan eder. Marke: ad ve logo. Fairtrade: adil fiyat ve çalışma koşulları. EU-Energielabel: A’dan G’ye ölçek.'],
'a4.i':['Trả lời các câu hỏi. Nhớ sự khác biệt giữa MHD và Verbrauchsdatum.','Responde las preguntas. Recuerda la diferencia entre MHD y Verbrauchsdatum.','Responde às perguntas. Lembra a diferença entre MHD e Verbrauchsdatum.','Дай відповіді на запитання. Згадай різницю між MHD і Verbrauchsdatum.','ንሕቶታት መልስ። ፍልልይ MHD ን Verbrauchsdatum ን ዘክር።','Ответь на вопросы. Вспомни разницу между MHD и Verbrauchsdatum.','أجب عن الأسئلة. تذكّر الفرق بين MHD وVerbrauchsdatum.','Soruları cevapla. MHD ile Verbrauchsdatum arasındaki farkı hatırla.'],
'a4.t':['MHD: sau đó thường còn tốt, có thể bán kèm ghi chú. Verbrauchsdatum: sau đó không được bán. Chất gây dị ứng ghi trong danh sách thành phần.','MHD: después suele estar bien, se puede vender con aviso. Verbrauchsdatum: después no se vende. Los alérgenos están en el Zutatenverzeichnis.','MHD: depois costuma estar bom, pode vender-se com aviso. Verbrauchsdatum: depois não se vende. Os alergénios estão no Zutatenverzeichnis.','MHD: потім часто ще придатне, можна продавати з позначкою. Verbrauchsdatum: потім не продають. Алергени є в Zutatenverzeichnis.','MHD: ድሕሪኡ ብዙሕ ግዜ ጽቡቕ፣ ብምልክታ ክሽየጥ ይከኣል። Verbrauchsdatum: ድሕሪኡ ኣይሽየጥን። ኣለርጂ ኣብ Zutatenverzeichnis ኣለዉ።','MHD: потом часто ещё годен, можно продавать с пометкой. Verbrauchsdatum: потом не продают. Аллергены указаны в Zutatenverzeichnis.','MHD: غالبًا يصلح بعده ويمكن بيعه مع تنبيه. Verbrauchsdatum: لا يُباع بعده. المواد المسبّبة للحساسية في Zutatenverzeichnis.','MHD: sonrası çoğu zaman iyidir, uyarıyla satılabilir. Verbrauchsdatum: sonrası satılmaz. Alerjenler Zutatenverzeichnis’tedir.'],
'a4.e':['MHD hết hạn: chỉ khi còn nguyên vẹn, thường giảm giá và kèm ghi chú. Verbrauchsdatum hết hạn: không bán.','MHD vencido: solo si está en perfecto estado, normalmente rebajado y con aviso. Verbrauchsdatum vencido: no vender.','MHD expirado: só se estiver em perfeito estado, normalmente com desconto e aviso. Verbrauchsdatum expirado: não vender.','MHD минув: лише якщо товар бездоганний, зазвичай зі знижкою й позначкою. Verbrauchsdatum минув: не продавати.','MHD ዝሓለፎ: ጽቡቕ ምስ ዝኸውን ጥራይ፣ ብዙሕ ግዜ ብቅናሽን ብምልክታን። Verbrauchsdatum ዝሓለፎ: ኣይትሽጥ።','MHD истёк: только если товар безупречен, обычно со скидкой и пометкой. Verbrauchsdatum истёк: не продавать.','MHD منتهٍ: فقط إذا كان سليمًا، غالبًا مخفّضًا ومع تنبيه. Verbrauchsdatum منتهٍ: لا يُباع.','MHD geçti: yalnız kusursuzsa, genelde indirimli ve uyarıyla. Verbrauchsdatum geçti: satılmaz.'],
'a4.1.q':['4.1 Hôm nay là 10 tháng 3. Một hộp sữa chua ghi „mindestens haltbar bis 08.03.“ (ngon nhất trước 8/3). Còn được bán không?','4.1 Hoy es 10 de marzo. Un yogur dice «mindestens haltbar bis 08.03.» (consumir preferentemente antes del 8/3). ¿Se puede vender aún?','4.1 Hoje é 10 de março. Um iogurte diz «mindestens haltbar bis 08.03.» (consumir preferencialmente até 8/3). Ainda pode ser vendido?','4.1 Сьогодні 10 березня. На йогурті «mindestens haltbar bis 08.03.» (бажано вжити до 8.03). Чи можна ще продавати?','4.1 ሎሚ 10 መጋቢት እዩ። ሓደ ዮጎርት «mindestens haltbar bis 08.03.» ይብል። ገና ክሽየጥ ይከኣል ዶ?','4.1 Сегодня 10 марта. На йогурте «mindestens haltbar bis 08.03.» (желательно употребить до 8.03). Можно ли ещё продавать?','4.1 اليوم 10 مارس. على اللبن «mindestens haltbar bis 08.03.» (يفضّل استهلاكه قبل 8/3). هل يجوز بيعه بعد؟','4.1 Bugün 10 Mart. Bir yoğurtta «mindestens haltbar bis 08.03.» (8 Mart’a kadar tavsiye edilir) yazıyor. Hâlâ satılabilir mi?'],
'a4.2.q':['4.2 Thịt băm tươi ghi „zu verbrauchen bis 09.03.“ (phải dùng trước 9/3). Ngày 10 tháng 3 còn được bán không?','4.2 El Hackfleisch fresco dice «zu verbrauchen bis 09.03.» (consumir antes del 9/3). ¿Se puede vender el 10 de marzo?','4.2 O Hackfleisch fresco diz «zu verbrauchen bis 09.03.» (consumir até 9/3). Pode ser vendido a 10 de março?','4.2 Свіжий Hackfleisch (фарш) має «zu verbrauchen bis 09.03.» (вжити до 9.03). Чи можна продавати 10 березня?','4.2 ሓድሽ Hackfleisch «zu verbrauchen bis 09.03.» ይብል። ብ10 መጋቢት ገና ክሽየጥ ይከኣል ዶ?','4.2 Свежий Hackfleisch (фарш) с «zu verbrauchen bis 09.03.» (употребить до 9.03). Можно ли продавать 10 марта?','4.2 Hackfleisch (لحم مفروم) طازج عليه «zu verbrauchen bis 09.03.» (يُستهلك قبل 9/3). هل يُباع في 10 مارس؟','4.2 Taze Hackfleisch’te (kıyma) «zu verbrauchen bis 09.03.» (9 Mart’a kadar tüketilmeli) yazıyor. 10 Mart’ta satılabilir mi?'],
'a4.3.q':['4.3 Một khách bị dị ứng hạt hỏi trong bánh quy có hạt không. Em xem ở đâu – và trả lời thế nào?','4.3 Una clienta con alergia a frutos secos pregunta si las galletas llevan frutos secos. ¿Dónde miras y cómo respondes?','4.3 Uma cliente com alergia a frutos secos pergunta se os biscoitos têm frutos secos. Onde procuras e como respondes?','4.3 Клієнтка з алергією на горіхи питає, чи є горіхи в печиві. Де ти дивишся і як відповідаєш?','4.3 ሓንቲ ዓሚል ብኣለርጂ ኣብ ለውዚ ብስኩት ለውዚ ኣለዎ ድዩ ትሓትት። ኣበይ ትርኢ ከመይ ከኣ ትምልስ?','4.3 Клиентка с аллергией на орехи спрашивает, есть ли орехи в печенье. Где ты смотришь и как отвечаешь?','4.3 زبونة لديها حساسية من المكسرات تسأل إن كانت في البسكويت مكسرات. أين تنظر وكيف تجيب؟','4.3 Fındık alerjisi olan bir müşteri bisküvilerde fındık olup olmadığını soruyor. Nereye bakarsın ve nasıl cevap verirsin?'],
'a5.h':['Bài tập tự do: Săn dấu hiệu (2 điểm)','Ejercicio libre: caza de signos (2 puntos)','Exercício livre: caça aos símbolos (2 pontos)','Вільна вправа: полювання на знаки (2 бали)','ናጻ ልምምድ: ምድላይ ምልክታት (2 ነጥቢ)','Свободное упражнение: охота за знаками (2 балла)','تمرين حر: صيد الرموز (نقطتان)','Serbest alıştırma: İşaret avı (2 puan)'],
'a5.i':['Thu thập ở nơi học nghề năm dấu hiệu khác nhau trên hàng hóa hoặc bao bì (ảnh hoặc phác thảo, không có người). Giới thiệu với nhóm. Viết ở đây một dấu hiệu: Nó có nghĩa gì – và em dùng nó thế nào khi bán hàng?','Reúne en tu empresa cinco signos distintos en mercancías o envases (foto o boceto, sin personas). Preséntalos a tu grupo. Escribe aquí uno: ¿qué significa y cómo lo usas en la conversación de venta?','Reúne na tua empresa cinco símbolos diferentes em mercadorias ou embalagens (foto ou esboço, sem pessoas). Apresenta-os ao teu grupo. Escreve aqui um: o que significa e como o usas na conversa de venda?','Збери на своєму підприємстві п’ять різних знаків на товарах чи упаковках (фото чи ескіз, без людей). Представ їх групі. Запиши тут один: що він означає і як ти використовуєш його в розмові з клієнтом?','ኣብ ቦታ ልምምድካ ሓሙሽተ ዝተፈላለዩ ምልክታት ኣብ ኣቕሑት ወይ ዓቕሚ ኣኽብ (ስእሊ ወይ ስእሊ ብኢድ፣ ሰብ የለን)። ንጉጅለኻ ኣቕርብ። ኣብዚ ሓደ ጽሓፍ: እንታይ ማለት እዩ ከመይ ከኣ ኣብ ዘረባ ሽያጥ ትጥቀመሉ?','Собери на своём предприятии пять разных знаков на товарах или упаковках (фото или эскиз, без людей). Представь их группе. Запиши здесь один: что он означает и как ты используешь его в разговоре с клиентом?','اجمع في شركة تدريبك خمسة رموز مختلفة على بضائع أو عبوات (صورة أو رسم، بلا أشخاص). اعرضها على مجموعتك. اكتب هنا واحدًا: ماذا يعني وكيف تستخدمه في حديث البيع؟','Eğitim işletmende mallar veya ambalajlar üzerinde beş farklı işaret topla (fotoğraf veya çizim, kişi yok). Grubuna tanıt. Burada birini yaz: Ne anlama gelir ve satış görüşmesinde nasıl kullanırsın?'],
'a5.t':['Nói trước ý nghĩa của dấu hiệu. Sau đó viết một câu cho cuộc trò chuyện bán hàng.','Di primero qué significa el signo. Luego formula una frase para la conversación de venta.','Diz primeiro o que significa o símbolo. Depois formula uma frase para a conversa de venda.','Спершу скажи, що означає знак. Потім сформулюй речення для розмови з клієнтом.','ቀዳምነት እንታይ ማለት ምልክት ግለጽ። ድሕሪኡ ሓደ ሓረግ ንዘረባ ሽያጥ ጽሓፍ።','Сначала скажи, что означает знак. Потом сформулируй фразу для разговора с клиентом.','قل أولًا ما يعنيه الرمز. ثم صُغ جملة لحديث البيع.','Önce işaretin ne anlama geldiğini söyle. Sonra satış görüşmesi için bir cümle kur.'],
'a5.e':['Ví dụ tốt nêu dấu hiệu, loại (ví dụ Umweltzeichen) và một câu bằng lời nói trực tiếp.','Un buen ejemplo nombra el signo, el tipo (p. ej. Umweltzeichen) y una frase en estilo directo.','Um bom exemplo nomeia o símbolo, o tipo (p. ex. Umweltzeichen) e uma frase em discurso direto.','Хороший приклад називає знак, вид (напр. Umweltzeichen) і речення прямою мовою.','ጽቡቕ ኣብነት ነቲ ምልክት፣ ዓይነት (ንኣብነት Umweltzeichen) ከምኡውን ሓደ ሓረግ ብቀጥታዊ ዘረባ ይጥቅስ።','Хороший пример называет знак, вид (напр. Umweltzeichen) и предложение прямой речью.','المثال الجيد يذكر الرمز والنوع (مثل Umweltzeichen) وجملة بالكلام المباشر.','İyi bir örnek işareti, türünü (ör. Umweltzeichen) ve doğrudan konuşma cümlesini söyler.'],
'a5.1.q':['Dấu hiệu – loại – Cách em dùng khi bán hàng (lời nói trực tiếp):','Signo – tipo – Cómo lo uso en la venta (estilo directo):','Símbolo – tipo – Como o uso na venda (discurso direto):','Знак – вид – Як я використовую його в розмові з клієнтом (пряма мова):','ምልክት – ዓይነት – ኣብ ሽያጥ ከመይ ከም ዝጥቀመሉ (ቀጥታዊ ዘረባ):','Знак – вид – Как я использую его в разговоре с клиентом (прямая речь):','الرمز – النوع – كيف أستخدمه في البيع (كلام مباشر):','İşaret – tür – Satışta nasıl kullanırım (doğrudan konuşma):'],
'a6.t':['6.1/6.2: Nghĩ đến quầy thu ngân, giá và Warenwirtschaftssystem (hệ thống quản lý hàng hóa). 6.3: Nêu dấu hiệu, giải thích và nói trực tiếp với khách.','6.1/6.2: Piensa en caja, precio y Warenwirtschaftssystem (sistema de gestión de mercancías). 6.3: Nombra el signo, explícalo y habla directamente al cliente.','6.1/6.2: Pensa na caixa, preço e Warenwirtschaftssystem (sistema de gestão de mercadorias). 6.3: Nomeia o símbolo, explica-o e fala diretamente ao cliente.','6.1/6.2: Подумай про касу, ціну й Warenwirtschaftssystem (систему обліку товарів). 6.3: Назви знак, поясни його й звернись до клієнта напряму.','6.1/6.2: ካሳ፣ ዋጋን Warenwirtschaftssystem ሕሰብ። 6.3: ምልክት ጥቀስ፣ ግለጽ፣ ንዓሚል ቀጥታ ተዛረብ።','6.1/6.2: Подумай о кассе, цене и Warenwirtschaftssystem (системе учёта товаров). 6.3: Назови знак, объясни его и обратись к клиенту напрямую.','6.1/6.2: فكّر في الصندوق والسعر وWarenwirtschaftssystem (نظام إدارة البضائع). 6.3: اذكر الرمز واشرحه وخاطب الزبونة مباشرة.','6.1/6.2: Kasayı, fiyatı ve Warenwirtschaftssystem’i (mal yönetim sistemi) düşün. 6.3: İşareti söyle, açıkla ve müşteriye doğrudan konuş.'],
'a6.e':['6.3 được điểm cho dấu hiệu, lời giải thích và lời nói trực tiếp.','6.3 da puntos por el signo, la explicación y el estilo directo.','6.3 dá pontos pelo símbolo, pela explicação e pelo discurso direto.','6.3 дає бали за знак, пояснення й пряму мову.','6.3 ንምልክት፣ ንመግለጺን ንቀጥታዊ ዘረባን ነጥቢ ይህብ።','6.3 даёт баллы за знак, объяснение и прямую речь.','6.3 يمنح نقاطًا للرمز والشرح والكلام المباشر.','6.3 işaret, açıklama ve doğrudan konuşma için puan verir.'],
'a6.1.q':['6.1 Giải thích ý nghĩa của mã vạch này đối với Kaufhaus Hansa GmbH. (2 điểm)','6.1 Explique el significado de este código de barras para Kaufhaus Hansa GmbH. (2 puntos)','6.1 Explique o significado deste código de barras para a Kaufhaus Hansa GmbH. (2 pontos)','6.1 Поясніть значення цього штрихкоду для Kaufhaus Hansa GmbH. (2 бали)','6.1 ትርጉም እዚ ባርኮድ ንKaufhaus Hansa GmbH ግለጽ። (2 ነጥቢ)','6.1 Объясните значение этого штрихкода для Kaufhaus Hansa GmbH. (2 балла)','6.1 اشرح معنى هذا الباركود بالنسبة لـ Kaufhaus Hansa GmbH. (نقطتان)','6.1 Bu barkodun Kaufhaus Hansa GmbH için anlamını açıkla. (2 puan)'],
'a6.2.q':['6.2 Kể hai ưu điểm của GTIN đối với Kaufhaus Hansa GmbH. (2 điểm)','6.2 Nombre dos ventajas del GTIN para Kaufhaus Hansa GmbH. (2 puntos)','6.2 Nomeie duas vantagens do GTIN para a Kaufhaus Hansa GmbH. (2 pontos)','6.2 Назвіть дві переваги GTIN для Kaufhaus Hansa GmbH. (2 бали)','6.2 ክልተ ረብሓታት GTIN ንKaufhaus Hansa GmbH ጥቀስ። (2 ነጥቢ)','6.2 Назовите два преимущества GTIN для Kaufhaus Hansa GmbH. (2 балла)','6.2 اذكر ميزتين لـ GTIN بالنسبة لـ Kaufhaus Hansa GmbH. (نقطتان)','6.2 GTIN’in Kaufhaus Hansa GmbH için iki avantajını say. (2 puan)'],
'a6.3.q':['6.3 Một khách hỏi đồng hồ báo thức trẻ em có an toàn không. Nêu một dấu hiệu em có thể chỉ ra và viết câu trả lời bằng lời nói trực tiếp. (4 điểm)','6.3 Una clienta pregunta si el despertador infantil es seguro. Nombre un signo al que pueda remitir y formule su respuesta en estilo directo. (4 puntos)','6.3 Uma cliente pergunta se o despertador infantil é seguro. Nomeie um símbolo a que possa remeter e formule a resposta em discurso direto. (4 pontos)','6.3 Клієнтка питає, чи безпечний дитячий будильник. Назвіть знак, на який можна вказати, і сформулюйте відповідь прямою мовою. (4 бали)','6.3 ሓንቲ ዓሚል ናይ ቆልዑ ሰዓት ምንቅናቕ ውሑስ ድዩ ትሓትት። ክትሕዞ እትኽእል ምልክት ጥቀስ ምላሽካ ድማ ብቀጥታዊ ዘረባ ጽሓፍ። (4 ነጥቢ)','6.3 Клиентка спрашивает, безопасен ли детский будильник. Назовите знак, на который можно сослаться, и сформулируйте ответ прямой речью. (4 балла)','6.3 تسأل زبونة إن كان منبّه الأطفال آمنًا. اذكر رمزًا يمكنك الإشارة إليه وصُغ جوابك بالكلام المباشر. (4 نقاط)','6.3 Bir müşteri çocuk çalar saatinin güvenli olup olmadığını soruyor. Gösterebileceğin bir işareti söyle ve cevabını doğrudan konuşma olarak yaz. (4 puan)'],
'a7.t':['7.1: Nhân các chữ số lần lượt với 1 và 3 rồi cộng lại. Prüfziffer (số kiểm tra) bổ sung tổng cho tròn chục. 7.2: Ai cấp số tiền tố?','7.1: Multiplica las cifras alternando por 1 y 3 y suma. El Prüfziffer (dígito de control) completa la suma hasta la decena. 7.2: ¿Quién asigna el prefijo?','7.1: Multiplica os algarismos alternadamente por 1 e 3 e soma. O Prüfziffer (dígito de controlo) completa a soma até à dezena. 7.2: Quem atribui o prefixo?','7.1: Помнож цифри по черзі на 1 і 3 й додай. Prüfziffer (контрольна цифра) доповнює суму до десятка. 7.2: Хто присвоює префікс?','7.1: ኣሃዛት ብተኸታታሊ ብ 1 ን 3 ብዝሒ ኣእትዎም ድማ ኣጽምር። Prüfziffer ነቲ ድምር ክሳብ ዓሰርተ የመሊኦ። 7.2: መን እዩ ቀዳማይ ቁጽሪ ዝህብ?','7.1: Умножай цифры поочерёдно на 1 и 3 и сложи. Prüfziffer (контрольная цифра) дополняет сумму до десятка. 7.2: Кто присваивает префикс?','7.1: اضرب الأرقام بالتناوب في 1 و3 ثم اجمع. Prüfziffer (رقم التحقق) يكمل المجموع إلى العشرة التالية. 7.2: من يمنح البادئة؟','7.1: Rakamları sırayla 1 ve 3 ile çarp ve topla. Prüfziffer (kontrol rakamı) toplamı bir sonraki onluğa tamamlar. 7.2: Ön eki kim verir?'],
'a7.e':['Tiền tố cho biết tổ chức nào cấp số, không nhất thiết là nước sản xuất.','El prefijo indica qué organización asignó el número, no necesariamente el país de origen.','O prefixo indica que organização atribuiu o número, não necessariamente o país de origem.','Префікс показує, яка організація присвоїла номер, а не обов’язково країну походження.','እቲ ቀዳማይ ቁጽሪ እታ ትካል ዝሃበቶ ኣርእዩ፣ ሃገር ምፍራይ ኣይኮነን ብግድን።','Префикс показывает, какая организация присвоила номер, а не обязательно страну происхождения.','البادئة تبيّن أي منظمة منحت الرقم وليس بالضرورة بلد المنشأ.','Ön ek, numarayı hangi kuruluşun verdiğini gösterir; mutlaka menşe ülkeyi değil.'],
'a7.2.q':['7.2 „GTIN bắt đầu bằng 40 – vậy sản phẩm sản xuất ở Đức.“ Đánh giá nhận định này của khách.','7.2 «El GTIN empieza por 40, así que el producto se fabricó en Alemania.» Valora esta afirmación de un cliente.','7.2 «O GTIN começa por 40, por isso o produto foi fabricado na Alemanha.» Avalia esta afirmação de um cliente.','7.2 «GTIN починається з 40 — отже, товар вироблений у Німеччині.» Оціни це твердження клієнта.','7.2 «GTIN ብ 40 ይጅምር – ስለዚ ምርቲ ኣብ ጀርመን ተሰሪሑ።» ነዚ ዘረባ ዓሚል ገምግም።','7.2 «GTIN начинается с 40 — значит, продукт произведён в Германии.» Оцени это утверждение клиента.','7.2 «يبدأ GTIN بـ 40 – إذن المنتج صُنع في ألمانيا.» قيّم هذه العبارة من زبون.','7.2 «GTIN 40 ile başlıyor – demek ki ürün Almanya’da üretilmiş.» Bir müşterinin bu ifadesini değerlendir.'],
'v1.h':['Nâng cao: Tại sao lại như vậy? Hãy tính cùng!','Profundización: ¿por qué es así? ¡Calcula!','Aprofundamento: porque é assim? Calcula!','Поглиблення: чому так? Порахуй!','ኣዝዩ ዝዓሞቐ: ስለምንታይ? ሕሳብ ግበር!','Углубление: почему так? Посчитай!','تعمّق: لماذا هذا؟ احسب!','Derinleştirme: Neden böyle? Hesapla!'],
'v1.i':['Tính và giải thích. Sau đó so sánh với bài giải mẫu.','Calcula y justifica. Luego compara con la solución modelo.','Calcula e justifica. Depois compara com a solução modelo.','Порахуй й обґрунтуй. Потім порівняй із зразком.','ሕሰብን ኣረጋግጽን። ድሕሪኡ ምስ ኣብነታዊ መልሲ ኣነጻጽር።','Посчитай и обоснуй. Потом сравни с образцом.','احسب وعلّل. ثم قارن مع الحل النموذجي.','Hesapla ve gerekçelendir. Sonra örnek çözümle karşılaştır.'],
'v1.t':['V1: Cùng quy tắc như Aufgabe 7.1. V2 và V3: Bắt đầu bằng „Weil …“ (vì …).','V1: La misma regla que en la Aufgabe 7.1. V2 y V3: empieza con «Weil …» (porque …).','V1: A mesma regra da Aufgabe 7.1. V2 e V3: começa com «Weil …» (porque …).','V1: Те саме правило, що в Aufgabe 7.1. V2 і V3: почни з «Weil …» (тому що …).','V1: ሓደ ሕጊ ከም Aufgabe 7.1። V2 ን V3: ብ «Weil …» ጀምር።','V1: То же правило, что в Aufgabe 7.1. V2 и V3: начни с «Weil …» (потому что …).','V1: نفس قاعدة Aufgabe 7.1. V2 وV3: ابدأ بـ «Weil …» (لأن …).','V1: Aufgabe 7.1 ile aynı kural. V2 ve V3: «Weil …» (çünkü …) ile başla.'],
'v1.2.q':['V2 Giải thích: Tại sao dấu CE không phải Prüfzeichen (dấu kiểm định) còn dấu GS thì có?','V2 Justifica: ¿por qué el marcado CE no es un Prüfzeichen (sello de ensayo) y el GS sí?','V2 Justifica: porque é que a marcação CE não é um Prüfzeichen (selo de ensaio) e o GS é?','V2 Обґрунтуй: чому маркування CE не є Prüfzeichen (знаком випробувань), а GS — є?','V2 ኣረጋግጽ: ስለምንታይ CE Prüfzeichen ኣይኮነን GS ግን እወ?','V2 Обоснуй: почему маркировка CE не является Prüfzeichen (знаком испытаний), а GS — является?','V2 علّل: لماذا CE ليست Prüfzeichen (علامة اختبار) بينما GS كذلك؟','V2 Gerekçelendir: CE neden Prüfzeichen (test işareti) değildir, GS ise öyledir?'],
'v1.3.q':['V3 Giải thích: Tại sao Hackfleisch sau Verbrauchsdatum không được bán, còn sữa chua sau MHD thì có thể?','V3 Justifica: ¿por qué el Hackfleisch no se puede vender tras el Verbrauchsdatum, pero un yogur tras el MHD a veces sí?','V3 Justifica: porque é que o Hackfleisch não pode ser vendido após o Verbrauchsdatum, mas um iogurte após o MHD por vezes sim?','V3 Обґрунтуй: чому Hackfleisch не можна продавати після Verbrauchsdatum, а йогурт після MHD іноді можна?','V3 ኣረጋግጽ: ስለምንታይ Hackfleisch ድሕሪ Verbrauchsdatum ኣይሽየጥን ዮጎርት ግን ድሕሪ MHD ገለ ግዜ ይሽየጥ?','V3 Обоснуй: почему Hackfleisch нельзя продавать после Verbrauchsdatum, а йогурт после MHD иногда можно?','V3 علّل: لماذا لا يُباع Hackfleisch بعد Verbrauchsdatum بينما قد يُباع اللبن بعد MHD؟','V3 Gerekçelendir: Hackfleisch Verbrauchsdatum’dan sonra neden satılmaz, yoğurt ise MHD’den sonra bazen satılır?']

/* Gemeinsame Bedienung aller digitalen Arbeitsblätter (Lernfeld 4). Erwartet: SHEET, TR, UI */

var LI=LANGS.map(function(l){return l[0]});
var RTL={ar:1};
var FS=[100,115,130,150];
var KEY='tu.lf4.'+SHEET.id+'.v1';
var missing={};
var S;
if(typeof TRC!=='undefined')for(var kk in TRC)if(!TR[kk])TR[kk]=TRC[kk];

function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
var st;function save(){clearTimeout(st);st=setTimeout(saveNow,350)}
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function li(){return LI.indexOf(S.lang)}
/* Übersetzung */
function trText(k){if(S.lang==='de')return '';var a=TR[k];var t=a&&a[li()-1];if(!t){missing[S.lang+':'+k]=1;return ''}return t}
function tl(k){if(S.lang==='de')return '';var t=trText(k);if(!t)return '<div class="tr miss">'+esc(UI.mis[li()])+'</div>';return '<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(t)+'</div>'}
function tlo(k){if(S.lang==='de'||!TR[k])return '';return tl(k)}
function U(k){var a=UI[k];return a[li()]||a[0]}
function B(k){var g=UI[k][0];var t=S.lang!=='de'?UI[k][li()]:'';return esc(g)+(t?'<small class="b" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(t)+'</small>':'')}
/* Sichtbarkeit */
function vis(b){return b.lvl!=='v'||S.lvl==='v'}
function items(b){return (b.items||[]).filter(function(i){return i.t!=='note'&&i.t!=='est'})}
function A(id){return S.a[id]}
/* Bearbeitet? */
function answered(it){
 var v=A(it.id);
 switch(it.t){
 case 'free':return !!(v&&v.t&&v.t.trim());
 case 'mc':return v!=null;
 case 'calc':return !!(v&&String(v).trim());
 case 'gap':case 'table':case 'tf':case 'sel':var n=(it.rows||it.a).length;return !!v&&v.filter(function(x){return x!=null&&x!==''}).length>=n;
 }return false}
function units(){var u=[];SHEET.blocks.forEach(function(b){if(b.k==='read'){u.push({id:b.id,done:!!S.chk[b.id]&&A(b.id+'.q')!=null})}else if(vis(b)){items(b).forEach(function(it){u.push({id:it.id,done:answered(it)})})}});return u}
function updProg(){var u=units();var d=u.filter(function(x){return x.done}).length;var p=u.length?Math.round(100*d/u.length):0;var f=document.getElementById('progf');if(f){f.style.width=p+'%';document.getElementById('progt').textContent=U('progress')+': '+d+' / '+u.length+' '+U('done')+' ('+p+' %)'}
 var q=p===100&&!S.pdone;if(q){S.pdone=1;toast('🎉 100 %')}}
/* Bewertung */
function num(s){var t=String(s).replace(/\s/g,'').replace(/€|%|cm|g|kg|ml|l|m/gi,'');if(t.indexOf(',')>=0&&t.indexOf('.')>=0)t=t.replace(/\./g,'');t=t.replace(',','.');var x=parseFloat(t);return isNaN(x)?null:x}
function grade(it){
 var v=A(it.id),got=0,max=0,rows=[];
 switch(it.t){
 case 'free':max=it.pts||1;var s=v&&v.s!=null?v.s:null;got=s==null?0:[0,.5,1][s]*max;break;
 case 'mc':max=it.pts||1;if(v!=null&&v===it.a)got=max;break;
 case 'calc':max=it.pts||1;var n=num(v==null?'':v);if(n!=null&&Math.abs(n-it.a)<=(it.tol==null?0.005:it.tol))got=max;break;
 case 'table':case 'sel':it.rows.forEach(function(r,i){max++;var ok=v&&v[i]===r[1];if(ok)got++;rows.push(ok)});break;
 case 'tf':it.rows.forEach(function(r,i){max++;var ok=v&&v[i]===r[1];if(ok)got++;rows.push(ok)});break;
 case 'gap':it.a.forEach(function(a,i){max++;var ok=v&&v[i]===a;if(ok)got++;rows.push(ok)});break}
 return {got:got,max:max,rows:rows}}
function totals(){var g=0,m=0,bg=0;SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b))return;items(b).forEach(function(it){if(it.t==='free'&&b.noscore)return;var r=grade(it);if(b.lvl==='v')bg+=r.got;else{g+=r.got;m+=r.max}})});return {g:g,m:m,b:bg}}
function r1(x){return (Math.round(x*10)/10).toString().replace('.',',')}
/* Rendering */
function tipHTML(b){if(!b.tip)return '';return '<button class="tipb noprint" data-act="tip" data-id="'+b.id+'" aria-label="'+esc(UI.tip[0])+'">💡 '+esc(U('tip'))+'</button>'}
function tipBox(b){if(!b.tip||!S.tip[b.id])return '';return '<div class="tipbox">💡 '+esc(b.tip)+tl(b.tk||b.id+'.t')+'</div>'}
function opts(list,sel,cls,act,id,extra){return '<div class="opts">'+list.map(function(o,i){var c=cls?cls(i):'';return '<button class="opt'+(sel===i?' on':'')+(c?' '+c:'')+'" data-act="'+act+'" data-id="'+id+'" data-i="'+i+'">'+esc(o)+'</button>'}).join('')+'</div>'}
function fbBox(kind,html){return '<div class="fb '+kind+'">'+html+'</div>'}
function showFb(b){return S.chk[b.id]||S.sub}
function renderItem(b,it){
 var v=A(it.id),fb=showFb(b),h='',g,q=it.q?'<div class="q">'+esc(it.q)+'</div>'+(it.nq?'':tl(it.qk||it.id+'.q')):'';
 switch(it.t){
 case 'note':return '<div class="sit">'+it.html+'</div>';
 case 'est':return renderEst(it);
 case 'free':
  v=v||{};h=q+'<textarea class="in" rows="4" data-act="txt" data-id="'+it.id+'" placeholder="…">'+esc(v.t||'')+'</textarea>';
  h+='<div class="noprint"><button class="btn sec" data-act="sol" data-id="'+it.id+'">'+B('sol')+'</button></div>';
  if(S.sol[it.id]||fb&&v.t){h+='<div class="model"><b>'+esc(UI.model[0])+'</b>'+it.model+'</div>';
   h+='<div class="q">'+esc(UI.selfq[0])+'</div>'+tl_ui('selfq')+'<div class="row2">'+[['selfyes',2],['selfpart',1],['selfno',0]].map(function(p){return '<button class="btn gray" style="'+(v.s===p[1]&&v.s!=null?'background:#e3f0f6;border-color:#2f6f8f':'')+'" data-act="self" data-id="'+it.id+'" data-i="'+p[1]+'">'+B(p[0])+'</button>'}).join('')+'</div>'}
  break;
 case 'mc':
  g=grade(it);h=q+opts(it.o,v,fb?function(i){return i===it.a?'ok':(v===i?'no':'')}:null,'mc',it.id);
  if(fb)h+=fbBox(g.got?'ok':'no',g.got?esc(U('right')):esc(U('wrong'))+' '+esc(UI.correctis[0])+' <b>'+esc(it.o[it.a])+'</b>');
  break;
 case 'calc':
  g=grade(it);h=q+'<div class="row2"><input class="in" style="max-width:12rem" inputmode="decimal" autocomplete="off" data-act="calc" data-id="'+it.id+'" value="'+esc(v||'')+'"><b>'+esc(it.unit||'')+'</b></div>';
  if(fb){var trap='';if(!g.got&&it.traps){var nv=num(v==null?'':v);it.traps.forEach(function(t){if(nv!=null&&Math.abs(nv-t[0])<=0.006)trap='<div>⚠ '+esc(t[1])+'</div>'+tl(it.id+'.w')})}h+=fbBox(g.got?'ok':'no',(g.got?esc(U('right')):esc(U('wrong'))+' '+esc(UI.correctis[0])+' <b>'+r1(it.a)+' '+esc(it.unit||'')+'</b>')+trap+'<div><b>'+esc(UI.steps[0])+':</b><br>'+it.steps.map(esc).join('<br>')+'</div>'+tl_ui('steps'))}
  break;
 case 'table':
  g=grade(it);h=q+'<table class="tbl"><tr><th>'+(it.hd||'')+'</th>'+it.cols.map(function(c){return '<th class="c" title="'+esc(c[1]||'')+'">'+esc(c[0])+'</th>'}).join('')+'</tr>'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+'</td>'+it.cols.map(function(c,j){var cl=sel===j?' on':'';if(fb){if(j===r[1])cl+=sel===j?' ok':' sol';else if(sel===j)cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tb" data-id="'+it.id+'" data-r="'+i+'" data-i="'+j+'" aria-label="'+esc(c[1]||c[0])+'">'+esc(c[0])+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(it.legend)h+='<div class="meta">'+esc(it.legend)+'</div>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'tf':
  g=grade(it);h=q+'<table class="tbl">'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+'</td>'+[[true,'✔'],[false,'✘']].map(function(c){var cl=sel===c[0]?' on':'';if(fb){if(c[0]===r[1])cl+=sel===c[0]?' ok':' sol';else if(sel===c[0])cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tf" data-id="'+it.id+'" data-r="'+i+'" data-i="'+(c[0]?1:0)+'">'+c[1]+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'sel':
  g=grade(it);h=q+'<table class="tbl selt">'+it.rows.map(function(r,i){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';
   return '<tr><td>'+esc(r[0])+'</td><td><select class="in gapsel'+cl+'" data-act="sel" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.o.map(function(o,j){return '<option value="'+j+'"'+(sel===j?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'+(fb&&!g.rows[i]?'<div class="meta">'+esc(UI.correctis[0])+' <b>'+esc(it.o[r[1]])+'</b></div>':'')+'</td></tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'gap':
  g=grade(it);var k=0;h=q+'<div class="gaptxt">'+it.text.split('___').map(function(p,i,arr){var s=esc(p);if(i<arr.length-1){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';s+='<select class="gapsel'+cl+'" data-act="gap" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.bank.map(function(o){return '<option'+(sel===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}return s}).join('')+'</div>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max+(g.got<g.max?' — '+esc(UI.correctis[0])+' <b>'+it.a.map(esc).join(' · ')+'</b>':''));
  break}
 if(fb&&it.ex&&it.t!=='free')h+='<div class="meta">'+esc(it.ex)+'</div>'+tl(it.id+'.e');
 return '<div class="item">'+h+'</div>'}
function tl_ui(k){if(S.lang==='de')return '';return '<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U(k))+'</div>'}
function renderEst(it){var v=A(it.id)||{};var t=totals();return '<div class="row2"><label>'+B('estl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="e" value="'+esc(v.e||'')+'"></div><div class="row2"><label>'+B('resl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="r" value="'+esc(v.r||'')+'"></div>'+(v.e&&v.r?'<div class="meta">'+esc(UI.diff[0])+': '+(Number(v.r)-Number(v.e))+'</div>':'')}
function renderRead(b){
 var mk=S.mk[b.id]||[],done=S.chk[b.id],idx=0,tot=0,hit=0,wrong=0;
 var paras=b.paras.map(function(p){return '<p>'+p.replace(/\[\[(.+?)\]\]([.,;:!?)]*)|\{\{(.+?)\}\}([.,;:!?)]*)|([^\s\[\{]+)/g,function(m,a,pa,d,pd,w){var i=idx++,sel=mk.indexOf(i)>=0,cl='';var good=a!=null;if(good)tot++;
   if(done){if(sel&&good){cl=' ok';hit++}else if(sel){cl=' no';wrong++}else if(good)cl=' miss'}else if(sel)cl=' on';
   return '<span class="w'+cl+'" data-act="mk" data-id="'+b.id+'" data-i="'+i+'">'+esc(a||d||w)+'</span>'+esc(pa||pd||'')+' '})+'</p>'}).join('');
 var h='<div class="card read"><h2>📖 '+esc(b.h)+'</h2>'+tl(b.hk||b.id+'.h')+'<div class="meta">'+esc(U('readhint'))+'</div>'+(b.sum?'<div class="meta"><b>→ </b>'+esc(b.sum)+'</div>'+tl(b.id+'.s'):'')+paras;
 if(b.html)h+=b.html;
 h+='<button class="btn" data-act="mkchk" data-id="'+b.id+'">'+B('mark')+'</button>';
 if(done){var all=b.paras.join(' ').match(/\[\[.+?\]\]/g)||[];h+=fbBox(wrong===0&&hit===all.length?'ok':'part','✔ '+hit+' / '+all.length+' '+esc(U('found'))+(wrong?' · ✘ '+wrong+' '+esc(U('toomany')):'')+(hit<all.length?'<br>'+esc(U('missed')):''))}
 if(b.q){var v=A(b.id+'.q');h+='<div class="q">'+esc(b.q.q)+'</div>'+tl(b.id+'.qq')+opts(b.q.o,v,(done&&v!=null)?function(i){return i===b.q.a?'ok':(v===i?'no':'')}:null,'mc',b.id+'.q')}
 return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});
 return h}
function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';
 SHEET.blocks.forEach(function(b){if(b.k==='read')h+=renderRead(b);else if(vis(b))h+=renderTask(b)});
 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';
 if(S.sub)h+=renderResult();
 document.getElementById('app').innerHTML=h;
 document.getElementById('report').innerHTML=renderReport();
 renderBar();updProg();pad();
 window.scrollTo(0,y)}
function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');
 document.documentElement.lang=S.lang;
 }

window.addEventListener('resize',pad);
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function dialog(msgKey,onYes){var d=document.createElement('div');d.className='dlg';d.innerHTML='<div><p><b>'+esc(UI[msgKey][0])+'</b></p>'+(S.lang!=='de'?'<p>'+esc(U(msgKey))+'</p>':'')+'<button class="btn" data-d="y">'+B('yes')+'</button><button class="btn gray" data-d="n">'+B('cancel')+'</button></div>';d.addEventListener('click',function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-d');if(!x&&e.target!==d&&!e.target.closest('[data-d]'))return;var dd=e.target.closest('[data-d]');if(dd&&dd.getAttribute('data-d')==='y')onYes();d.remove()});document.body.appendChild(d)}
function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});
document.getElementById('gear').addEventListener('click',function(){S.open=!S.open;save();renderBar()});
document.addEventListener('change',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act');if(act==='gap'||act==='sel'){var arr=S.a[el.getAttribute('data-id')]||[];var v=el.value;arr[Number(el.getAttribute('data-r'))]=act==='sel'?(v===''?null:Number(v)):(v===''?null:v);S.a[el.getAttribute('data-id')]=arr;save();updProg()}});
document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
document.addEventListener('visibilitychange',saveNow);window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',function(){document.getElementById('report').innerHTML=renderReport()});
/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;

if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};

})();
