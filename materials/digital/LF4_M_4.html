<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF 4 · Digitales Arbeitsblatt</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + .5rem) 1rem .4rem}
#bar .row{display:flex;align-items:center;gap:.6rem;max-width:56rem;margin:0 auto}
#bar .ttl{font-weight:700;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{height:.7rem;background:#e6e3da;border-radius:1rem;overflow:hidden;max-width:56rem;margin:.35rem auto 0}
#progf{height:100%;width:0;background:var(--pri);transition:width .4s}
#progt{font-size:.8rem;color:var(--mute);max-width:56rem;margin:.1rem auto 0}
#langs{display:flex;gap:.4rem;overflow-x:auto;max-width:56rem;margin:.35rem auto 0;padding-bottom:.15rem;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;min-height:44px;padding:0 .9rem;border:2px solid var(--line);background:#fff;border-radius:2rem;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;margin:0 0 1rem}
.card h2{font-size:1.25rem;margin:0 0 .4rem;line-height:1.3}
.card h2 .nr{display:inline-block;background:var(--pri);color:#fff;border-radius:.5rem;padding:0 .5rem;margin-right:.4rem;font-size:.95rem}
.vtag{display:inline-block;background:#6a3fa0;color:#fff;border-radius:.5rem;padding:0 .5rem;font-size:.85rem;margin-left:.3rem}
.card.v{border-color:#6a3fa0;background:#faf6ff}
.tr{font-size:.9rem;color:#4a5a66;background:#f1f6f9;border-left:4px solid #9cc3d5;border-radius:.4rem;padding:.3rem .6rem;margin:.3rem 0 .5rem;line-height:1.5}
.tr[dir=rtl]{border-left:0;border-right:4px solid #9cc3d5}
.tr[lang=ti]{font-family:"Kefa","Noto Sans Ethiopic",sans-serif}
.tr[lang=vi]{line-height:1.65}
small.b{display:block;font-size:.72rem;font-weight:400;opacity:.9;line-height:1.2}
.in{display:block;width:100%;min-height:48px;font:inherit;font-size:1rem;padding:.55rem .7rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink)}
input.in,select.in{font-size:1rem}
textarea.in{min-height:5.5rem;resize:vertical}
.btn{min-height:48px;padding:.4rem 1.1rem;border:0;border-radius:.8rem;background:var(--pri);color:#fff;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin:.3rem .4rem .3rem 0}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.gray{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.big{min-height:56px;font-size:1.1rem}
.btn:active,.pill:active,.opt:active,.ch:active{transform:scale(.97)}
.tipb{min-height:48px;min-width:48px;border-radius:2rem;border:2px solid var(--warn);background:var(--warnbg);font:inherit;font-size:1rem;cursor:pointer;padding:0 .9rem;float:right;margin:0 0 .3rem .5rem}
.tipbox{background:var(--warnbg);border:2px solid var(--warn);border-radius:.8rem;padding:.5rem .8rem;margin:.4rem 0}
.q{margin:.8rem 0 .2rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:.45rem;margin:.3rem 0}
.opt{min-height:48px;text-align:left;padding:.5rem .8rem;border:2px solid var(--line);background:#fff;border-radius:.8rem;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--pri);background:var(--pri2);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.tbl{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:1rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.4rem .3rem;text-align:left;vertical-align:middle}
.tbl.info th{background:#eef3f6}
.tbl.info td,.tbl.info th{border:1px solid var(--line);padding:.4rem .5rem}
.tbl td.c{text-align:center;white-space:nowrap}
.ch{min-width:48px;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:.7rem;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer;margin:2px}
.ch.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.sol{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
tr.rok td{background:var(--okbg)}tr.rno td{background:var(--badbg)}
.fb{border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0;font-size:1rem}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb.part{background:var(--warnbg);border:1px solid var(--warn)}
.sit{background:#eef3f6;border-left:5px solid var(--pri);border-radius:.5rem;padding:.5rem .8rem;margin:.5rem 0}
.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#23303a;color:#fff;padding:.6rem 1.1rem;border-radius:2rem;z-index:99;font-size:1rem;max-width:90%}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}
.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}
#set.open{display:block}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row2 label{font-weight:600;min-width:7rem}
.nowrap{white-space:nowrap}
#report{display:none}
@media (max-width:600px){main{padding-top:8.2rem}.card{padding:.8rem}h1{font-size:1.35rem}.tbl{font-size:.95rem}}
@media print{
 body{background:#fff;padding:0;font-size:11pt}
 #bar,#set,main,.toast,.dlg,.noprint{display:none!important}
 #report{display:block!important}
 #report h1{font-size:16pt}
 #report table{width:100%;border-collapse:collapse;font-size:10pt}
 #report td,#report th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

</style>
</head>

{k:'read',id:'r1',h:'Zum Nachlesen: Die drei Verkaufsformen',sum:'Je erklärungsbedürftiger und wertvoller die Ware, desto mehr Bedienung.',
 paras:['Bei der [[Vollbedienung]] hat der Kunde keinen direkten Zugang zur Ware. Das Personal legt vor, berät und verpackt. Das passt zu offenen Lebensmitteln, Schmuck, Uhren und Arzneimitteln.','Bei der [[Vorwahl]] hat der Kunde Zugang zur Ware und wählt vor. Das Personal berät auf Wunsch. Das passt zu Bekleidung, Schuhen, Elektrogeräten und Möbeln.','Bei der [[Selbstbedienung]] nimmt der Kunde die Ware selbst und bringt sie zur Kasse. Es gibt kaum Beratung. Die Warenpräsentation ist der [[stumme Verkäufer]]: Platzierung, Regal und Preisschild müssen das erledigen, was sonst das Personal tut.','Kontaktaufnahme: In der Vollbedienung sofort freundlich ansprechen. In der Vorwahl den Kunden erst schauen lassen und auf [[Signale]] achten, dann [[warenbezogen]] ansprechen („Den gibt es auch in …“). In der Selbstbedienung hilfsbereit sein, wenn jemand sucht.'],
 html:'<table class="tbl info"><tr><th></th><th>Vollbedienung</th><th>Vorwahl</th><th>Selbstbedienung</th></tr><tr><th>Vorteile Kunde</th><td>intensive, persönliche Beratung</td><td>kann sich erst in Ruhe orientieren, fühlt sich nicht bedrängt, Beratung bei Bedarf, kürzere Wartezeiten</td><td>schnell, niedrige Preise, keine Wartezeit auf Personal</td></tr><tr><th>Vorteile Betrieb</th><td>höhere Preise möglich, Schutz vor Diebstahl, Kundenbindung</td><td>weniger Personal nötig, Mehrfachbedienung möglich, mehr Zeit für Warenpflege</td><td>niedrige Personalkosten, viele Kunden gleichzeitig</td></tr><tr><th>Nachteile</th><td>viel Personal, hohe Kosten, Wartezeiten</td><td>Kunden gehen manchmal ohne Beratung und ohne Kauf</td><td>kaum Beratung, höheres Diebstahlrisiko; die Ware muss sich selbst verkaufen</td></tr></table><p class="meta">Neue Formen: SB-Kassen (Kunden scannen selbst) und Click &amp; Collect (online bestellen, im Laden abholen).</p>',
 q:{q:'Was ist der „stumme Verkäufer“ in der Selbstbedienung?',o:['die Warenpräsentation (Platzierung, Regal, Preisschild)','die Kassiererin','die Videokamera'],a:0}},

 sit:'<b>Die Aufgabe:</b> Die Kaufhaus Hansa GmbH stellt ihre Haushaltswarenabteilung von Vollbedienung auf Vorwahl um. Nennen Sie je zwei Vorteile für die Kaufhaus Hansa GmbH und für die Kunden. (4 Punkte)<table class="tbl info"><tr><th>Denkschritt</th><th>So gehe ich vor</th></tr><tr><td>1 Zwei Seiten</td><td>Die Aufgabe will zwei Perspektiven. Ich mache zwei Spalten, sonst vergesse ich eine.</td></tr><tr><td>2 Betrieb</td><td>Was spart der Betrieb, was gewinnt er? → Einsparung von Personalkosten · mehr Zeit für Warenpflege</td></tr><tr><td>3 Kunden</td><td>Was ist für den Kunden angenehmer? → Kunden fühlen sich nicht bedrängt · Beratung nur auf Wunsch</td></tr><tr><td>4 Prüfen</td><td>Nicht denselben Vorteil zweimal schreiben („nicht bedrängt“ und „in Ruhe schauen“ ist fast dasselbe).</td></tr></table>',items:[

{k:'task',id:'a4',n:'Aufgabe 4',h:'Geführte Übung: Welche Verkaufsform passt?',intro:'VB = Vollbedienung · VW = Vorwahl · SB = Selbstbedienung. Tippe an, welche Verkaufsform passt.',ik:'a4.i',tip:'Frage dich: Ist die Ware offen, teuer oder erklärungsbedürftig (VB)? Will der Kunde selbst schauen und anprobieren (VW)? Ist die Ware einfach und bekannt (SB)?',ex:'Offene oder teure Ware → VB. Kunde will schauen und anprobieren → VW. Bekannte, günstige Ware → SB.',items:[
 {t:'table',id:'a4.1',cols:[['VB','Vollbedienung'],['VW','Vorwahl'],['SB','Selbstbedienung']],rows:[['1 Käse an der Frischetheke',0],['2 Damenschuhe',1],['3 Nudeln und Konserven',2],['4 Goldkette beim Juwelier',0],['5 Waschmaschine im Elektrofachmarkt',1],['6 Zahnpasta in der Drogerie',2],['7 frischer Fisch',0],['8 Jeans im Modehaus',1]]}]},
{k:'task',id:'a5',n:'Aufgabe 5',h:'Freie Übung: Umstellung auf Vorwahl',intro:'Das Haushaltswarengeschäft „Topf & Deckel“ hat bisher alle Artikel in Vitrinen und Regalen hinter der Theke. Nun soll auf Vorwahl umgestellt werden (Arbeitsheft S. 163).',ik:'a5.i',tip:'Denke an drei Seiten: Kunde, Inhaber und Laden. Was hat jeder davon?',ex:'Kunde: anfassen, nicht warten. Inhaber: Kosten sparen, mehr Umsatz. Laden: freier Zugang, klare Gliederung, Sicherung.',items:[
 {t:'free',id:'a5.1',q:'5.1 Nenne zwei Gründe, warum Kunden die Vorwahl bevorzugen.',model:'sie können Ware anfassen und vergleichen; fühlen sich nicht beobachtet oder bedrängt; müssen nicht warten'},
 {t:'free',id:'a5.2',q:'5.2 Nenne zwei Erwartungen, die der Inhaber an die Umstellung hat.',model:'weniger Personalkosten / Mehrfachbedienung; mehr Umsatz durch Impuls- und Zusatzkäufe, weil Kunden die Ware sehen und anfassen'},
 {t:'free',id:'a5.3',q:'5.3 Was muss sich im Laden ändern, damit die Vorwahl funktioniert? Nenne drei Punkte.',model:'Ware frei zugänglich auf Warenträgern; klare Gliederung und Laufweg; gut lesbare Preisschilder; Diebstahlsicherung; Personal ansprechbar auf der Fläche'}]},
{k:'task',id:'a6',n:'Aufgabe 6',h:'Rollenspiel: Die richtige Kontaktaufnahme (2 Leistungspunkte)',intro:'Übt zu zweit eine Szene aus eurem Ausbildungsbetrieb in der Verkaufsform, die dort üblich ist. Ein anderes Paar beobachtet mit dem Beobachtungsbogen (auf Papier) und gibt Feedback. Schreibe hier eure Ansprache in wörtlicher Rede auf.',ik:'a6.i',tip:'Eine gute Ansprache bezieht sich auf die Ware und ist keine Ja-Nein-Frage.',ex:'Prüfe: Passt der Zeitpunkt? Hast du auf Signale geachtet? Ist die Ansprache warenbezogen?',
 sit:'<b>Der Beobachtungsbogen:</b> Die Kontaktaufnahme passt zur Verkaufsform (Zeitpunkt). · Der Verkäufer achtet auf Signale des Kunden. · Die Ansprache ist warenbezogen, keine Ja-Nein-Frage. · Blickkontakt, freundlich, nicht aufdringlich. (jeweils: ja / teilweise / nein)',items:[
 {t:'free',id:'a6.1',pts:2,q:'Unsere Ansprache in wörtlicher Rede:',model:'Beispiel: „Die Kaffeemaschine hat einen eingebauten Milchaufschäumer – soll ich ihn Ihnen kurz vorführen?“'}]},

 {t:'free',id:'a7.2',pts:2,q:'7.2 Nennen Sie zwei Vorteile der Vorwahl für die Kaufhaus Hansa GmbH. (2 Punkte)',model:'weniger Personal nötig / Einsparung von Personalkosten; Mehrfachbedienung; mehr Zeit für Warenpflege'},
 {t:'free',id:'a7.3',pts:4,q:'7.3 In der Vorwahl-Abteilung sieht sich eine Kundin Pullover an. Nennen Sie zwei Anzeichen, dass sie beraten werden möchte. (4 Punkte)',model:'sucht Blickkontakt zum Personal; schaut sich suchend um; betrachtet einen Artikel längere Zeit; wirkt orientierungslos (je 2 P.)'},

{k:'task',id:'a8',n:'Aufgabe 8',h:'Für Profis',hk:'c.profis.h',intro:'Schwierigere Fragen. Begründe deine Antwort.',ik:'c.profis.i',tip:'8.1: Denke an Alter und Preis der Ware. 8.2: Schaue auf drei Seiten: Kunden, Beschäftigte, Händler.',ex:'Ein gutes Urteil betrachtet alle Seiten und begründet die Entscheidung.',items:[
 {t:'free',id:'a8.1',q:'8.1 Tabakwaren und hochprozentiger Alkohol stehen in vielen Supermärkten hinter der Kasse oder in abgeschlossenen Vitrinen – also nicht in Selbstbedienung. Erläutern Sie zwei Gründe.',model:'Jugendschutz: Das Alter muss geprüft werden, bevor verkauft wird. Diebstahl: Die Waren sind klein und teuer. Außerdem gibt es gesetzliche Vorgaben zur Abgabe.'},
 {t:'free',id:'a8.2',q:'8.2 Einige Händler testen kleine Läden ganz ohne Personal: Eintritt per App, Bezahlung automatisch. Beurteilen Sie diese Form aus Sicht der Kunden, der Beschäftigten und des Händlers.',model:'Kunden: rund um die Uhr einkaufen, aber keine Beratung und nichts für Menschen ohne Smartphone. Beschäftigte: weniger Arbeitsplätze, andere Aufgaben (Auffüllen, Technik). Händler: niedrige Personalkosten, aber hohe Technikkosten und Diebstahlrisiko. Urteil begründet.'}]},
{k:'task',id:'v1',lvl:'v',n:'Vertiefung',h:'Warum ist das so?',hk:'c.v.h',intro:'Begründe deine Antwort in ganzen Sätzen. Vergleiche danach mit der Musterlösung.',ik:'c.v.i',tip:'Beginne mit „Weil …“. Denke an Kunde und Betrieb.',tk:'c.v.t',ek:'c.v.e',items:[
 {t:'free',id:'v1.1',pts:2,q:'V1 Warum ist die Warenpräsentation in der Selbstbedienung der „stumme Verkäufer“?',model:'Es gibt kaum Personal und Beratung. Darum müssen Platzierung, Regal und Preisschild das erledigen, was sonst das Personal tut: die Ware zeigen, erklären und zum Kauf anregen.'},
 {t:'free',id:'v1.2',pts:2,q:'V2 Begründe: Warum gilt „Je erklärungsbedürftiger und wertvoller die Ware, desto mehr Bedienung“?',model:'Erklärungsbedürftige Ware braucht Beratung durch das Personal. Wertvolle Ware ist diebstahlgefährdet; bei Vollbedienung ist sie besser geschützt, und die höheren Preise können die Personalkosten bezahlen.'}]},

'title':['Các hình thức bán hàng','Las formas de venta','As formas de venda','Форми продажу','ቅርጽታት ሽያጥ','Формы продажи','أشكال البيع','Satış biçimleri'],
'can.0':['Phân biệt Vollbedienung (phục vụ đầy đủ), Vorwahl (chọn trước) và Selbstbedienung (tự phục vụ).','Distinguir Vollbedienung (servicio completo), Vorwahl (preselección) y Selbstbedienung (autoservicio).','Distinguir Vollbedienung (serviço completo), Vorwahl (pré-seleção) e Selbstbedienung (self-service).','Розрізняти Vollbedienung (повне обслуговування), Vorwahl (попередній вибір) і Selbstbedienung (самообслуговування).','Vollbedienung፣ Vorwahl ን Selbstbedienung (ባዕል ኣገልግሎት) ፍለይ።','Различать Vollbedienung (полное обслуживание), Vorwahl (предварительный выбор) и Selbstbedienung (самообслуживание).','التمييز بين Vollbedienung (خدمة كاملة) وVorwahl (اختيار مسبق) وSelbstbedienung (خدمة ذاتية).','Vollbedienung (tam servis), Vorwahl (ön seçim) ve Selbstbedienung (self servis) farkını bilmek.'],
'can.1':['Kể ưu và nhược điểm của từng hình thức bán hàng cho khách và cho cửa hàng.','Nombrar ventajas y desventajas de cada forma de venta para clientes y empresa.','Nomear vantagens e desvantagens de cada forma de venda para clientes e empresa.','Назвати переваги й недоліки кожної форми продажу для клієнтів і підприємства.','ረብሓታትን ጉድለታትን ነፍሲ ወከፍ ቅርጺ ሽያጥ ንዓሚላትን ንኩባንያን ጥቀስ።','Назвать плюсы и минусы каждой формы продажи для клиентов и предприятия.','ذكر مزايا وعيوب كل شكل بيع للزبائن وللمنشأة.','Her satış biçiminin müşteri ve işletme için artı ve eksilerini söylemek.'],
'a1.t':['Hãy nghĩ về Schaufenster (cửa sổ trưng bày): có bao nhiêu thời gian? Có những loại nào?','Piensa en el Schaufenster (escaparate): ¿cuánto tiempo tiene? ¿Qué tipos hay?','Pensa na Schaufenster (montra): quanto tempo tem? Que tipos há?','Згадай Schaufenster (вітрину): скільки в нього часу? Які є типи?','ብዛዕባ Schaufenster ሕሰብ: ክንደይ ግዜ ኣለዎ? ኣየኖት ዓይነታት ኣለዉ?','Вспомни Schaufenster (витрину): сколько у неё времени? Какие бывают типы?','فكّر في Schaufenster (واجهة العرض): كم من الوقت لديها؟ ما الأنواع؟','Schaufenster’i (vitrin) düşün: Ne kadar zamanı var? Hangi türler var?'],
'a1.e':['Xem lại Modul 3: mục tiêu, nguyên tắc và các loại Schaufenster.','Repasa el Modul 3: objetivos, principios y tipos de Schaufenster.','Revê o Modul 3: objetivos, princípios e tipos de Schaufenster.','Повтори Modul 3: цілі, принципи й типи Schaufenster.','Modul 3 ደጊምካ ርአ: ዕላማታት፣ መስርሕን ዓይነታትን ናይ Schaufenster።','Повтори Modul 3: цели, принципы и типы Schaufenster.','راجع Modul 3: أهداف ومبادئ وأنواع Schaufenster.','Modul 3’e tekrar bak: Schaufenster’in amaçları, ilkeleri ve türleri.'],
'a1.1.q':['1.1 Người đi đường nhìn Schaufenster bao lâu?','1.1 ¿Cuánto tiempo mira un transeúnte un Schaufenster?','1.1 Quanto tempo olha um transeunte para uma Schaufenster?','1.1 Скільки часу перехожий дивиться на Schaufenster?','1.1 ሓላፊ መገዲ ንSchaufenster ክንደይ ግዜ ይጥምት?','1.1 Сколько времени прохожий смотрит на Schaufenster?','1.1 كم ينظر المارّ إلى Schaufenster؟','1.1 Yoldan geçen biri Schaufenster’e ne kadar bakar?'],
'a1.2.q':['1.2 Một cửa sổ chỉ bày chai rượu vang với số lượng lớn. Đó là loại nào?','1.2 Un escaparate solo muestra botellas de vino en gran cantidad. ¿De qué tipo es?','1.2 Uma montra mostra só garrafas de vinho em grande quantidade. De que tipo é?','1.2 Вітрина показує лише пляшки вина у великій кількості. Який це тип?','1.2 ሓደ መስኮት ብብዝሒ ጥራይ ጥርሙዝ ጽጌ ወይኒ የርኢ። እዚ ኣየናይ ዓይነት እዩ?','1.2 Витрина показывает только бутылки вина в большом количестве. Какой это тип?','1.2 واجهة تعرض زجاجات نبيذ فقط بكمية كبيرة. ما نوعها؟','1.2 Bir vitrinde yalnızca çok sayıda şarap şişesi var. Bu hangi tür?'],
'a1.3.q':['1.3 Kể hai nguyên tắc thiết kế Schaufenster.','1.3 Nombra dos principios del diseño del Schaufenster.','1.3 Nomeia dois princípios do design da Schaufenster.','1.3 Назви два принципи оформлення Schaufenster.','1.3 ክልተ መስርሕ ምድላው Schaufenster ጥቀስ።','1.3 Назови два принципа оформления Schaufenster.','1.3 اذكر مبدأين لتصميم Schaufenster.','1.3 Schaufenster tasarımının iki ilkesini say.'],
'a2.h':['Ba cửa hàng, ba vai','Tres tiendas, tres papeles','Três lojas, três papéis','Три магазини, три ролі','ሰለስተ ድኳናት፣ ሰለስተ ግደታት','Три магазина, три роли','ثلاثة متاجر، ثلاثة أدوار','Üç mağaza, üç rol'],
'a2.i':['Trong giờ học, các em đóng vai: một người là khách, một người bán. Ở đây em ghép: Cách bắt chuyện nào hợp với tình huống?','En clase representáis escenas: una persona es cliente y otra vende. Aquí relacionas: ¿qué forma de contacto encaja con la situación?','Na aula representam cenas: uma pessoa é cliente e outra vende. Aqui associas: que abordagem combina com a situação?','На уроці ви граєте сценки: одна особа — клієнт, інша продає. Тут ти добираєш: яка розмова з клієнтом пасує до ситуації?','ኣብ ትምህርቲ ትጻወቱ: ሓደ ዓሚል፣ ሓደ ሻያጢ። ኣብዚ ትዛምድ: ኣየናይ ምድላይ ርክብ ምስ ኩነታት ይሰማማዕ?','На уроке вы играете сценки: один — клиент, другой — продавец. Здесь ты сопоставляешь: какое обращение подходит ситуации?','في الحصة تؤدّون مشاهد: شخص زبون وآخر بائع. هنا تطابق: أي مدخل للحديث يناسب الموقف؟','Derste sahne oynarsınız: Biri müşteri, biri satıcı. Burada eşleştirirsin: Hangi konuşma başlangıcı duruma uyar?'],
'a2.t':['Tự hỏi: Ai được tiếp cận hàng? Khách đang làm gì? Lời bắt chuyện phải gắn với hàng hóa.','Pregúntate: ¿quién tiene acceso a la mercancía? ¿Qué hace el cliente ahora? El saludo debe referirse a la mercancía.','Pergunta-te: quem tem acesso à mercadoria? O que faz o cliente agora? A abordagem deve referir-se à mercadoria.','Запитай себе: хто має доступ до товару? Що зараз робить клієнт? Звернення має стосуватися товару.','ባዕልኻ ሕተት: መን ናብ ኣቕሑት ኣብጺሑ? ዓሚል ሕጂ እንታይ ይገብር? ዘረባ ምስ ኣቕሑት ክዛመድ ኣለዎ።','Спроси себя: у кого есть доступ к товару? Что сейчас делает клиент? Обращение должно относиться к товару.','اسأل نفسك: من يصل إلى البضاعة؟ ماذا يفعل الزبون الآن؟ يجب أن يرتبط الكلام بالبضاعة.','Kendine sor: Mala kim ulaşabilir? Müşteri şu an ne yapıyor? Konuşma ürünle ilgili olmalı.'],
'a2.e':['Lời bắt chuyện tốt hợp với hình thức bán hàng và nhắc đến hàng hóa. Câu hỏi có/không dễ làm cuộc trò chuyện kết thúc.','Un buen saludo encaja con la forma de venta y se refiere a la mercancía. Una pregunta de sí/no termina rápido la conversación.','Uma boa abordagem combina com a forma de venda e refere-se à mercadoria. Uma pergunta de sim/não termina depressa a conversa.','Добре звернення пасує формі продажу й стосується товару. Питання «так/ні» швидко обриває розмову.','ጽቡቕ ምድላይ ርክብ ምስ ቅርጺ ሽያጥ ይሰማማዕን ኣቕሑት ይጠቅስን። ሕቶ እወ/ኣይፋል ዘረባ ቀልጢፉ የብቅዕ።','Хорошее обращение подходит форме продажи и относится к товару. Вопрос «да/нет» быстро обрывает разговор.','المدخل الجيد يناسب شكل البيع ويتعلق بالبضاعة. سؤال نعم/لا ينهي الحديث بسرعة.','İyi bir konuşma başlangıcı satış biçimine uyar ve ürünle ilgilidir. Evet/hayır sorusu konuşmayı hemen bitirir.'],
'a2.1.q':['2.1 Cách bắt chuyện nào hợp với tình huống?','2.1 ¿Qué saludo encaja con la situación?','2.1 Que abordagem combina com a situação?','2.1 Яке звернення пасує до ситуації?','2.1 ኣየናይ ምድላይ ርክብ ምስ ኩነታት ይሰማማዕ?','2.1 Какое обращение подходит ситуации?','2.1 أي مدخل يناسب الموقف؟','2.1 Hangi konuşma başlangıcı duruma uyar?'],
'a2.2.q':['2.2 Tại sao „Kann ich Ihnen helfen?“ (Tôi giúp gì được ạ?) thường không hợp ở cửa hàng thời trang?','2.2 ¿Por qué «Kann ich Ihnen helfen?» (¿Puedo ayudarle?) suele encajar mal en una tienda de moda?','2.2 Porque é que «Kann ich Ihnen helfen?» (Posso ajudar?) muitas vezes não resulta numa loja de moda?','2.2 Чому «Kann ich Ihnen helfen?» (Чим можу допомогти?) часто не підходить у магазині одягу?','2.2 ስለምንታይ «Kann ich Ihnen helfen?» ኣብ ድኳን ክዳን ብዙሕ ግዜ ኣይሰማማዕን?','2.2 Почему «Kann ich Ihnen helfen?» (Могу вам помочь?) часто не подходит в магазине одежды?','2.2 لماذا لا يناسب «Kann ich Ihnen helfen?» (هل أستطيع مساعدتك؟) غالبًا متجر الأزياء؟','2.2 «Kann ich Ihnen helfen?» (Size yardımcı olabilir miyim?) moda mağazasında neden çoğu zaman uygun değildir?'],
'r1.h':['Đọc thêm: Ba hình thức bán hàng','Para leer: las tres formas de venta','Para ler: as três formas de venda','Для читання: три форми продажу','ንምንባብ: ሰለስተ ቅርጽታት ሽያጥ','Для чтения: три формы продажи','للقراءة: أشكال البيع الثلاثة','Okumak için: Üç satış biçimi'],
'r1.s':['Hàng càng cần giải thích và càng đắt thì càng nhiều phục vụ.','Cuanto más explicación y valor tiene la mercancía, más servicio.','Quanto mais explicação e valor tem a mercadoria, mais serviço.','Що складніший і дорожчий товар, то більше обслуговування.','ኣቕሓ ብዝበዝሐ መግለጺ ዘድልዮን ዋጋ ዘለዎን መጠን ብዙሕ ኣገልግሎት።','Чем сложнее и дороже товар, тем больше обслуживания.','كلما احتاجت البضاعة شرحًا وكانت أغلى، زادت الخدمة.','Mal ne kadar açıklama gerektirir ve değerliyse o kadar çok hizmet.'],
'r1.qq':['„Stummer Verkäufer“ (người bán thầm lặng) trong Selbstbedienung (tự phục vụ) là gì?','¿Qué es el «stumme Verkäufer» (vendedor mudo) en la Selbstbedienung (autoservicio)?','O que é o «stumme Verkäufer» (vendedor mudo) na Selbstbedienung (self-service)?','Що таке «stummer Verkäufer» (німий продавець) у Selbstbedienung (самообслуговуванні)?','«Stummer Verkäufer» (ዓዲ ሻያጢ) ኣብ Selbstbedienung እንታይ እዩ?','Что такое «stummer Verkäufer» (немой продавец) в Selbstbedienung (самообслуживании)?','ما هو «stummer Verkäufer» (البائع الصامت) في Selbstbedienung (الخدمة الذاتية)؟','Selbstbedienung’da (self servis) «stummer Verkäufer» (sessiz satıcı) nedir?'],
'a3.t':['Xem bảng „So gehe ich vor“. Bài yêu cầu hai phía: cửa hàng và khách.','Mira la tabla «So gehe ich vor». La tarea pide dos lados: empresa y clientes.','Vê a tabela «So gehe ich vor». A tarefa pede dois lados: empresa e clientes.','Подивись таблицю «So gehe ich vor». Завдання вимагає двох сторін: підприємство й клієнти.','ሰንጠረዥ «So gehe ich vor» ርአ። እቲ ዕማም ክልተ ወገናት የድሊ: ኩባንያን ዓሚላትን።','Посмотри таблицу «So gehe ich vor». Задание требует две стороны: предприятие и клиенты.','انظر جدول «So gehe ich vor». المهمة تطلب جانبين: المنشأة والزبائن.','«So gehe ich vor» tablosuna bak. Görev iki taraf ister: işletme ve müşteriler.'],
'a3.e':['Hai góc nhìn: cửa hàng và khách. Mỗi ưu điểm chỉ nêu một lần.','Dos perspectivas: empresa y clientes. Cada ventaja solo una vez.','Duas perspetivas: empresa e clientes. Cada vantagem só uma vez.','Дві перспективи: підприємство й клієнти. Кожну перевагу — лише раз.','ክልተ ኣረኣእያታት: ኩባንያን ዓሚላትን። ነፍሲ ወከፍ ረብሓ ሓንሳብ ጥራይ።','Две перспективы: предприятие и клиенты. Каждое преимущество — один раз.','منظوران: المنشأة والزبائن. كل ميزة مرة واحدة فقط.','İki bakış: işletme ve müşteriler. Her avantaj yalnızca bir kez.'],
'a4.h':['Bài tập có hướng dẫn: Hình thức bán hàng nào phù hợp?','Ejercicio guiado: ¿qué forma de venta encaja?','Exercício guiado: que forma de venda combina?','Керована вправа: яка форма продажу підходить?','ምምሕዳር ልምምድ: ኣየናይ ቅርጺ ሽያጥ ይሰማማዕ?','Упражнение с подсказкой: какая форма продажи подходит?','تمرين موجَّه: أي شكل بيع يناسب؟','Rehberli alıştırma: Hangi satış biçimi uyar?'],
'a4.i':['VB = Vollbedienung (phục vụ đầy đủ) · VW = Vorwahl (chọn trước) · SB = Selbstbedienung (tự phục vụ). Chạm vào hình thức phù hợp.','VB = Vollbedienung (servicio completo) · VW = Vorwahl (preselección) · SB = Selbstbedienung (autoservicio). Toca la forma que encaja.','VB = Vollbedienung (serviço completo) · VW = Vorwahl (pré-seleção) · SB = Selbstbedienung (self-service). Toca na forma que combina.','VB = Vollbedienung (повне обслуговування) · VW = Vorwahl (попередній вибір) · SB = Selbstbedienung (самообслуговування). Торкнись відповідної форми.','VB = Vollbedienung · VW = Vorwahl · SB = Selbstbedienung (ባዕል ኣገልግሎት)። እቲ ዝሰማማዕ ቅርጺ ሓስዮ።','VB = Vollbedienung (полное обслуживание) · VW = Vorwahl (предварительный выбор) · SB = Selbstbedienung (самообслуживание). Нажми подходящую форму.','VB = Vollbedienung (خدمة كاملة) · VW = Vorwahl (اختيار مسبق) · SB = Selbstbedienung (خدمة ذاتية). المس الشكل المناسب.','VB = Vollbedienung (tam servis) · VW = Vorwahl (ön seçim) · SB = Selbstbedienung (self servis). Uygun olanı seç.'],
'a4.t':['Hỏi: Hàng có mở, đắt hoặc cần giải thích không (VB)? Khách muốn tự xem và thử không (VW)? Hàng đơn giản, quen thuộc không (SB)?','Pregunta: ¿la mercancía es abierta, cara o necesita explicación (VB)? ¿El cliente quiere mirar y probarse (VW)? ¿Es sencilla y conocida (SB)?','Pergunta: a mercadoria é aberta, cara ou precisa de explicação (VB)? O cliente quer ver e experimentar (VW)? É simples e conhecida (SB)?','Запитай: товар відкритий, дорогий чи потребує пояснення (VB)? Клієнт хоче сам дивитись і приміряти (VW)? Товар простий і відомий (SB)?','ሕተት: ኣቕሓ ዝተኸፍተ፣ ክቡር ወይ መግለጺ ዘድልዮ ድዩ (VB)? ዓሚል ባዕሉ ክርእይን ክፈትንን ይደሊ ድዩ (VW)? ቀሊልን ፍሉጥን ድዩ (SB)?','Спроси: товар открытый, дорогой или требует объяснения (VB)? Клиент хочет сам смотреть и примерять (VW)? Товар простой и известный (SB)?','اسأل: هل البضاعة مكشوفة أو غالية أو تحتاج شرحًا (VB)؟ هل يريد الزبون النظر والتجربة بنفسه (VW)؟ هل هي بسيطة ومعروفة (SB)؟','Sor: Mal açık, pahalı veya açıklama gerektiriyor mu (VB)? Müşteri kendisi bakıp denemek istiyor mu (VW)? Basit ve tanıdık mı (SB)?'],
'a4.e':['Hàng mở hoặc đắt → VB. Khách muốn xem và thử → VW. Hàng quen thuộc, rẻ → SB.','Mercancía abierta o cara → VB. El cliente quiere mirar y probar → VW. Mercancía conocida y barata → SB.','Mercadoria aberta ou cara → VB. O cliente quer ver e experimentar → VW. Mercadoria conhecida e barata → SB.','Відкритий або дорогий товар → VB. Клієнт хоче дивитись і приміряти → VW. Відомий дешевий товар → SB.','ዝተኸፍተ ወይ ክቡር ኣቕሓ → VB። ዓሚል ክርእይን ክፈትንን ይደሊ → VW። ፍሉጥን ርካሽን ኣቕሓ → SB።','Открытый или дорогой товар → VB. Клиент хочет смотреть и примерять → VW. Известный дешёвый товар → SB.','بضاعة مكشوفة أو غالية → VB. الزبون يريد النظر والتجربة → VW. بضاعة معروفة ورخيصة → SB.','Açık veya pahalı mal → VB. Müşteri bakıp denemek istiyor → VW. Tanıdık ve ucuz mal → SB.'],
'a5.h':['Bài tập tự do: Chuyển sang Vorwahl (chọn trước)','Ejercicio libre: cambio a Vorwahl (preselección)','Exercício livre: mudança para Vorwahl (pré-seleção)','Вільна вправа: перехід на Vorwahl (попередній вибір)','ናጻ ልምምድ: ናብ Vorwahl ምቕያር','Свободное упражнение: переход на Vorwahl (предварительный выбор)','تمرين حر: التحوّل إلى Vorwahl (اختيار مسبق)','Serbest alıştırma: Vorwahl’a (ön seçim) geçiş'],
'a5.i':['Cửa hàng đồ gia dụng „Topf & Deckel“ đến nay để mọi món trong tủ kính và kệ sau quầy. Giờ chuyển sang Vorwahl (Arbeitsheft tr. 163).','La tienda de menaje «Topf & Deckel» tenía hasta ahora todos los artículos en vitrinas y estantes tras el mostrador. Ahora pasa a Vorwahl (Arbeitsheft p. 163).','A loja de artigos de casa «Topf & Deckel» tinha até agora todos os artigos em vitrinas e prateleiras atrás do balcão. Agora passa a Vorwahl (Arbeitsheft p. 163).','Магазин господарських товарів «Topf & Deckel» досі тримав усе у вітринах і на полицях за прилавком. Тепер переходить на Vorwahl (Arbeitsheft с. 163).','ድኳን ናውቲ ገዛ «Topf & Deckel» ክሳብ ሕጂ ኩሉ ኣቕሑት ኣብ ቫትሪንን መደርደሪታትን ድሕሪ ቆጸራ ነይሩ። ሕጂ ናብ Vorwahl ክቕየር እዩ (Arbeitsheft ገጽ 163)።','Магазин хозтоваров «Topf & Deckel» до сих пор держал все в витринах и на полках за прилавком. Теперь переходит на Vorwahl (Arbeitsheft с. 163).','متجر الأدوات المنزلية «Topf & Deckel» كان يضع كل شيء في الخزائن والرفوف خلف الطاولة. الآن سيتحول إلى Vorwahl (Arbeitsheft ص. 163).','Ev eşyası mağazası «Topf & Deckel» şimdiye kadar her şeyi tezgâhın arkasında vitrinlerde ve raflarda tuttu. Şimdi Vorwahl’a (ön seçim) geçiyor (Arbeitsheft s. 163).'],
'a5.t':['Nghĩ đến ba phía: khách, chủ cửa hàng và cửa hàng. Mỗi bên được gì?','Piensa en tres lados: cliente, propietario y tienda. ¿Qué gana cada uno?','Pensa em três lados: cliente, proprietário e loja. O que ganha cada um?','Подумай про три сторони: клієнт, власник і магазин. Що виграє кожен?','ሰለስተ ወገናት ሕሰብ: ዓሚል፣ ወናኒን ድኳንን። ነፍሲ ወከፍ እንታይ ይረክብ?','Подумай о трёх сторонах: клиент, владелец и магазин. Что выигрывает каждый?','فكّر في ثلاثة جوانب: الزبون والمالك والمتجر. ماذا يكسب كل منهم؟','Üç tarafı düşün: müşteri, sahip ve mağaza. Her biri ne kazanır?'],
'a5.e':['Khách: được cầm, không phải chờ. Chủ: tiết kiệm chi phí, tăng doanh thu. Cửa hàng: hàng dễ lấy, bố trí rõ ràng, chống trộm.','Cliente: tocar, no esperar. Propietario: ahorrar costes, más ventas. Tienda: acceso libre, estructura clara, protección.','Cliente: tocar, não esperar. Proprietário: poupar custos, mais vendas. Loja: acesso livre, estrutura clara, proteção.','Клієнт: торкатися, не чекати. Власник: економія, більше продажів. Магазин: вільний доступ, чітка структура, захист.','ዓሚል: ምትንካፍ፣ ዘይምጽባይ። ወናኒ: ወጻኢ ምቑጣብ፣ ብዙሕ ሽያጥ። ድኳን: ናጻ ምብጽሓት፣ ንጹር ኣቀማምጣ፣ ምክልኻል።','Клиент: трогать, не ждать. Владелец: экономия, больше продаж. Магазин: свободный доступ, чёткая структура, защита.','الزبون: اللمس وعدم الانتظار. المالك: توفير التكاليف وزيادة المبيعات. المتجر: وصول حر وتنظيم واضح وحماية.','Müşteri: dokunmak, beklememek. Sahip: maliyet tasarrufu, daha çok satış. Mağaza: serbest erişim, net düzen, güvenlik.'],
'a5.1.q':['5.1 Kể hai lý do khách thích Vorwahl (chọn trước).','5.1 Nombra dos razones por las que los clientes prefieren la Vorwahl (preselección).','5.1 Nomeia duas razões pelas quais os clientes preferem a Vorwahl (pré-seleção).','5.1 Назви дві причини, чому клієнти віддають перевагу Vorwahl (попередньому вибору).','5.1 ክልተ ምኽንያታት ጠቒሱ ዓሚላት ንVorwahl ዝመርጹሉ።','5.1 Назови две причины, почему клиенты предпочитают Vorwahl (предварительный выбор).','5.1 اذكر سببين يجعلان الزبائن يفضّلون Vorwahl (الاختيار المسبق).','5.1 Müşterilerin Vorwahl’ı (ön seçim) tercih etmesinin iki nedenini say.'],
'a5.2.q':['5.2 Kể hai kỳ vọng của chủ cửa hàng khi chuyển đổi.','5.2 Nombra dos expectativas del propietario con el cambio.','5.2 Nomeia duas expectativas do proprietário com a mudança.','5.2 Назви два очікування власника від переходу.','5.2 ክልተ ተስፋታት ናይ ወናኒ ብዛዕባ እቲ ለውጢ ጥቀስ።','5.2 Назови два ожидания владельца от перехода.','5.2 اذكر توقعين لدى المالك من التحوّل.','5.2 Sahibin geçişten iki beklentisini say.'],
'a5.3.q':['5.3 Cửa hàng phải thay đổi gì để Vorwahl hoạt động? Kể ba điểm.','5.3 ¿Qué debe cambiar en la tienda para que funcione la Vorwahl? Nombra tres puntos.','5.3 O que tem de mudar na loja para a Vorwahl funcionar? Nomeia três pontos.','5.3 Що має змінитися в магазині, щоб Vorwahl працював? Назви три пункти.','5.3 እቲ Vorwahl ክሰርሕ ኣብ ድኳን እንታይ ክቕየር ኣለዎ? ሰለስተ ነጥብታት ጥቀስ።','5.3 Что должно измениться в магазине, чтобы Vorwahl работал? Назови три пункта.','5.3 ما الذي يجب أن يتغير في المتجر لينجح Vorwahl؟ اذكر ثلاث نقاط.','5.3 Vorwahl’ın çalışması için mağazada ne değişmeli? Üç madde say.'],
'a6.h':['Đóng vai: Bắt chuyện đúng cách (2 điểm)','Juego de roles: el contacto correcto (2 puntos)','Jogo de papéis: a abordagem certa (2 pontos)','Рольова гра: правильний початок розмови (2 бали)','ተግባራዊ ጻወታ: ቅኑዕ ምድላይ ርክብ (2 ነጥቢ)','Ролевая игра: правильное начало разговора (2 балла)','لعب أدوار: بدء الحديث الصحيح (2 نقطة)','Rol oyunu: Doğru konuşma başlangıcı (2 puan)'],
'a6.i':['Hai em tập một tình huống ở nơi học nghề, theo hình thức bán hàng thường dùng ở đó. Một cặp khác quan sát bằng phiếu quan sát (trên giấy) và góp ý. Hãy viết ở đây lời bắt chuyện của nhóm em (lời nói trực tiếp).','Practicad en pareja una escena de vuestra empresa en la forma de venta habitual allí. Otra pareja observa con la hoja de observación (en papel) y da feedback. Escribe aquí vuestro saludo en estilo directo.','Treinem em dupla uma cena da vossa empresa na forma de venda habitual aí. Outro par observa com a ficha de observação (em papel) e dá feedback. Escreve aqui a vossa abordagem em discurso direto.','Відпрацюйте удвох сцену зі свого підприємства у звичній там формі продажу. Інша пара спостерігає за аркушем спостереження (на папері) й дає відгук. Запиши тут вашу репліку прямою мовою.','ክልተ ኮይንኩም ሓደ ኩነት ካብ ቦታ ልምምድኩም ኣብቲ ልሙድ ቅርጺ ሽያጥ ተለማመዱ። ካልእ ክልተ ብወረቐት ምርኣይ ይከታተሉን ርእይቶ ይህቡን። ኣብዚ ምድላይ ርክብኩም ብቀጥታዊ ዘረባ ጽሓፉ።','Отработайте вдвоём сцену из своего предприятия в привычной там форме продажи. Другая пара наблюдает по листу наблюдения (на бумаге) и даёт обратную связь. Запиши здесь вашу реплику прямой речью.','تدرّبوا في أزواج على مشهد من شركة تدريبكم بشكل البيع المعتاد هناك. زوج آخر يراقب بورقة المراقبة (على الورق) ويعطي رأيًا. اكتب هنا عبارتكم بالكلام المباشر.','İkili olarak eğitim işletmenizden bir sahneyi orada olağan satış biçiminde çalışın. Başka bir çift gözlem formuyla (kağıtta) izler ve geri bildirim verir. Burada ilk cümlenizi doğrudan konuşma olarak yazın.'],
'a6.t':['Lời bắt chuyện tốt nhắc đến hàng hóa và không phải câu hỏi có/không.','Un buen saludo se refiere a la mercancía y no es una pregunta de sí/no.','Uma boa abordagem refere-se à mercadoria e não é uma pergunta de sim/não.','Добре звернення стосується товару й не є питанням «так/ні».','ጽቡቕ ምድላይ ርክብ ኣቕሑት ይጠቅስን ሕቶ እወ/ኣይፋል ኣይኮነን።','Хорошее обращение относится к товару и не является вопросом «да/нет».','المدخل الجيد يتعلق بالبضاعة وليس سؤال نعم/لا.','İyi bir giriş ürünle ilgilidir ve evet/hayır sorusu değildir.'],
'a6.e':['Kiểm tra: Thời điểm có hợp không? Em có chú ý đến tín hiệu không? Lời nói có gắn với hàng hóa không?','Comprueba: ¿es el momento adecuado? ¿Has atendido las señales? ¿Se refiere a la mercancía?','Verifica: o momento é adequado? Prestaste atenção aos sinais? Refere-se à mercadoria?','Перевір: чи слушний момент? Чи ти звернув(ла) увагу на сигнали? Чи звернення стосується товару?','ፈትሽ: ግዜኡ ይግባእ ዶ? ንምልክታት ጠሚትካ ዶ? ምስ ኣቕሑት ይዛመድ ዶ?','Проверь: подходит ли момент? Ты обратил(а) внимание на сигналы? Относится ли обращение к товару?','تحقق: هل التوقيت مناسب؟ هل انتبهت للإشارات؟ هل الكلام يخص البضاعة؟','Kontrol et: Zamanlama uygun mu? İşaretlere dikkat ettin mi? Konuşma ürünle ilgili mi?'],
'a6.1.q':['Lời bắt chuyện của nhóm em (lời nói trực tiếp):','Nuestro saludo en estilo directo:','A nossa abordagem em discurso direto:','Наша репліка прямою мовою:','ምድላይ ርክብና ብቀጥታዊ ዘረባ:','Наша реплика прямой речью:','عبارتنا بالكلام المباشر:','Doğrudan konuşma olarak ilk cümlemiz:'],
'a7.t':['7.3: Nghĩ đến tín hiệu: giao tiếp bằng mắt, nhìn quanh tìm, nhìn lâu một món, lúng túng. 7.4: Không dùng câu hỏi có/không!','7.3: Piensa en las señales: contacto visual, mirada que busca, mirar un artículo mucho rato, desorientación. 7.4: ¡Sin pregunta de sí/no!','7.3: Pensa nos sinais: contacto visual, olhar à procura, olhar um artigo muito tempo, desorientação. 7.4: Sem pergunta de sim/não!','7.3: Подумай про сигнали: зоровий контакт, пошуковий погляд, довге роздивляння товару, розгубленість. 7.4: Без питання «так/ні»!','7.3: ምልክታት ሕሰብ: ምርኻብ ዓይኒ፣ ዝደሊ ጥምተ፣ ንነዊሕ ግዜ ኣቕሓ ምጥማት፣ ምድንጋር። 7.4: ሕቶ እወ/ኣይፋል ኣይትጠቀም!','7.3: Подумай о сигналах: зрительный контакт, ищущий взгляд, долгое разглядывание товара, растерянность. 7.4: Без вопроса «да/нет»!','7.3: فكّر في الإشارات: تواصل بصري، نظرة باحثة، التأمل الطويل في سلعة، الحيرة. 7.4: لا تستخدم سؤال نعم/لا!','7.3: İşaretleri düşün: göz teması, arayan bakış, bir ürüne uzun bakmak, şaşkınlık. 7.4: Evet/hayır sorusu kullanma!'],
'a7.e':['Khi bắt chuyện: chú ý tín hiệu rồi mới nói về hàng hóa.','En el contacto: atiende las señales y luego habla de la mercancía.','Na abordagem: presta atenção aos sinais e depois fala da mercadoria.','Під час звернення: зважай на сигнали, а потім говори про товар.','ኣብ ምድላይ ርክብ: ንምልክታት ተጠንቀቕ ድሕሪኡ ብዛዕባ ኣቕሑት ተዛረብ።','При обращении: учитывай сигналы, затем говори о товаре.','عند بدء الحديث: انتبه للإشارات ثم تحدّث عن البضاعة.','Konuşmaya başlarken: önce işaretlere dikkat et, sonra ürünle ilgili konuş.'],
'a7.1.q':['7.1 Hoàn thành bảng: Erläuterung (giải thích, mỗi ý 1 điểm).','7.1 Completa la tabla: Erläuterung (explicación, 1 punto cada una).','7.1 Completa a tabela: Erläuterung (explicação, 1 ponto cada).','7.1 Заповни таблицю: Erläuterung (пояснення, по 1 балу).','7.1 ሰንጠረዥ ምላእ: Erläuterung (መግለጺ፣ ነፍሲ ወከፍ 1 ነጥቢ)።','7.1 Заполни таблицу: Erläuterung (пояснение, по 1 баллу).','7.1 أكمل الجدول: Erläuterung (شرح، نقطة لكل واحد).','7.1 Tabloyu tamamla: Erläuterung (açıklama, her biri 1 puan).'],
'a7.1b.q':['7.1 Hoàn thành bảng: Beispiel-Artikel (món hàng ví dụ, mỗi ý 1 điểm).','7.1 Completa la tabla: Beispiel-Artikel (artículo de ejemplo, 1 punto cada uno).','7.1 Completa a tabela: Beispiel-Artikel (artigo de exemplo, 1 ponto cada).','7.1 Заповни таблицю: Beispiel-Artikel (приклад товару, по 1 балу).','7.1 ሰንጠረዥ ምላእ: Beispiel-Artikel (ኣብነት ኣቕሓ፣ ነፍሲ ወከፍ 1 ነጥቢ)።','7.1 Заполни таблицу: Beispiel-Artikel (пример товара, по 1 баллу).','7.1 أكمل الجدول: Beispiel-Artikel (سلعة كمثال، نقطة لكل واحد).','7.1 Tabloyu tamamla: Beispiel-Artikel (örnek ürün, her biri 1 puan).'],
'a7.2.q':['7.2 Kể hai ưu điểm của Vorwahl (chọn trước) đối với Kaufhaus Hansa GmbH. (2 điểm)','7.2 Nombre dos ventajas de la Vorwahl (preselección) para la Kaufhaus Hansa GmbH. (2 puntos)','7.2 Nomeie duas vantagens da Vorwahl (pré-seleção) para a Kaufhaus Hansa GmbH. (2 pontos)','7.2 Назвіть дві переваги Vorwahl (попереднього вибору) для Kaufhaus Hansa GmbH. (2 бали)','7.2 ክልተ ረብሓታት ናይ Vorwahl ንKaufhaus Hansa GmbH ጥቀስ። (2 ነጥቢ)','7.2 Назовите два преимущества Vorwahl (предварительного выбора) для Kaufhaus Hansa GmbH. (2 балла)','7.2 اذكر ميزتين لـ Vorwahl (الاختيار المسبق) بالنسبة لـ Kaufhaus Hansa GmbH. (نقطتان)','7.2 Vorwahl’ın (ön seçim) Kaufhaus Hansa GmbH için iki avantajını say. (2 puan)'],
'a7.3.q':['7.3 Một khách xem áo len ở khu Vorwahl. Kể hai dấu hiệu cho thấy cô ấy muốn được tư vấn. (4 điểm)','7.3 En la sección de Vorwahl una clienta mira jerséis. Nombra dos señales de que quiere asesoramiento. (4 puntos)','7.3 Na secção de Vorwahl uma cliente vê camisolas. Nomeia dois sinais de que quer aconselhamento. (4 pontos)','7.3 У відділі Vorwahl клієнтка розглядає светри. Назви дві ознаки, що вона хоче консультації. (4 бали)','7.3 ኣብ ክፍሊ Vorwahl ሓንቲ ዓሚል ሹራብ ትጥምት። ክትሕተት ከም እትደሊ ክልተ ምልክታት ጥቀስ። (4 ነጥቢ)','7.3 В отделе Vorwahl клиентка рассматривает свитеры. Назови два признака, что ей нужна консультация. (4 балла)','7.3 في قسم Vorwahl تنظر زبونة إلى بلوزات. اذكر علامتين على أنها تريد استشارة. (4 نقاط)','7.3 Vorwahl bölümünde bir müşteri kazaklara bakıyor. Danışmanlık istediğini gösteren iki işaret say. (4 puan)'],
'a7.4.q':['7.4 Hãy viết một lời bắt chuyện gắn với hàng hóa bằng lời nói trực tiếp. (2 điểm)','7.4 Formula un saludo relacionado con la mercancía en estilo directo. (2 puntos)','7.4 Formula uma abordagem relacionada com a mercadoria em discurso direto. (2 pontos)','7.4 Сформулюй звернення про товар прямою мовою. (2 бали)','7.4 ምስ ኣቕሓ ዝተኣሳሰር ምድላይ ርክብ ብቀጥታዊ ዘረባ ጽሓፍ። (2 ነጥቢ)','7.4 Сформулируйте обращение о товаре прямой речью. (2 балла)','7.4 صُغ عبارة تخص البضاعة بالكلام المباشر. (نقطتان)','7.4 Ürünle ilgili bir konuşma başlangıcını doğrudan konuşma olarak yaz. (2 puan)'],
'a8.t':['8.1: Nghĩ đến độ tuổi và giá trị hàng. 8.2: Nhìn ba phía: khách, nhân viên, người bán.','8.1: Piensa en la edad y el precio de la mercancía. 8.2: Mira tres lados: clientes, empleados, comerciante.','8.1: Pensa na idade e no preço da mercadoria. 8.2: Olha três lados: clientes, trabalhadores, comerciante.','8.1: Подумай про вік і ціну товару. 8.2: Подивись з трьох сторін: клієнти, працівники, торговець.','8.1: ዕድመን ዋጋን ኣቕሑት ሕሰብ። 8.2: ሰለስተ ወገናት ርአ: ዓሚላት፣ ሰራሕተኛታት፣ ነጋዳይ።','8.1: Подумай о возрасте и цене товара. 8.2: Посмотри с трёх сторон: клиенты, работники, торговец.','8.1: فكّر في عمر الزبون وسعر البضاعة. 8.2: انظر من ثلاث جهات: الزبائن والعاملون والتاجر.','8.1: Yaşı ve malın fiyatını düşün. 8.2: Üç tarafa bak: müşteriler, çalışanlar, satıcı.'],
'a8.e':['Một nhận định tốt xét mọi phía và giải thích quyết định.','Un buen juicio considera todos los lados y justifica la decisión.','Um bom juízo considera todos os lados e justifica a decisão.','Хороша оцінка враховує всі сторони й обґрунтовує рішення.','ጽቡቕ ፍርዲ ኩሎም ወገናት የጽንዕን ውሳኔ የረጋግጽን።','Хорошая оценка учитывает все стороны и обосновывает решение.','الحكم الجيد يراعي كل الجوانب ويعلّل القرار.','İyi bir değerlendirme tüm tarafları düşünür ve kararı gerekçelendirir.'],
'a8.1.q':['8.1 Thuốc lá và rượu mạnh ở nhiều siêu thị đặt sau quầy thu ngân hoặc trong tủ khóa – tức không phải Selbstbedienung (tự phục vụ). Giải thích hai lý do.','8.1 Tabaco y alcohol fuerte están en muchos supermercados tras la caja o en vitrinas cerradas, o sea, no en Selbstbedienung (autoservicio). Explica dos razones.','8.1 Tabaco e álcool forte estão em muitos supermercados atrás da caixa ou em vitrinas fechadas, ou seja, não em Selbstbedienung (self-service). Explica duas razões.','8.1 Тютюн і міцний алкоголь у багатьох супермаркетах стоять за касою або в замкнених вітринах — тобто не в Selbstbedienung (самообслуговуванні). Поясни дві причини.','8.1 ትምባሆን ርእሱ ዝበርትዕ ኣልኮልን ኣብ ብዙሓት ሱፐርማርኬት ድሕሪ ካሳ ወይ ኣብ ዝተኸፍተ ቫትሪን እዮም — ማለት ኣብ Selbstbedienung ኣይኮኑን። ክልተ ምኽንያታት ግለጽ።','8.1 Табак и крепкий алкоголь во многих супермаркетах стоят за кассой или в запертых витринах — то есть не в Selbstbedienung (самообслуживании). Объясни две причины.','8.1 التبغ والكحول القوي يوضعان في كثير من السوبرماركت خلف الصندوق أو في خزائن مقفلة — أي ليس في Selbstbedienung (الخدمة الذاتية). اشرح سببين.','8.1 Tütün ve yüksek alkollü içkiler birçok markette kasanın arkasında veya kilitli vitrinlerde durur – yani Selbstbedienung’da (self servis) değil. İki nedenini açıkla.'],
'a8.2.q':['8.2 Một số nhà bán lẻ thử cửa hàng nhỏ hoàn toàn không nhân viên: vào bằng app, thanh toán tự động. Đánh giá từ góc nhìn của khách, nhân viên và người bán.','8.2 Algunos comerciantes prueban pequeñas tiendas sin personal: entrada por app, pago automático. Valora esta forma desde la perspectiva de los clientes, los empleados y el comerciante.','8.2 Alguns comerciantes testam pequenas lojas sem pessoal: entrada por app, pagamento automático. Avalia esta forma do ponto de vista dos clientes, dos trabalhadores e do comerciante.','8.2 Деякі торговці тестують маленькі магазини зовсім без персоналу: вхід через застосунок, автоматична оплата. Оціни цю форму з погляду клієнтів, працівників і торговця.','8.2 ገለ ነጋዶ ንኣሽቱ ድኳናት ብዘይ ሰራሕተኛ የፈትኑ: ብኣፕ ምእታው፣ ብኣውቶማቲክ ክፍሊት። ካብ ኣረኣእያ ዓሚላት፣ ሰራሕተኛታትን ነጋዳይን ገምግም።','8.2 Некоторые торговцы тестируют маленькие магазины совсем без персонала: вход через приложение, автоматическая оплата. Оцени эту форму с точки зрения клиентов, работников и торговца.','8.2 يختبر بعض التجار متاجر صغيرة بلا موظفين تمامًا: دخول عبر تطبيق ودفع تلقائي. قيّم هذا الشكل من منظور الزبائن والعاملين والتاجر.','8.2 Bazı satıcılar hiç personelsiz küçük mağazaları test ediyor: uygulamayla giriş, otomatik ödeme. Bu biçimi müşteri, çalışan ve satıcı açısından değerlendir.'],
'v1.1.q':['V1 Tại sao việc trưng bày hàng trong Selbstbedienung là „stummer Verkäufer“ (người bán thầm lặng)?','V1 ¿Por qué la presentación de la mercancía es el «stumme Verkäufer» (vendedor mudo) en la Selbstbedienung (autoservicio)?','V1 Porque é que a apresentação da mercadoria é o «stumme Verkäufer» (vendedor mudo) na Selbstbedienung (self-service)?','V1 Чому презентація товару в Selbstbedienung (самообслуговуванні) — це «stummer Verkäufer» (німий продавець)?','V1 ስለምንታይ ምርኢት ኣቕሑት ኣብ Selbstbedienung «stummer Verkäufer» እዩ?','V1 Почему презентация товара в Selbstbedienung (самообслуживании) — это «stummer Verkäufer» (немой продавец)?','V1 لماذا يُعدّ عرض البضاعة في Selbstbedienung (الخدمة الذاتية) «stummer Verkäufer» (البائع الصامت)؟','V1 Selbstbedienung’da (self servis) mal sunumu neden «stummer Verkäufer» (sessiz satıcı) sayılır?'],
'v1.2.q':['V2 Giải thích: Tại sao „hàng càng cần giải thích và càng đắt thì càng nhiều phục vụ“?','V2 Justifica: ¿por qué «cuanto más explicación y valor tiene la mercancía, más servicio»?','V2 Justifica: porque é que «quanto mais explicação e valor tem a mercadoria, mais serviço»?','V2 Обґрунтуй: чому «що складніший і дорожчий товар, то більше обслуговування»?','V2 ኣረጋግጽ: ስለምንታይ «ኣቕሓ ብዝበዝሐ መግለጺን ዋጋን መጠን ብዙሕ ኣገልግሎት»?','V2 Обоснуй: почему «чем сложнее и дороже товар, тем больше обслуживания»?','V2 علّل: لماذا «كلما احتاجت البضاعة شرحًا وكانت أغلى، زادت الخدمة»؟','V2 Gerekçelendir: Mal ne kadar açıklama gerektirir ve değerliyse neden o kadar çok hizmet gerekir?']
};

   return '<tr'+rc+'><td>'+esc(r[0])+'</td>'+[[true,'✔'],[false,'✘']].map(function(c){var cl=sel===c[0]?' on':'';if(fb){if(c[0]===r[1])cl+=sel===c[0]?' ok':' sol';else if(sel===c[0])cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tf" data-id="'+it.id+'" data-r="'+i+'" data-i="'+(c[0]?1:0)+'">'+c[1]+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';

 h+='<button class="btn" data-act="mkchk" data-id="'+b.id+'">'+B('mark')+'</button>';
 if(done){var all=b.paras.join(' ').match(/\[\[.+?\]\]/g)||[];h+=fbBox(wrong===0&&hit===all.length?'ok':'part','✔ '+hit+' / '+all.length+' '+esc(U('found'))+(wrong?' · ✘ '+wrong+' '+esc(U('toomany')):'')+(hit<all.length?'<br>'+esc(U('missed')):''))}
 if(b.q){var v=A(b.id+'.q');h+='<div class="q">'+esc(b.q.q)+'</div>'+tl(b.id+'.qq')+opts(b.q.o,v,(done&&v!=null)?function(i){return i===b.q.a?'ok':(v===i?'no':'')}:null,'mc',b.id+'.q')}
 return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});
 return h}
function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';
 SHEET.blocks.forEach(function(b){if(b.k==='read')h+=renderRead(b);else if(vis(b))h+=renderTask(b)});
 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';
 if(S.sub)h+=renderResult();
 document.getElementById('app').innerHTML=h;
 document.getElementById('report').innerHTML=renderReport();
 renderBar();updProg();pad();
 window.scrollTo(0,y)}
function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');
 document.documentElement.lang=S.lang;
 }
function pad(){var m=document.querySelector('main'),b=document.getElementById('bar');if(m&&b)m.style.paddingTop=(b.offsetHeight+14)+'px'}
window.addEventListener('resize',pad);
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function dialog(msgKey,onYes){var d=document.createElement('div');d.className='dlg';d.innerHTML='<div><p><b>'+esc(UI[msgKey][0])+'</b></p>'+(S.lang!=='de'?'<p>'+esc(U(msgKey))+'</p>':'')+'<button class="btn" data-d="y">'+B('yes')+'</button><button class="btn gray" data-d="n">'+B('cancel')+'</button></div>';d.addEventListener('click',function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-d');if(!x&&e.target!==d&&!e.target.closest('[data-d]'))return;var dd=e.target.closest('[data-d]');if(dd&&dd.getAttribute('data-d')==='y')onYes();d.remove()});document.body.appendChild(d)}
function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});
document.getElementById('gear').addEventListener('click',function(){S.open=!S.open;save();renderBar()});
document.addEventListener('change',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act');if(act==='gap'||act==='sel'){var arr=S.a[el.getAttribute('data-id')]||[];var v=el.value;arr[Number(el.getAttribute('data-r'))]=act==='sel'?(v===''?null:Number(v)):(v===''?null:v);S.a[el.getAttribute('data-id')]=arr;save();updProg()}});
document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
document.addEventListener('visibilitychange',saveNow);window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',function(){document.getElementById('report').innerHTML=renderReport()});
/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;
render();
if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};
window.__state=function(){return S};
})();
