<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF 4 · Digitales Arbeitsblatt</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + .5rem) 1rem .4rem}
#bar .row{display:flex;align-items:center;gap:.6rem;max-width:56rem;margin:0 auto}
#bar .ttl{font-weight:700;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{height:.7rem;background:#e6e3da;border-radius:1rem;overflow:hidden;max-width:56rem;margin:.35rem auto 0}
#progf{height:100%;width:0;background:var(--pri);transition:width .4s}
#progt{font-size:.8rem;color:var(--mute);max-width:56rem;margin:.1rem auto 0}
#langs{display:flex;gap:.4rem;overflow-x:auto;max-width:56rem;margin:.35rem auto 0;padding-bottom:.15rem;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;min-height:44px;padding:0 .9rem;border:2px solid var(--line);background:#fff;border-radius:2rem;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;margin:0 0 1rem}
.card h2{font-size:1.25rem;margin:0 0 .4rem;line-height:1.3}
.card h2 .nr{display:inline-block;background:var(--pri);color:#fff;border-radius:.5rem;padding:0 .5rem;margin-right:.4rem;font-size:.95rem}
.vtag{display:inline-block;background:#6a3fa0;color:#fff;border-radius:.5rem;padding:0 .5rem;font-size:.85rem;margin-left:.3rem}
.card.v{border-color:#6a3fa0;background:#faf6ff}
.tr{font-size:.9rem;color:#4a5a66;background:#f1f6f9;border-left:4px solid #9cc3d5;border-radius:.4rem;padding:.3rem .6rem;margin:.3rem 0 .5rem;line-height:1.5}
.tr[dir=rtl]{border-left:0;border-right:4px solid #9cc3d5}
.tr[lang=ti]{font-family:"Kefa","Noto Sans Ethiopic",sans-serif}
.tr[lang=vi]{line-height:1.65}
small.b{display:block;font-size:.72rem;font-weight:400;opacity:.9;line-height:1.2}
.in{display:block;width:100%;min-height:48px;font:inherit;font-size:1rem;padding:.55rem .7rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink)}
input.in,select.in{font-size:1rem}
textarea.in{min-height:5.5rem;resize:vertical}
.btn{min-height:48px;padding:.4rem 1.1rem;border:0;border-radius:.8rem;background:var(--pri);color:#fff;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin:.3rem .4rem .3rem 0}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.gray{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.big{min-height:56px;font-size:1.1rem}
.btn:active,.pill:active,.opt:active,.ch:active{transform:scale(.97)}
.tipb{min-height:48px;min-width:48px;border-radius:2rem;border:2px solid var(--warn);background:var(--warnbg);font:inherit;font-size:1rem;cursor:pointer;padding:0 .9rem;float:right;margin:0 0 .3rem .5rem}
.tipbox{background:var(--warnbg);border:2px solid var(--warn);border-radius:.8rem;padding:.5rem .8rem;margin:.4rem 0}
.q{margin:.8rem 0 .2rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:.45rem;margin:.3rem 0}
.opt{min-height:48px;text-align:left;padding:.5rem .8rem;border:2px solid var(--line);background:#fff;border-radius:.8rem;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--pri);background:var(--pri2);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.tbl{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:1rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.4rem .3rem;text-align:left;vertical-align:middle}
.tbl.info th{background:#eef3f6}
.tbl.info td,.tbl.info th{border:1px solid var(--line);padding:.4rem .5rem}
.tbl td.c{text-align:center;white-space:nowrap}
.ch{min-width:48px;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:.7rem;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer;margin:2px}
.ch.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.sol{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
tr.rok td{background:var(--okbg)}tr.rno td{background:var(--badbg)}
.fb{border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0;font-size:1rem}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb.part{background:var(--warnbg);border:1px solid var(--warn)}
.sit{background:#eef3f6;border-left:5px solid var(--pri);border-radius:.5rem;padding:.5rem .8rem;margin:.5rem 0}
.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#23303a;color:#fff;padding:.6rem 1.1rem;border-radius:2rem;z-index:99;font-size:1rem;max-width:90%}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}
.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}
#set.open{display:block}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row2 label{font-weight:600;min-width:7rem}
.nowrap{white-space:nowrap}
#report{display:none}
@media (max-width:600px){main{padding-top:8.2rem}.card{padding:.8rem}h1{font-size:1.35rem}.tbl{font-size:.95rem}}
@media print{
 body{background:#fff;padding:0;font-size:11pt}
 #bar,#set,main,.toast,.dlg,.noprint{display:none!important}
 #report{display:block!important}
 #report h1{font-size:16pt}
 #report table{width:100%;border-collapse:collapse;font-size:10pt}
 #report td,#report th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

</style>
</head>

{k:'read',id:'r1',h:'Zum Nachlesen: Die Regalzonen',sum:'Sichtzone und Greifzone sind verkaufsstark. Reckzone und Bückzone sind verkaufsschwach.',
 paras:['Ein Regal hat vier Zonen. Ganz oben ist die [[Reckzone]] (über 1,70 m): verkaufsschwach, man muss sich strecken. Dort stehen leichte, weniger verkaufsintensive Ware und Vorrat.','Darunter ist die [[Sichtzone]] (1,20–1,70 m): verkaufsstark, gute Wahrnehmung. Hier stehen hochwertige Artikel mit hoher [[Gewinnspanne]], Neuheiten und [[Eigenmarken]].','Dann kommt die [[Greifzone]] (0,70–1,20 m): verkaufsstark, leichter Zugriff. Hier stehen Impulsartikel, Ergänzungsartikel und gängige Markenartikel.','Ganz unten ist die [[Bückzone]] (unter 0,70 m): verkaufsschwach, schwer zugänglich. Hier stehen schwere Ware, Großpackungen und Suchartikel mit geringer Spanne.','Drei Arten, Artikelgruppen ins Regal zu stellen: Bei der [[Bandplatzierung]] liegt jede Gruppe waagerecht in einer Zone. Bei der [[Blockplatzierung]] steht jede Gruppe senkrecht über alle Zonen. Bei der [[Kreuzblockplatzierung]] steht der Marktführer senkrecht in der Mitte, Vergleichsmarken links und rechts, Zusatzartikel außen.','Regalpflege: Ordnung und Sauberkeit, Packungsbild nach vorn ([[Facing]]), [[Grifflücken]] schließen, ältere Ware nach vorn (Mindesthaltbarkeitsdatum beachten), Preisschild und Ware müssen zusammenpassen.'],
 html:'<table class="tbl info"><tr><th>Zone</th><th>Höhe</th><th>Wertigkeit</th><th>Was gehört hierher?</th></tr><tr><td>1 Reckzone</td><td>über 1,70 m</td><td>Platz 3 – verkaufsschwach: man muss sich strecken</td><td>leichte, weniger verkaufsintensive Ware, Vorrat</td></tr><tr><td>2 Sichtzone</td><td>1,20–1,70 m</td><td>Platz 1 – verkaufsstark: gute Wahrnehmung</td><td>hochwertige Artikel mit hoher Gewinnspanne, Neuheiten, Eigenmarken</td></tr><tr><td>3 Greifzone</td><td>0,70–1,20 m</td><td>Platz 2 – verkaufsstark: leichter Zugriff</td><td>Impulsartikel, Ergänzungsartikel, gängige Markenartikel</td></tr><tr><td>4 Bückzone</td><td>unter 0,70 m</td><td>Platz 4 – verkaufsschwach: schwer zugänglich</td><td>schwere Ware, Großpackungen, Suchartikel mit geringer Spanne</td></tr></table><p class="meta"><b>Merke:</b> Sichtzone – verkaufsstark, da gute Wahrnehmung durch die Kunden. Greifzone – verkaufsstark, da leichter Zugriff auf die Ware. Bückzone und Reckzone – verkaufsschwach, da schwerer zugänglich. Waagerecht ist die Regalmitte und der Bereich rechts davon am stärksten.</p>',
 q:{q:'Welche Zone ist verkaufsstark, weil man leicht zugreifen kann?',o:['Reckzone','Sichtzone','Greifzone','Bückzone'],a:2}},

'can.0':['Kể bốn Regalzone (vùng kệ) kèm độ cao và giá trị.','Nombrar las cuatro Regalzonen (zonas del estante) con altura y valor.','Nomear as quatro Regalzonen (zonas da prateleira) com altura e valor.','Назвати чотири Regalzonen (зони полиці) з висотою та цінністю.','ኣርባዕተ Regalzonen ምስ ርኽቦን ዋጋን ጥቀስ።','Назвать четыре Regalzonen (зоны стеллажа) с высотой и ценностью.','ذكر مناطق الرف الأربع (Regalzonen) مع الارتفاع والقيمة.','Dört Regalzone’yi (raf bölgesi) yükseklik ve değeriyle söylemek.'],
'can.1':['Xếp hàng lên kệ theo lợi nhuận và doanh số và giải thích lý do.','Surtir un estante según beneficio y ventas y justificarlo.','Abastecer uma prateleira segundo lucro e vendas e justificar.','Заповнювати полицю за прибутком і збутом та обґрунтовувати це.','መደርደሪ ብትርፍን ሽያጥን ምምላእን ምርግጋጽን።','Заполнять полку по прибыли и сбыту и обосновывать это.','ملء الرف حسب الربح والمبيعات وتعليل ذلك.','Rafı kâr ve satışa göre doldurmak ve gerekçelendirmek.'],
'can.2':['Phân biệt Bandplatzierung (xếp theo dải), Blockplatzierung (xếp theo khối) và Kreuzblockplatzierung (xếp khối chữ thập).','Distinguir Bandplatzierung (en banda), Blockplatzierung (en bloque) y Kreuzblockplatzierung (en bloque cruzado).','Distinguir Bandplatzierung (em faixa), Blockplatzierung (em bloco) e Kreuzblockplatzierung (em bloco cruzado).','Розрізняти Bandplatzierung (смугою), Blockplatzierung (блоком) і Kreuzblockplatzierung (хрестоподібним блоком).','Bandplatzierung፣ Blockplatzierung ን Kreuzblockplatzierung ፍለይ።','Различать Bandplatzierung (полосой), Blockplatzierung (блоком) и Kreuzblockplatzierung (крестообразным блоком).','التمييز بين Bandplatzierung (شريطي) وBlockplatzierung (كتلة) وKreuzblockplatzierung (كتلة متقاطعة).','Bandplatzierung (bant), Blockplatzierung (blok) ve Kreuzblockplatzierung (çapraz blok) farkını bilmek.'],
'a1.t':['Hãy nhớ Warenträger và cách sắp xếp trong Modul 7.','Recuerda los Warenträger y las formas de colocación del Modul 7.','Lembra os Warenträger e as formas de colocação do Modul 7.','Згадай Warenträger і способи розміщення з Modul 7.','Warenträger ን ኣገባብ ኣቀማምጣን ካብ Modul 7 ዘክር።','Вспомни Warenträger и способы размещения из Modul 7.','تذكّر Warenträger وأنواع الترتيب من Modul 7.','Modul 7’deki Warenträger ve yerleştirme türlerini hatırla.'],
'a1.e':['Xem lại Modul 7: Warenträger và Platzierungsarten.','Repasa el Modul 7: Warenträger y Platzierungsarten.','Revê o Modul 7: Warenträger e Platzierungsarten.','Повтори Modul 7: Warenträger і Platzierungsarten.','Modul 7 ደጊምካ ርአ: Warenträger ን Platzierungsarten ን።','Повтори Modul 7: Warenträger и Platzierungsarten.','راجع Modul 7: Warenträger وPlatzierungsarten.','Modul 7’ye tekrar bak: Warenträger ve Platzierungsarten.'],
'a1.1.q':['1.1 Warenträger nào hợp với trang sức đắt tiền?','1.1 ¿Qué Warenträger encaja con joyas caras?','1.1 Que Warenträger combina com joias caras?','1.1 Який Warenträger пасує до дорогих прикрас?','1.1 ኣየናይ Warenträger ምስ ክቡር ጌጥ ይሰማማዕ?','1.1 Какой Warenträger подходит для дорогих украшений?','1.1 أي Warenträger يناسب المجوهرات الغالية؟','1.1 Pahalı mücevher için hangi Warenträger uygun?'],
'a1.2.q':['1.2 Verbundplatzierung là gì?','1.2 ¿Qué es una Verbundplatzierung?','1.2 O que é uma Verbundplatzierung?','1.2 Що таке Verbundplatzierung?','1.2 Verbundplatzierung እንታይ እዩ?','1.2 Что такое Verbundplatzierung?','1.2 ما هي Verbundplatzierung؟','1.2 Verbundplatzierung nedir?'],
'a1.3.q':['1.3 Khoai tây chiên còn được đặt thêm trên Display ở quầy thu ngân. Cách này gọi là gì?','1.3 Las patatas fritas están también en un Display junto a la caja. ¿Cómo se llama?','1.3 As batatas fritas estão também num Display junto à caixa. Como se chama?','1.3 Чіпси стоять ще й на Display біля каси. Як це називається?','1.3 ቺፕስ ብተወሳኺ ኣብ Display ጥቓ ካሳ ይቕመጥ። እዚ እንታይ ይበሃል?','1.3 Чипсы стоят ещё и на Display у кассы. Как это называется?','1.3 الشيبس موضوعة أيضًا على Display عند الصندوق. ماذا يسمّى هذا؟','1.3 Cipsler ayrıca kasadaki Display’de duruyor. Buna ne denir?'],
'a2.h':['Em lấy hàng ở đâu?','¿Dónde coges las cosas?','Onde pegas nas coisas?','Куди ти тягнешся?','ኣበይ ትወስድ?','Куда ты тянешься?','أين تمدّ يدك؟','Nereden alıyorsun?'],
'a2.i':['Đứng trước một kệ trong lớp (hoặc kệ trong ảnh của cô giáo). Nhìn thật tự nhiên và trả lời các câu hỏi.','Colócate ante un estante del aula (o el de la foto de tu profesora). Mira con naturalidad y responde.','Põe-te diante de uma prateleira da sala (ou da foto da professora). Olha naturalmente e responde.','Стань перед полицею в класі (або на фото вчительки). Дивись природно й дай відповіді.','ቅድሚ መደርደሪ ኣብ ክፍሊ (ወይ ኣብ ስእሊ መምህርትካ) ደው በል። ብተፈጥሮ ጠምት ከኣ መልስ።','Встань перед полкой в классе (или на фото учительницы). Смотри естественно и отвечай.','قف أمام رف في الصف (أو الرف في صورة المعلمة). انظر بشكل طبيعي وأجب.','Sınıftaki bir rafın (veya öğretmeninin fotoğrafındaki rafın) önünde dur. Doğal bak ve cevapla.'],
'a2.t':['Đưa tay đến chỗ mắt em nhìn đầu tiên. Và chỗ em lấy hàng thoải mái nhất.','Pon la mano donde cae primero tu mirada. Y donde alcanzas más cómodo.','Põe a mão onde o teu olhar cai primeiro. E onde alcanças com mais conforto.','Покажи рукою, куди падає твій погляд спершу. І де найзручніше взяти.','ኢድካ ኣብቲ ቀዳማይ ጥምተኻ ዝወድቀሉ ቦታ ግበር። ከምኡውን ኣብቲ ዝመቹ ቦታ ምውሳድ።','Покажи рукой, куда падает твой взгляд сначала. И где удобнее всего брать.','ضع يدك حيث تقع عينك أولًا. وحيث تصل بأكثر راحة.','Elini bakışının ilk düştüğü yere koy. Ve en rahat uzandığın yere.'],
'a2.e':['Mắt thường nhìn ở tầm mắt. Tay lấy thoải mái khoảng giữa hông và ngực.','La mirada cae a la altura de los ojos. Se alcanza cómodo entre cadera y pecho.','O olhar cai à altura dos olhos. Alcança-se com conforto entre a anca e o peito.','Погляд падає на рівні очей. Зручно брати приблизно між стегнами й грудьми.','ጥምተ ኣብ ደረጃ ዓይኒ ይወድቕ። ብምቾት ኣብ መንጎ ሕቖን ኣፍ ልብን ይብጻሕ።','Взгляд падает на уровне глаз. Удобно брать примерно между бёдрами и грудью.','تقع النظرة عند مستوى العينين. يصل المرء براحة بين الورك والصدر.','Bakış göz hizasına düşer. En rahat uzanma kalça ile göğüs arasıdır.'],
'a2.1.q':['2.1 Mắt em nhìn đầu tiên ở độ cao nào? Chỉ bằng tay và ước lượng độ cao bằng mét.','2.1 ¿A qué altura cae primero tu mirada? Muéstralo con la mano y estima la altura en metros.','2.1 A que altura cai primeiro o teu olhar? Mostra com a mão e estima a altura em metros.','2.1 На якій висоті падає твій погляд спершу? Покажи рукою й оціни висоту в метрах.','2.1 ጥምተኻ ቀዳምነት ኣብ ክንደይ ርኽቦ ይወድቕ? ብኢድካ ኣርኢ ከምኡውን ርኽቦ ብሜትሮ ገምት።','2.1 На какой высоте падает твой взгляд сначала? Покажи рукой и оцени высоту в метрах.','2.1 على أي ارتفاع تقع عينك أولًا؟ أشر بيدك وقدّر الارتفاع بالأمتار.','2.1 Bakışın ilk hangi yüksekliğe düşer? Elinle göster ve yüksekliği metre olarak tahmin et.'],
'a2.2.q':['2.2 Em lấy đồ thoải mái nhất ở độ cao nào?','2.2 ¿A qué altura coges algo con más comodidad?','2.2 A que altura pegas em algo com mais conforto?','2.2 З якої висоти найзручніше щось узяти?','2.2 ካብ ኣየናይ ርኽቦ ብምቾት ነገር ትወስድ?','2.2 С какой высоты удобнее всего что-то взять?','2.2 من أي ارتفاع تأخذ شيئًا بأكبر راحة؟','2.2 Hangi yükseklikten bir şey almak en rahattır?'],
'a2.3.q':['2.3 Điều đó có nghĩa gì với người bán?','2.3 ¿Qué significa eso para el comerciante?','2.3 O que significa isso para o comerciante?','2.3 Що це означає для торговця?','2.3 እዚ ንነጋዳይ እንታይ ማለት እዩ?','2.3 Что это значит для торговца?','2.3 ماذا يعني هذا للتاجر؟','2.3 Bu satıcı için ne anlama gelir?'],
'r1.h':['Đọc thêm: Các vùng kệ (Regalzonen)','Para leer: las zonas del estante','Para ler: as zonas da prateleira','Для читання: зони полиці','ንምንባብ: ዞናት መደርደሪ','Для чтения: зоны стеллажа','للقراءة: مناطق الرف','Okumak için: Raf bölgeleri'],
'r1.s':['Sichtzone và Greifzone là vùng bán mạnh. Reckzone và Bückzone là vùng bán yếu.','Sichtzone y Greifzone son fuertes. Reckzone y Bückzone son débiles.','Sichtzone e Greifzone são fortes. Reckzone e Bückzone são fracas.','Sichtzone і Greifzone — сильні. Reckzone і Bückzone — слабкі.','Sichtzone ን Greifzone ጽኑዓት እየን። Reckzone ን Bückzone ድኹማት እየን።','Sichtzone и Greifzone — сильные. Reckzone и Bückzone — слабые.','Sichtzone وGreifzone قويتان. Reckzone وBückzone ضعيفتان.','Sichtzone ve Greifzone güçlüdür. Reckzone ve Bückzone zayıftır.'],
'r1.qq':['Vùng nào bán mạnh vì dễ với tay lấy?','¿Qué zona es fuerte porque se alcanza fácil?','Que zona é forte porque se alcança facilmente?','Яка зона сильна, бо легко дістати?','ኣየናይ ዞና ጽኑዕ እያ ምኽንያቱ ብቐሊሉ ይተሓዝ?','Какая зона сильная, потому что легко достать?','أي منطقة قوية لأنه يسهل الوصول إليها؟','Hangi bölge kolay uzanıldığı için güçlüdür?'],
'a3.h':['Làm mẫu: Vùng kệ trong bài thi','Ejemplo resuelto: zonas del estante en el examen','Exemplo resolvido: zonas da prateleira no exame','Приклад: зони полиці на іспиті','ኣብነት: ዞናት መደርደሪ ኣብ ፈተና','Образец: зоны стеллажа на экзамене','مثال محلول: مناطق الرف في الامتحان','Örnek: Sınavda raf bölgeleri'],
'a3.i':['Xem kệ. Các số chạy từ trên (1) xuống dưới (4). Zone 1 là Reckzone (cho sẵn). Gọi tên các vùng còn lại và giải thích vùng nào bán mạnh hay yếu.','Mira el estante. Los números van de arriba (1) a abajo (4). La zona 1 es la Reckzone (dada). Nombra las demás y justifica si son fuertes o débiles.','Vê a prateleira. Os números vão de cima (1) para baixo (4). A zona 1 é a Reckzone (dada). Nomeia as outras e justifica se são fortes ou fracas.','Подивись на полицю. Номери йдуть згори (1) донизу (4). Зона 1 — Reckzone (дана). Назви решту й обґрунтуй, сильні вони чи слабкі.','ነቲ መደርደሪ ርአ። ቁጽሪ ካብ ላዕሊ (1) ናብ ታሕቲ (4) ይኸይድ። Zone 1 Reckzone እያ (ተዋሂባ)። ነተን ካልኦት ሰም ሃብ ጽኑዓት ድዩ ድኹማት ኣረጋግጽ።','Посмотри на стеллаж. Номера идут сверху (1) вниз (4). Зона 1 — Reckzone (дана). Назови остальные и обоснуй, сильные они или слабые.','انظر إلى الرف. الأرقام من الأعلى (1) إلى الأسفل (4). المنطقة 1 هي Reckzone (معطاة). سمِّ الباقي وعلّل إن كانت قوية أم ضعيفة.','Rafa bak. Numaralar yukarıdan (1) aşağıya (4) gider. Zone 1 Reckzone (verilmiş). Diğerlerini adlandır ve güçlü mü zayıf mı gerekçelendir.'],
'a3.t':['Từ trên xuống: Reckzone, Sichtzone, Greifzone, Bückzone. Lý do mới được điểm, không chỉ „verkaufsstark“.','De arriba abajo: Reckzone, Sichtzone, Greifzone, Bückzone. El motivo da el punto, no solo «verkaufsstark».','De cima para baixo: Reckzone, Sichtzone, Greifzone, Bückzone. O motivo dá o ponto, não só «verkaufsstark».','Згори донизу: Reckzone, Sichtzone, Greifzone, Bückzone. Бал дає причина, а не лише «verkaufsstark».','ካብ ላዕሊ ናብ ታሕቲ: Reckzone, Sichtzone, Greifzone, Bückzone። ነጥቢ ምኽንያት እዩ ዝህብ፣ «verkaufsstark» ጥራይ ኣይኮነን።','Сверху вниз: Reckzone, Sichtzone, Greifzone, Bückzone. Балл даёт причина, а не только «verkaufsstark».','من الأعلى إلى الأسفل: Reckzone وSichtzone وGreifzone وBückzone. السبب يعطي النقطة وليس «verkaufsstark» فقط.','Yukarıdan aşağıya: Reckzone, Sichtzone, Greifzone, Bückzone. Puanı gerekçe getirir, yalnız «verkaufsstark» değil.'],
'a3.e':['Sichtzone: nhìn rõ. Greifzone: dễ lấy. Bückzone: khó tiếp cận hơn các vùng khác.','Sichtzone: buena percepción. Greifzone: acceso fácil. Bückzone: más difícil de alcanzar que las demás.','Sichtzone: boa perceção. Greifzone: acesso fácil. Bückzone: mais difícil de alcançar do que as outras.','Sichtzone: добре видно. Greifzone: легко дістати. Bückzone: важче дістати, ніж інші.','Sichtzone: ጽቡቕ ርእይቶ። Greifzone: ቀሊል ምብጻሕ። Bückzone: ካብ ካልኦት ዝኸበደ ምብጻሕ።','Sichtzone: хорошо видно. Greifzone: легко достать. Bückzone: труднее достать, чем другие.','Sichtzone: رؤية جيدة. Greifzone: وصول سهل. Bückzone: أصعب وصولًا من الباقي.','Sichtzone: iyi görünür. Greifzone: kolay erişim. Bückzone: diğerlerinden zor erişilir.'],
'a3.1.q':['3.1 Các vùng tên gì?','3.1 ¿Cómo se llaman las zonas?','3.1 Como se chamam as zonas?','3.1 Як називаються зони?','3.1 ስሞም ዞናት እንታይ እዩ?','3.1 Как называются зоны?','3.1 ما أسماء المناطق؟','3.1 Bölgelerin adları nedir?'],
'a3.2.q':['3.2 Bán mạnh hay bán yếu?','3.2 ¿Fuerte o débil?','3.2 Forte ou fraca?','3.2 Сильна чи слабка?','3.2 ጽኑዕ ወይ ድኹም?','3.2 Сильная или слабая?','3.2 قوية أم ضعيفة؟','3.2 Güçlü mü zayıf mı?'],
'a3.3.q':['3.3 Lý do nào phù hợp?','3.3 ¿Qué motivo encaja?','3.3 Que motivo combina?','3.3 Яке обґрунтування пасує?','3.3 ኣየናይ ምኽንያት ይሰማማዕ?','3.3 Какое обоснование подходит?','3.3 أي سبب يناسب؟','3.3 Hangi gerekçe uyar?'],
'a4.h':['Bài tập có hướng dẫn: Kệ sô-cô-la','Ejercicio guiado: el estante de chocolate','Exercício guiado: a prateleira de chocolate','Керована вправа: полиця з шоколадом','ምምሕዳር ልምምድ: መደርደሪ ቸኮሌት','Упражнение с подсказкой: полка с шоколадом','تمرين موجَّه: رف الشوكولاتة','Rehberli alıştırma: Çikolata rafı'],
'a4.i':['Em xếp bốn loại sô-cô-la thanh lên kệ (theo Arbeitsheft tr. 170). Mỗi loại vào vùng nào?','Surtes un estante con cuatro tabletas de chocolate (según Arbeitsheft p. 170). ¿En qué zona va cada una?','Abasteces uma prateleira com quatro tabletes de chocolate (segundo Arbeitsheft p. 170). Em que zona vai cada uma?','Ти розкладаєш на полиці чотири плитки шоколаду (за Arbeitsheft с. 170). У яку зону яка?','ኣርባዕተ ዓይነት ቸኮሌት ኣብ መደርደሪ ትሰርዕ (ብ Arbeitsheft ገጽ 170)። ኣየናይ ኣብ ኣየናይ ዞና?','Ты раскладываешь на полке четыре плитки шоколада (по Arbeitsheft с. 170). В какую зону какая?','تملأ رفًّا بأربعة ألواح شوكولاتة (حسب Arbeitsheft ص. 170). في أي منطقة يوضع كل نوع؟','Rafı dört çikolata ile dolduruyorsun (Arbeitsheft s. 170’e göre). Hangi çeşit hangi bölgeye gider?'],
'a4.t':['Lợi nhuận mỗi thanh cao nhất vào vùng tốt nhất. Nhãn nhà (Hausmarke) lãi thấp được tìm có chủ đích.','La mayor ganancia por tableta va a la mejor zona. La marca blanca con poco margen se busca a propósito.','O maior lucro por tablete vai para a melhor zona. A marca própria com pouca margem é procurada de propósito.','Найбільший прибуток за плитку — у найкращу зону. Власну марку з малою націнкою шукають цілеспрямовано.','እቲ ዝለዓለ ረብሓ ንዝበለጸ ዞና። ምልክት ገዛ ብትሑት ትርፊ ብዝተመደበ ይደሊ።','Наибольшая прибыль с плитки — в лучшую зону. Собственную марку с малой наценкой ищут целенаправленно.','أعلى ربح للوح يذهب إلى أفضل منطقة. العلامة الخاصة ذات الهامش الصغير يُبحث عنها عمدًا.','Tablet başına en yüksek kâr en iyi bölgeye gider. Düşük marjlı kendi marka bilerek aranır.'],
'a4.e':['Hausmarke: Bückzone (lãi thấp, tìm có chủ đích). Nordwind: Greifzone (mua nhiều, dễ lấy). Kakaoherz: Sichtzone (lãi cao nhất). Goldblatt: Reckzone hoặc Sichtzone nếu giải thích tốt.','Hausmarke: Bückzone (poco margen, búsqueda dirigida). Nordwind: Greifzone (se compra a menudo). Kakaoherz: Sichtzone (mayor ganancia). Goldblatt: Reckzone o Sichtzone si se justifica.','Hausmarke: Bückzone (pouca margem, procura dirigida). Nordwind: Greifzone (muito comprada). Kakaoherz: Sichtzone (maior lucro). Goldblatt: Reckzone ou Sichtzone se bem justificado.','Hausmarke: Bückzone (мала націнка, цілеспрямований пошук). Nordwind: Greifzone (часто купують). Kakaoherz: Sichtzone (найбільший прибуток). Goldblatt: Reckzone або Sichtzone за гарного обґрунтування.','Hausmarke: Bückzone። Nordwind: Greifzone። Kakaoherz: Sichtzone (ዝለዓለ ትርፊ)። Goldblatt: Reckzone ወይ Sichtzone ብጽቡቕ ምኽንያት።','Hausmarke: Bückzone (малая наценка, целенаправленный поиск). Nordwind: Greifzone (часто покупают). Kakaoherz: Sichtzone (наибольшая прибыль). Goldblatt: Reckzone или Sichtzone при хорошем обосновании.','Hausmarke: Bückzone (هامش صغير، بحث مقصود). Nordwind: Greifzone (تُشترى كثيرًا). Kakaoherz: Sichtzone (أعلى ربح). Goldblatt: Reckzone أو Sichtzone إذا عُلّل جيدًا.','Hausmarke: Bückzone (düşük marj, hedefli arama). Nordwind: Greifzone (sık alınır). Kakaoherz: Sichtzone (en yüksek kâr). Goldblatt: iyi gerekçeyle Reckzone veya Sichtzone.'],
'a5.h':['Bài tập có hướng dẫn: Dải, khối hay khối chữ thập?','Ejercicio guiado: ¿banda, bloque o bloque cruzado?','Exercício guiado: faixa, bloco ou bloco cruzado?','Керована вправа: смуга, блок чи хрестоподібний блок?','ምምሕዳር ልምምድ: ባንድ፣ ብሎክ ወይ ክሮስብሎክ?','Упражнение с подсказкой: полоса, блок или крестообразный блок?','تمرين موجَّه: شريط أم كتلة أم كتلة متقاطعة؟','Rehberli alıştırma: Bant, blok veya çapraz blok?'],
'a5.i':['Đọc ví dụ. Đó là Platzierungsart (cách xếp) nào? Rồi nêu ưu hoặc nhược điểm.','Lee los ejemplos. ¿Qué Platzierungsart (forma de colocación) es? Luego di la ventaja o desventaja.','Lê os exemplos. Que Platzierungsart (forma de colocação) é? Depois diz a vantagem ou desvantagem.','Прочитай приклади. Який це Platzierungsart (спосіб розміщення)? Потім назви перевагу або недолік.','ኣብነታት ኣንብብ። ኣየናይ Platzierungsart እዩ? ድሕሪኡ ረብሓ ወይ ጉድለት ጥቀስ።','Прочитай примеры. Какой это Platzierungsart (способ размещения)? Потом назови преимущество или недостаток.','اقرأ الأمثلة. أي Platzierungsart (نوع ترتيب) هذا؟ ثم اذكر الميزة أو العيب.','Örnekleri oku. Hangi Platzierungsart (yerleştirme türü)? Sonra avantaj veya dezavantaj söyle.'],
'a5.t':['Nằm ngang trong một vùng = dải. Dọc từ trên xuống = khối. Nhãn dẫn đầu ở giữa = khối chữ thập.','Horizontal en una zona = banda. Vertical de arriba abajo = bloque. Líder de mercado en el centro = bloque cruzado.','Horizontal numa zona = faixa. Vertical de cima a baixo = bloco. Líder de mercado ao centro = bloco cruzado.','Горизонтально в одній зоні = смуга. Вертикально згори донизу = блок. Лідер ринку посередині = хрестоподібний блок.','ጾራ ኣብ ሓንቲ ዞና = ባንድ። ቀጥታ ካብ ላዕሊ ክሳብ ታሕቲ = ብሎክ። መሪሕ ዕዳጋ ኣብ ማእከል = ክሮስብሎክ።','Горизонтально в одной зоне = полоса. Вертикально сверху донизу = блок. Лидер рынка в центре = крестообразный блок.','أفقي في منطقة واحدة = شريط. عمودي من الأعلى للأسفل = كتلة. رائد السوق في الوسط = كتلة متقاطعة.','Bir bölgede yatay = bant. Yukarıdan aşağıya dikey = blok. Pazar lideri ortada = çapraz blok.'],
'a5.e':['Khối: khách thấy cả nhãn hiệu cùng lúc. Dải: không phải nhóm nào cũng có chỗ tốt.','Bloque: el cliente ve la marca entera de un vistazo. Banda: no todos los grupos obtienen un buen lugar.','Bloco: o cliente vê a marca toda de uma vez. Faixa: nem todos os grupos ficam num bom lugar.','Блок: клієнт бачить усю марку одразу. Смуга: не кожна група отримує добре місце.','ብሎክ: ዓሚል ንምልክት ብሓደ ጠመተ የርእዮ። ባንድ: ኩሉ ጉጅለ ጽቡቕ ቦታ ኣይረኽብን።','Блок: клиент видит всю марку сразу. Полоса: не каждая группа получает хорошее место.','الكتلة: يرى الزبون العلامة كلها بنظرة. الشريط: ليست كل مجموعة تنال مكانًا جيدًا.','Blok: müşteri markanın tamamını bir bakışta görür. Bant: her grup iyi bir yer bulamaz.'],
'a5.1.q':['Platzierungsart (cách xếp) nào?','¿Qué Platzierungsart (forma de colocación)?','Que Platzierungsart (forma de colocação)?','Який Platzierungsart (спосіб розміщення)?','ኣየናይ Platzierungsart?','Какой Platzierungsart (способ размещения)?','أي Platzierungsart (نوع ترتيب)؟','Hangi Platzierungsart (yerleştirme türü)?'],
'a5.2.q':['Nêu một ưu điểm cho kệ dầu gội và một nhược điểm cho kệ cà phê.','Nombra una ventaja del estante de champú y una desventaja del de café.','Nomeia uma vantagem da prateleira de champô e uma desvantagem da do café.','Назви одну перевагу полиці з шампунями й один недолік полиці з кавою.','ንመደርደሪ ሻምፑ ሓደ ረብሓን ንመደርደሪ ቡን ሓደ ጉድለትን ጥቀስ።','Назови одно преимущество полки с шампунями и один недостаток полки с кофе.','اذكر ميزة لرف الشامبو وعيبًا لرف القهوة.','Şampuan rafı için bir avantaj, kahve rafı için bir dezavantaj söyle.'],
'a6.h':['Bài tập tự do: Kệ lạnh đồ uống (3 điểm)','Ejercicio libre: el estante refrigerado de bebidas (3 puntos)','Exercício livre: a prateleira refrigerada de bebidas (3 pontos)','Вільна вправа: холодильна полиця для напоїв (3 бали)','ናጻ ልምምድ: ዝሑል መደርደሪ መስተ (3 ነጥቢ)','Свободное упражнение: холодильная полка для напитков (3 балла)','تمرين حر: رف مبرّد للمشروبات (3 نقاط)','Serbest alıştırma: İçecek soğutma rafı (3 puan)'],
'a6.i':['Em sắp một kệ lạnh mới với bốn vùng. Dùng thống kê doanh số và chọn vùng cho từng mặt hàng.','Montas un estante refrigerado nuevo con cuatro zonas. Usa la estadística de ventas y elige la zona de cada artículo.','Montas uma prateleira refrigerada nova com quatro zonas. Usa a estatística de vendas e escolhe a zona de cada artigo.','Ти облаштовуєш нову холодильну полицю з чотирма зонами. Використай статистику збуту й обери зону для кожного товару.','ሓድሽ ዝሑል መደርደሪ ምስ ኣርባዕተ ዞናት ትሰርዕ። ስታቲስቲክስ ሽያጥ ተጠቐም ንነፍሲ ወከፍ ኣቕሓ ዞና ምረጽ።','Ты обустраиваешь новую холодильную полку с четырьмя зонами. Используй статистику сбыта и выбери зону для каждого товара.','ترتّب رفًّا مبرّدًا جديدًا بأربع مناطق. استخدم إحصائية المبيعات واختر منطقة كل سلعة.','Dört bölgeli yeni bir soğutma rafı düzenliyorsun. Satış istatistiğini kullan ve her ürün için bölgeyi seç.'],
'a6.t':['Hàng nặng để dưới. Hàng lãi cao vào Sichtzone. Impulsartikel (hàng mua bốc đồng) vào Greifzone.','Lo pesado abajo. Lo de mucho margen en la Sichtzone. Los Impulsartikel en la Greifzone.','O pesado em baixo. O de muita margem na Sichtzone. Os Impulsartikel na Greifzone.','Важке — донизу. Товари з високою націнкою — в Sichtzone. Impulsartikel — у Greifzone.','ከቢድ ኣብ ታሕቲ። ብዙሕ ትርፊ ዘለዎ ኣብ Sichtzone። Impulsartikel ኣብ Greifzone።','Тяжёлое — вниз. Товары с высокой наценкой — в Sichtzone. Impulsartikel — в Greifzone.','الثقيل في الأسفل. ذو الهامش العالي في Sichtzone. وImpulsartikel في Greifzone.','Ağır olan aşağıya. Yüksek marjlı olan Sichtzone’a. Impulsartikel Greifzone’a.'],
'a6.e':['Nặng ở dưới, lãi cao vào Sichtzone, hàng mua bốc đồng vào Greifzone, hàng nhẹ ít bán chạy ở trên.','Pesado abajo, mucho margen en la Sichtzone, impulso en la Greifzone, lo ligero y de poca venta arriba.','Pesado em baixo, muita margem na Sichtzone, impulso na Greifzone, o leve e de pouca venda em cima.','Важке внизу, висока націнка в Sichtzone, імпульсні в Greifzone, легке й малопродажне вгорі.','ከቢድ ኣብ ታሕቲ፣ ብዙሕ ትርፊ ኣብ Sichtzone፣ ቅጽበታዊ ኣብ Greifzone፣ ፈኪ ውሑድ ሽያጥ ኣብ ላዕሊ።','Тяжёлое внизу, высокая наценка в Sichtzone, импульсные в Greifzone, лёгкое и малопродаваемое наверху.','الثقيل في الأسفل، ذو الهامش العالي في Sichtzone، الاندفاعي في Greifzone، الخفيف قليل البيع في الأعلى.','Ağır aşağıda, yüksek marj Sichtzone’da, ani alım Greifzone’da, hafif ve az satan yukarıda.'],
'a6.1.q':['Chọn vùng cho từng mặt hàng.','Elige la zona de cada artículo.','Escolhe a zona de cada artigo.','Обери зону для кожного товару.','ንነፍሲ ወከፍ ኣቕሓ ዞና ምረጽ።','Выбери зону для каждого товара.','اختر منطقة كل سلعة.','Her ürün için bölgeyi seç.'],
'a6.2.q':['Giải thích quyết định của em cho hai mặt hàng.','Justifica tu decisión para dos artículos.','Justifica a tua decisão para dois artigos.','Обґрунтуй своє рішення для двох товарів.','ውሳኔኻ ንክልተ ኣቕሑት ኣረጋግጽ።','Обоснуй своё решение для двух товаров.','علّل قرارك لسلعتين.','İki ürün için kararını gerekçelendir.'],
'a7.h':['Làm việc theo cặp: Tờ thông tin „1 × 1 der Regalpflege“ (chăm sóc kệ cơ bản) (2 điểm)','Trabajo en pareja: hoja informativa «1 × 1 der Regalpflege» (lo básico del cuidado del estante) (2 puntos)','Trabalho a pares: folha informativa «1 × 1 der Regalpflege» (o básico do cuidado da prateleira) (2 pontos)','Робота в парах: інфоаркуш «1 × 1 der Regalpflege» (основи догляду за полицею) (2 бали)','ስራሕ ብክልተ: ወረቐት ሓበሬታ «1 × 1 der Regalpflege» (2 ነጥቢ)','Работа в парах: инфолист «1 × 1 der Regalpflege» (основы ухода за полкой) (2 балла)','عمل ثنائي: ورقة معلومات «1 × 1 der Regalpflege» (أساسيات العناية بالرف) (نقطتان)','İkili çalışma: «1 × 1 der Regalpflege» (raf bakımı ABC’si) bilgi sayfası (2 puan)'],
'a8.t':['8.1: Từ trên xuống. 8.2: Eigenmarken thường lãi cao. 8.3: Nghĩ đến khách, lợi nhuận và đối thủ. 8.4: Ai khó với tới hàng?','8.1: De arriba abajo. 8.2: Las Eigenmarken suelen dar mucho margen. 8.3: Piensa en clientes, ganancia y competencia. 8.4: ¿Quién llega mal a la mercancía?','8.1: De cima para baixo. 8.2: As Eigenmarken costumam dar muita margem. 8.3: Pensa em clientes, lucro e concorrência. 8.4: Quem chega mal à mercadoria?','8.1: Згори донизу. 8.2: Eigenmarken зазвичай мають високу націнку. 8.3: Подумай про клієнтів, прибуток і конкурентів. 8.4: Хто погано дістає товар?','8.1: ካብ ላዕሊ ናብ ታሕቲ። 8.2: Eigenmarken ብዙሕ ግዜ ብዙሕ ትርፊ ኣለወን። 8.3: ዓሚላት፣ ትርፍን ተወዳደርትን ሕሰብ። 8.4: መን ንኣቕሑት ብጽቡቕ ኣይበጽሕን?','8.1: Сверху вниз. 8.2: У Eigenmarken обычно высокая наценка. 8.3: Подумай о клиентах, прибыли и конкурентах. 8.4: Кто плохо достаёт товар?','8.1: من الأعلى إلى الأسفل. 8.2: Eigenmarken غالبًا ذات هامش عالٍ. 8.3: فكّر في الزبائن والربح والمنافسين. 8.4: من يصعب عليه الوصول إلى البضاعة؟','8.1: Yukarıdan aşağıya. 8.2: Eigenmarken genelde yüksek marjlıdır. 8.3: Müşteri, kâr ve rakipleri düşün. 8.4: Mala kim zor ulaşır?'],
'a8.e':['Mỗi vùng và mỗi đề xuất cần có lý do.','Cada zona y cada propuesta lleva su motivo.','Cada zona e cada proposta leva o seu motivo.','До кожної зони й пропозиції потрібна причина.','ነፍሲ ወከፍ ዞናን ሓሳብን ምኽንያት የድልዮ።','К каждой зоне и предложению нужна причина.','لكل منطقة واقتراح سبب.','Her bölge ve her öneri için bir gerekçe gerekir.'],
'a8.1.q':['8.1 Các vùng của kệ trong hình tên là gì? Hãy gọi tên! (4 điểm)','8.1 ¿Cómo se llaman las zonas del estante mostrado? ¡Nómbrelas! (4 puntos)','8.1 Como se chamam as zonas da prateleira mostrada? Nomeie-as! (4 pontos)','8.1 Як називаються зони зображеної полиці? Назвіть їх! (4 бали)','8.1 ስሞም ዞናት እቲ ዝተርእየ መደርደሪ እንታይ እዩ? ሰም ሃብ! (4 ነጥቢ)','8.1 Как называются зоны изображённого стеллажа? Назовите их! (4 балла)','8.1 ما أسماء مناطق الرف المصوّر؟ سمِّها! (4 نقاط)','8.1 Resimdeki rafın bölgelerinin adları nedir? Adlandır! (4 puan)'],
'a8.2.q':['8.2 Warenhaus Seeblick GmbH cũng bán Handelsmarken (nhãn riêng, Eigenmarken). Em đặt nhãn riêng ở vùng nào? Nêu vùng và giải thích! (2 điểm)','8.2 El Warenhaus Seeblick GmbH tiene también Handelsmarken (marcas propias). ¿En qué zona colocaría una Eigenmarke? ¡Nombre la zona y justifique! (2 puntos)','8.2 O Warenhaus Seeblick GmbH tem também Handelsmarken (marcas próprias). Em que zona colocaria uma Eigenmarke? Nomeie a zona e justifique! (2 pontos)','8.2 Warenhaus Seeblick GmbH має й Handelsmarken (власні марки). У якій зоні ви розмістили б Eigenmarke? Назвіть зону й обґрунтуйте! (2 бали)','8.2 Warenhaus Seeblick GmbH Handelsmarken (ናይ ባዕል ምልክት) እውን ኣለዋ። Eigenmarke ኣብ ኣየናይ ዞና ኣቐምጥ? ዞና ጥቀስን ኣረጋግጽን! (2 ነጥቢ)','8.2 Warenhaus Seeblick GmbH имеет и Handelsmarken (собственные марки). В какой зоне вы разместили бы Eigenmarke? Назовите зону и обоснуйте! (2 балла)','8.2 لدى Warenhaus Seeblick GmbH أيضًا Handelsmarken (علامات خاصة). في أي منطقة تضع Eigenmarke؟ اذكر المنطقة وعلّل! (نقطتان)','8.2 Warenhaus Seeblick GmbH’nin Handelsmarken’i (özel markalar) de var. Bir Eigenmarke’yi hangi bölgeye koyarsın? Bölgeyi söyle ve gerekçelendir! (2 puan)'],
'a8.3.q':['8.3 Eigenmarken mang lại 3 lợi ích gì cho Warenhaus Seeblick GmbH? (3 điểm)','8.3 ¿Qué 3 ventajas tienen las Eigenmarken para el Warenhaus Seeblick GmbH? (3 puntos)','8.3 Que 3 vantagens têm as Eigenmarken para o Warenhaus Seeblick GmbH? (3 pontos)','8.3 Які 3 переваги мають Eigenmarken для Warenhaus Seeblick GmbH? (3 бали)','8.3 Eigenmarken ንWarenhaus Seeblick GmbH ኣየኖት 3 ረብሓታት ኣለወን? (3 ነጥቢ)','8.3 Какие 3 преимущества имеют Eigenmarken для Warenhaus Seeblick GmbH? (3 балла)','8.3 ما المزايا الثلاث لـ Eigenmarken بالنسبة لـ Warenhaus Seeblick GmbH؟ (3 نقاط)','8.3 Eigenmarken’in Warenhaus Seeblick GmbH için 3 avantajı nedir? (3 puan)'],
'a8.4.q':['8.4 Khi hiện đại hóa, Reckzone trong các kệ không còn được dùng. Kể 3 lý do! (3 điểm)','8.4 En la modernización la Reckzone de los estantes ya no se usa. ¡Nombre 3 motivos! (3 puntos)','8.4 Na modernização a Reckzone das prateleiras deixa de ser usada. Nomeie 3 motivos! (3 pontos)','8.4 Під час модернізації Reckzone на полицях більше не використовують. Назвіть 3 причини! (3 бали)','8.4 ኣብ ምሕዳስ Reckzone ኣብ መደርደሪታት ኣይትጥቀምን። ሰለስተ ምኽንያታት ጥቀስ! (3 ነጥቢ)','8.4 При модернизации Reckzone на стеллажах больше не используют. Назовите 3 причины! (3 балла)','8.4 عند التحديث لا تُستخدم Reckzone في الرفوف بعد الآن. اذكر 3 أسباب! (3 نقاط)','8.4 Modernizasyonda raflardaki Reckzone artık kullanılmıyor. 3 neden say! (3 puan)'],
'a9.t':['9.1: Cần gì để nhìn từ xa nhưng không để chạm tay? 9.2: Nhìn người bán, khách và nhà sản xuất nhỏ.','9.1: ¿Qué se necesita ver de lejos pero no tocar? 9.2: Mira al comerciante, los clientes y los fabricantes pequeños.','9.1: O que se precisa ver de longe mas não tocar? 9.2: Olha para o comerciante, os clientes e os pequenos fabricantes.','9.1: Що потрібно бачити здалеку, але не торкатися? 9.2: Подивись на торговця, клієнтів і малих виробників.','9.1: እንታይ ካብ ርሑቕ ዝርአ ግን ዘይትንከፍ? 9.2: ንነጋዳይ፣ ዓሚላትን ንኣሽቱ ኣምራትን ርአ።','9.1: Что нужно видеть издалека, но не трогать? 9.2: Посмотри на торговца, клиентов и малых производителей.','9.1: ماذا نحتاج أن نراه من بعيد ولا نلمسه؟ 9.2: انظر إلى التاجر والزبائن والمصنّعين الصغار.','9.1: Uzaktan görülmesi gereken ama dokunulmayan nedir? 9.2: Satıcıya, müşterilere ve küçük üreticilere bak.'],
'a9.e':['Một nhận định tốt xét mọi phía và giải thích quyết định.','Un buen juicio considera todos los lados y justifica la decisión.','Um bom juízo considera todos os lados e justifica a decisão.','Хороша оцінка враховує всі сторони й обґрунтовує рішення.','ጽቡቕ ፍርዲ ኩሎም ወገናት የጽንዕን ውሳኔ የረጋግጽን።','Хорошая оценка учитывает все стороны и обосновывает решение.','الحكم الجيد يراعي كل الجوانب ويعلّل القرار.','İyi bir değerlendirme tüm tarafları düşünür ve kararı gerekçelendirir.'],
'a9.1.q':['9.1 Phía trên Reckzone, sách giáo khoa nêu Informationszone (từ 2,10 m). Giải thích ở đó đặt gì và vì sao không đặt hàng.','9.1 Sobre la Reckzone el libro menciona una Informationszone (desde 2,10 m). Explica qué va allí y por qué no hay mercancía.','9.1 Acima da Reckzone o livro menciona uma Informationszone (a partir de 2,10 m). Explica o que vai lá e porque não há mercadoria.','9.1 Над Reckzone підручник згадує Informationszone (від 2,10 м). Поясни, що там розміщують і чому там немає товару.','9.1 ልዕሊ Reckzone እቲ መጽሓፍ Informationszone (ካብ 2,10 ሜ) ይጠቅስ። እንታይ ኣብኡ ከም ዝቕመጥን ስለምንታይ ኣቕሓ ከም ዘይህሉን ግለጽ።','9.1 Над Reckzone в учебнике упоминается Informationszone (от 2,10 м). Объясни, что там размещают и почему там нет товара.','9.1 فوق Reckzone يذكر الكتاب Informationszone (من 2,10 م). اشرح ما يوضع هناك ولماذا لا توجد بضاعة.','9.1 Reckzone’un üstünde ders kitabı bir Informationszone (2,10 m’den itibaren) anar. Orada ne durduğunu ve neden mal durmadığını açıkla.'],
'a9.2.q':['9.2 Nhà sản xuất thường trả tiền cho người bán để sản phẩm của họ nằm ở Sichtzone. Đánh giá việc này từ góc nhìn của người bán, khách và nhà sản xuất nhỏ.','9.2 Los fabricantes suelen pagar a los comerciantes para que sus productos estén en la Sichtzone. Valora esta práctica desde la perspectiva del comerciante, los clientes y los fabricantes pequeños.','9.2 Os fabricantes costumam pagar aos comerciantes para que os seus produtos estejam na Sichtzone. Avalia esta prática do ponto de vista do comerciante, dos clientes e dos pequenos fabricantes.','9.2 Виробники часто платять торговцям за те, щоб їхні продукти стояли в Sichtzone. Оціни цю практику з погляду торговця, клієнтів і малих виробників.','9.2 ኣምራትን ብዙሕ ግዜ ንነጋዶ ገንዘብ ይኸፍሉ ምኽንያቱ ምርቶም ኣብ Sichtzone ክቕመጥ። እዚ ኣካይዳ ካብ ኣረኣእያ ነጋዳይ፣ ዓሚላትን ንኣሽቱ ኣምራትን ገምግም።','9.2 Производители часто платят торговцам за то, чтобы их продукты стояли в Sichtzone. Оцени эту практику с точки зрения торговца, клиентов и малых производителей.','9.2 يدفع المصنّعون غالبًا للتجار كي تُوضع منتجاتهم في Sichtzone. قيّم هذه الممارسة من منظور التاجر والزبائن والمصنّعين الصغار.','9.2 Üreticiler ürünleri Sichtzone’da dursun diye satıcılara sıkça para öder. Bu uygulamayı satıcı, müşteriler ve küçük üreticiler açısından değerlendir.'],
'v1.h':['Nâng cao: Tại sao lại như vậy? Hãy tính cùng!','Profundización: ¿por qué es así? ¡Calcula!','Aprofundamento: porque é assim? Calcula!','Поглиблення: чому так? Порахуй!','ኣዝዩ ዝዓሞቐ: ስለምንታይ? ሕሳብ ግበር!','Углубление: почему так? Посчитай!','تعمّق: لماذا هذا؟ احسب!','Derinleştirme: Neden böyle? Hesapla!'],
'v1.i':['Tính lợi nhuận mỗi tuần (doanh số mỗi tuần × lợi nhuận mỗi sản phẩm) cho các mặt hàng ở Aufgabe 6. Sau đó giải thích quyết định của em.','Calcula la ganancia semanal (ventas por semana × ganancia por unidad) de artículos de la Aufgabe 6. Después justifica tu decisión.','Calcula o lucro semanal (vendas por semana × lucro por unidade) de artigos da Aufgabe 6. Depois justifica a tua decisão.','Порахуй тижневий прибуток (збут за тиждень × прибуток за штуку) для товарів з Aufgabe 6. Потім обґрунтуй своє рішення.','ትርፊ ሰሙን (ሽያጥ ሰሙን × ትርፊ ንሓደ) ንኣቕሑት ካብ Aufgabe 6 ሕሰብ። ድሕሪኡ ውሳኔኻ ኣረጋግጽ።','Посчитай недельную прибыль (сбыт в неделю × прибыль с единицы) для товаров из Aufgabe 6. Потом обоснуй своё решение.','احسب الربح الأسبوعي (المبيعات في الأسبوع × الربح للقطعة) لسلع من Aufgabe 6. ثم علّل قرارك.','Aufgabe 6’daki ürünler için haftalık kârı hesapla (haftalık satış × adet başına kâr). Sonra kararını gerekçelendir.'],
'v1.t':['Lợi nhuận mỗi tuần = doanh số mỗi tuần × lợi nhuận mỗi sản phẩm. Viết số có dấu phẩy, ví dụ 12,50.','Ganancia semanal = ventas por semana × ganancia por unidad. Escribe con coma, p. ej. 12,50.','Lucro semanal = vendas por semana × lucro por unidade. Escreve com vírgula, p. ex. 12,50.','Тижневий прибуток = збут за тиждень × прибуток за штуку. Пиши з комою, напр. 12,50.','ትርፊ ሰሙን = ሽያጥ ሰሙን × ትርፊ ንሓደ። ብነጥቢ ጽሓፍ፣ ንኣብነት 12,50።','Недельная прибыль = сбыт в неделю × прибыль с единицы. Пиши с запятой, напр. 12,50.','الربح الأسبوعي = المبيعات في الأسبوع × الربح للقطعة. اكتب بالفاصلة، مثل 12,50.','Haftalık kâr = haftalık satış × adet başına kâr. Virgülle yaz, örn. 12,50.'],
'v1.1.q':['V1 Cola 0,33 l mang lại bao nhiêu lợi nhuận mỗi tuần?','V1 ¿Cuánta ganancia da la Cola 0,33 l por semana?','V1 Quanto lucro dá a Cola 0,33 l por semana?','V1 Скільки прибутку приносить Cola 0,33 l за тиждень?','V1 Cola 0,33 l ኣብ ሰሙን ክንደይ ትርፊ የምጽእ?','V1 Сколько прибыли приносит Cola 0,33 l в неделю?','V1 كم ربحًا تعطي Cola 0,33 l في الأسبوع؟','V1 Cola 0,33 l haftada ne kadar kâr getirir?'],
'v1.2.q':['V2 Bio-Fruchtsaft 0,75 l (nước ép hữu cơ) mang lại bao nhiêu lợi nhuận mỗi tuần?','V2 ¿Cuánta ganancia da el Bio-Fruchtsaft 0,75 l (zumo ecológico) por semana?','V2 Quanto lucro dá o Bio-Fruchtsaft 0,75 l (sumo biológico) por semana?','V2 Скільки прибутку приносить Bio-Fruchtsaft 0,75 l (органічний сік) за тиждень?','V2 Bio-Fruchtsaft 0,75 l ኣብ ሰሙን ክንደይ ትርፊ የምጽእ?','V2 Сколько прибыли приносит Bio-Fruchtsaft 0,75 l (органический сок) в неделю?','V2 كم ربحًا يعطي Bio-Fruchtsaft 0,75 l (عصير عضوي) في الأسبوع؟','V2 Bio-Fruchtsaft 0,75 l (organik meyve suyu) haftada ne kadar kâr getirir?'],
'v1.3.q':['V3 Giải thích: Tại sao Cola ở Greifzone còn Bio-Fruchtsaft ở Sichtzone, dù Cola mang lại nhiều lợi nhuận hơn mỗi tuần?','V3 Justifica: ¿por qué la Cola está en la Greifzone y el Bio-Fruchtsaft en la Sichtzone aunque la Cola da más ganancia a la semana?','V3 Justifica: porque é que a Cola está na Greifzone e o Bio-Fruchtsaft na Sichtzone, apesar de a Cola dar mais lucro por semana?','V3 Обґрунтуй: чому Cola в Greifzone, а Bio-Fruchtsaft у Sichtzone, хоча Cola приносить більше прибутку за тиждень?','V3 ኣረጋግጽ: ስለምንታይ Cola ኣብ Greifzone ኮይና Bio-Fruchtsaft ኣብ Sichtzone እኳ ምኽንያቱ Cola ብሰሙን ዝበዝሐ ትርፊ የምጽእ?','V3 Обоснуй: почему Cola в Greifzone, а Bio-Fruchtsaft в Sichtzone, хотя Cola приносит больше прибыли в неделю?','V3 علّل: لماذا Cola في Greifzone وBio-Fruchtsaft في Sichtzone رغم أن Cola تربح أكثر في الأسبوع؟','V3 Gerekçelendir: Cola haftada daha çok kâr getirmesine rağmen neden Cola Greifzone’da, Bio-Fruchtsaft Sichtzone’da?']
};

 var v=A(it.id);

 }return false}

function updProg(){var u=units();var d=u.filter(function(x){return x.done}).length;var p=u.length?Math.round(100*d/u.length):0;var f=document.getElementById('progf');if(f){f.style.width=p+'%';document.getElementById('progt').textContent=U('progress')+': '+d+' / '+u.length+' '+U('done')+' ('+p+' %)'}
 var q=p===100&&!S.pdone;if(q){S.pdone=1;toast('🎉 100 %')}}
/* Bewertung */
function num(s){var t=String(s).replace(/\s/g,'').replace(/€|%|cm|g|kg|ml|l|m/gi,'').replace(',','.');var x=parseFloat(t);return isNaN(x)?null:x}
function grade(it){
 var v=A(it.id),got=0,max=0,rows=[];
 switch(it.t){
 case 'free':max=it.pts||1;var s=v&&v.s!=null?v.s:null;got=s==null?0:[0,.5,1][s]*max;break;
 case 'mc':max=it.pts||1;if(v!=null&&v===it.a)got=max;break;
 case 'calc':max=it.pts||1;var n=num(v==null?'':v);if(n!=null&&Math.abs(n-it.a)<=(it.tol==null?0.005:it.tol))got=max;break;
 case 'table':case 'sel':it.rows.forEach(function(r,i){max++;var ok=v&&v[i]===r[1];if(ok)got++;rows.push(ok)});break;
 case 'tf':it.rows.forEach(function(r,i){max++;var ok=v&&v[i]===r[1];if(ok)got++;rows.push(ok)});break;
 case 'gap':it.a.forEach(function(a,i){max++;var ok=v&&v[i]===a;if(ok)got++;rows.push(ok)});break}
 return {got:got,max:max,rows:rows}}
function totals(){var g=0,m=0,bg=0;SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b))return;items(b).forEach(function(it){if(it.t==='free'&&b.noscore)return;var r=grade(it);if(b.lvl==='v')bg+=r.got;else{g+=r.got;m+=r.max}})});return {g:g,m:m,b:bg}}
function r1(x){return (Math.round(x*10)/10).toString().replace('.',',')}
/* Rendering */
function tipHTML(b){if(!b.tip)return '';return '<button class="tipb noprint" data-act="tip" data-id="'+b.id+'" aria-label="'+esc(UI.tip[0])+'">💡 '+esc(U('tip'))+'</button>'}

function fbBox(kind,html){return '<div class="fb '+kind+'">'+html+'</div>'}
function showFb(b){return S.chk[b.id]||S.sub}
function renderItem(b,it){
 var v=A(it.id),fb=showFb(b),h='',g,q=it.q?'<div class="q">'+esc(it.q)+'</div>'+(it.nq?'':tl(it.qk||it.id+'.q')):'';
 switch(it.t){
 case 'note':return '<div class="sit">'+it.html+'</div>';
 case 'est':return renderEst(it);
 case 'free':
  v=v||{};h=q+'<textarea class="in" rows="4" data-act="txt" data-id="'+it.id+'" placeholder="…">'+esc(v.t||'')+'</textarea>';
  h+='<div class="noprint"><button class="btn sec" data-act="sol" data-id="'+it.id+'">'+B('sol')+'</button></div>';
  if(S.sol[it.id]||fb&&v.t){h+='<div class="model"><b>'+esc(UI.model[0])+'</b>'+it.model+'</div>';
   h+='<div class="q">'+esc(UI.selfq[0])+'</div>'+tl_ui('selfq')+'<div class="row2">'+[['selfyes',2],['selfpart',1],['selfno',0]].map(function(p){return '<button class="btn gray" style="'+(v.s===p[1]&&v.s!=null?'background:#e3f0f6;border-color:#2f6f8f':'')+'" data-act="self" data-id="'+it.id+'" data-i="'+p[1]+'">'+B(p[0])+'</button>'}).join('')+'</div>'}
  break;
 case 'mc':
  g=grade(it);h=q+opts(it.o,v,fb?function(i){return i===it.a?'ok':(v===i?'no':'')}:null,'mc',it.id);
  if(fb)h+=fbBox(g.got?'ok':'no',g.got?esc(U('right')):esc(U('wrong'))+' '+esc(UI.correctis[0])+' <b>'+esc(it.o[it.a])+'</b>');
  break;
 case 'calc':
  g=grade(it);h=q+'<div class="row2"><input class="in" style="max-width:12rem" inputmode="decimal" autocomplete="off" data-act="calc" data-id="'+it.id+'" value="'+esc(v||'')+'"><b>'+esc(it.unit||'')+'</b></div>';
  if(fb){h+=fbBox(g.got?'ok':'no',(g.got?esc(U('right')):esc(U('wrong'))+' '+esc(UI.correctis[0])+' <b>'+r1(it.a)+' '+esc(it.unit||'')+'</b>')+'<div><b>'+esc(UI.steps[0])+':</b><br>'+it.steps.map(esc).join('<br>')+'</div>'+tl_ui('steps'))}
  break;
 case 'table':
  g=grade(it);h=q+'<table class="tbl"><tr><th>'+(it.hd||'')+'</th>'+it.cols.map(function(c){return '<th class="c" title="'+esc(c[1]||'')+'">'+esc(c[0])+'</th>'}).join('')+'</tr>'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+'</td>'+it.cols.map(function(c,j){var cl=sel===j?' on':'';if(fb){if(j===r[1])cl+=sel===j?' ok':' sol';else if(sel===j)cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tb" data-id="'+it.id+'" data-r="'+i+'" data-i="'+j+'" aria-label="'+esc(c[1]||c[0])+'">'+esc(c[0])+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(it.legend)h+='<div class="meta">'+esc(it.legend)+'</div>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'tf':
  g=grade(it);h=q+'<table class="tbl">'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+'</td>'+[[true,'✔'],[false,'✘']].map(function(c){var cl=sel===c[0]?' on':'';if(fb){if(c[0]===r[1])cl+=sel===c[0]?' ok':' sol';else if(sel===c[0])cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tf" data-id="'+it.id+'" data-r="'+i+'" data-i="'+(c[0]?1:0)+'">'+c[1]+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'sel':
  g=grade(it);h=q+'<table class="tbl">'+it.rows.map(function(r,i){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';
   return '<tr><td>'+esc(r[0])+'</td><td><select class="in gapsel'+cl+'" data-act="sel" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.o.map(function(o,j){return '<option value="'+j+'"'+(sel===j?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'+(fb&&!g.rows[i]?'<div class="meta">'+esc(UI.correctis[0])+' <b>'+esc(it.o[r[1]])+'</b></div>':'')+'</td></tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'gap':
  g=grade(it);var k=0;h=q+'<div class="gaptxt">'+it.text.split('___').map(function(p,i,arr){var s=esc(p);if(i<arr.length-1){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';s+='<select class="gapsel'+cl+'" data-act="gap" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.bank.map(function(o){return '<option'+(sel===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}return s}).join('')+'</div>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max+(g.got<g.max?' — '+esc(UI.correctis[0])+' <b>'+it.a.map(esc).join(' · ')+'</b>':''));
  break}
 if(fb&&it.ex&&it.t!=='free')h+='<div class="meta">'+esc(it.ex)+'</div>'+tl(it.id+'.e');
 return '<div class="item">'+h+'</div>'}
function tl_ui(k){if(S.lang==='de')return '';return '<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U(k))+'</div>'}
function renderEst(it){var v=A(it.id)||{};var t=totals();return '<div class="row2"><label>'+B('estl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="e" value="'+esc(v.e||'')+'"></div><div class="row2"><label>'+B('resl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="r" value="'+esc(v.r||'')+'"></div>'+(v.e&&v.r?'<div class="meta">'+esc(UI.diff[0])+': '+(Number(v.r)-Number(v.e))+'</div>':'')}
function renderRead(b){
 var mk=S.mk[b.id]||[],done=S.chk[b.id],idx=0,tot=0,hit=0,wrong=0;
 var paras=b.paras.map(function(p){return '<p>'+p.replace(/\[\[(.+?)\]\]([.,;:!?)]*)|\{\{(.+?)\}\}([.,;:!?)]*)|([^\s\[\{]+)/g,function(m,a,pa,d,pd,w){var i=idx++,sel=mk.indexOf(i)>=0,cl='';var good=a!=null;if(good)tot++;
   if(done){if(sel&&good){cl=' ok';hit++}else if(sel){cl=' no';wrong++}else if(good)cl=' miss'}else if(sel)cl=' on';
   return '<span class="w'+cl+'" data-act="mk" data-id="'+b.id+'" data-i="'+i+'">'+esc(a||d||w)+'</span>'+esc(pa||pd||'')+' '})+'</p>'}).join('');
 var h='<div class="card read"><h2>📖 '+esc(b.h)+'</h2>'+tl(b.hk||b.id+'.h')+'<div class="meta">'+esc(U('readhint'))+'</div>'+(b.sum?'<div class="meta"><b>→ </b>'+esc(b.sum)+'</div>'+tl(b.id+'.s'):'')+paras;
 if(b.html)h+=b.html;
 h+='<button class="btn" data-act="mkchk" data-id="'+b.id+'">'+B('mark')+'</button>';
 if(done){var all=b.paras.join(' ').match(/\[\[.+?\]\]/g)||[];h+=fbBox(wrong===0&&hit===all.length?'ok':'part','✔ '+hit+' / '+all.length+' '+esc(U('found'))+(wrong?' · ✘ '+wrong+' '+esc(U('toomany')):'')+(hit<all.length?'<br>'+esc(U('missed')):''))}
 if(b.q){var v=A(b.id+'.q');h+='<div class="q">'+esc(b.q.q)+'</div>'+tl(b.id+'.qq')+opts(b.q.o,v,(done&&v!=null)?function(i){return i===b.q.a?'ok':(v===i?'no':'')}:null,'mc',b.id+'.q')}
 return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});
 return h}
function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';
 SHEET.blocks.forEach(function(b){if(b.k==='read')h+=renderRead(b);else if(vis(b))h+=renderTask(b)});
 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';
 if(S.sub)h+=renderResult();
 document.getElementById('app').innerHTML=h;
 document.getElementById('report').innerHTML=renderReport();
 renderBar();updProg();pad();
 window.scrollTo(0,y)}
function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');
 document.documentElement.lang=S.lang;
 }
function pad(){var m=document.querySelector('main'),b=document.getElementById('bar');if(m&&b)m.style.paddingTop=(b.offsetHeight+14)+'px'}
window.addEventListener('resize',pad);
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function dialog(msgKey,onYes){var d=document.createElement('div');d.className='dlg';d.innerHTML='<div><p><b>'+esc(UI[msgKey][0])+'</b></p>'+(S.lang!=='de'?'<p>'+esc(U(msgKey))+'</p>':'')+'<button class="btn" data-d="y">'+B('yes')+'</button><button class="btn gray" data-d="n">'+B('cancel')+'</button></div>';d.addEventListener('click',function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-d');if(!x&&e.target!==d&&!e.target.closest('[data-d]'))return;var dd=e.target.closest('[data-d]');if(dd&&dd.getAttribute('data-d')==='y')onYes();d.remove()});document.body.appendChild(d)}
function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});
document.getElementById('gear').addEventListener('click',function(){S.open=!S.open;save();renderBar()});
document.addEventListener('change',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act');if(act==='gap'||act==='sel'){var arr=S.a[el.getAttribute('data-id')]||[];var v=el.value;arr[Number(el.getAttribute('data-r'))]=act==='sel'?(v===''?null:Number(v)):(v===''?null:v);S.a[el.getAttribute('data-id')]=arr;save();updProg()}});
document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
document.addEventListener('visibilitychange',saveNow);window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',function(){document.getElementById('report').innerHTML=renderReport()});
/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;
render();
if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};
window.__state=function(){return S};
})();
