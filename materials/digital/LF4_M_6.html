<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF 4 · Digitales Arbeitsblatt</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + .5rem) 1rem .4rem}
#bar .row{display:flex;align-items:center;gap:.6rem;max-width:56rem;margin:0 auto}
#bar .ttl{font-weight:700;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{height:.7rem;background:#e6e3da;border-radius:1rem;overflow:hidden;max-width:56rem;margin:.35rem auto 0}
#progf{height:100%;width:0;background:var(--pri);transition:width .4s}
#progt{font-size:.8rem;color:var(--mute);max-width:56rem;margin:.1rem auto 0}
#langs{display:flex;gap:.4rem;overflow-x:auto;max-width:56rem;margin:.35rem auto 0;padding-bottom:.15rem;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;min-height:44px;padding:0 .9rem;border:2px solid var(--line);background:#fff;border-radius:2rem;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;margin:0 0 1rem}
.card h2{font-size:1.25rem;margin:0 0 .4rem;line-height:1.3}
.card h2 .nr{display:inline-block;background:var(--pri);color:#fff;border-radius:.5rem;padding:0 .5rem;margin-right:.4rem;font-size:.95rem}
.vtag{display:inline-block;background:#6a3fa0;color:#fff;border-radius:.5rem;padding:0 .5rem;font-size:.85rem;margin-left:.3rem}
.card.v{border-color:#6a3fa0;background:#faf6ff}
.tr{font-size:.9rem;color:#4a5a66;background:#f1f6f9;border-left:4px solid #9cc3d5;border-radius:.4rem;padding:.3rem .6rem;margin:.3rem 0 .5rem;line-height:1.5}
.tr[dir=rtl]{border-left:0;border-right:4px solid #9cc3d5}
.tr[lang=ti]{font-family:"Kefa","Noto Sans Ethiopic",sans-serif}
.tr[lang=vi]{line-height:1.65}
small.b{display:block;font-size:.72rem;font-weight:400;opacity:.9;line-height:1.2}
.in{display:block;width:100%;min-height:48px;font:inherit;font-size:1rem;padding:.55rem .7rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink)}
input.in,select.in{font-size:1rem}
textarea.in{min-height:5.5rem;resize:vertical}
.btn{min-height:48px;padding:.4rem 1.1rem;border:0;border-radius:.8rem;background:var(--pri);color:#fff;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin:.3rem .4rem .3rem 0}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.gray{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.big{min-height:56px;font-size:1.1rem}
.btn:active,.pill:active,.opt:active,.ch:active{transform:scale(.97)}
.tipb{min-height:48px;min-width:48px;border-radius:2rem;border:2px solid var(--warn);background:var(--warnbg);font:inherit;font-size:1rem;cursor:pointer;padding:0 .9rem;float:right;margin:0 0 .3rem .5rem}
.tipbox{background:var(--warnbg);border:2px solid var(--warn);border-radius:.8rem;padding:.5rem .8rem;margin:.4rem 0}
.q{margin:.8rem 0 .2rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:.45rem;margin:.3rem 0}
.opt{min-height:48px;text-align:left;padding:.5rem .8rem;border:2px solid var(--line);background:#fff;border-radius:.8rem;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--pri);background:var(--pri2);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.tbl{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:1rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.4rem .3rem;text-align:left;vertical-align:middle}
.tbl.info th{background:#eef3f6}
.tbl.info td,.tbl.info th{border:1px solid var(--line);padding:.4rem .5rem}
.tbl td.c{text-align:center;white-space:nowrap}
.ch{min-width:48px;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:.7rem;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer;margin:2px}
.ch.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.sol{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
tr.rok td{background:var(--okbg)}tr.rno td{background:var(--badbg)}
.fb{border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0;font-size:1rem}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb.part{background:var(--warnbg);border:1px solid var(--warn)}
.sit{background:#eef3f6;border-left:5px solid var(--pri);border-radius:.5rem;padding:.5rem .8rem;margin:.5rem 0}
.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#23303a;color:#fff;padding:.6rem 1.1rem;border-radius:2rem;z-index:99;font-size:1rem;max-width:90%}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}
.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}
#set.open{display:block}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row2 label{font-weight:600;min-width:7rem}
.nowrap{white-space:nowrap}
#report{display:none}
@media (max-width:600px){main{padding-top:8.2rem}.card{padding:.8rem}h1{font-size:1.35rem}.tbl{font-size:.95rem}}
@media print{
 body{background:#fff;padding:0;font-size:11pt}
 #bar,#set,main,.toast,.dlg,.noprint{display:none!important}
 #report{display:block!important}
 #report h1{font-size:16pt}
 #report table{width:100%;border-collapse:collapse;font-size:10pt}
 #report td,#report th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

.tbl.selt td:first-child{width:55%}
.tbl.selt select.gapsel{width:100%;min-width:0}

</style>
</head>

 q:{q:'Wohin gehören Impulsartikel (z. B. Kaugummi)?',o:['in die Kassenzone','in die hintere Ecke','hinter die Kasse'],a:0}},
{k:'task',id:'a3',n:'Aufgabe 3',h:'Vorgemacht: eine Zone beurteilen',intro:'Schau dir den Grundriss an. Der gestrichelte Pfeil zeigt den Kundenlauf. Lies das Beispiel für Zone B und beantworte die Frage.',ik:'a3.i',tip:'Wo liegt die Zone im Verhältnis zum Pfeil? Schauen die Kunden dorthin?',ex:'Zone B liegt an der rechten Wand direkt am Hauptlaufweg nach dem Eingang. Die Kunden schauen nach rechts. Darum ist sie verkaufsstark.',

{k:'task',id:'a4',n:'Aufgabe 4',h:'Geführte Übung: Alle Zonen im Grundriss',intro:'Beurteile die übrigen Zonen des Grundrisses: stark oder schwach? Dann wähle zu jeder Zone die passende Begründung.',ik:'a4.i',tip:'Schaue auf den Pfeil: rechts davon = stark. Ecken, Eingang, hinten und links = schwach. Gondelköpfe, Auflaufwand und Kasse = stark.',ex:'Stark: Gondelkopf (C), Auflaufwand (E), Kassenzone (H). Schwach: Eingang (A), Mittelgang (D), Ecke (F), links vom Weg (G), hinter der Kasse (I).',

{k:'task',id:'a6',n:'Aufgabe 6',h:'Freie Übung: Zonen aufwerten und nutzen',intro:'Beantworte die Fragen in Stichworten oder kurzen Sätzen.',ik:'a6.i',tip:'Denke daran: Schwache Zonen brauchen einen Grund, damit Kunden dorthin gehen. Starke Zonen sehen viele Kunden.',ex:'Aufwerten: Aktionsware, Verkostung, Suchartikel, Displays, Deko, Licht. Eigenmarken: schwache Zone = gezielte Suche, starke Zone = viele sehen sie.',items:[

 {t:'free',id:'a6.2',pts:4,q:'6.2 Sie sind für die Platzierung der Handelsmarken (Eigenmarken) verantwortlich. Kunden sollen sie in verkaufsschwachen und in verkaufsstarken Zonen finden. Begründen Sie jeweils, warum das sinnvoll ist! (4 Punkte)',model:'verkaufsschwache Zone: Der Kunde sucht gezielt nach den Artikeln und läuft dafür auch dorthin. Verkaufsstarke Zone: Dort ist eine hohe Kundenfrequenz, viele sehen die Eigenmarke. (je 2 P.)'},
 {t:'free',id:'a6.3',pts:4,q:'6.3 Bei der Warenplatzierung beachten Sie auch den Eingangsbereich. Nennen Sie 2 Gründe dafür! (4 Punkte)',model:'Attraktivität dieser Zone steigern; Kundenlauf soll gestoppt werden; durch Angebote wird die Zone aktiviert; neue Artikel bekannt machen (je 2 P.)'}]},

 {t:'free',id:'a8.1',q:'8.1 Im Eingangsbereich stehen oft Aktionsware und Neuheiten – trotzdem gilt er als verkaufsschwach. Erklären Sie diesen Widerspruch und erläutern Sie, wie Händler damit umgehen.',model:'Kunden kommen schnell herein, orientieren sich erst und nehmen wenig wahr („Rennstrecke“). Händler setzen deshalb Stopper, Tische und auffällige Aktionsware ein, um das Tempo zu bremsen – der Bereich wird aufgewertet, bleibt aber schwierig.'},
 {t:'free',id:'a8.2',q:'8.2 „Milch und Brot ganz hinten – das ist kundenfeindlich!“ Beurteilen Sie diese Aussage aus Sicht der Kunden und des Händlers und machen Sie einen Kompromissvorschlag.',model:'Kunden: lange Wege, lästig für Eilige und Ältere. Händler: Kunden sehen auf dem Weg viel Ware, mehr Impulskäufe. Kompromiss: kleine Zweitplatzierung wichtiger Grundnahrungsmittel vorn, Express-Kasse, klare Beschilderung.'}]},

'can.0':['Mô tả hành vi của khách trong cửa hàng (Kundenlauf, dòng đi của khách).','Describir el comportamiento de los clientes en la tienda (Kundenlauf, recorrido del cliente).','Descrever o comportamento dos clientes na loja (Kundenlauf, percurso do cliente).','Описувати поведінку клієнтів у магазині (Kundenlauf, рух клієнтів).','ንመገዲ ዓሚላት ኣብ ድኳን (Kundenlauf) ግለጽ።','Описывать поведение клиентов в магазине (Kundenlauf, движение клиентов).','وصف سلوك الزبائن في المتجر (Kundenlauf، حركة الزبائن).','Müşterilerin mağazadaki davranışını anlatmak (Kundenlauf, müşteri akışı).'],

'can.2':['Đặt đúng Impulsartikel (hàng mua bốc đồng), Mussartikel (hàng bắt buộc), Magnetartikel (hàng thu hút) và hàng dễ bị trộm.','Colocar bien los Impulsartikel (de impulso), Mussartikel (imprescindibles), Magnetartikel (imán) y los artículos con riesgo de robo.','Colocar bem os Impulsartikel (de impulso), Mussartikel (indispensáveis), Magnetartikel (íman) e artigos com risco de furto.','Правильно розміщувати Impulsartikel (імпульсні), Mussartikel (обов’язкові), Magnetartikel (магніти) та товари, що часто крадуть.','Impulsartikel፣ Mussartikel፣ Magnetartikel ን ክሳዕ ዝስረቑ ኣቕሑትን ብቅኑዕ ኣቐምጥ።','Правильно размещать Impulsartikel (импульсные), Mussartikel (обязательные), Magnetartikel (магниты) и товары, подверженные краже.','وضع Impulsartikel (سلع الاندفاع) وMussartikel (سلع ضرورية) وMagnetartikel (سلع جاذبة) والسلع المعرّضة للسرقة في مكانها الصحيح.','Impulsartikel (ani alım), Mussartikel (zorunlu), Magnetartikel (mıknatıs) ve hırsızlık riski olan ürünleri doğru yerleştirmek.'],
'can.3':['Kể biện pháp làm cho khu yếu trở nên hấp dẫn hơn.','Nombrar medidas para revalorizar zonas débiles.','Nomear medidas para valorizar zonas fracas.','Назвати заходи, якими покращують слабкі зони.','ንድኹማት ዞናት ዘሐይሉ ተግባራት ጥቀስ።','Назвать меры, которыми улучшают слабые зоны.','ذكر إجراءات لرفع قيمة المناطق الضعيفة.','Zayıf bölgeleri iyileştirmek için önlemleri söylemek.'],

'a1.3.q':['1.3 Kệ hàng giữa cửa hàng nên cao tối đa bao nhiêu?','1.3 ¿Qué altura máxima deben tener los soportes en el centro de la tienda?','1.3 Que altura máxima devem ter os suportes no centro da loja?','1.3 Якої максимальної висоти мають бути стелажі в центрі магазину?','1.3 መደርደሪታት ኣብ ማእከል ድኳን ክሳብ ክንደይ ክዓብዩ ኣለዎም?','1.3 Какой максимальной высоты должны быть стеллажи в центре магазина?','1.3 ما أقصى ارتفاع للحاملات في وسط المتجر؟','1.3 Mağazanın ortasındaki taşıyıcılar en çok ne kadar yüksek olmalı?'],
'a2.h':['Lớp học biến thành cửa hàng','El aula se convierte en tienda','A sala de aula torna-se loja','Клас перетворюється на магазин','መሃሪ ክፍሊ ድኳን ይኸውን','Класс превращается в магазин','الصف يتحول إلى متجر','Sınıf mağazaya dönüşüyor'],
'a2.i':['Trong giờ học, ba bạn đi vào cửa hàng-lớp học với vai „khách“ mà không biết mục đích. Mọi người khác quan sát. Hãy viết ở đây những quan sát điển hình.','En clase tres de vosotros recorren la tienda-aula como «clientes» sin saber de qué va. Los demás observan. Escribe aquí las observaciones típicas.','Na aula três de vocês percorrem a loja-sala como «clientes» sem saber do que se trata. Os outros observam. Escreve aqui as observações típicas.','На уроці троє з вас проходять класом-магазином як «клієнти», не знаючи мети. Решта спостерігають. Запиши тут типові спостереження.','ኣብ ትምህርቲ ሰለስተ ካባኹም ከም «ዓሚላት» ኣብ ድኳን-ክፍሊ ይሓልፉ። ካልኦት ይከታተሉ። ኣብዚ ባህርያዊ ምስትውዓላት ጽሓፍ።','На уроке трое из вас проходят по классу-магазину как «клиенты», не зная цели. Остальные наблюдают. Запиши здесь типичные наблюдения.','في الحصة يمرّ ثلاثة منكم كـ«زبائن» في الصف-المتجر دون أن يعرفوا الهدف. الباقون يراقبون. اكتب هنا الملاحظات النموذجية.','Derste üçünüz «müşteri» olarak sınıf-mağazayı dolaşır, amacı bilmeden. Diğerleri izler. Burada tipik gözlemleri yaz.'],
'a2.t':['Nghĩ đến cửa vào: Đa số người đi hướng nào? Họ không đi đến đâu?','Piensa en la entrada: ¿hacia dónde va la mayoría? ¿A dónde no van?','Pensa na entrada: para onde vai a maioria? Para onde não vão?','Згадай вхід: куди йде більшість? Куди не йдуть?','መእተዊ ሕሰብ: መብዛሕትኦም ናበይ ይኸዱ? ናበይ ኣይኸዱን?','Подумай о входе: куда идёт большинство? Куда не идут?','فكّر في المدخل: إلى أين يتجه معظم الناس؟ وأين لا يذهبون؟','Girişi düşün: Çoğu kişi nereye gider? Nereye gitmez?'],
'a2.e':['Đa số khách đi sang phải, tránh góc và nơi tối, và dừng lại ở những thứ nằm trên đường đi.','La mayoría va a la derecha, evita rincones y zonas oscuras y se detiene ante lo que está en el camino.','A maioria vai para a direita, evita cantos e zonas escuras e pára diante do que está no caminho.','Більшість іде праворуч, оминає кути й темні місця й зупиняється біля того, що стоїть на шляху.','መብዛሕትኦም ናብ የማን ይኸዱ፣ ኩርናዓትን ጸልማት ቦታታትን ይርሕቑ፣ ኣብ መገዲ ዘሎ ነገር ይደው።','Большинство идёт направо, избегает углов и тёмных мест и останавливается у того, что стоит на пути.','معظمهم يتجه يمينًا ويتجنب الزوايا والأماكن المظلمة ويتوقف عند ما يقع في طريقه.','Çoğu sağa gider, köşelerden ve karanlık yerlerden kaçınır ve yolda duran şeylerin önünde durur.'],
'a2.1.q':['In welche Richtung … Khách đi hướng nào trước tiên sau lối vào?','¿Hacia dónde van primero los clientes tras la entrada?','Para onde vão primeiro os clientes depois da entrada?','Куди спершу йдуть клієнти після входу?','ድሕሪ መእተዊ ዓሚላት ቀዳምነት ናበይ ይኸዱ?','Куда сначала идут клиенты после входа?','إلى أين يتجه الزبائن أولًا بعد المدخل؟','Girişten sonra müşteriler önce nereye gider?'],
'a2.2.q':['Họ bỏ qua khu vực nào?','¿Qué zonas se saltan?','Que zonas deixam de fora?','Які зони вони оминають?','ኣየኖት ቦታታት ይሓልፉ?','Какие зоны они пропускают?','أي المناطق يتجاهلونها؟','Hangi bölgeleri atlarlar?'],
'a2.3.q':['Họ dừng lại ở đâu?','¿Dónde se detienen?','Onde param?','Де вони зупиняються?','ኣበይ ይደው?','Где они останавливаются?','أين يتوقفون؟','Nerede dururlar?'],
'r1.h':['Đọc thêm: Khu bán mạnh và khu bán yếu','Para leer: zonas de venta fuertes y débiles','Para ler: zonas de venda fortes e fracas','Для читання: сильні й слабкі зони продажу','ንምንባብ: ጽኑዓትን ድኹማትን ዞናት ሽያጥ','Для чтения: сильные и слабые зоны продаж','للقراءة: مناطق البيع القوية والضعيفة','Okumak için: Güçlü ve zayıf satış bölgeleri'],
'r1.s':['Khách đi vòng sang phải. Khu ở bên đó là verkaufsstark (bán mạnh).','Los clientes giran a la derecha. Esa zona es verkaufsstark (fuerte).','Os clientes viram à direita. Essa zona é verkaufsstark (forte).','Клієнти йдуть праворуч. Ця зона — verkaufsstark (сильна).','ዓሚላት ናብ የማን ይግይሱ። እታ ዞና verkaufsstark (ጽኑዕ) እያ።','Клиенты идут направо. Эта зона — verkaufsstark (сильная).','الزبائن يتجهون يمينًا. تلك المنطقة verkaufsstark (قوية).','Müşteriler sağa gider. O bölge verkaufsstark’tır (güçlü).'],
'r1.qq':['Impulsartikel (hàng mua bốc đồng, ví dụ kẹo cao su) nên đặt ở đâu?','¿Dónde deben ir los Impulsartikel (artículos de impulso, p. ej. chicles)?','Onde devem ficar os Impulsartikel (artigos de impulso, p. ex. pastilhas)?','Куди слід ставити Impulsartikel (імпульсні товари, напр. жуйку)?','Impulsartikel (ንኣብነት ማስቲካ) ኣበይ ይቕመጡ?','Куда ставить Impulsartikel (импульсные товары, напр. жвачку)?','أين توضع Impulsartikel (سلع الاندفاع، مثل العلكة)؟','Impulsartikel (ani alım ürünleri, ör. sakız) nereye konur?'],
'a3.h':['Làm mẫu: Đánh giá một khu vực','Ejemplo resuelto: valorar una zona','Exemplo resolvido: avaliar uma zona','Приклад: оцінити зону','ኣብነት: ሓንቲ ዞና ምግምጋም','Образец: оценить зону','مثال محلول: تقييم منطقة','Örnek: Bir bölgeyi değerlendirmek'],
'a3.i':['Xem sơ đồ mặt bằng. Mũi tên nét đứt chỉ đường đi của khách. Đọc ví dụ cho Zone B (khu B) và trả lời câu hỏi.','Mira el plano. La flecha discontinua muestra el recorrido de los clientes. Lee el ejemplo de la Zone B (zona B) y responde.','Vê a planta. A seta tracejada mostra o percurso dos clientes. Lê o exemplo da Zone B (zona B) e responde.','Подивись на план. Пунктирна стрілка показує рух клієнтів. Прочитай приклад для Zone B (зона B) і дай відповідь.','ነቲ ካርታ ርአ። ዝተቖራረጸ ምልክት መገዲ ዓሚላት የርኢ። ኣብነት ንZone B ኣንብብን ንሕቶ መልስን።','Посмотри на план. Пунктирная стрелка показывает движение клиентов. Прочитай пример для Zone B (зона B) и ответь.','انظر إلى المخطط. السهم المتقطع يبيّن مسار الزبائن. اقرأ مثال Zone B (المنطقة B) وأجب.','Plana bak. Kesikli ok müşteri akışını gösterir. Zone B (B bölgesi) örneğini oku ve soruyu cevapla.'],
'a3.t':['Khu nằm ở đâu so với mũi tên? Khách có nhìn về phía đó không?','¿Dónde está la zona respecto a la flecha? ¿Miran los clientes hacia allí?','Onde fica a zona em relação à seta? Os clientes olham para lá?','Де зона відносно стрілки? Чи дивляться клієнти туди?','እታ ዞና ብምልክት ኣበይ ትርከብ? ዓሚላት ናብኣ ይጥምቱ ዶ?','Где зона относительно стрелки? Смотрят ли клиенты туда?','أين تقع المنطقة بالنسبة للسهم؟ هل ينظر الزبائن إليها؟','Bölge oka göre nerede? Müşteriler oraya bakıyor mu?'],
'a3.e':['Zone B nằm ở tường bên phải, ngay trên đường chính sau lối vào. Khách nhìn sang phải. Vì vậy khu này verkaufsstark.','La Zone B está en la pared derecha, junto al recorrido principal tras la entrada. Los clientes miran a la derecha. Por eso es verkaufsstark.','A Zone B está na parede direita, junto ao percurso principal depois da entrada. Os clientes olham para a direita. Por isso é verkaufsstark.','Zone B біля правої стіни, просто на головному маршруті після входу. Клієнти дивляться праворуч. Тому вона verkaufsstark.','Zone B ኣብ የማናይ ግድግዳ ጥቓ ቀንዲ መገዲ ድሕሪ መእተዊ እያ። ዓሚላት ናብ የማን ይጥምቱ። ስለዚ verkaufsstark እያ።','Zone B у правой стены, прямо на главном пути после входа. Клиенты смотрят направо. Поэтому она verkaufsstark.','Zone B عند الجدار الأيمن، مباشرة على المسار الرئيسي بعد المدخل. الزبائن ينظرون يمينًا. لذلك هي verkaufsstark.','Zone B sağ duvarda, girişten sonra ana yolun hemen yanındadır. Müşteriler sağa bakar. Bu yüzden verkaufsstark’tır.'],
'a4.h':['Bài tập có hướng dẫn: Tất cả các khu trong sơ đồ','Ejercicio guiado: todas las zonas del plano','Exercício guiado: todas as zonas da planta','Керована вправа: усі зони на плані','ምምሕዳር ልምምድ: ኩሎም ዞናት ኣብ ካርታ','Упражнение с подсказкой: все зоны на плане','تمرين موجَّه: كل المناطق في المخطط','Rehberli alıştırma: Plandaki tüm bölgeler'],
'a4.i':['Đánh giá các khu còn lại trong sơ đồ: mạnh hay yếu? Rồi chọn lý do phù hợp cho từng khu.','Valora las demás zonas del plano: ¿fuertes o débiles? Luego elige el motivo adecuado para cada zona.','Avalia as restantes zonas da planta: fortes ou fracas? Depois escolhe o motivo adequado para cada zona.','Оціни решту зон на плані: сильні чи слабкі? Потім обери відповідне обґрунтування для кожної.','ነተን ካልኦት ዞናት ኣብ ካርታ ገምግም: ጽኑዓት ድዩ ድኹማት? ድሕሪኡ ንነፍሲ ወከፍ ዞና ዝግባእ ምኽንያት ምረጽ።','Оцени остальные зоны на плане: сильные или слабые? Потом выбери подходящее обоснование для каждой.','قيّم باقي المناطق في المخطط: قوية أم ضعيفة؟ ثم اختر السبب المناسب لكل منطقة.','Plandaki diğer bölgeleri değerlendir: güçlü mü zayıf mı? Sonra her bölge için uygun gerekçeyi seç.'],
'a4.t':['Nhìn mũi tên: bên phải = mạnh. Góc, lối vào, phía sau và bên trái = yếu. Đầu kệ, tường ngay trước mặt và quầy thu ngân = mạnh.','Mira la flecha: a la derecha = fuerte. Rincones, entrada, fondo e izquierda = débil. Cabeceras de góndola, pared frontal y caja = fuerte.','Olha para a seta: à direita = forte. Cantos, entrada, fundo e esquerda = fraco. Cabeceiras de gôndola, parede de frente e caixa = forte.','Дивись на стрілку: праворуч = сильна. Кути, вхід, глибина й ліворуч = слабка. Торці гондол, стіна прямо й каса = сильна.','ነቲ ምልክት ርአ: የማን = ጽኑዕ። ኩርናዓት፣ መእተዊ፣ ድሕሪትን ጸጋምን = ድኹም። ርእሲ ጎንዶላ፣ ግድግዳ ቅድሚ ዓሚልን ካሳን = ጽኑዕ።','Смотри на стрелку: справа = сильная. Углы, вход, глубина и слева = слабая. Торцы гондол, стена прямо и касса = сильная.','انظر إلى السهم: اليمين = قوية. الزوايا والمدخل والخلف واليسار = ضعيفة. رأس الجندول والجدار المواجه والصندوق = قوية.','Oka bak: sağ = güçlü. Köşeler, giriş, arka ve sol = zayıf. Gondol başı, karşıdaki duvar ve kasa = güçlü.'],
'a4.e':['Mạnh: đầu kệ (C), tường đối diện (E), khu quầy thu ngân (H). Yếu: lối vào (A), lối giữa (D), góc (F), bên trái đường đi (G), sau quầy thu ngân (I).','Fuertes: cabecera (C), pared frontal (E), zona de cajas (H). Débiles: entrada (A), pasillo central (D), rincón (F), izquierda del camino (G), tras la caja (I).','Fortes: cabeceira (C), parede de frente (E), zona de caixas (H). Fracas: entrada (A), corredor central (D), canto (F), esquerda do caminho (G), atrás da caixa (I).','Сильні: торець (C), стіна прямо (E), зона кас (H). Слабкі: вхід (A), середній прохід (D), кут (F), ліворуч від шляху (G), за касою (I).','ጽኑዓት: ርእሲ ጎንዶላ (C)፣ ግድግዳ (E)፣ ዞና ካሳ (H)። ድኹማት: መእተዊ (A)፣ ማእከላይ መገዲ (D)፣ ኩርናዕ (F)፣ ጸጋም (G)፣ ድሕሪ ካሳ (I)።','Сильные: торец (C), стена прямо (E), зона касс (H). Слабые: вход (A), средний проход (D), угол (F), слева от пути (G), за кассой (I).','القوية: رأس الجندول (C)، الجدار المواجه (E)، منطقة الصناديق (H). الضعيفة: المدخل (A)، الممر الأوسط (D)، الزاوية (F)، يسار المسار (G)، خلف الصندوق (I).','Güçlü: gondol başı (C), karşı duvar (E), kasa bölgesi (H). Zayıf: giriş (A), orta koridor (D), köşe (F), yolun solu (G), kasa arkası (I).'],

'a4.2.q':['4.2 Lý do nào phù hợp?','4.2 ¿Qué motivo encaja?','4.2 Que motivo combina?','4.2 Яке обґрунтування пасує?','4.2 ኣየናይ ምኽንያት ይሰማማዕ?','4.2 Какое обоснование подходит?','4.2 أي سبب يناسب؟','4.2 Hangi gerekçe uyar?'],
'a5.h':['Bài tập có hướng dẫn: Mặt hàng nào đặt ở đâu?','Ejercicio guiado: ¿qué artículo dónde?','Exercício guiado: que artigo onde?','Керована вправа: який товар куди?','ምምሕዳር ልምምድ: ኣየናይ ኣቕሓ ኣበይ?','Упражнение с подсказкой: какой товар куда?','تمرين موجَّه: أي سلعة أين؟','Rehberli alıştırma: Hangi ürün nereye?'],
'a5.i':['Mấy dòng đầu sát đề thi nhất. Với mỗi món hàng, chọn khu bán hàng và lý do.','Las primeras filas se parecen mucho al examen. Elige para cada artículo la zona y el motivo.','As primeiras linhas são muito próximas do exame. Escolhe para cada artigo a zona e o motivo.','Перші рядки найближчі до іспиту. Для кожного товару обери зону продажу й обґрунтування.','ቀዳሞት መስመራት ብዙሕ ምስ ፈተና ይቀራረቡ። ንነፍሲ ወከፍ ኣቕሓ ዞናን ምኽንያትን ምረጽ።','Первые строки очень близки к экзамену. Для каждого товара выбери зону продаж и обоснование.','الأسطر الأولى قريبة جدًا من الامتحان. اختر لكل سلعة منطقة البيع والسبب.','İlk satırlar sınava çok yakındır. Her ürün için satış bölgesini ve gerekçeyi seç.'],
'a5.t':['Tự hỏi: Mua bốc đồng, tìm có chủ đích, để thu hút khách, nhỏ và đắt, hay hàng mới?','Pregúntate: ¿compra por impulso, búsqueda dirigida, atraer clientes, pequeño y caro o novedad?','Pergunta-te: compra por impulso, procura dirigida, atrair clientes, pequeno e caro ou novidade?','Запитай себе: імпульсна покупка, цілеспрямований пошук, привабити клієнтів, малий і дорогий чи новинка?','ባዕልኻ ሕተት: ብቅጽበታዊ ምግዛእ፣ ዝተመደበ ምድላይ፣ ዓሚላት ምስሓብ፣ ንእሽቶን ክቡርን ወይ ሓድሽ?','Спроси себя: импульсная покупка, целенаправленный поиск, привлечь клиентов, маленький и дорогой или новинка?','اسأل نفسك: شراء اندفاعي، بحث مقصود، جذب الزبائن، صغير وغالٍ، أم جديد؟','Kendine sor: Ani alım, hedefli arama, müşteri çekme, küçük ve pahalı mı yoksa yenilik mi?'],
'a5.e':['Impulsartikel: gần quầy thu ngân. Suchartikel: phía sau/lối giữa. Magnet: khu yếu. Hàng dễ mất cắp: quầy thu ngân hoặc tủ khóa gần nhân viên. Hàng mới: lối vào/bên phải. Hàng khuyến mãi: khu hoạt động.','Impulso: caja. Suchartikel: fondo/pasillo central. Imán: zona débil. Riesgo de robo: caja o vitrina junto al personal. Novedad: entrada/derecha. Oferta: zona de acción.','Impulso: caixa. Suchartikel: fundo/corredor central. Íman: zona fraca. Risco de furto: caixa ou vitrina junto ao pessoal. Novidade: entrada/direita. Promoção: zona de ação.','Імпульсні: каса. Suchartikel: глибина/середній прохід. Магніт: слабка зона. Ризик крадіжки: каса чи вітрина біля персоналу. Новинка: вхід/праворуч. Акція: акційна зона.','Impulsartikel: ካሳ። Suchartikel: ድሕሪት/ማእከላይ። Magnet: ድኹም ዞና። ዝስረቑ: ካሳ ወይ ቫትሪን ጥቓ ሰራሕተኛ። ሓድሽ: መእተዊ/የማን። ፍሉይ ቅናሽ: ዞና ተግባር።','Импульсные: касса. Suchartikel: глубина/средний проход. Магнит: слабая зона. Риск кражи: касса или витрина рядом с персоналом. Новинка: вход/справа. Акция: акционная зона.','Impulsartikel: الصندوق. Suchartikel: الخلف/الممر الأوسط. Magnet: منطقة ضعيفة. معرّض للسرقة: الصندوق أو خزانة قرب الموظفين. جديد: المدخل/اليمين. عرض: منطقة عروض.','Impulsartikel: kasa. Suchartikel: arka/orta koridor. Magnet: zayıf bölge. Hırsızlık riski: kasa veya personele yakın vitrin. Yenilik: giriş/sağ. Kampanya: aksiyon alanı.'],

'a6.h':['Bài tập tự do: Làm đẹp và tận dụng các khu vực','Ejercicio libre: revalorizar y aprovechar zonas','Exercício livre: valorizar e aproveitar zonas','Вільна вправа: покращити й використати зони','ናጻ ልምምድ: ዞናት ምሕሻልን ምጥቃምን','Свободное упражнение: улучшить и использовать зоны','تمرين حر: رفع قيمة المناطق واستغلالها','Serbest alıştırma: Bölgeleri iyileştir ve kullan'],
'a6.i':['Trả lời các câu hỏi bằng từ khóa hoặc câu ngắn.','Responde las preguntas con palabras clave o frases cortas.','Responde às perguntas com palavras-chave ou frases curtas.','Відповідай на запитання ключовими словами або короткими реченнями.','ነቶም ሕቶታት ብቃላት ወይ ብሓጸርቲ ሓረጋት መልስ።','Отвечай на вопросы ключевыми словами или короткими предложениями.','أجب عن الأسئلة بكلمات مفتاحية أو جمل قصيرة.','Soruları anahtar kelimelerle veya kısa cümlelerle cevapla.'],
'a6.t':['Nhớ: Khu yếu cần có lý do để khách đến. Khu mạnh được nhiều khách nhìn thấy.','Recuerda: las zonas débiles necesitan un motivo para que los clientes vayan. Las zonas fuertes las ven muchos clientes.','Lembra: as zonas fracas precisam de um motivo para os clientes irem. As zonas fortes são vistas por muitos clientes.','Пам’ятай: слабким зонам потрібна причина, щоб клієнти туди йшли. Сильні зони бачать багато клієнтів.','ዘክር: ድኹማት ዞናት ዓሚላት ናብኣተን ክኸዱ ምኽንያት የድልየን። ጽኑዓት ዞናት ብዙሓት ዓሚላት የርእዩ።','Помни: слабым зонам нужна причина, чтобы клиенты туда шли. Сильные зоны видят многие клиенты.','تذكّر: المناطق الضعيفة تحتاج سببًا ليذهب الزبائن إليها. المناطق القوية يراها كثيرون.','Unutma: Zayıf bölgelerin müşteriyi çekmek için bir nedene ihtiyacı var. Güçlü bölgeleri çok müşteri görür.'],
'a6.e':['Làm đẹp: hàng khuyến mãi, nếm thử, hàng tìm kiếm, display, trang trí, ánh sáng. Eigenmarken (nhãn riêng): khu yếu = tìm có chủ đích, khu mạnh = nhiều người thấy.','Revalorizar: ofertas, degustaciones, artículos de búsqueda, displays, decoración, luz. Eigenmarken (marcas propias): zona débil = búsqueda dirigida, zona fuerte = muchos la ven.','Valorizar: promoções, degustações, artigos de procura, displays, decoração, luz. Eigenmarken (marcas próprias): zona fraca = procura dirigida, zona forte = muitos veem.','Покращити: акційні товари, дегустації, товари пошуку, дисплеї, декор, світло. Eigenmarken (власні марки): слабка зона = цілеспрямований пошук, сильна = багато бачать.','ምሕሻል: ፍሉይ ቅናሽ፣ ምጥዕማይ፣ ዝድለዩ ኣቕሑት፣ ዲስፕሌይ፣ ድኮር፣ ብርሃን። Eigenmarken: ድኹም ዞና = ዝተመደበ ምድላይ፣ ጽኑዕ ዞና = ብዙሓት የርእዩ።','Улучшить: акции, дегустации, товары поиска, дисплеи, декор, свет. Eigenmarken (собственные марки): слабая зона = целенаправленный поиск, сильная = многие видят.','رفع القيمة: عروض، تذوّق، سلع بحث، عروض عرض، ديكور، إضاءة. Eigenmarken (علامات خاصة): منطقة ضعيفة = بحث مقصود، منطقة قوية = يراها كثيرون.','İyileştirme: kampanyalar, tadım, arama ürünleri, display, dekor, ışık. Eigenmarken (özel markalar): zayıf bölge = hedefli arama, güçlü bölge = çok kişi görür.'],
'a6.1.q':['6.1 Lối giữa thường là khu bán yếu. Kể 3 biện pháp làm cho chúng hấp dẫn hơn! (3 điểm)','6.1 Los pasillos centrales suelen ser zonas débiles. ¡Nombre 3 medidas para revalorizarlos! (3 puntos)','6.1 Os corredores centrais costumam ser zonas fracas. Nomeie 3 medidas para os valorizar! (3 pontos)','6.1 Середні проходи зазвичай — слабкі зони. Назвіть 3 заходи, щоб їх покращити! (3 бали)','6.1 ማእከላይ መገድታት ብዙሕ ግዜ ድኹማት ዞናት እዮም። ንምሕሻሎም ሰለስተ ተግባራት ጥቀስ! (3 ነጥቢ)','6.1 Средние проходы обычно — слабые зоны. Назовите 3 меры, чтобы улучшить их! (3 балла)','6.1 الممرات الوسطى غالبًا مناطق ضعيفة. اذكر 3 إجراءات لرفع قيمتها! (3 نقاط)','6.1 Orta koridorlar genelde zayıf bölgelerdir. Bunları iyileştirmek için 3 önlem say! (3 puan)'],
'a6.2.q':['6.2 Em phụ trách đặt Handelsmarken (nhãn riêng). Khách phải thấy chúng ở cả khu yếu lẫn khu mạnh. Giải thích mỗi trường hợp tại sao hợp lý! (4 điểm)','6.2 Eres responsable de colocar las Handelsmarken (marcas propias). Los clientes deben encontrarlas en zonas débiles y fuertes. ¡Justifique por qué es útil en cada caso! (4 puntos)','6.2 És responsável pela colocação das Handelsmarken (marcas próprias). Os clientes devem encontrá-las em zonas fracas e fortes. Justifique porque é útil em cada caso! (4 pontos)','6.2 Ви відповідаєте за розміщення Handelsmarken (власних марок). Клієнти мають знаходити їх і в слабких, і в сильних зонах. Обґрунтуйте, чому це доцільно в кожному випадку! (4 бали)','6.2 ንምቕማጥ Handelsmarken (ናይ ባዕል ምልክት) ሓላፊ ኢኻ። ዓሚላት ኣብ ድኹማትን ጽኑዓትን ዞናት ክረኽብዎም ኣለዎም። ንነፍሲ ወከፍ ስለምንታይ ከም ዝግባእ ኣረጋግጽ! (4 ነጥቢ)','6.2 Вы отвечаете за размещение Handelsmarken (собственных марок). Клиенты должны находить их и в слабых, и в сильных зонах. Обоснуйте, почему это разумно в каждом случае! (4 балла)','6.2 أنت مسؤول عن وضع Handelsmarken (العلامات الخاصة). يجب أن يجدها الزبائن في المناطق الضعيفة والقوية. علّل لماذا هذا منطقي في كل حالة! (4 نقاط)','6.2 Handelsmarken’in (özel markalar) yerleşiminden sorumlusun. Müşteriler bunları hem zayıf hem güçlü bölgelerde bulmalı. Her durumda neden mantıklı olduğunu gerekçelendir! (4 puan)'],
'a6.3.q':['6.3 Khi đặt hàng, em cũng chú ý khu vực lối vào. Kể 2 lý do! (4 điểm)','6.3 Al colocar la mercancía también tienes en cuenta la zona de entrada. ¡Nombre 2 motivos! (4 puntos)','6.3 Ao colocar a mercadoria também tens em conta a zona de entrada. Nomeie 2 motivos! (4 pontos)','6.3 Розміщуючи товар, ви враховуєте й зону входу. Назвіть 2 причини! (4 бали)','6.3 ኣብ ምቕማጥ ኣቕሑት ንመእተዊ ዞና’ውን ትጥምት። ክልተ ምኽንያታት ጥቀስ! (4 ነጥቢ)','6.3 При размещении товара вы учитываете и зону входа. Назовите 2 причины! (4 балла)','6.3 عند وضع البضائع تراعي أيضًا منطقة المدخل. اذكر سببين! (4 نقاط)','6.3 Mal yerleşiminde giriş bölgesine de dikkat edersin. 2 neden say! (4 puan)'],
'a7.t':['Zonen: quyết định + lý do từ hành vi khách. Maßnahmen (biện pháp): nêu ý tưởng cụ thể.','Zonas: decisión + motivo del comportamiento del cliente. Maßnahmen (medidas): ideas concretas.','Zonas: decisão + motivo do comportamento do cliente. Maßnahmen (medidas): ideias concretas.','Зони: рішення + причина з поведінки клієнтів. Maßnahmen (заходи): конкретні ідеї.','ዞናት: ውሳኔ + ምኽንያት ካብ ባህርይ ዓሚል። Maßnahmen (ተግባራት): ጭቡጥ ሓሳባት።','Зоны: решение + причина из поведения клиентов. Maßnahmen (меры): конкретные идеи.','المناطق: القرار + السبب من سلوك الزبائن. Maßnahmen (إجراءات): أفكار محددة.','Bölgeler: karar + müşteri davranışından neden. Maßnahmen (önlemler): somut fikirler.'],
'a7.e':['Ở 7.3 phải là biện pháp khác với 7.2.','En 7.3 deben ser medidas distintas a las de 7.2.','Em 7.3 têm de ser medidas diferentes das de 7.2.','У 7.3 мають бути інші заходи, ніж у 7.2.','ኣብ 7.3 ካብ 7.2 ዝፈልዩ ተግባራት ክኾኑ ኣለዎም።','В 7.3 меры должны отличаться от 7.2.','في 7.3 يجب أن تكون إجراءات مختلفة عن 7.2.','7.3’te önlemler 7.2’dekilerden farklı olmalı.'],
'a7.1.q':['7.1 Đánh giá bốn khu (không phải B): mạnh hay yếu? (4 điểm)','7.1 Valore cuatro zonas (no la B): ¿fuertes o débiles? (4 puntos)','7.1 Avalie quatro zonas (não a B): fortes ou fracas? (4 pontos)','7.1 Оцініть чотири зони (не B): сильні чи слабкі? (4 бали)','7.1 ኣርባዕተ ዞናት (B ዘይኮነ) ገምግም: ጽኑዓት ድዩ ድኹማት? (4 ነጥቢ)','7.1 Оцените четыре зоны (не B): сильные или слабые? (4 балла)','7.1 قيّم أربع مناطق (ليس B): قوية أم ضعيفة؟ (4 نقاط)','7.1 Dört bölgeyi (B hariç) değerlendir: güçlü mü zayıf mı? (4 puan)'],
'a7.1b.q':['7.1 Lý do nào phù hợp? (4 điểm)','7.1 ¿Qué motivo encaja? (4 puntos)','7.1 Que motivo combina? (4 pontos)','7.1 Яке обґрунтування пасує? (4 бали)','7.1 ኣየናይ ምኽንያት ይሰማማዕ? (4 ነጥቢ)','7.1 Какое обоснование подходит? (4 балла)','7.1 أي سبب يناسب؟ (4 نقاط)','7.1 Hangi gerekçe uyar? (4 puan)'],
'a7.2.q':['7.2 Nghiên cứu dòng đi của khách (Kundenlaufstudie) tại Warenhaus Seeblick GmbH cho thấy các khu yếu. Đề xuất 3 biện pháp làm đẹp chúng! (3 điểm)','7.2 Un estudio de recorrido de clientes (Kundenlaufstudie) en Warenhaus Seeblick GmbH muestra zonas débiles. ¡Proponga 3 medidas para revalorizarlas! (3 puntos)','7.2 Um estudo de percurso de clientes (Kundenlaufstudie) no Warenhaus Seeblick GmbH mostra zonas fracas. Proponha 3 medidas para as valorizar! (3 pontos)','7.2 Дослідження руху клієнтів (Kundenlaufstudie) у Warenhaus Seeblick GmbH показує слабкі зони. Запропонуйте 3 заходи, щоб їх покращити! (3 бали)','7.2 መጽናዕቲ መገዲ ዓሚላት (Kundenlaufstudie) ኣብ Warenhaus Seeblick GmbH ድኹማት ዞናት የርኢ። ንምሕሻሎም ሰለስተ ተግባራት ሓሳብ ሃብ! (3 ነጥቢ)','7.2 Исследование движения клиентов (Kundenlaufstudie) в Warenhaus Seeblick GmbH показывает слабые зоны. Предложите 3 меры, чтобы их улучшить! (3 балла)','7.2 تُظهر دراسة حركة الزبائن (Kundenlaufstudie) في Warenhaus Seeblick GmbH مناطق ضعيفة. اقترح 3 إجراءات لرفع قيمتها! (3 نقاط)','7.2 Warenhaus Seeblick GmbH’deki müşteri akışı çalışması (Kundenlaufstudie) zayıf bölgeleri gösteriyor. Bunları iyileştirmek için 3 önlem öner! (3 puan)'],
'a7.3.q':['7.3 Đề xuất thêm 2 biện pháp khác để làm đẹp khu bán yếu – khác với 7.2! (2 điểm)','7.3 ¡Proponga 2 medidas más para revalorizar zonas débiles, distintas a las de 7.2! (2 puntos)','7.3 Proponha mais 2 medidas para valorizar zonas fracas, diferentes das de 7.2! (2 pontos)','7.3 Запропонуйте ще 2 заходи для покращення слабких зон — інші, ніж у 7.2! (2 бали)','7.3 ተወሳኺ ክልተ ተግባራት ንምሕሻል ድኹማት ዞናት ሓሳብ ሃብ — ካብ 7.2 ዝፈልዩ! (2 ነጥቢ)','7.3 Предложите ещё 2 меры для улучшения слабых зон — других, чем в 7.2! (2 балла)','7.3 اقترح إجراءين آخرين لرفع قيمة المناطق الضعيفة – غير الواردة في 7.2! (نقطتان)','7.3 Zayıf bölgeleri iyileştirmek için 2 önlem daha öner – 7.2’dekilerden farklı! (2 puan)'],
'a8.t':['8.1: Khách đi nhanh thế nào ở lối vào? 8.2: Nhìn khách và người bán, rồi tìm giải pháp dung hòa.','8.1: ¿Qué tan rápido pasan los clientes en la entrada? 8.2: Mira a clientes y comerciante y busca un compromiso.','8.1: Quão depressa passam os clientes na entrada? 8.2: Olha para clientes e comerciante e procura um compromisso.','8.1: Як швидко йдуть клієнти біля входу? 8.2: Подивись на клієнтів і торговця, потім знайди компроміс.','8.1: ዓሚላት ኣብ መእተዊ ክንደይ ቀልጢፎም ይኸዱ? 8.2: ንዓሚላትን ንነጋዳይን ርአ፣ ድሕሪኡ ሓደ ስምምዕ ድለ።','8.1: Как быстро идут клиенты у входа? 8.2: Посмотри на клиентов и торговца, потом найди компромисс.','8.1: ما سرعة سير الزبائن عند المدخل؟ 8.2: انظر إلى الزبائن والتاجر ثم ابحث عن حل وسط.','8.1: Müşteriler girişte ne kadar hızlı yürür? 8.2: Müşterilere ve satıcıya bak, sonra bir uzlaşma bul.'],
'a8.e':['Một nhận định tốt nêu cả hai phía và đưa ra đề xuất có ích cho cả hai.','Un buen juicio nombra ambos lados y hace una propuesta que ayude a ambos.','Um bom juízo nomeia os dois lados e faz uma proposta que ajude ambos.','Хороша оцінка називає обидві сторони й пропонує те, що допомагає обом.','ጽቡቕ ፍርዲ ክልተ ወገናት ይጥቅስን ንክልቲኦም ዝሕግዝ ሓሳብ ይህብን።','Хорошая оценка называет обе стороны и предлагает то, что помогает обеим.','الحكم الجيد يذكر الجانبين ويقترح ما يفيدهما معًا.','İyi bir değerlendirme iki tarafı söyler ve ikisine de yarayan bir öneri sunar.'],
'a8.1.q':['8.1 Ở lối vào thường có hàng khuyến mãi và hàng mới – nhưng vẫn bị coi là khu bán yếu. Giải thích mâu thuẫn này và cách người bán xử lý.','8.1 En la entrada suele haber ofertas y novedades, pero se considera zona débil. Explica esta contradicción y cómo la tratan los comerciantes.','8.1 À entrada há muitas vezes promoções e novidades, mas é considerada zona fraca. Explica esta contradição e como os comerciantes lidam com ela.','8.1 Біля входу часто стоять акційні товари й новинки, але зону вважають слабкою. Поясни цю суперечність і те, як торговці з цим працюють.','8.1 ኣብ መእተዊ ብዙሕ ግዜ ፍሉይ ቅናሽን ሓደስቲ ኣቕሑትን ይቕመጡ፣ ግን ድኹም ዞና ይቑጸር። ነዚ ጽልዋ ግለጽ፣ ነጋዶ ከመይ ከም ዝሕዝዎ ከኣ ግለጽ።','8.1 У входа часто стоят акционные товары и новинки, но зона считается слабой. Объясни это противоречие и как с ним работают торговцы.','8.1 غالبًا توجد عروض وسلع جديدة عند المدخل، ومع ذلك تُعدّ منطقة ضعيفة. اشرح هذا التناقض وكيف يتعامل التجار معه.','8.1 Girişte çoğu zaman kampanya ve yenilik ürünleri durur, yine de zayıf bölge sayılır. Bu çelişkiyi ve satıcıların bununla nasıl başa çıktığını açıkla.'],
'a8.2.q':['8.2 „Sữa và bánh mì ở tít phía sau – thật chống lại khách hàng!“ Đánh giá câu này từ góc nhìn của khách và người bán và đề xuất một giải pháp dung hòa.','8.2 «Leche y pan al fondo del todo: ¡es hostil al cliente!» Valora esta afirmación desde la perspectiva de clientes y comerciante y propón un compromiso.','8.2 «Leite e pão lá ao fundo: é hostil ao cliente!» Avalia esta afirmação do ponto de vista dos clientes e do comerciante e propõe um compromisso.','8.2 «Молоко й хліб аж ззаду — це недружньо до клієнтів!» Оціни це твердження з погляду клієнтів і торговця й запропонуй компроміс.','8.2 «ሓሊብን እንጀራን ኣብ መወዳእታ — ንዓሚላት ኣይጥዕምን እዩ!» እዚ ርእይቶ ካብ ኣረኣእያ ዓሚላትን ነጋዳይን ገምግምን ስምምዕ ሓሳብ ሃብን።','8.2 «Молоко и хлеб в самом конце — это недружелюбно к клиентам!» Оцени это утверждение с точки зрения клиентов и торговца и предложи компромисс.','8.2 «الحليب والخبز في أقصى الخلف – هذا ضد الزبائن!» قيّم هذه العبارة من منظور الزبائن والتاجر واقترح حلًّا وسطًا.','8.2 «Süt ve ekmek en arkada – bu müşteri düşmanlığı!» Bu ifadeyi müşteri ve satıcı açısından değerlendir ve bir uzlaşma öner.'],
'v1.1.q':['V1 Tại sao khu bên phải đường chính lại verkaufsstark (bán mạnh)?','V1 ¿Por qué una zona a la derecha del recorrido principal es verkaufsstark (fuerte)?','V1 Porque é que uma zona à direita do percurso principal é verkaufsstark (forte)?','V1 Чому зона праворуч від головного маршруту verkaufsstark (сильна)?','V1 ስለምንታይ ዞና ኣብ የማን ቀንዲ መገዲ verkaufsstark እያ?','V1 Почему зона справа от главного пути verkaufsstark (сильная)?','V1 لماذا تكون المنطقة يمين المسار الرئيسي verkaufsstark (قوية)؟','V1 Ana yolun sağındaki bölge neden verkaufsstark’tır (güçlü)?'],
'v1.2.q':['V2 Giải thích: Tại sao Suchartikel như sữa thường đặt rất sâu bên trong còn Magnetartikel đặt ở khu yếu?','V2 Justifica: ¿por qué los Suchartikel como la leche suelen ir al fondo y los Magnetartikel en zonas débiles?','V2 Justifica: porque é que os Suchartikel como o leite costumam ir ao fundo e os Magnetartikel em zonas fracas?','V2 Обґрунтуй: чому Suchartikel, як-от молоко, часто ставлять далеко позаду, а Magnetartikel — у слабких зонах?','V2 ኣረጋግጽ: ስለምንታይ Suchartikel ከም ሓሊብ ብዙሕ ግዜ ድሕሪት፣ Magnetartikel ድማ ኣብ ድኹማት ዞናት ይቕመጡ?','V2 Обоснуй: почему Suchartikel вроде молока часто ставят далеко позади, а Magnetartikel — в слабых зонах?','V2 علّل: لماذا توضع Suchartikel مثل الحليب غالبًا في الخلف وMagnetartikel في المناطق الضعيفة؟','V2 Gerekçelendir: Süt gibi Suchartikel neden çoğunlukla arkaya, Magnetartikel ise zayıf bölgelere konur?'],

 var q=p===100&&!S.pdone;if(q){S.pdone=1;toast('🎉 100 %')}}

   h+='<div class="q">'+esc(UI.selfq[0])+'</div>'+tl_ui('selfq')+'<div class="row2">'+[['selfyes',2],['selfpart',1],['selfno',0]].map(function(p){return '<button class="btn gray" style="'+(v.s===p[1]&&v.s!=null?'background:#e3f0f6;border-color:#2f6f8f':'')+'" data-act="self" data-id="'+it.id+'" data-i="'+p[1]+'">'+B(p[0])+'</button>'}).join('')+'</div>'}
  break;

 case 'calc':
  g=grade(it);h=q+'<div class="row2"><input class="in" style="max-width:12rem" inputmode="decimal" autocomplete="off" data-act="calc" data-id="'+it.id+'" value="'+esc(v||'')+'"><b>'+esc(it.unit||'')+'</b></div>';
  if(fb){var trap='';if(!g.got&&it.traps){var nv=num(v==null?'':v);it.traps.forEach(function(t){if(nv!=null&&Math.abs(nv-t[0])<=0.006)trap='<div>⚠ '+esc(t[1])+'</div>'+tl(it.id+'.w')})}h+=fbBox(g.got?'ok':'no',(g.got?esc(U('right')):esc(U('wrong'))+' '+esc(UI.correctis[0])+' <b>'+r1(it.a)+' '+esc(it.unit||'')+'</b>')+trap+'<div><b>'+esc(UI.steps[0])+':</b><br>'+it.steps.map(esc).join('<br>')+'</div>'+tl_ui('steps'))}
  break;
 case 'table':
  g=grade(it);h=q+'<table class="tbl"><tr><th>'+(it.hd||'')+'</th>'+it.cols.map(function(c){return '<th class="c" title="'+esc(c[1]||'')+'">'+esc(c[0])+'</th>'}).join('')+'</tr>'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+'</td>'+it.cols.map(function(c,j){var cl=sel===j?' on':'';if(fb){if(j===r[1])cl+=sel===j?' ok':' sol';else if(sel===j)cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tb" data-id="'+it.id+'" data-r="'+i+'" data-i="'+j+'" aria-label="'+esc(c[1]||c[0])+'">'+esc(c[0])+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(it.legend)h+='<div class="meta">'+esc(it.legend)+'</div>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'tf':
  g=grade(it);h=q+'<table class="tbl">'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+'</td>'+[[true,'✔'],[false,'✘']].map(function(c){var cl=sel===c[0]?' on':'';if(fb){if(c[0]===r[1])cl+=sel===c[0]?' ok':' sol';else if(sel===c[0])cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tf" data-id="'+it.id+'" data-r="'+i+'" data-i="'+(c[0]?1:0)+'">'+c[1]+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'sel':
  g=grade(it);h=q+'<table class="tbl selt">'+it.rows.map(function(r,i){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';
   return '<tr><td>'+esc(r[0])+'</td><td><select class="in gapsel'+cl+'" data-act="sel" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.o.map(function(o,j){return '<option value="'+j+'"'+(sel===j?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'+(fb&&!g.rows[i]?'<div class="meta">'+esc(UI.correctis[0])+' <b>'+esc(it.o[r[1]])+'</b></div>':'')+'</td></tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'gap':
  g=grade(it);var k=0;h=q+'<div class="gaptxt">'+it.text.split('___').map(function(p,i,arr){var s=esc(p);if(i<arr.length-1){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';s+='<select class="gapsel'+cl+'" data-act="gap" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.bank.map(function(o){return '<option'+(sel===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}return s}).join('')+'</div>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max+(g.got<g.max?' — '+esc(UI.correctis[0])+' <b>'+it.a.map(esc).join(' · ')+'</b>':''));
  break}
 if(fb&&it.ex&&it.t!=='free')h+='<div class="meta">'+esc(it.ex)+'</div>'+tl(it.id+'.e');
 return '<div class="item">'+h+'</div>'}
function tl_ui(k){if(S.lang==='de')return '';return '<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U(k))+'</div>'}
function renderEst(it){var v=A(it.id)||{};var t=totals();return '<div class="row2"><label>'+B('estl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="e" value="'+esc(v.e||'')+'"></div><div class="row2"><label>'+B('resl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="r" value="'+esc(v.r||'')+'"></div>'+(v.e&&v.r?'<div class="meta">'+esc(UI.diff[0])+': '+(Number(v.r)-Number(v.e))+'</div>':'')}
function renderRead(b){
 var mk=S.mk[b.id]||[],done=S.chk[b.id],idx=0,tot=0,hit=0,wrong=0;
 var paras=b.paras.map(function(p){return '<p>'+p.replace(/\[\[(.+?)\]\]([.,;:!?)]*)|\{\{(.+?)\}\}([.,;:!?)]*)|([^\s\[\{]+)/g,function(m,a,pa,d,pd,w){var i=idx++,sel=mk.indexOf(i)>=0,cl='';var good=a!=null;if(good)tot++;
   if(done){if(sel&&good){cl=' ok';hit++}else if(sel){cl=' no';wrong++}else if(good)cl=' miss'}else if(sel)cl=' on';
   return '<span class="w'+cl+'" data-act="mk" data-id="'+b.id+'" data-i="'+i+'">'+esc(a||d||w)+'</span>'+esc(pa||pd||'')+' '})+'</p>'}).join('');
 var h='<div class="card read"><h2>📖 '+esc(b.h)+'</h2>'+tl(b.hk||b.id+'.h')+'<div class="meta">'+esc(U('readhint'))+'</div>'+(b.sum?'<div class="meta"><b>→ </b>'+esc(b.sum)+'</div>'+tl(b.id+'.s'):'')+paras;
 if(b.html)h+=b.html;
 h+='<button class="btn" data-act="mkchk" data-id="'+b.id+'">'+B('mark')+'</button>';
 if(done){var all=b.paras.join(' ').match(/\[\[.+?\]\]/g)||[];h+=fbBox(wrong===0&&hit===all.length?'ok':'part','✔ '+hit+' / '+all.length+' '+esc(U('found'))+(wrong?' · ✘ '+wrong+' '+esc(U('toomany')):'')+(hit<all.length?'<br>'+esc(U('missed')):''))}
 if(b.q){var v=A(b.id+'.q');h+='<div class="q">'+esc(b.q.q)+'</div>'+tl(b.id+'.qq')+opts(b.q.o,v,(done&&v!=null)?function(i){return i===b.q.a?'ok':(v===i?'no':'')}:null,'mc',b.id+'.q')}
 return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});
 return h}
function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';
 SHEET.blocks.forEach(function(b){if(b.k==='read')h+=renderRead(b);else if(vis(b))h+=renderTask(b)});
 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';
 if(S.sub)h+=renderResult();
 document.getElementById('app').innerHTML=h;
 document.getElementById('report').innerHTML=renderReport();
 renderBar();updProg();pad();
 window.scrollTo(0,y)}
function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');
 document.documentElement.lang=S.lang;
 }
function pad(){var m=document.querySelector('main'),b=document.getElementById('bar');if(m&&b)m.style.paddingTop=(b.offsetHeight+14)+'px'}
window.addEventListener('resize',pad);
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function dialog(msgKey,onYes){var d=document.createElement('div');d.className='dlg';d.innerHTML='<div><p><b>'+esc(UI[msgKey][0])+'</b></p>'+(S.lang!=='de'?'<p>'+esc(U(msgKey))+'</p>':'')+'<button class="btn" data-d="y">'+B('yes')+'</button><button class="btn gray" data-d="n">'+B('cancel')+'</button></div>';d.addEventListener('click',function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-d');if(!x&&e.target!==d&&!e.target.closest('[data-d]'))return;var dd=e.target.closest('[data-d]');if(dd&&dd.getAttribute('data-d')==='y')onYes();d.remove()});document.body.appendChild(d)}
function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});
document.getElementById('gear').addEventListener('click',function(){S.open=!S.open;save();renderBar()});
document.addEventListener('change',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act');if(act==='gap'||act==='sel'){var arr=S.a[el.getAttribute('data-id')]||[];var v=el.value;arr[Number(el.getAttribute('data-r'))]=act==='sel'?(v===''?null:Number(v)):(v===''?null:v);S.a[el.getAttribute('data-id')]=arr;save();updProg()}});
document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
document.addEventListener('visibilitychange',saveNow);window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',function(){document.getElementById('report').innerHTML=renderReport()});
/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;
render();
if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};
window.__state=function(){return S};
})();
