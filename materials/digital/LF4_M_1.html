<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF 4 · Digitales Arbeitsblatt</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + .5rem) 1rem .4rem}
#bar .row{display:flex;align-items:center;gap:.6rem;max-width:56rem;margin:0 auto}
#bar .ttl{font-weight:700;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{height:.7rem;background:#e6e3da;border-radius:1rem;overflow:hidden;max-width:56rem;margin:.35rem auto 0}
#progf{height:100%;width:0;background:var(--pri);transition:width .4s}
#progt{font-size:.8rem;color:var(--mute);max-width:56rem;margin:.1rem auto 0}
#langs{display:flex;gap:.4rem;overflow-x:auto;max-width:56rem;margin:.35rem auto 0;padding-bottom:.15rem;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;min-height:44px;padding:0 .9rem;border:2px solid var(--line);background:#fff;border-radius:2rem;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;margin:0 0 1rem}
.card h2{font-size:1.25rem;margin:0 0 .4rem;line-height:1.3}
.card h2 .nr{display:inline-block;background:var(--pri);color:#fff;border-radius:.5rem;padding:0 .5rem;margin-right:.4rem;font-size:.95rem}
.vtag{display:inline-block;background:#6a3fa0;color:#fff;border-radius:.5rem;padding:0 .5rem;font-size:.85rem;margin-left:.3rem}
.card.v{border-color:#6a3fa0;background:#faf6ff}
.tr{font-size:.9rem;color:#4a5a66;background:#f1f6f9;border-left:4px solid #9cc3d5;border-radius:.4rem;padding:.3rem .6rem;margin:.3rem 0 .5rem;line-height:1.5}
.tr[dir=rtl]{border-left:0;border-right:4px solid #9cc3d5}
.tr[lang=ti]{font-family:"Kefa","Noto Sans Ethiopic",sans-serif}
.tr[lang=vi]{line-height:1.65}
small.b{display:block;font-size:.72rem;font-weight:400;opacity:.9;line-height:1.2}
.in{display:block;width:100%;min-height:48px;font:inherit;font-size:1rem;padding:.55rem .7rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink)}
input.in,select.in{font-size:1rem}
textarea.in{min-height:5.5rem;resize:vertical}
.btn{min-height:48px;padding:.4rem 1.1rem;border:0;border-radius:.8rem;background:var(--pri);color:#fff;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin:.3rem .4rem .3rem 0}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.gray{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.big{min-height:56px;font-size:1.1rem}
.btn:active,.pill:active,.opt:active,.ch:active{transform:scale(.97)}
.tipb{min-height:48px;min-width:48px;border-radius:2rem;border:2px solid var(--warn);background:var(--warnbg);font:inherit;font-size:1rem;cursor:pointer;padding:0 .9rem;float:right;margin:0 0 .3rem .5rem}
.tipbox{background:var(--warnbg);border:2px solid var(--warn);border-radius:.8rem;padding:.5rem .8rem;margin:.4rem 0}
.q{margin:.8rem 0 .2rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:.45rem;margin:.3rem 0}
.opt{min-height:48px;text-align:left;padding:.5rem .8rem;border:2px solid var(--line);background:#fff;border-radius:.8rem;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--pri);background:var(--pri2);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.tbl{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:1rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.4rem .3rem;text-align:left;vertical-align:middle}
.tbl.info th{background:#eef3f6}
.tbl.info td,.tbl.info th{border:1px solid var(--line);padding:.4rem .5rem}
.tbl td.c{text-align:center;white-space:nowrap}
.ch{min-width:48px;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:.7rem;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer;margin:2px}
.ch.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.sol{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
tr.rok td{background:var(--okbg)}tr.rno td{background:var(--badbg)}
.fb{border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0;font-size:1rem}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb.part{background:var(--warnbg);border:1px solid var(--warn)}
.sit{background:#eef3f6;border-left:5px solid var(--pri);border-radius:.5rem;padding:.5rem .8rem;margin:.5rem 0}
.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#23303a;color:#fff;padding:.6rem 1.1rem;border-radius:2rem;z-index:99;font-size:1rem;max-width:90%}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}
.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}
#set.open{display:block}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row2 label{font-weight:600;min-width:7rem}
.nowrap{white-space:nowrap}
#report{display:none}
@media (max-width:600px){main{padding-top:8.2rem}.card{padding:.8rem}h1{font-size:1.35rem}.tbl{font-size:.95rem}}
@media print{
 body{background:#fff;padding:0;font-size:11pt}
 #bar,#set,main,.toast,.dlg,.noprint{display:none!important}
 #report{display:block!important}
 #report h1{font-size:16pt}
 #report table{width:100%;border-collapse:collapse;font-size:10pt}
 #report td,#report th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

.tbl.selt td:first-child{width:55%}
.tbl.selt select.gapsel{width:100%;min-width:0}

</style>
</head>

{k:'read',id:'r1',h:'Zum Nachlesen: Wie ein Verkaufsraum gestaltet wird',sum:'Ein Laden verkauft nicht nur Ware, sondern auch ein Gefühl.',
 paras:['Die [[Verkaufsraumgestaltung]] hat drei Elemente: das [[Ladenumfeld]] (Gebäude, Fassade, Schaufenster, Eingang, Logo), die [[Verkaufsräume]] (Farben, Licht, Düfte, Wegeführung) und die [[Platzierung der Waren]].','Zur [[Ladeneinrichtung]] gehören: [[Warenträger]] (Regale, Gondeln, Vitrinen, Tische), Verkaufshilfen (Einkaufswagen, Kasse, Umkleidekabine), interne Werbemittel (Plakate, Infotafeln, Deckenhänger) und sonstige Einrichtung (Diebstahlsicherung, Videoüberwachung, Sammelboxen).','Wer dauerhaft billig sein will, spart an der Gestaltung: Das ist die [[Discountstrategie]]. Wer Kunden mit Atmosphäre und Service gewinnen will, investiert darin: Das ist die [[Erlebnisstrategie]].','[[Visual Merchandising]] heißt „optische Verkaufsförderung“. Verkaufsraum und Ware werden so gestaltet, dass eine besondere Einkaufsatmosphäre entsteht. Die Kunden bleiben länger ([[Verweildauer]]) und bekommen Lust aufs Kaufen.'],

 q:{q:'Welche Strategie ist das? „Wer dauerhaft billig sein will, spart an der Gestaltung.“',o:['Discountstrategie','Erlebnisstrategie'],a:0}},
{k:'task',id:'a3',n:'Aufgabe 3',h:'Vorgemacht: eine Prüfungsaufgabe lösen',hk:'c.vor.h',intro:'Lies das Beispiel. Dann entscheide: richtig oder falsch?',ik:'c.vor.i',tip:'Schau in die Tabelle „So gehe ich vor“. Jedes Ziel bringt 1 Punkt.',ex:'Das fünfte Ziel zählt nicht. Zwei ähnliche Ziele (z. B. „Umsatz steigern“ und „mehr verkaufen“) zählen nur einmal.',
 sit:'<b>Die Aufgabe:</b> Die Kaufhaus Hansa GmbH will ihre Elektroabteilung umgestalten. Nennen Sie vier Ziele, die mit der Umgestaltung erreicht werden sollen. (4 Punkte)<table class="tbl info"><tr><th>Denkschritt</th><th>So gehe ich vor</th></tr><tr><td>1 Operator lesen</td><td>„Nennen“ – also Stichworte, vier Stück. Jedes bringt 1 Punkt. Ein fünftes zählt nicht.</td></tr><tr><td>2 Zwei Brillen aufsetzen</td><td>Was hat der Kunde davon? Was hat der Betrieb davon? So finde ich schnell genug Ideen.</td></tr><tr><td>3 Aufschreiben</td><td>Einkaufserlebnis steigern · Stammkunden binden · Neukunden gewinnen · Umsatz steigern</td></tr><tr><td>4 Prüfen</td><td>Sind es vier verschiedene Ziele? „Umsatz steigern“ und „mehr verkaufen“ wäre fast dasselbe – lieber ein anderes nehmen.</td></tr></table>',items:[
 {t:'tf',id:'a3.1',rows:[['Bei „Nennen“ schreibe ich Stichworte auf.',true],['Ein fünftes Ziel bringt einen Extra-Punkt.',false],['„Umsatz steigern“ und „mehr verkaufen“ sind zwei verschiedene Ziele.',false],['Ich frage mich: Was hat der Kunde davon? Was hat der Betrieb davon?',true]]}]},
{k:'task',id:'a4',n:'Aufgabe 4',h:'Geführte Übung: Was gehört zur Ladeneinrichtung?',intro:'Tippe an: W = Warenträger · V = Verkaufshilfe · I = internes Werbemittel · S = sonstige Einrichtung',ik:'a4.i',tip:'Frage dich: Steht die Ware darauf (W)? Hilft es beim Einkaufen (V)? Wirbt es im Laden (I)? Schützt oder sammelt es (S)?',ex:'Warenträger tragen Ware. Verkaufshilfen helfen beim Kaufen. Interne Werbemittel werben im Laden. Alles andere ist sonstige Einrichtung.',items:[
 {t:'table',id:'a4.1',cols:[['W','Warenträger'],['V','Verkaufshilfe'],['I','internes Werbemittel'],['S','sonstige Einrichtung']],rows:[['1 Einkaufswagen',1],['2 Vitrine mit Schmuck',0],['3 Plakat „Neu eingetroffen“',2],['4 Umkleidekabine',1],['5 Videokamera',3],['6 Gondel',0],['7 Kasse',1],['8 Infotafel am Eingang',2],['9 Sammelbox für alte Batterien',3],['10 Wühltisch',0],['11 Diebstahlsicherung am Ausgang',3],['12 Deckenhänger mit Angebot',2]]}]},
{k:'task',id:'a5',n:'Aufgabe 5',h:'Freie Übung: Discount oder Erlebnis?',intro:'Entscheide: Gehört die Beobachtung eher zur Discountstrategie (D) oder zur Erlebnisstrategie (E)?',ik:'a5.i',tip:'Wenig Aufwand und wenig Personal passen zu D. Viel Gestaltung und Service passen zu E.',ex:'Discount: einfach und billig. Erlebnis: Atmosphäre, Beratung, Zusatzangebote.',items:[
 {t:'table',id:'a5.1',cols:[['D','Discountstrategie'],['E','Erlebnisstrategie']],rows:[['1 Die Ware steht im Karton auf Paletten.',0],['2 Am Samstag gibt es eine Modenschau.',1],['3 Im Haus gibt es einen Friseur und ein Café.',1],['4 Neonlicht, keine Dekoration',0],['5 Eine Kosmetikmarke hat einen eigenen Shop-in-Shop.',1],['6 Themenwelt „Alles für den Grillabend“',1],['7 Kaum Personal auf der Fläche, Beratung nur auf Nachfrage an der Kasse',0],['8 Ein Verkäufer führt eine Kaffeemaschine vor.',1]]},
 {t:'free',id:'a5.2',q:'5.2 Welche Strategie verfolgt dein Ausbildungsbetrieb? Nenne zwei Beobachtungen als Beleg.',model:'individuell; zwei konkrete Beobachtungen (z. B. Licht, Beratung, Deko, Ware im Karton)'},
 {t:'free',id:'a5.3',q:'5.3 Ein Lebensmittel-Discounter baut in seine neuen Filialen Holzoptik, wärmeres Licht und breitere Gänge ein. Passt das noch zur Discountstrategie? Begründe.',model:'Teilweise: Die Preise bleiben niedrig, aber auch Discounter nutzen Mittel des Visual Merchandising, damit sich Kunden wohlfühlen, länger bleiben und nicht zur Konkurrenz gehen. Es entsteht eine Mischform.'}]},
{k:'task',id:'a6',n:'Aufgabe 6',h:'Prüfungs-Check: im Stil der Abschlussprüfung (9 Punkte · etwa 9 Minuten)',hk:'c.pruef.h',intro:'Lies die Situation. Beantworte die Fragen wie in der Prüfung.',ik:'c.pruef.i',tip:'Nennen = nur Stichworte. Zähle, wie viele verlangt sind. Denke an Kunde und Betrieb.',tk:'c.pruef.t',ex:'Mehr Ziele aufschreiben bringt keinen Punkt. Beim Erläutern erklärst du in ein bis zwei Sätzen.',
 sit:'<b>Situation:</b> Die Kaufhaus Hansa GmbH möchte ihre Abteilung für Damenmode vollständig umgestalten. Sie gehören zum Projektteam.',items:[
 {t:'free',id:'a6.1',pts:4,nq:1,q:'6.1 Nennen Sie vier Ziele, die mit der Umgestaltung erreicht werden sollen. (4 Punkte)',model:'z. B. Einkaufserlebnis steigern, angenehmere Atmosphäre, Abgrenzung vom Wettbewerb, neue Kaufanreize, Neukunden gewinnen, Stammkunden binden, Umsatz/Absatz steigern (je 1 P.)'},
 {t:'free',id:'a6.2',pts:3,q:'6.2 Nach dem Umbau soll die Abteilung bekannt gemacht werden. Nennen Sie drei Aktionen direkt im Geschäft (am Point of Sale). (3 Punkte)',model:'z. B. Modenschau, Verkostung, Produktvorführung, Verlosung, lange Einkaufsnacht, Stylingberatung (je 1 P.; Zeitungsanzeigen zählen nicht – nicht am POS)'},
 {t:'free',id:'a6.3',pts:2,q:'6.3 Erläutern Sie den Begriff Visual Merchandising. (2 Punkte)',model:'optische Verkaufsförderung: Verkaufsraum und Ware werden so gestaltet, dass eine besondere Atmosphäre entsteht und Kunden zum Kauf angeregt werden.'}]},
{k:'task',id:'a7',n:'Aufgabe 7',h:'Für Profis',hk:'c.profis.h',intro:'Schwierigere Fragen. Begründe deine Antwort.',ik:'c.profis.i',tip:'Frage dich: Was kann man online nicht? Und: Was kostet das den Baumarkt, was bringt es ihm?',ex:'Wäge ab: Chancen gegen Risiken. Dann entscheide und begründe.',items:[
 {t:'free',id:'a7.1',q:'7.1 Der Onlinehandel wächst. Erläutern Sie, warum der Erlebniskauf für den stationären Einzelhandel besonders wichtig ist.',model:'Online kann man Ware nicht anfassen, riechen, probieren und nicht persönlich beraten werden. Genau das bietet der Erlebniskauf – er gibt Kunden einen Grund, in den Laden zu kommen, verbindet Einkauf und Freizeit und bindet die Kunden.'},
 {t:'free',id:'a7.2',q:'7.2 Ein Baumarkt überlegt, eine Kinderspielecke und ein kleines Café einzurichten. Beurteilen Sie den Vorschlag: Nennen Sie je zwei Chancen und Risiken und kommen Sie zu einem begründeten Urteil.',model:'Chancen: Familien bleiben länger und kaufen mehr; Abgrenzung von Konkurrenz und Onlinehandel; Stammkunden. Risiken: Kosten für Fläche, Personal, Aufsicht und Hygiene; Fläche fehlt für Ware. Urteil individuell, aber begründet (z. B. lohnt sich bei vielen Familienkunden).'}]},
{k:'task',id:'v1',lvl:'v',n:'Vertiefung',h:'Warum ist das so?',hk:'c.v.h',intro:'Begründe deine Antwort in ganzen Sätzen. Vergleiche danach mit der Musterlösung.',ik:'c.v.i',tip:'Beginne mit „Weil …“. Denke an Kosten und Nutzen.',tk:'c.v.t',ex:'Eine gute Begründung nennt einen Grund und eine Folge.',items:[
 {t:'free',id:'v1.1',pts:2,q:'V1 Warum lohnt sich die Erlebnisstrategie nicht für jedes Geschäft?',model:'Sie kostet viel Geld (Einrichtung, Personal, Fläche, Service). Das lohnt sich nur, wenn Kunden dafür höhere Preise zahlen oder öfter kommen. Wer vor allem über den niedrigen Preis verkauft (Discountstrategie), spart besser an der Gestaltung.'},
 {t:'free',id:'v1.2',pts:2,q:'V2 Begründe: Warum gehört die Platzierung der Waren zur Verkaufsraumgestaltung?',model:'Kunden sollen die Ware finden und dabei mehr entdecken. Wo und auf wie viel Fläche eine Ware steht, beeinflusst, was gekauft wird – das ist Teil der Gestaltung des Verkaufsraums.'}]},
{k:'task',id:'a8',n:'Aufgabe 8',h:'Auftrag bis zum nächsten Mal: Ladencheck',hk:'c.auf.h',intro:'',items:[{t:'note',html:'Mache in deinem Ausbildungsbetrieb drei Fotos: den Eingang, ein Regal und die Kasse. Frag vorher deine Ausbilderin oder deinen Ausbilder. Keine Personen auf den Fotos. Wenn Fotos nicht erlaubt sind, zeichne eine Skizze. Die Fotos brauchen wir in Modul 2, 5, 6 und 8 immer wieder.'}]},
{k:'task',id:'a9',n:'Aufgabe 9',h:'Schätzen, testen, eintragen',hk:'c.est.h',intro:'Wie viele der 16 Punkte schaffst du im Selbsttest? Übertrage die Punkte ins Punktekonto und kreuze in der Kann-Liste die Ampel „nachher“ an.',ik:'a9.i',items:[{t:'est',id:'a9.1'}]}
]};
var TR={
'title':['Phòng bán hàng và Visual Merchandising (trưng bày hàng hóa bằng hình ảnh)','Sala de ventas y Visual Merchandising (presentación visual de mercancías)','Sala de vendas e Visual Merchandising (apresentação visual da mercadoria)','Торговий зал і Visual Merchandising (візуальне оформлення товарів)','ቤት ሽያጥን Visual Merchandising (ምርኢት ዕቁባትን)','Торговый зал и Visual Merchandising (визуальная подача товара)','قاعة البيع وVisual Merchandising (العرض البصري للبضائع)','Satış salonu ve Visual Merchandising (görsel ürün sunumu)'],
'can.0':['Phân biệt Discountstrategie (chiến lược giá rẻ) và Erlebnisstrategie (chiến lược trải nghiệm), mỗi loại cho một ví dụ.','Distinguir la Discountstrategie (estrategia de descuento) y la Erlebnisstrategie (estrategia de experiencia) y dar un ejemplo de cada una.','Distinguir a Discountstrategie (estratégia de desconto) e a Erlebnisstrategie (estratégia de experiência) e dar um exemplo de cada.','Розрізняти Discountstrategie (дисконтну стратегію) та Erlebnisstrategie (стратегію вражень) і наводити по прикладу.','ነታ Discountstrategie (ስትራተጂ ትሕቲ ዋጋ) ን Erlebnisstrategie (ስትራተጂ ተመክሮ) ፍለይ፣ ንነናይ ሓደ ኣብነት ሃብ።','Различать Discountstrategie (дисконтную стратегию) и Erlebnisstrategie (стратегию впечатлений) и приводить по примеру.','أن أميّز بين Discountstrategie (استراتيجية الخصم) وErlebnisstrategie (استراتيجية التجربة) وأذكر مثالًا لكل منهما.','Discountstrategie (indirim stratejisi) ile Erlebnisstrategie (deneyim stratejisi) arasındaki farkı anlatmak ve birer örnek vermek.'],
'can.1':['Kể ba yếu tố của Verkaufsraumgestaltung (thiết kế phòng bán hàng) và các phần của Ladeneinrichtung (trang bị cửa hàng).','Nombrar los tres elementos de la Verkaufsraumgestaltung (diseño de la sala de ventas) y las partes de la Ladeneinrichtung (equipamiento de la tienda).','Nomear os três elementos da Verkaufsraumgestaltung (desenho da sala de vendas) e as partes da Ladeneinrichtung (equipamento da loja).','Назвати три елементи Verkaufsraumgestaltung (оформлення торгового залу) та частини Ladeneinrichtung (обладнання магазину).','ሰለስተ ኣካላት Verkaufsraumgestaltung (ኣዳላዊ ቤት ሽያጥ) ን ክፍልታት Ladeneinrichtung (ናይ ድኳን ኣቕሑት) ጥቀስ።','Назвать три элемента Verkaufsraumgestaltung (оформления торгового зала) и части Ladeneinrichtung (оснащения магазина).','أن أذكر العناصر الثلاثة لـ Verkaufsraumgestaltung (تصميم قاعة البيع) وأجزاء Ladeneinrichtung (تجهيزات المتجر).','Verkaufsraumgestaltung’un (satış salonu tasarımı) üç öğesini ve Ladeneinrichtung’un (mağaza donanımı) parçalarını saymak.'],
'can.2':['Giải thích khái niệm và mục tiêu của Visual Merchandising (trưng bày hàng hóa bằng hình ảnh).','Explicar el concepto y los objetivos del Visual Merchandising (presentación visual de mercancías).','Explicar o conceito e os objetivos do Visual Merchandising (apresentação visual da mercadoria).','Пояснити поняття та цілі Visual Merchandising (візуального оформлення товарів).','መብዛሕትኡ ትርጉምን ዕላማን Visual Merchandising (ምርኢት ዕቁባት) ግለጽ።','Объяснить понятие и цели Visual Merchandising (визуальной подачи товара).','أن أشرح مفهوم وأهداف Visual Merchandising (العرض البصري للبضائع).','Visual Merchandising’in (görsel ürün sunumu) tanımını ve amaçlarını açıklamak.'],
'can.3':['Chỉ ra đặc điểm của Erlebniskauf (mua sắm trải nghiệm) ở một cửa hàng.','Mostrar las características del Erlebniskauf (compra como experiencia) en una tienda.','Mostrar as características do Erlebniskauf (compra como experiência) numa loja.','Показати ознаки Erlebniskauf (покупок як враження) на прикладі магазину.','ኣብ ሓደ ድኳን ባህሪታት Erlebniskauf (ተመክሮ ዕዳጋ) ኣርኢ።','Показать признаки Erlebniskauf (покупок-впечатлений) на примере магазина.','أن أُظهر ميزات Erlebniskauf (التسوق كتجربة) في متجر.','Bir mağazada Erlebniskauf’un (deneyimli alışveriş) özelliklerini göstermek.'],
'a1.t':['Hãy nghĩ đến những cửa hàng em từng mua sắm. Cái gì ở đó rộng? Cái gì ở đó rẻ?','Piensa en tiendas donde ya has comprado. ¿Qué es grande allí? ¿Qué es barato?','Pensa em lojas onde já compraste. O que é grande lá? O que é barato?','Згадай магазини, де ти вже купував(ла). Що там велике? Що там дешеве?','ኣብ ዝዓደግካዮም ድኳናት ሕሰብ። እንታይ ኣብኡ ዓብዪ እዩ? እንታይ ኣብኡ ርካሽ እዩ?','Вспомни магазины, где ты покупал(а). Что там большое? Что там дёшево?','فكّر في متاجر اشتريت منها. ما الكبير هناك؟ وما الرخيص؟','Alışveriş yaptığın mağazaları düşün. Orada ne büyük? Ne ucuz?'],
'a1.e':['Ví dụ có trong bài giải mẫu. Hãy xem lại Lernfeld 1 và 2.','Los ejemplos están en la solución modelo. Repasa el Lernfeld 1 y 2.','Os exemplos estão na solução modelo. Revê o Lernfeld 1 e 2.','Приклади — у зразку відповіді. Повтори Lernfeld 1 і 2.','ኣብነታት ኣብ ኣብነታዊ መልሲ ኣለው። Lernfeld 1 ን 2 ዳግም ርአ።','Примеры — в образце ответа. Повтори Lernfeld 1 и 2.','الأمثلة في الحل النموذجي. راجع Lernfeld 1 و2.','Örnekler örnek çözümde. Lernfeld 1 ve 2’yi tekrar bak.'],
'a1.1.q':['1.1 Kể tên hai Betriebsform (loại hình cửa hàng) bán lẻ có diện tích bán hàng lớn.','1.1 Nombra dos Betriebsformen (formas de comercio) del comercio minorista con gran superficie.','1.1 Nomeia duas Betriebsformen (formas de comércio) do retalho com grande área de vendas.','1.1 Назви дві Betriebsformen (форми торгівлі) роздрібу з великою торговою площею.','1.1 ክልተ Betriebsformen (ዓይነት ንግዲ) ናይ ምሸጥ ዓቢ ስፍራ ዘለዎ ጥቀስ።','1.1 Назови две Betriebsformen (формы торговли) розницы с большой торговой площадью.','1.1 اذكر شكلين من Betriebsformen (أشكال التجارة) في تجارة التجزئة بمساحة بيع كبيرة.','1.1 Geniş satış alanına sahip perakende ticaretin iki Betriebsform’unu (işletme türünü) say.'],
'a1.2.q':['1.2 Nhận ra một Discounter (cửa hàng giá rẻ) qua đâu? Kể hai đặc điểm.','1.2 ¿En qué reconoces un Discounter (tienda de descuento)? Nombra dos rasgos.','1.2 Como reconheces um Discounter (loja de desconto)? Nomeia duas características.','1.2 Як упізнати Discounter (магазин-дискаунтер)? Назви дві ознаки.','1.2 ንሓደ Discounter (ድኳን ትሕቲ ዋጋ) ብምንታይ ትፈልጦ? ክልተ ባህሪታት ጥቀስ።','1.2 По чему узнать Discounter (дискаунтер)? Назови два признака.','1.2 كيف تتعرف على Discounter (متجر الخصم)؟ اذكر ميزتين.','1.2 Bir Discounter’ı (indirim marketi) nasıl tanırsın? İki özellik say.'],
'a1.3.q':['1.3 Tại sao nhiều người thích mua online hơn? Nêu một lý do.','1.3 ¿Por qué mucha gente prefiere comprar online? Da una razón.','1.3 Porque é que muitas pessoas preferem comprar online? Dá uma razão.','1.3 Чому багато людей віддають перевагу онлайн-покупкам? Назви одну причину.','1.3 ስለምንታይ ብዙሓት ሰባት ብኦንላይን ምግዛእ ይመርጹ? ሓደ ምኽንያት ሃብ።','1.3 Почему многие предпочитают покупать онлайн? Назови одну причину.','1.3 لماذا يفضّل كثيرون الشراء عبر الإنترنت؟ اذكر سببًا واحدًا.','1.3 Neden birçok insan online alışverişi tercih ediyor? Bir neden say.'],
'a2.h':['Hai cửa hàng, một con phố','Dos tiendas, una calle','Duas lojas, uma rua','Два магазини, одна вулиця','ክልተ ድኳናት፣ ሓደ ጎደና','Два магазина, одна улица','متجران، شارع واحد','İki mağaza, bir sokak'],
'a2.i':['Hai cửa hàng thực phẩm nằm cùng một phố, cách nhau chỉ 200 mét. Đọc mô tả và trả lời các câu hỏi.','Dos tiendas de alimentación están en la misma calle, a solo 200 metros. Lee la descripción y responde.','Duas lojas de alimentação estão na mesma rua, a apenas 200 metros. Lê a descrição e responde.','Два продуктові магазини на одній вулиці, за 200 метрів один від одного. Прочитай опис і дай відповіді.','ክልተ ድኳናት መግቢ ኣብ ሓደ ጎደና፣ 200 ሜትሮ ርሕቀት። መግለጺ ኣንብብን መልስን።','Два продуктовых магазина на одной улице, в 200 метрах друг от друга. Прочитай описание и ответь.','متجران للمواد الغذائية في الشارع نفسه، على بعد 200 متر فقط. اقرأ الوصف وأجب.','Aynı sokakta, yalnızca 200 metre arayla iki market var. Açıklamayı oku ve soruları cevapla.'],
'a2.t':['So sánh giá, ánh sáng, tư vấn và không khí. Khách hàng ở cửa hàng B được nhiều hơn điều gì?','Compara precio, luz, asesoramiento y ambiente. ¿Qué recibe más el cliente en la tienda B?','Compara preço, luz, aconselhamento e ambiente. O que recebe o cliente a mais na loja B?','Порівняй ціну, світло, консультацію й атмосферу. Що клієнт отримує більше в магазині B?','ዋጋ፣ ብርሃን፣ ምኽሪ ከምኡውን ከባቢ ኣነጻጽር። ኣብ ድኳን B ዓሚል እንታይ ብዝያዳ ይረክብ?','Сравни цену, свет, консультацию и атмосферу. Что клиент получает больше в магазине B?','قارن السعر والإضاءة والاستشارة والأجواء. ماذا يحصل الزبون عليه أكثر في المتجر B؟','Fiyat, ışık, danışmanlık ve atmosferi karşılaştır. B mağazasında müşteri fazladan ne alır?'],
'a2.e':['Cửa hàng A tiết kiệm chi phí và rẻ. Cửa hàng B mang lại trải nghiệm và giá cao hơn.','La tienda A ahorra costes y es barata. La tienda B ofrece una experiencia y cobra más.','A loja A poupa custos e é barata. A loja B oferece uma experiência e cobra mais.','Магазин A економить витрати й дешевий. Магазин B дарує враження й коштує дорожче.','ድኳን A ወጻኢ የቑርብ፣ ርካሽ እዩ። ድኳን B ተመክሮ ይህብ፣ ዋጋ ይብዝሕ።','Магазин A экономит расходы и дёшев. Магазин B даёт впечатления и стоит дороже.','المتجر A يوفّر التكاليف ورخيص. المتجر B يقدّم تجربة وسعره أعلى.','A mağazası maliyetten tasarruf eder ve ucuzdur. B mağazası deneyim sunar ve daha pahalıdır.'],
'a2.1.q':['2.1 Em mua cà phê cho mình ở đâu – và mua làm quà cho bà ở đâu? Hãy giải thích.','2.1 ¿Dónde compras café para ti y dónde café como regalo para tu abuela? Justifica.','2.1 Onde compras café para ti e onde compras café como presente para a tua avó? Justifica.','2.1 Де ти купуєш каву для себе, а де — як подарунок бабусі? Обґрунтуй.','2.1 ቡን ንርእስኻ ኣበይ ትገዝእ — ንኣደ ኣደኻ ከም ህያብ ኸ? ኣረጋግጽ።','2.1 Где ты купишь кофе для себя, а где — в подарок бабушке? Обоснуй.','2.1 أين تشتري القهوة لنفسك، وأين تشتريها هدية لجدتك؟ علّل.','2.1 Kahveyi kendin için nereden, büyükannen için hediye olarak nereden alırsın? Gerekçelendir.'],
'a2.2.q':['2.2 Lindemanns chi nhiều tiền cho trang bị, nhân viên và quán cà phê. Tại sao vẫn đáng?','2.2 Lindemanns gasta mucho dinero en mobiliario, personal y café. ¿Por qué compensa aun así?','2.2 A Lindemanns gasta muito dinheiro em mobiliário, pessoal e café. Porque é que compensa mesmo assim?','2.2 Lindemanns витрачає багато грошей на обладнання, персонал і кафе. Чому це все одно вигідно?','2.2 Lindemanns ብዙሕ ገንዘብ ንኣቕሑት፣ ሰራሕተኛን ካፌን የውጽእ። ስለምንታይ እዚ ግን ይሕይሽ?','2.2 Lindemanns тратит много денег на обстановку, персонал и кафе. Почему это всё равно выгодно?','2.2 تنفق Lindemanns مالًا كثيرًا على التجهيز والموظفين والمقهى. لماذا يستحق ذلك رغم ذلك؟','2.2 Lindemanns donanım, personel ve kafeye çok para harcıyor. Buna rağmen neden değer?'],
'a2.3.q':['2.3 Tại sao Preisfuchs bỏ tất cả những thứ đó?','2.3 ¿Por qué Preisfuchs renuncia a todo eso?','2.3 Porque é que a Preisfuchs dispensa tudo isso?','2.3 Чому Preisfuchs відмовляється від усього цього?','2.3 ስለምንታይ Preisfuchs ካብዚ ኩሉ ይቅህም?','2.3 Почему Preisfuchs отказывается от всего этого?','2.3 لماذا تتخلى Preisfuchs عن كل ذلك؟','2.3 Preisfuchs neden tüm bunlardan vazgeçiyor?'],
'r1.h':['Đọc thêm: Phòng bán hàng được thiết kế như thế nào','Para leer: cómo se diseña una sala de ventas','Para ler: como se desenha uma sala de vendas','Для читання: як оформлюють торговий зал','ንምንባብ: ቤት ሽያጥ ከመይ ይዳለ','Для чтения: как оформляют торговый зал','للقراءة: كيف تُصمَّم قاعة البيع','Okumak için: Satış salonu nasıl tasarlanır'],
'r1.s':['Một cửa hàng không chỉ bán hàng, mà còn bán cả cảm giác.','Una tienda no solo vende mercancía, sino también una sensación.','Uma loja não vende só mercadoria, vende também uma sensação.','Магазин продає не лише товар, а й відчуття.','ድኳን ኣቕሑት ጥራይ ዘይኮነስ ስምዒት እውን ይሸይጥ።','Магазин продаёт не только товар, но и чувство.','المتجر لا يبيع البضائع فقط، بل يبيع إحساسًا أيضًا.','Bir mağaza yalnızca mal değil, bir duygu da satar.'],
'r1.qq':['Đây là chiến lược nào? „Wer dauerhaft billig sein will, spart an der Gestaltung.“ (Ai muốn luôn rẻ thì tiết kiệm ở khâu thiết kế.)','¿Qué estrategia es? «Wer dauerhaft billig sein will, spart an der Gestaltung.» (Quien quiere ser siempre barato, ahorra en el diseño.)','Que estratégia é? «Wer dauerhaft billig sein will, spart an der Gestaltung.» (Quem quer ser sempre barato, poupa no design.)','Яка це стратегія? «Wer dauerhaft billig sein will, spart an der Gestaltung.» (Хто хоче бути завжди дешевим, економить на оформленні.)','እዚ ኣየናይ ስትራተጂ እዩ? «Wer dauerhaft billig sein will, spart an der Gestaltung.» (ኩሉ ግዜ ርካሽ ክኸውን ዝደሊ ኣብ ዲዛይን የቑርብ።)','Какая это стратегия? «Wer dauerhaft billig sein will, spart an der Gestaltung.» (Кто хочет быть всегда дешёвым, экономит на оформлении.)','أي استراتيجية هذه؟ «Wer dauerhaft billig sein will, spart an der Gestaltung.» (من يريد البقاء رخيصًا يوفّر في التصميم.)','Bu hangi strateji? «Wer dauerhaft billig sein will, spart an der Gestaltung.» (Sürekli ucuz olmak isteyen tasarımdan tasarruf eder.)'],
'a3.i':['Đọc ví dụ. Sau đó quyết định: đúng hay sai?','Lee el ejemplo. Luego decide: ¿verdadero o falso?','Lê o exemplo. Depois decide: verdadeiro ou falso?','Прочитай приклад. Потім вирішуй: правда чи ні?','ኣብነት ኣንብብ። ድሕሪኡ ወስን: ሓቂ ወይ ሓሶት?','Прочитай пример. Потом реши: верно или неверно?','اقرأ المثال. ثم قرّر: صحيح أم خطأ؟','Örneği oku. Sonra karar ver: doğru mu yanlış mı?'],
'a3.t':['Xem bảng „So gehe ich vor“ (cách em làm). Mỗi mục tiêu được 1 điểm.','Mira la tabla «So gehe ich vor» (así procedo). Cada objetivo vale 1 punto.','Vê a tabela «So gehe ich vor» (como procedo). Cada objetivo vale 1 ponto.','Подивись у таблицю «So gehe ich vor» (як я дію). Кожна ціль — 1 бал.','ነታ ሰንጠረዥ «So gehe ich vor» (ከመይ ከም ዝሰርሕ) ርአ። ነፍሲ ወከፍ ዕላማ 1 ነጥቢ።','Посмотри таблицу «So gehe ich vor» (как я действую). Каждая цель — 1 балл.','انظر إلى جدول «So gehe ich vor» (كيف أتصرف). كل هدف بنقطة واحدة.','„So gehe ich vor“ (nasıl ilerlerim) tablosuna bak. Her hedef 1 puan.'],
'a3.e':['Mục tiêu thứ năm không được tính. Hai mục tiêu giống nhau chỉ tính một lần.','El quinto objetivo no cuenta. Dos objetivos parecidos cuentan solo una vez.','O quinto objetivo não conta. Dois objetivos parecidos contam só uma vez.','П’ята ціль не рахується. Дві схожі цілі рахуються лише раз.','ሓምሻይ ዕላማ ኣይቑጸርን። ክልተ ተመሳሳሊ ዕላማታት ሓንሳብ ጥራይ ይቑጸሩ።','Пятая цель не считается. Две похожие цели считаются один раз.','الهدف الخامس لا يُحتسب. هدفان متشابهان يُحتسبان مرة واحدة.','Beşinci hedef sayılmaz. İki benzer hedef bir kez sayılır.'],
'a4.h':['Bài tập có hướng dẫn: Cái gì thuộc về Ladeneinrichtung (trang bị cửa hàng)?','Ejercicio guiado: ¿Qué forma parte de la Ladeneinrichtung (equipamiento de la tienda)?','Exercício guiado: O que faz parte da Ladeneinrichtung (equipamento da loja)?','Керована вправа: що належить до Ladeneinrichtung (обладнання магазину)?','ምምሕዳር ልምምድ: እንታይ ናይ Ladeneinrichtung እዩ?','Упражнение с подсказкой: что относится к Ladeneinrichtung (оснащению магазина)?','تمرين موجَّه: ما الذي يندرج ضمن Ladeneinrichtung (تجهيزات المتجر)؟','Rehberli alıştırma: Ladeneinrichtung’a (mağaza donanımı) ne dahildir?'],
'a5.h':['Bài tập tự do: Discount hay Erlebnis (trải nghiệm)?','Ejercicio libre: ¿Discount o Erlebnis (experiencia)?','Exercício livre: Discount ou Erlebnis (experiência)?','Вільна вправа: Discount чи Erlebnis (враження)?','ናጻ ልምምድ: Discount ወይ Erlebnis (ተመክሮ)?','Свободное упражнение: Discount или Erlebnis (впечатление)?','تمرين حر: Discount أم Erlebnis (تجربة)؟','Serbest alıştırma: Discount mu Erlebnis (deneyim) mi?'],
'a6.2.q':['6.2 Sau khi cải tạo, khu vực sẽ được quảng bá. Kể ba hoạt động ngay trong cửa hàng (am Point of Sale, tại điểm bán). (3 điểm)','6.2 Tras la reforma se dará a conocer la sección. Nombra tres acciones directamente en la tienda (am Point of Sale, en el punto de venta). (3 puntos)','6.2 Depois da remodelação a secção vai ser divulgada. Nomeia três ações diretamente na loja (am Point of Sale, no ponto de venda). (3 pontos)','6.2 Після ремонту відділ мають зробити відомим. Назви три заходи просто в магазині (am Point of Sale, у точці продажу). (3 бали)','6.2 ድሕሪ ምሕዳስ እቲ ክፍሊ ክፍለጥ ኣለዎ። ሰለስተ ተግባራት ቀጥታ ኣብ ድኳን (am Point of Sale) ጥቀስ። (3 ነጥቢ)','6.2 После ремонта отдел нужно сделать известным. Назови три акции прямо в магазине (am Point of Sale, в точке продажи). (3 балла)','6.2 بعد التجديد يجب التعريف بالقسم. اذكر ثلاثة إجراءات داخل المتجر مباشرة (am Point of Sale، نقطة البيع). (3 نقاط)','6.2 Yenilemeden sonra bölüm tanıtılacak. Doğrudan mağazada (am Point of Sale, satış noktasında) üç etkinlik say. (3 puan)'],
'a6.3.q':['6.3 Erläutern Sie den Begriff Visual Merchandising (trưng bày hàng hóa bằng hình ảnh). (2 điểm)','6.3 Erläutern Sie den Begriff Visual Merchandising (presentación visual de mercancías). (2 puntos)','6.3 Erläutern Sie den Begriff Visual Merchandising (apresentação visual da mercadoria). (2 pontos)','6.3 Erläutern Sie den Begriff Visual Merchandising (візуальне оформлення товарів). (2 бали)','6.3 Erläutern Sie den Begriff Visual Merchandising (ምርኢት ዕቁባት). (2 ነጥቢ)','6.3 Erläutern Sie den Begriff Visual Merchandising (визуальная подача товара). (2 балла)','6.3 Erläutern Sie den Begriff Visual Merchandising (العرض البصري للبضائع). (2 نقطة)','6.3 Erläutern Sie den Begriff Visual Merchandising (görsel ürün sunumu). (2 puan)'],
'a4.i':['Chạm vào: W = Warenträger (giá đỡ hàng) · V = Verkaufshilfe (dụng cụ hỗ trợ bán hàng) · I = internes Werbemittel (quảng cáo trong cửa hàng) · S = sonstige Einrichtung (trang bị khác)','Toca: W = Warenträger (soporte de mercancías) · V = Verkaufshilfe (ayuda de venta) · I = internes Werbemittel (publicidad interna) · S = sonstige Einrichtung (otro equipamiento)','Toca: W = Warenträger (suporte de mercadoria) · V = Verkaufshilfe (auxiliar de venda) · I = internes Werbemittel (publicidade interna) · S = sonstige Einrichtung (outro equipamento)','Торкнись: W = Warenträger (стелаж для товару) · V = Verkaufshilfe (допомога при купівлі) · I = internes Werbemittel (внутрішня реклама) · S = sonstige Einrichtung (інше обладнання)','ሓስ: W = Warenträger (ምስኻል ኣቕሑት) · V = Verkaufshilfe (ሓገዝ ሽያጥ) · I = internes Werbemittel (ውሽጣዊ ፕሮሞሽን) · S = sonstige Einrichtung (ካልእ ናውቲ)','Нажми: W = Warenträger (стеллаж для товара) · V = Verkaufshilfe (помощь при покупке) · I = internes Werbemittel (внутренняя реклама) · S = sonstige Einrichtung (прочее оборудование)','المس: W = Warenträger (حامل البضائع) · V = Verkaufshilfe (أداة مساعدة للبيع) · I = internes Werbemittel (إعلان داخلي) · S = sonstige Einrichtung (تجهيزات أخرى)','Dokun: W = Warenträger (mal taşıyıcı) · V = Verkaufshilfe (satış yardımcısı) · I = internes Werbemittel (mağaza içi reklam) · S = sonstige Einrichtung (diğer donanım)'],
'a4.t':['Tự hỏi: Hàng có để trên đó không (W)? Nó giúp khi mua sắm không (V)? Nó quảng cáo trong cửa hàng không (I)? Nó bảo vệ hay thu gom không (S)?','Pregúntate: ¿Se coloca la mercancía encima (W)? ¿Ayuda al comprar (V)? ¿Hace publicidad en la tienda (I)? ¿Protege o recoge (S)?','Pergunta-te: A mercadoria fica em cima (W)? Ajuda a comprar (V)? Faz publicidade na loja (I)? Protege ou recolhe (S)?','Запитай себе: чи стоїть на цьому товар (W)? Чи допомагає це купувати (V)? Чи рекламує це в магазині (I)? Чи захищає або збирає (S)?','ባዕልኻ ሕተት: ኣቕሑት ኣብኡ ይቕመጡ ዶ (W)? ኣብ ዕዳጋ ይሕግዝ ዶ (V)? ኣብ ድኳን የፍልጥ ዶ (I)? ይሕሉ ወይ ይእክብ ዶ (S)?','Спроси себя: стоит ли на этом товар (W)? Помогает ли это при покупке (V)? Рекламирует ли это в магазине (I)? Защищает или собирает (S)?','اسأل نفسك: هل توضع البضاعة عليه (W)؟ هل يساعد في الشراء (V)؟ هل يعلن داخل المتجر (I)؟ هل يحمي أو يجمع (S)؟','Kendine sor: Mal üstünde mi duruyor (W)? Alışverişe yardım ediyor mu (V)? Mağazada reklam yapıyor mu (I)? Koruyor ya da topluyor mu (S)?'],
'a4.e':['Warenträger đựng hàng. Verkaufshilfe giúp mua sắm. Internes Werbemittel quảng cáo trong cửa hàng. Còn lại là sonstige Einrichtung.','Los Warenträger sostienen la mercancía. Las Verkaufshilfen ayudan a comprar. Los internen Werbemittel hacen publicidad en la tienda. Lo demás es sonstige Einrichtung.','Os Warenträger suportam a mercadoria. As Verkaufshilfen ajudam a comprar. Os internen Werbemittel fazem publicidade na loja. O resto é sonstige Einrichtung.','Warenträger тримають товар. Verkaufshilfen допомагають купувати. Interne Werbemittel рекламують у магазині. Решта — sonstige Einrichtung.','Warenträger ኣቕሑት ይጾሩ። Verkaufshilfen ኣብ ዕዳጋ ይሕግዙ። Interne Werbemittel ኣብ ድኳን የፍልጡ። እቲ ካልእ sonstige Einrichtung እዩ።','Warenträger держат товар. Verkaufshilfen помогают покупать. Interne Werbemittel рекламируют в магазине. Остальное — sonstige Einrichtung.','Warenträger تحمل البضائع. Verkaufshilfen تساعد في الشراء. Interne Werbemittel تعلن داخل المتجر. والباقي sonstige Einrichtung.','Warenträger malı taşır. Verkaufshilfen alışverişe yardım eder. Interne Werbemittel mağazada reklam yapar. Gerisi sonstige Einrichtung’dur.'],
'a5.i':['Quyết định: Quan sát này thuộc Discountstrategie (chiến lược giá rẻ, D) hay Erlebnisstrategie (chiến lược trải nghiệm, E)?','Decide: ¿La observación pertenece a la Discountstrategie (estrategia de descuento, D) o a la Erlebnisstrategie (estrategia de experiencia, E)?','Decide: A observação pertence à Discountstrategie (estratégia de desconto, D) ou à Erlebnisstrategie (estratégia de experiência, E)?','Вирішуй: це спостереження до Discountstrategie (дисконтна стратегія, D) чи до Erlebnisstrategie (стратегія вражень, E)?','ወስን: እዚ ምስትውዓል ናብ Discountstrategie (D) ድዩ ወይስ ናብ Erlebnisstrategie (E) ይሕዝ?','Реши: это наблюдение относится к Discountstrategie (дисконтной стратегии, D) или к Erlebnisstrategie (стратегии впечатлений, E)?','قرّر: هل تنتمي الملاحظة إلى Discountstrategie (استراتيجية الخصم، D) أم إلى Erlebnisstrategie (استراتيجية التجربة، E)؟','Karar ver: Bu gözlem Discountstrategie’ye (indirim stratejisi, D) mi, Erlebnisstrategie’ye (deneyim stratejisi, E) mi ait?'],
'a5.t':['Ít công sức và ít nhân viên → D. Nhiều thiết kế và dịch vụ → E.','Poco esfuerzo y poco personal → D. Mucho diseño y servicio → E.','Pouco esforço e pouco pessoal → D. Muito design e serviço → E.','Мало зусиль і мало персоналу → D. Багато оформлення й сервісу → E.','ውሑድ ጻዕርን ውሑድ ሰራሕተኛን → D። ብዙሕ ዲዛይንን ኣገልግሎትን → E።','Мало усилий и мало персонала → D. Много оформления и сервиса → E.','جهد قليل وموظفون قليلون → D. تصميم وخدمة كثيرة → E.','Az çaba ve az personel → D. Çok tasarım ve hizmet → E.'],
'a5.e':['Discount: đơn giản và rẻ. Erlebnis: không khí, tư vấn, dịch vụ thêm.','Discount: sencillo y barato. Erlebnis: ambiente, asesoramiento, ofertas adicionales.','Discount: simples e barato. Erlebnis: ambiente, aconselhamento, ofertas adicionais.','Discount: просто й дешево. Erlebnis: атмосфера, консультація, додаткові пропозиції.','Discount: ቀሊልን ርካሽን። Erlebnis: ከባቢ፣ ምኽሪ፣ ተወሳኺ ኣገልግሎት።','Discount: просто и дёшево. Erlebnis: атмосфера, консультация, доп. предложения.','Discount: بسيط ورخيص. Erlebnis: أجواء واستشارة وعروض إضافية.','Discount: sade ve ucuz. Erlebnis: atmosfer, danışmanlık, ek hizmetler.'],
'a5.2.q':['5.2 Cơ sở đào tạo của em theo chiến lược nào? Nêu hai quan sát làm bằng chứng.','5.2 ¿Qué estrategia sigue tu empresa de prácticas? Da dos observaciones como prueba.','5.2 Que estratégia segue a tua empresa de formação? Dá duas observações como prova.','5.2 Яку стратегію обирає твоє підприємство? Наведи два спостереження як доказ.','5.2 ቦታ ልምምድካ ኣየናይ ስትራተጂ ይኽተል? ክልተ ምስትውዓላት ከም መርትዖ ሃብ።','5.2 Какую стратегию выбирает твоё предприятие? Приведи два наблюдения как доказательство.','5.2 ما الاستراتيجية التي تتبعها شركة تدريبك؟ اذكر ملاحظتين كدليل.','5.2 Eğitim işletmen hangi stratejiyi izliyor? Kanıt olarak iki gözlem yaz.'],
'a5.3.q':['5.3 Một Discounter (cửa hàng giá rẻ) làm chi nhánh mới với gỗ, đèn ấm hơn và lối đi rộng hơn. Vậy còn phù hợp với Discountstrategie không? Hãy giải thích.','5.3 Un Discounter (tienda de descuento) pone en sus nuevas sucursales aspecto de madera, luz más cálida y pasillos más anchos. ¿Sigue encajando con la Discountstrategie? Justifica.','5.3 Um Discounter (loja de desconto) instala nas novas filiais aspeto de madeira, luz mais quente e corredores mais largos. Ainda é compatível com a Discountstrategie? Justifica.','5.3 Discounter (магазин-дискаунтер) робить у нових філіях дерев’яний вигляд, тепліше світло й ширші проходи. Чи це ще відповідає Discountstrategie? Обґрунтуй.','5.3 ሓደ Discounter ኣብ ሓደስቲ ቅርጫፋቱ ናይ ዕንጨይቲ ቅርጺ፣ ዝሙቐ ብርሃንን ሰፊሕ መንገድን ይገብር። እዚ ድማ ምስ Discountstrategie ይሰማማዕ ዶ? ኣረጋግጽ።','5.3 Discounter (дискаунтер) делает в новых филиалах деревянную отделку, более тёплый свет и более широкие проходы. Подходит ли это ещё к Discountstrategie? Обоснуй.','5.3 يضع Discounter (متجر الخصم) في فروعه الجديدة مظهر الخشب وإضاءة أدفأ وممرات أوسع. هل ما زال هذا يناسب Discountstrategie؟ علّل.','5.3 Bir Discounter (indirim marketi) yeni şubelerine ahşap görünüm, daha sıcak ışık ve daha geniş koridorlar yapıyor. Bu hâlâ Discountstrategie’ye uyuyor mu? Gerekçelendir.'],
'a6.e':['Viết thêm mục tiêu không được thêm điểm. Với „erläutern“ (giải thích), em giải thích bằng một đến hai câu.','Escribir más objetivos no da puntos. En «erläutern» (explicar) lo explicas en una o dos frases.','Escrever mais objetivos não dá pontos. Em «erläutern» (explicar) explicas em uma ou duas frases.','Більше цілей — не більше балів. Для «erläutern» (пояснити) поясни одним-двома реченнями.','ተወሳኺ ዕላማ ነጥቢ ኣይህብን። ኣብ «erläutern» (ምግላጽ) ብሓደ ወይ ክልተ ሓረግ ግለጽ።','Больше целей — не больше баллов. При «erläutern» (объяснить) объясни в одном-двух предложениях.','كتابة أهداف أكثر لا تمنح نقاطًا. في «erläutern» (اشرح) تشرح بجملة أو جملتين.','Daha fazla hedef yazmak puan getirmez. «erläutern» (açıkla) için bir iki cümleyle açıkla.'],
'a7.e':['Cân nhắc: cơ hội so với rủi ro. Rồi quyết định và giải thích.','Sopesa: oportunidades frente a riesgos. Luego decide y justifica.','Pondera: oportunidades contra riscos. Depois decide e justifica.','Зваж: можливості проти ризиків. Потім вирішуй і обґрунтуй.','ዕድላት ምስ ሓደጋታት ኣመዛዝን። ድሕሪኡ ወስንን ኣረጋግጽን።','Взвесь: возможности против рисков. Потом реши и обоснуй.','وازن بين الفرص والمخاطر. ثم قرّر وعلّل.','Fırsatları risklerle tart. Sonra karar ver ve gerekçelendir.'],
'a7.t':['Tự hỏi: Mua online không làm được gì? Và: Việc này tốn gì, mang lại gì cho cửa hàng vật liệu xây dựng?','Pregúntate: ¿Qué no se puede hacer online? Y: ¿Qué le cuesta y qué le aporta a la ferretería?','Pergunta-te: O que não se pode fazer online? E: o que custa e o que traz à loja de bricolage?','Запитай себе: чого не можна онлайн? І: що це коштує будівельному магазину й що дає?','ባዕልኻ ሕተት: ብኦንላይን እንታይ ኣይካኣልን? እንታይ ድማ ንBaumarkt ይኽልፍን የምጽእን?','Спроси себя: чего нельзя онлайн? И: что это стоит строительному магазину и что даёт?','اسأل نفسك: ماذا لا يمكن فعله عبر الإنترنت؟ وماذا تكلّف هذه الفكرة متجر مواد البناء وماذا تعطيه؟','Kendine sor: Online ne yapılamaz? Ve: Bu, yapı market için neye mal olur, ne kazandırır?'],
'a7.1.q':['7.1 Bán hàng online đang tăng. Hãy giải thích tại sao Erlebniskauf (mua sắm trải nghiệm) đặc biệt quan trọng với bán lẻ tại cửa hàng.','7.1 El comercio online crece. Explica por qué el Erlebniskauf (compra como experiencia) es especialmente importante para el comercio minorista físico.','7.1 O comércio online cresce. Explica porque é que o Erlebniskauf (compra como experiência) é especialmente importante para o retalho físico.','7.1 Онлайн-торгівля зростає. Поясни, чому Erlebniskauf (покупки як враження) особливо важливий для магазинів.','7.1 ኦንላይን ንግዲ ይዓብይ ኣሎ። ስለምንታይ Erlebniskauf ንድኳናት ፍሉይ ኣገዳሲ ምዃኑ ግለጽ።','7.1 Онлайн-торговля растёт. Объясни, почему Erlebniskauf (покупки-впечатления) особенно важен для магазинов.','7.1 التجارة الإلكترونية تنمو. اشرح لماذا Erlebniskauf (التسوق كتجربة) مهم خصوصًا لتجارة التجزئة في المتاجر.','7.1 Online ticaret büyüyor. Erlebniskauf’un (deneyimli alışveriş) mağazalı perakende için neden özellikle önemli olduğunu açıkla.'],
'a7.2.q':['7.2 Một cửa hàng Baumarkt (vật liệu xây dựng) định làm góc chơi cho trẻ em và một quán cà phê nhỏ. Hãy đánh giá đề xuất: nêu mỗi loại hai cơ hội và hai rủi ro, rồi đưa ra kết luận có lý do.','7.2 Una ferretería (Baumarkt) piensa montar un rincón de juegos infantil y una pequeña cafetería. Valora la propuesta: da dos oportunidades y dos riesgos y llega a una conclusión justificada.','7.2 Uma loja de bricolage (Baumarkt) pensa montar um canto de brincadeiras para crianças e um pequeno café. Avalia a proposta: indica duas oportunidades e dois riscos e chega a uma conclusão fundamentada.','7.2 Будівельний магазин (Baumarkt) думає облаштувати дитячий куточок і маленьке кафе. Оціни пропозицію: назви по дві можливості й ризики та зроби обґрунтований висновок.','7.2 ሓደ Baumarkt ኩርናዕ ጸወታ ቆልዑን ንእሽቶ ካፌን ምግባር የሕስብ። ሓሳብ ገምግም: ክልተ ዕድላትን ክልተ ሓደጋታትን ጥቀስ፣ ድሕሪኡ ብምኽንያት ዝተኸየደ ውሳኔ ሃብ።','7.2 Строительный магазин (Baumarkt) думает устроить детский уголок и маленькое кафе. Оцени предложение: назови по две возможности и два риска и сделай обоснованный вывод.','7.2 يفكر متجر مواد بناء (Baumarkt) في إنشاء ركن ألعاب للأطفال ومقهى صغير. قيّم الاقتراح: اذكر فرصتين وخطرين وخلص إلى حكم معلَّل.','7.2 Bir yapı market (Baumarkt) çocuk oyun köşesi ve küçük bir kafe kurmayı düşünüyor. Öneriyi değerlendir: iki fırsat ve iki risk say ve gerekçeli bir sonuca var.'],
'v1.e':['Một lý do tốt nêu cả nguyên nhân lẫn hậu quả.','Una buena justificación da una razón y una consecuencia.','Uma boa justificação dá uma razão e uma consequência.','Добре обґрунтування містить причину й наслідок.','ጽቡቕ መረዳእታ ምኽንያትን ውጽኢትን ይህብ።','Хорошее обоснование содержит причину и следствие.','التعليل الجيد يذكر سببًا ونتيجة.','İyi bir gerekçe hem neden hem sonuç içerir.'],
'v1.1.q':['V1 Tại sao Erlebnisstrategie (chiến lược trải nghiệm) không đáng với mọi cửa hàng?','V1 ¿Por qué la Erlebnisstrategie (estrategia de experiencia) no compensa a todas las tiendas?','V1 Porque é que a Erlebnisstrategie (estratégia de experiência) não compensa a todas as lojas?','V1 Чому Erlebnisstrategie (стратегія вражень) вигідна не кожному магазину?','V1 ስለምንታይ Erlebnisstrategie ንኩሉ ድኳን ኣይሕይሽን?','V1 Почему Erlebnisstrategie (стратегия впечатлений) выгодна не каждому магазину?','V1 لماذا لا تفيد Erlebnisstrategie (استراتيجية التجربة) كل متجر؟','V1 Erlebnisstrategie (deneyim stratejisi) neden her mağaza için karlı değildir?'],

 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}

function renderReport(){
 var t=totals(),rows=summaryRows();

 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});
 return h}

 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';
 SHEET.blocks.forEach(function(b){if(b.k==='read')h+=renderRead(b);else if(vis(b))h+=renderTask(b)});
 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';

 renderBar();updProg();pad();
 window.scrollTo(0,y)}

 document.getElementById('langs').innerHTML=LANGS.map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');

 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');
 document.documentElement.lang=S.lang;
 }

function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}

document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;

 case 'sol':S.sol[id]=true;break;

 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});

document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
