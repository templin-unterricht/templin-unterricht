<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF 4 · Digitales Arbeitsblatt</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#23303a;--mute:#5d6b76;--pri:#2f6f8f;--pri2:#e3f0f6;--ok:#2e7d4f;--okbg:#e5f4ea;--bad:#b3402f;--badbg:#fbe9e5;--warn:#c98a14;--warnbg:#fff4d6;--line:#d9d6cc;--fs:100%}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:1.125rem;line-height:1.55;padding-bottom:4rem;overflow-wrap:anywhere}
#bar{position:fixed;top:0;left:0;right:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + .5rem) 1rem .4rem}
#bar .row{display:flex;align-items:center;gap:.6rem;max-width:56rem;margin:0 auto}
#bar .ttl{font-weight:700;font-size:.95rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog{height:.7rem;background:#e6e3da;border-radius:1rem;overflow:hidden;max-width:56rem;margin:.35rem auto 0}
#progf{height:100%;width:0;background:var(--pri);transition:width .4s}
#progt{font-size:.8rem;color:var(--mute);max-width:56rem;margin:.1rem auto 0}
#langs{display:flex;gap:.4rem;overflow-x:auto;max-width:56rem;margin:.35rem auto 0;padding-bottom:.15rem;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;min-height:44px;padding:0 .9rem;border:2px solid var(--line);background:#fff;border-radius:2rem;font:inherit;font-size:.95rem;color:var(--ink);cursor:pointer}
.pill.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
main{max-width:56rem;margin:0 auto;padding:7.6rem 1rem 1rem}
h1{font-size:1.6rem;line-height:1.25;margin:.2rem 0 .2rem}
.meta{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem 1.1rem;margin:0 0 1rem}
.card h2{font-size:1.25rem;margin:0 0 .4rem;line-height:1.3}
.card h2 .nr{display:inline-block;background:var(--pri);color:#fff;border-radius:.5rem;padding:0 .5rem;margin-right:.4rem;font-size:.95rem}
.vtag{display:inline-block;background:#6a3fa0;color:#fff;border-radius:.5rem;padding:0 .5rem;font-size:.85rem;margin-left:.3rem}
.card.v{border-color:#6a3fa0;background:#faf6ff}
.tr{font-size:.9rem;color:#4a5a66;background:#f1f6f9;border-left:4px solid #9cc3d5;border-radius:.4rem;padding:.3rem .6rem;margin:.3rem 0 .5rem;line-height:1.5}
.tr[dir=rtl]{border-left:0;border-right:4px solid #9cc3d5}
.tr[lang=ti]{font-family:"Kefa","Noto Sans Ethiopic",sans-serif}
.tr[lang=vi]{line-height:1.65}
small.b{display:block;font-size:.72rem;font-weight:400;opacity:.9;line-height:1.2}
.in{display:block;width:100%;min-height:48px;font:inherit;font-size:1rem;padding:.55rem .7rem;border:2px solid var(--line);border-radius:.7rem;background:#fff;color:var(--ink)}
input.in,select.in{font-size:1rem}
textarea.in{min-height:5.5rem;resize:vertical}
.btn{min-height:48px;padding:.4rem 1.1rem;border:0;border-radius:.8rem;background:var(--pri);color:#fff;font:inherit;font-size:1rem;font-weight:600;cursor:pointer;margin:.3rem .4rem .3rem 0}
.btn.sec{background:#fff;color:var(--pri);border:2px solid var(--pri)}
.btn.gray{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.big{min-height:56px;font-size:1.1rem}
.btn:active,.pill:active,.opt:active,.ch:active{transform:scale(.97)}
.tipb{min-height:48px;min-width:48px;border-radius:2rem;border:2px solid var(--warn);background:var(--warnbg);font:inherit;font-size:1rem;cursor:pointer;padding:0 .9rem;float:right;margin:0 0 .3rem .5rem}
.tipbox{background:var(--warnbg);border:2px solid var(--warn);border-radius:.8rem;padding:.5rem .8rem;margin:.4rem 0}
.q{margin:.8rem 0 .2rem;font-weight:600}
.opts{display:flex;flex-direction:column;gap:.45rem;margin:.3rem 0}
.opt{min-height:48px;text-align:left;padding:.5rem .8rem;border:2px solid var(--line);background:#fff;border-radius:.8rem;font:inherit;font-size:1rem;color:var(--ink);cursor:pointer}
.opt.on{border-color:var(--pri);background:var(--pri2);font-weight:600}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--bad);background:var(--badbg)}
.tbl{width:100%;border-collapse:collapse;margin:.4rem 0;font-size:1rem}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:.4rem .3rem;text-align:left;vertical-align:middle}
.tbl.info th{background:#eef3f6}
.tbl.info td,.tbl.info th{border:1px solid var(--line);padding:.4rem .5rem}
.tbl td.c{text-align:center;white-space:nowrap}
.ch{min-width:48px;min-height:48px;border:2px solid var(--line);background:#fff;border-radius:.7rem;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);cursor:pointer;margin:2px}
.ch.on{background:var(--pri);border-color:var(--pri);color:#fff}
.ch.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ch.no{background:var(--bad);border-color:var(--bad);color:#fff}
.ch.sol{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
tr.rok td{background:var(--okbg)}tr.rno td{background:var(--badbg)}
.fb{border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0;font-size:1rem}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.no{background:var(--badbg);border:1px solid var(--bad)}
.fb.part{background:var(--warnbg);border:1px solid var(--warn)}
.sit{background:#eef3f6;border-left:5px solid var(--pri);border-radius:.5rem;padding:.5rem .8rem;margin:.5rem 0}
.read p{margin:.5rem 0;line-height:2}
.w{display:inline-block;padding:0 .12rem;margin:0 .02rem;border-radius:.35rem;cursor:pointer;min-height:1.7rem}
.w.on{background:#ffe27a}
.w.ok{background:#bfe5c8;outline:2px solid var(--ok)}
.w.no{background:#f4c3bb;outline:2px solid var(--bad)}
.w.miss{outline:2px dashed var(--ok)}
.gapsel{display:inline-block;width:auto;min-width:8rem;max-width:100%;min-height:44px;margin:.15rem .1rem;padding:.2rem .4rem;font:inherit;font-size:1rem;border:2px solid var(--pri);border-radius:.6rem;background:#fff}
.gapsel.ok{border-color:var(--ok);background:var(--okbg)}.gapsel.no{border-color:var(--bad);background:var(--badbg)}
.gaptxt{line-height:2.3}
.model{background:#eef6ee;border:1px solid #9fc9a8;border-radius:.7rem;padding:.5rem .8rem;margin:.5rem 0}
.model b{display:block;font-size:.85rem;color:var(--ok)}
.scores{display:flex;gap:.5rem;flex-wrap:wrap}
.big{font-size:1.1rem}
.score{font-size:2rem;font-weight:800;color:var(--pri)}
.bar2{height:.9rem;background:#e6e3da;border-radius:1rem;overflow:hidden;margin:.3rem 0}.bar2>i{display:block;height:100%;background:var(--ok)}
.cl li{margin:.35rem 0}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#23303a;color:#fff;padding:.6rem 1.1rem;border-radius:2rem;z-index:99;font-size:1rem;max-width:90%}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:1rem}
.dlg>div{background:#fff;border-radius:1rem;padding:1.2rem;max-width:26rem;width:100%}
#set{max-width:56rem;margin:0 auto 1rem;display:none}
#set.open{display:block}
.row2{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.4rem 0}
.row2 label{font-weight:600;min-width:7rem}
.nowrap{white-space:nowrap}
#report{display:none}
@media (max-width:600px){main{padding-top:8.2rem}.card{padding:.8rem}h1{font-size:1.35rem}.tbl{font-size:.95rem}}
@media print{
 body{background:#fff;padding:0;font-size:11pt}
 #bar,#set,main,.toast,.dlg,.noprint{display:none!important}
 #report{display:block!important}
 #report h1{font-size:16pt}
 #report table{width:100%;border-collapse:collapse;font-size:10pt}
 #report td,#report th{border:1px solid #999;padding:3px 5px;vertical-align:top;text-align:left}
 #report .tk{break-inside:avoid;margin-bottom:8pt}
}

</style>
</head>

 {t:'sel',id:'a3.1',o:['Übersichtsfenster','Fantasiefenster','Stapelfenster','Durchblickfenster','Anlassfenster'],rows:[['A Buchhandlung Seitenwind: Schulranzen, Hefte, Füller und Bücher liegen auf kleinen Podesten, dazu eine Tafel mit „Willkommen, 1. Klasse!“',4],['B Weinhandlung Rebstock: nur Weinflaschen, in Reihen und Pyramiden gestapelt, darunter Kärtchen mit Preisen',2],['C Optiker Klarblick: Das Fenster ist bis auf zwei Brillen auf Glasstelen leer. Man sieht direkt in den hellen Laden hinein.',3],['D Modehaus Brise: Strandkorb, Sand, Sonnenschirm, Puppen in Sommerkleidern, Plakat „Endlich Urlaub“',1],['E Kaufhaus Nordlicht: von jeder Abteilung ein Artikel – Jacke, Topf, Kopfhörer, Spielzeug, Parfüm',0]]}]},
{k:'task',id:'a4',n:'Aufgabe 4',h:'Geführte Übung: Das Schaufenster von „Schuhhaus Kiel“',intro:'Frau Kiel ist unzufrieden: Kaum jemand bleibt vor ihrem Schaufenster stehen. Welcher Grundsatz wird verletzt?',ik:'a4.i',tip:'Gehe die zehn Grundsätze in der Tabelle durch. Welcher passt zur Beobachtung?',ex:'Verbesserungen: wenige, gut kombinierte Artikel · Blickfang nicht in die Mitte, Pyramide · auch tagsüber beleuchten · regelmäßig neu dekorieren · sauber und ordentlich · Preise zeigen (die Preisangabenverordnung gilt auch im Schaufenster).',items:[
 {t:'sel',id:'a4.1',o:['Weniger ist mehr','Blickfang setzen','Licht einsetzen','regelmäßig neu dekorieren','einwandfreier Zustand','Informationen zeigen','Emotionen wecken','dreidimensional gestalten'],rows:[['1 Das Fenster ist bis in die letzte Ecke mit Schuhen vollgestellt.',0],['2 Der Blickfang steht genau in der Mitte.',1],['3 Tagsüber ist das Licht im Fenster aus.',2],['4 Die Osterdeko steht Ende Mai noch im Fenster.',3],['5 Auf dem Boden liegen tote Fliegen, ein Preisschild ist umgekippt.',4],['6 Nirgends steht ein Preis.',5]]}]},
{k:'task',id:'a5',n:'Aufgabe 5',h:'Freie Übung: Ein Schaufenster planen',intro:'Wähle einen Anlass (z. B. Valentinstag, Halloween, Schulanfang, Ferienbeginn) und ein Geschäft, gern deinen Ausbildungsbetrieb. Skizziere das Schaufenster auf Papier (Blickfang, Podeste, Waren, Preise, Licht) und begründe hier deine Entscheidungen.',ik:'a5.i',tip:'Wähle zuerst den Anlass. Dann überlege: Was soll die Kunden zuerst anziehen?',ex:'Gute Antworten nennen den Typ mit Grund, den Blickfang mit Ort und zwei passende Grundsätze.',items:[

'title':['Cửa sổ trưng bày','El escaparate','A montra','Вітрина','መስኮት ምርኢት','Витрина','واجهة العرض','Vitrin'],
'can.0':['Kể mục tiêu và nguyên tắc thiết kế của Schaufenster (cửa sổ trưng bày).','Nombrar los objetivos y principios de diseño de los Schaufenster (escaparates).','Nomear os objetivos e princípios de design das Schaufenster (montras).','Назвати цілі й принципи оформлення Schaufenster (вітрин).','ዕላማታትን መስርሕ ምድላዋትን Schaufenster (መስኮት ምርኢት) ጥቀስ።','Назвать цели и принципы оформления Schaufenster (витрин).','ذكر أهداف ومبادئ تصميم Schaufenster (واجهات العرض).','Schaufenster’in (vitrin) amaçlarını ve tasarım ilkelerini söylemek.'],
'can.1':['Nhận biết và giải thích năm loại Schaufenster.','Reconocer y justificar los cinco tipos de Schaufenster.','Reconhecer e justificar os cinco tipos de Schaufenster.','Розпізнавати й обґрунтовувати п’ять типів Schaufenster.','ሓሙሽተ ዓይነታት Schaufenster ፍለይን ኣረጋግጽን።','Распознавать и обосновывать пять типов Schaufenster.','التعرّف على أنواع Schaufenster الخمسة وتعليلها.','Beş vitrin türünü tanımak ve gerekçelendirmek.'],
'a1.t':['Hãy nhớ lại ánh sáng, màu sắc và năm giác quan trong Modul 2.','Recuerda la luz, el color y los cinco sentidos del Modul 2.','Lembra a luz, a cor e os cinco sentidos do Modul 2.','Згадай світло, колір і п’ять органів чуття з Modul 2.','ብርሃን፣ ሕብርን ሓሙሽተ ስምዒታትን ካብ Modul 2 ዘክር።','Вспомни свет, цвет и пять органов чувств из Modul 2.','تذكّر الضوء واللون والحواس الخمس من Modul 2.','Modul 2’deki ışığı, rengi ve beş duyuyu hatırla.'],
'a1.e':['Xem lại Modul 2: ánh sáng, màu sắc và năm giác quan.','Repasa el Modul 2: iluminación, color y los cinco sentidos.','Revê o Modul 2: iluminação, cor e os cinco sentidos.','Повтори Modul 2: освітлення, колір і п’ять органів чуття.','Modul 2 ደጊምካ ርአ: ብርሃን፣ ሕብርን ሓሙሽተ ስምዒታትን።','Повтори Modul 2: освещение, цвет и пять органов чувств.','راجع Modul 2: الإضاءة واللون والحواس الخمس.','Modul 2’ye tekrar bak: aydınlatma, renk ve beş duyu.'],
'a1.1.q':['1.1 Loại chiếu sáng nào làm nổi bật từng món hàng?','1.1 ¿Qué iluminación resalta mercancías individuales?','1.1 Que iluminação destaca mercadorias individuais?','1.1 Яке освітлення виділяє окремі товари?','1.1 ኣየናይ ብርሃን ነናይ ሓደ ኣቕሓ የጉልሕ?','1.1 Какое освещение выделяет отдельные товары?','1.1 أي إضاءة تُبرز سلعًا فردية؟','1.1 Hangi aydınlatma tek tek ürünleri öne çıkarır?'],
'a1.2.q':['1.2 Màu nào có tác dụng kích thích và hợp với hàng khuyến mãi (Sonderangebote)?','1.2 ¿Qué color activa y encaja con las ofertas (Sonderangebote)?','1.2 Que cor ativa e combina com as promoções (Sonderangebote)?','1.2 Який колір активує й пасує до акцій (Sonderangebote)?','1.2 ኣየናይ ሕብሪ የተባብዕን ምስ Sonderangebote ይሰማማዕን?','1.2 Какой цвет активирует и подходит к акциям (Sonderangebote)?','1.2 أي لون ينشّط ويناسب العروض (Sonderangebote)؟','1.2 Hangi renk harekete geçirir ve Sonderangebote’ye (kampanyalar) uyar?'],
'a1.3.q':['1.3 Kể hai giác quan và mỗi giác quan một ví dụ cửa hàng tác động như thế nào.','1.3 Nombra dos sentidos y un ejemplo de cada uno de cómo la tienda los estimula.','1.3 Nomeia dois sentidos e um exemplo de cada de como a loja os estimula.','1.3 Назви два органи чуття й по прикладу, як магазин їх задіює.','1.3 ክልተ ስምዒታትን ነናይ ሓደ ኣብነትን ጥቀስ ድኳን ከመይ ከም ዝሰርሖም።','1.3 Назови два органа чувств и по примеру, как магазин их задействует.','1.3 اذكر حاستين ومثالًا لكل منهما على كيفية مخاطبة المتجر لهما.','1.3 İki duyu ve her biri için mağazanın ona nasıl hitap ettiğine bir örnek say.'],
'a2.h':['Bài thử 3 giây','La prueba de los 3 segundos','O teste dos 3 segundos','Тест на 3 секунди','ፈተና 3 ካልኣይ','Тест на 3 секунды','اختبار الثواني الثلاث','3 saniye testi'],
'a2.i':['Trong giờ học, cô giáo cho em xem một Schaufenster (cửa sổ trưng bày) trong ba giây. Sau đó ảnh bị ẩn đi. Hãy trả lời các câu hỏi.','En clase tu profesora te muestra un Schaufenster (escaparate) durante tres segundos. Luego se oculta la imagen. Responde las preguntas.','Na aula a professora mostra-te uma Schaufenster (montra) durante três segundos. Depois a imagem é escondida. Responde às perguntas.','На уроці вчителька показує тобі Schaufenster (вітрину) на три секунди. Потім зображення зникає. Дай відповіді на запитання.','ኣብ ትምህርቲ መምህርትካ ሓደ Schaufenster ሰለስተ ካልኣይ የርእየካ። ድሕሪኡ እቲ ስእሊ ይሕባእ። ነቲ ሕቶታት መልስ።','На уроке учительница показывает тебе Schaufenster (витрину) на три секунды. Потом изображение скрывается. Ответь на вопросы.','في الحصة تُريك المعلمة Schaufenster (واجهة عرض) لثلاث ثوانٍ. ثم تختفي الصورة. أجب عن الأسئلة.','Derste öğretmenin sana üç saniye boyunca bir Schaufenster (vitrin) gösterir. Sonra görüntü kaybolur. Soruları cevapla.'],
'a2.t':['Hãy nhớ điều em thấy ngay lập tức: một màu, vật gì đó to, vật gì đó sáng.','Piensa en lo que viste enseguida: un color, algo grande, algo brillante.','Pensa no que viste logo: uma cor, algo grande, algo brilhante.','Згадай, що ти помітив(ла) одразу: колір, щось велике, щось яскраве.','እቲ ብቕልጡፍ ዝረኣኻዮ ሕሰብ: ሕብሪ፣ ዓቢ ነገር፣ ብሩህ ነገር።','Вспомни, что ты заметил(а) сразу: цвет, что-то большое, что-то яркое.','تذكّر ما لاحظته فورًا: لون، شيء كبير، شيء لامع.','Hemen fark ettiğini düşün: bir renk, büyük bir şey, parlak bir şey.'],
'a2.e':['Người đi đường chỉ nhìn 3–4 giây. Vì vậy cửa sổ cần một Blickfang (điểm thu hút ánh nhìn).','Un transeúnte mira solo 3–4 segundos. Por eso el escaparate necesita un Blickfang (punto de atracción).','Um transeunte olha só 3–4 segundos. Por isso a montra precisa de um Blickfang (ponto de atração).','Перехожий дивиться лише 3–4 секунди. Тому вітрині потрібен Blickfang (привертач уваги).','ሓላፊ ኣብ መንገዲ 3–4 ካልኣይ ጥራይ ይጥምት። ስለዚ እቲ መስኮት Blickfang የድልዮ።','Прохожий смотрит лишь 3–4 секунды. Поэтому витрине нужен Blickfang (приковывающий взгляд элемент).','المارّ ينظر 3–4 ثوانٍ فقط. لذلك تحتاج الواجهة إلى Blickfang (عنصر جذب النظر).','Yoldan geçen kişi yalnızca 3–4 saniye bakar. Bu yüzden vitrinin bir Blickfang’a (dikkat çekici nokta) ihtiyacı var.'],
'a2.1.q':['2.1 Em nhớ được gì?','2.1 ¿Qué recuerdas?','2.1 De que te lembras?','2.1 Що ти запам’ятав(ла)?','2.1 እንታይ ዘክርካ?','2.1 Что ты запомнил(а)?','2.1 ماذا تتذكر؟','2.1 Ne hatırlıyorsun?'],
'a2.2.q':['2.2 Tại sao chính điều đó lại ở lại trong trí nhớ?','2.2 ¿Por qué se te quedó justo eso?','2.2 Porque é que ficou precisamente isso?','2.2 Чому запам’яталося саме це?','2.2 ስለምንታይ እዚ ጥራይ ኣብ ዝኽሪ ተሪፉ?','2.2 Почему запомнилось именно это?','2.2 لماذا بقي هذا بالذات في ذاكرتك؟','2.2 Neden tam olarak bu aklında kaldı?'],
'a2.3.q':['2.3 Điều đó có nghĩa gì với người trang trí Schaufenster?','2.3 ¿Qué significa eso para quien decora un Schaufenster?','2.3 O que significa isso para quem decora uma Schaufenster?','2.3 Що це означає для того, хто оформлює Schaufenster?','2.3 እዚ ነቲ Schaufenster ዘዳሉ እንታይ ማለት እዩ?','2.3 Что это значит для того, кто оформляет Schaufenster?','2.3 ماذا يعني هذا لمن يصمّم Schaufenster؟','2.3 Bu, Schaufenster’i düzenleyen kişi için ne anlama gelir?'],
'r1.h':['Đọc thêm: Cửa sổ trưng bày','Para leer: el escaparate','Para ler: a montra','Для читання: вітрина','ንምንባብ: መስኮት ምርኢት','Для чтения: витрина','للقراءة: واجهة العرض','Okumak için: Vitrin'],
'r1.s':['Schaufenster chỉ có ba đến bốn giây. Cần có Blickfang, thông điệp và giá.','Un Schaufenster tiene tres o cuatro segundos. Necesita Blickfang, mensaje y precios.','Uma Schaufenster tem três a quatro segundos. Precisa de Blickfang, mensagem e preços.','Schaufenster має три-чотири секунди. Потрібні Blickfang, повідомлення й ціни.','Schaufenster ሰለስተ ክሳብ ኣርባዕተ ካልኣይ ጥራይ ኣለዎ። Blickfang፣ መልእኽትን ዋጋታትን የድልዮ።','У Schaufenster три-четыре секунды. Нужны Blickfang, сообщение и цены.','أمام Schaufenster ثلاث إلى أربع ثوانٍ. يحتاج إلى Blickfang ورسالة وأسعار.','Schaufenster’in üç dört saniyesi var. Blickfang, mesaj ve fiyat gerekir.'],
'r1.qq':['Người đi đường nhìn Schaufenster khoảng bao lâu?','¿Cuánto tiempo mira un transeúnte un Schaufenster?','Quanto tempo olha um transeunte para uma Schaufenster?','Скільки часу перехожий дивиться на Schaufenster?','ሓላፊ መገዲ ንSchaufenster ክንደይ ግዜ ይጥምት?','Сколько времени прохожий смотрит на Schaufenster?','كم من الوقت ينظر المارّ إلى Schaufenster؟','Yoldan geçen biri Schaufenster’e yaklaşık ne kadar bakar?'],
'a3.h':['Bài tập có hướng dẫn: Đây là loại nào?','Ejercicio guiado: ¿de qué tipo es?','Exercício guiado: de que tipo é?','Керована вправа: який це тип?','ምምሕዳር ልምምድ: እዚ ኣየናይ ዓይነት እዩ?','Упражнение с подсказкой: какой это тип?','تمرين موجَّه: ما نوعها؟','Rehberli alıştırma: Bu hangi tür?'],
'a3.i':['Đọc từng mô tả. Đó là loại Schaufenster nào?','Lee cada descripción. ¿Qué tipo de Schaufenster es?','Lê cada descrição. Que tipo de Schaufenster é?','Прочитай кожен опис. Який це тип Schaufenster?','ነፍሲ ወከፍ መግለጺ ኣንብብ። ኣየናይ ዓይነት Schaufenster እዩ?','Прочитай каждое описание. Какой это тип Schaufenster?','اقرأ كل وصف. ما نوع Schaufenster؟','Her açıklamayı oku. Hangi Schaufenster türü?'],
'a3.t':['Tự hỏi: Có hiển thị một dịp đặc biệt không? Chỉ một nhóm hàng? Một cảnh? Nhìn thông vào cửa hàng? Mỗi thứ một món?','Pregúntate: ¿se muestra una ocasión? ¿Solo un grupo de mercancías? ¿Una escena? ¿Vista libre a la tienda? ¿Un artículo de cada sección?','Pergunta-te: mostra-se uma ocasião? Só um grupo de mercadorias? Uma cena? Vista livre para a loja? Um artigo de cada secção?','Запитай себе: показано привід? Лише одна група товарів? Сцена? Вільний огляд магазину? По одному товару з кожного відділу?','ባዕልኻ ሕተት: ኣጋጣሚ ይርአ ዶ? ሓደ ጉጅለ ኣቕሑት ጥራይ? ትእምርቲ? ናብ ድኳን ቀጥታ ምጥማት? ካብ ነፍሲ ወከፍ ክፍሊ ሓደ?','Спроси себя: показан ли повод? Только одна группа товаров? Сцена? Свободный вид в магазин? По одному товару из каждого отдела?','اسأل نفسك: هل تُعرض مناسبة؟ مجموعة بضائع واحدة فقط؟ مشهد؟ رؤية حرة إلى المتجر؟ سلعة من كل قسم؟','Kendine sor: Bir vesile mi gösteriliyor? Yalnızca bir ürün grubu mu? Bir sahne mi? Mağazaya açık görüş mü? Her bölümden bir ürün mü?'],
'a3.e':['Dịp đặc biệt → Anlassfenster · chỉ một nhóm hàng → Stapelfenster · nhìn thông vào cửa hàng → Durchblickfenster · cảnh theo một ý tưởng → Fantasiefenster · mỗi bộ phận một món → Übersichtsfenster.','Ocasión → Anlassfenster · solo un grupo de mercancías → Stapelfenster · vista a la tienda → Durchblickfenster · escena con idea central → Fantasiefenster · un artículo de cada sección → Übersichtsfenster.','Ocasião → Anlassfenster · só um grupo de mercadorias → Stapelfenster · vista para a loja → Durchblickfenster · cena com ideia central → Fantasiefenster · um artigo de cada secção → Übersichtsfenster.','Привід → Anlassfenster · одна група товарів → Stapelfenster · огляд магазину → Durchblickfenster · сцена з провідною ідеєю → Fantasiefenster · по товару з кожного відділу → Übersichtsfenster.','ኣጋጣሚ → Anlassfenster · ሓደ ጉጅለ ኣቕሑት → Stapelfenster · ናብ ድኳን ምጥማት → Durchblickfenster · ትእምርቲ ምስ ሓሳብ → Fantasiefenster · ካብ ነፍሲ ወከፍ ክፍሊ ሓደ → Übersichtsfenster።','Повод → Anlassfenster · одна группа товаров → Stapelfenster · вид в магазин → Durchblickfenster · сцена с идеей → Fantasiefenster · по товару из каждого отдела → Übersichtsfenster.','مناسبة → Anlassfenster · مجموعة بضائع واحدة → Stapelfenster · رؤية المتجر → Durchblickfenster · مشهد بفكرة → Fantasiefenster · سلعة من كل قسم → Übersichtsfenster.','Vesile → Anlassfenster · tek ürün grubu → Stapelfenster · mağazaya görüş → Durchblickfenster · fikirli sahne → Fantasiefenster · her bölümden bir ürün → Übersichtsfenster.'],
'a4.h':['Bài tập có hướng dẫn: Cửa sổ của „Schuhhaus Kiel“ (cửa hàng giày Kiel)','Ejercicio guiado: el escaparate de «Schuhhaus Kiel» (zapatería Kiel)','Exercício guiado: a montra da «Schuhhaus Kiel» (sapataria Kiel)','Керована вправа: вітрина «Schuhhaus Kiel» (взуттєвий магазин Kiel)','ምምሕዳር ልምምድ: መስኮት «Schuhhaus Kiel» (ድኳን ሳእኒ Kiel)','Упражнение с подсказкой: витрина «Schuhhaus Kiel» (обувной магазин Kiel)','تمرين موجَّه: واجهة «Schuhhaus Kiel» (متجر أحذية كيل)','Rehberli alıştırma: «Schuhhaus Kiel» (Kiel ayakkabı mağazası) vitrini'],
'a4.i':['Bà Kiel không hài lòng: hầu như không ai dừng lại trước cửa sổ của bà. Nguyên tắc nào bị vi phạm?','La Sra. Kiel está descontenta: casi nadie se detiene ante su escaparate. ¿Qué principio se incumple?','A Sra. Kiel está insatisfeita: quase ninguém pára à frente da sua montra. Que princípio é violado?','Пані Kiel незадоволена: майже ніхто не зупиняється перед її вітриною. Який принцип порушено?','ወይዘሮ Kiel ዘይተሓጎሰት እያ: ቅድሚ መስኮታ ዝደው ዝብል ሰብ የለን። ኣየናይ መስርሕ ተጣሒሱ?','Госпожа Kiel недовольна: почти никто не останавливается у её витрины. Какой принцип нарушен?','السيدة Kiel غير راضية: لا أحد يتوقف أمام واجهتها تقريبًا. أي مبدأ تم خرقه؟','Bayan Kiel memnun değil: Vitrininin önünde neredeyse kimse durmuyor. Hangi ilke ihlal ediliyor?'],
'a4.t':['Xem lần lượt mười nguyên tắc trong bảng. Nguyên tắc nào hợp với quan sát?','Repasa los diez principios de la tabla. ¿Cuál encaja con la observación?','Percorre os dez princípios da tabela. Qual combina com a observação?','Пройди десять принципів у таблиці. Який пасує до спостереження?','ነተን ዓሰርተ መስርሕ ኣብ ሰንጠረዥ ሕለፍ። ኣየናይ ምስ ምስትውዓል ይሰማማዕ?','Пройди десять принципов в таблице. Какой подходит к наблюдению?','مرّ على المبادئ العشرة في الجدول. أيها يناسب الملاحظة؟','Tablodaki on ilkeyi gözden geçir. Hangisi gözleme uyuyor?'],
'a4.e':['Cải thiện: ít món, phối hợp tốt · Blickfang không ở giữa, xếp hình kim tự tháp · bật đèn cả ban ngày · trang trí lại thường xuyên · sạch và gọn · ghi giá (Preisangabenverordnung cũng áp dụng cho Schaufenster).','Mejoras: pocos artículos bien combinados · Blickfang no en el centro, pirámide · luz también de día · decorar con regularidad · limpio y ordenado · mostrar precios (la Preisangabenverordnung también vale en el escaparate).','Melhorias: poucos artigos bem combinados · Blickfang fora do centro, pirâmide · luz também de dia · decorar regularmente · limpo e arrumado · mostrar preços (a Preisangabenverordnung também vale na montra).','Покращення: кілька добре підібраних товарів · Blickfang не в центрі, піраміда · світло й удень · регулярно оновлювати декор · чисто й охайно · показувати ціни (Preisangabenverordnung діє й для вітрин).','ምሕሻል: ውሑዳት ዝተሰማምዑ ኣቕሑት · Blickfang ኣብ ማእከል ዘይኮነ፣ ፒራሚድ · ብመዓልቲ’ውን ብርሃን · ብተደጋጋሚ ዳግም ምድላው · ጽሩይን ስሩዕን · ዋጋ ምርኣይ።','Улучшения: мало хорошо сочетаемых товаров · Blickfang не в центре, пирамида · свет и днём · регулярно обновлять декор · чисто и аккуратно · показывать цены (Preisangabenverordnung действует и для витрин).','التحسينات: قطع قليلة منسقة جيدًا · Blickfang ليس في الوسط، شكل هرم · إضاءة نهارًا أيضًا · تجديد الديكور بانتظام · نظافة وترتيب · إظهار الأسعار (Preisangabenverordnung تنطبق على الواجهة أيضًا).','İyileştirmeler: az sayıda iyi uyumlu ürün · Blickfang ortada değil, piramit · gündüz de ışık · düzenli yeniden dekor · temiz ve düzenli · fiyat göster (Preisangabenverordnung vitrinde de geçerlidir).'],
'a5.h':['Bài tập tự do: Lập kế hoạch một Schaufenster','Ejercicio libre: planificar un Schaufenster','Exercício livre: planear uma Schaufenster','Вільна вправа: сплануй Schaufenster','ናጻ ልምምድ: Schaufenster ምዕላል','Свободное упражнение: спланируй Schaufenster','تمرين حر: خطّط لـ Schaufenster','Serbest alıştırma: Bir Schaufenster planla'],
'a5.i':['Chọn một dịp (ví dụ Valentinstag, Halloween, Schulanfang, Ferienbeginn) và một cửa hàng, tốt nhất là nơi học nghề. Phác thảo Schaufenster trên giấy (Blickfang, bục, hàng, giá, ánh sáng) và giải thích quyết định ở đây.','Elige una ocasión (p. ej. Valentinstag, Halloween, Schulanfang, Ferienbeginn) y una tienda, mejor tu empresa. Dibuja el Schaufenster en papel (Blickfang, podios, mercancía, precios, luz) y justifica aquí tus decisiones.','Escolhe uma ocasião (p. ex. Valentinstag, Halloween, Schulanfang, Ferienbeginn) e uma loja, de preferência a tua empresa. Esboça a Schaufenster em papel (Blickfang, pódios, mercadoria, preços, luz) e justifica aqui as tuas decisões.','Обери привід (напр. Valentinstag, Halloween, Schulanfang, Ferienbeginn) і магазин, краще своє підприємство. Намалюй Schaufenster на папері (Blickfang, подіуми, товар, ціни, світло) і обґрунтуй тут свої рішення.','ሓደ ኣጋጣሚ (ንኣብነት Valentinstag, Halloween, Schulanfang, Ferienbeginn) ን ሓደ ድኳንን ምረጽ፣ ይግበኣካ ቦታ ልምምድካ። Schaufenster ኣብ ወረቐት ስኣል፣ ኣብዚ ድማ ውሳኔታትካ ኣረጋግጽ።','Выбери повод (напр. Valentinstag, Halloween, Schulanfang, Ferienbeginn) и магазин, лучше своё предприятие. Нарисуй Schaufenster на бумаге (Blickfang, подиумы, товар, цены, свет) и обоснуй здесь свои решения.','اختر مناسبة (مثل Valentinstag وHalloween وSchulanfang وFerienbeginn) ومتجرًا، ويفضّل شركة تدريبك. ارسم Schaufenster على الورق (Blickfang، منصّات، بضائع، أسعار، إضاءة) وعلّل قراراتك هنا.','Bir vesile seç (ör. Valentinstag, Halloween, Schulanfang, Ferienbeginn) ve bir mağaza, tercihen eğitim işletmen. Schaufenster’i kağıda çiz (Blickfang, podyum, mal, fiyat, ışık) ve kararlarını burada gerekçelendir.'],
'a5.t':['Chọn dịp trước. Rồi nghĩ: Điều gì phải thu hút khách đầu tiên?','Elige primero la ocasión. Luego piensa: ¿qué debe atraer primero a los clientes?','Escolhe primeiro a ocasião. Depois pensa: o que deve atrair primeiro os clientes?','Спершу обери привід. Потім подумай: що має першим привабити клієнтів?','ቀዳምነት ኣጋጣሚ ምረጽ። ድሕሪኡ ሕሰብ: ዓሚላት ቀዳምነት እንታይ ክስሕብ ኣለዎ?','Сначала выбери повод. Потом подумай: что должно привлечь клиентов в первую очередь?','اختر المناسبة أولًا. ثم فكّر: ما الذي يجب أن يجذب الزبائن أولًا؟','Önce vesileyi seç. Sonra düşün: Müşterileri önce ne çekmeli?'],
'a5.e':['Câu trả lời tốt nêu loại cửa sổ kèm lý do, Blickfang kèm vị trí và hai nguyên tắc phù hợp.','Una buena respuesta nombra el tipo con motivo, el Blickfang con lugar y dos principios adecuados.','Uma boa resposta nomeia o tipo com motivo, o Blickfang com local e dois princípios adequados.','Хороша відповідь називає тип із причиною, Blickfang із місцем і два доречні принципи.','ጽቡቕ መልሲ ዓይነት ምስ ምኽንያት፣ Blickfang ምስ ቦታ ከምኡ ክልተ ዝግባእ መስርሕ ይጥቅስ።','Хороший ответ называет тип с причиной, Blickfang с местом и два подходящих принципа.','الجواب الجيد يذكر النوع مع السبب، وBlickfang مع المكان، ومبدأين مناسبين.','İyi cevap türü nedeniyle, Blickfang’ı yeriyle ve iki uygun ilkeyi söyler.'],
'a5.1.q':['5.1 Loại Schaufenster nào – và tại sao?','5.1 ¿Qué tipo de Schaufenster – y por qué?','5.1 Que tipo de Schaufenster – e porquê?','5.1 Який тип Schaufenster – і чому?','5.1 ኣየናይ ዓይነት Schaufenster – ስለምንታይ?','5.1 Какой тип Schaufenster – и почему?','5.1 أي نوع من Schaufenster – ولماذا؟','5.1 Hangi Schaufenster türü – ve neden?'],
'a5.2.q':['5.2 Blickfang (điểm thu hút) – là gì và ở đâu?','5.2 Blickfang (punto de atracción) – ¿qué y dónde?','5.2 Blickfang (ponto de atração) – o quê e onde?','5.2 Blickfang (привертач уваги) – що і де?','5.2 Blickfang – እንታይን ኣበይን?','5.2 Blickfang (приковывающий взгляд элемент) – что и где?','5.2 Blickfang (عنصر جذب النظر) – ما هو وأين؟','5.2 Blickfang (dikkat çekici nokta) – ne ve nerede?'],
'a5.3.q':['5.3 Em đã đặc biệt chú ý hai nguyên tắc nào?','5.3 ¿Qué dos principios has tenido especialmente en cuenta?','5.3 Que dois princípios tiveste especialmente em conta?','5.3 Які два принципи ти врахував(ла) особливо?','5.3 ኣየኖት ክልተ መስርሕ ፍሉይ ጠመትካዮም?','5.3 Какие два принципа ты учёл(а) особенно?','5.3 ما المبدآن اللذان راعيتهما بشكل خاص؟','5.3 Özellikle hangi iki ilkeye dikkat ettin?'],
'a6.e':['Nennen (kể tên): từ khóa là đủ. Beschreiben (mô tả): tên loại và đặc điểm của nó.','Nennen (nombrar): bastan palabras clave. Beschreiben (describir): nombre del tipo y su rasgo.','Nennen (nomear): bastam palavras-chave. Beschreiben (descrever): nome do tipo e a sua característica.','Nennen (назвати): досить ключових слів. Beschreiben (описати): назва типу та його ознака.','Nennen (ምጥቃስ): ቃላት ይኣክሉ። Beschreiben (ምግላጽ): ስም ዓይነትን ባህሪኡን።','Nennen (назвать): хватит ключевых слов. Beschreiben (описать): название типа и его признак.','Nennen (اذكر): تكفي الكلمات المفتاحية. Beschreiben (صف): اسم النوع وميزته.','Nennen (say): anahtar kelimeler yeter. Beschreiben (tanımla): türün adı ve özelliği.'],
'a6.t':['Nennen (kể tên) = chỉ từ khóa. Beschreiben (mô tả) = một đến hai câu với một đặc điểm.','Nennen (nombrar) = solo palabras clave. Beschreiben (describir) = una o dos frases con un rasgo.','Nennen (nomear) = só palavras-chave. Beschreiben (descrever) = uma ou duas frases com uma característica.','Nennen (назвати) = лише ключові слова. Beschreiben (описати) = одне-два речення з ознакою.','Nennen = ቃላት ጥራይ። Beschreiben = ሓደ ወይ ክልተ ሓረግ ምስ ባህሪ።','Nennen (назвать) = только ключевые слова. Beschreiben (описать) = одно-два предложения с признаком.','Nennen (اذكر) = كلمات مفتاحية فقط. Beschreiben (صف) = جملة أو جملتان مع ميزة.','Nennen (say) = sadece anahtar kelimeler. Beschreiben (tanımla) = bir iki cümle ve bir özellik.'],
'a6.1.q':['6.1 Kể ba nhiệm vụ của một Schaufenster. (3 điểm)','6.1 Nombre tres funciones de un Schaufenster. (3 puntos)','6.1 Nomeie três funções de uma Schaufenster. (3 pontos)','6.1 Назвіть три завдання Schaufenster. (3 бали)','6.1 ሰለስተ ዕማማት ናይ Schaufenster ጥቀስ። (3 ነጥቢ)','6.1 Назовите три задачи Schaufenster. (3 балла)','6.1 اذكر ثلاث وظائف لـ Schaufenster. (3 نقاط)','6.1 Bir Schaufenster’in üç görevini say. (3 puan)'],
'a6.2.q':['6.2 Mô tả hai loại Schaufenster. (4 điểm)','6.2 Describa dos tipos de Schaufenster. (4 puntos)','6.2 Descreva dois tipos de Schaufenster. (4 pontos)','6.2 Опишіть два типи Schaufenster. (4 бали)','6.2 ክልተ ዓይነታት Schaufenster ግለጽ። (4 ነጥቢ)','6.2 Опишите два типа Schaufenster. (4 балла)','6.2 صف نوعين من Schaufenster. (4 نقاط)','6.2 İki Schaufenster türünü tanımla. (4 puan)'],
'a6.3.q':['6.3 Kể ba nguyên tắc cần chú ý khi thiết kế. (3 điểm)','6.3 Nombre tres principios que hay que tener en cuenta al diseñar. (3 puntos)','6.3 Nomeie três princípios a ter em conta no design. (3 pontos)','6.3 Назвіть три принципи, які слід враховувати при оформленні. (3 бали)','6.3 ሰለስተ መስርሕ ኣብ ዲዛይን ክጥመቱ ዘለዎም ጥቀስ። (3 ነጥቢ)','6.3 Назовите три принципа, которые нужно учитывать при оформлении. (3 балла)','6.3 اذكر ثلاثة مبادئ يجب مراعاتها عند التصميم. (3 نقاط)','6.3 Tasarımda dikkat edilmesi gereken üç ilkeyi say. (3 puan)'],
'a7.t':['7.1: Nghĩ đến việc chọn lọc, nhóm hàng, độ cao khác nhau và khoảng trống. 7.2: Liệt kê ưu và nhược điểm rồi quyết định.','7.1: Piensa en selección, grupos, alturas y espacio libre. 7.2: Reúne ventajas y desventajas y decide.','7.1: Pensa em seleção, grupos, alturas e espaço livre. 7.2: Reúne vantagens e desvantagens e decide.','7.1: Подумай про добір, групи, висоти й вільний простір. 7.2: Збери переваги й недоліки, потім вирішуй.','7.1: ምምራጽ፣ ጉጅለታት፣ ርኽቦታት ከምኡ ባዶ ቦታ ሕሰብ። 7.2: ረብሓታትን ጉድለታትን ኣኽብ፣ ድሕሪኡ ወስን።','7.1: Подумай про отбор, группы, высоты и свободное место. 7.2: Собери плюсы и минусы, потом реши.','7.1: فكّر في الاختيار والمجموعات والارتفاعات والمساحة الفارغة. 7.2: اجمع المزايا والعيوب ثم قرّر.','7.1: Seçimi, grupları, yükseklikleri ve boşluğu düşün. 7.2: Artıları ve eksileri topla, sonra karar ver.'],
'a7.e':['Một nhận định tốt nêu ưu điểm, nhược điểm và giải thích quyết định.','Un buen juicio nombra ventajas y desventajas y justifica la decisión.','Um bom juízo nomeia vantagens e desvantagens e justifica a decisão.','Хороша оцінка називає переваги й недоліки й обґрунтовує рішення.','ጽቡቕ ፍርዲ ረብሓታትን ጉድለታትን ይጥቅስን ውሳኔ ከኣ የረጋግጽን።','Хорошая оценка называет плюсы и минусы и обосновывает решение.','الحكم الجيد يذكر المزايا والعيوب ويعلّل القرار.','İyi bir değerlendirme artıları ve eksileri söyler ve kararı gerekçelendirir.'],
'a7.1.q':['7.1 Nguyên tắc 5 là „Weniger ist mehr“ (ít là nhiều). Nhưng Übersichtsfenster phải cho thấy càng nhiều sản phẩm càng tốt. Giải thích làm sao để nó không bị quá tải.','7.1 El principio 5 es «Weniger ist mehr» (menos es más). Pero el Übersichtsfenster debe mostrar mucho surtido. Explica cómo puede no parecer sobrecargado.','7.1 O princípio 5 é «Weniger ist mehr» (menos é mais). Mas o Übersichtsfenster deve mostrar muito do sortido. Explica como pode não parecer sobrecarregado.','7.1 Принцип 5 — «Weniger ist mehr» (менше — краще). Але Übersichtsfenster має показувати багато асортименту. Поясни, як він може не виглядати перевантаженим.','7.1 መስርሕ 5 «Weniger ist mehr» እዩ። እንተኾነ Übersichtsfenster ብዙሕ ካብ ሶርቲመንት ክርኢ ኣለዎ። ከይተጸንተወ ከመይ ከም ዝርአ ግለጽ።','7.1 Принцип 5 — «Weniger ist mehr» (меньше — больше). Но Übersichtsfenster должна показывать много ассортимента. Объясни, как она может не выглядеть перегруженной.','7.1 المبدأ 5 هو «Weniger ist mehr» (الأقل أكثر). لكن Übersichtsfenster يجب أن يُظهر الكثير من التشكيلة. اشرح كيف لا يبدو مزدحمًا.','7.1 5. ilke «Weniger ist mehr» (az çoktur). Ama Übersichtsfenster ürün çeşidinin çoğunu göstermeli. Yine de aşırı yüklü görünmemesini açıkla.'],
'a7.2.q':['7.2 Ngày càng nhiều cửa hàng đặt màn hình lớn với hình ảnh thay đổi ở Schaufenster. Đánh giá „digitale Schaufenster“ (cửa sổ số): mỗi loại hai ưu và hai nhược điểm, rồi một kết luận có lý do.','7.2 Cada vez más tiendas muestran en el Schaufenster pantallas grandes con imágenes cambiantes. Valora estos «digitale Schaufenster»: dos ventajas y dos desventajas y un juicio justificado.','7.2 Cada vez mais lojas mostram na Schaufenster ecrãs grandes com imagens que mudam. Avalia estas «digitale Schaufenster»: duas vantagens e duas desvantagens e um juízo fundamentado.','7.2 Дедалі більше магазинів ставлять у Schaufenster великі екрани зі змінними картинками. Оціни ці «digitale Schaufenster»: по дві переваги й недоліки та обґрунтований висновок.','7.2 ብዙሓት ድኳናት ኣብ Schaufenster ዓበይቲ ስክሪናት ምስ ዝቕየሩ ስእልታት የቐምጡ። እዞም «digitale Schaufenster» ገምግሞም: ክልተ ረብሓታትን ክልተ ጉድለታትን፣ ድሕሪኡ ብምኽንያት ዝተኸየደ ውሳኔ።','7.2 Всё больше магазинов ставят в Schaufenster большие экраны со сменяющимися картинками. Оцени такие «digitale Schaufenster»: по два плюса и минуса и обоснованный вывод.','7.2 تضع متاجر أكثر فأكثر شاشات كبيرة بصور متغيرة في Schaufenster. قيّم هذه «digitale Schaufenster»: ميزتان وعيبان ثم حكم معلَّل.','7.2 Giderek daha çok mağaza Schaufenster’de değişen görüntülü büyük ekranlar gösteriyor. Bu «digitale Schaufenster»’ı değerlendir: ikişer artı ve eksi, sonra gerekçeli bir karar.'],
'v1.1.q':['V1 Tại sao Schaufenster cần Blickfang rõ ràng và thông điệp đơn giản?','V1 ¿Por qué un Schaufenster necesita un Blickfang claro y un mensaje sencillo?','V1 Porque é que uma Schaufenster precisa de um Blickfang claro e de uma mensagem simples?','V1 Чому Schaufenster потрібні чіткий Blickfang і просте повідомлення?','V1 ስለምንታይ Schaufenster ንጹር Blickfangን ቀሊል መልእኽትን የድልዮ?','V1 Почему Schaufenster нужны чёткий Blickfang и простое сообщение?','V1 لماذا يحتاج Schaufenster إلى Blickfang واضح ورسالة بسيطة؟','V1 Schaufenster neden net bir Blickfang’a ve basit bir mesaja ihtiyaç duyar?'],
'v1.2.q':['V2 Giải thích: Tại sao phải trang trí lại Schaufenster thường xuyên?','V2 Justifica: ¿por qué hay que redecorar el Schaufenster con regularidad?','V2 Justifica: porque é que é preciso redecorar a Schaufenster regularmente?','V2 Обґрунтуй: чому Schaufenster треба регулярно оформлювати заново?','V2 ኣረጋግጽ: ስለምንታይ Schaufenster ብተደጋጋሚ ዳግም ክዳሎ ኣለዎ?','V2 Обоснуй: почему Schaufenster нужно регулярно оформлять заново?','V2 علّل: لماذا يجب تجديد ديكور Schaufenster بانتظام؟','V2 Gerekçelendir: Schaufenster neden düzenli olarak yeniden dekore edilmelidir?'],

/* Gemeinsame Bedienung aller digitalen Arbeitsblätter (Lernfeld 4). Erwartet: SHEET, TR, UI */
(function(){
'use strict';
var LANGS=[['de','Deutsch'],['vi','Tiếng Việt'],['es','Español'],['pt','Português'],['uk','Українська'],['ti','ትግርኛ'],['ru','Русский'],['ar','العربية'],['tr','Türkçe']];
var LI=LANGS.map(function(l){return l[0]});
var RTL={ar:1};
var FS=[100,115,130,150];
var KEY='tu.lf4.'+SHEET.id+'.v1';
var missing={};
var S;
if(typeof TRC!=='undefined')for(var kk in TRC)if(!TR[kk])TR[kk]=TRC[kk];
function fresh(){return {name:'',date:new Date().toISOString().slice(0,10),lang:'de',lvl:'b',fs:0,a:{},tip:{},chk:{},mk:{},rc:{},sub:false,open:false,sol:{}}}
function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
var st;function save(){clearTimeout(st);st=setTimeout(saveNow,350)}
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function wipe(){try{localStorage.removeItem(KEY)}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function li(){return LI.indexOf(S.lang)}
/* Übersetzung */
function trText(k){if(S.lang==='de')return '';var a=TR[k];var t=a&&a[li()-1];if(!t){missing[S.lang+':'+k]=1;return ''}return t}
function tl(k){if(S.lang==='de')return '';var t=trText(k);if(!t)return '<div class="tr miss">'+esc(UI.mis[li()])+'</div>';return '<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(t)+'</div>'}
function tlo(k){if(S.lang==='de'||!TR[k])return '';return tl(k)}
function U(k){var a=UI[k];return a[li()]||a[0]}
function B(k){var g=UI[k][0];var t=S.lang!=='de'?UI[k][li()]:'';return esc(g)+(t?'<small class="b" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(t)+'</small>':'')}
/* Sichtbarkeit */
function vis(b){return b.lvl!=='v'||S.lvl==='v'}
function items(b){return (b.items||[]).filter(function(i){return i.t!=='note'&&i.t!=='est'})}
function A(id){return S.a[id]}
/* Bearbeitet? */
function answered(it){
 var v=A(it.id);
 switch(it.t){
 case 'free':return !!(v&&v.t&&v.t.trim());
 case 'mc':return v!=null;
 case 'calc':return !!(v&&String(v).trim());
 case 'gap':case 'table':case 'tf':case 'sel':var n=(it.rows||it.a).length;return !!v&&v.filter(function(x){return x!=null&&x!==''}).length>=n;
 }return false}
function units(){var u=[];SHEET.blocks.forEach(function(b){if(b.k==='read'){u.push({id:b.id,done:!!S.chk[b.id]&&A(b.id+'.q')!=null})}else if(vis(b)){items(b).forEach(function(it){u.push({id:it.id,done:answered(it)})})}});return u}
function updProg(){var u=units();var d=u.filter(function(x){return x.done}).length;var p=u.length?Math.round(100*d/u.length):0;var f=document.getElementById('progf');if(f){f.style.width=p+'%';document.getElementById('progt').textContent=U('progress')+': '+d+' / '+u.length+' '+U('done')+' ('+p+' %)'}
 var q=p===100&&!S.pdone;if(q){S.pdone=1;toast('🎉 100 %')}}
/* Bewertung */
function num(s){var t=String(s).replace(/\s/g,'').replace(/€|%|cm|g|kg|ml|l|m/gi,'').replace(',','.');var x=parseFloat(t);return isNaN(x)?null:x}
function grade(it){
 var v=A(it.id),got=0,max=0,rows=[];
 switch(it.t){
 case 'free':max=it.pts||1;var s=v&&v.s!=null?v.s:null;got=s==null?0:[0,.5,1][s]*max;break;
 case 'mc':max=it.pts||1;if(v!=null&&v===it.a)got=max;break;
 case 'calc':max=it.pts||1;var n=num(v==null?'':v);if(n!=null&&Math.abs(n-it.a)<=(it.tol==null?0.005:it.tol))got=max;break;
 case 'table':case 'sel':it.rows.forEach(function(r,i){max++;var ok=v&&v[i]===r[1];if(ok)got++;rows.push(ok)});break;
 case 'tf':it.rows.forEach(function(r,i){max++;var ok=v&&v[i]===r[1];if(ok)got++;rows.push(ok)});break;
 case 'gap':it.a.forEach(function(a,i){max++;var ok=v&&v[i]===a;if(ok)got++;rows.push(ok)});break}
 return {got:got,max:max,rows:rows}}
function totals(){var g=0,m=0,bg=0;SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b))return;items(b).forEach(function(it){if(it.t==='free'&&b.noscore)return;var r=grade(it);if(b.lvl==='v')bg+=r.got;else{g+=r.got;m+=r.max}})});return {g:g,m:m,b:bg}}
function r1(x){return (Math.round(x*10)/10).toString().replace('.',',')}
/* Rendering */
function tipHTML(b){if(!b.tip)return '';return '<button class="tipb noprint" data-act="tip" data-id="'+b.id+'" aria-label="'+esc(UI.tip[0])+'">💡 '+esc(U('tip'))+'</button>'}
function tipBox(b){if(!b.tip||!S.tip[b.id])return '';return '<div class="tipbox">💡 '+esc(b.tip)+tl(b.tk||b.id+'.t')+'</div>'}
function opts(list,sel,cls,act,id,extra){return '<div class="opts">'+list.map(function(o,i){var c=cls?cls(i):'';return '<button class="opt'+(sel===i?' on':'')+(c?' '+c:'')+'" data-act="'+act+'" data-id="'+id+'" data-i="'+i+'">'+esc(o)+'</button>'}).join('')+'</div>'}
function fbBox(kind,html){return '<div class="fb '+kind+'">'+html+'</div>'}
function showFb(b){return S.chk[b.id]||S.sub}
function renderItem(b,it){
 var v=A(it.id),fb=showFb(b),h='',g,q=it.q?'<div class="q">'+esc(it.q)+'</div>'+(it.nq?'':tl(it.qk||it.id+'.q')):'';
 switch(it.t){
 case 'note':return '<div class="sit">'+it.html+'</div>';
 case 'est':return renderEst(it);
 case 'free':
  v=v||{};h=q+'<textarea class="in" rows="4" data-act="txt" data-id="'+it.id+'" placeholder="…">'+esc(v.t||'')+'</textarea>';
  h+='<div class="noprint"><button class="btn sec" data-act="sol" data-id="'+it.id+'">'+B('sol')+'</button></div>';
  if(S.sol[it.id]||fb&&v.t){h+='<div class="model"><b>'+esc(UI.model[0])+'</b>'+it.model+'</div>';
   h+='<div class="q">'+esc(UI.selfq[0])+'</div>'+tl_ui('selfq')+'<div class="row2">'+[['selfyes',2],['selfpart',1],['selfno',0]].map(function(p){return '<button class="btn gray" style="'+(v.s===p[1]&&v.s!=null?'background:#e3f0f6;border-color:#2f6f8f':'')+'" data-act="self" data-id="'+it.id+'" data-i="'+p[1]+'">'+B(p[0])+'</button>'}).join('')+'</div>'}
  break;
 case 'mc':
  g=grade(it);h=q+opts(it.o,v,fb?function(i){return i===it.a?'ok':(v===i?'no':'')}:null,'mc',it.id);
  if(fb)h+=fbBox(g.got?'ok':'no',g.got?esc(U('right')):esc(U('wrong'))+' '+esc(UI.correctis[0])+' <b>'+esc(it.o[it.a])+'</b>');
  break;
 case 'calc':
  g=grade(it);h=q+'<div class="row2"><input class="in" style="max-width:12rem" inputmode="decimal" autocomplete="off" data-act="calc" data-id="'+it.id+'" value="'+esc(v||'')+'"><b>'+esc(it.unit||'')+'</b></div>';
  if(fb){h+=fbBox(g.got?'ok':'no',(g.got?esc(U('right')):esc(U('wrong'))+' '+esc(UI.correctis[0])+' <b>'+r1(it.a)+' '+esc(it.unit||'')+'</b>')+'<div><b>'+esc(UI.steps[0])+':</b><br>'+it.steps.map(esc).join('<br>')+'</div>'+tl_ui('steps'))}
  break;
 case 'table':
  g=grade(it);h=q+'<table class="tbl"><tr><th>'+(it.hd||'')+'</th>'+it.cols.map(function(c){return '<th class="c" title="'+esc(c[1]||'')+'">'+esc(c[0])+'</th>'}).join('')+'</tr>'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+'</td>'+it.cols.map(function(c,j){var cl=sel===j?' on':'';if(fb){if(j===r[1])cl+=sel===j?' ok':' sol';else if(sel===j)cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tb" data-id="'+it.id+'" data-r="'+i+'" data-i="'+j+'" aria-label="'+esc(c[1]||c[0])+'">'+esc(c[0])+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(it.legend)h+='<div class="meta">'+esc(it.legend)+'</div>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'tf':
  g=grade(it);h=q+'<table class="tbl">'+it.rows.map(function(r,i){var sel=v&&v[i];var rc=fb?(g.rows[i]?' class="rok"':' class="rno"'):'';
   return '<tr'+rc+'><td>'+esc(r[0])+'</td>'+[[true,'✔'],[false,'✘']].map(function(c){var cl=sel===c[0]?' on':'';if(fb){if(c[0]===r[1])cl+=sel===c[0]?' ok':' sol';else if(sel===c[0])cl+=' no'}return '<td class="c"><button class="ch'+cl+'" data-act="tf" data-id="'+it.id+'" data-r="'+i+'" data-i="'+(c[0]?1:0)+'">'+c[1]+'</button></td>'}).join('')+'</tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'sel':
  g=grade(it);h=q+'<table class="tbl">'+it.rows.map(function(r,i){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';
   return '<tr><td>'+esc(r[0])+'</td><td><select class="in gapsel'+cl+'" data-act="sel" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.o.map(function(o,j){return '<option value="'+j+'"'+(sel===j?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'+(fb&&!g.rows[i]?'<div class="meta">'+esc(UI.correctis[0])+' <b>'+esc(it.o[r[1]])+'</b></div>':'')+'</td></tr>'}).join('')+'</table>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max);
  break;
 case 'gap':
  g=grade(it);var k=0;h=q+'<div class="gaptxt">'+it.text.split('___').map(function(p,i,arr){var s=esc(p);if(i<arr.length-1){var sel=v&&v[i];var cl=fb?(g.rows[i]?' ok':' no'):'';s+='<select class="gapsel'+cl+'" data-act="gap" data-id="'+it.id+'" data-r="'+i+'"><option value="">…</option>'+it.bank.map(function(o){return '<option'+(sel===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}return s}).join('')+'</div>';
  if(fb)h+=fbBox(g.got===g.max?'ok':g.got?'part':'no',g.got+' / '+g.max+(g.got<g.max?' — '+esc(UI.correctis[0])+' <b>'+it.a.map(esc).join(' · ')+'</b>':''));
  break}
 if(fb&&it.ex&&it.t!=='free')h+='<div class="meta">'+esc(it.ex)+'</div>'+tl(it.id+'.e');
 return '<div class="item">'+h+'</div>'}
function tl_ui(k){if(S.lang==='de')return '';return '<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U(k))+'</div>'}
function renderEst(it){var v=A(it.id)||{};var t=totals();return '<div class="row2"><label>'+B('estl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="e" value="'+esc(v.e||'')+'"></div><div class="row2"><label>'+B('resl')+'</label><input class="in" style="max-width:8rem" inputmode="numeric" data-act="est" data-id="'+it.id+'" data-f="r" value="'+esc(v.r||'')+'"></div>'+(v.e&&v.r?'<div class="meta">'+esc(UI.diff[0])+': '+(Number(v.r)-Number(v.e))+'</div>':'')}
function renderRead(b){
 var mk=S.mk[b.id]||[],done=S.chk[b.id],idx=0,tot=0,hit=0,wrong=0;
 var paras=b.paras.map(function(p){return '<p>'+p.replace(/\[\[(.+?)\]\]([.,;:!?)]*)|\{\{(.+?)\}\}([.,;:!?)]*)|([^\s\[\{]+)/g,function(m,a,pa,d,pd,w){var i=idx++,sel=mk.indexOf(i)>=0,cl='';var good=a!=null;if(good)tot++;
   if(done){if(sel&&good){cl=' ok';hit++}else if(sel){cl=' no';wrong++}else if(good)cl=' miss'}else if(sel)cl=' on';
   return '<span class="w'+cl+'" data-act="mk" data-id="'+b.id+'" data-i="'+i+'">'+esc(a||d||w)+'</span>'+esc(pa||pd||'')+' '})+'</p>'}).join('');
 var h='<div class="card read"><h2>📖 '+esc(b.h)+'</h2>'+tl(b.hk||b.id+'.h')+'<div class="meta">'+esc(U('readhint'))+'</div>'+(b.sum?'<div class="meta"><b>→ </b>'+esc(b.sum)+'</div>'+tl(b.id+'.s'):'')+paras;
 if(b.html)h+=b.html;
 h+='<button class="btn" data-act="mkchk" data-id="'+b.id+'">'+B('mark')+'</button>';
 if(done){var all=b.paras.join(' ').match(/\[\[.+?\]\]/g)||[];h+=fbBox(wrong===0&&hit===all.length?'ok':'part','✔ '+hit+' / '+all.length+' '+esc(U('found'))+(wrong?' · ✘ '+wrong+' '+esc(U('toomany')):'')+(hit<all.length?'<br>'+esc(U('missed')):''))}
 if(b.q){var v=A(b.id+'.q');h+='<div class="q">'+esc(b.q.q)+'</div>'+tl(b.id+'.qq')+opts(b.q.o,v,(done&&v!=null)?function(i){return i===b.q.a?'ok':(v===i?'no':'')}:null,'mc',b.id+'.q')}
 return h+'</div>'}
function renderTask(b){
 var v=b.lvl==='v';
 var h='<div class="card'+(v?' v':'')+'" id="t_'+b.id+'">'+tipHTML(b)+'<h2><span class="nr">'+esc(b.n)+'</span>'+esc(b.h)+(v?'<span class="vtag">⭐ '+esc(UI.vert[0])+'</span>':'')+'</h2>'+tl(b.hk||b.id+'.h');
 if(b.intro)h+='<div>'+esc(b.intro)+'</div>'+tl(b.ik||b.id+'.i');
 h+=tipBox(b);
 if(b.sit)h+='<div class="sit">'+b.sit+'</div>';
 (b.items||[]).forEach(function(it){h+=renderItem(b,it)});
 if(items(b).length){h+='<div class="noprint"><button class="btn" data-act="chk" data-id="'+b.id+'">'+B('check')+'</button></div>';
  if(showFb(b)){var mx=0,gt=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});h+='<div class="fb '+(gt===mx?'ok':gt?'part':'no')+'"><b>'+r1(gt)+' / '+mx+' '+esc(U('points'))+'</b>'+(b.ex&&gt<mx?'<br>'+esc(b.ex)+tl(b.ek||b.id+'.e'):'')+'</div>'}}
 return h+'</div>'}
function summaryRows(){var out=[];SHEET.blocks.forEach(function(b){if(b.k!=='task'||!vis(b)||!items(b).length)return;var gt=0,mx=0;items(b).forEach(function(it){var r=grade(it);gt+=r.got;mx+=r.max});out.push({b:b,g:gt,m:mx})});return out}
function ansLines(b){var o=[];items(b).forEach(function(it){var v=A(it.id);var g=grade(it);var a='';
 if(it.t==='free')a=(v&&v.t||'—')+(v&&v.s!=null?' ['+[UI.selfno[0],UI.selfpart[0],UI.selfyes[0]][v.s]+']':'');
 else if(it.t==='mc')a=v!=null?it.o[v]:'—';
 else if(it.t==='calc')a=(v||'—')+' '+(it.unit||'');
 else if(it.t==='table')a=it.rows.map(function(r,i){return r[0]+': '+(v&&v[i]!=null?it.cols[v[i]][0]:'—')}).join('; ');
 else if(it.t==='tf')a=it.rows.map(function(r,i){return (i+1)+': '+(v&&v[i]!=null?(v[i]?'✔':'✘'):'—')}).join('; ');
 else if(it.t==='sel')a=it.rows.map(function(r,i){return r[0]+' → '+(v&&v[i]!=null?it.o[v[i]]:'—')}).join('; ');
 else if(it.t==='gap')a=it.a.map(function(x,i){return (v&&v[i])||'—'}).join(' · ');
 var q=it.q||it.id;
 o.push('<tr><td>'+esc(q)+'</td><td>'+esc(a)+'</td><td>'+r1(g.got)+'/'+g.max+'</td></tr>')});return o.join('')}
function renderResult(){
 var t=totals(),rows=summaryRows();
 var h='<div class="card" id="result"><h2>🏁 '+esc(UI.result[0])+'</h2>'+tl_hdr('result')+'<div class="score">'+r1(t.g)+' '+esc(UI.of[0])+' '+t.m+' '+esc(UI.points[0])+'</div>';
 if(S.lang!=='de')h+='<div class="tr" lang="'+S.lang+'">'+esc(U('result'))+': '+r1(t.g)+' '+esc(U('of'))+' '+t.m+' '+esc(U('points'))+'</div>';
 if(S.lvl==='v')h+='<div>+ '+r1(t.b)+' '+esc(UI.bonus[0])+'</div>';
 h+='<div class="bar2"><i style="width:'+(t.m?100*t.g/t.m:0)+'%"></i></div>';
 rows.forEach(function(r){var p=r.m?r.g/r.m:0;h+='<div class="fb '+(p>=.99?'ok':p>0?'part':'no')+'"><b>'+esc(r.b.n)+' · '+esc(r.b.h)+'</b>: '+r1(r.g)+' / '+r.m+(p<.99?' → <a href="#t_'+r.b.id+'">'+esc(U('reread'))+'</a>':'')+'</div>'});
 h+='<div class="noprint"><button class="btn big" data-act="print">🖨 '+B('print')+'</button>'+tl_ui('printhint')+'<div class="meta">'+esc(U('printhint'))+'</div><button class="btn gray" data-act="next">'+B('next')+'</button></div></div>';
 return h}
function tl_hdr(k){return ''}
function renderReport(){
 var t=totals(),rows=summaryRows();
 var h='<h1>'+esc(SHEET.mod)+' · '+esc(SHEET.title)+'</h1><p><b>'+esc(UI.name[0])+':</b> '+esc(S.name||'')+' &nbsp; <b>'+esc(UI.date[0])+':</b> '+esc(S.date||'')+' &nbsp; <b>'+esc(UI.points[0])+':</b> '+r1(t.g)+' / '+t.m+(S.lvl==='v'?' (+'+r1(t.b)+' Bonus)':'')+' &nbsp; <b>'+esc(UI.level[0])+':</b> '+(S.lvl==='v'?'Vertiefung':'Basis')+'</p>';
 rows.forEach(function(r){h+='<div class="tk"><h3>'+esc(r.b.n)+' · '+esc(r.b.h)+' ('+r1(r.g)+'/'+r.m+')</h3><table>'+ansLines(r.b)+'</table></div>'});
 return h}
function render(){
 var y=window.scrollY;
 var lv=S.lvl==='v';
 var h='<h1>'+esc(SHEET.mod)+': '+esc(SHEET.title)+'</h1><p class="meta">'+esc(SHEET.meta)+'</p>'+tl('title');
 h+='<div class="card"><div class="row2"><label for="nm">'+B('name')+'</label><input class="in" id="nm" style="flex:1;min-width:10rem" autocomplete="off" data-act="nm" value="'+esc(S.name||'')+'"></div><div class="row2"><label for="dt">'+B('date')+'</label><input class="in" id="dt" type="date" style="max-width:12rem" data-act="dt" value="'+esc(S.date||'')+'"></div></div>';
 h+='<div class="card"><h2>✅ '+esc(UI.can[0])+'</h2>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('can'))+'</div>':'')+'<ul class="cl">'+SHEET.can.map(function(c,i){return '<li>'+esc(c)+tlo('can.'+i)+'</li>'}).join('')+'</ul></div>';
 SHEET.blocks.forEach(function(b){if(b.k==='read')h+=renderRead(b);else if(vis(b))h+=renderTask(b)});
 h+='<div class="noprint" style="text-align:center"><button class="btn big" data-act="submit">'+B('submit')+'</button></div>';
 if(S.sub)h+=renderResult();
 document.getElementById('app').innerHTML=h;
 document.getElementById('report').innerHTML=renderReport();
 renderBar();updProg();pad();
 window.scrollTo(0,y)}
function renderBar(){
 document.getElementById('langs').innerHTML=LANGS.map(function(l){return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-i="'+l[0]+'" lang="'+l[0]+'">'+l[1]+'</button>'}).join('');
 var s=document.getElementById('set');
 s.className=S.open?'open':'';
 s.innerHTML='<div class="card"><div class="row2"><label>'+B('level')+'</label><button class="pill'+(S.lvl==='b'?' on':'')+'" data-act="lvl" data-i="b">'+esc(UI.basis[0])+'</button><button class="pill'+(S.lvl==='v'?' on':'')+'" data-act="lvl" data-i="v">⭐ '+esc(UI.vert[0])+'</button></div><div class="meta">'+esc(UI.vnote[0])+'</div>'+(S.lang!=='de'?'<div class="tr" lang="'+S.lang+'" dir="'+(RTL[S.lang]?'rtl':'ltr')+'">'+esc(U('vnote'))+'</div>':'')+'<div class="row2"><label>'+B('fs')+'</label><button class="pill" data-act="fs" data-i="-1">A−</button><button class="pill" data-act="fs" data-i="1">A+</button></div><div class="row2"><button class="btn gray" data-act="restart">'+B('restart')+'</button></div></div>';
 var bt=document.getElementById('gear');bt.innerHTML='⚙ '+esc(U('settings'));
 document.documentElement.style.setProperty('--fs',FS[S.fs||0]+'%');
 document.documentElement.lang=S.lang;
 }
function pad(){var m=document.querySelector('main'),b=document.getElementById('bar');if(m&&b)m.style.paddingTop=(b.offsetHeight+14)+'px'}
window.addEventListener('resize',pad);
function toast(m){var d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2200)}
function dialog(msgKey,onYes){var d=document.createElement('div');d.className='dlg';d.innerHTML='<div><p><b>'+esc(UI[msgKey][0])+'</b></p>'+(S.lang!=='de'?'<p>'+esc(U(msgKey))+'</p>':'')+'<button class="btn" data-d="y">'+B('yes')+'</button><button class="btn gray" data-d="n">'+B('cancel')+'</button></div>';d.addEventListener('click',function(e){var x=e.target.getAttribute&&e.target.getAttribute('data-d');if(!x&&e.target!==d&&!e.target.closest('[data-d]'))return;var dd=e.target.closest('[data-d]');if(dd&&dd.getAttribute('data-d')==='y')onYes();d.remove()});document.body.appendChild(d)}
function findBlock(id){for(var i=0;i<SHEET.blocks.length;i++)if(SHEET.blocks[i].id===id)return SHEET.blocks[i]}
function findItem(id){for(var i=0;i<SHEET.blocks.length;i++){var its=SHEET.blocks[i].items||[];for(var j=0;j<its.length;j++)if(its[j].id===id)return its[j]}}
/* Ereignisse */
document.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),i=el.getAttribute('data-i'),r=el.getAttribute('data-r');
 switch(act){
 case 'lang':S.lang=i;break;
 case 'lvl':S.lvl=i;break;
 case 'fs':S.fs=Math.max(0,Math.min(FS.length-1,(S.fs||0)+Number(i)));break;
 case 'tip':S.tip[id]=!S.tip[id];break;
 case 'chk':S.chk[id]=true;break;
 case 'mkchk':S.chk[id]=true;break;
 case 'submit':S.sub=true;SHEET.blocks.forEach(function(b){S.chk[b.id]=true});saveNow();render();var rs=document.getElementById('result');if(rs)rs.scrollIntoView({behavior:'smooth'});return;
 case 'sol':S.sol[id]=true;break;
 case 'self':var v=S.a[id]||{};v.s=Number(i);S.a[id]=v;break;
 case 'mc':S.a[id]=Number(i);break;
 case 'tb':case 'tf':case 'sel':var arr=S.a[id]||[];arr[Number(r)]=act==='tf'?i==='1':Number(i);S.a[id]=arr;break;
 case 'mk':var m=S.mk[id]||[];var n=Number(i),p=m.indexOf(n);if(S.chk[id])return;if(p>=0)m.splice(p,1);else m.push(n);S.mk[id]=m;break;
 case 'print':window.print();return;
 case 'next':dialog('restartq',function(){S=fresh();wipe();render()});return;
 case 'restart':dialog('restartq',function(){var l=S.lang;S=fresh();S.lang=l;wipe();render()});return;
 default:return}
 save();render()});
document.getElementById('gear').addEventListener('click',function(){S.open=!S.open;save();renderBar()});
document.addEventListener('change',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act');if(act==='gap'||act==='sel'){var arr=S.a[el.getAttribute('data-id')]||[];var v=el.value;arr[Number(el.getAttribute('data-r'))]=act==='sel'?(v===''?null:Number(v)):(v===''?null:v);S.a[el.getAttribute('data-id')]=arr;save();updProg()}});
document.addEventListener('input',function(e){var el=e.target;var act=el.getAttribute&&el.getAttribute('data-act'),id=el.getAttribute&&el.getAttribute('data-id');
 if(act==='txt'){var v=S.a[id]||{};v.t=el.value;S.a[id]=v}
 else if(act==='calc')S.a[id]=el.value;
 else if(act==='nm')S.name=el.value;
 else if(act==='dt')S.date=el.value;
 else if(act==='est'){var o=S.a[id]||{};o[el.getAttribute('data-f')]=el.value;S.a[id]=o}
 else return;
 save();if(act==='txt'||act==='calc')updProg();
 if(act==='nm'||act==='dt'||act==='est')document.getElementById('report').innerHTML=renderReport()});
document.addEventListener('visibilitychange',saveNow);window.addEventListener('pagehide',saveNow);
window.addEventListener('beforeprint',function(){document.getElementById('report').innerHTML=renderReport()});
/* Start */
var old=load();S=old?Object.assign(fresh(),old):fresh();
document.getElementById('bartitle').textContent=SHEET.mod+' · '+SHEET.title;
document.title='LF 4 · '+SHEET.mod+' · '+SHEET.title;
render();
if(old&&Object.keys(old.a||{}).length)toast(U('restored'));
window.__missing=function(){return Object.keys(missing)};
window.__state=function(){return S};
})();
