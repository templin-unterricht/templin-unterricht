<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Die Zahlen-Zentrale</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Mono:wght@400;700&display=swap">
<style>
/* Layout: eine Spalte wie ein Klemmbrett in der Zahlen-Zentrale – oben das Büro mit Pinnwand, darunter das Prüfungsblatt mit Grafik und die Entscheidungskarte */
:root{
  --bg:#eef1f5; --grid:#dfe5ec; --surface:#ffffff; --surface2:#f5f7fa; --ink:#18212d; --muted:#556172; --line:#cfd7e1;
  --navy:#1f3a5c; --on-navy:#ffffff; --signal:#d9572b; --on-signal:#ffffff; --signal-soft:#fbe6dc; --sky:#2f6f9f; --sky-soft:#dcebf5;
  --good:#1d7a48; --mid:#946400; --bad:#b4321f; --good-bg:#e0f2e7; --mid-bg:#fbf0d3; --bad-bg:#fbe2dd;
  --display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1620; --grid:#172231; --surface:#17212e; --surface2:#1e2a39; --ink:#e8eef5; --muted:#a3b1c2; --line:#2d3c4f;
  --navy:#8fb7e6; --on-navy:#0d1a2a; --signal:#ff8a5c; --on-signal:#2a0f04; --signal-soft:#3a2219; --sky:#7fb8e0; --sky-soft:#18324a;
  --good:#5fd08f; --mid:#eebd4c; --bad:#f2836f; --good-bg:#16382a; --mid-bg:#3a3016; --bad-bg:#40211c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1620; --grid:#172231; --surface:#17212e; --surface2:#1e2a39; --ink:#e8eef5; --muted:#a3b1c2; --line:#2d3c4f;
  --navy:#8fb7e6; --on-navy:#0d1a2a; --signal:#ff8a5c; --on-signal:#2a0f04; --signal-soft:#3a2219; --sky:#7fb8e0; --sky-soft:#18324a;
  --good:#5fd08f; --mid:#eebd4c; --bad:#f2836f; --good-bg:#16382a; --mid-bg:#3a3016; --bad-bg:#40211c; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;margin:0;padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.08;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,9vw,3.6rem);color:var(--navy)}
h2{font-size:clamp(1.4rem,5vw,1.85rem)}
h3{font-size:1.15rem}
p{margin:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px;border-radius:8px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)} .small{font-size:.9rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* Statusleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-left,0px));
  background:var(--surface);border-bottom:3px solid var(--navy);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.1rem;display:flex;align-items:center;gap:7px;margin-right:auto;color:var(--navy);background:none;border:0;padding:4px 0;cursor:pointer}
.brand .ic{color:var(--signal)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:.92rem}
.pill.warn{background:var(--signal-soft);border-color:var(--signal);color:var(--ink)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;min-width:40px;padding:6px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-weight:700;font-size:.9rem}
.iconbtn[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}

/* Karten und Knöpfe */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.tight{padding:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:12px 20px;border-radius:14px;border:2px solid var(--navy);background:var(--navy);color:var(--on-navy);font-weight:700;font-size:1.05rem;cursor:pointer;text-align:center}
.btn.alt{background:var(--surface);color:var(--navy)}
.btn.sig{background:var(--signal);border-color:var(--signal);color:var(--on-signal)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;min-height:56px}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-family:var(--mono)}
.opt .t{flex:1;min-width:0}
.opt .c{flex:none;font-family:var(--mono);font-size:.82rem;color:var(--muted);padding-top:4px;white-space:nowrap}
.opt[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}
.opt[aria-pressed="true"] .k{background:var(--sky);color:#fff;border-color:var(--sky)}
.opt:disabled{opacity:.5;cursor:not-allowed}
.opt.r-good{border-color:var(--good);background:var(--good-bg)} .opt.r-mid{border-color:var(--mid);background:var(--mid-bg)} .opt.r-bad{border-color:var(--bad);background:var(--bad-bg)}
.opt[class*="r-"]:disabled{opacity:1}
.opts{display:flex;flex-direction:column;gap:10px}

/* Szene */
.scene{width:100%;height:auto;display:block;border-radius:var(--r);border:1px solid var(--line)}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* Prüfungsblatt mit Diagramm */
.paper{margin:0;background:#fdfdfb;color:#1f2226;border:1px solid #c9ccd1;border-radius:10px;padding:12px 12px 10px;box-shadow:0 1px 0 #0000000d}
.paper figcaption{display:flex;flex-direction:column;gap:1px;margin-bottom:6px}
.paper figcaption b{font-size:1rem;line-height:1.25}
.paper figcaption span{font-size:.86rem;color:#4a4f56}
.paper .chartbox{max-width:560px;margin:0 auto}
.paper svg{width:100%;height:auto;display:block}
.paper .ax{font:11px var(--body);fill:#2c3036} .paper .ax.u{font-weight:700} .paper .ax.big{font-size:12px}
.paper .vl{font:700 10.5px var(--mono);fill:#1f2226}
.paper .kz{font:700 12px var(--mono);fill:#1f2226}
.paper .kb{font:700 10.5px var(--body);fill:#1f2226;letter-spacing:.04em}
.paper .lg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.86rem;margin-top:6px;justify-content:center}
.paper .lg span{display:inline-flex;align-items:center;gap:6px}
.paper .lg svg{width:auto;flex:none}
.paper .src{font-size:.78rem;color:#4a4f56;margin-top:6px;text-align:right}
.tblwrap{overflow-x:auto}
.itbl{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
.itbl th,.itbl td{border:1px solid #9aa0a7;padding:5px 7px;text-align:right;white-space:nowrap}
.itbl thead th{background:#e6e8eb;text-align:center;white-space:normal;vertical-align:bottom}
@media (max-width:480px){.itbl{font-size:.82rem}.itbl th,.itbl td{padding:4px 5px}.brand .bt,.iconbtn .lbl{display:none}.hcard b{font-size:.9rem}.hcard .small{font-size:.78rem}}
.itbl tbody th,.itbl tfoot th{text-align:left;font-weight:700;background:#f1f2f4}
.itbl tfoot td,.itbl tfoot th{border-top:2px solid #1f2226;font-weight:700}
.itbl .gap{display:inline-block;min-width:2.2em;text-align:center;background:#ffe9a8;border:1px dashed #8a6a00;border-radius:4px;font-weight:700}
.itbl td.mk{outline:3px solid #2f6f9f;outline-offset:-3px;background:#dcebf5}

/* Grafik-Check */
.check{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;font-size:.92rem}
.check b{font-family:var(--display);font-size:1.05rem;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--navy);color:var(--on-navy)}
.check span{min-width:0;padding-top:3px}

/* Persona */
.ask{display:flex;gap:12px;align-items:flex-start}
.ask .face{flex:none;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.bubble{position:relative;flex:1;min-width:0;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.bubble::before{content:"";position:absolute;left:-8px;top:18px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.bubble .who{font-size:.8rem;font-weight:700;color:var(--muted)}
.react.good .bubble{background:var(--good-bg);border-color:var(--good)} .react.mid .bubble{background:var(--mid-bg);border-color:var(--mid)} .react.bad .bubble{background:var(--bad-bg);border-color:var(--bad)}

/* Fachbegriff-Karte */
.term{border-left:6px solid var(--signal);background:var(--signal-soft);border-radius:12px;padding:12px 14px}
.term h3{color:var(--ink)}
.ihk{border:2px dashed var(--navy);border-radius:12px;padding:10px 12px;font-size:.95rem}
.ihk .eyebrow{color:var(--navy)}
.hint{background:var(--sky-soft);border-radius:12px;padding:10px 12px;font-size:.95rem}

/* Start */
.hero{display:grid;gap:14px;padding-block:22px 6px}
.hero .lead{font-size:1.08rem;max-width:58ch}
.houses,.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.modes{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.modes{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hcard,.mcard{overflow-wrap:anywhere;display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.hcard svg{width:100%;height:auto;border-radius:8px}
.hcard b,.mcard b{font-family:var(--display);font-size:1.02rem;line-height:1.1}
.hcard[aria-pressed="true"],.mcard[aria-pressed="true"]{border-color:var(--signal);box-shadow:0 0 0 2px var(--signal) inset}
.mcard .ic{color:var(--navy)}
.mcard .d{font-size:.84rem;color:var(--muted);line-height:1.3}
.mcard .new{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--signal)}
.prog{height:7px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);overflow:hidden;width:100%}
.prog i{display:block;height:100%;background:var(--sky)}
.field{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.92rem}
.field input{min-height:48px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:400;font-size:1rem}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge.on .med{fill:#e9b93a}.badge.on .in{fill:#f8d873}.badge.on .rib{fill:var(--signal)}.badge.on .gl{color:#5a3d00}
.badge.off .med{fill:var(--line)}.badge.off .in{fill:var(--surface2)}.badge.off .rib{fill:var(--line)}.badge.off .gl{color:var(--muted)}
.bdg{display:flex;flex-direction:column;align-items:center;width:84px;text-align:center;font-size:.72rem;line-height:1.2;gap:2px}

/* Personakarte drehen */
.flip{perspective:900px;max-width:420px;margin:0 auto;width:100%}
.flip-in{position:relative;transition:transform .8s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;min-height:300px}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:2px solid var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.flip-f{background:var(--navy);color:var(--on-navy)}
.flip-f .ic{color:var(--signal)}
.flip-b{background:var(--surface);transform:rotateY(180deg)}

/* Mini-Spiele */
.amp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.amp button{min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-size:.92rem;padding:6px}
.amp button.g[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.amp button.y[aria-pressed="true"]{background:var(--mid);border-color:var(--mid);color:#fff}
.amp button.r[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.timer{height:10px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--signal);transition:width .25s linear}
.numgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.numgrid button{min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font:700 1.1rem var(--mono);cursor:pointer}
.numgrid button[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.stmt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer}
.stmt[aria-pressed="true"]{border-color:var(--bad);background:var(--bad-bg)}
.stmt .mark{flex:none;width:26px;height:26px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700}
.stmt[aria-pressed="true"] .mark{border-color:var(--bad);background:var(--bad);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:6px 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}

/* Auswertung */
.scorecard{background:var(--navy);color:var(--on-navy);border-radius:20px;padding:20px;display:grid;gap:10px;text-align:center}
.scorecard h2{color:var(--on-navy)}
.scorecard .big{font:800 3.2rem/1 var(--display)}
.stars svg.on{fill:#f2b632}.stars svg.off{fill:currentColor;opacity:.25}
.stars{display:inline-flex;gap:4px;justify-content:center}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font:700 1.5rem var(--mono)}
.meter{height:14px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--good))}
.modbar{display:grid;grid-template-columns:3.2em 1fr 3.4em;gap:8px;align-items:center;font-size:.9rem}
.res{border-left:6px solid var(--line);padding:10px 12px;border-radius:10px;background:var(--surface)}
.res.good{border-color:var(--good)} .res.mid{border-color:var(--mid)} .res.bad{border-color:var(--bad)}
.res .sym{font-weight:800;font-family:var(--mono)}
.res.good .sym{color:var(--good)} .res.mid .sym{color:var(--mid)} .res.bad .sym{color:var(--bad)}
.better{font-size:.93rem;background:var(--surface2);border-radius:8px;padding:6px 10px}
details.sheet{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.sheet summary{cursor:pointer;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.walker{transition:transform 1.1s ease-in-out}
.overlay{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.overlay .card{max-width:640px;width:100%;max-height:82vh;overflow:auto}
.wsp{display:flex;flex-wrap:wrap;gap:6px}
.wsp span{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:.9rem}
.confirm{border:2px solid var(--bad);background:var(--bad-bg);border-radius:12px;padding:12px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ===== Die Zahlen-Zentrale – Daten =====
   Alle Rechenwege, Fallen und Satzbausteine stammen aus den Lösungsheften WPF Grafiken M1–M6
   und der Grafik-Werkzeugkarte. Keine IHK-Originalaufgaben (Spiel ist online). */

const HAEUSER = {
  frischmarkt:{n:"Frischmarkt Nordstadt", k:"Frischmarkt", d:"Lebensmittel, Getränke, Drogerie"},
  modehaus:{n:"Modehaus Kranz", k:"Modehaus", d:"Bekleidung, Schuhe, Onlineshop"},
  baumarkt:{n:"Gartencenter Grünland", k:"Gartencenter", d:"Garten, Werkzeug, Farben"}
};

const PERSONAS = [
  {id:"ahrens", n:"Frau Ahrens", r:"Controlling", motto:"Mir zählen genaue Zahlen – mit Einheit.",
   focus:["anteil","veraenderung","durchschnitt","luecke"], look:{skin:"#f1c7a5",hair:"#5b3a29",style:"bob",top:"#2f5d8a",glasses:true},
   good:["Sauber gerechnet. So kommt das in den Bericht.","Genau. Zahl, Einheit, Rechenweg – perfekt.","Das prüfe ich nach … stimmt!"],
   mid:["Fast. Aber im Bericht brauche ich es genauer.","Die Richtung stimmt, die Zahl noch nicht ganz."],
   bad:["Halt! Diese Zahl stimmt nicht.","Damit hätten wir falsch geplant. Nochmal lesen!"]},
  {id:"yilmaz", n:"Herr Yilmaz", r:"Werbung", motto:"Sagt es mir in Worten, die jeder versteht.",
   focus:["diagrammart","raten","aussage"], look:{skin:"#c98e64",hair:"#1f1a17",style:"short",top:"#c4532b",beard:true},
   good:["Super, das versteht jeder Kunde.","Klar und ehrlich – so mag ich das.","Das kann ich so auf das Plakat schreiben."],
   mid:["Hm, das klingt noch nicht rund.","Nicht falsch, aber das geht besser."],
   bad:["Oh nein, das wäre peinlich geworden.","Das stimmt so nicht – das darf nicht raus!"]},
  {id:"dombrowski", n:"Frau Dombrowski", r:"Marktleitung", motto:"Was heißt das für unseren Laden?",
   focus:["grafikcheck","durchschnitt","luecke","aussage"], look:{skin:"#f3d2b8",hair:"#b8742f",style:"long",top:"#3d7a5a"},
   good:["Danke, damit kann ich planen.","Prima, so stelle ich das Personal ein.","Das hilft mir richtig weiter."],
   mid:["Mit der Antwort kann ich noch nicht planen.","Halb gut. Was genau heißt das für uns?"],
   bad:["So hätte ich falsch geplant.","Das passt nicht zu unseren Zahlen."]},
  {id:"petersen", n:"Herr Petersen", r:"Betriebsrat", motto:"Bitte nichts behaupten, was nicht drinsteht.",
   focus:["grundwert","raten","aussage"], look:{skin:"#e8b896",hair:"#9a9a9a",style:"bald",top:"#6b4f8a",glasses:true},
   good:["Ehrlich und richtig. Danke.","Das kann ich so im Team vorstellen.","Genau so steht es in der Grafik."],
   mid:["Da fehlt noch ein Stück.","Nicht ganz – lest noch mal genau."],
   bad:["Das steht so nicht in der Grafik!","Vorsicht, das stimmt nicht."]},
  {id:"okafor", n:"Frau Okafor", r:"Ausbildungsleitung", motto:"Ich will sehen, dass ihr prüfungsfit seid.",
   focus:["grafikcheck","grundwert","markt"], look:{skin:"#7a4b31",hair:"#20140f",style:"curl",top:"#b0892a"},
   good:["Prüfungsreif! Genau so.","Sehr gut – das gibt in der Prüfung Punkte.","Richtig gelesen, richtig gedacht."],
   mid:["Da wäre in der Prüfung nur ein Teilpunkt drin.","Fast. Schaut auf die Werkzeugkarte."],
   bad:["Das wäre in der Prüfung falsch.","Achtung, das ist eine typische Prüfungsfalle!"]}
];

/* Stationen in Modul-Reihenfolge */
const STATIONEN = [

/* ===== Die Zahlen-Zentrale – Grafiken (Inline-SVG) ===== */
const NF = (v, d=0) => Number(v).toLocaleString("de-DE",{minimumFractionDigits:d,maximumFractionDigits:d});
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
let _uid = 0; const uid = p => p + (++_uid);

/* ---------- Diagramme im IHK-Stil (Papier, Graustufen, Schraffur) ---------- */
const INK = "#1f2226", G1 = "#3d4248", G2 = "#b9bec4", GRID = "#d9dcdf", PAPER = "#fdfdfb";
function fills(id){
  return `<defs><pattern id="${id}h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="${G1}" stroke-width="2.2"/></pattern>
  <pattern id="${id}d" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" fill="#e9ebed"/><circle cx="2.5" cy="2.5" r="1.1" fill="${G1}"/></pattern></defs>`;
}
function seriesFill(s, i, id){
  const k = s && s.s ? s.s : ["dark","light","hatch","dots"][i % 4];
  return {dark:G1, light:G2, hatch:`url(#${id}h)`, dots:`url(#${id}d)`}[k];
}
function legendHTML(series, id){
  if(!series || series.length < 2) return "";
  return `<div class="lg">${series.map((s,i)=>`<span><svg width="16" height="12" aria-hidden="true">${fills(id+"l"+i)}<rect x=".5" y=".5" width="15" height="11" fill="${seriesFill(s,i,id+"l"+i)}" stroke="${INK}" stroke-width=".8"/></svg>${esc(s.n)}</span>`).join("")}</div>`;
}
function frame(spec, inner, legend){
  return `<figure class="paper"><figcaption><b>${esc(spec.title)}</b>${spec.sub?`<span>${esc(spec.sub)}</span>`:""}</figcaption>
  <div class="chartbox">${inner}</div>${legend||""}${spec.src?`<div class="src">Quelle: ${esc(spec.src)}</div>`:""}</figure>`;
}
function ticks(min,max,step){const t=[];for(let v=min;v<=max+1e-9;v+=step)t.push(+v.toFixed(4));return t;}

function colChart(spec){
  const id=uid("c"), W=360, H=230, L=46, R=8, T=22, B=40;
  const ser=spec.series, n=spec.x.length, k=ser.length, ymin=spec.ymin||0, ymax=spec.ymax, dec=spec.dec||0;
  const y=v=>T+(H-T-B)*(1-(v-ymin)/(ymax-ymin));
  const gw=(W-L-R)/n, bw=Math.min(34,(gw*0.72)/k);
  let g=fills(id);
  ticks(ymin,ymax,spec.step).forEach(t=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="${GRID}"/><text x="${L-5}" y="${y(t)+3.5}" text-anchor="end" class="ax">${NF(t,spec.step<1?1:0)}</text>`;});
  spec.x.forEach((c,i)=>{
    const x0=L+gw*i+(gw-bw*k)/2;
    ser.forEach((s,j)=>{const v=s.v[i], yy=y(v), h=y(ymin)-yy;
      g+=`<rect x="${x0+j*bw}" y="${yy}" width="${bw-1.5}" height="${h}" fill="${seriesFill(s,j,id)}" stroke="${INK}" stroke-width=".8"/>`;
      if(spec.labels) g+=`<text x="${x0+j*bw+(bw-1.5)/2}" y="${yy-4}" text-anchor="middle" class="vl">${NF(v,dec)}</text>`;});
    g+=`<text x="${L+gw*i+gw/2}" y="${H-B+15}" text-anchor="middle" class="ax">${esc(c)}</text>`;
  });
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(ymin)}" y2="${y(ymin)}" stroke="${INK}"/><line x1="${L}" x2="${L}" y1="${T-6}" y2="${y(ymin)}" stroke="${INK}"/>`;
  g+=`<text x="${L-40}" y="${T-10}" class="ax u">${esc(spec.unit||"")}</text>`;
  if(spec.xl) g+=`<text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle" class="ax u">${esc(spec.xl)}</text>`;
  return frame(spec,`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title)}">${g}</svg>`,legendHTML(ser,id));
}
function hbarChart(spec){
  const id=uid("h"), W=360, L=112, R=34, T=20, k=spec.series.length, row=k*15+12, n=spec.x.length, H=T+row*n+26;
  const xmax=spec.ymax, dec=spec.dec||0, x=v=>L+(W-L-R)*v/xmax;
  let g=fills(id);
  ticks(0,xmax,spec.step).forEach(t=>{g+=`<line y1="${T-4}" y2="${T+row*n}" x1="${x(t)}" x2="${x(t)}" stroke="${GRID}"/><text y="${T+row*n+13}" x="${x(t)}" text-anchor="middle" class="ax">${NF(t)}</text>`;});
  spec.x.forEach((c,i)=>{const y0=T+row*i+6;
    const words=String(c).split(" "); let lines=[""]; words.forEach(w=>{if((lines[lines.length-1]+" "+w).trim().length>15)lines.push(w);else lines[lines.length-1]=(lines[lines.length-1]+" "+w).trim();});
    lines.forEach((ln,li)=>g+=`<text x="${L-6}" y="${y0+k*7.5+4-(lines.length-1)*6+li*12}" text-anchor="end" class="ax">${esc(ln)}</text>`);
    spec.series.forEach((s,j)=>{const v=s.v[i];
      g+=`<rect x="${L}" y="${y0+j*15}" height="13" width="${x(v)-L}" fill="${seriesFill(s,j,id)}" stroke="${INK}" stroke-width=".8"/>`;
      if(spec.labels) g+=`<text x="${x(v)+4}" y="${y0+j*15+10}" class="vl">${NF(v,dec)}</text>`;});
  });
  g+=`<line x1="${L}" x2="${L}" y1="${T-4}" y2="${T+row*n}" stroke="${INK}"/><text x="${W-R+30}" y="${T+row*n+13}" text-anchor="end" class="ax u">${esc(spec.unit||"")}</text>`;
  return frame(spec,`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title)}">${g}</svg>`,legendHTML(spec.series,id));
}
function lineChart(spec){
  const id=uid("l"), W=360, H=230, L=46, R=12, T=22, B=40, n=spec.x.length, ymin=spec.ymin||0, ymax=spec.ymax, dec=spec.dec||0;
  const y=v=>T+(H-T-B)*(1-(v-ymin)/(ymax-ymin)), x=i=>L+12+(W-L-R-24)*i/(n-1);
  let g="";
  ticks(ymin,ymax,spec.step).forEach(t=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="${GRID}"/><text x="${L-5}" y="${y(t)+3.5}" text-anchor="end" class="ax">${NF(t,spec.step<1?1:0)}</text>`;});
  spec.x.forEach((c,i)=>g+=`<text x="${x(i)}" y="${H-B+15}" text-anchor="middle" class="ax">${esc(c)}</text>`);
  spec.series.forEach((s,j)=>{
    g+=`<polyline fill="none" stroke="${INK}" stroke-width="2" ${j?'stroke-dasharray="5 3"':""} points="${s.v.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`;
    s.v.forEach((v,i)=>{g+=`<circle cx="${x(i)}" cy="${y(v)}" r="3.2" fill="${j?"#fff":INK}" stroke="${INK}" stroke-width="1.2"/>`;
      if(spec.labels) g+=`<text x="${x(i)}" y="${y(v)-8}" text-anchor="middle" class="vl">${NF(v,dec)}</text>`;});
  });
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(ymin)}" y2="${y(ymin)}" stroke="${INK}"/><line x1="${L}" x2="${L}" y1="${T-6}" y2="${y(ymin)}" stroke="${INK}"/>`;
  g+=`<text x="${L-40}" y="${T-10}" class="ax u">${esc(spec.unit||"")}</text>`;
  if(spec.xl) g+=`<text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle" class="ax u">${esc(spec.xl)}</text>`;
  return frame(spec,`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title)}">${g}</svg>`,legendHTML(spec.series.length>1?spec.series:null,id));

function chgChart(spec){
  const id=uid("v"), W=360, H=230, L=40, R=8, T=22, B=40, n=spec.x.length, ymin=spec.ymin, ymax=spec.ymax;
  const y=v=>T+(H-T-B)*(1-(v-ymin)/(ymax-ymin)), gw=(W-L-R)/n, bw=Math.min(30,gw*.55);
  let g=fills(id);
  ticks(ymin,ymax,spec.step).forEach(t=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="${GRID}"/><text x="${L-5}" y="${y(t)+3.5}" text-anchor="end" class="ax">${t>0?"+":""}${NF(t)}</text>`;});
  spec.x.forEach((c,i)=>{const v=spec.v[i], x0=L+gw*i+(gw-bw)/2, y0=y(0), yy=y(v);
    if(v!==0) g+=`<rect x="${x0}" y="${Math.min(y0,yy)}" width="${bw}" height="${Math.abs(yy-y0)}" fill="${v>0?G1:`url(#${id}h)`}" stroke="${INK}" stroke-width=".8"/>`;
    g+=`<text x="${x0+bw/2}" y="${v>=0?yy-4:yy+12}" text-anchor="middle" class="vl">${v>0?"+":""}${NF(v)} %</text>`;
    g+=`<text x="${L+gw*i+gw/2}" y="${H-B+15}" text-anchor="middle" class="ax">${esc(c)}</text>`;});
  g+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="${INK}" stroke-width="1.6"/><line x1="${L}" x2="${L}" y1="${T-6}" y2="${H-B}" stroke="${INK}"/>`;
  g+=`<text x="${L-34}" y="${T-10}" class="ax u">${esc(spec.unit)}</text>`;
  if(spec.xl) g+=`<text x="${(L+W-R)/2}" y="${H-6}" text-anchor="middle" class="ax u">${esc(spec.xl)}</text>`;
  return frame(spec,`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title)}">${g}</svg>`);
}
function pieChart(spec){
  const id=uid("p"), W=360, H=200, cx=100, cy=100, r=82, fl=[G1,`url(#${id}h)`,G2,`url(#${id}d)`,"#fff"];
  let g=fills(id), a=-Math.PI/2;
  spec.parts.forEach((p,i)=>{const a2=a+p.v/100*2*Math.PI, large=(a2-a)>Math.PI?1:0;
    g+=`<path d="M${cx},${cy} L${cx+r*Math.cos(a)},${cy+r*Math.sin(a)} A${r},${r} 0 ${large} 1 ${cx+r*Math.cos(a2)},${cy+r*Math.sin(a2)} Z" fill="${fl[i%5]}" stroke="${INK}" stroke-width="1"/>`;
    const m=(a+a2)/2; if(p.v>=9){const tx=cx+r*.62*Math.cos(m), ty=cy+r*.62*Math.sin(m), dark=fl[i%5]===G1;
      const lab=NF(p.v,p.v%1?1:0)+" %", lw=lab.length*6.4+8; g+=`<rect x="${tx-lw/2}" y="${ty-9}" width="${lw}" height="15" rx="3" fill="#fff" stroke="${INK}" stroke-width=".6" opacity="${dark?1:.92}"/><text x="${tx}" y="${ty+2.5}" text-anchor="middle" class="vl">${NF(p.v,p.v%1?1:0)} %</text>`;}
    a=a2;});
  spec.parts.forEach((p,i)=>{const yy=40+i*30;
    g+=`<rect x="206" y="${yy-10}" width="16" height="13" fill="${fl[i%5]}" stroke="${INK}" stroke-width=".8"/><text x="230" y="${yy+1}" class="ax big">${esc(p.n)}</text><text x="230" y="${yy+14}" class="vl">${NF(p.v,p.v%1?1:0)} %</text>`;});
  return frame(spec,`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title)}">${g}</svg>`);
}
function tableChart(spec, opt={}){
  const cls=(r,c)=>opt.mark&&opt.mark[0]===r&&opt.mark[1]===c?' class="mk"':"";
  let h=`<div class="tblwrap"><table class="itbl"><thead><tr>${spec.head.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>`;
  spec.rows.forEach((r,ri)=>h+=`<tr>${r.map((x,ci)=>ci===0?`<th scope="row">${esc(x)}</th>`:`<td${cls(ri,ci)}>${x==="?"?'<span class="gap">?</span>':esc(x)}</td>`).join("")}</tr>`);
  h+=`</tbody>${spec.foot?`<tfoot><tr>${spec.foot.map((x,ci)=>ci===0?`<th scope="row">${esc(x)}</th>`:`<td>${esc(x)}</td>`).join("")}</tr></tfoot>`:""}</table></div>`;
  return frame(spec,h);
}
function marktChart(spec){
  const W=360, H=250, L=52, B=44, T=20, R=20, nm=spec.nums;
  const X=L+(W-L-R)*0.5, Y=T+(H-T-B)*0.5;
  const c=(k,x,y)=>`<circle cx="${x}" cy="${y}" r="11" fill="#fff" stroke="${INK}" stroke-width="1.4"/><text x="${x}" y="${y+4.5}" text-anchor="middle" class="kz">${k}</text>`;
  let g=`<line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" stroke="${INK}" stroke-width="1.4"/><line x1="${L}" y1="${H-B}" x2="${L}" y2="${T-6}" stroke="${INK}" stroke-width="1.4"/>
  <path d="M${W-R},${H-B} l-8,-4 v8z M${L},${T-6} l-4,8 h8z" fill="${INK}"/>
  <text x="${L-8}" y="${T-10}" class="ax u" text-anchor="start">Preis</text><text x="${W-R}" y="${H-B+30}" text-anchor="end" class="ax u">Menge</text>
  <line x1="${L+20}" y1="${H-B-14}" x2="${W-R-20}" y2="${T+10}" stroke="${INK}" stroke-width="2.4"/>
  <line x1="${L+20}" y1="${T+10}" x2="${W-R-20}" y2="${H-B-14}" stroke="${INK}" stroke-width="2.4"/>
  <line x1="${L}" y1="${Y}" x2="${X}" y2="${Y}" stroke="${INK}" stroke-dasharray="4 3"/><line x1="${X}" y1="${Y}" x2="${X}" y2="${H-B}" stroke="${INK}" stroke-dasharray="4 3"/>
  <circle cx="${X}" cy="${Y}" r="4" fill="${INK}"/><text x="${X+8}" y="${Y-8}" class="ax">X</text>`;
  if(spec.hi) g+=`<line x1="${L}" y1="${T+40}" x2="${W-R-10}" y2="${T+40}" stroke="${G1}" stroke-width="1.2" stroke-dasharray="1 3"/><text x="${X}" y="${T+34}" text-anchor="middle" class="ax">verlangter Preis</text>`;
  /* Kennziffern: A an der steigenden Kurve oben rechts, N an der fallenden oben links */
  g+=c(nm.A, W-R-36, T+22) + c(nm.N, L+36, T+22) + c(nm.P, L-22, Y) + c(nm.M, X, H-B+18);
  return frame(spec,`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(spec.title)}">${g}</svg>`);
}
function chartHTML(spec, opt){
  if(typeof spec==="string") spec = (SZENEN.find(s=>s.id===spec)||{}).chart;
  return ({col:colChart,hbar:hbarChart,line:lineChart,chg:chgChart,pie:pieChart,table:tableChart,markt:marktChart})[spec.type](spec,opt);
}
function checkInfo(spec){
  if(typeof spec==="string") spec=(SZENEN.find(s=>s.id===spec)||{}).chart;
  if(spec.type==="markt") return [["T",spec.title],["A","senkrecht: Preis · waagerecht: Menge"],["E","keine Zahlen – nur Kennziffern"],["L","steigende Kurve = Angebot, fallende Kurve = Nachfrage"],["Q","Modell aus der Wirtschaftslehre"]];
  if(spec.type==="table") return [["T",spec.title+(spec.sub?" – "+spec.sub:"")],["A","Kopfzeile: "+spec.head.slice(1).join(", ")+" · Vorspalte: "+spec.head[0]],["E",(spec.head.filter(h=>/in |€|m²|%/.test(h)).join(", ")||spec.sub||"Anzahl")],["L","Tabelle – keine Legende"],["Q",spec.src]];
  if(spec.type==="pie") return [["T",spec.title+(spec.sub?" – "+spec.sub:"")],["A","Kreis: alle Stücke zusammen = 100 %"],["E","Prozent"],["L",spec.parts.map(p=>p.n).join(", ")],["Q",spec.src]];
  const ser=spec.series||[];
  return [["T",spec.title+(spec.sub?" – "+spec.sub:"")],["A",spec.type==="hbar"?"Balken: Gruppen links, Werte waagerecht":`waagerecht: ${spec.xl||"Gruppen"} · senkrecht: ${spec.yl||"Werte"}`],["E",spec.unit],
    ["L",ser.length>1?ser.map((s,i)=>`${s.n} = ${({dark:"dunkel",light:"hell",hatch:"schraffiert",dots:"gepunktet"})[s.s||["dark","light","hatch","dots"][i]]}`).join(" · "):(spec.type==="chg"?"Plus = über der Nulllinie, Minus = darunter (schraffiert)":"nur eine Reihe – keine Legende nötig")],["Q",spec.src]];
}

/* ---------- Wirtschaftskreislauf (Mini-Spiel) ---------- */
function kreislaufSVG(cfg){
  /* cfg.uLeft: Unternehmen links? cfg.lanes: [{strom, num}] Reihenfolge oben außen, oben innen, unten innen, unten außen; cfg.geldDash */
  const W=360,H=230, Lx=8, Bw=104, Rx=W-8-Bw, by=86, bh=58;
  const left = cfg.uLeft ? "UNTERNEHMEN" : "HAUSHALTE", right = cfg.uLeft ? "HAUSHALTE" : "UNTERNEHMEN";
  const ys=[22,52,178,208];
  let g=`<rect x="${Lx}" y="${by}" width="${Bw}" height="${bh}" rx="6" fill="#fff" stroke="${INK}" stroke-width="1.6"/><text x="${Lx+Bw/2}" y="${by+bh/2+4}" text-anchor="middle" class="kb">${left}</text>
  <rect x="${Rx}" y="${by}" width="${Bw}" height="${bh}" rx="6" fill="#fff" stroke="${INK}" stroke-width="1.6"/><text x="${Rx+Bw/2}" y="${by+bh/2+4}" text-anchor="middle" class="kb">${right}</text>`;
  cfg.lanes.forEach((ln,i)=>{
    const st=STROM[ln.strom], fromLeft = (st.von==="U")===cfg.uLeft;
    const dash = (st.art==="geld")===cfg.geldDash ? 'stroke-dasharray="7 5"' : "";
    const yy=ys[i], top=i<2, xL=Lx+Bw/2+(i===1||i===2?14:-14)*0+ (i%3===0?-18:18), xR=Rx+Bw/2+(i%3===0?18:-18);
    const yBox = top? by : by+bh;
    const d=`M${xL},${yBox} V${yy} H${xR} V${yBox}`;
    g+=`<path d="${d}" fill="none" stroke="${INK}" stroke-width="2.2" ${dash}/>`;
    /* Pfeilspitze in der Mitte der Waagerechten */
    const mx=W/2, dir=fromLeft?1:-1;
    g+=`<path d="M${mx+dir*9},${yy} l${-dir*13},-6 v12z" fill="${INK}"/>`;
    g+=`<circle cx="${mx-dir*34}" cy="${yy}" r="10" fill="#fff" stroke="${INK}" stroke-width="1.3"/><text x="${mx-dir*34}" y="${yy+4.5}" text-anchor="middle" class="kz">${ln.num}</text>`;
  });
  return `<figure class="paper"><figcaption><b>Der einfache Wirtschaftskreislauf</b><span>Die Beschriftung fehlt – folge den Pfeilen.</span></figcaption><div class="chartbox"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wirtschaftskreislauf">${g}</svg></div>
  <div class="lg"><span><svg width="34" height="10" aria-hidden="true"><line x1="0" y1="5" x2="34" y2="5" stroke="${INK}" stroke-width="2.2"/></svg>${cfg.geldDash?"Güterstrom":"Geldstrom"}</span><span><svg width="34" height="10" aria-hidden="true"><line x1="0" y1="5" x2="34" y2="5" stroke="${INK}" stroke-width="2.2" stroke-dasharray="7 5"/></svg>${cfg.geldDash?"Geldstrom":"Güterstrom"}</span></div></figure>`;
}

  /* Uhr */
  const fr=Math.max(0,Math.min(1,st.clock/st.max)), a=fr*2*Math.PI;
  g+=`<g transform="translate(150,40)"><circle r="24" fill="#fff" stroke="#3d4248" stroke-width="2.5"/><path d="M0,0 L0,-20 A20,20 0 ${a>Math.PI?1:0} 1 ${20*Math.sin(a)},${-20*Math.cos(a)} Z" fill="${fr>.3?"#2f6f9f":"#c4532b"}" opacity=".85"/><circle r="3" fill="#3d4248"/><text y="40" text-anchor="middle" font-size="10" font-weight="700" fill="#3d4248" font-family="sans-serif">${Math.max(0,Math.round(st.clock))} Min.</text></g>`;

  g+=`<rect x="196" y="12" width="172" height="108" rx="4" fill="#c99a62" stroke="#8a6438" stroke-width="2"/><rect x="200" y="16" width="164" height="100" fill="#d9b07c"/>`;
  for(let i=0;i<10;i++){const x=206+(i%5)*31.5, y=22+Math.floor(i/5)*47, q=st.slots[i];
    if(q===undefined||q===null){g+=`<rect x="${x}" y="${y}" width="26" height="38" rx="2" fill="none" stroke="#8a6438" stroke-dasharray="3 3"${i===st.cur?' class="pulse"':''}/>`;

    else if(q===1){g+=`<g transform="rotate(${2-(i%4)} ${x+13} ${y+19})"><rect x="${x+1}" y="${y+4}" width="24" height="26" fill="#ffd95e"/><path d="M${x+5},${y+12} h15 M${x+5},${y+18} h12 M${x+5},${y+24} h9" stroke="#8a6a00" stroke-width="1.5"/><circle cx="${x+13}" cy="${y+5}" r="3" fill="#c48a00"/></g>`;}
    else {g+=`<g><path d="M${x+3},${y+8} l8,-3 l6,4 l7,-2 l-1,9 l3,7 l-6,8 l-8,-2 l-7,4 l-2,-9 l-3,-6z" fill="#f4d3cf" stroke="#c4532b" stroke-width="1.2"/><path d="M${x+8},${y+14} l10,10 M${x+18},${y+14} l-10,10" stroke="#c4532b" stroke-width="2"/></g>`;}
  }
  /* Schreibtisch mit Laptop */
  g+=`<rect x="120" y="112" width="70" height="8" fill="#6b4f35"/><path d="M134,112 l6,-18 h34 l-4,18z" fill="#3d4248"/><rect x="144" y="98" width="22" height="10" fill="#9fd0e6"/>`;
  return `<svg class="scene" viewBox="0 0 ${W} ${H}" role="img" aria-label="Die Zahlen-Zentrale: Pinnwand mit ${st.slots.filter(x=>x!=null).length} von 10 Ergebnissen">${g}</svg>`;
}

/* ---------- Zufall ---------- */
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return h>>>0; }
let RNG = Math.random;
const rint = n => Math.floor(RNG()*n);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=rint(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pickOne = a => a[rint(a.length)];

let NOTICE = null;
function draw(key, ids, prefer, exclude=[]){
  if(G && G.challenge){ const pool = ids.filter(i=>!exclude.includes(i)); return pool[rint(pool.length)]; }
  let seen = (DB.seen[key]||[]).filter(i=>ids.includes(i));
  let cand = ids.filter(i=>!seen.includes(i) && !exclude.includes(i));
  if(!cand.length){ seen = []; cand = ids.filter(i=>!exclude.includes(i)); NOTICE = "Alle Aufgaben geschafft – jetzt geht es von vorn los, gemischt."; }
  const pref = prefer ? cand.filter(prefer) : [];
  const pool = pref.length ? pref : cand;
  const p = pool[rint(pool.length)];
  seen.push(p); DB.seen[key] = seen; save();
  return p;
}
function drawN(key, ids, n){ const out=[]; for(let i=0;i<n;i++) out.push(draw(key, ids, null, out)); return out; }

/* ---------- Musik (Web Audio, Standard aus) ---------- */
const MUSIC = {
  ctx:null, gain:null, timer:null, step:0, int:0,
  ensure(){ if(!this.ctx){ const AC = window.AudioContext||window.webkitAudioContext; if(!AC) return false; try{ this.ctx=new AC(); }catch(e){ return false; } this.gain=this.ctx.createGain(); this.gain.gain.value=.3; this.gain.connect(this.ctx.destination); }
    if(this.ctx.state==="suspended") this.ctx.resume(); return true; },
  tone(f, t, d, type="sawtooth", v=.18, lp=900){ const c=this.ctx, o=c.createOscillator(), g=c.createGain(), fl=c.createBiquadFilter();
    o.type=type; o.frequency.value=f; fl.type="lowpass"; fl.frequency.value=lp; g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(fl); fl.connect(g); g.connect(this.gain); o.start(t); o.stop(t+d+.02); },
  kick(t){ const c=this.ctx, o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(40,t+.14);
    g.gain.setValueAtTime(.55,t); g.gain.exponentialRampToValueAtTime(.001,t+.18); o.connect(g); g.connect(this.gain); o.start(t); o.stop(t+.2); },
  hat(t, v=.08){ const c=this.ctx, b=c.createBuffer(1, c.sampleRate*.04, c.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain(); f.type="highpass"; f.frequency.value=7000; g.gain.value=v; s.buffer=b; s.connect(f); f.connect(g); g.connect(this.gain); s.start(t); },
  play(int=0){ if(!DB.music) return; if(!this.ensure()) return; this.int=int; if(this.timer) return; this.step=0;
    const roots=[110,87.31,130.81,98]; /* A – F – C – G als Grundtöne, frei kombiniert */
    const tick=()=>{ const t=this.ctx.currentTime+.03, s=this.step%16, bar=Math.floor(this.step/16)%4, r=roots[bar];
      if(s%4===0) this.kick(t);
      if(s%2===1 || this.int>.5) this.hat(t, s%2?.07:.04);
      if([0,3,6,8,11,14].includes(s)) this.tone(r*(s===6||s===14?1.5:1), t, .16, "sawtooth", .16, 700+this.int*900);
      if(this.int>.4 && s%4===2) this.tone(r*4*(s===10?1.2:1), t, .08, "square", .05, 2400);
      this.step++; };
    this.timer = setInterval(tick, 60000/(118+Math.round(this.int*30))/4); },
  setInt(i){ if(!this.timer){ return; } if(Math.abs(i-this.int)>.15){ this.stop(); this.play(i); } },
  stop(){ if(this.timer){ clearInterval(this.timer); this.timer=null; } },
  tusch(){ if(!DB.music || !this.ensure()) return; const t=this.ctx.currentTime+.05; [[220,0],[277.2,.12],[329.6,.24],[440,.36]].forEach(([f,d])=>this.tone(f,t+d,.5,"square",.08,3000)); this.kick(t); this.kick(t+.36); }
};

function progressFor(m){
  const all=SZENEN.map(s=>s.id);
  if(["klassik","profi","krise"].includes(m)){ const n=STATIONEN.reduce((a,s)=>a+unseen(m+":st:"+s.id, SCIDS(s.id)),0); return [n, all.length, "Aufträge"]; }
  if(m==="blitz") return [unseen("blitz:q", FRAGEN.map(q=>q.id)), FRAGEN.length, "Fragen"];
  if(m==="pruefung") return [unseen("pruefung:sc", all), all.length, "Aufgaben"];
  if(m==="fehler") return [unseen("fehler:fj", FEHLERJAGD.map(f=>f.id)), FEHLERJAGD.length, "Präsentationen"];
  if(m==="wieder"){ const n=DB.wrong.sc.length+DB.wrong.q.length; return [n, n, "offene Fehler"]; }
  return null;
}

function startMode(m){
  if(!DB.played.includes(m)){ DB.played.push(m); save(); }
  if(["klassik","krise","profi","challenge"].includes(m)) return newGame({mode:m});
  if(m==="blitz") return startQuiz("blitz");
  if(m==="pruefung") return startQuiz("pruefung");
  if(m==="wieder") return startQuiz("wieder");
  if(m==="fehler") return startFJ();
}

/* ================= KLASSIK / PROFI / KRISE / CHALLENGE ================= */
function newGame(o){
  const mode=o.mode, challenge = mode==="challenge" ? UI.code.trim().toUpperCase() : null;
  RNG = challenge ? mulberry(hashStr("ZZ|"+challenge)) : Math.random;
  G = {mode, challenge, team:(UI.team.trim()||"Team ohne Namen"), shop:UI.shop, clock:45, max:45, points:0, pmax:40, mood:50, results:[], slots:Array(10).fill(null), step:0, mini:{}};
  G = Object.assign(G, {persona:null});
  const S = o.setup ? JSON.parse(JSON.stringify(o.setup)) : buildSetup(mode, challenge);
  G.setup = S; G.persona = PERSONAS.find(p=>p.id===S.persona);
  G.seq = [{k:"strat"}];
  STATIONEN.forEach((s,i)=>{ G.seq.push({k:"st", i});
    if(i===3) G.seq.push({k:"mini", m:S.mini1});
    if(mode==="krise" && [2,5,7].includes(i)) G.seq.push({k:"krise", id:S.krisen[[2,5,7].indexOf(i)]});
    if(i===8) G.seq.push({k:"mini", m:"ampel"});
    if(i===9) G.seq.push({k:"mini", m:"kreis"}); });
  G.seq.push({k:"runde"},{k:"end"});
  if(mode==="krise") G.pmax += 6;
  renderPersonaDraw();
}
function buildSetup(mode, challenge){
  const key = challenge ? "challenge" : mode, S = {};
  S.persona = challenge ? pickOne(PERSONAS).id : draw(key+":persona", PERSONAS.map(p=>p.id));
  S.scenes = STATIONEN.map(s=>draw(key+":st:"+s.id, SCIDS(s.id), challenge?null:(id=>SC(id).shop===UI.shop)));
  S.order = {}; S.scenes.forEach(id=>{ S.order[id]=shuffle([0,1,2]); S.order[id+"w"]=shuffle([0,1,2]); });
  S.order.strat = shuffle([0,1,2]);
  S.mini1 = RNG()<.5 ? "bau" : "tab";
  S.bau = draw(key+":bau", DIAGRAMM.map(d=>d.id));
  S.bauOrd = [0,1,2].map(()=>shuffle([0,1,2]));
  S.tab = buildTab(draw(key+":tab", TABELLEN.map(t=>t.id)));
  S.ampel = draw(key+":ampel", AMPEL.map(a=>a.id));
  S.kreis = buildKreis();
  S.event = draw(key+":ev", EREIGNISSE.map(e=>e.id));
  S.krisen = mode==="krise" ? drawN(key+":krise", KRISEN.map(k=>k.id), 3) : [];
  S.krOrd = S.krisen.map(()=>shuffle([0,1,2]));
  S.profi = draw(key+":profi", PROFIS.map(p=>p.id));
  return S;
}
function tabChart(id){ const t=TABELLEN.find(x=>x.id===id); if(t.chart) return t.chart; const f=FEHLERJAGD.find(x=>x.id===t.ref); return typeof f.chart==="string"?SC(f.chart).chart:f.chart; }
function buildTab(id){
  const ch=tabChart(id), R=ch.rows.length, C=ch.head.length-1, qs=[];
  const used=[];
  for(let n=0;n<3;n++){ let r,c; do{ r=rint(R); c=1+rint(C); }while(used.includes(r+"-"+c)); used.push(r+"-"+c);
    const r2=(r+1+rint(R-1))%R, c2=1+((c-1+1+rint(C-1))%C);
    const vals=[ch.rows[r][c], ch.rows[r][c2], ch.rows[r2][c]];
    if(new Set(vals).size<3) { n--; continue; }
    qs.push({type:"wert", r, c, q:`Zeile „${ch.rows[r][0]}“, Spalte „${ch.head[c]}“: Welcher Wert steht dort?`, a:vals, ord:shuffle([0,1,2])}); }
  /* Rückwärts: Wo steht der Wert? */
  const all=[]; ch.rows.forEach((row,r)=>row.forEach((v,c)=>{ if(c>0) all.push([r,c,v]); }));
  const uniq=all.filter(([r,c,v])=>all.filter(x=>x[2]===v).length===1 && !used.includes(r+"-"+c));
  const [r,c,v]=uniq[rint(uniq.length)];
  const r2=(r+1+rint(R-1))%R, c2=1+((c-1+1+rint(C-1))%C);
  qs.push({type:"wo", r, c, q:`Wo steht die Zahl ${v}?`, a:[`${ch.rows[r][0]} – ${ch.head[c]}`,`${ch.rows[r2][0]} – ${ch.head[c]}`,`${ch.rows[r][0]} – ${ch.head[c2]}`], ord:shuffle([0,1,2])});
  return {id, qs};
}
function buildKreis(){
  const pairs=shuffle([["arbeit","lohn"],["gueter","ausgaben"]]);
  const lanesStrom=[...shuffle(pairs[0]), ...shuffle(pairs[1])];
  const nums=shuffle([1,2,3,4]);
  const vg=shuffle(["arbeit","lohn","gueter","ausgaben"]).map(s=>{ const opts=KREISLAUF.filter(k=>k.s===s); return {s, t:opts[rint(opts.length)].t}; });
  return {uLeft:RNG()<.5, geldDash:RNG()<.5, lanes:lanesStrom.map((s,i)=>({strom:s, num:nums[i]})), vg};
}

function next(){ G.step++; renderStep(); }
function renderStep(){ window.scrollTo(0,0); const s=G.seq[G.step];
  if(s.k==="strat") return renderStrat();
  if(s.k==="st") return renderStation(s.i);
  if(s.k==="mini") return ({bau:renderBau, tab:renderTab, ampel:renderAmpel, kreis:renderKreis})[s.m]();
  if(s.k==="krise") return renderKrise(s.id);
  if(s.k==="runde") return renderRunde();
  if(s.k==="end") return renderEnd(); }

const clamp = v => Math.max(0, Math.min(100, v));

function renderStation(i){
  const st=STATIONEN[i], sc=SC(G.setup.scenes[i]), ord=G.setup.order[sc.id], word=G.setup.order[sc.id+"w"], profi=G.mode==="profi";
  const minC=Math.min(...sc.opts.map(o=>o.c)), focus=G.persona.focus.includes(st.id);
  let checked=false;
  if(G.strategy==="immer"){ G.clock-=1; checked=true; }
  APP.innerHTML = `${gameBar()}<div class="wrap stack" style="padding-top:14px">${sceneNow(i)}
   <section class="card stack">
    <div class="eyebrow">Auftrag ${i+1} von 10 · ${st.mod} · ${esc(st.n)}${focus?` · <span style="color:var(--signal)">zählt doppelt</span>`:""}</div>
    <div class="ask">${personaSVG(G.persona,"neutral",64)}<div class="bubble"><div class="who">${esc(G.persona.n)} · ${esc(G.persona.r)}</div>${esc(sc.ask)}</div></div>
    ${chartHTML(sc.chart)}
    <div id="checkBox">${checked?checkHTML(sc.chart)+`<p class="small muted">Grafik-Check gemacht: −1 Min.</p>`:G.strategy==="manchmal"?`<button class="btn alt wide" id="doCheck">${icon("lupe",20)} Grafik-Check machen (1 Min.)</button>`:`<p class="small muted">Ihr arbeitet im Tempo – ohne Grafik-Check.</p>`}</div>
    ${!profi?`<div id="tipBox"><button class="iconbtn" id="tip">Tipp ansehen (2 Min.)</button></div>`:""}
    <div class="opts" role="group" aria-label="Antworten">${ord.map((oi,j)=>{ const o=sc.opts[oi]; return optBtn(o, oi, "ABC"[j], o.c>G.clock && o.c!==minC); }).join("")}</div>
    ${profi?`<div class="stack" style="gap:8px"><div class="eyebrow">Eure Begründung</div><div class="opts" id="weil">${word.map((wi,j)=>`<button class="opt" data-w="${wi}" aria-pressed="false"><span class="k">${j+1}</span><span class="t">${esc(sc.weil[wi])}</span></button>`).join("")}</div></div>`:""}
    <button class="btn wide" id="lock" disabled>Entscheidung festlegen</button>
    <div id="after" class="stack"></div></section></div>`;
  bindBar();
  const dc=document.getElementById("doCheck"); if(dc) dc.onclick=()=>{ G.clock-=1; checked=true; document.getElementById("checkBox").innerHTML=checkHTML(sc.chart)+`<p class="small muted">Grafik-Check gemacht: −1 Min.</p>`; refreshPills(); };
  const tp=document.getElementById("tip"); if(tp) tp.onclick=()=>{ G.clock-=2; G.tipps=(G.tipps||0)+1; document.getElementById("tipBox").innerHTML=`<div class="hint"><b>Tipp:</b> ${esc(TIPPS[st.id])}</div>`; refreshPills(); };
  let sel=null, w=null;
  const upd=()=>{ document.getElementById("lock").disabled = sel==null || (profi && w==null); };
  APP.querySelectorAll(".opts[role=group] .opt").forEach(b=>b.onclick=()=>{ APP.querySelectorAll(".opts[role=group] .opt").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); sel=+b.dataset.i; upd(); });
  APP.querySelectorAll("#weil .opt").forEach(b=>b.onclick=()=>{ APP.querySelectorAll("#weil .opt").forEach(x=>x.setAttribute("aria-pressed","false")); b.setAttribute("aria-pressed","true"); w=+b.dataset.w; upd(); });
  document.getElementById("lock").onclick=()=>{
    const o=sc.opts[sel]; G.clock-=o.c;
    APP.querySelectorAll(".opt").forEach(x=>x.disabled=true); document.getElementById("lock").remove();
    const tb=document.getElementById("tipBox"); if(tb && tb.querySelector("button")) tb.remove();
    const dcb=document.getElementById("doCheck"); if(dcb) dcb.remove();
    const weilOk = profi ? w===0 : null;
    let pts = o.q===2?3:o.q===1?1:0;
    if(profi) pts = o.q===2 ? (weilOk?3:1) : (o.q===1 && weilOk ? 1 : 0);
    const conflict = G.strategy==="tempo" && o.q<2 && ["einheit","stelle","grundwert","nicht","nullprozent"].includes(o.falle);
    const mult=focus?2:1;

  APP.innerHTML = `${gameBar()}<div class="wrap stack" style="padding-top:14px">
   <section class="scorecard" aria-label="Punktekarte"><div class="eyebrow" style="color:inherit;opacity:.8">Punktekarte · zum Zeigen</div>${starsHTML(stars)}
    <div class="big num">${G.points}<span style="font-size:1.4rem"> / ${G.pmax}</span></div><h2>${esc(G.team)}</h2>
    <p>${esc(HAEUSER[G.shop].n)} · Auftraggeber: ${esc(G.persona.n)} (${esc(G.persona.r)}) · ${esc(MODN(G.mode))}${G.challenge?` · Code ${esc(G.challenge)}`:""}</p>
    ${G.newBadges?`<p><b>Neues Abzeichen:</b> ${G.newBadges.map(b=>esc(ABZEICHEN.find(x=>x.id===b).n)).join(", ")}</p>`:""}</section>
   <div class="kpis"><div class="kpi"><span class="small muted">Fachpunkte</span><b>${G.points}</b></div><div class="kpi"><span class="small muted">Restzeit</span><b>${Math.max(0,G.clock)} Min.</b></div><div class="kpi"><span class="small muted">Vertrauen</span><b>${G.trust} %</b></div><div class="kpi"><span class="small muted">Fallen</span><b>${traps.length}</b></div></div>
   <section class="card stack"><h3>Zufriedenheit von ${esc(G.persona.n)}</h3><div class="meter" role="img" aria-label="${G.mood} Prozent"><i style="width:${G.mood}%"></i></div><p class="small muted">${G.mood} % · ${G.mood>=75?"sehr zufrieden":G.mood>=50?"zufrieden":G.mood>=30?"skeptisch":"unzufrieden"}</p></section>
   <section class="card stack"><h3>Modul-Bilanz</h3>${Object.entries(mods).map(([m,[p,mx]])=>`<div class="modbar"><b>${m}</b><div class="meter"><i style="width:${mx?100*p/mx:0}%"></i></div><span class="num small">${p}/${mx}</span></div>`).join("")}
    ${Object.keys(fallen).length?`<p class="small"><b>Eure Fallen:</b> ${Object.entries(fallen).map(([f,n])=>`${esc(FN[f]||f)} (${n})`).join(" · ")}</p>`:`<p class="small"><b>Keine einzige Falle.</b> Stark!</p>`}</section>
   <section class="stack"><h2>Eure Entscheidungen</h2>${resRows}</section>
   <section class="ihk stack"><div class="eyebrow">Prüfungskasten</div><p><b>Erst lesen, dann rechnen.</b> T-A-E-L-Q · Anteil = Teil : Ganzes · 100 · Veränderung = (neu – alt) : alt · 100 · mehrere Tage: Summe durch Summe · Plus bleibt Plus · nur ankreuzen, was wirklich drinsteht · Kreislauf: Pfeil und Legende.</p></section>
   <section class="card stack"><div class="eyebrow">${icon("profi",16)} Für Profis · ${P.mod}</div><p>${esc(P.f)}</p><div id="pl"><button class="btn alt" id="plb">Lösung aufdecken</button></div></section>
   <section class="card stack"><h3>Noch eine Runde?</h3>
    <button class="btn sig wide" id="again1">Neuer Auftraggeber</button>
    <button class="btn alt wide" id="again2">Gleicher Auftraggeber – besser machen</button>
    <button class="btn alt wide" id="again3">Anderes Haus</button>
    <button class="btn alt wide" id="again4">Anderer Modus</button></section></div>`;
  bindBar();
  document.getElementById("plb").onclick=()=>document.getElementById("pl").innerHTML=`<div class="hint">${esc(P.l)}</div>`;
  document.getElementById("again1").onclick=()=>newGame({mode:G.mode==="challenge"?"klassik":G.mode});
  document.getElementById("again2").onclick=()=>{ const S=G.setup; if(G.challenge) UI.code=G.challenge; newGame({mode:G.mode, setup:S}); };
  document.getElementById("again3").onclick=()=>{ UI.shop=null; UI.mode=G.mode; renderStart(); };
  document.getElementById("again4").onclick=()=>renderStart();
  if(NOTICE){ toast(NOTICE); NOTICE=null; }
}

/* ================= QUIZ: Blitzrunde, Prüfungsmodus, Wiederholen ================= */
let Q=null;
function startQuiz(kind){
  RNG=Math.random; G=null;
  let items=[];
  if(kind==="blitz") items=drawN("blitz:q", FRAGEN.map(q=>q.id), 10).map(id=>({t:"q", id}));
  if(kind==="pruefung") items=drawN("pruefung:sc", SZENEN.map(s=>s.id), 8).map(id=>({t:"sc", id}));
  if(kind==="wieder"){ items=shuffle([...DB.wrong.sc.map(id=>({t:"sc",id})), ...DB.wrong.q.map(id=>({t:"q",id}))]).slice(0,8); }
  items.forEach(it=>it.ord=shuffle(it.t==="q"?FRAGEN.find(q=>q.id===it.id).a.map((_,i)=>i):[0,1,2]));
  Q={kind, items, i:0, ok:0, pts:0, streak:0, best:0, fixed:0, log:[]};
  renderQ();
}
function qBar(){ return `<div class="bar"><button class="brand" id="home">${icon("diagramm",24)} <span class="bt">Zahlen-Zentrale</span></button><span class="pill">${esc(MODN(Q.kind))}</span><span class="pill"><span class="num">${Q.kind==="blitz"?Q.pts:Q.ok}</span>&nbsp;${Q.kind==="blitz"?"Punkte":"richtig"}</span>${musicBtn()}</div>`; }
function renderQ(){
  window.scrollTo(0,0);
  if(Q.i>=Q.items.length) return renderQEnd();
  const it=Q.items[Q.i], blitz=Q.kind==="blitz"; let qt, ans, right, sol, ihk, chart=null, ask="";
  if(it.t==="q"){ const f=FRAGEN.find(q=>q.id===it.id); qt=f.q; ans=f.a; right=0; sol=f.sol; }
  else { const s=SC(it.id); chart=s.chart; ask=s.ask; ans=s.opts.map(o=>o.t); right=s.opts.findIndex(o=>o.q===2); sol=s.opts[right].why; ihk=s.ihk; qt=s.ask; }
  APP.innerHTML = `${qBar()}<div class="wrap stack" style="padding-top:14px"><section class="card stack">
   <div class="eyebrow">${esc(MODN(Q.kind))} · ${Q.i+1} von ${Q.items.length}${blitz&&Q.streak>1?` · Serie ${Q.streak}`:""}</div>
   ${blitz?`<div class="timer" aria-hidden="true"><i id="tbar" style="width:100%"></i></div>`:""}
   ${chart?chartHTML(chart):""}<h2 style="font-size:1.3rem">${esc(qt)}</h2>
   <div class="opts">${it.ord.map((ai,j)=>`<button class="opt" data-a="${ai}" aria-pressed="false"><span class="k">${"ABCD"[j]}</span><span class="t">${esc(ans[ai])}</span></button>`).join("")}</div>
   <div id="fb" class="stack"></div></section></div>`;
  document.getElementById("home").onclick=()=>{ MUSIC.stop(); clearInterval(Q.timer); renderStart(); }; bindMusic(()=>{ if(blitz) MUSIC.play(.5); });
  let left=20; const t0=Date.now();
  const answer=a=>{ clearInterval(Q.timer); MUSIC.stop();
    const ok=a===right; APP.querySelectorAll(".opt").forEach(x=>{ x.disabled=true; const xa=+x.dataset.a; if(xa===right) x.classList.add("r-good"); else if(xa===a) x.classList.add("r-bad"); });
    let gain=0; if(ok){ Q.ok++; Q.streak++; Q.best=Math.max(Q.best,Q.streak); gain=blitz?10+Math.min(10,2*(Q.streak-1)):0; Q.pts+=gain; } else Q.streak=0;
    const list=it.t==="q"?DB.wrong.q:DB.wrong.sc;
    if(!ok && !list.includes(it.id)) list.push(it.id);
    if(ok && Q.kind==="wieder"){ const k=list.indexOf(it.id); if(k>=0) list.splice(k,1); Q.fixed++; DB.fixed=(DB.fixed||0)+1; }
    save(); Q.log.push({it, ok});
    document.getElementById("fb").innerHTML = `<div class="${Q.kind==="pruefung"?"ihk":"hint"} stack" style="gap:6px">${a==null?"<b>Zeit abgelaufen.</b>":ok?`<b>Richtig!</b>${gain?` +${gain} Punkte`:""}`:"<b>Nicht richtig.</b>"}
      ${Q.kind==="pruefung"?`<div class="eyebrow">Musterlösung</div><p><b>${esc(ans[right])}</b></p><p>${esc(sol)}</p><div class="eyebrow">Satzbaustein für die Prüfung</div><p>${esc(ihk||"")}</p>`:`<p>${esc(sol)}</p>`}</div>
      <button class="btn sig wide" id="nx">${Q.i<Q.items.length-1?"Nächste Frage":"Zum Ergebnis"}</button>`;
    const nx=document.getElementById("nx"); nx.onclick=()=>{ Q.i++; renderQ(); }; nx.focus({preventScroll:true}); };
  APP.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.a));
  if(blitz){ MUSIC.play(Math.min(1,.3+Q.i*.07)); Q.timer=setInterval(()=>{ left=20-(Date.now()-t0)/1000; const tb=document.getElementById("tbar"); if(!tb){ clearInterval(Q.timer); return; } tb.style.width=Math.max(0,left/20*100)+"%"; if(left<=0) answer(null); },200); }
}
function renderQEnd(){
  const n=Q.items.length, pct=n?Q.ok/n:0, stars=pct>=.85?3:pct>=.65?2:pct>=.4?1:0;
  MUSIC.tusch();
  const earn=b=>{ if(!DB.badges.includes(b)){ DB.badges.push(b); Q.nb=(Q.nb||[]).concat(b); } };
  if(Q.kind==="blitz"){ if(Q.best>=8) earn("serie"); const prev=parseInt(DB.rec.blitz)||0; if(Q.pts>prev) DB.rec.blitz=`${Q.pts} Punkte`; }
  if(Q.kind==="pruefung"){ if(pct>=.8) earn("pruefung"); const prev=parseInt(DB.rec.pruefung)||0, est=Math.round(pct*40); if(est>prev) DB.rec.pruefung=`${est} von 40 P.`; }
  if(Q.kind==="wieder" && (DB.fixed||0)>=5) earn("ausgebuegelt");
  if(n) DB.stars+=stars; save();
  APP.innerHTML = `${qBar()}<div class="wrap stack" style="padding-top:14px">
   <section class="scorecard"><div class="eyebrow" style="color:inherit;opacity:.8">Punktekarte · ${esc(MODN(Q.kind))}</div>${starsHTML(stars)}
    <div class="big num">${Q.kind==="blitz"?Q.pts:Q.ok}<span style="font-size:1.4rem">${Q.kind==="blitz"?" Punkte":" / "+n}</span></div>
    <p>${Q.ok} von ${n} richtig${Q.kind==="blitz"?` · längste Serie: ${Q.best}`:""}${Q.kind==="pruefung"?` · hochgerechnet auf die Klausur: etwa ${Math.round(pct*40)} von 40 Punkten`:""}${Q.kind==="wieder"?` · ${Q.fixed} Fehler ausgebügelt`:""}</p>
    ${Q.nb?`<p><b>Neues Abzeichen:</b> ${Q.nb.map(b=>esc(ABZEICHEN.find(x=>x.id===b).n)).join(", ")}</p>`:""}</section>
   ${n?"":`<div class="card">Keine offenen Fehler mehr – stark!</div>`}
   <section class="card stack"><h3>Was ihr nachlesen solltet</h3>${Q.log.filter(l=>!l.ok).map(l=>{ const t=l.it.t==="q"?FRAGEN.find(q=>q.id===l.it.id):SC(l.it.id); return `<div class="res bad"><b>${esc(t.q||t.ask)}</b><p class="small">${esc(t.sol||t.opts.find(o=>o.q===2).why)}</p></div>`; }).join("")||"<p>Alles richtig!</p>"}</section>
   <div class="row"><button class="btn sig" id="ag">Noch eine Runde</button><button class="btn alt" id="hm">Zum Start</button></div></div>`;
  document.getElementById("home").onclick=renderStart; bindMusic();
  document.getElementById("ag").onclick=()=>startQuiz(Q.kind); document.getElementById("hm").onclick=renderStart;
  if(NOTICE){ toast(NOTICE); NOTICE=null; }
}

/* ================= FEHLERJAGD ================= */
let F=null;
function startFJ(){ RNG=Math.random; G=null; F={cases:drawN("fehler:fj", FEHLERJAGD.map(f=>f.id), 2), i:0, pts:0, max:0, perfect:true}; renderFJ(); }
function renderFJ(){
  window.scrollTo(0,0);
  if(F.i>=F.cases.length) return renderFJEnd();
  const C=FEHLERJAGD.find(f=>f.id===F.cases[F.i]), flag={}, why={};
  const errN=C.st.filter(s=>!s.ok).length;
  APP.innerHTML = `<div class="bar"><button class="brand" id="home">${icon("diagramm",24)} <span class="bt">Zahlen-Zentrale</span></button><span class="pill">Fehlerjagd ${F.i+1}/${F.cases.length}</span><span class="pill"><span class="num">${F.pts}</span>&nbsp;P.</span>${musicBtn()}</div>
   <div class="wrap stack" style="padding-top:14px"><section class="card stack">
   <div class="ask">${personaSVG(KEVIN,"good",64)}<div class="bubble"><div class="who">Kollege Kevin</div>Hier ist meine Präsentation „${esc(C.titel)}“. Ich bin mir sicher: alles richtig!</div></div>
   ${chartHTML(C.chart)}
   <p><b>Kevin hat ${errN} Fehler eingebaut.</b> Tippt alle falschen Aussagen an.</p>
   <div class="stack" id="sts">${C.st.map((s,i)=>`<button class="stmt" data-i="${i}" aria-pressed="false"><span class="mark" aria-hidden="true">!</span><span>${esc(s.t)}</span></button><div class="why" data-i="${i}"></div>`).join("")}</div>
   <button class="btn sig wide" id="chk">Fehler markiert – weiter</button><div id="fb" class="stack"></div></section></div>`;
  document.getElementById("home").onclick=renderStart; bindMusic();
  APP.querySelectorAll(".stmt").forEach(b=>b.onclick=()=>{ const i=b.dataset.i; flag[i]=!flag[i]; b.setAttribute("aria-pressed", flag[i]?"true":"false"); });
  document.getElementById("chk").onclick=()=>{
    APP.querySelectorAll(".stmt").forEach(b=>b.disabled=true); document.getElementById("chk").remove();
    const found=C.st.map((s,i)=>i).filter(i=>flag[i] && !C.st[i].ok);
    found.forEach(i=>{ const box=APP.querySelector(`.why[data-i="${i}"]`); box.innerHTML=`<p class="small" style="margin:6px 0 4px"><b>Welche Falle ist das?</b></p><div class="chips">${Object.entries(FALLEN).map(([k,n])=>`<button class="chip" data-f="${k}" aria-pressed="false">${n}</button>`).join("")}</div>`;
      box.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{ box.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false")); c.setAttribute("aria-pressed","true"); why[i]=c.dataset.f; }); });
    document.getElementById("fb").innerHTML=`${found.length?`<p class="small muted">Wählt für jeden gefundenen Fehler die Falle.</p>`:""}<button class="btn sig wide" id="ev">Auswerten</button>`;
    document.getElementById("ev").onclick=()=>{ let p=0;
      C.st.forEach((s,i)=>{ const b=APP.querySelector(`.stmt[data-i="${i}"]`), box=APP.querySelector(`.why[data-i="${i}"]`);
        box.querySelectorAll(".chip").forEach(c=>c.disabled=true);
        let msg="";
        if(!s.ok && flag[i]){ p++; const r=why[i]===s.f; if(r) p++; else F.perfect=false; msg=`<span style="color:var(--good);font-weight:700">✓ Fehler gefunden.</span> ${r?"Falle richtig erkannt.":`Die Falle heißt: ${FALLEN[s.f]}.`} ${esc(s.w)}`; }
        else if(!s.ok){ F.perfect=false; msg=`<span style="color:var(--bad);font-weight:700">✗ Übersehen.</span> ${FALLEN[s.f]}: ${esc(s.w)}`; }
        else if(flag[i]){ p--; F.perfect=false; msg=`<span style="color:var(--bad);font-weight:700">✗ Fehlalarm.</span> Diese Aussage stimmt.`; }
        if(msg) box.innerHTML=`<p class="small" style="margin:4px 0 6px">${msg}</p>`; });
      p=Math.max(0,p); F.pts+=p; F.max+=2*errN;
      document.getElementById("fb").innerHTML=`<div class="hint"><b>${p} von ${2*errN} Punkten</b> für diese Präsentation.</div><button class="btn sig wide" id="nx">${F.i<F.cases.length-1?"Nächste Präsentation":"Zum Ergebnis"}</button>`;
      document.getElementById("nx").onclick=()=>{ F.i++; renderFJ(); }; };
  };
}
function renderFJEnd(){
  const pct=F.max?F.pts/F.max:0, stars=pct>=.85?3:pct>=.65?2:pct>=.4?1:0;
  let nb=null; if(F.perfect && !DB.badges.includes("jaeger")){ DB.badges.push("jaeger"); nb="Fehlerjäger"; }
  const prev=parseInt(DB.rec.fehler)||0; if(F.pts>prev) DB.rec.fehler=`${F.pts} von ${F.max} P.`;
  DB.stars+=stars; save(); MUSIC.tusch();
  APP.innerHTML = `<div class="bar"><button class="brand" id="home">${icon("diagramm",24)} <span class="bt">Zahlen-Zentrale</span></button>${musicBtn()}</div><div class="wrap stack" style="padding-top:14px">
   <section class="scorecard"><div class="eyebrow" style="color:inherit;opacity:.8">Punktekarte · Fehlerjagd</div>${starsHTML(stars)}<div class="big num">${F.pts}<span style="font-size:1.4rem"> / ${F.max}</span></div>
   <p>${F.perfect?"Alle Fehler gefunden, alle Fallen erkannt, kein Fehlalarm.":"Merkt euch die vier Fallen: falsche Stelle · Richtung verdreht · steht nicht drin · Übertreibung."}</p>${nb?`<p><b>Neues Abzeichen:</b> ${nb}</p>`:""}</section>
   <div class="row"><button class="btn sig" id="ag">Noch eine Runde</button><button class="btn alt" id="hm">Zum Start</button></div></div>`;
  document.getElementById("home").onclick=renderStart; bindMusic();
  document.getElementById("ag").onclick=startFJ; document.getElementById("hm").onclick=renderStart;
  if(NOTICE){ toast(NOTICE); NOTICE=null; }
}

window.__zz = { get G(){ return G; }, get DB(){ return DB; }, get Q(){ return Q; }, get F(){ return F; } };
renderStart();

</script>
