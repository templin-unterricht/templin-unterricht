<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Das Bremerhaven-Experiment</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
body{margin:0}
/* Layout: eine Spalte wie ein Azubi-Handy – oben Statusleiste (Konto, Ärger, Wissen), darunter Hafen-Szene, darunter Chat; Auswertung als Kassenbon */
:root{
  --bg:#e6edeb; --surface:#ffffff; --surface2:#f1f5f4; --ink:#11282b; --muted:#4c6164; --line:#c5d3d1;
  --teal:#0d6a64; --on-teal:#ffffff; --tag:#ffd23f; --on-tag:#2b2100;
  --bin:#ffffff; --bout:#d6f0ea; --sys:#eef3f2;
  --good:#1d7a46; --bad:#c0392b; --mid:#9a6400; --good-bg:#dcf1e4; --bad-bg:#fbe3e0; --mid-bg:#f8edd3;
  --paper:#fbfaf5; --on-paper:#1f2222; --phone:#13262a; --on-phone:#e8f2f0;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Courier New",monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1719; --surface:#142326; --surface2:#1a2d31; --ink:#e2eeec; --muted:#9fb5b3; --line:#2c4246;
  --teal:#4fc2b6; --on-teal:#04201d; --tag:#f0c43a; --on-tag:#241b00;
  --bin:#1b3034; --bout:#164640; --sys:#17292c;
  --good:#5fd08f; --bad:#f08a7c; --mid:#e8c15c; --good-bg:#153527; --bad-bg:#3f211d; --mid-bg:#3a3018;
  --paper:#f2efe6; --on-paper:#1f2222; --phone:#050c0d; --on-phone:#e8f2f0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1719; --surface:#142326; --surface2:#1a2d31; --ink:#e2eeec; --muted:#9fb5b3; --line:#2c4246;
  --teal:#4fc2b6; --on-teal:#04201d; --tag:#f0c43a; --on-tag:#241b00;
  --bin:#1b3034; --bout:#164640; --sys:#17292c;
  --good:#5fd08f; --bad:#f08a7c; --mid:#e8c15c; --good-bg:#153527; --bad-bg:#3f211d; --mid-bg:#3a3018;
  --paper:#f2efe6; --on-paper:#1f2222; --phone:#050c0d; --on-phone:#e8f2f0; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:17px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--phone)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.08;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,8.5vw,3.4rem)}
h2{font-size:clamp(1.35rem,5vw,1.8rem)}
h3{font-size:1.15rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tag);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)} .small{font-size:.9rem} .mono{font-family:var(--mono)}
.stack{display:grid;gap:12px} .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}

/* Statusleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--phone);color:var(--on-phone)}
.bar .in{max-width:720px;margin:0 auto;display:grid;gap:6px}
.bar .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:6px;white-space:nowrap}
.brand svg{width:24px;height:24px}
.clock{font-family:var(--mono);font-size:.85rem;opacity:.85;white-space:nowrap}
.ib{display:inline-flex;align-items:center;gap:5px;border:1.5px solid rgba(255,255,255,.28);background:transparent;color:var(--on-phone);border-radius:999px;padding:3px 10px;font-weight:700;font-size:.82rem;cursor:pointer;min-height:32px}
.ib svg{width:16px;height:16px}
.ib[aria-pressed="true"]{background:var(--tag);color:var(--on-tag);border-color:transparent}
.meters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.meter{display:grid;gap:2px;min-width:0}
.meter .lab{display:flex;align-items:center;gap:4px;font-size:.75rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter .lab svg{width:13px;height:13px;flex:none}
.meter .lab b{margin-left:auto;font-family:var(--mono);font-weight:600}
.meter .tr{height:7px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden}
.meter .fi{height:100%;border-radius:4px;transition:width .6s ease}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.18)}
.steps i.ok{background:#5fd08f}.steps i.no{background:#f08a7c}.steps i.mi{background:#9fd8d0}.steps i.now{background:var(--tag)}
.delta{display:inline-block;font-family:var(--mono);font-weight:600;font-size:.8rem;padding:0 6px;border-radius:6px;margin-left:4px}
.delta.up{background:var(--good-bg);color:var(--good)}.delta.dn{background:var(--bad-bg);color:var(--bad)}

main{padding-top:16px;display:grid;gap:16px;overflow-x:clip}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.eyebrow{font-family:var(--mono);font-weight:600;font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--teal)}
.lead{color:var(--muted)}
.btn{border:none;background:var(--teal);color:var(--on-teal);font-weight:700;font-size:1.05rem;padding:13px 20px;border-radius:14px;cursor:pointer;min-height:50px;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn.tag{background:var(--tag);color:var(--on-tag)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--line);font-weight:700;font-size:.85rem}
.chip.tag{background:var(--tag);color:var(--on-tag);border-color:transparent}
input[type=text]{width:100%;border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 12px;min-height:48px}

/* Hero */
.hero{display:grid;gap:14px;padding-top:6px}
.hero .kicker{font-family:var(--mono);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hero h1 .q{color:var(--teal)}
.heroart{border-radius:var(--r);overflow:hidden;border:1.5px solid var(--line)}
.heroart>svg,.scene>svg{display:block;width:100%;height:auto}
.scene{border-radius:var(--r);overflow:hidden;border:1.5px solid var(--line);background:#16353a}

/* Module */
.mods{display:flex;gap:6px;flex-wrap:wrap}
.mods button{min-width:48px;min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface2);font-weight:700;cursor:pointer;display:grid;place-items:center;line-height:1.1;padding:4px 8px}
.mods button small{font-weight:400;font-size:.68rem;color:var(--muted)}
.mods button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal);border-color:transparent}
.mods button[aria-pressed="true"] small{color:inherit;opacity:.85}
.check{display:flex;gap:8px;align-items:center;font-size:.95rem;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--teal)}

/* Modus-Karten */
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;cursor:pointer;display:grid;gap:4px;align-content:start;min-height:128px}
.mode:hover{border-color:var(--teal)}
.mode svg{width:30px;height:30px;color:var(--teal)}
.mode b{font-family:var(--display);font-size:1.08rem}
.mode span{font-size:.86rem;color:var(--muted);line-height:1.35}
.mode .pg{height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:4px}
.mode .pg i{display:block;height:100%;background:var(--teal)}
.mode .nw{position:absolute;top:10px;right:10px;font-size:.7rem;font-weight:700;background:var(--tag);color:var(--on-tag);border-radius:999px;padding:1px 7px}
.mode[disabled]{opacity:.5;cursor:not-allowed}
.mode.lock::after{content:"gesperrt";position:absolute;top:10px;right:10px;font-size:.7rem;font-weight:700;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
@media (min-width:640px){.modes{grid-template-columns:repeat(4,minmax(0,1fr))}}

/* Persona-Karte */
.turn{animation:turn .6s ease both}
@keyframes turn{from{transform:perspective(900px) rotateY(80deg);opacity:.2}to{transform:none;opacity:1}}
.flip{perspective:1000px}
.flip .inner{position:relative;transition:transform .7s;transform-style:preserve-3d;min-height:360px}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);padding:18px;display:grid;gap:10px;align-content:start}
.flip .back{transform:rotateY(180deg)}
.flip .front{place-items:center;align-content:center;background:var(--teal);color:var(--on-teal);text-align:center}
.pcard{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center}
.pcard svg{width:96px;height:96px}
.facts{display:grid;gap:4px;padding:0;margin:0;list-style:none}
.facts li{display:flex;gap:8px;align-items:baseline}
.facts li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--teal);flex:none;transform:translateY(-1px)}
.sign{display:inline-block;font-family:var(--display);font-weight:800;color:#fff;padding:4px 10px;border-radius:8px}

/* Chat */
.phone{background:var(--surface);border:1.5px solid var(--line);border-radius:22px;overflow:hidden;min-width:0}
.ph-head{display:flex;gap:10px;align-items:center;padding:10px 14px;background:var(--surface2);border-bottom:1.5px solid var(--line)}
.ph-head svg{width:42px;height:42px;flex:none}
.ph-head b{display:block;line-height:1.2}
.ph-head small{color:var(--muted)}
.thread{padding:14px;display:grid;gap:10px;background:
  radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1.5px) 0 0/18px 18px,var(--surface)}
.bub{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.bub.in{background:var(--bin);border:1.5px solid var(--line);border-bottom-left-radius:4px;justify-self:start}
.bub.out{background:var(--bout);border-bottom-right-radius:4px;justify-self:end}
.bub.sys{justify-self:center;max-width:94%;background:var(--sys);border:1.5px dashed var(--line);font-size:.92rem;color:var(--muted);text-align:center;border-radius:12px}
.bub .tm{display:block;font-family:var(--mono);font-size:.7rem;color:var(--muted);text-align:right;margin-top:2px}
.typing{justify-self:start;background:var(--bin);border:1.5px solid var(--line);border-radius:16px;padding:10px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{opacity:.25;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.answers{display:grid;gap:8px;padding:12px 14px 14px;border-top:1.5px solid var(--line);background:var(--surface2)}
.answers .hint{font-size:.85rem;color:var(--muted);font-weight:700}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:11px 13px;cursor:pointer;min-height:50px;display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:1px}
.opt[aria-pressed="true"]{border-color:var(--teal);background:var(--bout)}
.opt[aria-pressed="true"] .dot{border-color:var(--teal);background:radial-gradient(circle,var(--teal) 45%,transparent 50%)}
.opt.gone{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.opt[disabled]{cursor:default}
.term{border-radius:14px;background:var(--tag);color:var(--on-tag);padding:12px 14px;display:grid;gap:2px}
.term .eyebrow{color:var(--on-tag);opacity:.8}
.term b{font-family:var(--display);font-size:1.15rem}

/* Mini-Spiele */
.mini-item{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;background:var(--surface)}
.mini-item .lbl{font-family:var(--mono);font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:44px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface2);font-weight:700;cursor:pointer;padding:6px 10px;font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-teal);border-color:transparent}
.seg button.right{outline:3px solid var(--good)}
.mini-item.ok{border-color:var(--good);background:var(--good-bg)}
.mini-item.no{border-color:var(--bad);background:var(--bad-bg)}
.fb{font-size:.92rem}

/* Ergebnis */
.ok-t{color:var(--good)}.no-t{color:var(--bad)}.mid-t{color:var(--mid)}
.bon{background:var(--paper);color:var(--on-paper);font-family:var(--mono);font-size:.88rem;line-height:1.5;padding:22px 18px 16px;max-width:420px;width:100%;justify-self:center;position:relative;
  -webkit-mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) bottom/16px 10px repeat-x;
          mask:linear-gradient(#000 0 0) top/100% calc(100% - 10px) no-repeat,radial-gradient(circle 6px at 8px 100%,transparent 6px,#000 6.5px) bottom/16px 10px repeat-x;
  box-shadow:0 10px 30px rgba(0,0,0,.18)}
.bon .c{text-align:center}
.bon .big{font-size:1.15rem;font-weight:600;letter-spacing:.04em}
.bon hr{border:none;border-top:1.5px dashed #9a9a92;margin:8px 0}
.bon .ln{display:flex;gap:6px}
.bon .ln span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bon .stars{font-size:1.5rem;letter-spacing:.2em;text-align:center}
.bon svg{display:block;margin:8px auto 0;width:80%;height:46px}
.rev{display:grid;gap:10px}
.rv{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:6px;background:var(--surface)}
.rv .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mark{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;font-weight:700;flex:none}
.mark.ok{background:var(--good-bg);color:var(--good)}.mark.mid{background:var(--mid-bg);color:var(--mid)}.mark.no{background:var(--bad-bg);color:var(--bad)}
.ihk{border-left:4px solid var(--teal);background:var(--surface2);padding:8px 10px;border-radius:0 10px 10px 0;font-size:.92rem}
.better{font-size:.93rem}
details.wb{border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface)}
details.wb summary{cursor:pointer;font-weight:700}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.badge{display:grid;justify-items:center;text-align:center;gap:4px;padding:8px;border-radius:12px;border:1.5px solid var(--line);font-size:.78rem;background:var(--surface)}
.badge svg{width:44px;height:44px}
.badge.off{opacity:.38;filter:grayscale(1)}
.timer{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--tag);transition:width .25s linear}
.note{font-size:.9rem;padding:10px 12px;border-radius:12px;background:var(--mid-bg);color:var(--ink)}
.confirm{border:1.5px solid var(--bad);background:var(--bad-bg);border-radius:12px;padding:12px;display:grid;gap:8px}
.walk{animation:walk 2.4s ease-in-out both}
@keyframes walk{from{transform:translateX(-60px)}to{transform:none}}
.pop{animation:pop .35s ease both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.es{display:block;margin-top:4px;padding-top:4px;border-top:1px dashed var(--line);font-style:italic;font-size:.9em;color:var(--muted)}
.term .es{color:var(--on-tag);opacity:.85;border-color:rgba(0,0,0,.2)}
.roles{display:flex;flex-wrap:wrap;gap:4px 14px;padding:6px 14px;font-size:.85rem;background:var(--sys);border-bottom:1.5px solid var(--line)}
.frame{background:var(--surface);border:1.5px dashed var(--teal);border-radius:12px;padding:10px 12px;line-height:1.6}
.gap{background:var(--tag);color:var(--on-tag);border-radius:6px;padding:0 6px;font-weight:700}
.figs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fig{display:grid;justify-items:center;gap:2px;border:1.5px solid var(--line);background:var(--surface2);border-radius:14px;padding:10px;cursor:pointer;min-height:48px}
.fig svg{width:64px;height:64px}
.fig[aria-pressed="true"]{border-color:var(--teal);background:var(--bout);outline:2px solid var(--teal)}
.konto{display:grid;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.kz{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-bottom:1px dashed var(--line);align-items:flex-end}
.kz .mono{white-space:nowrap;font-variant-numeric:tabular-nums}
.kz.sum{border-bottom:none;background:var(--surface2)}
.slip{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline;font-size:.95rem}
.slip span:first-child{grid-column:1/-1;font-weight:700}
.slip .mono{font-variant-numeric:tabular-nums;white-space:nowrap}
.slip .mono:last-child{text-align:right}
/* Tafel (Beamer) */
.tafel{max-width:1200px;margin:0 auto;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.tafel{grid-template-columns:340px minmax(0,1fr)}}
.tafel canvas{width:100%;max-width:300px;height:auto;border-radius:12px;background:#fff;display:block}
.rank{width:100%;border-collapse:collapse;font-size:1.05rem}
.rank th,.rank td{padding:8px 10px;border-bottom:1.5px solid var(--line);text-align:left}
.rank td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
.rank tr.top td{background:var(--mid-bg)}
.bigcode{font-family:var(--mono);font-size:2.2rem;font-weight:600;letter-spacing:.12em}
.dotc{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px}.dotc.on{background:var(--good)}
.tafel .card{align-content:start}.tafel .card>.btn{justify-self:start}

</style>
</head><body>

{id:'a4',area:'m1',from:'deniz',title:'Die Chefin zahlt mehr',src:0,
 msg:p=>`Die Chefin verdient bestimmt 6.000 €, ich 2.100 €. Sie zahlt also viel mehr Krankenversicherung. Beim Arzt bekommen wir aber dieselbe Behandlung. Unfair, oder?`,
 opts:[
  {t:'Das ist das Solidaritätsprinzip: Der Beitrag richtet sich nach dem Einkommen. Die Leistungen sind für alle gleich.',law:2,tone:'s',why:'Richtig. Solidaritätsprinzip: „Einer für alle, alle für einen“. Beitrag nach Einkommen, nicht nach Risiko.'},
  {t:'Stimmt. Wer mehr zahlt, müsste auch besser behandelt werden.',law:0,tone:'n',why:'Falsch. In der gesetzlichen Versicherung gibt es dieselben Leistungen für alle, egal wie hoch der Beitrag ist.'},
  {t:'Gar nicht unfair. Alle zahlen genau denselben Betrag in Euro.',law:0,tone:'s',why:'Falsch. Alle zahlen denselben Prozentsatz. Wer mehr verdient, zahlt mehr Euro.'}
 ],
 term:'Solidaritätsprinzip',def:'Der Beitrag richtet sich nach dem Einkommen, nicht nach dem Risiko. Alle bekommen dieselben Leistungen.',
 ihk:'Solidaritätsprinzip: Die Beiträge richten sich nach dem Einkommen und nicht nach dem Risiko. Alle Versicherten erhalten die gleichen Leistungen.',
 weil:'… weil sich der Beitrag nach dem Einkommen richtet und alle dieselben Leistungen bekommen.'},
{id:'a5',area:'m1',from:'mama',title:'Muss Ole extra versichert werden?',src:0,cond:p=>p.b.kind,
 msg:p=>`Jetzt, wo du arbeitest: Muss Ole eigentlich extra krankenversichert werden? Kostet das was?`,
 opts:[
  {t:'Nein. Ole ist über meine Krankenkasse kostenlos familienversichert.',law:2,tone:'s',why:'Richtig. Kinder ohne eigenes Einkommen sind kostenlos mitversichert (Familienversicherung).'},
  {t:'Ja. Für Ole muss ich einen eigenen Beitrag zahlen.',law:0,tone:'n',eur:-30,why:'Falsch. Kinder ohne eigenes Einkommen sind kostenlos familienversichert.'},
  {t:'Nein. Kinder sind beim Jobcenter versichert.',law:0,tone:'s',why:'Falsch. Das Jobcenter zahlt Grundsicherung. Ole ist über deine Krankenkasse familienversichert.'}
 ],
 term:'Familienversicherung',def:'Kinder und Ehepartner ohne eigenes Einkommen sind kostenlos mitversichert.',
 ihk:'Kinder und Ehepartner ohne eigenes Einkommen sind in der gesetzlichen Krankenversicherung beitragsfrei familienversichert.',
 weil:'… weil Kinder ohne eigenes Einkommen kostenlos familienversichert sind.'},
{id:'a6',area:'m1',from:'lohn',title:'Wo ist die Unfallversicherung?',src:4,
 msg:p=>`Auf deinem Plan stehen vier Beiträge, die von deiner Vergütung abgehen. Weißt du, warum die Unfallversicherung nicht dabei ist?`,
 opts:[
  {t:'Die Unfallversicherung zahlt der Betrieb allein – an die Berufsgenossenschaft.',law:2,tone:'s',why:'Richtig. Die Unfallversicherung zahlt nur der Arbeitgeber. Träger für den Handel ist die BGHW.'},
  {t:'Weil Azubis nicht unfallversichert sind.',law:0,tone:'n',arg:8,why:'Falsch. Alle Beschäftigten sind ab dem ersten Tag unfallversichert, auch Azubis.'},
  {t:'Die zahlt meine Krankenkasse für mich mit.',law:0,tone:'s',why:'Falsch. Die Unfallversicherung zahlt der Arbeitgeber allein an die Berufsgenossenschaft.'}
 ],
 term:'Berufsgenossenschaft',def:'Träger der Unfallversicherung. Für den Handel: die BGHW. Den Beitrag zahlt nur der Arbeitgeber.',
 ihk:'Träger der gesetzlichen Unfallversicherung sind die Berufsgenossenschaften. Die Beiträge zahlt allein der Arbeitgeber.',
 weil:'… weil der Arbeitgeber die Unfallversicherung allein bezahlt.'},
/* ---------- Modul 2: Krank ---------- */
{id:'k1',area:'m2a',from:'chef',title:'Fieber am Montagmorgen',src:5,
 msg:p=>`Moin ${N(p)}! Du stehst heute ab 9:30 Uhr auf dem Plan. Alles klar bei dir?`,
 note:'6:45 Uhr. Du hast 39 Grad Fieber.',
 opts:[
  {t:'Ich bin krank und komme heute nicht. Ab dem 4. Tag bringe ich eine Krankschreibung – oder früher, wenn Sie das wollen.',law:2,tone:'s',why:'Richtig. Sofort Bescheid sagen. Ab dem 4. Tag braucht man eine ärztliche Bescheinigung. Der Betrieb darf sie schon ab dem 1. Tag verlangen.'},
  {t:'Ich antworte gar nicht und bleibe zu Hause. Melden muss ich mich erst mit der Krankschreibung.',law:0,tone:'n',arg:15,why:'Falsch. Du musst dich sofort krankmelden, also vor Arbeitsbeginn.'},
  {t:'Ich komme trotzdem. Sonst bekomme ich kein Geld.',law:0,tone:'n',why:'Falsch. Bei Krankheit zahlt der Betrieb bis zu 6 Wochen weiter. Mit Fieber zur Arbeit schadet dir und den anderen.'}
 ],
 term:'Krankmeldung',def:'Sofort dem Betrieb Bescheid sagen. Ab dem 4. Tag braucht man eine ärztliche Bescheinigung.',
 ihk:'Der Arbeitnehmer muss die Arbeitsunfähigkeit sofort melden. Ab dem 4. Kalendertag ist eine ärztliche Bescheinigung nötig; der Arbeitgeber darf sie schon ab dem 1. Tag verlangen.',
 weil:'… weil man sich sofort krankmelden muss und ab dem 4. Tag eine Bescheinigung braucht.'},
{id:'k2',area:'m2a',from:'chef',title:'Wo ist der gelbe Zettel?',src:0,
 msg:p=>`Die Ärztin hat dich für eine Woche krankgeschrieben? Dann bring mir bitte den gelben Zettel vorbei.`,
 opts:[
  {t:'Den gelben Zettel gibt es nicht mehr. Die Praxis schickt die Krankschreibung elektronisch an die Kasse. Sie rufen sie dort ab.',law:2,tone:'s',why:'Richtig. Die Praxis meldet die Krankschreibung elektronisch (eAU). Der Betrieb ruft sie bei der Krankenkasse ab.'},
  {t:'Mache ich. Ich komme morgen mit Fieber vorbei und bringe ihn.',law:1,tone:'n',why:'Teilweise. Gemeldet hast du dich. Aber den Zettel gibt es nicht mehr: Der Betrieb ruft die eAU bei der Krankenkasse ab.'},
  {t:'Meine Krankschreibung geht Sie nichts an.',law:0,tone:'p',arg:10,why:'Falsch. Der Betrieb hat ein Recht auf den Nachweis. Er ruft die eAU bei der Krankenkasse ab.'}
 ],
 term:'eAU',def:'Elektronische Arbeitsunfähigkeitsbescheinigung: Die Praxis schickt sie an die Kasse, der Betrieb ruft sie dort ab.',
 ihk:'Die Arztpraxis übermittelt die Arbeitsunfähigkeitsbescheinigung elektronisch an die Krankenkasse (eAU); der Arbeitgeber ruft sie dort ab.',
 weil:'… weil die Krankschreibung elektronisch an die Kasse geht und der Betrieb sie dort abruft.'},
{id:'k3',area:'m2a',from:'mama',title:'Bekommst du noch Geld?',src:5,
 msg:p=>`Du bist jetzt schon drei Wochen krank, wegen deinem Knie. Bekommst du überhaupt noch Geld?`,
 opts:[
  {t:'Ja. Die ersten 6 Wochen zahlt der Betrieb meine volle Vergütung weiter.',law:2,tone:'s',why:'Richtig. Entgeltfortzahlung: Der Betrieb zahlt bis zu 6 Wochen weiter, zu 100 %.'},
  {t:'Ja. Ab dem ersten Tag zahlt die Krankenkasse Krankengeld.',law:0,tone:'s',why:'Falsch. Die ersten 6 Wochen zahlt der Betrieb (Entgeltfortzahlung). Krankengeld gibt es erst ab der 7. Woche.'},
  {t:'Nein. Wer krank ist, bekommt kein Geld.',law:0,tone:'n',why:'Falsch. Der Betrieb zahlt bis zu 6 Wochen weiter, danach zahlt die Krankenkasse Krankengeld.'}
 ],
 term:'Entgeltfortzahlung',def:'Bei Krankheit zahlt der Betrieb bis zu 6 Wochen das volle Gehalt weiter.',
 ihk:'Bei Arbeitsunfähigkeit zahlt der Arbeitgeber das Arbeitsentgelt bis zu sechs Wochen in voller Höhe weiter (Entgeltfortzahlung).',
 weil:'… weil der Betrieb bei Krankheit bis zu 6 Wochen das volle Gehalt weiterzahlt.'},
{id:'k4',area:'m2a',from:'kasse',title:'Wie viel Krankengeld?',src:0,
 msg:p=>`Sie sind jetzt in der 8. Woche krank. Ab jetzt zahlen wir Krankengeld. Wissen Sie, wie viel das ist?`,
 note:'Deine Vergütung: 1.100 € brutto, 870 € netto.',
 opts:[
  {t:'Meine volle Vergütung, wie vorher.',law:0,tone:'s',eur:-60,why:'Falsch. Das Krankengeld ist weniger: 70 % vom Brutto, höchstens 90 % vom Netto.'},
  {t:'70 % vom Brutto, aber höchstens 90 % vom Netto. Bei mir sind das 770 € im Monat.',law:2,tone:'s',why:'Richtig. 1.100 € × 70 : 100 = 770 €. Grenze: 870 € × 90 : 100 = 783 €. Der kleinere Betrag gilt: 770 €.'},
  {t:'50 % vom Netto, also 435 € im Monat.',law:0,tone:'s',why:'Falsch. Krankengeld: 70 % vom Brutto (770 €), höchstens 90 % vom Netto (783 €). Also 770 €.'}
 ],
 term:'Krankengeld',def:'Ab der 7. Woche zahlt die Krankenkasse: 70 % vom Brutto, höchstens 90 % vom Netto.',
 ihk:'Nach dem Ende der Entgeltfortzahlung zahlt die Krankenkasse Krankengeld: 70 % des Bruttoentgelts, höchstens 90 % des Nettoentgelts, für dieselbe Krankheit bis zu 78 Wochen in drei Jahren.',
 weil:'… weil das Krankengeld 70 % vom Brutto beträgt, aber höchstens 90 % vom Netto.'},
{id:'k5',area:'m2a',from:'mia',title:'Der Zusatzbeitrag steigt',src:0,
 msg:p=>`Hast du den Brief auch bekommen? Unsere Krankenkasse erhöht den Zusatzbeitrag von 2,5 auf 3,4 %. Kann man da was machen?`,
 opts:[
  {t:'Ja. Wenn die Kasse den Zusatzbeitrag erhöht, darf man sofort zu einer günstigeren Kasse wechseln.',law:2,tone:'s',eur:50,why:'Richtig. Bei einer Erhöhung darf man sofort wechseln. 0,9 % Unterschied, davon zahlst du die Hälfte: bei 1.100 € rund 5 € im Monat.'},
  {t:'Nein. Die Krankenkasse kann man nie wechseln.',law:0,tone:'n',eur:-50,why:'Falsch. Erhöht die Kasse den Zusatzbeitrag, darf man sofort wechseln.'},
  {t:'Ja. Dann trete ich aus der gesetzlichen Krankenversicherung aus.',law:0,tone:'p',arg:10,why:'Falsch. Austreten geht nicht – Pflichtversicherung. Aber du darfst die Kasse wechseln.'}
 ],
 term:'Zusatzbeitrag',def:'Jede Kasse legt ihn selbst fest (2027 im Schnitt 2,9 %). Er wird je zur Hälfte bezahlt.',
 ihk:'Der Beitrag zur Krankenversicherung beträgt 14,6 % plus Zusatzbeitrag der Kasse; beides tragen Arbeitnehmer und Arbeitgeber je zur Hälfte. Erhöht die Kasse den Zusatzbeitrag, kann man sofort wechseln.',
 weil:'… weil man die Kasse sofort wechseln darf, wenn sie den Zusatzbeitrag erhöht.'},
{id:'k6',area:'m2a',from:'deniz',title:'5 € in der Apotheke',src:0,
 msg:p=>`In der Apotheke wollten die 5 € von mir für mein Antibiotikum. Ich dachte, die Krankenkasse zahlt alles?`,
 opts:[
  {t:'Erwachsene zahlen bei Medikamenten 10 % dazu – mindestens 5 €, höchstens 10 €. Das ist richtig so.',law:2,tone:'s',why:'Richtig. Zuzahlung: 10 % vom Preis, mindestens 5 €, höchstens 10 €. Unter 18 ist man befreit.'},
  {t:'Die Apotheke hat dich abgezockt. Medikamente sind immer gratis.',law:0,tone:'p',why:'Falsch. Erwachsene zahlen bei Medikamenten etwas dazu (Zuzahlung).'},
  {t:'Zuzahlen müssen nur Privatversicherte.',law:0,tone:'s',why:'Falsch. Auch gesetzlich Versicherte ab 18 zahlen dazu: 10 %, mindestens 5 €, höchstens 10 €.'}
 ],
 term:'Zuzahlung',def:'Erwachsene zahlen bei Medikamenten 10 % dazu (mind. 5 €, höchstens 10 €), im Krankenhaus 10 € pro Tag.',
 ihk:'Versicherte ab 18 Jahren leisten Zuzahlungen, z. B. 10 % bei Arzneimitteln (mindestens 5 €, höchstens 10 €).',
 weil:'… weil Erwachsene bei Medikamenten 10 % dazuzahlen, mindestens 5 € und höchstens 10 €.'},
/* ---------- Modul 2: Pflege ---------- */
{id:'p1',area:'m2b',from:'mama',title:'Opa Heinz braucht Hilfe',src:1,
 msg:p=>`Opa Heinz in Geestemünde kann sich seit dem Schlaganfall nicht mehr allein waschen und anziehen. Die Ärzte sagen, das bleibt so. Was machen wir jetzt?`,
 opts:[
  {t:'Bei der Pflegekasse einen Pflegegrad beantragen. Dann kommt der Medizinische Dienst und prüft, wie viel Hilfe Opa braucht.',law:2,tone:'s',why:'Richtig. Pflegegrad beantragen. Der Medizinische Dienst besucht Opa und legt den Pflegegrad (1 bis 5) fest.'},
  {t:'Wir beantragen Arbeitslosengeld für Opa.',law:0,tone:'s',why:'Falsch. Hier hilft die Pflegeversicherung. Arbeitslosengeld ist für Menschen, die Arbeit suchen.'},
  {t:'Da kann man nichts machen. Pflege muss die Familie allein bezahlen.',law:0,tone:'n',eur:-40,why:'Falsch. Die Pflegeversicherung hilft. Man beantragt einen Pflegegrad bei der Pflegekasse.'}
 ],
 term:'Pflegegrad',def:'Der Medizinische Dienst legt fest, wie viel Hilfe jemand braucht: Pflegegrad 1 bis 5.',
 ihk:'Pflegebedürftig ist, wer wegen Krankheit oder Behinderung für mindestens sechs Monate Hilfe im Alltag braucht. Der Medizinische Dienst stellt den Pflegegrad (1 bis 5) fest.',
 weil:'… weil die Pflegekasse hilft, wenn der Medizinische Dienst einen Pflegegrad feststellt.'},
{id:'p2',area:'m2b',from:'mama',title:'Pflegegeld oder Pflegedienst?',src:1,
 msg:p=>`Opa hat jetzt Pflegegrad 3. Ich will ihn zu Hause pflegen. Bekomme ich dafür etwas?`,
 opts:[
  {t:'Ja. Wenn Angehörige pflegen, gibt es Pflegegeld. Kommt ein Pflegedienst, zahlt die Kasse eine Pflegesachleistung.',law:2,tone:'s',why:'Richtig. Pflegegeld bei Pflege durch Angehörige, Pflegesachleistung beim Pflegedienst.'},
  {t:'Nein. Geld gibt es nur, wenn Opa ins Heim geht.',law:0,tone:'n',eur:-40,why:'Falsch. Auch Pflege zu Hause wird unterstützt: mit Pflegegeld oder Pflegesachleistung.'},
  {t:'Ja. Die Krankenkasse zahlt dir ein Gehalt wie einer Pflegekraft.',law:0,tone:'s',why:'Falsch. Es gibt Pflegegeld von der Pflegekasse – das ist kein Gehalt.'}
 ],
 term:'Pflegegeld',def:'Geld von der Pflegekasse, wenn Angehörige zu Hause pflegen.',
 ihk:'Leistungen der Pflegeversicherung: Pflegegeld bei Pflege durch Angehörige, Pflegesachleistung durch einen Pflegedienst, Tages- und Kurzzeitpflege, Heim, Pflegekurse.',
 weil:'… weil die Pflegekasse Pflegegeld zahlt, wenn Angehörige pflegen.'},
{id:'p3',area:'m2b',from:'mama',title:'Das Heim ist teuer',src:1,
 msg:p=>`Später muss Opa vielleicht ins Heim. Die Pflegeversicherung zahlt dann doch alles, oder?`,
 opts:[
  {t:'Nein. Die Pflegeversicherung ist eine „Teilkasko“. Sie zahlt nur einen Teil. Es bleibt ein hoher Eigenanteil.',law:2,tone:'s',why:'Richtig. Die Pflegekasse zahlt feste Beträge je Pflegegrad. Im Heim bleibt ein Eigenanteil – oft über 2.000 € im Monat.'},
  {t:'Ja. Die Pflegekasse zahlt alles.',law:0,tone:'n',eur:-40,why:'Falsch. Die Pflegeversicherung zahlt nur einen Teil („Teilkasko“).'},
  {t:'Nein. Das Heim zahlt immer die Rentenversicherung.',law:0,tone:'s',why:'Falsch. Zuständig ist die Pflegeversicherung, aber sie zahlt nur einen Teil. Den Rest zahlt man selbst.'}
 ],
 term:'Teilkasko',def:'Die Pflegeversicherung zahlt nur einen Teil der Kosten. Den Rest zahlt man selbst.',
 ihk:'Die Pflegeversicherung zahlt feste Beträge je Pflegegrad, nicht die vollen Kosten („Teilkasko“). Im Heim bleibt ein hoher Eigenanteil.',
 weil:'… weil die Pflegeversicherung nur einen Teil der Kosten zahlt.'},
{id:'p4',area:'m2b',from:'deniz',title:'Warum zahlst du mehr?',src:1,
 msg:p=>`Bei mir gehen 1,8 % für die Pflegeversicherung ab. Ich hab ja ein Kind. Wie viel ist es bei dir?`,
 opts:[
  {t:'1,8 % – genau wie bei dir.',law:p=>KI(p)?2:0,tone:'s',why:p=>KI(p)?'Richtig. Du hast ein Kind. Also kein Zuschlag: 1,8 % (die Hälfte von 3,6 %).':'Falsch. Du bist 23 und hast keine Kinder. Dazu kommt der Zuschlag von 0,9 %: zusammen 2,7 %.'},
  {t:'2,7 %. Ich bin 23 und habe keine Kinder. Dann kommt ein Zuschlag dazu.',law:p=>KI(p)?0:2,tone:'s',why:p=>KI(p)?'Falsch. Du hast ein Kind. Den Zuschlag zahlen nur Kinderlose ab 23. Bei dir: 1,8 %.':'Richtig. Kinderlose ab 23 zahlen 0,9 % Zuschlag allein. 1,8 % + 0,9 % = 2,7 %.'},
  {t:'Gar nichts. Azubis zahlen keine Pflegeversicherung.',law:0,tone:'s',why:'Falsch. Wer krankenversichert ist, ist auch pflegeversichert und zahlt Beiträge.'}
 ],
 term:'Kinderlosenzuschlag',def:'Kinderlose ab 23 zahlen in der Pflegeversicherung 0,9 % mehr – allein, ohne Arbeitgeber.',
 ihk:'Der Beitrag zur Pflegeversicherung beträgt 3,6 %, je zur Hälfte. Kinderlose ab 23 Jahren zahlen einen Zuschlag (2027: 0,9 %) allein.',
 weil:'… weil Kinderlose ab 23 in der Pflegeversicherung einen Zuschlag zahlen.'},
{id:'p5',area:'m2b',from:'mia',title:'Pflegeversicherung extra?',src:1,
 msg:p=>`Muss ich mich für die Pflegeversicherung eigentlich irgendwo extra anmelden?`,
 opts:[
  {t:'Nein. Wer gesetzlich krankenversichert ist, ist automatisch in der Pflegekasse derselben Krankenkasse.',law:2,tone:'s',why:'Richtig. Die Pflegekassen gehören zu den Krankenkassen. Krankenversichert heißt automatisch pflegeversichert.'},
  {t:'Ja. Die muss man selbst bei einer Versicherung abschließen.',law:0,tone:'s',why:'Falsch. Gesetzlich Krankenversicherte sind automatisch Mitglied in der Pflegeversicherung ihrer Kasse.'},
  {t:'Nein. Pflegeversichert ist man erst ab 23.',law:0,tone:'s',why:'Falsch. Ab 23 gibt es nur den Zuschlag für Kinderlose. Versichert ist man von Anfang an.'}
 ],
 term:'Pflegekasse',def:'Träger der Pflegeversicherung. Sie gehört zur Krankenkasse.',
 ihk:'Gesetzlich Krankenversicherte sind automatisch Mitglied in der Pflegeversicherung der gleichen Krankenversicherung.',
 weil:'… weil gesetzlich Krankenversicherte automatisch in der Pflegekasse ihrer Krankenkasse sind.'},
/* ---------- Modul 3: Rente und Vorsorge ---------- */
{id:'r1',area:'m3',from:'deniz',title:'Wo ist mein Rentengeld?',src:2,
 msg:p=>`Von meinem Gehalt gehen 9,3 % für die Rente ab. Das Geld liegt doch irgendwo auf einem Konto für mich, oder?`,
 opts:[
  {t:'Nein. Unsere Beiträge bezahlen die Renten von heute. Später zahlen die Jüngeren unsere Rente.',law:2,tone:'s',why:'Richtig. Umlageverfahren und Generationenvertrag: Die Beiträge von heute zahlen die Renten von heute.'},
  {t:'Ja. Es wird für dich gespart und mit Zinsen ausgezahlt.',law:0,tone:'s',why:'Falsch. Es wird kaum etwas angespart. Die Beiträge werden gleich für die Renten von heute ausgegeben.'},
  {t:'Nein. Das Geld bekommt der Staat für Straßen und Schulen.',law:0,tone:'s',why:'Falsch. Das sind Steuern. Rentenbeiträge zahlen die Renten von heute.'}
 ],
 term:'Generationenvertrag',def:'Die Berufstätigen zahlen die Renten der Älteren – und hoffen, dass später die Jüngeren ihre Rente zahlen.',
 ihk:'Generationenvertrag (Umlageverfahren): Die Erwerbstätigen zahlen mit ihren Beiträgen die Renten der heutigen Rentner und vertrauen darauf, dass die nächste Generation später ihre Renten zahlt.',
 weil:'… weil die Beiträge von heute die Renten von heute bezahlen.'},
{id:'r2',area:'m3',from:'chef',title:'Betriebsrente gefällig?',src:2,
 msg:p=>`Du kannst bei uns einen Teil deines Bruttogehalts in eine Betriebsrente stecken. Wir legen 15 % dazu. Interesse?`,
 opts:[
  {t:'Das ist die betriebliche Altersvorsorge, die 2. Säule. Darauf habe ich sogar einen Rechtsanspruch. Ich lasse mich beraten.',law:2,tone:'s',why:'Richtig. Entgeltumwandlung: Jeder Arbeitnehmer hat einen Rechtsanspruch darauf. Der Betrieb legt 15 % dazu.'},
  {t:'Brauche ich nicht. Die gesetzliche Rente reicht später sicher.',law:1,tone:'s',why:'Teilweise. Du musst nicht mitmachen. Aber die gesetzliche Rente allein wird oft nicht reichen – sie liegt bei etwa 48 % des Durchschnittslohns.'},
  {t:'Super! Dann zahlt der Betrieb ja meine ganze Rente.',law:0,tone:'n',why:'Falsch. Die Betriebsrente ist eine Ergänzung (2. Säule). Die gesetzliche Rente bleibt Pflicht.'}
 ],
 term:'Entgeltumwandlung',def:'Ein Teil des Bruttogehalts fließt in die Betriebsrente. Jeder Arbeitnehmer hat einen Anspruch darauf.',
 ihk:'Jeder Arbeitnehmer kann verlangen, dass ein Teil seines Gehalts (bis zu 4 % der Beitragsbemessungsgrenze der Rentenversicherung) in eine betriebliche Altersvorsorge fließt (Entgeltumwandlung).',
 weil:'… weil jeder Arbeitnehmer einen Rechtsanspruch auf Entgeltumwandlung hat.'},
{id:'r3',area:'m3',from:'deniz',title:'Kur für meinen Vater',src:2,
 msg:p=>`Mein Vater (52) ist Lagerist im Fischereihafen und hat Rücken. Die Ärztin rät zu einer Kur, damit er weiter arbeiten kann. Wer zahlt die?`,
 opts:[
  {t:'Die Rentenversicherung. „Reha vor Rente“: Sie zahlt die Kur, damit er arbeitsfähig bleibt.',law:2,tone:'s',why:'Richtig. Die Rentenversicherung zahlt Reha, damit sie später keine Erwerbsminderungsrente zahlen muss.'},
  {t:'Die Arbeitslosenversicherung.',law:0,tone:'s',why:'Falsch. Dein Vater hat ja Arbeit. Kuren zur Erhaltung der Arbeitsfähigkeit zahlt die Rentenversicherung.'},
  {t:'Die Berufsgenossenschaft, weil er im Lager arbeitet.',law:0,tone:'s',why:'Falsch. Die BG zahlt nur nach einem Arbeitsunfall oder bei einer Berufskrankheit. Hier zahlt die Rentenversicherung.'}
 ],
 term:'Reha vor Rente',def:'Die Rentenversicherung zahlt Kuren und Reha, damit man weiter arbeiten kann.',
 ihk:'Die Deutsche Rentenversicherung übernimmt die Kosten für Kuren zur Erhaltung der Arbeitsfähigkeit.',
 weil:'… weil die Rentenversicherung Reha zahlt, damit man weiter arbeiten kann.'},
{id:'r4',area:'m3',from:'mia',title:'Berufsunfähigkeit',src:2,
 msg:p=>`Ein Versicherungsvertreter sagt, ich soll eine Berufsunfähigkeitsversicherung abschließen. Quatsch, oder? Dafür gibt es doch die Rentenversicherung.`,
 opts:[
  {t:'Die gesetzliche Rente zahlt nur Erwerbsminderungsrente, wenn man weniger als 6 Stunden am Tag arbeiten kann. Eine BU-Versicherung ist private Vorsorge, die 3. Säule.',law:2,tone:'s',why:'Richtig. Erwerbsminderungsrente gibt es nur bei weniger als 6 Stunden täglich. Eine BU-Versicherung ist private Vorsorge.'},
  {t:'Ja, Quatsch. Die Rentenversicherung zahlt immer, wenn man seinen Beruf nicht mehr kann.',law:0,tone:'s',why:'Falsch. Die gesetzliche Rente zahlt nur, wenn man weniger als 6 Stunden am Tag arbeiten kann – egal in welchem Beruf.'},
  {t:'Die BU-Versicherung ist Pflicht für alle Azubis.',law:0,tone:'s',why:'Falsch. Private Vorsorge ist freiwillig (3. Säule).'}
 ],
 term:'Drei Säulen',def:'1 gesetzliche Rente (Pflicht) · 2 betriebliche Altersvorsorge · 3 private Vorsorge (freiwillig).',
 ihk:'Altersvorsorge: 1. Säule gesetzliche Rente, 2. Säule betriebliche Altersvorsorge, 3. Säule private Vorsorge, z. B. Berufsunfähigkeitsversicherung.',
 weil:'… weil die gesetzliche Rente nur bei Erwerbsminderung zahlt und eine BU-Versicherung private Vorsorge ist.'},
{id:'r5',area:'m3',from:'mama',title:'Wann gehst du in Rente?',src:2,
 msg:p=>`Opa ist mit 65 in Rente gegangen. Wann darfst du eigentlich gehen?`,
 opts:[
  {t:'Nach heutigem Recht mit 67. Das ist die Regelaltersgrenze.',law:2,tone:'s',why:'Richtig. Für alle ab Jahrgang 1964 gilt die Regelaltersgrenze von 67 Jahren.'},
  {t:'Mit 63, wie alle.',law:0,tone:'s',why:'Falsch. Die Regelaltersgrenze liegt bei 67 Jahren.'},
  {t:'Mit 60, wenn ich 40 Jahre gearbeitet habe.',law:0,tone:'s',why:'Falsch. Die Regelaltersgrenze liegt bei 67 Jahren.'}
 ],
 term:'Regelaltersgrenze',def:'Ab diesem Alter gibt es die Altersrente: 67 Jahre (ab Jahrgang 1964).',
 ihk:'Altersrente gibt es ab der Regelaltersgrenze von 67 Jahren.',
 weil:'… weil die Regelaltersgrenze für die Altersrente bei 67 Jahren liegt.'},
{id:'r6',area:'m3',from:'deniz',title:'6 – 2 – 1,5',src:2,
 msg:p=>`In der Nordsee-Zeitung steht: 1962 kamen 6 Beitragszahler auf einen Rentner. Heute sind es etwa 2. Um 2050 nur noch 1,5. Was heißt das für uns?`,
 opts:[
  {t:'Immer weniger Beitragszahler müssen immer mehr Rentner bezahlen. Dann steigen die Beiträge – oder die Rente sinkt.',law:2,tone:'s',why:'Richtig. Demografischer Wandel: weniger Kinder, längeres Leben, viele Babyboomer in Rente.'},
  {t:'Nichts. Unsere Rente ist ja angespart.',law:0,tone:'s',why:'Falsch. Die Rente wird im Umlageverfahren bezahlt. Weniger Beitragszahler sind ein Problem.'},
  {t:'Dann wird die Rentenversicherung abgeschafft.',law:0,tone:'s',why:'Falsch. Die Politik kann reagieren: Beiträge erhöhen, Rentenniveau senken, später in Rente, mehr Steuergeld, mehr Beschäftigte.'}
 ],
 term:'Demografischer Wandel',def:'Weniger Kinder, längeres Leben: Immer weniger Beitragszahler finanzieren immer mehr Rentner.',
 ihk:'Durch den demografischen Wandel finanzieren immer weniger Beitragszahler immer mehr Rentner; die Folge sind höhere Beiträge oder niedrigere Renten.',
 weil:'… weil immer weniger Beitragszahler immer mehr Rentner bezahlen müssen.'},
/* ---------- Modul 5: Unfall ---------- */
{id:'u1',area:'m5',from:'chef',title:'Sturz auf der Columbusstraße',src:4,
 msg:p=>`Du hast geschrieben, du bist auf dem Weg zur Arbeit gestürzt. Was ist passiert?`,
 note:'Du warst auf dem direkten Weg zum Moin Outlet. Glatteis. Dein Handgelenk ist dick.',
 opts:[
  {t:'Das ist ein Wegeunfall. Ich gehe zum Durchgangsarzt und sage, dass es auf dem Weg zur Arbeit passiert ist.',law:2,tone:'s',why:'Richtig. Unfall auf dem direkten Weg zur Arbeit = Wegeunfall. Zum D-Arzt gehen und den Wegeunfall angeben.'},
  {t:'Ich gehe zu meiner Hausärztin. Ein Sturz auf der Straße ist Privatsache.',law:0,tone:'s',arg:12,why:'Falsch. Auf dem direkten Weg zur Arbeit ist es ein Wegeunfall. Zuständig ist die Unfallversicherung.'},
  {t:'Die Krankenkasse zahlt. Die Unfallversicherung gilt nur im Laden.',law:0,tone:'s',why:'Falsch. Die Unfallversicherung gilt auch auf dem direkten Weg zur Arbeit und zurück.'}
 ],
 term:'Wegeunfall',def:'Ein Unfall auf dem direkten Weg zur Arbeit oder Berufsschule und zurück.',
 ihk:'Die Berufsgenossenschaft übernimmt Heilkosten für Unfälle, die auf dem direkten Weg zur Arbeit passieren.',
 weil:'… weil ein Unfall auf dem direkten Weg zur Arbeit ein Wegeunfall ist.'},
{id:'u2',area:'m5',from:'chef',title:'Umweg zur Kita',src:4,cond:p=>p.b.kita,
 msg:p=>`Du bist auf dem Weg zur Arbeit gestürzt – aber vor Oles Kita, nicht auf dem direkten Weg. Ist das überhaupt versichert?`,
 opts:[
  {t:'Ja. Der Umweg, um mein Kind zur Kita zu bringen, ist versichert. Es ist ein Wegeunfall.',law:2,tone:'s',why:'Richtig. Umwege, um Kinder zur Kita zu bringen, sind versichert.'},
  {t:'Nein. Ich war ja nicht auf dem direkten Weg.',law:0,tone:'n',eur:-30,why:'Falsch. Der Umweg zur Kinderbetreuung ist ausdrücklich versichert.'},
  {t:'Nur, wenn Ole auch verletzt ist.',law:0,tone:'s',why:'Falsch. Dein Weg ist versichert, weil der Umweg zur Kita dazugehört.'}
 ],
 term:'Umweg zur Kita',def:'Bringt man Kinder auf dem Arbeitsweg zur Kita, ist auch der Umweg versichert.',
 ihk:'Versichert sind auch Umwege, um Kinder zur Kinderbetreuung zu bringen, oder für eine Fahrgemeinschaft.',
 weil:'… weil der Umweg zur Kita zum versicherten Arbeitsweg gehört.'},
{id:'u3',area:'m5',from:'chef',title:'Umweg für die Fahrgemeinschaft',src:4,cond:p=>p.b.fg,
 msg:p=>`Ihr hattet auf dem Weg aus Langen einen Auffahrunfall – als du Svenja abgeholt hast. Das war doch ein Umweg. Zählt das?`,
 opts:[
  {t:'Ja. Umwege für eine Fahrgemeinschaft sind versichert. Es ist ein Wegeunfall.',law:2,tone:'s',why:'Richtig. Umwege für eine Fahrgemeinschaft sind versichert.'},
  {t:'Nein. Nur der direkte Weg ist versichert.',law:0,tone:'n',eur:-30,why:'Falsch. Der Umweg für eine Fahrgemeinschaft ist ausdrücklich versichert.'},
  {t:'Nur Svenja ist versichert, ich nicht.',law:0,tone:'s',why:'Falsch. Ihr seid beide auf dem Arbeitsweg – beide sind versichert.'}
 ],
 term:'Fahrgemeinschaft',def:'Auch der Umweg, um Kolleginnen mitzunehmen, ist versichert.',
 ihk:'Versichert sind auch Umwege, um Kinder zur Kinderbetreuung zu bringen, oder für eine Fahrgemeinschaft.',
 weil:'… weil Umwege für eine Fahrgemeinschaft versichert sind.'},
{id:'u4',area:'m5',from:'deniz',title:'Kurz zum Bäcker',src:4,
 msg:p=>`Du hast auf dem Heimweg beim Bäcker angehalten und bist im Laden auf den Stufen umgeknickt. Das ist doch ein Wegeunfall, oder?`,
 opts:[
  {t:'Nein. Das Einkaufen ist eine private Unterbrechung. Während des Einkaufs bin ich nicht versichert.',law:2,tone:'s',why:'Richtig. Private Unterbrechungen wie Einkaufen sind nicht versichert.'},
  {t:'Klar. Ich war ja auf dem Heimweg.',law:0,tone:'s',arg:8,why:'Falsch. Im Laden warst du privat unterwegs. Das ist kein Wegeunfall. Die Krankenkasse zahlt die Behandlung.'},
  {t:'Ja, weil ich danach weiter nach Hause wollte.',law:0,tone:'s',why:'Falsch. Während der privaten Unterbrechung bist du nicht versichert.'}
 ],
 term:'Private Unterbrechung',def:'Einkaufen, Kino, Besuch: Während einer privaten Unterbrechung ist man nicht unfallversichert.',
 ihk:'Nicht versichert sind private Unterbrechungen des Arbeitsweges, z. B. Einkaufen oder ein Kinobesuch.',
 weil:'… weil man während einer privaten Unterbrechung nicht versichert ist.'},
{id:'u5',area:'m5',from:'deniz',title:'Schnitt im Pausenraum',src:4,
 msg:p=>`Ich hab mich in der Pause beim Apfelschälen in den Finger geschnitten. Das ist doch ein Arbeitsunfall, oder? Ich war ja im Betrieb.`,
 opts:[
  {t:'Nein. Essen ist Privatsache. Der Schnitt beim Apfelschälen ist kein Arbeitsunfall.',law:2,tone:'s',why:'Richtig. Essen ist Privatsache. (Der Weg zur Kantine wäre aber versichert.)'},
  {t:'Ja. Alles, was im Betrieb passiert, ist ein Arbeitsunfall.',law:0,tone:'s',why:'Falsch. Versichert ist die Arbeit, nicht das Essen in der Pause.'},
  {t:'Ja, weil die Pause zur Arbeitszeit gehört.',law:0,tone:'s',why:'Falsch. Essen ist Privatsache und nicht versichert.'}
 ],
 term:'Arbeitsunfall',def:'Ein Unfall bei der Arbeit – auch in der Berufsschule, auf Dienstwegen und bei Betriebsfeiern.',
 ihk:'Ein Arbeitsunfall ist ein Unfall bei einer versicherten Tätigkeit. Essen in der Pause ist Privatsache und nicht versichert.',
 weil:'… weil Essen Privatsache ist und nicht zur versicherten Tätigkeit gehört.'},
{id:'u6',area:'m5',from:'chef',title:'Nur ein Pflaster',src:4,
 msg:p=>`Du hast dich am Kartonmesser geschnitten. Ist nur ein Pflaster. Das musst du nirgends eintragen, oder?`,
 opts:[
  {t:'Doch. Jede Verletzung kommt ins Verbandbuch. So kann man später beweisen, dass es ein Arbeitsunfall war.',law:2,tone:'s',why:'Richtig. Auch kleine Verletzungen gehören ins Verbandbuch – für den Nachweis bei Spätfolgen.'},
  {t:'Stimmt. Nur große Unfälle muss man aufschreiben.',law:0,tone:'n',arg:10,why:'Falsch. Jede Verletzung kommt ins Verbandbuch, auch kleine.'},
  {t:'Ich schicke selbst eine Unfallanzeige an die Berufsgenossenschaft.',law:1,tone:'s',why:'Teilweise. Aufschreiben ist gut. Aber ins Verbandbuch. Die Unfallanzeige schickt der Arbeitgeber – erst wenn man mehr als 3 Tage arbeitsunfähig ist.'}
 ],
 term:'Verbandbuch',def:'Hier wird jede Verletzung im Betrieb eingetragen – auch kleine.',
 ihk:'Jede Verletzung ist ins Verbandbuch einzutragen. So kann später nachgewiesen werden, dass es sich um einen Arbeitsunfall handelt.',
 weil:'… weil jede Verletzung als Nachweis ins Verbandbuch gehört.'},
{id:'u7',area:'m5',from:'chef',title:'Zwei Wochen krank',src:4,
 msg:p=>`Nach deinem Sturz im Lager bist du zwei Wochen krankgeschrieben. Was muss ich jetzt machen?`,
 opts:[
  {t:'Sie müssen innerhalb von 3 Tagen eine Unfallanzeige an die Berufsgenossenschaft schicken, weil ich mehr als 3 Tage arbeitsunfähig bin.',law:2,tone:'s',why:'Richtig. Mehr als 3 Tage arbeitsunfähig → der Arbeitgeber schickt innerhalb von 3 Tagen eine Unfallanzeige an die BG.'},
  {t:'Nichts. Das regelt die Krankenkasse.',law:0,tone:'n',arg:12,why:'Falsch. Bei einem Arbeitsunfall muss der Betrieb die Berufsgenossenschaft informieren (Unfallanzeige).'},
  {t:'Sie müssen sofort die Polizei holen.',law:0,tone:'s',why:'Falsch. Gemeldet wird an die Berufsgenossenschaft, mit einer Unfallanzeige.'}
 ],
 term:'Unfallanzeige',def:'Ist man mehr als 3 Tage arbeitsunfähig, schickt der Arbeitgeber innerhalb von 3 Tagen eine Unfallanzeige an die BG.',
 ihk:'Der Arbeitgeber muss den Unfall der Berufsgenossenschaft melden, wenn der Mitarbeiter mehr als drei Tage arbeitsunfähig ist.',
 weil:'… weil der Arbeitgeber bei mehr als 3 Tagen Arbeitsunfähigkeit eine Unfallanzeige an die BG schicken muss.'},
{id:'u8',area:'m5',from:'deniz',title:'Die Kundin auf dem nassen Boden',src:4,
 msg:p=>`Eine Kundin ist bei uns auf dem nassen Boden ausgerutscht. Zahlt jetzt die Berufsgenossenschaft?`,
 opts:[
  {t:'Nein. Kunden sind nicht über die BG versichert. Es haftet eventuell die Haftpflichtversicherung des Geschäfts.',law:2,tone:'s',why:'Richtig. Kunden sind nicht gesetzlich unfallversichert. Es haftet ggf. die Haftpflichtversicherung des Geschäfts.'},
  {t:'Ja. Alle Unfälle im Laden zahlt die BG.',law:0,tone:'s',why:'Falsch. Versichert sind die Beschäftigten, nicht die Kunden.'},
  {t:'Ja, aber nur, wenn die Kundin Stammkundin ist.',law:0,tone:'s',why:'Falsch. Kunden sind nie über die BG versichert.'}
 ],
 term:'Wer ist versichert?',def:'Alle Beschäftigten ab dem ersten Tag, auch Azubis und Aushilfen. Kunden nicht.',
 ihk:'Heilkosten für den Unfall eines Kunden übernimmt nicht die Berufsgenossenschaft.',
 weil:'… weil nur Beschäftigte über die Berufsgenossenschaft versichert sind, Kunden nicht.'},
/* ---------- Modul 6: Abrechnung ---------- */
{id:'g1',area:'m6',from:'lohn',title:'Rentenbeitrag',src:2,
 msg:p=>`Deine Vergütung im 2. Jahr: 1.150,00 € brutto. Weißt du, wie viel davon für die Rentenversicherung abgeht?`,
 opts:[
  {t:'9,3 % von 1.150 € = 106,95 €. Der Betrieb zahlt noch einmal so viel dazu.',law:2,tone:'s',why:'Richtig. 1.150 × 9,3 : 100 = 106,95 €. Arbeitnehmer und Arbeitgeber zahlen je die Hälfte von 18,6 %.'},
  {t:'18,6 % von 1.150 € = 213,90 €.',law:0,tone:'s',eur:-107,why:'Falsch. 18,6 % ist der Gesamtsatz. Du zahlst nur die Hälfte: 9,3 % = 106,95 €.'},
  {t:'Nichts. Azubis zahlen keine Rentenversicherung.',law:0,tone:'s',why:'Falsch. Azubis sind pflichtversichert und zahlen 9,3 %.'}
 ],
 term:'Arbeitnehmeranteil',def:'Die Hälfte des Beitragssatzes. Die andere Hälfte zahlt der Betrieb.',
 ihk:'Beitrag = Bruttogehalt × Arbeitnehmersatz : 100. Rentenversicherung: 9,3 % Arbeitnehmeranteil.',
 weil:'… weil Arbeitnehmer nur die Hälfte des Rentenbeitrags zahlen, also 9,3 %.'},
{id:'g2',area:'m6',from:'lohn',title:'Pflegeversicherung prüfen',src:1,
 msg:p=>`Bei der Pflegeversicherung habe ich dir 20,70 € abgezogen. Stimmt das so?`,
 opts:[
  {t:'Ja. 1,8 % von 1.150 € sind 20,70 €.',law:p=>KI(p)?2:0,tone:'s',why:p=>KI(p)?'Richtig. Du hast ein Kind, also kein Zuschlag: 1.150 × 1,8 : 100 = 20,70 €.':'Falsch. Du bist 23 und kinderlos: 2,7 %. 1.150 × 2,7 : 100 = 31,05 €.'},
  {t:'Nein. Ich bin 23 und kinderlos. Es müssen 2,7 % sein, also 31,05 €.',law:p=>KI(p)?0:2,tone:'s',why:p=>KI(p)?'Falsch. Du hast ein Kind, also kein Zuschlag: 1,8 % = 20,70 €.':'Richtig. Kinderlos ab 23: 1,8 % + 0,9 % = 2,7 %. 1.150 × 2,7 : 100 = 31,05 €.'},
  {t:'Nein. Es müssen 3,6 % sein, also 41,40 €.',law:0,tone:'s',eur:-21,why:'Falsch. 3,6 % ist der Gesamtsatz. Du zahlst die Hälfte (1,8 %), kinderlos ab 23 plus 0,9 %.'}
 ],
 term:'Pflege-Satz',def:'Arbeitnehmer 1,8 %. Kinderlose ab 23: 2,7 %.',
 ihk:'Pflegeversicherung: 3,6 %, je zur Hälfte (Arbeitnehmer 1,8 %). Kinderlose ab 23 Jahren zahlen zusätzlich 0,9 % allein.',
 weil:'… weil Kinderlose ab 23 in der Pflegeversicherung 2,7 % statt 1,8 % zahlen.'},
{id:'g3',area:'m6',from:'mama',title:'Was kommt an?',src:7,
 msg:p=>`Und? Wie viel kommt am Ende auf dein Konto? 1.150 € waren es doch, oder?`,
 note:'Lohnsteuer fällt bei dir nicht an.',
 opts:[
  {t:p=>`Nein. Es gehen die vier Sozialversicherungsbeiträge ab. Bei mir kommen ${NETTO(p)} € an.`,law:2,tone:'s',why:p=>`Richtig. KV 100,63 € + PV ${KI(p)?'20,70':'31,05'} € + RV 106,95 € + ALV 14,95 € = ${KI(p)?'243,23':'253,58'} €. 1.150 € − ${KI(p)?'243,23':'253,58'} € = ${NETTO(p)} €.`},
  {t:'Ja. Bei Azubis ist brutto gleich netto.',law:0,tone:'s',eur:-150,why:p=>`Falsch. Auch Azubis zahlen Sozialversicherung. Netto: ${NETTO(p)} €.`},
  {t:'Nein. Die Hälfte geht für Steuern weg.',law:0,tone:'s',why:p=>`Falsch. Lohnsteuer fällt bei dir nicht an. Es gehen nur rund 21 % Sozialversicherung ab: ${NETTO(p)} € netto.`}
 ],
 term:'Nettogehalt',def:'Brutto minus Lohnsteuer (minus Kirchensteuer) minus Sozialversicherungsbeiträge.',
 ihk:'Nettogehalt = Bruttogehalt − Lohnsteuer (− Kirchensteuer) − Sozialversicherungsbeiträge des Arbeitnehmers.',
 weil:'… weil vom Brutto die Sozialversicherungsbeiträge abgezogen werden.'},
{id:'g4',area:'m6',from:'chef',title:'Was kostest du uns?',src:7,
 msg:p=>`Weißt du eigentlich, dass du uns mehr kostest als deine 1.150 €?`,
 opts:[
  {t:'Ja. Der Betrieb zahlt seinen Arbeitgeberanteil dazu, rund 21 %, und die Unfallversicherung allein.',law:2,tone:'s',why:'Richtig. 1.150 € + 243,23 € Arbeitgeberanteil = 1.393,23 € – plus Unfallversicherung.'},
  {t:'Nein. Sie zahlen genau 1.150 €.',law:0,tone:'s',why:'Falsch. Zum Brutto kommt der Arbeitgeberanteil (rund 21 %) plus Unfallversicherung.'},
  {t:'Ja. Sie zahlen meine Vergütung doppelt.',law:0,tone:'s',why:'Falsch. Der Arbeitgeberanteil beträgt rund 21 %, nicht 100 %.'}
 ],
 term:'Arbeitgeberanteil',def:'Der Betrieb zahlt zusätzlich zum Brutto seine Hälfte der Beiträge und die Unfallversicherung.',
 ihk:'Der Arbeitgeber trägt zusätzlich zum Bruttogehalt den Arbeitgeberanteil zur Sozialversicherung und die Beiträge zur Unfallversicherung allein.',
 weil:'… weil der Betrieb zusätzlich seinen Arbeitgeberanteil und die Unfallversicherung zahlt.'},
{id:'g5',area:'m6',from:'deniz',title:'140 € mehr',src:2,
 msg:p=>`Ich bekomme 140 € mehr brutto im Monat. Der Rentensatz für mich ist 9,3 %. Wie viel geht jetzt mehr für die Rente ab?`,
 opts:[
  {t:'140 € × 9,3 : 100 = 13,02 € mehr.',law:2,tone:'s',why:'Richtig. Man rechnet nur mit dem Unterschied: 140 € × 9,3 % = 13,02 €.'},
  {t:'140 € × 18,6 : 100 = 26,04 € mehr.',law:0,tone:'s',why:'Falsch. Arbeitnehmer zahlen nur 9,3 %: 13,02 €.'},
  {t:'Gar nichts. Der Beitrag bleibt gleich.',law:0,tone:'s',why:'Falsch. Der Beitrag richtet sich nach dem Brutto. Mehr Brutto = mehr Beitrag.'}
 ],
 term:'Beitrag nach Einkommen',def:'Steigt das Brutto, steigt auch der Beitrag.',
 ihk:'Erhöhung des Bruttogehalts um 140 €: 140 € × 9,3 % = 13,02 € mehr Rentenversicherung.',
 weil:'… weil der Beitrag ein fester Prozentsatz vom Brutto ist.'},
{id:'g6',area:'m6',from:'lohn',title:'Krankenversicherung',src:0,
 msg:p=>`Deine Kasse hat 2,9 % Zusatzbeitrag. Welcher Satz geht für die Krankenversicherung von deiner Vergütung ab?`,
 opts:[
  {t:'8,75 %: die Hälfte von 14,6 % plus 2,9 %.',law:2,tone:'s',why:'Richtig. 14,6 % + 2,9 % = 17,5 %. Davon die Hälfte: 8,75 %.'},
  {t:'17,5 %, also der ganze Satz.',law:0,tone:'s',eur:-100,why:'Falsch. Den Satz teilen sich Arbeitnehmer und Betrieb: 8,75 %.'},
  {t:'7,3 %. Den Zusatzbeitrag zahlt der Betrieb allein.',law:0,tone:'s',why:'Falsch. Auch der Zusatzbeitrag wird je zur Hälfte bezahlt: 7,3 % + 1,45 % = 8,75 %.'}
 ],
 term:'Krankenversicherung',def:'14,6 % plus Zusatzbeitrag, alles je zur Hälfte. Mit Ø 2,9 %: Arbeitnehmer 8,75 %.',
 ihk:'Krankenversicherung: 14,6 % plus Zusatzbeitrag der Kasse, je zur Hälfte von Arbeitnehmer und Arbeitgeber.',
 weil:'… weil auch der Zusatzbeitrag je zur Hälfte bezahlt wird.'},
/* ---------- Modul 4: Nach der Ausbildung ---------- */
{id:'l1',area:'m4',from:'chef',title:'Keine Übernahme',src:3,
 msg:p=>`${N(p)}, ich muss dir leider sagen: Wir können dich nach der Prüfung nicht übernehmen. Deine Ausbildung endet am 31. Juli.`,
 note:'Heute ist der 10. April.',
 opts:[
  {t:'Danke für die Info. Ich melde mich bis spätestens 30. April bei der Agentur für Arbeit arbeitsuchend – 3 Monate vor dem Ende.',law:2,tone:'s',why:'Richtig. Wer weiß, dass die Stelle endet, meldet sich spätestens 3 Monate vorher arbeitsuchend.'},
  {t:'Dann melde ich mich am 1. August bei der Agentur.',law:0,tone:'s',eur:-125,arg:12,why:'Falsch. Zu spät! Spätestens 3 Monate vor dem Ende (30. April). Sonst droht 1 Woche Sperrzeit.'},
  {t:'Bis Ende Juli muss ich nichts tun. Arbeitslosengeld bekomme ich sowieso.',law:0,tone:'n',eur:-125,arg:12,why:'Falsch. Wer sich zu spät arbeitsuchend meldet, bekommt 1 Woche Sperrzeit.'}
 ],
 term:'Arbeitsuchend melden',def:'Spätestens 3 Monate vor dem Ende der Stelle. Erfährt man es später: innerhalb von 3 Tagen.',
 ihk:'Wer weiß, dass sein Arbeits- oder Ausbildungsverhältnis endet, muss sich spätestens drei Monate vorher bei der Agentur für Arbeit arbeitsuchend melden; erfährt er es später, innerhalb von drei Tagen.',
 weil:'… weil man sich spätestens 3 Monate vor dem Ende arbeitsuchend melden muss.'},
{id:'l2',area:'m4',from:'mia',title:'Einfach kündigen?',src:3,
 msg:p=>`Ich hab keine Lust mehr auf die Spätschichten. Ich kündige einfach und lebe erst mal vom Arbeitslosengeld. Gute Idee?`,
 opts:[
  {t:'Vorsicht! Wer selbst ohne wichtigen Grund kündigt, bekommt 12 Wochen Sperrzeit. So lange gibt es kein Arbeitslosengeld.',law:2,tone:'s',why:'Richtig. Eigene Kündigung ohne wichtigen Grund: 12 Wochen Sperrzeit.'},
  {t:'Klar. Arbeitslosengeld gibt es immer sofort.',law:0,tone:'n',why:'Falsch. Bei eigener Kündigung ohne wichtigen Grund gibt es 12 Wochen Sperrzeit.'},
  {t:'Geht nicht. Wer selbst kündigt, bekommt nie Arbeitslosengeld.',law:1,tone:'s',why:'Teilweise. Erst gibt es 12 Wochen Sperrzeit. Danach gibt es Arbeitslosengeld – der Anspruch wird aber kürzer.'}
 ],
 term:'Sperrzeit',def:'Eine Zeit ohne Arbeitslosengeld. Eigene Kündigung ohne wichtigen Grund: 12 Wochen.',
 ihk:'Kündigt ein Arbeitnehmer selbst ohne wichtigen Grund oder schließt einen Aufhebungsvertrag, verhängt die Agentur für Arbeit eine Sperrzeit von 12 Wochen.',
 weil:'… weil es bei eigener Kündigung ohne wichtigen Grund 12 Wochen Sperrzeit gibt.'},
{id:'l3',area:'m4',from:'agentur',title:'Wie viel Arbeitslosengeld?',src:3,
 msg:p=>`Ihre Ausbildung dauerte 24 Monate mit Beiträgen. Wissen Sie, wie viel Arbeitslosengeld Sie bekommen – und wie lange?`,
 opts:[
  {t:'60 % von meinem pauschalierten Netto, für 12 Monate.',law:p=>KI(p)?1:2,tone:'s',why:p=>KI(p)?'Teilweise. Die Dauer stimmt (12 Monate). Aber du hast ein Kind: 67 %.':'Richtig. Ohne Kind 60 %. Nach 24 Monaten Beschäftigung gibt es 12 Monate Arbeitslosengeld.'},
  {t:'67 % von meinem pauschalierten Netto, für 12 Monate. Ich habe ein Kind.',law:p=>KI(p)?2:0,tone:'s',why:p=>KI(p)?'Richtig. Mit Kind 67 %. Nach 24 Monaten Beschäftigung: 12 Monate.':'Falsch. Du hast kein Kind: 60 %.'},
  {t:'Mein volles Netto, so lange ich will.',law:0,tone:'s',why:'Falsch. 60 % (mit Kind 67 %) des pauschalierten Nettos, nach 24 Monaten Beschäftigung für 12 Monate.'}
 ],
 term:'Arbeitslosengeld',def:'60 % des pauschalierten Nettos, mit Kind 67 %. Nach 12 Monaten Arbeit 6 Monate, nach 24 Monaten 12 Monate.',
 ihk:'Arbeitslosengeld beträgt 60 % (mit Kind 67 %) des pauschalierten Nettoentgelts. Voraussetzung: mindestens 12 Monate Versicherungspflicht in den letzten 30 Monaten.',
 weil:'… weil das Arbeitslosengeld 60 % beträgt, mit Kind 67 %.'},
{id:'l4',area:'m4',from:'agentur',title:'Ein Stellenangebot',src:3,
 msg:p=>`Wir haben eine zumutbare Stelle für Sie: Verkauf in einem Schuhgeschäft in Bremerhaven-Mitte. Bewerben Sie sich?`,
 opts:[
  {t:'Ja, ich bewerbe mich. Wenn ich eine zumutbare Stelle ohne wichtigen Grund ablehne, droht eine Sperrzeit.',law:2,tone:'s',why:'Richtig. Eine zumutbare Stelle ablehnen: Sperrzeit (beim ersten Mal 3 Wochen).'},
  {t:'Nein, ich habe noch keine Lust. Mein Geld bekomme ich ja trotzdem.',law:0,tone:'n',eur:-380,arg:12,why:'Falsch. Wer eine zumutbare Arbeit ohne wichtigen Grund ablehnt, bekommt eine Sperrzeit (beim ersten Mal 3 Wochen).'},
  {t:'Nein. Ich warte, bis eine Stelle als Filialleitung frei wird.',law:0,tone:'s',eur:-380,arg:8,why:'Falsch. Zumutbare Stellen muss man annehmen. Sonst droht eine Sperrzeit.'}
 ],
 term:'Zumutbare Arbeit',def:'Wer sie ohne wichtigen Grund ablehnt, bekommt eine Sperrzeit (3 bis 12 Wochen).',
 ihk:'Lehnt ein Arbeitsloser eine zumutbare Arbeit ohne wichtigen Grund ab, tritt eine Sperrzeit ein (3 bis 12 Wochen).',
 weil:'… weil es eine Sperrzeit gibt, wenn man eine zumutbare Stelle ablehnt.'},
{id:'l5',area:'m4',from:'mia',title:'Mein Bruder Murat',src:6,
 msg:p=>`Mein Bruder Murat (19) hat nach der Schule nie gearbeitet und findet keine Ausbildung. Bekommt er Arbeitslosengeld?`,
 opts:[
  {t:'Nein. Dafür braucht man 12 Monate Beiträge in den letzten 30 Monaten. Er kann Grundsicherung vom Jobcenter bekommen.',law:2,tone:'s',why:'Richtig. Ohne 12 Monate Beiträge kein Arbeitslosengeld. Grundsicherung gibt es vom Jobcenter, bezahlt aus Steuern.'},
  {t:'Ja. Jeder Arbeitslose bekommt Arbeitslosengeld.',law:0,tone:'s',why:'Falsch. Arbeitslosengeld ist eine Versicherungsleistung. Man braucht 12 Monate Beiträge.'},
  {t:'Nein. Er bekommt gar nichts.',law:0,tone:'s',why:'Falsch. Er kann Grundsicherung vom Jobcenter bekommen und wird beraten.'}
 ],
 term:'Grundsicherung',def:'Für Erwerbsfähige, die ihren Lebensunterhalt nicht selbst decken können. Jobcenter, aus Steuern.',
 ihk:'Grundsicherung (früher Bürgergeld): Leistung des Jobcenters aus Steuermitteln für erwerbsfähige Hilfebedürftige; keine Versicherungsleistung.',
 weil:'… weil es Arbeitslosengeld nur nach 12 Monaten Beiträgen gibt und sonst die Grundsicherung hilft.'},
{id:'l6',area:'m4',from:'chef',title:'Umbau im Outlet',src:3,
 msg:p=>`Wegen des Umbaus im Outlet haben wir drei Monate kaum Kundschaft. Die Verkäuferinnen sollen nur halb so viel arbeiten. Wer hilft dann beim Lohn?`,
 opts:[
  {t:'Die Agentur für Arbeit zahlt Kurzarbeitergeld.',law:2,tone:'s',why:'Richtig. Hat ein Betrieb vorübergehend weniger Arbeit, zahlt die Agentur für Arbeit Kurzarbeitergeld.'},
  {t:'Die Krankenkasse zahlt Krankengeld.',law:0,tone:'s',why:'Falsch. Krankengeld gibt es bei Krankheit. Hier zahlt die Agentur für Arbeit Kurzarbeitergeld.'},
  {t:'Das Jobcenter zahlt allen Grundsicherung.',law:0,tone:'s',why:'Falsch. Bei vorübergehend weniger Arbeit zahlt die Agentur für Arbeit Kurzarbeitergeld.'}
 ],
 term:'Kurzarbeitergeld',def:'Die Agentur für Arbeit zahlt, wenn ein Betrieb vorübergehend weniger Arbeit hat.',
 ihk:'Leistungen der Arbeitslosenversicherung: Berufsberatung, Arbeitsvermittlung, Weiterbildung und Umschulung, Arbeitslosengeld, Kurzarbeitergeld.',
 weil:'… weil die Agentur für Arbeit Kurzarbeitergeld zahlt, wenn ein Betrieb vorübergehend weniger Arbeit hat.'},
{id:'l7',area:'m4',from:'deniz',title:'Ein Aufhebungsvertrag',src:3,
 msg:p=>`Die Chefin hat mir einen Aufhebungsvertrag hingelegt. Ich habe vielleicht eine neue Stelle in Aussicht. Einfach unterschreiben?`,
 opts:[
  {t:'Vorsicht: Ein Aufhebungsvertrag zählt wie eine eigene Kündigung. Ohne wichtigen Grund gibt es 12 Wochen Sperrzeit.',law:2,tone:'s',why:'Richtig. Platzt die neue Stelle, droht eine Sperrzeit von 12 Wochen.'},
  {t:'Ja. Dann gibt es sofort Arbeitslosengeld.',law:0,tone:'n',why:'Falsch. Ein Aufhebungsvertrag zählt wie eine eigene Kündigung: meist 12 Wochen Sperrzeit.'},
  {t:'Ja. Ein Aufhebungsvertrag ist immer besser als eine Kündigung.',law:0,tone:'s',why:'Falsch. Beim Aufhebungsvertrag droht eine Sperrzeit von 12 Wochen.'}
 ],
 term:'Aufhebungsvertrag',def:'Beide beenden das Arbeitsverhältnis gemeinsam. Für die Agentur zählt das wie eine eigene Kündigung. (Mehr in Modul 9.)',

 weil:'… weil ein Aufhebungsvertrag wie eine eigene Kündigung zählt.'}
];

{id:'q22',mod:2,q:'Wie hoch ist das Krankengeld?',o:['70 % vom Brutto, höchstens 90 % vom Netto','60 % vom Netto','100 % vom Brutto'],a:0,why:'Ab der 7. Woche zahlt die Krankenkasse 70 % vom Brutto, höchstens 90 % vom Netto.'},
{id:'q23',mod:2,q:'Sara verdient 2.000 € brutto und 1.450 € netto. Wie viel Krankengeld bekommt sie im Monat?',o:['1.305 €','1.400 €','1.450 €'],a:0,why:'70 % von 2.000 = 1.400 €; 90 % von 1.450 = 1.305 €. Der kleinere Betrag gilt.'},

const PROFIS=[
{id:'p01',mod:1,q:'Private Versicherungen arbeiten nach dem Äquivalenzprinzip. Erkläre den Unterschied zum Solidaritätsprinzip an einem Beispiel.',a:'Solidaritätsprinzip: Beitrag nach Einkommen, gleiche Leistung für alle. Äquivalenzprinzip: Beitrag nach Risiko (Alter, Vorerkrankungen). Eine 60-jährige Diabetikerin hätte ein hohes Risiko – ihr Beitrag wäre sehr hoch oder Leistungen wären ausgeschlossen.'},
{id:'p02',mod:1,q:'Beurteile: „Die Sozialversicherung müsste freiwillig sein – jeder soll selbst entscheiden.“',a:'Dagegen: Junge Gesunde würden austreten, übrig blieben Kranke und Alte – die Beiträge würden unbezahlbar. Kleine Einkommen könnten nicht vorsorgen; im Notfall zahlt die Allgemeinheit über Steuern. Dafür: mehr Eigenverantwortung, Wahlfreiheit. Fazit begründet.'},
{id:'p03',mod:2,q:'Kasse A verlangt 2,5 % Zusatzbeitrag, Kasse B 3,4 %. Wie viel spart Ayşe (2.500 € brutto) im Jahr mit Kasse A?',a:'Unterschied 0,9 %, Arbeitnehmeranteil die Hälfte = 0,45 %. 2.500 € × 0,45 : 100 = 11,25 € im Monat × 12 = 135 € im Jahr.'},
{id:'p04',mod:2,q:'Kinderlose zahlen in der Pflegeversicherung mehr. Begründe die Regel mit dem Umlageverfahren und beurteile, ob sie gerecht ist.',a:'Die heutigen Beiträge zahlen die heutige Pflege. Kinder sind die Beitragszahler von morgen – wer Kinder großzieht, leistet einen zweiten Beitrag (Bundesverfassungsgericht 2001). Gegenargument: Nicht jeder kann Kinder bekommen. Urteil begründet.'},
{id:'p05',mod:2,q:'Warum heißt die Pflegeversicherung „Teilkasko“? Nenne zwei Möglichkeiten, die Lücke zu schließen.',a:'Die Kasse zahlt feste Beträge je Pflegegrad, nicht die vollen Kosten. Lücke: eigenes Einkommen und Vermögen, private Pflegezusatzversicherung, notfalls Sozialhilfe („Hilfe zur Pflege“).'},
{id:'p06',mod:3,q:'Eine Rente von 1.500 € soll aus 18,6 % Beiträgen bezahlt werden. Wie viel brutto muss jeder verdienen, wenn 2 bzw. 1,5 Beitragszahler eine Rente tragen?',a:'1.500 € : 0,186 = 8.064,52 € Bruttolohnsumme. Bei 2 Beitragszahlern je 4.032,26 €, bei 1,5 je 5.376,34 € – mehr als die meisten verdienen. Darum steigen Beiträge oder Steuerzuschuss, oder die Rente sinkt.'},
{id:'p07',mod:3,q:'Beurteile die Forderung, einen Teil der Rentenbeiträge in Aktien anzulegen. Nenne je zwei Vor- und Nachteile.',a:'Vorteile: höhere Erträge über lange Zeit, weniger abhängig von der Zahl der Beitragszahler. Nachteile: Kursrisiko (Crash kurz vor Rentenbeginn), Verwaltungskosten, die Umstellung muss doppelt bezahlt werden.'},
{id:'p08',mod:3,q:'Begründe, warum der Staat private Altersvorsorge fördert.',a:'Die gesetzliche Rente allein wird oft nicht reichen. Ohne Anreiz sparen viele zu wenig. Später müsste der Staat mit Grundsicherung einspringen – Vorsorge entlastet die Allgemeinheit.'},
{id:'p09',mod:4,q:'Jana hat ein pauschaliertes Netto von 1.600 €. Berechne ihr Arbeitslosengeld ohne und mit Kind. Warum sind es nicht 100 %?',a:'1.600 × 0,60 = 960 €; mit Kind 1.600 × 0,67 = 1.072 €. Anreiz, schnell wieder Arbeit zu suchen; eine Versicherung ersetzt nur einen Teil des Lohns.'},
{id:'p10',mod:4,q:'Unterscheide Arbeitslosengeld und Grundsicherung nach Träger, Finanzierung, Voraussetzung und Höhe.',a:'ALG: Agentur für Arbeit, Beiträge, 12 Monate Beitragszeit, 60/67 % vom Netto, befristet. Grundsicherung: Jobcenter, Steuern, Bedürftigkeit, Regelbedarf plus Miete, nicht befristet, Vermögen wird angerechnet.'},
{id:'p11',mod:4,q:'Beurteile: „Wer Termine beim Jobcenter verpasst, sollte gar kein Geld mehr bekommen.“',a:'Pro: Mitwirkung ist fair gegenüber Steuerzahlern. Contra: Das Existenzminimum ist vom Grundgesetz geschützt (Menschenwürde), Kinder und Kranke dürfen nicht leiden; abgestufte Kürzungen sind verhältnismäßiger. Urteil begründet.'},
{id:'p12',mod:5,q:'Kemal verletzt sich durch einen Fehler seiner Chefin. Kann er sie auf Schmerzensgeld verklagen? Prüfe mit dem Vier-Schritte-Schema.',a:'Problem: Haftet die Chefin? Regel: Bei Arbeitsunfällen haften Arbeitgeber und Kollegen nicht für Personenschäden, die BG zahlt – außer bei Vorsatz oder auf dem allgemeinen Arbeitsweg. Anwendung: Fehler, kein Vorsatz. Ergebnis: Kemal kann nicht klagen, die BG zahlt.'},
{id:'p13',mod:5,q:'Begründe, warum die Arbeitgeber die Unfallversicherung allein bezahlen.',a:'Die Unfallversicherung ersetzt die Haftung des Arbeitgebers: Er ist für die Sicherheit verantwortlich und wird dafür von Schadenersatz befreit. Hohe Beiträge bei vielen Unfällen sind ein Anreiz zur Unfallverhütung.'},
{id:'p14',mod:6,q:'Frau Arslan (40, zwei Kinder) verdient 7.000 € brutto. Berechne ihre Beiträge zur KV (8,75 %) und RV (9,3 %). Grenzen: KV 6.375 €, RV 8.850 €.',a:'KV nur bis zur Grenze: 6.375 € × 8,75 % = 557,81 €. RV: 7.000 € liegt unter 8.850 € → 7.000 × 9,3 % = 651,00 €.'},
{id:'p15',mod:6,q:'Sevgi (25, kinderlos) bekommt 100 € mehr brutto. Ihre Lohnsteuer steigt um 24 €. Wie viel bleibt netto übrig?',a:'Sozialversicherung auf 100 €: 8,75 + 2,7 + 9,3 + 1,3 = 22,05 % = 22,05 €. 100 − 22,05 − 24 = 53,95 € mehr netto.'},
{id:'p16',mod:6,q:'Erkläre, warum ein Arbeitgeber sagt: „Eine Verkäuferin mit 2.600 € kostet mich über 3.100 €.“',a:'Der Betrieb zahlt zum Brutto seinen Anteil (rund 21,15 % = 549,90 €) plus Unfallversicherung und Umlagen – zusammen über 3.100 €.'}
