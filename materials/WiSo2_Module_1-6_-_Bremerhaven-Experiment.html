const ES={
 a1:{m:p=>`¡Hola ${N(p)}, bienvenido/a a Küstenzwirn! Tráeme hasta el viernes tus papeles del seguro social. ¿O prefieres asegurarte por tu cuenta?`,o:['¿Por mi cuenta? Entonces busco un seguro privado barato.','Como aprendiz estoy asegurado/a automáticamente (seguro obligatorio). Le digo mi caja de salud y le doy mi número de seguro social.','No lo necesito. Todavía estoy asegurado/a con mis padres.'],t:'Seguro obligatorio: quien trabaja o hace una formación está asegurado automáticamente. No se puede salir.'},
 a2:{m:p=>`Oye, ${N(p)}: ¿tienes que pagar tú las cuotas cada mes? ¿A cinco seguros? Qué estrés.`,o:['No. La empresa descuenta mi parte y transfiere todo a la caja de salud. Ella reparte el dinero.','Sí. Hago cinco transferencias cada mes.','No. La empresa paga todo sola. A mí no me cuesta nada.'],t:'Entidad recaudadora: la caja de salud recoge todas las cuotas y las reparte a pensiones, desempleo y dependencia.'},
 a3:{m:'Aquí hay una carta vieja del seguro de pensiones con tu número de seguro social. ¿La tiro? Ahora tienes un trabajo nuevo.',o:['¡No! El número es el mismo toda la vida. La empresa lo necesita para darme de alta.','Sí, tírala. Con cada trabajo nuevo recibo un número nuevo.','Sí. El número solo lo necesita la caja de salud, no la empresa.'],t:'Número de seguro social: un número para toda la vida. La empresa lo necesita para el alta.'},
 a4:{m:'La jefa seguro que gana 6.000 €, yo 2.100 €. Ella paga mucho más seguro médico. Pero en el médico recibimos el mismo trato. Injusto, ¿no?',o:['Es el principio de solidaridad: la cuota depende del ingreso. Las prestaciones son iguales para todos.','Es verdad. Quien paga más debería recibir mejor trato.','No es injusto. Todos pagan exactamente la misma cantidad en euros.'],t:'Principio de solidaridad: la cuota depende del ingreso, no del riesgo. Todos reciben las mismas prestaciones.'},
 a5:{m:'Ahora que trabajas: ¿Ole necesita su propio seguro médico? ¿Cuesta algo?',o:['No. Ole está asegurado gratis con mi caja de salud (seguro familiar).','Sí. Para Ole tengo que pagar una cuota propia.','No. Los niños están asegurados en el Jobcenter.'],t:'Seguro familiar: hijos y cónyuges sin ingresos propios están asegurados gratis.'},
 a6:{m:'En tu nómina hay cuatro cuotas que se descuentan. ¿Sabes por qué no está el seguro de accidentes?',o:['El seguro de accidentes lo paga solo la empresa, a la mutua profesional (Berufsgenossenschaft).','Porque los aprendices no tienen seguro de accidentes.','Lo paga mi caja de salud por mí.'],t:'Mutua profesional (BG): entidad del seguro de accidentes. Para el comercio: BGHW. Paga solo la empresa.'},
 k1:{m:p=>`¡Hola ${N(p)}! Hoy trabajas desde las 9:30. ¿Todo bien?`,n:'Son las 6:45. Tienes 39 grados de fiebre.',o:['Estoy enfermo/a y hoy no voy. A partir del 4.º día traigo la baja médica, o antes si usted quiere.','No contesto y me quedo en casa. Solo tengo que avisar cuando tenga la baja.','Voy igualmente. Si no, no cobro.'],t:'Avisar de la baja: decirlo enseguida a la empresa. Desde el 4.º día se necesita un certificado médico.'},
 k2:{m:'¿La médica te ha dado la baja una semana? Entonces tráeme el papel amarillo, por favor.',o:['El papel amarillo ya no existe. La consulta envía la baja electrónica a la caja. Usted la consulta allí.','Vale. Mañana paso con fiebre y se lo traigo.','Mi baja no es asunto suyo.'],t:'eAU: baja electrónica. La consulta la envía a la caja, la empresa la consulta allí.'},
 k3:{m:'Llevas tres semanas de baja por la rodilla. ¿Todavía cobras algo?',o:['Sí. Las primeras 6 semanas la empresa me sigue pagando todo el sueldo.','Sí. Desde el primer día la caja de salud paga subsidio por enfermedad.','No. Quien está enfermo no cobra.'],t:'Pago continuado del salario: en caso de enfermedad la empresa paga hasta 6 semanas el sueldo completo.'},
 k4:{m:'Está usted en la 8.ª semana de baja. Desde ahora pagamos el subsidio por enfermedad. ¿Sabe cuánto es?',n:'Tu sueldo: 1.100 € brutos, 870 € netos.',o:['Mi sueldo completo, como antes.','El 70 % del bruto, pero como máximo el 90 % del neto. En mi caso, 770 € al mes.','El 50 % del neto, o sea 435 € al mes.'],t:'Subsidio por enfermedad: desde la 7.ª semana paga la caja: 70 % del bruto, máximo 90 % del neto.'},
 k5:{m:'¿Te llegó también la carta? Nuestra caja sube la cuota adicional del 2,5 al 3,4 %. ¿Se puede hacer algo?',o:['Sí. Si la caja sube la cuota adicional, se puede cambiar enseguida a una caja más barata.','No. La caja de salud nunca se puede cambiar.','Sí. Entonces me salgo del seguro médico público.'],t:'Cuota adicional: cada caja la fija (2027 en promedio 2,9 %). Se paga a medias.'},
 k6:{m:'En la farmacia me pidieron 5 € por el antibiótico. ¿No paga todo la caja?',o:['Los adultos pagan el 10 % de los medicamentos: mínimo 5 €, máximo 10 €. Es correcto.','La farmacia te ha timado. Los medicamentos siempre son gratis.','Solo pagan los que tienen seguro privado.'],t:'Copago: los adultos pagan el 10 % de los medicamentos (mín. 5 €, máx. 10 €), en el hospital 10 € al día.'},
 p1:{m:'El abuelo Heinz en Geestemünde ya no puede lavarse ni vestirse solo desde el ictus. Los médicos dicen que seguirá así. ¿Qué hacemos?',o:['Pedir un grado de dependencia en la caja de dependencia. Viene el Servicio Médico y comprueba cuánta ayuda necesita.','Pedimos prestación por desempleo para el abuelo.','No se puede hacer nada. La familia paga sola los cuidados.'],t:'Grado de dependencia: el Servicio Médico decide cuánta ayuda necesita alguien: grado 1 a 5.'},
 p2:{m:'El abuelo tiene ahora el grado 3. Quiero cuidarlo en casa. ¿Recibo algo por eso?',o:['Sí. Si cuidan los familiares, hay ayuda económica (Pflegegeld). Si viene un servicio de cuidados, la caja paga una prestación en servicios.','No. Solo hay dinero si el abuelo va a una residencia.','Sí. La caja de salud te paga un sueldo como a una cuidadora.'],t:'Pflegegeld: dinero de la caja de dependencia cuando cuidan los familiares en casa.'},
 p3:{m:'Más adelante quizá el abuelo tenga que ir a una residencia. Entonces el seguro de dependencia paga todo, ¿no?',o:['No. El seguro de dependencia es como un „seguro parcial“. Paga solo una parte. Queda un copago alto.','Sí. La caja de dependencia paga todo.','No. La residencia siempre la paga el seguro de pensiones.'],t:'Seguro parcial: el seguro de dependencia paga solo una parte de los costes. El resto lo paga uno mismo.'},
 p4:{m:'A mí me descuentan 1,8 % para el seguro de dependencia. Tengo un hijo. ¿Cuánto es en tu caso?',o:['1,8 %, igual que tú.','2,7 %. Tengo 23 años y no tengo hijos. Entonces se suma un recargo.','Nada. Los aprendices no pagan seguro de dependencia.'],t:'Recargo por no tener hijos: quien no tiene hijos y tiene 23 años o más paga 0,9 % más, solo, sin la empresa.'},
 p5:{m:'¿Tengo que darme de alta aparte en el seguro de dependencia?',o:['No. Quien tiene seguro médico público está automáticamente en la caja de dependencia de la misma caja.','Sí. Hay que contratarlo uno mismo en una aseguradora.','No. Se está asegurado solo a partir de los 23.'],t:'Caja de dependencia: entidad del seguro de dependencia. Pertenece a la caja de salud.'},
 r1:{m:'De mi sueldo se descuenta un 9,3 % para la pensión. Ese dinero está en alguna cuenta para mí, ¿no?',o:['No. Nuestras cuotas pagan las pensiones de hoy. Más adelante los jóvenes pagarán nuestra pensión.','Sí. Se ahorra para ti y se paga con intereses.','No. El dinero es para el Estado, para calles y escuelas.'],t:'Pacto entre generaciones: los que trabajan pagan las pensiones de los mayores y esperan que los jóvenes paguen las suyas.'},
 r2:{m:'Puedes poner una parte de tu sueldo bruto en una pensión de empresa. Nosotros añadimos un 15 %. ¿Te interesa?',o:['Es la previsión de empresa, el 2.º pilar. Tengo incluso derecho a ella. Pediré asesoramiento.','No lo necesito. La pensión pública me bastará seguro.','¡Genial! Entonces la empresa paga toda mi pensión.'],t:'Conversión de salario: una parte del sueldo bruto va a la pensión de empresa. Todo trabajador tiene derecho a ella.'},
 r3:{m:'Mi padre (52) es mozo de almacén en el puerto pesquero y tiene problemas de espalda. La médica recomienda una cura para que pueda seguir trabajando. ¿Quién la paga?',o:['El seguro de pensiones. „Rehabilitación antes que pensión“: paga la cura para que siga pudiendo trabajar.','El seguro de desempleo.','La mutua profesional, porque trabaja en un almacén.'],t:'Rehabilitación antes que pensión: el seguro de pensiones paga curas y rehabilitación para que uno pueda seguir trabajando.'},
 r4:{m:'Un agente de seguros dice que contrate un seguro de incapacidad profesional. Tontería, ¿no? Para eso está el seguro de pensiones.',o:['La pensión pública solo paga una pensión por incapacidad si se puede trabajar menos de 6 horas al día. Un seguro de incapacidad profesional es previsión privada, el 3.er pilar.','Sí, tontería. El seguro de pensiones paga siempre si ya no puedes ejercer tu profesión.','El seguro de incapacidad profesional es obligatorio para todos los aprendices.'],t:'Tres pilares: 1 pensión pública (obligatoria) · 2 previsión de empresa · 3 previsión privada (voluntaria).'},
 r5:{m:'El abuelo se jubiló a los 65. ¿Cuándo puedes jubilarte tú?',o:['Según la ley actual, a los 67. Es la edad legal de jubilación.','A los 63, como todos.','A los 60, si he trabajado 40 años.'],t:'Edad legal de jubilación: desde esa edad hay pensión de jubilación: 67 años (nacidos desde 1964).'},
 r6:{m:'En el periódico pone: en 1962 había 6 cotizantes por cada jubilado. Hoy unos 2. Hacia 2050 solo 1,5. ¿Qué significa eso para nosotros?',o:['Cada vez menos cotizantes tienen que pagar a cada vez más jubilados. Entonces suben las cuotas o baja la pensión.','Nada. Nuestra pensión ya está ahorrada.','Entonces se suprime el seguro de pensiones.'],t:'Cambio demográfico: menos niños, vida más larga: cada vez menos cotizantes financian a más jubilados.'},
 u1:{m:'Escribiste que te caíste camino al trabajo. ¿Qué pasó?',n:'Ibas por el camino directo al Moin Outlet. Hielo. Tienes la muñeca hinchada.',o:['Es un accidente in itinere. Voy al médico de accidentes laborales (D-Arzt) y digo que pasó camino al trabajo.','Voy a mi médica de cabecera. Una caída en la calle es asunto privado.','Paga la caja de salud. El seguro de accidentes solo vale en la tienda.'],t:'Accidente in itinere: un accidente en el camino directo al trabajo o a la escuela profesional, ida y vuelta.'},
 u2:{m:'Te caíste camino al trabajo, pero delante de la guardería de Ole, no en el camino directo. ¿Eso está asegurado?',o:['Sí. El desvío para llevar a mi hijo a la guardería está asegurado. Es un accidente in itinere.','No. No estaba en el camino directo.','Solo si Ole también está herido.'],t:'Desvío a la guardería: si llevas a los niños a la guardería camino al trabajo, el desvío también está asegurado.'},
 u3:{m:'Tuvisteis un choque al venir de Langen, cuando recogiste a Svenja. Eso era un desvío. ¿Cuenta?',o:['Sí. Los desvíos para compartir coche están asegurados. Es un accidente in itinere.','No. Solo el camino directo está asegurado.','Solo Svenja está asegurada, yo no.'],t:'Coche compartido: también el desvío para recoger a compañeros está asegurado.'},
 u4:{m:'Paraste en la panadería volviendo a casa y te torciste el pie en los escalones de la tienda. Es un accidente in itinere, ¿no?',o:['No. Comprar es una interrupción privada. Mientras compro no estoy asegurado/a.','Claro. Iba camino a casa.','Sí, porque después quería seguir hacia casa.'],t:'Interrupción privada: compras, cine, visitas: durante una interrupción privada no hay seguro de accidentes.'},
 u5:{m:'En la pausa me corté el dedo pelando una manzana. Es un accidente laboral, ¿no? Estaba en la empresa.',o:['No. Comer es asunto privado. Cortarse pelando una manzana no es accidente laboral.','Sí. Todo lo que pasa en la empresa es accidente laboral.','Sí, porque la pausa es tiempo de trabajo.'],t:'Accidente laboral: un accidente durante el trabajo, también en la escuela profesional, en recados de la empresa y en fiestas de la empresa.'},
 u6:{m:'Te cortaste con el cúter. Es solo una tirita. No hace falta apuntarlo en ningún sitio, ¿no?',o:['Sí hace falta. Cada herida va al libro de primeros auxilios. Así se puede probar después que fue un accidente laboral.','Es verdad. Solo los accidentes grandes se apuntan.','Mando yo mismo/a un parte de accidente a la mutua profesional.'],t:'Libro de primeros auxilios (Verbandbuch): aquí se apunta cada herida en la empresa, también las pequeñas.'},
 u7:{m:'Después de tu caída en el almacén tienes dos semanas de baja. ¿Qué tengo que hacer ahora?',o:['Usted tiene que enviar en 3 días un parte de accidente a la mutua profesional, porque estoy más de 3 días de baja.','Nada. Eso lo arregla la caja de salud.','Tiene que llamar enseguida a la policía.'],t:'Parte de accidente: si alguien está más de 3 días de baja, la empresa envía en 3 días un parte a la mutua (BG).'},
 u8:{m:'Una clienta resbaló en nuestro suelo mojado. ¿Paga ahora la mutua profesional?',o:['No. Los clientes no están asegurados por la mutua. Quizá responda el seguro de responsabilidad civil de la tienda.','Sí. La mutua paga todos los accidentes en la tienda.','Sí, pero solo si la clienta es habitual.'],t:'¿Quién está asegurado? Todos los empleados desde el primer día, también aprendices y ayudantes. Los clientes no.'},
 g1:{m:'Tu sueldo en el 2.º año: 1.150,00 € brutos. ¿Sabes cuánto se descuenta para el seguro de pensiones?',o:['El 9,3 % de 1.150 € = 106,95 €. La empresa paga otro tanto.','El 18,6 % de 1.150 € = 213,90 €.','Nada. Los aprendices no pagan seguro de pensiones.'],t:'Parte del trabajador: la mitad del tipo de cotización. La otra mitad la paga la empresa.'},
 g2:{m:'En el seguro de dependencia te he descontado 20,70 €. ¿Está bien así?',o:['Sí. El 1,8 % de 1.150 € son 20,70 €.','No. Tengo 23 años y no tengo hijos. Tiene que ser el 2,7 %, o sea 31,05 €.','No. Tiene que ser el 3,6 %, o sea 41,40 €.'],t:'Tipo de dependencia: trabajador 1,8 %. Sin hijos desde los 23: 2,7 %.'},
 g3:{m:'¿Y? ¿Cuánto te llega al final a la cuenta? Eran 1.150 €, ¿no?',n:'Tú no pagas impuesto sobre el salario.',o:[p=>`No. Se descuentan las cuatro cuotas del seguro social. Me llegan ${NETTO(p)} €.`,'Sí. En los aprendices el bruto es igual al neto.','No. La mitad se va en impuestos.'],t:'Sueldo neto: bruto menos impuesto sobre el salario (menos impuesto eclesiástico) menos cuotas del seguro social.'},
 g4:{m:'¿Sabes que nos cuestas más que tus 1.150 €?',o:['Sí. La empresa paga además su parte, alrededor del 21 %, y el seguro de accidentes sola.','No. Ustedes pagan exactamente 1.150 €.','Sí. Ustedes pagan mi sueldo dos veces.'],t:'Parte de la empresa: además del bruto, la empresa paga su mitad de las cuotas y el seguro de accidentes.'},
 g5:{m:'Me suben 140 € brutos al mes. Mi tipo de pensión es 9,3 %. ¿Cuánto más se descuenta ahora para la pensión?',o:['140 € × 9,3 : 100 = 13,02 € más.','140 € × 18,6 : 100 = 26,04 € más.','Nada. La cuota sigue igual.'],t:'Cuota según ingreso: si sube el bruto, sube también la cuota.'},
 g6:{m:'Tu caja tiene un 2,9 % de cuota adicional. ¿Qué tipo se descuenta de tu sueldo para el seguro médico?',o:['8,75 %: la mitad de 14,6 % más 2,9 %.','17,5 %, el tipo completo.','7,3 %. La cuota adicional la paga la empresa sola.'],t:'Seguro médico: 14,6 % más cuota adicional, todo a medias. Con 2,9 %: el trabajador paga 8,75 %.'},
 l1:{m:p=>`${N(p)}, tengo que decirte que no podemos quedarnos contigo después del examen. Tu formación termina el 31 de julio.`,n:'Hoy es 10 de abril.',o:['Gracias por avisar. Me inscribo como demandante de empleo en la Agencia de Empleo como muy tarde el 30 de abril, 3 meses antes del final.','Entonces me inscribo en la Agencia el 1 de agosto.','Hasta finales de julio no tengo que hacer nada. La prestación por desempleo la cobro igual.'],t:'Inscribirse como demandante: como muy tarde 3 meses antes del final del empleo. Si uno se entera más tarde: en 3 días.'},
 l2:{m:'Ya no aguanto los turnos de tarde. Simplemente me despido y vivo un tiempo de la prestación por desempleo. ¿Buena idea?',o:['¡Cuidado! Quien se despide sin motivo importante tiene 12 semanas de sanción. Durante ese tiempo no hay prestación.','Claro. La prestación por desempleo siempre llega enseguida.','No se puede. Quien se despide nunca cobra prestación.'],t:'Sanción (Sperrzeit): un tiempo sin prestación por desempleo. Despido propio sin motivo importante: 12 semanas.'},
 l3:{m:'Su formación duró 24 meses con cotizaciones. ¿Sabe cuánta prestación por desempleo recibirá y durante cuánto tiempo?',o:['El 60 % de mi neto estimado, durante 12 meses.','El 67 % de mi neto estimado, durante 12 meses. Tengo un hijo.','Mi neto completo, el tiempo que quiera.'],t:'Prestación por desempleo: 60 % del neto estimado, con hijos 67 %. Tras 12 meses de trabajo 6 meses, tras 24 meses 12 meses.'},
 l4:{m:'Tenemos un puesto adecuado para usted: venta en una zapatería en el centro de Bremerhaven. ¿Se presenta?',o:['Sí, me presento. Si rechazo sin motivo importante un puesto adecuado, hay una sanción.','No, todavía no me apetece. Igual cobro mi dinero.','No. Espero a que quede libre un puesto de jefe/a de tienda.'],t:'Trabajo adecuado: quien lo rechaza sin motivo importante recibe una sanción (3 a 12 semanas).'},
 l5:{m:'Mi hermano Murat (19) nunca ha trabajado después del colegio y no encuentra formación. ¿Recibe prestación por desempleo?',o:['No. Para eso hacen falta 12 meses de cotización en los últimos 30 meses. Puede recibir la ayuda básica (Grundsicherung) del Jobcenter.','Sí. Todo desempleado recibe prestación por desempleo.','No. No recibe nada.'],t:'Ayuda básica (Grundsicherung): para quien puede trabajar pero no cubre su sustento. Jobcenter, con impuestos.'},
 l6:{m:'Por la reforma del outlet tendremos tres meses casi sin clientes. Las vendedoras trabajarán solo la mitad. ¿Quién ayuda con el sueldo?',o:['La Agencia de Empleo paga la prestación por jornada reducida (Kurzarbeitergeld).','La caja de salud paga subsidio por enfermedad.','El Jobcenter paga a todos la ayuda básica.'],t:'Prestación por jornada reducida: la Agencia de Empleo paga cuando una empresa tiene temporalmente menos trabajo.'},
 l7:{m:'La jefa me ha puesto delante un contrato de rescisión. Quizá tenga otro puesto a la vista. ¿Firmo sin más?',o:['Cuidado: un contrato de rescisión cuenta como un despido propio. Sin motivo importante hay 12 semanas de sanción.','Sí. Entonces hay prestación por desempleo enseguida.','Sí. Un contrato de rescisión siempre es mejor que un despido.'],t:'Contrato de rescisión: ambos terminan juntos la relación laboral. Para la Agencia cuenta como despido propio.'},
 f1:{m:'La caja de salud ha escrito: eres miembro desde hace tiempo. Y eso que querías ocuparte tú. ¿Cómo puede ser?',o:['Como aprendiz estoy asegurado/a obligatoriamente de forma automática. La empresa me dio de alta. No puedo salirme.','Es un error de la caja. Me doy de baja allí.','Me dieron de alta mis padres.'],t:'Alta: la empresa da de alta a los nuevos empleados en la caja de salud que ellos eligen.'},
 f2:{m:'La semana pasada no supe hasta mediodía dónde estabas. ¿Qué haces la próxima vez que estés enfermo/a?',o:['Aviso enseguida por la mañana antes de empezar. Desde el 4.º día hay certificado de la médica.','Mando en algún momento el papel amarillo.','La próxima vez voy a trabajar enfermo/a.'],t:'Avisar: enseguida. Comunicar la baja inmediatamente, no más tarde.'},
 f3:{m:'Dijiste que cobrarías todo el tiempo el dinero completo. Ahora, en la semana 9, llegó menos. ¿Por qué?',o:['Desde la 7.ª semana paga la caja de salud subsidio por enfermedad: 70 % del bruto, máximo 90 % del neto. Es menos que el sueldo.','La empresa se ha equivocado al calcular.','El subsidio siempre es la mitad del neto.'],t:'Cronología de la enfermedad: semanas 1–6 empresa (100 %) · desde la 7.ª caja de salud (subsidio) · máximo 78 semanas.'},
 f4:{m:'La caja de dependencia dice que la semana que viene viene el Servicio Médico a ver al abuelo. ¿Qué quieren?',o:['Comprueban cuánta ayuda necesita el abuelo y fijan el grado de dependencia, de 1 a 5.','Es el servicio de cuidados. Viene cada día a partir de ahora.','Controlan si el abuelo está de verdad enfermo y si no llaman a la policía.'],t:'Servicio Médico: visita a la persona en casa y fija el grado de dependencia (1 a 5).'},
 f5:{m:'Después de meses todavía te duele la muñeca. Pero la mutua profesional no sabe nada del accidente. ¿Qué aprendes de esto?',o:['Avisar enseguida de cada accidente: libro de primeros auxilios, D-Arzt, parte de accidente. Si no, falta la prueba y la mutua no paga las secuelas.','Nada. Las secuelas las paga de todas formas la caja de salud.','Los accidentes pequeños no hay que avisarlos nunca.'],t:'Prueba: el libro de primeros auxilios, el D-Arzt y el parte prueban que fue un accidente laboral o in itinere.'},
 f6:{m:'Usted recibe una sanción. Durante ese tiempo no hay prestación por desempleo. ¿Sabe cómo evitarlo?',o:['Inscribirse pronto: 3 meses antes, si no en 3 días. No despedirse sin motivo importante. Aceptar puestos adecuados.','Las sanciones son al azar. No se puede hacer nada.','Me voy al Jobcenter. Allí no hay reglas.'],t:'Sanciones: despido propio/rescisión 12 semanas · puesto rechazado 3–12 semanas · inscripción tardía 1 semana.'},
 f7:{m:'En la nómina no todo salió bien. ¿Cómo se calcula bien una cuota?',o:['Bruto × tipo del trabajador : 100. Redondear a céntimos. Para la pensión, 9,3 %, no 18,6 %.','Bruto × tipo total : 100.','Neto × tipo : 100.'],t:'Cómo calcular: cuota = bruto × tipo del trabajador : 100, redondear a céntimos.'},
 f8:{m:'Después del accidente de noviembre la muñeca se te ha quedado rígida. Ya no puedes cargar cajas pesadas ni barras de ropa. Quieres hacer una readaptación profesional. ¿Quién la paga?',n:'La mutua profesional pregunta: ¿hay informe del D-Arzt y parte de accidente?',o:['Después de un accidente laboral o in itinere la mutua profesional paga la readaptación. Presento el informe del D-Arzt y el parte de accidente.','La Agencia de Empleo. Un accidente es un accidente.','Una readaptación siempre se paga uno mismo.'],t:'Readaptación tras accidente: después de un accidente laboral o in itinere paga la mutua (BG). Si no, la Agencia de Empleo o el seguro de pensiones.'},
 c01:{m:'La jefa se olvidó de darme de alta en la caja. Y ahora me he torcido el pie. ¿No estoy asegurado?',o:['Sí lo estás. Estás asegurado por ley desde el primer día de trabajo. La empresa tiene que hacer el alta después.','No. Sin alta no hay protección. Pagas tú.','Tienes que contratar rápido un seguro privado.'],w:'La protección empieza con la relación laboral, aunque falte el alta.'},
 c02:{m:'Estuviste dos días enfermo/a. ¡Sin certificado no pago esos dos días!',o:['Avisé enseguida. Necesito certificado desde el 4.º día, si usted no lo pidió antes. El sueldo sigue.','Vale, entonces descuente los días.','¡Entonces nunca más me pongo de baja!'],w:'Desde el 4.º día hace falta certificado; la empresa puede pedirlo desde el 1.º.'},
 c03:{m:'El abuelo tiene que ir al hospital. Le piden 10 € al día. ¿Es un timo?',o:['No. Los adultos pagan en el hospital 10 € al día, como máximo 28 días.','Sí. El hospital siempre es gratis.','Sí. Eso lo tiene que pagar la caja de dependencia.'],w:'Copago en el hospital: 10 € al día, máximo 28 días al año.'},
 c04:{m:'Llevas siete semanas de baja. A partir de ahora no pago nada.',o:['Es verdad. Desde la 7.ª semana recibo subsidio de la caja de salud.','¡Tiene que seguir pagando hasta que me cure!','Entonces recibo prestación por desempleo.'],w:'El pago continuado dura 6 semanas. Después paga la caja de salud.'},
 c05:{m:'Quiero que me devuelvan mis cuotas de pensión y prefiero invertirlas en acciones. ¿Se puede?',o:['No. El seguro de pensiones es obligatorio. Las cuotas pagan enseguida las pensiones de hoy.','Sí. Uno puede salirse cuando quiera.','Sí, pero solo desde los 25.'],w:'Seguro obligatorio y reparto: las cuotas no se ahorran.'},
 c06:{m:'Firma ahora mismo este contrato de rescisión, por favor. Así quedas libre enseguida.',o:['Primero pido asesoramiento. Un contrato de rescisión puede traer 12 semanas de sanción.','Claro, lo firmo.','¡Los contratos de rescisión están prohibidos!'],w:'Un contrato de rescisión sin motivo importante cuenta como despido propio: 12 semanas de sanción.'},
 c07:{m:'Murat ya ha faltado a dos citas en el Jobcenter. Da igual, ¿no?',o:['No da igual. Quien incumple sus obligaciones recibe menos dinero. Tiene que ir a las citas.','Da igual. La ayuda básica siempre se paga completa.','Entonces recibe prestación por desempleo.'],w:'Ayuda básica: ir a las citas, buscar trabajo, aceptar trabajo adecuado. Si no, se reduce.'},
 c08:{m:'La escalera del almacén está rota. Súbete a la caja vacía para llegar a las cajas de arriba.',o:['Es demasiado peligroso. Necesito una escalera o un taburete.','Vale, ya me apaño.','Entonces trepo por la estantería.'],w:'Así se cayó Lea en el módulo 5. Usar escalera o taburete.'},
 c09:{m:'Me he hecho daño por un error de la jefa. ¡La voy a demandar por daños morales!',o:['Normalmente no se puede. En accidentes laborales paga la mutua. La jefa solo responde si fue a propósito.','Claro, tiene que pagar.','Los daños morales los paga la caja de salud.'],w:'El seguro de accidentes sustituye la responsabilidad del empresario (salvo dolo).'},
 c10:{m:'Uy, para la pensión te descontamos 18,6 % en vez de 9,3 %. No te das cuenta, ¿verdad?',o:['Sí me doy cuenta. Solo pago la parte del trabajador, 9,3 %. Por favor, corríjanlo y devuélvanmelo.','Da igual, es para mi pensión.','Entonces a partir de ahora no pago nada de pensión.'],w:'18,6 % es el tipo total. El trabajador paga 9,3 %.'}
};

/* ===== Werkzeuge ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const V=(x,p)=>typeof x==='function'?x(p):x;

/* ===== Speicher (nur auf diesem Gerät) ===== */
const KEY='bhv_sv_v1';
let STORE_OK=true;
const DEF={seen:{},wrong:{s:[],q:[]},fixed:0,best:{},played:{a:[],b:[]},badges:[],total:0,profi:false,music:false,mods:[1,2,3,4,5,6],team:'',games:0,resetNote:{}};
let ST=JSON.parse(JSON.stringify(DEF));
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);ST=Object.assign(JSON.parse(JSON.stringify(DEF)),o);}}catch(e){STORE_OK=false}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){STORE_OK=false}}

/* Ziehen ohne Wiederholung pro Modus */
function draw(pool,n,key,r,challenge){
  if(challenge)return shuffle(pool,r).slice(0,n);
  const seen=new Set(ST.seen[key]||[]);
  let fresh=pool.filter(x=>!seen.has(x.id));
  let out=shuffle(fresh,r).slice(0,n);
  if(out.length<n){
    // Pool aufgebraucht: zurücksetzen
    const ids=new Set(pool.map(x=>x.id));
    ST.seen[key]=(ST.seen[key]||[]).filter(id=>!ids.has(id));
    ST.resetNote[key.split(':')[0]]=true;
    const rest=shuffle(pool.filter(x=>!out.includes(x)),r);
    out=out.concat(rest.slice(0,n-out.length));
  }
  return out;
}
function markSeen(key,id){if(!G||G.challenge)return;const a=ST.seen[key]||(ST.seen[key]=[]);if(!a.includes(id))a.push(id)}

/* ===== Musik (Web Audio, Standard aus) ===== */
const MUS={ctx:null,on:false,timer:null,step:0,tempo:118,int:0,gain:null};
function musCtx(){if(!MUS.ctx){try{MUS.ctx=new (window.AudioContext||window.webkitAudioContext)();MUS.gain=MUS.ctx.createGain();MUS.gain.gain.value=.3;MUS.gain.connect(MUS.ctx.destination)}catch(e){MUS.ctx=null}}return MUS.ctx}
function tone(f,t,d,type,v){const c=MUS.ctx;const o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+d+.02)}
function noise(t,d,v){const c=MUS.ctx;const b=c.createBuffer(1,c.sampleRate*d,c.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=(Math.random()*2-1)*(1-i/ch.length);const s=c.createBufferSource();s.buffer=b;const g=c.createGain();g.gain.value=v||.06;const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=6000;s.connect(hp);hp.connect(g);g.connect(MUS.gain);s.start(t)}
const BASS=[55,55,65.4,55,49,49,58.3,49];
function musTick(){if(!MUS.ctx)return;const c=MUS.ctx,t=c.currentTime+.05,st=MUS.step++;const b=BASS[Math.floor(st/2)%8];
  if(st%2===0)tone(b,t,.22,'sawtooth',.1);

function buildClassic(mode,code,fixedP){
  const ch=mode==='challenge';let mods=MODSEL();
  if(ch){const m=/-(\d{1,2})$/.exec(code);if(m){const u=+m[1];if(u>=1&&u<=6)mods=Array.from({length:u},(_,i)=>1+i)}}
  const r=ch?mulberry(hashStr(code+'|'+mods.join(','))):Math.random;
  const p=fixedP||drawPersona(r,ch);
  const key=(mode==='challenge'?'klassik':mode)+':s';
  const areas=Object.keys(AREAS).filter(a=>mods.includes(AREAS[a].mod)).sort((x,y)=>AREAS[x].ord-AREAS[y].ord);
  let steps=[],used=new Set();
  const want=Math.max(6,areas.length);
  let round=0;
  while(steps.length<want&&round<4){
    for(const a of areas){
      if(steps.length>=want&&round>0)break;
      const cand=SCENES.filter(s=>s.area===a&&avail(s,p)&&!used.has(s.id));
      if(!cand.length)continue;
      const s=draw(cand,1,key,r,ch)[0];used.add(s.id);
      steps.push({t:'scene',sc:s,ord:AREAS[a].ord+round*.01});
    }
    round++;
  }
  const nMini=mode==='krise'?1:2;
  const mPool=Object.keys(MINIS).filter(k=>mods.includes(MINIS[k].mod)).map(k=>({id:k}));
  draw(mPool,Math.min(nMini,mPool.length),mode==='challenge'?'klassik:mini':mode+':mini',r,ch).forEach(m=>{
    steps.push({t:'mini',k:m.id,ord:MINIS[m.id].ord,data:makeMini(m.id,r,p,mods,ch,mode)});
  });
  const played=new Set(steps.filter(s=>s.t==='scene').map(s=>s.sc.area));
  const evc=EVENTS.filter(e=>mods.includes(e.mod)&&avail(e,p)&&(!e.need||played.has(e.need))&&(!e.at||played.has(e.at)));
  const nEv=mode==='krise'?1:2;
  draw(evc,Math.min(nEv,evc.length),(ch?'klassik':mode)+':ev',r,ch).forEach(e=>{
    const pl=[...played];const ar=e.at?AREAS[e.at].ord:e.need?AREAS[e.need].ord:AREAS[pl[Math.floor(r()*pl.length)]].ord;
    steps.push({t:'event',ev:e,ord:ar+.8});
  });
  if(mode==='krise'){
    const cc=CRISES.filter(c=>mods.includes(c.mod)&&avail(c,p));
    draw(cc,Math.min(3,cc.length),'krise:c',r,false).forEach(c=>{const ar=(Object.values(AREAS).find(a=>a.mod===c.mod)||{ord:3}).ord;steps.push({t:'crisis',cr:c,ord:ar+.7})});
  }
  steps.sort((x,y)=>x.ord-y.ord);
  const pq=PROFIS.filter(q=>mods.includes(q.mod));
  return{mode,challenge:ch,code:ch?code:null,r,p,mods,steps,i:0,wis:0,max:0,eur:400,arg:0,jokers:mode==='profi'?1:3,log:[],choices:{},
    profiQ:draw(pq.length?pq:PROFIS,1,'profi:p',r,ch)[0],profi:mode==='profi'};
}

function makeMini(k,r,p,mods,ch,mode){

  if(MINIPOOL[k]){const [pool,n]=MINIPOOL[k];return{items:draw(pool,n,key,r,ch).map(x=>({id:x.id,t:x.t,a:x.a,why:x.why||''}))}}

        q1:{q:`Wer zahlt in Woche ${W}?`,o:['der Betrieb (100 %)','die Krankenkasse (Krankengeld)','die Agentur für Arbeit'],a:W<=6?'der Betrieb (100 %)':'die Krankenkasse (Krankengeld)',why:W<=6?'Woche 1–6: Entgeltfortzahlung durch den Betrieb.':'Ab Woche 7: Krankengeld von der Krankenkasse.'},

    });
    return{items};
  }
  if(k==='abr'){
    const pr=ABRN[Math.floor(r()*ABRN.length)];const B=[1900,2100,2300,2500,2700][Math.floor(r()*5)];
    const pvOk=(pr.kids||pr.age<23)?1.8:2.7;
    const rows=[{id:'kv',n:'Krankenversicherung',ok:8.75,bad:[17.5,7.3]},{id:'pv',n:'Pflegeversicherung',ok:pvOk,bad:[pvOk===1.8?2.7:1.8,3.6]},{id:'rv',n:'Rentenversicherung',ok:9.3,bad:[18.6]},{id:'alv',n:'Arbeitslosenversicherung',ok:1.3,bad:[2.6]}];
    const wrong=shuffle([0,1,2,3],r).slice(0,2);
    const fx=x=>String(x).replace('.',',')+' %';
    const why={kv:'KV: 14,6 % + 2,9 % = 17,5 %, davon die Hälfte: 8,75 %.',pv:pvOk===2.7?`PV: ${pr.n} ist ${pr.age} und kinderlos: 1,8 % + 0,9 % = 2,7 %.`:pr.kids?`PV: ${pr.n} hat Kinder: kein Zuschlag, 1,8 %.`:`PV: ${pr.n} ist unter 23: kein Zuschlag, 1,8 %.`,rv:'RV: 18,6 %, davon die Hälfte: 9,3 %.',alv:'ALV: 2,6 %, davon die Hälfte: 1,3 %.'};
    const items=rows.map((w,i)=>{const isW=wrong.includes(i);const rate=isW?w.bad[Math.floor(r()*w.bad.length)]:w.ok;return{id:'ab'+w.id,n:w.n,rate:fx(rate),amt:eu(r2(B*rate/100)),a:isW?'no':'ok',right:`${fx(w.ok)} = ${eu(r2(B*w.ok/100))}`,why:why[w.id]}});
    const net=r2(B-rows.reduce((s,w)=>s+r2(B*w.ok/100),0));
    return{items,pr,B:eu(B),net:eu(net)};
  }
}

function doSend(){

    S.wcorrect=0;const all=[sc.weil,...others];const ord=shuffle([0,1,2],G.r);S.wopts=ord.map(i=>all[i]);S.wright=ord.indexOf(0);S.phase='weil';render();return}

function finishScene(){
  const st=G.steps[G.i],sc=st.sc||st.cr,p=st.p||G.p,S=st.s;const o=sc.opts[S.sel],law=S.law;

  markSeen((G.challenge?'klassik':G.mode)+(st.cr?':c':':s'),sc.id);if(st.cr)markSeen('krise:c',sc.id);

      const at=j>=0?j+1:G.i+1;G.steps.splice(at,0,{t:'scene',sc:F,fu:true,ord:(G.steps[at-1]||st).ord+.001});}
  }
  if(de)(G.konto||(G.konto=[])).push({m:(AREAS[sc.area]||{}).month||((Object.values(AREAS).find(a=>a.mod===sc.mod)||{}).month)||'',t:EURWHY[sc.id+'|'+de]||sc.title,v:de});
  if(law===0&&['u1','u2','u3','u7'].includes(sc.id)&&!st.cr&&['klassik','krise','profi','challenge'].includes(G.mode)&&!(G.fuDone||[]).includes('f8')){
    const F8=FOLLOW.find(f=>f.id==='f8');const j=G.steps.findIndex((x,k)=>k>G.i&&x.t==='scene'&&x.sc.area==='m4');

  setTimeout(()=>{if(G&&G.steps[G.i]===st){S.phase='done';render()}},matchMedia('(prefers-reduced-motion: reduce)').matches?50:900);

function qAnswer(i){

let TIMER=null;

function finishGame(){
  if(G.finished)return;G.finished=true;
  const quiz=G.mode==='blitz'||G.mode==='pruef';
  ST.total+=G.wis;ST.games++;
  if(!quiz&&G.mode!=='fehler'&&G.mode!=='wdh'){if(!ST.played.a.includes(G.p.a.id))ST.played.a.push(G.p.a.id);if(!ST.played.b.includes(G.p.b.id))ST.played.b.push(G.p.b.id)}
  const sc=G.max?Math.min(100,Math.round(G.wis/G.max*100)):0;G.pc=sc;
  ST.best[G.mode]=Math.max(ST.best[G.mode]||0,sc);
  const s=stars(G),B=ST.badges,add=id=>{if(!B.includes(id)){B.push(id);G.newBadges=(G.newBadges||[]).concat(id)}};
  add('b1');if(ST.played.b.length>=3)add('b2');if(ST.played.a.filter(x=>x==='jan'||x==='julia').length>=2)add('b3');
  if(G.mode==='blitz'&&G.log.filter(l=>l.ok).length>=8)add('b4');
  if(G.mode==='pruef'&&sc>=81)add('b5');
  if(G.mode==='fehler'&&G.log.every(l=>l.pts>=10))add('b6');
  if(ST.fixed>=5)add('b7');
  if(G.mode==='profi'&&s===3)add('b8');
  if((G.mode==='klassik'||G.mode==='krise'||G.mode==='challenge')&&s===3&&G.arg<=10)add('b9');

}

  m.innerHTML=h;const wr=document.querySelector('.wrap');if(wr)wr.style.maxWidth=VIEW==='tafel'?'1200px':'';if(VIEW==='tafel')renderTafelBody();

  ST.team=($('#team')?.value||ST.team||'').trim();save();
  if(k==='profi'&&!ST.profi)return;
  if(k==='wdh'&&!(ST.wrong.s.length+ST.wrong.q.length))return;
  if(k==='klassik'||k==='krise'||k==='profi'||k==='challenge'){G=buildClassic(k,code||'');ST8={};go('persona');return}
  if(k==='blitz'||k==='pruef')G=buildQuiz(k);
  if(k==='fehler')G=buildHunt();
  if(k==='wdh')G=buildWdh();
  if(!G.steps.length){G=null;return}
  go('play');
}
const ACT={
 rsrc(v){const R=G.steps[G.i].s.rr;if(R.done)return;R.a=+v;render()},
 rrule(v){const R=G.steps[G.i].s.rr;if(R.done)return;R.b=v;render()},
 rcheck(){const st=G.steps[G.i],R=st.s.rr;R.done=true;const ok=(R.src===null||R.a===R.src)&&R.b===R.right;G.max+=2;if(ok)G.wis+=2;G.lastD={wis:ok?2:0};G.log.push({type:'role',ok,sc:st.sc});save();render()},
 es(){ST.es=!ST.es;save();render()},
 roles(_,el){G.roles=!!el.checked;render()},
 tafel(){go('tafel')},
 music(){ST.music=!ST.music;save();if(ST.music){musCtx();if(MUS.ctx&&MUS.ctx.state==='suspended')MUS.ctx.resume();if(VIEW==='play'&&G&&G.mode==='blitz')musStart(1);else musTusch()}else musStop();renderBar()},
 home(){stopTimer();musStop();G=null;HOMEX={};go('home')},
 upto(v){ST.upto=+v;save();render()},
 only(_,el){ST.only=!!el.checked;save();render()},
 mode(v){startMode(v)},
 daycode(v){const c=$('#code');if(c)c.value=v},
 challenge(){const c=($('#code')?.value||'').trim().toUpperCase();const tag=$('[data-act=daycode]')?.dataset.v;startMode('challenge',c||tag)},
 tcode(){const c=($('#tcode')?.value||'').trim().toUpperCase();if(c==='KRAPU'){ST.profi=true;save();render()}else{const t=$('#tcode');if(t){t.value='';t.placeholder='Code stimmt nicht'}}},
 reset(){HOMEX.reset=true;render()},resetno(){HOMEX.reset=false;render()},
 resetyes(){const m=ST.music;ST=JSON.parse(JSON.stringify(DEF));ST.music=m;save();HOMEX={};render()},
 flip(){ST8.flip=true;render()},
 fig(v){const f=FIGS.find(x=>x.id===v);if(!f||!G)return;ST.fig=v;save();G.p=Object.assign({},G.p,{a:f});render()},
 startplay(){go('play')},
 pick(v){const S=G.steps[G.i].s;if(S.phase!=='choose'||S.gone.includes(+v))return;S.sel=+v;render()},
 joker(){const st=G.steps[G.i],S=st.s,p=st.p||G.p;if(G.jokers<=0)return;const sc=st.sc;const bad=S.order.filter(i=>V(sc.opts[i].law,p)===0&&!S.gone.includes(i)&&i!==S.sel);if(!bad.length)return;S.gone.push(bad[0]);G.jokers--;S.jokerTxt=`Eine falsche Antwort ist weg. Nachlesen: ${(AREAS[sc.area]||{}).book||'Lehrbuch'}.`;render()},
 send(){doSend()},
 weil(v){const S=G.steps[G.i].s;S.weil=+v;finishScene()},
 next(){G.lastD=null;stopTimer();G.i++;if(G.i>=G.steps.length){go('result');return}render();const ph=document.querySelector('#main');ph&&ph.scrollIntoView({block:'start'})},
 mans(v){const st=G.steps[G.i],S=st.s;if(S.checked)return;const [id,a]=v.split('|');S.ans[id]=a;if(st.k==='dienst'&&a==='ok')delete S.rs[id];render()},
 mres(v){const st=G.steps[G.i],S=st.s;if(S.checked)return;const [id,a]=v.split('|');S.rs[id]=a;render()},
 mcheck(){miniCheck()},
 qans(v){qAnswer(+v)},
 hj(v){const S=G.steps[G.i].s;if(S.done)return;S.j=v;if(v==='ok')S.fix=null;render()},
 hf(v){const S=G.steps[G.i].s;if(S.done)return;S.fix=+v;render()},
 hcheck(){huntCheck()},
 again(){const k=G.mode,c=G.code;if(k==='challenge'){startMode('klassik');return}startMode(k,c)},
 same(){const k=G.mode==='challenge'?'klassik':G.mode,p=G.p;G=buildClassic(k,'',p);ST8={flip:true};go('persona')}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.getAttribute('aria-disabled')==='true')return;if(b.disabled)return;const a=b.dataset.act;if(ACT[a]){if(b.tagName==='INPUT'&&b.type==='checkbox'){ACT[a](b.dataset.v,b);return}e.preventDefault();ACT[a](b.dataset.v,b)}});
document.addEventListener('input',e=>{if(e.target.id==='team'){ST.team=e.target.value;save()}if(e.target.id==='nA'||e.target.id==='nB'){ST.names=[$('#nA')?.value||'',$('#nB')?.value||''];save()}});
function boot(){load();try{localStorage.setItem(KEY+'_t','1');localStorage.removeItem(KEY+'_t')}catch(e){STORE_OK=false}
  if(!ST.upto||ST.upto>6)ST.upto=6;initRoom();if(PRM.get('tafel')==='1')VIEW='tafel';render()}

/* ===== Klassen-Ranking am Beamer (MQTT wie Popcorn-Börse) ===== */
const PRM=new URLSearchParams(location.search);
const LOCAL=PRM.get('bc')==='1';
const BROKERS=PRM.get('broker')?[PRM.get('broker')]:['wss://broker.hivemq.com:8884/mqtt','wss://broker.emqx.io:8084/mqtt'];
const NS='bhvsv1/';
function rnd(n){const a='abcdefghijkmnpqrstuvwxyz23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(n));for(const x of r)s+=a[x%a.length];return s}
function codeGen(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';const r=crypto.getRandomValues(new Uint8Array(5));for(const x of r)s+=a[x%a.length];return s}
const cleanS=(s,m)=>String(s==null?'':s).replace(/[\u0000-\u001f\u007f​-‏‪-‮]/g,' ').trim().slice(0,m);
class Net{
  constructor(onMsg,onStatus){this.cid='l'+rnd(10);this.seen=new Map();this.onMsg=onMsg;const st=()=>onStatus(this.count());
    try{this.links=LOCAL?[new LocalLink(this.cid,(t,p,r)=>this.recv(t,p,r),st)]:BROKERS.map(u=>new MqttLink(u,this.cid,(t,p,r)=>this.recv(t,p,r),st))}catch(e){this.links=[]}}
  count(){return{up:this.links.filter(l=>l.up).length,all:this.links.length}}
  recv(t,p,r){if(p&&typeof p==='object'&&p.mid){if(this.seen.has(p.mid))return;this.seen.set(p.mid,Date.now());if(this.seen.size>3000)this.seen.clear()}this.onMsg(t,p,r)}
  sub(t){this.links.forEach(l=>l.subscribe(NS+t))}
  pub(t,obj,retain){obj.mid=rnd(12);let ok=false;this.links.forEach(l=>{if(l.publish(NS+t,obj,retain))ok=true});return ok}
}
/* --- Handy: Ergebnis an die Tafel senden --- */
let ROOM=null,NET=null,NETUP=false,GOT=new Set(),RESEND=null;
function initRoom(){
  const s=cleanS(PRM.get('s'),8).toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(s){ROOM=s;ST.room=s;const c=cleanS(PRM.get('c'),16).toUpperCase();if(c)ST.preCode=c;const m=+PRM.get('m');if(m>=1&&m<=6){ST.upto=m;ST.only=false}save()}
  else if(ST.room&&LOCAL)ROOM=ST.room;
  if(!ROOM)return;
  NET=new Net((t,p)=>{if(t===NS+ROOM+'/st'&&p&&Array.isArray(p.got)){p.got.forEach(g=>GOT.add(g));if((ST.pend||[]).some(x=>GOT.has(x.gid))){ST.pend=(ST.pend||[]).filter(x=>!GOT.has(x.gid));save();if(VIEW==='result'||VIEW==='home')render()}}},c=>{NETUP=c.up>0;if(VIEW==='home')renderRoomNote()});
  NET.sub(ROOM+'/st');
  RESEND=setInterval(sendPending,2500);
}
function queueResult(){
  if(!ROOM||!G)return;const gid=rnd(10);G.gid=gid;
  ST.pend=(ST.pend||[]).concat({gid,team:cleanS(ST.team||'Team ohne Namen',24),mode:G.mode,pc:G.pc||0,chef:Math.round(100-G.arg),en:Math.round(G.eur),stars:stars(G),code:G.code||''});save();sendPending();
}
function sendPending(){if(!NET)return;(ST.pend||[]).forEach(r=>NET.pub(ROOM+'/in',Object.assign({k:'res'},r)))}
function roomStatus(){if(!ROOM||!G||!G.gid)return'';const done=GOT.has(G.gid);return`<p class="note">${done?'An die Klassen-Tafel gesendet.':'Wird an die Klassen-Tafel gesendet …'+(NETUP?'':' (noch keine Verbindung)')}</p>`}
function renderRoomNote(){const el=document.getElementById('roomnote');if(el)el.innerHTML=roomNoteHtml()}
function roomNoteHtml(){return ROOM?`<span class="dotc${NETUP?' on':''}"></span>Verbunden mit der Klassen-Tafel <b class="mono">${esc(ROOM)}</b>${NETUP?'':' – verbindet …'}. Eure Ergebnisse erscheinen am Beamer.`:''}

/* --- Tafel (Lehrkraft, Beamer) --- */
const TKEY=KEY+'_tafel';let T=null,TNET=null,TUP=0,TPUB=null;
function tLoad(){try{T=JSON.parse(localStorage.getItem(TKEY))}catch(e){T=null}if(!T||!T.code)T={code:codeGen(),url:'',res:{},sort:'pc',mod:ST.upto||6,cc:''};}
function tSave(){try{localStorage.setItem(TKEY,JSON.stringify(T))}catch(e){}}
function tStart(){
  tLoad();if(TNET)return;
  TNET=new Net((t,p)=>{if(t!==NS+T.code+'/in'||!p||p.k!=='res')return;const gid=cleanS(p.gid,12);if(!gid)return;
    const modes=MODES.map(m=>m.k);const r={team:cleanS(p.team,24)||'Team',mode:modes.includes(p.mode)?p.mode:'klassik',pc:clamp(+p.pc||0,0,100),chef:clamp(+p.chef||0,0,100),en:clamp(+p.en||0,-9999,9999),stars:clamp(+p.stars||0,0,3),code:cleanS(p.code,16),t:Date.now()};
    const isNew=!T.res[gid];T.res[gid]=r;tSave();tPub();if(isNew&&VIEW==='tafel')renderTafelBody()},c=>{TUP=c.up;if(VIEW==='tafel')renderTafelBody()});
  TNET.sub(T.code+'/in');tPub();TPUB=setInterval(tPub,5000);
}
function tPub(){if(!TNET)return;TNET.pub(T.code+'/st',{got:Object.keys(T.res).slice(-300)},true)}
function joinUrl(){
  const q='?s='+T.code+(T.cc?'&c='+encodeURIComponent(T.cc):'')+'&m='+T.mod+(LOCAL?'&bc=1':'')+(PRM.get('broker')?'&broker='+encodeURIComponent(PRM.get('broker')):'');
  if(location.protocol.startsWith('http')&&!/claude\.ai|claudeusercontent/.test(location.host))return location.origin+location.pathname+q;
  if(T.url){const u=T.url.trim();return u.split('?')[0]+q}
  return'';
}
function drawQR(canvas,text){const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!text||typeof QRLib==='undefined'){ctx.fillStyle='#777';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.fillText('Adresse fehlt',canvas.width/2,canvas.height/2);return}
  const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
  ctx.fillStyle='#000';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell)}
function tafelView(){
  tStart();const tag=TAGWORDS[(new Date().getDate()+new Date().getMonth()*31)%TAGWORDS.length]+'-'+T.mod;
  return`<section class="tafel"><div class="card stack"><div class="eyebrow">Klassen-Ranking · Tafel</div><h2>Scannt den Code</h2><canvas id="qr" width="600" height="600" aria-label="QR-Code zum Spiel"></canvas>
   <div><span class="small muted">Tafel-Code</span><div class="bigcode">${esc(T.code)}</div></div><p class="small" id="tconn"></p>
   ${!joinUrl()?`<label class="small" for="turl">Adresse der Spieldatei im Netz (z. B. GitHub Pages)</label><input type="text" id="turl" value="${esc(T.url||'')}" placeholder="https://…/bremerhaven-experiment.html"><button class="btn ghost" data-act="turl">Adresse übernehmen</button>`:`<p class="small muted mono" style="overflow-wrap:anywhere">${esc(joinUrl())}</p>`}
   <label class="small" for="tmod">Die Handys starten mit „bis Modul …“</label><select id="tmod" style="min-height:44px;border-radius:10px;padding:6px">${[1,2,3,4,5,6].map(m=>`<option value="${m}" ${m===T.mod?'selected':''}>Modul ${m}</option>`).join('')}</select>
   <label class="check"><input type="checkbox" id="tcc" data-act="tcc" ${T.cc?'checked':''}> Klassen-Challenge-Code mitschicken${T.cc?`: <b class="mono">${esc(T.cc)}</b>`:` (${esc(tag)})`}</label>
   <p class="small muted">Das Ranking braucht Internet und die Datei aus dem Ordner (z. B. über GitHub Pages). Im privaten Claude-Link sind Verbindungen gesperrt.</p></div>
   <div class="card stack" id="tbody"></div></section>`;
}
function renderTafelBody(){
  const b=document.getElementById('tbody');if(!b)return;const c=document.getElementById('tconn');if(c)c.innerHTML=`<span class="dotc${TUP?' on':''}"></span>${TUP?'verbunden':'keine Verbindung'}`;
  const best={};Object.values(T.res).forEach(r=>{const k=r.team.toLowerCase();const o=best[k];if(!o){best[k]=Object.assign({n:1},r);return}o.n++;if(r.pc>o.pc||(r.pc===o.pc&&r.chef>o.chef))Object.assign(o,r,{n:o.n})});
  const rows=Object.values(best).sort((a,b)=>T.sort==='chef'?(b.chef-a.chef||b.pc-a.pc):(b.pc-a.pc||b.chef-a.chef));
  b.innerHTML=`<div class="row"><h2>Ranking</h2><span class="sp"></span><div class="seg"><button data-act="tsort" data-v="pc" aria-pressed="${T.sort==='pc'}">nach Wissen</button><button data-act="tsort" data-v="chef" aria-pressed="${T.sort==='chef'}">ohne Ärger</button></div></div>
  ${rows.length?`<div style="overflow-x:auto"><table class="rank"><thead><tr><th>#</th><th>Team</th><th>Modus</th><th class="n">Wissen</th><th class="n">ohne Ärger</th><th class="n">Konto</th><th>Sterne</th></tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i<3?'top':''}"><td>${i+1}</td><td><b>${esc(r.team)}</b>${r.n>1?` <span class="small muted">(${r.n} Spiele)</span>`:''}</td><td>${esc(MODES.find(m=>m.k===r.mode)?.n||r.mode)}</td><td class="n">${r.pc} %</td><td class="n">${r.mode==='blitz'||r.mode==='pruef'||r.mode==='fehler'?'–':r.chef+' %'}</td><td class="n">${r.mode==='blitz'||r.mode==='pruef'||r.mode==='fehler'?'–':r.en+' €'}</td><td>${'★'.repeat(r.stars)}${'☆'.repeat(3-r.stars)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Noch keine Ergebnisse. Sobald ein Team fertig ist, erscheint es hier.</p>'}
  <p class="small muted">Pro Team zählt das beste Ergebnis. Fragt beim Vergleich: Wer hatte viel Wissen und kaum Ärger?</p>
  ${HOMEX.tnew?`<div class="confirm"><b>Neue Sitzung starten?</b><span class="small">Neuer Code, Ranking wird geleert.</span><div class="row"><button class="btn ghost" data-act="tnewno">Abbrechen</button><button class="btn" style="background:var(--bad);color:#fff" data-act="tnewyes">Ja, neu</button></div></div>`:`<button class="btn ghost" data-act="tnew">Neue Sitzung</button>`}`;
  const q=document.getElementById('qr');if(q)drawQR(q,joinUrl());
}
Object.assign(ACT,{
 turl(){T.url=cleanS($('#turl')?.value,300);tSave();render()},
 tmod(_,el){},
 tcc(_,el){T.cc=el.checked?TAGWORDS[(new Date().getDate()+new Date().getMonth()*31)%TAGWORDS.length]+'-'+T.mod:'';tSave();render()},
 tsort(v){T.sort=v==='chef'?'chef':'pc';tSave();renderTafelBody()},
 tnew(){HOMEX.tnew=true;renderTafelBody()},tnewno(){HOMEX.tnew=false;renderTafelBody()},
 tnewyes(){HOMEX.tnew=false;if(TNET){clearInterval(TPUB);TNET.links.forEach(l=>{try{l.ws&&l.ws.close()}catch(e){}});TNET=null}T={code:codeGen(),url:T.url,res:{},sort:'pc',mod:T.mod,cc:''};tSave();render()}
});
document.addEventListener('change',e=>{if(e.target.id==='tmod'){T.mod=+e.target.value;if(T.cc)T.cc=T.cc.replace(/-\d+$/,'-'+T.mod);tSave();render()}});

boot();
