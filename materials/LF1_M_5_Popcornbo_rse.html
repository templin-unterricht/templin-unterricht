<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Popcorn-Börse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,700;112,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#f1efe9;--surface:#fff;--surface2:#f7f5f0;--ink:#1f1d18;--muted:#5f5a4f;--line:#d9d3c6;
  --brand:#7a3e00;--brand-ink:#fff;--ok:#1f7a3f;--bad:#b3261e;--warn:#a15c00;
  --kauf:#1f5fae;--kauf-soft:#dde8f7;--verk:#c2410c;--verk-soft:#fbe6dc;--beob:#5b4b8a;--beob-soft:#e9e3f5;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#f0a95a;--brand-ink:#1a1209;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --kauf:#7fb0ff;--kauf-soft:#1b2a40;--verk:#ff8a5c;--verk-soft:#3a2219;--beob:#b9a6f0;--beob-soft:#2a2340;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15130f;--surface:#1f1c17;--surface2:#191712;--ink:#efebe2;--muted:#b0a898;--line:#3a352c;
  --brand:#f0a95a;--brand-ink:#1a1209;--ok:#6fcf8e;--bad:#ff8a80;--warn:#f0b35a;
  --kauf:#7fb0ff;--kauf-soft:#1b2a40;--verk:#ff8a5c;--verk-soft:#3a2219;--beob:#b9a6f0;--beob-soft:#2a2340;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.4}
h1,h2,h3{font-family:var(--display);font-stretch:112%;margin:0 0 .4em;line-height:1.1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.6em 1em}
button.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
button:disabled{opacity:.45;cursor:default}
input,textarea{font:inherit;width:100%;padding:.6em .7em;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.muted{color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.merk{border-left:6px solid var(--brand);background:var(--surface);border-radius:10px;padding:12px 14px;margin:8px 0}
.merk b.k{color:var(--kauf)} .merk b.v{color:var(--verk)}
.term{font-weight:700;border-bottom:3px solid var(--brand)}
.alt{font-weight:400;color:var(--muted);font-size:.9em}
/* ---------- Tafel ---------- */
#tafel header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
#tafel header h1{font-size:1.35rem;margin:0}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.steps button{padding:.35em .8em;font-size:.9rem}
.steps button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mini{display:flex;align-items:center;gap:10px;font-size:.9rem}
.mini canvas{width:64px;height:64px;border-radius:6px;background:#fff}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:4px}
.dot.on{background:var(--ok)}
#tMain{padding:20px 22px 40px;max-width:1400px;margin:0 auto}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center}
.ctrl button{font-size:1.05rem}
.big{font-size:clamp(1.6rem,3.2vw,2.6rem)}
.join{display:grid;grid-template-columns:minmax(260px,420px) 1fr;gap:28px;align-items:start}
.join canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:14px}
.code{font-family:var(--display);font-size:3rem;font-weight:800;letter-spacing:.12em}
.nicks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.nicks button{padding:.3em .7em;font-size:.95rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.clock{font-family:var(--display);font-size:3rem;font-weight:800}
.chip{display:inline-block;border-radius:999px;padding:.2em .7em;margin:3px;font-weight:700;font-family:var(--display)}
.chip.k{background:var(--kauf-soft);color:var(--kauf)} .chip.v{background:var(--verk-soft);color:var(--verk)}
.banner{border-radius:12px;padding:12px 16px;margin-top:14px;font-size:1.2rem}
.banner.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));border:2px solid var(--ok)}
.banner.nf{background:var(--kauf-soft);border:2px solid var(--kauf)}
.banner.af{background:var(--verk-soft);border:2px solid var(--verk)}
.banner.info{background:var(--surface);border:2px solid var(--brand)}
.satz{display:block;margin-top:6px;font-size:1rem;color:var(--muted)}
.hbar{display:grid;grid-template-columns:140px 1fr 60px;gap:10px;align-items:center;margin:10px 0;font-size:1.15rem}
.hbar .t{height:34px;border-radius:8px;background:var(--surface2);overflow:hidden}
.hbar .t i{display:block;height:100%;transition:width .4s}
.hbar b{font-family:var(--display);font-size:1.8rem;text-align:right}
table.mt{border-collapse:collapse;width:100%;background:var(--surface);border-radius:12px;overflow:hidden;font-size:1.05rem}
table.mt th,table.mt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:center}
table.mt th{background:var(--surface2);font-size:.9rem}
table.mt tr.cur td{outline:3px solid var(--brand);outline-offset:-3px}
table.mt tr.eq td{background:color-mix(in srgb,var(--ok) 18%,var(--surface));font-weight:700}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchips button{font-family:var(--display);font-weight:800;font-size:1.1rem;padding:.4em .8em}
.pchips button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.pchips button.done{border-color:var(--ok);border-width:2px}
.scen{text-align:left;padding:14px;border-radius:14px;border:2px solid var(--line)}
.scen b{display:block;font-family:var(--display);font-size:1.3rem;margin-bottom:4px}
svg text{font-family:var(--body)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.timer{font-family:var(--display);font-size:3rem;font-weight:800;min-width:2.2em;text-align:center;border-radius:50%;background:var(--surface);border:4px solid var(--brand);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{border-radius:14px;padding:14px 16px;color:#fff;font-size:1.2rem;font-weight:700;position:relative}
.o0{background:#b3261e}.o1{background:#1f5fae}.o2{background:#8a5300}.o3{background:#3a7a1c}.o4{background:#8537a3}
.opt.wrong{opacity:.35}
.opt .cnt{position:absolute;right:14px;top:10px;font-family:var(--display);font-size:1.6rem}
.top{list-style:none;padding:0;margin:0}
.top li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--surface);margin-bottom:6px;font-size:1.15rem}
.top li b{font-family:var(--display)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;margin-top:24px}
.podium div{background:var(--brand);color:var(--brand-ink);border-radius:14px 14px 0 0;width:200px;text-align:center;padding:12px;font-family:var(--display);font-weight:800}
.podium span{display:block;font-size:1.4rem}
.pro{font-size:.75rem;font-weight:700;background:var(--brand);color:var(--brand-ink);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.qtab{border-collapse:collapse;margin:8px 0;background:var(--surface)}
.qtab td,.qtab th{border:1px solid var(--line);padding:4px 10px;text-align:center}
@media (max-width:900px){.two,.three,.join,.opts{grid-template-columns:1fr}}
/* ---------- Handy ---------- */
#phone{max-width:560px;margin:0 auto;padding:14px 16px 40px}
#phone .ph-top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted);margin-bottom:10px}
.card{border-radius:18px;padding:16px 18px;border:3px solid;margin-bottom:12px}
.card.K{background:var(--kauf-soft);border-color:var(--kauf)} .card.V{background:var(--verk-soft);border-color:var(--verk)} .card.B{background:var(--beob-soft);border-color:var(--beob)}
.card .role{font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:.06em;text-transform:uppercase}
.card.K .role{color:var(--kauf)} .card.V .role{color:var(--verk)} .card.B .role{color:var(--beob)}
.card .val{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1.05}
.card .cd{margin-top:8px;font-size:1rem}
.card .cd b{font-family:var(--display);font-size:1.8rem;letter-spacing:.1em}
.step{display:flex;align-items:center;gap:8px;margin:8px 0}
.step button{font-size:1.2rem;font-weight:800;padding:.5em .7em;min-width:3.2em}
.step .pv{flex:1;text-align:center;font-family:var(--display);font-weight:800;font-size:2rem}
.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--surface2)}
.status.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.status.bad{background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.yn button{padding:20px 10px;font-size:1.2rem;font-weight:700;border-radius:14px;border:3px solid var(--line)}
.yn button.sel{outline:4px solid var(--ink);outline-offset:1px}
.yn .y{background:color-mix(in srgb,var(--ok) 18%,var(--surface));border-color:var(--ok)}
.yn .n{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:var(--bad)}
.pbtn{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:14px;font-size:1.05rem}
.pbtn.sel{outline:4px solid var(--ink);outline-offset:-2px}
.popt{display:block;width:100%;margin:10px 0;padding:16px 14px;border-radius:14px;color:#fff;border:none;font-size:1.05rem;font-weight:700;text-align:left}
.bigpts{font-family:var(--display);font-size:2.4rem;font-weight:800}
.ansage{font-family:var(--display);font-weight:800;font-size:3rem;text-align:center;margin:6px 0}
</style>
</head>
<body>
<div id="tafel" hidden>
  <header>
    <h1>Popcorn-Börse</h1>
    <nav class="steps" id="steps"></nav>
    <div class="mini"><canvas id="qrSmall" width="128" height="128"></canvas><div><b id="miniCode"></b><br><span id="miniN"></span><br><span id="conn"></span></div></div>
  </header>
  <main id="tMain"></main>
</div>
<div id="phone" hidden></div>

  s+=`<line x1="${L}" y1="${H-Bt}" x2="${W-R}" y2="${H-Bt}" stroke="currentColor" stroke-width="2"/><line x1="${L}" y1="${H-Bt}" x2="${L}" y2="${Tp}" stroke="currentColor" stroke-width="2"/>`;
  s+=`<text x="${L}" y="${Tp-4}" font-size="13" fill="currentColor">Preis in €</text><text x="${W-R}" y="${H-8}" font-size="13" text-anchor="end" fill="currentColor">Menge (Tüten)</text>`;
  const line=(pts,col,dash,w)=>pts.length>1?`<polyline points="${pts.map(([q,p])=>X(q)+","+Y(p)).join(" ")}" fill="none" stroke="${col}" stroke-width="${w||3}" ${dash?`stroke-dasharray="${dash}"`:""} stroke-linejoin="round"/>`:"";
  const cardPts=(cards,key)=>{const vs=cards.map(c=>c.v),lo=Math.max(0,Math.min(...vs)-30),hi=Math.min(maxP,Math.max(...vs)+30),a=[];
    for(let p=Math.floor(lo/10)*10;p<=hi;p+=10){const c=curve(cards,p);a.push([c[key],p]);}return a;};
  if(o.old){s+=line(cardPts(o.old,"N"),"var(--kauf)","6 6",2)+line(cardPts(o.old,"A"),"var(--verk)","6 6",2);}
  if(o.cards){s+=line(cardPts(o.cards,"N"),"var(--kauf)",null,3)+line(cardPts(o.cards,"A"),"var(--verk)",null,3);
    const n0=cardPts(o.cards,"N"),a0=cardPts(o.cards,"A");
    s+=`<text x="${X(n0[0][0])-6}" y="${Y(n0[0][1])+18}" text-anchor="end" font-size="14" font-weight="700" fill="var(--kauf)">Nachfrage</text>`;
    s+=`<text x="${X(a0[a0.length-1][0])-6}" y="${Y(a0[a0.length-1][1])-8}" text-anchor="end" font-size="14" font-weight="700" fill="var(--verk)">Angebot</text>`;}
  const rows=(o.rows||[]).slice().sort((a,b)=>a.p-b.p);
  if(!o.cards){s+=line(rows.map(r=>[r.N,r.p]),"var(--kauf)",null,2)+line(rows.map(r=>[r.A,r.p]),"var(--verk)",null,2);}
  for(const r of rows){s+=`<circle cx="${X(r.N)}" cy="${Y(r.p)}" r="7" fill="var(--kauf)"><title>Nachfrage ${r.N}</title></circle><rect x="${X(r.A)-6}" y="${Y(r.p)-6}" width="12" height="12" fill="var(--verk)"><title>Angebot ${r.A}</title></rect>`;}
  if(o.eq){const ex=X(o.eq.q),ey=Y(o.eq.p);
    s+=`<line x1="${L}" y1="${ey}" x2="${ex}" y2="${ey}" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5 4"/><line x1="${ex}" y1="${ey}" x2="${ex}" y2="${H-Bt}" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5 4"/>`;
    s+=`<circle cx="${ex}" cy="${ey}" r="11" fill="none" stroke="var(--ok)" stroke-width="4"/><text x="${ex+14}" y="${ey-12}" font-size="20" font-weight="800" fill="var(--ok)">X</text>`;
    s+=`<text x="${ex+14}" y="${ey+20}" font-size="13" fill="var(--ok)">${eur(o.eq.p)} · ${o.eq.q} Tüten</text>`;}
  return s+`</svg>`;}
</script>
<script>

/* =========================================================
   TAFEL (Lehrkraft, Beamer)
   ========================================================= */
function tafelApp(){
  $("tafel").hidden=false;
  const KEY="popcorn_tafel";
  const fresh=()=>({code:codeGen(),ph:0,pl:{},dealt:false,round:0,rOpen:false,rEnd:0,deals:[],off:{},sst:{},why:{},showLeer:false,
    an:{st:"n",p:-1,open:false},ans:{},curves:false,shock:-1,s3:0,pred:{},done3:[],q:-1,qOpen:false,qStart:0,qAns:{},kick:[],url:""});
  let T=store(KEY);if(!T||!T.code)T=fresh();
  let conn={up:0,all:2},pubT=null,subbed="";
  const net=new Net(onMsg,c=>{conn=c;if(c.up)pub();renderHead();});
  function sub(){if(subbed!==T.code){subbed=T.code;net.sub(T.code+"/in");}}
  sub();
  const save=()=>store(KEY,T);
  const players=()=>Object.keys(T.pl);
  const stageKey=()=>T.ph===3&&T.shock>=0?"s"+T.shock:"n";
  const ansKey=()=>stageKey()+":"+T.an.p;
  function effV(pid,st){const P=T.pl[pid];if(!P||P.r==="B"||P.v==null)return null;let v=P.v;
    if(st&&st[0]==="s"){const S=SHOCKS[+st.slice(1)];if(S&&S.r===P.r)v=Math.max(10,v+S.d);}return v;}
  function cardsFor(st){return players().filter(id=>T.pl[id].r==="K"||T.pl[id].r==="V").map(id=>({r:T.pl[id].r,v:effV(id,st)}));}
  const dealOf=(pid,r)=>T.deals.find(d=>d.r===r&&(d.s===pid||d.b===pid));
  const byCode=c=>players().find(id=>T.pl[id].c===c);

  function onMsg(t,p){
    if(t!==NS+T.code+"/in"||!p||!p.p)return;
    const pid=clean(p.p,12);if(T.kick.includes(pid))return;
    if(p.k==="hi"){const n=clean(p.n,16)||"?";
      if(!T.pl[pid]){T.pl[pid]={n,r:T.dealt?"B":null,v:null,c:newCode(),pts:0};}else T.pl[pid].n=n;}
    else if(!T.pl[pid])return;
    else if(p.k==="o")onOffer(pid,p);
    else if(p.k==="c")onConfirm(pid,p);
    else if(p.k==="w"&&T.ph===1&&!T.rOpen&&p.r===T.round&&Number.isInteger(p.c)&&p.c>=0&&p.c<2){(T.why[T.round]=T.why[T.round]||{})[pid]=p.c;}
    else if(p.k==="y"&&(T.ph===2||T.ph===3)&&T.an.open&&p.key===ansKey()&&typeof p.y==="boolean"){(T.ans[ansKey()]=T.ans[ansKey()]||{})[pid]=p.y;}
    else if(p.k==="pr"&&T.ph===3&&T.s3===1&&p.s===T.shock&&Number.isInteger(p.c)&&p.c>=0&&p.c<3){(T.pred[T.shock]=T.pred[T.shock]||{})[pid]=p.c;}
    else if(p.k==="a"&&T.ph===5&&T.qOpen&&p.q===T.q){
      const A=(T.qAns[T.q]=T.qAns[T.q]||{});if(A[pid])return;
      const c=p.c;if(!Number.isInteger(c)||c<0||c>=QUIZ[T.q].o.length)return;
      const dur=QUIZ[T.q].pro?DURPRO:DUR,s=(Date.now()-T.qStart)/1000;
      A[pid]={c,g:c===QUIZ[T.q].k?1000+Math.round(500*Math.max(0,1-s/dur)):0};
      if(Object.keys(A).length>=players().length)T.qOpen=false;}
    else return;
    save();pub();render();
  }
  function newCode(){const used=new Set(Object.values(T.pl).map(x=>x.c));let c;do{c=10+Math.floor(Math.random()*90);}while(used.has(c));return c;}

  /* ---------- Handel ---------- */
  function onOffer(pid,p){
    const S=T.pl[pid];if(T.ph!==1||!T.rOpen||S.r!=="V")return;
    for(const b in T.off){if(T.off[b].s===pid)delete T.off[b];}
    if(p.b==null){T.sst[pid]="";return;}
    if(dealOf(pid,T.round)){T.sst[pid]="Du hast in dieser Runde schon verkauft.";return;}
    const pr=Math.round(+p.pr);if(!Number.isFinite(pr)||pr<10||pr>600)return;
    if(pr<S.v){T.sst[pid]="Unter deinem Mindestpreis – so billig darfst du nicht verkaufen.";return;}
    const bid=byCode(+p.b);
    if(!bid||bid===pid){T.sst[pid]="Diesen Code gibt es nicht. Frag noch einmal nach.";return;}
    if(T.pl[bid].r!=="K"){T.sst[pid]="Das ist kein Käufer-Code.";return;}
    if(dealOf(bid,T.round)){T.sst[pid]="Dieser Käufer hat schon gekauft.";return;}
    if(T.off[bid]&&T.off[bid].s!==pid){T.sst[pid]="Dieser Käufer prüft gerade ein anderes Angebot. Versuch es gleich noch einmal.";return;}
    T.off[bid]={id:rnd(6),s:pid,pr};T.sst[pid]="wait:"+bid;
  }
  function onConfirm(pid,p){
    const O=T.off[pid];if(T.ph!==1||!T.rOpen||!O||O.id!==p.id)return;
    const B=T.pl[pid],S=T.pl[O.s];delete T.off[pid];
    if(!p.ok){T.sst[O.s]=`${B.n} hat abgelehnt.`;return;}
    if(O.pr>B.v){T.sst[O.s]=`${B.n} darf so viel nicht zahlen.`;return;}
    if(dealOf(pid,T.round)||dealOf(O.s,T.round))return;
    T.deals.push({r:T.round,pr:O.pr,s:O.s,b:pid});B.pts+=B.v-O.pr;S.pts+=O.pr-S.v;T.sst[O.s]="";
  }
  function deal(){
    const ids=shuffle(players()),C=makeCards(ids.length),cards=shuffle([...C.K.map(v=>({r:"K",v})),...C.V.map(v=>({r:"V",v}))]);
    ids.forEach((id,i)=>{const c=cards[i];Object.assign(T.pl[id],c?{r:c.r,v:c.v}:{r:"B",v:null},{pts:0});});
    T.dealt=true;T.round=0;T.deals=[];T.off={};T.sst={};T.why={};T.showLeer=false;
  }
  function startRound(){T.round++;T.rOpen=true;T.rEnd=Date.now()+ROUND_S*1000;T.off={};T.sst={};T.showLeer=false;}
  function endRound(){T.rOpen=false;T.off={};T.sst={};}
  setInterval(()=>{if(T.ph===1&&T.rOpen){if(Date.now()>T.rEnd){endRound();save();pub();render();}else{const el=$("clk");if(el)el.textContent=clock();}}},500);
  const clock=()=>{const s=Math.max(0,Math.ceil((T.rEnd-Date.now())/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};

  /* ---------- Quiz ---------- */
  function points(pid){let s=0;for(const qi in T.qAns){if(+qi<T.q||(+qi===T.q&&!T.qOpen)){const a=T.qAns[qi][pid];if(a)s+=a.g;}}return s;}
  function ranking(){return players().map(id=>({id,n:T.pl[id].n,s:points(id)})).sort((a,b)=>b.s-a.s);}
  function traders(){return players().filter(id=>T.pl[id].r==="K"||T.pl[id].r==="V").map(id=>({n:T.pl[id].n,r:T.pl[id].r,s:T.pl[id].pts})).sort((a,b)=>b.s-a.s);}

  /* ---------- Zustand an alle Handys ---------- */
  function pub(){clearTimeout(pubT);pubT=setTimeout(()=>{
    const st=stageKey(),pp={};
    for(const id of players()){const P=T.pl[id],d=T.round?dealOf(id,T.round):null,o=T.off[id];
      pp[id]={r:P.r,v:P.v,v2:effV(id,st),c:P.c,pts:P.pts,d:d?d.pr:null,
        o:o?{id:o.id,pr:o.pr,sn:T.pl[o.s]?T.pl[o.s].n:"?"}:null,st:(T.sst[id]||"").startsWith("wait:")?"Warte auf "+(T.pl[T.sst[id].slice(5)]||{n:"?"}).n+" …":(T.sst[id]||"")};}
    const S={ph:T.ph,dealt:T.dealt,round:T.round,rOpen:T.rOpen,rem:T.rOpen?Math.max(0,(T.rEnd-Date.now())/1000):0,pp,kick:T.kick,j:players(),
      dl:T.deals.filter(d=>d.r===T.round).map(d=>d.pr),
      wy:Object.keys(T.why[T.round]||{}),
      an:{st:T.an.st,p:T.an.p,open:T.an.open},yd:Object.keys(T.ans[ansKey()]||{}),
      shock:T.shock,s3:T.s3,pd:T.shock>=0?Object.keys(T.pred[T.shock]||{}):[],q:T.q,qOpen:T.qOpen,ans:[]};
    if(!T.an.open&&T.an.p>=0&&T.ans[ansKey()]){const A=T.ans[ansKey()];let N=0,V=0;for(const id in A){if(!A[id])continue;if(T.pl[id]&&T.pl[id].r==="K")N++;if(T.pl[id]&&T.pl[id].r==="V")V++;}S.res={N,A:V};}
    if(T.ph===3&&T.s3===3&&T.shock>=0){S.eq0=equilibrium(cardsFor("n"));S.eq1=equilibrium(cardsFor("s"+T.shock));}
    if(T.ph===5&&T.q>=0){S.ans=Object.keys(T.qAns[T.q]||{});S.rem=T.qOpen?Math.max(0,(QUIZ[T.q].pro?DURPRO:DUR)-(Date.now()-T.qStart)/1000):0;}
    if(T.ph>=5){const r=ranking();S.sc={};let rank=0,last=-1;
      r.forEach((x,i)=>{if(x.s!==last){rank=i+1;last=x.s;}const a=(T.qAns[T.q]||{})[x.id];S.sc[x.id]=[x.s,rank,T.qOpen?0:(a?a.g:0)];});S.np=r.length;}
    net.pub(T.code+"/st",S,true);},120);}
  setInterval(pub,5000);

  function go(ph){T.ph=ph;if(ph===2||ph===3){T.an={st:stageKey(),p:-1,open:false};}save();pub();render();}

  /* ---------- Kopfzeile ---------- */
  function joinUrl(){
    const extra=(params.get("broker")?"&broker="+encodeURIComponent(params.get("broker")):"")+(LOCAL?"&bc=1":"");
    if(location.protocol.startsWith("http"))return location.origin+location.pathname+"?s="+T.code+extra;
    if(T.url){const u=T.url.trim();return u+(u.includes("?")?"&":"?")+"s="+T.code+extra;}
    if(LOCAL)return location.href.split("?")[0]+"?s="+T.code+extra;return "";}
  function drawQR(canvas,text){
    const ctx=canvas.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
    if(!text||typeof QRLib==="undefined"){ctx.fillStyle="#999";ctx.font="bold 16px sans-serif";ctx.textAlign="center";ctx.fillText("keine Adresse",canvas.width/2,canvas.height/2);return;}
    const q=new QRLib.QRCode(-1,QRLib.ECL.M);q.addData(text);q.make();
    const n=q.getModuleCount(),cell=Math.floor(canvas.width/(n+4)),off=Math.floor((canvas.width-cell*n)/2);
    ctx.fillStyle="#000";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))ctx.fillRect(off+c*cell,off+r*cell,cell,cell);}
  function renderHead(){
    $("steps").innerHTML=PHASES.map((p,i)=>`<button data-ph="${i}" class="${i===T.ph?"on":""}">${i} ${p}</button>`).join("");
    $("steps").querySelectorAll("button").forEach(b=>b.onclick=()=>go(+b.dataset.ph));
    $("miniCode").textContent="Code "+T.code;$("miniN").textContent=players().length+" dabei";
    $("conn").innerHTML=`<span class="dot ${conn.up?"on":""}"></span>${conn.up?"verbunden":"keine Verbindung"}`;
    drawQR($("qrSmall"),joinUrl());}
  function render(){renderHead();const M=$("tMain");[rStart,rTrade,rAnsage,rShock,rMerk,rQuiz,rWin][T.ph](M);}

  /* ---------- 0 Start ---------- */
  function rStart(M){
    const pl=Object.entries(T.pl);
    M.innerHTML=`<div class="join"><div><canvas id="qrBig" width="600" height="600"></canvas></div>
      <div><h2 class="big">Willkommen an der Popcorn-Börse!</h2>
      <p style="font-size:1.25rem">1. QR-Code mit dem Handy scannen.<br>2. Einen Spitznamen eingeben.<br>3. Gleich bekommt jeder eine geheime Karte: Käufer oder Verkäufer.</p>
      <p class="muted">Code: <span class="code">${T.code}</span><br><span id="jU" style="word-break:break-all"></span></p>
      ${location.protocol.startsWith("http")||LOCAL?"":`<label>Internetadresse dieser Seite (nur nötig, wenn die Datei lokal geöffnet ist)<input id="tUrl" value="${h(T.url)}" placeholder="https://…/popcorn-boerse/"></label>`}
      <h3 style="margin-top:16px">${pl.length} dabei <span class="muted" style="font-size:.9rem;font-weight:400">· Antippen entfernt einen Namen</span></h3>
      <div class="nicks">${pl.map(([id,x])=>`<button data-id="${h(id)}">${h(x.n)}</button>`).join("")}</div>
      <div class="ctrl"><button class="pri" id="bGo">Los: Handeln →</button><button id="bNew">Neue Sitzung (alles löschen)</button></div></div></div>`;
    drawQR($("qrBig"),joinUrl());$("jU").textContent=joinUrl();
    if($("tUrl"))$("tUrl").onchange=e=>{T.url=e.target.value;save();render();};
    M.querySelectorAll(".nicks button").forEach(b=>b.onclick=()=>{const id=b.dataset.id;delete T.pl[id];T.kick.push(id);save();pub();render();});
    $("bGo").onclick=()=>go(1);
    $("bNew").onclick=()=>{if(window.confirm("Neue Sitzung starten? Alle Namen und Ergebnisse werden gelöscht.")){const u=T.url;T=fresh();T.url=u;save();sub();pub();render();}};
  }

  /* ---------- 1 Handeln ---------- */
  function dotPlot(){
    const R=Math.max(3,T.round),W=1000,rowH=70,H=R*rowH+50,L=110,Rm=30,X=c=>L+(W-L-Rm)*c/400;
    let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;background:var(--surface);border-radius:12px" role="img" aria-label="Abschlusspreise je Runde">`;
    for(let c=0;c<=400;c+=50){s+=`<line x1="${X(c)}" x2="${X(c)}" y1="10" y2="${H-36}" stroke="var(--line)"/><text x="${X(c)}" y="${H-14}" font-size="15" text-anchor="middle" fill="currentColor">${eur(c)}</text>`;}
    for(let r=1;r<=R;r++){const y=10+(r-0.5)*rowH,ds=T.deals.filter(d=>d.r===r).map(d=>d.pr).sort((a,b)=>a-b);
      s+=`<text x="10" y="${y+6}" font-size="17" font-weight="700" fill="currentColor">Runde ${r}</text>`;
      const cnt={};for(const pr of ds){const k=pr;cnt[k]=(cnt[k]||0)+1;const off=(cnt[k]-1)*12;s+=`<circle cx="${X(pr)}" cy="${y-off+10}" r="8" fill="var(--brand)" opacity=".85"><title>${eur(pr)}</title></circle>`;}
      if(ds.length){const avg=Math.round(ds.reduce((a,b)=>a+b,0)/ds.length);s+=`<line x1="${X(avg)}" x2="${X(avg)}" y1="${y-26}" y2="${y+24}" stroke="var(--ink)" stroke-width="3"/><text x="${X(avg)+6}" y="${y-14}" font-size="14" fill="currentColor">Ø ${eur(avg)}</text>`;}
    }
    return s+`</svg>`;}
  function rTrade(M){
    const ids=players(),nK=ids.filter(i=>T.pl[i].r==="K").length,nV=ids.filter(i=>T.pl[i].r==="V").length,nB=ids.filter(i=>T.pl[i].r==="B").length;
    if(!T.dealt){const C=makeCards(ids.length);
      M.innerHTML=`<h2 class="big">Gleich wird gehandelt!</h2>
      <div class="three"><div class="box"><h3 style="color:var(--kauf)">Käufer</h3>Ihr wollt Popcorn kaufen – möglichst billig. Auf eurer Karte steht, wie viel ihr <b>höchstens</b> zahlen dürft.</div>
      <div class="box"><h3 style="color:var(--verk)">Verkäufer</h3>Ihr wollt Popcorn verkaufen – möglichst teuer. Auf eurer Karte steht, wie viel ihr <b>mindestens</b> bekommen müsst.</div>
      <div class="box"><h3>Regeln</h3>Die Karte bleibt geheim. Pro Runde höchstens <b>ein</b> Abschluss. Seid ihr euch einig, tippt der Verkäufer den Code des Käufers und den Preis ein, der Käufer bestätigt. Dann setzt euch.</div></div>
      <p class="muted">${ids.length} dabei → ${C.K.length} Käufer, ${C.V.length} Verkäufer${ids.length%2?", 1 Marktbeobachter":""}.</p>
      <div class="ctrl"><button class="pri" id="bDeal">Karten verteilen</button></div>`;
      $("bDeal").onclick=()=>{deal();save();pub();render();};return;}
    const cur=T.deals.filter(d=>d.r===T.round),late=ids.filter(i=>T.pl[i].r==="B").length;
    let html=`<div class="row" style="justify-content:space-between"><h2 class="big" style="margin:0">${T.rOpen?`Runde ${T.round} läuft – handelt!`:T.round?`Runde ${T.round} ist vorbei`:"Bereit für Runde 1"}</h2>
      ${T.rOpen?`<div class="clock" id="clk">${clock()}</div>`:""}</div>
      <p class="muted">${nK} Käufer · ${nV} Verkäufer${nB?` · ${nB} Marktbeobachter`:""}${T.rOpen?` · <b>${cur.length} Abschlüsse</b>`:""}</p>
      ${dotPlot()}`;
    if(!T.rOpen&&T.round>0){
      const W=T.why[T.round]||{},cnt=[[0,0],[0,0]];for(const id in W){const r=T.pl[id]&&T.pl[id].r;if(r==="K")cnt[0][W[id]]++;if(r==="V")cnt[1][W[id]]++;}
      const leer=ids.filter(i=>(T.pl[i].r==="K"||T.pl[i].r==="V")&&!dealOf(i,T.round));
      html+=`<div class="two" style="margin-top:14px"><div class="box"><h3>Warum hattest du keinen Abschluss? (${leer.length} ohne Abschluss)</h3>
        <p><span class="chip k">Käufer</span> Höchstpreis zu niedrig: <b>${cnt[0][0]}</b> · keinen Partner: <b>${cnt[0][1]}</b></p>
        <p><span class="chip v">Verkäufer</span> Mindestpreis zu hoch: <b>${cnt[1][0]}</b> · keinen Partner: <b>${cnt[1][1]}</b></p>
        <button id="bLeer">${T.showLeer?"Karten verbergen":"Karten der Leer-Ausgegangenen zeigen"}</button>
        ${T.showLeer?`<p>${leer.filter(i=>T.pl[i].r==="K").map(i=>T.pl[i].v).sort((a,b)=>b-a).map(v=>`<span class="chip k">höchstens ${eur(v)}</span>`).join("")}</p>
          <p>${leer.filter(i=>T.pl[i].r==="V").map(i=>T.pl[i].v).sort((a,b)=>a-b).map(v=>`<span class="chip v">mindestens ${eur(v)}</span>`).join("")}</p>
          <p class="muted">Was fällt auf? Wer wenig zahlen will oder teuer verkaufen muss, geht leer aus.</p>`:""}</div>
        <div class="box"><h3>Was fällt euch an den Preisen auf?</h3>
        ${T.round>=2?`<p style="font-size:1.15rem">Niemand hat den Preis festgelegt – und trotzdem pendeln sich die Preise ein. <b>Bei welchem Preis?</b></p>`:`<p>Vergleicht die Preise. Liegen sie weit auseinander?</p>`}
        ${T.deals.length?`<h3 style="margin-top:12px">Beste Händler</h3>`:""}<ol class="top">${traders().filter(x=>x.s>0).slice(0,3).map(x=>`<li><span><span class="chip ${x.r==="K"?"k":"v"}">${x.r==="K"?"K":"V"}</span>${h(x.n)}</span><b>+${eur(x.s)}</b></li>`).join("")}</ol></div></div>`;}
    html+=`<div class="ctrl">${T.rOpen?`<button class="pri" id="bEnd">Runde beenden</button><button id="bMore">+1 Minute</button>`:
      `<button class="pri" id="bStart">Runde ${T.round+1} starten (3 Min.)</button>${T.round>=2?`<button class="pri" id="bNext">Weiter: Preisansage →</button>`:""}
       ${T.round===0||late?`<button id="bRe">Karten neu verteilen${late?` (${late} ohne Karte)`:""}</button>`:""}`}</div>
      ${!T.rOpen?`<p class="muted">Tipp: Spitznamen, die nach dem Verteilen kommen, werden Marktbeobachter. „Karten neu verteilen“ setzt die Runden zurück.</p>`:""}`;
    M.innerHTML=html;
    const on=(id,f)=>{if($(id))$(id).onclick=()=>{f();save();pub();render();};};
    on("bStart",startRound);on("bEnd",endRound);on("bMore",()=>{T.rEnd+=60000;});on("bNext",()=>go(2));
    on("bLeer",()=>{T.showLeer=!T.showLeer;});
    if($("bRe"))$("bRe").onclick=()=>{if(T.round===0||window.confirm("Karten neu verteilen? Die bisherigen Runden werden gelöscht.")){deal();save();pub();render();}};
  }

  /* ---------- 2 Preisansage (auch für 3 Schock) ---------- */
  function rowsFor(st){const out=[];for(const key in T.ans){const [s,p]=key.split(":");if(s!==st)continue;
      if(T.an.open&&key===ansKey())continue;let N=0,A=0;const R=T.ans[key];
      for(const id in R){if(!R[id]||!T.pl[id])continue;if(T.pl[id].r==="K")N++;if(T.pl[id].r==="V")A++;}out.push({p:+p,N,A});}
    return out.sort((a,b)=>a.p-b.p);}
  function ansageBlock(intro){
    const st=stageKey(),rows=rowsFor(st),cards=cardsFor(st),nK=cards.filter(c=>c.r==="K").length,nV=cards.filter(c=>c.r==="V").length;
    const eq=equilibrium(cards),shock=T.ph===3;
    const prices=shock?[100,150,200,250,300,350]:[50,100,150,200,250,300,350];
    const cur=T.an.p>=0?rows.find(r=>r.p===T.an.p):null,live=T.an.open?(T.ans[ansKey()]||{}):null;
    let liveN=0,liveA=0;if(live){for(const id in live){if(!live[id]||!T.pl[id])continue;if(T.pl[id].r==="K")liveN++;if(T.pl[id].r==="V")liveA++;}}
    const nAns=live?Object.keys(live).length:0,nAll=nK+nV;
    const N=live?liveN:cur?cur.N:0,A=live?liveA:cur?cur.A:0,mx=Math.max(1,nK,nV);
    const v=(!T.an.open&&cur)?verdict(cur.p,cur.N,cur.A):null;
    const maxEqRow=rows.reduce((b,r)=>Math.min(r.N,r.A)>(b?Math.min(b.N,b.A):-1)?r:b,null);
    const showEq=T.curves&&eq;
    return `${intro||""}
    <div class="two"><div>
      <div class="box"><div class="row" style="justify-content:space-between"><b>Preis ausrufen:</b><span class="muted">${T.an.open?`${nAns} von ${nAll} haben geantwortet`:""}</span></div>
        <div class="pchips" style="margin-top:8px">${prices.map(p=>`<button data-p="${p}" class="${p===T.an.p?"on":""} ${rows.some(r=>r.p===p)?"done":""}">${eur(p)}</button>`).join("")}</div>
        ${T.an.p>=0?`<div class="ansage">${eur(T.an.p)}</div>
        <div class="hbar"><span style="color:var(--kauf);font-weight:700">Nachfrage<br><small class="muted">Käufer sagen Ja</small></span><div class="t"><i style="width:${100*N/mx}%;background:var(--kauf)"></i></div><b>${T.an.open&&!T.peek?"?":N}</b></div>
        <div class="hbar"><span style="color:var(--verk);font-weight:700">Angebot<br><small class="muted">Verkäufer sagen Ja</small></span><div class="t"><i style="width:${100*A/mx}%;background:var(--verk)"></i></div><b>${T.an.open&&!T.peek?"?":A}</b></div>
        ${v?`<div class="banner ${v.c}"><b>${v.t}</b><span class="satz">${v.s}</span><span class="satz">Umsetzbare Menge: <b>${Math.min(cur.N,cur.A)}</b> Tüten – es kann nur so viel gehandelt werden, wie die kleinere Seite will.</span></div>`:""}
        <div class="ctrl">${T.an.open?`<button class="pri" id="bClose">Auswerten</button><button id="bPeek">${T.peek?"Zahlen verbergen":"Zahlen live zeigen"}</button>`:""}</div>`:`<p class="muted" style="margin-top:12px">Tippe einen Preis an. Alle Handys fragen dann: Kaufst du – verkaufst du – zu diesem Preis?</p>`}
      </div>
      ${rows.length?`<table class="mt" style="margin-top:14px"><tr><th>Preis je Tüte</th><th style="color:var(--kauf)">Nachfrage</th><th style="color:var(--verk)">Angebot</th><th>umsetzbare Menge</th><th>Ergebnis</th></tr>
        ${rows.map(r=>`<tr class="${r===maxEqRow&&r.N===r.A&&r.N>0?"eq":""} ${r.p===T.an.p?"cur":""}"><td><b>${eur(r.p)}</b></td><td>${r.N}</td><td>${r.A}</td><td><b>${Math.min(r.N,r.A)}</b></td><td>${r.N===r.A&&r.N>0?"Gleichgewicht":r.N>r.A?"Nachfrageüberhang "+(r.N-r.A):r.A>r.N?"Angebotsüberhang "+(r.A-r.N):"–"}</td></tr>`).join("")}</table>`:""}
    </div><div>
      ${chartSVG({rows,maxQ:Math.max(nK,nV),maxP:shock?450:400,cards:T.curves?cards:null,old:shock&&T.curves?cardsFor("n"):null,eq:showEq?eq:null})}
      <div class="ctrl"><button id="bCurve">${T.curves?"Kurven ausblenden":"Kurven aus allen Karten zeichnen"}</button></div>
      ${showEq?`<div class="banner ok"><b>Gleichgewichtspreis ${eur(eq.p)} · Gleichgewichtsmenge ${eq.q} Tüten</b>
        <span class="satz">Satzbaustein: „Der Gleichgewichtspreis liegt bei ${eur(eq.p)}, weil hier Angebot und Nachfrage gleich groß sind. Es werden ${eq.q} Tüten gehandelt – so viele wie bei keinem anderen Preis.“</span>
        ${!shock&&T.deals.length?`<span class="satz">Und beim Handeln? Durchschnitt der letzten Runde: <b>${eur(Math.round(T.deals.filter(d=>d.r===T.round).reduce((a,d)=>a+d.pr,0)/Math.max(1,T.deals.filter(d=>d.r===T.round).length)))}</b></span>`:""}</div>`:""}
    </div></div>`;}
  function bindAnsage(M){
    M.querySelectorAll(".pchips button").forEach(b=>b.onclick=()=>{const p=+b.dataset.p;T.an={st:stageKey(),p,open:true};T.peek=false;T.ans[ansKey()]={};save();pub();render();});
    if($("bClose"))$("bClose").onclick=()=>{T.an.open=false;save();pub();render();};
    if($("bPeek"))$("bPeek").onclick=()=>{T.peek=!T.peek;render();};
    $("bCurve").onclick=()=>{T.curves=!T.curves;save();render();};
  }
  function rAnsage(M){
    M.innerHTML=ansageBlock(`<h2 class="big">Preisansage: Wer handelt zu diesem Preis?</h2>`)+
      `<div class="ctrl"><button class="pri" id="bNext">Weiter: Schock →</button></div>`;
    bindAnsage(M);$("bNext").onclick=()=>go(3);
  }

  /* ---------- 3 Schock ---------- */
  function rShock(M){
    if(T.s3===0||T.shock<0){
      M.innerHTML=`<h2 class="big">Plötzlich ändert sich etwas auf dem Popcorn-Markt …</h2><p class="muted">Wähle ein Ereignis. Die Karten der Betroffenen ändern sich dann.</p>
        <div class="two">${SHOCKS.map((S,i)=>`<button class="scen" data-i="${i}"><b>${h(S.t)}</b>${h(S.x)}${T.done3.includes(i)?` <span class="pro">schon gespielt</span>`:""}</button>`).join("")}</div>
        <div class="ctrl"><button id="bSkip">Überspringen: Merken →</button></div>`;
      M.querySelectorAll(".scen").forEach(b=>b.onclick=()=>{T.shock=+b.dataset.i;T.s3=1;T.curves=false;T.an={st:"s"+T.shock,p:-1,open:false};save();pub();render();});
      $("bSkip").onclick=()=>go(4);return;}
    const S=SHOCKS[T.shock],P=T.pred[T.shock]||{},cnt=[0,0,0];for(const id in P)cnt[P[id]]++;
    const head=`<div class="banner info"><b>${h(S.t)}:</b> ${h(S.x)}</div>`;
    if(T.s3===1){
      M.innerHTML=head+`<h2 class="big" style="margin-top:16px">Was passiert mit dem Preis? Stimmt am Handy ab!</h2>
        <div class="three">${PRED.map((t,i)=>`<div class="box"><h3>${t}</h3><div class="clock">${cnt[i]}</div></div>`).join("")}</div>
        <div class="ctrl"><button class="pri" id="bTest">Prüfen: Preisansage zum alten Preis 2,00 € →</button></div>`;
      $("bTest").onclick=()=>{T.s3=2;T.an={st:"s"+T.shock,p:200,open:true};T.peek=false;T.ans[ansKey()]={};save();pub();render();};return;}
    if(T.s3===2){
      M.innerHTML=ansageBlock(head)+`<div class="ctrl"><button class="pri" id="bSolve">Auflösen →</button></div>`;
      bindAnsage(M);$("bSolve").onclick=()=>{T.s3=3;T.curves=true;T.an.open=false;if(!T.done3.includes(T.shock))T.done3.push(T.shock);save();pub();render();};return;}
    const e0=equilibrium(cardsFor("n")),e1=equilibrium(cardsFor("s"+T.shock)),right=S.dir>0?0:1;
    M.innerHTML=head+`<div class="two" style="margin-top:14px"><div>
      <div class="merk" style="font-size:1.2rem"><b>${h(S.w)}</b><br>Beim alten Preis ${e0?eur(e0.p):"2,00 €"} entsteht ein <span class="term">${S.dir>0?"Nachfrageüberhang":"Angebotsüberhang"}</span>.<br>
        → Der Preis ${S.dir>0?"steigt":"sinkt"}${e1?` auf ${eur(e1.p)}. Neue Gleichgewichtsmenge: ${e1.q} Tüten (vorher ${e0?e0.q:"?"})`:" so stark, dass kein Handel mehr zustande kommt (zu wenige Karten in dieser Gruppe)"}.</div>
      <div class="merk" style="font-size:1.2rem">Das ist ein <span class="term">${S.m}</span>: ${S.m==="Käufermarkt"?"Das Angebot ist größer als die Nachfrage. Die Käufer sind in der starken Position, die Preise fallen.":"Die Nachfrage ist größer als das Angebot. Die Verkäufer sind in der starken Position, die Preise steigen."}</div>
      <p>Eure Vermutung: <b>${cnt[right]}</b> von ${cnt[0]+cnt[1]+cnt[2]} lagen richtig.</p>
      <p class="muted">Gestrichelt: die Kurven vor dem Ereignis. Durchgezogen: danach.</p></div>
      <div>${chartSVG({rows:rowsFor("s"+T.shock),maxQ:Math.max(...["K","V"].map(r=>cardsFor("n").filter(c=>c.r===r).length)),maxP:450,cards:cardsFor("s"+T.shock),old:cardsFor("n"),eq:e1})}</div></div>
      <div class="ctrl"><button id="bAgain">Anderes Ereignis</button><button class="pri" id="bNext">Weiter: Merken →</button></div>`;
    $("bAgain").onclick=()=>{T.s3=0;T.shock=-1;T.curves=false;save();pub();render();};$("bNext").onclick=()=>go(4);
  }

  /* ---------- 4 Merken ---------- */
  function rMerk(M){
    M.innerHTML=`<h2 class="big">Das merken wir uns</h2><div class="two"><div>${MERK}</div><div>${chartSVG({rows:[],maxQ:Math.max(4,...["K","V"].map(r=>cardsFor("n").filter(c=>c.r===r).length)),maxP:400,cards:cardsFor("n"),eq:equilibrium(cardsFor("n"))})}
      <p class="muted">Weiter im Arbeitsblatt: Aufgabe 3 (Vorgemacht) und Aufgabe 4 (Erdbeeren).</p></div></div>
      <div class="ctrl"><button class="pri" id="bNext">Weiter: Prüfungs-Check →</button></div>`;
    $("bNext").onclick=()=>go(5);
  }

  /* ---------- 5 Prüfungs-Check ---------- */
  function rQuiz(M){
    if(T.q<0){M.innerHTML=`<h2 class="big">Prüfungs-Check</h2><p style="font-size:1.25rem">${QUIZ.length} Fragen im Stil der IHK-Prüfung, die letzten beiden für Profis <span class="pro">Profi</span>. Richtig ist wichtiger als schnell.</p>
      <div class="ctrl"><button class="pri" id="bQ">Erste Frage →</button></div>`;$("bQ").onclick=()=>openQ(0);return;}
    const Q=QUIZ[T.q],A=T.qAns[T.q]||{},cnt=Q.o.map((_,i)=>Object.values(A).filter(a=>a.c===i).length),n=Object.keys(A).length,dur=Q.pro?DURPRO:DUR;
    M.innerHTML=`<div class="qhead"><div><p class="muted">Frage ${T.q+1} von ${QUIZ.length}${Q.pro?' <span class="pro">Profi</span>':""} · ${n} von ${players().length} geantwortet</p><h2 class="big">${h(Q.q)}</h2></div>
      ${T.qOpen?`<div class="timer" id="tm">${dur}</div>`:""}</div>
      ${Q.g?graphX():""}${Q.tab?qTab(Q.tab):""}
      <div class="opts">${Q.o.map((o,i)=>`<div class="opt o${i} ${!T.qOpen&&i!==Q.k?"wrong":""}">${"ABCDE"[i]}: ${h(o)}${T.qOpen?"":`<span class="cnt">${cnt[i]}</span>`}</div>`).join("")}</div>
      ${T.qOpen?"":`<div class="merk" style="font-size:1.15rem;margin-top:14px">${h(Q.x)}</div>`}
      <div class="ctrl">${T.qOpen?`<button class="pri" id="bR">Auflösen</button>`:T.q<QUIZ.length-1?`<button class="pri" id="bN">Nächste Frage →</button>`:""}<button id="bW">Zur Siegerehrung</button></div>`;
    if($("bR"))$("bR").onclick=()=>{T.qOpen=false;save();pub();render();};
    if($("bN"))$("bN").onclick=()=>openQ(T.q+1);
    $("bW").onclick=()=>{T.qOpen=false;go(6);};
    if(T.qOpen){clearInterval(window._qt);window._qt=setInterval(()=>{const s=Math.max(0,Math.ceil(dur-(Date.now()-T.qStart)/1000));if($("tm"))$("tm").textContent=s;
      if(s<=0&&T.qOpen){T.qOpen=false;save();pub();render();}if(!T.qOpen)clearInterval(window._qt);},250);}
  }
  function openQ(i){T.q=i;T.qOpen=true;T.qStart=Date.now();save();pub();render();}

  /* ---------- 6 Sieger ---------- */
  function rWin(M){
    const r=ranking(),tr=traders();
    M.innerHTML=`<h2 class="big">Siegerehrung</h2><div class="two"><div><h3>Prüfungs-Check</h3>
      <div class="podium">${[1,0,2].filter(i=>r[i]).map(i=>`<div style="height:${[190,150,120][i]}px"><span>${i+1}.</span>${h(r[i].n)}<br>${r[i].s}</div>`).join("")}</div>
      <ol class="top" style="margin-top:14px">${r.slice(3,10).map((x,i)=>`<li><span>${i+4}. ${h(x.n)}</span><b>${x.s}</b></li>`).join("")}</ol></div>
      <div><h3>Beste Händler an der Popcorn-Börse</h3><ol class="top">${tr.slice(0,5).map((x,i)=>`<li><span>${i+1}. <span class="chip ${x.r==="K"?"k":"v"}">${x.r==="K"?"Käufer":"Verkäufer"}</span>${h(x.n)}</span><b>+${eur(x.s)}</b></li>`).join("")}</ol>
      <p class="muted">Vorteil = beim Käufer: Höchstpreis minus gezahlter Preis · beim Verkäufer: Preis minus Mindestpreis.</p></div></div>`;
  }
  render();
}
</script>
<script>
/* =========================================================
   HANDY (Schülerinnen und Schüler)
   ========================================================= */
function phoneApp(){
  $("phone").hidden=false;
  const KEY="popcorn_p_"+roomCode+(params.get("t")||"");
  let me=store(KEY)||{};if(!me.pid){me.pid=rnd(8);store(KEY,me);}
  let S=null,lastKey="",pending=null,qEnd=0,rEnd=0,qSel={},ySel={},pSel={},wSel={},draft={b:"",pr:null},conn={up:0};
  const net=new Net((t,p)=>{if(t===NS+roomCode+"/st"&&p&&typeof p==="object")onState(p);},c=>{conn=c;if(c.up)hello();});
  net.sub(roomCode+"/st");
  const send=o=>{o.p=me.pid;net.pub(roomCode+"/in",o,false);};
  function hello(){if(me.nick)send({k:"hi",n:me.nick});}
  setInterval(()=>{if(!S)return;
    if(me.nick&&!(S.j||[]).includes(me.pid))hello();
    else if(pending&&pending.done&&!pending.done())send(pending.msg);},2500);
  setInterval(()=>{const el=$("prc");if(el&&S&&S.rOpen){const s=Math.max(0,Math.ceil((rEnd-Date.now())/1000));el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}},500);
  function onState(p){
    if(p.rOpen&&(!S||!S.rOpen||S.round!==p.round))rEnd=Date.now()+p.rem*1000;
    if(p.qOpen&&(!S||!S.qOpen||S.q!==p.q))qEnd=Date.now()+p.rem*1000;
    S=p;
    if((S.kick||[]).includes(me.pid)&&me.nick){me={pid:rnd(8)};store(KEY,me);lastKey="";}
    render();
  }
  const mine=()=>(S&&S.pp&&S.pp[me.pid])||null;
  function keyOf(){if(!me.nick)return "join";if(!S)return "wait";const m=mine();
    return JSON.stringify([S.ph,S.dealt,S.round,S.rOpen,m,S.an,S.yd.includes(me.pid),S.res,S.shock,S.s3,S.pd.includes(me.pid),(S.wy||[]).includes(me.pid),
      S.q,S.qOpen,(S.ans||[]).includes(me.pid),S.ph>=5&&S.sc?S.sc[me.pid]:0,m&&m.r==="B"&&S.ph===1?S.dl:0,S.eq1]);}
  function cardHtml(m,v,note){
    if(!m||!m.r)return `<div class="card B"><div class="role">Noch keine Karte</div>Gleich verteilt die Lehrkraft die Karten.</div>`;
    if(m.r==="B")return `<div class="card B"><div class="role">Marktbeobachter</div><div class="cd">Du handelst nicht. Du beobachtest den Markt wie eine Reporterin oder ein Reporter.</div></div>`;
    const val=v==null?m.v:v;
    return `<div class="card ${m.r}"><div class="role">${m.r==="K"?"Käufer":"Verkäufer"}</div>
      <div>${m.r==="K"?"Ich zahle höchstens":"Ich verkaufe für mindestens"}</div><div class="val">${eur(val)}</div>${note||""}
      ${m.r==="K"&&S.ph===1?`<div class="cd">Dein Code: <b>${m.c}</b><br><small>Sag ihn dem Verkäufer, wenn ihr euch einig seid.</small></div>`:""}</div>`;}
  function render(){const k=keyOf();if(k===lastKey)return;lastKey=k;const P=$("phone");
    const top=`<div class="ph-top"><span>Popcorn-Börse · ${roomCode}</span><span>${h(me.nick||"")}${S&&mine()?` · +${eur(mine().pts||0)}`:""}</span></div>`;
    if(!me.nick){P.innerHTML=top+`<h2>Willkommen an der Popcorn-Börse!</h2><p>Gib einen Spitznamen ein.</p>
      <input id="nk" maxlength="16" placeholder="Spitzname" autocomplete="off"><div style="height:10px"></div><button class="pri" id="bJ" style="width:100%">Mitmachen</button>`;
      $("bJ").onclick=()=>{const n=clean($("nk").value,16);if(!n)return;me.nick=n;store(KEY,me);hello();lastKey="";render();};return;}
    if(!S){P.innerHTML=top+`<p>Verbinde mit der Tafel …</p>`;return;}
    const m=mine();
    if(S.ph===0){P.innerHTML=top+`<h2>Du bist drin!</h2><p>Warte, bis es an der Tafel losgeht.</p>`;return;}
    if(S.ph===1)return rTrade(P,top,m);
    if(S.ph===2)return rAns(P,top,m,`<h2>Preisansage</h2>`);
    if(S.ph===3)return rShock(P,top,m);
    if(S.ph===4){P.innerHTML=top+`<h2>Das merken wir uns</h2>${MERK}`;return;}
    if(S.ph===5)return rQuiz(P,top);
    const sc=(S.sc&&S.sc[me.pid])||[0,"–",0];
    P.innerHTML=top+`<h2>Geschafft!</h2><div class="box"><div class="bigpts">Platz ${sc[1]}</div>${sc[0]} Punkte im Prüfungs-Check · ${S.np||"?"} haben mitgespielt</div>
      ${m&&m.r!=="B"?`<p>An der Börse hast du <b>+${eur(m.pts||0)}</b> Vorteil erhandelt.</p>`:""}<p>Danke fürs Mitmachen!</p>`;
  }

  /* ---------- 1 Handeln ---------- */
  function rTrade(P,top,m){
    if(!S.dealt||!m||!m.r){P.innerHTML=top+cardHtml(m)+`<p>Gleich bekommst du deine geheime Karte. Zeig sie niemandem!</p>`;return;}
    if(m.r==="B"){P.innerHTML=top+cardHtml(m)+(S.rOpen?`<p><b>Runde ${S.round} läuft – <span id="prc"></span></b></p>`:"")+
      `<p>Abschlüsse dieser Runde:</p><p>${(S.dl||[]).slice().sort((a,b)=>a-b).map(p=>`<span class="chip k">${eur(p)}</span>`).join("")||"noch keine"}</p>
      <div class="merk">Dein Auftrag: Welcher Preis kommt am häufigsten vor? Wird es von Runde zu Runde ähnlicher? Du berichtest gleich der Klasse.</div>`;return;}
    if(!S.rOpen&&S.round===0){P.innerHTML=top+cardHtml(m)+`<p><b>Zeig deine Karte niemandem!</b></p>
      <div class="merk">${m.r==="K"?"Du willst möglichst <b>billig</b> kaufen. Mehr als auf der Karte darfst du nie zahlen.":"Du willst möglichst <b>teuer</b> verkaufen. Billiger als auf der Karte darfst du nie verkaufen."}</div>
      <p class="muted">Warte auf den Start von Runde 1.</p>`;return;}
    if(!S.rOpen){
      if(m.d!=null){P.innerHTML=top+cardHtml(m)+`<div class="status ok">Runde ${S.round}: Abschluss für <b>${eur(m.d)}</b>.</div><p class="muted">Warte auf die nächste Runde oder schau an die Tafel.</p>`;return;}
      const sent=(S.wy||[]).includes(me.pid),sel=wSel[S.round];
      P.innerHTML=top+cardHtml(m)+`<div class="status bad">Runde ${S.round}: kein Abschluss.</div><p><b>Warum nicht?</b> Tippe an.</p>
        ${WHY[m.r].map((t,i)=>`<button class="pbtn ${sel===i?"sel":""}" data-i="${i}">${t}</button>`).join("")}${sent?`<div class="status ok">Angekommen ✓</div>`:""}`;
      P.querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,r=S.round;wSel[r]=i;pending={msg:{k:"w",r,c:i},done:()=>!S||S.round!==r||S.rOpen||(S.wy||[]).includes(me.pid)};send(pending.msg);lastKey="";render();});return;}
    const head=top+`<p><b>Runde ${S.round} läuft – <span id="prc"></span></b></p>`+cardHtml(m);
    if(m.d!=null){const adv=m.r==="K"?m.v-m.d:m.d-m.v;
      P.innerHTML=head+`<div class="status ok"><b>Abschluss!</b> ${m.r==="K"?"Gekauft":"Verkauft"} für <b>${eur(m.d)}</b>. Dein Vorteil: <b>+${eur(adv)}</b></div><p>Setz dich hin und warte auf die nächste Runde.</p>`;return;}
    if(m.r==="K"){
      if(m.o){const ok=m.o.pr<=m.v;
        P.innerHTML=head+`<div class="box"><h2>${h(m.o.sn)} will dir Popcorn verkaufen</h2><div class="ansage">${eur(m.o.pr)}</div>
          ${ok?"":`<div class="status bad">Zu teuer! Das ist mehr als dein Höchstpreis.</div>`}
          <div class="yn"><button class="y" id="bY" ${ok?"":"disabled"}>Ja, Abschluss</button><button class="n" id="bN">Nein</button></div></div>`;
        $("bY").onclick=()=>{send({k:"c",id:m.o.id,ok:true});$("bY").textContent="Gesendet …";};
        $("bN").onclick=()=>{send({k:"c",id:m.o.id,ok:false});$("bN").textContent="Gesendet …";};return;}
      P.innerHTML=head+`<div class="merk">Geh herum und verhandle. Seid ihr euch einig, sagst du dem Verkäufer deinen Code. Dann bestätigst du hier.</div>`;return;}
    /* Verkäufer */
    if(draft.pr==null||draft.pr<m.v)draft.pr=m.v;
    const waiting=m.st&&m.st.startsWith("Warte");
    P.innerHTML=head+`<div class="box"><b>Einig geworden?</b> Trag den Abschluss ein.
      <label style="display:block;margin-top:8px">Code des Käufers<input id="bc" inputmode="numeric" maxlength="2" value="${h(draft.b)}" placeholder="z. B. 47" ${waiting?"disabled":""}></label>
      <div style="margin-top:8px">Preis je Tüte</div>
      <div class="step"><button data-d="-50">−50</button><button data-d="-10">−10</button><div class="pv" id="pv">${eur(draft.pr)}</div><button data-d="10">+10</button><button data-d="50">+50</button></div>
      <button class="pri" id="bS" style="width:100%" ${waiting?"disabled":""}>Abschluss senden</button>
      ${m.st?`<div class="status ${waiting?"":"bad"}">${h(m.st)}</div>`:""}
      ${waiting?`<button id="bX" style="width:100%;margin-top:8px">Zurückziehen</button>`:""}</div>
      <p class="muted">Billiger als ${eur(m.v)} geht nicht – das ist dein Mindestpreis.</p>`;
    $("bc").oninput=e=>{draft.b=e.target.value.replace(/\D/g,"").slice(0,2);};
    P.querySelectorAll(".step button").forEach(b=>b.onclick=()=>{draft.pr=Math.min(600,Math.max(m.v,draft.pr+ +b.dataset.d));$("pv").textContent=eur(draft.pr);});
    $("bS").onclick=()=>{const b=parseInt(draft.b,10);if(!(b>=10&&b<=99)){$("bc").focus();return;}send({k:"o",b,pr:draft.pr});$("bS").textContent="Gesendet …";};
    if($("bX"))$("bX").onclick=()=>send({k:"o",b:null});
  }

  /* ---------- 2/3 Preisansage ---------- */
  function rAns(P,top,m,head,note){
    const A=S.an;
    if(A.p<0){P.innerHTML=top+head+cardHtml(m,m&&m.v2,note)+`<p>Gleich ruft die Lehrkraft einen Preis aus.</p>`;return;}
    const key=A.st+":"+A.p,my=ySel[key],v=m&&m.v2;
    if(!m||m.r==="B"||!m.r){P.innerHTML=top+head+`<div class="ansage">${eur(A.p)}</div>`+cardHtml(m)+`<div class="merk">Schätze: Sagen mehr Käufer oder mehr Verkäufer Ja? Vergleiche dann mit der Tafel.</div>`;return;}
    if(A.open){const ans=S.yd.includes(me.pid);
      P.innerHTML=top+head+`<div class="ansage">${eur(A.p)}</div>`+cardHtml(m,v,note)+
        `<p><b>${m.r==="K"?"Kaufst du zu diesem Preis?":"Verkaufst du zu diesem Preis?"}</b> Schau auf deine Karte.</p>
        <div class="yn"><button class="y ${my===true?"sel":""}" data-y="1">${m.r==="K"?"Ja, ich kaufe":"Ja, ich verkaufe"}</button><button class="n ${my===false?"sel":""}" data-y="0">${m.r==="K"?"Nein, zu teuer":"Nein, zu billig"}</button></div>
        ${ans?`<div class="status ok">Gespeichert ✓ Schau an die Tafel.</div>`:""}`;
      P.querySelectorAll(".yn button").forEach(b=>b.onclick=()=>{const y=b.dataset.y==="1";ySel[key]=y;pending={msg:{k:"y",key,y},done:()=>!S.an.open||S.an.st+":"+S.an.p!==key||S.yd.includes(me.pid)};send(pending.msg);lastKey="";render();});return;}
    const R=S.res,ok=my==null?null:(m.r==="K"?(v>=A.p)===my:(v<=A.p)===my);
    const vd=R?verdict(A.p,R.N,R.A):null;
    P.innerHTML=top+head+`<div class="ansage">${eur(A.p)}</div>`+
      (vd?`<div class="banner ${vd.c}"><b>${vd.t}</b><span class="satz">${vd.s}</span></div>`:"")+
      (ok===false?`<div class="status bad">Schau noch einmal auf deine Karte: ${m.r==="K"?`Du zahlst höchstens ${eur(v)}.`:`Du verkaufst für mindestens ${eur(v)}.`}</div>`:"")+
      `<p class="muted">Warte auf den nächsten Preis.</p>`;
  }

  /* ---------- 3 Schock ---------- */
  function rShock(P,top,m){
    if(S.shock<0||S.s3===0){P.innerHTML=top+`<h2>Achtung …</h2><p>Gleich passiert etwas auf dem Popcorn-Markt. Schau an die Tafel.</p>`;return;}
    const Sh=SHOCKS[S.shock],head=`<div class="banner info"><b>${h(Sh.t)}:</b> ${h(Sh.x)}</div>`;
    const changed=m&&m.r===Sh.r&&m.v2!==m.v;
    const note=m&&(m.r==="K"||m.r==="V")?`<div class="cd">${changed?`<strong>Deine Karte hat sich geändert!</strong> Vorher: ${eur(m.v)}`:"Deine Karte bleibt gleich."}</div>`:"";
    if(S.s3===1){const sent=S.pd.includes(me.pid),sel=pSel[S.shock];
      P.innerHTML=top+head+cardHtml(m,m&&m.v2,note)+`<p><b>Was passiert mit dem Preis?</b> Vermute!</p>
        ${PRED.map((t,i)=>`<button class="pbtn ${sel===i?"sel":""}" data-i="${i}">${t}</button>`).join("")}${sent?`<div class="status ok">Angekommen ✓</div>`:""}`;
      P.querySelectorAll(".pbtn").forEach(b=>b.onclick=()=>{const i=+b.dataset.i,s=S.shock;pSel[s]=i;pending={msg:{k:"pr",s,c:i},done:()=>S.shock!==s||S.s3!==1||S.pd.includes(me.pid)};send(pending.msg);lastKey="";render();});return;}
    if(S.s3===2)return rAns(P,top,m,head,note);
    const right=Sh.dir>0?0:1,sel=pSel[S.shock];
    P.innerHTML=top+head+`${sel!=null?`<div class="status ${sel===right?"ok":"bad"}">${sel===right?"Deine Vermutung war richtig!":"Deine Vermutung war: "+PRED[sel]}</div>`:""}
      <div class="merk"><b>${h(Sh.w)}</b> Beim alten Preis entsteht ein <span class="term">${Sh.dir>0?"Nachfrageüberhang":"Angebotsüberhang"}</span> → der Preis ${Sh.dir>0?"steigt":"sinkt"}${S.eq1?` auf <b>${eur(S.eq1.p)}</b>`:""}.</div>
      <div class="merk">Das ist ein <span class="term">${Sh.m}</span>: ${Sh.m==="Käufermarkt"?"Angebot größer als Nachfrage, die Preise fallen.":"Nachfrage größer als Angebot, die Preise steigen."}</div>
      <details><summary>Profi-Frage</summary><p>Erkläre mit den Fachbegriffen, warum sich auch die gehandelte Menge verändert${S.eq0&&S.eq1?` (vorher ${S.eq0.q}, jetzt ${S.eq1.q} Tüten)`:""}.</p></details>`;
  }

  /* ---------- 5 Prüfungs-Check ---------- */
  function rQuiz(P,top){
    const sc=(S.sc&&S.sc[me.pid])||[0,"–",0];
    if(S.q<0){P.innerHTML=top+`<h2>Prüfungs-Check</h2><p>Gleich geht es los. Lies jede Frage genau. Richtig ist wichtiger als schnell!</p>`;return;}
    const Q=QUIZ[S.q],answered=(S.ans||[]).includes(me.pid),extra=(Q.g?graphX():"")+(Q.tab?qTab(Q.tab):"");
    if(S.qOpen){
      if(answered||qSel[S.q]!=null){P.innerHTML=top+`<p class="muted">Frage ${S.q+1}</p><h2>${h(Q.q)}</h2><div class="status ${answered?"ok":""}">${answered?"Antwort gespeichert ✓":"Wird gesendet …"} Warte auf die Auflösung.</div>
        ${Q.pz?`<div class="merk"><b>Profi-Zusatz:</b> ${h(Q.pz)}</div>`:""}`;return;}
      P.innerHTML=top+`<div class="row" style="justify-content:space-between"><span class="muted">Frage ${S.q+1} von ${QUIZ.length}${Q.pro?' <span class="pro">Profi</span>':""}</span><b id="ptm"></b></div><h2>${h(Q.q)}</h2>${extra}
        ${Q.o.map((o,i)=>`<button class="popt o${i}" data-i="${i}">${"ABCDE"[i]}: ${h(o)}</button>`).join("")}`;
      P.querySelectorAll(".popt").forEach(b=>b.onclick=()=>{const q=S.q;qSel[q]=+b.dataset.i;pending={msg:{k:"a",q,c:+b.dataset.i},done:()=>S.q!==q||!S.qOpen||(S.ans||[]).includes(me.pid)};send(pending.msg);lastKey="";render();});
      const t=()=>{const s=Math.max(0,Math.ceil((qEnd-Date.now())/1000));if($("ptm"))$("ptm").textContent=s+" s";};t();clearInterval(window._pt);window._pt=setInterval(t,250);return;}
    const my=qSel[S.q],ok=my===Q.k;
    P.innerHTML=top+`<p class="muted">Frage ${S.q+1} von ${QUIZ.length}</p>
      <div class="status ${my==null?"":ok?"ok":"bad"}">${my==null?"Keine Antwort.":ok?"<b>Richtig!</b> +"+sc[2]+" Punkte":"<b>Leider falsch.</b>"}</div>
      <p><b>Richtig: ${h(Q.o[Q.k])}</b><br>${h(Q.x)}</p>
      <div class="box"><div class="bigpts">${sc[0]} Punkte</div>Platz ${sc[1]} von ${S.np||"?"}</div>`;
  }
  render();
}
const roomCode=(params.get("s")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,8);
if(roomCode)phoneApp();else tafelApp();
</script>
<script>
/* =========================================================
   QUIZ-MUSIK v2 (Skill live-klassen-app) – eigene Kompositionen, live per WebAudio erzeugt,
   keine Musikdatei, keine Rechte Dritter. Jede Abfrage bekommt ein ANDERES Stück aus dem Pool
   (gemischt, nie zweimal hintereinander). Läuft nur auf der Tafel.
   Ablauf: Loop während der Frage · letzte 10 s schneller · Ticks in den letzten 5 s · Jingle beim Auflösen · Fanfare beim Sieger
   ========================================================= */
const MUSIK_POOL=[
  {name:"Spannung",bpm:124,fast:156,bass:[45,45,41,40],ch:[[69,72,76],[69,72,76],[65,69,72],[64,68,71]],ap:[0,1,2,1,0,2,1,2],arp:"square",kick:[0,4,8,12],snare:[4,12],hat:"off"},
  {name:"Funk",bpm:104,fast:132,swing:.16,bass:[40,40,43,45],bp:[0,3,6,8,10,11,14],bt:"sawtooth",ch:[[64,67,71,74],[64,67,71,74],[67,71,74,77],[69,72,76,79]],ap:[0,2,1,3],as:[2,6,10,13],ad:.07,arp:"sawtooth",kick:[0,6,8],snare:[4,12],hat:"all"},
  {name:"Marimba",bpm:116,fast:144,bass:[48,45,41,43],ch:[[72,76,79],[69,72,76],[65,69,72],[67,71,74]],ap:[0,1,2,1,2,1,0,1],ad:.22,arp:"sine",oct:1,kick:[0,8],snare:[],hat:"none",cl:[3,11]},
  {name:"Chiptune",bpm:144,fast:176,bass:[43,43,40,38],bt:"square",ch:[[67,71,74],[67,71,74],[64,67,71],[62,66,69]],ap:[0,1,2,3,2,1],arp:"square",oct:1,ad:.06,kick:[0,8],snare:[4,12],hat:"none"},
  {name:"Latin",bpm:112,fast:140,bass:[38,38,43,45],bp:[0,3,8,11],ch:[[62,65,69],[62,65,69],[67,70,74],[69,73,76]],ap:[0,2,1,2],as:[0,2,3,6,8,10,11,14],arp:"triangle",kick:[0,6,8,14],snare:[],hat:"off",cl:[0,3,6,10,12]},
  {name:"Jazz",bpm:132,fast:164,swing:.3,walk:1,bass:[41,38,43,36],bp:[0,4,8,12],ch:[[65,69,72,76],[62,65,69,72],[67,70,74,77],[60,64,67,70]],ap:[0,2,1,3],as:[0,6,10],ad:.18,arp:"triangle",kick:[],snare:[],hat:"jazz"},
  {name:"Synthwave",bpm:100,fast:128,bass:[47,43,38,45],bp:[0,2,4,6,8,10,12,14],bt:"sawtooth",ch:[[71,74,78],[67,71,74],[62,66,69],[69,73,76]],ap:[0,1,2,1],arp:"sawtooth",ad:.14,kick:[0,4,8,12],snare:[4,12],hat:"all"},
  {name:"Detektiv",bpm:92,fast:120,bass:[37,37,42,44],bp:[0,3,8,10],ch:[[61,64,68],[61,64,68],[66,69,73],[68,72,75]],ap:[0,1,2,1,2,0],as:[0,2,4,7,8,10,12,15],ad:.12,arp:"triangle",kick:[0],snare:[8],hat:"off"}
];
const Music=(()=>{
  const ls=(k,v)=>{try{if(v===undefined){const x=localStorage.getItem(k);return x==null?null:JSON.parse(x);}localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}};
  let ctx=null,master=null,timer=null,next=0,step=0,fast=false,nbuf=null,on=ls("quizmusik")!==false;
  let order=[],last=-1,S=MUSIK_POOL[0];
  const mf=m=>440*Math.pow(2,(m-69)/12),AV={square:.04,sawtooth:.03,triangle:.08,sine:.1};
  function pick(){if(!order.length){order=MUSIK_POOL.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
      if(order[0]===last&&order.length>1)order.push(order.shift());}
    last=order.shift();S=MUSIK_POOL[last];return last;}
  function init(){try{if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();
      master=ctx.createGain();master.gain.value=.24;master.connect(ctx.destination);}
    if(ctx.state==="suspended")ctx.resume();return true;}catch(e){return false;}}
  function tone(f,t,d,type,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05);}
  function noise(t,d,v,hp){if(!nbuf){nbuf=ctx.createBuffer(1,ctx.sampleRate*.3,ctx.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
    const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=nbuf;f.type="highpass";f.frequency.value=hp;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.02);}
  function kick(t){const o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.13);
    g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(master);o.start(t);o.stop(t+.2);}
  function play(st,t){const bar=Math.floor(st/16)%S.bass.length,s=st%16,ch=S.ch[bar%S.ch.length];
    const bp=S.bp||[0,2,4,6,8,10,12,14];
    if(bp.includes(s)){const off=S.walk?[0,4,7,9][Math.floor(s/4)%4]:(s%4===0?0:12);tone(mf(S.bass[bar]+off),t,S.walk?.3:.16,S.bt||"triangle",S.bt==="sawtooth"?.12:S.bt==="square"?.1:.32);}
    if(!S.as||S.as.includes(s))tone(mf(ch[S.ap[s%S.ap.length]%ch.length]+12*(S.oct||0)+(fast?12:0)),t,S.ad||.09,S.arp,AV[S.arp]||.05);
    if(S.kick.includes(s))kick(t);
    if(S.snare.includes(s))noise(t,.12,.25,1800);
    if(S.cl&&S.cl.includes(s))tone(1250,t,.04,"sine",.18);
    const hat=S.hat;
    if(hat==="all"||fast||(hat==="off"&&s%2===1)||(hat==="jazz"&&(s%4===0||s%8===6)))noise(t,.03,.07,7000);}
  function sched(){const d=60/(fast?S.fast:S.bpm)/4;
    if(next<ctx.currentTime-.05)next=ctx.currentTime+.02;
    while(next<ctx.currentTime+.12){play(step,next+(step%2?d*(S.swing||0):0));next+=d;step++;}}
  const root=()=>S.ch[0][0]%12+60;
  return {
    pool:MUSIK_POOL,
    current(){return S.name;},
    unlock(){if(on)init();},
    isOn(){return on;},
    toggle(){on=!on;ls("quizmusik",on);if(!on)this.stop();return on;},
    start(){if(!on||timer||!init())return;pick();fast=false;step=0;next=ctx.currentTime+.06;timer=setInterval(sched,25);
      try{console.log("[Quiz-Musik] Stück",last,S.name);}catch(e){}},
    hurry(){fast=true;},
    tick(){if(!on||!init())return;tone(1760,ctx.currentTime,.06,"sine",.25);},
    stop(){clearInterval(timer);timer=null;fast=false;},
    reveal(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.03,r=root();
      [0,4,7].forEach((m,i)=>tone(mf(r+m),t+i*.09,.25,"square",.08));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+.3,.9,"triangle",.14));kick(t+.3);noise(t+.3,.25,.25,3000);},
    fanfare(){this.stop();if(!on||!init())return;const t=ctx.currentTime+.05,r=60;
      [[-5,0],[0,.15],[4,.3],[7,.45],[4,.7],[7,.85]].forEach(([m,d])=>tone(mf(r+m),t+d,.22,"square",.09));
      [0,4,7,12].forEach(m=>tone(mf(r+m),t+1.05,1.6,"triangle",.15));[0,.45,1.05].forEach(d=>kick(t+d));noise(t+1.05,.5,.3,2500);}
  };})();
/* Quiz-Musik automatisch an die Tafel koppeln: Timer #tm sichtbar = Abfrage läuft (Quiz, Prüfungs-Check, Abstimmung) */
(function MusicAuto(){
  if(new URLSearchParams(location.search).get("s"))return;
  const tf=document.getElementById("tafel"),st=document.getElementById("steps");
  let was=false,lastS=-1,pod=false;
  function btn(){if(!st||document.getElementById("bMus"))return;const b=document.createElement("button");b.id="bMus";b.type="button";
    b.title="Quiz-Musik an oder aus";b.style.cssText="padding:.25em .7em;font-weight:700;border-radius:999px;white-space:nowrap";
    b.onclick=()=>{Music.toggle();if(Music.isOn()&&was)Music.start();lab();};st.after(b);lab();}
  function lab(){const b=document.getElementById("bMus");if(b)b.textContent=Music.isOn()?"Musik: an":"Musik: aus";}
  document.addEventListener("pointerdown",()=>Music.unlock(),true);
  btn();
  setInterval(()=>{if(!tf||tf.hidden)return;btn();
    const tm=document.getElementById("tm"),vis=!!(tm&&tm.offsetParent!==null);
    if(vis){if(!was){was=true;lastS=-1;Music.start();}
      const s=parseInt(tm.textContent,10);if(!isNaN(s)&&s!==lastS){lastS=s;if(s<=10&&s>0)Music.hurry();if(s<=5&&s>0)Music.tick();}}
    else if(was){was=false;Music.reveal();}
    const p=document.querySelector("#tMain .podium"),pv=!!(p&&p.offsetParent!==null);
    if(pv&&!pod){pod=true;Music.fanfare();}if(!pv)pod=false;
  },200);
})();
</script>
