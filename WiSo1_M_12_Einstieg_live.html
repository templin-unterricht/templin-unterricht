<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WiSo · Mein gutes Recht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: Tafel = Kopfleiste mit Bodenmarkierung + eine Bühne pro Runde; Handy = eine Karte, große Tipp-Flächen. */
:root{
  --bg:#F3F4F1; --panel:#FFFFFF; --fg:#1D2326; --muted:#5B6569; --line:#CBD0CB;
  --accent:#E3A21A; --accent-ink:#2A2108; --steel:#2E4A5B; --steel-soft:#DCE6EC;
  --ok:#2C7A4B; --ok-soft:#DDEFE3; --bad:#B42318; --bad-soft:#F8E0DD;
  --heat:#E3A21A;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141819; --panel:#1E2427; --fg:#E8ECEA; --muted:#A3ADB0; --line:#374145;
  --accent:#F0B43A; --accent-ink:#1A1405; --steel:#9DC0D3; --steel-soft:#24343D;
  --ok:#62BE8A; --ok-soft:#1C3328; --bad:#F2837A; --bad-soft:#3A2220; --heat:#F0B43A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141819; --panel:#1E2427; --fg:#E8ECEA; --muted:#A3ADB0; --line:#374145;
  --accent:#F0B43A; --accent-ink:#1A1405; --steel:#9DC0D3; --steel-soft:#24343D;
  --ok:#62BE8A; --ok-soft:#1C3328; --bad:#F2837A; --bad-soft:#3A2220; --heat:#F0B43A; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.45;min-height:100vh}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabnum{font-variant-numeric:tabular-nums}
/* Kopfleiste */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.stripe{height:8px;background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,var(--fg) 14px 28px);opacity:.9}
.chip{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;background:var(--steel);color:var(--panel);padding:3px 10px;border-radius:3px}
.name{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em}
.spacer{flex:1}
.stat{font-size:14px;color:var(--muted)}
.stat b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:7px 13px;border-radius:4px;font-size:15px}
.btn:hover{border-color:var(--steel)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.on{background:var(--steel);border-color:var(--steel);color:var(--panel)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:middle}
.dot.up{background:var(--ok)}
/* Bühne */
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:18px 60px}
.leit{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px}
.frage{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,42px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:75ch}
.rundenleiste{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.rnd{min-width:38px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:4px;color:var(--fg)}
.rnd.cur{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
.erkl{margin-top:16px;border-left:6px solid var(--ok);background:var(--ok-soft);padding:12px 16px;border-radius:0 6px 6px 0}
.erkl b{color:var(--ok)}
.karte{font-size:clamp(20px,2.4vw,28px);font-weight:600;line-height:1.3;margin:0 0 14px;text-wrap:balance}
/* Balken */
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:minmax(120px,280px) 1fr 70px;gap:12px;align-items:center}
.bar .lab{font-weight:600}
.bar .track{height:34px;background:var(--steel-soft);border-radius:4px;overflow:hidden;position:relative}
.bar .fill{height:100%;background:var(--steel);transition:width .4s}
.bar.ok .fill{background:var(--ok)}
.bar.no .fill{background:var(--bad)}
.bar .num{font-family:var(--f-display);font-size:24px;font-weight:700;text-align:right}
.verdeckt{color:var(--muted);font-style:italic}
/* Tabellen Abgleich */
.docs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0;overflow-x:auto}
.doc h3{font-family:var(--f-display);font-size:20px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
.doc table{border-collapse:collapse;width:100%;font-size:15px}
.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.doc th{background:var(--steel-soft)}
.doc td.tap{cursor:pointer;position:relative}
.doc td.sel{outline:3px solid var(--accent);outline-offset:-3px;background:color-mix(in srgb,var(--accent) 18%,transparent)}
.doc td .cnt{position:absolute;top:-9px;right:-6px;background:var(--heat);color:var(--accent-ink);font-weight:700;font-size:13px;border-radius:10px;padding:0 7px}
.doc td.diff{outline:3px solid var(--bad);outline-offset:-3px}
/* Skala */
.axis{position:relative;height:220px;margin:10px 10px 50px}
.axis .line{position:absolute;left:0;right:0;bottom:40px;height:4px;background:var(--fg)}
.axis .tick{position:absolute;bottom:20px;transform:translateX(-50%);font-size:13px;color:var(--muted);text-align:center;white-space:nowrap}
.axis .tick::before{content:"";display:block;width:2px;height:14px;background:var(--fg);margin:0 auto 4px}
.axis .zone{position:absolute;bottom:44px;height:170px;background:var(--ok-soft);border:2px dashed var(--ok);border-bottom:0}
.axis .stackdot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--steel);transform:translateX(-50%)}
.slider{width:100%;accent-color:var(--accent);height:40px}
/* Kalender */
.kal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:760px}
.kal .wd{font-family:var(--f-display);text-align:center;color:var(--muted);font-weight:600}
.kal .tag{min-height:62px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:4px 6px;position:relative;text-align:left;color:var(--fg)}
.kal .tag .n{font-family:var(--f-display);font-size:20px;font-weight:700}
.kal .tag .m{display:block;font-size:11px;color:var(--steel);line-height:1.15}
.kal .tag.sel{outline:3px solid var(--accent);outline-offset:-2px}
.kal .tag.ok{outline:3px solid var(--ok);outline-offset:-2px;background:var(--ok-soft)}
.kal .tag .cnt{position:absolute;right:5px;bottom:4px;background:var(--heat);color:var(--accent-ink);border-radius:9px;padding:0 6px;font-weight:700;font-size:13px}
.kal .leer{min-height:62px}
/* Suchbild */
.scene{position:relative;max-width:1000px;margin:0 auto}
.scene svg{width:100%;height:auto;display:block;border-radius:6px;border:1px solid var(--line);background:var(--panel)}
.scene [data-h]{cursor:pointer}
.scene [data-h].sel>.hl{stroke:var(--accent);stroke-width:5}
.hl{fill:transparent;stroke:transparent;stroke-width:4}
.scene .badge{font-family:var(--f-display);font-weight:700}
/* Wolke */
.wolke{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;justify-content:center;min-height:200px;padding:16px}
.wolke span{font-family:var(--f-display);font-weight:700;color:var(--steel);line-height:1}
.wolke span.ok{color:var(--ok)}
/* Duell */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.team h3{font-family:var(--f-display);font-size:24px;margin:0 0 6px}
.team .mittel{font-family:var(--f-display);font-size:42px;font-weight:700}
.vals{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vals span{background:var(--steel-soft);border-radius:3px;padding:2px 8px;font-variant-numeric:tabular-nums}
.vals span.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.daten{overflow-x:auto}
.daten table{border-collapse:collapse;font-size:16px}
.daten th,.daten td{border:1px solid var(--line);padding:6px 12px;text-align:right}
.daten th{background:var(--steel-soft);text-align:left}
/* Kette */
.kette{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.glied{flex:1 1 150px;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px;text-align:center;min-width:0}
.glied .t{font-weight:600}
.glied .pf{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.glied.start{border-color:var(--steel);background:var(--steel-soft)}
.glied.ok{border-color:var(--ok)}
.pfeil{align-self:center;font-family:var(--f-display);font-size:28px;color:var(--muted)}
.updown{display:flex;gap:6px;justify-content:center;margin-top:8px}
.updown button{flex:1;padding:10px 0;font-size:22px;border:1px solid var(--line);background:var(--bg);border-radius:4px;color:var(--fg)}
.updown button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* Handy */
.phone{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border:2px solid var(--line);border-radius:8px;background:var(--panel);font-size:18px;color:var(--fg)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel))}
.send{margin-top:16px;width:100%;padding:16px;font-size:19px;font-weight:700;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.send:disabled{opacity:.5}
.ok-msg{margin-top:14px;padding:12px 14px;border-radius:6px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.timer{height:10px;background:var(--steel-soft);border-radius:5px;overflow:hidden;margin:6px 0 10px}
.timer i{display:block;height:100%;background:var(--accent);width:100%;transition:width 1s linear}
.wait{text-align:center;color:var(--muted);padding:40px 10px}
.big{font-family:var(--f-display);font-size:30px;font-weight:700}
input[type=text],input[type=number]{font:inherit;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:6px;width:100%;background:var(--panel);color:var(--fg)}
/* QR-Overlay */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 94%,transparent);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.qrbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-wrap:wrap;gap:28px;align-items:center;max-width:980px}
.qrbox canvas{width:min(360px,70vw);height:auto;border:10px solid #fff;border-radius:6px;background:#fff}
.code{font-family:var(--f-display);font-size:64px;font-weight:700;letter-spacing:.12em}
.url{word-break:break-all;color:var(--muted);font-size:14px}
.start{max-width:760px;margin:6vh auto;padding-inline:20px}
.start .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;margin-top:16px}
.lokal{margin-top:22px;border-top:2px dashed var(--line);padding-top:16px}
.hint{font-size:14px;color:var(--muted)}
@media (max-width:760px){.docs,.teams{grid-template-columns:1fr}.bar{grid-template-columns:1fr 60px}.bar .lab{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  var HT={"<b>0</b> Antworten": "<b>0</b> respuestas", "<b>Auflösung:</b> Die <b>Quelle</b> sagt: <b>wer</b> (Handelsverband) und <b>wann</b> (März 2026). Die Einheit steht an der Achse oder im Titel, die Farben erklärt die <b>Legende</b>. Merkwort für die Prüfung: <b>T-A-E-L-Q</b> = Titel, Achsen, Einheit, Legende, Quelle.": "<b>Solución:</b> La <b>fuente</b> dice <b>quién</b> (Handelsverband) y <b>cuándo</b> (marzo de 2026). La unidad aparece en el eje o en el título; los colores los explica la <b>leyenda</b>. Palabra clave para el examen: <b>T-A-E-L-Q</b> = Título, Ejes, Unidad (Einheit), Leyenda, Quelle (fuente).", "<b>Auflösung:</b> Die Säule endet zwischen den Linien 300 und 400, etwas oberhalb der Mitte: rund <b>370 Kunden</b>. Trick: Lineal oder Papierkante waagerecht an die Säule legen und zur Achse schauen. In der Prüfung reicht ein sinnvoller Schätzwert.": "<b>Solución:</b> La columna termina entre las líneas 300 y 400, algo por encima de la mitad: unos <b>370 clientes</b>. Truco: coloca una regla o el borde de una hoja en horizontal sobre la columna y mira hacia el eje. En el examen basta con un valor estimado razonable.", "<b>Auflösung:</b> Ob Umsatzbericht, Aushang im Pausenraum oder Kassenauswertung: Grafiken sind überall. In diesem Modul lernt ihr, sie in 30 Sekunden sicher zu lesen.": "<b>Solución:</b> Informe de ventas, cartel en la sala de descanso o resumen de caja: los gráficos están en todas partes. En este módulo aprenderás a leerlos con seguridad en 30 segundos.", "<b>Auflösung:</b> Über der Säule steht 48 – aber oben links steht die <b>Einheit: in Tausend €</b>. Also 48 · 1.000 € = <b>48.000 €</b>. Wer die Einheit überliest, liegt in der Prüfung um das Tausendfache daneben.": "<b>Solución:</b> Sobre la columna pone 48, pero arriba a la izquierda está la <b>unidad: en miles de €</b>. Es decir, 48 · 1.000 € = <b>48.000 €</b>. Quien pasa por alto la unidad se equivoca mil veces en el examen.", "Antworten: <b>0</b> · Mittelwert der Klasse: <b>–</b>": "Respuestas: <b>0</b> · Promedio de la clase: <b>–</b>", "<b>Auflösung:</b> 40 + 35 + 25 + 10 = <b>110 %</b>. Ein Kreis ist immer genau 100 %. Wahrscheinlich durften die Kunden mehrere Gründe nennen (Mehrfachnennung). Dann ist ein Kreisdiagramm die falsche Wahl – besser Säulen oder Balken.": "<b>Solución:</b> 40 + 35 + 25 + 10 = <b>110 %</b>. Un círculo siempre es exactamente 100 %. Probablemente los clientes pudieron nombrar varios motivos (respuesta múltiple). Entonces el gráfico circular es la mala elección; mejor columnas o barras.", "<b>Auflösung:</b> <b>Anteil in % = Teil : Ganzes · 100.</b> Beispiel: 120 von 480 Kunden → 120 : 480 · 100 = 25 %.": "<b>Solución:</b> <b>Porcentaje = parte : total · 100.</b> Ejemplo: 120 de 480 clientes → 120 : 480 · 100 = 25 %.", "<b>Auflösung:</b> Bus: 120 : 480 · 100 = <b>25 %</b>. Auto: 480 · 35 : 100 = <b>168 Kunden</b>. Zwei Richtungen, ein Werkzeug: <b>Anteil in % = Teil : Ganzes · 100</b> und <b>Teil = Ganzes · Prozentsatz : 100</b>.": "<b>Solución:</b> Autobús: 120 : 480 · 100 = <b>25 %</b>. Coche: 480 · 35 : 100 = <b>168 clientes</b>. Dos direcciones, una herramienta: <b>porcentaje = parte : total · 100</b> y <b>parte = total · porcentaje : 100</b>.", "<b>Auflösung:</b> Das <b>Ganze steht im Titel</b>: 2,4 Mio. €. Teil = Ganzes · Prozentsatz : 100 → 2.400.000 € · 30 : 100 = <b>720.000 €</b>. In der Prüfung steht das Ganze oft im Titel oder in einer Summenzeile – erst suchen, dann rechnen.": "<b>Solución:</b> El <b>total está en el título</b>: 2,4 millones de €. Parte = total · porcentaje : 100 → 2.400.000 € · 30 : 100 = <b>720.000 €</b>. En el examen, el total suele estar en el título o en una fila de suma: primero búscalo, luego calcula.", "<b>Auflösung:</b> Ein Viertel des Kreises sind <b>25 %</b> (wie eine Viertelstunde auf der Uhr). Das gelbe Stück „bar“ ist etwas größer: <b>30 %</b>. Ein halber Kreis = 50 %, der ganze Kreis = 100 %.": "<b>Solución:</b> Un cuarto del círculo es <b>25 %</b> (como un cuarto de hora en el reloj). El trozo amarillo «efectivo» es algo mayor: <b>30 %</b>. Medio círculo = 50 %, el círculo completo = 100 %.", "<b>Auflösung:</b> Gefragt ist „<b>nicht</b>“: 100 % − 64 % = 36 %. Dann 25 · 36 : 100 = <b>9 Azubis</b>. Wer 16 sagt, hat die Azubis <i>mit</i> Führerschein berechnet. Wer 36 sagt, hat nur den Prozentsatz genannt.": "<b>Solución:</b> Se pregunta por los que «<b>no</b>»: 100 % − 64 % = 36 %. Luego 25 · 36 : 100 = <b>9 aprendices</b>. Quien dice 16 ha calculado los aprendices <i>con</i> carné de conducir. Quien dice 36 solo ha dado el porcentaje.", "<b>Befragt:</b> 480 Kunden &nbsp;·&nbsp; <b>mit dem Bus:</b> 120 Kunden &nbsp;·&nbsp; <b>mit dem Auto:</b> 35 %": "<b>Encuestados:</b> 480 clientes &nbsp;·&nbsp; <b>en autobús:</b> 120 clientes &nbsp;·&nbsp; <b>en coche:</b> 35 %", "<b>Euer Rechenweg: </b>Anteil in %: 120 : 480 · 100 = ? %": "<b>Vuestro cálculo: </b>Porcentaje: 120 : 480 · 100 = ? %", "<b>Auflösung:</b> 50 → 100 ist eine <b>Verdoppelung = +100 %</b>. 200 → 190 sind (190 − 200) : 200 · 100 = <b>−5 %</b>. Reihenfolge: +100 % · +2 % · +0,5 % · −5 % · −30 %.": "<b>Solución:</b> De 50 a 100 es una <b>duplicación = +100 %</b>. De 200 a 190 son (190 − 200) : 200 · 100 = <b>−5 %</b>. Orden: +100 % · +2 % · +0,5 % · −5 % · −30 %.", "<b>Auflösung:</b> <b>Veränderung in % = (neu − alt) : alt · 100.</b> Ergebnis mit Plus = gestiegen, mit Minus = gesunken. Trendwörter: leicht, deutlich, stark gestiegen/gesunken.": "<b>Solución:</b> <b>Variación en % = (nuevo − antiguo) : antiguo · 100.</b> Resultado con más = ha subido, con menos = ha bajado. Palabras de tendencia: ligeramente, claramente, mucho subido/bajado.", "<b>Auflösung:</b> Das ist ein <b>Veränderungsdiagramm</b>: Jede Säule vergleicht mit dem Vorjahresmonat. <b>Plus bleibt Plus</b> – auch wenn die Säule kleiner wird. Erst im <b>Mai</b> (−2 %) war der Umsatz niedriger als im Vorjahr. 0 % hieße: genauso viel wie im Vorjahr.": "<b>Solución:</b> Es un <b>gráfico de variación</b>: cada columna compara con el mismo mes del año anterior. <b>Más sigue siendo más</b>, aunque la columna se haga más pequeña. Solo en <b>mayo</b> (−2 %) las ventas fueron menores que el año anterior. 0 % significaría: exactamente igual que el año anterior.", "<b>Auflösung:</b> Die Differenz zweier Prozentsätze heißt <b>Prozentpunkte</b>: 25 % − 20 % = <b>5 Prozentpunkte</b>. Im Verhältnis ist der Anteil um (25 − 20) : 20 · 100 = <b>25 %</b> gewachsen.": "<b>Solución:</b> La diferencia entre dos porcentajes se llama <b>puntos porcentuales</b>: 25 % − 20 % = <b>5 puntos porcentuales</b>. En proporción, la cuota ha crecido (25 − 20) : 20 · 100 = <b>25 %</b>.", "<b>Auflösung:</b> Rechnung: (20.000 − 19.500) : 19.500 · 100 = <b>rund 2,6 %</b>. Die Linie sieht nach einer Rakete aus, weil die <b>Achse erst bei 19.400 beginnt</b> und nicht bei 0. Immer zuerst auf die Achse schauen!": "<b>Solución:</b> Cálculo: (20.000 − 19.500) : 19.500 · 100 = <b>unos 2,6 %</b>. La línea parece un cohete porque el <b>eje no empieza en 0, sino en 19.400</b>. ¡Mira siempre primero el eje!", "<b>Auflösung:</b> Umsatz: 12.000 : 80.000 · 100 = <b>+15 %</b>. Kunden: 300 : 2.500 · 100 = <b>−12 %</b>. Immer durch den <b>alten Wert</b> teilen – der alte Wert ist das Ganze (100 %).": "<b>Solución:</b> Ventas: 12.000 : 80.000 · 100 = <b>+15 %</b>. Clientes: 300 : 2.500 · 100 = <b>−12 %</b>. Divide siempre entre el <b>valor antiguo</b>: el valor antiguo es el total (100 %).", "<b>Begründete Reihenfolge: </b>1. von 50 auf 100 Stück · 2. +2 % · 3. +0,5 % · 4. von 200 auf 190 Stück · 5. −30 %": "<b>Orden razonado: </b>1. de 50 a 100 unidades · 2. +2 % · 3. +0,5 % · 4. de 200 a 190 unidades · 5. −30 %", "<b>Euer Rechenweg: </b>(92.000 − 80.000) : 80.000 · 100 = ? % gestiegen": "<b>Vuestro cálculo: </b>(92.000 − 80.000) : 80.000 · 100 = ? % de aumento", "<b>Umsatz:</b> 80.000 € → 92.000 € &nbsp;·&nbsp; <b>Kunden:</b> 2.500 → 2.200": "<b>Ventas:</b> 80.000 € → 92.000 € &nbsp;·&nbsp; <b>Clientes:</b> 2.500 → 2.200", "<b>Auflösung:</b> <b>Erst die Zeile</b> (Cola), <b>dann die Spalte</b> (Wulsdorf): <b>165</b>. 276 ist Bier in Wulsdorf (falsche Zeile), 187 ist Cola in Lehe (falsche Spalte). Tipp: Finger oder Lineal auf die Zeile legen.": "<b>Solución:</b> <b>Primero la fila</b> (Cola), <b>luego la columna</b> (Wulsdorf): <b>165</b>. 276 es cerveza en Wulsdorf (fila equivocada), 187 es cola en Lehe (columna equivocada). Consejo: pon el dedo o una regla sobre la fila.", "<b>Auflösung:</b> Dienstplan, Kassenbericht, Bestellliste, Inventurliste: Überall gilt erst Zeile, dann Spalte – und die Summe als Kontrolle.": "<b>Solución:</b> Plan de turnos, informe de caja, lista de pedidos, lista de inventario: siempre vale primero la fila, luego la columna, y la suma como control.", "<b>Auflösung:</b> Durchschnittsbon: 18.600 : 1.240 = <b>15,00 € je Kunde</b>. Flächenproduktivität: 312.000 : 480 = <b>650 € je m²</b>. Immer: <b>Umsatz geteilt durch</b> das, worauf es sich bezieht.": "<b>Solución:</b> Ticket medio: 18.600 : 1.240 = <b>15,00 € por cliente</b>. Productividad por superficie: 312.000 : 480 = <b>650 € por m²</b>. Siempre: <b>ventas divididas entre</b> aquello a lo que se refieren.", "<b>Auflösung:</b> Falle: (20 + 30) : 2 = 25 € – aber am Samstag kamen dreimal so viele Kunden. Richtig ist <b>Summe : Summe</b>: (2.000 + 9.000) : (100 + 300) = 11.000 : 400 = <b>27,50 €</b>.": "<b>Solución:</b> Trampa: (20 + 30) : 2 = 25 €, pero el sábado vinieron el triple de clientes. Lo correcto es <b>suma : suma</b>: (2.000 + 9.000) : (100 + 300) = 11.000 : 400 = <b>27,50 €</b>.", "<b>Auflösung:</b> Summe minus alle bekannten Werte: 4.200 − (820 + 760 + 790 + 1.030) = 4.200 − 3.400 = <b>800 Kunden</b>. Lücken in Tabellen schließt man fast immer über die <b>Summenzeile</b>.": "<b>Solución:</b> Suma menos todos los valores conocidos: 4.200 − (820 + 760 + 790 + 1.030) = 4.200 − 3.400 = <b>800 clientes</b>. Los huecos de las tablas casi siempre se rellenan con la <b>fila de la suma</b>.", "<b>Auflösung:</b> Zwei Kontrollen helfen immer: <b>Stimmt die Summe?</b> (120 + 90 + 150 + 60 + 180 = 600, nicht 610) und <b>ergeben die Anteile 100 %?</b> (mit 12 % wären es 102 %; richtig sind 60 : 600 · 100 = 10 %).": "<b>Solución:</b> Siempre ayudan dos controles: <b>¿Cuadra la suma?</b> (120 + 90 + 150 + 60 + 180 = 600, no 610) y <b>¿suman 100 % los porcentajes?</b> (con 12 % serían 102 %; lo correcto es 60 : 600 · 100 = 10 %).", "<b>Euer Rechenweg: </b>18.600 € : 1.240 Kunden = ? € je Kunde": "<b>Vuestro cálculo: </b>18.600 € : 1.240 clientes = ? € por cliente", "<b>Umsatz Montag:</b> 18.600 € bei 1.240 Kunden &nbsp;·&nbsp; <b>Jahresumsatz:</b> 312.000 € auf 480 m² Verkaufsfläche": "<b>Ventas del lunes:</b> 18.600 € con 1.240 clientes &nbsp;·&nbsp; <b>Ventas anuales:</b> 312.000 € en 480 m² de superficie de venta", "<b>Auflösung:</b> <b>Alle, keine, nie, immer, dramatisch</b> sind typische <b>Übertreibungen</b> (Falle 4). „Rund“ und „etwa“ dagegen sind ehrlich – sie zeigen, dass gerundet wurde.": "<b>Solución:</b> <b>Todos, ninguno, nunca, siempre, dramático</b> son <b>exageraciones</b> típicas (trampa 4). En cambio «unos» y «aproximadamente» son honestos: muestran que se ha redondeado.", "<b>Auflösung:</b> Die Zahlen sind ehrlich, die Darstellung nicht: 98 € statt 100 € sind nur <b>2 € bzw. 2 % weniger</b>. Weil die <b>Achse bei 96 € beginnt</b>, wirkt die eine Säule halb so hoch. Immer erst die Zahlen lesen, dann dem Bild glauben.": "<b>Solución:</b> Los números son honestos, la presentación no: 98 € en vez de 100 € son solo <b>2 € o un 2 % menos</b>. Como el <b>eje empieza en 96 €</b>, una columna parece la mitad de alta. Primero lee los números, luego cree la imagen.", "<b>Auflösung:</b> 840 : 50 = 16,8 cm – passt nicht aufs Blatt. 840 : 1.000 = 0,84 cm – winzige Säulen. <b>840 : 100 = 8,4 cm</b> – passt und ist gut lesbar. Danach: Achsen mit Einheit beschriften, Säulen zeichnen, Titel und Quelle ergänzen.": "<b>Solución:</b> 840 : 50 = 16,8 cm: no cabe en la hoja. 840 : 1.000 = 0,84 cm: columnas diminutas. <b>840 : 100 = 8,4 cm</b>: cabe y se lee bien. Después: rotular los ejes con la unidad, dibujar las columnas, añadir título y fuente.", "<b>Auflösung:</b> Bei 5 € wollen die Anbieter <b>500 kg</b> verkaufen, die Kunden kaufen nur <b>100 kg</b>. Es bleiben 400 kg übrig: <b>Angebotsüberhang</b>. Die Händler senken den Preis – bis er wieder beim Gleichgewichtspreis von 3 € liegt.": "<b>Solución:</b> A 5 € los oferentes quieren vender <b>500 kg</b>, los clientes solo compran <b>100 kg</b>. Sobran 400 kg: <b>exceso de oferta</b>. Los vendedores bajan el precio hasta que vuelve al precio de equilibrio de 3 €.", "<b>Auflösung:</b> Faustregel: <b>Geld fließt immer gegen Ware oder Arbeit</b> – also genau in die Gegenrichtung des Güterstroms.": "<b>Solución:</b> Regla práctica: <b>el dinero siempre fluye a cambio de bienes o trabajo</b>, es decir, justo en dirección contraria al flujo de bienes.", "<b>Auflösung:</b> Hier ist der <b>Geldstrom durchgezogen</b> – im Unterricht war es oft andersherum. In der Prüfung wechseln Linienart, Nummern und Seiten. Deshalb nie auswendig lernen, sondern immer: <b>Legende lesen, Pfeil verfolgen</b>.": "<b>Solución:</b> Aquí el <b>flujo de dinero es la línea continua</b>; en clase muchas veces era al revés. En el examen cambian el tipo de línea, los números y los lados. Por eso nunca lo aprendas de memoria, sino siempre: <b>lee la leyenda, sigue la flecha</b>.", "<b>Auflösung:</b> Im <b>Schnittpunkt</b> von Angebot und Nachfrage. Senkrecht nach unten: <b>Gleichgewichtsmenge 300 kg</b>. Waagerecht nach links: <b>Gleichgewichtspreis 3 € je kg</b>. Wer 300 € sagt, hat die Achsen vertauscht. Bei 5 € wollen die Kunden nur 100 kg – das ist ein Punkt auf der Nachfragekurve, kein Gleichgewicht.": "<b>Solución:</b> En el <b>punto de intersección</b> de oferta y demanda. Hacia abajo en vertical: <b>cantidad de equilibrio 300 kg</b>. Hacia la izquierda en horizontal: <b>precio de equilibrio 3 € por kg</b>. Quien dice 300 € ha confundido los ejes. A 5 € los clientes solo quieren 100 kg: eso es un punto de la curva de demanda, no un equilibrio.", "<b>Auflösung:</b> 21–50 Wahlberechtigte → 3 Mitglieder (§ 9 BetrVG).": "<b>Solución:</b> 21–50 trabajadores con derecho a voto → 3 miembros (§ 9 BetrVG).", "<b>Auflösung:</b> Die Einigungsstelle: gleich viele Personen von beiden Seiten und ein unparteiischer Vorsitz. Ihr Spruch ersetzt die Einigung.": "<b>Solución:</b> La comisión de conciliación (Einigungsstelle): el mismo número de personas de ambas partes y una presidencia imparcial. Su decisión sustituye al acuerdo.", "<b>Auflösung:</b> Information: Der Chef muss rechtzeitig und umfassend informieren – entscheiden darf er allein.": "<b>Solución:</b> Información: el jefe debe informar a tiempo y de forma completa; puede decidir él solo.", "<b>Auflösung:</b> Nein. Es müssen mindestens 5 ständige wahlberechtigte Arbeitnehmer sein, davon 3 wählbar.": "<b>Solución:</b> No. Debe haber al menos 5 trabajadores permanentes con derecho a voto, de los cuales 3 elegibles.", "<b>Auflösung:</b> Volle Mitbestimmung in sozialen Angelegenheiten: Arbeitszeit, Urlaubsplan, Zeiterfassung.": "<b>Solución:</b> Plena codecisión en asuntos sociales: horario de trabajo, plan de vacaciones, registro de tiempo.", "<b>Auflösung:</b> Wählen (aktives Wahlrecht): ab 16. Gewählt werden (passives Wahlrecht): ab 18 und mindestens 6 Monate im Betrieb.": "<b>Solución:</b> Votar (derecho de voto activo): desde los 16. Ser elegido (derecho de voto pasivo): desde los 18 y al menos 6 meses en la empresa.", "<b>Auflösung:</b> Zustimmung verweigern: Ohne Zustimmung muss der Arbeitgeber vor das Arbeitsgericht.": "<b>Solución:</b> Denegar el consentimiento: sin consentimiento, el empresario tiene que acudir al tribunal laboral.", "<b>Auflösung:</b> Betriebsvereinbarung: Ablauf der Ausbildung im Betrieb.": "<b>Solución:</b> Acuerdo de empresa: desarrollo de la formación en la empresa.", "<b>Auflösung:</b> Betriebsvereinba scanso.", "<b>Auflösung:</b> Mythos. Der Arbeitgeber muss nicht zustimmen – er muss nur rechtzeitig informiert werden. Und: Auch Väter können Elternzeit nehmen.": "<b>Solución:</b> Mito. El empresario no tiene que dar su consentimiento; solo hay que informarle a tiempo. Y también los padres pueden tomar la excedencia parental.", "<b>Auflösung:</b> Mythos. Höchstens 8 Stunden pro Werktag, bis 10 Stunden nur, wenn im Durchschnitt von 6 Monaten 8 herauskommen (Arbeitszeitgesetz).": "<b>Solución:</b> Mito. Como máximo 8 horas por día laborable; hasta 10 horas solo si en un promedio de 6 meses salen 8 (Ley de Jornada Laboral).", "<b>Auflösung:</b> Mythos. Mit ärztlichem Attest werden die Krankheitstage nicht auf den Urlaub angerechnet.": "<b>Solución:</b> Mito. Con certificado médico, los días de enfermedad no se descuentan de las vacaciones.", "<b>Auflösung:</b> Normal 8 Wochen nach der Geburt, bei Früh- und Mehrlingsgeburten 12 Wochen. Vor der Geburt: 6 Wochen (freiwillig arbeiten möglich).": "<b>Solución:</b> Normalmente 8 semanas tras el parto; en partos prematuros y múltiples, 12 semanas. Antes del parto: 6 semanas (se puede trabajar voluntariamente).", "<b>Auflösung:</b> Stimmt (Mutterschutzgesetz): keine schweren körperlichen Arbeiten, z. B. regelmäßig mehr als 5 kg heben.": "<b>Solución:</b> Correcto (Ley de Protección de la Maternidad): sin trabajos físicos pesados, p. ej. levantar regularmente más de 5 kg.", "<b>Auflösung:</b> Die Tarifpartner: Gewerkschaft (ver.di) und Arbeitgeberverband (Handelsverband Niedersachsen-Bremen). Der Staat mischt sich nicht ein – das heißt Tarifautonomie (Art. 9 Abs. 3 GG).": "<b>Solución:</b> Los interlocutores sociales: el sindicato (ver.di) y la asociación empresarial (Handelsverband Niedersachsen-Bremen). El Estado no interviene; eso se llama autonomía negociadora (art. 9, apdo. 3 de la Ley Fundamental).", "<b>Auflösung:</b> Entgelttarifvertrag – die Beträge. Er läuft meist 1–2 Jahre.": "<b>Solución:</b> Convenio salarial: los     if(p.closest&&(p.closest("#es-btn")||p.closest("[data-es-h]")))return;
    var v=n.nodeValue; if(!v||!/\S/.test(v))return;
    var core=norm(v); if(rev[core])return;
    var t=lookup(core); if(t==null)return;
    var lead=/^\s*/.exec(v)[0], trail=/\s*$/.exec(v)[0];
    orig.set(n,v); n.nodeValue=lead+t+trail;
    if(p.nodeType===1&&!(p.namespaceURI&&p.namespaceURI.indexOf("svg")>=0)&&!p.hasAttribute("data-es-t")){
      var cur=p.getAttribute("title"); p.setAttribute("data-es-t",cur==null?"":cur); p.setAttribute("title","DE: "+core);
    }
  }
  var ATTRS=["placeholder","aria-label"];
  function trAttrs(e){
    ATTRS.forEach(function(a){var v=e.getAttribute&&e.getAttribute(a);if(!v)return;var core=norm(v);var t=(a==="placeholder"&&PH[core])||null;
      if(t==null)return;e.setAttribute("data-es-"+a,v);e.setAttribute(a,t);});
  }
  var INL={B:1,I:1,EM:1,STRONG:1,SPAN:1,BR:1,SUP:1,SUB:1,CODE:1,U:1,SMALL:1,MARK:1,A:1};
  function allInline(el){for(var i=0;i<el.children.length;i++){var c=el.children[i];if(!INL[c.tagName]||c.id||!allInline(c))return false;}return true;}
  function trUnit(el){
    if(el.hasAttribute("data-es-h")||!el.children.length)return false;
    if(el.id==="es-btn"||el.closest("svg")||/^(SCRIPT|STYLE|SVG)$/i.test(el.tagName))return false;
    var dt=false;for(var i=0;i<el.childNodes.length;i++){var n=el.childNodes[i];if(n.nodeType===3&&/\S/.test(n.nodeValue))dt=true;}
    if(!dt||!allInline(el)||el.querySelector("[id]"))return false;
    var key=norm(el.innerHTML),t=Object.prototype.hasOwnProperty.call(HT,key)?HT[key]:null;
    if(t==null)return false;
    origH.set(el,el.innerHTML);el.innerHTML=t;el.setAttribute("data-es-h","1");
    var cur=el.getAttribute("title");el.setAttribute("data-es-t",cur==null?"":cur);el.setAttribute("title","DE: "+norm(origH.get(el).replace(/<[^>]+>/g," ").replace(/&nbsp;/g," ")));
    return true;
  }
  function walk(root){
    if(root.nodeType===3){trNode(root);return;}
    if(root.nodeType!==1)return;
    var els=[root].concat([].slice.call(root.querySelectorAll?root.querySelectorAll("*"):[]));
    els.forEach(function(e){trUnit(e);});
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),n,list=[];
    while((n=w.nextNode()))list.push(n);
    list.forEach(trNode);
    if(root.querySelectorAll){trAttrs(root);root.querySelectorAll("[placeholder],[aria-label]").forEach(trAttrs);}
  }
  function restore(){
    busy=true;
    orig.forEach(function(v,n){if(n.parentNode)n.nodeValue=v;});
    orig.clear();
    origH.forEach(function(v,e){e.innerHTML=v;e.removeAttribute("data-es-h");});origH.clear();
    document.querySelectorAll("[data-es-t]").forEach(function(e){var o=e.getAttribute("data-es-t");if(o==="")e.removeAttribute("title");else e.setAttribute("title",o);e.removeAttribute("data-es-t");});
    ATTRS.forEach(function(a){document.querySelectorAll("[data-es-"+a+"]").forEach(function(e){e.setAttribute(a,e.getAttribute("data-es-"+a));e.removeAttribute("data-es-"+a);});});
    busy=false;
  }
  function start(){
    walk(document.body);
    if(obs)obs.disconnect();
    obs=new MutationObserver(function(ms){
      if(busy||!on)return; busy=true;
      try{ms.forEach(function(m){
        if(m.type==="childList"){m.addedNodes.forEach(function(n){walk(n);});}
        else if(m.type==="characterData"){trNode(m.target);}
        else if(m.type==="attributes"){trAttrs(m.target);}
      });}catch(e){}
      obs.takeRecords(); busy=false;
    });
    obs.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:ATTRS});
  }
  function set(v){
    on=v;
    var b=document.getElementById("es-btn");
    if(b){b.setAttribute("aria-pressed",v?"true":"false");b.textContent=v?"🇩🇪 Deutsch":"🇪🇸 Español";}
    try{localStorage.setItem(KEY,v?"1":"0");}catch(e){}
    if(v){busy=true;try{start();}catch(e){}busy=false;if(obs)obs.takeRecords();}
    else{if(obs){obs.disconnect();obs=null;}restore();}
  }
  function init(){
    var css=document.createElement("style");
    css.textContent="#es-btn{position:fixed;right:10px;bottom:10px;z-index:99999;border:2px solid #0f5c6e;background:#fff;color:#0f5c6e;font:700 15px/1 system-ui,-apple-system,Segoe UI,sans-serif;padding:11px 14px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;min-height:44px}#es-btn[aria-pressed=true]{background:#0f5c6e;color:#fff}body{padding-bottom:64px}@media print{#es-btn{display:none}}";
    document.head.appendChild(css);
    var b=document.createElement("button");b.id="es-btn";b.type="button";b.textContent="🇪🇸 Español";
    b.setAttribute("aria-pressed","false");b.title="Traducción al español / Spanische Übersetzung";
    b.addEventListener("click",function(){set(!on);});
    document.body.appendChild(b);
    var saved=null;try{saved=localStorage.getItem(KEY);}catch(e){}
    if(saved==="1")set(true);
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
