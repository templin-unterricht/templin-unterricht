<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LF1 · Modul 2 · Die Weltreise der Jeans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: Tafel = Kopfleiste mit Bodenmarkierung + eine Bühne pro Runde; Handy = eine Karte, große Tipp-Flächen. */
:root{
  --bg:#F6F3EE; --panel:#FFFFFF; --fg:#1F2324; --muted:#5D6466; --line:#D4CEC5;
  --accent:#E8674A; --accent-ink:#FFFFFF; --steel:#1F5F66; --steel-soft:#DCEBEC;
  --ok:#2C7A4B; --ok-soft:#DDEFE3; --bad:#B42318; --bad-soft:#F8E0DD;
  --heat:#F2B33D;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141718; --panel:#1E2325; --fg:#ECEDEA; --muted:#A5ACAD; --line:#394244;
  --accent:#F0866C; --accent-ink:#1B0D08; --steel:#86C3C9; --steel-soft:#203538;
  --ok:#62BE8A; --ok-soft:#1C3328; --bad:#F2837A; --bad-soft:#3A2220; --heat:#F2B33D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141718; --panel:#1E2325; --fg:#ECEDEA; --muted:#A5ACAD; --line:#394244;
  --accent:#F0866C; --accent-ink:#1B0D08; --steel:#86C3C9; --steel-soft:#203538;
  --ok:#62BE8A; --ok-soft:#1C3328; --bad:#F2837A; --bad-soft:#3A2220; --heat:#F2B33D; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.45;min-height:100vh}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tabnum{font-variant-numeric:tabular-nums}
/* Kopfleiste */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.stripe{height:14px;background:radial-gradient(circle at 13px 0,transparent 0,transparent 0) ,repeating-linear-gradient(90deg,var(--accent) 0 26px,#FFFFFF 26px 52px);border-bottom:3px solid var(--steel)}
.chip{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;background:var(--steel);color:var(--panel);padding:3px 10px;border-radius:3px}
.name{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.01em}
.spacer{flex:1}
.stat{font-size:14px;color:var(--muted)}
.stat b{color:var(--fg)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:7px 13px;border-radius:4px;font-size:15px}
.btn:hover{border-color:var(--steel)}
.btn.prim{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.on{background:var(--steel);border-color:var(--steel);color:var(--panel)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:middle}
.dot.up{background:var(--ok)}
/* Bühne */
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:18px 60px}
.leit{font-family:var(--f-display);font-weight:600;font-size:18px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px}
.frage{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,3.4vw,42px);line-height:1.1;margin:0 0 6px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:75ch}
.rundenleiste{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
.rnd{min-width:38px;height:34px;border:1px solid var(--line);background:var(--panel);border-radius:4px;color:var(--fg)}
.rnd.cur{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
.erkl{margin-top:16px;border-left:6px solid var(--ok);background:var(--ok-soft);padding:12px 16px;border-radius:0 6px 6px 0}
.erkl b{color:var(--ok)}
.karte{font-size:clamp(20px,2.4vw,28px);font-weight:600;line-height:1.3;margin:0 0 14px;text-wrap:balance}
/* Balken */
.bars{display:grid;gap:12px}
.bar{display:grid;grid-template-columns:minmax(120px,280px) 1fr 70px;gap:12px;align-items:center}
.bar .lab{font-weight:600}
.bar .track{height:34px;background:var(--steel-soft);border-radius:4px;overflow:hidden;position:relative}
.bar .fill{height:100%;background:var(--steel);transition:width .4s}
.bar.ok .fill{background:var(--ok)}
.bar.no .fill{background:var(--bad)}
.bar .num{font-family:var(--f-display);font-size:24px;font-weight:700;text-align:right}
.verdeckt{color:var(--muted);font-style:italic}
/* Tabellen Abgleich */
.docs{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;min-width:0;overflow-x:auto}
.doc h3{font-family:var(--f-display);font-size:20px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em}
.doc table{border-collapse:collapse;width:100%;font-size:15px}
.doc th,.doc td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.doc th{background:var(--steel-soft)}
.doc td.tap{cursor:pointer;position:relative}
.doc td.sel{outline:3px solid var(--accent);outline-offset:-3px;background:color-mix(in srgb,var(--accent) 18%,transparent)}
.doc td .cnt{position:absolute;top:-9px;right:-6px;background:var(--heat);color:var(--accent-ink);font-weight:700;font-size:13px;border-radius:10px;padding:0 7px}
.doc td.diff{outline:3px solid var(--bad);outline-offset:-3px}
/* Skala */
.axis{position:relative;height:220px;margin:10px 10px 50px}
.axis .line{position:absolute;left:0;right:0;bottom:40px;height:4px;background:var(--fg)}
.axis .tick{position:absolute;bottom:20px;transform:translateX(-50%);font-size:13px;color:var(--muted);text-align:center;white-space:nowrap}
.axis .tick::before{content:"";display:block;width:2px;height:14px;background:var(--fg);margin:0 auto 4px}
.axis .zone{position:absolute;bottom:44px;height:170px;background:var(--ok-soft);border:2px dashed var(--ok);border-bottom:0}
.axis .stackdot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--steel);transform:translateX(-50%)}
.slider{width:100%;accent-color:var(--accent);height:40px}
/* Kalender */
.kal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:760px}
.kal .wd{font-family:var(--f-display);text-align:center;color:var(--muted);font-weight:600}
.kal .tag{min-height:62px;border:1px solid var(--line);border-radius:5px;background:var(--panel);padding:4px 6px;position:relative;text-align:left;color:var(--fg)}
.kal .tag .n{font-family:var(--f-display);font-size:20px;font-weight:700}
.kal .tag .m{display:block;font-size:11px;color:var(--steel);line-height:1.15}
.kal .tag.sel{outline:3px solid var(--accent);outline-offset:-2px}
.kal .tag.ok{outline:3px solid var(--ok);outline-offset:-2px;background:var(--ok-soft)}
.kal .tag .cnt{position:absolute;right:5px;bottom:4px;background:var(--heat);color:var(--accent-ink);border-radius:9px;padding:0 6px;font-weight:700;font-size:13px}
.kal .leer{min-height:62px}
/* Suchbild */
.scene{position:relative;max-width:1000px;margin:0 auto}
.scene svg{width:100%;height:auto;display:block;border-radius:6px;border:1px solid var(--line);background:var(--panel)}
.scene [data-h]{cursor:pointer}
.scene [data-h].sel>.hl{stroke:var(--accent);stroke-width:5}
.hl{fill:transparent;stroke:transparent;stroke-width:4}
.scene .badge{font-family:var(--f-display);font-weight:700}
/* Wolke */
.wolke{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;justify-content:center;min-height:200px;padding:16px}
.wolke span{font-family:var(--f-display);font-weight:700;color:var(--steel);line-height:1}
.wolke span.ok{color:var(--ok)}
/* Duell */
.teams{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.team h3{font-family:var(--f-display);font-size:24px;margin:0 0 6px}
.team .mittel{font-family:var(--f-display);font-size:42px;font-weight:700}
.vals{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vals span{background:var(--steel-soft);border-radius:3px;padding:2px 8px;font-variant-numeric:tabular-nums}
.vals span.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.daten{overflow-x:auto}
.daten table{border-collapse:collapse;font-size:16px}
.daten th,.daten td{border:1px solid var(--line);padding:6px 12px;text-align:right}
.daten th{background:var(--steel-soft);text-align:left}
/* Kette */
.kette{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.glied{flex:1 1 150px;background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:10px;text-align:center;min-width:0}
.glied .t{font-weight:600}
.glied .pf{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.glied.start{border-color:var(--steel);background:var(--steel-soft)}
.glied.ok{border-color:var(--ok)}
.pfeil{align-self:center;font-family:var(--f-display);font-size:28px;color:var(--muted)}
.updown{display:flex;gap:6px;justify-content:center;margin-top:8px}
.updown button{flex:1;padding:10px 0;font-size:22px;border:1px solid var(--line);background:var(--bg);border-radius:4px;color:var(--fg)}
.updown button.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* Handy */
.phone{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;border:2px solid var(--line);border-radius:8px;background:var(--panel);font-size:18px;color:var(--fg)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel))}
.send{margin-top:16px;width:100%;padding:16px;font-size:19px;font-weight:700;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.send:disabled{opacity:.5}
.ok-msg{margin-top:14px;padding:12px 14px;border-radius:6px;background:var(--ok-soft);color:var(--ok);font-weight:600}
.timer{height:10px;background:var(--steel-soft);border-radius:5px;overflow:hidden;margin:6px 0 10px}
.timer i{display:block;height:100%;background:var(--accent);width:100%;transition:width 1s linear}
.wait{text-align:center;color:var(--muted);padding:40px 10px}
.big{font-family:var(--f-display);font-size:30px;font-weight:700}
input[type=text],input[type=number]{font:inherit;font-size:20px;padding:12px;border:2px solid var(--line);border-radius:6px;width:100%;background:var(--panel);color:var(--fg)}
/* QR-Overlay */
.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 94%,transparent);display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.qrbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-wrap:wrap;gap:28px;align-items:center;max-width:980px}
.qrbox canvas{width:min(360px,70vw);height:auto;border:10px solid #fff;border-radius:6px;background:#fff}
.code{font-family:var(--f-display);font-size:64px;font-weight:700;letter-spacing:.12em}
.url{word-break:break-all;color:var(--muted);font-size:14px}
.start{max-width:760px;margin:6vh auto;padding-inline:20px}
.start .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:22px;margin-top:16px}
.lokal{margin-top:22px;border-top:2px dashed var(--line);padding-top:16px}
.hint{font-size:14px;color:var(--muted)}

/* LF 2: Sprechblasen, Figuren, Sortieren */
.chat{display:flex;flex-direction:column;gap:8px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;text-align:left}
.chat .b{max-width:88%;padding:9px 13px;border-radius:16px;font-size:18px;line-height:1.35}
.chat .k{align-self:flex-start;background:var(--steel-soft);border-bottom-left-radius:4px}
.chat .v{align-self:flex-end;background:color-mix(in srgb,var(--accent) 20%,var(--panel));border-bottom-right-radius:4px}
.chat .who{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.chat .reg{align-self:center;font-style:italic;color:var(--muted);font-size:15px;text-align:center}
.scene .fig{max-width:240px;margin:0 auto}
.scene .fig svg{border:0;background:transparent}
.sortlist{display:grid;gap:10px;margin-top:10px}
.sortrow{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel)}
.sortrow .st{font-weight:600;margin-bottom:8px}
.seg{display:flex;gap:6px}
.seg button{flex:1 1 0;min-width:0;padding:10px 2px;overflow-wrap:anywhere;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font-size:13px;line-height:1.2;hyphens:auto}
.seg button.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--panel));font-weight:700}
.sortwrap{overflow-x:auto}
.sorttab{border-collapse:collapse;width:100%;font-size:17px}
.sorttab th,.sorttab td{border:1px solid var(--line);padding:8px 10px}
.sorttab th{background:var(--steel-soft);font-family:var(--f-display);font-size:18px;text-align:center}
.sorttab td.st{font-weight:600}
.sorttab td.cell{text-align:center;font-family:var(--f-display);font-size:24px;font-weight:700;background:color-mix(in srgb,var(--heat) calc(var(--p) * 75%),var(--panel));color:var(--fg)}
.sorttab td.cell.ok{outline:4px solid var(--ok);outline-offset:-4px}
.sorttab td.pct{text-align:right;font-family:var(--f-display);font-size:20px;font-weight:700;white-space:nowrap}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sorttab td.cell{background:color-mix(in srgb,var(--heat) calc(var(--p) * 45%),var(--panel))}}
@media (max-width:760px){.docs,.teams{grid-template-columns:1fr}.bar{grid-template-columns:1fr 60px}.bar .lab{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

 المصبغة، الخياطة، المستودع، المتجر: كم كيلومتراً تقطع الجينز حتى تصل إلى رفّنا؟ خمّن!","Pamuk tarlası, iplikçi, boyahane, dikimevi, depo, mağaza: Bir kot pantolon bizim rafımıza gelene kadar kaç kilometre yol yapar? Tahmin et!","Cánh đồng bông, nhà máy kéo sợi, xưởng nhuộm, xưởng may, kho, cửa hàng: Một chiếc quần jean đi bao nhiêu km để đến kệ hàng của chúng ta? Hãy ước lượng!","Campo de algodón, hilandería, tintorería, taller de costura, almacén, tienda: ¿Cuántos kilómetros recorre un vaquero hasta llegar a nuestro estante? ¡Estima!","Campo de algodão, fiação, tinturaria, confeção, armazém, loja: Quantos quilómetros percorre uma calça de ganga até chegar à nossa prateleira? Estime!","ሜዳ ጥጥ፣ መፍተሊ፣ ማቕሊ ሕብሪ፣ መስፍያ፣ መኽዘን፣ ድኳን፦ ሓንቲ ጂንስ ክሳብ ናብ ጠረጴዛና ክትበጽሕ ክንደይ ኪሎሜተር ትጓዓዝ? ገምት!","Хлопковое поле, прядильня, красильня, швейная фабрика, склад, магазин: Сколько километров проезжают джинсы, пока не окажутся у нас на полке? Оцените!","Бавовняне поле, прядильня, фарбувальня, швейна фабрика, склад, магазин: Скільки кілометрів долають джинси, поки опиняться в нас на полиці? Оціни!"],"Begründete Reihenfolge:":["الترتيب مع التعليل:","Gerekçeli sıralama:","Thứ tự có lý do:","Orden con justificación:","Ordem com justificação:","ብምኽንያት ዝተሰርዐ ስርዓት፦","Обоснованный порядок:","Обґрунтований порядок:"],"Beim Direktvertrieb fallen Großhandel und Einzelhandel weg. Nicht immer sind alle fünf Stufen dabei.":["في البيع المباشر يسقط تاجر الجملة وتاجر التجزئة. ليست كل المراحل الخمس موجودة دائماً.","Doğrudan satışta toptancı ve perakendeci devreden çıkar. Beş basamağın hepsi her zaman yer almaz.","Với bán hàng trực tiếp, nhà bán buôn và nhà bán lẻ bị bỏ qua. Không phải lúc nào cũng có đủ cả năm khâu.","En la venta directa desaparecen el mayorista y el minorista. No siempre están presentes las cinco etapas.","Na venda direta, o grossista e o retalhista desaparecem. Nem sempre estão presentes as cinco etapas.","ኣብ ቀጥታዊ ሽያጥ እቲ ሸያጢ ብዝሒን እቲ ሸያጢ ንእሽተይን ይነቅሉ። ኩሎም ሓሙሽተ ደረጃታት ኩሉ ግዜ ኣይህልዉን።","При прямых продажах оптовая и розничная торговля отпадают. Не всегда присутствуют все пять ступеней.","У разі прямого продажу оптова й роздрібна торгівля відпадають. Не завжди є всі п’ять ланок."],"Bestandskurve":["منحنى المخزون","Stok eğrisi","Đường cong tồn kho","Curva de existencias","Curva de stock","ጥምዝምዝ ክዕቤት","Кривая запасов","Крива запасів"],"Bringt die Stationen der Jeans in die richtige Reihenfolge.":["رتّبوا محطات الجينز بالترتيب الصحيح.","Kot pantolonun duraklarını doğru sıraya koyun.","Hãy sắp xếp các chặng của chiếc quần jean theo đúng thứ tự.","Ordenad correctamente las estaciones del vaquero.","Ordenem corretamente as estações da calça de ganga.","ደረጃታት እታ ጂንስ ብትኽክል ሰርዕዎም።","Расставьте этапы пути джинсов в правильном порядке.","Розташуйте етапи шляху джинсів у правильному порядку."],"Bäckerei, die selbst backt":["مخبز يخبز بنفسه","Kendi ekmeğini pişiren fırın","Tiệm bánh tự nướng","Panadería que hornea ella misma","Padaria que faz o seu próprio pão","ባዕሉ ዝጽሕን ዳቦ ቤት","Пекарня, которая печёт сама","Пекарня, яка випікає сама"],"Code":["الرمز","Kod","Mã","Código","Código","ኮድ","Код","Код"],"Code von der Tafel eingeben:":["أدخل الرمز الظاهر على السبورة:","Tahtadaki kodu gir:","Nhập mã trên bảng:","Introduce el código de la pizarra:","Introduza o código do quadro:","እቲ ኣብ ሰሌዳ ዘሎ ኮድ ኣእቱ፦","Введи код с доски:","Введи код з дошки:"],"Code, z. B. K#QD":["الرمز، مثلاً K#QD","Kod, ör. K#QD","Mã, ví dụ K#QD","Código, p. ej. K#QD","Código, p. ex. K#QD","ኮድ፣ ንኣብነት K#QD","Код, напр. K#QD","Код, напр. K#QD"],"Das ist die Handelskette: Urproduktion → Weiterverarbeitung → Großhandel → Einzelhandel → Endverbraucher. Der Einzelhandel ist die letzte Stufe vor dem Kunden.":["هذه هي سلسلة التجارة: الإنتاج الأولي ← التصنيع ← تجارة الجملة ← تجارة التجزئة ← المستهلك النهائي. تجارة التجزئة هي المرحلة الأخيرة قبل الزبون.","Bu, ticaret zinciridir: hammadde üretimi → işleme → toptan ticaret → perakende ticaret → son tüketici. Perakende, müşteriden önceki son basamaktır.","Đây là chuỗi thương mại: sản xuất nguyên liệu → chế biến → bán buôn → bán lẻ → người tiêu dùng cuối cùng. Bán lẻ là khâu cuối cùng trước khách hàng.","Esta es la cadena comercial: producción primaria → transformación → comercio mayorista → comercio minorista → consumidor final. El comercio minorista es la última etapa antes del cliente.","Esta é a cadeia comercial: produção primária → transformação → comércio grossista → comércio retalhista → consumidor final. O comércio retalhista é a última etapa antes do cliente.","እዚ ሰንሰለት ንግዲ እዩ፦ ቀዳማይ ምህርቲ → ምስራሕ → ብዝሒ ሽያጥ → ንእሽተይ ሽያጥ → መወዳእታ ተጠቃሚ። ንእሽተይ ሽያጥ ቅድሚ ዓሚል ዘሎ ኣብቅዐ ደረጃ እዩ።","Это торговая цепочка: добыча сырья → переработка → оптовая торговля → розничная торговля → конечный потребитель. Розничная торговля — последняя ступень перед покупателем.","Це торговельний ланцюг: первинне виробництво → переробка → оптова торгівля → роздрібна торгівля → кінцевий споживач. Роздрібна торгівля — остання ланка перед покупцем."],"Datei erst hochladen (GitHub Pages)":["ارفع الملف أولاً (GitHub Pages)","Önce dosyayı yükle (GitHub Pages)","Hãy tải tệp lên trước (GitHub Pages)","Primero sube el archivo (GitHub Pages)","Carregue primeiro o ficheiro (GitHub Pages)","ቅድም ፋይሉ ኣእቱ (GitHub Pages)","Сначала загрузите файл (GitHub Pages)","Спочатку завантажте файл (GitHub Pages)"],"Der Einzelhandel kauft Waren ein und verkauft sie meist unverändert an Verbraucher. Er stellt ein passendes Sortiment zusammen und bietet Dienstleistungen an (Beratung, Änderungsservice, Lieferung). Große Mengen an Händler – das macht der Großhandel.":["تشتري تجارة التجزئة البضائع وتبيعها غالباً دون تغيير للمستهلكين. تُكوّن تشكيلة مناسبة وتقدّم خدمات (استشارة، خدمة تعديل، توصيل). أما الكميات الكبيرة للتجار فهذا عمل تجارة الجملة.","Perakende, mal satın alır ve çoğunlukla değiştirmeden tüketicilere satar. Uygun bir ürün yelpazesi oluşturur ve hizmet sunar (danışmanlık, tadilat hizmeti, teslimat). Tüccarlara büyük miktarda satış ise toptancının işidir.","Bán lẻ mua hàng và thường bán nguyên trạng cho người tiêu dùng. Bán lẻ lập danh mục hàng phù hợp và cung cấp dịch vụ (tư vấn, sửa đồ, giao hàng). Bán số lượng lớn cho thương nhân là việc của bán buôn.","El comercio minorista compra mercancías y las vende, normalmente sin transformarlas, a los consumidores. Forma un surtido adecuado y ofrece servicios (asesoramiento, arreglos, entrega). Las grandes cantidades para comerciantes las vende el comercio mayorista.","O comércio retalhista compra mercadorias e vende-as, na maioria das vezes sem as alterar, aos consumidores. Compõe um sortido adequado e oferece serviços (aconselhamento, arranjos, entrega). Grandes quantidades para comerciantes é trabalho do grossista.","ንእሽተይ ሽያጥ ኣቕሑት ይገዝእን ብዙሕ ግዜ ብዘይ ለውጢ ንተጠቀምቲ ይሸይጦምን። ሕጉስ ዝርዝር ኣቕሑት የዳሉን ኣገልግሎት (ምኽሪ፣ ለውጢ ክዳን፣ ምብጻሕ) የቕርብን። ብዙሕ ኣቕሑት ንነጋዶ ምሽያጥ ግን ስራሕ ብዝሒ ሽያጥ እዩ።","Розничная торговля закупает товары и продаёт их потребителям, как правило, без изменений. Она формирует подходящий ассортимент и предлагает услуги (консультация, подгонка одежды, доставка). Крупные партии для торговцев — это дело оптовой торговли.","Роздрібна торгівля закуповує товари й здебільшого продає їх споживачам без змін. Вона формує відповідний асортимент і пропонує послуги (консультація, підгонка одягу, доставка). Великі партії для торговців — справа оптової торгівлі."],"Die Handelskette":["سلسلة التجارة","Ticaret zinciri","Chuỗi thương mại","La cadena comercial","A cadeia comercial","ሰንሰለት ንግዲ","Торговая цепочка","Торговельний ланцюг"],"Die Jeansfabrik eröffnet einen eigenen Onlineshop und verkauft direkt an dich. Welche Stufen der Handelskette fallen weg?":["يفتح مصنع الجينز متجراً إلكترونياً خاصاً به ويبيع لك مباشرة. أي مراحل من سلسلة التجارة تسقط؟","Kot fabrikası kendi online mağazasını açıyor ve doğrudan sana satıyor. Ticaret zincirinin hangi basamakları devreden çıkar?","Nhà máy jean mở cửa hàng trực tuyến riêng và bán thẳng cho bạn. Những khâu nào của chuỗi thương mại bị bỏ qua?","La fábrica de vaqueros abre su propia tienda online y te vende directamente a ti. ¿Qué etapas de la cadena comercial desaparecen?","A fábrica de calças de ganga abre a sua própria loja online e vende diretamente a si. Que etapas da cadeia comercial desaparecem?","እቲ ፋብሪካ ጂንስ ናቱ ባዕሉ መስመር ኦንላይን ድኳን ከፊቱ ብቀጥታ ንዓኻ ይሽይጥ። ኣየኖት ደረጃታት ሰንሰለት ንግዲ ይጠፍኡ?","Джинсовая фабрика открывает собственный интернет-магазин и продаёт напрямую вам. Какие ступени торговой цепочки отпадают?","Джинсова фабрика відкриває власний інтернет-магазин і продає напряму вам. Які ланки торговельного ланцюга відпадають?"],"Die Weltreise der Jeans":["رحلة الجينز حول العالم","Kot pantolonun dünya turu","Chuyến du hành vòng quanh thế giới của chiếc quần jean","El viaje del vaquero alrededor del mundo","A viagem das calças de ganga à volta do mundo","ዓለማዊ ጉዕዞ ጂንስ","Кругосветное путешествие джинсов","Навколосвітня подорож джинсів"],"Dienstleistung":["خدمة","Hizmet","Dịch vụ","Servicio","Serviço","ኣገልግሎት","Услуга","Послуга"],"Diese Datei läuft gerade lokal. Für den QR-Code die Datei auf GitHub Pages hochladen – oder den Ein-Gerät-Modus nutzen.":["هذا الملف يعمل محلياً الآن. لاستخدام رمز QR ارفع الملف إلى GitHub Pages – أو استخدم وضع الجهاز الواحد.","Bu dosya şu anda yerel çalışıyor. QR kodu için dosyayı GitHub Pages’e yükleyin – ya da tek cihaz modunu kullanın.","Tệp này đang chạy cục bộ. Để dùng mã QR, hãy tải tệp lên GitHub Pages – hoặc dùng chế độ một thiết bị.","Este archivo se ejecuta ahora de forma local. Para el código QR, sube el archivo a GitHub Pages o usa el modo de un solo dispositivo.","Este ficheiro está a funcionar localmente. Para o código QR, carregue o ficheiro no GitHub Pages – ou use o modo de um só dispositivo.","እዚ ፋይል ሕጂ ብውሽጣዊ ይሰርሕ ኣሎ። ንQR ኮድ ፋይሉ ናብ GitHub Pages ኣእትዉ – ወይ ሞድ ሓደ መሳርሒ ተጠቐሙ።","Этот файл сейчас работает локально. Для QR-кода загрузите файл на GitHub Pages — или используйте режим одного устройства.","Цей файл зараз працює локально. Для QR-коду завантажте файл на GitHub Pages — або скористайтеся режимом одного пристрою."],"ETIKETT · INNENSEITE":["ملصق · الداخل","ETİKET · İÇ TARAF","NHÃN · MẶT TRONG","ETIQUETA · INTERIOR","ETIQUETA · INTERIOR","ሌብል · ውሽጢ","ЭТИКЕТКА · ВНУТРЕННЯЯ СТОРОНА","ЕТИКЕТКА · ВНУТРІШНІЙ БІК"],"Ein-Gerät-Modus":["وضع الجهاز الواحد","Tek cihaz modu","Chế độ một thiết bị","Modo de un solo dispositivo","Modo de um só dispositivo","ሞድ ሓደ መሳርሒ","Режим одного устройства","Режим одного пристрою"],"Ein-Gerät-Modus: Antwort eintippen (jede Eingabe zählt als eine Person)":["وضع الجهاز الواحد: اكتب الإجابة (كل إدخال يُحسب شخصاً واحداً)","Tek cihaz modu: Cevabı yaz (her giriş bir kişi sayılır)","Chế độ một thiết bị: gõ câu trả lời (mỗi lần nhập tính là một người)","Modo de un solo dispositivo: escribe la respuesta (cada entrada cuenta como una persona)","Modo de um só dispositivo: escreva a resposta (cada entrada conta como uma pessoa)","ሞድ ሓደ መሳርሒ፦ መልሲ ጽሓፍ (ነፍሲ ወከፍ ምእታው ከም ሓደ ሰብ ይቑጸር)","Режим одного устройства: введите ответ (каждый ввод считается одним человеком)","Режим одного пристрою: введіть відповідь (кожне введення рахується як одна людина)"],"Eine Jeans aus dem Regal von Nordstadt-Kauf hat schon eine lange Reise hinter sich. Ihr verfolgt ihren Weg – vom Baumwollfeld bis in euren Kleiderschrank.":["جينز من رفّ نوردشتات-كاوف قطع بالفعل رحلة طويلة. ستتبعون طريقه – من حقل القطن إلى خزانة ملابسكم.","Nordstadt-Kauf’taki raftan bir kot pantolon çoktan uzun bir yolculuk yaptı. Siz onun yolunu izleyeceksiniz – pamuk tarlasından kendi gardırobunuza kadar.","Một chiếc quần jean trên kệ của Nordstadt-Kauf đã trải qua một chuyến đi dài. Các bạn sẽ theo dõi hành trình của nó – từ cánh đồng bông đến tủ quần áo của chính các bạn.","Un vaquero del estante de Nordstadt-Kauf ya ha hecho un largo viaje. Vais a seguir su camino: del campo de algodón a vuestro armario.","Uma calça de ganga da prateleira da Nordstadt-Kauf já fez uma longa viagem. Vão acompanhar o seu caminho – do campo de algodão ao vosso guarda-roupa.","ሓንቲ ጂንስ ካብ ጠረጴዛ Nordstadt-Kauf ነዊሕ ጉዕዞ ኣካይዳ ኣላ። ንመገዳ ክትኸተልዋ ኢኹም – ካብ ሜዳ ጥጥ ክሳብ ናብ ሳጹን ክዳንኩም።","Джинсы с полки Nordstadt-Kauf уже проделали долгий путь. Вы проследите их маршрут — от хлопкового поля до вашего шкафа.","Джинси з полиці Nordstadt-Kauf уже пройшли довгий шлях. Ви простежите їхній маршрут — від бавовняного поля до вашої шафи."],"Eine Jeans reist oft bis zu # Kilometer – mehr als einmal um die Erde. Viele Betriebe in vielen Ländern sind beteiligt, bis die Ware beim Einzelhandel ankommt.":["تسافر الجينز غالباً حتى # كيلومتر – أكثر من مرة حول الأرض. تشارك مؤسسات كثيرة في بلدان عديدة حتى تصل البضاعة إلى تجارة التجزئة.","Bir kot pantolon çoğu zaman # kilometreye kadar yol yapar – dünyanın çevresinden fazla. Mal perakendeciye ulaşana kadar birçok ülkede birçok işletme rol oynar.","Một chiếc quần jean thường đi tới # km – hơn một vòng quanh Trái Đất. Nhiều doanh nghiệp ở nhiều nước tham gia cho đến khi hàng đến tay nhà bán lẻ.","Un vaquero suele recorrer hasta # kilómetros, más que una vuelta a la Tierra. Participan muchas empresas de muchos países hasta que la mercancía llega al comercio minorista.","Uma calça de ganga percorre muitas vezes até # quilómetros – mais do que uma volta à Terra. Participam muitas empresas de muitos países até a mercadoria chegar ao retalho.","ሓንቲ ጂንስ ብዙሕ ግዜ ክሳብ # ኪሎሜተር ትጓዓዝ – ልዕሊ ሓንቲ ግዜ ዙርያ ዓለም። ኣቕሑት ናብ ንእሽተይ ሽያጥ ክሳብ ዝበጽሕ ብዙሓት ትካላት ኣብ ብዙሓት ሃገራት ይሳተፉ።","Джинсы часто проезжают до # километров — больше, чем один раз вокруг Земли. Пока товар доберётся до розничной торговли, участвуют многие предприятия из многих стран.","Джинси часто долають до # кілометрів — більше, ніж одне коло навколо Землі. Поки товар дістанеться роздрібної торгівлі, беруть участь багато підприємств із багатьох країн."],"Ergebnis":["النتيجة","Sonuç","Kết quả","Resultado","Resultado","ውጽኢት","Результат","Результат"],"Ergebnis senden":["إرسال النتيجة","Sonucu gönder","Gửi kết quả","Enviar resultado","Enviar resultado","ውጽኢት ሰደድ","Отправить результат","Надіслати результат"],"Ergebnis verdecken":["إخفاء النتيجة","Sonucu gizle","Ẩn kết quả","Ocultar re   function hasOwnTrl(el){for(var c=el.firstChild;c;c=c.nextSibling){if(c.nodeType===1&&c.className==="trl")return true;}return false;}
  function textOf(el){
    var o="";
    (function rec(n){
      for(var c=n.firstChild;c;c=c.nextSibling){
        if(c.nodeType===3) o+=c.nodeValue;
        else if(c.nodeType===1){ if(c.tagName==="BR") o+=" "; else if(!(c.className==="trl"||c.hasAttribute("data-trl")||SKIP[c.tagName])) rec(c); }
      }
    })(el);
    return o;
  }
  function walk(el){
    if(el.nodeType!==1) return;
    if(SKIP[el.tagName]||SKIP[el.nodeName]) return;
    if(el.id==="trbtn"||el.id==="trpanel") return;
    if(el.className==="trl"||el.hasAttribute("data-trl")||el.hasAttribute("data-notr")) return;
    if(el.hasAttribute("data-trd")){ if(hasOwnTrl(el)) return; el.removeAttribute("data-trd"); }
    if(el.placeholder){var pk=tr(norm(el.placeholder)); if(pk) el.title=pk;}
    var key=norm(textOf(el));
    if(key.length>=2 && key.length<=800){
      var t=tr(key);
      if(t && BLOCKY[el.tagName]){ el.setAttribute("data-trd","1"); el.appendChild(mk(t)); return; }
    }
    var kids=Array.prototype.slice.call(el.childNodes);
    var hasEl=kids.some(function(k){return k.nodeType===1;});
    for(var i=0;i<kids.length;i++){
      var k=kids[i];
      if(k.nodeType===1) walk(k);
      else if(k.nodeType===3 && hasEl){
        var tk=norm(k.nodeValue); if(tk.length<2) continue;
        var tt=tr(tk);
        if(tt){
          var w=document.createElement("span"); w.setAttribute("data-trd","1");
          k.parentNode.insertBefore(w,k); w.appendChild(k); w.appendChild(mk(tt));
        }
      }
    }
  }
  function clearAll(){
    document.querySelectorAll(".trl").forEach(function(n){n.remove();});
    document.querySelectorAll("[data-trd]").forEach(function(n){n.removeAttribute("data-trd");n.classList.remove("tr-open");});
  }
  var queued=false, pend=new Set();
  function flush(){
    queued=false; if(idx<0){pend.clear();return;}
    obs.disconnect();
    pend.forEach(function(n){ if(n.isConnected) walk(n); });
    pend.clear();
    obs.observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  function enqueue(n){pend.add(n); if(!queued){queued=true;requestAnimationFrame(flush);}}
  var obs=new MutationObserver(function(ms){
    if(idx<0) return;
    for(var i=0;i<ms.length;i++){
      var m=ms[i];
      if(m.type==="characterData"){ var p=m.target.parentElement; if(p&&!p.hasAttribute("data-trl")&&!(p.closest&&p.closest("#trpanel"))) enqueue(p.closest("[data-trd]")||p); continue; }
      var t=m.target; if(t.nodeType!==1) continue;
      if(t.id==="trpanel"||t.id==="trbtn"||(t.closest&&t.closest("#trpanel"))) continue;
      var real=false;
      for(var j=0;j<m.addedNodes.length;j++){var a=m.addedNodes[j]; if(a.nodeType===1&&(a.className==="trl"||a.id==="trbtn"||a.id==="trpanel")) continue; real=true;}
      if(real) enqueue(t.hasAttribute("data-trd")?t.parentElement||t:t);
    }
  });
  var css=document.createElement("style");
  css.textContent=
   ".trl{display:block;font-family:system-ui,'Noto Sans','Noto Sans Arabic','Noto Sans Ethiopic','Nyala','Kefa','Geeza Pro',sans-serif;font-size:clamp(11px,.8em,17px);font-weight:400;font-style:normal;line-height:1.4;color:#7a3d00;background:#FFF4E5;border-left:3px solid #E9A659;border-radius:3px;padding:1px 6px;margin:2px 0;text-align:left;text-transform:none;letter-spacing:0;white-space:normal;text-decoration:none;cursor:default}"+
   ".trl[dir=rtl]{text-align:right;border-left:0;border-right:3px solid #E9A659}"+
   "body.tr-tap [data-trd]>.trl{display:none}"+
   "body.tr-tap [data-trd].tr-open>.trl{display:block}"+
   "body.tr-tap [data-trd]{text-decoration:underline dotted rgba(31,78,121,.55);text-underline-offset:3px}"+
   "#trbtn{position:fixed;left:10px;bottom:10px;z-index:99998;height:44px;min-width:44px;padding:0 14px;border-radius:22px;border:2px solid #1F4E79;background:#fff;color:#1F4E79;font:600 16px system-ui,sans-serif;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}"+
   "#trbtn.on{background:#1F4E79;color:#fff}"+
   "#trbtn.hint{animation:trpulse 1.6s ease-in-out infinite}"+
   "@keyframes trpulse{0%,100%{box-shadow:0 0 0 0 rgba(31,78,121,.55)}50%{box-shadow:0 0 0 10px rgba(31,78,121,0)}}"+
   "#trpanel{position:fixed;left:10px;bottom:64px;z-index:99999;background:#fff;color:#1a2430;border:1px solid #9DC3E6;border-radius:12px;padding:10px;box-shadow:0 6px 24px rgba(0,0,0,.35);display:none;font-family:system-ui,'Noto Sans Arabic','Noto Sans Ethiopic','Nyala',sans-serif;width:min(300px,calc(100vw - 20px));max-height:80vh;overflow:auto}"+
   "#trpanel b{display:block;font-size:13px;margin:4px 0 6px;color:#1F4E79}"+
   "#trpanel button{display:block;width:100%;text-align:left;font:inherit;font-size:16px;border:1px solid #1F4E79;background:#fff;color:#1F4E79;border-radius:8px;padding:8px 12px;margin:4px 0;cursor:pointer;min-height:42px}"+
   "#trpanel button[dir=rtl]{text-align:right}"+
   "#trpanel button.sel{background:#1F4E79;color:#fff}"+
   "#trpanel button em{font-style:normal;opacity:.7;font-size:12px;margin-inline-end:8px;font-weight:700}"+
   "#trpanel hr{border:0;border-top:1px solid #d6e4f0;margin:8px 0}"+
   "@media print{#trbtn,#trpanel,.trl{display:none!important}}";
  document.head.appendChild(css);
  var btn=document.createElement("button"); btn.id="trbtn"; btn.type="button"; btn.setAttribute("aria-label","Sprache / Language");
  var panel=document.createElement("div"); panel.id="trpanel";
  function ui(){ var c=idx>=0?LG[idx][0]:""; return UIX[c]||null; }
  function drawPanel(){
    var h="<b>🌐 Sprache wählen</b>";
    LG.forEach(function(L,i){h+='<button type="button" data-i="'+i+'"'+(L[3]==="rtl"?' dir="rtl"':'')+' class="'+(idx===i?"sel":"")+'"><em>'+L[2]+'</em>'+L[1]+(L[4]?' <small>'+L[4]+'</small>':'')+'</button>';});
    if(idx>=0){
      var u=ui()||{}, L2=LG[idx], rtl=L2[3]==="rtl"?' dir="rtl"':'';
      h+='<hr><button type="button" data-m="under"'+rtl+' class="'+(mode==="under"?"sel":"")+'">'+(u.u||"")+'</button>';
      h+='<button type="button" data-m="tap"'+rtl+' class="'+(mode==="tap"?"sel":"")+'">'+(u.p||"")+'</button>';
    }
    h+='<button type="button" data-i="-1" class="'+(idx<0?"sel":"")+'">✕ Nur Deutsch'+(idx>=0&&ui()?' · '+ui().o:'')+'</button>';
    panel.innerHTML=h;
    btn.className=(idx>=0?"on":"")+(idx<0&&!seen?" hint":"");
    btn.textContent=idx>=0?"🌐 "+LG[idx][2]:"🌐";
  }
  var seen=false; try{ seen=!!localStorage.getItem(KL)||localStorage.getItem("kla_trseen")==="1"; }catch(e){}
  function apply(){
    obs.disconnect(); clearAll();
    document.body.classList.toggle("tr-tap",mode==="tap");
    document.documentElement.setAttribute("data-trlang",idx>=0?LG[idx][0]:"");
    drawPanel();
    if(idx>=0) walk(document.body);
    obs.observe(document.body,{childList:true,subtree:true,characterData:true});
  }
  panel.addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    if(b.hasAttribute("data-m")){ mode=b.getAttribute("data-m"); try{localStorage.setItem(KM,mode);}catch(x){} apply(); return; }
    idx=+b.getAttribute("data-i"); seen=true;
    try{ localStorage.setItem(KL,idx>=0?LG[idx][0]:""); localStorage.setItem("kla_trseen","1"); }catch(x){}
    apply(); panel.style.display="none";
  });
  btn.addEventListener("click",function(e){e.stopPropagation(); panel.style.display=panel.style.display==="block"?"none":"block";});
  document.addEventListener("click",function(e){
    if(!e.target.closest("#trpanel")&&e.target.id!=="trbtn") panel.style.display="none";
    if(mode==="tap"&&idx>=0){ var d=e.target.closest&&e.target.closest("[data-trd]"); if(d&&!e.target.closest(".trl")) d.classList.toggle("tr-open"); }
  },true);
  function init(){
    document.body.appendChild(btn); document.body.appendChild(panel); apply();
  }
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",function(){setTimeout(init,50);}); else setTimeout(init,50);
  window.KLA_TR={set:function(c){idx=langIdx(c);apply();},get lang(){return idx>=0?LG[idx][0]:"";}};
})();
</script>
